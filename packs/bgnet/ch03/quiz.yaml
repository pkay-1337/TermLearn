  - 'the seven-layer ISO model: Application, Presentation, Session, Transport, Network, Data Link, Physical'
  - 'the three-layer model: Application, Transport, and Physical, with no other layers named at all'
  answer: 1
  why: 'The full-blown model is the seven-layer list: Application, Presentation, Session, Transport, Network,
