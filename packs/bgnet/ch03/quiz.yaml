- kind: order
  level: core
  q: 'Order all 4 displayed lines from first strip to final data:'
  lines:
  - the tftp program strips the TFTP header
  - the hardware strips the Ethernet header
  - the kernel strips the IP and UDP headers
  - the application finally holds the bare file data
  answer_order:
  - 1
  - 2
  - 0
  - 3
  distractor_why:
    the tftp program strips the TFTP header: Stripping the innermost header first reverses the unwrap
      order — outer wrappers must come off before the application sees anything.
    the application finally holds the bare file data: Taking the bare data first is the result, not a
      step — placing it mid-sequence confuses the goal with the work.
  why: 'The sequencing principle is reverse unwrapping: whoever owns the outermost wrapper removes it
    first (hardware, then kernel, then application), and the bare data is what REMAINS, not a stripping
    step. (Ch.2)'
  concept: strip-order
- kind: choose-better
  level: advanced
  q: One datagram program calls connect() once and then uses plain send() for every packet. Another calls
    sendto() with the destination on every packet. Both send to the same peer. Which design better matches
    the chapter's picture of datagram sockets?
  choices:
  - the sendto() design — every packet carries its own destination, with no connection
  - the connect() design, because datagram sockets cannot send without a maintained connection
  - 'both are impossible: datagram sockets accept only recv() calls, never sendto()'
  answer: 0
  why: The chapter's picture of connectionless traffic is build-packet-address-send — sendto() with per-packet
    destination — and it notes datagrams CAN be connect()'d if you really want, but that is the optional
    path, not the model. 'Cannot send without a connection' contradicts 'connectionless'. 'Only recv()'
    is invented. (Ch.2)
  concept: connectionless
- kind: mcq
  level: core
  q: What reasons does the chapter give for choosing an unreliable underlying protocol?
  choices:
  - compatibility with X.25 hardware and its addressing scheme
  - UDP's larger packets mean fewer sends are needed overall on the wire
  - UDP packets are larger, so fewer packets are required overall
  - speed and speed — fire-and-forget beats tracking every packet
  answer: 3
  why: 'The chapter''s answer is deliberately doubled: ''Two reasons: speed and speed.'' Fire-and-forget
    is way faster than keeping track of what arrived safely and in order. X.25 compatibility and packet
    size are invented — and ''larger packets'' would be an argument FOR fewer, slower sends, not the stated
