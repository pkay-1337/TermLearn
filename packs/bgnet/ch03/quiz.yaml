  level: intro
  q: What does the chapter say about raw sockets?
  choices:
  - they are deprecated and must never be opened by any ordinary program
  - they are very powerful, so the guide sets them aside for now
  - they are the default socket type returned by socket()
  answer: 1
  why: 'The chapter''s confession: there are more socket types than two, raw sockets are ''very powerful
