    choices:
    - both TCP and UDP use 16-bit port numbers to identify services
    - only TCP uses port numbers; UDP addresses services by IP alone
    - only UDP uses port numbers; TCP uses the connection handle instead
    answer: 0
    why: The port is used by TCP and, coincidentally, by UDP as well; both are transport protocols that
      demultiplex services. Restricting ports to one transport contradicts that shared use. Using the
      connection handle instead of a port confuses a descriptor in your process with the addressing field
      on the wire. (b6)
