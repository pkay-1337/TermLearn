blocks:
- id: b1
  type: model
  title: Size the Address Space Before Choosing a Version
  explain_md: |
    An **IPv4 address is four bytes** — four *octets* — and people write
    those bytes in "dots and numbers" form, such as `192.0.2.111`. Four
    bytes means 32 bits, so the entire IPv4 space holds only `2^32` distinct
    values: about 4.3 billion addresses. That sounds enormous until you
    remember every computer, phone, meter, and server wants one — and that
    early organizations were handed millions of addresses each.

    ### The Notional Machine: one integer wearing a readable costume

    Inside the machine an IPv4 address is just a 32-bit integer. The dotted
    form is a *presentation* convention: split the 32 bits into four groups
    of 8 and print each group in decimal, separated by dots. `192.0.2.111`
    is therefore not a string the kernel routes on; it is shorthand for the
    byte sequence `c0 00 02 6f`. Later blocks will convert between the text
    costume and the binary value; for now, hold both pictures at once.

    ### Why a new version was needed

    IPv4 ran out because demand grew explosively *and* because huge blocks
    were allocated early, when a billion looked impossible to exhaust.
    Stopgap measures delayed the inevitable. IPv6 widens the address from
    32 bits to **128 bits**. That is only 96 more bits, but powers grow
    brutally: `2^128` is about 340 trillion trillion trillion addresses,
    roughly 79 million billion trillion times the IPv4 space. The point is not the exact decimal — it is that address *width* changes the
    possible population by an astronomical factor.

    Keep these two lenses separate: **representation** (how we write an
    address) and **capacity** (how many distinct addresses exist). Mixing
    them up is the classic beginner error.
  example:
    lang: c
    code: |
      #include <stdio.h>

      int main(void)
      {
          unsigned char ipv4[4] = {192, 0, 2, 111};  /* four octets = 32 bits */

          printf("%u.%u.%u.%u\n",
                 (unsigned)ipv4[0], (unsigned)ipv4[1],
                 (unsigned)ipv4[2], (unsigned)ipv4[3]);
          printf("IPv4 space: %llu addresses\n",
                 (unsigned long long)1 << 32);
          return 0;
      }
    run_expected: |
      192.0.2.111
      IPv4 space: 4294967296 addresses
    explain_md: |
      The array holds exactly four bytes, one per dotted number. The loop-free
      `printf` inserts the dots as presentation only — the machine stores four
      integers. The shift computes `2^32`, the total number of distinct
      32-bit values (about 4.3 billion).
    subgoals:
    - label: Store Four Octets
      lines:
      - 5
    - label: Render the Dotted Costume
      lines:
      - 7
      - 8
      - 9
    - label: Compute the Address Capacity
      lines:
      - 10
      - 11
  viz:
    kind: ascii-memory
    steps:
    - ipv4[0]=192 (0xc0), ipv4[1]=0 (0x00), ipv4[2]=2 (0x02), ipv4[3]=111 (0x6f)
    - the 32-bit value is 0xc000026f; the dotted text is a rendering choice, not a stored string
    - 'capacity: 2^32 = 4,294,967,296 distinct 32-bit patterns — the whole IPv4 space'
  checks:
  - kind: mcq
    q: An IPv4 address written as 192.0.2.111 is built from how many bytes?
    choices:
    - two bytes, one per hexadecimal digit
    - sixteen bytes, one per IPv6 group
    - four bytes, one per dotted number
    answer: 2
    why: IPv4 is four octets — four bytes — which is why it has 32 bits and about 4.3 billion possible
      values. 'Two bytes' confuses a shorter integer width with an IPv4 address. 'Sixteen bytes' is the
      size of an IPv6 address and traps the v4/v6 mix-up. (b1)
    concept: ipv4-width
  - kind: predict
    q: Trace the loop line by line, tracking i and the array index. What exact output does this program
      print?
    code: |
      unsigned char ip[4] = {10, 12, 110, 57};
      for (int i = 0; i < 4; i++)
          printf("%u%s", (unsigned)ip[i], i == 3 ? "\n" : ".");
    choices:
    - 10.12.110.57 followed by a newline
    - 57.110.12.10 followed by a newline
    - 101211057 followed by a newline
    - 10.12.110.57 with no newline
    answer: 0
    why: The loop visits indexes 0, 1, 2, 3 in order and prints a dot until i reaches 3, when it prints
      a newline instead. 'Reversed order' traps assuming little-endian byte order affects array indexing;
      the array is indexed by position, not by numeric significance. 'No newline' misreads the i == 3
      branch. (b1)
    concept: dotted-quad-render
  - kind: fillblank
    q: IPv6 widens the address from 32 bits to how many bits? Fill the missing number.
    code: |
      /* IPv4 uses 32 bits; IPv6 uses ____ bits. */
      #define IPV6_BITS ____
    answer_text: '128'
    why: 32-bit IPv4 contrasts with 128-bit IPv6. The extra 96 bits are not a small increment in capacity
      — they multiply the address space by roughly 79 million billion trillion. '64' traps assuming a
      simple doubling; '256' traps confusing bit count with byte count. (b1)
    concept: ipv6-width
  - kind: eipe
    q: In one sentence, what is this comparison FOR?
    code: |
      IPv4: 2^32  ~= 4 billion addresses
      IPv6: 2^128 ~= 340 trillion trillion trillion addresses
    choices:
    - it shows that IPv4 and IPv6 can each address the same four billion machines
    - it shows that widening 32 bits to 128 multiplies the possible population enormously
    - it shows that IPv6 addresses are stored as decimal strings of 340 trillion characters
    answer: 1
    why: 'The purpose is capacity: bit width controls how many distinct addresses exist, and exponentiation
      makes 128 bits unimaginably larger. ''Decimal strings'' confuses address capacity with textual length.
      ''Same four billion machines'' denies the entire reason IPv6 was created. (b1)'
    concept: address-capacity
  - kind: mcq
    q: Which pair of factors best explains why the IPv4 address space ran out?
    choices:
    - IPv4 addresses are only four bits wide and therefore cannot be routed
    - explosive device growth plus huge early blocks given to large organizations
    - the dotted-decimal notation cannot represent more than one million hosts
    - NAT was forbidden by the original protocol, so no address could be reused
    answer: 1
    why: 'Two pressures combine: demand grew to every person and device, while early allocations handed
      millions of addresses to a handful of organizations. ''Four bits wide'' confuses octets with bits.
      ''Notation limit'' confuses presentation with capacity. ''NAT forbidden'' invents a rule; NAT is
      a stopgap discussed later. (b1)'
    concept: ipv4-exhaustion
  - kind: mcq
    q: Which statement about the IPv6 address space is correct?
    choices:
    - it holds exactly one billion times as many addresses as the IPv4 space
    - it is only 96 more addresses than IPv4, because 128 minus 32 equals 96
    - it holds about 340 trillion trillion trillion addresses, far more than IPv4
    answer: 2
    why: 128 bits represents about 340 trillion trillion trillion values, and that is roughly 79 million
      billion trillion times larger. 'Only 96 more addresses' treats the exponent difference as a subtraction
      of counts — the classic powers-versus-difference error. 'Exactly one billion times' understates
      the ratio by an enormous margin. (b1)
    concept: ipv6-capacity
  - kind: eipe
    q: What is this dotted-quad printing FOR?
    code: |
      unsigned char a[4] = {192, 0, 2, 111};
      printf("%u.%u.%u.%u\n", a[0], a[1], a[2], a[3]);
    choices:
    - converting an IPv6 address into an IPv4 address
    - printing the four address bytes in dotted-quad form
    - masking an address down to its network number
    answer: 1
    why: The array already holds four byte values; printf merely interleaves dots so a human can read
      them as 192.0.2.111. No IPv6 parsing happens, and no mask is applied. The machine still stores four
      separate integers, not a string. (b1)
    concept: dotted-quad-purpose
  - kind: why-fails
    q: Why is the claim 'IPv6 is only 96 more addresses than IPv4, because 128 minus 32 is 96' wrong?
    choices:
    - the address width is an exponent, so 32 to 128 multiplies the count rather than adding 96
    - IPv6 addresses are 96 bytes long, not merely 96 bits longer than IPv4 addresses
    - IPv6 recycles the same addresses as IPv4, so neither address count actually matters
    answer: 0
    why: Capacity is 2^width, so the jump from 2^32 to 2^128 is multiplicative, not additive. The '96
      bytes' claim confuses bits with bytes and gets the width wrong. 'Recycles addresses' invents a sharing
      scheme; the two spaces are separate. (b1)
    concept: capacity-exponent-not-difference
- id: b2
  type: syntax
  title: Write and Compress IPv6 Addresses Without Losing a Byte
  explain_md: |
    IPv6 abandons dots-and-numbers. It writes an address as **eight
    two-byte chunks in hexadecimal, separated by colons**:

    `2001:0db8:c9d2:aee5:73e3:934a:a5ae:9551`

    Each chunk is 16 bits, so eight chunks are 128 bits. Two simplifications
    make addresses readable:

    1. **Drop leading zeros inside a chunk.** `0db8` becomes `db8`, `0051`
       becomes `51`.
    2. **Compress a run of zero chunks with `::`.** The run must be replaced
       by exactly one double-colon marker in the written form. The examples make this concrete:
       `2001:0db8:c9d2:0012:0000:0000:0000:0051` becomes
       `2001:db8:c9d2:12::51`.

    ### Two special addresses you will meet immediately

    - `::1` is the **IPv6 loopback** — "this machine I am running on now."
      Its IPv4 counterpart is `127.0.0.1`.
    - `::ffff:192.0.2.33` is an **IPv4-compatible/mapped** spelling: the
      final 32 bits are shown in the familiar dotted form so an IPv4 address
      can be carried inside an IPv6-shaped value.

    ### The Notional Machine: text is not storage

    The kernel never stores the colons or the letters. It stores 16 bytes.
    The compressed text is a lossless human encoding of those bytes: the
    `::` tells a parser "fill the skipped chunks with zeroes," and leading
    zeros are padding. That is why several different-looking strings can
    name the same 16-byte value — equivalence is about the bytes, not the
    spelling.

    When you read `::1`, expand it in your head to fifteen zero bytes plus
    `01`. When you read `::ffff:192.0.2.33`, expand the tail to the four
    IPv4 octets. This mental expansion is the skill this block trains.
  example:
    lang: c
    code: |
      #include <stdio.h>

      int main(void)
      {
          const char *full   = "2001:0db8:c9d2:0012:0000:0000:0000:0051";
          const char *shortv = "2001:db8:c9d2:12::51";
          const char *loop   = "::1";
          const char *mapped = "::ffff:192.0.2.33";

          printf("full:   %s\n", full);
          printf("short:  %s\n", shortv);
          printf("loop:   %s\n", loop);
          printf("mapped: %s\n", mapped);
          return 0;
      }
    run_expected: |
      full:   2001:0db8:c9d2:0012:0000:0000:0000:0051
      short:  2001:db8:c9d2:12::51
      loop:   ::1
      mapped: ::ffff:192.0.2.33
    explain_md: |
      Both strings describe the same bytes: the first writes every chunk and
      every padding zero, the second drops leading zeros and collapses the
      zero run to `::`. `::1` expands to fifteen zero bytes plus one, and the
      mapped form embeds an IPv4 address in the last 32 bits. The program only
      prints text; the conversion to binary happens with `inet_pton` later.
    subgoals:
    - label: Show the Uncompressed Spelling
      lines:
      - 5
      - 8
    - label: Show the Compressed Spelling
      lines:
      - 6
      - 9
    - label: Show Loopback and Mapped Forms
      lines:
      - 7
      - 10
      - 11
  viz:
    kind: ascii-memory
    steps:
    - expand ::1 -> 0000:0000:0000:0000:0000:0000:0000:0001 (fifteen zero bytes, then 01)
    - expand 2001:db8:c9d2:12::51 -> 2001:0db8:c9d2:0012:0000:0000:0000:0051
    - expand ::ffff:192.0.2.33 -> the IPv4 tail is 192.0.2.33 in the final 32 bits
  checks:
  - kind: mcq
    q: Which spelling is equivalent to 2001:0db8:c9d2:0012:0000:0000:0000:0051?
    choices:
    - 2001:db8:c9d2::12:51 (too many zero groups removed)
    - 2001.0db8.c9d2.12.0.0.0.51 (dots instead of colons)
    - 2001:db8:c9d2:12::51 (one zero run compressed)
    - 2001:db8:c9d2:12:0:0:0:0:51 (zero run not compressed)
    answer: 2
    why: Dropping leading zeros gives 2001:db8:c9d2:12, and the four zero chunks between 12 and 51 collapse
      to one `::`, yielding 2001:db8:c9d2:12::51. The option with nine colon-separated groups has too
      many groups — `::` already stands for the zero run, so writing the zeros again duplicates chunks.
      The option that moves `12` after the `::` changes which chunks are zero. The dotted option uses
      IPv4 punctuation for an IPv6 value. (b2)
    concept: ipv6-canonical-compression
  - kind: fillblank
    q: Compress the address 2001:0db8:ab00:0000:0000:0000:0000:0000 by filling the single marker that
      replaces the trailing zero chunks.
    code: |
      /* The two spellings below must name the same 128-bit value. */
      const char *full  = "2001:0db8:ab00:0000:0000:0000:0000:0000";
      const char *short = "2001:db8:ab00____";
    answer_text: '::'
    why: The four trailing all-zero chunks collapse into one `::` marker, and leading zeros inside `0db8`
      drop to `db8`. A single colon would leave an empty chunk rather than a zero-run marker. Writing
      `:0:0:` would be valid but is not the compression the task asks for. (b2)
    concept: ipv6-zero-run-fill
  - kind: mcq
    q: Which address is the IPv6 loopback, meaning 'this machine I am running on now'?
    choices:
    - ::ffff:127.0.0.1 is the IPv4-mapped IPv6 spelling for a host
    - 2001:db8::1 is an ordinary documentation-range IPv6 address
    - 127.0.0.1 is the native IPv4 loopback address for the local machine
    - ::1 is the native IPv6 loopback address for the local machine
    answer: 3
    why: '`::1` is the IPv6 loopback; it is paired with IPv4''s `127.0.0.1`. Choosing 127.0.0.1 traps
      carrying the IPv4 answer into an IPv6 question. `::ffff:127.0.0.1` is a mapped spelling, not the
      native IPv6 loopback. `2001:db8::1` is an ordinary address in the documentation prefix, not loopback.
      (b2)'
    concept: ipv6-loopback
  - kind: fillblank
    q: Complete the IPv4-mapped spelling of 192.0.2.33 by filling the prefix.
    code: |
      const char *mapped = "____________192.0.2.33";
    answer_text: '::ffff:'
    why: IPv4-compatibility notation puts the IPv4 address after the `::ffff:` prefix, yielding `::ffff:192.0.2.33`.
      `::` alone would not signal the mapped form, and `ffff::` reverses where the marker sits. (b2)
    concept: ipv4-mapped
  - kind: mcq
    q: What does the `::` in an IPv6 address accomplish?
    choices:
    - it marks a compressed run of one or more all-zero 16-bit chunks
    - it introduces the port number that follows the IPv6 address
    - it means the address is really an IPv4 address in disguise
    - it separates the network prefix from the host suffix
    answer: 0
    why: '`::` is the zero-run compression marker: it stands in for consecutive chunks whose bits are
      all zero. It does not separate network from host (CIDR''s slash does that) and it does not introduce
      a port. The mapped form uses `::ffff:` plus dotted decimal, but `::` by itself is not a statement
      that the address is IPv4. (b2)'
    concept: ipv6-zero-run-marker
  - kind: eipe
    q: In one sentence, what is this pair of strings FOR?
    code: |
      const char *a = "2001:0db8:ab00:0000:0000:0000:0000:0000";
      const char *b = "2001:db8:ab00::";
    choices:
    - they show two spellings of one 128-bit value, one padded and one compressed
    - they show two different addresses that differ in how many zero chunks they hold
    - they show an IPv4 address together with the IPv6 address that replaces it
    answer: 0
    why: 'The purpose is spelling equivalence: `::` replaces the zero run and leading zeros are dropped,
      but the underlying bytes are identical. ''Two different addresses'' misses that compression is lossless.
      ''IPv4 and IPv6'' invents a version change that is not present in either string. (b2)'
    concept: ipv6-equivalence
  - kind: predict
    q: Trace the program line by line. Which line of output is produced?
    code: |
      const char *full = "0000:0000:0000:0000:0000:0000:0000:0001";
      const char *comp = "::1";
      printf("%zu %zu\n", strlen(full), strlen(comp));
    choices:
    - 32 3
    - 39 3
    - 39 34
    answer: 1
    why: 'The full string has eight four-character groups plus seven colons: 32 + 7 = 39 characters. The
      compressed string is two colons plus the digit 1, so three characters. ''34'' traps counting the
      full string without its colons or miscounting the compressed form. ''32'' traps counting only the
      hex digits. (b2)'
    concept: ipv6-text-length
  - kind: eipe
    q: What are these two IPv6 spellings FOR?
    code: |
      const char *full = "2001:0db8:c9d2:0012:0000:0000:0000:0051";
      const char *short_form = "2001:db8:c9d2:12::51";
    choices:
    - storing two different 128-bit addresses in two separate text strings
    - showing two different spellings that name the same 128-bit address
    - converting an ordinary hostname into its resolved IPv6 address
    answer: 1
    why: 'Both strings expand to the same sixteen bytes; leading-zero removal and :: compression are lossless
      presentation changes. The bytes are not different addresses, and no name resolution occurs. (b2)'
    concept: compression-equivalence-purpose
  - kind: predict
    q: Trace the program line by line. What is printed?
    code: |
      const char *s = "::1";
      printf("%zu\n", strlen(s));
    choices:
    - '3'
    - '7'
    - '1'
    answer: 0
    why: The string is two colon characters plus the digit 1, so strlen returns 3. The expanded value
      is sixteen bytes, but strlen counts textual characters, not address bytes. '7' or '1' would only
      appear if the compression were expanded or ignored. (b2)
    concept: compressed-text-length
- id: b3
  type: algorithm
  title: Extract the Network with a Netmask
  explain_md: |
    An IP address carries two ideas at once: **which network** a host lives
    on and **which host** it is on that network. For `192.0.2.12`, the first
    three bytes might be the network and the last byte the host, so the host
    is number `12` on network `192.0.2.0` — note how the host portion is
    zeroed to name the network.

    ### Netmasks: a bitwise stencil

    A **netmask** has 1-bits over the network portion and 0-bits over the
    host portion. Bitwise-AND the address with the mask and every host bit
    becomes zero, leaving the network number:

    `192.0.2.12 AND 255.255.255.0 = 192.0.2.0`

    Historically, network sizes came in classes: Class A used one byte of
    network and three of host, Class B split two-and-two, and Class C used
    three bytes of network and one of host. Classes proved too coarse, so
    modern masks may use **any** number of network bits, provided the mask is
    a run of 1-bits followed by a run of 0-bits. For example,
    `255.255.255.252` has 30 network bits and 2 host bits, which leaves four
    addresses on the network.

    ### CIDR notation: write the prefix length, not the mask

    A mask such as `255.255.255.0` is awkward to read as a bit count, so the
    slash form appends the number of network bits directly:
    `192.0.2.12/30`. For IPv6 the same idea appears as `2001:db8::/32` or
    `2001:db8:5413:4028::9db9/64`.

    ### The Notional Machine

    AND is applied independently to each of the 32 bits. There is no
    carries, no arithmetic rounding, and no borrow: bit `i` of the result is
    1 only when both bit `i` of the address and bit `i` of the mask are 1.
    That is why a mask with a 0 bit erases the corresponding address bit,
    and why a non-contiguous mask cannot describe a clean network prefix.
  example:
    lang: c
    code: |
      #include <stdio.h>

      int main(void)
      {
          unsigned char ip[4]   = {192, 0, 2, 12};
          unsigned char mask[4] = {255, 255, 255, 0};
          unsigned char net[4];

          for (int i = 0; i < 4; i++)
              net[i] = ip[i] & mask[i];

          printf("%u.%u.%u.%u\n",
                 (unsigned)net[0], (unsigned)net[1],
                 (unsigned)net[2], (unsigned)net[3]);
          return 0;
      }
    run_expected: |
      192.0.2.0
    explain_md: |
      Each byte is ANDed with the matching mask byte: `12 & 0` erases the
      host byte while `192 & 255`, `0 & 255`, and `2 & 255` pass through
      unchanged. The result names the network, not the host. The loop mirrors
      the bitwise operation one octet at a time.
    subgoals:
    - label: Hold Address and Mask
      lines:
      - 5
      - 6
    - label: Erase Host Bits with AND
      lines:
      - 7
      - 9
      - 10
    - label: Render the Network Number
      lines:
      - 12
      - 13
      - 14
  viz:
    kind: ascii-memory
    steps:
    - ip   = 192.0.2.12   (bytes 11000000 00000000 00000010 00001100)
    - mask = 255.255.255.0 (bytes 11111111 11111111 11111111 00000000)
    - net[0] = 192 & 255 = 192; net[1] = 0 & 255 = 0
    - net[2] = 2 & 255 = 2; net[3] = 12 & 0 = 0
    - result = 192.0.2.0 — the host byte is gone, the network remains
  checks:
  - kind: trace
    q: Trace the per-octet AND. What value belongs in the target cell?
    code: |
      unsigned char ip[4]   = {192, 0, 2, 12};
      unsigned char mask[4] = {255, 255, 255, 0};
      unsigned char net[4];
      for (int i = 0; i < 4; i++)
          net[i] = ip[i] & mask[i];
    trace:
      headers:
      - Step
      - Byte
      - Address Byte
      - Mask Byte
      - Result
      rows:
      - step: 1
        line: 1
        cells:
        - '1'
        - '0'
        - '192'
        - '255'
        - '192'
      - step: 2
        line: 2
        cells:
        - '2'
        - '1'
        - '0'
        - '255'
        - '0'
      - step: 3
        line: 3
        cells:
        - '3'
        - '2'
        - '2'
        - '255'
        - '2'
      - step: 4
        line: 4
        cells:
        - '4'
        - '3'
        - '12'
        - '0'
        - ???
    target:
      row: 3
      col: 4
    choices:
    - the value 12
    - the value 0
    - the value 255
    - the value 192
    answer: 1
    why: Bitwise AND with 0 always yields 0, so the host byte 12 is erased and the network ends in 0.
      '12' traps copying the address byte through as if the mask were 255. '255' traps confusing the mask's
      own bits with the result. '192' borrows the first byte's result. (b3)
    concept: netmask-and
  - kind: predict
    q: Trace the /30 mask byte by byte. What network address does 192.0.2.12/30 produce?
    code: |
      /* /30 -> 255.255.255.252, so only the last two bits survive. */
      unsigned char ip[4]   = {192, 0, 2, 12};
      unsigned char mask[4] = {255, 255, 255, 252};
    choices:
    - 192.0.2.15
    - 192.0.2.8
    - 192.0.2.12
    - 192.0.2.0
    answer: 2
    why: 12 is 00001100 and 252 is 11111100; AND keeps 00001100, which is 12, so the network is 192.0.2.12.
      '192.0.2.8' would require the last byte 8; '192.0.2.0' would need a /24-style zero mask; '192.0.2.15'
      is the top of the /30 block, not the network named by this host. (b3)
    concept: cidr-network
  - kind: fillblank
    q: Fill the IPv4 netmask that corresponds to a /26 prefix.
    code: |
      /* /26 means 26 network bits followed by 6 host bits. */
      const char *mask = "____________________";
    answer_text: 255.255.255.192
    why: 'A /26 keeps 26 leading 1-bits: the first 24 fill three 255 bytes, and the fourth byte keeps
      2 more 1-bits, giving 11000000 = 192. ''255.255.255.128'' is /25, and ''255.255.255.224'' is /27
      — each is one bit too small or too large. (b3)'
    concept: netmask-prefix
  - kind: mcq
    q: The mask 255.255.255.252 reserves how many host bits, and how many addresses does that allow?
    choices:
    - 4 host bits, allowing sixteen addresses
    - 0 host bits, allowing one address
    - 8 host bits, allowing 256 addresses
    - 2 host bits, allowing four addresses
    answer: 3
    why: '252 is 11111100, so two host bits remain and they can form four combinations: 00, 01, 10, 11.
      ''8 host bits'' would require a final mask byte of 0; ''4 host bits'' would require 240; ''0 host
      bits'' would require 255. (b3)'
    concept: host-bits
  - kind: why-fails
    q: This value is offered as a netmask. Why can it not describe a valid contiguous network prefix?
    code: |
      const char *bad_mask = "255.255.255.1";
    choices:
    - netmasks must always end in the value 255, and this particular mask ends in 1
    - it is far too small to cover even one single host anywhere on the network
    - its 1-bits are split by zeros, so the network bits do not form one prefix
    answer: 2
    why: A netmask is always a run of 1-bits followed by a run of 0-bits; 255.255.255.1 is 11111111.11111111.11111111.00000001,
      which interleaves a 1 after the zero run. 'Too small' confuses mask width with address count. 'Must
      end in 255' invents a rule; masks such as 255.255.255.252 end in 252. (b3)
    concept: netmask-contiguity
  - kind: order
    q: Order the 6 correct lines so the program computes and prints the network for 192.0.2.12/24; one
      line is a distractor.
    lines:
    - printf("%u.%u.%u.%u\n", (unsigned)net[0], (unsigned)net[1], (unsigned)net[2], (unsigned)net[3]);
    - net[i] = ip[i] & mask[i];
    - unsigned char ip[4] = {192, 0, 2, 12};
    - net[i] = ip[i] | mask[i];
    - for (int i = 0; i < 4; i++)
    - unsigned char net[4];
    - unsigned char mask[4] = {255, 255, 255, 0};
    answer_order:
    - 2
    - 6
    - 5
    - 4
    - 1
    - 0
    distractor_why:
      net[i] = ip[i] | mask[i];: Bitwise OR would set host bits to 1 instead of clearing them; network
        extraction requires AND.
    why: 'The data flow is: declare the address, declare the mask, reserve the result buffer, loop over
      the four bytes, AND each pair, then print. OR is the authentic near-miss because it also combines
      bits, but it produces the wrong operation. (b3)'
    concept: netmask-order
  - kind: mcq
    q: What does the /30 in 192.0.2.12/30 count?
    choices:
    - the number of leading network bits in the address
    - the number of bytes used by the address
    - the port number used after the address
    - the number of hosts allowed on the network
    answer: 0
    why: CIDR slash notation names the count of leading 1-bits in the netmask — the network prefix length.
      'Hosts allowed' confuses the prefix length with the remaining host bits. 'Bytes used' confuses bits
      with bytes. 'Port number' confuses the address's subnet field with the transport-layer port. (b3)
    concept: cidr-meaning
  - kind: eipe
    q: In one sentence, what is this loop FOR?
    code: |
      for (int i = 0; i < 4; i++)
          net[i] = ip[i] & mask[i];
    choices:
    - copying the host address into the network address unchanged
    - clearing the host bits so the result names the network
    - converting each byte from host order to network order
    answer: 1
    why: The mask has 1-bits over the network portion, so AND passes those bits and clears the host bits,
      producing the network number. It is not a copy, and byte-order conversion is done with htons/ntohl,
      not a mask. (b3)
    concept: netmask-and-purpose
  - kind: why-fails
    q: A student writes net[i] = ip[i] | mask[i]; instead of &. Why does this fail to produce a network
      address?
    choices:
    - OR always returns zero whenever either input byte has a 1 bit set
    - OR cannot be applied to individual bytes, only to full 32-bit integers
    - OR turns host bits on instead of clearing them, so the result gains bits
    answer: 2
    why: Network extraction relies on forcing host bits to 0. AND with a 0 mask bit does that; OR with
      the mask's 1 bits forces extra bits to 1, so 192.0.2.12/24 would not collapse cleanly to 192.0.2.0.
      OR is defined bitwise on bytes, and it does not always return zero. (b3)
    concept: netmask-or-instead-of-and
- id: b4
  type: model
  title: Address a Service by Port on a Shared IP
  explain_md: |
    An IP address gets a packet to a machine. But a machine runs many
    services: a web server, a mail server, perhaps a game server. Something
    must say *which service* should receive the bytes. That something is the
    **port number**, a 16-bit value used by TCP (stream sockets) and, by
    coincidence, by UDP (datagram sockets) as well.

    ### The hotel analogy

    Think of the IP address as the **street address of a hotel** and the port
    number as the **room number**. The street address gets the courier to the
    building; the room number gets the delivery to the right guest. One
    building can host many guests, just as one IP can host many services.

    ### Well-known room numbers

    Common services have agreed ports, visible in the IANA port list or a
    Unix `/etc/services` file: HTTP is **80**, telnet is **23**, SMTP is
    **25**, and (for the historically inclined) DOOM used **666**. Ports
    under **1024** are often treated as special and usually require OS
    privileges to bind.

    ### The Notional Machine

    The port is a 16-bit field, so it ranges from 0 to 65535. It lives at the
    transport layer, not the IP layer: IP routes the packet using the
    address, while TCP/UDP demultiplexes the arriving bytes to the correct
    service using the port. That is why the same IP can serve HTTP and mail
    simultaneously — the pair (IP, port) names the endpoint.

    A useful consequence: a "connection" is identified by more than one
    address. At the minimum, a local endpoint and a remote endpoint each
    contribute an IP and a port. Keep the layering straight: the address is
    the building, the port is the room.
  example:
    lang: c
    code: |
      #include <stdio.h>

      struct service {
          const char *name;
          unsigned short port;
      };

      int main(void)
      {
          struct service table[] = {
              {"telnet", 23},
              {"SMTP",   25},
              {"HTTP",   80},
              {"DOOM",  666}
          };

          for (unsigned i = 0; i < sizeof table / sizeof table[0]; i++)
              printf("%-6s %u\n", table[i].name, (unsigned)table[i].port);
          return 0;
      }
    run_expected: |
      telnet 23
      SMTP   25
      HTTP   80
      DOOM   666
    explain_md: |
      Each row pairs a human service name with the agreed 16-bit port. The
      loop walks the table and prints both; the port is a plain integer, not
      part of the IP address. `%-6s` pads the name so the numbers line up.
    subgoals:
    - label: Declare the Port Table
      lines:
      - 3
      - 4
      - 5
      - 6
    - label: List Well-Known Services
      lines:
      - 10
      - 11
      - 12
      - 13
      - 14
    - label: Print Each Name and Port
      lines:
      - 16
      - 17
  viz:
    kind: ascii-memory
    steps:
    - IP 198.51.100.7 names the building; port 80 names the HTTP room
    - port 25 on the same IP names a different room — SMTP
    - the transport layer reads the 16-bit port and dispatches to the matching service
    - ports 0..65535 fit in 16 bits; ports below 1024 are conventionally privileged
  checks:
  - kind: mcq
    q: How large is a port number in the sockets API?
    choices:
    - 8 bits per port
    - 16 bits per port
    - 32 bits per port
    - 128 bits per port
    answer: 1
    why: A port is a 16-bit number. 8 bits would allow only 256 ports, far fewer than the well-known list
      needs; 32 bits is the width of an IPv4 address; 128 bits is an IPv6 address. (b4)
    concept: port-width
  - kind: mcq
    q: Which layer uses the port number to choose the receiving service?
    choices:
    - the Application layer, before any socket call is made
    - the Internet layer, alongside the IP routing function
    - the Host-to-Host Transport layer, used by TCP and UDP
    - the Network Access layer, alongside the Ethernet driver
    answer: 2
    why: IP (Internet layer) is separate from TCP/UDP (Host-to-Host Transport), and the port belongs with
      TCP and UDP. IP routes using the address; the transport layer uses the port to deliver to the right
      service. 'Internet layer' traps treating address and port as one field. 'Network Access' and 'Application'
      move the port to the wrong layer. (b4)
    concept: port-layer
  - kind: fillblank
    q: Fill the well-known port for HTTP web service.
    code: |
      const unsigned short http_port = ____;
    answer_text: '80'
    why: The well-known list gives HTTP port 80. Port 25 is SMTP, 23 is telnet, and 666 was DOOM — each
      is a real service port, but not the web's. (b4)
    concept: well-known-ports
  - kind: choose-better
    q: A single server with one IP address must offer both HTTP and SMTP. Which design is better?
    choices:
    - bind HTTP to port 80 and SMTP to port 25 on the same IP address
    - give the machine a second IP address for mail and keep only HTTP on the first
    - bind both services to port 80 and let the transport layer sort out the payload
    answer: 0
    why: 'Ports exist precisely so one address can host many services: (IP, 80) and (IP, 25) are distinct
      endpoints. A second IP works but adds addressing work the port mechanism already solves. Sharing
      port 80 for both is ambiguous — the transport layer has no way to know which service should read
      the bytes. (b4)'
    concept: port-multiplexing
  - kind: why-fails
    q: A server tries to listen for both HTTP and a custom mail protocol on port 80 of one IP, expecting
      clients to reach both. Why does this fail?
    code: |
      /* both services request the same endpoint */
      bind(http_socket,  "192.0.2.10", 80);
      bind(mail_socket,  "192.0.2.10", 80);
    choices:
    - the port field is too small to hold the value 80 twice on one host
    - a single (IP, port) endpoint cannot unambiguously dispatch to two services
    - IPv4 addresses cannot host more than one service at a time on a machine
    answer: 1
    why: The endpoint is the pair (address, port); asking two services to answer on the same pair makes
      every arriving byte ambiguous. 'Too small to hold 80 twice' confuses storage of a port value with
      binding a socket. 'IPv4 cannot host multiple services' is false — that is exactly what distinct
      ports enable. (b4)
    concept: endpoint-collision
  - kind: mcq
    q: What is special about ports below 1024?
    choices:
    - they always belong to the HTTP service and nothing else
    - they are reserved for IPv6 addresses only, never for IPv4
    - they cannot be used by any ordinary application at all
    - they are often considered special and usually require OS privileges
    answer: 3
    why: Ports under 1024 are often considered special and usually require special OS privileges to bind.
      'Reserved for IPv6' and 'cannot be used' overstate the rule; privileged does not mean forbidden.
      'Always HTTP' confuses one well-known port with the entire low range. (b4)
    concept: privileged-ports
  - kind: eipe
    q: In one sentence, what is a port number FOR?
    choices:
    - it names which network the machine belongs to, much like a street name
    - it encrypts the connection between the two communicating machines on the wire
    - it names which service inside one machine should receive the arriving bytes
    answer: 2
    why: 'The relational purpose is service demultiplexing: the IP reaches the building, the port reaches
      the room. ''Network name'' confuses the port with the network portion of an IP address. ''Encrypts''
      invents a security function the port does not perform. (b4)'
    concept: port-purpose
  - kind: why-fails
    q: A client sends bytes to a server's IP address but specifies no port. Why can the transport layer
      not pick the right service?
    choices:
    - the IP address already contains the port, so a second number is ignored
    - many services can share one IP, so the port identifies which one receives bytes
    - ports are only needed for outbound packets, never for inbound ones
    answer: 1
    why: The IP gets the packet to the machine, but several services may listen on that machine. The port
      is the demultiplexing key that selects the service, so omitting it leaves the transport layer no
      way to choose. IP does not carry the port, and inbound traffic needs the port just as much as outbound.
      (b4)
    concept: port-required-for-service
  - kind: eipe
    q: In one sentence, what is the pair (IP address, port number) FOR?
    code: |
      struct sockaddr_in server;
      server.sin_addr.s_addr = inet_addr("198.51.100.7");
      server.sin_port = htons(443);
    choices:
    - encoding an IPv6 address as two IPv4 addresses
    - converting a port from network order to host order
    - 'naming one endpoint: a host plus a service on that host'
    answer: 2
    why: The address identifies the host and the port identifies the service, so together they name an
      endpoint. No IPv6 encoding occurs, and htons is the conversion this code performs, not the purpose
      of the pair. (b4)
    concept: endpoint-pair-purpose
- id: b5
  type: model
  title: Read Numbers in the Right Byte Order
  explain_md: |
    A multi-byte number is a sequence of bytes, and machines disagree about
    the order in which to store that sequence. Take the two-byte hex value
    `b34f`.

    - **Big-endian** stores the most significant byte first: `b3` then `4f`.
    - **Little-endian** stores the least significant byte first: `4f` then
      `b3`.

    The Internet standardized on the big-endian order for values on the
    wire: **Network Byte Order** *is* big-endian. Your machine, meanwhile,
    uses its own **Host Byte Order**. An Intel-compatible processor is
    little-endian; a Motorola 68k is big-endian; a PowerPC can be either.

    ### The Notional Machine: bytes, not numbers

    Memory has no opinion about significance. If a `short` occupies two
    bytes at addresses `a` and `a+1`, the hardware chooses which byte holds
    the high half and which holds the low half when the number is loaded or
    stored. Networking code cares because the receiving machine may make the
    opposite choice: sending the raw host bytes means the receiver can read
    `b34f` as `4fb3`.

    The portable rule is refreshingly blunt: *assume Host Byte
    Order is not right* and always run values through the conversion
    functions. On a big-endian host the conversion may do nothing; on a
    little-endian host it swaps. Your source code stays the same either way.

    The conversion applies to two widths in the sockets API: `short`
    (two bytes) and `long` (four bytes). The unsigned variants work too.
    Convert to Network Byte Order as values leave the machine, and back to
    Host Byte Order as they arrive. There are no standard 64-bit variants in
    the sockets API; floating point gets a separate serialization
    discussion, which this pack defers.
  example:
    lang: c
    code: |
      #include <stdio.h>

      int main(void)
      {
          unsigned char big[2]    = {0xb3, 0x4f};  /* most significant first */
          unsigned char little[2] = {0x4f, 0xb3};  /* least significant first */

          printf("big-endian stores:    %02x then %02x\n",
                 (unsigned)big[0], (unsigned)big[1]);
          printf("little-endian stores: %02x then %02x\n",
                 (unsigned)little[0], (unsigned)little[1]);
          return 0;
      }
    run_expected: |
      big-endian stores:    b3 then 4f
      little-endian stores: 4f then b3
    explain_md: |
      Both arrays hold the same number, `0xb34f`, but not in the same byte
      order. Big-endian puts the high byte `b3` first; little-endian puts the
      low byte `4f` first. The bytes are plain data — significance lives in
      the convention, not in the memory cells.
    subgoals:
    - label: Lay Out the Two Stores
      lines:
      - 5
      - 6
    - label: Show Big-Endian Order
      lines:
      - 8
      - 9
    - label: Show Little-Endian Order
      lines:
      - 10
      - 11
  viz:
    kind: ascii-memory
    steps:
    - 'number 0xb34f: high byte b3, low byte 4f'
    - 'big-endian memory: [0]=b3, [1]=4f — Network Byte Order'
    - 'little-endian memory: [0]=4f, [1]=b3 — Intel-style Host Byte Order'
    - same number, same width, opposite byte sequence
  checks:
  - kind: predict
    q: Trace the bytes, not the numeric value. On a little-endian machine, which byte is stored first
      for the value 0xb34f?
    code: |
      /* little-endian stores the least significant byte first */
      unsigned char bytes[2] = {/* first */, /* second */};
    choices:
    - 4f, then b3
    - b3, then 4f
    - f4, then 3b
    answer: 0
    why: 'Little-endian stores the least significant byte first: `4f` then `b3`. ''b3 then 4f'' is the
      big-endian/network order. ''f4 then 3b'' reverses nibbles inside each byte, which byte order does
      not do — nibble order is unchanged. (b5)'
    concept: little-endian-bytes
  - kind: mcq
    q: What is the relationship between Network Byte Order and big-endian?
    choices:
    - they are unrelated; Network Byte Order is machine-dependent
    - 'they are the same ordering: most significant byte first'
    - 'they are opposites: Network Byte Order is little-endian'
    answer: 1
    why: The more-sane big-endian order is also called Network Byte Order because that is the order network
      code expects. Calling it little-endian reverses the definition. Calling it machine-dependent confuses
      the fixed wire convention with the host's native order. (b5)
    concept: network-byte-order
  - kind: fillblank
    q: Network Byte Order is also called ____-endian.
    code: |
      /* The wire convention stores the most significant byte first. */
      const char *name = "____-endian";
    answer_text: big
    why: Big-endian stores the most significant byte first, which is the Internet's Network Byte Order.
      'little' would describe the Intel-style host order the wire convention exists to avoid. (b5)
    concept: endian-names
  - kind: trace
    q: Trace the byte layout. What value belongs in the target cell?
    code: |
      unsigned char mem[2];
      unsigned short value = 0x1234;
      /* assume this host is little-endian when storing value into mem */
    trace:
      headers:
      - Step
      - Item
      - High Byte
      - Low Byte
      - First Stored
      rows:
      - step: 1
        line: 1
        cells:
        - '1'
        - value 0xb34f
        - b3
        - 4f
        - ???
      - step: 2
        line: 2
        cells:
        - '2'
        - big-endian result
        - b3
        - 4f
        - b3
    target:
      row: 0
      col: 4
    choices:
    - byte 4f
    - word b34f
    - byte f4
    - byte b3
    answer: 0
    why: On a little-endian host the least significant byte is stored first, so the first byte is `4f`.
      `b3` is what big-endian would store first; `b34f` is the whole two-byte value, not one byte; `f4`
      swaps nibbles, which endianness never does. (b5)
    concept: little-endian-trace
  - kind: why-fails
    q: A program sends a port value without conversion on a little-endian host. The peer reads the two
      bytes in network order. Why does the peer see the wrong number?
    code: |
      unsigned short port = 0x1f90;  /* 8080 */
      send(fd, &port, sizeof port, 0);
    choices:
    - port numbers above 1024 must always be sent as four separate bytes
    - send() automatically byte-swaps every argument, so the extra swap cancels out
    - the sender's little-endian bytes arrive in an order the peer reads as big-endian
    answer: 2
    why: The sender stores 0x1f90 as bytes 90 1f; a peer reading network-order bytes interprets that as
      0x901f. The fix is `htons(port)` before sending. 'send() swaps automatically' is false — the API
      sends the bytes you give it. 'Must be four bytes' confuses port width with the long conversion width.
      (b5)
    concept: missing-conversion
  - kind: mcq
    q: An Intel-compatible 80x86 machine stores multi-byte integers in which order?
    choices:
    - little-endian, the reverse of Network Byte Order
    - it depends on the program's compiler flags
    - big-endian, matching Network Byte Order
    answer: 0
    why: 'Intel and Intel-compatible processors are little-endian: the bytes are stored reversed relative
      to network order. ''Big-endian'' would make conversion unnecessary on x86, which is not the case.
      ''Compiler flags'' confuses the hardware''s byte order with a build option. (b5)'
    concept: host-endianness
  - kind: eipe
    q: In one sentence, what is the point of always calling the conversion functions even when you are
      unsure of the host's byte order?
    choices:
    - the conversion compresses multi-byte numbers before sending so they take less space
    - the conversion makes the program portable by normalizing to the wire convention regardless of host
      order
    - the conversion checks whether the host is Intel or Motorola and refuses to run otherwise
    answer: 1
    why: 'The purpose is portability: the function does nothing on a big-endian host and swaps on a little-endian
      host, so one source file works on both. ''Checks and refuses'' invents a hardware gate. ''Compresses''
      confuses byte reordering with data compression — the width is unchanged. (b5)'
    concept: conversion-portability
  - kind: eipe
    q: What is this htons call FOR?
    code: |
      uint16_t port = 8080;
      uint16_t wire_port = htons(port);
    choices:
    - converting the port number to network byte order before it is stored
    - parsing the text 8080 into a binary IPv4 address for later use
    - converting the port number from network order back to host order
    answer: 0
    why: htons prepares a host-order 16-bit value for the wire by arranging its bytes in network order.
      It does not parse text, and the inverse direction is ntohs. (b5)
    concept: to-network-purpose
  - kind: why-fails
    q: A little-endian client fills sin_port with htons(8080), but the server reads the raw bytes into
      a host integer without ntohs. Why can the number look wrong?
    choices:
    - htons erases the low byte, so only the value 31 actually survives the call
    - the server reads network-order bytes as host order, so 0x1f90 reads as 0x901f
    - ports larger than 255 cannot be sent over a TCP connection at all today
    answer: 1
    why: On a little-endian host, reading big-endian wire bytes directly puts the high byte in the low
      position, so 0x1f90 appears as 0x901f (36895). No byte is erased, and 8080 is a valid 16-bit port.
      (b5)
    concept: missing-ntohs-effect
- id: b6
  type: syntax
  title: Convert Values with htons and Friends
  explain_md: |
    The sockets API names its byte-order conversions by composing four
    letters: **h** for host, **n** for network, **s** for short (two bytes),
    and **l** for long (four bytes). Read the name left to right as a
    sentence:

    | Function | Meaning |
    | --- | --- |
    | `htons()` | host to network, short |
    | `htonl()` | host to network, long |
    | `ntohs()` | network to host, short |
    | `ntohl()` | network to host, long |

    The combinations are not arbitrary. `htons()` and `htonl()` prepare
    values **before they go out on the wire**; `ntohs()` and `ntohl()` restore
    values **as they come in off the wire**. There is no `stolh()`-style
    function, because "short to long host" is not a byte-order conversion at
    all — it is a width conversion, and these functions do not do that.

    ### The Notional Machine

    `htons()` takes a 16-bit host value and returns a 16-bit value whose
    bytes are arranged in network order. On a big-endian host it returns the
    same bits; on a little-endian host it swaps the two bytes. The unsigned
    variations work as well, and the functions are designed so that calling
    the matching inverse restores the original value.

    ### What this block does *not* cover

    There are no standard 64-bit variants in the sockets API; other libraries
    may provide those. Floating-point values need serialization
    rather than byte swapping. Keep those two limitations in mind before
    reaching for a conversion function on an arbitrary type.
  example:
    lang: c
    code: |
      #include <stdio.h>
      #include <arpa/inet.h>

      int main(void)
      {
          unsigned short port = 8080;
          unsigned long  addr = 0x0a0c0d0eUL;

          printf("port round trip: %u\n",
                 (unsigned)ntohs(htons(port)));
          printf("addr round trip: %lx\n",
                 (unsigned long)ntohl(htonl(addr)));
          return 0;
      }
    run_expected: |
      port round trip: 8080
      addr round trip: a0c0d0e
    explain_md: |
      `htons` moves the port to network order and `ntohs` brings it back, so
      the printed value is the original 8080 on any host. The long pair does
      the same for four bytes. Printing the round trip avoids making the
      output depend on the machine's native endianness.
    subgoals:
    - label: Choose the Short Conversion
      lines:
      - 6
      - 8
      - 9
    - label: Choose the Long Conversion
      lines:
      - 7
      - 10
      - 11
  checks:
  - kind: fillblank
    q: Fill the function that converts a two-byte host value to Network Byte Order.
    code: |
      unsigned short port = 8080;
      unsigned short wire = ________(port);
    answer_text: htons
    why: 'The name reads host to network short: `h` + `to` + `n` + `s`. `htonl` is the four-byte variant,
      not the two-byte one; `ntohs` converts in the opposite direction (network to host). (b6)'
    concept: htons
  - kind: fillblank
    q: Fill the function that converts a four-byte value arriving from the network back to Host Byte Order.
    code: |
      unsigned long wire = 0x01020304UL;
      unsigned long host = ________(wire);
    answer_text: ntohl
    why: Network to host long is `n` + `to` + `h` + `l`. `htonl` goes the other direction, and `ntohs`
      is only two bytes wide — using it on a four-byte value would truncate. (b6)
    concept: ntohl
  - kind: order
    q: Order the 3 correct lines so the program converts a port and sends its two network-order bytes;
      one line is a distractor.
    lines:
    - unsigned short wire = htons(port);
    - send(fd, &wire, sizeof wire, 0);
    - unsigned short port = 8080;
    - unsigned short wire = ntohs(port);
    answer_order:
    - 2
    - 0
    - 1
    distractor_why:
      unsigned short wire = ntohs(port);: ntohs converts network order to host order, but this value is
        leaving the host, so it needs htons.
    why: 'The data flow is: establish the host value, convert it to network order, then hand the converted
      bytes to send. Using ntohs before sending reverses the conversion direction and produces swapped
      bytes on the wire. (b6)'
    concept: conversion-direction
  - kind: mcq
    q: Which conversion width does the sockets API provide standard functions for?
    choices:
    - only floating-point values, regardless of their width
    - short (two bytes) and long (four bytes) integer values
    - short, long, and a standard 64-bit integer variant
    - only 32-bit integer values and nothing narrower than that
    answer: 1
    why: 'Two widths exist: `short` (two bytes) and `long` (four bytes). It explicitly says there are
      no standard 64-bit variants, so the option adding one is wrong. ''Only 32-bit'' ignores the short
      functions. ''Only floating-point'' is backwards: floating point needs serialization, not these functions.
      (b6)'
    concept: conversion-widths
  - kind: predict
    q: Trace the round trip. What does this program print on a little-endian host?
    code: |
      unsigned short port = 8080;
      printf("%u\n", (unsigned)ntohs(htons(port)));
    choices:
    - it prints 0, because both conversion calls return zero on this host
    - it prints the byte-swapped value 36895, because the conversions cancel
    - it prints 8080, because the two conversion calls are exact inverses
    - it prints 36895, because only one of the two conversions is applied
    answer: 2
    why: 'The two conversions are inverses: htons swaps into network order, ntohs swaps back, so the original
      8080 returns. ''36895'' is the byte-swapped value (0x901f); stopping after one conversion would
      produce it, but the round trip restores the host value. ''0'' is not produced by byte swapping.
      The other 8080 option states the right number for the wrong reason — the conversions cancel *because*
      they are inverses, restoring 8080, not leaving the swapped value. (b6)'
    concept: round-trip
  - kind: why-fails
    q: A student converts a two-byte port with htonl() before sending. Why is that the wrong function?
    code: |
      unsigned short port = 8080;
      unsigned long wire = htonl(port);
      send(fd, &wire, sizeof wire, 0);
    choices:
    - htonl only works on big-endian machines, so it fails on Intel hardware
    - the port must not be converted at all before it is sent over the network
    - htonl is the four-byte conversion; the port is two bytes and needs htons
    answer: 2
    why: The `l` suffix means long/four bytes, while a port is a two-byte short; mixing widths both mislabels
      the value and sends four bytes where two are expected. 'Only works on big-endian' is false — the
      function exists to handle either host order. 'Must not be converted' is the opposite of the portable
      rule. (b6)
