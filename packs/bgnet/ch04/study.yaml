    - converting a two-byte value from host byte order to network byte order
    - converting a four-byte value from network byte order to host byte order
    - converting a short integer into a long integer without changing its value
    answer: 0
    why: 'Read the letters in order: host to network, short. That is exactly the two-byte outbound conversion.
