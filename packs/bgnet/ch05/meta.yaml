meta:
  book: bgnet
  chapter_id: ch05
  title: "Jumping from IPv4 to IPv6"
  source_ref: "Ch.4 'Jumping from IPv4 to IPv6' (Beej's Guide to Network Programming)"
  level: core
  prereqs: [ch04]
objectives:
  - "Translate a hard-coded IPv4 endpoint into an IPv6 endpoint by changing the address and protocol family at every call site"
  - "Replace INADDR_ANY wildcard assignments with in6addr_any struct assignment and IN6ADDR_ANY_INIT declaration initialization"
  - "Migrate struct sockaddr_in/in_addr fields to struct sockaddr_in6/in6_addr, including the \"6\" field names and the absent sin6_zero"
  - "Replace inet_aton/inet_addr/inet_ntoa with inet_pton/inet_ntop for dual-stack text and binary conversion"
  - "Choose getaddrinfo/getnameinfo over gethostbyname/gethostbyaddr and isolate remaining family-specific choices in helper functions"
  - "Retire INADDR_BROADCAST in favor of IPv6 multicast, then apply the migration checklist in dependency order"
