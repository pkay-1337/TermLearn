    q: What does SO_REUSEADDR allow a server to do?
    choices:
    - accept multiple connections without calling accept()
    - send UDP datagrams without naming a destination address
    - reuse a local port still lingering from a closed connection
    answer: 2
    why: The option relaxes the lingering-state check that produces "Address already in use." It does
      not replace accept(), and datagram addressing is controlled by sendto(), not by this option. (b6)
    concept: reuse-purpose
  - kind: order
    q: Order the 4 correct statements that enable address reuse on a listening socket. One line is a distractor.
