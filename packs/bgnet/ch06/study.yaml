- id: b9
  type: model
  title: Accept a Connection and Talk on the New Descriptor
  explain_md: |
    `accept()` is the call that removes one pending connection from the
    listening queue. Its signature is `accept(int sockfd, struct sockaddr
    *addr, socklen_t *addrlen)`. The first argument is the listening
    descriptor, not a connected one.

    The surprising part is the return value: `accept()` returns a brand-new
    socket descriptor for this single connection. The original descriptor
    stays in listening mode and can accept more clients. You now have two
    descriptors: the door and the private channel.

    ### The Notional Machine: two handles into the same kernel object family

    The listening descriptor is bound to the local port and owns the queue.
    The accepted descriptor is connected to one remote peer. `send()` and
    `recv()` belong on the accepted descriptor; using the listening descriptor
    for them is a category error. If the server handles only one client ever,
    it may close the listening descriptor after accepting, which stops further
    incoming connections on that port.

    ### Filling in the peer address

    `addr` usually points to a local `struct sockaddr_storage`, which is large
    enough for any family. Before the call, set the length variable to
    `sizeof(struct sockaddr_storage)`. The kernel writes the peer's address
    into the storage and may replace the length with the number of bytes it
    actually used. The code below compiles as a complete one-shot server; it
    blocks in `accept()` until a client arrives.
  example:
    lang: c
    code: |
      #define _POSIX_C_SOURCE 200112L
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      #include <netdb.h>
      #include <sys/socket.h>

      #define MYPORT "3490"
      #define BACKLOG 10

      int main(void)
      {
          struct sockaddr_storage their_addr;
          socklen_t addr_size;
          struct addrinfo hints;
          struct addrinfo *res = NULL;
          int sockfd;
          int new_fd;

          memset(&hints, 0, sizeof hints);
          hints.ai_family = AF_UNSPEC;
          hints.ai_socktype = SOCK_STREAM;
          hints.ai_flags = AI_PASSIVE;

          if (getaddrinfo(NULL, MYPORT, &hints, &res) != 0) {
              printf("lookup failed\n");
              return 1;
          }

          sockfd = socket(res->ai_family, res->ai_socktype, res->ai_protocol);
          if (sockfd == -1) {
              printf("socket failed\n");
              freeaddrinfo(res);
              return 1;
          }

          if (bind(sockfd, res->ai_addr, res->ai_addrlen) == -1) {
              printf("bind failed\n");
              close(sockfd);
              freeaddrinfo(res);
              return 1;
          }

          if (listen(sockfd, BACKLOG) == -1) {
              printf("listen failed\n");
              close(sockfd);
              freeaddrinfo(res);
              return 1;
          }

          addr_size = sizeof their_addr;
          new_fd = accept(sockfd, (struct sockaddr *)&their_addr, &addr_size);
          if (new_fd == -1) {
              printf("accept failed\n");
              close(sockfd);
              freeaddrinfo(res);
              return 1;
          }

          printf("accepted a connection on a new descriptor\n");

          close(new_fd);
          close(sockfd);
          freeaddrinfo(res);
          return 0;
      }
    run_expected: |
      (blocks until a client connects, then prints:)
      accepted a connection on a new descriptor
    explain_md: |
      The first four calls build a listening socket. accept() then blocks until
      a client arrives, fills their_addr with the peer address, updates
      addr_size, and returns a new connected descriptor. The server closes that
      new descriptor when the conversation ends, then closes the listening
      descriptor to stop new connections.
