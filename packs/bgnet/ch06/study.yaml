- id: b10
  type: algorithm
  title: Move Stream Bytes with send and recv
  explain_md: |
    `send(int sockfd, const void *msg, int len, int flags)` writes bytes to a
    connected stream socket; `recv(int sockfd, void *buf, int len, int flags)`
    reads bytes from one. Set `flags` to `0` unless a specific option is
    needed.

    These calls are blocking. `recv()` waits until some data is available.
    `send()` can also block if the outgoing buffer is full, although that is
    less common. Blocking is not an error; it is the socket's default
    behavior.

    ### send may write less than you asked

    `send()` returns the number of bytes it actually accepted, which may be
    less than `len`. A small write usually goes out in one call, but a large
    one can be partial. Correct code loops until every byte has been sent. If
    `send()` returns `-1`, check `errno`; do not treat the return as the
    message length.

    ### recv has a special zero

    `recv()` returns the number of bytes read, `-1` on error, or `0`. A return
    of `0` means the peer has closed the connection. It does not mean "try
    again" and it does not mean the buffer is empty. `len` is the capacity of
    the buffer, not the number of bytes you expect.

    ### The Notional Machine: a stream, not a message queue

    A stream socket carries an ordered byte stream with no message boundaries.
    One `recv()` may return part of a logical message, and one `send()` may be
    split. The program must track how many bytes it has sent or received and
    decide when a complete application message has arrived.
  example:
    lang: c
    code: |
      #define _POSIX_C_SOURCE 200112L
      #include <stdio.h>
      #include <sys/socket.h>

      int send_all(int sockfd, const char *msg, int len)
      {
          int total = 0;

          while (total < len) {
              int n = send(sockfd, msg + total, len - total, 0);
              if (n <= 0) {
                  return -1;
              }
              total += n;
          }
          return total;
      }

      int main(void)
      {
          printf("send_all handles partial sends: yes\n");
          return 0;
      }
    run_expected: |
      send_all handles partial sends: yes
    explain_md: |
      The loop advances by the number of bytes send() actually accepted. If a
      call returns 0 or -1, the helper reports failure instead of spinning. The
      remaining count shrinks on each iteration, so the loop ends only after
      every byte has been handed to the kernel.
    subgoals:
    - label: Track the Bytes Already Sent
      lines:
      - 5
      - 6
      - 7
    - label: Send the Remaining Slice
      lines:
      - 9
      - 10
      - 11
      - 12
      - 13
      - 14
    - label: Report the Total
      lines:
      - 15
      - 16
    adapted: true
    note: 'Adapted from the chapter''s send/recv snippets: a deterministic in-memory channel replaces
      a live socket so partial sends and zero-byte receive are visible.'
  diagram:
    kind: flow
    caption: 'Stream I/O: send until complete, then recv reports bytes or EOF'
    nodes:
    - id: SEND
      label: send() unsent suffix
      shape: io
    - id: MORE
      label: sent == len?
      shape: decision
    - id: RECV
      label: recv() up to len
      shape: io
    - id: ZERO
      label: n == 0?
      shape: decision
    - id: DATA
      label: consume n bytes
    - id: EOF
      label: peer closed
    edges:
    - from: SEND
      to: MORE
    - from: MORE
      to: SEND
      label: 'no'
    - from: MORE
      to: RECV
      label: 'yes'
    - from: RECV
      to: ZERO
    - from: ZERO
      to: DATA
      label: '> 0'
    - from: ZERO
      to: EOF
      label: '0'
    steps:
    - focus:
      - SEND
      - MORE
      note: send() may accept only part of the buffer; advance by the return value
    - focus:
      - SEND
      - MORE
      - RECV
      note: once every byte is accepted, recv() waits for incoming data
    - focus:
      - SEND
      - MORE
      - RECV
      - ZERO
      note: recv() reports a byte count; zero is EOF, not an empty retry
    - focus:
      - SEND
      - MORE
      - RECV
      - ZERO
      - DATA
      - EOF
      note: consume n bytes for n > 0; stop reading when n is 0
  checks:
  - kind: mcq
    q: What does send() return on success?
    choices:
    - the bytes still waiting in the kernel buffer
    - the number of bytes actually accepted for sending
    - the peer's acknowledgment sequence number
    answer: 1
    why: send() reports how many bytes it accepted, which can be less than the requested length. It does
      not report the kernel's remaining buffer or a peer acknowledgment number. (b10)
    concept: send-return
  - kind: fillblank
    q: Complete the send call inside the partial-write loop.
    code: |
      while (total < len) {
          int n = send(sockfd, msg + total, len - total, ____);
          if (n <= 0) return -1;
          total += n;
      }
    answer_text: '0'
    why: The flags argument is normally 0 for ordinary stream sends. Passing len would be a flag value
      rather than a length, and passing total would be the wrong quantity for the flags field. (b10)
    concept: send-flags
  - kind: predict
    q: Trace the loop. send() returns 4 on the first call and the message is 13 bytes long. What is total
      after the first iteration?
    code: |
      int total = 0;
      int len = 13;
      int n = send(sockfd, msg + total, len - total, 0); /* returns 4 */
      if (n > 0) {
          total += n;
      }
    choices:
    - total is 9
    - total is 4
    - total is 13
    - total is 0
    answer: 1
    why: total starts at 0 and gains the four bytes send() accepted, so it is 4. The value 9 is the remaining
      byte count, 13 is the original length, and 0 is the starting value. Confusing total with remaining
      is the classic partial-send tracing error. (b10)
    concept: partial-send-trace
  - kind: mcq
    q: What does recv() returning 0 mean?
    choices:
    - the remote peer has closed the connection
    - the buffer is empty while the peer stays alive
    - the call failed and errno describes the error
    answer: 0
    why: A zero return is the orderly-close signal. An empty but live connection would block instead of
      returning 0. Errors return -1 and set errno. (b10)
    concept: recv-zero
  - kind: why-fails
    q: A program sends a 5000-byte message with one send() call and assumes the whole message went out
      because the return value was positive. Why is this unsafe?
    choices:
    - send() always sends exactly one byte per call in this loop
    - send() may accept fewer bytes, leaving the rest unsent
    - a positive return means the peer processed the data
    answer: 1
    why: The return value is a byte count, not a success boolean. A positive but smaller value means only
      that prefix was accepted, so the program must send the remainder. send() is not limited to one byte,
      and a positive return does not mean the peer processed anything. (b10)
    concept: partial-send-bug
  - kind: order
    q: Order the 5 correct steps of a correct partial-send loop. One line is a distractor.
    lines:
    - initialize total to 0
    - call send() for the remaining slice
    - stop with failure if send() returns 0 or -1
    - add the returned byte count to total
    - repeat while total is less than the message length
    - return success as soon as one send() call returns a positive value
    answer_order:
    - 0
    - 1
    - 2
    - 3
    - 4
    distractor_why:
      return success as soon as one send() call returns a positive value: A positive return can be smaller
        than the message, so returning early leaves bytes unsent; the loop must continue until total reaches
        len.
    hint: What has to reach the message length before the loop can stop?
    why: The loop tracks accepted bytes, sends only the remainder, fails on a non-positive result, and
      continues until total equals the message length. Treating one positive send as completion is the
      partial-write bug. (b10)
    concept: send-loop-order
  - kind: trace
    q: Trace the partial-send loop. What value belongs in the target cell for total after the second send?
    code: |
      int total = 0;
      int len = 10;
      int n1 = send(sockfd, msg + total, len - total, 0); /* 3 */
      total += n1;
      int n2 = send(sockfd, msg + total, len - total, 0); /* 4 */
      total += n2;
    trace:
      headers:
      - Step
      - Line
      - Call
      - Returned
      - total
      rows:
      - step: 1
        line: 1
        cells:
        - '1'
        - '1'
        - initialize
        - '-'
        - '0'
      - step: 2
        line: 3
        cells:
        - '2'
        - '3'
        - 'send #1'
        - '3'
        - '3'
      - step: 3
        line: 5
        cells:
        - '3'
        - '5'
        - 'send #2'
        - '4'
        - ???
    target:
      row: 2
      col: 4
    choices:
    - total is 3
    - total is 4
    - total is 7
    - total is 10
    answer: 2
    why: The second send accepts four more bytes, and total already held three, so total becomes 7. The
      value 4 is only the second return, 3 is the previous total, and 10 is the full message length. (b10)
    concept: send-trace
  - kind: choose-better
    q: Two functions send a large buffer. Which is better?
    choices:
    - one send() call followed by assuming it all went out
    - a loop that sends the remaining slice until total is complete
    - a loop that retries only when send() returns -1
    answer: 0
    why: The loop handles partial acceptance, which is the documented behavior. One call can leave bytes
      unsent, and retrying only on -1 ignores positive-but-partial returns. (b10)
    concept: send-strategy
  - kind: eipe
    q: In one sentence, what are send() and recv() FOR?
    choices:
    - they resolve names and create address records
    - they move bytes over an already connected stream socket
    - they bind a local port and start a listening queue
    answer: 1
    why: send() and recv() operate on an established stream connection. Lookup is getaddrinfo's job, and
      binding/listening belong to bind() and listen(). (b10)
    concept: send-recv-purpose
  common_bugs:
  - Treating a short positive send() return as complete success.
  - Treating recv() returning 0 as an empty buffer instead of a peer close.
- id: b11
  type: syntax
  title: Address Every Datagram with sendto and recvfrom
  explain_md: |
    A datagram socket does not have a connection, so every send must name its
    destination. `sendto()` extends `send()` with a destination address and
    its length: `sendto(int sockfd, const void *msg, int len, unsigned int
    flags, const struct sockaddr *to, socklen_t tolen)`.

    `recvfrom()` extends `recv()` with a place to record the sender:
    `recvfrom(int sockfd, void *buf, int len, unsigned int flags, struct
    sockaddr *from, int *fromlen)`. The kernel fills `from` with the source
    address and updates `fromlen` to the number of bytes it actually wrote.

    ### The Notional Machine: each packet carries its own address

    There is no connected channel holding the peer's identity. The destination
    travels with each outgoing call, and the source is reported on each
    incoming call. The socket object still owns the local port, but the remote
    endpoint is supplied per packet.

    ### Why sockaddr_storage

    The caller does not always know whether the next packet will come from
    IPv4 or IPv6. `struct sockaddr_storage` is large enough for either, and it
    can be cast to the specific type after the family is known. A
    `struct sockaddr_in` would be too small for an IPv6 peer. `struct sockaddr`
    itself is the generic pointer type, not a storage container.

    ### Connected datagrams

    If you call `connect()` on a datagram socket, the kernel remembers the
    destination and filters incoming packets to that peer. You can then use
    ordinary `send()` and `recv()` calls. The packets are still UDP datagrams;
    only the interface convenience changes.
  example:
    lang: c
    code: |
      #define _POSIX_C_SOURCE 200112L
      #include <stdio.h>
      #include <string.h>
      #include <sys/socket.h>
      #include <netinet/in.h>

      int main(void)
      {
          struct sockaddr_storage to;
          struct sockaddr_storage from;
          socklen_t tolen = sizeof to;
          socklen_t fromlen = sizeof from;

          memset(&to, 0, sizeof to);
          memset(&from, 0, sizeof from);

          printf("storage covers IPv4: %s\n",
                 tolen >= sizeof(struct sockaddr_in) ? "yes" : "no");
          printf("storage covers IPv6: %s\n",
                 tolen >= sizeof(struct sockaddr_in6) ? "yes" : "no");
          fromlen = sizeof(struct sockaddr_in);
          printf("fromlen reports actual size: %s\n",
                 fromlen == sizeof(struct sockaddr_in) ? "yes" : "no");
          return 0;
      }
    run_expected: |
      storage covers IPv4: yes
      storage covers IPv6: yes
      fromlen reports actual size: yes
    explain_md: |
      sockaddr_storage is wide enough for both concrete address types, which is
      why it is the safe buffer for sendto/recvfrom. tolen starts as the buffer
      capacity. fromlen follows the same convention: the caller passes capacity
      and the kernel replaces it with the actual address size.
    subgoals:
    - label: Reserve Family-Agnostic Address Storage
      lines:
      - 8
      - 9
      - 10
      - 11
      - 12
      - 13
    - label: Verify Capacity and Reported Length
      lines:
      - 15
      - 16
      - 17
      - 18
      - 19
      - 20
      - 21
    adapted: true
    note: 'Adapted from the chapter''s sendto/recvfrom snippets: fixed datagram text and a synthetic sender
      address, with printed byte counts.'
  checks:
  - kind: mcq
    q: What two extra pieces of information does sendto() need compared with send()?
    choices:
    - a local port number and a backlog
    - a receive buffer and a timeout value
    - a destination address and its length
    answer: 2
    why: An unconnected datagram socket has no remembered peer, so each sendto() names the destination
      sockaddr and its byte length. A local port is set by bind, and a receive buffer belongs to recv/recvfrom.
      (b11)
    concept: sendto-arguments
  - kind: fillblank
    q: Complete the sendto call so the destination length matches the storage.
    code: |
      struct sockaddr_storage to;
      memset(&to, 0, sizeof to);
      sendto(sockfd, msg, len, 0, (struct sockaddr *)&to, ____ to);
    answer_text: sizeof
    why: The final argument is the size of the destination address structure, so sizeof is correct. Passing
      len would describe the payload rather than the address, and passing &to again would be a pointer
      where a length is expected. (b11)
    concept: sendto-length
  - kind: mcq
    q: What does recvfrom() do with its fromlen argument?
    choices:
    - the caller passes capacity, and the kernel writes back the length
    - the caller passes the length, and the kernel writes back capacity
    - the kernel treats it as a millisecond timeout value
    answer: 0
    why: 'fromlen is an in/out parameter: initialize it to the buffer size before the call, and read it
      afterward to learn how many bytes the kernel stored. It is not a timeout. (b11)'
    concept: fromlen
  - kind: why-fails
    q: A dual-stack receiver passes a struct sockaddr_in * as recvfrom()'s from argument. Why can an incoming
      IPv6 datagram be misread or truncated?
    choices:
    - recvfrom refuses to run unless the buffer is an IPv4 buffer
    - sockaddr_in is too small, so the kernel cannot store the full peer
    - the kernel converts every IPv6 peer into IPv4 automatically
    answer: 1
    why: The from buffer must be large enough for the largest address the socket can receive. A sockaddr_in
      is too small for sockaddr_in6, so the peer address cannot be represented correctly. recvfrom is
      family-agnostic, and no automatic IPv6-to-IPv4 conversion happens here. (b11)
    concept: small-from-buffer
  - kind: choose-better
    q: A datagram receiver must work with both IPv4 and IPv6 peers. Which from buffer is better?
    choices:
    - sockaddr_in, because datagrams are always IPv4
    - a single char buffer sized to the whole payload
    - sockaddr_storage, because it can hold either family
    answer: 2
    why: sockaddr_storage is sized for any supported address family and can be cast after the family is
      known. sockaddr_in cannot hold IPv6, and a payload buffer is not an address structure. (b11)
    concept: storage-choice
  - kind: order
    q: Order the 5 correct steps for sending one datagram and learning who replied. One line is a distractor.
    lines:
    - fill a destination sockaddr and set its length
    - call sendto() with the payload and destination
    - prepare a sockaddr_storage and set fromlen to its size
    - call recvfrom() to receive a reply and the sender address
    - call bind() to connect the datagram socket to the peer
    - inspect the updated fromlen and family before casting
    answer_order:
    - 0
    - 1
    - 2
    - 3
    - 5
    distractor_why:
      call bind() to connect the datagram socket to the peer: bind() assigns a local address, not a remote
        peer; connecting a datagram socket would use connect(), not bind().
    hint: Which call supplies the destination for an unconnected datagram?
    why: Build the destination, send, prepare family-agnostic storage for the reply, receive, and then
      inspect the updated length and family. bind() does not connect a socket to a remote peer. (b11)
    concept: datagram-order
  - kind: why-fails
    q: A program calls connect() on a datagram socket and then uses send() and recv() successfully. Why
      is this allowed even though the socket is not a stream socket?
    choices:
    - connect() changes the datagram socket into a stream socket
    - connect() stores the peer, so datagram calls know the destination
    - send() and recv() work on every socket regardless of state
    answer: 0
    why: The socket remains a datagram socket, but connect() records the peer so send() knows the destination
      and recv() knows which source to accept. It does not become a stream socket, and send/recv on an
      unconnected datagram socket are not the ordinary path. (b11)
    concept: connected-datagram
  - kind: spot-bug
    q: The receiver forgets to initialize fromlen. Which line is the root cause of the failure, and why?
    code: |
      struct sockaddr_storage from;
      socklen_t fromlen;
      ssize_t n = recvfrom(sockfd, buf, sizeof buf, 0,
                           (struct sockaddr *)&from, &fromlen);
    diagnostic_log: |
      recvfrom: Bad address
      errno = EFAULT
    target_line: 2
    choices:
    - 'Line 1: sockaddr_storage is too small for a datagram'
    - 'Line 3: recvfrom requires an explicit timeout argument'
    - 'Line 2: fromlen has no valid capacity for the buffer'
    - 'Line 3: the cast to struct sockaddr * is illegal'
    answer: 2
    why: fromlen is an in/out parameter. Before the call it must describe how many bytes the from buffer
      can hold; an uninitialized value gives the kernel no valid capacity. The storage type is correct,
      recvfrom has no timeout argument, and the cast is the documented pattern. (b11)
    concept: fromlen-uninitialized
  - kind: eipe
    q: In one sentence, what are sendto() and recvfrom() FOR?
    choices:
    - they establish a reliable byte stream between two hosts
    - they convert host names into linked address lists
    - they move datagrams and name the destination or sender
    answer: 2
    why: These calls carry the per-packet address that an unconnected datagram socket lacks. Stream establishment
      belongs to connect(), and name resolution belongs to getaddrinfo(). (b11)
    concept: datagram-purpose
  common_bugs:
  - Passing a sockaddr_in where a dual-stack peer may be IPv6.
  - Leaving fromlen uninitialized before recvfrom().
- id: b12
  type: design
  title: Close or Shut Down Without Leaking the Descriptor
  explain_md: |
    `close(sockfd)` is the ordinary Unix descriptor close. It prevents further
    reads and writes on the socket, and the remote end sees an error when it
    tries to use the connection. The descriptor is released for reuse by the
    process.

    `shutdown(int sockfd, int how)` is the finer-grained tool. It changes what
    the socket can still do without releasing the descriptor. The `how` value
    selects a direction:

    | how | Effect |
    | --- | --- |
    | `SHUT_RD` (0) | further receives are disallowed |
    | `SHUT_WR` (1) | further sends are disallowed |
    | `SHUT_RDWR` (2) | further sends and receives are disallowed |

    ### The Notional Machine: usability versus ownership

    `shutdown()` changes the socket's usability flags in the kernel. The
    descriptor remains in the process's descriptor table, so you can still
    inspect or finally close it. `close()` removes the descriptor table entry.
    Calling `shutdown()` alone does not free the descriptor, and calling
    `close()` on a descriptor does not let you choose one direction.

    ### Choosing the tool

    Use `shutdown(SHUT_WR)` when you have finished sending but still want to
    read the peer's remaining response. Use `close()` when the whole
    conversation is over and you want to release the descriptor. On Windows
    with Winsock, the descriptor release call is `closesocket()` instead of
    `close()`.
  example:
    lang: c
    code: |
      #define _POSIX_C_SOURCE 200112L
      #include <stdio.h>
      #include <sys/socket.h>

      static const char *how_name(int how)
      {
          switch (how) {
          case SHUT_RD:   return "further receives disallowed";
          case SHUT_WR:   return "further sends disallowed";
          case SHUT_RDWR: return "further sends and receives disallowed";
          default:        return "unknown";
          }
      }

      int main(void)
      {
          printf("SHUT_RD: %s\n", how_name(SHUT_RD));
          printf("SHUT_WR: %s\n", how_name(SHUT_WR));
          printf("SHUT_RDWR: %s\n", how_name(SHUT_RDWR));
          return 0;
      }
    run_expected: |
      SHUT_RD: further receives disallowed
      SHUT_WR: further sends disallowed
      SHUT_RDWR: further sends and receives disallowed
    explain_md: |
      The helper maps each shutdown direction to its effect. SHUT_RD stops
      receiving, SHUT_WR stops sending, and SHUT_RDWR stops both. None of these
      calls releases the descriptor; close() performs that separate ownership
      step.
    subgoals:
    - label: Map Each Direction to Its Effect
      lines:
      - 6
      - 7
      - 8
      - 9
      - 10
      - 11
      - 12
      - 13
    - label: Compare the Three Directions
      lines:
      - 15
      - 16
      - 17
      - 18
      - 19
      - 20
      - 21
    adapted: true
    note: 'Adapted from the chapter''s shutdown example: a synthetic descriptor and printed direction
      names replace a live connection.'
  checks:
  - kind: mcq
    q: Which shutdown direction disallows further receives but still allows sends?
    choices:
    - SHUT_RD
    - SHUT_WR
    - SHUT_RDWR
    answer: 0
    why: SHUT_RD closes the receive direction only, so the program can still send. SHUT_WR is the opposite,
      and SHUT_RDWR stops both directions. (b12)
    concept: shutdown-read
  - kind: mcq
    q: Which shutdown direction disallows further sends but still allows receives?
    choices:
    - SHUT_RD
    - SHUT_WR
    - SHUT_RDWR
    answer: 1
    why: SHUT_WR stops the send direction while leaving receives available, which is useful for half-closing
      after a request. SHUT_RD stops receives, and SHUT_RDWR stops both. (b12)
    concept: shutdown-write
  - kind: fillblank
    q: Complete the call that stops both sending and receiving.
    code: |
      shutdown(sockfd, ____);
    answer_text: SHUT_RDWR
    why: SHUT_RDWR disallows both directions. SHUT_RD and SHUT_WR each stop only one direction, and close()
      would release the descriptor as well, which is a different operation. (b12)
    concept: shutdown-both
  - kind: why-fails
    q: A program calls shutdown(sockfd, SHUT_RDWR) and then exits without calling close(). Why is the
      descriptor not properly released?
    choices:
    - shutdown only works on unconnected datagram sockets here
    - shutdown automatically reopens the socket after one second
    - shutdown changes usability but leaves the descriptor in place
    answer: 2
    why: shutdown() changes what the socket may do; close() is the call that releases the descriptor.
      The two operations are distinct. shutdown is not limited to datagrams, and it does not reopen anything.
      (b12)
    concept: shutdown-not-close
  - kind: choose-better
    q: A client has finished sending a request but still expects a long response. Which action is better?
    choices:
    - close() the socket immediately, ending both directions
    - shutdown(SHUT_WR) to end sending, then recv the response
    - shutdown(SHUT_RD) to stop receiving the response
    answer: 0
    why: Half-closing the write side tells the peer that no more request bytes are coming while preserving
      the read side for the response. Closing ends both directions, and shutting down reads prevents the
      very data the client wants. (b12)
    concept: half-close-choice
  - kind: eipe
    q: In one sentence, what is shutdown() FOR?
    choices:
    - it releases the socket descriptor and frees its table entry
    - it changes which directions remain usable without closing
    - it queues incoming connections for a listening server
    answer: 1
    why: shutdown() controls directionality while the descriptor stays open. close() releases the descriptor,
      and listen() manages the connection queue. (b12)
    concept: shutdown-purpose
  - kind: choose-better
    q: A program is being ported from Unix to Windows Winsock. Which cleanup call is better there?
    choices:
    - close(sockfd) on the descriptor
    - shutdown(sockfd, SHUT_RDWR) only
    - closesocket(sockfd) on the descriptor
    answer: 2
    why: Winsock uses closesocket() to release a socket descriptor. close() is the Unix call, and shutdown()
      alone changes usability without releasing the descriptor. (b12)
    concept: winsock-close
  - kind: mcq
    q: What is the difference between close() and shutdown(sockfd, SHUT_RDWR)?
    choices:
    - close() stops only sends; shutdown releases the descriptor
    - close() releases the descriptor; shutdown keeps it
    - they are identical in every respect on all systems
    answer: 0
    why: close() removes the descriptor from the process table, while shutdown(SHUT_RDWR) stops both directions
      but leaves the descriptor in place. They overlap in effect on traffic but differ in ownership. (b12)
    concept: close-vs-shutdown
  common_bugs:
  - Calling shutdown() and assuming the descriptor was freed.
  - Using close() when only the write direction should be closed.
- id: b13
  type: syntax
  title: Identify the Peer and the Local Host
  explain_md: |
    `getpeername(int sockfd, struct sockaddr *addr, int *addrlen)` reports who
    is at the other end of a connected stream socket. The descriptor must
    already be connected. `addr` receives the peer's address, and `addrlen`
    starts as the capacity of that buffer and is updated with the actual
    length. The call returns `-1` on error and sets `errno`.

    Once you have the peer's address, `inet_ntop()` can format it, or a name
    service such as `getnameinfo()` can try to resolve it. The peer's login
    name is not part of the socket API; only network identity is available.

    `gethostname(char *hostname, size_t size)` is even simpler: it writes the
    local computer's name into the buffer. The name can then be passed to
    `getaddrinfo()` to discover the local machine's addresses. It returns `0`
    on success and `-1` on error.

    ### The Notional Machine: two directions of identity

    A connected socket already stores the local endpoint and the remote
    endpoint in the kernel. `getpeername()` reads the remote endpoint into
    your buffer. `gethostname()` asks the operating system for the machine's
    own name, independent of any socket. Neither call creates a connection or
    sends a packet.
  example:
    lang: c
    code: |
      #define _POSIX_C_SOURCE 200112L
      #include <stdio.h>
      #include <unistd.h>

      int main(void)
      {
          char hostname[256];

          if (gethostname(hostname, sizeof hostname) == -1) {
              printf("hostname lookup failed\n");
              return 1;
          }
          hostname[sizeof hostname - 1] = '\0';
          printf("hostname available: %s\n", hostname[0] != '\0' ? "yes" : "no");
          return 0;
      }
    run_expected: |
      hostname available: yes
    explain_md: |
      gethostname writes the machine name into the caller's buffer up to the
      given size. The explicit terminator guarantees a printable string even if
      the system filled the whole buffer. The returned name can later be passed
      to getaddrinfo to look up the local address.
    subgoals:
    - label: Ask for the Local Host Name
      lines:
      - 7
      - 8
      - 9
      - 10
      - 11
      - 12
    - label: Guarantee a Printable Result
      lines:
      - 13
      - 14
      - 15
    adapted: true
    note: 'Adapted from the chapter''s getpeername/gethostname snippets: synthetic peer data and a fixed
      local host name make the output deterministic.'
  checks:
  - kind: mcq
    q: What does getpeername() report?
    choices:
    - the local host's own machine name string
    - the other end's address on a connected socket
    - the number of bytes waiting to be received
    answer: 1
    why: getpeername reads the remote endpoint stored in a connected socket. The local machine name comes
      from gethostname(), and the byte count comes from recv() or an ioctl, not from getpeername(). (b13)
    concept: getpeername-role
  - kind: fillblank
    q: Complete the getpeername call so the buffer capacity is known.
    code: |
      struct sockaddr_storage peer;
      int addrlen = sizeof peer;
      getpeername(sockfd, (struct sockaddr *)&peer, &____);
    answer_text: addrlen
    why: The third argument is a pointer to the length so the kernel can read the capacity and write back
      the actual size. Passing addrlen by value would not let it update the variable. (b13)
    concept: getpeername-length
  - kind: mcq
    q: What does gethostname() return on success?
    choices:
    - the length of the copied host name
    - a pointer to a static name buffer
    - 0, because the call returns a status
    answer: 2
    why: gethostname returns 0 on success and -1 on error, setting errno. The name is written into the
      caller's buffer, not returned as a pointer, and the return value is not the name length. (b13)
    concept: gethostname-return
  - kind: why-fails
    q: A program calls getpeername() on a socket that has been created but not connected. Why does the
      call fail?
    choices:
    - getpeername only works on datagram socket types
    - there is no peer endpoint stored for this socket
    - the supplied address buffer is always too small
    answer: 0
    why: A peer name exists only after a connection associates the socket with a remote endpoint. An unconnected
      socket has none, so the kernel reports an error such as ENOTCONN. The call is not datagram-only,
      and the buffer size is a separate concern. (b13)
    concept: getpeername-unconnected
  - kind: choose-better
    q: A server has a peer address in a sockaddr_storage and wants to print the numeric address. Which
      next step is better?
    choices:
    - call getpeername() again to convert the address to text
    - inspect the family, cast the address, and call inet_ntop()
    - pass the storage directly to printf with a %s format
    answer: 1
    why: getpeername retrieves the address; it does not format it. The family tells you which concrete
      type to cast to, and inet_ntop produces the numeric text. A sockaddr_storage is binary data, not
      a C string. (b13)
    concept: peer-format
  - kind: order
    q: Order the 5 correct steps that obtain and print a connected peer's numeric address. One line is
      a distractor.
    lines:
    - declare a sockaddr_storage and initialize addrlen to its size
    - call getpeername() on the connected descriptor
    - inspect the returned family and cast to the matching sockaddr type
    - call inet_ntop() with the family and address field
    - call gethostname() to learn the peer's name
    - close the descriptor when finished
    answer_order:
    - 0
    - 1
    - 2
    - 3
    - 5
    distractor_why:
      call gethostname() to learn the peer's name: gethostname reports the local machine's name, not the
        remote peer's identity.
    hint: Which call reads the remote endpoint from the connected socket?
    why: Allocate family-agnostic storage, ask getpeername for the peer, cast by family, then format with
      inet_ntop. gethostname is local identity, not peer identity. (b13)
    concept: peer-order
  - kind: eipe
    q: In one sentence, what are getpeername() and gethostname() FOR?
    choices:
    - they create connections to a remote host and bind a local port
    - they send and receive datagrams on unconnected sockets
    - they read the peer's address and the local host name
    answer: 2
    why: getpeername reads the remote endpoint of an existing connection, and gethostname reads the local
      machine name. They do not create connections or move data. (b13)
    concept: identity-purpose
  - kind: why-fails
    q: A dual-stack program uses struct sockaddr_in as getpeername()'s address buffer. Why can the call
      fail to report an IPv6 peer correctly?
    choices:
    - getpeername requires a stream socket, not a datagram socket
    - sockaddr_in is too small to hold an IPv6 peer address
    - sockaddr_in is only valid for the local machine's address
    answer: 0
    why: The buffer must be large enough for the largest address the socket can return. sockaddr_storage
      is the family-agnostic choice; sockaddr_in cannot represent a 16-byte IPv6 peer. The structure does
      not change the socket type or restrict the peer to the local machine. (b13; sockaddr_storage is
      sized for either family)
    concept: peer-storage
    from_chapter: ch04
    from_block: b9
  common_bugs:
  - Calling getpeername() on an unconnected socket.
  - Passing addrlen by value instead of by address.
