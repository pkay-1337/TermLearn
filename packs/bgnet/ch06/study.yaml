- id: b4
  type: syntax
  title: Create a Socket Descriptor from a Lookup Record
  explain_md: |
    A lookup produces address records; `socket()` turns one record's family,
    socket type, and protocol into a file descriptor. The signature is
    `socket(int domain, int type, int protocol)`.

    The clean modern call feeds the three fields straight from the chosen
    `addrinfo` node: `socket(res->ai_family, res->ai_socktype,
    res->ai_protocol)`. That keeps the descriptor consistent with the address
    you will bind or connect to. Hard-coding `PF_INET`, `SOCK_STREAM`, `0`
    still works for IPv4, but it ignores what the resolver actually returned.

    ### PF versus AF

    `PF_INET` and `AF_INET` have the same numeric value on the systems this
    guide targets. The historical distinction was protocol family versus
    address family, but the two constants converged. The guide's stylistic
    rule is to use `AF_INET` in a `sockaddr_in` and `PF_INET` in the `socket()`
    call. In lookup-driven code you avoid the question by passing the fields
    from `res`.

    ### The Notional Machine: the kernel installs a handle

    `socket()` asks the kernel to create a socket object and return a small
    integer handle into the process's descriptor table. The call does not
    connect, bind, or send anything. It returns `-1` on failure and sets
    `errno`; a valid descriptor is a non-negative integer. Until you pass that
    handle to `bind()`, `connect()`, `listen()`, or `send()`, it does nothing
    useful.
  example:
    lang: c
    code: |
      #define _POSIX_C_SOURCE 200112L
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      #include <netdb.h>
      #include <sys/socket.h>

      int main(void)
      {
          struct addrinfo hints;
          struct addrinfo *res = NULL;
          int s;
          int status;

          memset(&hints, 0, sizeof hints);
          hints.ai_family = AF_UNSPEC;
          hints.ai_socktype = SOCK_STREAM;

          status = getaddrinfo("127.0.0.1", "3490", &hints, &res);
          if (status != 0) {
              printf("lookup failed: %s\n", gai_strerror(status));
              return 1;
          }

          s = socket(res->ai_family, res->ai_socktype, res->ai_protocol);
          printf("descriptor valid: %s\n", s != -1 ? "yes" : "no");
          if (s != -1) {
              close(s);
          }
          freeaddrinfo(res);
          return 0;
      }
    run_expected: |
      descriptor valid: yes
    explain_md: |
      The lookup returns at least one record for the loopback host. The three
      fields of that record are copied into socket(), so the descriptor's
      family and type match the address it will later use. The descriptor is
      closed on success, and the lookup list is released separately.
