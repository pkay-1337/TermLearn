    choices:
    - the kernel chooses an unused local port automatically
    - connect() fails because a local port is mandatory
    - the client reuses the server's local port number
    answer: 0
    why: The kernel checks whether the socket is unbound and binds it to an unused local port when connect()
      needs one. A client does not need to know or choose its local port, while a server needs a known
      port that clients can target. (b6)
    concept: client-auto-bind
  - kind: choose-better
    q: A server must accept connections on one specific local interface instead of every interface. Which
      setup is better?
    choices:
    - keep AI_PASSIVE and pass NULL as the node for the wildcard
    - drop AI_PASSIVE and pass the specific local address as node
    - keep AI_PASSIVE and call bind() twice, once per interface
    answer: 1
    why: AI_PASSIVE with NULL asks for the wildcard address. Naming the specific address in the node argument
      asks the resolver for that address, so bind() attaches only to it. Binding twice to the same socket
      is not the mechanism for selecting an interface. (b6)
    concept: specific-bind
- id: b7
  type: syntax
  title: Connect Without Binding Your Own Port
  explain_md: |
    A client uses `connect()` to attach a socket to a remote address. The
    signature is `connect(int sockfd, struct sockaddr *serv_addr, int
    addrlen)`. The descriptor comes from `socket()`, the address comes from a
    lookup record, and the length is that record's `ai_addrlen`.

    The client normally does not call `bind()`. Its local port does not matter
    to the application, so the kernel chooses an unused one during
    `connect()`. The remote peer learns the chosen port from the connection
    itself.

    ### The Notional Machine: a three-way handshake begins

    `connect()` asks the kernel to start establishing a stream connection to
    the destination. For a TCP stream socket the kernel performs the handshake
    and, on success, marks the descriptor as connected. The call returns `0`
    on success and `-1` on failure, with `errno` describing the problem. A
    non-zero return is not an address; it is an error indication.

    ### Trying candidates in order

    Because a lookup can return several records, real clients loop over the
    list, create a socket for each record, and try `connect()` until one
    succeeds. If a record's family is not usable on this host, skip it and
    try the next one. The code below shows that loop; it needs a live server
    to complete a connection, so it is a compile-ready skeleton rather than a
    runnable demo.
  example:
    lang: c
    code: |
      #define _POSIX_C_SOURCE 200112L
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      #include <netdb.h>
      #include <sys/socket.h>

      int main(int argc, char *argv[])
      {
          struct addrinfo hints;
          struct addrinfo *res = NULL;
          struct addrinfo *p;
          int sockfd = -1;
          int status;

          if (argc != 3) {
              fprintf(stderr, "usage: client host port\n");
              return 1;
          }

          memset(&hints, 0, sizeof hints);
          hints.ai_family = AF_UNSPEC;
          hints.ai_socktype = SOCK_STREAM;

          status = getaddrinfo(argv[1], argv[2], &hints, &res);
          if (status != 0) {
              fprintf(stderr, "getaddrinfo: %s\n", gai_strerror(status));
              return 2;
          }

          for (p = res; p != NULL; p = p->ai_next) {
              sockfd = socket(p->ai_family, p->ai_socktype, p->ai_protocol);
              if (sockfd == -1) {
                  continue;
              }
              if (connect(sockfd, p->ai_addr, p->ai_addrlen) == -1) {
                  close(sockfd);
                  sockfd = -1;
                  continue;
              }
              break;
          }

          freeaddrinfo(res);

          if (p == NULL) {
              fprintf(stderr, "failed to connect\n");
              return 2;
          }

          close(sockfd);
          return 0;
      }
    run_expected: |
      (no stdout on success; failure paths print to stderr:)
      usage: client host port
      getaddrinfo: <reason>
      failed to connect
    explain_md: |
      Each candidate record is tried in turn. A socket failure skips to the
      next record; a connect failure closes that descriptor and also advances.
      The loop breaks on the first success. The lookup list is released before
      the final check because it is no longer needed, while the connected
      descriptor stays open until close().
