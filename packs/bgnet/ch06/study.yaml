    - still listening for more connections
    - connected to the same client as new_fd
    - closed by the kernel after accept()
    - converted into a datagram socket
    answer: 0
    why: accept() leaves the original descriptor in listening mode while the new descriptor carries the
      client conversation. The listener is not closed and does not become the connected handle. (b9)
