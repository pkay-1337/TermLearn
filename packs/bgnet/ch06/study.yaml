- id: b6
  type: design
  title: Reuse a Lingering Port and Know When Bind Is Optional
  explain_md: |
    Two design decisions surround `bind()`. The first is port reuse. A
    connection that has just closed can leave the port unavailable for a
    short time. The kernel is protecting the old connection's state, not
    leaking it forever. You can either wait for the state to clear or ask for
    reuse before binding.

    The reuse request is `setsockopt(listener, SOL_SOCKET, SO_REUSEADDR,
    &yes, sizeof yes)` with `int yes = 1`. The option belongs on the listening
    socket, before `bind()`. Setting `yes` to `0` asks to disable reuse, which
    is the opposite of what a restarting server wants.

    ### The Notional Machine: a flag on the socket object

    `setsockopt()` writes an option into the socket object in the kernel. The
    option is consulted when `bind()` checks whether the requested port is
    available. It does not close existing connections and it does not let two
    live servers share the same port by magic; it relaxes the lingering-state
    rule.

    ### When bind is optional

    A client that only calls `connect()` does not need `bind()`. The kernel
    checks whether the socket is unbound and, if so, picks an unused local
    port for it. A server must bind because clients need a known port to
    connect to. This is a role distinction, not a syntax rule.
  example:
    lang: c
    code: |
      #define _POSIX_C_SOURCE 200112L
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      #include <netdb.h>
      #include <sys/socket.h>

      int main(void)
      {
          struct addrinfo hints;
          struct addrinfo *res = NULL;
          int listener;
          int yes = 1;
          int rc;

          memset(&hints, 0, sizeof hints);
          hints.ai_family = AF_UNSPEC;
          hints.ai_socktype = SOCK_STREAM;
          hints.ai_flags = AI_PASSIVE;

          if (getaddrinfo(NULL, "3490", &hints, &res) != 0) {
              printf("lookup failed\n");
              return 1;
          }

          listener = socket(res->ai_family, res->ai_socktype, res->ai_protocol);
          if (listener == -1) {
              printf("socket failed\n");
              freeaddrinfo(res);
              return 1;
          }

          rc = setsockopt(listener, SOL_SOCKET, SO_REUSEADDR, &yes, sizeof yes);
          printf("reuse address option: %s\n", rc == 0 ? "set" : "failed");

          close(listener);
          freeaddrinfo(res);
          return 0;
      }
    run_expected: |
      reuse address option: set
    explain_md: |
      `yes` is an int flag with value 1. setsockopt copies that value into the
      socket's option table under SOL_SOCKET/SO_REUSEADDR. The option is set
      before bind in a real server so the port-availability check honors it.
      The descriptor and lookup list are still released separately.
    subgoals:
    - label: Obtain the Listening Descriptor
