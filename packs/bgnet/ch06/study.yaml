    code: |
      sockfd = socket(...);      /* returns 3 */
      bind(sockfd, ...);
      listen(sockfd, 10);
      new_fd = accept(sockfd, ...); /* returns 4 */
      send(____, "hello", 5, 0);
    choices:
    - the original listening sockfd
    - the accepted new_fd descriptor
    - the integer descriptor 3
    - either descriptor is valid
    answer: 1
    why: new_fd is the connected channel to the client, so it is the descriptor for send(). The listening
      descriptor 3 has no client stream. The two descriptors are not interchangeable even though they
      refer to the same local port. (b9)
    concept: descriptor-choice
  - kind: trace
    q: Trace the two descriptors. Which value belongs in the target cell for the role of the original
      descriptor after accept()?
    code: |
      int sockfd = socket(...);
      bind(sockfd, ...);
