    answer: 0
    why: socket() creates the kernel object and returns its descriptor; it does not resolve names or move
      data. Resolution belongs to getaddrinfo, and data transfer belongs to send/recv or sendto/recvfrom.
      (b4)
    concept: socket-purpose
  - kind: spot-bug
    q: The program ignores socket()'s return value. Which line turns the error into a misleading failure
