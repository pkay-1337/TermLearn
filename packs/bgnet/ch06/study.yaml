  - Passing AF_UNSPEC to socket() instead of a concrete family from res.
- id: b5
  type: syntax
  title: Bind the Socket to a Local Port
  explain_md: |
    A socket descriptor alone has no local address. `bind()` attaches a
    `struct sockaddr` to it so the kernel can match incoming packets to this
    process. The signature is `bind(int sockfd, struct sockaddr *my_addr,
    int addrlen)`.

    The lookup-driven form is short: ask `getaddrinfo()` for the local
    address with `AI_PASSIVE`, create the socket from the record, then call
    `bind(sockfd, res->ai_addr, res->ai_addrlen)`. The record already contains
    the port and the wildcard address, so you do not pack fields by hand.

    ### What the kernel records

    The descriptor table entry gains a local address and port. Later,
    `listen()` uses that binding to decide which port's incoming connections
    belong to this socket. If two processes try to bind the same port, the
    second call fails with "Address already in use" and sets `errno`.

    ### Old-style packing and the wildcard

    Older code fills a `struct sockaddr_in` directly: set `sin_family`, store
    `htons(port)` in `sin_port`, store an address in `sin_addr.s_addr`, clear
    `sin_zero`, then cast the structure to `struct sockaddr *`. For a server
    that should accept on any local interface, use `INADDR_ANY` in IPv4 or
    `in6addr_any` in IPv6.

    ### Port rules

    Ports below 1024 are reserved for privileged processes. A normal program
    can bind ports from 1024 through 65535, provided no other socket is
    already using the port. A client that only calls `connect()` usually does
    not need `bind()` at all, because the kernel chooses an unused local port.
  example:
    lang: c
    code: |
      #define _POSIX_C_SOURCE 200112L
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      #include <netdb.h>
      #include <sys/socket.h>

      int main(void)
      {
          struct addrinfo hints;
          struct addrinfo *res = NULL;
          int sockfd;
          int status;

          memset(&hints, 0, sizeof hints);
          hints.ai_family = AF_UNSPEC;
          hints.ai_socktype = SOCK_STREAM;
          hints.ai_flags = AI_PASSIVE;

          status = getaddrinfo(NULL, "3490", &hints, &res);
          if (status != 0) {
              printf("lookup failed: %s\n", gai_strerror(status));
              return 1;
          }

          sockfd = socket(res->ai_family, res->ai_socktype, res->ai_protocol);
          if (sockfd == -1) {
              printf("socket failed\n");
              freeaddrinfo(res);
              return 1;
          }

          status = bind(sockfd, res->ai_addr, res->ai_addrlen);
          printf("bind succeeded: %s\n", status == 0 ? "yes" : "no");

          close(sockfd);
          freeaddrinfo(res);
          return 0;
      }
    run_expected: |
      bind succeeded: yes
    explain_md: |
      The passive lookup returns local addresses for port 3490. socket() turns
      the first record into a descriptor, and bind() copies the record's
      address into that descriptor's local endpoint. The descriptor and the
      lookup list are independent resources, so both are released.
