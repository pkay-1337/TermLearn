    - 'Line 2: printing the descriptor corrupts its value'
    - 'Line 4: connect() must always run before bind()'
    - 'Line 3: bind() receives -1 as a valid descriptor'
    answer: 3
    why: socket() returned -1, but the program passed that value to bind(). The kernel reports EBADF because
      -1 is not an open descriptor. The protocol field is valid, printing does not corrupt a descriptor,
      and a client would not call bind before connect in this sequence anyway. (b4)
