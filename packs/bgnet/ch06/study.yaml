  - kind: why-fails
    q: A program calls connect() but never checks its return value, then immediately calls send(). Why
      can send() fail with a broken-pipe or bad-descriptor error?
    choices:
    - send() requires the remote address as an extra argument
    - connect() may have failed, so the descriptor is not connected
    - connect() always closes the descriptor when it succeeds
    answer: 1
    why: A failed connect leaves the socket unconnected, and using it for stream I/O can fail. Checking
      for -1 and inspecting errno is the documented contract. send() does not take a destination on a
      connected stream socket, and connect() does not close a descriptor on success. (b7)
    concept: unchecked-connect
