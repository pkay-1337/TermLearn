    - call socket with the record family, type, and protocol
    answer: 2
    why: Copying the chosen record's fields follows the family the resolver actually returned. PF_INET
      forces IPv4, and AF_UNSPEC is not a concrete family for creating a socket. (b4)
    concept: socket-choice
  - kind: eipe
    q: In one sentence, what is socket() FOR?
    choices:
    - it resolves a host name into a linked list of addresses
    - it sends a buffer of bytes to a remote peer process
