      for (p = res; p != NULL; p = p->ai_next) {
          sockfd = socket(p->ai_family, p->ai_socktype, p->ai_protocol);
          if (sockfd == -1) continue;
          if (connect(sockfd, p->ai_addr, p->ai_addrlen) == -1) {
              close(sockfd);
              sockfd = -1;
              continue;
          }
          break;
      }
    choices:
    - close the failed socket and try the next record
    - break out of the loop with the failed socket open
    - call freeaddrinfo(res) inside the retry loop
    - return 0 because one socket was created
    answer: 0
    why: The failed connect enters the if body, closes the descriptor, resets it to -1, and continues
      to the next record. Breaking would keep an unconnected socket; freeing inside the loop would invalidate
      the list; creating a socket is not the success condition. (b7)
    concept: connect-retry
  - kind: choose-better
    q: Two clients handle connect() results differently. Which is better for a program that may run on
      a host with both IPv4 and IPv6?
    choices:
    - try only the first record and exit if connect fails
    - try each record, closing failed descriptors as you go
    - ignore connect()'s return value and send immediately
    answer: 0
    why: Trying each record handles hosts where the first family or address is unreachable. Exiting after
      one failure gives up too early, and ignoring the return uses a socket that may never have connected.
      (b7)
    concept: connect-strategy
  - kind: eipe
    q: In one sentence, what is connect() FOR?
    choices:
    - it assigns a local port so other hosts can connect
    - it connects the local socket to a remote address
    - it converts a host name into a list of sockaddr records
    answer: 1
    why: connect() is the client's setup step that targets a remote endpoint and begins the connection.
      Local port assignment belongs to bind() or to the kernel's automatic choice, and name resolution
      belongs to getaddrinfo(). (b7)
    concept: connect-purpose
  common_bugs:
  - Ignoring connect()'s -1 return and using an unconnected descriptor.
  - Trying only the first lookup record instead of looping over candidates.
- id: b8
  type: syntax
  title: Open the Listening Queue with listen()
  explain_md: |
    After a server binds its port, it calls `listen(int sockfd, int backlog)`.
    The call converts the descriptor from an ordinary bound socket into a
    listening socket: incoming connection requests can now be queued for it.
    `backlog` is the number of connections allowed to wait in the queue before
    the server accepts them.

    The queue is not the connection itself. A client can finish its handshake
    and wait in this queue while the server is busy. When the server calls
    `accept()`, it removes one pending connection from the queue. If the queue
    is full, new connection attempts may be refused or ignored, so the backlog
    is a capacity limit, not a promise of service.

    ### The Notional Machine: a door and a waiting line

    Think of the bound socket as a door at a known address. `listen()` installs
    the waiting line outside that door. The kernel owns the line; the server
    does not see individual clients until it accepts them. The original
    descriptor remains the door and keeps listening after each acceptance.

    ### Call order

    The server sequence is `getaddrinfo()`, `socket()`, `bind()`, `listen()`,
    then `accept()`. `listen()` must follow `bind()` because the kernel needs a
    local port to listen on. It returns `0` on success and `-1` on failure,
    setting `errno`.
  example:
    lang: c
    code: |
      #define _POSIX_C_SOURCE 200112L
      #include <stdio.h>
      #include <string.h>
      #include <unistd.h>
      #include <netdb.h>
      #include <sys/socket.h>

      #define MYPORT "3490"
      #define BACKLOG 10

      int main(void)
      {
          struct addrinfo hints;
          struct addrinfo *res = NULL;
          int sockfd;
          int status;

          memset(&hints, 0, sizeof hints);
          hints.ai_family = AF_UNSPEC;
          hints.ai_socktype = SOCK_STREAM;
          hints.ai_flags = AI_PASSIVE;

          if (getaddrinfo(NULL, MYPORT, &hints, &res) != 0) {
              printf("lookup failed\n");
              return 1;
          }

          sockfd = socket(res->ai_family, res->ai_socktype, res->ai_protocol);
          if (sockfd == -1) {
              printf("socket failed\n");
              freeaddrinfo(res);
              return 1;
          }

          if (bind(sockfd, res->ai_addr, res->ai_addrlen) == -1) {
              printf("bind failed\n");
              close(sockfd);
              freeaddrinfo(res);
              return 1;
          }

          status = listen(sockfd, BACKLOG);
          printf("listen succeeded: %s\n", status == 0 ? "yes" : "no");

          close(sockfd);
          freeaddrinfo(res);
          return 0;
      }
    run_expected: |
      listen succeeded: yes
    explain_md: |
      The lookup and bind give the socket a local port. listen() then tells the
      kernel to queue connection requests for that port; BACKLOG caps the line.
      The descriptor is still the listening door, not a connected channel. It is
      closed only after the server stops accepting.
