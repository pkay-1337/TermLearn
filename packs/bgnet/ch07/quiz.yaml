quiz:
- kind: mcq
  level: intro
  q: Which process normally initiates a client-server exchange?
  choices:
  - the server process sends the first request
  - the kernel process sends the first request
  - the client process sends the first request
  answer: 2
  why: |-
    The client starts the conversation by requesting a service. The server waits for requests, and the
    kernel provides transport services rather than acting as the application role. (b1)
  concept: quiz-client-role
- kind: mcq
  level: core
  q: When accept() succeeds, what does it return?
  choices:
  - the original listening descriptor
  - a new descriptor for the connection
  - the peer port number as an integer
  answer: 1
  why: |-
    accept removes one pending connection and returns a fresh descriptor for it. The listener stays
    separate, and the peer port goes into the optional address buffer. (b3)
  concept: quiz-accept-return
- kind: predict
  level: advanced
  q: Trace the fork branch. Which process prints the child message?
  code: |
    pid = fork();
    if (pid == 0) {
        puts("child message");
    } else {
        puts("parent message");
    }
  choices:
  - the child process prints the child message
  - the parent process prints the child message
  - both processes print the child message
  answer: 0
  why: |-
    fork returns 0 in the newly created child, so the pid == 0 branch runs there. The parent receives a
    positive PID and runs the else branch. (b1)
  concept: quiz-fork-branch
- kind: mcq
  level: intro
  q: Which call marks a bound stream socket ready to queue connections?
  choices:
  - listen()
  - connect()
  - accept()
  answer: 0
  why: |-
    listen() changes a bound socket into a listening socket and sets the backlog. accept() removes a
    connection, and connect() is the client call. (b2)
  concept: quiz-listen-role
- kind: fillblank
  level: core
  q: The server call that waits for and removes one pending connection is ____().
  code: |
    int new_fd = ____(sockfd, NULL, NULL);
  answer_text: accept
  why: |-
    accept() blocks until a connection is pending and returns a descriptor for it. listen() only opens
    the queue, and connect() is used by the client. (b3)
  concept: quiz-accept-call
- kind: why-fails
  level: advanced
  q: Why can a server that handles one client inline not accept a second client promptly?
  choices:
  - it closes the listening socket before the session
  - it stays inside the first session instead of returning
  - it forks a child for every accepted client
  answer: 1
  why: |-
    Inline handling keeps the process busy in the first session, so the accept loop does not run. The
    listener is still open, and forking would actually free the parent. (b3)
  concept: quiz-inline-server
- kind: mcq
  level: intro
  q: Which descriptor does the child close immediately after fork in the stream server?
  choices:
  - its copy of the listening socket
  - its copy of the accepted socket
  - both descriptor copies at once
  answer: 0
  why: |-
    The child serves one accepted connection and does not accept new clients, so it closes the listening
    copy. The accepted descriptor is the child's data channel and must stay open. (b3)
  concept: quiz-child-close
- kind: order
  level: core
  q: Order the 4 correct stream client steps. One line is a distractor.
  lines:
  - fill hints with the peer name and service
  - call getaddrinfo for the peer
  - create and connect a candidate socket
  - receive the greeting and close
  - call listen before connecting
  answer_order:
  - 0
  - 1
  - 2
  - 3
  distractor_why:
    call listen before connecting: listen() is a server operation; a client connects to a peer and never
      opens a listening queue.
  why: |-
    The client resolves the peer, creates a candidate socket, connects, then receives and closes. listen
    belongs to the server role. (b6)
  concept: quiz-client-order
- kind: trace
  level: advanced
  q: Trace the reaping loop. What value belongs in the target cell for reaped after waitpid returns 0?
  code: |
    int reaped = 0;
    while (waitpid(-1, NULL, WNOHANG) > 0) {
        reaped++;
    }
  trace:
    headers:
    - Step
    - waitpid return
    - reaped
    rows:
    - step: 1
      line: 2
      cells:
      - '1'
      - '3'
      - '1'
    - step: 2
      line: 2
      cells:
      - '2'
      - '4'
      - '2'
    - step: 3
      line: 2
      cells:
      - '3'
      - '0'
      - ???
  target:
    row: 2
    col: 2
  choices:
  - the value 3 (new child)
  - the value 2 (unchanged)
  - the value 0 (loop reset)
  - the value 4 (second PID)
  answer: 1
  why: |-
    A waitpid return of 0 fails the while condition, so the body does not run and reaped stays 2. The
    values 3 and 4 were earlier child PIDs, and reaped is never reset. (b4)
  concept: quiz-reap-trace
- kind: mcq
  level: intro
  q: Which description defines a zombie process?
  choices:
  - a child that is still running normally
  - a parent that stopped accepting clients
  - an exited child that has not been reaped
  answer: 2
  why: |-
    A zombie is an exited child whose status has not been collected. A running child is alive, and an
    idle parent is not a zombie. (b4)
  concept: quiz-zombie
- kind: mcq
  level: core
  q: What does get_in_addr() return for an AF_INET6 address?
  choices:
  - a pointer to the sin_addr field
  - a pointer to the sin6_addr field
  - a copy of the whole sockaddr
  answer: 1
  why: |-
    The helper sees AF_INET6 and casts to sockaddr_in6, returning sin6_addr. The sin_addr field is the
    IPv4 layout, and the helper returns a pointer rather than a copy. (b5)
  concept: quiz-get-in-addr
- kind: choose-better
  level: advanced
  q: A server logs peers from both IPv4 and IPv6. Which approach is better?
  choices:
  - one family switch returning the right address field
  - two separate servers, one per address family
  - cast every peer to sockaddr_in and print
  answer: 0
  why: |-
    A family switch handles both layouts in one code path. Splitting by family duplicates logic, and
    casting every peer to sockaddr_in corrupts IPv6 addresses. (b5)
  concept: quiz-peer-format
- kind: fillblank
  level: intro
  q: Which function turns a binary address into printable text?
  code: |
    inet_ntop(family, addr, text, sizeof text);
  answer_text: inet_ntop
  why: |-
    inet_ntop produces the text form of a binary address. inet_pton does the reverse, and getaddrinfo
    resolves names and services. (b5)
  concept: quiz-inet-ntop
- kind: predict
  level: core
  q: Trace inet_ntop on the address 192.0.2.33. What text is printed?
  code: |
    inet_pton(AF_INET, "192.0.2.33", &addr);
    inet_ntop(AF_INET, &addr, text, sizeof text);
    printf("%s\n", text);
  choices:
  - the text 0.0.0.0
  - the text 33.2.0.192
  - the text 192.0.2.33
  - an empty output line
  answer: 2
  why: |-
    inet_pton stores the four bytes in network order and inet_ntop formats the same family back to
    dotted-quad text. The address is not reversed, zeroed, or left blank. (b5)
  concept: quiz-ntop-predict
- kind: why-fails
  level: advanced
  q: Why is casting a sockaddr_storage to sockaddr_in without checking the family unsafe?
  choices:
  - the family may be IPv6 with a different layout
  - the address may be stored in network order
  - the buffer may be too small for a port
  answer: 0
  why: |-
    The family tag selects the layout; an IPv6 address read through sockaddr_in is misaligned. Network
    order is normal for both families, and sockaddr_storage is large enough. (b5)
  concept: quiz-family-cast
- kind: mcq
  level: intro
  q: Which call does a stream client use to reach a server?
  choices:
  - listen()
  - accept()
  - connect()
  answer: 2
  why: |-
    connect() establishes the client side of the connection. listen() and accept() are server-side
    calls. (b6)
  concept: quiz-client-connect
- kind: mcq
  level: core
  q: What does recv() returning 0 mean on a stream socket?
  choices:
  - the buffer is empty but the peer is alive
  - the peer has closed the connection
  - the call failed and errno is set
  answer: 1
  why: |-
    A zero return is the orderly-close signal. A live but empty connection would block, and an error
    returns -1 with errno set. (b6)
  concept: quiz-recv-zero
- kind: order
  level: advanced
  q: Order the 4 correct server steps after bind. One line is a distractor.
  lines:
  - call listen with a backlog
  - call accept for one client
  - fork a child process
  - close the accepted descriptor in the parent
  - call connect to the client
  answer_order:
  - 0
  - 1
  - 2
  - 3
  distractor_why:
    call connect to the client: |-
      The server does not connect to its client; it accepts the client and lets the child serve the
      accepted descriptor.
  why: |-
    After bind, the server listens, accepts, forks, and the parent closes the accepted descriptor.
    Connecting to the client reverses the roles. (b2, b3)
  concept: quiz-server-order
- kind: mcq
  level: intro
  q: Which socket type should a datagram listener create?
  choices:
  - SOCK_DGRAM type
  - SOCK_STREAM type
  - SOCK_RAW type
  answer: 0
  why: |-
    SOCK_DGRAM is the datagram type. SOCK_STREAM is for reliable byte streams, and SOCK_RAW bypasses
    normal transport framing. (b7)
  concept: quiz-dgram-type
- kind: fillblank
  level: core
  q: Which call receives a datagram while capturing its sender?
  code: |
    n = ____(fd, buf, sizeof buf, 0, &peer, &peerlen);
  answer_text: recvfrom
  why: |-
    recvfrom receives one datagram and writes the sender address into the supplied structure. recv does
    not report the sender, and accept is a stream call. (b7)
  concept: quiz-recvfrom
- kind: why-fails
  level: advanced
  q: Why is listen() unnecessary on a datagram listener?
  choices:
  - datagram sockets have no connection queue
  - datagram sockets cannot be bound to a port
  - datagram sockets already accept every packet
  answer: 0
  why: |-
    SOCK_DGRAM is connectionless, so there is no pending-connection queue for listen or accept. Datagram
    sockets can bind, and they do not accept connections at all. (b7)
  concept: quiz-dgram-listen
- kind: mcq
  level: intro
  q: Which call sends a datagram when the destination is given?
  choices:
  - send() call
  - sendto() call
  - connect() call
  answer: 1
  why: |-
    sendto takes the destination address on each call. send requires a fixed peer, and connect sets that
    peer rather than sending data. (b8)
  concept: quiz-sendto
- kind: predict
  level: core
  q: sendto() sends 5 bytes with no listener running. What does it normally return?
  choices:
  - 5, because the local send succeeded
  - -1, because no receiver exists
  - 0, because the packet was dropped
  answer: 0
  why: |-
    sendto returns the bytes accepted by the local kernel. With no listener, the packet is dropped
    later; the local call can still succeed. (b8)
  concept: quiz-sendto-no-listener
- kind: choose-better
  level: advanced
  q: A program sends one message to a known UDP server. Which design is better?
  choices:
  - create a stream socket and call listen()
  - create a datagram socket and call sendto()
  - create a datagram socket and call accept()
  answer: 1
  why: |-
    One message fits the datagram model, and sendto supplies the destination. A stream client would
    connect, not listen, and datagram sockets do not accept. (b8)
  concept: quiz-talker-design
- kind: mcq
  level: intro
  q: Why force both datagram programs to AF_INET6?
  choices:
  - to make UDP delivery much more reliable
  - to avoid calling bind on the client side
  - to match the listener and talker families
  answer: 2
  why: |-
    An unconnected datagram pair silently misses packets when the families differ. AF_INET6 does not add
    reliability, and avoiding bind is independent of family. (b8, b9)
  concept: quiz-family-match
- kind: mcq
  level: core
  q: What does connect() do on a datagram socket?
  choices:
  - it opens a reliable stream connection
  - it records a default peer address
  - it starts a listening queue for packets
  answer: 1
  why: |-
    Datagram connect sets a default peer so send and recv can be used, and the kernel filters other
    senders. It does not create a reliable stream or a listening queue. (b9)
  concept: quiz-dgram-connect
- kind: why-fails
  level: advanced
  q: Why does a connected UDP socket ignore packets from other senders?
  choices:
  - the kernel filters to the connected peer
  - recv refuses packets from unknown ports
  - the sender address is rewritten in transit
  answer: 0
  why: |-
    The connected peer is stored in the socket state, and the kernel discards nonmatching senders. recv
    has no separate filter, and addresses are not rewritten. (b9)
  concept: quiz-connected-filter
- kind: fillblank
  level: intro
  q: The value returned by fork() in the newly created child is ____.
  code: |
    pid = fork();
    if (pid == ____) {
        /* child code */
    }
  answer_text: '0'
  why: |-
    fork returns 0 in the child and the child PID in the parent. A negative value means fork failed.
    (b1)
  concept: quiz-fork-return
- kind: predict
  level: core
  q: Trace the parent branch after fork. What does the parent do next?
  code: |
    new_fd = accept(sockfd, NULL, NULL);
    pid = fork();
    if (pid > 0) {
        close(new_fd);
        /* next action */
    }
  choices:
  - it serves the new connection itself
  - it closes the listening socket
  - it returns to accept another client
  answer: 2
  why: |-
    The parent closes the accepted descriptor and returns to the listening loop. The child serves the
    connection, and the parent keeps its listener open. (b3)
  concept: quiz-parent-next
- kind: trace
  level: advanced
  q: Trace the child after fork. What value belongs in the target cell for the child's sockfd?
  code: |
    new_fd = accept(sockfd, NULL, NULL); /* returns 5 */
    pid = fork();
    if (pid == 0) {
        close(sockfd);
        serve(new_fd);
    }
  trace:
    headers:
    - Step
    - Line
    - Action
    - sockfd
    rows:
    - step: 1
      line: 1
      cells:
      - '1'
      - '1'
      - accept returns 5
      - '3'
    - step: 2
      line: 2
      cells:
      - '2'
      - '2'
      - fork copies table
      - '3'
    - step: 3
      line: 4
      cells:
      - '3'
      - '4'
      - child closes listener
      - ???
  target:
    row: 2
    col: 3
  choices:
  - the value -1 (closed)
  - the value 3 (still open)
  - the value 5 (new socket)
  - the value 0 (stdin)
  answer: 0
  why: |-
    The child closes its listening descriptor, so its sockfd entry becomes -1. The value 3 was the
    listener before the close, 5 is the accepted connection, and 0 is standard input. (b3)
  concept: quiz-child-trace
- kind: mcq
  level: intro
  q: What does SO_REUSEADDR allow a server to do?
  choices:
  - reuse one socket for every client
  - reopen a closed listening socket
  - rebind an address in TIME_WAIT
  answer: 2
  why: |-
    SO_REUSEADDR permits binding a local address that is still lingering in TIME_WAIT. It does not
    multiplex clients on one socket or reopen a descriptor. (b2)
  concept: quiz-reuseaddr
- kind: mcq
  level: core
  q: What does the backlog value passed to listen() control?
  choices:
  - the number of child processes
  - the pending-connection queue length
  - the size of each received message
  answer: 1
  why: |-
    The backlog is a hint for the accept queue length. It does not set a process count or a message
    size. (b2)
  concept: quiz-backlog
- kind: choose-better
  level: advanced
  q: A server must handle long sessions without blocking new accepts. Which design is better?
  choices:
  - fork a child and let the parent keep accepting
  - handle each session inside the accept loop
  - close the listener during each session
  answer: 0
  why: |-
    Forking moves the session into a child while the parent returns to accept. Inline handling blocks
    the loop, and closing the listener prevents new clients. (b3)
  concept: quiz-concurrency-design
- kind: mcq
  level: intro
  q: Which call reaps an exited child?
  choices:
  - the waitpid call
  - the fork call
  - the socket call
  answer: 0
  why: |-
    waitpid collects a child's exit status and clears the zombie. fork creates a child, and socket
    creates a descriptor. (b4)
  concept: quiz-waitpid
- kind: fillblank
  level: core
  q: Which waitpid flag makes the reaping loop non-blocking?
  code: |
    while (waitpid(-1, NULL, ____) > 0) {
        count++;
    }
  answer_text: WNOHANG
  why: |-
    WNOHANG tells waitpid to return immediately when no child is ready. WUNTRACED also reports stopped
    children but does not make the call non-blocking. (b4)
  concept: quiz-wnohang
- kind: predict
  level: advanced
  q: A SIGCHLD handler calls waitpid(-1, NULL, WNOHANG) and gets 0. What happens next?
  code: |
    while (waitpid(-1, NULL, WNOHANG) > 0) {
        count++;
    }
  choices:
  - the handler blocks for another child
  - the loop ends and the handler returns
  - the server exits with an error
  answer: 1
  why: |-
    A zero return means no child is ready, so the while condition is false. The handler returns instead
    of blocking, and the server keeps running. (b4)
  concept: quiz-wnohang-zero
- kind: mcq
  level: intro
  q: What must a datagram listener do before recvfrom()?
  choices:
  - bind a local address and port
  - call listen with a backlog
  - call accept for one packet
  answer: 0
  why: |-
    A datagram listener binds so the kernel knows where to deliver packets. listen and accept are
    stream-server operations and do not apply. (b7)
  concept: quiz-listener-bind
- kind: choose-better
  level: advanced
  q: A client exchanges several UDP packets with one server. Which design is better?
  choices:
  - call sendto for every outgoing packet
  - connect once, then use send and recv
  - call bind before every sendto call
  answer: 1
  why: |-
    A connected datagram socket fixes the peer once and simplifies repeated sends and receives.
    Repeating sendto is valid but noisier, and rebinding before each send is unnecessary. (b9)
  concept: quiz-connected-design
