      - step: 2
        line: 3
        cells:
        - '2'
        - '3'
        - write terminator
        - '13'
        - ???
    target:
      row: 1
      col: 4
    choices:
    - a null byte
    - the digit 1
    - the byte at 12
    - an unset byte
    answer: 0
    why: |-
      The assignment writes a null byte at index n, which is 13. The digit 1 is not written, index 12
      holds the last received byte, and the cell is no longer unset after the assignment. (b6)
    concept: recv-trace
  common_bugs:
  - Printing a received buffer without null-terminating it.
  - Assuming one recv() returns a complete application message.
- id: b7
  type: syntax
  title: Bind a Datagram Listener and Receive a Packet
  explain_md: |-
    A datagram listener uses `SOCK_DGRAM` . It creates a socket, binds it to a local address and port,
    and calls `recvfrom()` to receive one packet. There is no `listen()` and no `accept()` : datagram
    sockets are connectionless, so there is no connection queue to manage.

    ### recvfrom reports the sender

    `recvfrom()` fills the payload buffer and, when given an address buffer, writes the sender's address
    into it. The `addrlen` argument is an **in/out** value: initialize it to the capacity of the address
    buffer; the kernel writes back the actual length. This is how a server can reply to the sender.

    ### UDP is best effort

    A datagram may be lost, duplicated, or reordered. The listener cannot assume that every packet sent
    will arrive, and `recvfrom()` does not report a missing packet. It only returns data that actually
    arrived. Null-terminating the received bytes is the application's job when the payload is text.

    ### The Notional Machine: one packet per call

    Unlike a stream, a datagram socket preserves message boundaries at the API level: one `recvfrom()`
    returns one datagram (up to the buffer size). The sender's address travels with that packet, so the
    listener can identify and answer the sender without a prior connection.
  example:
    lang: c
    code: |
      #define _POSIX_C_SOURCE 200112L
      #include <stdio.h>
      #include <string.h>
      #include <arpa/inet.h>
      #include <sys/socket.h>
      #include <netinet/in.h>
      #include <unistd.h>

      int main(void)
      {
          int fd;
          struct sockaddr_in addr;
          struct sockaddr_in peer;
          socklen_t addrlen = sizeof addr;
          socklen_t peerlen = sizeof peer;
          char buf[100];
          ssize_t n;

          fd = socket(AF_INET, SOCK_DGRAM, 0);
          if (fd == -1) {
              return 1;
          }
          memset(&addr, 0, sizeof addr);
          addr.sin_family = AF_INET;
          addr.sin_addr.s_addr = htonl(INADDR_LOOPBACK);
          addr.sin_port = htons(0);
          if (bind(fd, (struct sockaddr *)&addr, sizeof addr) == -1) {
              return 1;
          }
          if (getsockname(fd, (struct sockaddr *)&addr, &addrlen) == -1) {
              return 1;
          }
          if (sendto(fd, "ping", 4, 0,
                     (struct sockaddr *)&addr, addrlen) != 4) {
              return 1;
          }
          n = recvfrom(fd, buf, sizeof buf - 1, 0,
                       (struct sockaddr *)&peer, &peerlen);
          if (n < 0) {
              return 1;
          }
          buf[n] = '\0';
          printf("received: %s\n", buf);
          printf("sender family: IPv4\n");
          close(fd);
          return 0;
      }
    run_expected: |
      received: ping
      sender family: IPv4
    explain_md: |-
      The program binds a UDP socket to an ephemeral loopback port, sends one datagram to itself, and
      receives it with recvfrom(). The sender address is written into peer and its length is updated in
      peerlen. The payload is null-terminated before printing, and the family check confirms the captured
      sender is IPv4.
    subgoals:
