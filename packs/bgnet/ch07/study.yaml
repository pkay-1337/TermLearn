    answer_text: peer
    why: |-
      Datagram connect() records a default peer address for later send and recv calls. It does not create
      a stream connection or a listening queue. (b9)
    concept: connected-peer
  - kind: order
    q: Order the 5 correct connected-datagram steps. One line is a distractor.
    lines:
    - create a SOCK_DGRAM socket
    - call connect with the peer address
    - use send and recv on the socket
    - close the socket
    - handle the unreliable delivery
    - call listen before sending
    answer_order:
    - 0
    - 1
    - 2
    - 3
    - 4
    distractor_why:
      call listen before sending: A connected datagram socket has no listening queue; listen() is a stream-server
        operation.
    hint: Which call belongs to a stream server and not to UDP?
    why: |-
      The datagram socket is created, connected to one peer, used with send/recv, closed, and still
      treated as unreliable. listen() does not apply. (b9)
    concept: connected-order
  - kind: why-fails
    q: |-
      A connected datagram socket calls recv() and receives a packet from a different sender. Why does
      that not happen?
    choices:
    - recv refuses packets from unknown ports
    - the kernel rewrites the sender address
    - connect filters the socket to one peer
    answer: 2
    why: |-
      For a connected datagram socket, the kernel discards packets that do not match the connected peer.
      recv itself has no separate sender filter, and the kernel does not rewrite the sender into the
      expected one. (b9)
    concept: connected-filter
  - kind: predict
    q: A connected UDP sender calls send() twice. What does the first send() do?
    choices:
    - it waits for the peer to call recv()
    - it sends to the connected peer address
    - it opens a new TCP connection first
    answer: 1
    why: |-
      connect() already stored the default peer, so send() uses that address. UDP send does not wait for a
      receiver, and it never opens a TCP connection. (b9)
    concept: connected-send
  - kind: choose-better
    q: A datagram client will exchange several packets with one server. Which design is better?
    choices:
    - connect once, then use send and recv
    - call sendto for every outgoing packet
    - call bind before every sendto call
    answer: 0
    why: |-
      A connected datagram socket fixes the peer once and simplifies repeated sends and receives.
      Repeating sendto is valid but noisier, and rebinding before every send is unnecessary and
      error-prone. (b9)
    concept: connected-design
  - kind: eipe
    q: In one sentence, what is a connected datagram socket FOR?
    choices:
    - it guarantees delivery over a UDP channel
    - it turns UDP into a reliable stream socket
    - it fixes one peer for repeated UDP messages
    answer: 2
    why: |-
      The benefit is a default peer and sender filtering, not reliability. UDP remains best effort, and a
      connected datagram socket is still not a stream. (b9)
    concept: connected-purpose
  - kind: mcq
    q: Why is a stream family mismatch easier to diagnose than a datagram mismatch?
    choices:
    - connect returns an error for the wrong family
    - stream sockets retry every address family
    - datagram sockets report every lost packet
    answer: 0
    why: |-
      A stream client calls connect and can see a failure, then try another candidate. An unconnected
      datagram send can succeed locally even when the receiver cannot accept that family, and UDP does not
      report lost packets. (b9)
    concept: family-diagnosis
  common_bugs:
  - Assuming connect() makes UDP reliable or performs a handshake.
  - Mixing address families in an unconnected datagram pair.
