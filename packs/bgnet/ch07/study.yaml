      connect-then-send path deterministic without external traffic.
  checks:
  - kind: mcq
    q: What happens when an IPv4 datagram client sends to an IPv6 listener?
    choices:
    - the listener converts the address family
    - the packet is silently not received
    - the client receives an immediate error
    answer: 1
    why: |-
      An unconnected datagram send has no handshake to reveal a family mismatch, so the packet simply does
      not arrive. The listener does not translate families, and sendto can succeed locally even when the
      destination cannot receive. (b9)
    concept: family-mismatch
  - kind: fillblank
    q: Calling connect() on a datagram socket sets a default ____.
    code: |
