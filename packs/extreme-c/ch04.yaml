meta: {book: extreme-c, chapter_id: ch04, title: 'Chapter 01 — Essential Features',
  source_ref: 'Ch.1 (Text/essential_features.xhtml)', level: intro, prereqs: [ch03]}
objectives:
  - 'Explain #define macro expansion (name replaced by value before compiling)'
  - 'Trace & (referencing) and * (dereferencing) through a pointer example'
  - 'Predict why C function calls cannot modify caller variables (pass-by-value only)'
  - 'Justify NULL over 0 and structures as design building blocks'
blocks:
  - id: b1
    type: syntax
    title: 'Macros: #define and expansion'
    explain_md: |
      Directives starting with `#` are for the preprocessor, never the compiler.
      A macro `#define ABC 5` has a name (`ABC`) and a value (`5`).
      In macro expansion the preprocessor replaces every `ABC` with `5` and
      deletes the directive line — the compiler only ever sees the generated code.
      Book proof: grep `#define` in Apache HTTP Server — macros are unavoidable,
      so you must be able to read them even if you rarely write them.
    example:
      lang: c
      adapted: false
      code: |
        #define ABC 5
        int main(int argc, char** argv) {
        int x = 2;
        int y = ABC;
        int z = x + y;
        return 0;
        }
    checks:
      - kind: fillblank
        q: 'Complete Example 1.1 from the book:'
        code: '#define ABC ___'
        answer_text: '5'
        why: 'After expansion every ABC becomes 5 (Code Box 1-2); the value is substituted before compiling.'
        concept: macro-expansion
      - kind: mcq
        q: 'What does the preprocessor do with `int y = ABC;`?'
        choices:
          - 'Replaces ABC with 5 and removes the #define line'
          - 'Compiles ABC as an integer constant'
          - 'Looks up ABC at runtime'
          - 'Leaves ABC for the linker to resolve'
        answer: 0
        why: 'Preprocessing substitutes the value and prepares a final source for the compiler (book § Preprocessor directives).'
        concept: macro-expansion
      - kind: why-fails
        q: 'A teammate wraps a 50-line algorithm in a function-like macro for performance. Why does the book push back?'
        choices:
          - 'Macros flatten into the translation unit — module boundaries are lost; if it can be a C function, write a function'
          - 'Macros always break the build'
          - 'Macros cannot accept arguments'
          - 'The preprocessor rejects macros longer than one line'
        answer: 0
        why: '§ Advantages/disadvantages: macros linearize code and destroy design modularity; prefer functions, align performance exceptions with the team.'
        concept: macro-design
      - kind: mcq
        q: 'Per the Preface, who gets the most from Extreme C?'
        choices:
          - 'Junior and intermediate C/C++ engineers'
          - 'Complete programming beginners'
          - 'Only compiler writers'
        answer: 0
        why: 'Preface, Who this book is for: juniors/intermediates aiming at senior roles.'
        concept: audience
        from_chapter: ch03
        from_block: preface
    common_bugs: ['treating a macro as a typed variable', 'expecting the compiler to see #define lines']
  - id: b2
    type: model
    title: 'Pointers: & takes, * reaches'
    explain_md: |
      A pointer is a variable holding a memory address. `int* ptr = 0;` starts null.
      `&var` (referencing operator) yields the address; `*ptr` (dereferencing
      operator) reads/writes the cell through the pointer — `*ptr = 200;` is
      exactly `var = 200;` once `ptr == &var`. Dereferencing a null pointer is
      undefined behavior and usually crashes. Rule from the book: ALWAYS
      initialize pointers at declaration — use `NULL`, never leave them bare.
    example:
      lang: c
      adapted: false
      code: |
        int main(int argc, char** argv) {
        int var = 100;
        int* ptr = 0;
        ptr = &var;
        *ptr = 200;
        return 0;
        }
    viz:
      kind: ascii-memory
      steps:
        - 'Stack: var=100 | ptr=0 (null, points nowhere)'
        - 'ptr = &var | ptr now holds the address of var'
        - '*ptr = 200 | write through ptr: var is now 200'
    checks:
      - kind: predict
        q: 'After `*ptr = 200;`, what is the value of `var`?'
        choices: ['100', '200', '0 (null)', 'undefined — the program crashed']
        answer: 1
        why: 'ptr holds &var, so *ptr aliases var; the store lands in var.'
        concept: dereference
      - kind: why-fails
        q: 'Why must you never dereference a pointer that still holds 0?'
        choices:
          - 'It is undefined behavior — a null pointer addresses no valid cell, usually a crash'
          - 'The compiler deletes the pointer for you'
          - 'It silently reads back 0, so it is harmless'
          - 'It frees the pointed-to memory'
        answer: 0
        why: 'Book § Syntax: a null pointer points nowhere; dereferencing it is undefined behavior.'
        concept: null-pointer
      - kind: micro-lab
        q: 'What does this print? Type the exact output.'
        code: |
          #include <stdio.h>
          int main(void) {
          int var = 100;
          int* ptr = 0;
          ptr = &var;
          *ptr = 200;
          printf("%d\n", var);
          return 0;
          }
        expect: '200'
        why: 'Same aliasing as Example 1.9; printf observes var after the store through ptr.'
        concept: dereference
    common_bugs: ['leaving pointers uninitialized', 'dereferencing null', 'confusing & and * roles']
  - id: b3
    type: syntax
    title: 'Pass-by-value: references are an illusion'
    explain_md: |
      C has ONLY pass-by-value. There are no references, so arguments are copied
      into the callee's locals — the caller variable cannot change, ever.
      Example 1.17 proves it: `func(x)` sets its local `a = 5`, yet `x` in main
      prints 3 before AND after. Apparent counter-examples (pointer arguments)
      are still pass-by-value: the ADDRESS is copied, and the callee mutates
      through it. Keep this mental model or later chapters will hurt.
    example:
      lang: c
      adapted: false
      code: |
        #include <stdio.h>
        void func(int a) {
        a = 5;
        }
        int main(int argc, char** argv) {
        int x = 3;
        printf("Before function call: %d\n", x);
        func(x);
        printf("After function call: %d\n", x);
        return 0;
        }
      run_expected: 'Before function call: 3\nAfter function call: 3'
    checks:
      - kind: order
        q: 'Put the execution order of Example 1.17 (drop the bogus line):'
        lines:
          - 'func(&x);'
          - 'int x = 3;'
          - 'func(x);'
          - 'printf("After function call: %d\n", x);'
        answer_order: [1, 2, 3]
        distractor_why:
          'func(&x);': 'func takes int, not int* — and C copies arguments anyway, so & changes nothing about the illusion'
        hint: 'Start with the declaration.'
        why: 'x is copied into func local a; the caller x stays 3 — reference passing is an illusion in C.'
        concept: pass-by-value
      - kind: predict
        q: 'What is the SECOND line of output of Example 1.17?'
        choices:
          - 'After function call: 3'
          - 'After function call: 5'
          - 'After function call: 0'
          - 'It fails to compile: cannot modify a'
        answer: 0
        why: 'func modified only its local copy a; x in main is untouched (Shell Box 1-10).'
        concept: pass-by-value
    common_bugs: ['believing C has pass-by-reference', 'expecting func(x) to change x']
  - id: b4
    type: design
    title: 'Structures and idiom: organize, and say NULL'
    explain_md: |
      Structures look simple but are the main building blocks of well-organized,
      more object-oriented C — with function pointers, their importance cannot
      be overstated (book intro). Idiom matters too: nullify with the `NULL`
      macro, not bare `0`, so readers can tell pointers from integers at a glance
      (Code Box 1-20). Small choices like this compound across a real codebase.
    example:
      lang: c
      adapted: true
      code: |
        struct point {
        int x;
        int y;
        };
        int main(void) {
        struct point p;
        p.x = 1;
        p.y = 2;
        return p.x + p.y - 3;
        }
    checks:
      - kind: eipe
        q: 'Which sentence best captures the chapter on structures?'
        choices:
          - 'Structures are the main building blocks for well-organized, more object-oriented C — with function pointers, their importance cannot be overstated'
          - 'Structures are syntax sugar with no design role'
          - 'Structures exist only to satisfy the ABI'
        answer: 0
        why: 'Book intro + structures section: simple syntax, load-bearing design role.'
        concept: structures-design
      - kind: choose-better
        q: 'Which null-initialization is better C, per the book?'
        choices:
          - 'char* ptr = NULL;'
          - 'char* ptr = 0;'
        answer: 0
        why: 'Use the NULL macro — it distinguishes pointers from plain integers (Code Box 1-20).'
        concept: null-idiom
      - kind: mcq
        q: 'How is Extreme C organized, per the Preface?'
        choices:
          - '7 parts, 23 chapters'
          - '3 parts, 12 chapters'
          - 'One part, 30 chapters'
        answer: 0
        why: 'Preface, What this book covers: 7 parts from building C projects to testing.'
        concept: book-map
        from_chapter: ch03
        from_block: preface
    common_bugs: ['using 0 instead of NULL', 'treating structs as passive data only']
cards:
  - {front: 'After macro expansion, what happens to `#define ABC 5` and `int y = ABC;`?', back: 'ABC is replaced by 5 everywhere; the directive line is removed before compiling.', concept: macro-expansion}
  - {front: 'What do `&var` and `*ptr` do?', back: '& yields the address of var; * accesses the cell a pointer points to.', concept: dereference}
  - {front: 'What is a null pointer, and what happens if you dereference one?', back: 'A pointer holding 0/NULL, pointing nowhere; dereferencing is undefined behavior, usually a crash.', concept: null-pointer}
  - {front: 'Does C have pass-by-reference?', back: 'No — only pass-by-value. Pointer arguments copy the address; the callee never gets the caller variable itself.', concept: pass-by-value}
  - {front: 'NULL vs 0 for pointers — which and why?', back: 'NULL: marks the variable as a pointer for readers (Code Box 1-20).', concept: null-idiom}
lab:
  title: 'Swap through pointers'
  prompt_md: |
    C copies arguments — so `swap(x, y)` can never work. Implement `swap`
    to exchange `*a` and `*b` with a temp variable, proving the one legal
    mutation path: through a copied ADDRESS. Expected run output: `7 3`.
  starter_c: |
    #include <stdio.h>
    void swap(int* a, int* b) {
    /* TODO: swap *a and *b using a temp variable */
    }
    int main(void) {
    int x = 3, y = 7;
    swap(&x, &y);
    printf("%d %d\n", x, y);
    return 0;
    }
  tests_sh: 'gcc -Wall -std=c99 starter.c -o t && ./t | grep -q "7 3"'
  hints:
    - 'Inside swap you only have a and b (addresses). Read *a and *b, write back swapped.'
    - 'int tmp = *a; *a = *b; *b = tmp;'
test:
  gates: [{needs: [b1, b2, b3, b4], min_quiz: 80}]
  final_checks:
    - kind: mcq
      q: 'After `ptr = &var; *ptr = 200;`, var equals?'
      choices: ['100', '200']
      answer: 1
      why: 'Dereference aliasing (Example 1.9).'
    - kind: mcq
      q: 'After `func(x)` where func sets its param to 5, x equals?'
      choices: ['3', '5']
      answer: 0
      why: 'Pass-by-value only (Example 1.17).'
