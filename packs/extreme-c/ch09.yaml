        choices:
          - 'Pass-by-value: the argument value is copied into the callee local parameter frame, leaving the caller variable unchanged'
          - 'Pass-by-reference: the function directly binds to the caller storage location'
          - 'Pass-by-name: the argument expression is re-evaluated inside the callee'
        answer: 0
        why: 'Principle: C supports strictly pass-by-value; caller variables remain unaltered unless an explicit address pointer is passed (Essential Features Example 1.17). Choices B and C do not exist in C.'
        concept: pass-by-value
