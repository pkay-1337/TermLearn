      choices:
        - 'Keep the struct definition in the .c file, expose an opaque pointer in public headers, and distribute as a shared library'
        - 'Place the struct in a public header and ask consumers to promise not to access internal fields'
      answer: 0
      why: 'Relying on programmer discipline fails. Enforcing incomplete types at the compiler boundary guarantees complete ABI protection.'
      concept: enterprise-encapsulation-standard
    - kind: eipe
      q: 'In one sentence, what fundamental problem does information hiding solve in modular software engineering?'
      choices:
        - 'It decouples consumers from internal implementation details, preventing code breaks when internal representations evolve'
        - 'It reduces the total number of CPU instruction cycles required to compile C source files'
        - 'It eliminates the need for pointers in memory management'
        - 'It compresses the size of compiled object files on physical storage'
      answer: 0
      why: 'Information hiding ensures clients depend on stable public interfaces rather than volatile internal implementation structures.'
      concept: information-hiding-principle
    - kind: spot-bug
      q: 'Analyze the code and AddressSanitizer report. Where is the bug and what principle was violated?'
      code: |
        struct list_t* l = list_malloc();
        list_init(l);
        list_destroy(l);
        list_add(l, 10);
        free(l);
      diagnostic_log: |
        ==52103==ERROR: AddressSanitizer: heap-use-after-free on address 0x604000000010
        WRITE of size 4 at 0x604000000010 thread T0
      target_line: 4
      choices:
        - 'Line 4: Calling list_add after list_destroy deallocated the internal buffer violates the object lifecycle'
        - 'Line 1: list_malloc failed to check for NULL return'
        - 'Line 2: list_init cannot be called after list_malloc'
        - 'Line 5: free called on already freed container'
      answer: 0
      why: 'list_destroy freed the internal items buffer. Invoking list_add on a destroyed object writes into deallocated heap memory.'
      concept: lifecycle-violation-bug
