        diagnostic_log: |
          ==49102==ERROR: AddressSanitizer: global-buffer-overflow on address 0x0000ffffffff
          READ of size 4 at 0x0000ffffffff thread T0
              #0 0x1092 in list_get list.c:30
              #1 0x1188 in reverse main.c:6
          Note: loop index i underflowed from 0 to 18446744073709551615
        target_line: 3
