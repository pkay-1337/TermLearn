  - id: b9
    type: algorithm
    title: 'Decouple builds and link swappable implementations'
    explain_md: |
      Information hiding through opaque types enables one of the most powerful architectural capabilities in software engineering: **independent module compilation and swappable implementations**.

      **Separate Compilation Mechanics**:
      Consider our List module split into files:
      - `list.h`: Contains public opaque declarations (`struct list_t;`, function prototypes).
      - `private.c`: Defines the full struct and implements functions (`list_malloc`, `list_add`, etc.).
      - `main.c`: The client driver containing `main()` and higher-level logic (e.g. `reverse()`).
      To build the system, we compile the source files independently using `gcc -c`:
      ```bash
      gcc -c private.c -o private.o
      gcc -c main.c -o main.o
      ```
      *Note*: We **never** compile header files directly. The declarations in `list.h` are expanded into `main.o` and `private.o` during preprocessing.

      **The Linking Phase and Symbol Resolution**:
      If you attempt to link `main.o` alone:
      ```bash
      gcc main.o -o ex6_3.out
      ```
      The linker (`ld`) aborts with errors: `undefined reference to 'list_malloc'`, `undefined reference to 'list_add'`.
      *Why?* The compiler accepted `main.c` because the header promised those functions existed. But `main.o` contains only unresolved symbol requests. The linker must join `main.o` with `private.o` to satisfy those promises:
      ```bash
      gcc main.o private.o -o ex6_3.out
      ```

      **Swapping Implementations Without Recompiling Clients**:
      Suppose we replace the fixed-array implementation in `private.c` with a high-performance doubly linked list in `private2.c`.
      - We compile `private2.c` to `private2.o`.
      - **`main.o` requires ZERO recompilation!** Because `main.o` depends strictly on the invariant public API, we simply relink:
        `gcc main.o private2.o -o ex6_3.out`
      - If packaged into a shared library (`.so`), the implementation can even be swapped at runtime without relinking (as taught in Chapter 3).

      **The Unsigned Loop Underflow Trap**:
      In the chapter's `reverse()` algorithm, code copies elements backward from `source` into `dest`.
      - Novices often write: `for (size_t i = list_size(source) - 1; i >= 0; i--)`
      - **CRITICAL BUG**: Because `size_t` is an **unsigned integer**, the condition `i >= 0` is **ALWAYS true**! When `i` reaches 0, executing `i--` underflows to `SIZE_MAX` (e.g. 18,446,744,073,709,551,615), creating an infinite loop that crashes with a segmentation fault!
      - **The Safe Idiom**: `for (size_t i = list_size(source); i-- > 0;)`: Here, `i` is decremented *before* the body executes, correctly terminating when `i` reaches 0 without underflow.
    example:
      lang: c
      adapted: true
      code: |
        #include <stdlib.h>
        typedef struct { size_t size; int items[10]; } list_t;
        int list_add(list_t* l, int v) {
          if (l->size >= 10) return -1;
          l->items[l->size++] = v;
          return 0;
        }
        int list_get(list_t* l, size_t i, int* out) {
          if (i >= l->size) return -1;
          *out = l->items[i];
          return 0;
        }
        void reverse_copy(list_t* s, list_t* d) {
          d->size = 0;
          for (size_t i = s->size; i-- > 0;) {
            int val;
            list_get(s, i, &val);
            list_add(d, val);
          }
        }
        int main(void) {
          list_t src = {0, {0}}, dst = {0, {0}};
          list_add(&src, 4); list_add(&src, 6); list_add(&src, 1); list_add(&src, 5);
          reverse_copy(&src, &dst);
          return (int)(dst.items[0] - 5);
        }
