cards:
  - front: 'When do objects exist in object-oriented programming, and what does code hold prior to that?'
    back: 'Objects exist strictly in RAM during program execution. Prior to runtime, code on disk holds static instructions (blueprints) to allocate, initialize, relate, and destroy them.'
    concept: objects-are-runtime
  - front: 'What is the precise distinction between an object attribute and object state?'
    back: 'An attribute is a designated parameter/slot (e.g. `color`); state is the specific set of values assigned to those attributes at any given moment.'
    concept: object-state
  - front: 'Why are immutable and stateless objects preferred in multithreaded systems?'
    back: 'Because their state cannot be altered after creation, eliminating data races during concurrent read access across multiple threads without locks.'
    concept: immutability
  - front: 'What defines a software domain, and why is its glossary critical?'
    back: 'A domain defines the functional boundaries and requirements of software. Its predetermined glossary ensures terminology matches the problem space and prevents complexity bloat.'
    concept: domain-glossary
  - front: 'How is a relationship between two objects represented in memory, and how does it affect state?'
    back: 'By storing referring attributes (pointers) inside the objects. Establishing or severing a link mutates the state of both participating objects.'
    concept: referring-attributes
  - front: 'What is referential integrity during object destruction?'
    back: 'The guarantee that no attribute references a non-existent or destroyed object. Incoming links must be severed before memory is deallocated to prevent dangling pointers.'
    concept: referential-integrity
  - front: 'What is the fundamental difference between object creation and object construction?'
    back: 'Creation allocates raw memory bytes (e.g. `malloc`); construction initializes those allocated attributes into a valid starting state.'
    concept: creation-vs-construction
  - front: 'Contrast prototype-based construction with class-based construction.'
    back: 'Prototype-based starts empty and dynamically adds attributes at runtime (existence precedes essence); class-based enforces a fixed, predesigned template compiled up front.'
    concept: class-based
  - front: 'Why does explicit encapsulation in C always create a new data type?'
    back: 'Because C uses `typedef struct` to package attributes, and types dictate the structural attributes that instances of that type will possess.'
    concept: explicit-encapsulation
  - front: 'What is the standard convention for behavior encapsulation in procedural C?'
    back: 'Write standalone functions prefixed with the class name (`car_`) that accept a pointer to the attribute struct (`car_t*`) as their first argument.'
    concept: behavior-signature
  - front: 'In C behavior encapsulation, do separate instances duplicate function code in memory?'
    back: 'No. Each instance has its own attribute struct in RAM, but all instances share the single copy of compiled behavior functions in the code segment (.text).'
    concept: instance-isolation
  - front: 'How does C++ translate member function calls like `car.Accelerate()` under the hood?'
    back: 'It rewrites the call to `Car::Accelerate(&car)`, passing the instance address into the hidden `this` pointer parameter.'
    concept: this-pointer-translation
  - front: 'How is information hiding achieved in C using opaque structures?'
    back: 'Declare `struct tag;` with no fields in the public header (incomplete type) and define the full struct solely inside the private `.c` implementation file.'
    concept: opaque-struct-declaration
  - front: 'Why can client code not call `sizeof` on an opaque struct declared in a header?'
    back: 'Because the struct is an incomplete type in client code; the compiler does not know its field layout and cannot compute its size at compile time.'
    concept: incomplete-sizeof
lab:
  lang: c
  title: 'Opaque list with private guards and reverse'
  prompt_md: |
    Implement an encapsulated, information-hiding List module in C that mirrors the chapter architecture.
    The module defines an internal fixed-size store (`MAX_SIZE 10`) hidden behind an opaque structure.
    
    You must implement four functions in `starter.c`:
    1. `int __list_is_full(list_t* l)`: Private guard returning 1 if `l->size == MAX_SIZE`, else 0.
    2. `int list_add(list_t* l, int v)`: Public behavior that appends `v` to `l->items` and increments `l->size`. Returns -1 if full, else 0.
    3. `int list_get(list_t* l, int i, int* o)`: Public behavior that checks if `0 <= i < l->size`. If valid, writes `l->items[i]` to `*o` and returns 0; else returns -1.
    4. `int reverse_list(list_t* s, list_t* d)`: Reverses elements from `s` into `d` using **ONLY** the public API (`list_clear`, `list_size`, `list_get`, `list_add`). Avoid unsigned loop underflow!
    
    When run, `main()` must output:
    ```
    [4 6 1 5 ]
    [5 1 6 4 ]
    ```
  starter_c: |
    #include <stdio.h>
    #define MAX_SIZE 10
    typedef struct { unsigned size; int items[10]; } list_t;
    int __list_is_full(list_t *l) { return 0; }
    int list_add(list_t *l, int v) { (void)l; (void)v; return -1; }
    int list_get(list_t *l, int i, int *o) { (void)l; (void)i; (void)o; return -1; }
    void list_clear(list_t *d) { d->size = 0; }
    unsigned list_size(list_t *s) { return s->size; }
    int reverse_list(list_t *s, list_t *d) { (void)s; (void)d; return -1; }
    void list_print(list_t *l) {
      printf("[");
      for (unsigned i = 0; i < l->size; i++) printf("%d ", l->items[i]);
      printf("]\n");
    }
    int main(void) {
      list_t a = {0, {0}}, b = {0, {0}};
      list_add(&a, 4); list_add(&a, 6); list_add(&a, 1); list_add(&a, 5);
      reverse_list(&a, &b);
      list_print(&a); list_print(&b);
      return 0;
    }
  tests_sh: 'gcc -Wall -std=c99 starter.c -o t && ./t | grep -q "\[4 6 1 5 \]" && ./t | grep -q "\[5 1 6 4 \]"'
  hints:
    - 'Where to look: implement only the four TODO function bodies; list_clear, list_size, list_print, and main are already complete.'
    - 'What rule applies: __list_is_full checks l->size == MAX_SIZE; list_get verifies 0 <= i && (unsigned)i < l->size.'
    - 'What shape: list_add stores at l->items[l->size++] and returns 0 on success; list_get writes *o = l->items[i] and returns 0.'
    - 'Bottom-out snippet for reverse_list: call list_clear(d); then loop for (unsigned i = list_size(s); i-- > 0;) { int val; list_get(s, (int)i, &val); list_add(d, val); } return 0;'
