          - "Line 2: list_clear does not free destination memory"
          - "Line 3: i >= 0 is tautologically true for unsigned size_t; decrementing 0 underflows to SIZE_MAX, inducing an out-of-bounds loop"
          - "Line 5: list_get result pointer must be allocated on the heap"
        answer: 1
        fix_code: "for (size_t i = list_size(src); i-- > 0;)"
        why: "size_t is unsigned; i >= 0 can never be false. When i reaches 0, i-- wraps to SIZE_MAX (18446744073709551615), crashing with out-of-bounds access."
