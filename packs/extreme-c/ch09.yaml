  - id: b8
    type: algorithm
    title: 'Manage lifecycle for heap-allocated opaque objects'
    explain_md: |
      Because client code cannot know the size of an opaque struct, instances **cannot be declared as regular stack variables** (`struct list_t list;` fails compilation). They must be allocated on the heap through a dedicated allocator function and managed via pointers.

      **The Two-Stage Allocation & Construction Sequence**:
      1. **Stage 1: Container Creation (`list_malloc`)**:
         `list_t* list_malloc() { return (list_t*)malloc(sizeof(list_t)); }`
         Allocates heap memory for the container struct itself (`sizeof(list_t)` is known inside `list.c`).
      2. **Stage 2: Attribute Construction (`list_init`)**:
         `void list_init(list_t* list) { list->size = 0; list->items = malloc(10 * sizeof(int)); }`
         Initializes attributes and allocates the internal dynamic storage array for items.

      **The Two-Stage Destruction & Deallocation Sequence**:
      Deallocating an object with internal dynamic resources requires the **exact reverse order**:
      1. **Stage 1: Attribute Destruction (`list_destroy`)**:
         `void list_destroy(list_t* list) { free(list->items); }`
         Releases internal buffers owned by the object.
      2. **Stage 2: Container Deallocation (`free(list)`)**:
         `free(list);`
         Releases the container struct memory back to the heap allocator.

      **The Memory Leak Trap**:
      If client code calls `free(list)` without calling `list_destroy(list)` first, the container struct is freed, but the internal buffer `list->items` remains allocated on the heap with **no remaining pointers referencing it**. This causes an irreversible **memory leak**.
    example:
      lang: c
      adapted: true
      code: |
        #include <stdlib.h>
        typedef struct { size_t size; int* items; } list_t;
        list_t* list_malloc(void) {
          return (list_t*)malloc(sizeof(list_t));
        }
        void list_init(list_t* l) {
          l->size = 0;
          l->items = (int*)malloc(10 * sizeof(int));
        }
        void list_destroy(list_t* l) {
          free(l->items);
          l->items = NULL;
        }
        int main(void) {
          list_t* l = list_malloc();
          list_init(l);
          list_destroy(l);
          free(l);
          return 0;
        }
      subgoals:
        - label: "Private Attribute Struct Layout"
          lines: [2]
        - label: "Allocate Opaque Struct Heap Container"
          lines: [3, 4, 5]
        - label: "Initialize Struct Attributes and Buffer"
          lines: [6, 7, 8, 9]
        - label: "Release Owned Internal Dynamic Buffer"
          lines: [10, 11, 12, 13]
        - label: "Full Two-Stage Allocation and Cleanup Lifecycle"
          lines: [15, 16, 17, 18]
    viz:
