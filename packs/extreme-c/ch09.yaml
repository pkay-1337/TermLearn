  - id: b6
    type: design
    title: 'Encapsulate behaviors using struct-pointer functions'
    explain_md: |
      An object is more than passive data—it is a capsule of **attributes** (data) and **behaviors** (methods).
      - In C++, classes explicitly bundle data members and member functions in a single syntax construct (`class Car { void Accelerate(); };`).
      - In C, structures **cannot contain functions**. Therefore, behavior encapsulation in C must be implemented through a deliberate, disciplined software engineering pattern: **Implicit Behavior Encapsulation**.

      **The C Behavior Encapsulation Pattern (Standardized in Linux, curl, OpenSSL)**:
      1. **Attribute Structure**: Define a struct type holding only the object attributes (e.g. `car_t`).
      2. **Behavior Functions**: Implement standalone C functions prefixed with the class name (e.g. `car_accelerate`, `car_brake`, `car_refuel`).
      3. **Instance Pointer as First Parameter**: Every behavior function **MUST** accept a pointer to the attribute struct as its first argument:
         `void car_accelerate(car_t* car);`
         This pointer allows the function to inspect and mutate the specific instance's attributes in caller memory.
      4. **Code vs. Data in RAM**: While each car object gets its own distinct `car_t` struct in memory, **all instances share the single compiled copy of behavior functions** in the code segment (`.text`).
      5. **Constructor and Destructor Functions**:
         - C provides no automatic constructors or destructors.
         - We define explicit functions: `car_construct(car_t* car, const char* name)` to initialize fields, and `car_destruct(car_t* car)` to release owned resources.

      **How C++ Translates Under the Hood**:
      When a C++ programmer writes `car.Accelerate()`, the C++ compiler transforms it directly into the procedural C equivalent:
      1. It looks up the function `Car::Accelerate(Car* this)`.
      2. It automatically injects the address of the caller (`&car`) into the implicit `this` pointer parameter (typically passed in CPU register `rdi` on x86-64).
      3. The method body operates on `this->speed` and `this->fuel`.

      **Automatic Destructors vs. Manual C Cleanup**:
      In C++, constructors (`Car()`) and destructors (`~Car()`) are first-class language constructs:
      - When a C++ stack object exits its enclosing scope, the compiler automatically emits a call to its destructor. This pattern—**RAII (Resource Acquisition Is Initialization)**—ensures that allocated memory, open file descriptors, and sockets are guaranteed to be released.
      - In C, there is zero automatic destruction. The developer must remember to explicitly call `car_destruct(&car)` before the object goes out of scope. If a C object owns heap allocations and the developer forgets the destructor call, memory leaks permanently.
    example:
      lang: c
      adapted: true
      code: |
        #include <string.h>
        typedef struct { char name[32]; double speed; double fuel; } car_t;
        void car_construct(car_t* c, const char* name) {
          strncpy(c->name, name, 31);
          c->name[31] = '\0';
          c->speed = 0.0;
          c->fuel = 0.0;
        }
        void car_refuel(car_t* c, double amount) { c->fuel = amount; }
        void car_accelerate(car_t* c) {
          if (c->fuel <= 0.0) return;
          c->speed += 0.05;
          c->fuel -= 1.0;
          if (c->fuel < 0.0) c->fuel = 0.0;
        }
        void car_destruct(car_t* c) { (void)c; }
        int main(void) {
          car_t car;
          car_construct(&car, "Renault");
          car_refuel(&car, 10.0);
          car_accelerate(&car);
          car_destruct(&car);
          return 0;
        }
