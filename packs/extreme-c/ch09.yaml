        q: 'A programmer writes a countdown loop as `for (size_t i = size - 1; i >= 0; i--)`. Why does this loop never terminate?'
        choices:
          - 'Because `size_t` is an unsigned integer type, `i >= 0` is mathematically always true; decrementing 0 underflows to `SIZE_MAX`, causing an infinite loop'
          - 'The compiler disallows decrement operations on `size_t` variables'
          - 'The loop index `i` is automatically reset to `size` on each iteration'
        answer: 0
        why: 'Principle: unsigned integer underflow makes i >= 0 an infinite loop; the safe countdown pattern is `for (size_t i = size; i-- > 0;)` (Ch.6 Reverse loop caveat). Choices B and C are false.'
        concept: unsigned-loop-underflow
