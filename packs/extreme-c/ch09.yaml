    checks:
      - kind: spot-bug
        q: "Analyze the reverse loop and runtime crash report. Which line triggers the segmentation fault, and why?"
        code: |
          int reverse(struct list_t* src, struct list_t* dst) {
            list_clear(dst);
            for (size_t i = list_size(src) - 1; i >= 0; i--) {
              int item;
              list_get(src, i, &item);
              list_add(dst, item);
            }
            return 0;
