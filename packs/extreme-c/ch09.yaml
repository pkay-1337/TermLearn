  - id: b7
    type: design
    title: 'Enforce information hiding with incomplete opaque structs'
    explain_md: |
      Encapsulation bundles attributes and behaviors into a capsule; **Information Hiding** restricts visibility into that capsule from the outer world.

      **The Danger of Leaking Implementation Details**:
      In Example 6.1, `main()` was able to directly read and modify `car.fuel` and `car.speed` because the struct fields were declared openly in the header file. This makes all attributes **public**.
      - **Tight Coupling**: If consumer code directly accesses internal fields, it becomes coupled to your exact implementation choices.
      - **Breaking Backward Compatibility**: If you later decide to calculate speed from wheel RPM or change `fuel` from a `double` to an integer percentage, every line of external client code will fail to compile.
      - **Golden Rule**: Treat all attributes and internal helper functions as **private by default**. Expose only the minimal necessary public API.

      **The Opaque Struct Technique in C**:
      How can C hide struct attributes when C lacks `private` and `public` access keywords? The solution is the **opaque pointer pattern** (incomplete type):
      1. **Public Header (`list.h`)**:
         - Declare the struct tag with **no fields**: `struct list_t;`
         - This introduces `struct list_t` as an **incomplete type**. The compiler knows the tag exists, but does not know its size or field layout.
         - Declare public behavior prototypes taking pointers: `int list_add(struct list_t* list, int item);`.
      2. **Private Source (`list.c`)**:
         - Define the full structure definition: `typedef struct { size_t size; int* items; } list_t;`.
         - Only code inside `list.c` knows the field layout.
      3. **Why `list_malloc()` Is Mandatory**:
         - Client code (`main.c`) includes `list.h`. Because `struct list_t` is incomplete in `main.c`, client code **CANNOT** write `sizeof(struct list_t)` or `malloc(sizeof(struct list_t))`—the compiler emits an error because the byte size is unknown!
         - Therefore, the module must export an allocation function (`struct list_t* list_malloc(void);`) defined inside `list.c` where `sizeof(list_t)` is known.
      4. **Private Behaviors**:
         - Internal helpers like `__list_is_full` and `__check_index` are prefixed with `__`, defined solely inside `list.c`, and completely omitted from `list.h`.
    example:
      lang: c
      adapted: true
      code: |
        #include <stddef.h>
        struct list_t;
        struct list_t* list_malloc(void);
        void list_init(struct list_t* l);
        void list_destroy(struct list_t* l);
        int list_add(struct list_t* l, int item);
        int list_get(struct list_t* l, int index, int* out);
        void list_clear(struct list_t* l);
        size_t list_size(struct list_t* l);
      subgoals:
