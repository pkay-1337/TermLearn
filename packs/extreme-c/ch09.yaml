  - id: b7
    type: model
    title: 'Bridge procedural execution to object-oriented models'
    explain_md: |
      A profound question emerges in system programming: **Why is C not an object-oriented language?**
      The answer is not historical age. The real reason is architectural:
      - Human programmers naturally conceptualize complex systems in terms of **object-oriented models** (entities, boundaries, relationships).
      - The physical CPU, however, executes purely **procedural machine instructions**: loading registers, performing arithmetic, branching, and jumping to subroutine memory addresses.
      - **C occupies the critical boundary layer** between human object-oriented abstractions and procedural hardware execution. Without a language at this boundary, high-level object-oriented languages (C++, Java JVM, Python) could not translate their abstract models down to machine execution.

      **How C++ Implements OOP Under the Hood**:
      When you write C++ code like `car.Accelerate()`, the C++ compiler transforms it directly into the procedural C equivalent:
      1. It looks up the function `Car::Accelerate(Car* this)`.
      2. It automatically injects the address of the caller (`&car`) into the implicit **`this` pointer** parameter (typically passed in CPU register `rdi` on x86-64).
      3. The method body operates on `this->speed` and `this->fuel`.

      **Automatic Destructors vs. Manual C Cleanup**:
      In C++, constructors (`Car()`) and destructors (`~Car()`) are first-class language constructs:
      - When a C++ stack object exits its enclosing scope, the compiler **automatically emits a call to its destructor**. This pattern—**RAII (Resource Acquisition Is Initialization)**—ensures that allocated memory, open file descriptors, and sockets are guaranteed to be released.
      - In C, **there is zero automatic destruction**. The developer must remember to explicitly call `car_destruct(&car)` before the object goes out of scope. If a C object owns heap allocations and the developer forgets the destructor call, memory leaks permanently.
    example:
      lang: c
      adapted: true
      code: |
        typedef struct { int dummy; } car_t;
        void car_destruct(car_t* c) { (void)c; }
        int main(void) {
          car_t c;
          car_destruct(&c);
          return 0;
        }
    viz:
      kind: ascii-memory
      steps:
        - 'High-Level OOP (C++): car.Accelerate() -> clean human-centric syntax'
        - 'Compiler Translation: Car::Accelerate(Car* const this = &car) -> injects implicit pointer'
        - 'Procedural C Equivalent: car_accelerate(&car) -> explicit address passing'
        - 'Machine Code: mov rdi, [rsp+8]; call car_accelerate -> raw CPU subroutine jump'
    checks:
      - kind: eipe
        q: 'High-level OOP languages translate `object.method(arg)` into `func(object_ptr, arg)` at compile time. In one sentence, what is C situated on this boundary FOR?'
        choices:
          - 'C acts as the foundational structural layer that bridges human object-oriented mental models into procedural CPU instructions'
          - 'C forces all programmers to avoid object-oriented thinking permanently'
          - 'C was designed exclusively to simulate electronic vacuum tubes'
        answer: 0
        why: 'Principle: C sits on the barrier between object orientation and procedural CPU execution, providing the low-level translation bridge for high-level languages (Ch.6 C is not object-oriented). Choices B and C are absurd.'
        concept: c-as-boundary
      - kind: why-fails
        q: 'A C developer allocates internal heap memory inside an object constructor but forgets to call the object destructor before the stack frame exits. Why does this defect not happen automatically in C++?'
        choices:
          - 'C++ enforces RAII by automatically invoking the destructor `~Car()` whenever a stack object exits its enclosing scope, whereas C lacks language-level destructor triggers'
          - 'C++ operating systems run garbage collectors on all raw C pointers'
          - 'C memory leaks are automatically repaired by the CPU hardware'
        answer: 0
        why: 'Principle: C++ automatically invokes destructors on stack unwinding (RAII); C lacks automatic destructor triggers, making manual destructor invocation mandatory to prevent leaks (Ch.6 Code Box 6-12 notes). Choices B and C describe non-existent mechanisms.'
        concept: raii-vs-manual-destruct
      - kind: predict
        q: 'In C++, `car.Accelerate()` is called. What does the compiler pass under the hood as the implicit `this` pointer?'
        choices:
          - 'The memory address of the calling instance `&car`'
          - 'A copy of the string name of the car'
          - 'A null pointer'
        answer: 0
        why: 'Principle: member function calls in C++ pass the address of the invoking instance as the hidden this pointer, exactly mirroring car_accelerate(&car) in C (Ch.6 Code Box 6-11 notes). Choice B and C are incorrect.'
        concept: this-pointer-translation
    common_bugs:
      - 'Forgetting to explicitly call destructor functions in C before instances leave scope'
      - 'Assuming that C++ member functions incur runtime overhead compared to passing a C struct pointer'
  - id: b8
    type: design
    title: 'Hide private state behind opaque struct headers'
    explain_md: |
      Encapsulation bundles attributes and behaviors into a capsule; **Information Hiding** restricts visibility into that capsule from the outer world.

      **The Danger of Leaking Implementation Details**:
      In Example 6.1, `main()` was able to directly read and modify `car.fuel` and `car.speed` because the struct fields were declared openly in the header file. This makes all attributes **public**.
      - **Tight Coupling**: If consumer code directly accesses internal fields, it becomes coupled to your exact implementation choices.
      - **Breaking Backward Compatibility**: If you later decide to calculate speed from wheel RPM or change `fuel` from a `double` to an integer percentage, every line of external client code will fail to compile.
      - **Golden Rule**: Treat all attributes and internal helper functions as **private by default**. Expose only the minimal necessary public API.

      **The Opaque Struct Technique in C**:
      How can C hide struct attributes when C lacks `private` and `public` access keywords?
      The solution is the **opaque pointer pattern (incomplete type)**:
      1. **Public Header (`list.h`)**:
         - Declare the struct tag with **no fields**: `struct list_t;`
         - This introduces `struct list_t` as an **incomplete type**. The compiler knows the tag exists, but does not know its size or field layout.
         - Declare public behavior prototypes taking pointers: `int list_add(struct list_t* list, int item);`.
      2. **Private Source (`list.c`)**:
         - Define the full structure definition: `typedef struct { size_t size; int* items; } list_t;`.
         - Only code inside `list.c` knows the field layout.
      3. **Why `list_malloc()` Is Mandatory**:
         - Client code (`main.c`) includes `list.h`. Because `struct list_t` is incomplete in `main.c`, client code **CANNOT** write `sizeof(struct list_t)` or `malloc(sizeof(struct list_t))`—the compiler emits an error because the byte size is unknown!
         - Therefore, the module must export an allocation function (`struct list_t* list_malloc(void);`) defined inside `list.c` where `sizeof(list_t)` is known.
      4. **Private Behaviors**:
         - Internal helpers like `__list_is_full` and `__check_index` are prefixed with `__`, defined solely inside `list.c`, and completely omitted from `list.h`.
    example:
      lang: c
      adapted: true
      code: |
        #include <stdlib.h>
        struct list_t;
        struct list_t* list_malloc(void);
        void list_free(struct list_t* l);
        typedef struct list_impl {
          size_t size;
          int items[10];
        } list_t;
        list_t* my_list_malloc(void) {
          return (list_t*)malloc(sizeof(list_t));
        }
        int main(void) {
          list_t* l = my_list_malloc();
          free(l);
          return 0;
        }
    viz:
      kind: ascii-memory
      steps:
        - 'Public Header (main.c view): struct list_t; -> Incomplete Type (fields hidden, size unknown)'
        - 'Pointer Legal: struct list_t* ptr; is allowed (pointer size is always 8 bytes on 64-bit)'
        - 'Field Access / sizeof Illegal: ptr->size and sizeof(struct list_t) fail compilation'
        - 'Private Source (list.c view): struct list_t { size_t size; int* items; } fully defined'
    checks:
      - kind: fillblank
        q: 'Complete the forward declaration in a public header that declares an opaque struct type named `list_t` without exposing its fields: `______ list_t;`'
        code: '______ list_t;'
        answer_text: struct
        why: 'Rule: forward declaring `struct tag;` introduces an incomplete type, allowing external code to handle pointers without exposing internal attributes (Code Box 6-13).'
        concept: opaque-struct-declaration
      - kind: why-fails
        q: 'Client code includes an opaque header declaring `struct list_t;` and attempts to execute `malloc(sizeof(struct list_t))`. Why does the compiler reject this?'
        choices:
          - '`struct list_t` is an incomplete type in client code, so `sizeof` cannot compute its byte size at compile time'
          - 'The `malloc` function cannot allocate memory for structures in C'
          - 'Client code is prohibited from calling standard library functions'
        answer: 0
        why: 'Principle: sizeof requires a complete type definition; because fields are hidden in list.c, client code cannot determine struct size and must use a provider allocation function like list_malloc() (Ch.6 Information hiding; Code Box 6-13 notes). Choices B and C are false.'
        concept: incomplete-sizeof
      - kind: predict
        q: 'Client code includes an opaque header containing `struct list_t;` and attempts: `struct list_t* l = list_malloc(); l->size = 0;`. What happens at compile time?'
        choices:
          - 'Compilation fails with an error: dereferencing pointer to incomplete type `struct list_t`'
          - 'Compilation succeeds and writes 0 into the first struct field'
          - 'The compiler automatically creates a global variable named size'
        answer: 0
        why: 'Principle: client code has no access to struct members of an incomplete type, guaranteeing true information hiding at compile time (Ch.6 Information hiding). Choice B and C violate compiler type checking.'
        concept: opaque-field-protection
      - kind: choose-better
        q: 'Which approach best preserves backward compatibility when designing a reusable library module in C?'
        choices:
          - 'Declare an opaque struct in the header and provide allocation/accessor functions, keeping all fields private in the .c file'
          - 'Declare all struct fields openly in the public header so clients can directly read and mutate internal data'
        answer: 0
        why: 'Principle: hiding implementation behind opaque structs insulates clients from internal layout changes, preserving backward compatibility (Ch.6 Information hiding). Option B couples clients to internal representation.'
        concept: public-api-design
    common_bugs:
      - 'Attempting to evaluate `sizeof` on an opaque incomplete struct in client code'
      - 'Exposing internal helper functions or struct fields in public headers, creating tight external coupling'
  - id: b9
    type: algorithm
    title: 'Decouple builds and link swappable implementations'
    explain_md: |
      Information hiding through opaque types enables one of the most powerful architectural capabilities in software engineering: **independent module compilation and swappable implementations**.

      **Separate Compilation Mechanics**:
      Consider our List module split into files:
      - `list.h`: Contains public opaque declarations (`struct list_t;`, function prototypes).
      - `private.c`: Defines the full struct and implements functions (`list_malloc`, `list_add`, etc.).
      - `main.c`: The client driver containing `main()` and higher-level logic (e.g. `reverse()`).
      To build the system, we compile the source files independently using `gcc -c`:
      ```bash
      gcc -c private.c -o private.o
      gcc -c main.c -o main.o
      ```
      *Note*: We **never** compile header files directly. The declarations in `list.h` are expanded into `main.o` and `private.o` during preprocessing.

      **The Linking Phase and Symbol Resolution**:
      If you attempt to link `main.o` alone:
      ```bash
      gcc main.o -o ex6_3.out
      ```
      The linker (`ld`) aborts with errors: `undefined reference to 'list_malloc'`, `undefined reference to 'list_add'`.
      *Why?* The compiler accepted `main.c` because the header promised those functions existed. But `main.o` contains only unresolved symbol requests. The linker must join `main.o` with `private.o` to satisfy those promises:
      ```bash
      gcc main.o private.o -o ex6_3.out
      ```

      **Swapping Implementations Without Recompiling Clients**:
      Suppose we replace the fixed-array implementation in `private.c` with a high-performance doubly linked list in `private2.c`.
      - We compile `private2.c` to `private2.o`.
      - **`main.o` requires ZERO recompilation!** Because `main.o` depends strictly on the invariant public API, we simply relink:
        `gcc main.o private2.o -o ex6_3.out`
      - If packaged into a shared library (`.so`), the implementation can even be swapped at runtime without relinking (as taught in Chapter 3).

      **The Unsigned Loop Underflow Trap**:
      In the chapter's `reverse()` algorithm, code copies elements backward from `source` into `dest`.
      - Novices often write: `for (size_t i = list_size(source) - 1; i >= 0; i--)`
      - **CRITICAL BUG**: Because `size_t` is an **unsigned integer**, the condition `i >= 0` is **ALWAYS true**! When `i` reaches 0, executing `i--` underflows to `SIZE_MAX` (e.g. 18,446,744,073,709,551,615), creating an infinite loop that crashes with a segmentation fault!
      - **The Safe Idiom**: `for (size_t i = list_size(source); i-- > 0;)`: Here, `i` is decremented *before* the body executes, correctly terminating when `i` reaches 0 without underflow.
    example:
      lang: c
      adapted: true
      code: |
        #include <stdlib.h>
        typedef struct { size_t size; int items[10]; } list_t;
        int list_add(list_t* l, int v) {
          if (l->size >= 10) return -1;
          l->items[l->size++] = v;
          return 0;
        }
        int list_get(list_t* l, size_t i, int* out) {
          if (i >= l->size) return -1;
          *out = l->items[i];
          return 0;
        }
        void reverse_copy(list_t* s, list_t* d) {
          d->size = 0;
          for (size_t i = s->size; i-- > 0;) {
            int val;
            list_get(s, i, &val);
            list_add(d, val);
          }
        }
        int main(void) {
          list_t src = {0, {0}}, dst = {0, {0}};
          list_add(&src, 4); list_add(&src, 6); list_add(&src, 1); list_add(&src, 5);
          reverse_copy(&src, &dst);
          return (int)(dst.items[0] - 5);
        }
    viz:
      kind: ascii-memory
      steps:
        - 'Compilation: gcc -c main.c -> main.o (has unresolved symbol references to list_*)'
        - 'Compilation: gcc -c private.c -> private.o (exports defined symbols for list_*)'
        - 'Link Phase: gcc main.o private.o -o ex6_3.out binds symbol references to code addresses'
        - 'Implementation Swap: gcc main.o private2.o -o ex6_3.out links new logic without touching main.o'
    checks:
      - kind: order
        q: 'Assemble the correct multi-file build sequence to produce an executable (drop the incomplete link distractor):'
        lines:
          - 'gcc -c private.c -o private.o'
          - 'gcc -c main.c -o main.o'
          - 'gcc main.o private.o -o ex6_3.out'
          - 'gcc main.o -o ex6_3.out'
        answer_order: [0, 1, 2]
        distractor_why:
          'gcc main.o -o ex6_3.out': 'Fails at link time with undefined reference errors because private definition symbols are missing.'
        hint: 'First compile both C sources into object files with -c, then link the object files together.'
        why: 'Ordering principle: source files are compiled separately into object files, which are subsequently combined by the linker (Shell Boxes 6-1 to 6-3).'
        concept: build-order
      - kind: predict
        q: 'Trace line by line, tracking the link phase: a developer executes `gcc main.o -o ex6_3.out` without providing `private.o`. What is the result?'
        choices:
          - 'The linker aborts with undefined reference errors for list functions, producing no executable'
          - 'The compiler automatically locates private.c and compiles it in the background'
          - 'The program links successfully and silently substitutes empty stub functions'
        answer: 0
        why: 'Principle: the linker requires object files containing definitions to satisfy external symbol references declared in headers (Shell Box 6-2). Choices B and C describe impossible build behaviors.'
        concept: link-needs-defs
      - kind: why-fails
        q: 'A programmer writes a countdown loop as `for (size_t i = size - 1; i >= 0; i--)`. Why does this loop never terminate?'
        choices:
          - 'Because `size_t` is an unsigned integer type, `i >= 0` is mathematically always true; decrementing 0 underflows to `SIZE_MAX`, causing an infinite loop'
          - 'The compiler disallows decrement operations on `size_t` variables'
          - 'The loop index `i` is automatically reset to `size` on each iteration'
        answer: 0
        why: 'Principle: unsigned integer underflow makes i >= 0 an infinite loop; the safe countdown pattern is `for (size_t i = size; i-- > 0;)` (Ch.6 Reverse loop caveat). Choices B and C are false.'
        concept: unsigned-loop-underflow
      - kind: mcq
        q: 'Self-contained review from Chapter 01: in C, when passing an argument to a function via `func(x)`, what mechanism does C use to pass the value?'
        choices:
          - 'Pass-by-value: the argument value is copied into the callee local parameter frame, leaving the caller variable unchanged'
          - 'Pass-by-reference: the function directly binds to the caller storage location'
          - 'Pass-by-name: the argument expression is re-evaluated inside the callee'
        answer: 0
        why: 'Principle: C supports strictly pass-by-value; caller variables remain unaltered unless an explicit address pointer is passed (Essential Features Example 1.17). Choices B and C do not exist in C.'
        concept: pass-by-value
        from_chapter: ch04
        from_block: b3
    common_bugs:
      - 'Attempting to compile header files directly rather than including them in source files'
      - 'Writing `for (size_t i = n - 1; i >= 0; i--)` with unsigned `size_t`, causing infinite underflow loops'
cards:
  - front: 'When do objects exist in object-oriented programming, and what does code hold prior to that?'
    back: 'Objects exist strictly in RAM during program execution. Prior to runtime, code on disk holds static instructions (blueprints) to allocate, initialize, relate, and destroy them.'
    concept: objects-are-runtime
  - front: 'What is the precise distinction between an object attribute and object state?'
    back: 'An attribute is a designated parameter/slot (e.g. `color`); state is the specific set of values assigned to those attributes at any given moment.'
    concept: object-state
  - front: 'Why are immutable and stateless objects preferred in multithreaded systems?'
    back: 'Because their state cannot be altered after creation, eliminating data races during concurrent read access across multiple threads without locks.'
    concept: immutability
  - front: 'What defines a software domain, and why is its glossary critical?'
    back: 'A domain defines the functional boundaries and requirements of software. Its predetermined glossary ensures terminology matches the problem space and prevents complexity bloat.'
    concept: domain-glossary
  - front: 'How is a relationship between two objects represented in memory, and how does it affect state?'
    back: 'By storing referring attributes (pointers) inside the objects. Establishing or severing a link mutates the state of both participating objects.'
    concept: referring-attributes
  - front: 'What is referential integrity during object destruction?'
    back: 'The guarantee that no attribute references a non-existent or destroyed object. Incoming links must be severed before memory is deallocated to prevent dangling pointers.'
    concept: referential-integrity
  - front: 'What is the fundamental difference between object creation and object construction?'
    back: 'Creation allocates raw memory bytes (e.g. `malloc`); construction initializes those allocated attributes into a valid starting state.'
    concept: creation-vs-construction
  - front: 'Contrast prototype-based construction with class-based construction.'
    back: 'Prototype-based starts empty and dynamically adds attributes at runtime (existence precedes essence); class-based enforces a fixed, predesigned template compiled up front.'
    concept: class-based
  - front: 'Why does explicit encapsulation in C always create a new data type?'
    back: 'Because C uses `typedef struct` to package attributes, and types dictate the structural attributes that instances of that type will possess.'
    concept: explicit-encapsulation
  - front: 'What is the standard convention for behavior encapsulation in procedural C?'
    back: 'Write standalone functions prefixed with the class name (`car_`) that accept a pointer to the attribute struct (`car_t*`) as their first argument.'
    concept: behavior-signature
  - front: 'In C behavior encapsulation, do separate instances duplicate function code in memory?'
    back: 'No. Each instance has its own attribute struct in RAM, but all instances share the single copy of compiled behavior functions in the code segment (.text).'
    concept: instance-isolation
  - front: 'How does C++ translate member function calls like `car.Accelerate()` under the hood?'
    back: 'It rewrites the call to `Car::Accelerate(&car)`, passing the instance address into the hidden `this` pointer parameter.'
    concept: this-pointer-translation
  - front: 'How is information hiding achieved in C using opaque structures?'
    back: 'Declare `struct tag;` with no fields in the public header (incomplete type) and define the full struct solely inside the private `.c` implementation file.'
    concept: opaque-struct-declaration
  - front: 'Why can client code not call `sizeof` on an opaque struct declared in a header?'
    back: 'Because the struct is an incomplete type in client code; the compiler does not know its field layout and cannot compute its size at compile time.'
    concept: incomplete-sizeof
lab:
  lang: c
  title: 'Opaque list with private guards and reverse'
  prompt_md: |
    Implement an encapsulated, information-hiding List module in C that mirrors the chapter architecture.
    The module defines an internal fixed-size store (`MAX_SIZE 10`) hidden behind an opaque structure.
    
    You must implement four functions in `starter.c`:
    1. `int __list_is_full(list_t* l)`: Private guard returning 1 if `l->size == MAX_SIZE`, else 0.
    2. `int list_add(list_t* l, int v)`: Public behavior that appends `v` to `l->items` and increments `l->size`. Returns -1 if full, else 0.
    3. `int list_get(list_t* l, int i, int* o)`: Public behavior that checks if `0 <= i < l->size`. If valid, writes `l->items[i]` to `*o` and returns 0; else returns -1.
    4. `int reverse_list(list_t* s, list_t* d)`: Reverses elements from `s` into `d` using **ONLY** the public API (`list_clear`, `list_size`, `list_get`, `list_add`). Avoid unsigned loop underflow!
    
    When run, `main()` must output:
    ```
    [4 6 1 5 ]
    [5 1 6 4 ]
    ```
  starter_c: |
    #include <stdio.h>
    #define MAX_SIZE 10
    typedef struct { unsigned size; int items[10]; } list_t;
    int __list_is_full(list_t *l) { return 0; }
    int list_add(list_t *l, int v) { (void)l; (void)v; return -1; }
    int list_get(list_t *l, int i, int *o) { (void)l; (void)i; (void)o; return -1; }
    void list_clear(list_t *d) { d->size = 0; }
    unsigned list_size(list_t *s) { return s->size; }
    int reverse_list(list_t *s, list_t *d) { (void)s; (void)d; return -1; }
    void list_print(list_t *l) {
      printf("[");
      for (unsigned i = 0; i < l->size; i++) printf("%d ", l->items[i]);
      printf("]\n");
    }
    int main(void) {
      list_t a = {0, {0}}, b = {0, {0}};
      list_add(&a, 4); list_add(&a, 6); list_add(&a, 1); list_add(&a, 5);
      reverse_list(&a, &b);
      list_print(&a); list_print(&b);
      return 0;
    }
  tests_sh: 'gcc -Wall -std=c99 starter.c -o t && ./t | grep -q "\[4 6 1 5 \]" && ./t | grep -q "\[5 1 6 4 \]"'
  hints:
