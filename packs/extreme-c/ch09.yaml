blocks:
  - id: b1
    type: model
    title: 'Map mental concepts to runtime objects'
    explain_md: |
      Object-oriented thinking is how human cognition naturally processes reality: when you observe a vase sitting on a wooden table, your mind immediately perceives the vase and the table as two distinct entities with a clear physical boundary separating them. If you paint the vase blue, you intuitively understand that the table remains entirely unchanged.

      In cognitive computing, we formalize this intuitive perception through a strict correspondence:
      1. **Human Mind vs. Computer Memory**: Concepts exist as thoughts inside a living mind; objects exist as data structures simulated inside program memory.
      2. **Mind Map vs. Object Model**: The mental graph of related concepts you form while understanding a problem translates into the runtime object model maintained by the software.
      3. **Speed, Precision, and Persistence**: Human memory is volatile, prone to emotion, and easily forgets complex relation graphs. A computer executes the simulation with mathematical speed, absolute precision, and the ability to persist the entire object model to non-volatile disk.

      **The Notional Machine — Objects Are Not In Code**:
      A foundational trap for beginners is believing that objects exist inside the C source code they type on their screen. **They do not.** Source code stored on disk contains only static instructions—blueprints specifying how to construct, manipulate, relate, and destroy objects later. Objects come into existence **only** when the compiled program is loaded into RAM and the CPU executes memory allocation instructions. When the process terminates, all objects vanish from memory while the code blueprint remains on disk. Planning these runtime structures before they exist is called **Object-Oriented Design (OOD)**.

      **Line-by-Line Code Walkthrough (Example 1)**:
      In the code example below, we declare four separate arrays to hold records for 10 students:
      - Lines 2–5 declare four arrays on the stack: `student_first_names` (array of 10 string pointers), `student_surnames` (array of 10 string pointers), `student_ages` (array of 10 integers), and `student_marks` (array of 10 doubles).
      - In memory, the C runtime allocates four disconnected blocks of stack storage. C has no internal concept of a "student"; it sees only four unrelated symbols in the compiler's symbol table.
      - We group them under the concept of "student" solely through naming conventions (`student_*`). If a programmer instead names them `aaa`, `bbb`, `ccc`, and `ddd`, the CPU executes the exact same machine code, but the human mind loses the mental map, multiplying cognitive load and defect rates.
    example:
      lang: c
      adapted: true
      code: |
        int main(void) {
          char* student_first_names[10];
          char* student_surnames[10];
          int student_ages[10];
          double student_marks[10];
          (void)student_first_names;
          (void)student_surnames;
          (void)student_ages;
          (void)student_marks;
          return 0;
        }
      subgoals:
        - label: "Stack Storage Allocation for Related Arrays"
          lines: [2, 3, 4, 5]
        - label: "Compiler Symbol Usage & Warning Suppression"
          lines: [6, 7, 8, 9]
        - label: "Clean Process Termination"
          lines: [10]
    viz:
      kind: ascii-memory
      steps:
        - 'Human Mind: Mental concepts of students and chairs with sitting-on relationships'
        - 'Source Code on Disk: Static text blueprint; exactly 0 runtime objects exist'
        - 'Process Launch (RAM): Memory allocates array storage; object simulation active'
        - 'Process Exit: Stack memory reclaimed; runtime objects destroyed; blueprint remains on disk'
    checks:
      - kind: trace
        q: "Trace stack allocation line by line. Tracking variable addresses and stored values, what is the value of student_ages[0] after Step 3?"
        code: |
          int student_ages[2] = {19, 21};
          double student_marks[2] = {88.5, 92.0};
          student_ages[0] = 20;
        trace:
          headers: ["Step", "Line", "Variable / Target", "Address", "Value"]
          rows:
            - step: 1
              line: 1
              cells: ["1", "1", "student_ages[0..1]", "0x7ffd10", "{19, 21}"]
            - step: 2
              line: 2
              cells: ["2", "2", "student_marks[0..1]", "0x7ffd20", "{88.5, 92.0}"]
            - step: 3
              line: 3
              cells: ["3", "3", "student_ages[0]", "0x7ffd10", "???"]
        target: {row: 2, col: 4}
        choices: ["19", "20", "21", "88.5"]
        answer: 1
        why: "Step 3 mutates student_ages[0] at address 0x7ffd10 from 19 to 20. Distractor 19 is the pre-store value; 21 is student_ages[1]; 88.5 is student_marks[0]."
        concept: stack-trace-mutation
      - kind: predict
        q: 'Trace line by line, tracking objects vs source code: before `main` runs (at edit time), and then while `main` runs in RAM, how many student objects exist?'
        choices:
          - 'Zero before running; up to 10 slots of student data while running in memory'
          - '10 student objects before running; zero while running'
          - 'One object per source code line at all times'
        answer: 0
        why: 'Principle: objects exist strictly in a running program (Ch.6 Objects-are-not-in-code); code on disk holds instructions/blueprints. Choice B confuses design blueprints with execution; Choice C confuses source text lines with memory instances.'
        concept: objects-are-runtime
      - kind: why-fails
        q: 'A developer renames the four student arrays to `aaa`, `bbb`, `ccc`, and `ddd`, arguing that since the compiler emits identical assembly, naming does not matter. Why does the chapter reject this argument?'
        choices:
          - 'Ad hoc naming severs the link between code variables and the mental concept of a student, drastically increasing human reasoning errors and troubleshooting time'
          - 'The C compiler flags variable names shorter than four characters as syntax errors'
          - 'Short variable names cause pipeline stalls and degrade CPU execution throughput'
        answer: 0
        why: 'Principle: variable names carry the mental concepts and relationships required for human comprehension (Code Boxes 6-1 and 6-2). Choice B is a false compiler restriction; Choice C is a performance myth.'
        concept: naming-concepts
      - kind: eipe
        q: 'A program simulates five students and five chairs with sitting-on relationships, running precisely and persisting data to disk. In one sentence, what is this code FOR?'
        choices:
          - 'It translates a volatile, fragile mental mind map into a fast, precise, and persistent object model executed by the computer'
          - 'It allocates four arrays on the stack and immediately returns zero'
          - 'It demonstrates that computer processors experience human classroom emotions'
        answer: 0
        why: 'Principle: OO programs simulate mind maps as memory object models for speed, precision, and persistence (Ch.6 Mind maps and object models). Choice B is a multistructural line-reading paraphrase; Choice C is anthropomorphic confusion.'
        concept: mindmap-to-model
    common_bugs:
      - 'Believing objects exist inside source text before execution'
      - 'Using ad hoc, cryptic variable names that obscure the underlying domain concepts'
  - id: b2
    type: model
    title: 'Define object state within domain boundaries'
    explain_md: |
      Every mental concept and simulated object possesses specific properties called **attributes**. For example, in our classroom description, a chair concept carries an attribute named `color`, with the value `brown`. A 2D graphics pixel concept carries attributes `x`, `y`, `red`, `green`, and `blue`.

      **State and Mutability**:
      The collection of specific values assigned to an object's attributes at any point in time constitutes the **state** of that object.
      - **Mutable Objects**: An object whose attribute values can change during its lifetime. Modifying an attribute alters its state.
      - **Immutable Objects**: An object whose state is permanently determined upon construction and cannot be modified afterward. A classic example is the mathematical number 2: there is only one concept of the number 2 in the universe; altering it means it is no longer 2.
      - **Stateless Objects**: An object that carries no attributes/state at all. A stateless object is functionally immutable because it has no state to alter.
      - **Thread Safety Advantage**: In multithreaded systems, immutable and stateless objects can be safely shared across concurrent execution threads without locks, mutexes, or race conditions.

      **The Domain Boundary and Glossary**:
      Every software system is developed within a strictly defined **domain** (e.g. banking, healthcare, graphics rendering). The domain defines the functional boundaries of the software and dictates a precise **glossary** of terms.
      - In a banking domain, valid glossary terms include `account`, `balance`, `credit`, and `transfer`.
      - You will never encounter `patient`, `dosage`, or `red_channel` in banking.
      - Objects within a domain must model **only** behaviors relevant to that domain. A `client` object in a banking domain can open an account or transfer funds; even though the client is human and can eat or sleep in real life, eating is outside the banking domain and must not be modeled.
    example:
      lang: c
      adapted: true
      code: |
        int main(void) {
          int pixel_p1_x = 56;
          int pixel_p1_y = 34;
          int pixel_p1_red = 123;
          int pixel_p1_green = 37;
          int pixel_p1_blue = 127;
          pixel_p1_red = 255;
          return pixel_p1_x + pixel_p1_y;
        }
      subgoals:
        - label: "Coordinate Attribute Initialization"
          lines: [2, 3]
        - label: "Color Component State Initialization"
          lines: [4, 5, 6]
        - label: "Mutable State Transformation"
          lines: [7]
        - label: "Coordinate Value Extraction"
          lines: [8]
    viz:
      kind: ascii-memory
      steps:
        - 'Construction: pixel_p1 state = {x: 56, y: 34, r: 123, g: 37, b: 127}'
        - 'State Mutation: pixel_p1_red = 255 mutates state to {x: 56, y: 34, r: 255, g: 37, b: 127}'
        - 'Domain Boundary: banking glossary forbids pixel colors; graphics domain forbids account balance'
    checks:
      - kind: trace
        q: "Trace the pixel attribute state mutations across execution steps. What is the value of pixel_p1_red after Step 3?"
        code: |
          int pixel_p1_x = 56, pixel_p1_y = 34;
          int pixel_p1_red = 123, pixel_p1_green = 37, pixel_p1_blue = 127;
          pixel_p1_red = 255;
        trace:
          headers: ["Step", "Line", "Attribute Variable", "Address", "Current Value"]
          rows:
            - step: 1
              line: 1
              cells: ["1", "1", "pixel_p1_x, y", "0x7ffd40", "{56, 34}"]
            - step: 2
              line: 2
              cells: ["2", "2", "pixel_p1_red, green, blue", "0x7ffd48", "{123, 37, 127}"]
            - step: 3
              line: 3
              cells: ["3", "3", "pixel_p1_red", "0x7ffd48", "???"]
        target: {row: 2, col: 4}
        choices: ["123", "255", "37", "0"]
        answer: 1
        why: "Mutating pixel_p1_red overwrites the 4-byte integer at address 0x7ffd48 with 255. 123 is the stale pre-mutation value; 37 is pixel_p1_green."
        concept: state-trace-mutation
      - kind: predict
        q: 'Trace line by line, tracking pixel state: initially `pixel_p1_red = 123`. After executing `pixel_p1_red = 255`, what changed about object `p1`?'
        choices:
          - 'Its state changed because the value assigned to its red attribute mutated'
          - 'Its identity changed into a completely new object'
          - 'Its domain changed from graphics to banking'
        answer: 0
        why: 'Principle: state is the collection of values assigned to attributes; mutating an attribute mutates the object state while identity remains constant (Ch.6 Object attributes). Choices B and C confuse state with identity and domain.'
        concept: state-mutation
      - kind: why-fails
        q: 'A junior programmer designs a `BankAccount` class and adds an `eat_lunch()` method because bank clients are living humans who eat. Why does this design fail good object-oriented practice?'
        choices:
          - 'It violates the domain boundary: methods must satisfy only requirements inside the banking glossary, regardless of real-world human capabilities'
          - 'The C language standard disallows verbs ending in lunch'
          - 'C structures cannot store function pointers with void parameter lists'
        answer: 0
        why: 'Principle: domains establish strict boundaries and glossaries; non-domain capabilities must never leak into the object model (Ch.6 Domain). Choices B and C are absurd technical falsehoods.'
        concept: domain-boundary
      - kind: choose-better
        q: 'In a multithreaded order-matching engine, two worker threads must read shared configuration data. Which design pattern is superior?'
        choices:
          - 'Option A: Store configuration in an immutable struct initialized once at startup and read concurrently without locks'
          - 'Option B: Store configuration in a mutable global struct that workers modify and lock with mutexes on every read'
        answer: 0
        why: 'Principle: immutable objects eliminate data races and synchronization overhead in multithreaded systems because state cannot change after construction (Ch.6 Object attributes note). Option B introduces heavy lock contention and deadlock risks.'
        concept: immutability-threads
    common_bugs:
      - 'Confusing object state with object identity'
      - 'Polluting domain models with real-world behaviors irrelevant to the software requirements'
  - id: b3
    type: model
    title: 'Preserve referential integrity across related objects'
    explain_md: |
      Individual objects do not live in isolation; they refer to one another to model real-world associations. In our classroom description, `student4` sits on `chair3`. In a 2D graphics buffer, pixel `p1` at `(53, 345)` is vertically adjacent to pixel `p2` at `(53, 346)`.

      **Representing Relationships with Referring Attributes**:
      In memory, an association between two objects is created by adding **referring attributes** (pointers in C) to the participating objects:
      - Object `p1` gains an attribute `adjacent_down_pixel` holding a pointer to `p2`'s memory address.
      - Object `p2` gains an attribute `adjacent_up_pixel` holding a pointer to `p1`'s memory address.
      - **State Mutation on Linking**: Establishing a relationship alters the state of **both** objects, because their attribute lists now store new pointer values.

      **Referential Integrity and Destruction**:
      Objects have a strict lifecycle: **allocation $\rightarrow$ construction $\rightarrow$ state mutation $\rightarrow$ destruction**.
      - **Referential Integrity**: An invariant requiring that no attribute in any living object points to an invalid, unallocated, or destroyed object.
      - **Dangling Pointer Hazard**: If object `p2` is freed while `p1.adjacent_down_pixel` still holds `p2`'s former memory address, `p1` holds a **dangling pointer**. Dereferencing it results in undefined behavior, heap corruption, or a `SIGSEGV` crash.
      - **Rule**: When destroying an object, you **MUST** unlink all references to it in other objects or nullify referring attributes before reclaiming memory.
    example:
      lang: c
      adapted: true
      code: |
        typedef struct pixel {
          int x, y;
          int red, green, blue;
          struct pixel* adjacent_down;
          struct pixel* adjacent_up;
        } pixel_t;

        int main(void) {
          pixel_t p1 = {53, 345, 120, 45, 178, 0, 0};
          pixel_t p2 = {53, 346, 79, 162, 23, 0, 0};
          p1.adjacent_down = &p2;
          p2.adjacent_up = &p1;
          return p1.adjacent_down->y - p1.y;
        }
      subgoals:
        - label: "Define Self-Referential Attribute Struct"
          lines: [1, 2, 3, 4, 5, 6]
        - label: "Instantiate Distinct Stack Objects"
          lines: [9, 10]
        - label: "Establish Bidirectional Spatial Links"
          lines: [11, 12]
        - label: "Traverse Relationship Pointer"
          lines: [13]
    viz:
      kind: ascii-memory
      steps:
        - 'Initial State: p1 @ 0x1000 (down=NULL); p2 @ 0x2000 (up=NULL)'
        - 'Link Established: p1.adjacent_down = 0x2000; p2.adjacent_up = 0x1000'
        - 'Traverse Link: p1.adjacent_down->y dereferences 0x2000 to read 346'
        - 'Referential Integrity: Before destroying p2, p1.adjacent_down MUST be set to NULL'
    checks:
      - kind: trace
        q: "Trace pointer relationship linking across steps. Tracking memory addresses, what address is stored in p1.adjacent_down after Step 3?"
        code: |
          pixel_t p1 = {53, 345, 120, 45, 178, NULL, NULL}; // lives at 0x7ffd50
          pixel_t p2 = {53, 346, 79, 162, 23, NULL, NULL};  // lives at 0x7ffd80
          p1.adjacent_down = &p2;
          p2.adjacent_up = &p1;
        trace:
          headers: ["Step", "Line", "Object Attribute", "Slot Address", "Stored Pointer Value"]
          rows:
            - step: 1
              line: 1
              cells: ["1", "1", "p1 (x=53, y=345)", "0x7ffd50", "NULL"]
            - step: 2
              line: 2
              cells: ["2", "2", "p2 (x=53, y=346)", "0x7ffd80", "NULL"]
            - step: 3
              line: 3
              cells: ["3", "3", "p1.adjacent_down", "0x7ffd68", "???"]
            - step: 4
              line: 4
              cells: ["4", "4", "p2.adjacent_up", "0x7ffd98", "0x7ffd50"]
        target: {row: 2, col: 4}
        choices: ["0x7ffd50", "0x7ffd80", "NULL", "0x7ffd68"]
        answer: 1
        why: "p1.adjacent_down stores &p2 (0x7ffd80), the address of p2. Distractor 0x7ffd50 is &p1; NULL is the pre-link value; 0x7ffd68 is the address of the pointer member itself."
        concept: relationship-pointer-linking
      - kind: predict
        q: 'Trace line by line, tracking pointer dereferencing: `p1.adjacent_down` stores `&p2`. What does `p1.adjacent_down->y - p1.y` evaluate to?'
        choices:
          - '1 (346 - 345)'
          - '0 (comparing identical pixels)'
          - '-1 (345 - 346)'
        answer: 0
        why: 'Principle: dereferencing adjacent_down accesses p2 in memory, whose y is 346; p1.y is 345; 346 - 345 = 1. Choice B assumes pixels are aliases; Choice C swaps operand order.'
        concept: pointer-deref-state
      - kind: why-fails
        q: 'An application frees object `p2` from the heap without modifying `p1.adjacent_down`. Later, code reads `p1.adjacent_down->y`. Why does this fail?'
        choices:
          - 'Referential integrity was broken: p1 holds a dangling pointer to deallocated memory, leading to use-after-free undefined behavior or a crash'
          - 'The compiler automatically deletes p1 whenever p2 is freed'
          - 'C structs automatically zero out all referencing pointers across the entire process'
        answer: 0
        why: 'Principle: destroying an object without unlinking references creates dangling pointers that violate referential integrity (Ch.6 Object destruction). Choices B and C describe non-existent automatic C mechanisms.'
        concept: referential-integrity
    common_bugs:
      - 'Failing to unlink pointers before destroying an object, leaving dangling references'
      - 'Assuming establishing a relationship between objects does not alter their states'
  - id: b4
    type: model
    title: 'Contrast prototype-based and class-based object construction'
    explain_md: |
      In object-oriented programming literature, the term **construction** has a precise technical meaning distinct from **creation**:
      - **Creation**: Allocating raw memory bytes (either on the stack or on the heap via `malloc`) to hold an object.
      - **Construction**: Initializing those allocated memory bytes so that the object's attributes start in a valid, consistent state.

      **The Two Schools of Object Construction**:
      Across computing history, two fundamentally distinct paradigms have emerged for planning and constructing objects:

      1. **Prototype-Based OOP ("Existence Precedes Essence")**:
         - Objects begin existence empty (or with minimal attributes). Attributes and methods are added, modified, or removed dynamically at runtime as the program executes.
         - Two objects created in the same program can evolve completely different attribute schemas.
         - Represented in dynamic, interpreted languages like JavaScript, Lua, and Python (which supports both).
         - *Philosophical Parallel*: Mirrors existentialist philosophy—an entity comes into existence first, and its essence evolves through experience.

      2. **Class-Based OOP ("Essence Precedes Existence")**:
         - A rigid, predetermined template called a **class** is defined and compiled ahead of time.
         - The class strictly dictates every attribute and behavior that instances of that class can ever possess. No attributes can be added or deleted at runtime.
         - Represented in compiled languages like C++, Java, and C (using struct types).
         - *Philosophical Parallel*: Mirrors essentialist philosophy—the blueprint (essence) exists before any physical entity is instantiated into the world.

      **Why C and C++ Are Class-Based**:
      C is a compiled, statically typed language. Memory layouts of types must be known at compile time so the compiler can compute exact byte offsets (`base + offset`) for CPU instructions. Therefore, C enforces a strictly class-based mindset: you declare the struct blueprint first, and then allocate instances conforming to that blueprint.
    example:
      lang: c
      adapted: true
      code: |
        typedef struct {
          int id;
          double balance;
        } account_t;

        int main(void) {
          account_t acc1 = {101, 500.0};
          account_t acc2;
          acc2.id = 102;
          acc2.balance = 1250.0;
          return (acc1.id == 101 && acc2.balance > 1000.0) ? 0 : 1;
        }
    viz:
      kind: ascii-memory
      steps:
        - 'Prototype-Based (JS): var obj = {}; obj.name = "John"; (dynamically grows attributes in RAM)'
        - 'Class-Based (C/C++): typedef struct { int id; double balance; } account_t; (blueprint compiled)'
        - 'Instance Allocation: account_t acc1; (compiler reserves exact sizeof(account_t) bytes)'
        - 'Construction: acc1.id = 101; acc1.balance = 500.0; (initializes predetermined fields)'
    checks:
      - kind: predict
        q: 'Trace the lifecycle distinction: what is the technical difference between calling `malloc(sizeof(account_t))` and assigning `acc->id = 101; acc->balance = 500.0;`?'
        choices:
          - '`malloc` creates the object by allocating raw memory; the assignments construct the object by initializing attributes'
          - '`malloc` constructs the object; the assignments create the object'
          - 'Both statements perform identical compiler actions on the stack'
        answer: 0
        why: 'Principle: creation is memory allocation; construction is attribute initialization (Ch.6 Object-oriented operations note). Choice B reverses the definitions; Choice C ignores heap mechanics.'
        concept: creation-vs-construction
      - kind: why-fails
        q: 'A programmer attempts to add a new field dynamically at runtime to a C instance via `acc1.interest_rate = 0.05;` without modifying the struct definition. Why does the compiler reject this?'
        choices:
          - 'C is class-based and statically typed: struct layouts are immutable templates fixed at compile time, preventing dynamic attribute additions'
          - 'C requires dynamic attributes to be prefixed with a dollar sign ($)'
          - 'Float attributes cannot be assigned to structs with double fields'
        answer: 0
        why: 'Principle: C uses class-based static struct templates; fields cannot be appended to instances at runtime (Ch.6 Class-based OOP). Choices B and C are false syntax claims.'
        concept: class-based-immutability
      - kind: eipe
        q: 'A software engineer defines `typedef struct { int x, y; } point_t;` before creating any point variables in memory. In one sentence, what is this struct declaration FOR?'
        choices:
          - 'It establishes an essentialist, class-based object template that predetermines the attributes and memory layout of all future point instances'
          - 'It instructs the operating system to immediately allocate two 32-bit integers in heap RAM'
          - 'It dynamically attaches functions to prototype objects at execution time'
        answer: 0
        why: 'Principle: a C struct declaration defines the class template (essence) before instances exist (Ch.6 Class-based OOP). Choice B confuses type declarations with instance allocation; Choice C describes prototype-based OOP.'
        concept: class-blueprint-purpose
    common_bugs:
      - 'Confusing memory creation (allocation) with object construction (initialization)'
      - 'Expecting C structs to support runtime attribute expansion like JavaScript or Python dictionaries'
  - id: b5
    type: syntax
    title: 'Encapsulate attributes into explicit C struct types'
    explain_md: |
      **Encapsulation** is the foundational pillar of object-oriented programming: it is the act of bundling related data (attributes) and logic (behaviors) together into a single cohesive capsule representing an object.

      **Implicit vs. Explicit Encapsulation**:
      1. **Implicit Encapsulation (Naming Conventions)**:
         - Declaring independent variables tied together only by shared name prefixes (e.g. `pixel_p1_x`, `pixel_p1_y`, `pixel_p1_red`).
         - The compiler sees 10 unrelated variables. Only the human mind is aware of the grouping.
         - Extremely fragile, error-prone, and impossible to pass as a single cohesive unit to functions.
      2. **Explicit Encapsulation (C Structs)**:
         - Using C's `typedef struct` keyword to package related attributes into a **new first-class data type** (`pixel_t`).
         - The compiler and programmer now share the exact same mental model of the object.
         - Violations and mismatches are caught at **compile time** rather than during production execution.

      **Rule**: Explicit encapsulation in C **always creates a new type**. By convention, we append the `_t` suffix (e.g. `pixel_t`, `car_t`, `list_t`) to denote custom types.

      **Access Operators: Dot (`.`) vs. Arrow (`->`)**:
      - **Dot Operator (`p1.x`)**: Used when accessing attributes of an object variable directly on the stack or by value.
      - **Arrow Operator (`ptr->x`)**: Syntactic sugar for `(*ptr).x`, used when accessing attributes indirectly through a pointer storing the object's memory address.
    example:
      lang: c
      adapted: true
      code: |
        typedef struct {
          int x, y;
          int red, green, blue;
        } pixel_t;

        int main(void) {
          pixel_t p1, p2;
          p1.x = 56;  p1.y = 34;
          p1.red = 123; p1.green = 37; p1.blue = 127;
          p2.x = 212; p2.y = 994;
          p2.red = 127; p2.green = 127; p2.blue = 0;
          return (p1.x + p2.x == 268) ? 0 : 1;
        }
      subgoals:
        - label: "Package Attributes into Explicit Type"
          lines: [1, 2, 3, 4]
        - label: "Allocate Storage for Multiple Instances"
          lines: [7]
        - label: "Initialize First Instance State"
          lines: [8, 9]
        - label: "Initialize Second Instance State"
          lines: [10, 11]
        - label: "Independent Instance Verification"
          lines: [12]
    viz:
      kind: ascii-memory
      steps:
        - 'Implicit: int p1_x, p1_y, p2_x, p2_y (independent stack locations, no compiler link)'
        - 'Type Definition: typedef struct { int x,y,r,g,b; } pixel_t; (creates 20-byte type schema)'
        - 'Instance Allocation: pixel_t p1 @ 0x7ffd00; pixel_t p2 @ 0x7ffd14 (distinct 20-byte blocks)'
        - 'Instance Access: p1.x writes to 0x7ffd00; p2.x writes to 0x7ffd14 without mutual interference'
    checks:
      - kind: order
        faded: true
        q: "Order the lines to declare an explicit attribute struct and fill in the missing typedef syntax token:"
        lines:
          - "_____ struct {"
          - "  int x, y;"
          - "  int red, green, blue;"
          - "} pixel_t;"
          - "struct pixel_t { int x; };"
        answer_order: [0, 1, 2, 3]
        blanks:
          - line_idx: 0
