  - id: b7
    type: design
    title: 'Information hiding: Opaque pointer declarations and public APIs'
    explain_md: |
      Encapsulation bundles attributes and behaviors, but an equally vital consequence
      is Information Hiding: concealing internal implementation details from external
      client code.

      In the `car_t` example, `car.fuel` and `car.speed` were declared directly in the
      header file. Consequently, any client code (`main()`) could directly read or
      arbitrarily overwrite `car.fuel = -999.0;`, bypassing class invariants. Even worse,
      client code becomes tightly coupled to the exact field names, types, and layouts.
      If the author later changes `fuel` from gallons to milliliters or renames fields,
      all client code breaks!

      The Solution: The Opaque Pointer (Incomplete Type) Idiom:
      1. Forward declaration in header:
         ```c
         struct list_t; /* Incomplete type: fields not disclosed! */
         ```
      2. No struct definition in header: The header declares ONLY `struct list_t;`
         and public function prototypes (`list_malloc`, `list_init`, `list_add`, etc.).
      3. The compiler view: External code including the header sees `struct list_t` as
         an incomplete type. The compiler knows it is a struct, but because the fields
         are unknown:
         - Clients CANNOT access any internal fields (`list->size` triggers compile error).
         - Clients CANNOT allocate it on the stack or use `sizeof(struct list_t)`.
      4. Factory Allocator: Because clients cannot run `sizeof`, the class provides
         `list_malloc()`, which is compiled in the `.c` file where `sizeof(list_t)`
         is fully known.

      This guarantees bulletproof encapsulation and stable public Application
      Programming Interfaces (APIs).
    example:
      lang: c
      adapted: false
      code: |
        #ifndef LIST_H
        #define LIST_H
        #include <stddef.h>
        
        /* Opaque type declaration: no fields disclosed */
        struct list_t;
        
        /* Allocation and lifecycle */
        struct list_t* list_malloc(void);
        void list_init(struct list_t* list);
        void list_destroy(struct list_t* list);
        
        /* Public behavior API */
        int  list_add(struct list_t* list, int item);
        int  list_get(struct list_t* list, int index, int* out);
        size_t list_size(struct list_t* list);
        #endif
      subgoals:
        - label: "Declare opaque incomplete struct"
          lines: [6]
        - label: "Provide container allocator and lifecycle functions"
          lines: [9, 10, 11]
        - label: "Expose public API behaviors operating through opaque pointers"
          lines: [14, 15, 16]
    checks:
      - kind: why-fails
        q: 'Why does `sizeof(struct list_t)` fail to compile inside client code that only includes the public header?'
        choices:
          - 'struct list_t is an incomplete type in the header; the compiler does not know its member fields or byte footprint'
          - 'sizeof cannot be used on user-defined structs in C99'
          - 'Header guards prevent sizeof from reading struct declarations'
          - 'Incomplete types can only be measured at runtime by calling malloc_usable_size'
        answer: 0
        why: 'Section Information hiding: In the client translation unit, struct list_t is only forward-declared. An incomplete type has an unknown size, making sizeof invalid.'
        concept: incomplete-type-sizeof
      - kind: choose-better
        q: 'Which header design enforces robust information hiding for a library data structure?'
        choices:
          - 'Forward-declare struct list_t; in the header and define the struct layout privately inside the .c file'
          - 'Expose all struct member variables directly in the public header so client code can inspect them'
        answer: 0
        why: 'Declaring struct list_t; opaquely prevents clients from coupling to internal fields, preserving backward compatibility and encapsulation.'
        concept: opaque-pointer-design
      - kind: fillblank
        q: 'Complete the forward declaration in the public header to introduce an opaque incomplete type:'
        code: |
          /* Forward declaration of opaque attribute structure */
          ______ list_t;
        answer_text: 'struct'
        why: 'In C, struct list_t; forward declares the tag list_t as a struct without disclosing its member fields.'
        concept: forward-declaration-syntax
      - kind: mcq
        q: 'Interleaved Review: Why is initializing a pointer to NULL or the return of an allocator mandatory before dereferencing?'
        choices:
          - 'An uninitialized pointer contains indeterminate stack garbage; dereferencing it causes undefined behavior or segmentation faults'
          - 'The preprocessor requires all pointers to match NULL in macro expansions'
          - 'Pointers left uninitialized are automatically set to point to main()'
          - 'NULL pointers increase memory allocation speed by 50%'
        answer: 0
        why: 'Review from ch04 b2: Wild uninitialized pointers hold random stack debris. Dereferencing them corrupts arbitrary memory or crashes.'
        concept: pointer-initialization
        from_chapter: ch04
        from_block: b2
    common_bugs:
      - 'Attempting to allocate an opaque struct on the stack in client code'
      - 'Trying to access list->items directly from main() when list_t is opaque'

  - id: b8
    type: algorithm
    title: 'Opaque class implementation: Private behaviors, heap buffers, and clean destruction'
    explain_md: |
      Inside the implementation file (`list.c`), we define the actual contents of
      `list_t`. This file alone possesses complete knowledge of the struct footprint.

      Key Implementation Principles:
      1. Full Struct Definition:
         ```c
         typedef struct {
           size_t size;
           int* items;
         } list_t;
         ```
      2. Private Behavior Functions:
         Helper functions like `__list_is_full` and `__check_index` are internal
         invariants. They are NOT declared in the public header. By convention, prefixing
         them with `__` (or declaring them `static`) ensures they remain strictly
         private to this translation unit.
      3. Two-Tier Memory Allocation:
         - Tier 1: Container allocation via `list_malloc()`, allocating `sizeof(list_t)`
           bytes on the heap to house the struct itself (`size` and `items` pointer).
         - Tier 2: Dynamic buffer allocation via `list_init()`, allocating the backing
           array on the heap (`malloc(MAX_SIZE * sizeof(int))`).
      4. Symmetrical Two-Tier Destruction:
         Destruction MUST execute in exact reverse order to prevent memory leaks:
         - Step 1: `list_destroy(list)` frees the internal dynamic buffer (`free(list->items)`).
         - Step 2: `free(list)` frees the outer container itself.
         Swapping or omitting these steps creates either a leak or a heap-use-after-free!
    example:
      lang: c
      adapted: false
      code: |
        #include <stdlib.h>
        #define MAX_SIZE 10
        
        typedef struct {
          size_t size;
          int* items;
        } list_t;
        
        static int __is_full(list_t* list) {
          return list->size == MAX_SIZE;
        }
        
        list_t* list_malloc(void) {
          return (list_t*)malloc(sizeof(list_t));
        }
        
        void list_init(list_t* list) {
          list->size = 0;
          list->items = (int*)malloc(MAX_SIZE * sizeof(int));
        }
        
        void list_destroy(list_t* list) {
          free(list->items);
        }
      subgoals:
        - label: "Define private attribute structure layout"
          lines: [4, 5, 6, 7]
        - label: "Implement private internal helper invariant"
          lines: [9, 10, 11]
        - label: "Implement container allocator and buffer constructor"
          lines: [13, 14, 15, 17, 18, 19, 20]
        - label: "Implement destructor to release internal heap buffer"
          lines: [22, 23, 24]
    viz:
      kind: ascii-memory
      steps:
        - |
          Step 1: list_malloc()
          Heap @ 0x602000 (list_t container: 16 bytes):
          [ size: ??? | items: ??? ]
        - |
          Step 2: list_init()
          Heap @ 0x604000 (items buffer: 40 bytes = 10 * 4):
          [ int | int | int | int | int | ... ]
          Heap @ 0x602000 updated:
          [ size: 0 | items: 0x604000 ]
        - |
          Step 3: list_destroy()
          free(list->items) -> 0x604000 released back to allocator!
          (Container at 0x602000 remains allocated)
        - |
          Step 4: free(list)
          free(list) -> 0x602000 container released!
          Zero leaks, zero dangling pointers.
    checks:
      - kind: predict
        q: 'Trace the return value of `list_add(list, 99)` when `list->size` equals `MAX_SIZE` (10):'
        choices:
          - '-1 (failure: list is full, private check rejects addition)'
          - '0 (success: buffer automatically expands)'
          - 'Segmentation fault'
          - '10'
        answer: 0
        why: 'In Code Box 6-14, list_add calls __list_is_full. If size == MAX_SIZE, it returns -1 without appending, preserving buffer integrity.'
        concept: opaque-list-bounds-check
      - kind: spot-bug
        q: 'Analyze the cleanup sequence in main(). What bug does this code introduce?'
        code: |
          struct list_t* l = list_malloc();
          list_init(l);
          list_add(l, 42);
          free(l);
        diagnostic_log: |
          ==51022==ERROR: LeakSanitizer: detected memory leaks
          Direct leak of 40 byte(s) in 1 object(s) allocated from:
              #0 0x7f malloc
              #1 0x401182 in list_init list.c:19
        target_line: 4
        choices:
          - 'Memory leak: free(l) deallocated the container without calling list_destroy(l) to free the internal items buffer'
          - 'Stack buffer overflow: list_add wrote past the bounds of l'
          - 'Double free: l was freed twice'
          - 'Segmentation fault: list_malloc failed to return memory'
        answer: 0
        why: 'Freeing the container pointer l directly abandons the buffer l->items on the heap, causing a memory leak reported by LeakSanitizer.'
        concept: two-tier-deallocation-leak
      - kind: trace
        q: 'Trace execution across list append operations. What is the value in target cell?'
        code: |
          struct list_t* l = list_malloc();
          list_init(l);
          list_add(l, 10);
          list_add(l, 20);
          list_add(l, 30);
        trace:
          headers: ["Step", "Action", "size", "items[0]", "items[1]", "items[2]"]
          rows:
            - step: 1
              line: 3
              cells: ["1", "add(10)", "1", "10", "0", "0"]
            - step: 2
              line: 4
              cells: ["2", "add(20)", "2", "10", "20", "0"]
            - step: 3
              line: 5
              cells: ["3", "add(30)", "3", "10", "20", "30"]
        target: {row: 2, col: 2}
        answer_text: "3"
        why: 'After adding three elements (10, 20, 30), list->size post-increments to 3.'
        concept: opaque-list-trace
      - kind: eipe
        q: 'In one sentence, what is the purpose of private helper functions like `__check_index` and `__list_is_full`?'
        choices:
          - 'They encapsulate internal boundary invariants within the implementation file, protecting buffer integrity from invalid access'
          - 'They allow external client code in main() to inspect raw array indices'
          - 'They inform the compiler to compile the functions in 32-bit compatibility mode'
          - 'They automatically serialize the list elements to persistent disk storage'
        answer: 0
        why: 'Private helpers enforce internal class invariants (boundaries, capacity) without exposing internal mechanisms in the public API.'
        concept: private-helper-purpose
    common_bugs:
      - 'Freeing list before calling list_destroy(list), permanently leaking internal buffers'
      - 'Declaring private helper functions in the public header file'

  - id: b9
    type: design
    title: 'ABI decoupling: Independent compilation and swappable implementations'
    explain_md: |
      The pinnacle of object-oriented design in C is Application Binary Interface
      (ABI) decoupling through separate compilation and linking.

      Recall the compilation pipeline:
      1. Compiling Client Logic (`main.c`):
         `gcc -c main.c -o main.o`
         Because `main.c` includes only `list.h`, the compiler checks function
         signatures and records unresolved external symbol references (`list_malloc`,
         `list_init`, `list_add`). It does NOT need the struct definition!
      2. Compiling Library Implementation (`list.c`):
         `gcc -c list.c -o private.o`
         This compiles the private struct layout and machine code for all behavior
         functions into an independent object file.
      3. Linking:
         `gcc main.o private.o -o app.out`
         The linker matches the unresolved symbols in `main.o` to the exported code in
         `private.o`. If `private.o` is omitted, the linker terminates with
         "undefined reference" errors.

      The Architectural Payoff — Swappability:
      Suppose we rewrite `list.c` to use a dynamic singly-linked list instead of a
      fixed array, producing `private2.o`.
      Because `main.c` never depended on the internal struct layout, `main.o` DOES NOT
      NEED TO BE RECOMPILED! We simply relink:
      `gcc main.o private2.o -o app.out`
      Client code remains 100% untouched. In enterprise systems, packaging `private.o`
      as a shared library (`liblist.so`) allows hot-swapping implementations at runtime
      without even relinking the binary!
    example:
      lang: c
      adapted: true
      code: |
        #include <stdlib.h>
        /* Opaque client driver: relies only on public signatures */
        struct list_t;
        struct list_t* list_malloc(void);
        void list_init(struct list_t* list);
        int  list_add(struct list_t* list, int item);
        void list_destroy(struct list_t* list);
        
        int main(void) {
          struct list_t* l = list_malloc();
          list_init(l);
          list_add(l, 42);
          list_destroy(l);
          free(l);
          return 0;
        }
      subgoals:
        - label: "Forward-declare opaque struct and public function signatures"
          lines: [3, 4, 5, 6, 7]
        - label: "Manipulate object strictly through public API"
          lines: [10, 11, 12, 13, 14]
    checks:
      - kind: why-fails
        q: 'Why does attempting to link `gcc main.o -o app.out` fail if `private.o` is omitted?'
        choices:
          - 'The linker cannot resolve the external symbol addresses for list_malloc, list_init, etc., producing undefined reference errors'
          - 'main.o does not contain a valid main function entry point'
          - 'The operating system refuses to run executables without dynamic .so files'
          - 'The preprocessor requires header files to be passed during the linking phase'
        answer: 0
        why: 'Shell Box 6-2: main.o only contains references to external symbols. The linker requires private.o to resolve the target function addresses.'
        concept: unresolved-symbol-linking
      - kind: mcq
        q: 'Why does replacing a fixed array with a linked list in `list.c` require zero recompilation of `main.c`?'
        choices:
          - 'main.c compiled against an opaque forward declaration, making its binary code completely decoupled from internal struct layout and size'
          - 'The C preprocessor automatically converts arrays into linked lists'
          - 'The linker recompiles all source files in the current working directory'
          - 'Linked lists use the exact same memory addresses as static arrays'
        answer: 0
        why: 'Section Information hiding: The client object file main.o depends solely on the unchanging public function signatures, achieving total ABI decoupling.'
        concept: abi-decoupling
      - kind: choose-better
        q: 'When designing a shared library for third-party consumers, which architecture best prevents breaking client applications during internal updates?'
        choices:
          - 'Export an opaque struct in public headers and ship implementation details in a shared library (.so)'
          - 'Place the complete struct definition in public headers so client applications can directly manipulate fields'
        answer: 0
        why: 'Exposing fields locks the ABI. An opaque struct lets the library author alter internal fields without breaking client binary compatibility.'
        concept: library-abi-stability
    common_bugs:
      - 'Attempting to link main.o without supplying the implementation object file private.o'
      - 'Unnecessarily recompiling client code when only internal library implementation files changed'

cards:
  - front: 'In the author’s cognition-to-computation model, what are the counterparts of Concept, Mind, and Mind Map?'
    back: 'Concept maps to Object in memory; Mind maps to Memory; Mind Map maps to the running Object Model.'
    concept: cognitive-isomorphism
  - front: 'What is the critical technical distinction between object creation and object construction?'
    back: 'Creation allocates raw memory storage; construction initializes that storage into valid attribute states.'
    concept: creation-vs-construction
  - front: 'Why can a C struct alone NOT be considered an OOP class?'
    back: 'A struct encapsulates only data attributes; an OOP class encapsulates both attributes and behaviors.'
    concept: struct-vs-class
  - front: 'Why does C deliberately remain a procedural language rather than adopting OOP syntax?'
    back: 'C sits on the frontier between human OO thinking and procedural CPU execution, providing the low-level bridge for hardware execution.'
    concept: c-architectural-frontier
  - front: 'How does C achieve behavior encapsulation without class syntax?'
    back: 'Through free functions sharing a class prefix and accepting an explicit pointer to the attribute struct as their first parameter.'
    concept: implicit-behavior-encapsulation
  - front: 'Do multiple instances of a C class each have their own copy of behavior functions?'
    back: 'No. Each instance has unique attribute memory, but all instances share the exact same behavior function code in the .text segment.'
    concept: behavior-code-sharing
  - front: 'What compiler error occurs if client code attempts `sizeof(struct my_type)` on an opaque forward declaration?'
    back: 'Compilation fails with an "invalid application of sizeof to incomplete type" error.'
    concept: incomplete-type-sizeof
  - front: 'What is the required destruction order for an opaque class managing dynamic heap memory?'
    back: 'First call class_destroy() to free internal buffers, then call free() to deallocate the outer container struct.'
    concept: two-tier-deallocation-order
  - front: 'Why does changing the internal struct layout in an opaque C library require zero recompilation of client code?'
    back: 'Client code depends only on public function symbols; it has zero compile-time knowledge of internal struct offsets (ABI decoupling).'
    concept: abi-decoupling

lab:
  lang: c
  title: 'Encapsulate a Bank Account with the Opaque Pointer Idiom'
  prompt_md: |
    ### Pedagogical Mission
    Apply the Chapter 6 encapsulation and information-hiding patterns to build a
    robust, production-grade Bank Account component.

    ### Architectural Requirements
    1. The account struct MUST remain completely opaque to external callers.
    2. Provide two-tier allocation and lifecycle functions:
       - `account_t* account_malloc(void)`: Allocates the struct container on the heap.
       - `void account_init(account_t* acc, const char* owner, double initial_balance)`:
         Constructs account attributes and validates initial balance.
       - `void account_destroy(account_t* acc)`: Destructs internal fields.
    3. Implement behavior functions:
       - `int account_deposit(account_t* acc, double amount)`: Adds to balance (must be > 0).
       - `int account_withdraw(account_t* acc, double amount)`: Subtracts from balance (rejects overdrafts).
       - `double account_balance(const account_t* acc)`: Returns current balance.
    4. Compile and verify clean execution with zero memory leaks.
  starter_c: |
    #include <stdio.h>
    #include <stdlib.h>
    #include <string.h>

    typedef struct account_t {
      char owner[32];
      double balance;
    } account_t;

    account_t* account_malloc(void) {
      return (account_t*)malloc(sizeof(account_t));
    }
    void account_init(account_t* a, const char* name, double bal) {
      strncpy(a->owner, name, 31);
      a->owner[31] = '\0';
      a->balance = bal > 0.0 ? bal : 0.0;
    }
    int account_deposit(account_t* a, double amt) {
      if (amt <= 0.0) return -1;
      a->balance += amt;
      return 0;
    }
    int account_withdraw(account_t* a, double amt) {
      if (amt <= 0.0 || a->balance < amt) return -1;
      a->balance -= amt;
      return 0;
    }
    double account_balance(const account_t* a) { return a->balance; }
    void account_destroy(account_t* a) { (void)a; }
  tests_sh: |
    set -e
    cat << 'EOF' > test_main.c
    #include <stdio.h>
    #include <stdlib.h>
    #include <assert.h>

    typedef struct account_t account_t;
    account_t* account_malloc(void);
    void account_init(account_t* a, const char* name, double bal);
    int account_deposit(account_t* a, double amt);
    int account_withdraw(account_t* a, double amt);
    double account_balance(const account_t* a);
    void account_destroy(account_t* a);

    int main(void) {
      account_t* acc = account_malloc();
      assert(acc != NULL);
      account_init(acc, "John Doe", 100.0);
      assert(account_balance(acc) == 100.0);

      assert(account_deposit(acc, 50.0) == 0);
      assert(account_balance(acc) == 150.0);

      assert(account_deposit(acc, -10.0) == -1);
      assert(account_balance(acc) == 150.0);

      assert(account_withdraw(acc, 40.0) == 0);
      assert(account_balance(acc) == 110.0);

      assert(account_withdraw(acc, 200.0) == -1);
      assert(account_balance(acc) == 110.0);

      account_destroy(acc);
      free(acc);
      printf("ALL ACCOUNT TESTS PASSED\n");
      return 0;
    }
    EOF
    gcc -Wall -Werror -std=c99 -O0 starter.c test_main.c -o test_runner
    ./test_runner
  hints:
    - 'Remember the two-tier allocation pattern: account_malloc allocates container memory on heap, account_init sets initial attributes.'
    - 'Guard against invalid operations: deposits must be positive (> 0); withdrawals must not exceed available balance.'
    - 'Ensure destruction symmetry: call account_destroy(acc) before calling free(acc).'

