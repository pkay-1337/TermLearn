blocks:
  - id: b1
    type: model
    title: 'Map mental concepts to runtime objects'
    explain_md: |
      Object-oriented thinking is how human cognition naturally processes reality: when you observe a vase sitting on a wooden table, your mind immediately perceives the vase and the table as two distinct entities with a clear physical boundary separating them. If you paint the vase blue, you intuitively understand that the table remains entirely unchanged.

      In cognitive computing, we formalize this intuitive perception through a strict correspondence:
      1. **Human Mind vs. Computer Memory**: Concepts exist as thoughts inside a living mind; objects exist as data structures simulated inside program memory.
      2. **Mind Map vs. Object Model**: The mental graph of related concepts you form while understanding a problem translates into the runtime object model maintained by the software.
      3. **Speed, Precision, and Persistence**: Human memory is volatile, prone to emotion, and easily forgets complex relation graphs. A computer executes the simulation with mathematical speed, absolute precision, and the ability to persist the entire object model to non-volatile disk.

      **The Notional Machine — Objects Are Not In Code**:
      A foundational trap for beginners is believing that objects exist inside the C source code they type on their screen. **They do not.** Source code stored on disk contains only static instructions—blueprints specifying how to construct, manipulate, relate, and destroy objects later. Objects come into existence **only** when the compiled program is loaded into RAM and the CPU executes memory allocation instructions. When the process terminates, all objects vanish from memory while the code blueprint remains on disk. Planning these runtime structures before they exist is called **Object-Oriented Design (OOD)**.

      **Line-by-Line Code Walkthrough (Example 1)**:
      In the code example below, we declare four separate arrays to hold records for 10 students:
      - Lines 2–5 declare four arrays on the stack: `student_first_names` (array of 10 string pointers), `student_surnames` (array of 10 string pointers), `student_ages` (array of 10 integers), and `student_marks` (array of 10 doubles).
      - In memory, the C runtime allocates four disconnected blocks of stack storage. C has no internal concept of a "student"; it sees only four unrelated symbols in the compiler's symbol table.
      - We group them under the concept of "student" solely through naming conventions (`student_*`). If a programmer instead names them `aaa`, `bbb`, `ccc`, and `ddd`, the CPU executes the exact same machine code, but the human mind loses the mental map, multiplying cognitive load and defect rates.
    example:
      lang: c
      adapted: true
      code: |
        int main(void) {
          char* student_first_names[10];
          char* student_surnames[10];
          int student_ages[10];
          double student_marks[10];
          (void)student_first_names;
          (void)student_surnames;
          (void)student_ages;
          (void)student_marks;
          return 0;
        }
    viz:
      kind: ascii-memory
      steps:
        - 'Human Mind: Mental concepts of students and chairs with sitting-on relationships'
        - 'Source Code on Disk: Static text blueprint; exactly 0 runtime objects exist'
        - 'Process Launch (RAM): Memory allocates array storage; object simulation active'
        - 'Process Exit: Stack memory reclaimed; runtime objects destroyed; blueprint remains on disk'
    checks:
      - kind: predict
        q: 'Trace line by line, tracking objects vs source code: before `main` runs (at edit time), and then while `main` runs in RAM, how many student objects exist?'
        choices:
          - 'Zero before running; up to 10 slots of student data while running in memory'
          - '10 student objects before running; zero while running'
          - 'One object per source code line at all times'
        answer: 0
        why: 'Principle: objects exist strictly in a running program (Ch.6 Objects-are-not-in-code); code on disk holds instructions/blueprints. Choice B confuses design blueprints with execution; Choice C confuses source text lines with memory instances.'
        concept: objects-are-runtime
      - kind: why-fails
        q: 'A developer renames the four student arrays to `aaa`, `bbb`, `ccc`, and `ddd`, arguing that since the compiler emits identical assembly, naming does not matter. Why does the chapter reject this argument?'
        choices:
          - 'Ad hoc naming severs the link between code variables and the mental concept of a student, drastically increasing human reasoning errors and troubleshooting time'
          - 'The C compiler flags variable names shorter than four characters as syntax errors'
          - 'Short variable names cause pipeline stalls and degrade CPU execution throughput'
        answer: 0
        why: 'Principle: variable names carry the mental concepts and relationships required for human comprehension (Code Boxes 6-1 and 6-2). Choice B is a false compiler restriction; Choice C is a performance myth.'
        concept: naming-concepts
      - kind: eipe
        q: 'A program simulates five students and five chairs with sitting-on relationships, running precisely and persisting data to disk. In one sentence, what is this code FOR?'
        choices:
          - 'It translates a volatile, fragile mental mind map into a fast, precise, and persistent object model executed by the computer'
          - 'It allocates four arrays on the stack and immediately returns zero'
          - 'It demonstrates that computer processors experience human classroom emotions'
        answer: 0
        why: 'Principle: OO programs simulate mind maps as memory object models for speed, precision, and persistence (Ch.6 Mind maps and object models). Choice B is a multistructural line-reading paraphrase; Choice C is anthropomorphic confusion.'
        concept: mindmap-to-model
    common_bugs:
      - 'Believing objects exist inside source text before execution'
      - 'Using ad hoc, cryptic variable names that obscure the underlying domain concepts'
  - id: b2
    type: model
    title: 'Define object state within domain boundaries'
    explain_md: |
      Every mental concept and simulated object possesses specific properties called **attributes**. For example, in our classroom description, a chair concept carries an attribute named `color`, with the value `brown`. A 2D graphics pixel concept carries attributes `x`, `y`, `red`, `green`, and `blue`.

      **State and Mutability**:
      The collection of specific values assigned to an object's attributes at any point in time constitutes the **state** of that object.
      - **Mutable Objects**: An object whose attribute values can change during its lifetime. Modifying an attribute alters its state.
      - **Immutable Objects**: An object whose state is permanently determined upon construction and cannot be modified afterward. A classic example is the mathematical number 2: there is only one concept of the number 2 in the universe; altering it means it is no longer 2.
      - **Stateless Objects**: An object that carries no attributes/state at all. A stateless object is functionally immutable because it has no state to alter.
      - **Thread Safety Advantage**: In multithreaded systems, immutable and stateless objects can be safely shared across concurrent execution threads without locks, mutexes, or race conditions.

      **The Domain Boundary and Glossary**:
      Every software system operates inside a specific **domain**—the real-world or theoretical problem space defining its requirements and scope.
      - A domain establishes a mandatory, predetermined **glossary** (terminology).
      - In the **banking domain**, the glossary includes: `account`, `credit`, `balance`, `transfer`, `loan`, and `interest`. Concepts like `patient`, `medicine`, and `dosage` do NOT belong in banking.
      - If code introduces concepts outside its domain, software complexity explodes, boundaries blur, and maintainability degrades.

      **Notional Machine Walkthrough (Example 2)**:
      - Line 1 defines `pixel_t` with 5 integer fields (20 bytes of contiguous memory on 32/64-bit systems).
      - Lines 3–4 construct `p1` and `p2` on the stack: `p1` receives state `{53, 345, 120, 45, 178}`; `p2` receives state `{53, 346, 79, 162, 23}`.
      - Each struct occupies its own distinct stack memory address. If code modifies `p1.red = 200`, the byte sequence at `p1`'s address changes, while `p2`'s memory remains completely untouched.
    example:
      lang: c
      adapted: true
      code: |
        typedef struct { int x; int y; int red; int green; int blue; } pixel_t;
        int main(void) {
          pixel_t p1 = {53, 345, 120, 45, 178};
          pixel_t p2 = {53, 346, 79, 162, 23};
          p1.red = 200;
          (void)p1; (void)p2;
          return 0;
        }
    viz:
      kind: ascii-memory
      steps:
        - 'Stack Frame: p1 at 0x7ffd00 = {x:53, y:345, red:120, green:45, blue:178}'
        - 'Stack Frame: p2 at 0x7ffd14 = {x:53, y:346, red:79, green:162, blue:23}'
        - 'Mutation: p1.red = 200 updates 0x7ffd08 to 200; p2 at 0x7ffd14 untouched'
        - 'Immutable Shared State: Read-only memory can be read by multiple threads without data races'
    checks:
      - kind: predict
        q: 'Trace line by line, tracking `p1` and `p2`: after executing `p1.red = 200;`, what are the values of `p1.red` and `p2.red`?'
        choices:
          - '`p1.red = 200` and `p2.red = 79`'
          - '`p1.red = 120` and `p2.red = 79`'
          - '`p1.red = 200` and `p2.red = 200`'
        answer: 0
        why: 'Principle: state belongs to individual object instances; mutating an attribute of p1 updates only p1 in memory, leaving p2 unchanged (Ch.6 Object attributes). Choice B assumes writes do not persist; Choice C confuses distinct instances with shared memory.'
        concept: object-state
      - kind: why-fails
        q: 'A teammate shares a mutable pixel object across multiple concurrent threads without synchronization and claims sharing is safe. Why does the chapter advocate immutable or stateless objects for multithreading?'
        choices:
          - 'Immutable objects have unalterable state, making data races physically impossible during concurrent reads'
          - 'The CPU automatically caches immutable objects in register files'
          - 'Operating systems terminate any thread that accesses a mutable object'
        answer: 0
        why: 'Principle: unchangeable state eliminates concurrency race conditions because no thread can mutate the data while another reads it (Ch.6 attributes note). Choice B is hardware fiction; Choice C is a false OS policy.'
        concept: immutability
      - kind: mcq
        q: 'Which set of terms constitutes the valid predetermined glossary for the banking domain according to the chapter?'
        choices:
          - '`account`, `credit`, `balance`, `transfer`, `loan`, `interest`'
          - '`patient`, `medicine`, `dosage`, `prescription`, `triage`'
          - '`pixel`, `polygon`, `shader`, `vertex`, `texture`'
        answer: 0
        why: 'Principle: a domain is defined by its specific glossary; banking relies on financial transaction terminology and strictly excludes healthcare or graphics terms (Ch.6 Domain).'
        concept: domain-glossary
    common_bugs:
      - 'Confusing the attribute definition (slot name) with the object state (current values)'
      - 'Polluting a clean domain model with concepts belonging to alien glossaries'
  - id: b3
    type: model
    title: 'Link objects and preserve referential integrity'
    explain_md: |
      Isolated objects are rarely useful on their own. In any meaningful system, objects refer to each other to represent relationships (e.g. `student4` sits on `chair3`).

      **How Relationships Alter Object State**:
      Objects establish relationships by holding **referring attributes** (in C, pointers to other structs).
      - Consider two independent pixels: `p1` at `{x: 53, y: 345}` and `p2` at `{x: 53, y: 346}`.
      - Because their vertical coordinates differ by 1 unit, they are vertically adjacent.
      - To model this link, `p1` gains an attribute `adjacent_down` pointing to `p2`, and `p2` gains `adjacent_up` pointing to `p1`.
      - **Critical Rule**: Establishing or removing a relationship alters the state of both objects! The relationship itself becomes part of each object's state.

      **Referential Integrity and Destruction Protocol**:
      When an object's lifecycle ends, it must be destroyed and its memory deallocated. However, if other objects still hold pointers referencing the doomed object, those pointers become **dangling references**.
      - Reading or writing through a dangling reference causes **use-after-free**, memory corruption, miscalculations, and segmentation faults.
      - **Referential Integrity**: An object model possesses referential integrity if and only if no attribute references a non-existent or destroyed object.
      - **Safe Teardown Sequence**:
        1. Break and clear all referring links from peer objects (set referring pointers to `NULL`).
        2. Release any internal resources owned by the object.
        3. Deallocate the object's own memory.
    example:
      lang: c
      adapted: true
      code: |
        #include <stdlib.h>
        typedef struct pixel_t {
          int x, y;
          struct pixel_t* adjacent_down;
          struct pixel_t* adjacent_up;
        } pixel_t;
        int main(void) {
          pixel_t* p1 = (pixel_t*)malloc(sizeof(pixel_t));
          pixel_t* p2 = (pixel_t*)malloc(sizeof(pixel_t));
          p1->x = 53; p1->y = 345; p1->adjacent_down = p2; p1->adjacent_up = NULL;
          p2->x = 53; p2->y = 346; p2->adjacent_down = NULL; p2->adjacent_up = p1;
          p1->adjacent_down = NULL;
          free(p2);
          free(p1);
          return 0;
        }
    viz:
      kind: ascii-memory
      steps:
        - 'Heap Allocation: p1 allocated at 0x2000, p2 allocated at 0x3000'
        - 'Linking: p1->adjacent_down = 0x3000; p2->adjacent_up = 0x2000 (both states altered)'
        - 'Unlinking: p1->adjacent_down = NULL (severing reference to p2 before deallocation)'
        - 'Deallocation: free(p2) followed by free(p1); referential integrity preserved'
    checks:
      - kind: predict
        q: 'Trace line by line, tracking pointer attributes: after `p1->adjacent_down = p2;` and `p2->adjacent_up = p1;`, what does `p1->adjacent_down->y` evaluate to?'
        choices:
          - '346 (the y attribute of object p2)'
          - '345 (the y attribute of object p1)'
          - 'NULL (uninitialized pointer)'
        answer: 0
        why: 'Principle: p1->adjacent_down stores the address of p2; dereferencing it accesses p2->y, which holds 346 (Ch.6 Relations among objects). Choice B accesses p1 itself; Choice C ignores the assignment.'
        concept: referring-attributes
      - kind: why-fails
        q: 'A programmer frees object `p2` directly without clearing `p1->adjacent_down`. Later, code reads `p1->adjacent_down->y`. Why is this a severe defect?'
        choices:
          - 'It causes a use-after-free error by dereferencing a dangling pointer to deallocated memory, violating referential integrity'
          - 'The compiler automatically nullifies all pointers across the entire process'
          - 'Freeing an object automatically deallocates every object pointing to it'
        answer: 0
        why: 'Principle: referential integrity requires clearing all references to an object before destroying it; dangling pointers lead to memory corruption or crashes (Ch.6 destruction). Choices B and C describe impossible automatic behaviors.'
        concept: referential-integrity
      - kind: order
        q: 'Assemble the safe object destruction sequence that preserves referential integrity (drop the dangerous distractor):'
        lines:
          - 'p1->adjacent_down = NULL;'
          - 'free(p2);'
          - 'free(p1);'
          - 'read p1->adjacent_down->y after freeing p2;'
        answer_order: [0, 1, 2]
        distractor_why:
          'read p1->adjacent_down->y after freeing p2;': 'Illegal use-after-free read: accesses a destroyed object through an uncleared dangling pointer.'
        hint: 'First sever the reference to p2 so nobody points to it, then deallocate p2, then deallocate p1.'
        why: 'Ordering principle: sever incoming links first, deallocate target memory, then clean up remaining storage (Ch.6 destruction).'
        concept: teardown-order
    common_bugs:
      - 'Failing to realize that establishing a relationship mutates the state of both participating objects'
      - 'Leaving dangling references in peer objects when destroying a shared instance'
  - id: b4
    type: design
    title: 'Contrast prototype and class construction models'
    explain_md: |
      In object-oriented engineering, we must distinguish between two terms that are frequently conflated:
      - **Creation**: The physical allocation of raw memory bytes for an object (e.g. `malloc()` on the heap or a variable declaration on the stack).
      - **Construction**: The initialization of the allocated memory attributes into valid, meaningful starting values. Memory allocation without construction leaves attributes holding uninitialized garbage.

      **Two Construction Paradigms**:
      Across programming languages, object construction follows one of two distinct philosophical and mechanical approaches:
      1. **Prototype-Based Construction**:
         - Objects are constructed ex nihilo (empty or with minimal attributes). Attributes and methods are dynamically added, modified, or removed at runtime from an internal dictionary/hash map.
         - Two instances constructed from the same code path may end up with completely different sets of attributes in their states.
         - Exemplified by JavaScript, Ruby, Python (via `__dict__`), and PHP.
         - *Philosophical Analogy*: The existentialist principle **"Existence precedes essence"** (Jean-Paul Sartre): the entity exists first in the world, and acquires its defining character through runtime experience.
      2. **Class-Based Construction**:
         - The list of attributes is strictly predetermined up front in a compiled template called a **class**.
         - No attributes can be added or removed at runtime; all instances share the exact same structural shape throughout execution. Only the attribute values may change (if mutable).
         - Exemplified by Java, C++, and C struct patterns.
         - *Philosophical Analogy*: The classical essence-first model: the complete form is defined before the instance is brought into existence.

      **References vs. Instances**:
      - An **instance** (or object) is the actual memory block holding attribute values.
      - A **reference** (in C, a pointer) is an address label that refers to that memory. Many references may point to the exact same object. Stack objects are named variables; heap objects are nameless and accessed exclusively via pointers.
    example:
      lang: c
      adapted: true
      code: |
        #include <stdlib.h>
        typedef struct { int x; int y; } point_t;
        void point_construct(point_t* p, int x, int y) { p->x = x; p->y = y; }
        int main(void) {
          point_t stack_pt;
          point_construct(&stack_pt, 10, 20);
          point_t* heap_pt = (point_t*)malloc(sizeof(point_t));
          point_construct(heap_pt, 30, 40);
          free(heap_pt);
          return 0;
        }
    viz:
      kind: ascii-memory
      steps:
        - 'Prototype (JS/Python): var o = {} -> o.x = 10 -> o.y = 20 (dynamic hash table growth)'
        - 'Class-Based (C/C++): struct point_t compiled with fixed {int x, int y} template'
        - 'Stack Instance: stack_pt at 0x7ffd00 has fixed 8-byte layout, initialized by point_construct'
        - 'Heap Instance: heap_pt stores pointer 0x2000; nameless block allocated and constructed'
    checks:
      - kind: eipe
        q: 'A C++ class predefines `name` and `surname` attributes, compiling them into a fixed template from which all instances are instantiated. In one sentence, what is this class template FOR?'
        choices:
          - 'It predetermines the complete structural attribute shape of all future objects at compile time so every instance is constructed with uniform layout'
          - 'It allows arbitrary attributes to be added dynamically to individual objects during execution'
          - 'It invokes malloc to allocate raw heap bytes without initializing them'
        answer: 0
        why: 'Principle: class-based OOP fixes the attribute layout at compile time in a class template (Code Box 6-6; Ch.6 Object-oriented operations). Choice B describes prototype-based OOP; Choice C confuses class templates with raw creation.'
        concept: class-based
      - kind: why-fails
        q: 'A programmer calls `malloc(sizeof(point_t))` and asserts that the object has been constructed. Why does the chapter correct this terminology?'
        choices:
          - '`malloc` performs memory creation (allocation); construction requires initializing the attributes to valid starting values'
          - '`malloc` is exclusively a destruction operator in modern C'
          - 'The terms creation and construction are forbidden by the ANSI C standard'
        answer: 0
        why: 'Principle: creation allocates storage, while construction initializes attributes (Ch.6 construction note). Memory allocated by malloc contains uninitialized data until constructed. Choice B and C are false statements.'
        concept: creation-vs-construction
      - kind: mcq
        q: 'Self-contained review from Chapter 01: when executing `int var = 42; int* ptr = &var;`, what relationship does `ptr` establish with `var`?'
        choices:
          - '`ptr` stores the memory address of `var`, acting as a reference alias that accesses `var` through `*ptr`'
          - '`ptr` creates an independent copy of the value 42 on the heap'
          - '`ptr` and `var` become two names for separate, disconnected storage locations'
        answer: 0
        why: 'Principle: pointers act as references in C, storing the address of an existing instance to create an alias (Ch.6 reference note; Essential Features & and *). Choice B and C misunderstand pointer semantics.'
        concept: reference-alias
        from_chapter: ch04
        from_block: b2
    common_bugs:
      - 'Equating raw heap allocation (`malloc`) with object construction'
      - 'Attempting to dynamically attach novel attributes to C struct instances at runtime'
  - id: b5
    type: syntax
    title: 'Encapsulate attributes in a C struct type'
    explain_md: |
      In procedural code, developers often group related variables using common name prefixes (e.g., `pixel_p1_x`, `pixel_p1_y`, `pixel_p2_x`). This is **implicit encapsulation**: the grouping exists solely in the developer's mind. The C compiler treats them as ten completely independent variables. Even assembly language can name variables with prefixes, so this does not constitute real language-level encapsulation.

      **Explicit Attribute Encapsulation via `struct`**:
      Real encapsulation requires that **both the developer and the compiler** recognize the capsule.
      - In C, explicit attribute encapsulation is achieved using structures (`struct`).
      - By packaging related attributes into a `typedef struct`, we create a brand new data type (conventionally suffixed with `_t`, e.g. `pixel_t`).
      - **Key Principle**: Encapsulation always creates a new type! In C, types dictate the attributes of their objects: every instance of `pixel_t` possesses exactly the fields defined in the struct template.

      **Syntax of Field Access**:
      - **Dot Operator (`.`)**: Used when accessing an attribute directly on an object variable:
        `p1.x = 56;` (read as: *"the x attribute in the p1 object"*).
      - **Arrow Operator (`->`)**: Used when accessing an attribute indirectly through a pointer storing the object's address:
        `ptr->x = 56;` (syntactic sugar for `(*ptr).x`).

      **A C Struct Is Not a Class**:
      A class in OOP literature encapsulates **both attributes and behaviors**. Because a standard C structure stores only data attributes and cannot contain function bodies, a C struct is only the attribute component of a class. The full class in C remains implicit, formed by the struct plus its companion functions.
    example:
      lang: c
      adapted: true
      code: |
        typedef struct {
          int x, y;
          int red, green, blue;
        } pixel_t;
        int main(void) {
          pixel_t p1, p2;
          p1.x = 56;
          p1.y = 34;
          p1.red = 123;
          p1.green = 37;
          p1.blue = 127;
          p2.x = 212;
          p2.y = 994;
          p2.red = 127;
          p2.green = 127;
          p2.blue = 0;
          return (int)(p1.x + p2.x - 268);
        }
    viz:
      kind: ascii-memory
      steps:
        - 'Type Registration: typedef struct defines pixel_t layout (5 contiguous ints = 20 bytes)'
        - 'Variable Declaration: pixel_t p1, p2 allocates two 20-byte blocks on stack'
        - 'Direct Write via Dot: p1.x = 56 writes to offset +0 of p1; p1.y = 34 writes to offset +4'
        - 'Pointer Write via Arrow: pixel_t* ptr = &p1; ptr->x = 100 dereferences ptr and writes offset +0'
    checks:
      - kind: fillblank
        q: 'Complete the statement to assign 56 to the `x` attribute of the stack object `p1`: `p1___x = 56;`'
        code: 'pixel_t p1; p1___x = 56;'
        answer_text: .
        why: 'Rule: the dot operator (.) accesses struct attributes directly on an object variable, whereas the arrow operator (->) accesses attributes through a pointer (Code Box 6-4 notes).'
        concept: struct-dot-syntax
      - kind: order
        q: 'Assemble the explicit attribute encapsulation sequence (drop the implicit naming distractor):'
        lines:
          - 'typedef struct { int x, y; int red, green, blue; } pixel_t;'
          - 'pixel_t p1, p2;'
          - 'p1.x = 56;'
          - 'int pixel_p1_x = 56;'
        answer_order: [0, 1, 2]
        distractor_why:
          'int pixel_p1_x = 56;': 'Implicit name-prefix grouping: does not create a new type and leaves variables disconnected in the compiler symbol table.'
        hint: 'First define the new struct type, then instantiate objects of that type, then assign attributes via the dot operator.'
        why: 'Ordering principle: type definition must precede object instantiation, which precedes field assignment (Code Boxes 6-3 and 6-4).'
        concept: explicit-encapsulation
      - kind: why-fails
        q: 'A teammate states that defining a `struct pixel_t` in C is completely equivalent to defining a `class Pixel` in C++. Why does the chapter disagree?'
        choices:
          - 'A C struct encapsulates only data attributes; it cannot contain member functions, so the OOP class in C remains an implicit combination of struct plus external functions'
          - 'C structures are prohibited from storing integer types'
          - 'C structures cannot be allocated on the stack'
        answer: 0
        why: 'Principle: in OOP, a class bundles attributes AND behaviors; C structs hold only attributes, meaning behavior encapsulation must be handled through external functions (Code Box 6-4 notes). Choices B and C are absurd falsehoods.'
        concept: struct-vs-class
    common_bugs:
      - 'Confusing implicit name-prefix grouping with true language-level encapsulation'
      - 'Using the arrow operator (->) on a direct struct instance instead of the dot operator (.)'
  - id: b6
    type: design
    title: 'Encapsulate behavior using struct-pointer functions'
    explain_md: |
      An object is more than passive data—it exhibits **behaviors** that perform operations and alter its state. In OOP terminology, behaviors attached to an object are called **methods**.
      - In prototype-based languages (e.g. JavaScript, Code Box 6-5), an anonymous function is assigned directly to an object property: `clientObj.orderBankAccount = function() { ... };`.
      - In class-based languages (e.g. C++, Code Box 6-6), methods are declared directly inside the class body as member functions: `class Client { void orderBankAccount(); };`.

      **The C Implicit Encapsulation Technique**:
      Because C does not support functions declared inside structs, mature C projects (like `libcurl`, Linux kernel, OpenSSL) use a standardized, disciplined pattern:
      1. **Attribute Structure**: Define a struct to hold all data attributes (e.g., `typedef struct { char name[32]; double speed; double fuel; } car_t;`).
      2. **Behavior Functions**: Implement normal C functions that represent object behaviors.
      3. **First Argument Pointer**: Every behavior function **MUST** accept a pointer to the attribute struct as its first parameter (e.g., `void car_accelerate(car_t* car);`). This pointer allows the function to inspect and mutate that specific object's state.
      4. **Class Prefix Naming**: Prefix every behavior function with the class name (e.g., `car_construct`, `car_accelerate`, `car_brake`, `car_refuel`) to signify membership in the implicit class.
      5. **Header File Grouping**: Declare the attribute struct and all associated behavior prototypes in a single declaration header (`car.h`).

      **The Shared Behavior Principle**:
      In memory, **each object has its own unique attribute struct variable** (allocating separate memory on the stack or heap), but **ALL objects share the exact same behavior functions in the executable's code segment**! Calling `car_accelerate(&c1)` and `car_accelerate(&c2)` executes the identical machine instructions, passing different memory addresses as the first argument.

      Procedural `car_accelerate(&car)` is functionally and semantically identical to object-oriented `car.accelerate()`.
    example:
      lang: c
      adapted: true
      code: |
        #include <stdio.h>
        typedef struct {
          char name[32];
          double speed;
          double fuel;
        } car_t;
        void car_construct(car_t* car, const char* name) {
          car->speed = 0.0; car->fuel = 0.0;
        }
        void car_accelerate(car_t* car) {
          car->speed += 0.05; car->fuel -= 1.0;
        }
        int main(void) {
          car_t c1, c2;
          car_construct(&c1, "Renault");
          car_construct(&c2, "Peugeot");
          c1.fuel = 10.0; c2.fuel = 20.0;
          car_accelerate(&c1);
          return (int)(c1.speed * 100);
        }
    viz:
