        - 'Step 2: list_init() sets list->size=0 and allocates 40-byte buffer @ 0x603000 (items)'
        - 'Step 3: list_destroy() frees 40-byte buffer @ 0x603000'
        - 'Step 4: free(list) frees 16-byte container @ 0x602000 (zero memory leaks)'
