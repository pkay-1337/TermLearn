objectives:
  - 'Map human domain concepts and mind maps to C memory models and object relationships'
  - 'Differentiate object creation (memory allocation) from construction (attribute initialization) across lifecycles'
  - 'Implement explicit attribute encapsulation in C using typed structs and the _t convention'
  - 'Implement implicit behavior encapsulation in C using free functions with explicit instance pointer arguments'
  - 'Enforce information hiding and ABI decoupling using opaque pointers (incomplete struct declarations)'
  - 'Verify compile-time encapsulation boundaries and build swappable object implementations across linking phases'
blocks:
  - id: b1
    type: model
    title: 'Object-oriented thinking: Mind maps into memory models'
    explain_md: |
      Object-oriented programming (OOP) is not merely a syntax feature; it is an
      intrinsic human cognitive strategy for decomposing reality. When observing a
      room, our visual cortex immediately segregates entities: a vase is distinct from
      the table it sits on. Changing the vase's color leaves the table unaltered. We
      naturally identify individual entities, borders, attributes, and relationships.

      When analyzing a software problem, humans first build a mental mind map in the
      understanding phase. A computer cannot directly execute a human thought. Instead,
      we translate that mind map into machine-level instructions. The fundamental
      isomorphism between human cognition and an object-oriented program is:
      1. Concept in the mind maps to an Object in computer memory.
      2. Human Mind maps to Computer Memory (Stack, Heap, BSS).
      3. Mental Mind Map maps to a running Object Model (graph of pointers).

      Computers simulate our mind maps because machines provide relentless speed,
      mathematical precision, persistent disk storage, and freedom from emotional
      drift. Without explicit grouping, programmers resort to naming conventions like
      prefixing loose arrays (`student_first_names`, `student_ages`). If we lose that
      discipline and write ad-hoc identifiers (`aaa`, `bbb`), the computer still
      executes the instructions, but the human mind loses the conceptual model,
      multiplying reasoning errors and maintenance defects.
    example:
      lang: c
      adapted: false
      code: |
        /* Grouping related concept attributes by naming convention */
        char* student_first_names[10];
        char* student_surnames[10];
        int   student_ages[10];
        double student_marks[10];
      subgoals:
        - label: "Group attributes under the student concept prefix"
          lines: [2, 3, 4, 5]
    viz:
      kind: ascii-memory
      steps:
        - |
          Mental Concept: "Student" (Domain Entity)
          Attributes: first_name, surname, age, mark
          Relations: sits_on -> Chair, enrolled_in -> Course
        - |
          Parallel Memory Layout (Ad-hoc Arrays in BSS/Data segment):
          student_first_names[0..9] -> [ ptr | ptr | ptr | ... ]
          student_surnames[0..9]    -> [ ptr | ptr | ptr | ... ]
          student_ages[0..9]        -> [  19 |  21 |  20 | ... ]
          student_marks[0..9]       -> [ 3.8 | 3.2 | 3.9 | ... ]
          Notice: The CPU sees 4 disconnected buffers; concept unity exists only in the programmer's mind!
    checks:
      - kind: mcq
        q: 'Why does the author contrast `student_first_names[10]` with ad-hoc names like `aaa[10]`?'
        choices:
          - 'Ad-hoc names destroy the mental mapping between domain concepts and memory representations for the human programmer'
          - 'Ad-hoc names cause the C compiler to allocate smaller cache lines in memory'
          - 'The linker rejects variable names shorter than three characters'
          - 'Ad-hoc names prevent the CPU instruction pipeline from branch predicting loop counters'
        answer: 0
        why: 'Code Box 6-1 vs 6-2: The computer executes both identical memory offsets, but human reasoning requires names that reflect the mental concepts of the domain.'
        concept: mental-concept-mapping
      - kind: predict
        q: 'In the author’s cognition-to-computation isomorphism, which runtime component corresponds to the human mind map?'
        choices:
          - 'The running object model (graph of interrelated objects in memory)'
          - 'The abstract syntax tree built by the preprocessor'
          - 'The symbol table generated inside the ELF object file'
          - 'The assembly instruction stream flowing into the CPU arithmetic logic unit'
        answer: 0
        why: 'Section Mind maps and object models: Concept <-> Object, Mind <-> Memory, and Mind Map <-> Object Model.'
        concept: cognitive-isomorphism
      - kind: why-fails
        q: 'Why can an object NOT exist purely within source code files on disk before compilation?'
        choices:
          - 'Objects are dynamic runtime entities residing in memory; source code only specifies instructions and templates to instantiate them'
          - 'Source code files on disk cannot store hexadecimal numbers'
          - 'Text files lack executable permissions on POSIX systems'
          - 'The compiler erases all data structures during the parsing phase'
        answer: 0
        why: 'Section Objects are not in code: Objects exist only in a running program (in memory), just as concepts exist only in an active living mind.'
        concept: object-runtime-existence
      - kind: trace
        q: 'Trace the conceptual attributes of student index 2 across parallel arrays. What is the value at target cell?'
        code: |
          char* student_first_names[3] = {"Alice", "Bob", "Charlie"};
          int student_ages[3] = {20, 22, 21};
          double student_marks[3] = {3.9, 3.4, 3.85};
        trace:
          headers: ["Index", "Attribute", "Memory Identifier", "Value"]
          rows:
            - step: 1
              line: 1
              cells: ["0", "first_name", "student_first_names[0]", "Alice"]
            - step: 2
              line: 2
              cells: ["1", "age", "student_ages[1]", "22"]
            - step: 3
              line: 3
              cells: ["2", "mark", "student_marks[2]", "3.85"]
        target: {row: 2, col: 3}
        answer_text: "3.85"
        why: 'Tracing parallel arrays for student index 2 resolves student_marks[2], which evaluates to 3.85.'
        concept: parallel-array-state
    common_bugs:
      - 'Confusing the text representation in source code with live objects residing in execution memory'
      - 'Assuming compilers enforce conceptual relationships between identically prefixed variable names'

  - id: b2
    type: model
    title: 'Object lifecycle: Construction, mutability, and referential integrity'
    explain_md: |
      Every object undergoes a definite lifecycle: creation, construction, mutation,
      and destruction. In rigorous systems programming, vocabulary must be precise:
      - Creation: Allocating physical address space for the object's attributes (via
        the call stack frame or `malloc` on the Heap).
      - Construction: Initializing those allocated attribute bytes to a valid starting
        state according to class invariants.
      - State: The composite values assigned to all attributes of an object at a
        given instant.
      - Destruction: Releasing acquired resources (closing file descriptors, freeing
        internal buffers) and deallocating the container memory.

      Objects fall into three mutability classifications:
      1. Mutable: Attributes can change value over their lifetime.
      2. Immutable: Attributes are fixed at construction and cannot be altered. In
         concurrent programming, immutable objects are exceptionally valuable
         because threads can read them simultaneously with zero locks or data races.
      3. Stateless: Objects holding zero attributes; inherently immutable.

      When objects relate to one another (e.g., student sitting on a chair, pixel
      referring to adjacent pixels), their states mutate to incorporate references
      (pointers). This creates a critical architectural rule: Referential Integrity.
      When an object is destroyed, all referring pointers in other objects MUST be
      updated or nulled out. If an object references a destructed entity, that pointer
      becomes dangling, leading to catastrophic memory corruption or segmentation faults.
    example:
      lang: c
      adapted: false
      code: |
        typedef struct {
          int x;
          int y;
        } point_t;
        
        void demo_point(void) {
          /* Creation + Construction on Stack */
          point_t pt;
          pt.x = 10;
          pt.y = 20;
        }
      subgoals:
        - label: "Declare attribute layout template"
          lines: [1, 2, 3, 4]
        - label: "Allocate memory on stack frame (creation)"
          lines: [8]
        - label: "Initialize attribute state (construction)"
          lines: [9, 10]
    viz:
      kind: ascii-memory
      steps:
        - |
          Step 1: Allocation (Creation)
          Stack Frame: pt allocated at 0x7ffd00 (8 bytes: uninitialized garbage)
          [0x7ffd00: x = ??? | 0x7ffd04: y = ???]
        - |
          Step 2: Initialization (Construction)
          pt.x = 10; pt.y = 20;
          [0x7ffd00: x = 10  | 0x7ffd04: y = 20 ] (Valid State)
        - |
          Step 3: Relationship Established
          pointer_to_pt at 0x7ffd08 holds address 0x7ffd00
          Referential Integrity holds: 0x7ffd08 -> 0x7ffd00 (Valid Target)
        - |
          Step 4: Destruction & Dangling Reference Warning
          If pt scope ends but pointer_to_pt retains 0x7ffd00:
          0x7ffd08 points to released stack frame! (Dangling Pointer / UB)
    checks:
      - kind: predict
        q: 'Trace line by line. What is the fundamental difference between object creation and object construction?'
        choices:
          - 'Creation allocates raw memory bytes; construction initializes those bytes into valid attribute values'
          - 'Creation is executed by the compiler; construction is executed by the CPU linker'
          - 'Creation applies only to heap memory; construction applies only to stack variables'
          - 'Creation sets fields to zero; construction registers the object with the operating system kernel'
        answer: 0
        why: 'Section Object-oriented operations: Creation refers to memory allocation; construction means initialization of attributes.'
        concept: creation-vs-construction
      - kind: why-fails
        q: 'Why are immutable objects especially advantageous in multithreaded systems programming?'
        choices:
          - 'Their state cannot change after construction, eliminating data races without expensive synchronization locks'
          - 'The operating system places immutable objects in read-only CPU registers'
          - 'They bypass stack frame allocation and execute directly on the memory bus'
          - 'The compiler automatically duplicates them across every thread cache line'
        answer: 0
        why: 'Section Object attributes: Immutable objects cannot be modified after construction, making them inherently thread-safe for simultaneous shared access.'
        concept: immutability-concurrency
      - kind: spot-bug
        q: 'Analyze the code and AddressSanitizer report. Which line violates referential integrity, and why?'
        code: |
          typedef struct { int val; } node_t;
          node_t* n = (node_t*)malloc(sizeof(node_t));
          n->val = 42;
          free(n);
          printf("%d\n", n->val);
        diagnostic_log: |
          ==48211==ERROR: AddressSanitizer: heap-use-after-free on address 0x602000000010
          READ of size 4 at 0x602000000010 thread T0
        target_line: 5
        choices:
          - 'Line 5: Dereferencing n after memory was returned to allocator in Line 4'
          - 'Line 2: malloc allocation failed due to insufficient size'
          - 'Line 3: Struct field val must be initialized through a designated initializer'
          - 'Line 4: free cannot be called on typed pointers without a void cast'
        answer: 0
        why: 'AddressSanitizer detects heap-use-after-free on line 5: free(n) destroyed the object, but the pointer was not cleared, breaking referential integrity.'
        concept: referential-integrity-bug
      - kind: choose-better
        q: 'Which approach preserves referential integrity when destroying an object referenced by multiple observers?'
        choices:
          - 'Notify or reset all referencing pointers to NULL before/upon releasing the target object storage'
          - 'Free the target object immediately and rely on the CPU page fault handler to ignore dangling dereferences'
        answer: 0
        why: 'Releasing storage without nulling references leaves dangling pointers. Safe destruction mandates clearing all referrer links.'
        concept: referential-integrity-practice
    common_bugs:
      - 'Assuming memory allocation automatically constructs valid object state'
      - 'Leaving pointers pointing to freed heap blocks or deallocated stack frames'

  - id: b3
    type: model
    title: 'Construction paradigms: Dynamic prototypes vs static class templates'
    explain_md: |
      In computer science, object construction follows two distinct philosophies:
      1. Prototype-Based OOP (Dynamic / Existentialist):
         - Languages: JavaScript, Python, Ruby, Lua.
         - Philosophy: "Existence precedes essence" (Sartre). An object is constructed
           as an empty container (or cloned from an existing prototype).
         - Mechanics: Attributes are stored in dynamic runtime hash tables / dictionaries.
           New fields and functions can be injected or deleted at any moment during execution.
           Two objects born from the same prototype can diverge completely in structure.
      2. Class-Based OOP (Static / Essentialist):
         - Languages: C++, Java, and idiomatic C.
         - Philosophy: "Essence precedes existence". An authoritative blueprint
           (class or struct) dictates all attributes and byte offsets before compilation.
         - Mechanics: The compiler fixes field offsets at compile time. At runtime,
           objects cannot gain or lose attributes; only their values may mutate.

      In C, we construct objects using the class-based approach. We define an attribute
      structure (`struct`) as our object blueprint. Memory is allocated for all fields
      simultaneously, and field access compiles to direct, fixed-offset machine instructions
      rather than runtime hash table lookups.

      Furthermore, distinguish between:
      - Object (Instance): The actual physical memory block holding attribute values.
      - Reference (Pointer): The variable holding the address of that memory block.
      Stack objects have variable names; Heap objects are nameless allocations
      manipulated exclusively through pointer references.
    example:
      lang: c
      adapted: false
      code: |
        /* Class-based: Fixed blueprint dictates compile-time layout */
        typedef struct {
          int id;
          double score;
        } record_t;
        
        record_t r1; /* Stack object: has name 'r1' */
        record_t* p = &r1; /* Reference: holds address of r1 */
      subgoals:
        - label: "Define static template blueprint"
          lines: [2, 3, 4, 5]
        - label: "Instantiate stack object and reference pointer"
          lines: [7, 8]
    viz:
      kind: ascii-memory
      steps:
        - |
          Prototype-Based Model (e.g. JavaScript runtime):
          Object -> [ Hash Table: {"name": "John", "age": 25} ]
          Runtime can add: obj["new_field"] = 99 -> Hash Table resized dynamically!
        - |
          Class-Based Model (C / C++ memory layout):
          record_t footprint: 16 bytes (with alignment padding)
          Offset +0: [ int id (4 bytes) ]
          Offset +4: [ padding (4 bytes) ]
          Offset +8: [ double score (8 bytes) ]
          Offsets are immutably fixed at compile time. No dynamic field addition possible!
    checks:
      - kind: mcq
        q: 'How does attribute storage fundamentally differ between prototype-based OOP and C class-based structs?'
        choices:
          - 'Prototypes store attributes in dynamic runtime maps; C structs use fixed compile-time byte offsets from the base address'
          - 'Prototypes allocate attributes on the CPU stack; C structs allocate exclusively in the text segment'
          - 'Prototypes require explicit pointer dereferencing; C structs resolve members through runtime hash lookups'
          - 'Prototypes compile into read-only ELF sections; C structs allow dynamic memory expansion'
        answer: 0
        why: 'Section Object-oriented operations: Prototype languages use dynamic internal maps/hashes; class-based C maps fields to fixed struct offsets at compile time.'
        concept: prototype-vs-class-memory
      - kind: predict
        q: 'In C, what is the syntactic counterpart to a reference in object-oriented literature?'
        choices:
          - 'A pointer variable holding the memory address of the object'
          - 'A #define preprocessor macro alias'
          - 'An enum constant declared in a header file'
          - 'A typedef alias for a primitive integer'
        answer: 0
        why: 'Section Object-oriented operations: In C, pointers are the direct syntactic counterpart to references; an object is the allocated memory, while a pointer refers to it.'
        concept: pointer-as-reference
      - kind: why-fails
        q: 'Why does C forbid adding a new field to an existing struct instance at runtime?'
        choices:
          - 'C struct types have rigid compile-time layouts with fixed byte sizes calculated by the compiler'
          - 'The operating system locks stack frames in write-protected memory pages'
          - 'C does not support pointer arithmetic on user-defined types'
          - 'The preprocessor strips all struct declarations before code generation'
        answer: 0
        why: 'Class-based systems enforce static templates. The compiler computes offsets and allocation sizes at compile time; runtime layout mutation is impossible.'
        concept: static-layout-invariance
    common_bugs:
      - 'Confusing an object instance with the pointer variable that references it'
      - 'Expecting to dynamically inject attributes into C structs like in JavaScript or Python'

  - id: b4
    type: syntax
    title: 'Attribute encapsulation: Structs, typed capsules, and member access'
    explain_md: |
      Encapsulation is the act of bundling related data attributes and behaviors
      into a single cohesive capsule representing an object. Without language support,
      programmers can only simulate encapsulation implicitly by inventing variable
      names (e.g. `pixel_p1_x`, `pixel_p1_y`). The compiler remains oblivious to such
      grouping, treating them as independent, disconnected memory cells.

      In C, structures (`struct`) provide explicit attribute encapsulation:
      1. Creating a new type: Wrapping attributes in `typedef struct { ... } pixel_t;`
         introduces a new distinct user type to the compiler. The `_t` suffix is the
         canonical POSIX and C community idiom denoting user-defined types.
      2. Explicit instantiation: Declaring `pixel_t p1, p2;` directs the compiler to
         allocate distinct memory blocks, each containing exactly the fields defined in
         the template.
      3. Member access:
         - Direct access (Stack object / value): `p1.x = 56;`
         - Indirect access (Pointer / reference): `p1_ptr->x = 56;` (syntactic sugar
           for `(*p1_ptr).x = 56;`).

      Crucial Limitation: A C struct provides ONLY attribute encapsulation. C syntax
      does NOT allow functions inside structs. Therefore, a C struct is NOT a full
      class on its own — it is solely an attribute structure.
    example:
      lang: c
      adapted: false
      code: |
        typedef struct {
          int x, y;
          int red, green, blue;
        } pixel_t;
        
        void demo_pixel(void) {
          pixel_t p1;
          p1.x = 56;
          p1.y = 34;
          p1.red = 123;
          
          pixel_t* ptr = &p1;
          ptr->green = 37;
        }
      subgoals:
        - label: "Encapsulate attributes into a user type definition"
          lines: [1, 2, 3, 4]
        - label: "Instantiate stack object and access members directly"
          lines: [7, 8, 9, 10]
        - label: "Access members indirectly through pointer reference"
          lines: [12, 13]
    checks:
      - kind: fillblank
        q: 'Complete the declaration of the pixel attribute structure using canonical C typing conventions:'
        code: |
          typedef struct {
            int x, y;
            int red, green, blue;
          } ______;
        answer_text: 'pixel_t'
        why: 'In C, user types representing attribute capsules canonically end with the _t suffix (Code Box 6-4).'
        concept: struct-type-naming
      - kind: why-fails
        q: 'Why does the author state that a C structure alone cannot be the direct counterpart of an OOP class?'
        choices:
          - 'A C struct can only encapsulate data attributes, whereas an OOP class encapsulates both attributes and behaviors'
          - 'C structs cannot be allocated on the heap'
          - 'Pointers cannot reference struct addresses without compiler warnings'
          - 'A struct cannot contain more than four primitive integer variables'
        answer: 0
        why: 'Section Attribute encapsulation: A class encompasses both attributes and functionalities. Since a C structure only holds attributes, it is an attribute structure, not a full class.'
        concept: struct-vs-class
      - kind: predict
        q: 'Trace line by line. Given `pixel_t p; pixel_t *ptr = &p; ptr->red = 255;`, what is the value of `p.red`?'
        choices:
          - '255'
          - '0'
          - 'Garbage value'
          - 'Segmentation fault'
        answer: 0
        why: 'ptr holds &p; writing through ptr->red dereferences the pointer to mutate the memory cell of p.red directly.'
        concept: arrow-member-deref
      - kind: order
        q: 'Arrange the statements in execution order to create, construct, and mutate an attribute struct:'
        lines:
          - 'typedef struct { int x, y; } point_t;'
          - 'point_t pt;'
          - 'pt.x = 100;'
          - 'pt.y = 200;'
          - 'point_t pt = pt.x + pt.y;'
        answer_order: [0, 1, 2, 3]
        why: 'First declare the type template, then instantiate the storage, and finally initialize the attribute values. Distractor 4 attempts invalid circular initialization.'
        concept: struct-lifecycle-order
    common_bugs:
      - 'Confusing direct dot access (.) with pointer arrow access (->)'
      - 'Believing a C struct is identical to a C++ class without behavior functions'

  - id: b5
    type: design
    title: 'The architectural frontier: Bridging procedural silicon and conceptual objects'
    explain_md: |
      Why is C not object-oriented? It is not due to historical age or oversight. If
      it were an oversight, the ANSI/ISO committee could have introduced class syntax
      in C89, C99, C11, or C18. Furthermore, C++ was created as an object-oriented
      language directly on top of C, yet the worldwide demand for raw C engineers
      remains as strong as ever.

      The profound reason lies in computer architecture:
      - Human thinking is object-oriented: We conceptualize problems as interacting
        entities with states and behaviors.
      - Hardware CPUs are purely procedural: A physical microprocessor executes a linear
        stream of binary instructions, register manipulations, memory loads/stores,
        and branching jumps (`JMP`, `CALL`, `RET`).

      C resides precisely on the architectural frontier between conceptual human thinking
      and procedural hardware execution. Without a procedural systems language at this
      boundary, high-level languages like Java, Python, and JavaScript could not exist.
      The Java Virtual Machine (JVM), CPython runtime, and V8 engine are themselves
      engineered in C/C++ to bridge high-level OOP concepts down to the OS kernel and
      procedural CPU instructions via the C standard library (`libc`).

      C cannot and should not be OOP. Rather than inventing heavy macro frameworks that
      obfuscate the language, idiomatic C embraces raw, transparent procedural mechanics
      to implement object-oriented architectures.
    example:
      lang: c
      adapted: false
      code: |
        /* High-level OOP concept vs Low-level procedural lowering */
        /* In OOP C++:   car.Accelerate();                        */
        /* Lowered in C: car_accelerate(&car);                    */
        /* Lowered in Assembly:                                   */
        /*   leaq -16(%rbp), %rdi  # Pass &car in 1st arg reg    */
        /*   call car_accelerate   # Jump to function address     */
      subgoals:
        - label: "Show high-level method invocation"
          lines: [2]
        - label: "Show equivalent procedural lowering with explicit instance address"
          lines: [3]
        - label: "Show procedural assembly translation on CPU"
          lines: [4, 5, 6]
    checks:
      - kind: eipe
        q: 'In one sentence, what architectural purpose does C serve by remaining a procedural language?'
        choices:
          - 'It acts as the essential bridge translating high-level human object-oriented models into low-level procedural CPU instructions'
          - 'It guarantees that all programs run with zero dynamic memory allocation'
          - 'It compiles faster than all other languages by deleting object symbols'
          - 'It restricts hardware execution to a single CPU core'
        answer: 0
        why: 'Section C is not object-oriented, but why?: C sits on the barrier between human OO models and CPU procedural execution, enabling high-level runtimes to bridge to silicon.'
        concept: c-architectural-frontier
      - kind: why-fails
        q: 'A developer claims: "C is procedural solely because Dennis Ritchie developed it before OOP was invented." Why does the book reject this claim?'
        choices:
          - 'OOP was already established (Simula, Smalltalk), and modern C deliberately remains procedural to serve as the hardware abstraction layer'
          - 'Dennis Ritchie did include the class keyword in C72 but compilers dropped it'
          - 'All C codebases automatically compile to pure object-oriented bytecode'
          - 'Procedural programming was invented decades after C++'
        answer: 0
        why: 'C standards (C99, C11, C18) intentionally maintain C as a procedural systems language to interface cleanly with hardware and OS kernels.'
        concept: c-history-purpose
      - kind: choose-better
        q: 'When architecting an object-oriented system in C, which design philosophy aligns with mature open-source projects like the Linux kernel and OpenSSL?'
        choices:
          - 'Use raw C structs and explicit behavior functions adhering to clean naming conventions'
          - 'Construct a massive preprocessor macro framework that simulates C++ class and virtual syntax'
        answer: 0
        why: 'The author notes that mature C projects avoid macro-based fake C++ languages, choosing transparent raw C structs and functions instead.'
        concept: raw-c-vs-macro-oop
    common_bugs:
      - 'Believing C is outdated because it lacks a class keyword'
      - 'Attempting to build fragile macro preprocessors to mimic C++ in C'

  - id: b6
    type: syntax
    title: 'Behavior encapsulation: Free functions, prefixes, and instance pointers'
    explain_md: |
      To achieve object orientation in C, we combine explicit attribute encapsulation
      with implicit behavior encapsulation. Because C structures cannot contain
      functions, behaviors are declared as standalone C functions outside the struct.

      The Canonical C Object Pattern (used by `libcurl`, Linux kernel, GTK/GLib):
      1. Attribute structure: Declared in a header (`car_t` in `car.h`).
      2. Prefixed functions: Behavior functions share a common prefix matching the
         class name (`car_construct`, `car_accelerate`, `car_brake`, `car_destruct`).
      3. Instance pointer as first argument: Every behavior function receives a pointer
         to the attribute struct as its first parameter (`car_t* car`). This allows
         the behavior to read and mutate the target instance state.
      4. Header/Source split: Prototypes are published in the declaration header;
         definitions reside in the `.c` source file.

      Critical Insight — Code Sharing:
      Each object has its own dedicated attribute structure variable in memory, but
      ALL objects of that class share the exact same behavior function instructions
      in the `.text` code segment! When you invoke `car_accelerate(&car1)` and
      `car_accelerate(&car2)`, the CPU executes the exact same machine instructions,
      differing only in the address passed in the first argument register (`%rdi`).

      In C++, the compiler automates this: `car.Accelerate()` implicitly passes the
      address of `car` as the invisible `this` pointer to the member function.
    example:
      lang: c
      adapted: false
      code: |
        typedef struct {
          char name[32];
          double speed;
          double fuel;
        } car_t;
        
        void car_construct(car_t* car, const char* name);
        void car_destruct(car_t* car);
        void car_accelerate(car_t* car);
        void car_refuel(car_t* car, double amount);
      subgoals:
        - label: "Encapsulate instance state in attribute struct"
          lines: [1, 2, 3, 4, 5]
        - label: "Declare lifecycle and behavior functions with instance pointer"
          lines: [7, 8, 9, 10]
    viz:
      kind: ascii-memory
      steps:
        - |
          Code Segment (.text - Read Only):
          car_accelerate() instructions: [ load fuel, sub 1.0, load speed, add 0.05, store ]
          (Shared once across all instances)
        - |
          Stack Memory (Two distinct instances):
          car1 at 0x7ffd10: { name: "Renault", speed: 0.0, fuel: 100.0 }
          car2 at 0x7ffd40: { name: "Ferrari", speed: 0.0, fuel: 80.0  }
        - |
          Execution: car_accelerate(&car1) -> passes 0x7ffd10 to function
          Mutates ONLY memory at 0x7ffd10: car1.speed=0.05, car1.fuel=99.0
          car2 at 0x7ffd40 remains completely unchanged!
    checks:
      - kind: predict
        q: 'Trace the state of `car.speed` and `car.fuel` after calling `car_refuel(&car, 10.0)` followed by two calls to `car_accelerate(&car)` (each adds 0.05 speed, subtracts 1.0 fuel):'
