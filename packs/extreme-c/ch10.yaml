  - id: b10
    type: algorithm
    title: 'Aggregation lifecycle: Independent destruction and caller responsibility'
    explain_md: |
      The caller is the true owner in aggregation. The main program creates both
      objects, links them temporarily, and destroys both at the end.

      The scenario, step by step:
        1. Independent creation. `gun_new(); gun_ctor(gun, 3);` creates the gun.
           `player_new(); player_ctor(player, "Billy");` creates the player. Neither
           knows about the other yet.
        2. Attachment. `player_pickup_gun(player, gun);` begins the aggregation. The
           player borrows the gun address.
        3. Interaction. The loops shoot the gun until it is empty, then refill and
           shoot again. The player delegates each shot to the shared gun.
        4. Detachment. `player_drop_gun(player);` ends the aggregation. The player
           clears its pointer; the gun is untouched.
        5. Independent destruction. The caller destroys the player and the gun
           separately, in either order, because they have independent lifetimes.

      Two invariants make this safe:
        - The player destructor never frees the gun.
        - The caller frees the gun exactly once, after the player is done with it.

      If the player were destroyed while still holding the gun, nothing bad would
      happen to the gun: the player destructor does not touch it, so the caller could
      safely hand the same gun to another player. This is the flexibility that
      aggregation buys and composition forbids.

      The gun component itself is trivial and self-contained: it stores a bullet
      count, its constructor clamps a non-positive initial count to zero, `gun_trigger`
      decrements the count, and `gun_refill` resets it to a fixed magazine size. The
      gun does not know it is being borrowed.
    example:
      lang: c
      adapted: true
      code: |
        #include <stdlib.h>

        struct gun_t;
        struct gun_t* gun_new(void);
        void gun_ctor(struct gun_t*, int);
        int gun_has_bullets(struct gun_t*);
        void gun_trigger(struct gun_t*);
        void gun_refill(struct gun_t*);
        void gun_dtor(struct gun_t*);

        struct player_t;
        struct player_t* player_new(void);
        void player_ctor(struct player_t*, const char*);
        void player_dtor(struct player_t*);
        void player_pickup_gun(struct player_t*, struct gun_t*);
        void player_shoot(struct player_t*);
        void player_drop_gun(struct player_t*);

        int main(void) {
          struct gun_t* gun = gun_new();
          gun_ctor(gun, 3);
          struct player_t* player = player_new();
          player_ctor(player, "Billy");
          player_pickup_gun(player, gun);
          while (gun_has_bullets(gun)) {
            player_shoot(player);
          }
          gun_refill(gun);
          while (gun_has_bullets(gun)) {
            player_shoot(player);
          }
          player_drop_gun(player);
          player_dtor(player);
          free(player);
          gun_dtor(gun);
          free(gun);
          return 0;
        }
      subgoals:
        - label: "Declare both independent component interfaces"
          lines: [3, 4, 5, 6, 7, 8, 9, 11, 12, 13, 14, 15, 16, 17]
        - label: "Create both objects independently in the caller"
          lines: [20, 21, 22, 23]
        - label: "Attach the aggregation reference and use the child"
          lines: [24, 25, 26, 27, 28, 29, 30, 31]
        - label: "Detach and independently destroy both objects"
          lines: [32, 33, 34, 35, 36, 37]
    viz:
      kind: ascii-memory
      steps:
        - |
          Step 1: gun created by main() @ 0x602000  [ bullets = 3 ]
        - |
          Step 2: player created by main() @ 0x604000  [ name = "Billy", gun = NULL ]
        - |
          Step 3: player_pickup_gun -> player.gun = 0x602000 (borrow begins)
        - |
          Step 4: shoot loops -> gun.bullets 3 -> 0, refill -> 7, shoot -> 0
        - |
          Step 5: player_drop_gun -> player.gun = NULL (borrow ends; gun intact)
        - |
          Step 6: main destroys player then gun; both blocks returned to the heap
    checks:
      - kind: predict
        q: 'Trace line by line. What happens to the gun object when the player is destroyed after `player_drop_gun(player)`?'
        choices:
          - 'The gun remains valid in heap memory, unaffected by the destruction of the player'
          - 'The gun is automatically freed by the operating system'
          - 'The gun pointer becomes dangling immediately'
          - 'The gun attributes are overwritten with zeros'
        answer: 0
        why: 'Independent lifetimes mean the player destructor does not touch the gun. Destroying the borrower has no effect on the borrowed object. Only the owner (main) may destroy the gun, and it does so explicitly.'
        concept: independent-lifetime-persistence
      - kind: why-fails
        q: 'Why does freeing the gun in main() BEFORE calling `player_shoot(player)` cause undefined behavior?'
        choices:
          - 'Because the compiler deletes all player functions once the gun is freed'
          - 'Because the player object is automatically converted into an engine object'
          - 'Because free() returns -1 when another struct references the target pointer'
          - 'Because the player still holds the gun address; dereferencing it after the free is a heap-use-after-free'
        answer: 3
        why: 'The player stored the gun address at pickup time. Freeing the gun returns its block to the allocator, but the player pointer still holds the old address. When the player shoots, it dereferences that stale address, reading or writing freed memory. The owner must free the gun only after all borrowers are done.'
        concept: premature-aggregation-destruction
      - kind: eipe
        q: 'In one sentence, what is the role of the caller (`main`) in an aggregation relationship?'
        choices:
          - 'The caller forces the container to take exclusive ownership of the child'
          - 'The caller copies the child object into read-only flash memory'
          - 'The caller compiles the source files into shared libraries'
          - 'The caller is the true owner responsible for allocating, linking, and deallocating both independent objects'
        answer: 3
        why: 'In aggregation the container is only a borrower. The caller creates both objects, attaches them temporarily, detaches them, and finally destroys both. The caller owns the lifecycles; the container owns nothing but its own state.'
        concept: aggregation-caller-responsibility
      - kind: mcq
        q: 'In the gun component, what does `gun_refill` do?'
        choices:
          - 'It frees the gun and allocates a new one'
          - 'It decrements the bullet count by one'
          - 'It resets the bullet count to a fixed magazine size'
          - 'It sets the bullet count to zero'
        answer: 2
        why: 'Refilling means restoring the magazine to its full fixed size. The gun implementation assigns a constant value to the bullet field. Decrementing is the trigger behavior, and freeing is unrelated to refilling.'
        concept: gun-refill-semantics
      - kind: trace
        q: 'Trace the gun bullet count through the full scenario. What is the value in the target cell?'
        code: |
          gun_ctor(gun, 3);
          player_pickup_gun(player, gun);
          player_shoot(player);
          player_shoot(player);
          player_shoot(player);
        trace:
          headers: ["Step", "Action", "gun->bullets"]
          rows:
            - step: 1
              line: 1
              cells: ["1", "ctor(3)", "3"]
            - step: 2
              line: 4
              cells: ["2", "shoot", "2"]
            - step: 3
              line: 5
              cells: ["3", "shoot", "1"]
            - step: 4
              line: 6
              cells: ["4", "shoot", "0"]
        target: {row: 3, col: 2}
        answer_text: "0"
        why: 'The gun starts at 3. Each of the three shots decrements the shared count: 3 -> 2 -> 1 -> 0. The trace target is the final row, whose bullet count is 0.'
        concept: aggregation-lifecycle-trace
    common_bugs:
      - 'Destroying an aggregated object while a borrower still references it'
      - 'Assuming container destruction cleans up the aggregated object'
      - 'Freeing the aggregated object twice (once by borrower, once by owner)'
  - id: b11
    type: design
    title: 'Mandatory versus optional aggregation, and class-level permanence'
    explain_md: |
      Aggregation has two flavors, decided by when the child address becomes known.

      Mandatory aggregation. The child is required for the container to be valid, so
      its address is passed to the constructor:
          void player_ctor(player_t* p, const char* name, struct gun_t* gun) {
            p->name = name;
            p->gun = gun;      /* always valid from construction on */
          }
      Because the pointer is always set, behaviors that use it need no NULL guard.

      Optional aggregation. The child may legitimately be absent, so the pointer
      starts at NULL and is attached later:
          p->gun = NULL;       /* in the constructor */
          ...
          p->gun = gun;        /* in player_pickup_gun */
      The price of this flexibility is the mandatory NULL guard on every use.

      Now the subtle point about classes versus instances. At runtime an aggregation
      link is temporary: a player picks up a gun, uses it, and drops it. But at the
      type level the relationship is PERMANENT. To allow any player instance to ever
      hold a gun, the `player_t` struct must permanently declare the pointer field.
      You cannot add or remove struct fields at runtime in C.

      The chapter states the rule: if there is even a small chance that two objects of
      two types will be related by aggregation, their types must be in the aggregation
      relationship permanently. The same holds for composition. This is why a
      relationship between objects always shows up as a permanent field in the
      container's attribute structure.

      A useful heuristic: the struct definition is the "permanent contract" of a class,
      while the pointer's runtime value is the "temporary fact" of an instance.
    example:
      lang: c
      adapted: true
      code: |
        /* Mandatory aggregation: the child address is required at construction */
        typedef struct {
          char* name;
          struct gun_t* gun;   /* always set by the constructor */
        } player_t;

        void player_ctor(player_t* p, const char* name, struct gun_t* gun) {
          p->name = name;
          p->gun = gun;
        }

        /* Optional aggregation: the child may be absent */
        typedef struct {
          char* name;
          struct gun_t* gun;   /* NULL until pickup */
        } optional_player_t;
      subgoals:
        - label: "Model mandatory aggregation with a constructor-supplied child"
          lines: [2, 3, 4, 5]
        - label: "Store the mandatory child address in the constructor"
          lines: [7, 8, 9, 10]
        - label: "Model optional aggregation with a NULL-able child"
          lines: [13, 14, 15, 16]
    checks:
      - kind: mcq
        q: 'How does mandatory aggregation differ from optional aggregation?'
        choices:
          - 'Mandatory aggregation uses a value member; optional uses a pointer member'
          - 'Mandatory aggregation passes the child address to the constructor; optional initializes the pointer to NULL and attaches it later'
          - 'Mandatory aggregation is C++-only; optional is C-only'
          - 'Optional aggregation forbids NULL pointers'
        answer: 1
        why: 'Both use pointers. The difference is when the link is established and whether it may be absent. Mandatory: the child is supplied at construction and is always valid. Optional: the pointer starts NULL and may be attached or left unset, so it needs a NULL guard.'
        concept: mandatory-vs-optional-aggregation
      - kind: choose-better
        q: 'A player may hold a gun for only five seconds during a long run. How should the relationship be represented in the type system?'
        choices:
          - 'Add the gun pointer to the struct only when the player picks it up'
          - 'Permanently declare the pointer field in the struct, and set/clear it at runtime'
          - 'Use a global variable so no struct field is needed'
          - 'Copy the entire gun into the player struct at pickup time'
        answer: 1
        why: 'C struct layouts are fixed at compile time; fields cannot be added at runtime. The permanent pointer field is the type-level representation of a temporary instance-level link. A global variable or a by-value copy would break encapsulation and sharing.'
        concept: instance-vs-class-permanence
      - kind: why-fails
        q: 'Why does omitting the `gun` pointer field from `player_t` break the aggregation design?'
        choices:
          - 'Because the compiler requires every struct to have at least two members'
          - 'Because the gun would then be stored in the text segment'
          - 'Because there would be no permanent place in the container to store the runtime address of the borrowed gun'
          - 'Because pointers cannot be declared inside typedef struct blocks'
        answer: 2
        why: 'The pointer field is the only storage that can hold the gun address for a given player instance. Without it, pickup has nowhere to record the link, and no player can ever reference a gun. The field must exist permanently even though the link is temporary.'
        concept: permanent-pointer-field-necessity
      - kind: predict
        q: 'Trace the type-level decision. If there is even a small chance that a player will ever hold a gun, what must `player_t` contain?'
        choices:
          - 'A permanent `struct gun_t* gun;` field, even if most players never use it'
          - 'Nothing, because the relationship is rare'
          - 'A fixed array of 7 gun objects'
          - 'A reference to the main function'
        answer: 0
        why: 'The chapter rule is explicit: a non-zero chance of an aggregation relationship requires a permanent pointer in the container struct. Rarity is a runtime property; the type must be able to express the relationship for every instance.'
        concept: class-level-relationship-permanence
      - kind: eipe
        q: 'In one sentence, why is aggregation permanent between classes but temporary between instances?'
        choices:
          - 'Because the container struct must permanently declare the pointer field, while each instance sets and clears that pointer during its life'
          - 'Because the compiler deletes unused struct fields at link time'
          - 'Because instances are stored in RAM and classes in ROM'
          - 'Because the C standard requires all pointers to be const'
        answer: 0
        why: 'The struct definition is fixed at compile time and must be able to express the link, so the field is permanent. The pointer value is runtime state that each instance changes, so the actual relationship is temporary. The type is the contract; the instance is the fact.'
        concept: type-contract-instance-fact
    common_bugs:
      - 'Trying to add a struct field at runtime to represent a link'
      - 'Confusing the permanent type-level relationship with the temporary instance-level link'
      - 'Leaving an optional aggregation pointer unguarded because the relationship is rare'
  - id: b12
    type: design
    title: 'Composition versus aggregation: Decision matrix and shared resources'
    explain_md: |
      Choosing between composition and aggregation is one of the most important
      architectural decisions in object-oriented design. The decision matrix:

      | Characteristic       | Composition              | Aggregation                |
      | :---                 | :---                     | :---                       |
      | Relationship strength| Strong ("death do us part")| Weak (borrowing)          |
      | Lifetime binding     | Bound to container       | Fully independent          |
      | Allocation owner     | Container ctor/dtor      | External caller or factory |
      | Pointer exposure     | Hidden, never leaked     | Exchanged via attach/detach|
      | Link duration        | Permanent per instance   | Temporary per instance     |
      | Type-level field     | Permanent                | Permanent                  |

      Design rule:
        - Use composition when the part has no valid existence or identity outside the
          whole: an engine in a car, a paragraph in a document, a motherboard in a
          computer.
        - Use aggregation when the part has an independent identity, can be shared, or
          outlives the whole: a player and a gun, a driver and a rented car, a
          department and a teacher.

      Shared resources are the classic trap. A database connection pool is used by many
      components. If you model it as composition, each container allocates its own
      private pool and destroys it when the container dies, which duplicates the
      resource and breaks sharing. Model shared resources as aggregation: one owner
      creates the pool, many containers borrow it, and the owner destroys it last.

      The deeper principle is ownership discipline: every dynamically allocated object
      must have exactly one clear owner responsible for its lifetime. Composition means
      the container owns the child; aggregation means the caller owns the child and the
      container merely borrows it. Ambiguity about ownership is what produces leaks,
      double-frees, and use-after-free bugs.
    example:
      lang: c
      adapted: true
      code: |
        /* Composition: a Document owns its Paragraphs; they die with it */
        typedef struct {
          struct paragraph_t* paragraphs[10];
          int count;
        } document_t;

        /* Aggregation: a Driver borrows a Car; the Car outlives the Driver */
        typedef struct {
          char* name;
          struct car_t* rented_car;   /* borrowed, not owned */
        } driver_t;
      subgoals:
        - label: "Model composition: container owns an array of child pointers"
          lines: [2, 3, 4, 5]
        - label: "Model aggregation: container borrows an external reference"
          lines: [8, 9, 10, 11]
    checks:
      - kind: choose-better
        q: 'You are designing desktop-computer software. How should you model a Motherboard versus an external USB flash drive?'
        choices:
          - 'Motherboard as composition (lifetime bound to the computer); USB drive as aggregation (pluggable and shareable)'
          - 'Both as composition, allocating both inside the Computer constructor'
          - 'Motherboard as aggregation; USB drive as composition'
          - 'Both as aggregation, so neither is owned by the Computer'
        answer: 0
        why: 'A motherboard has no existence outside its computer, so the computer owns it: composition. A USB drive has an independent identity, can be unplugged and shared, and outlives any computer it is attached to: aggregation. The lifetime and sharing properties decide the relationship.'
        concept: composition-vs-aggregation-selection
      - kind: mcq
        q: 'Which situation is the strongest signal that aggregation, not composition, is the correct relationship?'
        choices:
          - 'The child object is small enough to fit in a single cache line'
          - 'The child object is created inside the container constructor'
          - 'The child object has an independent identity and may be shared by or outlive multiple containers'
          - 'The child object is declared before the container in the source file'
        answer: 2
        why: 'Independent identity plus sharing or outliving the container is exactly the aggregation condition. Size, creation site, and source order are irrelevant. If the child can exist and be used without the container, it must be borrowed, not owned.'
        concept: aggregation-signal
      - kind: why-fails
        q: 'Why does modeling a shared database connection pool as composition cause defects?'
        choices:
          - 'Because shared resources can only be declared inside header guards'
          - 'Because the preprocessor rejects structs with more than one composition attribute'
          - 'Because composition prevents functions from running in parallel threads'
          - 'Because each container would allocate its own private duplicate pool, and destroying one container would prematurely destroy the shared pool'
        answer: 3
        why: 'Composition implies exclusive ownership. Applied to a shared resource, every container creates a redundant copy, and when any container is destroyed it frees the pool that others still use. Aggregation gives the pool one owner and lets containers borrow it, which preserves sharing.'
        concept: composition-misuse-shared-resource
      - kind: predict
        q: 'Trace the design decision. Which relationship is stronger: composition or aggregation?'
        choices:
          - 'Aggregation, because it uses pointers'
          - 'Composition, because the child lifetime is strictly enclosed within the container lifetime'
          - 'They are equally strong; the choice is purely stylistic'
          - 'Aggregation, because the child can be shared'
        answer: 1
        why: 'Strength is measured by lifetime coupling. Composition binds the child to the container absolutely, so it is the stronger form of possession. Aggregation is weaker because the child is independent. The pointer detail and sharing are consequences, not the definition of strength.'
        concept: relationship-strength
      - kind: eipe
        q: 'In one sentence, what is the core architectural principle that prevents memory corruption when modeling object relationships in C?'
        choices:
          - 'Allocate every object on the stack so the heap is never used'
          - 'Eliminate all struct pointers and use global arrays exclusively'
          - 'Strict ownership discipline: every dynamically allocated object has exactly one clear owner responsible for its lifetime'
          - 'Run AddressSanitizer in production so invalid pointer accesses are ignored'
        answer: 2
        why: 'Leaks, double-frees, and use-after-free all come from ambiguous ownership. Composition gives the container sole ownership of the child; aggregation gives the caller sole ownership while the container only borrows. Naming the single owner for every allocation makes cleanup deterministic.'
        concept: ownership-discipline
    common_bugs:
      - 'Using composition for shared resources, causing duplication and premature destruction'
      - 'Using aggregation without documenting who owns and destroys the shared object'
      - 'Treating the pointer-vs-value distinction as the composition/aggregation discriminator'
cards:
  - front: 'What is the primary difference between a class and an object in C?'
    back: 'A class is a compile-time blueprint that consumes zero runtime bytes; an object is a concrete runtime allocation that holds state.'
    concept: class-vs-object
  - front: 'What single condition makes a to-have relationship a composition?'
    back: 'The contained object lifetime is bound to the container lifetime and the container owns the child.'
    concept: composition-definition
  - front: 'What single condition makes a to-have relationship an aggregation?'
    back: 'The contained object lifetime is independent of the container; the container only borrows the child.'
    concept: aggregation-definition
  - front: 'Why must a container never free an aggregated object in its destructor?'
    back: 'Because the container does not own it; freeing it causes a double-free or destroys an object another owner still uses.'
    concept: aggregation-free-prohibition
  - front: 'What defensive check is mandatory before using an optional aggregation pointer?'
    back: 'Test that the pointer is not NULL before dereferencing it.'
    concept: aggregation-null-guard
  - front: 'How should a query about a composed child be exposed to external callers?'
    back: 'Through a delegation function in the container interface, without leaking the private child pointer.'
    concept: delegation-encapsulation
  - front: 'WHEN must an aggregation pointer be initialized to NULL?'
    back: 'In the constructor, whenever the child is optional and may not be attached yet; NULL makes absence a testable sentinel.'
    concept: aggregation-null-initialization
  - front: 'Why is aggregation permanent between classes but temporary between instances?'
    back: 'The container struct must permanently declare the pointer field to express the link, while each instance sets and clears it at runtime.'
    concept: class-level-permanence
  - front: 'What is mandatory aggregation?'
    back: 'Aggregation whose child address is required at construction, so the constructor receives it and the pointer is always valid.'
    concept: mandatory-aggregation
  - front: 'What is the ownership-discipline principle for C object relationships?'
    back: 'Every dynamically allocated object has exactly one owner responsible for its lifetime; composition gives the container ownership, aggregation gives the caller ownership.'
    concept: ownership-discipline

labs:
  - id: lab1
    title: 'Encapsulating the Engine state machine'
    instruction_md: |-
      ### Pedagogical Mission
      Build a modular, encapsulated **Engine** component in C. The header already
      publishes the public interface; you implement the private state machine in
      `engine.c`.

      ### Requirements
      1. Define the internal `struct engine_t` in `engine.c` so its layout is hidden
         from every caller. It must hold the engine state and its temperature.
      2. Implement `engine_new(void)`: allocate the engine on the heap, set the state
         to `ENGINE_OFF`, and set the temperature to `15.0` (ambient).
      3. Implement `engine_turn_on` and `engine_turn_off` with defensive guards: a
         redundant toggle must be a safe no-op. Turning on sets the temperature to
         `75.0`; turning off sets it back to `15.0`.
      4. Implement `engine_get_temperature(const engine_t*)` returning the current
         temperature, and `engine_free(engine_t*)` releasing the heap memory.

      ### Verification
      Run the hidden tests with the `t` key. They initially fail because `engine.c`
      is empty; they pass once your implementation is correct.
    files:
      - path: engine.h
        content: |
          #ifndef ENGINE_H
          #define ENGINE_H

          typedef enum {
            ENGINE_OFF,
            ENGINE_ON
          } engine_state_t;

          typedef struct engine_t engine_t;

          engine_t* engine_new(void);
          void engine_free(engine_t* engine);
          void engine_turn_on(engine_t* engine);
          void engine_turn_off(engine_t* engine);
          double engine_get_temperature(const engine_t* engine);

          #endif
      - path: engine.c
        content: ''
      - path: main.c
        content: |
          #include <stdio.h>
          #include "engine.h"

          int main(void) {
            engine_t* engine = engine_new();
            printf("Engine created. Temp: %.1f C\n", engine_get_temperature(engine));
            engine_turn_on(engine);
            printf("Engine turned on. Temp: %.1f C\n", engine_get_temperature(engine));
            engine_turn_off(engine);
            printf("Engine turned off. Temp: %.1f C\n", engine_get_temperature(engine));
            engine_free(engine);
            return 0;
          }
      - path: test_runner.c
        content: |
          #include <stdio.h>
          #include <assert.h>
          #include "engine.h"

          int main(void) {
            engine_t* eng = engine_new();
            assert(eng != NULL);
            assert(engine_get_temperature(eng) == 15.0);

            engine_turn_on(eng);
            assert(engine_get_temperature(eng) == 75.0);

            /* Redundant turn on must be a safe no-op. */
            engine_turn_on(eng);
            assert(engine_get_temperature(eng) == 75.0);

            engine_turn_off(eng);
            assert(engine_get_temperature(eng) == 15.0);

            /* Redundant turn off must be a safe no-op. */
            engine_turn_off(eng);
            assert(engine_get_temperature(eng) == 15.0);

            engine_free(eng);
            printf("ENGINE TESTS PASSED\n");
            return 0;
          }
    commands:
      run: gcc -Wall -Wextra -std=c99 engine.c main.c -o app && ./app
      test: gcc -Wall -Wextra -std=c99 engine.c test_runner.c -o test_runner && ./test_runner
    test_cases:
      - name: Engine program execution trace
        stdin: ''
        expect: |
          Engine created. Temp: 15.0 C
          Engine turned on. Temp: 75.0 C
          Engine turned off. Temp: 15.0 C
        expect_exit: 0
    hints:
      - 'Start by defining the private struct engine_t with a state field and a double temperature field.'
      - 'In engine_new, malloc the struct, then initialize state to ENGINE_OFF and temperature to 15.0.'
      - 'Guard each toggle: only change state and temperature when the current state differs from the target.'
  - id: lab2
    title: 'Composition: a Car that owns its Engine'
    instruction_md: |-
      ### Pedagogical Mission
      Model an owned **composition** relationship in C. The `engine` module is
      provided as a supporting component; you implement `car.c`, the container that
      owns an engine and delegates to it.

      ### Requirements
      1. Define the private `struct car_t` in `car.c`. It must hold a pointer to the
         engine it owns.
      2. Implement `car_new(void)`: allocate the car and its owned engine, and
         construct the engine so it starts in the OFF state at 15.0 C.
      3. Implement `car_start` and `car_stop` by delegating to the engine public
         interface (`engine_turn_on` / `engine_turn_off`).
      4. Implement `car_get_engine_temperature` by querying the internal engine.
      5. Implement `car_free(car_t*)`: destruct and free the owned engine BEFORE
         freeing the car itself. Never leak the engine.

      ### Verification
      The hidden tests initially fail because `car.c` is empty. They pass once the
      composition ownership and destruction order are correct.
    files:
      - path: engine.h
        content: |
          #ifndef ENGINE_H
          #define ENGINE_H

          typedef enum { ENGINE_OFF, ENGINE_ON } engine_state_t;
          typedef struct engine_t engine_t;

          engine_t* engine_new(void);
          void engine_free(engine_t* engine);
          void engine_turn_on(engine_t* engine);
          void engine_turn_off(engine_t* engine);
          double engine_get_temperature(const engine_t* engine);

          #endif
      - path: engine.c
        content: |
          #include <stdlib.h>
          #include "engine.h"

          struct engine_t {
            engine_state_t state;
            double temperature;
          };

          engine_t* engine_new(void) {
            engine_t* eng = (engine_t*)malloc(sizeof(engine_t));
            if (!eng) return NULL;
            eng->state = ENGINE_OFF;
            eng->temperature = 15.0;
            return eng;
          }

          void engine_free(engine_t* engine) { free(engine); }

          void engine_turn_on(engine_t* engine) {
            if (!engine || engine->state == ENGINE_ON) return;
            engine->state = ENGINE_ON;
            engine->temperature = 75.0;
          }

          void engine_turn_off(engine_t* engine) {
            if (!engine || engine->state == ENGINE_OFF) return;
            engine->state = ENGINE_OFF;
            engine->temperature = 15.0;
          }

          double engine_get_temperature(const engine_t* engine) {
            return engine ? engine->temperature : 0.0;
          }
      - path: car.h
        content: |
          #ifndef CAR_H
          #define CAR_H

          typedef struct car_t car_t;

          car_t* car_new(void);
          void car_free(car_t* car);
          void car_start(car_t* car);
          void car_stop(car_t* car);
          double car_get_engine_temperature(const car_t* car);

          #endif
      - path: car.c
        content: ''
      - path: main.c
        content: |
          #include <stdio.h>
          #include "car.h"

          int main(void) {
            car_t* car = car_new();
            printf("Car created. Engine temp: %.1f C\n", car_get_engine_temperature(car));
            car_start(car);
            printf("Car started. Engine temp: %.1f C\n", car_get_engine_temperature(car));
            car_stop(car);
            printf("Car stopped. Engine temp: %.1f C\n", car_get_engine_temperature(car));
            car_free(car);
            return 0;
          }
      - path: test_runner.c
        content: |
          #include <stdio.h>
          #include <assert.h>
          #include "car.h"

          int main(void) {
            car_t* car = car_new();
            assert(car != NULL);
            assert(car_get_engine_temperature(car) == 15.0);

            car_start(car);
            assert(car_get_engine_temperature(car) == 75.0);

            car_stop(car);
            assert(car_get_engine_temperature(car) == 15.0);

            car_free(car);
            printf("CAR COMPOSITION TESTS PASSED\n");
            return 0;
          }
    commands:
      run: gcc -Wall -Wextra -std=c99 engine.c car.c main.c -o app && ./app
      test: gcc -Wall -Wextra -std=c99 engine.c car.c test_runner.c -o test_runner && ./test_runner
    test_cases:
      - name: Car composition program trace
        stdin: ''
        expect: |
          Car created. Engine temp: 15.0 C
          Car started. Engine temp: 75.0 C
          Car stopped. Engine temp: 15.0 C
        expect_exit: 0
    hints:
      - 'Define struct car_t with a single member: a pointer to struct engine_t.'
      - 'In car_new, malloc the car, then call engine_new and store the result in the car pointer member.'
      - 'In car_free, call engine_free on the owned engine before freeing the car itself.'
  - id: lab3
    title: 'Aggregation: a Player that borrows a Gun'
    instruction_md: |-
      ### Pedagogical Mission
      Model a **aggregation** relationship in C. The `gun` module is provided as a
      supporting component; you implement `player.c`, the container that borrows a gun
      without owning it.

      ### Requirements
      1. Define the private `struct player_t` in `player.c`. It must hold the player
         name and a pointer to the borrowed gun.
      2. Implement `player_new(const char*)`: allocate the player and initialize the
         gun pointer to `NULL`. The player starts with no gun.
      3. Implement `player_pickup_gun` to attach the borrowed gun address, and
         `player_drop_gun` to detach it by setting the pointer back to `NULL`. Never
         free the gun from the player.
      4. Implement `player_shoot`: if the player has no gun, do nothing and report
         failure; otherwise delegate to `gun_shoot`.
      5. Implement `player_has_gun` and `player_free`. `player_free` must free only the
         player, never the borrowed gun.

      ### Verification
      The hidden tests initially fail because `player.c` is empty. They pass once the
      borrowing semantics, NULL initialization, and NULL guard are correct.
    files:
      - path: gun.h
        content: |
          #ifndef GUN_H
          #define GUN_H

          typedef struct gun_t gun_t;

          gun_t* gun_new(int bullets);
          void gun_free(gun_t* gun);
          int gun_shoot(gun_t* gun);
          int gun_get_bullets(const gun_t* gun);

          #endif
      - path: gun.c
        content: |
          #include <stdlib.h>
          #include "gun.h"

          struct gun_t {
            int bullets;
          };

          gun_t* gun_new(int bullets) {
            gun_t* g = (gun_t*)malloc(sizeof(gun_t));
            if (!g) return NULL;
            g->bullets = bullets > 0 ? bullets : 0;
            return g;
          }

          void gun_free(gun_t* gun) { free(gun); }

          int gun_shoot(gun_t* gun) {
            if (!gun || gun->bullets <= 0) return 0;
            gun->bullets--;
            return 1;
          }

          int gun_get_bullets(const gun_t* gun) {
            return gun ? gun->bullets : 0;
          }
      - path: player.h
        content: |
          #ifndef PLAYER_H
          #define PLAYER_H

          #include "gun.h"

          typedef struct player_t player_t;

          player_t* player_new(const char* name);
          void player_free(player_t* player);
          void player_pickup_gun(player_t* player, gun_t* gun);
          gun_t* player_drop_gun(player_t* player);
          int player_shoot(player_t* player);
          int player_has_gun(const player_t* player);

          #endif
      - path: player.c
        content: ''
      - path: main.c
        content: |
          #include <stdio.h>
          #include "player.h"
          #include "gun.h"

          int main(void) {
            gun_t* gun = gun_new(3);
            player_t* player = player_new("Alice");

            printf("Player has gun: %s\n", player_has_gun(player) ? "YES" : "NO");
            player_pickup_gun(player, gun);
            printf("Player picked up gun. Bullets: %d\n", gun_get_bullets(gun));

            player_shoot(player);
            printf("Player shot. Bullets remaining: %d\n", gun_get_bullets(gun));

            player_drop_gun(player);
            printf("Player dropped gun. Has gun: %s\n",
                   player_has_gun(player) ? "YES" : "NO");

            player_free(player);
            gun_free(gun);
            return 0;
          }
      - path: test_runner.c
        content: |
          #include <stdio.h>
          #include <assert.h>
          #include "player.h"
          #include "gun.h"

          int main(void) {
            gun_t* gun = gun_new(2);
            assert(gun != NULL);

            player_t* player = player_new("Alice");
            assert(player != NULL);
            assert(player_has_gun(player) == 0);
            assert(player_shoot(player) == 0);

            player_pickup_gun(player, gun);
            assert(player_has_gun(player) == 1);
            assert(player_shoot(player) == 1);
            assert(gun_get_bullets(gun) == 1);

            gun_t* dropped = player_drop_gun(player);
            assert(dropped == gun);
            assert(player_has_gun(player) == 0);
            assert(player_shoot(player) == 0);

            player_free(player);
            assert(gun_get_bullets(gun) == 1);
            gun_free(gun);

            printf("PLAYER AGGREGATION TESTS PASSED\n");
            return 0;
          }
    commands:
      run: gcc -Wall -Wextra -std=c99 gun.c player.c main.c -o app && ./app
      test: gcc -Wall -Wextra -std=c99 gun.c player.c test_runner.c -o test_runner && ./test_runner
    test_cases:
      - name: Player aggregation program trace
        stdin: ''
        expect: |
          Player has gun: NO
          Player picked up gun. Bullets: 3
          Player shot. Bullets remaining: 2
          Player dropped gun. Has gun: NO
        expect_exit: 0
    hints:
      - 'Define struct player_t with a char* name and a gun_t* gun member.'
      - 'In player_new, set the gun pointer to NULL so the player starts unarmed.'
      - 'In player_shoot, check player->gun before calling gun_shoot; in player_free, never free the gun.'
quiz:
- kind: mcq
  level: core
  q: A `car_t` composes an `engine_t`, and a `driver_t` aggregates a `car_t`. When main creates one driver, one car, and the car composes its engine, how many heap allocations occur?
  choices:
  - 3 (the driver, the car, and the engine)
  - 2 (the car and the engine)
  - 4 (the driver, the car, the engine, and an extra engine copy)
  - 5 (two engines plus driver, car, and a spare)
  answer: 0
  why: 'main allocates the driver and the car; the car constructor allocates the engine through composition. The driver only stores the car address, so it allocates nothing extra. Total: driver + car + engine = 3 allocations.'
  concept: composition-aggregation-allocation-count
- kind: why-fails
  level: core
  q: A car destructor calls `free(car->engine)` but forgets `engine_dtor(car->engine)`. Why is this a defect even though the engine destructor is empty in the example?
  choices:
  - Because free() cannot be called before a destructor in C
  - Because the destructor is the designated place for child-specific cleanup, and skipping it breaks the symmetry and will leak if the child later owns resources
  - Because it is not a defect; the destructor is empty
  - Because the compiler requires every free to be preceded by a dtor call
  answer: 1
  why: The empty destructor is incidental. The contract is that every constructed child is destructed and every allocated child is freed. If the engine later owns a buffer or a stream, skipping engine_dtor leaks it. Destruct-then-free must always be paired.
  concept: destructor-symmetry-contract
- kind: predict
  level: core
  q: A driver aggregates a car, and the car composes an engine. After `driver_drop_car(driver); driver_dtor(driver); free(driver);`, what is the state of the car and the engine?
  choices:
  - Both the car and the engine are freed
  - The car is freed but the engine leaks
  - Neither is freed; the caller still owns them
  - The engine is freed but the car leaks
  answer: 2
  why: The driver only borrowed the car; its destructor must not free the car. The car and its engine remain owned by the caller and must be destroyed separately. Aggregation does not cascade into the container composition.
  concept: aggregation-no-cascade
- kind: choose-better
  level: core
  q: A car composes an engine and aggregates a driver. Which object is responsible for freeing the engine?
  choices:
  - The driver, because it uses the car
  - The caller, because it created everything
  - The engine frees itself
  - The car, because it owns the engine through composition
  answer: 3
  why: Composition assigns ownership to the container. The car destructor frees the engine. The driver is a borrower of the car and must not free the car or its engine.
  concept: ownership-in-mixed-relationships
- kind: eipe
  level: core
  q: In one sentence, what does it mean that a composed child is private to its container?
  choices:
  - The child pointer is never returned to callers; access happens only through container behavior functions
  - The child is stored in a separate process
  - The child is encrypted at rest
  - The child cannot be constructed
  answer: 0
  why: Privacy means the container mediates all access. The child pointer stays inside the container, and callers use delegation functions. This preserves encapsulation and the ownership invariant.
  concept: composition-privacy
- kind: mcq
  level: advanced
  q: A player aggregates a gun, and a team aggregates players. Who owns the gun?
  choices:
  - The team, because it contains the players
  - The caller or armory that created the gun, not the team or the player
  - The player, because it holds the gun
  - The gun owns itself
  answer: 1
  why: Aggregation never transfers ownership. The team borrows players, and players borrow the gun. The original creator remains the sole owner and must free the gun. Ownership does not cascade through aggregation.
  concept: aggregation-ownership-non-cascade
- kind: why-fails
  level: advanced
  q: A team destructor frees its players but not the gun they hold. The caller then frees the gun. Is this correct?
  choices:
  - No, the team must free the gun because it contains the players
  - No, the players must free the gun in their own destructors
  - Yes, because the team does not own the gun; the caller does
  - Yes, but only if the team is the last borrower
  answer: 2
  why: The team owns its players (composition) but not the gun (aggregation). Freeing the players is correct; leaving the gun to the caller is correct. The caller, as the gun owner, frees it exactly once.
  concept: mixed-ownership-correctness
- kind: predict
  level: advanced
  q: A player picks up a gun, drops it, and is then destroyed. How many times has the gun been freed at that point?
  choices:
  - 1 (the drop freed it)
  - 2 (the drop and the player destruction)
  - It depends on the gun implementation
  - 0 (the gun is still owned by its creator)
  answer: 3
  why: Dropping only clears the player pointer; it does not free the gun. The player destructor does not touch the gun. So the gun has been freed zero times and remains valid for its owner to free later.
  concept: detach-is-not-free
- kind: trace
  level: advanced
  q: Two players borrow the same gun. Player A shoots twice, player B shoots once. What is the value in the target cell?
  code: 'gun_ctor(gun, 5);

    player_pickup_gun(player_a, gun);

    player_pickup_gun(player_b, gun);

    player_shoot(player_a);

    player_shoot(player_a);

    player_shoot(player_b);

    '
  trace:
    headers:
    - Step
    - Action
    - gun->bullets
    rows:
    - step: 1
      line: 1
      cells:
      - '1'
      - ctor(5)
      - '5'
    - step: 2
      line: 4
      cells:
      - '2'
      - shoot A
      - '4'
    - step: 3
      line: 5
      cells:
      - '3'
      - shoot A
      - '3'
    - step: 4
      line: 6
      cells:
      - '4'
      - shoot B
      - '2'
  target:
    row: 3
    col: 2
  answer_text: '2'
  why: 'The gun is a single shared object. Each shoot through either borrower decrements the same counter: 5 -> 4 -> 3 -> 2. Aggregation shares state; it does not copy it.'
  concept: aggregation-shared-state
- kind: spot-bug
  level: advanced
  q: Analyze the code and the AddressSanitizer report. Which line is the bug and why?
  code: 'gun_t* gun = gun_new();

    player_t* a = player_new();

    player_t* b = player_new();

    player_pickup_gun(a, gun);

    player_pickup_gun(b, gun);

    gun_free(gun);

    player_shoot(a);

    '
  diagnostic_log: "==53210==ERROR: AddressSanitizer: heap-use-after-free on address 0x602000000018\nREAD of size 4 at 0x602000000018 thread T0\n    #0 0x401290 in player_shoot player.c:31\n    #1 0x401420 in main main.c:20\n"
  target_line: 8
  choices:
  - 'Line 8: player_shoot dereferences the freed gun through the borrower pointer'
  - 'Line 3: player_new requires a name argument'
  - 'Line 1: gun_new returned NULL'
  - 'Line 7: gun_free should have been called twice'
  answer: 0
  why: The owner destroyed the shared gun while borrowers still held its address. The next shoot dereferences freed memory. A shared aggregated object must outlive all its borrowers.
