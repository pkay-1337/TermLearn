        answer_text: "NULL"
        why: 'The pointer must be set to the NULL sentinel. This guarantees that a later `if (p->gun)` guard fails cleanly when no gun has been attached, instead of testing an uninitialized garbage address.'
        concept: null-initialize-aggregation
      - kind: order
        q: 'Order the statements that safely borrow and fire a gun. The last line is a distractor.'
        lines:
          - 'player->gun = gun;'
          - 'if (player->gun) {'
          - 'gun_trigger(player->gun);'
          - '}'
          - 'free(player->gun);'
        answer_order: [0, 1, 2, 3]
        distractor_why:
          'free(player->gun);': 'Frees a borrowed object the player does not own, causing a double-free with the real owner.'
        why: 'First the player borrows the gun by storing its address, then it tests the pointer, then it delegates to gun_trigger only when the pointer is non-NULL, and finally it leaves the guard block. The distractor frees a borrowed object, which violates aggregation ownership.'
        concept: aggregation-guard-order
    common_bugs:
