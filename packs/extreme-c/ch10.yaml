meta:
  book: extreme-c
  chapter_id: ch10
  title: 'Chapter 07 — Composition and Aggregation'
  source_ref: 'Ch.7 (Text/composition_and_aggregation.xhtml)'
  level: core
  prereqs: [ch09]
objectives:
  - 'Distinguish a compile-time class blueprint from a runtime object allocation in C'
  - 'Model the two to-have relationships (composition and aggregation) and tell them apart'
  - 'Implement composition with opaque forward declarations, owned construction, and owned destruction'
  - 'Implement aggregation with NULL-initialized borrow pointers, attach/detach APIs, and defensive guards'
  - 'Explain why aggregation is temporary between instances yet permanent between classes'
  - 'Choose the correct relationship for a domain and justify it with ownership and lifetime arguments'
blocks:
  - id: b1
    type: model
    title: 'Object versus class: Static blueprints versus runtime allocations'
    explain_md: |
      An object model is a set of related objects. Before we can relate objects, we
      must separate two ideas that beginners constantly blur: the *class* and the
      *object* (also called an *instance*).

      A class is a blueprint. In C the blueprint is an attribute structure such as
      `person_t`. It tells the compiler which fields exist, in what order, and how
      many bytes each one needs. The blueprint itself lives only in the source and in
      the compiler's symbol table; in C and C++ it consumes ZERO bytes of runtime
      memory. A class never "holds" a value.

      An object is a concrete allocation that exists at runtime, on the stack frame or
      on the heap. Many objects can be created from the same blueprint, and each one
      carries its own independent set of attribute values.

      Every object follows a strict lifecycle:
        1. Allocation    - raw memory is acquired (stack frame or malloc).
        2. Construction  - the attribute values are initialized to a valid state.
        3. Usage         - behavior functions read and mutate the state.
        4. Destruction   - owned subordinate resources are released.
        5. Deallocation  - the object's own memory is returned to the allocator.

      The order matters. Construction must come after allocation (there is nothing to
      initialize before memory exists), and destruction must come before deallocation
      (after the container is freed, its internal pointers are unreachable, so its
      owned children can never be cleaned up and leak).
    example:
      lang: c
      adapted: false
      code: |
        #include <stdlib.h>

        typedef struct {
          char name[32];
          char surname[32];
          unsigned int age;
        } person_t;

        void demo_person(void) {
          person_t p1;      /* allocation: raw bytes on the stack */
          p1.age = 30;      /* construction: initialize a field */
        }
      subgoals:
        - label: "Declare the compile-time attribute blueprint"
          lines: [3, 4, 5, 6, 7]
        - label: "Allocate a runtime instance and construct one field"
          lines: [10, 11]
    viz:
      kind: ascii-memory
      steps:
        - |
          COMPILE TIME - the blueprint `person_t`
          +---------------------------------------------+
          | name[32] | surname[32] | age (unsigned int) |
          +---------------------------------------------+
          Total size: 68 bytes. Runtime bytes consumed: 0.
        - |
          RUNTIME - `person_t p1;` allocates 68 raw bytes on the stack
          @ 0x7ffd10: [ name = ??? | surname = ??? | age = ??? ]
        - |
          RUNTIME - `p1.age = 30;` constructs the age field
          @ 0x7ffd10: [ name = ??? | surname = ??? | age = 30 ]
        - |
          SCOPE EXIT - the stack frame pops; the 68 bytes are reclaimed.
          No destructor runs and nothing leaks because there is nothing owned.
    checks:
      - kind: mcq
        q: 'How much runtime RAM does the class definition `typedef struct { ... } person_t;` consume in C?'
        choices:
          - '4 bytes in the data segment, one per struct member'
          - '68 bytes in the BSS segment for a default instance'
          - 'Zero bytes; it is a compile-time blueprint the compiler uses to compute sizes and offsets'
          - '16 bytes in the text segment for a virtual dispatch table'
        answer: 2
        why: 'A struct definition is only type information. The compiler uses it to lay out future objects, but the definition itself is never allocated at runtime. Option A and B invent storage that does not exist; option D belongs to C++ vtables, which plain C structs do not have.'
        concept: class-vs-object-memory
      - kind: predict
        q: 'Trace line by line. What is the correct chronological order of an object lifecycle?'
        choices:
          - 'Construction -> Allocation -> Usage -> Destruction -> Deallocation'
          - 'Allocation -> Construction -> Usage -> Destruction -> Deallocation'
          - 'Allocation -> Usage -> Construction -> Destruction -> Deallocation'
          - 'Construction -> Usage -> Allocation -> Deallocation -> Destruction'
        answer: 1
        why: 'Allocation must precede construction because there is no memory to initialize before it exists. Destruction must precede deallocation because, once the container memory is gone, its internal pointers can no longer reach the owned resources. This is the symmetric allocate/construct ... destruct/free protocol used throughout this chapter.'
        concept: lifecycle-sequence
      - kind: why-fails
        q: 'Why must owned subordinate resources be destroyed before the parent container is deallocated?'
        choices:
          - 'Because POSIX only permits one level of nested dynamic allocation'
          - 'Because the CPU cancels child pointers once the parent exceeds 64 bytes'
          - 'Because the compiler emits invalid assembly if free() runs before a destructor'
          - 'Because after the parent is freed its internal pointers are unreachable, so the children can never be released and leak'
        answer: 3
        why: 'The container is the only place that holds the addresses of its children. Freeing the container first destroys that knowledge; the children remain allocated but become unreachable. The correct order is: destruct children, then free children, then free the container.'
        concept: resource-ownership-cleanup
      - kind: trace
        q: 'Trace stack allocation for two distinct instances of `person_t`. What value sits in the target cell?'
        code: |
          person_t p1;
          person_t p2;
          p1.age = 25;
          p2.age = 40;
        trace:
          headers: ["Step", "Line", "Variable", "Address", "Attribute", "Value"]
          rows:
            - step: 1
              line: 3
              cells: ["1", "3", "p1", "0x7ffd10", "p1.age", "25"]
            - step: 2
              line: 4
              cells: ["2", "4", "p2", "0x7ffd60", "p2.age", "40"]
        target: {row: 1, col: 5}
        answer_text: "40"
        why: 'Each object is a separate allocation at a distinct address. Writing p2.age = 40 changes only p2; p1.age stays 25. Two instances of the same class share the blueprint but never share state.'
        concept: distinct-instance-state
      - kind: mcq
        q: 'What exactly does a class determine about the objects created from it?'
        choices:
          - 'Which attributes must be present in every object, and their types and layout'
          - 'The exact values each object will hold at runtime'
          - 'The heap address where each object will be allocated'
          - 'The order in which behavior functions may be called'
        answer: 0
        why: 'A class fixes the set of attributes and their layout; it says nothing about the values, which are supplied per object at construction. Addresses are chosen by the allocator at runtime, and call order is a program-design decision, not a class property.'
        concept: class-determines-structure-not-values
      - kind: fillblank
        q: 'Complete the declaration so the compiler knows `person_t` names a structure tag:'
        code: |
          typedef ______ {
            char name[32];
            unsigned int age;
          } person_t;
        answer_text: "struct"
        why: 'In C a structure definition must begin with the keyword `struct`. `typedef struct { ... } person_t;` creates an alias `person_t` for the anonymous structure type.'
        concept: struct-definition-syntax
    common_bugs:
      - 'Believing a struct definition reserves memory in the binary'
      - 'Calling free() on a container before freeing the children it owns'
      - 'Assuming two objects created from one class share attribute values'
  - id: b2
    type: design
    title: 'Relationship taxonomy: To-have versus to-be relations'
    explain_md: |
      Objects in a model are connected by relationships, and those relationships are
      mirrored at the class level. Two broad families exist:

      * To-have (has-a) relationships - one object possesses another. This chapter
        covers the two to-have forms:
          - Composition: strong possession, lifetime bound to the container.
          - Aggregation: weak possession (borrowing), lifetime independent.
      * To-be (is-a) relationships - one object is a specialization of another. This is
        inheritance, covered in the next chapter.

      The distinction is a domain decision, not a language decision. The same two
      classes can be related differently depending on the problem. A car and an engine
      are composed in a road-car domain, but in mechanical CAD software an engine can
      exist on its own, so the relationship would be aggregation instead.

      Because relationships are declared in the class/struct definitions, a
      relationship between two object types becomes a permanent feature of their
      attribute structures. Even a relationship that occurs only occasionally at
      runtime (a player who only sometimes holds a gun) must be represented by a
      permanent pointer field in the container's struct.

      The architectural question to always ask is: who owns the subordinate object,
      and whose lifetime bounds the other?
    example:
      lang: c
      adapted: false
      code: |
        /* To-have: a car is composed of an engine (strong possession) */
        typedef struct {
          struct engine_t* engine;   /* the car owns its engine */
        } car_t;

        /* To-be: a sedan IS a car (inheritance - next chapter) */
        typedef struct {
          car_t base;                /* a sedan is a kind of car */
          int trunk_capacity;
        } sedan_t;
      subgoals:
        - label: "Model a to-have relationship with an owned pointer"
          lines: [2, 3, 4]
        - label: "Model a to-be relationship with an embedded base type"
          lines: [7, 8, 9, 10]
    checks:
      - kind: mcq
        q: 'Which pair of terms describes the two families of relationships between objects?'
        choices:
          - 'To-have (has-a) and to-be (is-a)'
          - 'To-store and to-free'
          - 'To-link and to-unlink'
          - 'To-allocate and to-construct'
        answer: 0
        why: 'The chapter names exactly two categories: to-have relationships (composition and aggregation) and to-be relationships (inheritance). The other options describe memory operations or link operations, not relationship taxonomies.'
        concept: relationship-taxonomy
      - kind: choose-better
        q: 'A car contains an engine that has no valid existence outside that car. Which relationship models it?'
        choices:
          - 'Aggregation, because the engine is stored behind a pointer'
          - 'Composition, because the engine lifetime is bound to the car lifetime and the car owns it'
          - 'Inheritance, because the engine is part of the car'
          - 'A plain global variable, because the relationship is permanent'
        answer: 1
        why: 'The deciding test is ownership and lifetime binding. A subordinate with no identity outside the container is composition. Aggregation is for borrowable, independently existing parts; inheritance is for is-a specialization; a global variable is not an object relationship at all.'
        concept: composition-selection
      - kind: why-fails
        q: 'Why is modeling "a car has an engine" as inheritance (car is an engine) architecturally wrong?'
        choices:
          - 'Inheritance is only allowed between classes of the same size'
          - 'Engines cannot be represented in C, only in C++'
          - 'The car and engine are two different types with different attributes; an engine is not a kind of car, so is-a substitution is invalid'
          - 'Inheritance requires at least three levels of nesting'
        answer: 2
        why: 'Inheritance expresses is-a substitutability (a sedan can be used where a car is expected). A car is not an engine, so modeling the relationship as to-be would break the Liskov substitution principle. The correct relationship is to-have (composition).'
        concept: to-be-misclassification
      - kind: predict
        q: 'Trace the relationship through the class level. A `player` object may or may not hold a `gun` object during a run. What must the `player_t` struct contain?'
        choices:
          - 'A copy of the entire `gun_t` value, so the gun always exists inside the player'
          - 'A pointer field `struct gun_t* gun;` that can be set and cleared at runtime'
          - 'No field at all, because the relationship is only occasional'
          - 'A fixed-size array of exactly 7 `gun_t` objects'
        answer: 1
        why: 'Even an occasional, temporary relationship must be declared permanently in the container struct as a pointer. At runtime that pointer is set when the player picks up a gun and cleared when the player drops it. The other options either force a permanent copy or deny the relationship entirely.'
        concept: class-level-relationship-field
      - kind: eipe
        q: 'In one sentence, what is this code FOR?'
        code: |
          typedef struct {
            struct engine_t* engine;
          } car_t;
        choices:
          - 'It declares a car that owns an engine whose lifetime is managed by the car'
          - 'It prints the engine temperature to the console'
          - 'It frees the engine when the car goes out of scope'
          - 'It converts a car into an engine at runtime'
        answer: 0
        why: 'The struct declares the composition link: a `car_t` holds a private pointer to an `engine_t`. Its purpose is to express that the car owns its engine. The other options describe runtime actions that this declaration alone does not perform.'
        concept: composition-declaration-purpose
    common_bugs:
      - 'Choosing inheritance for a to-have domain relationship'
      - 'Omitting the pointer field because the relationship is only occasional'
      - 'Leaving the ownership question unanswered when modeling a part'
  - id: b3
    type: design
    title: 'Composition contract: Lifetime binding, ownership, and encapsulation'
    explain_md: |
      Composition is the strong form of to-have. Its single defining condition is
      *lifetime binding*: the contained object's lifetime is enclosed within the
      container's lifetime.

      The contract has four clauses:
        1. Bound lifetime - as long as the container exists, the contained object
           exists; when the container is about to be destroyed, the contained object
           is destroyed first.
        2. Internal and private - the contained object is an implementation detail of
           the container. External code may observe some of its state, but only
           through the container's public behavior functions.
        3. No external destruction - if any code can destroy the contained object
           without destroying the container, the relationship is broken and is no
           longer composition.
        4. No pointer leakage - the container never hands out the raw pointer to the
           contained object. Leaking it would let external code mutate private state
           and would break the ownership invariant.

      Because the container owns the child, the container is also responsible for the
      child's memory: the container's constructor allocates and constructs the child,
      and the container's destructor destructs and frees the child. This symmetry is
      what makes the child's lifetime a strict subset of the container's.

      The child does not need to know it is contained. A car engine is built by an
      engine factory without knowing which car it will go into. The container is the
      only party that knows about the relationship, which keeps the child reusable.
    example:
      lang: c
      adapted: true
      code: |
        /* The container's private attribute structure (in car.c) */
        typedef struct {
          struct engine_t* engine;   /* owned child; lifetime bound to car */
        } car_t;

        /* Container constructor: allocate + construct the owned child */
        void car_ctor(car_t* car) {
          car->engine = engine_new();
          engine_ctor(car->engine);
        }

        /* Container destructor: destruct + free the owned child */
        void car_dtor(car_t* car) {
          engine_dtor(car->engine);
          free(car->engine);
        }
      subgoals:
        - label: "Declare the private owned-child pointer"
          lines: [2, 3]
        - label: "Allocate and construct the child inside the container constructor"
          lines: [6, 7, 8, 9]
        - label: "Destruct and free the child inside the container destructor"
          lines: [12, 13, 14]
    viz:
      kind: ascii-memory
      steps:
        - |
          car_new() -> car_t container on the heap @ 0x602000
          car_t @ 0x602000: [ engine = NULL ]   (not yet constructed)
        - |
          car_ctor(car) -> engine_new() + engine_ctor()
          engine_t @ 0x604000: [ state = OFF, temperature = 15.0 ]
          car_t @ 0x602000: [ engine = 0x604000 ]  (bound!)
        - |
          car_start(car) -> engine_turn_on(car->engine)
          engine_t @ 0x604000: [ state = ON, temperature = 75.0 ]
        - |
          car_dtor(car) -> engine_dtor() + free(car->engine)
          engine_t @ 0x604000 returned to the heap FIRST
        - |
          free(car) -> car_t @ 0x602000 returned to the heap LAST
          Result: zero leaks, zero dangling pointers.
    checks:
      - kind: mcq
        q: 'What is the one condition that makes a to-have relationship a composition rather than an aggregation?'
        choices:
          - 'The contained object is stored as a pointer rather than by value'
          - 'The contained object lifetime is bound to the container lifetime, and the container owns it'
          - 'The container is allocated on the heap while the child is on the stack'
          - 'The child object is declared before the container object in the source file'
        answer: 1
        why: 'Both composition and aggregation use pointers, so the pointer is not the discriminator. The discriminator is ownership plus lifetime binding: the child cannot exist before the container or after it. Storage location and source order are irrelevant.'
        concept: composition-defining-condition
      - kind: why-fails
        q: 'A getter returns the raw internal pointer: `engine_t* car_get_engine(car_t* car) { return car->engine; }`. Why does this break composition?'
        choices:
          - 'Because the function name is too long for the compiler'
          - 'Because returning a pointer always leaks the pointed-to memory'
          - 'Because external code can now destruct or free the engine independently, destroying the container-owned lifetime invariant'
          - 'Because C forbids returning pointers from functions declared in a header'
        answer: 2
        why: 'Handing out the child pointer transfers the ability to destroy the child to outsiders. Once an external caller can free or destruct the engine, the engine no longer has a lifetime bounded by the car, and the relationship degenerates into an unmanaged shared pointer. Private state must be accessed only through behavior functions.'
        concept: pointer-leak-breaks-composition
      - kind: predict
        q: 'Trace line by line. A composed car is created, started, and then destroyed. In what order do the cleanup operations run?'
        choices:
          - 'free(car); then engine_dtor(car->engine); then free(car->engine)'
          - 'engine_dtor(car->engine); then free(car); then free(car->engine)'
          - 'engine_dtor(car->engine); then free(car->engine); then free(car)'
          - 'free(car->engine); then engine_dtor(car->engine); then free(car)'
        answer: 2
        why: 'Destruction of the child must precede deallocation of the child (so the destructor can still touch the object), and both must precede deallocation of the container (so the container pointer to the child is still valid). Freeing the container first strands the child.'
        concept: composition-destruction-order
      - kind: choose-better
        q: 'An engine cannot exist outside a car in this domain. Which modeling is correct?'
        choices:
          - 'Composition: the car allocates, owns, constructs, and frees the engine'
          - 'Aggregation: the engine is created by main() and passed to the car, so the car can free it'
          - 'Neither; the engine should be a global singleton'
          - 'Aggregation, because the engine is referenced through a pointer'
        answer: 0
        why: 'The domain rule "no engine without a car" is exactly the lifetime-binding condition of composition. Aggregation is for parts with independent identity. The pointer detail in option D is a red herring: aggregation is about ownership, not about using a pointer.'
        concept: composition-vs-aggregation-domain
      - kind: trace
        q: 'Trace the ownership chain. After `car_dtor(car); free(car);` what is the state of the engine memory?'
        code: |
          car_t* car = car_new();
          car_ctor(car);
          car_dtor(car);
          free(car);
        trace:
          headers: ["Step", "Action", "car_t", "engine_t", "State"]
          rows:
            - step: 1
              line: 2
              cells: ["1", "car_ctor", "0x602000", "0x604000", "engine constructed"]
            - step: 2
              line: 3
              cells: ["2", "car_dtor", "0x602000", "0x604000", "engine destructed and freed"]
            - step: 3
              line: 4
              cells: ["3", "free(car)", "0x602000", "???", "???"]
        target: {row: 2, col: 3}
        answer_text: "invalid/freed"
        choices:
          - "invalid/freed"
          - "still valid and usable"
          - "converted into an aggregation pointer"
          - "moved to the stack"
        answer: 0
        why: 'car_dtor already ran engine_dtor and free(car->engine), so the engine address is no longer valid. free(car) then returns the container. Any later use of the engine address would be a use-after-free.'
        concept: composition-ownership-trace
    common_bugs:
      - 'Returning the raw child pointer from a getter, leaking private ownership'
      - 'Freeing the container before freeing the owned child'
      - 'Letting external code destruct the child independently of the container'
  - id: b4
    type: syntax
    title: 'Opaque composition interfaces: Forward declarations and incomplete types'
    explain_md: |
      Information hiding is the reason composition stays maintainable. In C we hide a
      class's attribute structure by never defining it in the header. Instead we write
      a *forward declaration*:

          struct car_t;      /* an incomplete type */

      `struct car_t;` tells the compiler "a structure tag named car_t exists" but does
      not describe its fields. The result is an incomplete type: you may declare
      pointers to it, but you may not dereference it or read its members, because the
      compiler does not know the layout. That is exactly what we want for a client.

      The public header therefore exposes only:
        - the opaque type (`struct car_t;`),
        - the allocator, constructor, and destructor,
        - behavior functions, including *delegation* functions that answer questions
          about the contained object without revealing it.

      The client (`main.c`) includes only `car.h`. It never includes `engine.h`. The
      client can call `car_get_engine_temperature(car)` but cannot write
      `car->engine->temperature`, because `car_t` is incomplete in that translation
      unit. This is the C mechanism that enforces encapsulation across files.

      The complete definition of `car_t` lives only in `car.c`. That is the single
      place where the private layout (and the owned engine pointer) is visible.
    example:
      lang: c
      adapted: false
      code: |
        #ifndef CAR_H
        #define CAR_H

        struct car_t;

        struct car_t* car_new(void);
        void car_ctor(struct car_t* car);
        void car_dtor(struct car_t* car);

        void car_start(struct car_t* car);
        void car_stop(struct car_t* car);
        double car_get_engine_temperature(struct car_t* car);

        #endif
      subgoals:
        - label: "Forward-declare the opaque container type"
          lines: [4]
        - label: "Publish allocator and lifecycle functions"
          lines: [6, 7, 8]
        - label: "Publish behavior and delegation functions"
          lines: [10, 11, 12]
    checks:
      - kind: fillblank
        q: 'Complete the forward declaration that makes `car_t` an opaque, incomplete type in the header:'
        code: |
          /* Opaque container type: fields are hidden from clients */
          ______ car_t;
        answer_text: "struct"
        why: '`struct car_t;` declares the structure tag without defining its members. This is the C idiom for an opaque type: pointers to it are allowed, but the compiler refuses member access because the layout is unknown.'
        concept: forward-declaration-syntax
      - kind: why-fails
        q: 'Why does this client line fail to compile: `car->engine->temperature = 100.0;`?'
        choices:
          - 'C99 forbids nested pointer dereferences across translation units'
          - 'The client sees `struct car_t` as an incomplete type, so the compiler does not know that an `engine` member exists or where it lives'
          - 'The temperature field is marked volatile and cannot be written'
          - 'Header guards prevent any struct that contains a pointer from being used'
        answer: 1
        why: 'In the client translation unit only the forward declaration is visible. An incomplete type has unknown size and unknown members, so `car->engine` is rejected at compile time. This is the compiler actively enforcing encapsulation on our behalf.'
        concept: opaque-type-enforcement
      - kind: mcq
        q: 'What is the practical consequence of `car_t` being an incomplete type in `car.h`?'
        choices:
          - 'The struct cannot be used as a function return type'
          - 'The compiler automatically zero-initializes all its fields'
          - 'Only pointers to `car_t` may be declared; the object itself can only be created and manipulated inside car.c'
          - 'The struct is promoted to a union type'
        answer: 2
        why: 'An incomplete type has no known size, so the compiler cannot allocate it (no stack object, no malloc of the type by clients). Pointers are fine because a pointer has a fixed size. This forces all allocation and layout knowledge into car.c, which is the encapsulation goal.'
        concept: incomplete-type-consequence
      - kind: choose-better
        q: 'External code needs the engine temperature. Which interface preserves encapsulation?'
        choices:
          - 'A delegation function `car_get_engine_temperature(car)` that queries the engine internally and returns a value'
          - 'A getter `engine_t* car_get_engine(car_t* car)` that returns the raw internal engine pointer'
        answer: 0
        why: 'The delegation function returns only the requested value and keeps the engine pointer private. Returning the raw pointer leaks the internal object and lets clients mutate or destroy it, which breaks both encapsulation and the composition ownership invariant.'
        concept: delegation-vs-pointer-leak
      - kind: order
        q: 'Order the declarations to build a valid opaque composition header (the leaking getter is a distractor):'
        lines:
          - 'void car_start(struct car_t* car);'
          - 'struct car_t;'
          - 'struct car_t* car_new(void);'
          - 'double car_get_engine_temperature(struct car_t* car);'
          - 'void car_dtor(struct car_t* car);'
          - 'engine_t* car_get_engine(struct car_t* car);'
        answer_order: [1, 2, 4, 0, 3]
        distractor_why:
          'engine_t* car_get_engine(struct car_t* car);': 'Leaks the private engine pointer, breaking encapsulation and composition ownership.'
        why: 'An opaque header must first forward-declare the type, then declare the allocator, constructor, and destructor, then the behavior functions. The correct order is the type, allocator, destructor, start, and delegation query. The leaking getter is a near-miss distractor that would expose the private child.'
        concept: opaque-interface-ordering
      - kind: why-fails
        q: 'Why should `main.c` NOT `#include "engine.h"` even though it is available?'
        choices:
          - 'Because including any header from a subdirectory breaks the preprocessor'
          - 'Because the client should depend only on the container public interface; including engine.h couples the client to a private implementation detail'
          - 'Because engine.h is reserved for the linker, not the compiler'
          - 'Because two headers cannot be included in the same translation unit'
        answer: 1
        why: 'The whole point of the opaque design is that the client knows nothing about the engine. Including engine.h would expose the engine type and let the client bypass the car delegation functions, defeating information hiding and making the engine implementation a compile-time dependency of every client.'
        concept: client-dependency-minimization
    common_bugs:
      - 'Defining the private attribute structure in the public header'
      - 'Returning the raw child pointer from a getter'
      - 'Including child headers in client code that should only see the container'
  - id: b5
    type: syntax
    title: 'Composition implementation: Owned construction and owned destruction'
    explain_md: |
      Now we write the container's implementation. The complete definition of `car_t`
      lives here, in `car.c`, and it is the only translation unit that can see the
      private layout:

          typedef struct {
            struct engine_t* engine;   /* owned child */
          } car_t;

      Construction symmetry. The car constructor allocates the child and then
      constructs it:
          car->engine = engine_new();   /* acquire child memory  */
          engine_ctor(car->engine);     /* initialize child state */

      Destruction symmetry. The car destructor destructs the child and then frees it:
          engine_dtor(car->engine);     /* release child resources */
          free(car->engine);            /* return child memory     */

      Behavior delegation. The car never manipulates the engine's internals; it only
      calls the engine's public functions:
          engine_turn_on(car->engine);
          engine_get_temperature(car->engine);

      This is the crucial information-hiding point: `car.c` includes only `engine.h`,
      the engine's *public interface*. The car does not know how `engine_t` is laid
      out. Therefore the engine implementation can be replaced by any other
      implementation that satisfies the same header, and `car.c` does not need to
      change.

      A common defect is to destruct the child but forget `free(car->engine)`. The
      destructor runs, but the child's heap block is never returned, producing a leak.
      The symmetric rule is: for every `new`/`ctor` pair in the constructor there must
      be a matching `dtor`/`free` pair in the destructor.
    example:
      lang: c
      adapted: true
      code: |
        #include <stdlib.h>

        struct engine_t;
        struct engine_t* engine_new(void);
        void engine_ctor(struct engine_t*);
        void engine_dtor(struct engine_t*);
        void engine_turn_on(struct engine_t*);
        void engine_turn_off(struct engine_t*);
        double engine_get_temperature(struct engine_t*);

        typedef struct {
          struct engine_t* engine;
        } car_t;

        car_t* car_new(void) {
          return (car_t*)malloc(sizeof(car_t));
        }

        void car_ctor(car_t* car) {
          car->engine = engine_new();
          engine_ctor(car->engine);
        }

        void car_dtor(car_t* car) {
          engine_dtor(car->engine);
          free(car->engine);
        }

        void car_start(car_t* car) {
          engine_turn_on(car->engine);
        }

        void car_stop(car_t* car) {
          engine_turn_off(car->engine);
        }

        double car_get_engine_temperature(car_t* car) {
          return engine_get_temperature(car->engine);
        }
      subgoals:
        - label: "Declare the child interface and the private container layout"
          lines: [3, 4, 5, 6, 7, 8, 9, 11, 12, 13]
        - label: "Allocate container memory"
          lines: [15, 16, 17]
        - label: "Construct the owned child inside the container constructor"
          lines: [19, 20, 21, 22]
        - label: "Destruct and free the owned child inside the container destructor"
          lines: [24, 25, 26, 27]
        - label: "Delegate behavior to the child through its public interface"
          lines: [29, 30, 31, 33, 34, 35, 37, 38, 39]
    viz:
      kind: ascii-memory
      steps:
        - |
          car_new() -> malloc(sizeof(car_t))
          car_t @ 0x602000: [ engine = NULL ]        (raw, uninitialized)
        - |
          car_ctor(car) -> engine_new() then engine_ctor()
          engine_t @ 0x604000: [ state = OFF, temperature = 15.0 ]
          car_t @ 0x602000: [ engine = 0x604000 ]   (bound)
        - |
          car_start(car) -> engine_turn_on(car->engine)
          engine_t @ 0x604000: [ state = ON, temperature = 75.0 ]
        - |
          car_dtor(car) -> engine_dtor() then free(car->engine)
          engine_t @ 0x604000 reclaimed; car_t still holds the pointer briefly
        - |
          free(car) -> car_t @ 0x602000 reclaimed. Nothing leaked.
    checks:
      - kind: predict
        q: 'Trace line by line. After `car_ctor(car); car_start(car);`, what does `car_get_engine_temperature(car)` return?'
        choices:
          - '15.0'
          - '75.0'
          - '0.0'
          - 'Undefined, because the engine was never constructed'
        answer: 1
        why: 'The engine constructor initializes the temperature to 15.0. car_start delegates to engine_turn_on, which sets the temperature to 75.0. The car reads it back through engine_get_temperature, so the returned value is 75.0.'
        concept: composition-behavior-trace
      - kind: spot-bug
        q: 'Analyze the destructor. What critical defect does it contain?'
        code: |
          void car_dtor(car_t* car) {
            engine_dtor(car->engine);
            /* free(car->engine) is missing */
          }
        diagnostic_log: |
          ==49102==ERROR: LeakSanitizer: detected memory leaks
          Direct leak of 16 byte(s) in 1 object(s) allocated from:
              #0 0x7f malloc
              #1 0x401180 in engine_new engine.c:20
              #2 0x401210 in car_ctor car.c:17
        target_line: 2
        choices:
          - 'Double free: the engine is freed twice'
          - 'Use-after-free: the engine pointer is dereferenced after free'
          - 'Memory leak: the destructor runs but the child heap block is never returned'
          - 'Null dereference: car->engine is NULL'
        answer: 2
        why: 'engine_dtor performs the engine-specific cleanup, but the heap block acquired by engine_new is only returned by free(car->engine). Omitting that call leaks the block, exactly what LeakSanitizer reports. Destruction and deallocation are two separate steps.'
        concept: composition-cleanup-leak
      - kind: order
        q: 'Order the cleanup statements for a composed car. The last line is a distractor.'
        lines:
          - 'free(car);'
          - 'engine_dtor(car->engine);'
          - 'car_dtor(car);'
          - 'free(car->engine);'
          - 'free(car->engine->temperature);'
        answer_order: [2, 1, 3, 0]
        distractor_why:
          'free(car->engine->temperature);': 'temperature is a value field, not a pointer; freeing it is invalid and is not part of cleanup.'
        why: 'The caller invokes car_dtor(car); inside it engine_dtor runs, then free(car->engine); finally the caller frees the container with free(car). The child must be destroyed and freed before the container is freed. The distractor tries to free a non-pointer member.'
        concept: composition-destruction-sequence
      - kind: mcq
        q: 'Interleaved review: why does `car.c` include `engine.h` and not `engine.c`?'
        choices:
          - 'Because .h files are executed by the CPU linker'
          - 'Because including .c files turns all functions into static inlines'
          - 'Because the preprocessor rejects files ending in .c'
          - 'Because a header publishes only declarations, preserving separate compilation and avoiding duplicate symbol definitions at link time'
        answer: 3
        why: 'Headers carry declarations; source files carry definitions compiled separately into distinct translation units. Including a .c file would duplicate its definitions in every includer and cause multiple-definition link errors. This is the same header/source separation reviewed from the encapsulation chapter.'
        concept: header-vs-source-inclusion
        from_chapter: ch09
        from_block: b9
      - kind: fillblank
        q: 'Complete the allocation in the container allocator so it reserves the correct number of bytes:'
        code: |
          car_t* car_new(void) {
            return (car_t*)malloc(______);
          }
        answer_text: "sizeof(car_t)"
        why: 'malloc needs the size of the object being allocated. `sizeof(car_t)` evaluates to the exact byte count of the container structure at compile time. `sizeof(*car)` is an equivalent accepted form; hard-coding a number would silently break if the struct grew.'
        concept: malloc-sizeof-container
      - kind: why-fails
        q: 'Why does this destructor crash? `void car_dtor(car_t* car) { free(car->engine); engine_dtor(car->engine); }`'
        choices:
          - 'Because free() cannot be called on a pointer stored in a struct'
          - 'Because the destructor must be declared static'
          - 'Because the engine is freed before it is destructed, so engine_dtor then reads freed memory (use-after-free)'
          - 'Because free() returns a value that must be assigned'
        answer: 2
        why: 'The order is reversed. The destructor must run while the object is still valid, then the memory is returned. Freeing first leaves engine_dtor operating on a dangling pointer, which is undefined behavior and typically a use-after-free. The rule is always destruct-then-free.'
        concept: destruct-before-free-order
    common_bugs:
      - 'Destructing the child but forgetting free(child)'
      - 'Freeing the child before destructing it'
      - 'Manipulating the child internals directly instead of through its public interface'
  - id: b6
    type: algorithm
    title: 'Composition build and linking: Delegation and modular substitution'
    explain_md: |
      Composition gives us two independent axes of modularity: runtime delegation and
      build-time separate compilation.

      Runtime delegation. When a client needs information about a composed child, it
      calls a container function, and the container forwards the request:
          double car_get_engine_temperature(car_t* car) {
            return engine_get_temperature(car->engine);
          }
      The client never touches `car->engine`. The container mediates every access,
      which is what keeps the child encapsulated.

      Build-time separation. The program is compiled as three independent translation
      units:
          gcc -c engine.c -o engine.o    /* defines engine_* symbols          */
          gcc -c car.c    -o car.o      /* references engine_* (unresolved)   */
          gcc -c main.c   -o main.o     /* references car_* (unresolved)      */
          gcc engine.o car.o main.o -o app   /* linker binds everything       */

      Notice what each unit needs:
        - main.o needs only car.h; it has no knowledge of engine symbols.
        - car.o needs engine.h; it calls engine functions, so the linker must supply
          engine.o.
        - engine.o is needed transitively, because car.o depends on it.

      The payoff is substitutability. If the engine implementation is replaced by an
      electric-motor module that satisfies the same `engine.h` interface, then only the
      engine module and car.c (if it calls new functions) are affected; main.c does not
      even need to be recompiled. This is the concrete engineering value of the opaque
      composition interface.
    example:
      lang: c
      adapted: true
      code: |
        #include <stdio.h>
        #include <stdlib.h>

        struct car_t;
        struct car_t* car_new(void);
        void car_ctor(struct car_t*);
        void car_dtor(struct car_t*);
        void car_start(struct car_t*);
        double car_get_engine_temperature(struct car_t*);

        int main(void) {
          struct car_t* car = car_new();
          car_ctor(car);
          car_start(car);
          printf("Engine temperature: %f\n", car_get_engine_temperature(car));
          car_dtor(car);
          free(car);
          return 0;
        }
      run_expected: "Engine temperature: 75.000000\n"
      subgoals:
        - label: "Forward-declare the public container interface"
          lines: [4, 5, 6, 7, 8, 9]
        - label: "Drive the composed object only through the container API"
          lines: [12, 13, 14, 15, 16, 17, 18, 19]
    checks:
      - kind: why-fails
        q: 'Why does `gcc car.o main.o -o app` fail with undefined-reference errors?'
        choices:
          - 'Because car.o calls engine functions whose definitions live in engine.o, which was not supplied to the linker'
          - 'Because car.o cannot be linked without a C++ runtime library'
          - 'Because the linker refuses to link more than two object files at once'
          - 'Because main.o must include engine.h to resolve the main entry point'
        answer: 0
        why: 'car.c includes engine.h and calls engine_new, engine_ctor, and so on. Those symbols are defined in engine.o. If the linker is not given engine.o, the references from car.o remain unresolved and linking fails. main.o alone is fine because it only calls car functions.'
        concept: multi-file-linking-dependency
      - kind: choose-better
        q: 'The team replaces the combustion engine with an electric motor that satisfies the same engine.h interface. What must change?'
        choices:
          - 'Provide a new motor implementation that defines the engine.h symbols; client code that depends only on car.h does not need to be rewritten'
          - 'Rewrite main.c, car.c, and every client application from scratch'
          - 'Delete the header files and recompile everything as a single file'
          - 'Change the linker to allow unresolved symbols silently'
        answer: 0
        why: 'Because car.c talks to the engine only through the public interface, any module that provides those functions can be linked in place of engine.o. Clients depending only on car.h are insulated from the change. This is modular substitution, a direct consequence of information hiding.'
        concept: modular-substitution
      - kind: eipe
        q: 'In one sentence, what is a delegation method such as `car_get_engine_temperature` FOR?'
        choices:
          - 'It answers a caller query about a contained object while keeping the contained object private'
          - 'It converts a floating-point temperature into an integer string'
          - 'It allocates the engine memory on behalf of the caller'
          - 'It forces the compiler to inline the engine code into main()'
        answer: 0
        why: 'The method forwards the query to the engine and returns the result. Its purpose is to let the caller observe child state without ever receiving the child pointer, preserving encapsulation. The other options describe unrelated actions.'
        concept: delegation-purpose
      - kind: predict
        q: 'Trace line by line. Given the main program shown, what is printed?'
        code: |
          struct car_t* car = car_new();
          car_ctor(car);
          car_start(car);
          printf("Engine temperature: %f\n", car_get_engine_temperature(car));
        choices:
          - 'Engine temperature: 0.000000'
          - 'Engine temperature: 75.000000'
          - 'Engine temperature: 15.000000'
          - 'A segmentation fault before any output'
        answer: 1
        why: 'car_ctor constructs the engine with temperature 15.0. car_start delegates to engine_turn_on, which raises the temperature to 75.0. The query then returns 75.0, printed with %f as 75.000000.'
        concept: composition-main-output
      - kind: mcq
        q: 'Which statement about separate compilation in this design is correct?'
        choices:
          - 'main.c must include engine.h because it prints the engine temperature'
          - 'engine.o can be omitted from the final link because car.o contains the engine code'
          - 'main.o depends only on the car public interface; engine.o is required transitively through car.o'
          - 'All three source files must be compiled in a single gcc invocation or linking fails'
        answer: 2
        why: 'The client depends only on the container interface. The engine is a transitive dependency of car.o, so the linker needs engine.o, but main.c never names an engine symbol. Option A is false (the client sees no engine type), B is false (car.o only calls engine functions), and D is false (separate compilation is the point).'
        concept: separate-compilation-dependency
      - kind: order
        q: 'Order the statements of the delegation function `car_start`. The last line is a distractor.'
        lines:
          - 'void car_start(car_t* car) {'
          - 'engine_turn_on(car->engine);'
          - '}'
          - 'free(car->engine);'
        answer_order: [0, 1, 2]
        distractor_why:
          'free(car->engine);': 'Freeing the owned child inside a behavior function destroys it while the car still exists, breaking composition.'
        why: 'The function opens, delegates the start request to the engine through its public interface, and closes. The distractor frees the owned child during normal behavior, which would destroy the engine while the car is still alive.'
        concept: composition-delegation-order
    common_bugs:
      - 'Omitting engine.o from the final link step'
      - 'Bypassing delegation and exposing the child pointer to clients'
      - 'Assuming the client must include the child header to use the container'
  - id: b7
    type: design
    title: 'Aggregation contract: Independent lifetimes and borrowing'
    explain_md: |
      Aggregation is the second to-have relationship. It looks like composition - a
      container "has" a contained object - but the lifetimes are the opposite.

      The defining difference:
        - Composition: the child lifetime is bound to the container.
        - Aggregation: the child lifetime is INDEPENDENT of the container.

      Consequences of independent lifetimes:
        1. The contained object can be created before the container exists.
        2. The contained object can outlive the container.
        3. The contained object can be shared by several containers at once.
        4. The container is a *borrower*, not an owner.

      Because the container does not own the child, its destructor must NOT destroy or
      free the child. If it did, it would destroy an object that still has an owner
      elsewhere, causing a double-free or premature destruction. The caller (or
      factory) that created the child remains responsible for its destruction.

      Domain metaphor: a player has a gun. The gun exists on the ground before the
      player picks it up and continues to exist after the player drops it. A department
      has a teacher; the teacher exists independently of any single department.

      A key consequence for the class design: because aggregation links are created and
      destroyed dynamically, the container's public interface must expose explicit
      attach and detach behaviors (for example `player_pickup_gun` and
      `player_drop_gun`). Composition needs no such API, because the child is created
      and destroyed inside the container's own constructor and destructor.

      Aggregation is temporary between instances but permanent between types: the
      player may hold the gun for five seconds, yet `player_t` must permanently declare
      the pointer field that makes the link possible.
    example:
      lang: c
      adapted: true
      code: |
        #include <stddef.h>

        typedef struct {
          char* name;
          struct gun_t* gun;   /* borrowed reference: NOT owned */
        } player_t;

        void player_pickup_gun(player_t* player, struct gun_t* gun) {
          player->gun = gun;   /* the aggregation relation begins */
        }

        void player_drop_gun(player_t* player) {
          player->gun = NULL;  /* the relation ends; gun is NOT freed */
        }
      subgoals:
        - label: "Declare the container with a borrowed pointer member"
          lines: [2, 3, 4, 5]
        - label: "Attach the borrowed reference"
          lines: [7, 8, 9]
        - label: "Detach the reference without freeing the target"
          lines: [11, 12]
    checks:
      - kind: mcq
        q: 'What is the fundamental architectural difference between composition and aggregation?'
        choices:
          - 'Composition requires C++ classes; aggregation is exclusive to raw C'
          - 'Composition can only contain integers; aggregation can contain pointers'
          - 'In composition the child lifetime is bound to the container; in aggregation the lifetimes are independent'
          - 'Composition uses heap memory; aggregation uses stack memory only'
        answer: 2
        why: 'Both relationships use pointers, so the pointer is not the discriminator. The discriminator is lifetime binding and ownership. In aggregation the child may exist before the container and after it, and the container does not own it.'
        concept: composition-vs-aggregation-lifetime
      - kind: choose-better
        q: 'A game character may or may not equip a weapon during play. Which modeling fits?'
        choices:
          - 'Optional aggregation: a pointer initialized to NULL, attached on pickup and detached on drop'
          - 'Composition: the character allocates a new weapon in its constructor and frees it in its destructor'
          - 'A fixed global weapon shared by every character'
          - 'Inheritance: the character is a weapon'
        answer: 0
        why: 'A weapon that can be dropped, swapped, or unequipped has an independent lifetime from the character, so it must be borrowed, not owned. Composition would destroy the weapon whenever the character died, which is wrong for an equippable item.'
        concept: optional-aggregation-design
      - kind: why-fails
        q: 'Why must the container destructor never call `free(container->child)` in an aggregation?'
        choices:
          - 'Because free() is not allowed inside any function whose name ends in _dtor'
          - 'Because the child is always stored on the stack and cannot be freed'
          - 'Because the container does not own the child; freeing it causes a double-free or destroys an object another owner still uses'
          - 'Because the compiler forbids freeing a pointer that was passed as an argument'
        answer: 2
        why: 'In aggregation the creator (often the caller) owns the child. If the borrower also frees it, the real owner will free it again later, producing a double-free. The borrower may only clear its own reference. Ownership, not syntax, is the rule.'
        concept: aggregation-ownership-prohibition
      - kind: predict
        q: 'Trace line by line. A player is destroyed while the gun it borrowed still exists. What happens to the gun?'
        choices:
          - 'The gun remains valid and intact in memory, unaffected by the player destruction'
          - 'The gun is automatically freed by the operating system'
          - 'The gun becomes a null pointer automatically'
          - 'The gun attributes are zeroed as a side effect of the player destructor'
        answer: 0
        why: 'Independent lifetimes mean the player destructor does not touch the gun. The gun stays allocated with its state preserved. Destroying the borrower has no effect on the borrowed object; only the owner may destroy it.'
        concept: independent-lifetime-persistence
      - kind: trace
        q: 'Trace the borrowed reference. After the player is destroyed, what is the state of the gun memory?'
        code: |
          struct gun_t* gun = gun_new();
          struct player_t* player = player_new();
          player_pickup_gun(player, gun);
          player_dtor(player);
          free(player);
        trace:
          headers: ["Step", "Action", "player->gun", "gun memory", "Gun state"]
          rows:
            - step: 1
              line: 3
              cells: ["1", "pickup_gun", "&gun", "0x602000", "valid, bullets intact"]
            - step: 2
              line: 4
              cells: ["2", "player_dtor", "untouched", "0x602000", "valid, bullets intact"]
            - step: 3
              line: 5
              cells: ["3", "free(player)", "???", "0x602000", "???"]
        target: {row: 2, col: 3}
        answer_text: "valid"
        choices:
          - "valid"
          - "freed"
          - "zeroed"
          - "dangling"
        answer: 0
        why: 'player_dtor does not free the gun, so the gun block at 0x602000 is untouched. free(player) only returns the player block. The gun remains valid and must later be freed by its real owner.'
        concept: aggregation-independence-trace
    common_bugs:
      - 'Freeing an aggregated child inside the container destructor'
      - 'Assuming destroying the container cleans up the borrowed object'
      - 'Failing to provide attach/detach behaviors for a dynamically linked part'
  - id: b8
    type: syntax
    title: 'Aggregation interfaces: Forward declarations and attach/detach APIs'
    explain_md: |
      The aggregation header follows the same opaque-type discipline as composition,
      but it must also advertise the dynamic nature of the link.

      Opaque types. `player_t` and `gun_t` are both forward-declared:
          struct player_t;
          struct gun_t;
      A pointer parameter only needs a forward declaration, because the compiler never
      has to know the pointed-to layout to pass an address around. This keeps headers
      decoupled: `player.h` does not need to include `gun.h`.

      Explicit attach/detach behaviors. Because the link is created and severed at
      runtime, the container's public interface must expose the operations:
          void player_pickup_gun(struct player_t* player, struct gun_t* gun);
          void player_drop_gun(struct player_t* player);
      Composition has no equivalent API: there the child is born and dies inside the
      container's constructor and destructor, so no attach/detach is needed.

      Mandatory versus optional aggregation:
        - Mandatory aggregation: the child address is required at construction, so it
          is passed to the constructor: `player_ctor(player, gun)`.
        - Optional aggregation: the child is not known at construction, so the pointer
          is initialized to NULL and attached later. The player/gun example is optional.

      Optional aggregation is the dangerous one: at any moment the pointer may be NULL,
      so every behavior that uses it must guard against NULL. Mandatory aggregation is
      safer because the pointer is always valid after construction.
    example:
      lang: c
      adapted: false
      code: |
        #ifndef PLAYER_H
        #define PLAYER_H

        struct player_t;
        struct gun_t;

        struct player_t* player_new(void);
        void player_ctor(struct player_t* player, const char* name);
        void player_dtor(struct player_t* player);

        void player_pickup_gun(struct player_t* player, struct gun_t* gun);
        void player_shoot(struct player_t* player);
        void player_drop_gun(struct player_t* player);

        #endif
      subgoals:
        - label: "Forward-declare container and aggregated types"
          lines: [4, 5]
        - label: "Publish allocator and lifecycle functions"
          lines: [7, 8, 9]
        - label: "Publish attach/detach and action behaviors"
          lines: [11, 12, 13]
    checks:
      - kind: fillblank
        q: 'Complete the forward declaration of the aggregated type used only as a pointer parameter:'
        code: |
          /* Only pointers to gun_t appear in this header */
          ______ gun_t;
        answer_text: "struct"
        why: 'Because the header only declares pointers to `gun_t`, a forward declaration is sufficient. `struct gun_t;` introduces the tag without a definition, so the header does not need to include gun.h and the two types stay decoupled.'
        concept: forward-declaration-aggregation
      - kind: why-fails
        q: 'Why does `player.h` forward-declare `struct gun_t;` instead of including `gun.h`?'
        choices:
          - 'Because the header only uses pointers to gun_t, so a forward declaration suffices and avoids coupling the two headers'
          - 'Because C headers are forbidden from including other headers'
          - 'Because including gun.h would allocate a gun inside every player'
          - 'Because the preprocessor deletes nested includes automatically'
        answer: 0
        why: 'A pointer to an incomplete type is perfectly legal. Forward-declaring keeps the dependency graph minimal, reduces compile time, and prevents clients of player.h from accidentally reaching gun internals. Including gun.h would add an unnecessary compile-time dependency.'
        concept: header-coupling-minimization
      - kind: mcq
        q: 'How does mandatory aggregation differ from optional aggregation?'
        choices:
          - 'Mandatory aggregation uses stack objects; optional uses heap objects'
          - 'Mandatory aggregation passes the child address to the constructor; optional aggregation initializes the pointer to NULL and attaches it later'
          - 'Mandatory aggregation is only allowed in C++; optional is C-only'
          - 'Optional aggregation requires the child to be a global variable'
        answer: 1
        why: 'The difference is when the link is established. Mandatory aggregation has the child available at construction, so the constructor takes it. Optional aggregation has no child at construction, so the pointer starts NULL and is set by an attach function. Storage class and language are irrelevant.'
        concept: mandatory-vs-optional-aggregation
      - kind: choose-better
        q: 'Which public interface is appropriate for a container whose link to a child is created and destroyed at runtime?'
        choices:
          - 'Explicit attach and detach functions such as `player_pickup_gun` and `player_drop_gun`'
          - 'No functions at all; the client should write to the container pointer directly'
          - 'Only a getter that returns the raw child pointer'
          - 'A single combined function that both attaches and frees the child'
        answer: 0
        why: 'Dynamic links need explicit lifecycle operations in the container API. Direct pointer access breaks encapsulation, a raw getter leaks ownership, and attaching-while-freeing confuses two different responsibilities. Attach and detach must be separate, controlled operations.'
        concept: attach-detach-api-design
      - kind: order
        q: 'Order the statements that establish and sever an aggregation link. The last line is a distractor.'
        lines:
          - 'player->gun = gun;'
          - 'player_pickup_gun(player, gun);'
          - 'player->gun = NULL;'
          - 'player_drop_gun(player);'
          - 'free(player->gun);'
        answer_order: [1, 0, 3, 2]
        distractor_why:
          'free(player->gun);': 'Frees a borrowed object that the player does not own, causing a double-free with the real owner.'
        why: 'The correct sequence is: call player_pickup_gun, which assigns player->gun = gun; later call player_drop_gun, which assigns player->gun = NULL. The link begins with attachment and ends with detachment. Freeing the borrowed gun is a distractor that violates ownership.'
        concept: aggregation-attach-detach-order
      - kind: why-fails
        q: 'Why must `player_drop_gun` set the pointer to NULL instead of freeing the gun?'
        choices:
          - 'Because NULL is required by the C standard for all struct pointers'
          - 'Because the player does not own the gun; freeing it would destroy an object the real owner still controls'
          - 'Because free() cannot be called from a function whose name contains "drop"'
          - 'Because the gun is always stored in read-only memory'
        answer: 1
        why: 'Dropping a borrowed reference only means forgetting the address. The gun remains owned by whoever created it. Freeing it here would either double-free it later or destroy it while another borrower still uses it. Setting the pointer to NULL cleanly ends the borrower relationship.'
        concept: detach-without-free
    common_bugs:
      - 'Including the child header when a forward declaration would do'
      - 'Freeing the borrowed object in the detach function'
      - 'Confusing mandatory aggregation (constructor argument) with optional (NULL then attach)'
  - id: b9
    type: syntax
    title: 'Aggregation implementation: Nullify, borrow, and guard'
    explain_md: |
      The aggregation implementation has four non-negotiable rules.

      1. Nullify on construction. The optional pointer must start at NULL:
             p->gun = NULL;
      An uninitialized pointer holds whatever garbage was on the stack. If a behavior
      later checks `if (p->gun)`, garbage is non-zero and the check passes, sending the
      program to a random address. NULL is a known, testable sentinel.

      2. Attach by borrowing. `player_pickup_gun` simply stores the address:
             p->gun = g;
      No allocation, no copying: the player borrows the gun.

      3. Detach without destroying. `player_drop_gun` clears the link:
             p->gun = NULL;
      The gun is not freed, because the player does not own it. Dropping only means
      "I am no longer holding it".

      4. Guard before use. Any behavior that touches the child must check for NULL:
             if (p->gun) {
               gun_trigger(p->gun);
             } else {
               printf("No gun!\n");
               exit(1);
             }
      Dereferencing NULL is undefined behavior and crashes with SIGSEGV. In optional
      aggregation the pointer can be NULL at any time, so the guard is mandatory. The
      chapter treats a NULL gun at shoot time as a misuse of the player object and
      aborts with exit code 1.

      Notice again that the player knows nothing about the gun's layout. It only calls
      `gun_trigger`, a function from the gun's public interface. The gun likewise does
      not know it is being borrowed; it is a self-contained object.
    example:
      lang: c
      adapted: true
      code: |
        #include <stdlib.h>
        #include <stdio.h>

        struct gun_t;
        void gun_trigger(struct gun_t*);

        typedef struct {
          char* name;
          struct gun_t* gun;
        } player_t;

        void player_ctor(player_t* p, char* name) {
          p->name = name;
          p->gun = NULL;
        }

        void player_pickup_gun(player_t* p, struct gun_t* g) {
          p->gun = g;
        }

        void player_shoot(player_t* p) {
          if (p->gun) {
            gun_trigger(p->gun);
          } else {
            printf("No gun!\n");
            exit(1);
          }
        }

        void player_drop_gun(player_t* p) {
          p->gun = NULL;
        }
      subgoals:
        - label: "Declare the container with a borrowed pointer member"
          lines: [7, 8, 9, 10]
        - label: "Nullify the aggregation pointer in the constructor"
          lines: [12, 13, 14, 15]
        - label: "Attach the borrowed reference"
          lines: [17, 18, 19]
        - label: "Guard against NULL before delegating to the child"
          lines: [21, 22, 23, 24, 25, 26, 27, 28]
        - label: "Detach without freeing the borrowed object"
          lines: [30, 31, 32]
    viz:
      kind: ascii-memory
      steps:
        - |
          player_ctor(p, "Sam") -> p->gun = NULL
          player_t @ 0x604000: [ name = "Sam", gun = NULL ]
        - |
          player_pickup_gun(p, g) -> p->gun = g
          player_t @ 0x604000: [ name = "Sam", gun = 0x602000 ]
          gun_t   @ 0x602000: [ bullets = 3 ]   (independent, owned elsewhere)
        - |
          player_shoot(p) -> gun_trigger(p->gun)
          gun_t @ 0x602000: [ bullets = 2 ]    (borrower changed shared state)
        - |
          player_drop_gun(p) -> p->gun = NULL
          player_t @ 0x604000: [ name = "Sam", gun = NULL ]
          gun_t   @ 0x602000: [ bullets = 2 ]   (still valid and intact)
    checks:
      - kind: spot-bug
        q: 'Analyze the destructor. What severe bug does it introduce in an aggregation architecture?'
        code: |
          void player_dtor(player_t* player) {
            free(player->name);
            free(player->gun); /* Bug! */
          }
        diagnostic_log: |
          ==51099==ERROR: AddressSanitizer: attempting double-free on 0x602000000010 in thread T0:
              #0 0x7f free
              #1 0x401340 in player_dtor player.c:37
              #2 0x401480 in main main.c:54
        target_line: 3
        choices:
          - 'Null pointer exception: player->name was uninitialized'
          - 'Memory leak: player->name was freed before player->gun'
          - 'Stack overflow: free cannot be called from a destructor'
          - 'Double free: the player does not own the gun, so freeing it collides with the real owner later'
        answer: 3
        why: 'The player borrowed the gun; it never owned it. free(player->gun) returns the gun block to the heap while the real owner still holds the address. When the owner later frees it, the allocator sees a double-free and aborts. The borrower may only clear its own reference.'
        concept: aggregation-ownership-violation
      - kind: why-fails
        q: 'Why does calling `player_shoot(player)` crash with a segmentation fault if the `if (player->gun)` guard is omitted and the player has no gun?'
        choices:
          - 'Because calling any function with a NULL argument triggers a kernel panic'
          - 'Because player->gun is NULL, and dereferencing NULL inside gun_trigger is undefined behavior that raises SIGSEGV'
          - 'Because the operating system blocks shooting without an audio device'
          - 'Because the compiler deletes functions that contain pointer parameters'
        answer: 1
        why: 'Without the guard, gun_trigger receives NULL and immediately dereferences it to read or write the bullets field. Accessing address zero is undefined behavior and the CPU raises a segmentation fault. The guard turns an optional, possibly-absent link into a testable condition.'
        concept: null-pointer-dereference-guard
      - kind: trace
        q: 'Trace the shared gun state. What is the value in the target cell?'
        code: |
          gun_t* g = gun_new();
          gun_ctor(g, 3);
          player_t* p = player_new();
          player_ctor(p, "Sam");
          player_pickup_gun(p, g);
          player_shoot(p);
          player_shoot(p);
        trace:
