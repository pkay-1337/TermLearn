        choices:
          - 'Because compilers replace NULL pointers with static global buffers'
          - 'Because NULL pointers are automatically allocated 4 bytes by the CPU'
          - 'Because NULL pointers can be safely written to without allocation'
          - 'Because NULL is a known sentinel value, whereas an uninitialized pointer holds an unpredictable garbage address'
        answer: 3
        why: 'An uninitialized pointer contains whatever bits were left on the stack, so a later `if (ptr)` test is meaningless. NULL is a single, well-defined value that every defensive check can test against reliably. This is the same uninitialized-pointer hazard reviewed from the memory chapter.'
        concept: null-sentinel-idiom
