          - 'The gun pointer inside the player becomes a dangling pointer that still points to the gun'
          - 'The gun is moved into the player struct by value'
        answer: 0
        why: 'player_drop_gun only sets player->gun = NULL. It does not free or modify the gun. The gun remains valid and unchanged; the player simply no longer references it. Detachment is a change of reference, not a change of ownership or lifetime.'
        concept: detach-preserves-target
      - kind: fillblank
        q: 'Complete the constructor so the optional aggregation pointer starts in a safe, testable state:'
        code: |
