      - "C passes arguments by value; reassigning the local pointer 'car' does not alter the caller's pointer"
      - "Struct pointers cannot be assigned dynamically inside functions"
    answer: 1
    why: |
      In C, all function arguments are passed by value. Reassigning local parameter 'car' merely overwrites
      the copy on the stack, leaking the allocated memory and leaving the caller's pointer unchanged.
      To allocate inside a function, one must return the pointer or pass a pointer-to-pointer (`car_t**`).
      Options A and C are false syntax claims.
    concept: "pass-by-value-pointer-leak"

