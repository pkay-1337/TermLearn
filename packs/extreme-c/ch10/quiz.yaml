  - kind: spot-bug
    level: core
    q: "Analyze the code and AddressSanitizer report. What caused the heap memory corruption?"
    code: |
      typedef struct {
        char* str;
      } text_t;

      void text_init(text_t* t, const char* s) {
        t->str = (char*)malloc(strlen(s)); // BUG!
        strcpy(t->str, s);
      }
    diagnostic_log: |
      ==20110==ERROR: AddressSanitizer: heap-buffer-overflow on address 0x602000000015
      WRITE of size 1 at 0x602000000015 thread T0
          #0 0x401180 in strcpy
          #1 0x401220 in text_init test.c:7
    target_line: 6
    choices:
      - "Line 2: Struct cannot contain char* member"
      - "Line 7: strcpy should be replaced with strcat"
      - "Line 5: strlen(s) cannot be passed to malloc"
      - "Line 6: malloc allocates strlen(s) bytes, omitting + 1 for the null terminator"
    answer: 3
    why: |
      strlen() calculates the number of characters excluding the null byte (`\0`). Writing a string with
      strcpy copies strlen(s) + 1 bytes, writing the null byte 1 byte past the allocated heap block.
      The allocation must be `strlen(s) + 1`. Options A, B, and C are incorrect.
    concept: "strlen-plus-one-off-by-one"

