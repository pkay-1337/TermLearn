  - kind: choose-better
    level: intro
    q: "Which pattern correctly models an optional relationship in C where a person may or may not own a car?"
    choices:
      - |
        // Optional aggregation: pointer can be NULL
        typedef struct {
          car_t* car;
        } person_t;
      - |
        // Embedded value: car must always exist inside person
        typedef struct {
          car_t car;
        } person_t;
    answer: 0
    why: |
      Option A uses a pointer `car_t* car;`, allowing the attribute to be NULL when the person has no car.
      Option B embeds the car struct by value, meaning every person instance permanently contains a physical
      car instance, making an 'empty' car impossible.
    concept: "optional-aggregation-modeling"

  - kind: eipe
    level: advanced
    q: "In one sentence, why does composition promote higher software maintainability than inheritance?"
    choices:
      - "Composition enables multiple CPU threads to execute the same method simultaneously without locks"
      - "Composition couples classes loosely through black-box public APIs rather than exposing internal implementation details"
      - "Composition guarantees that compiler optimizations will eliminate all pointer indirection overhead"
      - "Composition allows structs to be allocated directly in processor registers"
    answer: 1
    why: |
      Composition treats the internal object as a black box accessed strictly through its public interface,
      avoiding the fragile base class problem and tight coupling inherent in deep inheritance hierarchies.
      Options A, C, and D are low-level hardware or concurrency misconceptions.
    concept: "composition-over-inheritance-rationale"

  - kind: mcq
    level: core
    q: "In a mandatory aggregation relationship, when should the aggregated object pointer be assigned?"
    choices:
      - "In a signal handler registered during program startup"
      - "When the program terminates inside atexit()"
      - "Inside the container's constructor via an initialization parameter"
      - "Only when an external setter method is invoked by the user"
    answer: 2
    why: |
      Mandatory aggregation means the container cannot exist without the dependency. Passing the dependency
      into the constructor guarantees that the container is fully valid immediately upon construction.
      Options A and B are irrelevant. Option D describes optional aggregation.
    concept: "mandatory-aggregation-timing"

  - kind: predict
    level: intro
    q: "Trace the output of this code snippet evaluating pointer equality between a container and its child:"
    code: |
      typedef struct { int a; } child_t;
      typedef struct { child_t* c; } parent_t;

      int main(void) {
        parent_t* p = (parent_t*)malloc(sizeof(parent_t));
        p->c = (child_t*)malloc(sizeof(child_t));
        int same = ((void*)p == (void*)p->c);
        printf("%d\n", same);
        return 0;
      }
    choices:
      - "1"
      - "Compiler error"
      - "Undefined"
      - "0"
    answer: 3
    why: |
      p and p->c are two separate, non-overlapping heap allocations produced by two distinct malloc calls.
      Their addresses are guaranteed to be different, so `(void*)p == (void*)p->c` evaluates to 0 (false).
      Option A assumes parent and child share the same address.
    concept: "distinct-heap-addresses-predict"

  - kind: mcq
    level: advanced
    q: "What is the correct sequence of operations to safely allocate, initialize, and verify an optional aggregation container?"
    choices:
      - "Allocate container memory -> Verify allocation non-null -> Initialize owned attributes -> Nullify optional aggregation pointer"
      - "Nullify aggregation pointer -> Allocate container memory -> Initialize attributes -> Verify non-null"
      - "Initialize attributes -> Allocate container memory -> Nullify aggregation pointer -> Verify non-null"
      - "Verify non-null -> Allocate container memory -> Nullify aggregation pointer -> Initialize attributes"
    answer: 0
