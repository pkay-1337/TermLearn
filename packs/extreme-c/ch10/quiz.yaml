    q: "Why must a class constructor function in C avoid allocating memory for the instance itself if it takes type_t* as an argument?"
    code: |
      void car_ctor_wrong(car_t* car) {
        car = (car_t*)malloc(sizeof(car_t)); // What is wrong here?
        car->speed = 0;
