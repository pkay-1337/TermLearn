      WRITE of size 16 at 0x000000402060 thread T0
          #0 0x401180 in strcpy
          #1 0x401220 in tag_create test.c:7
    target_line: 7
    choices:
      - "Line 6: malloc failed to check for out-of-memory condition"
      - "Line 4: Struct tag_t cannot be allocated on heap"
      - "Line 7: strcpy writes past the 8-byte boundary of t->name, corrupting heap metadata"
    answer: 2
    why: |
      t->name is an 8-byte array. Copying a 16-byte string with unbounded strcpy overflows the struct
      buffer and corrupts adjacent heap memory.
