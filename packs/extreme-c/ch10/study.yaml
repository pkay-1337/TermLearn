          car_t c = { .engine = &e };
          car_set_temperature(&c, 85.0);
          double result = car_get_temperature(&c);
        choices:
          - "85.0"
          - "20.0"
          - "0.0"
          - "-1.0"
        answer: 0
        why: |
          car_set_temperature updates c.engine->temp to 85.0. car_get_temperature then reads and returns
          that updated value (85.0). Option B captures stale pre-setter state. Option D is the error code.
        concept: "delegation-state-predict"

      - kind: trace
        q: "Trace caller vs container access boundaries. Who has direct pointer access to address 0x5000 in safe delegation?"
        code: |
          // Container car at 0x1000 holds engine at 0x5000
          double t = car_get_temperature(car);
        trace:
          headers: ["Context", "Entity", "Direct Pointer to 0x5000?", "Access Mechanism"]
          rows:
            - step: 1
              line: 1
              cells: ["Internal", "car_t private impl", "YES (car->engine)", "Direct struct pointer dereference"]
            - step: 2
              line: 2
              cells: ["External", "main() caller", "???", "Invokes public API car_get_temperature()"]
        target: {row: 1, col: 2}
