  - id: b9
    type: algorithm
    title: "Manage Dynamic Association and Dissociation State Transitions"
    explain_md: |
      Aggregation associations are established and dissolved at runtime via explicit behavioral functions:
      - **Association (`player_pickup_gun`)**:
        Transitions the container from having no association (`gun == NULL`) to referencing an active
        instance (`player->gun = gun`). The aggregation relationship is now active.
      - **Dissociation (`player_drop_gun`)**:
        Transitions the container back to unassociated state by clearing the reference:
        `player->gun = NULL`.

      Crucial invariant: **Dissociation MUST NEVER call `free(player->gun)`**.
      The dropped object is not owned by the player; it belongs to the caller or environment.
      Setting `player->gun = NULL` cleanly severs the link, preventing the player from continuing to
      interact with the gun while preserving the gun in memory for other entities to acquire.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>

        struct gun_t;

        typedef struct {
          struct gun_t* gun;
        } player_t;

        void player_pickup_gun(player_t* player, struct gun_t* gun) {
          if (!player) return;
          player->gun = gun; // Begin aggregation
        }

        void player_drop_gun(player_t* player) {
          if (!player) return;
          player->gun = NULL; // End aggregation; DO NOT free gun!
        }
    checks:
      - kind: predict
        q: "Trace player->gun value across the following sequence. What is player->gun after player_drop_gun runs?"
        code: |
          gun_t* g = gun_new();
          player_t* p = player_new(); player_ctor(p);
          player_pickup_gun(p, g);
          player_drop_gun(p);
        choices:
          - "Points to g (address of gun)"
          - "Dangling pointer"
          - "Undefined"
          - "NULL"
        answer: 3
        why: |
          player_drop_gun explicitly executes `player->gun = NULL;`. The reference is cleared to NULL,
          safely representing that the player holds no weapon.
          Option A ignores player_drop_gun. Options B and C describe bugs that would occur if g were freed.
        concept: "dissociation-null-predict"

      - kind: trace
        q: "Trace the aggregation state transition table. What is player->gun at Step 3?"
        code: |
          player_pickup_gun(p, g); // Line 1
          player_shoot(p);         // Line 2
          player_drop_gun(p);      // Line 3
        trace:
          headers: ["Step", "Line", "Function", "Gun State", "player->gun Value"]
          rows:
            - step: 1
              line: 1
              cells: ["1", "1", "player_pickup_gun", "Allocated at 0x4000", "0x4000"]
            - step: 2
              line: 2
              cells: ["2", "2", "player_shoot", "Fired (bullets decremented)", "0x4000"]
            - step: 3
              line: 3
              cells: ["3", "3", "player_drop_gun", "Alive at 0x4000", "???"]
        target: {row: 2, col: 4}
        choices:
          - "NULL"
          - "0x4000"
          - "0x0001"
          - "Freed"
        answer: 0
        why: |
          In Step 3, player_drop_gun sets player->gun = NULL. The gun at 0x4000 remains alive in memory,
          but the player no longer holds a reference to it.
          Option B captures stale state before drop. Option D incorrectly assumes gun was freed.
        concept: "aggregation-state-table"

      - kind: why-fails
        q: "Why would implementing player_drop_gun as 'free(player->gun); player->gun = NULL;' be a critical bug?"
        choices:
          - "NULL assignment is prohibited after free() in C99"
          - "It destroys an object that player does not own, invalidating outside references to gun"
          - "free() cannot be called through a struct member pointer"
        answer: 1
        why: |
          In aggregation, the player does NOT own the gun. Freeing it destroys the gun for all other
          subsystems (e.g. game world, other players) that still reference it, causing use-after-free or double-free.
          Options A and C are false syntax claims.
        concept: "aggregation-premature-free-error"

      - kind: mcq
        q: "What should happen if player_pickup_gun is called when player->gun is ALREADY pointing to another gun?"
        choices:
          - "The previous gun must be automatically deallocated via free"
          - "The C runtime aborts with an unhandled exception"
          - "The player drops or replaces the reference without freeing the old gun"
        answer: 2
        why: |
          Because the player does not own the weapon, replacing a weapon merely updates the reference
          (or drops the old one first). The old weapon must NOT be freed because other parts of the system
          own it. Option A destroys an object the player doesn't own. Option B invents C exceptions.
        concept: "aggregation-reassignment-policy"

      - kind: order
        q: "Order the lines to safely replace an equipped weapon with a new weapon in an aggregation model:"
        lines:
          - "player_pickup_gun(player, new_gun);"
          - "if (!player || !new_gun) return;"
          - "player_drop_gun(player);"
          - "free(player->gun);"
        answer_order: [1, 2, 0]
        distractor_why:
          "free(player->gun);": "Player does not own gun; freeing it causes a double-free bug."
        why: |
          Safe weapon swapping: (1) validate inputs, (2) drop current weapon (clearing reference without freeing),
          (3) pick up new weapon.
        concept: "aggregation-swap-order"

      - kind: choose-better
        q: "Which implementation of player_drop_gun correctly adheres to aggregation semantics?"
        choices:
          - |
            void player_drop_gun(player_t* player) {
              if (!player) return;
              player->gun = NULL;
            }
          - |
            void player_drop_gun(player_t* player) {
              if (!player) return;
              gun_dtor(player->gun);
              free(player->gun);
              player->gun = NULL;
            }
        answer: 0
        why: |
          Option A severs the aggregation association by setting the pointer to NULL without destroying the
          target object. Option B treats the relationship as composition, improperly destructing and freeing
          an object it does not own.
        concept: "drop-gun-aggregation-choice"

  - id: b10
    type: design
    title: "Enforce Defensive Preconditions Against Optional NULL Dereferences"
    explain_md: |
      Optional aggregation introduces a pervasive hazard: **the pointer may be `NULL` at any moment**.
      Unlike composition, where the child is guaranteed to exist for the container's entire lifetime,
      an aggregated pointer can be `NULL` (before initial association, after dissociation, or when a
      dependency is unavailable).

      Any behavior function that delegates to an aggregated object MUST enforce defensive preconditions:
      ```c
      void player_shoot(player_t* player) {
        if (!player || !player->gun) {
          // Handle error: return error code, log message, or abort
          return;
        }
        gun_trigger(player->gun);
      }
      ```
      Omitting this check is an invitation to instant segmentation faults. In mission-critical systems,
      the API should return status codes (`int player_shoot(...)`) rather than abruptly terminating the
      process with `exit(1)`.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>

        typedef struct {
          int bullets;
        } gun_t;

        void gun_trigger(gun_t* gun) {
          if (gun && gun->bullets > 0) {
            gun->bullets--;
          }
        }

        typedef struct {
          gun_t* gun;
        } player_t;

        // Defensive precondition check returning status code
        int player_shoot(player_t* player) {
          if (!player) return -1;
          if (!player->gun) {
            return -2; // Precondition failure: no gun equipped
          }
          gun_trigger(player->gun);
          return 0; // Success
        }
    checks:
      - kind: why-fails
        q: "Why does calling player_shoot fail when executed immediately after player_drop_gun in unguarded code?"
        code: |
          player_pickup_gun(p, g);
          player_drop_gun(p);
          // Unguarded implementation: gun_trigger(p->gun);
          player_shoot(p);
        choices:
          - "The compiler detects that player_drop_gun invalidates the player struct"
          - "p->gun is NULL; dereferencing it inside gun_trigger triggers a segmentation fault"
          - "gun_t requires a reset signal before firing again"
        answer: 1
        why: |
          player_drop_gun sets p->gun = NULL. An unguarded player_shoot passes NULL to gun_trigger, where
          `gun->bullets--` attempts to dereference address 0x0, crashing with SIGSEGV.
          Options A and C are fictitious mechanisms.
        concept: "unguarded-null-dereference"

      - kind: choose-better
        q: "Which error-handling strategy is preferable for a library API implementing player_shoot?"
        choices:
          - |
            // Return status code: non-fatal, recoverable
            int player_shoot(player_t* p) {
              if (!p || !p->gun) return -1;
              gun_trigger(p->gun);
              return 0;
            }
          - |
            // Abrupt process exit: fatal, non-recoverable
            void player_shoot(player_t* p) {
              if (!p || !p->gun) exit(1);
              gun_trigger(p->gun);
            }
        answer: 0
        why: |
          Option A returns an error status code, allowing calling code to handle the condition gracefully
          (e.g. playing a 'dry fire' click sound in a game UI). Option B kills the entire process, making
          recovery impossible and ruining testability.
        concept: "error-return-vs-exit"

      - kind: spot-bug
        q: "Identify the flawed condition in this defensive guard:"
        code: |
          int player_shoot_buggy(player_t* player) {
            if (player && player->gun == NULL) {
              gun_trigger(player->gun);
              return 0;
            }
            return -1;
          }
        diagnostic_log: |
          ==8819==ERROR: AddressSanitizer: SEGV on unknown address 0x000000000000
          WRITE of size 4 at 0x000000000000 thread T0
              #0 0x401188 in gun_trigger test.c:7
              #1 0x401250 in player_shoot_buggy test.c:3
        target_line: 3
        choices:
          - "Line 1: Function cannot return int"
          - "Line 5: Missing break statement in if clause"
          - "Line 2: Guard inverted (== NULL instead of != NULL); triggers gun only when gun IS NULL!"
        answer: 2
        why: |
          The logic is accidentally inverted: `player->gun == NULL` enters the branch ONLY when gun is NULL,
          guaranteeing that line 3 passes NULL directly into gun_trigger and crashes.
          Options A and B are syntactically untrue.
        concept: "inverted-null-guard-bug"

      - kind: eipe
        q: "In one sentence, what is the primary purpose of defensive precondition checking in aggregation?"
        choices:
          - "To verify that dynamic heap memory has not been fragmented by the allocator"
          - "To ensure that pointer references are non-NULL before delegating operations to them"
          - "To enable garbage collection sweeps across dormant struct members"
          - "To force synchronization across multi-threaded execution cores"
        answer: 1
        why: |
          Because aggregated references can be absent (NULL) at runtime, defensive checks ensure the target
          exists before attempting to dereference its memory, preventing fatal crashes.
          Options A, C, and D refer to unrelated computer science concepts.
        concept: "precondition-purpose"

      - kind: mcq
        q: "When an aggregated component is missing, what is a common alternative to returning an error code?"
        choices:
          - "Casting the NULL pointer to a valid struct reference"
          - "Using the Null Object Pattern (a safe dummy instance that performs no-op operations)"
          - "Reading from arbitrary memory offsets until valid data is encountered"
        answer: 1
        why: |
          The Null Object Pattern provides a stub instance that implements the expected interface with
          no-op behaviors (e.g. an EmptyGun whose trigger does nothing), eliminating the need for NULL checks.
          Options A and C describe fatal memory corruption bugs.
        concept: "null-object-pattern"

      - kind: predict
        q: "Trace the return value of player_shoot when invoked on a player who has not picked up any weapon:"
        code: |
          player_t* p = player_new();
          player_ctor(p);
          int status = player_shoot(p);
        choices:
          - "-2"
          - "0"
          - "1"
          - "Segmentation fault"
        answer: 0
        why: |
          player_ctor nullifies p->gun. When player_shoot runs, `if (!player->gun)` evaluates to true and
          returns -2 without attempting to dereference the pointer.
          Option B assumes firing succeeded. Option D assumes an unhandled crash.
        concept: "defensive-status-trace"

  - id: b11
    type: design
    title: "Distinguish Instance Temporality from Permanent Type-Level Coupling"
    explain_md: |
      An essential architectural insight unites object relationships:
      - **At the Object Level**: Aggregation between two specific object instances (e.g. `player_A` and
        `gun_B`) is often **dynamic and temporary**. They become associated when picked up, interact, and
        dissociate when dropped.
      - **At the Type Level**: The relationship between their classes/types (`player_t` and `gun_t`) is
        **permanent and static**.

      Even if a player never picks up a gun in an entire execution, `player_t` permanently contains:
      ```c
      struct gun_t* gun;
      ```
      This means `player_t` permanently depends on `gun_t` at compile time, and every single `player_t`
      instance permanently incurs the memory footprint of that pointer (`sizeof(void*)`).
      In class-based C, type definitions are fixed at compile time.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>

        struct gun_t;

        typedef struct {
          char name[16];
          struct gun_t* gun; // Permanent 8-byte member in every instance
        } player_t;

        size_t player_footprint(void) {
          return sizeof(player_t);
        }

        int has_type_coupling(void) {
          // player_t has a permanent compile-time coupling to gun_t
          return sizeof(player_t) >= sizeof(struct gun_t*);
        }
    checks:
      - kind: mcq
        q: "If an aggregation relationship between two objects is temporary at runtime, is it also temporary between their types?"
        choices:
          - "Yes; C structs dynamically remove pointer fields when instances are dissociated"
          - "Yes; the C linker strips unused struct fields during dead-code elimination"
          - "No; the type-level relationship is permanent because the struct definition must declare the pointer at compile time"
        answer: 2
        why: |
          In class-based languages like C, struct layouts are fixed at compile time. Every player_t instance
          permanently holds a struct gun_t* member regardless of whether it currently points to a gun or NULL.
          Options A and B confuse dynamic runtime state with static compile-time struct layout.
        concept: "instance-vs-type-permanence"

      - kind: eipe
        q: "In one sentence, what compile-time dependency does aggregation introduce into the container's translation unit?"
        choices:
          - "It requires the container's header to include the complete binary object file of the contained class"
          - "It couples the container type to the contained type by requiring a type declaration and fixed pointer storage"
          - "It forces the container class to inherit all virtual methods of the aggregated class"
        answer: 1
        why: |
          Declaring an aggregation pointer requires at least a forward declaration of the target type and
          permanently reserves sizeof(void*) bytes in every container instance, coupling the two types.
          Option A confuses source headers with binary object files. Option C confuses aggregation with inheritance.
        concept: "type-coupling-implication"

      - kind: why-fails
        q: "Why can't C remove the 'gun' pointer from player_t when the player is not currently carrying a weapon?"
        choices:
          - "C structs have static, immutable memory layouts determined at compile time"
          - "The C preprocessor rejects conditional struct field declarations"
          - "Pointers cannot be assigned the value NULL in static memory"
        answer: 0
        why: |
          In C, struct member offsets and total size are fixed at compile time. The language does not support
          dynamic runtime resizing or mutation of struct definitions.
          Options B and C are false statements about preprocessors and NULL pointers.
        concept: "static-struct-layout-immutability"

      - kind: choose-better
        q: "When a container class may aggregate dozens of optional, rarely-used components, which design avoids struct bloating?"
        choices:
          - |
            // Bloated: dozens of NULL pointers inside every instance
            typedef struct {
              weapon_t* weapon;
              armor_t* armor;
              vehicle_t* vehicle;
              pet_t* pet;
            } player_t;
          - |
            // Scalable: dynamic property collection / component bag
            typedef struct {
              void** components;
              size_t count;
            } player_t;
        answer: 1
        why: |
          Option B uses a dynamic component array or hash map (Entity-Component-System style), storing only
          active components rather than permanently burdening every instance with dozens of unused NULL pointers.
          Option A permanently bloats every instance's memory footprint.
        concept: "component-bag-scalability"

      - kind: predict
        q: "Predict the output of sizeof(player_t) on a 64-bit architecture where padding aligns pointers to 8-byte boundaries:"
        code: |
          typedef struct {
            char name[16];     // 16 bytes
            struct gun_t* gun; // 8 bytes
          } player_t;
        choices:
          - "16"
          - "8"
          - "24"
          - "0"
        answer: 2
        why: |
          name[16] occupies 16 bytes. gun occupies 8 bytes. Total size = 16 + 8 = 24 bytes.
          Option A forgets the pointer. Option B measures only the pointer. Option D is absurd.
        concept: "struct-size-predict"

      - kind: trace
        q: "Trace struct field offsets for player_t. At what byte offset does member 'gun' begin?"
        code: |
          typedef struct {
            char name[16];     // offset 0..15
            struct gun_t* gun; // offset ???
          } player_t;
        trace:
          headers: ["Member", "Type", "Size", "Start Offset", "End Offset"]
          rows:
            - step: 1
              line: 2
              cells: ["name", "char[16]", "16 bytes", "0", "15"]
            - step: 2
              line: 3
              cells: ["gun", "struct gun_t*", "8 bytes", "???", "23"]
        target: {row: 1, col: 3}
        choices:
          - "0"
          - "16"
          - "8"
          - "24"
        answer: 1
        why: |
          name occupies bytes 0 through 15 (16 bytes). Because 16 is already a multiple of 8, no padding
          is required, and pointer member 'gun' begins immediately at byte offset 16.
          Options A, C, and D are incorrect offset calculations.
        concept: "struct-offset-trace"
