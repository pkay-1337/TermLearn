          car->engine = (engine_t*)malloc(sizeof(engine_t));
          if (!car->engine) {
            free(car);
            return NULL;
          }
        choices:
          - "Returns a partially initialized car; memory is leaked"
          - "Returns NULL; allocated car memory is cleanly freed with zero leaks"
          - "Triggers a segmentation fault inside free(car)"
          - "Returns NULL, but car struct memory remains leaked on heap"
        answer: 1
        why: |
          If car->engine allocation fails, the branch explicitly executes free(car) before returning NULL,
          ensuring transactional rollback: no memory is leaked and the caller receives NULL.
          Option D overlooks the explicit free(car) call in the failure handler.
        concept: "transactional-construction"

      - kind: order
        q: "Order the lines to implement safe cascading destruction for car_destroy:"
        lines:
          - "free(car->engine);"
          - "if (!car) return;"
          - "free(car);"
          - "car->odometer = -1;"
        answer_order: [1, 0, 2]
        distractor_why:
          "car->odometer = -1;": "Writing to fields right before deallocation is redundant and wasteful."
        why: |
          Safe destruction: (1) check if container is NULL, (2) free nested child resource car->engine,
          (3) free the container car itself.
        concept: "destruction-cascade-order"

      - kind: trace
