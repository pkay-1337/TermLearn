blocks:
  - id: b1
    type: model
    title: "Differentiate Struct Blueprints from Runtime Heap Instances"
    explain_md: |
      In C, an object-oriented class begins as a compile-time blueprint: a `typedef struct` declaration.
      The struct definition itself reserves no physical memory in RAM during program execution. It merely
      instructs the C compiler how to calculate member offsets and determine the total byte footprint of
      future instances.

      A concrete object instance exists only when memory is explicitly allocated—typically on the heap
      via `malloc(sizeof(type_t))`—yielding a unique memory address. Each instantiated object maintains
      its own independent block of memory holding state values for those attributes. While multiple
      instances share the exact same structural memory layout, mutating the attribute values of one
      instance has zero effect on any other instance.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>

        typedef struct {
          char name[32];
          unsigned int age;
        } person_t;

        person_t* person_new(void) {
          return (person_t*)malloc(sizeof(person_t));
        }

        void person_ctor(person_t* p, const char* name, unsigned int age) {
          strncpy(p->name, name, sizeof(p->name) - 1);
          p->name[sizeof(p->name) - 1] = '\0';
          p->age = age;
        }
      subgoals:
        - label: "Define compile-time struct blueprint"
          lines: [5, 6, 7, 8]
        - label: "Allocate runtime memory block"
          lines: [10, 11, 12]
        - label: "Initialize instance attributes"
          lines: [14, 15, 16, 17, 18]
    viz:
      kind: ascii-memory
      steps:
        - "COMPILE TIME: struct person_t { char name[32]; uint32_t age; } -> Size: 36 bytes, Addr: None"
        - "RUNTIME STEP 1: person_t* p1 = malloc(36) -> Heap Addr: 0x1000 [Uninitialized 36 bytes]"
        - "RUNTIME STEP 2: person_ctor(p1, 'Alice', 30) -> Addr 0x1000: name='Alice', age=30"
        - "RUNTIME STEP 3: person_t* p2 = malloc(36) -> Heap Addr: 0x1040 [Distinct independent chunk]"
        - "RUNTIME STEP 4: person_ctor(p2, 'Bob', 25) -> Addr 0x1040: name='Bob', age=25"
    checks:
      - kind: predict
        q: "Trace line by line, tracking heap allocations. What is the value of p1->age after both constructors run?"
        code: |
          person_t* p1 = person_new();
          person_ctor(p1, "Alice", 30);
          person_t* p2 = person_new();
          person_ctor(p2, "Bob", 45);
        choices:
          - "45"
          - "0"
          - "Undefined garbage"
          - "30"
        answer: 3
        why: |
          p1 and p2 point to distinct heap allocations (e.g. 0x1000 and 0x1040). Mutating p2->age in the
          second constructor call affects only p2's memory block, leaving p1->age intact at 30.
          Option A traps the misconception that struct attributes behave like shared static variables.
          Option B traps default-zero initialization assumptions. Option C ignores person_ctor initialization.
        concept: "class-vs-object-memory"

      - kind: mcq
        q: "What amount of physical runtime memory is consumed by a C typedef struct definition before any instance is created?"
        choices:
          - "The sum of the sizes of its member types"
          - "The size of a single pointer (8 bytes on 64-bit architectures)"
          - "1 byte to guarantee a non-zero address footprint"
          - "0 bytes; the struct declaration is purely a compile-time type blueprint"
        answer: 3
        why: |
          A struct definition is purely metadata used by the compiler to compute offsets and validate types.
          It allocates zero bytes in executable memory segments (data, BSS, stack, or heap) at runtime.
          Option A confuses the sizeof value of future instances with definition-time allocation.
          Option B confuses struct definitions with pointer declarations.
          Option C confuses C structs with empty C++ structs.
        concept: "lifecycle-sequence"

      - kind: why-fails
        q: "Why does the following function trigger undefined behavior or a crash when called?"
        code: |
          person_t* person_create_bad(const char* name, unsigned int age) {
            person_t p;
            person_ctor(&p, name, age);
            return &p;
          }
        choices:
          - "person_ctor requires dynamic memory and rejects pointers to stack variables"
          - "The string copy inside person_ctor overflows the stack frame"
          - "person_t does not support pass-by-address semantics"
          - "Returning the address of a local stack frame variable leaves a dangling pointer upon return"
        answer: 3
        why: |
          Local variable 'p' resides in person_create_bad's stack frame. When the function returns, its stack
          frame is deallocated and reclaimed. The caller receives a dangling pointer to invalid stack memory.
          Option A is incorrect because person_ctor accepts any valid person_t pointer regardless of storage duration.
          Option B assumes buffer overflow without evidence. Option C is a false syntax restriction.
        concept: "stack-dangling-pointer"

      - kind: trace
        q: "Trace stack allocation for two distinct instances of person_t. What is the value in target cell?"
        code: |
          person_t p1;
          person_t p2;
          p1.age = 25;
          p2.age = 40;
        trace:
          headers: ["Step", "Variable", "Address", "Attribute", "Value"]
          rows:
            - step: 1
              line: 3
              cells: ["1", "p1", "0x7ffd10", "p1.age", "25"]
            - step: 2
              line: 4
              cells: ["2", "p2", "0x7ffd60", "p2.age", "40"]
        target: {row: 1, col: 4}
        answer_text: "40"
        why: |
          p1 and p2 occupy distinct memory addresses; assigning p2.age = 40 sets its value to 40 without modifying p1.
        concept: "distinct-instance-state"

      - kind: eipe
        q: "In one sentence, what is the purpose of the person_new function in class-based C programming?"
        choices:
          - "It zeroes out all memory bytes within an existing person_t struct buffer"
          - "It registers the person_t type table inside the runtime dynamic linker"
          - "It acquires dynamic heap storage sized for one instance before construction occurs"
          - "It initializes the name and age attributes with safe default values"
        answer: 2
        why: |
          In class-based C, person_new acts strictly as the raw memory allocator: it requests sizeof(person_t)
          bytes from the system heap so a subsequent constructor call has a valid memory location to initialize.
          Option A describes calloc or memset. Option B invents non-existent linker registration.
          Option D confuses memory allocation (person_new) with attribute construction (person_ctor).
        concept: "allocator-purpose"

      - kind: fillblank
        q: "Complete the allocation statement by filling in the operator that evaluates the struct byte footprint:"
        code: |
          person_t* p = (person_t*)malloc(_____(person_t));
        answer_text: "sizeof"
        why: |
          The sizeof operator is evaluated at compile time by the C compiler to yield the exact byte size
          (including struct padding and alignment requirements) of the requested type.
        concept: "sizeof-operator"

  - id: b2
    type: algorithm
    title: "Sequence Two-Phase Construction and Destruction Lifecycles"
    explain_md: |
      Object lifecycle in C requires strict two-phase creation and two-phase destruction:
      1. **Allocation**: `car_new()` requests raw bytes from the heap allocator. At this instant, memory
         holds undefined garbage bits.
      2. **Construction**: `car_ctor(car)` validates the allocated pointer, initializes internal state
         fields to known invariants, and acquires any dependent resources.
      3. **Destruction**: `car_dtor(car)` tears down all resources owned by the object (closing descriptors,
         freeing nested child objects).
      4. **Deallocation**: `free(car)` releases the container's own memory back to the heap allocator.

      Conflating or reordering these phases creates catastrophic bugs: calling `free(car)` before `car_dtor(car)`
      leaks owned child allocations or triggers heap-use-after-free when the destructor tries to read pointers
      from reclaimed memory.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>

        typedef struct {
          int speed;
        } car_t;

        car_t* car_new(void) {
          return (car_t*)malloc(sizeof(car_t));
        }

        void car_ctor(car_t* car) {
          if (!car) return;
          car->speed = 0;
        }

        void car_dtor(car_t* car) {
          if (!car) return;
          // Teardown owned resources
        }

        void car_free(car_t* car) {
          free(car);
        }
    viz:
      kind: ascii-memory
      steps:
        - "PHASE 0 [Pre-alloc]: car = NULL"
        - "PHASE 1 [Allocation]: car = car_new() -> Heap: [Garbage / uninitialized]"
        - "PHASE 2 [Construction]: car_ctor(car) -> Heap: [speed = 0] (Valid Invariant)"
        - "PHASE 3 [Destruction]: car_dtor(car) -> Internal child resources released"
        - "PHASE 4 [Deallocation]: car_free(car) -> Heap memory returned to system"
    checks:
      - kind: predict
        q: "Trace the execution sequence. What bug occurs if car_free is invoked before car_dtor in an object owning resources?"
        code: |
          car_t* car = car_new();
          car_ctor(car);
          car_free(car);
          car_dtor(car);
        choices:
          - "Compile-time syntax error on car_dtor call"
          - "Memory leak only, with no runtime CPU execution defects"
          - "Heap-use-after-free and potential crash when car_dtor dereferences the freed car pointer"
          - "car_dtor automatically cancels the preceding free call"
        answer: 2
        why: |
          Once car_free(car) executes, the heap memory at address car is released. Calling car_dtor(car)
          afterwards causes car_dtor to dereference a dangling pointer (heap-use-after-free), invoking
          undefined behavior. Option A is wrong because both accept valid pointer syntax.
          Option D is impossible in C's memory model.
        concept: "destruction-ordering"
        from_chapter: ch09
        from_block: b2

      - kind: order
        q: "Arrange the scrambled lines into the correct canonical lifecycle order for creating, using, and destroying an object:"
        lines:
          - "car_dtor(car);"
          - "car_t* car = car_new();"
          - "free(car);"
          - "car_ctor(car);"
          - "free(car->speed);"
        answer_order: [1, 3, 0, 2]
        distractor_why:
          "free(car->speed);": "speed is an integer scalar attribute, not a dynamically allocated pointer."
        why: |
          Canonical lifecycle: (1) allocate memory via car_new, (2) initialize state via car_ctor,
          (3) release resources via car_dtor, (4) release object storage via free.
        concept: "lifecycle-pipeline"

      - kind: why-fails
        q: "Why must car_ctor check if the incoming car pointer is NULL before accessing its fields?"
        code: |
          void car_ctor_unchecked(car_t* car) {
            car->speed = 0; // If car == NULL, what happens?
          }
        choices:
          - "Dereferencing NULL triggers a segmentation fault / hardware trap"
          - "The compiler rejects pointer dereferences without ternary operators"
          - "NULL pointers automatically allocate fallback stack storage"
        answer: 0
        why: |
          If malloc fails inside car_new and returns NULL, passing that pointer directly into car_ctor_unchecked
          causes car->speed to dereference address 0x0, immediately causing a hardware segmentation fault.
          Option B is false syntax. Option C is a magical misconception about NULL pointer behavior.
        concept: "null-guard-defensive"

      - kind: spot-bug
        q: "Analyze the code and AddressSanitizer report. Which line causes the memory error?"
        code: |
          car_t* c = car_new();
          car_ctor(c);
          free(c);
          c->speed = 50;
        diagnostic_log: |
          ==9812==ERROR: AddressSanitizer: heap-use-after-free on address 0x602000000010
          WRITE of size 4 at 0x602000000010 thread T0
              #0 0x401182 in main test.c:4
        target_line: 4
        choices:
          - "Line 1: car_new allocated insufficient byte width"
          - "Line 4: Mutating speed attribute through dangling pointer c after memory was freed in line 3"
          - "Line 2: car_ctor called with invalid struct reference"
        answer: 1
        why: |
          In line 3, free(c) returns the heap block to the allocator. Line 4 dereferences c to write to speed,
          generating an AddressSanitizer heap-use-after-free error.
          Option A is wrong because car_new allocated sizeof(car_t). Option C is wrong because c was valid in line 2.
        concept: "use-after-free-diagnosis"

      - kind: mcq
        q: "What is the primary architectural responsibility of a destructor function (e.g. car_dtor) versus a deallocator (e.g. free)?"
        choices:
          - "The destructor alters virtual function pointer tables, while free updates kernel page tables"
          - "The destructor zeroes out CPU registers, while free resets the heap fragmentation index"
          - "The destructor releases internal resources and contained child objects; free reclaims the instance buffer itself"
        answer: 2
        why: |
          Destruction cleans up dependencies, closes file descriptors, and recursively tears down child objects.
          Deallocation (free) simply returns the memory block of the container struct back to the heap manager.
          Options A and B describe non-existent or irrelevant mechanisms.
        concept: "dtor-vs-deallocator"

      - kind: choose-better
        q: "Which constructor implementation correctly pairs defensive validation with robust initialization?"
        choices:
          - |
            void car_ctor(car_t* car) {
              car->speed = 0;
            }
          - |
            void car_ctor(car_t* car) {
              if (!car) return;
              car->speed = 0;
            }
        answer: 1
        why: |
          Option B checks `if (!car) return;` before dereferencing, safely handling allocation failures from
          the preceding allocator call. Option A will crash immediately if malloc returned NULL.
        concept: "constructor-defensive-design"

  - id: b3
    type: model
    title: "Bind Lifetime and Ownership Invariants in Composition"
    explain_md: |
      Composition is the strongest form of the "to-have" relationship between two objects. When a `Car`
      has a composition relationship with an `Engine`:
      1. **Lifetime Binding**: The lifetime of the contained `Engine` object is strictly bounded by the
         lifetime of the container `Car`. An engine cannot exist before its car is created, nor can it
         survive after the car is destroyed.
      2. **Exclusive Ownership**: The container object is the sole, undisputed owner of the contained object.
         The engine is created during `car_ctor` and destroyed during `car_dtor`.
      3. **Private Encapsulation**: The contained engine is internal and private to the car. No external
         code should be permitted to destroy or replace the engine directly. If external code can destroy
         the engine without destroying the car, the composition invariant is breached.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>

        typedef struct {
          double temperature;
        } engine_t;

        engine_t* engine_new(void) {
          return (engine_t*)malloc(sizeof(engine_t));
        }

        void engine_ctor(engine_t* eng) {
          eng->temperature = 15.0;
        }

        void engine_dtor(engine_t* eng) {
          (void)eng;
        }

        typedef struct {
          engine_t* engine; // Contained object
        } car_t;

        car_t* car_new(void) {
          return (car_t*)malloc(sizeof(car_t));
        }

        void car_ctor(car_t* car) {
          car->engine = engine_new();
          engine_ctor(car->engine);
        }

        void car_dtor(car_t* car) {
          engine_dtor(car->engine);
          free(car->engine);
        }
    viz:
      kind: ascii-memory
      steps:
        - "STEP 1: car_new() -> Heap: car_t at 0x2000 [engine = garbage]"
        - "STEP 2: car_ctor() calls engine_new() -> Heap: engine_t at 0x5000 [temp = garbage]"
        - "STEP 3: car_ctor() calls engine_ctor() -> Addr 0x5000: [temp = 15.0]"
        - "STEP 4: car_ctor() links child -> Addr 0x2000: car->engine = 0x5000"
        - "STEP 5: car_dtor() tears down child -> free(0x5000)"
        - "STEP 6: free(car) tears down container -> free(0x2000)"
    checks:
      - kind: trace
        q: "Trace heap state transitions during car_dtor. What happens to the memory at address 0x5000 in Step 5?"
        code: |
          void car_dtor(car_t* car) {
            engine_dtor(car->engine);
            free(car->engine);
          }
        trace:
          headers: ["Step", "Target Pointer", "Target Address", "State After Execution"]
          rows:
            - step: 1
              line: 1
              cells: ["1", "car", "0x2000", "Valid container holding engine pointer 0x5000"]
            - step: 2
              line: 2
              cells: ["2", "car->engine", "0x5000", "engine_dtor executed; resources released"]
            - step: 3
              line: 3
              cells: ["3", "car->engine", "0x5000", "???"]
        target: {row: 2, col: 3}
        choices:
          - "Memory remains allocated and ownership transfers to the operating system"
          - "Deallocated via free; address 0x5000 returned to heap pool"
          - "Automatically zero-initialized and protected from reuse"
          - "Re-allocated as a fallback car instance"
        answer: 1
        why: |
          In Step 3, free(car->engine) releases the 0x5000 heap chunk back to the runtime allocator.
          Because composition binds the child's lifetime to the container, the child is freed before the
          container itself is freed. Options A, C, and D misrepresent free() behavior.
        concept: "composition-dtor-trace"

      - kind: mcq
        q: "Under what condition is the composition relationship between a container and contained object considered breached?"
        choices:
          - "The container object accesses the contained object's attributes via public member functions"
          - "The container object allocates memory on the heap rather than on the thread stack"
          - "The contained object's struct definition is placed in a separate source file"
          - "External code destroys or deallocates the contained object while the container object still lives"
        answer: 3
        why: |
          Composition requires that the contained object's lifetime is strictly managed internally by the container.
          If outside code can free or invalidate the contained object independently, the container is left with
          a dangling pointer and the composition invariant is destroyed.
          Options A, B, and C are standard, correct object-oriented practices.
        concept: "composition-invariants"

      - kind: predict
        q: "Predict the state of car->engine if car_dtor omits the call to free(car->engine) before the container is freed:"
        code: |
          void car_dtor_leaky(car_t* car) {
            engine_dtor(car->engine);
            // free(car->engine) omitted!
          }
          // Caller executes:
          car_dtor_leaky(car);
          free(car);
        choices:
          - "Memory leak: the engine_t heap chunk remains allocated with no reachable pointer to free it"
          - "The operating system automatically detects composition and frees car->engine"
          - "Compile-time error: gcc flags unreleased struct pointer members"
          - "car->engine is deallocated automatically when free(car) runs"
        answer: 0
        why: |
          free(car) only reclaims the bytes of the car_t struct itself. The pointer variable car->engine is
          destroyed, leaving the memory chunk it pointed to allocated on the heap with zero references—a classic
          memory leak. Option B assumes automatic garbage collection. Option D confuses pointer storage with
          pointed-to heap blocks.
        concept: "composition-leak"

      - kind: why-fails
        q: "Why does exposing a function 'engine_t* car_get_engine(car_t* car)' violate composition principles?"
        choices:
          - "Pointers cannot cross translation unit boundaries in ANSI C"
          - "Calling engine functions requires an extra pointer dereference that degrades L1 cache efficiency"
          - "Leaking the internal pointer allows external callers to mutate or free the engine without car's knowledge"
          - "Incomplete types cannot be returned by value or by pointer"
        answer: 2
        why: |
          Exposing a direct pointer to the private child object breaks information hiding and ownership:
          an external caller could invoke free() on the engine, leaving the parent car in a corrupted state.
          Option A is false C mechanics. Option B is an irrelevant optimization tangent. Option D is false.
        concept: "pointer-leakage-violation"

      - kind: eipe
        q: "In one sentence, what is the core ownership relationship established by composition?"
        choices:
          - "Both objects share equal ownership and can be freed by whichever caller finishes first"
          - "The container object exclusively controls the allocation, lifetime, and destruction of the contained object"
          - "The contained object owns the container and triggers the container's destructor upon termination"
          - "The operating system runtime owns both objects and synchronizes their access via mutexes"
        answer: 1
        why: |
          Composition is defined by exclusive, unidirectional ownership: the container creates the child,
          encapsulates its access, and destroys it when the container itself terminates.
          Options A and C invert or distort the hierarchy. Option D introduces unrelated OS concurrency concepts.
        concept: "composition-ownership-core"

      - kind: choose-better
        q: "Which destructor pattern correctly upholds the composition contract for car_t and its owned engine?"
        choices:
          - |
            void car_dtor(car_t* car) {
              engine_dtor(car->engine);
              free(car->engine);
            }
          - |
            void car_dtor(car_t* car) {
              free(car);
              free(car->engine);
            }
        answer: 0
        why: |
          Option A follows the strict inside-out destruction order: it first tears down and frees the child
          engine, leaving the container ready for deallocation. Option B frees car first, then illegally reads
          car->engine from already-freed memory (use-after-free).
        concept: "composition-dtor-design"

  - id: b4
    type: syntax
    title: "Encapsulate Internal Components Using Incomplete Type Declarations"
    explain_md: |
      To achieve true encapsulation in C, struct members representing contained objects should use
      **incomplete types** (forward declarations).
      In the public header `car.h`, we forward-declare:
      ```c
      struct car_t;
      ```
      In `car.c`, we include `engine.h` and define:
      ```c
      typedef struct {
        struct engine_t* engine;
      } car_t;
      ```
      The C compiler permits declaring pointers to incomplete types (`struct engine_t*`) because all
      data pointers have identical size and alignment on a given architecture (8 bytes on 64-bit platforms).
      The compiler does NOT need to know `engine_t`'s internal fields to allocate storage for `car_t`.
      This prevents clients of `car.h` from inspecting, depending on, or mutating engine attributes directly.
    example:
      lang: c
      code: |
        #include <stdlib.h>

        // Forward declaration of incomplete type
        struct engine_t;

        // Complete struct definition containing pointer to incomplete type
        typedef struct {
          struct engine_t* engine;
          int fuel_level;
        } car_t;

        car_t* car_new(void) {
          return (car_t*)malloc(sizeof(car_t));
        }

        size_t car_size(void) {
          return sizeof(car_t);
        }
    checks:
      - kind: mcq
        q: "Why is the C compiler able to compute sizeof(car_t) when struct engine_t is only forward-declared?"
        choices:
          - "The compiler inspects other source files during preprocessing to find engine_t's field sizes"
          - "The compiler defaults incomplete types to 32 bytes of heap space"
          - "All object pointers have a fixed, known byte width (e.g. 8 bytes on 64-bit systems) regardless of pointee type"
          - "The compiler defers sizeof evaluation until dynamic link time"
        answer: 2
        why: |
          A pointer is simply an address. On a 64-bit architecture, every pointer occupies exactly 8 bytes.
          Thus, sizeof(car_t) = 8 bytes (pointer) + 4 bytes (int) + 4 bytes (padding) = 16 bytes, regardless
          of whether engine_t is defined or incomplete. Options A, B, and D are factually false in C compilation.
        concept: "incomplete-type-pointer-size"

      - kind: why-fails
        q: "Why does the following struct definition trigger a compile-time error?"
        code: |
          struct engine_t; // Forward declaration

          typedef struct {
            struct engine_t engine; // Note: NOT a pointer!
            int fuel_level;
          } car_t;
        choices:
          - "struct engine_t cannot be embedded without the 'extern' keyword"
          - "Field 'engine' has incomplete type; the compiler cannot determine the byte footprint of car_t"
          - "C forbids placing structs inside other structs"
        answer: 1
        why: |
          To embed a struct by value, the compiler MUST know its exact byte size and alignment. Because
          struct engine_t is only forward-declared, its size is unknown, causing compiler error 'field has
          incomplete type'. By contrast, a pointer to an incomplete type has a fixed, known size.
          Option C is false because nested struct values are valid when the definition is complete.
        concept: "incomplete-type-by-value-error"

      - kind: fillblank
        q: "Complete the forward declaration of an incomplete struct type named engine_t:"
        code: |
          _____ engine_t;
        answer_text: "struct"
        why: |
          In C, `struct tag;` introduces an incomplete struct type declaration before its body is defined.
        concept: "forward-decl-syntax"

      - kind: order
        faded: true
        q: "Order the lines and supply the missing allocation size argument to implement the opaque car_new function:"
        lines:
          - "return car;"
          - "car_t* car = (car_t*)malloc(_____);"
          - "free(car);"
          - "if (!car) return NULL;"
        answer_order: [1, 3, 0]
        distractor_why:
          "free(car);": "Deallocating car immediately destroys the newly created instance before returning."
        blanks:
          - line_idx: 1
            token: "_____"
            answer_text: "sizeof(car_t)"
            accepted: ["sizeof(car_t)", "sizeof(*car)"]
        why: |
          car_new must: (1) allocate sizeof(car_t) bytes, (2) verify the allocation succeeded, (3) return the pointer.
        concept: "faded-allocator-order"

      - kind: spot-bug
        q: "Analyze the code and compiler error. What is the fundamental cause of the compilation failure?"
        code: |
          struct engine_t; // Forward declaration

          void inspect_engine(struct engine_t* eng) {
            double t = eng->temperature;
            (void)t;
          }
        diagnostic_log: |
          error: dereferencing pointer to incomplete type ‘struct engine_t’
             double t = eng->temperature;
                           ^~
        target_line: 4
        choices:
          - "Variable t must be declared static before assignment"
          - "The -> operator is reserved for complete union types"
          - "Arrow operator dereferences an incomplete type whose member offsets are unknown in this translation unit"
        answer: 2
        why: |
          You cannot dereference a pointer to an incomplete type because the compiler does not know where
          member 'temperature' is located within engine_t. The complete struct definition must be included.
          Options A and B are incorrect assertions.
        concept: "incomplete-deref-bug"

      - kind: predict
        q: "Predict the return value of sizeof(car_t*) on a standard 64-bit POSIX system:"
        code: |
          struct car_t;
          size_t get_size(void) {
            return sizeof(struct car_t*);
          }
        choices:
          - "8"
          - "0"
          - "16"
          - "Compilation failure because car_t is incomplete"
        answer: 0
