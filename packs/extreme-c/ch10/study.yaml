          Option D is a common misconception; sizeof on a pointer to incomplete type is fully valid.
        concept: "pointer-size-prediction"
        from_chapter: ch04
        from_block: b1

  - id: b5
    type: algorithm
    title: "Coordinate Cascading Construction and Destruction Chains"
    explain_md: |
      In composition, object initialization and teardown propagate in structured cascades:
      - **Construction Cascade (Top-Down)**:
        `car_new()` allocates `car_t` -> `car_ctor()` validates container -> `car_ctor()` calls `engine_new()`
        to allocate child -> `car_ctor()` calls `engine_ctor()` to initialize child.
      - **Destruction Cascade (Bottom-Up)**:
        `car_dtor()` calls `engine_dtor()` to tear down child resources -> `car_dtor()` frees `car->engine`
        memory -> `car_dtor()` finishes -> Caller frees `car` container memory.

      Notice the strict inversion: child resources are created after the container exists, and child
      resources are destroyed before the container is released. Reversing this sequence corrupts memory.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>

        typedef struct {
          int serial;
        } engine_t;

        typedef struct {
          engine_t* engine;
          int odometer;
        } car_t;

        car_t* car_create(int serial) {
          car_t* car = (car_t*)malloc(sizeof(car_t));
          if (!car) return NULL;
          car->engine = (engine_t*)malloc(sizeof(engine_t));
          if (!car->engine) {
            free(car);
            return NULL;
          }
          car->engine->serial = serial;
          car->odometer = 0;
          return car;
        }

        void car_destroy(car_t* car) {
          if (!car) return;
          free(car->engine);
          free(car);
        }
    checks:
      - kind: predict
        q: "Trace car_create when engine malloc fails (returns NULL). What does car_create return, and is memory leaked?"
        code: |
