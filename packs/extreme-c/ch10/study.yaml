        concept: "multi-level-destruction-cascade"

  - id: b6
    type: design
    title: "Protect Contained Components by Preventing Pointer Leakage"
    explain_md: |
      A cornerstone of object-oriented encapsulation in C is that the container's private implementation
      consumes the contained object's **public interface**, but **never leaks** internal references out.
      Consider `car_t` containing `engine_t`:
      - `car_t` implementation calls `engine_turn_on(car->engine)`.
      - `car_t` exposes public behavior functions: `car_start(car)` and `car_get_engine_temperature(car)`.
      - `car_t` NEVER exposes `engine_t* car_get_engine(car_t* car)`.

      If internal pointers are leaked, external client code can directly modify engine state, bypass car
      invariants, or even invoke `free(engine)`. By restricting communication to behavior wrappers, the
      engine implementation can be completely swapped or refactored with zero impact on client code.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>

        typedef struct {
          double temp;
        } engine_t;

        typedef struct {
          engine_t* engine;
        } car_t;

        // SAFE: Delegates through public value interface; NO pointer leaked
        double car_get_temperature(const car_t* car) {
          if (!car || !car->engine) return -1.0;
          return car->engine->temp;
        }

        // SAFE: Delegates behavior through public interface
        void car_set_temperature(car_t* car, double temp) {
          if (!car || !car->engine) return;
          car->engine->temp = temp;
        }
    checks:
      - kind: choose-better
        q: "Which API design correctly preserves encapsulation and prevents pointer leakage in composition?"
        choices:
          - |
            // Expose behavior via value delegation
            double car_get_engine_temp(const car_t* car) {
              return engine_get_temp(car->engine);
            }
          - |
            // Leak internal child pointer to caller
            engine_t* car_get_engine(car_t* car) {
              return car->engine;
            }
        answer: 0
        why: |
          Option A exposes the required information (temperature value) without giving the caller access to
          the private engine_t pointer. Option B leaks the internal pointer, allowing external code to
          manipulate or free the engine directly, breaking encapsulation and composition.
        concept: "prevent-pointer-leakage"

      - kind: eipe
        q: "In one sentence, why should a container object interact with its contained child solely via the child's public functions?"
        choices:
          - "It minimizes CPU branch prediction penalties in the instruction cache"
          - "It decouples the container from the child's internal struct representation, enabling independent refactoring"
          - "It forces the C compiler to inline all child function calls automatically"
          - "It avoids passing pointers through register arguments"
        answer: 1
        why: |
          Using the child's public API ensures information hiding: if the child's internal struct fields change,
          the container remains completely unaffected as long as the public interface contract is maintained.
          Options A, C, and D cite irrelevant low-level hardware myths.
        concept: "information-hiding-decoupling"

      - kind: why-fails
        q: "Why is returning a const pointer (e.g. const engine_t* car_get_engine(car_t* car)) still risky in C?"
        choices:
          - "The const qualifier is not supported on pointer return types in C99"
          - "Callers can cast away constness or pass the pointer to free(), deallocating car's private child"
          - "Returning const pointers causes the C compiler to duplicate the struct on the heap"
        answer: 1
        why: |
          In C, `(engine_t*)ptr` trivially casts away `const`. Furthermore, passing a const pointer to a wrapper
          or casting it before `free()` will happily deallocate the child object behind the container's back.
          Option A is false. Option C is false.
        concept: "const-cast-away-risk"

      - kind: mcq
        q: "What design pattern describes a container method (like car_start) calling a contained object's method (like engine_turn_on)?"
        choices:
          - "Multiple inheritance"
          - "Dynamic dispatch via vtable"
          - "Polymorphic downcasting"
          - "Forwarding / Delegation"
        answer: 3
        why: |
          Delegation (or forwarding) is the design pattern where an outer container object handles a request
          by delegating it to an internal component that possesses the specific behavior.
          Options A, B, and C refer to inheritance and polymorphism patterns.
        concept: "delegation-pattern"

      - kind: predict
        q: "Trace the temperature value returned by car_get_temperature after car_set_temperature runs:"
        code: |
