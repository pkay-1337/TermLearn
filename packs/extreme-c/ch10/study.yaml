  - id: b7
    type: model
    title: "Model Non-Owning Relationships with Independent Lifetimes in Aggregation"
    explain_md: |
      Aggregation represents a weaker "to-have" relationship than composition:
      1. **Independent Lifetimes**: The container and contained objects have completely independent
         lifetimes. A `Gun` can be manufactured before a `Player` exists, picked up by the player, dropped,
         and continue to exist long after the player is destroyed.
      2. **Non-Owning Reference**: The container holds a reference (pointer) to the contained object,
         but does **NOT** own it. The container is not responsible for allocating or freeing the target.
      3. **Temporary Association**: In an aggregation relationship, the association between two specific
         instances is often dynamic and temporary (e.g. a player picking up and dropping a weapon).
      4. **Deallocation Rule**: The container's destructor (`player_dtor`) MUST NEVER free the aggregated
         pointer (`gun`). Freeing it would cause a premature free / double-free bug.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>

        typedef struct {
          int bullets;
        } gun_t;

        gun_t* gun_new(void) {
          return (gun_t*)malloc(sizeof(gun_t));
        }

        void gun_ctor(gun_t* gun, int bullets) {
          gun->bullets = (bullets > 0) ? bullets : 0;
        }

        void gun_dtor(gun_t* gun) {
          (void)gun;
        }

        typedef struct {
          gun_t* gun; // Non-owning reference
        } player_t;

        player_t* player_new(void) {
          return (player_t*)malloc(sizeof(player_t));
        }

        void player_ctor(player_t* player) {
          player->gun = NULL; // Optional aggregation: starts empty
        }

        void player_dtor(player_t* player) {
          // CRITICAL: Do NOT free player->gun! Player does not own gun.
          (void)player;
        }
    viz:
      kind: ascii-memory
      steps:
        - "STEP 1: gun_new() -> Gun allocated at 0x7000 [bullets = 3]"
        - "STEP 2: player_new() -> Player allocated at 0x3000 [gun = NULL]"
        - "STEP 3: player_pickup_gun() -> Player at 0x3000 [gun = 0x7000] (Association active)"
        - "STEP 4: player_drop_gun() -> Player at 0x3000 [gun = NULL] (Association ended)"
        - "STEP 5: player_dtor + free(player) -> Player at 0x3000 deallocated"
        - "STEP 6: Gun at 0x7000 remains alive, valid, and fully operational!"
    checks:
      - kind: trace
        q: "Trace gun state across player destruction in Step 5. What is the state of Gun at 0x7000 after Player is freed?"
        code: |
          player_dtor(player);
          free(player);
          // gun is inspected here:
        trace:
          headers: ["Step", "Action", "Player Address (0x3000)", "Gun Address (0x7000)"]
          rows:
            - step: 1
              line: 1
              cells: ["1", "player_dtor(player)", "Torn down", "Valid, untouched (3 bullets)"]
            - step: 2
              line: 2
              cells: ["2", "free(player)", "Freed / Returned to heap", "???"]
        target: {row: 1, col: 3}
        choices:
          - "Deallocated by the operating system"
          - "Corrupted by dangling player pointer"
          - "Valid, allocated heap object ready for reuse"
          - "Zeroed out and reset to 0 bullets"
        answer: 2
        why: |
          Because player_dtor does not free gun (aggregation semantics), the gun at 0x7000 remains fully
          valid on the heap. Another player can pick it up, or main() can free it later.
          Options A, B, and D reflect composition assumptions rather than aggregation.
        concept: "aggregation-independent-lifetime-trace"

      - kind: mcq
        q: "What serious memory defect occurs if player_dtor executes 'free(player->gun)' in an aggregation relationship?"
        choices:
          - "Premature free / double free: external owner still expects gun to exist and will attempt to use or free it"
          - "Stack overflow caused by recursive destructor calls"
          - "Immediate compiler warning: illegal pointer deallocation in non-void function"
        answer: 0
        why: |
          In aggregation, the container does NOT own the contained object; an external caller (like main)
          controls gun's lifetime. If player_dtor frees gun, any subsequent access or free by the real owner
          results in a use-after-free or double-free crash.
          Option B is irrelevant. Option C is false syntax.
        concept: "aggregation-double-free-risk"

      - kind: predict
        q: "Trace gun->bullets after player1 drops the gun and player2 picks it up and fires once:"
        code: |
          gun_t* g = gun_new(); gun_ctor(g, 5);
          player_t* p1 = player_new(); player_ctor(p1);
          player_t* p2 = player_new(); player_ctor(p2);
          player_pickup_gun(p1, g);
          player_drop_gun(p1);
          player_pickup_gun(p2, g);
          gun_trigger(p2->gun);
        choices:
          - "5"
          - "0"
          - "Garbage"
          - "4"
        answer: 3
        why: |
          Gun was constructed with 5 bullets. When p1 dropped it, g was unaffected. When p2 picked up g and
          triggered it once, bullets decremented from 5 to 4.
          Option A misses the trigger. Option B assumes drop zeroes bullets. Option C assumes memory was freed.
        concept: "aggregation-shared-lifecycle-predict"

      - kind: why-fails
        q: "Why is aggregation considered a 'weaker' relationship than composition?"
        choices:
          - "Aggregation pointers cannot be stored in struct attributes"
          - "Contained objects in aggregation do not depend on the container for existence or lifetime"
          - "Aggregation requires volatile memory qualifiers on all pointer members"
        answer: 1
        why: |
          Aggregation is weaker because the association is non-exclusive and non-binding: the contained object
          exists independently of the container. Composition binds the child's lifetime strictly to the parent.
          Options A and C are incorrect C mechanics.
        concept: "aggregation-vs-composition-strength"

      - kind: eipe
        q: "In one sentence, what distinguishes the lifetime management in aggregation from that in composition?"
        choices:
          - "In aggregation, memory is allocated on the stack; in composition, memory is allocated on the heap"
          - "In aggregation, the compiler automatically inserts free calls at scope exit"
          - "In aggregation, the container does not own the target object and never manages its deallocation"
          - "In aggregation, both objects must be instantiated simultaneously inside the same translation unit"
        answer: 2
        why: |
          The defining distinction of aggregation is the absence of ownership: the container holds a reference
          to an independently managed object and leaves creation and destruction to an outside coordinator.
          Options A, B, and D describe false technical constraints.
        concept: "aggregation-lifetime-distinction"

      - kind: choose-better
        q: "Which destructor correctly implements aggregation semantics for player_t?"
        choices:
          - |
            // Free owned string, but DO NOT free aggregated gun
            void player_dtor(player_t* player) {
              if (!player) return;
              free(player->name);
              // gun is NOT freed
            }
          - |
            // Free owned string AND free aggregated gun
            void player_dtor(player_t* player) {
              if (!player) return;
              free(player->name);
              free(player->gun); // Aggregation error!
            }
        answer: 0
        why: |
          Option A correctly frees player->name (which player owns via composition/private allocation) but
          does NOT free player->gun (which player aggregates). Option B erroneously frees the aggregated gun,
          violating aggregation ownership rules.
        concept: "aggregation-dtor-design"

  - id: b8
    type: syntax
    title: "Initialize Optional Aggregations via Explicit Pointer Nullification"
    explain_md: |
      Aggregation relationships fall into two distinct structural categories:
      1. **Mandatory Aggregation**: The container cannot function without the associated object. The
         reference must be provided at construction time as an argument:
         `context_ctor_mandatory(ctx, target)`.
      2. **Optional Aggregation**: The container may exist without possessing the associated object (e.g.
         a player who spawns without a weapon).

      In optional aggregation, the constructor **MUST explicitly set the pointer to `NULL`**:
      ```c
      player->gun = NULL;
      ```
      In C, newly allocated heap memory from `malloc()` contains uninitialized garbage bytes. If the
      aggregation pointer is not explicitly nullified, it will hold a non-NULL garbage address (a wild
      pointer). Subsequent checks like `if (player->gun)` will evaluate to true, attempting to dereference
      garbage and crashing the program.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>

        struct target_t;

        typedef struct {
          struct target_t* optional_target;
          struct target_t* mandatory_target;
        } context_t;

        // Mandatory aggregation requires target at construction
        void context_ctor_mandatory(context_t* ctx, struct target_t* target) {
          ctx->mandatory_target = target;
          ctx->optional_target = NULL; // Optional MUST be nullified!
        }

        void context_set_optional(context_t* ctx, struct target_t* target) {
          ctx->optional_target = target;
        }
    checks:
      - kind: fillblank
        q: "Complete the optional aggregation constructor line by initializing the weapon pointer to a safe empty state:"
        code: |
          void player_ctor(player_t* player) {
            player->gun = _____;
          }
        answer_text: "NULL"
        why: |
          Explicitly setting player->gun to NULL in the constructor ensures that optional aggregation checks
          (e.g. `if (player->gun)`) correctly identify that no weapon is currently equipped.
        concept: "null-pointer-initialization"

      - kind: predict
        q: "Trace the behavior of player_shoot if player_ctor omits setting player->gun = NULL on a malloc'd instance:"
        code: |
          player_t* p = (player_t*)malloc(sizeof(player_t));
          // player->gun contains uninitialized garbage bits e.g. 0x00007fff5fbff820!
          if (p->gun) {
            gun_trigger(p->gun); // What happens?
          }
        choices:
          - "p->gun evaluates to false because malloc zeroes memory"
          - "p->gun evaluates to true (garbage != 0); dereferencing garbage triggers a segmentation fault"
          - "The C runtime displays an uninitialized pointer dialog"
          - "gun_trigger safely catches the garbage pointer and returns -1"
        answer: 1
        why: |
          malloc does NOT zero memory; it returns arbitrary garbage. Any non-zero garbage bits make
          `if (p->gun)` evaluate to true. Dereferencing that wild address inside gun_trigger crashes immediately.
          Option A confuses malloc with calloc. Option C invents non-existent runtime behavior.
        concept: "wild-pointer-dereference-predict"

      - kind: why-fails
        q: "Why is mandatory aggregation typically passed as an argument to the constructor function?"
        choices:
          - "C functions cannot accept more than two arguments without stack spilling"
          - "Pointers cannot be assigned outside of constructor bodies"
          - "The container cannot satisfy its class invariants or perform its duties without the dependency"
        answer: 2
        why: |
          Mandatory aggregation means the object cannot exist in a valid state without the dependency. Passing
          it into the constructor guarantees the invariant from the moment of construction.
          Options A and B are fabricated syntax rules.
        concept: "mandatory-aggregation-invariants"

      - kind: mcq
        q: "Which function allocates memory AND automatically zeroes out all bytes, providing implicit NULL initialization?"
        choices:
          - "calloc"
          - "malloc"
          - "realloc"
          - "alloca"
        answer: 0
        why: |
          calloc(num, size) allocates memory and initializes all allocated bytes to zero. On modern systems,
          all-bits-zero corresponds to a NULL pointer. By contrast, malloc leaves memory uninitialized.
          Options B, C, and D do not zero memory.
        concept: "calloc-zero-init"

      - kind: order
        q: "Order the lines to correctly construct an object with both an owned name and an optional aggregated gun:"
        lines:
          - "player->gun = NULL;"
          - "player->name = (char*)malloc(32);"
          - "if (!player) return;"
        answer_order: [2, 1, 0]
        distractor_why: {}
        why: |
          Safe initialization: (1) check container pointer, (2) allocate and initialize owned resources,
          (3) nullify optional aggregation pointer.
        concept: "optional-aggregation-ctor-order"

      - kind: spot-bug
        q: "Identify the critical defect in this optional aggregation constructor:"
        code: |
          void player_ctor_bad(player_t* p, const char* name) {
            p->name = strdup(name);
            // player->gun left uninitialized!
          }
        diagnostic_log: |
