              line: 2
              cells: ["1", "2", "NULL check", "Valid 0x1000", "Valid 0x2000"]
            - step: 2
              line: 3
              cells: ["2", "3", "free(car->engine)", "Valid 0x1000", "???"]
            - step: 3
              line: 4
              cells: ["3", "4", "free(car)", "Dangling / Freed", "Dangling / Freed"]
        target: {row: 1, col: 4}
