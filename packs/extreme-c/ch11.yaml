  - id: b7
    type: design
    title: "Approach 2: The Forwarding Wrapper Trade-Off"
    explain_md: |
      While Approach 2 delivers pristine information hiding and supports
      multiple inheritance, it introduces a significant development cost:
      **Boilerplate Forwarding Functions**.
      
      Because `student_t*` cannot be upcast to `person_t*`, client code cannot
      call `person_get_first_name((person_t*)student, buf)`.
      
      Therefore, `student.h` **must redeclare**, and `student.c` **must reimplement**,
      wrapper functions for every single inherited behavior:
      
      ```c
      /* In student.h */
      void student_get_first_name(struct student_t*, char*);
      void student_get_last_name(struct student_t*, char*);
      unsigned int student_get_birth_year(struct student_t*);
      
      /* In student.c — pure delegation forwarding */
      void student_get_first_name(student_t* s, char* buffer) {
          person_get_first_name(s->person, buffer); /* Forward to parent! */
      }
      ```
      
      **Destructor Responsibility**:
      The derived destructor must also explicitly destroy AND free the
      composed parent pointer:
      ```c
      void student_dtor(student_t* s) {
          free(s->student_number);
          person_dtor(s->person); /* 1. Destroy parent resources */
          free(s->person);        /* 2. Free parent memory allocation! */
      }
      ```
    example:
      lang: c
      code: |
        #include <stdlib.h>
        #include <string.h>
        
        /* Mock parent API */
        struct person_t;
        void person_dtor(struct person_t* p);
        void person_get_first_name(struct person_t* p, char* dest);
        
        typedef struct {
            char* student_number;
            struct person_t* person; /* Opaque parent */
        } student_t;
        
        /* Forwarding wrapper function */
        void student_get_first_name(student_t* s, char* dest) {
            if (s && s->person) {
                person_get_first_name(s->person, dest);
            }
        }
        
        /* Symmetrical destruction in Approach 2 */
        void student_dtor(student_t* s) {
            if (!s) return;
            free(s->student_number);
            if (s->person) {
                person_dtor(s->person); /* Destroy parent state */
                free(s->person);        /* Free parent heap block! */
            }
        }
      explain_md: |
        Notice that `student_dtor` must call both `person_dtor(s->person)`
        and `free(s->person)`. If it forgets `free(s->person)`, a persistent
        heap memory leak occurs every time a student is destroyed!
      subgoals:
        - label: "Implement forwarding wrapper with null guard"
          lines: [15, 16, 17, 18, 19]
        - label: "Destruct and free parent heap object"
          lines: [22, 23, 24, 25, 26, 27, 28, 29]
    checks:
      - kind: spot-bug
        q: "Identify the critical resource bug in this Approach 2 destructor:"
        code: |
          void student_dtor(student_t* s) {
              free(s->student_number);
              person_dtor(s->person);
              /* function ends */
          }
        diagnostic_log: |
          ==51004==ERROR: LeakSanitizer: detected memory leaks
          Direct leak of 32 byte(s) in 1 object(s) allocated from:
              #0 0x7f malloc
              #1 0x401250 in person_new person.c:15
              #2 0x401310 in student_ctor student.c:22
        target_line: 3
        choices:
          - "Memory leak: person_dtor cleans up person internals, but free(s->person) is missing, leaking the parent struct allocation."
          - "Double free error on s->student_number."
          - "person_dtor should be called before freeing student_number."
          - "s->person must be set to NULL before exit."
        answer: 0
        why: "In Approach 2, person was allocated separately via malloc/person_new(). Calling person_dtor releases internal resources, but s->person itself must still be freed via free(s->person)."
        concept: approach2-parent-leak
      - kind: choose-better
        q: "A library has 40 base behavior functions and 15 derived classes. Why might the architect choose Approach 1 over Approach 2?"
        choices:
          - "Approach 1 requires 0 forwarding wrappers, avoiding 600 boilerplate delegation functions (40 x 15) and double-dereference runtime overhead."
          - "Approach 1 is immune to buffer overflows."
          - "Approach 2 cannot run on Linux operating systems."
          - "Approach 1 eliminates the need for constructors."
        answer: 0
        why: "Writing and maintaining 600 boilerplate forwarding functions introduces massive developer toil and runtime indirection overhead. Approach 1 allows direct reuse via upcasting."
        concept: forwarding-overhead-tradeoff
      - kind: mcq
        q: "Why must `student_get_first_name` in Approach 2 perform defensive NULL checks before forwarding?"
        choices:
          - "Because s->person is an optional or dynamic pointer that could be NULL if allocation failed or was not initialized."
          - "Because C99 compilers automatically set all pointers to NULL on function exit."
          - "To prevent the operating system from swapping the page to disk."
          - "Because printf crashes if the function returns void."
        answer: 0
        why: "In Approach 2, person is a pointer variable. If student is NULL or person_new() failed during construction, dereferencing s->person causes an immediate segmentation fault."
        concept: defensive-pointer-guards

  - id: b8
    type: design
    title: "Comparative Architectural Matrix: Approach 1 vs Approach 2"
    explain_md: |
      Choosing between Approach 1 (embedded struct) and Approach 2 (opaque pointer)
      is an essential engineering trade-off in C system design.
      
      | Dimension | Approach 1: Embedded Base Struct | Approach 2: Opaque Base Pointer |
      | :--- | :--- | :--- |
      | **Memory Layout** | Single contiguous allocation | Two or more fragmented heap blocks |
      | **Pointer Upcasting** | Yes (offset 0 guarantee) | Impossible (distinct addresses) |
      | **Base Code Reuse** | Direct call to base functions | Requires forwarding wrapper functions |
      | **Encapsulation** | Partial (leaks via `*_p.h`) | Pristine (100% opaque incomplete type) |
      | **Multiple Inheritance** | No (only 1 struct at offset 0)| Yes (multiple parent pointers) |
      | **Cache Locality** | Superior (parent + child contiguous)| Slower (pointer indirection / hopping)|
      | **Compilation Decoupling**| Low (modifying base recompiles child)| High (modifying base needs no child recompile)|
      
      **Architectural Rule of Thumb**:
      - Use **Approach 1** for high-performance systems, game engines, and
        hierarchies where polymorphism and upcasting are paramount.
      - Use **Approach 2** for stable public SDKs, shared libraries (ABI stability),
        and plugins where parent implementation details must never leak.
    checks:
      - kind: choose-better
        q: "You are building a real-time graphics rendering engine processing 500,000 game entities per frame. Which inheritance approach should you choose?"
        choices:
          - "Approach 1: Contiguous memory layout maximizes CPU L1/L2 cache hits and upcasting eliminates function call forwarding overhead."
          - "Approach 2: Because opaque pointers ensure that rendering artists cannot see the base C struct definitions."
          - "Neither: Use deep recursion to resolve entity properties dynamically."
          - "Approach 2: Fragmented heap allocations help the OS scheduler distribute load across CPU cores."
        answer: 0
        why: "In high-performance gaming and graphics, contiguous memory layout (Approach 1) guarantees high cache locality and avoids pointer indirection penalties across hundreds of thousands of entities."
        concept: performance-cache-locality
      - kind: mcq
        from_chapter: ch09
        q: "Interleaved Review (Ch. 09): How does the private header (`person_p.h`) in Approach 1 relate to the encapsulation principles learned in Chapter 09?"
        choices:
          - "It acts as a selective breach of encapsulation ('friend' access), allowing derived classes to see struct members while keeping them hidden from general callers."
          - "It completely replaces public headers, making all structs global."
          - "It disables the preprocessor from optimizing struct field access."
          - "It converts incomplete types into C++ virtual classes automatically."
        answer: 0
        why: "In Ch09, we saw that incomplete types hide all internals. Approach 1 introduces a controlled compromise: a private header acts as a 'protected' interface, sharing layout with derived classes but concealing it from clients."
        concept: encapsulation-friend-access
      - kind: mcq
        from_chapter: ch10
        q: "Interleaved Review (Ch. 10): In Chapter 10, we contrasted Composition (co-dependent lifetimes) with Aggregation (independent lifetimes). How does Approach 2 inheritance relate to these lifecycle models?"
        choices:
          - "Structurally, Approach 2 is identical to Composition: the child creates the parent in its constructor and MUST destroy and free it in its destructor."
          - "Approach 2 is Aggregation: the parent object is passed in from outside and outlives the child."
          - "Approach 2 is neither: parent objects in C are managed by an automated garbage collector thread."
          - "Approach 2 violates composition because the parent is located on the stack."
        answer: 0
        why: "Approach 2 is genuine composition under the hood: the child manages the parent's full lifecycle (allocating it on creation, deallocating it on destruction). If the child dies, the parent dies with it."
        concept: composition-lifecycle-equivalence

  - id: b9
    type: syntax
    title: "Polymorphism & The Open-Closed Principle in C"
    explain_md: |
      Inheritance models "is-a" relationships, but its most transformative power
      is enabling **Polymorphism**.
      
      **Polymorphism ('Many Morphs')**:
      The ability to trigger different concrete behaviors through the **exact same**
      public interface function call.
      
      Suppose we have a base class `Animal` with subtypes `Cat` and `Duck`.
      
      **Without Polymorphism (Brittle / Type Switching)**:
      ```c
      /* Caller must know concrete types and call specific functions */
      cat_sound(cat);   /* prints 'Cat: Meow' */
      duck_sound(duck); /* prints 'Duck: Quack' */
      ```
      If we add 20 animal types, caller code becomes riddled with giant
      `switch(type)` statements.
      
      **With Polymorphism (The Open-Closed Principle)**:
      ```c
      /* Same function call, different behavior based on the underlying object! */
      animal_sound((struct animal_t*)cat);  /* prints 'Cat: Meow' */
      animal_sound((struct animal_t*)duck); /* prints 'Duck: Quack' */
      ```
      
      The caller code treats every entity as a generic `animal_t*`. When a new
      animal (`Dog`) is introduced, the caller code requires **zero modifications**
      and zero recompilation!
    example:
      lang: c
      code: |
        #include <stdio.h>
        
        /* A naive non-polymorphic function */
        typedef struct {
            char name[16];
        } animal_t;
        
        void naive_animal_sound(animal_t* a) {
            printf("%s: Beeeep (Generic sound)\n", a->name);
        }
        
        typedef struct {
            animal_t base;
        } dog_t;
        
        int main(void) {
            animal_t generic = {"Generic"};
            dog_t dog = {{"Dog"}};
            
            /* Calling naive function: NOT polymorphic! */
            naive_animal_sound(&generic);
            naive_animal_sound((animal_t*)&dog);
            return 0;
        }
      explain_md: |
        In this naive example, calling `naive_animal_sound((animal_t*)&dog)`
        still prints `Dog: Beeeep`. Simply upcasting a pointer does NOT create
        polymorphism! The function body is statically bound at compile time.
        To achieve true polymorphism, C requires a runtime dispatch mechanism.
      subgoals:
        - label: "Define static non-polymorphic function"
          lines: [8, 9, 10]
        - label: "Demonstrate identical behavior across subtypes"
          lines: [21, 22]
    checks:
      - kind: why-fails
        q: "Why does `naive_animal_sound((animal_t*)&dog)` in Example 8-19 fail to exhibit polymorphic behavior?"
        choices:
          - "Because C uses static binding by default: the compiler hard-codes the jump target directly to naive_animal_sound's instructions at compile time."
          - "Because dog was allocated on the stack rather than the heap."
          - "Because dog_t did not use the virtual keyword."
          - "Because the printf function does not support object-oriented formatting."
        answer: 0
        why: "In C, normal function calls are statically resolved by the linker to a single fixed code address. Without an indirect dispatch mechanism (function pointers), passing different struct types cannot alter the executed code."
        concept: static-binding-limitation
      - kind: mcq
        q: "What is the primary architectural benefit of polymorphism as expressed by the Open-Closed Principle?"
        choices:
          - "Software entities should be open for extension (adding new subtypes) but closed for modification (existing calling code remains unchanged)."
          - "All functions in a program must be marked private to prevent modifications."
          - "Code should be compiled into binary files that can never be reopened."
          - "Polymorphism ensures that all structs occupy the exact same number of bytes in memory."
        answer: 0
        why: "The Open-Closed Principle states that you should be able to introduce new classes (like Duck, Cat, Dog) without touching or recompiling the existing business logic that processes Animal pointers."
        concept: open-closed-principle
      - kind: predict
        q: "What is the terminal output of the naive example program above?"
        choices:
          - "Generic: Beeeep (Generic sound)\nDog: Beeeep (Generic sound)"
          - "Generic: Beeeep (Generic sound)\nDog: Woof"
          - "Dog: Beeeep (Generic sound)\nDog: Beeeep (Generic sound)"
          - "Segmentation fault"
        answer: 0
        why: "Because naive_animal_sound contains static code printing '%s: Beeeep', both calls execute the exact same printf, inserting the respective struct name."
        concept: static-dispatch-predict

  - id: b10
    type: design
    title: "The Dynamic Dispatch Engine: Function Pointers in Base Structs"
    explain_md: |
      How do we make `animal_sound(animal_t*)` truly polymorphic in C?
      
      We must combine **Approach 1 Inheritance** (embedded struct at offset 0)
      with **Function Pointers** stored directly inside the base attribute struct!
      
      **Step 1: Declare the Function Pointer Type**:
      In `animal_p.h`:
      ```c
      typedef void (*sound_func_t)(void*); /* void* represents 'this' pointer */
      
      typedef struct {
          char* name;
          sound_func_t sound_func; /* Dedicated pointer for polymorphic behavior! */
      } animal_t;
      ```
      
      **Step 2: Bind the Default Behavior in Base Constructor**:
      In `animal.c`:
      ```c
      void __animal_sound(void* this_ptr) {
          animal_t* animal = (animal_t*)this_ptr;
          printf("%s: Beeeep\n", animal->name);
      }
      
      void animal_ctor(animal_t* animal) {
          animal->name = strdup("Animal");
          animal->sound_func = __animal_sound; /* Default binding! */
      }
      ```
      
      **Step 3: The Relay Behavior Function**:
      The public function `animal_sound` does not execute sound logic itself;
      it acts as an indirect **relay**:
      ```c
      void animal_sound(animal_t* animal) {
          animal->sound_func(animal); /* Dynamic dispatch through function pointer! */
      }
      ```
      
      Now, if a derived class alters `sound_func`, calling `animal_sound` will
      indirectly jump to the derived class's function!
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>
        
        /* Function pointer type taking generic this pointer */
        typedef void (*sound_func_t)(void*);
        
        typedef struct {
            char name[16];
            sound_func_t sound_func; /* Virtual method pointer */
        } animal_t;
        
        /* Private default implementation */
        void __animal_sound(void* this_ptr) {
            animal_t* self = (animal_t*)this_ptr;
            printf("%s: Beeeep (Default)\n", self->name);
        }
        
        void animal_ctor(animal_t* a, const char* name) {
            strncpy(a->name, name, 15);
            a->sound_func = __animal_sound; /* Bind default */
        }
        
        /* Public relay function */
        void animal_sound(animal_t* a) {
            a->sound_func(a); /* Dynamic dispatch! */
        }
        
        int main(void) {
            animal_t a;
            animal_ctor(&a, "Generic");
            animal_sound(&a);
            return 0;
        }
      explain_md: |
        Calling `animal_sound(&a)` triggers `a->sound_func(a)`. Because
        `animal_ctor` bound `sound_func` to `__animal_sound`, the default
        sound is emitted. The public API user simply calls `animal_sound(&a)`
        without knowing how dispatch occurs.
      subgoals:
        - label: "Declare virtual function pointer member"
          lines: [8, 9, 10, 11]
        - label: "Bind default implementation in constructor"
          lines: [19, 20, 21, 22]
        - label: "Relay call through function pointer"
          lines: [25, 26, 27]
    checks:
      - kind: why-fails
        q: "Why is the function pointer defined as `void (*sound_func_t)(void*)` taking `void*` rather than `animal_t*`?"
        choices:
          - "To accept derived class pointers (cat_t*, duck_t*) as the 'this' argument without compiler type-mismatch warnings."
          - "Because C99 prohibits passing struct pointers to function pointers."
          - "Because void* runs twice as fast as struct pointers."
          - "To prevent the linker from checking symbol names."
        answer: 0
        why: "A derived method like __cat_sound expects to receive a cat_t* (or cast it from void*). Using void* allows any derived instance to be passed as the 'this' receiver cleanly."
        concept: generic-this-pointer
      - kind: trace
        q: "Trace the function pointer execution when animal_sound(&a) is invoked:"
        code: |
          animal_t a;
          animal_ctor(&a, "Generic");
          animal_sound(&a);
        trace:
          headers: ["Call Step", "Expression", "Resolved Function Address"]
          rows:
            - ["1", "a.sound_func", "__animal_sound"]
            - ["2", "animal_sound(&a)", "__animal_sound(&a)"]
        target: {row: 0, col: 2}
        answer_text: "__animal_sound"
        why: "animal_ctor initialized a.sound_func to the address of __animal_sound. animal_sound reads this field and executes __animal_sound."
        concept: dispatch-resolution-trace
      - kind: mcq
        q: "What role does the public function `animal_sound(animal_t*)` play in this architecture?"
        choices:
          - "A relay function: it accepts public calls and dispatches them through the private sound_func function pointer."
          - "A memory allocator that creates a new thread for sound playback."
          - "A static validator that checks whether the animal is alive."
          - "A compiler macro that generates C++ assembly code."
        answer: 0
        why: "animal_sound acts as a stable public relay. Callers invoke it consistently, while the function delegates execution dynamically to whatever target sound_func currently points to."
        concept: relay-function-dispatch

  - id: b11
    type: algorithm
    title: "Method Overriding & Polymorphic Runtime Invocation"
    explain_md: |
      With the dynamic dispatch engine in place, subclasses can now **override**
      inherited behaviors!
      
      **How Subclass Overriding Works**:
      1. Define a private static function in `cat.c`:
         ```c
         void __cat_sound(void* this_ptr) {
             animal_t* self = (animal_t*)this_ptr;
             printf("%s: Meow\n", self->name);
         }
         ```
      2. In `cat_ctor`, call the parent constructor first.
      3. **The Magic Step**: Overwrite the inherited function pointer!
         ```c
         void cat_ctor(cat_t* cat) {
             animal_ctor((struct animal_t*)cat); /* 1. Base constructor */
             strcpy(cat->animal.name, "Cat");
             cat->animal.sound_func = __cat_sound; /* 2. OVERRIDE! */
         }
         ```
      
      **The Trap to Avoid (Order of Operations)**:
      If `cat_ctor` overrides `sound_func` *before* calling `animal_ctor`,
      `animal_ctor` will overwrite it back to `__animal_sound`!
      Overriding **MUST** occur *after* the base constructor finishes.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>
        
        typedef void (*sound_func_t)(void*);
        
        typedef struct {
            char name[16];
            sound_func_t sound_func;
        } animal_t;
        
        void __animal_sound(void* p) {
            printf("%s: Beeeep\n", ((animal_t*)p)->name);
        }
        
        void animal_ctor(animal_t* a, const char* name) {
            strncpy(a->name, name, 15);
            a->sound_func = __animal_sound;
        }
        
        void animal_sound(animal_t* a) {
            a->sound_func(a);
        }
        
        /* Derived Cat */
        typedef struct {
            animal_t base;
        } cat_t;
        
        void __cat_sound(void* p) {
            printf("%s: Meow\n", ((animal_t*)p)->name);
        }
        
        void cat_ctor(cat_t* c) {
            animal_ctor((animal_t*)c, "Cat");
            c->base.sound_func = __cat_sound; /* Override! */
        }
        
        int main(void) {
            animal_t a; animal_ctor(&a, "Animal");
            cat_t c;    cat_ctor(&c);
            
            /* Polymorphic invocation through base pointers! */
            animal_t* zoo[2] = { &a, (animal_t*)&c };
            for (int i = 0; i < 2; i++) {
                animal_sound(zoo[i]);
            }
            return 0;
        }
      explain_md: |
        Look at `main`: we store both `&a` and `(animal_t*)&c` in a single
        array of `animal_t*`. When the loop calls `animal_sound(zoo[i])`, the
        first iteration outputs `Animal: Beeeep`, and the second outputs
        `Cat: Meow`. This is genuine runtime polymorphism in pure C!
      subgoals:
        - label: "Define specialized cat sound function"
          lines: [28, 29, 30]
        - label: "Override sound_func in cat constructor"
          lines: [32, 33, 34, 35]
        - label: "Iterate polymorphically through base pointer array"
          lines: [41, 42, 43, 44]
    checks:
      - kind: spot-bug
        q: "What defect in method overriding occurs in the constructor below?"
        code: |
          void duck_ctor(duck_t* duck) {
              duck->base.sound_func = __duck_sound;
              animal_ctor((struct animal_t*)duck, "Duck");
          }
        diagnostic_log: |
          Output Test:
          Expected: "Duck: Quack"
          Actual:   "Duck: Beeeep"
        target_line: 2
        choices:
          - "Overriding is clobbered: animal_ctor runs second and resets sound_func back to __animal_sound, canceling the override."
          - "duck_ctor causes a segmentation fault on entry."
          - "sound_func cannot be assigned outside of animal.c."
          - "animal_ctor frees the duck memory buffer."
        answer: 0
        why: "animal_ctor initializes sound_func to the default __animal_sound. If duck_ctor overrides the function pointer before calling animal_ctor, animal_ctor overwrites the override, reverting to default behavior."
        concept: override-clobber-bug
      - kind: predict
        q: "What is printed by the `for` loop in `main` across the `zoo` array?"
        choices:
          - "Animal: Beeeep\nCat: Meow"
          - "Animal: Beeeep\nAnimal: Beeeep"
          - "Cat: Meow\nCat: Meow"
          - "Compilation failure"
        answer: 0
        why: "zoo[0] points to the base animal object whose sound_func is __animal_sound. zoo[1] points to the cat object whose sound_func was overridden to __cat_sound."
        concept: polymorphic-array-iteration
      - kind: trace
        q: "Trace the dynamic dispatch call chain when animal_sound(zoo[1]) is invoked:"
        code: |
          animal_t* a = zoo[1]; /* points to cat */
          animal_sound(a);
        trace:
          headers: ["Step", "Instruction", "Target Address"]
          rows:
            - ["1", "a->sound_func read", "__cat_sound"]
            - ["2", "indirect call", "__cat_sound(a)"]
        target: {row: 0, col: 2}
        answer_text: "__cat_sound"
        why: "Because cat_ctor overwrote sound_func with __cat_sound, dynamic dispatch reads __cat_sound and jumps to it."
        concept: dynamic-dispatch-call-chain

  - id: b12
    type: model
    title: "The Notional Machine: From C Function Pointers to C++ Vtables"
    explain_md: |
      In our C implementation of polymorphism, every single object instance
      stores a separate function pointer for every polymorphic behavior.
      
      **The Scalability Flaw**:
      If `Animal` has 10 virtual methods and we create 10,000 animal instances:
      `10 methods * 8 bytes * 10,000 instances = 800 KB of pointer duplication!`
      
      **How C++ Solves This (The Vtable Pattern)**:
      The C++ compiler optimizes this exact C pattern:
      1. For each class with virtual functions, the compiler generates a single,
         read-only table of function pointers called the **Virtual Method Table**
         (`vtable`).
      2. Each object instance contains only **one single pointer** (the `vptr`,
         usually at offset 0), pointing to its class's `vtable`.
      3. With 10 virtual methods and 10,000 instances:
         - Instance cost: `10,000 * 8 bytes (vptr) = 80 KB`
         - Table cost: `10 * 8 bytes = 80 bytes`
         - Memory savings: **90% reduction!**
      
      **Why the `virtual` Keyword Exists in C++**:
      Because virtual dispatch adds an extra pointer indirection (`vptr -> vtable -> function`)
      and increases object size by 8 bytes, C++ makes virtual dispatch opt-in
      via the `virtual` keyword rather than making every function polymorphic by default.
    viz:
      kind: ascii-memory
      steps:
        - |
          Memory Comparison: C Manual Dispatch vs C++ Virtual Table (vtable):
          
          C Approach (Function Pointer in Every Object Instance):
          +-----------------------------+
          | cat_t object 1 (Heap)       |
          | - name: "Cat" (16 B)        |
          | - sound_func: 0x4010 [8 B]  |---> __cat_sound
          +-----------------------------+
          | cat_t object 2 (Heap)       |
          | - name: "Cat" (16 B)        |
          | - sound_func: 0x4010 [8 B]  |---> __cat_sound (Duplicate pointer!)
          +-----------------------------+
          
          C++ Approach (Single Shared Vtable per Class, vptr in Object):
          +-----------------------------+
          | Cat Object 1 (Heap)         |
          | - name: "Cat" (16 B)        |
          | - vptr: 0x7000 [8 B] -------+
          +-----------------------------+  | Both point to ONE shared table!
          | Cat Object 2 (Heap)         |  |
          | - name: "Cat" (16 B)        |  |
          | - vptr: 0x7000 [8 B] -------+  |
          +-----------------------------+  v
                                        +----------------------------------+
                                        | Cat Class Vtable (Static / RO)   |
                                        | [0] sound() -> __cat_sound       |
                                        | [1] move()  -> __cat_move        |
                                        +----------------------------------+
    checks:
      - kind: predict
        q: "If a base class defines 5 virtual functions, what is the size increase per object instance in C++ (with a 64-bit vptr) vs our manual C struct storing 5 function pointers?"
        choices:
          - "C++ adds 8 bytes per instance (1 vptr); C adds 40 bytes per instance (5 function pointers x 8 bytes)."
          - "Both add 40 bytes per instance."
          - "C++ adds 0 bytes because vtables are eliminated by compiler optimization."
          - "C adds 8 bytes and C++ adds 40 bytes."
        answer: 0
        why: "In C++, all 5 virtual functions are grouped into a single static class vtable; each object carries only one 8-byte pointer (vptr). In C, storing 5 individual function pointers directly in the struct consumes 5 * 8 = 40 bytes per object."
        concept: vptr-vs-function-pointers
      - kind: mcq
        q: "Where is the `vtable` typically stored in a compiled binary?"
        choices:
          - "In the read-only data segment (.rodata), shared across all instances of that class."
          - "On the active thread stack frame."
          - "In heap memory allocated by malloc during program startup."
          - "In CPU register RAX."
        answer: 0
        why: "The virtual table is constructed by the compiler at compile time and placed in the static read-only data segment (.rodata). It never changes during program execution."
        concept: vtable-binary-segment
      - kind: choose-better
        q: "When should an architect choose non-virtual functions over virtual polymorphic functions?"
        choices:
          - "When the function behavior is invariant across all subclasses, eliminating vtable indirection overhead and allowing compiler inlining."
          - "Only when the program has fewer than 10 lines of code."
          - "When the function returns a float instead of an int."
          - "Never: all functions in modern software must be virtual."
        answer: 0
        why: "Non-virtual functions can be inlined directly by the compiler and execute with zero indirection overhead. Virtual dispatch should only be used when runtime behavioral divergence is genuinely required."
        concept: non-virtual-optimization

cards:
  - id: ch11-c01-upcasting-offset0
    q: "Why can a derived struct pointer be safely cast to a base struct pointer in Approach 1?"
    a: "Because the base struct is placed as the very first member at offset 0. Under ISO C99 §6.7.2.1, a pointer to a struct points directly to its first member with zero padding."
  - id: ch11-c02-incomplete-type-limitation
    q: "Why does `typedef struct { struct base_t base; } child_t;` fail to compile if `base_t` is an incomplete type?"
    a: "The compiler must know the concrete byte size and member alignment of `base_t` to allocate stack space and calculate `sizeof(child_t)`. Incomplete types cannot be instantiated as concrete struct members."
  - id: ch11-c03-private-header-role
    q: "What is the purpose of a private header file (`*_p.h`) in C object-oriented programming?"
    a: "It exposes full struct definitions to subclasses and internal implementation files while keeping them hidden from public client code, emulating the 'protected' visibility specifier in C++."
  - id: ch11-c04-destructor-chaining-order
    q: "In what sequence must constructors and destructors execute in an inheritance hierarchy?"
    a: "Constructors run parent-first, then child. Destructors run in reverse: child resources must be released first, followed by calling the parent destructor."
  - id: ch11-c05-approach2-tradeoff
    q: "What is the primary advantage and primary disadvantage of Approach 2 (opaque parent pointer)?"
    a: "Advantage: 100% information hiding (modifying base doesn't recompile child) and supports multiple inheritance. Disadvantage: loses upcasting, requiring boilerplate forwarding wrappers for every base behavior."
  - id: ch11-c06-vtable-optimization
    q: "How does the C++ vtable pattern optimize the manual function pointer approach used in C?"
    a: "Instead of storing N function pointers in every object instance, C++ stores a single pointer (`vptr`) per object pointing to a shared static table (`vtable`), reducing per-instance memory consumption."

lab:
  title: "Polymorphic Shape Hierarchy in C"
  prompt_md: |
    ### Objective
    Implement a classic polymorphic `shape_t` hierarchy in C using Approach 1
    (embedded base struct at offset 0) and dynamic function pointer dispatch.
    
    ### Requirements
    1. Complete `shape_ctor` in `starter.c`:
       - Store the shape name in `shape->name` (use `strncpy`).
       - Bind `shape->area_func` to the default implementation `__shape_default_area`.
    2. Complete the polymorphic relay function `shape_area`:
       - Call and return the result of `shape->area_func(shape)`.
    3. Complete `circle_ctor`:
       - Call `shape_ctor((shape_t*)circle, "Circle")`.
       - Set `circle->radius = radius`.
       - **Override** the virtual function: `circle->base.area_func = __circle_area;`.
    4. Complete `rectangle_ctor`:
       - Call `shape_ctor((shape_t*)rect, "Rectangle")`.
       - Set `rect->width = width` and `rect->height = height`.
       - **Override** the virtual function: `rect->base.area_func = __rectangle_area;`.
    5. Ensure all area calculation functions match the mathematical formulas:
       - Circle area: $\pi \times r^2$ (use `3.141592653589793 * r * r`).
       - Rectangle area: $w \times h$.
  starter_c: |
    #include <stdio.h>
    #include <stdlib.h>
    #include <string.h>
    
    typedef double (*area_func_t)(void*);
    
    typedef struct {
        char name[32];
        area_func_t area_func;
    } shape_t;
    
    double __shape_default_area(void* self) {
        (void)self;
        return 0.0;
    }
    
    void shape_ctor(shape_t* shape, const char* name) {
        /* TODO 1: Copy name and bind default area_func */
    }
    
    double shape_area(shape_t* shape) {
        /* TODO 2: Relay through function pointer */
        return 0.0;
    }
    
    typedef struct {
        shape_t base; /* Offset 0 */
        double radius;
    } circle_t;
    
    double __circle_area(void* self) {
        circle_t* c = (circle_t*)self;
        return 3.141592653589793 * c->radius * c->radius;
    }
    
    void circle_ctor(circle_t* circle, double radius) {
        /* TODO 3: Construct base, assign radius, override area_func */
    }
    
    typedef struct {
        shape_t base; /* Offset 0 */
        double width;
        double height;
    } rectangle_t;
    
    double __rectangle_area(void* self) {
        rectangle_t* r = (rectangle_t*)self;
        return r->width * r->height;
    }
    
    void rectangle_ctor(rectangle_t* rect, double width, double height) {
        /* TODO 4: Construct base, assign dimensions, override area_func */
    }
    
    int main(void) {
        circle_t c;
        circle_ctor(&c, 2.0);
        rectangle_t r;
        rectangle_ctor(&r, 4.0, 5.0);
        
        shape_t* shapes[2] = { (shape_t*)&c, (shape_t*)&r };
        printf("%s area: %.2f\n", shapes[0]->name, shape_area(shapes[0]));
        printf("%s area: %.2f\n", shapes[1]->name, shape_area(shapes[1]));
        return 0;
    }
  tests_sh: |
    cat << 'EOF' > test_runner.c
    #include <stdio.h>
    #include <assert.h>
    #include <math.h>
    
    int main(void) {
        circle_t c;
        circle_ctor(&c, 3.0);
        rectangle_t r;
        rectangle_ctor(&r, 5.0, 6.0);
        
        shape_t* s_circle = (shape_t*)&c;
        shape_t* s_rect = (shape_t*)&r;
        
        /* Verify upcast address equivalence */
        assert((void*)s_circle == (void*)&c);
        assert((void*)s_rect == (void*)&r);
        
        /* Verify polymorphic area calculation */
        double c_area = shape_area(s_circle);
        assert(fabs(c_area - (3.141592653589793 * 9.0)) < 1e-6);
        
        double r_area = shape_area(s_rect);
        assert(fabs(r_area - 30.0) < 1e-6);
        
        printf("All shape polymorphism tests passed successfully!\n");
        return 0;
    }
    EOF
    gcc -Wall -Wextra -std=c99 -O0 -c starter.c -o starter.o || exit 1
    # Check that starter compiles and runs
    gcc -Wall -Wextra -std=c99 -O0 starter.c -o starter_bin || exit 1
    ./starter_bin > /dev/null || exit 1
    # Extract test runner
    sed -i '/int main(void)/,$d' starter.c
    cat test_runner.c >> starter.c
    gcc -Wall -Wextra -std=c99 -O0 starter.c -o test_bin || exit 1
    ./test_bin || exit 1
  hints:
    - "In shape_ctor, remember to assign shape->area_func = __shape_default_area."
    - "In circle_ctor, chain the base constructor via shape_ctor((shape_t*)circle, \"Circle\"), then override circle->base.area_func = __circle_area."
    - "In rectangle_ctor, ensure width and height are assigned after calling shape_ctor, then override rect->base.area_func = __rectangle_area."
