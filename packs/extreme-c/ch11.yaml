  source_ref: 'Ch.8 (Text/inheritance_and_polymorphism.xhtml)'
  level: core
  prereqs: [ch09, ch10]
objectives:
  - 'Differentiate is-a inheritance relationships from has-a composition and aggregation'
  - 'Implement Approach 1 inheritance using embedded base structs at offset 0 to enable upcasting'
  - 'Manage private headers (*_p.h) to solve the incomplete type barrier for derived structures'
  - 'Implement Approach 2 inheritance using opaque parent pointers and delegation wrappers'
  - 'Design symmetrical construction and destruction chains across class hierarchies'
  - 'Implement dynamic dispatch and runtime polymorphism in pure C via function pointers'
blocks:
  - id: b1
    type: syntax
    title: "The 'Is-A' Relationship: Inheritance vs Composition"
    explain_md: |
      In object-oriented analysis, relationships between classes fall into two
      primary philosophical categories:
      
      1. **'To-Have' (Has-A)**: Composition and Aggregation. A `Car` has an `Engine`.
         A `Player` has a `Gun`.
      2. **'To-Be' (Is-A)**: Inheritance (Extension). A `Student` is a `Person`.
         A `Cat` is an `Animal`.
      
      Inheritance is an extension relationship: a subtype acquires all the
      attributes and behaviors of its supertype (parent/base type) and adds
      specialized attributes and behaviors of its own.
      
      Without inheritance, modeling specialized entities forces code duplication.
      Consider a `Person` and a `Student`: if `student_t` redundantly repeats
      `first_name`, `last_name`, and `birth_year`, modifying `person_t` later
      silently breaks alignment across the domain model.
    example:
      lang: c
      code: |
        #include <stdio.h>
        
        /* Base type: Person */
        typedef struct {
            char first_name[32];
            char last_name[32];
            unsigned int birth_year;
        } person_t;
        
        /* Naive extension: duplicate all base fields + add new fields */
        typedef struct {
            char first_name[32];
            char last_name[32];
            unsigned int birth_year;
            char student_number[16];   /* Student-specific attribute */
            unsigned int passed_credits; /* Student-specific attribute */
        } student_naive_t;
        
        int main(void) {
            printf("sizeof(person_t): %zu\n", sizeof(person_t));
            printf("sizeof(student_naive_t): %zu\n", sizeof(student_naive_t));
            return 0;
        }
      explain_md: |
        In this naive approach, `student_naive_t` duplicates every member of
        `person_t`. While it models the same data, the compiler treats them as
        completely unrelated types. Any function accepting `person_t*` cannot
        accept `student_naive_t*` without dangerous casts, and any field added
        to `person_t` must be manually copied to all derived structs.
      subgoals:
        - label: "Define base person_t attributes"
          lines: [3, 4, 5, 6, 7, 8]
        - label: "Define naive duplicated student struct"
          lines: [10, 11, 12, 13, 14, 15, 16, 17]
    checks:
      - kind: why-fails
        q: "Why is copying base fields into derived structs (as in `student_naive_t`) considered an anti-pattern in C software architecture?"
        choices:
          - "It breaks schema evolution: altering base fields requires manual updates across all subtypes, and prevents polymorphic pointer interchangeability."
          - "C compilers refuse to compile two structs with identical field names in the same file."
          - "Copying fields causes memory overlap conflicts inside the compiler symbol table."
          - "The sizeof operator cannot be used on structs that have duplicate member names."
        answer: 0
        why: "Field duplication tightly couples schemas manually. If person_t changes (e.g. adding middle_name or changing birth_year to uint16_t), all derived structs silently desynchronize, causing catastrophic memory corruption if cast."
        concept: schema-evolution-coupling
      - kind: mcq
        q: "Which of the following real-world relationships is genuinely an 'Is-A' (inheritance) relationship rather than 'Has-A'?"
        choices:
          - "Circle is-a Shape"
          - "Car has-a Engine"
          - "Window has-a MenuBar"
          - "Teacher has-a Department"
        answer: 0
        why: "A Circle is a specific specialization of a Shape with specialized area calculations. A Car contains an Engine (composition), a Window contains a MenuBar, and a Teacher belongs to a Department (aggregation)."
        concept: is-a-vs-has-a
      - kind: choose-better
        q: "You are designing an embedded IoT telemetry system with `sensor_t` and `temp_sensor_t`. How should the relationship be conceptualized?"
        choices:
          - "'temp_sensor_t' is-a 'sensor_t': it inherits common device ID and bus read mechanics, while specializing temperature conversion."
          - "'temp_sensor_t' has-a 'sensor_t' as an optional loose aggregation that can be detached at runtime."
          - "Duplicate all sensor fields into temp_sensor_t so no structures share any relationship."
          - "Make sensor_t inherit from temp_sensor_t since temperature is more concrete."
        answer: 0
        why: "A temperature sensor is an extension of a general sensor. It possesses all core sensor attributes plus temperature-specific calibration factors."
        concept: inheritance-domain-modeling

  - id: b2
    type: model
    title: "The Nature of Inheritance: Memory Equivalence & Offset Zero"
    explain_md: |
      Under the hood, inheritance in C is implemented as a specialized form
      of composition!
      
      Instead of duplicating fields, the derived structure embeds the base
      structure variable as its **very first member**:
      
      ```c
      typedef struct {
          person_t person; /* MUST be the very first member! */
          char student_number[16];
          unsigned int passed_credits;
      } student_t;
      ```
      
      **The C Standard Guarantee (§6.7.2.1)**:
      A pointer to a structure object, suitably converted, points to its initial
      member. Conversely, a pointer to a structure's initial member points to the
      structure itself. There is **zero padding** before the first member!
      
      Therefore:
      `&student == &(student.person) == (person_t*)&student`
      
      This allows **Upcasting**: a pointer to a child struct can be safely cast
      to a pointer to the parent struct, pointing to the exact same memory address!
    viz:
      kind: ascii-memory
      steps:
        - |
          Memory Layout of student_t with Embedded person_t at Offset 0:
          Address:   [ 0x1000 ................................ 0x1048 ] [ 0x1048 ...... 0x1060 ]
          Bytes:     [ 32 bytes   | 32 bytes  | 4 bytes (+pad)        ] [ 16 bytes  | 4 bytes (+pad) ]
          Members:   [ first_name | last_name | birth_year            ] [ student_no| passed_credits ]
                     +------------------------------------------------+--------------------------+
                     |                 person_t person                |    student attributes    |
                     +------------------------------------------------+--------------------------+
                     ^                                                ^
                     |                                                |
                     +-- (person_t*)s_ptr (0x1000)                    +-- s_ptr->student_number
                     +-- (student_t*)s_ptr (0x1000)
    example:
      lang: c
      code: |
        #include <stdio.h>
        
        typedef struct {
            char first_name[32];
            char last_name[32];
            unsigned int birth_year;
        } person_t;
        
        typedef struct {
            person_t person; /* First member: offset 0 */
            char student_number[16];
            unsigned int passed_credits;
        } student_t;
        
        int main(void) {
            student_t s;
            student_t* s_ptr = &s;
            person_t* p_ptr = (person_t*)&s;
            
            printf("student_t pointer: %p\n", (void*)s_ptr);
            printf("person_t  pointer: %p\n", (void*)p_ptr);
            printf("Addresses match?   %s\n", (void*)s_ptr == (void*)p_ptr ? "YES" : "NO");
            return 0;
        }
      explain_md: |
        Running this code demonstrates that `s_ptr` and `p_ptr` print the exact
        same hexadecimal memory address. Because `person` is at offset 0,
        passing `(person_t*)s_ptr` into any function expecting `person_t*`
        works seamlessly without any pointer offset arithmetic.
      subgoals:
        - label: "Embed base person_t at offset 0"
          lines: [9, 10, 11, 12, 13]
        - label: "Upcast student_t pointer to person_t pointer"
          lines: [16, 17, 18]
        - label: "Verify identical memory addresses"
          lines: [20, 21, 22]
    checks:
      - kind: trace
        q: "Trace pointer address values in Example 8.1 when student_t s is allocated at address 0x7ffee000:"
        code: |
          student_t s; /* allocated at 0x7ffee000 */
          student_t* s_ptr = &s;
          person_t* p_ptr = (person_t*)&s;
        trace:
          headers: ["Step", "Variable", "Target Address"]
          rows:
            - ["1", "s_ptr", "0x7ffee000"]
            - ["2", "p_ptr", "0x7ffee000"]
        target: {row: 1, col: 2}
        answer_text: "0x7ffee000"
        why: "Per ISO C99 §6.7.2.1, the first member of a struct is located at offset 0 with no preceding padding. Therefore (person_t*)&s yields the exact same numeric memory address 0x7ffee000."
        concept: offset-zero-upcasting
      - kind: why-fails
        q: "What critical architectural failure occurs if `person_t person;` is placed as the second member of `student_t` (after `char student_number[16];`)?"
        choices:
          - "Casting (person_t*)&s will cause person functions to interpret student_number characters as first_name, corrupting memory!"
          - "The C compiler produces a fatal syntax error because base structs cannot be second members."
          - "The program will automatically insert a runtime trampoline to adjust the pointer offset."
          - "The size of student_t becomes infinite due to recursive alignment padding."
        answer: 0
        why: "If person_t is not at offset 0, upcasting (person_t*)&s passes the address of student_number instead of person. Any read or write via person_t* dereferences memory at the wrong offset, corrupting data."
        concept: offset-alignment-corruption
      - kind: mcq
        q: "Why does upcasting work with embedded struct variables (`person_t person;`) but NOT with struct pointers (`person_t* person;`)?"
        choices:
          - "An embedded struct variable places parent bytes contiguously at offset 0; a pointer variable stores an indirect address located elsewhere on the heap."
          - "Pointers cannot be cast to other pointer types in C99."
          - "Struct variables bypass the operating system MMU pagination tables."
          - "Pointers are restricted to 32 bits on modern architectures."
        answer: 0
        why: "An embedded struct variable places the actual fields in-line at offset 0. A pointer member only occupies 8 bytes containing a remote heap address, so casting the container pointer does not reach parent fields."
        concept: embedded-vs-pointer-layout

  - id: b3
    type: syntax
    title: "The Incomplete Type Barrier & Private Headers"
    explain_md: |
      In Chapter 09, we learned that true encapsulation requires declaring
      structs as **incomplete types** (forward declaration) in public headers:
      
      ```c
      /* person.h */
      struct person_t; /* Incomplete type: fields hidden */
      ```
      
      However, when establishing an inheritance relationship where `student_t`
      embeds `person_t person;`, a massive compiler obstacle arises:
      
      ```c
      /* In student.c */
      struct person_t; /* Forward declaration */
      
      typedef struct {
          struct person_t person; /* COMPILER ERROR: incomplete type! */
          char student_number[16];
      } student_t;
      ```
      
      **Why the compiler rejects this**:
      To allocate stack memory or calculate `sizeof(student_t)`, the compiler
      **MUST** know the exact byte size and field alignments of `person_t`.
      It cannot allocate storage for an incomplete type!
      
      **The Solution: Private Header Files (`*_p.h`)**:
      We split the header declarations into two files:
      1. `person.h` (Public Header): Forward declaration `struct person_t;`
         and public function prototypes for general callers (`main.c`).
      2. `person_p.h` (Private Header): Complete `typedef struct { ... } person_t;`
         definition, shared **only** with derived classes (`student.c`) and
         the base implementation (`person.c`).
    example:
      lang: c
      code: |
        /* person_p.h — Private header for base and child classes ONLY */
        #ifndef PERSON_P_H
        #define PERSON_P_H
        
        typedef struct {
            char first_name[32];
            char last_name[32];
            unsigned int birth_year;
        } person_t;
        
        #endif /* PERSON_P_H */
      explain_md: |
        The private header `person_p.h` exposes the exact memory layout of
        `person_t`. The base class implementation (`person.c`) and child class
        implementations (`student.c`) include this file. External callers
        (such as `main.c`) NEVER include `person_p.h`.
      subgoals:
        - label: "Include guard for private header"
          lines: [2, 3, 11]
        - label: "Define full concrete person_t layout"
          lines: [5, 6, 7, 8, 9]
    checks:
      - kind: spot-bug
        q: "Identify the compilation error when attempting to embed an incomplete forward-declared type:"
        code: |
          struct base_t;
          
          typedef struct {
              struct base_t base;
              int child_data;
          } child_t;
        diagnostic_log: |
          child.c:4:19: error: field 'base' has incomplete type
              struct base_t base;
                            ^~~~
        target_line: 4
        choices:
          - "Field 'base' has incomplete type: compiler cannot determine struct size without its full definition"
          - "child_t cannot contain members of type int"
          - "struct base_t must be declared using typedef base_t*"
          - "child.c is missing a return statement"
        answer: 0
        why: "To embed a struct variable (not a pointer), the compiler must know its exact size. Forward-declaring 'struct base_t;' makes it an incomplete type, causing compilation failure."
        concept: incomplete-type-embedding
      - kind: mcq
        q: "Who is permitted to include the private header `person_p.h` in an idiomatic C OOP architecture?"
        choices:
          - "Only the base implementation (person.c) and derived class implementations (student.c)"
          - "Any caller that wants faster access to struct members"
          - "Only the main.c entry point"
          - "The C standard library stdlib.h header"
        answer: 0
        why: "Private headers (*_p.h) act as protected interfaces in C++. They expose layout details strictly to subclasses that need to embed the struct, shielding them from external client code."
        concept: private-header-visibility
      - kind: why-fails
        q: "What design violation occurs if `main.c` includes `person_p.h` directly to access `person->first_name`?"
        choices:
          - "It breaks encapsulation: callers become tightly coupled to internal struct layout, preventing future internal refactoring without recompiling callers."
          - "The linker emits a multiple-definition error for first_name."
          - "The operating system refuses to load the binary into memory."
          - "The compiler automatically deletes person_p.h."
        answer: 0
        why: "Encapsulation requires callers to communicate exclusively through public behavior functions. Directly exposing struct fields creates brittle coupling and leaks private state."
        concept: leaky-encapsulation-caller

  - id: b4
    type: design
    title: "Approach 1: Lifecycle Chaining & Subclass Destruction"
    explain_md: |
      When implementing inheritance via embedded struct variables (Approach 1),
      managing object construction and destruction requires strict lifecycle chaining.
      
      **Construction Chaining (Parent First, Child Second)**:
      1. In `student_ctor`, the child receives memory from `student_new()`.
      2. The child constructor **first** delegates initialization of the base
         fields to `person_ctor`:
         ```c
         person_ctor((struct person_t*)student, first_name, last_name, birth_year);
         ```
         Notice that `(struct person_t*)student` works directly because `person`
         is at offset 0!
      3. The child constructor then initializes its own specialized fields
         (`student_number`, `passed_credits`).
      
      **Destruction Chaining (Child First, Parent Second)**:
      1. Destruction **MUST** occur in exact reverse order!
      2. The child destructor `student_dtor` first frees its own allocated
         resources (e.g. heap-allocated strings or child buffers).
      3. The child destructor then calls `person_dtor((struct person_t*)student)`
         to clean up parent resources.
      
      Inverting this order causes catastrophic use-after-free bugs if child
      teardown logic references parent state.
    example:
      lang: c
      code: |
        #include <stdlib.h>
        #include <string.h>
        
        /* Declarations representing Approach 1 lifecycle */
        typedef struct {
            char first_name[32];
            char last_name[32];
            unsigned int birth_year;
        } person_t;
        
        void person_ctor(person_t* p, const char* f, const char* l, unsigned int y) {
            strncpy(p->first_name, f, 31);
            strncpy(p->last_name, l, 31);
            p->birth_year = y;
        }
        
        void person_dtor(person_t* p) {
            /* Clean up any base resources */
            (void)p;
        }
        
        typedef struct {
            person_t person; /* Offset 0 */
            char* student_number;
            unsigned int passed_credits;
        } student_t;
        
        void student_ctor(student_t* s, const char* f, const char* l,
                          unsigned int y, const char* num, unsigned int credits) {
            /* 1. Construct parent part first via upcast */
            person_ctor((person_t*)s, f, l, y);
            /* 2. Construct child part */
            s->student_number = (char*)malloc(16);
            strncpy(s->student_number, num, 15);
            s->passed_credits = credits;
        }
        
        void student_dtor(student_t* s) {
            /* 1. Destruct child resources first */
            free(s->student_number);
            /* 2. Destruct parent part last */
            person_dtor((person_t*)s);
        }
      explain_md: |
        Notice the exact symmetry between `student_ctor` and `student_dtor`.
        The constructor builds the parent first so that child setup can rely
        on a valid base object. The destructor tears down child attributes
        before letting the base destructor run.
      subgoals:
        - label: "Chain parent constructor at offset 0"
          lines: [31, 32]
        - label: "Initialize child-specific dynamic resources"
          lines: [34, 35, 36]
        - label: "Tear down child resources before parent destructor"
          lines: [40, 41, 42, 43]
    checks:
      - kind: order
        q: "Arrange the statements inside `student_dtor` and caller cleanup in the required architectural order:"
        lines:
          - "free(student->student_number);"
          - "person_dtor((struct person_t*)student);"
          - "free(student);"
          - "free(student->person);"
        answer_order: [0, 1, 2]
        why: "Child resources must always be released before invoking the parent destructor. Finally, the caller frees the student container allocation. Distractor 3 is invalid syntax for Approach 1."
        concept: destructor-chaining-sequence
      - kind: why-fails
        q: "What happens if `student_ctor` initializes `student->student_number` but forgets to call `person_ctor`?"
        choices:
          - "The base person_t fields remain uninitialized garbage memory, causing undefined behavior when reading name or birth year."
          - "The compiler issues a fatal error because parent constructors are automatically synthesized."
          - "The operating system zeroes out the memory on first access."
          - "The student_t pointer becomes NULL automatically."
        answer: 0
        why: "In C, there is no compiler runtime that automatically invokes base constructors. The author must explicitly chain the constructor call, otherwise base attributes remain uninitialized garbage."
        concept: missing-constructor-chain
      - kind: choose-better
        q: "In `student_ctor`, how should the base object be constructed?"
        choices:
          - "Call person_ctor((struct person_t*)student, first_name, last_name, birth_year);"
          - "Allocate a new heap person using person_new() and overwrite the first 8 bytes of student."
          - "Use memcpy to duplicate bytes from a global person template."
          - "Do not call any constructor; let the caller initialize person fields directly."
        answer: 0
        why: "Because person_t is embedded at offset 0, upcasting the student pointer directly to person_t* and passing it to person_ctor cleanly initializes the embedded base object in place."
        concept: in-place-parent-initialization

  - id: b5
    type: design
    title: "Approach 1 in Action: Reusing Base Behaviors Without Wrappers"
    explain_md: |
      The most powerful advantage of Approach 1 (embedded struct at offset 0)
      is **direct behavior reuse**:
      
      Because a `student_t*` pointer can be upcast to a `person_t*` pointer,
      any public behavior function belonging to the `Person` class can be
      invoked on a `student` object **without writing a single line of wrapper code**!
      
      Look at how `main.c` interacts with a `student` instance:
      ```c
      struct student_t* student = student_new();
      student_ctor(student, "John", "Doe", 1987, "TA5667", 134);
      
      /* Upcast to call person behavior functions! */
      struct person_t* person_ptr = (struct person_t*)student;
      person_get_first_name(person_ptr, buffer);
      person_get_last_name(person_ptr, buffer);
      unsigned int year = person_get_birth_year(person_ptr);
      ```
      
      The `Student` class does NOT need to define `student_get_first_name` or
      `student_get_last_name`. It inherits them for free!
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>
        
        /* Simulated behavior function */
        typedef struct {
            char name[32];
        } animal_t;
        
        void animal_get_name(animal_t* a, char* dest) {
            snprintf(dest, 32, "%s", a->name);
        }
        
        /* Derived class embedding base at offset 0 */
        typedef struct {
            animal_t base;
            int lives_left;
        } cat_t;
        
        int main(void) {
            cat_t cat;
            snprintf(cat.base.name, 32, "Mittens");
            cat.lives_left = 9;
            
            char buffer[32];
            /* Direct reuse of base function via upcast! */
            animal_get_name((animal_t*)&cat, buffer);
            
            printf("Cat name: %s, Lives: %d\n", buffer, cat.lives_left);
            return 0;
        }
      explain_md: |
        Notice that `cat_t` did not write a `cat_get_name` function.
        Because `base` is at offset 0, passing `(animal_t*)&cat` directly
        into `animal_get_name` reuses the parent's compiled logic with zero
        forwarding overhead.
      subgoals:
        - label: "Define base behavior function"
          lines: [9, 10, 11]
        - label: "Embed base at offset 0 in child"
          lines: [14, 15, 16, 17]
        - label: "Call base behavior using upcast child pointer"
          lines: [25, 26]
    checks:
      - kind: trace
        q: "Trace string buffer population when animal_get_name is called on upcast cat pointer:"
        code: |
          cat_t cat;
          snprintf(cat.base.name, 32, "Mittens");
          char buffer[32];
          animal_get_name((animal_t*)&cat, buffer);
        trace:
          headers: ["Line", "Operation", "Buffer Content"]
          rows:
            - ["2", "snprintf cat.base.name", "uninitialized"]
            - ["4", "animal_get_name upcast", "Mittens"]
        target: {row: 1, col: 2}
        answer_text: "Mittens"
        why: "animal_get_name reads from the offset 0 base struct member cat.base.name and writes 'Mittens' into buffer."
        concept: direct-behavior-reuse-trace
      - kind: mcq
        q: "Why does `main.c` need to include both `person.h` and `student.h` when utilizing Approach 1?"
        choices:
          - "It needs student.h to allocate/construct the student, and person.h to declare the base behavior functions (person_get_first_name, etc.)."
          - "The linker requires header names to match the object file names."
          - "student.h automatically undefines all person.h macros."
          - "person.h contains the implementation code of student_ctor."
        answer: 0
        why: "Because Student does not duplicate the base getters, main() calls person_get_first_name on the upcast pointer, requiring the prototypes declared in person.h."
        concept: dual-header-inclusion
      - kind: why-fails
        q: "What compiler warning is emitted if a programmer passes `&cat` to `animal_get_name(&cat, buffer)` without an explicit cast in C99 with `-Wall`?"
        choices:
          - "Passing argument 1 of 'animal_get_name' from incompatible pointer type without a cast."
          - "Fatal syntax error: struct pointer expected, found child."
          - "Implicit function declaration warning."
          - "No warning; C compilers silently cast all pointers automatically."
        answer: 0
        why: "In C, pointers to distinct struct types (cat_t* vs animal_t*) are distinct types. Passing one to the other without an explicit (animal_t*) cast triggers a compiler warning (-Wincompatible-pointer-types)."
        concept: pointer-type-safety-warning

  - id: b6
    type: model
    title: "Approach 2: Opaque Parent Pointer (Pure Encapsulation)"
    explain_md: |
      Now consider the second approach to implementing inheritance in C:
      **The Opaque Parent Pointer**.
      
      In Approach 2:
      1. We **abolish** the private header `person_p.h`. The definition of
         `person_t` is moved entirely inside `person.c`.
      2. The `Student` class only includes the **public interface** `person.h`.
      3. The `student_t` attribute structure holds a **pointer** to an incomplete
         parent type:
         ```c
         typedef struct {
             char* student_number;
             unsigned int passed_credits;
             struct person_t* person; /* Opaque pointer! */
         } student_t;
         ```
      
      **Crucial Differences from Approach 1**:
      - **Memory Decoupling**: The child and parent are two completely separate
        heap allocations.
      - **Upcasting is Impossible**: `student_t*` and `person_t*` point to
        completely different memory addresses. `(person_t*)student` is an invalid,
        fatal cast!
      - **Pure Encapsulation**: The child class has zero knowledge of parent
        internals. If `person_t` changes internal field types, `student.c` does
        not even need to be recompiled!
      - **Multiple Inheritance**: Because parents are pointers, `student_t` can
        hold multiple parent pointers (`person`, `athlete`, `employee`)!
    viz:
      kind: ascii-memory
      steps:
        - |
          Memory Layout in Approach 2 (Two Separate Heap Allocations):
          
          Stack / Caller:
            student_t* s ----> [ Heap Chunk 1: student_t @ 0x2000 ]
                               +----------------------------------------+
                               | char* student_number                   |
                               | unsigned int passed_credits            |
                               | struct person_t* person --------------+
                               +----------------------------------------+  |
                                                                           | points to
                                                                           v
                               [ Heap Chunk 2: person_t @ 0x5000 ] <-------+
                               +----------------------------------------+
                               | char first_name[32]                    |
                               | char last_name[32]                     |
                               | unsigned int birth_year                |
                               +----------------------------------------+
          
          Notice: (void*)student (0x2000) != (void*)student->person (0x5000)!
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>
        
        /* Incomplete base type */
        struct engine_t;
        
        /* Approach 2: child holds pointer to incomplete base type */
        typedef struct {
            char model[32];
            struct engine_t* engine; /* Opaque pointer */
        } car_t;
        
        int main(void) {
            printf("sizeof(car_t): %zu\n", sizeof(car_t));
            printf("car_t does NOT know the size of engine_t!\n");
            return 0;
        }
      explain_md: |
        Because `engine` is a pointer, `car_t` only needs 8 bytes to store the
        address. The compiler does not need the complete definition of `engine_t`,
        enabling 100% information hiding.
      subgoals:
        - label: "Declare incomplete base struct"
          lines: [4, 5]
        - label: "Embed base pointer inside child"
          lines: [7, 8, 9, 10, 11]
