        expect_exit: 0
    hints:
      - Allocate the parent with person_new() and keep it in the student's person pointer.
      - Forward each inherited getter to the parent through student->person.
      - Free the child string, then the parent object, in the destructor.

  - id: lab3
    title: "Polymorphism: One Interface, Many Sounds"
    instruction_md: |-
      ### Pedagogical Mission
      Implement **polymorphism in C** with a per-instance function pointer. The `Animal` class
      is complete; you implement the `Cat` and `Duck` overrides.

      ### Requirements
      1. In `cat.c`, define `struct cat_t` with an embedded `animal_t animal;` as the first
         field, define `__cat_sound(void*)` that prints `"%s: Meow"`, and implement
         `cat_new`, `cat_ctor`, and `cat_dtor`.
      2. `cat_ctor` must call `animal_ctor((animal_t*)cat)`, rename the animal to `"Cat"`, and
         set `cat->animal.sound_func = __cat_sound`.
      3. In `duck.c`, do the same for `Duck`, printing `"%s: Quacks"` and installing
         `__duck_sound`.
      4. Include `animal.h` and `animal_p.h`; do not modify the provided files.
    files:
      - path: animal.h
        content: |
          #ifndef ANIMAL_H
          #define ANIMAL_H

          struct animal_t;
          struct animal_t* animal_new(void);
          void animal_ctor(struct animal_t*);
          void animal_dtor(struct animal_t*);
          void animal_get_name(struct animal_t*, char*);
          void animal_sound(struct animal_t*);

          #endif
      - path: animal_p.h
        content: |
          #ifndef ANIMAL_P_H
          #define ANIMAL_P_H

          typedef void (*sound_func_t)(void*);

          typedef struct animal_t {
            char* name;
            sound_func_t sound_func;
          } animal_t;

          #endif
      - path: animal.c
        content: |
          #include <stdlib.h>
          #include <string.h>
          #include <stdio.h>
          #include "animal_p.h"

          void __animal_sound(void* this_ptr) {
            animal_t* animal = (animal_t*)this_ptr;
            printf("%s: Beeeep\n", animal->name);
          }

          struct animal_t* animal_new(void) {
            return (animal_t*)malloc(sizeof(animal_t));
          }

          void animal_ctor(struct animal_t* animal) {
            if (!animal) return;
            animal->name = (char*)malloc(10 * sizeof(char));
            strcpy(animal->name, "Animal");
            animal->sound_func = __animal_sound;
          }

          void animal_dtor(struct animal_t* animal) {
            if (animal) free(animal->name);
          }

          void animal_get_name(struct animal_t* animal, char* buffer) {
            if (animal && buffer) strcpy(buffer, animal->name);
          }

          void animal_sound(struct animal_t* animal) {
            if (animal) animal->sound_func(animal);
          }
      - path: cat.h
        content: |
          #ifndef CAT_H
          #define CAT_H

          struct cat_t;
          struct cat_t* cat_new(void);
          void cat_ctor(struct cat_t*);
          void cat_dtor(struct cat_t*);

          #endif
      - path: cat.c
        content: ''
      - path: duck.h
        content: |
          #ifndef DUCK_H
          #define DUCK_H

          struct duck_t;
          struct duck_t* duck_new(void);
          void duck_ctor(struct duck_t*);
          void duck_dtor(struct duck_t*);

          #endif
      - path: duck.c
        content: ''
      - path: main.c
        content: |
          #include <stdio.h>
          #include <stdlib.h>
          #include "animal.h"
          #include "cat.h"
          #include "duck.h"

          int main(void) {
            struct animal_t* animal = animal_new();
            struct cat_t* cat = cat_new();
            struct duck_t* duck = duck_new();

            animal_ctor(animal);
            cat_ctor(cat);
            duck_ctor(duck);

            animal_sound(animal);
            animal_sound((struct animal_t*)cat);
            animal_sound((struct animal_t*)duck);

            animal_dtor(animal);
            cat_dtor(cat);
            duck_dtor(duck);
            free(duck);
            free(cat);
            free(animal);
            return 0;
          }
      - path: test_runner.c
        content: |
          #include <stdio.h>
          #include <stdlib.h>
          #include <assert.h>
          #include "animal.h"
          #include "cat.h"
          #include "duck.h"

          int main(void) {
            struct animal_t* animal = animal_new();
            struct cat_t* cat = cat_new();
            struct duck_t* duck = duck_new();
            assert(animal && cat && duck);

            animal_ctor(animal);
            cat_ctor(cat);
            duck_ctor(duck);

            assert((void*)animal != (void*)cat);
            assert((void*)cat != (void*)duck);

            animal_sound(animal);
            animal_sound((struct animal_t*)cat);
            animal_sound((struct animal_t*)duck);

            animal_dtor(animal);
            cat_dtor(cat);
            duck_dtor(duck);
            free(duck);
            free(cat);
            free(animal);
            printf("POLYMORPHISM TESTS PASSED\n");
            return 0;
          }
    commands:
      run: gcc -Wall -Wextra -std=c99 animal.c cat.c duck.c main.c -o app && ./app
      test: gcc -Wall -Wextra -std=c99 animal.c cat.c duck.c test_runner.c -o test_runner && ./test_runner
    test_cases:
      - name: Polymorphic sound dispatch trace
        stdin: ''
        expect: |
          Animal: Beeeep
          Cat: Meow
          Duck: Quacks
        expect_exit: 0
    hints:
      - Define cat_t with animal_t animal as its first field so upcasting works.
      - Call animal_ctor first, rename the object, then install your override function pointer.
      - Mirror the same pattern in duck.c, printing Quacks.
