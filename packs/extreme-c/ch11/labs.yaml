labs:
  - id: lab1
    title: "Embedded Inheritance: Student Is-a Person"
    instruction_md: |-
      ### Pedagogical Mission
      Implement the **first approach** to inheritance in C: a `student_t` embeds a `person_t`
      by value as its **first field**, so a student pointer can be upcast to a person pointer.

      ### Requirements
      1. Define `struct student_t` in `student.c` with a `person_t person;` member as the
         first field, plus `char* student_number;` and `unsigned int passed_credits;`.
      2. Implement `student_new()` to allocate a `student_t`.
      3. Implement `student_ctor(...)`: call `person_ctor((person_t*)student, ...)` to
         initialize the embedded parent, allocate `student_number` (16 bytes), copy the
         number, and set `passed_credits`.
      4. Implement `student_dtor(...)`: free `student_number` first, then call
         `person_dtor((person_t*)student)`.
      5. Implement `student_get_student_number()` and `student_get_passed_credits()`.
      6. Include `person.h` and `person_p.h`; never expose the parent's layout in a header.
    files:
      - path: person.h
        content: |
          #ifndef PERSON_H
          #define PERSON_H

          struct person_t;
          struct person_t* person_new(void);
          void person_ctor(struct person_t*, const char*, const char*, unsigned int);
          void person_dtor(struct person_t*);
          void person_get_first_name(struct person_t*, char*);
          void person_get_last_name(struct person_t*, char*);
          unsigned int person_get_birth_year(struct person_t*);

          #endif
      - path: person_p.h
        content: |
          #ifndef PERSON_P_H
          #define PERSON_P_H

          typedef struct person_t {
            char first_name[32];
            char last_name[32];
            unsigned int birth_year;
          } person_t;

          #endif
      - path: person.c
        content: |
          #include <stdlib.h>
          #include <string.h>
          #include "person_p.h"

          struct person_t* person_new(void) {
            return (person_t*)malloc(sizeof(person_t));
          }

          void person_ctor(struct person_t* p, const char* fn,
                           const char* ln, unsigned int by) {
            if (!p) return;
            strcpy(p->first_name, fn);
            strcpy(p->last_name, ln);
            p->birth_year = by;
          }

          void person_dtor(struct person_t* p) { (void)p; }

          void person_get_first_name(struct person_t* p, char* buffer) {
            if (p && buffer) strcpy(buffer, p->first_name);
          }

          void person_get_last_name(struct person_t* p, char* buffer) {
            if (p && buffer) strcpy(buffer, p->last_name);
          }

          unsigned int person_get_birth_year(struct person_t* p) {
            return p ? p->birth_year : 0;
          }
      - path: student.h
        content: |
          #ifndef STUDENT_H
          #define STUDENT_H

          struct student_t;
          struct student_t* student_new(void);
          void student_ctor(struct student_t*, const char*, const char*, unsigned int,
                            const char*, unsigned int);
          void student_dtor(struct student_t*);
          void student_get_student_number(struct student_t*, char*);
          unsigned int student_get_passed_credits(struct student_t*);

          #endif
      - path: student.c
        content: ''
      - path: main.c
        content: |
          #include <stdio.h>
          #include <stdlib.h>
          #include "person.h"
          #include "student.h"

          int main(void) {
            struct student_t* student = student_new();
            student_ctor(student, "John", "Doe", 1987, "TA5667", 134);

            char buffer[32];
            struct person_t* person_ptr = (struct person_t*)student;
            person_get_first_name(person_ptr, buffer);
            printf("First name: %s\n", buffer);
            person_get_last_name(person_ptr, buffer);
            printf("Last name: %s\n", buffer);
            printf("Birth year: %u\n", person_get_birth_year(person_ptr));

            student_get_student_number(student, buffer);
            printf("Student number: %s\n", buffer);
            printf("Passed credits: %u\n", student_get_passed_credits(student));

            student_dtor(student);
            free(student);
            return 0;
          }
      - path: test_runner.c
        content: |
          #include <stdio.h>
          #include <stdlib.h>
          #include <assert.h>
          #include <string.h>
          #include "person.h"
          #include "student.h"

          int main(void) {
            struct student_t* student = student_new();
            assert(student != NULL);
            student_ctor(student, "John", "Doe", 1987, "TA5667", 134);

            char buffer[32];
            struct person_t* person_ptr = (struct person_t*)student;
            person_get_first_name(person_ptr, buffer);
            assert(strcmp(buffer, "John") == 0);
            person_get_last_name(person_ptr, buffer);
            assert(strcmp(buffer, "Doe") == 0);
            assert(person_get_birth_year(person_ptr) == 1987);

            student_get_student_number(student, buffer);
            assert(strcmp(buffer, "TA5667") == 0);
            assert(student_get_passed_credits(student) == 134);

            student_dtor(student);
            free(student);
            printf("STUDENT INHERITANCE TESTS PASSED\n");
            return 0;
          }
    commands:
      run: gcc -Wall -Wextra -std=c99 person.c student.c main.c -o app && ./app
      test: gcc -Wall -Wextra -std=c99 person.c student.c test_runner.c -o test_runner && ./test_runner
    test_cases:
      - name: Embedded inheritance program trace
        stdin: ''
        expect: |
          First name: John
          Last name: Doe
          Birth year: 1987
          Student number: TA5667
          Passed credits: 134
        expect_exit: 0
    hints:
      - Include both person.h and person_p.h, then make person the first member of student_t.
      - Upcast the student pointer to person_t* when calling the parent constructor and destructor.
      - Free the child's own string before calling person_dtor on the upcast pointer.

  - id: lab2
    title: "Pointer Inheritance: Student Has-a Person"
    instruction_md: |-
      ### Pedagogical Mission
      Implement the **second approach** to inheritance in C: a `student_t` holds a pointer to
      a separately allocated `person_t`, and forwards every inherited behavior through a
      wrapper function.

      ### Requirements
      1. Define `struct student_t` in `student.c` with `char* student_number;`,
         `unsigned int passed_credits;`, and `struct person_t* person;`.
      2. Implement `student_new()` to allocate a `student_t`.
      3. Implement `student_ctor(...)`: allocate the parent with `person_new()`, construct it
         with `person_ctor(student->person, ...)`, allocate `student_number`, and set credits.
      4. Implement `student_dtor(...)`: free `student_number`, call
         `person_dtor(student->person)`, then `free(student->person)`.
      5. Implement wrapper functions `student_get_first_name`, `student_get_last_name`,
         `student_get_birth_year`, `student_get_student_number`, and
         `student_get_passed_credits` that forward to the parent where appropriate.
      6. Include only `person.h`; the parent's layout stays hidden inside `person.c`.
    files:
      - path: person.h
        content: |
          #ifndef PERSON_H
          #define PERSON_H

          struct person_t;
          struct person_t* person_new(void);
          void person_ctor(struct person_t*, const char*, const char*, unsigned int);
          void person_dtor(struct person_t*);
          void person_get_first_name(struct person_t*, char*);
          void person_get_last_name(struct person_t*, char*);
          unsigned int person_get_birth_year(struct person_t*);

          #endif
      - path: person.c
        content: |
          #include <stdlib.h>
          #include <string.h>
          #include "person.h"

          typedef struct person_t {
            char first_name[32];
            char last_name[32];
            unsigned int birth_year;
          } person_t;

          struct person_t* person_new(void) {
            return (person_t*)malloc(sizeof(person_t));
          }

          void person_ctor(struct person_t* p, const char* fn,
                           const char* ln, unsigned int by) {
            if (!p) return;
            strcpy(p->first_name, fn);
            strcpy(p->last_name, ln);
            p->birth_year = by;
          }

          void person_dtor(struct person_t* p) { (void)p; }

          void person_get_first_name(struct person_t* p, char* buffer) {
            if (p && buffer) strcpy(buffer, p->first_name);
          }

          void person_get_last_name(struct person_t* p, char* buffer) {
            if (p && buffer) strcpy(buffer, p->last_name);
          }

          unsigned int person_get_birth_year(struct person_t* p) {
            return p ? p->birth_year : 0;
          }
      - path: student.h
        content: |
          #ifndef STUDENT_H
          #define STUDENT_H

          struct student_t;
          struct student_t* student_new(void);
          void student_ctor(struct student_t*, const char*, const char*, unsigned int,
                            const char*, unsigned int);
          void student_dtor(struct student_t*);
          void student_get_first_name(struct student_t*, char*);
          void student_get_last_name(struct student_t*, char*);
          unsigned int student_get_birth_year(struct student_t*);
          void student_get_student_number(struct student_t*, char*);
          unsigned int student_get_passed_credits(struct student_t*);

          #endif
      - path: student.c
        content: ''
      - path: main.c
        content: |
          #include <stdio.h>
          #include <stdlib.h>
          #include "student.h"

          int main(void) {
            struct student_t* student = student_new();
            student_ctor(student, "John", "Doe", 1987, "TA5667", 134);

            char buffer[32];
            student_get_first_name(student, buffer);
            printf("First name: %s\n", buffer);
            student_get_last_name(student, buffer);
            printf("Last name: %s\n", buffer);
            printf("Birth year: %u\n", student_get_birth_year(student));

            student_get_student_number(student, buffer);
            printf("Student number: %s\n", buffer);
            printf("Passed credits: %u\n", student_get_passed_credits(student));

            student_dtor(student);
            free(student);
            return 0;
          }
      - path: test_runner.c
        content: |
          #include <stdio.h>
          #include <stdlib.h>
          #include <assert.h>
          #include <string.h>
          #include "student.h"

          int main(void) {
            struct student_t* student = student_new();
            assert(student != NULL);
            student_ctor(student, "John", "Doe", 1987, "TA5667", 134);

            char buffer[32];
            student_get_first_name(student, buffer);
            assert(strcmp(buffer, "John") == 0);
            student_get_last_name(student, buffer);
            assert(strcmp(buffer, "Doe") == 0);
            assert(student_get_birth_year(student) == 1987);

            student_get_student_number(student, buffer);
            assert(strcmp(buffer, "TA5667") == 0);
            assert(student_get_passed_credits(student) == 134);

            student_dtor(student);
            free(student);
            printf("STUDENT POINTER INHERITANCE TESTS PASSED\n");
            return 0;
          }
    commands:
      run: gcc -Wall -Wextra -std=c99 person.c student.c main.c -o app && ./app
      test: gcc -Wall -Wextra -std=c99 person.c student.c test_runner.c -o test_runner && ./test_runner
    test_cases:
      - name: Pointer inheritance program trace
        stdin: ''
        expect: |
          First name: John
          Last name: Doe
          Birth year: 1987
