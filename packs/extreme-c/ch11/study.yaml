  - id: b6
    type: design
    title: "Decouple Child From Parent With a Pointer and Wrapper Functions"
    explain_md: |
      The second approach keeps a **pointer** to the parent inside the child:

      ```c
      typedef struct {
        char* student_number;
        unsigned int passed_credits;
        struct person_t* person;   /* pointer to incomplete parent */
      } student_t;
      ```

      Because a pointer to an incomplete type is legal, the child no longer needs the parent's
      private definition. It includes only the parent's public header. The parent's layout can
      now live entirely inside `person.c`, giving complete encapsulation.

      The price is that **upcasting no longer works**: a `student_t*` and a `person_t*` point
      to different, unrelated objects. The child therefore cannot hand itself to the parent's
      behavior functions. Instead it writes **wrapper functions** that forward each call to
      the parent object it owns:

      ```c
      void student_get_first_name(student_t* s, char* buffer) {
        person_get_first_name(s->person, buffer);
      }
      ```

      This approach decouples the classes and, because several parent pointers can coexist,
      supports **multiple inheritance**. The constructor allocates and constructs the parent;
      the destructor destroys and frees it last.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>

        struct person_t;
        struct person_t* person_new(void);
        void person_ctor(struct person_t*, const char*, const char*, unsigned int);
        void person_dtor(struct person_t*);
        void person_get_first_name(struct person_t*, char*);
        unsigned int person_get_birth_year(struct person_t*);

        /* The complete person_t definition lives only in person.c. */

        typedef struct student_t {
          char* student_number;
          unsigned int passed_credits;
          struct person_t* person;   /* pointer to incomplete parent */
        } student_t;

        student_t* student_new(void) {
          return (student_t*)malloc(sizeof(student_t));
        }

        void student_ctor(student_t* s, const char* fn, const char* ln, unsigned int by,
                          const char* number, unsigned int credits) {
          s->person = person_new();
          person_ctor(s->person, fn, ln, by);
          s->student_number = (char*)malloc(16 * sizeof(char));
          strcpy(s->student_number, number);
          s->passed_credits = credits;
        }

        void student_dtor(student_t* s) {
          free(s->student_number);
          person_dtor(s->person);
          free(s->person);
        }

        void student_get_first_name(student_t* s, char* buffer) {
          person_get_first_name(s->person, buffer);   /* forwarding wrapper */
        }

        unsigned int student_get_birth_year(student_t* s) {
          return person_get_birth_year(s->person);
        }

        int main(void) {
          student_t* s = student_new();
          student_ctor(s, "John", "Doe", 1987, "TA5667", 134);
          char buffer[32];
          student_get_first_name(s, buffer);
          printf("First name: %s\n", buffer);
          printf("Birth year: %u\n", student_get_birth_year(s));
          student_dtor(s);
          free(s);
          return 0;
        }
    viz:
      kind: ascii-memory
      steps:
        - "student_new() -> student_t at 0x2000 [person = garbage]"
        - "student_ctor: s->person = person_new() -> person_t at 0x5000"
        - "student_ctor: person_ctor(0x5000, ...) -> parent fields initialized"
        - "student_ctor: s->student_number = malloc(16) -> 0x7000"
        - "student_dtor: free(0x7000); person_dtor(0x5000); free(0x5000)"
    checks:
      - kind: mcq
        q: "Why can a student_t pointer no longer be cast to a person_t pointer in the second approach?"
        choices:
          - "Because the compiler forbids casts between unrelated struct tags"
          - "Because the parent type is declared const"
          - "Because pointers cannot be stored inside structs in C"
          - "Because the parent is now a pointer, so the child and parent live at different addresses"
        answer: 3
        why: |
          The child holds a pointer to a separately allocated parent object. The child's address and the
          parent's address are unrelated, so a cast would not produce a valid person_t*. The compiler
          does allow casts between struct pointers, so options A, B, and C are false.
        concept: "pointer-breaks-upcast"

      - kind: predict
        q: "Predict how many distinct heap objects exist after student_ctor completes in the second approach."
        code: |
          student_t* s = student_new();
          student_ctor(s, "John", "Doe", 1987, "TA5667", 134);
        choices:
          - "One: the student object only"
          - "Two: the student and the embedded parent share one block"
          - "Three: the student, the parent object, and the student_number buffer"
          - "Four: one per attribute"
        answer: 2
        why: |
          The second approach allocates the student container, a separate parent object, and a heap buffer for
          student_number: three allocations. Option A describes the first approach's single object. Option B
          confuses the two approaches. Option D is nonsense.
        concept: "approach2-allocation-count"

      - kind: why-fails
        q: "Why must the Student class repeat Person's behavior functions as wrappers in the second approach?"
        code: |
          void student_get_first_name(student_t* s, char* buffer) {
            person_get_first_name(s->person, buffer);
          }
        choices:
          - "Because the C compiler requires every class to define all functions it uses"
          - "Because wrappers make the code run faster than direct calls"
          - "Because the student pointer cannot be passed to Person's functions, so the child must forward each call"
          - "Because Person's functions are declared static"
        answer: 2
        why: |
          Without upcasting, a student_t* cannot be handed to person_get_first_name. The child therefore
          exposes its own functions that internally call the parent's behavior on s->person. Options A, B,
          and D are false.
        concept: "wrapper-forwarding-necessity"

      - kind: eipe
        q: "In one sentence, what is the purpose of storing the parent as a pointer instead of embedding it?"
        choices:
          - "It lets the child allocate the parent on the stack"
          - "It guarantees that the parent is constructed before the child"
          - "It reduces the size of every student_t instance to one byte"
          - "It hides the parent's implementation from the child and decouples the two classes"
        answer: 3
        why: |
          A pointer to an incomplete type needs no private header, so the child depends only on the parent's
          public interface. The classes become independent and the parent's internals stay hidden. Options A,
          B, and C are false.
        concept: "pointer-encapsulation-purpose"

      - kind: choose-better
        q: "Which implementation best preserves information hiding when a child must reuse a parent's behavior?"
        choices:
          - |
            // Child embeds parent by value; child includes parent's private header
            typedef struct { person_t person; } student_t;
          - |
            // Child holds a parent pointer; child includes only the public header
            typedef struct { struct person_t* person; } student_t;
        answer: 1
        why: |
          Option B keeps the parent's layout private and couples the child only to the public interface.
          Option A forces the child to see and depend on the parent's private definition, creating a strong
          compile-time dependency.
        concept: "encapsulation-approach-choice"

  - id: b7
    type: design
    title: "Compare the Two Inheritance Implementations"
    explain_md: |
      Both approaches are composition in nature, but they differ in coupling and capability.

      | Property | Approach 1 (embedded value) | Approach 2 (parent pointer) |
      |---|---|---|
      | Parent storage | structure variable, first field | pointer to incomplete type |
      | Parent definition | child sees the private header | child sees only the public interface |
      | Coupling | strong | weak / independent |
      | Upcasting | works (same address) | impossible (different addresses) |
      | Inheritance arity | single only | multiple possible |
      | Behavior reuse | call parent functions directly | forward through wrapper functions |
      | Object count | one | two (separate parent object) |

      Approach 1 is simpler and lets the child call parent functions directly, but it is rigid:
      only one parent can be embedded, and the parent must be the first field. Approach 2 is
      more flexible and better encapsulated, at the cost of wrapper boilerplate and an extra
      heap allocation.
    example:
      lang: c
      code: |
        #include <stdio.h>

        struct person_t;
        struct course_t;

        /* Approach 2 allows several parent pointers: multiple inheritance. */
        typedef struct {
          struct person_t* person;
          struct course_t* course;
          unsigned int passed_credits;
        } student_t;

        int main(void) {
          student_t s;
          s.person = 0;
          s.course = 0;
          s.passed_credits = 0;
          printf("student_t holds two parent pointers\n");
          return 0;
        }
    viz:
      kind: ascii-memory
      steps:
        - "Approach 1: student_t { person_t person; ... } -> one object, parent at offset 0"
        - "Approach 2: student_t { struct person_t* person; ... } -> student + separate parent"
        - "Approach 2 multiple: student_t { struct person_t* person; struct course_t* course; }"
        - "Approach 1 behavior: person_get_first_name((person_t*)student, buf)"
        - "Approach 2 behavior: student_get_first_name(student, buf) -> forwards to parent"
    checks:
      - kind: mcq
        q: "Which approach to inheritance in C can express multiple inheritance?"
        choices:
          - "The pointer approach, because a child can hold several parent pointers"
          - "The embedded-value approach, because a struct can contain many fields"
          - "Neither approach supports more than one parent"
          - "Both approaches support exactly two parents"
        answer: 0
        why: |
          With pointers, a child can store any number of parent pointers, each pointing to an independently
          allocated parent object. The embedded-value approach can only put one parent at offset 0, so it is
          limited to single inheritance. Options B, C, and D are false.
        concept: "multiple-inheritance-approach"

      - kind: eipe
        q: "In one sentence, what is the central trade-off between the two inheritance approaches?"
        choices:
          - "Approach 1 is always faster, while approach 2 is always slower"
          - "Approach 1 uses less memory, while approach 2 uses no memory"
          - "Approach 1 couples the child to the parent's private layout but allows direct behavior reuse; approach 2 hides the parent and supports multiple parents at the cost of wrappers"
          - "Approach 1 requires C++, while approach 2 requires C99"
        answer: 2
        why: |
          The real trade-off is coupling versus flexibility: embedding gives direct reuse and a single object
          but exposes the parent's definition; a pointer gives encapsulation and multiple inheritance but needs
          forwarding wrappers and a second allocation. Options A, B, and D are false or trivial.
        concept: "approach-tradeoff"

      - kind: choose-better
        q: "Which design should you choose when the parent implementation is expected to change frequently?"
        choices:
          - |
            // Child embeds parent by value and includes the private header
            typedef struct { person_t person; } student_t;
          - |
            // Child holds a parent pointer and includes only the public header
            typedef struct { struct person_t* person; } student_t;
        answer: 1
        why: |
          The pointer approach compiles the child against only the public interface, so changing the parent's
          internal layout does not force the child to recompile. The embedded approach makes the child depend
          on the parent's exact layout.
        concept: "volatile-parent-choice"

      - kind: why-fails
        q: "Why can the embedded-value approach not provide multiple inheritance?"
        code: |
          typedef struct {
            person_t person;    /* must be first for upcasting */
            course_t course;    /* second embedded parent */
          } student_t;
        choices:
          - "Because C forbids more than one struct member"
          - "Because only the first field is at offset 0, so only one parent can be upcast safely"
          - "Because structs cannot contain other structs"
          - "Because the compiler rejects typedef names inside structs"
        answer: 1
        why: |
          Upcasting relies on the parent being at offset 0. A second embedded parent sits at a nonzero offset,
          so a student_t* cannot be cast to it. Thus the embedded approach supports only a single parent.
          Options A, C, and D are false.
        concept: "single-inheritance-limitation"

      - kind: predict
        q: "Predict the number of heap objects created by the second approach for one student."
        code: |
          student_t* s = student_new();
          student_ctor(s, "John", "Doe", 1987, "TA5667", 134);
        choices:
          - "One object"
          - "Two objects"
          - "Three objects"
          - "Zero objects"
        answer: 2
        why: |
          The student container, the separately allocated parent object, and the heap buffer for
          student_number are three distinct allocations. Option A describes the embedded-value approach,
          where the parent lives inside the child. Option B misses the string buffer.
        concept: "approach2-object-count"

  - id: b8
    type: model
    title: "Define Polymorphism: One Interface, Many Behaviors"
    explain_md: |
      Polymorphism is not a relationship between two classes; it is a technique for keeping
      the same code while producing different behaviors. The word means "many forms".

      Suppose `Cat` and `Duck` are children of `Animal`, and each has a `sound` behavior.
      Without polymorphism you must call a different function per type:

      ```c
      animal_sound(animal);
      cat_sound(cat);
      duck_sound(duck);
      ```

      With polymorphism you call the **same** function and pass different objects:

      ```c
      animal_sound(animal);
      animal_sound((struct animal_t*)cat);
      animal_sound((struct animal_t*)duck);
      ```

      Despite the identical call, each object produces its own sound. Passing different
      pointers changes the behavior behind `animal_sound`. This requires an inheritance
      relationship between the child classes and `Animal`, because we must be able to cast
      a `cat_t*` and a `duck_t*` to an `animal_t*`. That is why polymorphism in C uses the
      first, embedded-value approach.
    example:
      lang: c
      code: |
        #include <stdio.h>

        typedef struct {
          char* name;
        } animal_t;

        void animal_sound(animal_t* a) {
          printf("%s: Beeeep\n", a->name);
        }

        int main(void) {
          animal_t a = { .name = "Animal" };
          animal_sound(&a);
          return 0;
        }
    viz:
      kind: ascii-memory
      steps:
        - "Without polymorphism: animal_sound(animal); cat_sound(cat); duck_sound(duck);"
        - "With polymorphism: animal_sound(animal); animal_sound((animal_t*)cat); animal_sound((animal_t*)duck);"
        - "RUNTIME: each call dispatches to the behavior stored for that object"
        - "RESULT: Animal: Beeeep / Cat: Meow / Duck: Quacks"
    checks:
      - kind: mcq
        q: "What is the defining characteristic of polymorphic code?"
        from_chapter: ch09
        from_block: b2
        choices:
          - "It uses a different function for every object type"
          - "It forbids the use of pointers entirely"
          - "It requires every object to be allocated on the stack"
          - "It calls the same behavior function on different objects and gets different results"
        answer: 3
        why: |
          Polymorphism means one public interface yields different behaviors depending on the object passed.
          Option A is the non-polymorphic style. Options B and C are false constraints.
        concept: "polymorphism-definition"

      - kind: predict
        q: "Trace the non-polymorphic calls. What is printed?"
        code: |
          animal_sound(animal);
          cat_sound(cat);
          duck_sound(duck);
        choices:
          - "Animal: Beeeep / Animal: Beeeep / Animal: Beeeep"
          - "Cat: Meow / Duck: Quacks / Animal: Beeeep"
          - "Nothing is printed"
          - "Animal: Beeeep / Cat: Meow / Duck: Quacks"
        answer: 3
        why: |
          Each object is passed to its own specific function, so each prints its own sound in call order:
          Animal, then Cat, then Duck. Option A assumes a single shared function. Option B reorders the
          calls. Option C ignores the calls.
        concept: "non-polymorphic-output"

      - kind: why-fails
        q: "Why is a plain animal_sound function not polymorphic on its own?"
        code: |
          void animal_sound(animal_t* ptr) {
            printf("Animal: Beeeep\n");
          }
        choices:
          - "The function body is fixed, so every call produces the same output regardless of the pointer"
          - "The function lacks a return value"
          - "The function name is too long"
          - "The function must be declared static"
        answer: 0
        why: |
          The function always prints the same string; it never inspects the object to choose a behavior. A
          polymorphic function must dispatch through per-object state (a function pointer) to vary its result.
          Options B, C, and D are irrelevant.
        concept: "plain-function-not-polymorphic"

      - kind: eipe
        q: "In one sentence, what is the purpose of calling animal_sound with different object pointers?"
        choices:
          - "To make the program allocate more memory for each call"
          - "To force the compiler to inline the function"
          - "To reuse one behavior interface while letting each object supply its own implementation"
          - "To guarantee that all objects share the same name attribute"
        answer: 2
        why: |
          Polymorphism lets a single call site invoke different implementations depending on the object's
          runtime identity, so the calling code stays unchanged as subtypes are added. Options A, B, and D
          are false.
        concept: "polymorphism-purpose"

      - kind: trace
        q: "Trace the polymorphic dispatch. Which behavior runs for the cat object?"
        code: |
          animal_sound((struct animal_t*)cat);
        trace:
          headers: ["Step", "Call", "Object", "Dispatched Behavior"]
          rows:
            - step: 1
              line: 1
              cells: ["1", "animal_sound((animal_t*)cat)", "cat", "???"]
        target: {row: 0, col: 3}
        choices:
          - "cat's own sound behavior"
          - "the base Animal behavior"
          - "no behavior"
          - "a random behavior"
        answer: 0
        why: |
          In a polymorphic setup the object carries a pointer to its own implementation, so calling the shared
          interface on a cat dispatches the cat behavior. Option B is what a non-polymorphic base function
          would do. Options C and D are false.
        concept: "polymorphic-dispatch-trace"

  - id: b9
    type: design
    title: "Justify Polymorphism for Stable, Extensible Code"
    explain_md: |
      The main reason to use polymorphism is that it lets a piece of code stay "as is" while
      being used with many subtypes of a base type. Without it, every time you add a new
      subtype you must find and edit every place that switches on the type.

      Polymorphism also supports **abstraction**. Abstract types have vague or unimplemented
      behavior functions that child classes override. To write logic against an abstract
      type, you need a way to call the proper implementation when holding only a base
      pointer. Polymorphism is that mechanism.

      The cost of not having it grows quickly: maintaining a large project means repeatedly
      changing working logic whenever a subtype is added or a behavior changes. With
      polymorphism, the number of required changes drops dramatically.
    example:
      lang: c
      code: |
        #include <stdio.h>

        typedef struct {
          const char* name;
        } animal_t;

        void greet(animal_t* a) {
          printf("Hello, %s\n", a->name);
        }

        int main(void) {
          animal_t cat = { .name = "Cat" };
          animal_t duck = { .name = "Duck" };
          greet(&cat);
          greet(&duck);
          return 0;
        }
    viz:
      kind: ascii-memory
      steps:
        - "CALLER: greet(&cat) -> one function, no type switch"
        - "CALLER: greet(&duck) -> same function, different object"
        - "Adding a new subtype requires no change to greet()"
        - "Each object supplies its own behavior through the shared interface"
    checks:
      - kind: mcq
        q: "What is the primary maintenance benefit of polymorphism?"
        choices:
          - "It makes every function run faster"
          - "It removes the need for pointers"
          - "It lets calling code stay unchanged when new subtypes are added or a subtype's behavior changes"
          - "It guarantees that no function will ever be edited"
        answer: 2
        why: |
          Polymorphism centralizes behavior selection in the object, so callers depend only on the base
          interface. Adding a subtype or changing one behavior does not force edits at every call site.
          Options A, B, and D are false.
        concept: "polymorphism-maintenance-benefit"

      - kind: eipe
        q: "In one sentence, why do abstract types need polymorphism?"
        choices:
          - "Because abstract types cannot be allocated on the heap"
          - "Because polymorphism reduces the size of every object"
          - "Because a base pointer must be able to invoke the correct overridden implementation at runtime"
          - "Because abstract types are only allowed in header files"
        answer: 2
        why: |
          Abstract types define an interface without a concrete behavior. Polymorphism supplies the runtime
          dispatch that selects the child's override when the code holds only a base pointer. Options A, B,
          and D are false.
        concept: "abstract-type-dispatch"

      - kind: why-fails
        q: "Why does code that switches on object type become hard to maintain as subtypes are added?"
        code: |
          if (type == CAT) cat_sound(c);
          else if (type == DUCK) duck_sound(d);
          else animal_sound(a);
        choices:
          - "Because the compiler rejects else-if chains"
          - "Because C does not allow comparing types"
          - "Because else-if chains are slower than function calls"
          - "Because every new subtype forces you to find and edit each type switch"
        answer: 3
        why: |
          A type switch hard-codes the set of known subtypes. Adding a new subtype means locating and
          updating every switch, which is error-prone. Polymorphism moves that decision into the object.
          Options A, B, and C are false or irrelevant.
        concept: "type-switch-maintenance"

      - kind: choose-better
        q: "Which design best supports adding new animal subtypes without editing existing callers?"
        choices:
          - |
            // Type switch at every call site
            void make_sound(int type, void* a) {
              if (type == CAT) cat_sound(a);
              else if (type == DUCK) duck_sound(a);
            }
          - |
            // One interface, per-object behavior
            void make_sound(animal_t* a) {
              a->sound_func(a);
            }
        answer: 1
        why: |
          Option B dispatches through the object's function pointer, so adding a subtype requires no change
          to make_sound. Option A embeds the subtype list in the caller, forcing edits at every call site.
        concept: "polymorphism-vs-switch"

      - kind: predict
        q: "Predict the output of the greet-based program."
        code: |
          animal_t cat = { .name = "Cat" };
          animal_t duck = { .name = "Duck" };
          greet(&cat);
          greet(&duck);
        choices:
          - "Hello, Cat\nHello, Duck"
          - "Hello, Animal\nHello, Animal"
          - "Cat\nDuck"
          - "No output"
        answer: 0
        why: |
          greet prints the name of whichever object it receives. The first call prints Hello, Cat and the
          second prints Hello, Duck. Option B assumes a fixed base name. Option C omits the greeting text.
        concept: "greet-output-predict"

  - id: b10
    type: syntax
    title: "Dispatch Behavior Through a Function-Pointer Field"
    explain_md: |
      To make a behavior polymorphic in C, store a **function pointer** in the attribute
      structure. Each instance then carries its own implementation:

      ```c
      typedef void (*sound_func_t)(void*);
      typedef struct {
        char* name;
        sound_func_t sound_func;   /* points to this object's sound */
      } animal_t;
      ```

      The base constructor sets the pointer to a **default** implementation. The behavior
      function is a thin **relay**: it does not contain the logic, it calls whatever the
      pointer names.

      ```c
      void animal_sound(animal_t* animal) {
        animal->sound_func(animal);
      }
      ```

      If the pointer is changed to another function, that function is called instead. This
      indirection is the entire trick: the call site never changes, only the pointer's target
      changes. The `void*` argument lets one function-pointer type serve every class.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>

        typedef void (*sound_func_t)(void*);

        typedef struct {
          char* name;
          sound_func_t sound_func;
        } animal_t;

        void __animal_sound(void* this_ptr) {
          animal_t* animal = (animal_t*)this_ptr;
          printf("%s: Beeeep\n", animal->name);
        }

        animal_t* animal_new(void) {
          return (animal_t*)malloc(sizeof(animal_t));
        }

        void animal_ctor(animal_t* animal) {
          animal->name = (char*)malloc(10 * sizeof(char));
          strcpy(animal->name, "Animal");
          animal->sound_func = __animal_sound;
        }

        void animal_sound(animal_t* animal) {
          animal->sound_func(animal);   /* relay through the function pointer */
        }

        void animal_dtor(animal_t* animal) {
          free(animal->name);
        }

        int main(void) {
          animal_t* a = animal_new();
          animal_ctor(a);
          animal_sound(a);
          animal_dtor(a);
          free(a);
          return 0;
        }
    viz:
      kind: ascii-memory
      steps:
        - "animal_t { char* name; sound_func_t sound_func; }"
        - "animal_ctor: animal->sound_func = __animal_sound"
        - "animal_sound(animal): reads animal->sound_func and calls it with animal"
        - "RUNTIME: __animal_sound(animal) -> prints 'Animal: Beeeep'"
    checks:
      - kind: mcq
        q: "What does the sound_func field of animal_t store?"
        choices:
          - "A copy of the animal's name string"
          - "The address of the heap block that holds the animal"
          - "The address of the function that implements this object's sound behavior"
          - "A pointer to the next animal in a linked list"
        answer: 2
        why: |
          sound_func is a function pointer; it holds the address of a function, not data. Each instance's
          pointer selects which sound implementation runs. Options A, B, and D describe data pointers.
        concept: "function-pointer-field"

      - kind: predict
        q: "Predict which function is invoked when animal_sound(a) runs after animal_ctor(a)."
        code: |
          animal_t* a = animal_new();
          animal_ctor(a);
          animal_sound(a);
        choices:
          - "__animal_sound"
          - "__cat_sound"
          - "main"
          - "malloc"
        answer: 0
        why: |
          animal_ctor sets a->sound_func = __animal_sound. animal_sound relays through that pointer, so
          __animal_sound runs and prints Animal: Beeeep. Option B is the cat override, not set here.
        concept: "default-dispatch-predict"

      - kind: why-fails
        q: "Why must animal_sound relay through the function pointer instead of printing directly?"
        code: |
          void animal_sound(animal_t* animal) {
            animal->sound_func(animal);
          }
        choices:
          - "Because function pointers are faster than printf"
          - "Because the relay lets child objects substitute their own implementation without changing the call site"
          - "Because printf cannot be called from a behavior function"
          - "Because the compiler forbids direct output in structs"
        answer: 1
        why: |
          The relay is what makes the function polymorphic: the same call reaches different implementations
          depending on the pointer stored in the object. A direct print would hard-code one behavior.
          Options A, C, and D are false.
        concept: "relay-necessity"

      - kind: fillblank
        q: "Complete the relay call that invokes the function stored in the sound_func field:"
        code: |
          void animal_sound(animal_t* animal) {
            animal->_____(animal);
          }
        answer_text: "sound_func"
        why: |
          The field name sound_func holds the target function's address. Calling animal->sound_func(animal)
          dispatches to the implementation stored for that object.
        concept: "relay-field-syntax"

      - kind: trace
        q: "Trace the function-pointer dispatch. What does the call at Step 3 resolve to?"
        code: |
          animal_t* a = animal_new();
          animal_ctor(a);
          animal_sound(a);
        trace:
          headers: ["Step", "Line", "Operation", "a->sound_func"]
          rows:
            - step: 1
              line: 1
              cells: ["1", "1", "animal_new()", "uninitialized garbage"]
            - step: 2
              line: 2
              cells: ["2", "2", "animal_ctor(a)", "__animal_sound"]
            - step: 3
              line: 3
              cells: ["3", "3", "animal_sound(a)", "???"]
        target: {row: 2, col: 3}
        choices:
          - "__animal_sound (prints Animal: Beeeep)"
          - "__cat_sound"
          - "NULL"
          - "garbage"
        answer: 0
        why: |
          animal_ctor assigned __animal_sound to the field, and animal_sound relays through it, so __animal_sound
          executes. Options B, C, and D describe states that do not occur in this trace.
        concept: "dispatch-pointer-trace"

  - id: b11
    type: algorithm
    title: "Override the Function Pointer in the Child Constructor"
    explain_md: |
      Overriding is the act of replacing the inherited function pointer with a child-specific
      implementation. It happens in the child constructor:

      1. Call the parent constructor to set up the embedded parent and install the default
         pointer.
      2. Set the child's own fields.
      3. Reassign the function pointer to the child's function.

      ```c
      void cat_ctor(cat_t* cat) {
        animal_ctor((animal_t*)cat);          /* installs __animal_sound */
        strcpy(cat->animal.name, "Cat");
        cat->animal.sound_func = __cat_sound; /* override */
      }
      ```

      After this, every `cat` object calls `__cat_sound` when the shared `animal_sound`
      interface is used. The base class's default remains available for objects that do not
      override it. The main scenario only includes public headers and calls the same function
      on all three objects, yet each prints its own sound.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>

        typedef void (*sound_func_t)(void*);

        typedef struct {
          char* name;
          sound_func_t sound_func;
        } animal_t;

        void __animal_sound(void* this_ptr) {
          animal_t* animal = (animal_t*)this_ptr;
          printf("%s: Beeeep\n", animal->name);
        }

        void animal_ctor(animal_t* animal) {
          animal->name = (char*)malloc(10 * sizeof(char));
          strcpy(animal->name, "Animal");
          animal->sound_func = __animal_sound;
        }

        void animal_sound(animal_t* animal) {
          animal->sound_func(animal);
        }

        typedef struct {
          animal_t animal;
        } cat_t;

        void __cat_sound(void* this_ptr) {
          animal_t* animal = (animal_t*)this_ptr;
          printf("%s: Meow\n", animal->name);
        }

        cat_t* cat_new(void) {
          return (cat_t*)malloc(sizeof(cat_t));
        }

        void cat_ctor(cat_t* cat) {
          animal_ctor((animal_t*)cat);          /* parent ctor sets default pointer */
          strcpy(cat->animal.name, "Cat");
          cat->animal.sound_func = __cat_sound; /* override the behavior */
        }

        void cat_dtor(cat_t* cat) {
          free(cat->animal.name);
        }

        int main(void) {
          cat_t* c = cat_new();
          cat_ctor(c);
          animal_sound((animal_t*)c);           /* upcast then dispatch */
          cat_dtor(c);
          free(c);
          return 0;
        }
    viz:
      kind: ascii-memory
      steps:
        - "cat_new() -> cat_t at 0x2000 [animal garbage]"
        - "animal_ctor((animal_t*)cat) -> name='Animal', sound_func=__animal_sound"
        - "strcpy(cat->animal.name, \"Cat\") -> name='Cat'"
        - "cat->animal.sound_func = __cat_sound -> override installed"
        - "animal_sound((animal_t*)cat) -> relays to __cat_sound -> 'Cat: Meow'"
    checks:
      - kind: predict
        q: "Predict the output of the cat program."
        code: |
          cat_t* c = cat_new();
          cat_ctor(c);
          animal_sound((animal_t*)c);
        choices:
          - "Animal: Beeeep"
          - "Cat: Meow"
          - "Cat: Beeeep"
          - "Animal: Meow"
        answer: 1
        why: |
          cat_ctor overrides sound_func with __cat_sound, and animal_sound relays through it, so the output is
          Cat: Meow. Option A ignores the override. Option C keeps the default behavior. Option D mixes the
          base name with the cat sound.
        concept: "override-output-predict"

      - kind: order
        q: "Order the lines to implement the cat constructor with a correct override:"
        lines:
          - "animal_ctor((animal_t*)cat);"
          - "cat->animal.sound_func = __cat_sound;"
          - "strcpy(cat->animal.name, \"Cat\");"
          - "cat_t* cat = cat_new();"
          - "free(cat->animal.name);"
        answer_order: [3, 0, 2, 1]
        distractor_why:
          - "free(cat->animal.name);": "Freeing the name during construction destroys it before it can be printed."
        why: |
          Construction order: (1) allocate the cat, (2) run the parent constructor to install the default
          pointer and name buffer, (3) rename the object, (4) install the override. The override must come
          after the parent constructor sets the default.
        concept: "override-ctor-order"

      - kind: why-fails
        q: "Why must the override assignment appear after the parent constructor call?"
        code: |
          void cat_ctor(cat_t* cat) {
            cat->animal.sound_func = __cat_sound;
            animal_ctor((animal_t*)cat);
          }
        choices:
          - "Because the compiler rejects function-pointer assignments"
          - "Because animal_ctor would overwrite the override with the default __animal_sound"
          - "Because strcpy must come first"
          - "Because the parent constructor frees the cat object"
        answer: 1
        why: |
          animal_ctor sets sound_func = __animal_sound. If it runs after the override, it clobbers the
          override and the cat loses its behavior. The override must be installed last. Options A, C, and D
          are false.
        concept: "override-ordering"

      - kind: mcq
        q: "Where does the actual overriding of a polymorphic behavior take place?"
        choices:
          - "In the class's public header file"
          - "In the main function"
          - "In the linker's symbol table"
          - "In the child constructor, by reassigning the function-pointer field"
        answer: 3
        why: |
          Overriding is a runtime assignment: the child constructor stores the child function's address into
          the inherited sound_func field. Options A, B, and C are not where the substitution happens.
        concept: "override-location"

      - kind: spot-bug
        q: "Analyze the code and output. What is wrong with this cat constructor?"
        code: |
          void cat_ctor(cat_t* cat) {
            animal_ctor((animal_t*)cat);
            strcpy(cat->animal.name, "Cat");
            /* override assignment missing! */
          }
        diagnostic_log: |
          $ ./app
          Cat: Beeeep
          Expected:
          Cat: Meow
        target_line: 4
        choices:
          - "Line 2: animal_ctor must not be called"
          - "Line 3: strcpy is illegal on a function-pointer field"
          - "Line 4: the override is missing, so the default __animal_sound remains installed"
          - "Line 1: the constructor must return cat_t*"
        answer: 2
        why: |
          Without reassigning sound_func, the parent constructor's default __animal_sound stays in place, so
          the cat prints Beeeep instead of Meow. Options A, B, and D are false.
        concept: "missing-override-bug"

  - id: b12
    type: model
    title: "Connect Function Pointers to Virtual Functions"
    explain_md: |
      The function-pointer field is the C analogue of a **virtual function**. A virtual
      function is a behavior function that can be overridden by child classes. In C++ the
      compiler tracks these functions and places proper pointers into each object so that the
      right version is called at runtime.

      The book's example stores one pointer per polymorphic behavior. A richer design stores a
      table of pointers — a **vtable** — and each object holds a pointer to its class's table:

      ```c
      typedef struct { void (*sound)(void*); } animal_vtable_t;
      typedef struct { const animal_vtable_t* vptr; const char* name; } animal_t;
      ```

      Calling `a->vptr->sound(&a)` is exactly the dispatch C++ performs for a virtual call.
      The compiler builds and wires these tables automatically; in C we build them by hand.

      The key idea is the same in both languages: the object carries the information needed to
      choose its behavior at runtime, so the caller only needs the base interface.
    example:
      lang: c
      code: |
        #include <stdio.h>

        typedef struct animal_vtable {
          void (*sound)(void*);
        } animal_vtable_t;

        typedef struct {
          const animal_vtable_t* vptr;
          const char* name;
        } animal_t;

        static void __animal_sound(void* this_ptr) {
          animal_t* a = (animal_t*)this_ptr;
          printf("%s: Beeeep\n", a->name);
        }

        static const animal_vtable_t animal_vtable = { __animal_sound };

        int main(void) {
          animal_t a = { &animal_vtable, "Animal" };
          a.vptr->sound(&a);
          return 0;
        }
    viz:
      kind: ascii-memory
      steps:
        - "animal_vtable_t { void (*sound)(void*); }"
        - "animal_t { const animal_vtable_t* vptr; const char* name; }"
        - "RUNTIME: a.vptr -> &animal_vtable; a.vptr->sound -> __animal_sound"
        - "CALL: a.vptr->sound(&a) -> prints 'Animal: Beeeep'"
    checks:
      - kind: mcq
        q: "What is a virtual function?"
        choices:
          - "A behavior function that can be overridden by child classes and is dispatched through per-object pointers"
          - "A function that is compiled away by the preprocessor"
          - "A function that can only be called from main()"
          - "A function that returns void and takes no arguments"
        answer: 0
        why: |
          A virtual function is an overridable behavior whose concrete implementation is selected at runtime via
          pointers stored in the object (or its vtable). Options B, C, and D are false.
        concept: "virtual-function-definition"

      - kind: eipe
        q: "In one sentence, why does C++ track virtual functions and place pointers in objects?"
        choices:
          - "To make the objects larger and slower"
          - "To allow a base-class pointer to invoke the correct overridden implementation at runtime"
          - "To prevent any function from being overridden"
          - "To remove the need for constructors"
        answer: 1
        why: |
          The per-object pointers are the dispatch mechanism: they let one base interface reach the right
          child implementation. Options A, C, and D are false.
        concept: "virtual-dispatch-purpose"

      - kind: predict
        q: "Predict what the compiler does for a virtual call in C++."
        choices:
          - "It deletes the function to save space"
          - "It converts the call into a macro expansion"
          - "It follows the object's function pointer to the correct implementation at runtime"
          - "It inlines the base implementation unconditionally"
        answer: 2
        why: |
          A virtual call is an indirect call through the object's function pointer (or vtable), resolving the
          target at runtime. Options A, B, and D describe non-virtual behavior.
        concept: "virtual-call-runtime"

      - kind: why-fails
        q: "Why is a plain non-virtual C++ member function not polymorphic?"
        code: |
          struct animal {
            void sound() { /* fixed implementation */ }
          };
        choices:
          - "Because C++ forbids functions inside structs"
          - "Because the call is resolved at compile time to the base implementation, with no runtime dispatch"
          - "Because the function must be declared const"
          - "Because structs cannot have member functions"
        answer: 1
        why: |
          Without the virtual keyword the compiler binds the call statically to the base implementation, so a
          base pointer never reaches a child override. Options A, C, and D are false.
        concept: "non-virtual-static-binding"

      - kind: trace
        q: "Trace the vtable dispatch. What does the call at Step 3 resolve to?"
        code: |
          animal_t a = { &animal_vtable, "Animal" };
          a.vptr->sound(&a);
        trace:
          headers: ["Step", "Line", "Operation", "Resolved Function"]
          rows:
            - step: 1
              line: 1
              cells: ["1", "1", "a.vptr = &animal_vtable", "animal_vtable"]
            - step: 2
              line: 1
              cells: ["2", "1", "a.vptr->sound", "__animal_sound"]
            - step: 3
              line: 2
              cells: ["3", "2", "a.vptr->sound(&a)", "???"]
        target: {row: 2, col: 3}
        choices:
          - "__animal_sound"
          - "NULL"
          - "garbage"
          - "main"
        answer: 0
        why: |
          The vtable's sound slot holds __animal_sound, so the indirect call dispatches there and prints
          Animal: Beeeep. Options B, C, and D do not match the vtable contents.
        concept: "vtable-dispatch-trace"
