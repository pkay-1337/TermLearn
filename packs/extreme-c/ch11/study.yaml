blocks:
  - id: b1
    type: model
    title: "Recognize the is-a (to-be) Inheritance Relationship"
    explain_md: |
      Inheritance, also called the **extension** or **to-be** relationship, expresses an *is-a*
      relationship between two classes: a `Student` *is a* `Person`. It differs from the
      composition and aggregation "to-have" relationships of the previous chapter. Where a car
      *has* an engine, a student *is* a person who additionally carries student-specific data.

      In C we model a class as an attribute structure. The child structure repeats every
      parent attribute and then adds its own. Here `student_t` extends `person_t` with
      `student_number` and `passed_credits`.

      Digging deeper, an inheritance relationship is really a **composition relationship in
      its nature**: a student has a person's nature inside it. We can therefore place a
      `person_t` variable directly inside `student_t` instead of copying the fields. Because
      the parent object is embedded as the first field, a pointer to the child and a pointer
      to the embedded parent can refer to the very same memory address.

      The parent is called the supertype, base type, or parent type; the child is the
      subtype or inherited subtype. Whenever a domain contains an is-a relationship, it is a
      candidate for inheritance.
    example:
      lang: c
      code: |
        #include <stdio.h>

        typedef struct {
          char first_name[32];
          char last_name[32];
          unsigned int birth_year;
        } person_t;

        typedef struct {
          person_t person;              /* parent embedded as first field */
          char student_number[16];
          unsigned int passed_credits;
        } student_t;

        int main(void) {
          student_t s;
          s.person.birth_year = 1987;
          s.passed_credits = 134;
          printf("student is a person, birth year %u\n", s.person.birth_year);
          return 0;
        }
      subgoals:
        - label: "Declare the parent attribute structure"
          lines: [4, 5, 6, 7, 8]
        - label: "Extend the parent with child-specific attributes"
          lines: [10, 11, 12, 13, 14, 15]
        - label: "Read inherited state through the embedded parent"
          lines: [18, 19, 20]
    viz:
      kind: ascii-memory
      steps:
        - "TYPE: person_t { char[32] first_name; char[32] last_name; uint birth_year; }"
        - "TYPE: student_t { person_t person; char[16] student_number; uint passed_credits; }"
        - "RUNTIME: student_t s; -> s.person at offset 0 (the parent lives inside the child)"
        - "RUNTIME: s.person.birth_year = 1987 -> writes into the embedded person_t block"
        - "RUNTIME: &s == (void*)&s.person -> child pointer and parent pointer share one address"
    checks:
      - kind: predict
        q: "Trace line by line. After the two assignments, what does s.person.birth_year hold?"
        code: |
          student_t s;
          s.person.birth_year = 1987;
          s.passed_credits = 134;
        choices:
          - "134"
          - "0"
          - "1987"
          - "Undefined garbage"
        answer: 2
        why: |
          The assignment on line 2 writes 1987 into the embedded person_t member s.person.birth_year.
          The assignment on line 3 targets the child-specific passed_credits field, leaving birth_year
          unchanged. Option A reads the sibling field. Option D ignores the explicit assignment.
        concept: "inherited-state-read"

      - kind: mcq
        q: "Why is an inheritance relationship said to be a composition relationship in its nature?"
        choices:
          - "Because both relationships require virtual function pointers"
          - "Because inheritance forbids adding new attributes to the child"
          - "Because the parent object must always be allocated before the child object"
          - "Because the child structure embeds the parent object and reuses its storage"
        answer: 3
        why: |
          Inheritance is a to-be relationship whose implementation is a one-to-one composition: the child
          embeds a parent object inside its own attribute structure, so the parent's storage is reused.
          Option A conflates inheritance with polymorphism. Option C describes aggregation ordering.
          Option B is false; extension adds new attributes.
        concept: "inheritance-as-composition"

      - kind: why-fails
        q: "Why does modeling a student by copying person fields instead of embedding person_t make inheritance hard to use?"
        code: |
          typedef struct {
            char first_name[32];
            char last_name[32];
            unsigned int birth_year;
            char student_number[16];
            unsigned int passed_credits;
          } student_t;
        choices:
          - "Copied fields are automatically inherited by every function in the program"
          - "The compiler rejects structs that contain more than four members"
          - "Copied fields force all attributes to be stored in the heap segment"
          - "A student_t pointer can no longer be cast to a person_t pointer and reused with person behavior functions"
        answer: 3
        why: |
          Copying the fields breaks the structural identity that inheritance relies on: there is no embedded
          person_t block at offset 0, so a student_t pointer cannot be upcast to a person_t pointer, and the
          Person class's behavior functions cannot operate on the student object. Option A is nonsense.
          Options B and C are false language claims.
        concept: "field-copy-breaks-upcast"

      - kind: eipe
        q: "In one sentence, what is the purpose of embedding person_t as the first field of student_t?"
        choices:
          - "It guarantees that every student_t occupies exactly the same number of bytes as person_t"
          - "It prevents the child structure from declaring any additional attributes"
          - "It lets a student object reuse the Person class's behavior functions through a parent-typed pointer"
          - "It makes the parent object shared among all student instances"
        answer: 2
        why: |
          Embedding the parent as the first field makes the child's address identical to the embedded parent's
          address, so a student_t* can be upcast to a person_t* and handed to Person's behavior functions.
          Option A is false (the child is larger). Option B is false (children add attributes).
          Option D is false (each instance has its own copy).
        concept: "first-field-purpose"

      - kind: trace
        q: "Trace the memory layout. What is the relationship between &s and &s.person?"
        code: |
          student_t s;
        trace:
          headers: ["Step", "Expression", "Address", "Meaning"]
          rows:
            - step: 1
              line: 1
              cells: ["1", "&s", "0x7ffd10", "Start of the whole student_t object"]
            - step: 2
              line: 1
              cells: ["2", "&s.person", "???", "Start of the embedded person_t member"]
        target: {row: 1, col: 2}
        choices:
          - "0x7ffd00 (one byte before)"
          - "0x7ffd10 (identical address)"
          - "0x7ffd18 (after the parent block)"
          - "Unrelated heap addresses"
        answer: 1
        why: |
          The parent is the first field of student_t, so it begins at the same address as the child object.
          &s and &s.person are numerically equal; this is what makes upcasting valid. Options A, C, and D
          ignore the first-field placement rule.
        concept: "first-field-address-trace"

  - id: b2
    type: syntax
    title: "Embed the Parent Structure as the First Field and Upcast"
    explain_md: |
      The first approach to inheritance in C keeps a **structure variable** of the parent type
      inside the child's attribute structure, and that variable **must be the first field**:

      ```c
      typedef struct {
        person_t person;        /* first field */
        char student_number[16];
        unsigned int passed_credits;
      } student_t;
      ```

      Because the parent is at offset 0, a `student_t*` and a `person_t*` that point to the
      same object hold the **same address**. Casting a child pointer to a parent pointer is
      called **upcasting**. It is safe only because of the first-field placement.

      Upcasting lets us reuse the parent's behavior functions on a child object: we pass the
      upcast pointer to `person_get_first_name` and the function reads the embedded parent
      fields. This is the payoff of inheritance: behavior reuse without rewriting code.

      If the parent were not the first field, the child pointer would point at the parent's
      offset inside the struct, not at offset 0, and the two pointers would differ. The cast
      would then read the wrong bytes.
    example:
      lang: c
      code: |
        #include <stdio.h>

        typedef struct {
          char first_name[32];
          char last_name[32];
          unsigned int birth_year;
        } person_t;

        typedef struct {
          person_t person;
          char student_number[16];
          unsigned int passed_credits;
        } student_t;

        int main(void) {
          student_t s;
          student_t* s_ptr = &s;
          person_t* p_ptr = (person_t*)&s;
          printf("s_ptr = %p\n", (void*)s_ptr);
          printf("p_ptr = %p\n", (void*)p_ptr);
          return 0;
        }
    viz:
      kind: ascii-memory
      steps:
        - "RUNTIME: student_t s; -> s at 0x7ffd10, s.person at 0x7ffd10"
        - "RUNTIME: s_ptr = &s -> 0x7ffd10"
        - "RUNTIME: p_ptr = (person_t*)&s -> 0x7ffd10 (same address, upcast)"
        - "RUNTIME: person_get_first_name(p_ptr, buf) -> reads s.person.first_name"
    checks:
      - kind: predict
        q: "Trace the upcast. What is the relationship between s_ptr and p_ptr at runtime?"
        code: |
          student_t s;
          student_t* s_ptr = &s;
          person_t* p_ptr = (person_t*)&s;
        choices:
          - "s_ptr == p_ptr (same address)"
          - "p_ptr is 32 bytes higher than s_ptr"
          - "p_ptr is 16 bytes lower than s_ptr"
          - "The two pointers are unrelated"
        answer: 0
        why: |
          The parent field is the first member of student_t, so it begins at offset 0. The cast
          (person_t*)&s therefore yields the same numeric address as &s. Option B assumes the parent
          sits after the child fields. Option C invents a negative offset. Option D ignores the cast.
        concept: "upcast-address-equality"

      - kind: mcq
        q: "Why does placing person_t as the first field make upcasting valid?"
        choices:
          - "Because the C standard requires all structs to start with a pointer"
          - "Because upcasting is only valid for structs with exactly one member"
          - "Because the compiler reorders fields to put the parent first"
          - "Because the first field is always stored at the lowest offset, so the child and parent share an address"
        answer: 3
        why: |
          The first declared field is laid out at offset 0. The parent object and the child object therefore
          start at the same byte, which is precisely the condition that makes a child-to-parent pointer cast
          meaningful.           Option A is false. Option C is false; C never reorders fields. Option B is false.
        concept: "first-field-upcast-rule"

      - kind: why-fails
        q: "Why does moving the person field below the child fields break upcasting?"
        code: |
          typedef struct {
            char student_number[16];
            unsigned int passed_credits;
            person_t person;   /* NOT first anymore */
          } student_t;
        choices:
          - "The compiler rejects any struct that contains a nested struct"
          - "The parent is no longer at offset 0, so a student_t* and a person_t* point to different addresses"
          - "Nested structs are forbidden in C99"
          - "The child fields automatically inherit the parent's methods"
        answer: 1
        why: |
          Upcasting depends on the parent living at offset 0. Once the parent is moved down, &student and
          &student->person differ by the size of the preceding fields, so a person_t* built from the child
          pointer reads the wrong bytes. Options A, C, and D are false claims about C.
        concept: "parent-not-first-breaks-upcast"

      - kind: trace
        q: "Trace the addresses. What value does p_ptr hold after the upcast?"
        code: |
          student_t s;
          student_t* s_ptr = &s;
          person_t* p_ptr = (person_t*)&s;
        trace:
          headers: ["Step", "Expression", "Address", "Notes"]
          rows:
            - step: 1
              line: 1
              cells: ["1", "&s", "0x7ffd10", "student object base"]
            - step: 2
              line: 2
              cells: ["2", "s_ptr", "0x7ffd10", "points at the student"]
            - step: 3
              line: 3
              cells: ["3", "p_ptr", "???", "upcast result"]
        target: {row: 2, col: 2}
        choices:
          - "0x7ffd10"
          - "0x7ffd00"
          - "0x7ffd40"
          - "NULL"
        answer: 0
        why: |
          The cast (person_t*)&s produces the same address as &s because the parent occupies offset 0.
          Option B subtracts a byte. Option C adds a spurious offset. Option D confuses a cast with a NULL
          assignment.
        concept: "upcast-address-trace"

      - kind: fillblank
        q: "Complete the upcast expression that reinterprets a student pointer as a person pointer:"
        code: |
          person_t* p_ptr = (_____)&s;
        answer_text: "person_t*"
        why: |
          The cast operator names the target pointer type. Writing (person_t*)&s tells the compiler to treat
          the address of s as the address of a person_t, which is valid because person_t is the first field.
        concept: "upcast-cast-syntax"

  - id: b3
    type: model
    title: "Explain Why Incomplete Types Cannot Be Nested by Value"
    explain_md: |
      A forward declaration such as `struct person_t;` creates an **incomplete type**: the
      compiler knows the tag exists but not its fields or its byte size.

      You may declare **pointers** to an incomplete type, because every data pointer has a
      fixed width (8 bytes on a 64-bit machine) regardless of the pointee. But you may **not**
      declare a **variable** of an incomplete type, and you may not allocate heap memory for
      it, because the compiler cannot compute how many bytes to reserve.

      This is why the nested-by-value form of inheritance needs the *complete* definition of
      the parent. If the child's attribute structure contains `person_t person;` while only
      `struct person_t;` is visible, the compiler reports "field has incomplete type".

      The consequence is architectural: the child class must see the parent's real layout.
      That is the root of the two approaches compared later — share the private definition,
      or hide it behind a pointer and the public interface.
    example:
      lang: c
      code: |
        #include <stdlib.h>

        struct person_t;   /* incomplete: only the tag is known */

        typedef struct {
          struct person_t* person;   /* pointer to incomplete type is legal */
          char student_number[16];
        } student_t;

        int main(void) {
          student_t s;
          s.person = NULL;
          return 0;
        }
    viz:
      kind: ascii-memory
      steps:
        - "COMPILE: struct person_t; -> tag known, size unknown (incomplete)"
        - "COMPILE: struct person_t* person; -> 8 bytes reserved, legal"
        - "COMPILE: struct person_t person; -> ERROR: field has incomplete type"
        - "COMPILE: person_t* p = malloc(sizeof(person_t)); -> ERROR: invalid application of sizeof to incomplete type"
    checks:
      - kind: mcq
        q: "Why does the C compiler allow a pointer to an incomplete type but reject a variable of that type?"
        choices:
          - "All data pointers have a fixed byte width, while a variable needs the pointee's full size to reserve storage"
          - "Pointers are stored in a separate segment that ignores struct sizes"
          - "Incomplete types are automatically replaced by void* during compilation"
          - "Variables of incomplete types are allowed only inside function bodies"
        answer: 0
        why: |
          A pointer is just an address with a known width, so the compiler can lay out a struct containing it
          without knowing the pointee's fields. A by-value variable needs the exact byte count and alignment,
          which an incomplete type does not provide. Options B, C, and D are false.
        concept: "incomplete-pointer-vs-value"

      - kind: why-fails
        q: "Why does this nested inheritance attempt fail to compile?"
        code: |
          struct person_t;   /* forward declaration only */

          typedef struct {
            struct person_t person;   /* by value */
            char student_number[16];
          } student_t;
        choices:
          - "Structs cannot contain other structs in C"
          - "The compiler cannot determine the byte size of student_t because struct person_t is incomplete"
          - "The person field must be declared static"
          - "Nested structs are only allowed in header files"
        answer: 1
        why: |
          To embed a struct by value the compiler must know its total size and alignment. A forward
          declaration leaves the size unknown, so the compiler cannot compute the layout of student_t and
          rejects the field. Option A is false (nested structs are legal when complete). Options C and D
          are false.
        concept: "incomplete-nested-value-error"

      - kind: predict
        q: "Predict the value returned by this expression on a 64-bit system:"
        code: |
          struct person_t;
          size_t get_size(void) {
            return sizeof(struct person_t*);
          }
        choices:
          - "0"
          - "8"
          - "32"
          - "Compilation failure"
        answer: 1
        why: |
          sizeof on a pointer is always valid, even to an incomplete type, because a pointer is a fixed-width
          address. On a 64-bit machine it is 8 bytes. Option D is the common misconception that incomplete
          types break sizeof; they only break sizeof on the type itself.
        concept: "pointer-size-incomplete"

      - kind: eipe
        q: "In one sentence, what does a forward declaration of a struct allow a translation unit to do?"
        choices:
          - "It lets the unit define variables of that struct by value"
          - "It lets the unit allocate the struct on the heap without knowing its size"
          - "It lets the unit replace the struct with a union of the same name"
          - "It lets the unit declare pointers to the struct before the full definition is available"
        answer: 3
        why: |
          A forward declaration registers the tag so pointers to the type can be formed and structs can be
          laid out with those pointers, without needing the field list. Options A and B require the complete
          type. Option C is unrelated.
        concept: "forward-decl-purpose"

      - kind: spot-bug
        q: "Analyze the code and compiler error. What is the fundamental cause of the failure?"
        code: |
          struct person_t;

          typedef struct {
            struct person_t person;   /* line 4 */
            char student_number[16];
          } student_t;
        diagnostic_log: |
          error: field 'person' has incomplete type 'struct person_t'
                  struct person_t person;
                                  ^
        target_line: 4
        choices:
          - "Line 2: the forward declaration must be inside a header file"
          - "Line 4: the field has incomplete type, so the compiler cannot size student_t"
          - "Line 5: char arrays cannot follow a struct field"
          - "Line 1: typedef is missing from the struct definition"
        answer: 1
        why: |
          The compiler knows the tag person_t but not its size. A by-value member needs a known size to fix
          the outer struct's layout, so the compiler rejects line 4. Options A, C, and D do not match the
          diagnostic.
        concept: "incomplete-field-diagnosis"

  - id: b4
    type: design
    title: "Share the Parent's Private Definition Through a Private Header"
    explain_md: |
      To embed a parent by value, the child needs the parent's **complete** definition. But the
      parent's public header must keep the definition hidden so that unrelated code cannot
      inspect the parent's internals. The solution is a **private header file**.

      A private header is an ordinary header included only by the code that truly needs the
      definition. For the `Person` class we keep two headers:

      - `person.h` — the public interface: a forward declaration `struct person_t;` plus the
        allocator, constructor, destructor, and behavior functions.
      - `person_p.h` — the private header: the actual `person_t` field definitions.

      `person.c` includes the private header and implements the class. `student.c` also
      includes the private header so it can embed `person_t person;` as its first field.
      Nobody else sees the definition, so encapsulation holds for the rest of the program.

      This is the first approach to inheritance: the child has access to the parent's
      private implementation, which is why the two classes are strongly coupled.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>

        /* person.h (public): the tag stays incomplete */
        struct person_t;
        struct person_t* person_new(void);
        void person_ctor(struct person_t*, const char*, const char*, unsigned int);
        void person_dtor(struct person_t*);
        unsigned int person_get_birth_year(struct person_t*);

        /* person_p.h (private): the complete definition */
        typedef struct person_t {
          char first_name[32];
          char last_name[32];
          unsigned int birth_year;
        } person_t;

        struct person_t* person_new(void) {
          return (person_t*)malloc(sizeof(person_t));
        }

        void person_ctor(struct person_t* p, const char* fn,
                         const char* ln, unsigned int by) {
          strcpy(p->first_name, fn);
          strcpy(p->last_name, ln);
          p->birth_year = by;
        }

        void person_dtor(struct person_t* p) { (void)p; }

        unsigned int person_get_birth_year(struct person_t* p) {
          return p->birth_year;
        }

        int main(void) {
          struct person_t* p = person_new();
          person_ctor(p, "John", "Doe", 1987);
          printf("Birth year: %u\n", person_get_birth_year(p));
          person_dtor(p);
          free(p);
          return 0;
        }
    viz:
      kind: ascii-memory
      steps:
        - "person.h: struct person_t; (incomplete) + function prototypes"
        - "person_p.h: typedef struct person_t { ... } person_t; (complete, private)"
        - "person.c: #include person_p.h -> implements person_new/ctor/dtor/getters"
        - "student.c: #include person_p.h -> can embed person_t person; at offset 0"
    checks:
      - kind: mcq
        q: "What is the role of a private header file in the first inheritance approach?"
        choices:
          - "It stores the compiled object code of the parent class"
          - "It replaces the need for a public header file"
          - "It is automatically generated by the linker"
          - "It exposes the parent's complete attribute structure only to the classes that need it"
        answer: 3
        why: |
          The private header carries the parent's real field definitions and is included only by the parent
          implementation and the child that embeds it. Everyone else sees only the public header with its
          forward           declaration. Options A, B, and C misdescribe the mechanism.
        concept: "private-header-role"

      - kind: predict
        q: "Predict whether student.c can see person_t's fields when it includes only the public person.h."
        code: |
          /* student.c */
          #include "person.h"   /* only the public header */
        choices:
          - "No; person_t is incomplete in the public header, so its fields cannot be accessed"
          - "Yes; all struct fields are public in C"
          - "Yes; the compiler reads fields from the linked object file"
          - "Only if student.c also declares the fields itself"
        answer: 0
        why: |
          The public header only forward-declares struct person_t, so its fields are unknown in student.c.
          Without the private header the child cannot embed or touch the parent's fields. Option B is false;
          C has no access control but needs the definition. Option C is false; the compiler never reads field
          layouts from object files. Option D would be a copy, not inheritance.
        concept: "public-header-incomplete"

      - kind: why-fails
        q: "Why must the public person.h NOT contain the complete definition of person_t?"
        code: |
          /* person.h */
          typedef struct {
            char first_name[32];
            char last_name[32];
            unsigned int birth_year;
          } person_t;
        choices:
          - "Because structs cannot be defined in header files"
          - "Because the definition would make the header uncompilable"
          - "Because it would break the C preprocessor include guards"
          - "Because it would expose the parent's private internals to every translation unit that includes the header"
        answer: 3
        why: |
          The whole point of information hiding is that clients depend only on the public behavior functions.
          Publishing the field layout lets any includer read and mutate private state directly, defeating
          encapsulation. Options A, B, and C are false.
        concept: "public-header-encapsulation"

      - kind: choose-better
        q: "Which header arrangement correctly supports the first inheritance approach while preserving encapsulation?"
        choices:
          - |
            /* person.h: complete definition */
            typedef struct { char first_name[32]; } person_t;
            /* person_p.h: nothing */
          - |
            /* person.h: forward declaration + API */
            struct person_t;
            struct person_t* person_new(void);
            /* person_p.h: complete definition */
            typedef struct person_t { char first_name[32]; } person_t;
        answer: 1
        why: |
          Option B hides the layout in a private header while still giving the child access through that
          private header. Option A publishes the layout to every client, breaking information hiding and
          defeating the reason for having a private header at all.
        concept: "private-header-design-choice"

      - kind: fillblank
        q: "Complete the private header's tagged struct declaration so the child can embed the parent by value:"
        code: |
          typedef struct _____ {
            char first_name[32];
            char last_name[32];
            unsigned int birth_year;
          } person_t;
        answer_text: "person_t"
        why: |
          Tagging the struct with its own name (`struct person_t`) makes the type complete and lets the public
          header's forward declaration refer to the same tag. Without the tag the anonymous typedef and
          `struct person_t` would be two different types.
        concept: "private-header-struct-tag"

  - id: b5
    type: algorithm
    title: "Drive the Parent Constructor and Destructor Through Upcasting"
    explain_md: |
      In the first approach the child constructor must initialize the embedded parent. It does
      so by **upcasting** the child pointer to a parent pointer and calling the parent
      constructor:

      ```c
      person_ctor((person_t*)student, first_name, last_name, birth_year);
      ```

      The cast is valid because `person` is the first field. The parent constructor writes
      into the child's memory at offset 0, exactly where the parent lives.

      Destruction runs in the opposite order. The child destructor first frees its own
      resources (for example the heap-allocated `student_number`), then calls the parent
      destructor on the upcast pointer. This is the same bottom-up rule as composition: child
      resources are released before the parent is torn down.

      The main scenario then upcasts the student to a `person_t*` and reuses the Person
      behavior functions, proving that the child truly inherits the parent's behavior.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>
        #include <string.h>

        typedef struct person_t {
          char first_name[32];
          char last_name[32];
          unsigned int birth_year;
        } person_t;

        typedef struct student_t {
          person_t person;
          char* student_number;
          unsigned int passed_credits;
        } student_t;

        void person_ctor(person_t* p, const char* fn, const char* ln, unsigned int by) {
          strcpy(p->first_name, fn);
          strcpy(p->last_name, ln);
          p->birth_year = by;
        }

        void person_dtor(person_t* p) { (void)p; }

        student_t* student_new(void) {
          return (student_t*)malloc(sizeof(student_t));
        }

        void student_ctor(student_t* s, const char* fn, const char* ln, unsigned int by,
                          const char* number, unsigned int credits) {
          person_ctor((person_t*)s, fn, ln, by);   /* upcast to parent */
          s->student_number = (char*)malloc(16 * sizeof(char));
          strcpy(s->student_number, number);
          s->passed_credits = credits;
        }

        void student_dtor(student_t* s) {
          free(s->student_number);                 /* child first */
          person_dtor((person_t*)s);              /* then parent */
        }

        int main(void) {
          student_t* s = student_new();
          student_ctor(s, "John", "Doe", 1987, "TA5667", 134);
          person_t* p = (person_t*)s;              /* upcast */
          printf("Birth year: %u\n", p->birth_year);
          student_dtor(s);
          free(s);
          return 0;
        }
    viz:
      kind: ascii-memory
