        why: "The compiler accesses width at (%rax) (offset 0) and length at 4(%rax) (offset 4) based on struct field byte alignment."
        concept: struct-offset-assembly-trace

  - id: b7
    type: model
    title: "Single Inheritance Memory Layout: C vs. g++"
    explain_md: |
      In Chapter 08, we introduced Approach 1: embedding the parent struct
      as the very first member of the child struct at offset 0.
      
      Does a commercial C++ compiler (`g++`) use this exact same strategy?
      
      In Example 9.2, we compile two identical inheritance hierarchies:
      - C: `b_t` embeds `a_t parent;` as its first member, followed by `char str[5];`.
      - C++: `class B : public A { char str[5]; };`.
      
      Using GDB to inspect memory at `&b` (`x/7c &b`):
      - C Output:   `'A'  'B'  '1'  '2'  '3'  '4'  '\0'`
      - C++ Output: `'A'  'B'  '1'  '2'  '3'  '4'  '\0'`
      
      **The Takeaway**:
      In single inheritance, C++ compilers lay out object memory **identically**
      to C Approach 1! The base class attributes are placed at offset 0, followed
      immediately by the derived class attributes.
    viz:
      kind: ascii-memory
      steps:
        - |
          GDB Memory Inspection Comparison (&b):
          
          C Version:
          (gdb) x/7c &b
          0x7fffffffe261: 65 'A'  66 'B'  49 '1'  50 '2'  51 '3'  52 '4'  0 '\000'
          
          C++ Version:
          (gdb) x/7c &b
          0x7fffffffe251: 65 'A'  66 'B'  49 '1'  50 '2'  51 '3'  52 '4'  0 '\000'
          
          Byte Layout:
          [ Byte 0: A.c ] [ Byte 1: A.d ] [ Bytes 2-6: B.str ("1234\0") ]
          |<------- Base Class A -------->|<--------- Derived B --------->|
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <string.h>
        
        typedef struct {
            char c;
            char d;
        } a_t;
        
        typedef struct {
            a_t parent; /* Offset 0 */
            char str[5];
        } b_t;
        
        int main(void) {
            b_t b;
            b.parent.c = 'A';
            b.parent.d = 'B';
            strncpy(b.str, "1234", 5);
            
            unsigned char* p = (unsigned char*)&b;
            for (int i = 0; i < 7; i++) {
                printf("[%d]=%c ", i, p[i] ? p[i] : '0');
            }
            printf("\n");
            return 0;
        }
      explain_md: |
        Iterating byte-by-byte through `&b` prints `[0]=A [1]=B [2]=1 [3]=2 [4]=3 [5]=4 [6]=0`.
        The base members occupy the first 2 bytes, followed contiguously by the
        derived array.
      subgoals:
        - label: "Embed base at offset 0"
          lines: [9, 10, 11, 12]
        - label: "Verify contiguous memory layout"
          lines: [20, 21, 22, 23]
    checks:
      - kind: trace
        q: "Trace the byte values stored at &b across the first 3 bytes:"
        code: |
          b_t b;
          b.parent.c = 'A';
          b.parent.d = 'B';
          strncpy(b.str, "1234", 5);
        trace:
          headers: ["Offset (Bytes)", "Member Name", "Stored Character"]
          rows:
            - ["0", "b.parent.c", "A"]
            - ["1", "b.parent.d", "B"]
            - ["2", "b.str[0]", "1"]
        target: {row: 2, col: 2}
        answer_text: "1"
        why: "Offset 0 is b.parent.c ('A'), offset 1 is b.parent.d ('B'), and offset 2 is b.str[0] ('1')."
        concept: single-inheritance-byte-trace
      - kind: mcq
        q: "Why does upcasting `(A*)&b` require zero runtime pointer arithmetic in single inheritance?"
        choices:
          - "Because A and B are converted to void* at compile time."
          - "Because base class A is placed at offset 0; the address of b is identical to the address of b.parent."
          - "Because C++ compilers use a global hash table for pointer conversions."
          - "Because the operating system handles pointer casting via page faults."
        answer: 1
        why: "When the base class is at offset 0, its memory address is numerically identical to the derived class address, requiring no pointer adjustment."
        concept: zero-offset-upcast-invariance
      - kind: predict
        q: "If `class A` has size 8 bytes, and `class B : public A` adds 12 bytes of attributes, what is `sizeof(B)` (assuming default alignment)?"
        choices:
          - "Zero bytes"
          - "20 bytes (or 24 bytes with alignment padding)"
          - "12 bytes (base class is discarded)"
          - "8 bytes"
        answer: 1
        why: "Derived class B embeds the 8 bytes of base A plus its own 12 bytes, resulting in 20 bytes (padded to 24 for 8-byte alignment)."
        concept: derived-struct-size-calculation

  - id: b8
    type: model
    title: "Multiple Inheritance in C: The Offset Collision Problem"
    explain_md: |
      In Chapter 08, we noted that Approach 1 (embedded struct at offset 0)
      can only support **single inheritance**. Why?
      
      Consider attempting multiple inheritance in C:
      ```c
      typedef struct {
          a_t a; /* Offset 0 */
          b_t b; /* Offset sizeof(a_t) */
          char str[5];
      } c_t;
      ```
      
      **The Offset Collision**:
      - `&c_obj` points to byte 0.
      - `a_ptr = (a_t*)&c_obj;` -> points to byte 0 (`a_t`). **SAFE!**
      - `b_ptr = (b_t*)&c_obj;` -> points to byte 0 (`a_t`), NOT `b_t`! **CATASTROPHIC!**
      
      Because C pointer casting is passive (it only alters type interpretation,
      never the numeric memory address), `b_ptr` points to the fields of `a_t`!
      Dereferencing `b_ptr->field` reads or corrupts `a_t` data!
      
      **The Manual C Fix**:
      To upcast to `b_t*` in C, the programmer **must perform manual pointer arithmetic**:
      ```c
      b_t* b_ptr = (b_t*)((char*)&c_obj + sizeof(a_t));
      ```
    viz:
      kind: ascii-memory
      steps:
        - |
          Multiple Inheritance Offset Collision in C:
          
          Address:      [ 0x1000 ............. 0x1008 ] [ 0x1008 ............. 0x1010 ]
          Members:      [ a_t a                       ] [ b_t b                       ]
                        +-----------------------------+-------------------------------+
                        | a_t attributes              | b_t attributes                |
                        +-----------------------------+-------------------------------+
                        ^                             ^
                        |                             |
          (a_t*)&c_obj -+                             +-- (b_t*)((char*)&c_obj + sizeof(a_t))
          (c_t*)&c_obj -+                                 (Correct manual offset!)
          (b_t*)&c_obj -+ (WRONG! Points to a_t!)
    example:
      lang: c
      code: |
        #include <stdio.h>
        
        typedef struct { int x; int y; } a_t;
        typedef struct { double u; double v; } b_t;
        
        typedef struct {
            a_t a; /* Offset 0: 8 bytes */
            b_t b; /* Offset 8: 16 bytes */
        } c_t;
        
        int main(void) {
            c_t obj = {{10, 20}, {3.14, 2.71}};
            
            /* WRONG: naive cast points to a_t */
            b_t* bad_b = (b_t*)&obj;
            printf("Bad cast reads u: %f (Corrupted garbage!)\n", bad_b->u);
            
            /* CORRECT: manual offset arithmetic */
            b_t* good_b = (b_t*)((char*)&obj + sizeof(a_t));
            printf("Good cast reads u: %.2f\n", good_b->u);
            return 0;
        }
      explain_md: |
        `bad_b` interprets the integers `x` and `y` as a 64-bit IEEE 754 float,
        printing garbage. `good_b` adjusts the address by `sizeof(a_t)` bytes,
        correctly reaching the `b_t` member.
      subgoals:
        - label: "Embed multiple parent structs"
          lines: [6, 7, 8, 9]
        - label: "Demonstrate corrupted naive cast"
          lines: [15, 16]
        - label: "Demonstrate correct manual pointer arithmetic"
          lines: [19, 20]
    checks:
      - kind: why-fails
        q: "Why does naive upcasting `b_t* b = (b_t*)&obj;` corrupt data when `b_t` is the second embedded struct?"
        choices:
          - "The printf function cannot format structs with multiple parents."
          - "The C compiler automatically zeroes out memory during multiple inheritance."
          - "Second members in structs cannot be accessed via pointers."
          - "C casts are passive: they change the pointer type without modifying the numeric address, causing b to point to the first struct (a_t)."
        answer: 3
        why: "Section Inheritance: Casting in C does not perform pointer arithmetic. Assigning (b_t*)&obj copies the base address (offset 0), pointing to a_t instead of b_t."
        concept: passive-cast-offset-collision
      - kind: spot-bug
        q: "Identify the defect in this manual pointer adjustment attempt:"
        code: |
          c_t obj;
          /* Attempting to get pointer to second base b_t */
          b_t* b_ptr = (b_t*)(&obj + sizeof(a_t));
        diagnostic_log: |
          Bug: &obj has type c_t*. Adding sizeof(a_t) advances the pointer by
          sizeof(a_t) * sizeof(c_t) bytes, pointing far outside the object!
        target_line: 3
        choices:
          - "Pointer arithmetic scaling error: adding to c_t* scales by sizeof(c_t); must cast to char* (or uint8_t*) first!"
          - "Missing ampersand before a_t."
          - "sizeof operator cannot be used on typedefs."
          - "b_t* cannot be assigned to b_ptr."
        answer: 0
        why: "Pointer arithmetic in C is scaled by the size of the referenced type. &obj is a c_t*. Adding 8 advances by 8 * sizeof(c_t) bytes! You must cast to (char*)&obj first to advance in raw single bytes."
        concept: pointer-scaling-bug
      - kind: choose-better
        q: "Why is manual pointer arithmetic in C multiple inheritance considered fragile in production code?"
        choices:
          - "Pointer arithmetic is prohibited in C99."
          - "Operating systems refuse to run binaries containing char* casts."
          - "If members in a_t change size or struct padding shifts, hardcoded offsets silently misalign, causing subtle data corruption."
          - "Pointer arithmetic disables CPU branch prediction."
        answer: 2
        why: "Relying on manual pointer arithmetic couples code to exact struct sizes. Any change in compiler flags, padding, or base struct fields breaks the manual offset calculations."
        concept: manual-offset-fragility

  - id: b9
    type: model
    title: "Multiple Inheritance in C++: Active Pointer Arithmetic"
    explain_md: |
      How does C++ solve the multiple inheritance offset collision?
      
      **The C++ Breakthrough**:
      In C++, **casting is an ACTIVE operation**!
      
      When a class `D` inherits from multiple classes:
      ```cpp
      class D : public A, public B, public C { ... };
      ```
      The compiler embeds `A` at byte 0, `B` immediately after `A`, and `C`
      immediately after `B`.
      
      When upcasting:
      ```cpp
      D d;
      A* ap = &d; /* ap = 0x...25a (offset 0) */
      B* bp = &d; /* bp = 0x...25f (+5 bytes = sizeof(A)!) */
      C* cp = &d; /* cp = 0x...261 (+7 bytes = sizeof(A)+sizeof(B)!) */
      ```
      
      GDB inspection from Shell Box 9-7 proves that the pointer values are
      **numerically different**:
      - `print ap` -> `0x7fffffffe25a`
      - `print bp` -> `0x7fffffffe25f`
      
      The C++ compiler automatically inserts pointer addition instructions!
      When passing `bp` to any `B` member function, the address already points
      directly to the `B` sub-object!
    viz:
      kind: ascii-memory
      steps:
        - |
          GDB Output Showing Active Pointer Arithmetic in C++ (Shell Box 9-7):
          
          (gdb) print ap
          $1 = (A *) 0x7fffffffe25a    <-- Offset 0
          (gdb) print bp
          $2 = (B *) 0x7fffffffe25f    <-- Offset +5 bytes (+sizeof(A))
          (gdb) print cp
          $3 = (C *) 0x7fffffffe261    <-- Offset +7 bytes (+sizeof(A)+sizeof(B))
          (gdb) print dp
          $4 = (D *) 0x7fffffffe25a    <-- Offset 0 (D starts at A)
          
          C++ compiler adjusts pointer values automatically during assignment!
    example:
      lang: c
      code: |
        /* Conceptual C emulation of C++ active pointer adjustment */
        #include <stdio.h>
        
        typedef struct { char a; char b[4]; } A_t; /* 5 bytes */
        typedef struct { char c; char d; }    B_t; /* 2 bytes */
        typedef struct {
            A_t a_part;
            B_t b_part;
        } D_t;
        
        /* Emulating what the C++ compiler generates under the hood */
        B_t* upcast_to_B(D_t* d) {
            if (!d) return NULL;
            return (B_t*)((char*)d + sizeof(A_t)); /* Automatic pointer shift! */
        }
        
        int main(void) {
            D_t d = {{'A', "BBB"}, {'C', 'D'}};
            B_t* bp = upcast_to_B(&d);
            printf("d address:  %p\n", (void*)&d);
            printf("bp address: %p\n", (void*)bp);
            printf("Offset diff: %td bytes\n", (char*)bp - (char*)&d);
            return 0;
        }
      explain_md: |
        The difference between `bp` and `&d` is exactly `sizeof(A_t)` (5 bytes).
        In C++, writing `B* bp = &d;` automatically injects this exact pointer
        arithmetic without any manual developer intervention.
      subgoals:
        - label: "Emulate compiler pointer adjustment function"
          lines: [12, 13, 14, 15]
        - label: "Verify pointer offset difference"
          lines: [21, 22]
    checks:
      - kind: predict
        q: "In the C++ multiple inheritance example (class D : public A, public B), if &d is 0x1000 and sizeof(A) is 8 bytes, what value is stored in B* bp = &d?"
        choices:
          - "NULL"
          - "0x1016"
          - "0x1000"
          - "0x1008"
        answer: 3
        why: "Section Inheritance: The C++ compiler adjusts the pointer by adding the offset of B within D (which is sizeof(A) = 8 bytes), yielding 0x1008."
        concept: cpp-pointer-adjustment-predict
      - kind: mcq
        q: "What fundamental difference exists between pointer casting in C versus C++?"
        choices:
          - "C casting only works on void*."
          - "C++ casting is performed at link time only."
          - "C casting is passive (never changes the numeric address value); C++ upcasting in multiple inheritance can actively perform pointer arithmetic."
          - "C casting allocates heap memory; C++ casting does not."
        answer: 2
        why: "Section Inheritance: C casts simply re-interpret existing addresses. C++ casts in multiple inheritance hierarchies actively add or subtract byte offsets to align with sub-object layouts."
        concept: active-vs-passive-casting
      - kind: trace
        q: "Trace the pointer difference when upcasting to the third base class C in class D : public A, public B, public C (where sizeof(A)=5, sizeof(B)=2):"
        code: |
          D d; /* allocated at 0x2000 */
          C* cp = &d;
        trace:
          headers: ["Step", "Calculation", "Resulting Address"]
          rows:
            - ["1", "Base address of D", "0x2000"]
            - ["2", "Add sizeof(A) + sizeof(B)", "0x2000 + 5 + 2"]
            - ["3", "Assigned to cp", "0x2007"]
        target: {row: 2, col: 2}
        answer_text: "0x2007"
        why: "Class C is located after A (5 bytes) and B (2 bytes), placing its sub-object at offset 0x2000 + 7 = 0x2007."
        concept: multiple-inheritance-offset-trace

  - id: b10
    type: design
    title: "Virtual Method Tables (Vtables) in C & C++"
    explain_md: |
      In Chapter 08 and earlier in this chapter, we stored function pointers
      directly inside our structs.
      
      Now let us synthesize the complete architecture: **Virtual Tables (vtables)**.
      
      **The C++ Vtable Architecture**:
      1. For each class defining virtual functions, the compiler generates a
         single static, read-only table of function pointers: the `vtable`.
      2. Each object instance stores only **one pointer** (the `vptr`),
         pointing to the shared class `vtable`.
      3. For pure virtual functions (`virtual void func() = 0;`), the vtable
         slot points to a special abort handler (e.g. `__cxa_pure_virtual`).
      
      **The Constructor Initialization Rule**:
      In both C and C++, the virtual table / function pointers are populated
      **during constructor execution**:
      - Base constructor runs first -> sets virtual pointers to base implementations.
      - Child constructor runs second -> updates virtual pointers to derived implementations.
      
      **CRITICAL ARCHITECTURAL WARNING**:
      **NEVER call virtual functions inside constructors or destructors!**
      Inside a base constructor, the child constructor has not yet run.
      Calling a virtual method will invoke the base version or crash on a pure
      virtual NULL pointer!
    example:
      lang: c
      code: |
        #include <stdio.h>
        
        /* C implementation of a Vtable */
        typedef struct shape_vtable_t shape_vtable_t;
        
        typedef struct {
            const shape_vtable_t* vptr; /* Single pointer to shared table! */
            char name[16];
        } shape_t;
        
        struct shape_vtable_t {
            double (*area)(void* self);
            void (*draw)(void* self);
        };
        
        /* Shared read-only vtables (one per class!) */
        static double __circle_area(void* self) { return 3.14; }
        static void __circle_draw(void* self) { printf("Drawing circle\n"); }
        
        static const shape_vtable_t CIRCLE_VTABLE = {
            .area = __circle_area,
            .draw = __circle_draw
        };
        
        typedef struct {
            shape_t base;
            double radius;
        } circle_t;
        
        void circle_ctor(circle_t* c, double r) {
            c->base.vptr = &CIRCLE_VTABLE; /* Bind object to class vtable! */
            c->radius = r;
        }
      explain_md: |
        Instead of duplicating function pointers inside every circle instance,
        every circle points to the single shared static table `CIRCLE_VTABLE`.
        1,000 circles consume only 8 bytes each for `vptr`!
      subgoals:
        - label: "Define shared vtable structure"
          lines: [11, 12, 13, 14]
        - label: "Instantiate static constant vtable"
          lines: [20, 21, 22, 23]
        - label: "Assign vptr in constructor"
          lines: [31, 32]
    checks:
      - kind: why-fails
        q: "Why is calling a virtual function inside a base class constructor considered a dangerous anti-pattern in C and C++?"
        choices:
          - "Because virtual functions delete the stack frame."
          - "Because the C standard forbids calling functions from constructors."
          - "Because constructors run in user mode while virtual functions require kernel mode."
          - "Because the derived constructor has not executed yet; the vtable/function pointer still points to the base version (or NULL for pure virtuals)."
        answer: 3
        why: "Section Polymorphism: Constructors execute base-first. When the base constructor runs, derived overrides have not yet been installed. Calling a virtual method will call the base implementation or crash on a pure virtual NULL."
        concept: virtual-call-in-constructor
      - kind: mcq
        q: "What does the C++ runtime function `__cxa_pure_virtual` do if invoked?"
        choices:
          - "It dynamically recompiles the class."
          - "It returns 0 and allows execution to continue."
          - "It prints an error diagnostic ('pure virtual method called') and immediately aborts the program."
          - "It launches an interactive debugger."
        answer: 2
        why: "In C++, pure virtual slots in a vtable point to __cxa_pure_virtual. If invoked (e.g. through an illegal constructor call), it aborts the process to prevent executing undefined memory."
        concept: cxa-pure-virtual-behavior
      - kind: order
        q: "Arrange the chronological steps of vtable dispatch for `shape->vptr->area(shape)`:"
        lines:
          - "Read the vptr address from the shape instance (offset 0)."
          - "Index into the vtable at the area offset to retrieve the function pointer."
          - "Execute the retrieved function passing shape as self."
        answer_order: [0, 1, 2]
        why: "Dynamic dispatch first dereferences the instance's vptr, fetches the method pointer from the vtable, and jumps to the concrete function."
        concept: vtable-dispatch-steps

  - id: b11
    type: design
    title: "The Grand OOP Synthesis: Encapsulation to Abstraction"
    explain_md: |
      We have journeyed through the four pillars of Object-Oriented Programming
      in pure C across Chapters 06, 07, 08, and 09:
      
      1. **Encapsulation (Chapter 06 / ch09)**:
         - Separating public contract (`*.h`) from private implementation (`*.c`).
         - Incomplete types (`struct person_t;`) hide memory layout and member names.
         - Constructors/destructors manage explicit memory lifecycles.
      2. **Relationships: Composition & Aggregation (Chapter 07 / ch10)**:
         - **Composition**: Container owns subordinate; co-dependent lifetimes;
           container constructor creates subordinate, container destructor frees it.
         - **Aggregation**: Subordinate exists independently; loose association;
           attached/detached dynamically; container destructor NEVER frees subordinate!
      3. **Inheritance & Polymorphism (Chapter 08 / ch11)**:
         - **Approach 1**: Embedded base struct at offset 0 enables zero-overhead upcasting.
         - **Approach 2**: Opaque parent pointer enables pure encapsulation and multiple inheritance.
         - **Polymorphism**: Base function pointers relay calls to derived overrides.
      4. **Abstraction (Chapter 09 / ch12)**:
         - Abstract classes and pure interfaces decouple high-level logic from concrete subtypes.
         - Pure virtual functions represented by `NULL` function pointers.
         - Bridging C to C++: `vptr`/`vtable` optimization and active pointer arithmetic.
    checks:
      - kind: mcq
        from_chapter: ch09
        q: "Interleaved Review (Ch. 09): What is the primary purpose of declaring an incomplete type `struct account_t;` in a public header file?"
        choices:
          - "To enforce strict encapsulation: client code cannot inspect or modify struct members, and must interact solely through public API functions."
          - "To reduce stack frame size by making all struct members 1 byte."
          - "To allow clients to allocate accounts without calling account_new()."
          - "To allow the linker to inline all functions automatically."
        answer: 0
        why: "In Ch09, incomplete types act as opaque handles. Hiding the struct layout from clients prevents direct member tampering and allows library internals to change without breaking client code."
        concept: opaque-pointer-encapsulation
      - kind: mcq
        from_chapter: ch10
        q: "Interleaved Review (Ch. 10): In player_dtor(), why is calling `free(player->gun)` a catastrophic architectural bug if the relationship is Aggregation?"
        choices:
          - "Because the C library requires gun to be freed before player."
          - "Because in aggregation, the player does NOT own the gun; freeing it causes double-free errors or destroys an object still in use elsewhere in the application."
          - "Because gun was allocated on the stack."
          - "Because player->gun is a const pointer that cannot be freed."
        answer: 1
        why: "In Ch10, aggregation models loose borrowing. The container does not own the subordinate. Destructors must only release owned resources (composition), never borrowed resources (aggregation)."
        concept: aggregation-ownership-lifetime
      - kind: mcq
        from_chapter: ch11
        q: "Interleaved Review (Ch. 11): In Approach 1 inheritance, why MUST the base struct `person_t` be the first member of `student_t`?"
        choices:
          - "To prevent malloc() from failing."
          - "To allow the compiler to pack the struct into a single 64-bit integer."
          - "To guarantee that the memory address of student_t is identical to person_t (offset 0), enabling direct pointer upcasting without offset arithmetic."
          - "Because the C99 standard forbids having child attributes before parent attributes."
        answer: 2
        why: "In Ch11, placing the base struct at offset 0 guarantees that (person_t*)&student points directly to the base fields, allowing base functions to be reused without forwarding wrappers."
        concept: offset-zero-upcasting-review
      - kind: choose-better
        q: "A high-reliability avionics system needs an extensible sensor suite. Which combination of OOP techniques provides maximum safety and modularity?"
        choices:
          - "Allow sensors to directly modify the telemetry processor's internal state variables."
          - "Use multiple inheritance with raw manual pointer arithmetic in client code."
          - "Define a pure interface sensor_interface_t with function pointers; implement sensors as incomplete types in separate .c files; pass interface pointers to telemetry processors."
          - "Put all sensor data in one giant global union and use switch-case statements across 50 sensor IDs."
        answer: 2
        why: "Combining pure interfaces (Ch09/12), opaque types (Ch06/09), and polymorphic function pointers (Ch08/11) creates a decoupled, highly testable, and robust architecture."
        concept: grand-oop-synthesis

cards:
  - id: ch12-c01-abstraction-principle
    q: "What is the Abstraction Principle in computer programming?"
    a: "Each significant piece of functionality should be implemented in just one place. Where similar functions are performed by distinct pieces of code, combine them by abstracting out varying parts."
  - id: ch12-c02-interface-vs-abstract-class
    q: "How does an Interface differ from an Abstract Class in C?"
    a: "An interface contains only function pointer signatures and zero state attributes. An abstract class contains state attributes and/or default behaviors alongside at least one pure virtual function."
  - id: ch12-c03-pure-virtual-in-c
    q: "How is a pure virtual function represented in C?"
    a: "By a function pointer member in the attribute structure that is initialized to NULL in the constructor, indicating no default implementation exists at that level."
  - id: ch12-c04-cpp-this-pointer
    q: "How does g++ pass the 'this' pointer to member functions under the System V AMD64 ABI?"
    a: "In the %rdi register as the first argument, generating identical assembly instructions to a C function taking an explicit struct pointer."
  - id: ch12-c05-active-pointer-casting
    q: "Why is upcasting in C++ multiple inheritance considered an 'active' operation?"
    a: "Because the compiler automatically adds byte offsets to the pointer address so that the resulting pointer points directly to the desired sub-object."
  - id: ch12-c06-vtable-pattern
    q: "Why does C++ use a virtual table (vtable) instead of storing function pointers in each object?"
    a: "To eliminate pointer duplication. Each object stores only one 8-byte pointer (vptr) pointing to a single shared static class table containing all virtual function pointers."

lab:
  title: "Abstract Device Interface in C"
  prompt_md: |
    ### Objective
    Implement a clean, extensible Hardware Abstraction Layer (HAL) in pure C
    using an **Abstract Device Interface** (`device_t`) and a concrete
    `temp_sensor_t` implementation.
    
    ### Requirements
    1. Complete `device_ctor` in `starter.c`:
       - Initialize `device->read` to `NULL` (pure virtual!).
       - Initialize `device->close` to `NULL` (pure virtual!).
    2. Implement the public polymorphic relay functions:
       - `device_read`: Guard against `NULL` device or `read` pointer; call and return `device->read(device, buf, max_len)`. Return `-1` on error.
       - `device_close`: Guard against `NULL` device or `close` pointer; invoke `device->close(device)`.
    3. Complete `temp_sensor_ctor`:
       - Call `device_ctor((device_t*)sensor)` to initialize base interface.
       - Set `sensor->temp_celsius = initial_temp`.
       - **Override** the pure virtual methods:
         - `sensor->base.read = __temp_sensor_read;`
         - `sensor->base.close = __temp_sensor_close;`
    4. Implement `__temp_sensor_read`:
       - Format `"TEMP: %.1f C"` into `buf` using `snprintf`.
       - Return number of bytes written.
    5. Implement `__temp_sensor_close`:
       - Set `sensor->temp_celsius = 0.0`.
  starter_c: |
    #include <stdio.h>
    #include <stdlib.h>
    #include <string.h>
    
    /* Function pointer signatures taking generic this pointer */
    typedef int (*device_read_fn)(void* self, char* buf, size_t max_len);
    typedef void (*device_close_fn)(void* self);
    
    /* Pure Interface: ZERO state, ONLY pure virtual function pointers */
    typedef struct {
        device_read_fn read;
        device_close_fn close;
    } device_t;
    
    void device_ctor(device_t* dev) {
        /* TODO 1: Initialize pure virtual function pointers to NULL */
    }
    
    int device_read(device_t* dev, char* buf, size_t max_len) {
        /* TODO 2: Defensively check pointers, then relay through dev->read */
        return -1;
    }
    
    void device_close(device_t* dev) {
        /* TODO 3: Defensively check pointers, then relay through dev->close */
    }
    
    /* Concrete Temperature Sensor Implementation */
    typedef struct {
        device_t base; /* Offset 0 */
        double temp_celsius;
    } temp_sensor_t;
    
    static int __temp_sensor_read(void* self, char* buf, size_t max_len) {
        /* TODO 4: Format temperature string into buf */
        temp_sensor_t* s = (temp_sensor_t*)self;
        return snprintf(buf, max_len, "TEMP: %.1f C", s->temp_celsius);
    }
    
    static void __temp_sensor_close(void* self) {
        /* TODO 5: Reset temperature to 0.0 */
        temp_sensor_t* s = (temp_sensor_t*)self;
        s->temp_celsius = 0.0;
    }
    
    void temp_sensor_ctor(temp_sensor_t* s, double initial_temp) {
        /* TODO 6: Call base constructor, set temp, override pure virtuals */
    }
    
    int main(void) {
        temp_sensor_t sensor;
        temp_sensor_ctor(&sensor, 23.5);
        
        device_t* dev = (device_t*)&sensor;
        char buffer[32];
        device_read(dev, buffer, sizeof(buffer));
        printf("Device output: %s\n", buffer);
        
        device_close(dev);
        return 0;
    }
  tests_sh: |
    cat << 'EOF' > test_runner.c
    #include <stdio.h>
    #include <assert.h>
    #include <string.h>
    
    int main(void) {
        /* Test 1: Uninitialized base returns -1 defensively */
        device_t raw_dev;
        device_ctor(&raw_dev);
        char dummy[16];
        assert(device_read(&raw_dev, dummy, 16) == -1);
        
        /* Test 2: Concrete sensor polymorphic read */
        temp_sensor_t sensor;
        temp_sensor_ctor(&sensor, 42.0);
        device_t* dev = (device_t*)&sensor;
        
        char buf[32];
        int bytes = device_read(dev, buf, sizeof(buf));
        assert(bytes > 0);
        assert(strcmp(buf, "TEMP: 42.0 C") == 0);
        
        /* Test 3: Polymorphic close */
        device_close(dev);
        assert(sensor.temp_celsius == 0.0);
        
        printf("All abstract device tests passed successfully!\n");
        return 0;
    }
    EOF
    gcc -Wall -Wextra -std=c99 -O0 -c starter.c -o starter.o || exit 1
    gcc -Wall -Wextra -std=c99 -O0 starter.c -o starter_bin || exit 1
    ./starter_bin > /dev/null || exit 1
    sed -i '/int main(void)/,$d' starter.c
    cat test_runner.c >> starter.c
    gcc -Wall -Wextra -std=c99 -O0 starter.c -o test_bin || exit 1
    ./test_bin || exit 1
  hints:
    - "In device_ctor, initialize dev->read = NULL and dev->close = NULL."
    - "In device_read, check: if (!dev || !dev->read) return -1; then return dev->read(dev, buf, max_len);"
    - "In temp_sensor_ctor, call device_ctor((device_t*)s), assign s->temp_celsius = initial_temp, and set s->base.read = __temp_sensor_read and s->base.close = __temp_sensor_close."
