blocks:
  - id: b1
    type: syntax
    title: "The Abstraction Principle & Abstract Data Types"
    explain_md: |
      In object-oriented software engineering, abstraction is the discipline of
      organizing code around general data types rather than concrete implementations.
      
      Consider direct relationships between concrete entities:
      - `Human` eats `Apple`.
      - `Human` eats `Orange`.
      
      If we add `Banana`, `Grape`, and `Mango`, the `Human` class becomes burdened
      with dozens of specific dependencies.
      
      Instead, we introduce an abstract type: `Fruit`.
      Now: `Human` eats `Fruit` (where `Fruit` is an abstract parent of `Apple` and `Orange`).
      
      We can ascend to even higher levels of abstraction:
      - `Human` eats `Salad` or `Chocolate` -> `Human` eats `Eatable`.
      - A `Dog` or `Cat` also eats -> `Eater` eats `Eatable`.
      
      **The Abstraction Principle**:
      "Each significant piece of functionality in a program should be implemented
      in just one place. Where similar functions are carried out by distinct pieces
      of code, combine them by abstracting out the varying parts."
      
      **The Danger of Over-Abstraction**:
      Introducing abstract layers when no variation is anticipated adds cognitive
      friction, pointer indirection, and maintenance overhead without architectural
      benefit. Abstract only where genuine variation exists!
    example:
      lang: c
      code: |
        #include <stdio.h>
        
        /* Concrete types with no common abstraction */
        typedef struct { int weight; } apple_t;
        typedef struct { int weight; } orange_t;
        
        /* Specific, tightly-coupled functions */
        void human_eat_apple(const apple_t* a) {
            printf("Eating apple (%d g)\n", a->weight);
        }
        void human_eat_orange(const orange_t* o) {
            printf("Eating orange (%d g)\n", o->weight);
        }
        
        int main(void) {
            apple_t a = {150};
            orange_t o = {200};
            human_eat_apple(&a);
            human_eat_orange(&o);
            return 0;
        }
      explain_md: |
        In this brittle design, adding 20 food types requires writing 20 distinct
        `human_eat_*` functions. Client code must track every concrete type explicitly,
        violating the Open-Closed Principle.
      subgoals:
        - label: "Define concrete structs"
          lines: [4, 5]
        - label: "Define redundant concrete handlers"
          lines: [8, 9, 10, 11, 12, 13]
    checks:
      - kind: choose-better
        q: "A game engine features 50 monster types. The combat system needs to inflict damage on them. Which design best adheres to the Abstraction Principle?"
        choices:
          - "Write 50 separate functions: combat_attack_goblin(), combat_attack_dragon(), etc."
          - "Create 10 intermediate abstract layers: PhysicalObject -> MovableEntity -> SentientCreature -> HostileEntity -> Monster -> Goblin."
          - "Pass all monsters as void* and use runtime string comparisons on monster names."
          - "Define an abstract target_t (or damageable_t) interface with a take_damage() function, and have combat logic interact exclusively with target_t*."
        answer: 3
        why: "Abstracting damageable entities into a single target_t contract allows combat systems to process any monster subtype uniformly without modifying combat logic when new monsters are added."
        concept: abstraction-decoupling
      - kind: mcq
        q: "What architectural pathology is known as 'Over-Abstraction'?"
        choices:
          - "Naming abstract structs in uppercase letters."
          - "Creating deep hierarchies of abstract data types that solve no current or foreseeable variation, increasing complexity with zero payoff."
          - "Writing more than 100 lines of code in a single C source file."
          - "Using typedef struct instead of plain struct."
        answer: 1
        why: "Section Abstraction: Over-abstraction occurs when developers create speculative, deeply nested abstract interfaces with no practical need, increasing boilerplate and indirection."
        concept: over-abstraction-risk
      - kind: why-fails
        q: "Why is a concrete type like `Apple` unable to serve as an abstract type for `Orange`?"
        choices:
          - "Structs in C cannot have subtypes."
          - "Apple contains concrete specialized assumptions (taste, texture, seeds) that do not generalize to other fruits."
          - "The C compiler forbids casting between two structs with different names."
          - "Apple occupies more memory than Orange on 64-bit platforms."
        answer: 1
        why: "Concrete types carry specific physical state and implementation constraints. An abstract type abstracts away varying details so distinct subtypes can share a single relationship."
        concept: concrete-vs-abstract

  - id: b2
    type: design
    title: "Abstract Classes vs. Pure Interfaces in C"
    explain_md: |
      In object-oriented theory, incomplete types fall along a spectrum:
      
      1. **Concrete Class**:
         - Fully implemented attributes and behaviors.
         - Can be directly instantiated on stack or heap (`apple_new()`).
      2. **Abstract Class**:
         - Contains some data attributes and/or default behaviors.
         - Has at least ONE pure virtual behavior function with **no default implementation**.
         - **Cannot be instantiated** directly because its contract is incomplete!
      3. **Interface (Pure Abstract Type)**:
         - Contains **zero data attributes** (no state).
         - Exposes **only pure virtual behavior function pointers**.
         - Serves as a pure contract connecting decoupled software components.
      
      In C, both abstract classes and interfaces are represented as structs
      containing function pointers, but an interface struct contains *only*
      function pointer members!
    example:
      lang: c
      code: |
        #include <stddef.h>
        
        typedef enum { SWEET, SOUR, BITTER } taste_t;
        
        /* Function pointer signature taking generic 'this' pointer */
        typedef taste_t (*get_taste_func_t)(void*);
        
        /* Pure Interface: ZERO state attributes, ONLY virtual behavior pointer */
        typedef struct {
            get_taste_func_t get_taste_func;
        } eatable_t;
        
        /* Abstract Class: Has state attributes + pure virtual behavior pointer */
        typedef struct {
            char label[32];                  /* State attribute */
            int calories;                    /* State attribute */
            get_taste_func_t get_taste_func; /* Pure virtual behavior */
        } food_item_t;
      explain_md: |
        `eatable_t` is a pure interface: it contains zero state members.
        `food_item_t` is an abstract class: it maintains concrete state
        (`label`, `calories`), but leaves `get_taste_func` to be defined by
        concrete subclasses.
      subgoals:
        - label: "Define pure interface struct"
          lines: [9, 10, 11]
        - label: "Define abstract class with state and virtual function"
          lines: [14, 15, 16, 17, 18]
    checks:
      - kind: mcq
        q: "What is the structural difference between an Abstract Class and an Interface in C?"
        choices:
          - "An abstract class cannot be inherited."
          - "An interface cannot use typedef."
          - "An interface must be compiled with g++, while an abstract class is compiled with gcc."
          - "An interface contains only function pointer signatures and zero state attributes; an abstract class may contain data attributes alongside pure virtual function pointers."
        answer: 3
        why: "Section Abstraction: An interface exposes functionalities without offering any state or implementation. An abstract class may bundle common state and partial behavior while leaving specific functions pure virtual."
        concept: interface-vs-abstract-class
      - kind: why-fails
        q: "Why is it an architectural error to instantiate an object directly from an Interface in C?"
        choices:
          - "Because interfaces are automatically deleted by the linker."
          - "Because the C standard library malloc() rejects structs smaller than 16 bytes."
          - "Because an interface provides no concrete implementation; invoking its behavior function pointers will dereference NULL and crash!"
          - "Because interfaces consume kernel memory."
        answer: 2
        why: "An interface defines only abstract contracts. Its virtual function pointers are initially NULL. Calling a function on an interface instance attempts to jump to address 0x0, triggering an immediate segmentation fault."
        concept: interface-instantiation-hazard
      - kind: choose-better
        q: "You are designing a cross-platform cryptographic plugin system. How should third-party hash algorithms be defined?"
        choices:
          - "As a pure interface hash_algorithm_t containing only function pointers: init(), update(), finalize()."
          - "As a monolithic concrete struct containing buffers for SHA256, MD5, and AES."
          - "As global static functions with hardcoded algorithm IDs."
          - "As an incomplete type that third parties edit in the engine's private source code."
        answer: 0
        why: "A pure interface establishes a strict behavioral contract without imposing state constraints, allowing plugins to supply arbitrary hashing implementations seamlessly."
        concept: plugin-interface-design

  - id: b3
    type: algorithm
    title: "Pure Virtual Functions & The NULL Pointer Trap"
    explain_md: |
      How do we express in C that a virtual function has **no default implementation**
      at the base level?
      
      We initialize its function pointer member to `NULL` in the constructor!
      
      ```c
      void eatable_ctor(eatable_t* eatable) {
          /* No default implementation exists: pure virtual! */
          eatable->get_taste_func = NULL;
      }
      ```
      
      **The Public Relay Function**:
      The public behavior function checks or relays through this pointer:
      ```c
      taste_t eatable_get_taste(eatable_t* eatable) {
          return eatable->get_taste_func(eatable);
      }
      ```
      
      **The Trap**:
      If an external caller bypasses architectural rules and instantiates `eatable_t`
      directly:
      ```c
      eatable_t* e = eatable_new();
      eatable_ctor(e);
      eatable_get_taste(e); /* SEGMENTATION FAULT! Jumps to 0x0! */
      ```
      
      Unlike C++ which catches abstract instantiation at compile time, pure C
      will compile this without error and crash violently at runtime!
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>
        
        typedef enum { SWEET, SOUR } taste_t;
        typedef taste_t (*get_taste_func_t)(void*);
        
        typedef struct {
            get_taste_func_t get_taste_func;
        } eatable_t;
        
        void eatable_ctor(eatable_t* e) {
            e->get_taste_func = NULL; /* Pure virtual: no default! */
        }
        
        taste_t eatable_get_taste_defensive(eatable_t* e) {
            if (!e || !e->get_taste_func) {
                fprintf(stderr, "Error: Pure virtual function call!\n");
                exit(EXIT_FAILURE);
            }
            return e->get_taste_func(e);
        }
        
        int main(void) {
            eatable_t e;
            eatable_ctor(&e);
            printf("Testing defensive pure virtual guard...\n");
            /* Defensive guard prevents segfault and prints diagnostic */
            eatable_get_taste_defensive(&e);
            return 0;
        }
      explain_md: |
        Defensive programming in C checks if `get_taste_func` is `NULL` before
        invoking it. If `NULL`, it outputs an error message analogous to the
        C++ runtime diagnostic `pure virtual method called` instead of crashing
        with a silent SIGSEGV.
      subgoals:
        - label: "Initialize pure virtual pointer to NULL"
          lines: [11, 12, 13]
        - label: "Defensively guard against NULL pure virtual invocation"
          lines: [16, 17, 18, 19]
    checks:
      - kind: spot-bug
        q: "Analyze this C implementation of an abstract interface. What defect causes the crash shown in the diagnostic log?"
        code: |
          void eatable_ctor(eatable_t* e) {
              e->get_taste_func = NULL;
          }
          taste_t eatable_get_taste(eatable_t* e) {
              return e->get_taste_func(e);
          }
          int main(void) {
              eatable_t e;
              eatable_ctor(&e);
              eatable_get_taste(&e);
          }
        diagnostic_log: |
          Program received signal SIGSEGV, Segmentation fault.
          0x0000000000000000 in ?? ()
        target_line: 5
        choices:
          - "Dereferencing NULL function pointer: get_taste_func was initialized to NULL, so invoking it jumps to address 0x0."
          - "eatable_t requires 64-byte alignment."
          - "Stack overflow caused by infinite recursion in eatable_ctor."
          - "The main function must return EXIT_FAILURE."
        answer: 0
        why: "Calling a NULL function pointer attempts to fetch CPU instructions from address 0x0, which triggers an immediate memory access violation (SIGSEGV)."
        concept: null-function-pointer-deref
      - kind: trace
        q: "Trace the execution of eatable_get_taste_defensive when called on an un-overridden eatable_t instance:"
        code: |
          eatable_t e;
          eatable_ctor(&e);
          eatable_get_taste_defensive(&e);
        trace:
          headers: ["Step", "Condition Checked", "Action Taken"]
          rows:
            - ["1", "e->get_taste_func == NULL", "Evaluates to TRUE"]
            - ["2", "fprintf error", "Prints 'Pure virtual function call!'"]
            - ["3", "exit(EXIT_FAILURE)", "Terminates process cleanly"]
        target: {row: 0, col: 2}
        answer_text: "Evaluates to TRUE"
        why: "eatable_ctor explicitly sets get_taste_func to NULL. The defensive guard detects this condition and prevents the zero-pointer jump."
        concept: defensive-pure-virtual-trace
      - kind: why-fails
        q: "Why can the C compiler not prevent the programmer from instantiating `eatable_t` on the stack?"
        choices:
          - "C has no built-in language concept of abstract classes; the compiler sees eatable_t as an ordinary struct of valid size."
          - "Stack allocation in C is performed by the operating system kernel."
          - "Function pointers in C are automatically converted to integers."
          - "The preprocessor strips all struct keywords."
        answer: 0
        why: "In pure C, a struct is simply an aggregate data type. The C compiler cannot infer semantic intent or know that NULL pointers represent pure virtual methods."
        concept: c-type-system-limits

  - id: b4
    type: design
    title: "Enforcing Non-Instantiability of Abstract Types in C"
    explain_md: |
      Since the C compiler cannot stop callers from writing `eatable_t e;` on
      the stack if the struct definition is public, how do we enforce
      non-instantiability in C software architecture?
      
      We combine two encapsulation patterns:
      
      **1. The Incomplete Type in Public Headers (`eatable.h`)**:
      ```c
      /* eatable.h — Public Header */
      struct eatable_t; /* Incomplete type: size unknown to clients! */
      
      /* DO NOT provide eatable_new()! */
      /* Clients CANNOT write: struct eatable_t e; */
      /* Clients CANNOT write: malloc(sizeof(struct eatable_t)); */
      taste_t eatable_get_taste(struct eatable_t*);
      ```
      
      **2. The Private Header for Subclasses (`eatable_p.h`)**:
      ```c
      /* eatable_p.h — Private/Protected Header */
      typedef struct {
          get_taste_func_t get_taste_func;
      } eatable_t;
      
      void eatable_ctor(eatable_t*);
      void eatable_dtor(eatable_t*);
      ```
      
      By omitting the public allocator `eatable_new()`, external client code
      literally **cannot create** an instance of `eatable_t`. Only derived
      classes that include `eatable_p.h` can embed or construct it!
    example:
      lang: c
      code: |
        /* client.c — Attempting to break encapsulation */
        struct eatable_t; /* From eatable.h */
        
        /* 
         * The compiler blocks client code:
         * struct eatable_t e;            --> ERROR: storage size unknown
         * malloc(sizeof(struct eatable_t)) --> ERROR: invalid application of sizeof
         *
         * The only way to get an eatable_t* is through a concrete subclass factory!
         */
      explain_md: |
        Through header separation, we achieve the exact compile-time protection
        of C++ abstract classes in pure C. The compiler rejects any attempt by
        general clients to allocate storage for the incomplete type.
      subgoals:
        - label: "Verify incomplete type blocks allocation"
          lines: [2, 7, 8]
    checks:
      - kind: spot-bug
        q: "A rogue developer writes the following client code to instantiate an abstract interface. What compiler error stops them?"
        code: |
          #include "eatable.h" /* Declares: struct eatable_t; */
          
          void rogue_function(void) {
              struct eatable_t obj;
              eatable_get_taste(&obj);
          }
        diagnostic_log: |
          client.c:4:20: error: storage size of 'obj' isn't known
               struct eatable_t obj;
                                ^~~
        target_line: 4
        choices:
          - "The obj variable is a reserved keyword in C99."
          - "eatable_get_taste requires 2 arguments."
          - "Storage size isn't known: compiler cannot allocate stack memory for an incomplete type."
          - "Missing semicolon after rogue_function."
        answer: 2
        why: "Because eatable.h only forward-declares struct eatable_t, the compiler does not know its size and correctly refuses to allocate stack memory."
        concept: incomplete-type-protection
      - kind: choose-better
        q: "Why is omitting `eatable_new()` from `eatable.h` superior to relying on code reviews not to instantiate abstract types?"
        choices:
          - "It allows the OS kernel to cache the header in CPU L1 cache."
          - "It enforces safety via the compiler and linker; clients physically cannot allocate or construct abstract instances."
          - "It reduces the size of the compiled ELF binary by 50%."
          - "It prevents dynamic linking errors on Windows."
        answer: 1
        why: "Architectural rules that rely on human discipline inevitably fail. Hiding allocators and struct definitions enforces constraints at compile time."
        concept: compile-time-enforcement
      - kind: mcq
        q: "How does a concrete subclass (`apple.c`) obtain permission to instantiate the base `eatable_t`?"
        choices:
          - "By invoking a GCC compiler pragma #pragma allow_instantiate."
          - "By declaring eatable_t as extern."
          - "By casting the pointer to uintptr_t."
          - "By including the private header eatable_p.h, which exposes the full concrete struct definition."
        answer: 3
        why: "Subclasses include the private header (*_p.h) to access the complete struct definition, allowing them to embed the base struct at offset 0 and initialize its function pointers."
        concept: protected-header-access

  - id: b5
    type: syntax
    title: "Subclass Implementation of an Interface in C"
    explain_md: |
      Now let us observe a concrete class implementing an interface!
      
      **The Contract**:
      1. `Apple` implements `Eatable`.
      2. `apple_t` embeds `eatable_t` as its **first member** at offset 0:
         ```c
         typedef struct {
             eatable_t base; /* Offset 0 */
             char cultivar[16];
         } apple_t;
         ```
      3. `Apple` defines a private static implementation function matching the
         signature `get_taste_func_t`:
         ```c
         static taste_t __apple_get_taste(void* self) {
             (void)self;
             return SWEET;
         }
         ```
      4. In `apple_ctor`, initialize the base interface, then **override** the
         pure virtual function pointer:
         ```c
         void apple_ctor(apple_t* apple, const char* name) {
             eatable_ctor((eatable_t*)apple); /* 1. Base constructor */
             strncpy(apple->cultivar, name, 15);
             apple->base.get_taste_func = __apple_get_taste; /* 2. Concrete implementation! */
         }
         ```
      
      Now, passing `(eatable_t*)apple` to `eatable_get_taste()` executes
      `__apple_get_taste()` and returns `SWEET`!
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <string.h>
        
        typedef enum { SWEET, SOUR } taste_t;
        typedef taste_t (*get_taste_func_t)(void*);
        
        /* Interface */
        typedef struct {
            get_taste_func_t get_taste_func;
        } eatable_t;
        
        taste_t eatable_get_taste(eatable_t* e) {
            return e->get_taste_func(e);
        }
        
        /* Concrete Apple Subclass */
        typedef struct {
            eatable_t base;
            char name[16];
        } apple_t;
        
        static taste_t __apple_taste(void* self) {
            apple_t* a = (apple_t*)self;
            printf("[%s]: Deliciously sweet!\n", a->name);
            return SWEET;
        }
        
        void apple_ctor(apple_t* a, const char* name) {
            a->base.get_taste_func = __apple_taste; /* Override pure virtual */
            strncpy(a->name, name, 15);
        }
        
        int main(void) {
            apple_t fuji;
            apple_ctor(&fuji, "Fuji Apple");
            
            /* Polymorphic call through interface pointer */
            eatable_t* food = (eatable_t*)&fuji;
            taste_t t = eatable_get_taste(food);
            printf("Taste code: %d\n", t);
            return 0;
        }
      explain_md: |
        Client code holds an `eatable_t*` pointer. It calls `eatable_get_taste(food)`.
        Through the magic of offset-0 embedding and function pointer dispatch,
        `__apple_taste` is invoked, printing `[Fuji Apple]: Deliciously sweet!`.
      subgoals:
        - label: "Define concrete implementation function"
          lines: [21, 22, 23, 24, 25]
        - label: "Bind implementation in child constructor"
          lines: [28, 29]
        - label: "Invoke interface polymorphically"
          lines: [36, 37]
    checks:
      - kind: order
        q: "Arrange the operations inside `apple_ctor` in proper architectural order:"
        lines:
          - "eatable_ctor((eatable_t*)apple);"
          - "strncpy(apple->name, name, 15);"
          - "apple->base.get_taste_func = __apple_taste;"
          - "free(apple);"
        answer_order: [0, 1, 2]
        why: "First initialize base interface state, then initialize child attributes, and finally bind the concrete function pointer to override the pure virtual slot. Distractor 4 is deallocation, not construction."
        concept: subclass-interface-binding
      - kind: predict
        q: "What does the program output when `eatable_get_taste(food)` is called in `main`?"
        choices:
          - "Error: Pure virtual function call!"
          - "Segmentation fault (core dumped)"
          - "[Fuji Apple]: Deliciously sweet!\nTaste code: 0"
          - "Taste code: 0"
        answer: 2
        why: "apple_ctor bound get_taste_func to __apple_taste. When invoked through food, it prints the message and returns SWEET (enum value 0)."
        concept: interface-polymorphism-predict
      - kind: trace
        q: "Trace the function pointer call when eatable_get_taste(food) executes:"
        code: |
          eatable_t* food = (eatable_t*)&fuji;
          eatable_get_taste(food);
        trace:
          headers: ["Step", "Function Evaluated", "Target Address"]
          rows:
            - ["1", "food->get_taste_func", "__apple_taste"]
            - ["2", "call target with food", "__apple_taste((void*)food)"]
        target: {row: 0, col: 2}
        answer_text: "__apple_taste"
        why: "food->get_taste_func holds the function pointer assigned during apple_ctor, which is the address of __apple_taste."
        concept: interface-dispatch-trace

  - id: b6
    type: model
    title: "Behind the Scenes: C vs. g++ Encapsulation"
    explain_md: |
      How does modern C++ compile object-oriented code compared to our manual C
      techniques?
      
      In Example 9.1 of Extreme C, the author compares the assembly output of:
      1. C: `int rect_area(rect_t* rect) { return rect->width * rect->length; }`
      2. C++: `class Rect { public: int Area() { return width * length; } };`
      
      Compiling both with `gcc -S` and `g++ -S` on 64-bit Linux reveals an astounding
      revelation: **the generated assembly instructions are 100% IDENTICAL!**
      
      **The 'This' Pointer in Registers (System V AMD64 ABI)**:
      In both C and C++, the pointer to the object (`rect_t*` or `Rect* this`)
      is placed in the `%rdi` register!
      
      - C++ member functions are just regular functions with a hidden first parameter:
        `int Rect::Area(Rect* this)`.
      - **Name Mangling**: C++ transforms the symbol name into `_ZN4Rect4AreaEv`
        to encode class scope and parameters into the linker symbol, whereas C
        uses the unadorned name `rect_area`.
    viz:
      kind: ascii-memory
      steps:
        - |
          Assembly Code Comparison (x86_64 System V ABI):
          
          C Output (rect_area):             C++ Output (_ZN4Rect4AreaEv):
          ------------------------------    ------------------------------
          rect_area:                        _ZN4Rect4AreaEv:
            pushq   %rbp                      pushq   %rbp
            movq    %rsp, %rbp                movq    %rsp, %rbp
            movq    %rdi, -8(%rbp)            movq    %rdi, -8(%rbp)     <-- Save 'this' pointer!
            movq    -8(%rbp), %rax            movq    -8(%rbp), %rax
            movl    (%rax), %edx              movl    (%rax), %edx       <-- Read width (offset 0)
            movq    -8(%rbp), %rax            movq    -8(%rbp), %rax
            movl    4(%rax), %eax             movl    4(%rax), %eax      <-- Read length (offset 4)
            imull   %edx, %eax                imull   %edx, %eax         <-- Multiply
            popq    %rbp                      popq    %rbp
            ret                               ret
    example:
      lang: c
      code: |
        #include <stdio.h>
        
        typedef struct {
            int width;
            int length;
        } rect_t;
        
        /* C manual member function: explicit this pointer */
        int rect_area(rect_t* rect) {
            return rect->width * rect->length;
        }
        
        int main(void) {
            rect_t r = {10, 25};
            printf("Area: %d\n", rect_area(&r));
            return 0;
        }
      explain_md: |
        The C code explicitly declares `rect_t* rect` as parameter 1.
        The C++ compiler automatically inserts `Rect* const this` as parameter 1.
        At the machine code level, both execute the exact same instructions.
      subgoals:
        - label: "Pass instance pointer explicitly"
          lines: [9, 10, 11]
    checks:
      - kind: mcq
        q: "Under the System V AMD64 ABI, how does a C++ compiler pass the implicit `this` pointer to a member function?"
        choices:
          - "In the %rax accumulator register."
          - "Inside a thread-local global variable."
          - "On top of the thread stack frame."
          - "In the %rdi register as the first argument, exactly like passing a struct pointer to a C function."
        answer: 3
        why: "Section Encapsulation: The C++ compiler treats member functions as ordinary functions where 'this' is passed as the first argument in register %rdi, matching the C convention."
        concept: abi-this-pointer-register
      - kind: why-fails
        q: "Why does the C++ compiler mangle `Rect::Area()` into a symbol like `_ZN4Rect4AreaEv` in the object file?"
        choices:
          - "To prevent the Linux kernel from terminating the process."
          - "Because the linker does not support capital letters in function names."
          - "To encrypt the code against reverse engineering."
          - "To encode the class name and parameter types into the linker symbol, enabling function overloading and namespaces."
        answer: 3
        why: "C++ allows function overloading and namespaces. The compiler mangles symbol names to create unique linker identifiers that include class scope and argument types."
        concept: name-mangling-rationale
      - kind: trace
        q: "Trace the register state in rect_area when width is at offset 0 and length is at offset 4:"
        code: |
          movl (%rax), %edx   /* line 1 */
          movl 4(%rax), %eax  /* line 2 */
          imull %edx, %eax    /* line 3 */
        trace:
          headers: ["Instruction Line", "Register Modified", "Offset Read"]
          rows:
            - ["1", "%edx", "0 (width)"]
            - ["2", "%eax", "4 (length)"]
            - ["3", "%eax", "product of edx and eax"]
        target: {row: 1, col: 2}
