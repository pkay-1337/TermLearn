  - Bind the port on the internal NIC and hope the traffic finds it
  - 'Bind with a specific NIC rather than all: the default binding reaches

    every NIC, while naming the facing NIC redirects incoming data

    targeted at the port through that listener alone'
  - Skip binding entirely; listen() binds the port automatically
  - Bind two ports on one NIC instead
  answer: 1
  why: 'Binding connects the port — on all NICs by default — and the

    host OS redirects incoming data targeted at that port to the

    bound listener process; binding a specific NIC instead

    restricts the path, which is exactly what the facing-only

    requirement wants.

