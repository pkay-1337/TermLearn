    headline UDS property: reads and writes travel through the

    single socket object, so conversations avoid the two-instance

    cost that pipes and queues pay per direction. It rides with

    session- and message-awareness among the UDS advantages.

    Option A invents buffer economics. Option C invents a

    synchronization waiver. Option D misfiles UDS into the

    pull-based family.'
