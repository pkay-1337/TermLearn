  - kind: why-fails
    level: core
    q: Why must a 1-km-long message be broken before entering the link layer at all?
    choices:
    - Because the physical layer forbids messages on wireless media
    - Because the kernel stores only one message per process
    - Because link protocols enforce frames — like a road system that caps vehicle length, so long data must break
      into multiple frames that travel freely and independently
    - Because MAC addresses run out of space for long sender names
    answer: 2
    why: 'The link layer''s regulation: messages should be broken into pieces

