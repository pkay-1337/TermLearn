- id: b16
  type: model
  title: Route Across LANs with the Network Layer and IP
  explain_md: "What connects two nodes that live in **two different LANs** — possibly\nheterogeneous ones, connected\
    \ through intermediate LANs? The **network\nlayer**:\n\n- Its data unit is the **packet** (like frames at link\
    \ level; frames\n  *encapsulate* packets — a frame contains a packet). For simplicity the\n  chapter sticks to\
    \ the term *packet* thereafter.\n- Each LAN may keep its own physical and link standards, but the\n  governing\
    \ **network protocol must be the same** everywhere —\n  otherwise, heterogeneous LANs cannot connect. The most\
    \ famous one is\n  the **Internet Protocol (IP)**, with two versions by address length:\n  **IPv4** (4 bytes /\
    \ 32 bits; addresses `0.0.0.0` to\n  `255.255.255.255`) and **IPv6** (16 bytes / 128 bits).\n- **Routing**: a\
    \ **router** is simply another node residing in both LANs\n  with two NICs — one NIC in LAN1, one in LAN2 — and\
    \ a special routing\n  algorithm decides which packets transfer and how. Within every LAN\n  there should be a\
    \ router node, so cross-zone traffic can transit tens\n  of routers. (The `traceroute` utility shows the routers\
    \ between your\n  computer and the target.)\n- Every node in an IP network has a unique **IP address**; in a single\n\
    \  LAN every node holds both a link-layer address (MAC) and an IP — but\n  *connections use the IP address*, while\
    \ the MAC is only for data\n  transmission inside the LAN.\n- Networking is provided by the **kernel** (a unit\
    \ within the kernel);\n  user-space processes just benefit from it — and public vs private IP\n  addresses decide\
    \ who is reachable from the internet.\n- The connectivity-check tool: **ping** sends **ICMP** packets; a reply\n\
    \  means the other host is up, connected, and responding.\n"
  viz:
    kind: ascii-memory
    steps:
    - 'PROBLEM: LAN1 (wired) + LAN2 (fiber/IE...) differ in physical+link standards -> bridging needed above them'
    - 'NETWORK LAYER UNIT: packets (frames encapsulate packets; a frame CONTAINS a packet)'
    - 'SAME PROTOCOL EVERYWHERE: IP governs every LAN above their link differences; IPv4 = 4 bytes 0.0.0.0..255.255.255.255;
      IPv6 = 16 bytes'
    - 'ROUTER: one node, TWO NICs (one per LAN) + routing algorithm decides transfers; every LAN needs a router node'
    - 'ADDRESSING: node = MAC (intranet talk) + IP (connection target); kernel hosts the networking unit'
    - 'TOOL: ping -> ICMP packets -> reply means up/connected/responding'
  checks:
  - kind: mcq
    level: intro
    q: Which IP facts does the chapter teach?
    choices:
    - IPv4 addresses need 4 bytes (0.0.0.0 up to 255.255.255.255), IPv6 goes up to 16 bytes, and every node in an
      IP network has a unique IP address
    - IPv4 has 8-byte addresses; IPv6 introduced ports
    - IPv6 replaced MAC addresses entirely on the link layer
    - IP addresses are free-of-charge identifiers assigned by application protocols
    answer: 0
    why: 'The chapter''s numbers: an IPv4 address consists of four segments

      between 0 and 255 (so 4 bytes / 32 bits, from 0.0.0.0 to

      255.255.255.255), IPv6 goes up to 16 bytes (128 bits), and every

      node of an IP network has a unique IP address.

      Option B misprints IPv4 size and grafts ports onto IP. Option C

      erases the separate link-layer MAC. Option D invents allocational

      economics.

      '
    concept: ip-spec-facts
  - kind: why-fails
    level: core
    q: Two LANs speak compatible link protocols and use the same wiring. Why does the chapter still insist on needing
      the network layer at all?
    choices:
    - Because routing across LANs — even compatible ones — needs a common network protocol (IP) above them; connecting
      compatible LANs still takes an intermediate router node
    - Because compatible LANs double the bandwidth only under IP
    - Because TCP cannot run without IP preinstalled
    - Because frames cannot leave a single wire without encryption
