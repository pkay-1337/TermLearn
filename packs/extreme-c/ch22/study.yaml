# single-concept study blocks for Chapter 19 (autogenerated from parts)
blocks:
- id: b1
  type: model
  title: Classify Pull-Based Versus Push-Based IPC Techniques
  explain_md: "An IPC technique is any means that processes use to communicate and\ntransmit data. The chapter splits\
    \ its seven techniques into two families.\n**Pull-based** techniques — shared memory and the filesystem (on disk\
    \ or\nin memory) — expose a shared resource or medium that is *external to both\nprocesses* and lives in user\
    \ space. **Push-based** techniques — POSIX\nsignals, POSIX pipes, POSIX message queues, Unix domain sockets, and\n\
    internet (network) sockets — have no such intermediate medium: they give\nthe processes a *channel*, and messages\
    \ flow through it.\n\nFour consequences follow from that storage difference:\n\n- **Pulling versus pushing.**\
    \ In pull-based IPC each process must pull\n  messages out of the medium. In push-based IPC the arriving messages\
    \ are\n  *delivered* to the receiver end.\n- **Synchronization.** A shared concurrent medium must be synchronized\
    \ by\n  the processes themselves (the topic of the previous chapter). Push\n  techniques need no explicit synchronization;\
    \ each process has a\n  temporary message buffer in the kernel, and the *kernel* guarantees the\n  synchronization\
    \ of that buffer.\n- **Asynchronous versus synchronous.** Pull-based processes can operate\n  independently and\
    \ asynchronously, because messages sit in the shared\n  medium waiting to be fetched later. Push-based processes\
    \ must be up and\n  running at the same time; if the receiver is down at delivery time, the\n  incoming message\
    \ may be lost.\n- **Message fate on exit.** Push-based buffers live only as long as the\n  process runs, while\
    \ pull-based media persist independently.\n\nThe kernel-side buffer is the key mental model: every push-based\
    \ process\nowns one, it holds the incoming pushed messages, and it can be accessed\nconcurrently — but only the\
    \ kernel may synchronize that access.\n"
  viz:
    kind: ascii-memory
    steps:
    - 'PULL MODEL:  process A --serializes--> [shared medium: file / shm] --A or B pulls--> process B (async, needs
      locks)'
    - 'PULL STATE: medium keeps stored bytes while both processes stay down; medium outlives the processes'
    - 'PUSH MODEL: process A --push--> [channel: pipe / mq / socket] --delivered--> kernel buffer of B --> process
      B (sync)'
    - 'PUSH STATE: kernel buffer of B exists only while B runs; B down at push time => incoming message lost'
    - 'KERNEL RULE: synchronization of the per-process kernel buffer is guaranteed by the kernel, not by user code'
