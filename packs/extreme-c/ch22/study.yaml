- id: b8
  type: model
  title: Model POSIX Signal Semantics and Delivery
  explain_md: "POSIX signals are the first single-host IPC technique — and the only one\nthat does **not create a\
    \ communication channel**. A signal is a way to\n**notify** a process (or a thread) about an event or an error.\n\
    \nKey semantics:\n\n- **Who sends**: a process, a thread, or the kernel itself can send a\n  signal. Example:\
    \ the system sends `SIGTERM` to all processes to let\n  them know that a rebooting is in progress and they must\
    \ immediately\n  quit; on receipt the process should react accordingly — persist state,\n  or do nothing, depending\
    \ on the case.\n- **Who handles**: the receiving process decides what to do by\n  installing a *handler* function\
    \ — the program can handle signals and\n  thereby ignore behaviors that would otherwise stop it (e.g. overriding\n\
    \  the default `SIGINT` stop).\n- **The exception**: `SIGKILL` cannot be handled by any process. Its sole\n  job\
    \ is to kill; a parent process that spawned the process can usually\n  be notified about its child being killed.\n\
    - **Delivery is asynchronous**: even if the main thread is busy with a\n  never-ending loop, the signals are delivered\
    \ asynchronously — you can\n  be sure you always receive the incoming signals.\n\nRemember the boundary from the\
    \ taxonomy: signals are push-based IPC but\nthey *notify*; they are not a data channel.\n"
  viz:
    kind: ascii-memory
    steps:
    - 'SIGNAL LIFECYCLE: sender (process|thread|kernel) -> signal -> target process -> handler installed by signal()
      runs'
    - 'SIGTERM情境: system rebooting -> SIGTERM to all processes -> react accordingly (persist state / quit)'
    - 'SIGINT: Ctrl+C default handler just stops program -> but a custom handler can ignore it'
    - 'SIGKILL: cannot be handled by ANY process -> sole job: kill -> parent usually notified about child''s death'
    - 'ASYNC RULE: main thread busy in infinite loop still receives every signal, delivered asynchronously'
    - 'NOT-CHANNEL RULE: signals do NOT create a communication channel -> no payload bytes, only events'
  checks:
  - kind: why-fails
    level: core
    q: A developer installs printf as the handler for SIGKILL and expects to log every kill attempt. Why does the
      handler never print?
    code: "void handle_sigkill(int signal) {\n  printf(\"Kill signal is received! Bye.\\n\");\n  exit(0);\n}\n...\
      \ main:\nsignal(SIGKILL, handle_sigkill);\n"
    choices:
    - Because the handler must be registered with the kill command-line tool instead of the signal function
    - Because printf from a signal handler is illegal and crashes the program first
    - Because SIGKILL cannot be handled by any process — its sole job is to kill the process, so the installed handler
      is unreachable
    - Because SIGKILL is only sent by the kernel, and kernel-sent signals bypass all user handlers
    answer: 2
    why: 'The chapter is explicit: SIGKILL cannot be handled by any process.

      The example installs a handler for it anyway (the registration line

      exists), but the shell demonstration shows the program is simply

      killed with no handler output — a parent of the killed process can

      usually be notified about its child being killed.

      Option A invents a registration rule. Option B invents a

      printf-legality rule as the reason. Option D invents a

      kernel-bypass rule.

      '
    concept: sigkill-uncatchable-why
  - kind: mcq
    level: intro
    q: Which parties can send a POSIX signal, according to the chapter?
    choices:
    - Only the kernel
    - Only the interactive user through shell commands
    - A process, a thread, or the kernel itself
    - Only the parent process of the target
    answer: 2
    why: 'The chapter lists all three senders: a signal can be sent either by a

      process, or a thread, or by the kernel itself — signals are meant to

      notify a process or a thread about an event or an error.

      Options A, B, and D each restrict the sender list to one entry and

      drop the rest.

      '
    concept: signal-senders
  - kind: trace
    level: core
    q: Trace signal delivery in the chapter's busy-loop program. What happens at the target cell — the moment the
      handler is picked and entered?
    trace:
      headers:
      - Step
      - Actor
      - What happens
      rows:
