    q: 'Complete the chapter''s warning: ''Sometimes, we use the term ___ as a synonym for deserialization, but they
      are in fact fundamentally different.'''
    code: 'deserialization  = resurrect the original object from received bytes

      [ ___ ]          = often confused with deserialization, but different

      '
    answer_text: parsing
    why: 'The chapter explicitly warns that ''parsing'' is sometimes used as a

      synonym for deserialization while the two are fundamentally

      different. Keeping the two terms separate matters later, when

      variable-length framing makes parsing a prerequisite before any

      deserialization can even start.

      '
    concept: parsing-vs-deserialization
  - kind: predict
    level: advanced
    q: A team stores an object in a shared-memory segment (pull-based) and later sends the same object over a Unix
      domain socket (push-based). How does the serialization workload compare between the two paths?
    choices:
    - Serialization is needed only for the socket path; shared memory keeps objects intact
    - Only the pull-based path needs serialization, because bytes are only produced when a medium is touched
    - Neither path needs serialization, because both techniques are push-based and objects cross as-is
    - Serialization is needed for both paths, because shared memory and files store series of bytes too — serialization
      is universal to all IPC techniques
    answer: 3
    why: 'Serialization is not limited to push-based IPC. Pull-based mediums —

      shared memory, filesystem — can store a series of bytes, so an object

      must be serialized before being stored there as well. The chapter

      concludes that serialization is universal to all IPC techniques.

      A and C misclassify shared memory as object-preserving, and

      C additionally mislabels it push-based. B invents a

      pull-only rule.

      '
    concept: serialization-universality
- id: b3
  type: model
  title: Map Protocol Content Types, Compression, and Binary-to-Text Encoding
  explain_md: "Messages crossing an IPC channel can have three kinds of content, and\nevery protocol fixes which are\
    \ legal:\n\n- **Textual content**: only characters used in text — alphanumerical\n  characters plus some symbols.\n\
    - **Binary content**: bytes with values ranging over *all* numerical\n  values between 0 and 255.\n- **Mixed content**:\
    \ both text and raw bytes combined into one message.\n\nTextual content is a special case of binary content, but\
    \ the chapter\nkeeps the categories separate because their properties differ:\n**textual messages compress well**,\
    \ while **binary messages suffer from a\npoor compression ratio** (actual size divided by compressed size).\n\n\
    Protonyms to memorize from the chapter:\n\n- Purely textual: **JSON**.\n- Fully binary: **DNS**.\n- Mixed: **BSON**\
    \ and **HTTP** — raw bytes can be mixed with text.\n\nFinally, binary content *can* be sent as text: binary-to-text\
    \ encodings\nsuch as **Base64** represent binary content using textual characters, and\nthey are widely used in\
    \ purely textual protocols such as JSON to send\nbinary data.\n"
  viz:
    kind: ascii-memory
    steps:
    - 'TEXTUAL: ''Hello'' -> allowed only for characters in text (alphanumeric + some symbols), byte values constrained'
    - 'BINARY:  [0x00 .. 0xFF] every value in range is legal -> JSON cannot carry it directly'
    - 'MIXED:   text parts + raw byte parts in ONE message -> HTTP, BSON'
    - 'COMPRESSION: textual compresses well; binary suffers (actual size / compressed size = poor ratio)'
    - 'BASE64: binary -> textual characters -> lets purely textual protocols (JSON) carry binary data'
  checks:
  - kind: mcq
    level: intro
    q: Which protocol from the chapter is fully binary?
    choices:
    - HTTP, because it offers both textual headers and binary bodies
    - JSON, because it encodes numbers in binary form
    - FTP, because file transfers are binary by definition
    - DNS — both the DNS client and server must use compatible binary serializers and deserializers
    answer: 3
    why: 'The chapter classifies DNS as a binary protocol, in contrast to HTTP

      which has textual content. Both DNS ends must still use compatible

      serializers and deserializers — being binary does not remove the

      serialization discipline.

      A misreads HTTP as fully binary. B misreads JSON, which

      is the example of a purely textual protocol. D is the correct

      classification. C invents a classification the chapter does not

      make.

      '
    concept: content-type-examples
  - kind: why-fails
    level: core
    q: A purely textual protocol must carry a photo made of raw bytes. The bytes are pasted into the text message
      as-is and the receiver garbles them. Why does this happen, and which mechanism repairs it?
    choices:
    - The channel corrupts bytes above 127; switching to a bigger kernel buffer repairs it
    - Binary payloads always need fixed-length framing; a length prefix repairs it
    - The serializer drops bytes it cannot print; adding a checksum repairs it
    - Textual content only allows characters used in text, so arbitrary byte values 0–255 do not survive; a binary-to-text
      encoding such as Base64 repairs it
    answer: 3
    why: 'Textual content allows only characters that are used in text, while

      binary content spans all byte values 0 to 255. Pasting raw binary

      into a textual message therefore violates the content type. Binary can

      still be sent as text: the chapter names Base64 as a famous

      binary-to-text encoding widely used in purely textual protocols such

      as JSON.

      A invents a transport fault. C invents serializer

      behavior. B confuses content type with message-length framing.

      '
    concept: base64-purpose
