      - 24
    - label: Child pacing before the write lands
      lines:
      - 21
      - 22
      - 23
    - label: 'Parent: close the write end, then read'
      lines:
      - 25
      - 26
      - 27
      - 28
      - 29
      - 30
      - 31
      - 32
  viz:
    kind: ascii-memory
    steps:
    - 'STEP 1 pipe(fds): fds[0]=read end, fds[1]=write end (two open descriptors in one table)'
    - 'STEP 2 fork(): child inherits BOTH ends -> pipe shared parent<->child'
    - 'STEP 3 roles: parent closes fds[1] (writer role: child); child closes fds[0] (reader role: parent)'
    - STEP 4 parent read(fds[0]) BLOCKS because pipe empty; child sleeps 2s then write(fds[1],str,13)
    - 'STEP 5 unidirectionality: reverse communication is not possible with the same pipe'
    - 'EXTRA: kernel buffer of the pipe lives while the owner runs; owner quits -> buffer destroyed'
