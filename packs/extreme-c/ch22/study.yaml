      '
    concept: message-awareness-token
  - kind: choose-better
    level: advanced
    q: 'A daemon needs a same-host partner process to hold a conversation: request streams to it, replies back, repeatedly,
      over one connection handle. Which single-host technique is the better fit?'
    choices:
    - POSIX signals, because conversation flags map onto event notifications
    - Two POSIX pipes, one per direction, because pipes are the classic channel
    - A Unix domain socket, because a single socket object serves both directions (full-duplex) and can be session-aware
      — the pipe route needs two instances and carries no session structure
    - POSIX message queues, because priorities can order the replies
    answer: 2
    why: 'The two-way conversation requirement maps onto bidirectionality with

