  type: model
  title: Situate Application Protocols in the Five-Layer Stack and IPS
  explain_md: "When a transport channel is established between two *processes*, they\nstill need to **talk** — to\
    \ transmit a series of bytes that both ends\nunderstand. That is the job of a communication protocol living in\
    \ the\n**application layer** — called an *application protocol* because the\nprocesses (applications) themselves\
    \ use it.\n\nLayer counts and names across the chapter:\n\n- **Five layers discussed one by one**: physical, link,\
    \ network,\n  transport, application.\n- **Language analogy**: lower layers have few, well-known protocols —\n\
    \  but application protocols are numerous: *every application running as\n  a process needs to use an application\
    \ protocol to communicate with\n  another process*, like the many human languages over few telephone\n  standards.\
    \ Programmers either take a **well-known protocol such as\n  HTTP or FTP**, or design a **custom protocol** within\
    \ a team.\n\n**Internet Protocol Suite (IPS)** — the deployed model (not the ISO\nstandard):\n\n- Layer list with\
    \ prominent protocols: Physical; **Link — Ethernet,\n  IEEE 802.11 Wi-Fi**; **Internet — IPv4, IPv6, ICMP**; **Transport\
    \ —\n  TCP, UDP**; **Application — numerous: HTTP, FTP, DNS, DHCP, and so\n  on**.\n- One renaming: the **network\
    \ layer is renamed the *internet layer***,\n  because in IPS the prominent protocols there are IPv4 and IPv6.\n\
    - **OSI** is the theoretical, ISO-approved model — 'more a theoretical\n  model and almost never publicly deployed'.\n\
    \nResponsibility split to keep straight: transport guarantees (b17) hold\nfor TCP; the correctness of an *individual*\
    \ packet belongs to the\nnetwork and link layers beneath.\n"
