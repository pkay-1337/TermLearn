    level: core
    q: Two processes exchange serialized messages over a pipe. The sender serializes with rule set S, but the receiver
      deserializes with a different rule set D. Why does the communication effectively fail?
    code: 'sender:    object --S--> [ 48 65 6C 6C 6F ] --> channel

      receiver:  channel --> [ 48 65 6C 6C 6F ] --D--> ?? object

      '
    choices:
    - Because the pipe refuses to deliver bytes whose two ends use different serialization rules
    - Because deserialization always fails when the two processes run on different cores of one machine
    - Because the kernel buffer stores which serializer was used and rejects mismatched libraries
    - 'Because choosing a communication protocol implicitly dictates the serialization: serializer and deserializer
      must obey the same rules, otherwise the receiver cannot reconstruct the transmitted object'
    answer: 3
    why: 'The protocol defines the order of bytes very carefully, and choosing

      the protocol implicitly dictates the serialization; a serialized

      object must be deserialized back to the same object. When the two ends

      do not obey the same rules, the receiver cannot resurrect the object —

      incompatible serializer and deserializer means no communication at all.

      A invents a kernel-level check that does not exist. C

      attributes intelligence to the buffer. B invents a core-affinity

      rule.

      '
    concept: protocol-dictates-serialization
  - kind: trace
    level: intro
    q: Trace the lifecycle of the text object 'Hi!' through a push-based channel. What does the target cell hold —
      the exact step the channel transports between the two translation halves?
    trace:
      headers:
      - Step
      - Side
      - State
      rows:
      - - '1'
        - sender
        - serialize the object into a byte array
      - - '2'
        - channel
        - 'byte array: 48 69 21 goes through unchanged'
      - - '3'
        - receiver
        - deserialize incoming bytes back into the object
    target:
      row: 1
      col: 2
    answer_text: 'byte array: 48 69 21 goes through unchanged'
    why: 'The channel never sees objects — it only carries the serialized byte

      array produced by the serializer and later handed to the

      deserializer. ''H'' is 0x48, ''i'' is 0x69, ''!'' is 0x21, so the wire bytes

      are 48 69 21, unchanged end to end. The translation happens strictly

      at the two process boundaries.

      '
    concept: channel-carries-bytes
  - kind: fillblank
