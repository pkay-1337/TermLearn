- id: b11
  type: design
  title: Choose How Unrelated Processes Share a Pipe
  explain_md: "The chapter's example shares a pipe because `fork()` makes the child\ninherit the parent's file descriptors.\
    \ If two processes are spawned\nseparately — no parent-child lineage — there is **nothing inherited**, so\nthe\
    \ chapter poses the shared-pipe problem with two options:\n\n1. **Set up the pipe and transfer the corresponding\
    \ file descriptors**\n   to the other process. The transfer needs a Unix domain socket\n   channel. But the chapter\
    \ immediately punctures this route: if such a\n   channel already exists between the two processes, they could\
    \ have\n   used it for further communication directly — there would be no need\n   to set up another channel (a\
    \ POSIX pipe) that has a less friendly API\n   than Unix domain sockets.\n2. **Use a named pipe.** One process\
    \ calls `mkfifo` and creates a queue\n   file by providing a path; the second process uses that path to open\n\
    \   the already created file. The channel is still unidirectional, so\n   one of the processes opens the file\
    \ in **read-only mode** while the\n   other opens it in **write-only mode**.\n\nThe named-pipe route is the promising\
    \ one: no pre-existing channel is\nneeded, and the API cost is paid where it is unavoidable.\n"
  viz:
    kind: ascii-memory
    steps:
    - 'PARENT-CHILD CASE: fork() inherits open descriptors -> pipe just works'
    - 'UNRELATED CASE: nothing inherited -> fd table has no piped ends -> must share differently'
    - 'OPTION 1 FD-TRANSFER: set up pipe, hand fds over a UDS channel ... but then a usable UDS already exists!'
    - 'OPTION 2 NAMED PIPE: mkfifo(path) -> queue file -> other process opens by path (read-only vs write-only role)'
    - 'RULE: still unidirectional -> the two processes take opposite open modes'
  checks:
  - kind: choose-better
    level: advanced
    q: Two independently started daemons must exchange one-directional job bytes. Which sharing route from the chapter
      is better, and why?
    choices:
    - Transfer the pipe's file descriptors over a Unix domain socket channel, because descriptor passing is the canonical
      way
    - 'Use a named pipe: mkfifo creates a queue file by path and the other process opens it — no pre-existing channel
      is needed'
    - Fork once from a common ancestor so the pipe gets inherited, because inheritance works for unrelated processes
      too
    - Use POSIX signals, because they are the cheapest channel for unrelated processes
    answer: 1
    why: 'For separately spawned processes, the chapter finds the named-pipe

      route more promising: mkfifo''s queue file is reachable by path, so

      no prior channel is needed. The fd-transfer route self-destructs: it

      requires an existing Unix domain socket channel — and if such a

      channel exists, the processes could simply use *it* rather than set

      up a less friendly pipe.

      Option A repeats the route the chapter discards. Option C invents an

