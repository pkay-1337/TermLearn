- id: b4
  type: algorithm
  title: Frame Variable-Length Messages with Partitioning Methods
  explain_md: "Most protocols produce **variable-length** messages; only a lucky few\nenjoy fixed-length ones. As\
    \ soon as message length varies, the receiver\nfaces a hard question: *has it already read a complete message,\
    \ or must\nmore bytes be read from the channel?* The receiver may read multiple\nchunks before a complete message\
    \ shows up, and a single chunk may contain\ndata from **two adjacent messages** — so the protocol must somehow\
    \ *mark\nthe end of a message*. The chapter names three methods:\n\n1. **Delimiter / separator.** A series of\
    \ bytes (binary messages) or\n   characters (textual messages) that indicates the end of a message.\n   The delimiter\
    \ must be chosen *depending on the content*, so that it is\n   easily distinguishable from the actual content.\n\
    2. **Length-prefix framing.** Each message carries a fixed-length prefix —\n   usually 4 bytes or even more —\
    \ stating how many bytes must be read to\n   complete the message. All Tag-Value-Length (TLV) protocols, with\n\
    \   Abstract Syntax Notation (ASN) as an example, use this technique.\n3. **Finite-state machine (FSM).** The\
    \ protocol follows a regular grammar\n   that can be modeled by a finite-state machine; the receiver knows the\n\
    \   grammar and uses a proper FSM-based deserializer to read a complete\n   message.\n\nThe difference to fixed-length\
    \ receiving: with fixed-length messages the\nreceiver *already knows upfront* how many bytes to read, which reduces\n\
    the parsing burden — and when all messages share one structure, a C\nstructure can even overlay those bytes directly.\n"
  viz:
    kind: ascii-memory
    steps:
    - 'VARIABLE-LENGTH PROBLEM: chunk 1 = [end of msg 1][start of msg 2] -> receiver cannot split without a mark'
    - 'METHOD 1 DELIMITER: [payload ][DELIMITER][payload ][DELIMITER] -> delimiter chosen from content so it stays
      unique'
    - 'METHOD 2 LENGTH-PREFIX: [len=5][HELLO][len=8][GOODBYE!] -> 4-byte prefix announces the payload size (TLV/ASN.1)'
    - 'METHOD 3 FSM: protocol uses a regular grammar -> deserializer walks states until complete message declared'
    - 'FIXED-LENGTH BONUS: known size + same structure -> receiver reads N bytes and overlays a C struct directly'
  checks:
  - kind: order
    level: core
    q: 'Arrange the scrambled lines into the correct reading loop for length-prefix framing, as a receiver consumes
      a channel:'
    lines:
    - char out[256];
    - for (;;) {
    - '  n = read_channel(chunk, sizeof(chunk));     /* chunk may cut two frames */'
    - '}'
    - '  for (i = 0; i < n; i++) shift(chunk[i]);    /* feed the prefix, then the payload */'
    - '  if (complete) handle(out);                  /* prefix said len == payload read */'
    answer_order:
    - 0
    - 1
    - 2
    - 4
    - 5
    - 3
    why: 'The receiver cannot know the length of a variable-length message

      upfront, so it must keep consuming chunks of bytes and push them

      through the framer: read a chunk, shift each byte into the framing

      state machine, and only when the announcement of the length prefix has

      been fulfilled — len == payload read — may the complete message be

      handled. The loop only ends when the program dies.

      The distractor line closes the loop before the framing logic runs.

      '
    concept: length-prefix-receive-loop
  - kind: trace
    level: advanced
    q: 'Trace a length-prefix channel that delivers one chunk of 7 bytes: [00 00 00 05] ''HE''. What should the receiver
      conclude in the target cell?'
    trace:
      headers:
      - Read
      - Bytes seen
      - Receiver conclusion
      rows:
      - - prefix phase
        - 00 00 00 05
        - 4-byte announcement complete
      - - payload phase
        - H E
        - 'msg not finished: 3 more payload bytes expected'
      - - '... later chunks'
        - L P T ...
        - msg ends and is complete
    target:
      row: 1
      col: 2
    answer_text: 'msg not finished: 3 more payload bytes expected'
    why: 'The prefix announced 5 payload bytes (0x00000005), but only ''HE''

      arrived. The receiver compares the announced number of bytes with what

      it has read and correctly decides that the message is not finished:

      5 minus 2 leaves 3 more bytes still expected. The general rule is

      that the receiver continues reading until len(prefix) payload bytes

      arrive, no matter how the chunks are framed on the wire.

      '
    concept: length-prefix-partial-read
  - kind: why-fails
    level: advanced
    q: A team frames binary messages with a delimiter, then discovers corrupted records whenever the payload contains
      the delimiter's bytes. Why does the framing fail?
    choices:
    - The kernel buffer merged two messages, so the delimiter was destroyed by the channel
    - The length prefix replaced the delimiter and both were transmitted, confusing the receiver
    - Binary messages cannot use delimiters at all; only textual messages support separators
    - The delimiter should be chosen depending on the content of the messages, because it must be easily distinguishable
      from the actual content — a delimiter colliding with real payload is indistinguishable from an end mark
    answer: 3
    why: 'A delimiter is a series of bytes or characters that indicates the end

      of a message, and the chapter stresses that it should be chosen

      depending on the content — because it needs to be easily

      distinguishable from the actual content. When real payload bytes

      equal the delimiter, the receiver cannot tell data from an end mark.

      A invents a kernel-level merge with misdetection. C is

      false: the chapter defines delimiters for binary and textual messages

      alike. B mixes up two independent framing methods.

      '
    concept: delimiter-content-collision
  - kind: mcq
    level: core
    q: Which pairing of variable-length method to protocol family matches the chapter?
    choices:
    - Length-prefix framing — TLV protocols such as ASN (really ASN.1); finite-state machine — protocols following
      a regular grammar
    - Length-prefix framing — JSON documents; delimiter — every binary protocol
    - FSM — only fixed-length messages; length prefix — only textual protocols
    - Delimiter — TLV; length prefix — regular-grammar protocols like DNS
    answer: 0
    why: 'The chapter assigns length-prefix framing to all Tag-Value-Length

      (TLV) protocols with Abstract Syntax Notation (ASN) as an example, and

      the FSM method to protocols whose regular grammar can be modeled by a

      state machine. Delimiter-based protocols are the remaining family and

      are content-chosen.

      Option B misassigns JSON. Option C reverses the fixed-length special

      case. Option D swaps the two families.

      '
    concept: method-protocol-pairing
  - kind: fillblank
    level: core
    q: 'Complete the chapter''s description of length prefixes: ''each message has a fixed-length prefix (usually
      ___ bytes or even more) that carries the number of bytes that should be read by the receiver.'''
    code: '[ len: _ bytes ][ payload: <len> bytes ]

      '
    answer_text: '4'
    why: 'The chapter states that a length prefix is usually 4 bytes — or even

      more — and this fixed-size prefix announces exactly how many bytes the

      receiver must read to have a complete message. TLV protocols such as

      ASN.1 build on this trick.

      '
    concept: length-prefix-size
  - kind: choose-better
    level: advanced
    q: A message channel carries photo payloads where the bitmap bytes are fully random. Which variable-length framing
      method should the designer avoid?
    choices:
    - A delimiter method, because a byte sequence that the payload may contain at random cannot be safely used as
      an end mark
    - A length-prefix method, because 4-byte prefixes cannot count lengths above 255
    - A finite-state machine method, because regular grammars cannot describe binary payloads
    - Fixed-length messages padded to the largest photo, because padding guarantees distinguishability
    answer: 0
    why: 'A delimiter must remain easily distinguishable from the actual

      content. Fully random bitmap bytes can contain the delimiter''s bytes,

      so a delimiter is a poor choice; a length prefix (or an FSM grammar)

      does not depend on payload values at all.

      Option B invents a size limit of the solution family rather than the

      failing one. Option C misstates grammar power. Option D describes a

      fixed-length hack, not one of the framing methods for variable-length

      messages.

      '
    concept: framing-method-selection
- id: b5
  type: model
  title: Model Synchronous and Asynchronous Protocol Conversations
  explain_md: "Most protocols organize conversations as **request-response**: one party\nsends a request, the other\
    \ replies. This scheme is usually used in\nclient-server scenarios — the listener (often the server) waits for\
    \ a\nmessage and replies when it arrives.\n\nSequentiality (being sequential versus concurrent) splits the behavior:\n\
    \n- **Synchronous (sequential) protocol**: the sender (client) *waits*\n  until the listener (server) completes\
    \ the request and sends back the\n  reply. The sender stays in a **blocking state** until the reply shows\n  up.\n\
    - **Asynchronous protocol**: the sender is *not blocked*; it continues\n  with another task while the listener\
    \ processes the request. The reply\n  is fetched by a separate mechanism:\n  - **Pulling**: the sender regularly\
    \ asks the listener about the result.\n  - **Pushing**: the listener pushes the reply back to the sender via the\n\
    \    *same or a different* communication channel.\n\nSequentiality is not limited to request-response scenarios\
    \ — messaging\napplications use the same technique to maximize responsiveness on both\nthe server and the client\
    \ side.\n"
  viz:
    kind: ascii-memory
    steps:
    - 'SYNC SEQ: sender --request--> listener ; sender BLOCKS ...... listener --reply--> sender ; unblock -> continue'
    - 'ASYNC PULL SEQ: sender --request--> listener ; sender keeps working ; [sender polls listener] ... [reply found
      -> consume]'
    - 'ASYNC PUSH SEQ: sender --request--> listener ; sender keeps working ; [listener pushes reply on same/different
      channel]'
    - 'KEY: sync => sender in a blocking state; async => pulling or pushing mechanism for the reply'
  checks:
  - kind: mcq
    level: core
    q: What does a synchronous protocol do to the sender during a request-response exchange?
    choices:
    - It lets the sender work on another request while the reply is prepared
    - It makes the sender regularly ask the listener about the result
    - It forces the listener to push the reply through a second communication channel
    - It keeps the sender in a blocking state until the listener completes the request and replies
    answer: 3
    why: 'In a synchronous (sequential) protocol the sender waits until the

      listener completes the request and sends back the reply — that is the

      blocking state of the sender.

      A and the polling of B describe the asynchronous

      sender, and D is right. C describes one of the

      asynchronous reply mechanisms, not the synchronous waiting rule.

      '
    concept: synchronous-blocking-definition
  - kind: trace
    level: advanced
    q: 'Fill the target cell of an asynchronous push-style conversation timeline:'
    trace:
      headers:
      - t
      - Sender
      - Listener
      rows:
      - - t0
        - sends the request and returns to other work
        - starts processing the request
      - - t1
        - keeps working (not blocked)
        - still processing
      - - t2
        - consumes it via the reply channel
        - deliver the reply through the same or a different channel
    target:
      row: 1
      col: 1
    answer_text: keeps working (not blocked)
    why: 'In an asynchronous protocol the sender is not blocked; it can

      continue with another task while the listener processes the request.

      At t1 the listener is still busy, so the non-blocking sender is the

      defining behavior — no polling, no blocking wait.

      '
    concept: async-sender-state
  - kind: why-fails
    level: core
    q: In an asynchronous protocol, why is some extra mechanism mandatory after the request has been sent?
    choices:
    - Because kernel buffers refuse to hold replies unless the sender registered a handler first
    - Because serialization must run again before any reply can be transmitted
    - Because asynchronous channels are unidirectional and a second channel must be created for replies
    - Because the sender is not blocked, so there should be a pulling or pushing mechanism that allows the sender
      to check for the reply
    answer: 3
    why: 'In an asynchronous protocol the sender process is not blocked, so the

      reply does not arrive by waiting — the chapter states that a pulling

      or pushing mechanism must be in place, allowing the sender to check

      for the reply: pulling means regularly asking the listener about the

      result; pushing means the listener pushes the reply back over the

      same or a different communication channel.

      A invents kernel registration. B confuses

      serialization, which happens identically in both modes. C

      invents a unidirectionality rule.

      '
    concept: async-reply-mechanism
  - kind: predict
    level: core
    q: A team swaps a client's synchronous request handling for a pulling-based asynchronous one. Predict what happens
      to the client's main loop while the server is slow.
    choices:
    - The main loop blocks on the request socket until the reply arrives
    - The server pushes the reply and the loop prints it exactly once, immediately
    - The main loop dies, because asynchronous protocols require thread pools
    - The main loop regularly asks the listener about the result and stays responsive in between
    answer: 3
    why: 'In a pulling scenario the sender will regularly ask the listener

      about the result — so the main loop keeps running between polls and

      stays responsive, unlike the blocking wait of the synchronous design.

      A is the synchronous behavior the team removed. C

      invents a thread-pool requirement. B describes pushing, not

      the pulling design chosen.

      '
    concept: pulling-behavior-predict
  - kind: fillblank
    level: intro
    q: 'Complete the sentence: ''If the protocol is synchronous or sequential, the sender stays in a ___ state until
      the listener replies.'''
    code: 'sync protocol: sender state = [ ___ ] until reply

      async protocol: pulling or pushing mechanism fetches the reply

      '
    answer_text: blocking
    why: 'The chapter''s literal formulation: the sender stays in a blocking

      state until the listener replies. This is the exact opposite of the

      asynchronous world, where the sender continues with another task.

      '
    concept: blocking-state-token
- id: b6
  type: design
  title: Decide Between Fixed-Length Struct Mapping and Variable-Length Framing
  explain_md: '**Fixed-length messages** all have the same length. Receiving them is

    easier: the receiver already knows the number of bytes it should read

    from the channel, and messages with the same size usually (not always)

    have the same structure. When messages of one protocol follow the same

    structure, the chapter calls it a *nice opportunity* to use **C

    structures** to refer to those bytes through already-defined fields —

    similar to how objects were placed into shared memories in the previous

    chapter.


    **Variable-length messages** have different lengths. Finding where an

    individual message ends is *not that easy*: the receiver must decide

    whether it has read a complete message or whether more bytes must be

    read — possibly consuming multiple chunks that even straddle two adjacent

    messages. That is why most protocols, which are variable-length, adopt

    the partitioning methods of b4 (delimiter, length prefix, FSM).


    The design decision therefore weighs structure against need: if every

    message is the same shape anyway, fixed-length framing lets you map the

    bytes straight onto a struct; if payloads vary in length or shape, you

    pay for an explicit end-of-message mechanism.

    '
  viz:
    kind: ascii-memory
    steps:
    - 'FIXED-LEN: [40-byte message][40-byte message] -> receiver reads exactly 40 bytes -> fops through struct fields'
    - 'VARIABLE-LEN: [len varies][len varies] -> receiver must ask: complete yet? -> delimiter / length-prefix / FSM'
    - SAME SIZE usually (not always) => SAME STRUCTURE => C struct overlay like shared-memory casting in ch.21
    - 'CHUNK TRAP: a single chunk may contain data from two adjacent messages -> variable-length receiver needs a
      marker'
  checks:
  - kind: choose-better
    level: advanced
    q: An industrial bus protocol carries one invariant 40-byte control record per message, identical layout every
      time. Which receiving design is better, and what is the boundary case?
    choices:
    - Fixed-length framing with a C structure overlay, because the receiver knows the byte count and equal-size messages
      usually share one structure; the boundary case is a payload whose records deviate in size or layout, where an
      explicit end-of-message mechanism is needed
    - Length-prefix framing, because 4-byte prefixes must wrap every real message
    - Fixed-length framing always, because variable-length protocols cannot be read byte by byte
    - Delimiter framing, because a C structure cannot overlay channel bytes anyway
    answer: 0
    why: 'The chapter''s rule: fixed-length messages reduce the parsing burden —

      the receiver already knows how many bytes to read, and same-size

      messages usually (not always) have the same structure, opening the

      nice opportunity of mapping the bytes through predefined struct

      fields, like the shared-memory cases of the previous chapter. The

      boundary is accuracy: ''usually'' — when structure no longer holds, or

      lengths vary, variable-length partitioning methods must be used.

      Option B invents a universal prefix rule. Option C invents an

      impossibility. Option D denies struct overlay, which the chapter

      states directly.

      '
    concept: fixed-length-design-decision
  - kind: why-fails
    level: advanced
    q: A developer overlays a C structure with fixed 40-byte fields over messages of a variable-length channel and
      reads garbage. Why does the struct mapping fail here?
    choices:
    - Because the channel stores an extra checksum byte that only raw reads can see
    - Because struct overlays only work on aligned addresses divisible by the largest member
    - Because with variable-length messages the receiver cannot know upfront how many bytes belong to a message, so
      the fixed byte-count assumption behind the struct overlay breaks
    - Because C structures must never be used together with IPC channels of any kind
    answer: 2
    why: 'The struct-overlay trick relies on the receiver knowing, upfront, how

      many bytes to expect (fixed length) and that same-structure messages

      map onto the predefined fields. On a variable-length channel that

      upfront byte count does not exist, so field boundaries land mid-byte

      stream and every field reads shifted garbage.

      Option A invents a hidden checksum. Option B invents an alignment

      rule unrelated to channel semantics. Option D contradicts the

      chapter, which recommends structures for fixed-length channels.

      '
    concept: variable-length-struct-break
  - kind: mcq
    level: intro
    q: Why does a fixed-length message protocol reduce the burden of parsing on the receiver side?
    choices:
    - Because the receiver already knows the number of bytes that it should read from the channel
    - Because binary content always compresses to the message length
    - Because the kernel copies fixed-length messages without serialization
    - Because fixed-length channels never block the reading process
    answer: 0
    why: 'The chapter states this directly: using a protocol that always

      produces fixed-length messages can reduce the burden of parsing

      receiving messages because the receiver already knows the number of

      bytes it should read from the channel.

      Option B confuses length with compression. Option C invents a

      kernel/no-serialization privilege. Option D invents a blocking

      difference that the chapter does not claim.

      '
    concept: fixed-length-parsing-relief
  - kind: predict
    level: core
    q: A fixed-length channel carries 40-byte records only. If the receiver issues reads of 40 bytes per call, how
      many reads complete 3 queued records?
    choices:
    - 1 read — fixed-length channels always deliver a whole record set per call
    - 2 reads — the channel merges the first two records
    - 3 reads — every read of the announced size completes exactly one record
    - Cannot be predicted — reads depend on the receiver's scheduling
    answer: 2
    why: 'With fixed-length messages the receiver already knows the number of

      bytes it should read; each correctly sized read therefore completes

      one record, and 3 records take 3 reads. The kernel buffer holds 120

      raw bytes regardless, but the consuming unit is the announced record

      length.

      Option A invents batch deliveries. Option B invents merging, which

      belongs to raw byte-pipe misreads (a pipe holds bytes, not records).

      Option D invents scheduling uncertainty.

      '
    concept: fixed-length-read-count
  - kind: fillblank
    level: intro
    q: 'Complete the chapter''s phrase about same-size messages: ''messages with the same size usually (not always)
      have the same ___.'''
    code: 'fixed-length rule: same size ~~> same [ ___ ]  -> struct overlay is safe

      '
    answer_text: structure
    why: 'The chapter explicitly hedges: same-size messages *usually* have the

      same structure. The hedging word ''structure'' is what licenses the C

      struct overlay — and the ''(not always)'' is what makes the check

      necessary before applying it blindly.

      '
    concept: same-size-structure-token
- id: b7
  type: model
  title: Treat File Descriptors as Abstract Byte-Stream Handles
  explain_md: "Two communicating processes may run on one machine or on two machines\njoined by a network. In **single-host\
    \ IPC**, file descriptors carry most\nof the weight. A **file descriptor** is an abstract handle to an object\n\
    within the system that can be used to read and write data — the name\nnotwithstanding, it reaches far beyond files:\n\
    \n- **Regular files** on filesystems, on a hard disk or in memory.\n- **Devices**, each accessed through its device\
    \ file, usually found in\n  the `/dev` directory (Chapter 10 material).\n- **Push-based IPC channels**: the file\
    \ descriptor can *represent the\n  channel itself*, used to read and write data to and from it.\n\nThat last case\
    \ explains the chapter's working rule: *the first step in\nsetting up an IPC channel is to define a number of\
    \ file descriptors.*\nIn multiple-host IPC we still deal with file descriptors, but there they\nare called **sockets**\
    \ — the socket descriptor story is its own block.\n"
  viz:
    kind: ascii-memory
    steps:
    - 'FD 0 / 1 / 2 : standard handles (stdin / stdout / stderr) owned by every process'
    - 'FD -> regular file: on hard disk or in memory filesystem'
    - 'FD -> device: via a device file under /dev'
    - 'FD -> push-based IPC channel: read()/write() the represented channel directly'
    - 'LIFECYCLE RULE: step 1 of wired-up IPC = define a number of file descriptors'
    - 'MULTI-HOST: same role, different name there — a socket descriptor'
  checks:
  - kind: mcq
    level: intro
    q: Despite the name, which of the following can a file descriptor refer to?
    choices:
    - Only regular files stored on a hard disk
    - Only files and directories listed by ls
    - Regular files, device files under /dev, and even a push-based IPC channel
    - Only binary files, because text files are accessed by name
    answer: 2
    why: 'A file descriptor is an abstract handle to an object within the

      system that can be used to read and write data: regular files, device

      files (usually in /dev), and — under push-based IPC — a channel

      represented by the descriptor.

      Option A and B kill the device and channel reach. Option D invents a

      text/binary restriction.

      '
    concept: fd-reach
  - kind: trace
    level: core
    q: Trace the descriptor wiring of a parent preparing a push-based channel. What is the state in the target cell?
    trace:
