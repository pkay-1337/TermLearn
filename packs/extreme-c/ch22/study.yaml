- id: b12
  type: model
  title: Contrast Message Queues with Pipes on Boundaries, Capacity, Priorities
  explain_md: "POSIX message queues are kernel-hosted and standard, but they differ\nfrom pipes in four ways the chapter\
    \ tabulates:\n\n- **Elements**: a pipe holds *bytes* and knows no structure; a queue\n  holds *messages*. Boundaries\
    \ are preserved. The concrete demo: write\n  10-, 20-, and 30-byte messages to both. The pipe 'only knows that\
    \ it\n  has 60 bytes inside' and allows reading 15; the queue 'only knows\n  that it has 3 messages' and *does\
    \ not allow* a 15-byte read because no\n  message has that size.\n- **Capacity unit**: pipes max out in *bytes*;\
    \ queues max out in *message\n  count*, each message having its own byte-size cap.\n- **Backing file**: every\
    \ queue opens a file — not a regular one — that\n  future processes can use to access the same queue instance.\n\
    - **Priorities**: queues can be prioritized; pipes ignore byte priority.\n\nAnd their shared properties: both\
    \ **unidirectional** (bidirectional\ncommunication = two instances), both **limited capacity**, both\nrepresented\
    \ by file descriptors usable with `read`/`write`-style I/O,\nand both **connection-less** — messages have no owner,\
    \ so any process\nmay read another's message (a hazard under concurrent readers).\n"
  viz:
    kind: ascii-memory
    steps:
    - 'PIPE VIEW: [10B|20B|30B written] -> kernel buffer = 60 unmarked bytes -> reading 15 bytes mid-message is allowed'
    - 'QUEUE VIEW: same writes -> 3 messages with intact boundaries -> a 15-byte read is refused (no such message
      size)'
    - 'CAPACITY UNITS: pipe max = bytes; queue max = number of messages (each with its own byte cap)'
    - 'BACKING: queue opens a NON-regular file -> future processes can open the same queue instance by it'
    - 'PRIORITY: queues order messages by priority; pipes do not care about byte priority'
    - 'COMMON: unidirectional; limited capacity; fd-based I/O; connection-less (no message ownership)'
  checks:
  - kind: mcq
    level: core
    q: Which statement captures the boundary-preservation difference between pipes and message queues?
    choices:
    - Pipes preserve boundaries; queues merge adjacent messages
    - Message queues hold messages and keep boundaries between written messages; a pipe only knows how many bytes
      it holds, so mid-message reads are permitted
    - Both preserve boundaries exactly; only the priorities differ
    - Queues preserve boundaries only when messages are all the same size
    answer: 1
    why: 'The chapter''s definition: elements inside a pipe are bytes, while

      message queues keep actual messages and queues preserve the

      boundaries between written messages — the 10/20/30-byte demo

      shows the pipe allowing a 15-byte read while the queue forbids it.

      Option A reverses the roles. Option C erases the distinction.

      Option D invents a size-uniformity condition.

      '
    concept: boundary-preservation-contrast
  - kind: predict
    level: advanced
    q: Three messages of 10, 20, and 30 bytes are queued. A receiver asks to read 15 bytes with a buffer of 15. Predict
      the queue's outcome.
    choices:
    - The queue delivers the first partial message
    - The queue delivers 15 bytes of the first message and keeps the rest pending
    - 'The read is refused: the queue only has 3 messages, none of them 15 bytes — reading 15 bytes is not allowed'
    - The queue merges the first two messages and delivers 15 bytes of the merged data
    answer: 2
    why: 'This is the chapter''s demo verbatim: with 10+20+30 bytes, ''the

      message queue only knows that it has 3 messages and it doesn''t allow

      a program to read 15 bytes because we don''t have any messages with

      15 bytes''. Message-level integrity is the queue''s contract.

      Option A and B break message boundaries. Option D invents merging.

      '
    concept: mq-15-byte-refusal-predict
  - kind: trace
    level: advanced
    q: Trace queue state as two writers compete on one connection-less queue. What is the target cell's correct state?
    trace:
      headers:
      - Step
      - Actor
      - Queue effect
      rows:
      - - '1'
        - writer A enqueues 10-byte msg
        - queue holds A's message with its boundary intact
      - - '2'
        - writer B enqueues 20-byte msg
        - queue holds B's message too; messages carry no ownership
      - - '3'
        - a third reader dequeues one message
        - the higher-priority or FIFO-ordered message is fetched, regardless of author
    target:
      row: 2
      col: 2
    answer_text: the higher-priority or FIFO-ordered message is fetched, regardless of author
    why: 'Both techniques are connection-less: messages have no ownership and

      any process can read them, so a third party may dequeue either

      writer''s message — the chapter even flags this as the concurrency

      hazard when multiple processes operate on the same queue. The queue

      manages the retrieval order (priorities can be set), not the writers.

      '
    concept: connection-less-ownership-trace
  - kind: why-fails
    level: core
    q: A designer caps queue size by total bytes, mirroring a pipe discipline, and claims 'the queue is full at 60
      bytes'. Why does that reasoning fail?
    choices:
    - Because message queues measure capacity in message count with a byte cap per message — not a total-byte pool
      — and the chapter's demo shows full capacity as N messages
    - Because queues store bytes compressed, so 60 bytes of bytes never fills a real queue
    - Because the queue's kernel buffer grows dynamically, so fullness never occurs
    - Because queue capacities are always 4096 messages since POSIX requires it
    answer: 0
    why: 'Pipes have a maximum size counted in bytes; message queues have a

      maximum number of messages, and each queue header additionally caps

      every message''s byte size. Counting a queue by total bytes misses

      the actual capacity unit.

      Option B invents compression. Option C invents dynamic growth.

      Option D invents a fixed-size standard.

      '
    concept: mq-capacity-unit-why
  - kind: eipe
    level: advanced
    q: What is the purpose of message priorities in a queue flow?
    choices:
    - Priorities compress high-priority messages better
    - Priorities let urgent messages overtake queued bulk traffic, since queues can be prioritized while bytes in
      a pipe carry no priority concept
    - Priorities partition the queue into multiple unidirectional channels
    - Priorities reserve kernel descriptors so that urgent sends never block
    answer: 1
    why: 'The capability list puts prioritization on the queue side — the

      pipe, by contrast, is only a byte stream that doesn''t care about

      priority. Scheduling by importance is therefore the queue feature''s

      real job.

      Option A invents a compression synergy. Option C repurposes priority

      as topology. Option D invents descriptor reservations.

      '
    concept: mq-priority-purpose
  - kind: choose-better
    level: advanced
    q: A process must hand records that vary in size to a consumer while never letting a record be split. Which technique
      from the current chapter is the better fit?
    choices:
    - A POSIX pipe, because raw bytes have no overhead
    - A POSIX message queue, because it stores whole messages and preserves their boundaries; pipes would allow partial
      reads
    - POSIX signals, because notification preserves record identity
    - A fixed-length channel, because variable sizes then become fixed
    answer: 1
    why: 'The requirement is boundary integrity for variable-size records.

      The queue''s defining property is exact here: message queues keep

      actual messages, preserve boundaries between them, and cap reads at

      message sizes (the 15-byte refusal).

      Option A accepts mid-record splitting by design. Option C invents

      record transport through notification. Option D dodges the

      requirement instead of serving it.

      '
    concept: mq-boundary-selection
- id: b13
  type: syntax
  title: Drive the POSIX Message Queue API with mq_* Calls
  explain_md: "The queue functions of the chapter's example (header `mqueue.h`):\n\n- **`struct mq_attr`** fields:\
    \ `mq_flags`, `mq_maxmsg` (10 in the\n  example), `mq_msgsize` (32 in the example), `mq_curmsgs` (0 at start).\n\
    - **`mq_open(name, oflag, [mode, attr])`** — the queue is opened like a\n  file by name (`\"/mq0\"`). The parent\
    \ creates it with\n  `O_RDONLY | O_CREAT` (plus mode `0644` and `&attr`); the child opens\n  the existing instance\
    \ with `O_WRONLY`. Being file-backed is what lets\n  the child, spawned later, open the *same queue instance*.\n\
    - **`mq_send(mq, str, strlen(str) + 1, 0)`** — writes one whole message\n  (length and priority 0 in the example).\n\
    - **`mq_receive(mq, buff, 32, NULL)`** — reads one whole message;\n  the buffer size parameter (32) matches `mq_msgsize`\
    \ — the receiving\n  capacity is tied to the message-size hint, since a queue cannot be\n  read in bytes below\
    \ message granularity.\n- **`mq_close(mq)`** then **`mq_unlink(\"/mq0\")`** on the parent — the\n  same tidy-down\
    \ the pipe example lacks because the queue instance is a\n  named kernel object.\n\nBuild/run notes from the chapter:\
    \ on Linux the code links with the `rt`\nlibrary (`gcc ex.c -lrt -o ex.out`); the code **doesn't compile on macOS\n\
    because OS/X doesn't support POSIX message queues**.\n"
  example:
    lang: c
    code: "#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n#include <string.h>\n#include <mqueue.h>\n\
      \nint main(int argc, char** argv) {\n  // The message queue handler\n  mqd_t mq;\n  struct mq_attr attr;\n \
      \ attr.mq_flags = 0;\n  attr.mq_maxmsg = 10;\n  attr.mq_msgsize = 32;\n  attr.mq_curmsgs = 0;\n\n  int childpid\
      \ = fork();\n\n  if (childpid == -1) {\n    fprintf(stderr, \"fork error!\\n\");\n    exit(1);\n  }\n  if (childpid\
      \ == 0) {\n    // Child waits while the parent is creating the queue\n    sleep(1);\n    mqd_t mq = mq_open(\"\
      /mq0\", O_WRONLY);\n    char str[] = \"Hello Daddy!\";\n    // Child writes to the write file descriptor\n \
      \   fprintf(stdout, \"CHILD: Waiting for 2 seconds ...\\n\");\n    sleep(2);\n    fprintf(stdout, \"CHILD: Writing\
      \ to daddy ...\\n\");\n    mq_send(mq, str, strlen(str) + 1, 0);\n    mq_close(mq);\n  } else {\n    mqd_t mq\
      \ = mq_open(\"/mq0\", O_RDONLY | O_CREAT, 0644, &attr);\n    char buff[32];\n    fprintf(stdout, \"PARENT: Reading\
      \ from child ...\\n\");\n    int num_of_read_bytes = mq_receive(mq, buff, 32, NULL);\n    fprintf(stdout, \"\
      PARENT: Received from child: %s\\n\", buff);\n    mq_close(mq);\n    mq_unlink(\"/mq0\");\n  }\n  return 0;\n\
      }\n"
