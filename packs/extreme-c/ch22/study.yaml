      - Step
      - Wiring action
      - fd table state
      rows:
      - - '1'
        - inherited standard descriptors
        - fd 0/1/2 already present
      - - '2'
        - the IPC setup defines descriptors
        - 'the channel opens new fds: fd 3, fd 4'
      - - '3'
        - read and write over the channel
        - the channel fds are used for both directions of the one-way pipe
    target:
      row: 1
      col: 2
    answer_text: 'the channel opens new fds: fd 3, fd 4'
    why: 'Setting up a push-based IPC channel starts with defining file

      descriptors: in this trace the two fresh descriptors continue the

      0/1/2 numbering and represent the single-channel read and write

      ends, exactly what pipe(fds) wires in b10''s code.

      '
    concept: fd-numbering-trace
  - kind: why-fails
    level: core
    q: Why does the chapter say that 'the first step in setting up an IPC channel is to define a number of file descriptors'?
    choices:
    - Because descriptors must be defined before the kernel can apply the file permissions of the process
    - Because a process can open at most three file descriptors at once
    - Because file descriptors are the synchronization primitives that replace semaphores in push-based IPC
    - Because in push-based IPC a file descriptor can represent the channel, and reads and writes go through that
      handle — without the handle there is simply nothing to operate on
    answer: 3
    why: 'The chapter''s framing: a file descriptor can represent an IPC channel

      itself, and the descriptor is then used to read and write data

      from and to the represented channel — that is why defining the

      descriptors comes first in any channel setup.

      A invents a permission chronology. C miscasts

      descriptors as synchronization primitives. B invents a limit

      of three.

      '
    concept: fd-first-step-reason
  - kind: predict
    level: advanced
    q: A process opens no channel and only writes to its inherited standard handles. Predict how many brand-new file
      descriptors this adds to its table.
    code: "int main(int argc, char** argv) {\n  write(1, \"ok\\n\", 3);   /* fd 1 is inherited, not opened here */\n\
      \  return 0;\n}\n"
    choices:
    - 0 — the standard handles were inherited, and no new descriptor object is opened by this program
    - 1 — writing opens fd 1 lazily at first write
    - 2 — write plus the return path both open a descriptor
    - 3 — every C program always opens three new descriptors in main
    answer: 0
    why: 'The three standard descriptors are inherited at process creation;

      this program only writes to the existing handle for fd 1. Following

      the descriptor model, nothing new is opened — the prediction is zero

      new descriptors.

      Option B invents lazy opening. Option C invents hidden opens. Option

      D confuses inheritance with opening.

      '
    concept: fd-inheritance-predict
  - kind: eipe
    level: core
    q: What is the purpose of calling a descriptor like 'an abstract handle'? Why does IPC care about the abstraction?
    choices:
    - Because handles hide which devices the process may open, serving as a security boundary
    - Because handles let the compiler inline system calls that would otherwise hit the kernel
    - Because abstract handles use less memory than real pointers on 64-bit systems
    - Because the abstraction is what makes one I/O discipline work over wildly different channel types — as long
      as a fd points to a channel, read and write work the same way; the object kind behind the handle is irrelevant
      to the code
    answer: 3
    why: 'A file descriptor is an abstract handle to an object that can be used

      to read and write data; the same handle discipline covers regular

      files, device files, and IPC channels. That is the real payoff: code

      holding a fd for a channel uses the same read/write operations the

      way any file would — later b10''s code shows byte-for-byte the same

      read/write used for a pipe.

      A invents a security-story angle. C invents memory

      economy. B invents compiler behavior.

      '
    concept: abstract-handle-purpose
  - kind: mcq
    level: advanced
    q: What changes when the same handle discipline moves to multiple-host IPC?
    choices:
    - The descriptors stop being integers and become kernel pointers
    - Nothing changes at all; even the name 'file descriptor' stays
    - The handle is no longer called a file descriptor — there it is called a socket
    - Files and sockets merge into one object type
    answer: 2
    why: 'The chapter notes that in multiple-host IPC we still deal with file

      descriptors, but they are called sockets there — the abstraction

      persists while the name reflects the object kind.

      Option A denies the integer nature. Option B ignores the name change.

      Option D erases the distinction the chapter is building.

      '
    concept: fd-becomes-socket
