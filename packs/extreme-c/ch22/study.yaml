- id: b20
  type: algorithm
  title: Execute Listener-Connector Initialization Sequences
  explain_md: "Every connection has a **listener** end (always binds an endpoint —\nusually an IP address together\
    \ with a port) and a **connector** end\n(always connects to that endpoint). The initialization sequences differ\n\
    per channel kind; afterwards *both sides use more or less the same API*\nto read from and write to the channel.\n\
    \n**Stream (connection-oriented) listener sequence**:\n\n1. `socket(...)` — create the *listener socket*; the\
    \ arguments vary by\n   channel (`AF_UNIX`/`AF_INET`, but the type **must be\n   `SOCK_STREAM`**); the protocol\
    \ attribute can be determined by the OS\n   (e.g. `AF_INET`+`SOCK_STREAM` selects TCP by default).\n2. `bind(...)`\
    \ — bind the socket to an endpoint reachable by connectors:\n   for internet channels an IP address + port; for\
    \ a Unix domain\n   socket, the path to a **socket file** on the filesystem.\n3. `listen(...)` — create the **backlog**:\
    \ a queue of pending, unaccepted\n   connections; the listener then enters *listening mode*. Low backlog\n   →\
    \ many rejections when the listener is congested; large backlog → a\n   pile of awaiting connections that eventually\
    \ time out and get\n   disconnected. Size it to the program's dynamics.\n4. `accept(...)` per incoming connection\
    \ — an `accept` **loop** is the\n   widely used pattern. `accept` picks the *next* connection waiting in\n   the\
    \ backlog (blocking `accept` on an empty backlog waits until a new\n   connection comes in). Crucially, `accept`\
    \ **returns a new socket\n   object** — the kernel dedicates a new unique socket to every accepted\n   connection.\
    \ A listener with 100 accepted clients therefore uses **at\n   least 101 sockets** (1 listener + 100 per-connection\
    \ sockets).\n\n**Stream connector sequence**: `socket(...)` with the same address\nfamily (type stays `SOCK_STREAM`),\
    \ then `connect(...)` passing what\nuniquely identifies the listener endpoint. The listener must be in\nlistening\
    \ mode — otherwise the connection gets refused by the target\nhost's kernel. Successful `connect` means the connection\
    \ was accepted\nby the target process (before that it may have been waiting in the\nbacklog); connect *also* returns\
    \ a socket object, used for further\ncommunication.\n\n**Datagram (connection-less) listener**: `socket(...)`\
    \ with type\n`SOCK_DGRAM`, then `bind(...)` — and, because the channel is\nconnection-less, there is **no listening\
    \ mode and no accepting phase**\n(no dedicated session per incoming connection); dwells on `recvfrom` /\n`sendto`\
    \ to read and write back — reads may still use `read`, but\nwriting responses cannot be done with a simple `write`\
    \ call alone.\n\n**Datagram connector**: same as the stream connector except type\n`SOCK_DGRAM`; special case\
    \ — a datagram UDS connector must **bind to a\nUnix domain socket file** to receive responses from the server.\n"
  checks:
  - kind: order
    level: core
    q: 'Arrange the scrambled call lines into the correct STREAM LISTENER sequence of the chapter:'
    lines:
    - int lsock = socket(AF_INET, SOCK_STREAM, 0);
    - bind(lsock, ...ip+port...);
    - listen(lsock, BACKLOG_SIZE);
    - int csock = accept(lsock, ...);   /* inside the accept loop */
    - read(csock, buf, ...);            /* talk over the dedicated socket */
    answer_order:
    - 0
    - 1
    - 2
    - 3
    - 4
    why: 'The stream listener sequence is exactly: create the listener socket

      with SOCK_STREAM (the OS pins the protocol), bind it to an endpoint

      (IP+port for internet channels), configure the backlog with listen,

      then accept incoming connections in a loop — accepting hands back a

      new dedicated socket used for the subsequent read/write

      communication.

      All five lines participate in this canonical sequence.

      '
    concept: stream-listener-sequence
  - kind: order
    level: advanced
    q: 'Arrange the DATAGRAM LISTENER sequence; the channel is connection-less this time:'
    lines:
    - int dsock = socket(AF_INET, SOCK_DGRAM, 0);
    - bind(dsock, ...ip+port...);
    - recvfrom(dsock, buf, ...);   /* read one whole datagram */
    - sendto(dsock, resp, ...);    /* write the response back */
    - listen(dsock, 128);
    - int cssock = accept(dsock, ...);
    answer_order:
    - 0
    - 1
    - 2
    - 3
    why: 'A datagram listener only creates its SOCK_DGRAM socket and binds it;

      there is no listening mode and no accepting phase — the underlying

      channel is connection-less, with no dedicated session per incoming

      connection. Reading goes through recvfrom and responding through

      sendto.

      The two distractor lines (listen and accept) are the stream-only

      steps and are omitted from the answer.

      '
    concept: datagram-listener-sequence
  - kind: predict
    level: core
    q: A blocking-socket listener called accept() while its backlog is empty. Predict its behavior.
    choices:
    - accept returns an error immediately without blocking
    - accept returns the listener socket itself for self-marking
    - The accept call blocks until a new connection comes in
    - The listener begins a new backlog automatically with a fresh port
    answer: 2
    why: 'The chapter''s accept loop detail: if the backlog is empty and the

      listener socket is configured to be blocking, any accept call is

      blocked until a new connection arrives — the blocking-accept case is

      explicit.

      Option A invents non-blocking behavior for the opposite case. Option

      B and D invent confabulated returns.

      '
    concept: blocking-accept-predict
  - kind: why-fails
    level: advanced
    q: Why does a listener that has accepted 100 clients need at least 101 sockets, and what does this prove about
      accept()?
    choices:
    - Because the accept function returns a new socket object — the kernel dedicates a new unique socket to every
      accepted connection; the original listener socket keeps listening
    - Because each client needs a second socket for replies
    - Because the kernel clones the listener socket one hundred times upfront
    - Because sockets must be doubled for full-duplex operation
    answer: 0
    why: 'The chapter''s counting example: a listener process that has accepted

      100 clients uses at least 101 sockets — 1 for the listener socket

      and 100 for its incoming connections — because accept hands back a

      fresh dedicated socket per connection, and the listener itself

      remains available for further accepts.

      Option B invents a reply-socket rule. Option C invents upfront

      cloning. Option D invents duplex doubling, whereas one socket per

      side already covers full duplex.

      '
    concept: accept-socket-counting
  - kind: trace
    level: advanced
    q: Trace one listener over three arrivals and fills. What is the target cell?
    trace:
      headers:
      - t
      - Connector side
      - Listener side
      rows:
      - - t0
        - connects to the bound endpoint
        - backlog stores it as a pending connection
      - - t1
        - connects again while backlog has room
        - accept() picks the next waiting connection and returns a NEW dedicated socket for it
      - - t2
        - third connector arrives when the backlog is full
        - the host operating system rejects the new connection immediately
    target:
      row: 1
      col: 2
    answer_text: accept() picks the next waiting connection and returns a NEW dedicated socket for it
    why: 'accept consumes the next pending connection from the backlog (FIFO),

      and each accepted connection gains its unique dedicated socket —

      while arrivals landing in a full backlog are rejected immediately by

      the host OS (they only wait until the backlog has room or they time

      out).

      '
    concept: accept-loop-trace
  - kind: fillblank
    level: core
    q: 'Complete the listener requirement: ''in connection-oriented communication, the listener side should ___ incoming
      connections before being able to transmit any data.'''
    code: 'step: create socket -> bind -> listen (configure backlog) -> [ ___ ] -> transmit

      '
