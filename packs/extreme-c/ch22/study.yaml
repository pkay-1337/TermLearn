- id: b19
  type: syntax
  title: 'Configure Socket Objects: Attributes and the Descriptor Split'
  explain_md: "A **socket** is the kernel-side object identifying a connection: for any\nestablished or soon-to-be-established\
    \ connection there is a dedicated\nsocket; a single connection between two processes owns exactly one\nsocket\
    \ at each side (one for the connector, one for the listener). The\n**POSIX socket library** defines and manages\
    \ socket objects, and every\nsocket object has **three attributes**:\n\n- **domain** (aka *address family* `AF_`\
    \ or *protocol family* `PF_`):\n  `AF_LOCAL`/`AF_UNIX` — local sockets working only when both ends\n  reside on\
    \ the *same host*; `AF_INET` — IPv4 connections; `AF_INET6` —\n  IPv6 connections. (On some systems constants\
    \ appear with the `PF_`\n  prefix; values are usually identical and interchangeable.)\n- **type**: `SOCK_STREAM`\
    \ — a connection-oriented transport that\n  guarantees delivery, correctness, and order... but you *cannot* claim\n\
    \  the underlying protocol is TCP: for local `AF_UNIX` sockets that\n  inference is false. `SOCK_DGRAM` — a connection-less\
    \ communication\n  carved into datagrams. `SOCK_RAW` — the kernel does *not* parse\n  packets (it does not extract\
    \ header and content); the program itself\n  extracts and understands the packet structure; if a raw socket runs\n\
    \  over a stream channel, recovery of lost packets and reordering are\n  also *the program's* job — implying the\
    \ kernel does them when TCP is\n  the selected transport protocol.\n- **protocol**: identifies the protocol to\
    \ use; most address families\n  plus type already determine it, so the OS can pick it — only in cases\n  of multiple\
    \ possible protocols must you define it. Example from the\n  chapter: `AF_INET` + `SOCK_STREAM` makes the OS select\
    \ TCP by default.\n\n**Descriptors**: socket-based techniques deal with socket objects, and\nevery socket object\
    \ is referred to by an integer **socket descriptor**\nin the kernel. FDs and SDs are *different* — file descriptors\
    \ refer to\nregular or device files; socket descriptors refer to socket objects\ncreated by `socket`, `accept`,\
    \ and `connect`. But the same `read`/\n`write` API works over both, and both can be set non-blocking through\n\
    the same API. Socket connections are bidirectional and full-duplex.\n"
  viz:
    kind: ascii-memory
    steps:
    - SOCKET = kernel object for ONE connection; one socket per side per connection
    - 'ATTR 1 domain (AF_/PF_): AF_UNIX same-host only; AF_INET IPv4; AF_INET6 IPv6'
    - 'ATTR 2 type: SOCK_STREAM (delivery+correctness+order; NOT equal TCP for AF_UNIX); SOCK_DGRAM (datagrams); SOCK_RAW
      (program parses packets; program restores order)'
    - 'ATTR 3 protocol: OS picks when family+type determine it (AF_INET+SOCK_STREAM -> TCP by default)'
    - 'DESCRIPTORS: FD (files: regular or device) != SD (socket objects via socket / accept / connect)'
    - 'SHARED API: read/write over both fd & sd; non-blocking via the same API; sockets are full-duplex'
