- id: b17
  type: model
  title: 'Reach Processes via the Transport Layer: Ports, Stream, and Datagram'
  explain_md: "A network-layer connection ties **computers (kernels)** together; but\nmany *processes* live on each\
    \ host, so a transport-layer connection is\ntoo general to support several distinct process-to-process connections.\n\
    The **transport layer** adds its own unique identifier on top: the\n**port** — *while hosts get connected through\
    \ the network layer,\nprocesses get connected through the transport layer*.\n\nThe chapter's telephone analogy:\
    \ people ↔ processes; a call ↔ a\ntransport connection; the telephone device ↔ the NIC; the listener side\nwaits\
    \ for an incoming call; the connector dials a telephone number (the\n*address of the listener*). When the listener\
    \ answers, it *accepts* the\nincoming connection and a channel is established; if the two sides don't\nspeak a\
    \ common language, the channel is destroyed.\n\nTwo transport schemes:\n\n- **Connection-oriented**: a specific\
    \ and *dedicated channel* is created\n  for each connector — one listener with three connectors means three\n\
    \  dedicated channels. Two guarantees hold: **delivery of individual\n  packets**, and **preserved sequence**.\
    \ Even if packets arrive out of\n  order, the receiver's OS rearranges them; if one is lost, the OS\n  requests\
    \ it again. **TCP** behaves exactly like this.\n- **Connection-less**: no such guarantees — **UDP** doesn't guarantee\n\
    \  packet delivery or packet order. (Note: correctness of an individual\n  packet is provided by the network and\
    \ link layers.)\n\nTwo data-unit words: bytes on a connection-oriented channel form a\n**stream**; connection-less\
    \ channels deliver a **datagram** — a chunk\ndelivered *as a whole*. A datagram is the transport-layer counterpart\
    \ of\nthe network-layer *packet*. UDP guarantees each individual datagram's\ncorrectness but nothing about the\
    \ correlation between adjacent\ndatagrams; in TCP, delivery + sequence guarantees let us see the traffic\nas a\
    \ stream of bytes.\n"
  viz:
    kind: ascii-memory
    steps:
    - 'LAYER JUMP: hosts connected (network layer) ----> processes connected (transport layer, id = PORT)'
    - 'TELEPHONE: NIC=telephone; listener waits; connector dials number; listener answers = accepted; language mismatch
      = channel destroyed'
    - 'CONN-ORIENTED: 1 listener + 3 connectors => 3 DEDICATED channels; guarantees: individual packet delivery +
      sequence (receiver OS rearranges / re-requests)'
    - 'CONN-LESS: UDP — no delivery or order guarantee beyond a single packet/datagram'
    - 'WORDS: stream = byte sequence (oriented) ; datagram = one whole chunk (less) — transport counterpart of ''packet'''
    - 'PORTS: number bound by listener (0..65535, 2 bytes); in-use bind => error'
  checks:
  - kind: predict
    level: core
    q: One connection-oriented listener serves three different connectors. Predict the transport channels involved.
    choices:
    - One shared channel carries all three connectors' data through same-port multiplexing
    - Three dedicated channels — one specific and dedicated channel is created per connector
    - No channel is established until all three connectors arrive
    - One channel with three streams sorted by byte offsets
    answer: 1
    why: 'The chapter: in connection-oriented communication a specific and

      dedicated channel is created for the connector — with one listener

      communicating with three connectors, we have three dedicated

      channels. Each connector gets its own guaranteed pipeline.

      Option A invents shared multiplexing at transport level. Option C

      invents a bulk-start synchrony. Option D invents byte-offset

      interleaving inside one channel.

      '
    concept: conn-oriented-dedicated-predict
  - kind: why-fails
    level: advanced
    q: A UDP-based app assumes byte-consecutive reassembly over three datagrams and breaks apart. Why does the assumption
      fail?
    choices:
    - Because UDP datagrams cannot be larger than 4 bytes, so content is lost
    - Because connection-less transport provides no guarantee for the delivery or the order of packets — nothing beyond
      the individual datagram's own correctness can be assumed
    - Because the receiver's kernel rearranges datagrams, breaking continuity
    - Because UDP has no stream at all, and receivers must convert to TCP mid-transfer
    answer: 1
    why: 'A connection-less transport protocol doesn''t guarantee delivery of

      individual packets or their sequence; for UDP it is accepted that no

      integrity should exist beyond a UDP datagram. Only per-datagram

      correctness (delivered by the network and link layers) holds.

      Option A invents a byte-size limit. Option C swaps the guarantee

      holder — kernel-side reordering belongs to connection-oriented

      transports. Option D invents protocol metamorphosis.

      '
    concept: udp-beyond-datagram-why
  - kind: mcq
    level: core
    q: Which pairing of words to their layers matches the chapter?
    choices:
    - stream — connection-oriented bytes at the transport layer; datagram — the chunk delivered as a whole over a
      connection-less channel; datagram is the counterpart of 'packet' in the network layer
    - stream — network layer; datagram — link layer; packets live only in the transport layer
    - datagram — TCP's unit; stream — UDP's unit
    - stream — the whole message on the writing side; datagram — whatever the reader receives
    answer: 0
    why: 'The chapter''s definitions: the stream is the sequence of bytes

      transmitted over a connection-oriented channel; a datagram is a

      piece of data delivered as a whole in a connection-less channel —

      and the datagram is a concept defined in the transport layer as the

      counterpart of the packet in the network layer.

      Option B shuffles layers. Option C summons TCP/UDP onto the wrong

      words. Option D invents writer/reader perspectives.

      '
    concept: stream-datagram-words
  - kind: trace
    level: advanced
    q: 'Fill the target cell — the state of a second listener after the first one bound the port:'
    trace:
      headers:
      - Step
      - Action
      - Kernel response
      rows:
      - - '1'
