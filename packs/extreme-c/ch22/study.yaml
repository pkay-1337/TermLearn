    level: intro
    q: Which pair of link protocols govern wired and wireless networks, per the chapter?
    choices:
    - Ethernet for wired networks, IEEE 802.11 for wireless networks
    - IP for wired networks, ICMP for wireless networks
    - TCP for wired networks, UDP for wireless networks
    - JSON for wired networks, Base64 for wireless networks
    answer: 0
    why: 'The chapter: Ethernet describes the rules and regulations of data

