- id: b14
  type: model
  title: Recognize Unix Domain Sockets as Bidirectional Session-Aware Channels
  explain_md: "Unix domain sockets are a special kind of socket that operates **only\nwithin the same machine** —\
    \ unlike network sockets, which connect two\nprocesses on two different machines across an existing network. The\n\
    chapter prizes them above pipes and queues for two properties:\n\n- **Bidirectional / full-duplex**: a *single*\
    \ socket object suffices to\n  both read from and write to the underlying channel. Compare pipes and\n  queues,\
    \ where bidirectional communication costs *two instances*.\n- **Session-aware and message-aware**: UDS channels\
    \ can be both, which\n  makes them more flexible — the chapter defers the full discussion of\n  session-awareness\
    \ and message-awareness to later sections.\n\nThis block is deliberately a bridge: whenever a single-host scenario\n\
    needs one handle pointing both ways with conversational structure on\ntop, the UDS is the push-based technique\
    \ that fits; the listener and\nconnector sequences that drive it come in b20.\n"
  viz:
    kind: ascii-memory
    steps:
    - 'PIPE/QUEUE: one channel = ONE direction; bidirectional talk => TWO instances (one per direction)'
    - 'UDS: one socket object -> read AND write the same underlying channel (full-duplex)'
    - 'UDS scope: same machine only (AF_UNIX); network sockets span machines over an existing network'
    - 'EXTRA RICHNESS: UDS can be session-aware and message-aware (discussed in following sections)'
  checks:
  - kind: mcq
    level: intro
    q: What makes a Unix domain socket channel economical compared with pipes for two-way talk?
    choices:
    - A single socket object is enough to read from and write to the underlying channel — sockets are bidirectional,
      so the channel is full-duplex
    - Sockets store fewer bytes per message than pipes
    - Unix domain sockets serialize automatically, saving a step
    - Sockets bypass the kernel buffer entirely
    answer: 0
    why: 'The chapter''s headline property: Unix domain sockets are

      bidirectional, so a single socket object suffices for reading and

      writing the same channel — full-duplex, whereas pipes and queues

      are unidirectional and bidirectional communication needs two

      instances of each.

      Option B invents a size advantage. Option C invents automatic

      serialization. Option D denies the kernel buffer that push sockets

      do have.

      '
    concept: uds-duplex-economy
  - kind: why-fails
    level: core
    q: Why does the chapter refuse to compare Unix domain sockets directly with internet sockets on the 'where do
      they work' axis?
    choices:
    - Because UDS skip serialization, while internet sockets require it
    - Because UDS are a special kind of socket that operates only within the same machine, while network sockets allow
      two processes from two different machines to talk over an existing network
    - Because the two kinds cannot share listen/accept semantics
    - Because internet sockets predate UDS theoretically
    answer: 1
    why: 'The chapter''s opening distinction: UDS operate within the same

      machine; network (internet) sockets connect processes across

      different machines over an existing network. The comparison axis is

      host locality — everything else (duplex, API) is shared.

      Option A invents a serialization difference. Option C invents an API

      incompatibility. Option D invents a historical claim.

      '
    concept: uds-host-scope
  - kind: eipe
    level: core
    q: What is the purpose of the 'session-aware and message-aware' property in a UDS channel?
    choices:
    - It lets the channel compress sessions before transmitting
    - 'It is the flexibility mechanism that makes UDS more important and sophisticated than pipes and queues: channels
      can carry conversational sessions and message units, not just raw bytes'
    - It replaces the need for file descriptors in socket-based IPC
    - It allows unrelated processes to inherit open descriptors
    answer: 1
    why: 'The chapter: UDS characters make them ''important and sophisticated in

      comparison to POSIX pipes and POSIX message queues'', with

      bidirectionality as the most important and session-/message-awareness

      as additional flexibility — details teased for later sections.

      Option A invents compression. Option C invents descriptor removal.

      Option D invents inheritance for UDS.

      '
    concept: session-awareness-purpose
  - kind: fillblank
    level: intro
    q: 'Complete the property list: Unix domain sockets are bidirectional and can be both session-aware and ___-aware.'
    answer_text: message
    why: 'The chapter''s exact phrasing: ''Unix domain sockets can be both

      session-aware and message-aware'' — the pair names the two structural

