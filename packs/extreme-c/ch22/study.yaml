  explain_md: "The chapter's API trio:\n\n- **`signal(signal_number, handler_function)`** — installs the handler:\n\
    \  'we have used the signal function to assign various signal handlers to\n  some specific signals'. One handler\
    \ can serve several signals (the\n  `handle_user_signals` switch), and separate handlers can serve one\n  signal\
    \ each (`handle_sigint`, `handle_sigkill`).\n- **`kill(target_pid, signal_number)`** — the library twin of the\
    \ shell\n  `kill` command: it accepts the target PID as the first parameter and\n  the signal number as the second,\
    \ and a process knowing another's PID\n  can signal it directly.\n- **`raise(signal_number)`** — a process or\
    \ a thread sending a signal to\n  itself; note that `raise` sends the signal to the **current thread**.\n\nShell\
    \ use: `kill -SIGUSR2 4598` sends SIGUSR2 to the background example\nrun — the same delivery the library performs.\n\
    \nDelivery timing: asynchronous — being stuck in the never-ending loop\ndoes not delay the incoming signals.\n\
    \n⚠ The chapter registers a handler for SIGKILL too, and that registration\nis deliberately futile: SIGKILL cannot\
    \ be handled by any process.\n"
