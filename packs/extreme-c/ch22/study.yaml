- id: b10
  type: algorithm
  title: Wire a Parent-to-Child POSIX Pipe End to End
  explain_md: "A POSIX pipe is a **unidirectional** channel between two processes.\nCreating one returns **two file\
    \ descriptors**: `fds[0]` is used for\n*reading* from the pipe and `fds[1]` for *writing* to it. The full\nwiring\
    \ algorithm of the chapter's example:\n\n1. `pipe(fds)` opens the two descriptors into the array.\n2. `fork()`\
    \ clones the parent; `fork` makes the *already-opened* file\n   descriptors available to the child — that is how\
    \ the pipe becomes\n   shared with it.\n3. Each process closes the descriptor it does not need: the parent\n \
    \  closes the write descriptor (`fds[1]`) and the child closes the read\n   descriptor (`fds[0]`) — a pipe is\
    \ unidirectional and reverse\n   communication is not possible, so the roles fix who keeps which end.\n4. Parent\
    \ blocks in `read(fds[0], buff, 32)` while there is no\n   message in the pipe; the child delays 2 seconds, then\
    \ writes.\n5. `read`/`write` need nothing channel-specific: a file descriptor refers\n   to a byte channel, and\
    \ no matter what kind of IPC channel is behind,\n   the same functions operate on the underlying channel the same\
    \ way.\n\nThe pipe is push-based: its kernel buffer holds written messages until\nthey are read, and when the\
    \ owner process quits, the pipe object and its\ncorresponding kernel buffer are destroyed.\n"
  example:
    lang: c
    code: "#include <stdio.h>\n#include <stdlib.h>\n#include <unistd.h>\n#include <string.h>\n#include <sys/types.h>\n\
      \nint main(int argc, char** argv) {\n  int fds[2];\n  pipe(fds);\n  int childpid = fork();\n\n  if (childpid\
      \ == -1) {\n    fprintf(stderr, \"fork error!\\n\");\n    exit(1);\n  }\n  if (childpid == 0) {\n    // Child\
      \ closes the read file descriptor\n    close(fds[0]);\n    char str[] = \"Hello Daddy!\";\n    // Child writes\
      \ to the write file descriptor\n    fprintf(stdout, \"CHILD: Waiting for 2 seconds ...\\n\");\n    sleep(2);\n\
      \    fprintf(stdout, \"CHILD: Writing to daddy ...\\n\");\n    write(fds[1], str, strlen(str) + 1);\n  } else\
      \ {\n    // Parent closes the write file descriptor\n    close(fds[1]);\n    char buff[32];\n    // Parent reads\
      \ from the read file descriptor\n    fprintf(stdout, \"PARENT: Reading from child ...\\n\");\n    int num_of_read_bytes\
      \ = read(fds[0], buff, 32);\n    fprintf(stdout, \"PARENT: Received from child: %s\\n\", buff);\n  }\n  return\
      \ 0;\n}\n"
    subgoals:
    - label: Open the pipe and clone into the child
