- id: b2
  type: model
  title: Explain Serialization as the Universal Byte-Translation Layer
  explain_md: "Processes can only transmit **bytes**. Every piece of information must\ntherefore be translated into\
    \ a series of bytes — in a very specific and\nwell-defined order — before being sent over an IPC channel or stored\
    \ in\nan IPC medium. That translation is **serialization** (also called\n*marshalling*); reconstructing the original\
    \ object from the received\nbytes is **deserialization** (*unmarshaling*).\n\nThe two operations are inverses\
    \ of each other, and the flow is always the\nsame: the sender serializes the object into a byte array, transmits\
    \ the\nbyte array, and the receiver deserializes the incoming bytes and\nresurrects the sent object. Every IPC-based\
    \ technology — RPC, RMI, and so\non — relies heavily on this pair.\n\nThree consequences matter for the coming\
    \ blocks:\n\n- **Serialization is universal.** Pull-based media such as files or\n  shared memories store bytes\
    \ too, so objects must be serialized before\n  being stored there as well. It is not limited to push-based IPC.\n\
    - **The protocol dictates the rules.** Choosing a communication protocol\n  implicitly dictates the serialization,\
    \ because the protocol defines the\n  byte order carefully: the serializer and deserializer must obey the\n  *same\
    \ rules*, or the receiver cannot reconstruct the transmitted object\n  — incompatible ends effectively mean no\
    \ communication at all.\n- **Serialization is language-independent.** It only talks about the order\n  of bytes\
    \ and how they should be interpreted, so the same algorithms are\n  written in C, C++, Java, Python, and so on\
    \ — one reason HTTP and DNS\n  serializers exist in many languages and ship as reusable libraries.\n\nOne warning\
    \ from the chapter: *parsing* is sometimes used as a synonym\nfor deserialization, but the two are fundamentally\
    \ different.\n"
  viz:
    kind: ascii-memory
    steps:
    - 'SENDER SIDE:   object (text / audio / struct) --serialize--> byte array [well-defined order] --transmit-->
      channel'
    - 'RECEIVER SIDE: channel --incoming bytes--> deserialize --resurrect--> same object'
    - 'RULE 1: serialization is universal — pull media (file, shm) store bytes too, so storing needs it as well'
    - 'RULE 2: protocol dictates byte order — serializer and deserializer must obey the SAME rules or no communication'
    - 'RULE 3: language-independent — byte-order rules can be implemented in any language; libraries exist per protocol'
  checks:
  - kind: mcq
    level: intro
    q: What is serialization (marshalling) in the context of IPC?
    choices:
    - Breaking a message into network packets on the wire
    - Compressing bytes so that binary payloads shrink before transmission
    - Backing up a file before two processes write it concurrently
    - Translating an object into a series of bytes in a well-defined order before transmission or storage
    answer: 3
    why: 'Processes can transmit only bytes, so every piece of information must

      be translated into a series of bytes before being transmitted by an

      IPC technique or stored in a medium — the chapter calls this

      serialization or marshalling. Deserialization is the inverse

      operation that resurrects the object.

      A describes packetization in the network layers. B

      describes compression, an optional content-level step. C

      invents a backup role.

      '
    concept: serialization-definition
