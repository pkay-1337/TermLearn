- id: b15
  type: model
  title: Ground the Physical and Link Layers of a Network
  explain_md: "To connect two machines you need a **physical medium** — a piece of wire\nor a wireless setup. All\
    \ hardware equipment required to physically\nconnect machines belongs to the **physical layer**, its most basic\n\
    layer; everything above is not physical, just standards about how data\nshould be transmitted.\n\nRules for *using*\
    \ those roads come next: the **link layer** holds the\nregulations and protocols that govern how data is transmitted\
    \ along the\nphysical layer. Its enforcements:\n\n- Messages are broken into pieces called **frames** — like road\
    \ rules\n  that cap vehicle length, a long data stream must be broken into\n  multiple frames, each traveling\
    \ freely and independently of the\n  others.\n- Networks can exist between *any* computational devices, not just\n\
    \  computers (industrial networks have their own wiring, connector, and\n  link standards).\n- **Ethernet** is\
    \ the prominent link protocol for wired computer\n  networks; **IEEE 802.11** governs wireless networks.\n- A\
    \ set of homogenous machines connected via a specific link protocol\n  over physical connections is a **Local\
    \ Area Network (LAN)**. Joining\n  requires a **network adapter, a Network Interface Controller (NIC)**;\n  a\
    \ computer with three NICs can attach to three LANs — or use all\n  three NICs on the same LAN.\n- Each NIC has\
    \ an address defined by the governing link protocol:\n  Ethernet and IEEE 802.11 give a **MAC address** to every\
    \ compatible\n  NIC. MACs must be unique *inside a LAN*; ideally they'd be unique\n  universally and unchangeable\
    \ — but in fact you can even set the MAC\n  address of a NIC.\n"
  viz:
    kind: ascii-memory
    steps:
    - 'PHYSICAL LAYER: wire / wireless medium + connecting hardware; roads between cities analogy'
    - 'LINK LAYER: regulations & protocols that govern transmission along the physical layer'
    - 'LINK RULE: long data -> broken into FRAMES, each traveling freely and independently'
    - 'LINK PROTONYMS: Ethernet (wired) ; IEEE 802.11 (wireless)'
    - LAN = homogenous machines + one link protocol; joining needs a NIC
    - 'MAC: unique inside the LAN; ideally universal & unchangeable, but in fact settable'
    - 3 NICs => attach to 3 LANs or serve one LAN thrice
  checks:
