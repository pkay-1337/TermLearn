      wireless networks. Both live in the link layer.

      Option B names network-layer protocols. Option C names

      transport-layer protocols. Option D names encoding formats, not

      link protocols.

      '
    concept: link-protocol-pair
  - kind: mcq
    level: advanced
    q: What is true about a NIC's MAC address?
    choices:
    - It is globally unique and burned in beyond modification
    - It exists only for Ethernet; Wi-Fi adapters need no address
    - It should be unique inside a LAN; ideally it would also be unique universally and unchangeable, but you can
      even set the MAC address of a NIC
    - It is assigned randomly each time the NIC rejoins the LAN
