      static int wait_for_path(const char *path) {
        for (int i = 0; i < 200; i++) {
          if (access(path, F_OK) == 0) return 0;
          struct timespec ts = {0, 10000000};
          nanosleep(&ts, NULL);
        }
        return -1;
      }

      int main(void) {
        const char *path = "/tmp/calc_lab4_demo.sock";
        unlink(path);

        pid_t pid = fork();
        if (pid < 0) {
          printf("demo: fork failed\n");
          return 1;
        }
        if (pid == 0) {
          int rc = calc_server_run_forever(path);
          _exit(rc == 0 ? 0 : 1);
        }

        int rc = -1;
        if (wait_for_path(path) == 0) rc = calc_client_run(path);

        kill(pid, SIGTERM);
        waitpid(pid, NULL, 0);
        unlink(path);

        if (rc != 0) {
          printf("demo: client failed\n");
          return 1;
        }
        return 0;
      }
  - path: test_runner.c
    content: |
      #define _POSIX_C_SOURCE 200809L
      #include <signal.h>
      #include <stdio.h>
      #include <stdlib.h>
      #include <string.h>
      #include <sys/socket.h>
      #include <sys/un.h>
      #include <sys/wait.h>
      #include <time.h>
      #include <unistd.h>
      #include "calc_proto.h"
      #include "calc_service.h"
      #include "clicore.h"
      #include "server_main.h"
      #include "srvcore.h"

      static int failures = 0;

      static void check(int cond, const char *name) {
        if (!cond) {
          printf("FAIL: %s\n", name);
          failures++;
        }
      }

      static int wait_for_path(const char *path) {
        for (int i = 0; i < 200; i++) {
          if (access(path, F_OK) == 0) return 0;
          struct timespec ts = {0, 10000000};
          nanosleep(&ts, NULL);
        }
        return -1;
      }

      static int connect_path(const char *path) {
        int fd = socket(AF_UNIX, SOCK_STREAM, 0);
        if (fd < 0) return -1;
        struct sockaddr_un addr;
        memset(&addr, 0, sizeof(addr));
        addr.sun_family = AF_UNIX;
        strncpy(addr.sun_path, path, sizeof(addr.sun_path) - 1);
        for (int i = 0; i < 200; i++) {
          if (connect(fd, (struct sockaddr *)&addr, sizeof(addr)) == 0) return fd;
          struct timespec ts = {0, 10000000};
          nanosleep(&ts, NULL);
        }
        close(fd);
        return -1;
      }

      static void test_service(void) {
        struct calc_service_t *svc = calc_service_new();
        check(svc != NULL, "service new");
        if (!svc) return;
        check(calc_service_get_mem(svc) == 0.0, "service initial memory");
        check(calc_service_add(svc, 1.5, 5.6, false) == 7.1, "plain add");
        check(calc_service_get_mem(svc) == 0.0, "plain add keeps memory");
        check(calc_service_add(svc, 1.0, 2.0, true) == 3.0, "memory add");
        check(calc_service_get_mem(svc) == 3.0, "memory add updates memory");
        check(calc_service_sub(svc, 10.0, 2.0, true) == 5.0, "memory sub");
        check(calc_service_get_mem(svc) == 5.0, "memory sub updates memory");
        check(calc_service_mul(svc, 2.0, 3.0, true) == 30.0, "memory mul");
        check(calc_service_get_mem(svc) == 30.0, "memory mul updates memory");
        double result = 99.0;
        check(calc_service_div(svc, 9.0, 3.0, &result) == CALC_SVC_OK && result == 3.0, "div");
        result = 99.0;
        check(calc_service_div(svc, 9.0, 0.0, &result) == CALC_SVC_ERROR_DIV_BY_ZERO, "div by zero");
        check(result == 99.0, "div by zero keeps result");
        calc_service_reset_mem(svc);
        check(calc_service_get_mem(svc) == 0.0, "reset memory");
        calc_service_delete(svc);
      }

      static void test_server_process(void) {
        struct calc_service_t *svc = calc_service_new();
        check(svc != NULL, "process service new");
        if (!svc) return;

        char out[64];
        int n = calc_server_process(svc, "42#MUL#2.0#3.0$", strlen("42#MUL#2.0#3.0$"), out, sizeof(out));
        check(n == 9, "process length");
        check(strcmp(out, "42#0#6.0$") == 0, "process wire");

        n = calc_server_process(svc, "7#ADDM#2.0#3.0$", strlen("7#ADDM#2.0#3.0$"), out, sizeof(out));
        check(n > 0 && strcmp(out, "7#0#5.0$") == 0, "process memory method");

        n = calc_server_process(svc, "8#DIV#1.0#0.0$", strlen("8#DIV#1.0#0.0$"), out, sizeof(out));
        check(n > 0 && strcmp(out, "8#-1#0.0$") == 0, "process div by zero status");

        n = calc_server_process(svc, "9#NONE#0.0#0.0$", strlen("9#NONE#0.0#0.0$"), out, sizeof(out));
        check(n > 0 && strcmp(out, "9#-2#0.0$") == 0, "process unknown method");

        check(calc_server_process(svc, "bad", 4, out, sizeof(out)) == -1, "process rejects malformed");

        calc_service_delete(svc);
      }

      static void test_socket_project(void) {
        const char *path = "/tmp/calc_lab4_test.sock";
        unlink(path);
        pid_t pid = fork();
        check(pid >= 0, "server fork");
        if (pid == 0) {
          int rc = calc_server_run_forever(path);
          _exit(rc == 0 ? 0 : 1);
        }

        check(wait_for_path(path) == 0, "server socket appears");
        int fd = connect_path(path);
        check(fd >= 0, "client connects");
        if (fd >= 0) {
          struct calc_req req = {100, ADD, 1.5, 5.6};
          struct calc_resp resp;
          memset(&resp, 0, sizeof(resp));
          check(calc_client_exchange(fd, &req, &resp) == 0, "socket exchange");
          check(resp.req_id == 100 && resp.status == 0 && resp.result == 7.1, "socket response");
          close(fd);
        }

        kill(pid, SIGTERM);
        waitpid(pid, NULL, 0);
        unlink(path);
      }

      int main(void) {
        test_service();
        test_server_process();
        test_socket_project();

        if (failures == 0) {
          printf("LAB4 TESTS PASSED\n");
          return 0;
        }
        printf("LAB4 TESTS FAILED: %d\n", failures);
        return 1;
      }
