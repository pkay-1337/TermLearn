labs:
- id: lab1
  title: Calculator Protocol Serializer and Parser
  instruction_md: |
    ### What You Are Building

    You are building a small text codec for the calculator protocol. It turns a
    request or response object into the exact wire string that would travel
    through a socket, and it turns a wire string back into an object. Think of
    it as the translation layer between C structs and the bytes a peer sends.

    A request is `id#method#operand1#operand2$` and a response is
    `req_id#status#result$`. The `#` character separates fields and the `$`
    character ends the message. Doubles are always printed with exactly one
    digit after the decimal point.

    ### Files and API

    Implement every function declared in `calc_proto.h` inside `calc_proto.c`.
    The file `calc_proto.c` starts empty; `main.c` and `test_runner.c` are
    complete and will not compile until your functions exist.

    - `int calc_method_to_str(method_t m, char *out, size_t cap)` writes the
      uppercase method name (`NONE`, `GETMEM`, `RESMEM`, `ADD`, `ADDM`, `SUB`,
      `SUBM`, `MUL`, `MULM`, `DIV`) and returns 0. If `m` is out of range, or
      the name plus the terminating null does not fit in `cap`, return -1 and
      do not write a partial name.
    - `int calc_method_from_str(const char *s, method_t *out)` returns 0 and
      stores the matching enumerator. Any other string, including an empty
      string, returns -1 and leaves `*out` unchanged.
    - `int calc_serialize_request(const struct calc_req *req, char *out,
      size_t cap)` writes the request wire string and returns its length
      (excluding the null terminator). If the result does not fit in `cap`,
      return -1. There is no partial output on failure.
    - `int calc_parse_request(const char *msg, size_t len, struct calc_req
      *out)` returns 0 on success. It must reject a message unless all of the
      following hold: `len` is at least 1, `msg[len - 1]` is `$`, the four
      fields are non-empty, the id parses as a base-10 int, the method name is
      valid, and both operands parse as doubles. It never reads past `len`. On
      failure return -1 and leave `*out` unchanged.
    - `int calc_serialize_response(const struct calc_resp *resp, char *out,
      size_t cap)` writes `req_id#status#result$` and returns the length, or
      -1 when it does not fit.
    - `int calc_parse_response(const char *msg, size_t len, struct calc_resp
      *out)` applies the same rules for a three-field response.

    Validation order for both parsers: length and `$` terminator first, then
    field count and empty fields, then numeric and method conversion. On any
    failure no output object field is modified.

    ### Worked Example

    ```c
    struct calc_req r = {1000, ADD, 1.5, 5.6};
    char buf[64];
    int n = calc_serialize_request(&r, buf, sizeof(buf));
    /* n == 17 and buf is "1000#ADD#1.5#5.6$" */

    struct calc_req back;
    calc_parse_request(buf, (size_t)n, &back);
    /* back.id == 1000, back.method == ADD, back.operand1 == 1.5 */
    ```

    The demo program prints exactly:

    ```
    req=1000#ADD#1.5#5.6
    resp=1000#0#7.1
    ```
  files:
  - path: calc_proto.h
    content: |
      #ifndef CALC_PROTO_H
      #define CALC_PROTO_H

      #include <stddef.h>

      typedef enum {
        NONE,
        GETMEM,
        RESMEM,
        ADD,
        ADDM,
        SUB,
        SUBM,
        MUL,
        MULM,
        DIV
      } method_t;

      struct calc_req {
        int id;
        method_t method;
        double operand1;
        double operand2;
      };

      struct calc_resp {
        int req_id;
        int status;
        double result;
      };

      int calc_method_to_str(method_t m, char *out, size_t cap);
      int calc_method_from_str(const char *s, method_t *out);
      int calc_serialize_request(const struct calc_req *req, char *out, size_t cap);
      int calc_parse_request(const char *msg, size_t len, struct calc_req *out);
      int calc_serialize_response(const struct calc_resp *resp, char *out, size_t cap);
      int calc_parse_response(const char *msg, size_t len, struct calc_resp *out);

      #endif
  - path: calc_proto.c
    content: ''
  - path: main.c
    content: |
      #include <stdio.h>
      #include <string.h>
      #include "calc_proto.h"

      int main(void) {
        char buf[64];
        struct calc_req req = {1000, ADD, 1.5, 5.6};
        int n = calc_serialize_request(&req, buf, sizeof(buf));
        if (n < 0) {
          printf("serialize request failed\n");
          return 1;
        }
        buf[n - 1] = '\0';
        printf("req=%s\n", buf);

        struct calc_resp resp = {1000, 0, 7.1};
        n = calc_serialize_response(&resp, buf, sizeof(buf));
        if (n < 0) {
          printf("serialize response failed\n");
          return 1;
        }
        buf[n - 1] = '\0';
        printf("resp=%s\n", buf);
        return 0;
      }
  - path: test_runner.c
    content: |
      #include <stdio.h>
      #include <string.h>
      #include "calc_proto.h"

      static int failures = 0;

      static void check(int cond, const char *name) {
        if (!cond) {
          printf("FAIL: %s\n", name);
          failures++;
        }
      }

      int main(void) {
        char buf[64];
        char name[16];
        struct calc_req req = {1000, ADD, 1.5, 5.6};
        struct calc_resp resp = {1000, 0, 7.1};

        check(calc_method_to_str(MUL, name, sizeof(name)) == 0, "method to str");
        check(strcmp(name, "MUL") == 0, "method name");
        method_t m = NONE;
        check(calc_method_from_str("ADDM", &m) == 0 && m == ADDM, "method from str");
        check(calc_method_from_str("NOPE", &m) == -1, "reject unknown method");

        int n = calc_serialize_request(&req, buf, sizeof(buf));
        check(n == 17, "request length");
        check(strcmp(buf, "1000#ADD#1.5#5.6$") == 0, "request wire");

        struct calc_req parsed;
        memset(&parsed, 0, sizeof(parsed));
        check(calc_parse_request(buf, (size_t)n, &parsed) == 0, "parse request");
        check(parsed.id == 1000 && parsed.method == ADD, "request fields");
        check(parsed.operand1 == 1.5 && parsed.operand2 == 5.6, "request operands");
        check(calc_parse_request("1000#ADD#1.5#5.6", 16, &parsed) == -1, "missing terminator");
        check(calc_parse_request("1000#ADD#1.5#", 13, &parsed) == -1, "empty operand");

        n = calc_serialize_response(&resp, buf, sizeof(buf));
        check(n == 11, "response length");
        check(strcmp(buf, "1000#0#7.1$") == 0, "response wire");
        struct calc_resp parsed_resp;
        memset(&parsed_resp, 0, sizeof(parsed_resp));
        check(calc_parse_response(buf, (size_t)n, &parsed_resp) == 0, "parse response");
        check(parsed_resp.req_id == 1000 && parsed_resp.status == 0, "response fields");
        check(parsed_resp.result == 7.1, "response result");

        if (failures == 0) {
          printf("LAB1 TESTS PASSED\n");
          return 0;
        }
        printf("LAB1 TESTS FAILED: %d\n", failures);
        return 1;
      }
  commands:
    run: gcc -Wall -Wextra -std=c99 calc_proto.c main.c -o app && ./app
    test: gcc -Wall -Wextra -std=c99 calc_proto.c test_runner.c -o test_runner && ./test_runner
  test_cases:
  - name: Protocol demo
    stdin: ''
    expect: |
      req=1000#ADD#1.5#5.6
      resp=1000#0#7.1
    expect_exit: 0
  hints:
  - Start with the method-name table; both serializers and parsers depend on it.
  - A parser should first require len >= 1 and msg[len-1] == '$' before scanning any fields.
  - Use snprintf with %.1f for doubles and strtod for parsing; check every return value.
- id: lab2
  title: IPv4 Address and Network Byte Order Marshaler
  instruction_md: |
    ### What You Are Building

    You are building a tiny address marshaller for network sockets. It fills a
    `sockaddr_in` with an IPv4 address and a port in the byte order the network
    stack expects, and it can read the port and format the endpoint back into
    readable text. This is the code that decides which address and port a TCP
    or UDP socket really binds.

    ### Files and API

    Implement every function declared in `netaddr.h` inside `netaddr.c`. The
    starter `netaddr.c` is empty; `main.c` and `test_runner.c` are complete.

    - `int calc_build_ipv4(struct sockaddr_in *out, const char *ip, unsigned
      short port)` must zero the whole structure, set `sin_family` to
      `AF_INET`, set `sin_port` to `htons(port)`, and set the address. If `ip`
      is `NULL`, store `INADDR_ANY`. Otherwise parse the dotted-decimal text
      with `inet_pton`; if parsing fails, return -1 and leave `*out`
      unchanged. Return 0 on success. Validation order: `out == NULL` or bad
      `ip` first, then fill.
    - `unsigned short calc_read_port(const struct sockaddr_in *addr)` returns
      the port converted back to host order with `ntohs`. It returns 0 when
      `addr` is `NULL`.
    - `int calc_format_endpoint(const struct sockaddr_in *addr, char *out,
      size_t cap)` writes `address:port` (for example `127.0.0.1:6666`) and
      returns 0. Use `inet_ntop`, set the port with `calc_read_port`, and
      write with `snprintf`. Return -1 when any pointer is `NULL`, the address
      cannot be converted, or the text does not fit in `cap`.

    Every value stored in `sin_port` must pass through `htons`. Every value read
    from `sin_port` for display must pass through `ntohs`.

    ### Worked Example

    ```c
    struct sockaddr_in a;
    calc_build_ipv4(&a, "127.0.0.1", 6666);
    /* a.sin_family == AF_INET, calc_read_port(&a) == 6666 */

    char text[64];
    calc_format_endpoint(&a, text, sizeof(text));
    /* text is "127.0.0.1:6666" */
    ```

    The demo program prints exactly:

    ```
    endpoint=127.0.0.1:6666
    wildcard=0.0.0.0:9999
    ```
  files:
  - path: netaddr.h
    content: |
      #ifndef NETADDR_H
      #define NETADDR_H

      #include <stddef.h>
      #include <netinet/in.h>

      int calc_build_ipv4(struct sockaddr_in *out, const char *ip, unsigned short port);
      unsigned short calc_read_port(const struct sockaddr_in *addr);
      int calc_format_endpoint(const struct sockaddr_in *addr, char *out, size_t cap);

      #endif
  - path: netaddr.c
    content: ''
  - path: main.c
    content: |
      #include <stdio.h>
      #include "netaddr.h"

      int main(void) {
        struct sockaddr_in a;
        char text[64];
        if (calc_build_ipv4(&a, "127.0.0.1", 6666) != 0 ||
            calc_format_endpoint(&a, text, sizeof(text)) != 0) {
          printf("build failed\n");
          return 1;
        }
        printf("endpoint=%s\n", text);

        if (calc_build_ipv4(&a, NULL, 9999) != 0 ||
            calc_format_endpoint(&a, text, sizeof(text)) != 0) {
          printf("build failed\n");
          return 1;
        }
        printf("wildcard=%s\n", text);
        return 0;
      }
  - path: test_runner.c
    content: |
      #include <stdio.h>
      #include <string.h>
      #include "netaddr.h"

      static int failures = 0;

      static void check(int cond, const char *name) {
        if (!cond) {
          printf("FAIL: %s\n", name);
          failures++;
        }
      }

      int main(void) {
        struct sockaddr_in a;
        char text[64];

        check(calc_build_ipv4(&a, "127.0.0.1", 6666) == 0, "build loopback");
        check(a.sin_family == AF_INET, "family");
        check(calc_read_port(&a) == 6666, "read port");
        check(calc_format_endpoint(&a, text, sizeof(text)) == 0, "format loopback");
        check(strcmp(text, "127.0.0.1:6666") == 0, "loopback text");

        check(calc_build_ipv4(&a, NULL, 9999) == 0, "build wildcard");
        check(a.sin_addr.s_addr == INADDR_ANY, "wildcard address");
        check(calc_read_port(&a) == 9999, "wildcard port");
        check(calc_format_endpoint(&a, text, sizeof(text)) == 0, "format wildcard");
        check(strcmp(text, "0.0.0.0:9999") == 0, "wildcard text");

        check(calc_build_ipv4(&a, "not-an-ip", 1) == -1, "reject bad ip");
        check(calc_format_endpoint(&a, text, 3) == -1, "reject short buffer");
        check(calc_read_port(NULL) == 0, "null read port");

        if (failures == 0) {
          printf("LAB2 TESTS PASSED\n");
          return 0;
        }
        printf("LAB2 TESTS FAILED: %d\n", failures);
        return 1;
      }
  commands:
    run: gcc -Wall -Wextra -std=c99 netaddr.c main.c -o app && ./app
    test: gcc -Wall -Wextra -std=c99 netaddr.c test_runner.c -o test_runner && ./test_runner
  test_cases:
  - name: Address marshalling demo
    stdin: ''
    expect: |
      endpoint=127.0.0.1:6666
      wildcard=0.0.0.0:9999
    expect_exit: 0
  hints:
  - Always zero the sockaddr_in first so every unnamed field is deterministic.
  - Convert with inet_pton for the address and htons for the port before storing them.
  - For formatting, convert the address with inet_ntop and the port with ntohs, then snprintf.
- id: lab3
  title: Stream Frame Accumulator for Delimited Messages
  instruction_md: |
    ### What You Are Building

    You are building the small accumulator that lets a stream receiver recover
    whole messages from arbitrary chunks. Bytes arrive in pieces, the
    accumulator stores them, and whenever a `$` separator appears it hands the
    next complete frame to the caller. This is the core of stream
    deserialization.

    ### Files and API

    Implement every function declared in `framing.h` inside `framing.c`. The
    starter `framing.c` is empty; `main.c` and `test_runner.c` are complete.

    The parser owns a fixed 256-byte buffer. A frame is the bytes before a `$`
    separator. The separator itself is not part of the returned frame.

    - `void fp_init(struct frame_parser *p)` clears `used` to 0.
    - `int fp_feed(struct frame_parser *p, const char *data, size_t n)`
      appends `n` bytes to the buffer. Return 0 on success. Return -1 without
      modifying the buffer if the append would make `used + n` exceed 256, or
      if `p` is `NULL`, or if `data` is `NULL` while `n` is greater than 0.
    - `int fp_next(struct frame_parser *p, char *out, size_t out_cap)` scans
      for the first `$`. If none exists, return 0 and change nothing. If one
      exists, let `frame_len` be the number of bytes before it. If
      `frame_len + 1` does not fit in `out_cap`, return -1 and change nothing.
      Otherwise copy the frame, terminate `out` with a null byte, remove the
      frame plus the `$` from the parser buffer, and return 1. Removal must
      keep any bytes after the separator in the buffer, in order.

    Precedence: `fp_next` validates the output capacity before consuming any
    bytes. An empty frame (`$` at position 0) is valid and returns length 0.

    ### Worked Example

    ```c
    struct frame_parser p;
    fp_init(&p);
    fp_feed(&p, "AB", 2);
    fp_feed(&p, "C$D$", 4);

    char out[16];
    fp_next(&p, out, sizeof(out));  /* returns 1, out == "ABC" */
    fp_next(&p, out, sizeof(out));  /* returns 1, out == "D"   */
    fp_next(&p, out, sizeof(out));  /* returns 0               */
    ```

    The demo program prints exactly:

    ```
    split=1000#ADD#1.5#5.6
    packed=AB
    packed=CD
    empty=1
    ```
  files:
  - path: framing.h
    content: |
      #ifndef FRAMING_H
      #define FRAMING_H

      #include <stddef.h>

      #define FRAME_BUFFER_CAP 256

      struct frame_parser {
        char buffer[FRAME_BUFFER_CAP];
        size_t used;
      };

      void fp_init(struct frame_parser *p);
      int fp_feed(struct frame_parser *p, const char *data, size_t n);
      int fp_next(struct frame_parser *p, char *out, size_t out_cap);

      #endif
  - path: framing.c
    content: ''
  - path: main.c
    content: |
      #include <stdio.h>
      #include "framing.h"

      int main(void) {
        struct frame_parser p;
        char out[FRAME_BUFFER_CAP];

        fp_init(&p);
        fp_feed(&p, "1000#ADD#", 9);
        fp_feed(&p, "1.5#5.6$", 8);
        if (fp_next(&p, out, sizeof(out)) == 1) {
          printf("split=%s\n", out);
        } else {
          printf("split=<none>\n");
          return 1;
        }

        fp_init(&p);
        fp_feed(&p, "AB$CD$", 6);
        if (fp_next(&p, out, sizeof(out)) == 1) {
          printf("packed=%s\n", out);
        }
        if (fp_next(&p, out, sizeof(out)) == 1) {
          printf("packed=%s\n", out);
        }
        int rc = fp_next(&p, out, sizeof(out));
        printf("empty=%d\n", rc == 0 ? 1 : 0);
        return 0;
      }
  - path: test_runner.c
    content: |
      #include <stdio.h>
      #include <string.h>
      #include "framing.h"

      static int failures = 0;

      static void check(int cond, const char *name) {
        if (!cond) {
          printf("FAIL: %s\n", name);
          failures++;
        }
      }

      int main(void) {
        struct frame_parser p;
        char out[FRAME_BUFFER_CAP];

        fp_init(&p);
        check(fp_next(&p, out, sizeof(out)) == 0, "empty buffer");
        check(fp_feed(&p, "AB", 2) == 0, "feed partial");
        check(fp_next(&p, out, sizeof(out)) == 0, "no separator yet");
        check(fp_feed(&p, "C$D$", 4) == 0, "feed complete");
        check(fp_next(&p, out, sizeof(out)) == 1 && strcmp(out, "ABC") == 0, "first frame");
        check(fp_next(&p, out, sizeof(out)) == 1 && strcmp(out, "D") == 0, "second frame");
        check(fp_next(&p, out, sizeof(out)) == 0, "drained");

        fp_init(&p);
        check(fp_feed(&p, "$", 1) == 0, "empty frame feed");
        check(fp_next(&p, out, sizeof(out)) == 1 && out[0] == '\0', "empty frame");

        fp_init(&p);
        check(fp_feed(&p, "XYZ$", 4) == 0, "short buffer feed");
        check(fp_next(&p, out, 2) == -1, "short output rejected");
        check(fp_next(&p, out, sizeof(out)) == 1 && strcmp(out, "XYZ") == 0, "survives short output");

        fp_init(&p);
        char big[257];
        memset(big, 'a', sizeof(big));
        check(fp_feed(&p, big, 256) == 0, "fill buffer");
        check(fp_feed(&p, "b", 1) == -1, "overflow rejected");

        if (failures == 0) {
          printf("LAB3 TESTS PASSED\n");
          return 0;
        }
        printf("LAB3 TESTS FAILED: %d\n", failures);
        return 1;
      }
  commands:
    run: gcc -Wall -Wextra -std=c99 framing.c main.c -o app && ./app
    test: gcc -Wall -Wextra -std=c99 framing.c test_runner.c -o test_runner && ./test_runner
  test_cases:
  - name: Frame accumulator demo
    stdin: ''
    expect: |
      split=1000#ADD#1.5#5.6
      packed=AB
      packed=CD
      empty=1
    expect_exit: 0
  hints:
  - Track how many valid bytes the buffer currently holds; ignore everything past used.
  - Scan for '$' with a loop or memchr, but do not consume bytes until capacity is confirmed.
  - After copying a frame, shift the remaining bytes to the front and reduce used.
- id: lab4
  title: Main Calculator Project over UDS Streams
  instruction_md: |
    ### What You Are Building

    You are building the main calculator project as a working UDS stream
    application. A server accepts stream clients, reads any number of
    `$`-terminated calculator requests from each connection, computes them with
    one stateful service object per connection, and writes one response frame per
    request. A client sends one request and waits for exactly one response. The
    protocol codec and the frame accumulator are provided. You implement the
    stateful calculator service, the server core, and the client core. The server
    main, client main, demo, and test runner are complete.

    ### Files

    Provided complete: `calc_proto.h`, `calc_proto.c`, `framing.h`, `framing.c`,
    `calc_service.h`, `srvcore.h`, `clicore.h`, `server_main.h`, `server_main.c`,
    `client_main.h`, `client_main.c`, `demo.c`, `test_runner.c`.

    Implement from empty: `calc_service.c`, `srvcore.c`, `clicore.c`.

    The provided frame accumulator `fp_next` returns the bytes before a `$` and
    removes that separator. The protocol parsers require a complete wire message
    ending in `$`. Whenever you pass a frame to `calc_parse_request` or
    `calc_parse_response`, append a `$` at the frame length and pass `length + 1`.
    Keep the frame buffer large enough: append only when `length + 1` fits in the
    buffer.

    ### Calculator Service API

    Define `struct calc_service_t` in `calc_service.c`. It stores one `double`
    named `mem`, the calculator memory.

    - `calc_service_new` allocates the object and calls `calc_service_ctor`.
      Return `NULL` on allocation failure.
    - `calc_service_delete(NULL)` is a no-op. Otherwise call
      `calc_service_dtor` and free the object.
    - `calc_service_ctor` sets `mem` to `0.0`. `calc_service_dtor` sets it back
      to `0.0`. Both accept `NULL` and do nothing.
    - `calc_service_reset_mem` sets `mem` to `0.0`; `NULL` is a no-op.
    - `calc_service_get_mem` returns `mem`, or `0.0` when the service is `NULL`.
    - `calc_service_add(svc, a, b, false)` returns `a + b` without changing
      `mem`. With `mem == true` it returns `a + b + svc->mem` and stores that
      result in `svc->mem`.
    - `calc_service_sub(svc, a, b, false)` returns `a - b`. With `mem == true`
      it returns `a - b - svc->mem` and stores that result in `svc->mem`.
    - `calc_service_mul(svc, a, b, false)` returns `a * b`. With `mem == true`
      it returns `a * b * svc->mem` and stores that result in `svc->mem`.
    - `calc_service_div(svc, a, b, result)` returns `CALC_SVC_ERROR_DIV_BY_ZERO`
      when `b == 0.0`, when `svc == NULL`, or when `result == NULL`, and it
      changes neither `*result` nor `mem`. Otherwise it stores `a / b` in
      `*result` and returns `CALC_SVC_OK`. Division has no memory variant.
    - When a memory variant updates `mem`, it stores the returned result, not the
      old memory value. For a `NULL` service, add/sub/mul return `0.0` and do not
      update anything.

    ### Server Core API

    `calc_server_handle(req, resp, svc)` sets `resp->req_id` to `req->id` and
    starts with `status = 0`, `result = 0.0`. It returns -1 only when any pointer
    is `NULL`. Otherwise it always returns 0 and fills the response:

    - `GETMEM`: `result = calc_service_get_mem(svc)`; memory is unchanged.
    - `RESMEM`: call `calc_service_reset_mem(svc)`; result stays `0.0`.
    - `ADD`/`ADDM`, `SUB`/`SUBM`, `MUL`/`MULM`: call the matching service
      function with `mem == false` for the short name and `mem == true` for the
      `M` name, and store the return value in `result`.
    - `DIV`: call `calc_service_div`. On `CALC_SVC_OK`, store the quotient and
      keep `status = 0`. On division by zero, set `status = -1` and
      `result = 0.0`.
    - `NONE` or any other value: set `status = -2` and `result = 0.0`.

    `calc_server_process(svc, request, request_len, response, response_cap)`
    takes a complete wire message including its `$`. Return -1 when any pointer
    is `NULL` or `response_cap == 0`. Parse with `calc_parse_request`; on failure
    return -1. Call `calc_server_handle`; on failure return -1. Serialize with
    `calc_serialize_response` and return the serialized length, excluding the
    null terminator. On every failure, do not leave a partial response as a
    successful result.

    `calc_server_run_connection(conn_sd)` returns -1 when `conn_sd < 0`.
    Otherwise it creates exactly one service object for the connection and a
    frame parser. It then loops:

    1. Read up to 128 bytes into a local input buffer.
    2. On `read < 0`, retry only for `EINTR`; for any other error, delete the
       service and return -1.
    3. On `read == 0`, the peer closed; delete the service and return 0.
    4. Feed the bytes to `fp_feed`. On failure, delete the service and return -1.
    5. Drain every complete frame with `fp_next` into a `FRAME_BUFFER_CAP`-byte
       frame buffer. On `fp_next == -1`, delete the service and return -1. For
       each frame, let `frame_len = strlen(frame)`. If `frame_len + 1` does not
       fit in the frame buffer, delete the service and return -1. Otherwise
       append `$`, call `calc_server_process`, and write every response byte with
       a loop that retries short writes. A write returning 0 or a negative value
       is an error: delete the service and return -1.
    6. When `fp_next` returns 0, go back to step 1.

    `calc_server_run_connection` must delete the service object on every exit
    path and must not close `conn_sd`.

    ### Client Core API

    `calc_client_exchange(conn_sd, req, resp)` returns -1 when `conn_sd < 0` or
    when `req` or `resp` is `NULL`. Serialize `req` into a 64-byte buffer with
    `calc_serialize_request`; on failure return -1. Write every request byte with
    a loop that retries short writes. Then read up to 128 bytes at a time and feed
    a frame parser until `fp_next` returns 1. A `read` return of 0 or a negative
    value is an error. A `fp_feed` or `fp_next` failure is an error. When a frame
    arrives, let `frame_len = strlen(frame)`. If `frame_len + 1` does not fit in
    the `FRAME_BUFFER_CAP`-byte frame buffer, return -1. Otherwise append `$`,
    parse it with `calc_parse_response`, and return 0 on success or -1 on parse
    failure. `calc_client_exchange` does not close
    `conn_sd` and has no timeout.

    ### Worked Example

    ```c
    struct calc_service_t *svc = calc_service_new();
    char out[64];
    int n = calc_server_process(svc, "42#MUL#2.0#3.0$",
                                strlen("42#MUL#2.0#3.0$"), out, sizeof(out));
    /* n == 9 and out is "42#0#6.0$" */
    calc_service_delete(svc);
    ```

    A connection that sends `1#ADD#1.5#5.6$` receives `1#0#7.1$`. A connection
    that sends `8#DIV#1.0#0.0$` receives `8#-1#0.0$`.

    ### Expected Demo Transcript

    `commands.run` builds and runs the demo. It prints exactly:

    ```
    1 status=0 result=7.1
    2 status=0 result=3.0
    3 status=0 result=3.0
    4 status=0 result=5.0
    5 status=0 result=30.0
    6 status=0 result=0.0
    7 status=0 result=0.0
    8 status=-1 result=0.0
    9 status=0 result=3.0
    10 status=-2 result=0.0
    ```

    `commands.test` prints `LAB4 TESTS PASSED` and exits 0 when all service,
    dispatch, and socket integration assertions pass.

    ### Hints

    1. Implement and test the service first; most server failures come from
       memory variants or division by zero.
    2. The frame accumulator removes `$`. Restore it before calling a parser.
    3. Drain every complete frame after each read and use a write loop; do not
       assume one read equals one message or that one write sends every byte.
