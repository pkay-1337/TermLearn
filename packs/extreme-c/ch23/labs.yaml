    content: |
      #include <errno.h>
      #include <stdio.h>
      #include <string.h>
      #include <sys/socket.h>
      #include <sys/un.h>
      #include <unistd.h>
      #include "server_main.h"
      #include "srvcore.h"

      int calc_server_run_forever(const char *sock_path) {
        if (!sock_path || !*sock_path) return -1;
        if (strlen(sock_path) >= sizeof(((struct sockaddr_un *)0)->sun_path)) return -1;

        int server_sd = socket(AF_UNIX, SOCK_STREAM, 0);
        if (server_sd < 0) return -1;

        struct sockaddr_un addr;
        memset(&addr, 0, sizeof(addr));
        addr.sun_family = AF_UNIX;
        strncpy(addr.sun_path, sock_path, sizeof(addr.sun_path) - 1);

        unlink(sock_path);
        if (bind(server_sd, (struct sockaddr *)&addr, sizeof(addr)) < 0) {
          close(server_sd);
          return -1;
        }
        if (listen(server_sd, 10) < 0) {
          close(server_sd);
          unlink(sock_path);
          return -1;
        }

        for (;;) {
          int conn_sd = accept(server_sd, NULL, NULL);
          if (conn_sd < 0) {
            if (errno == EINTR) continue;
            close(server_sd);
            unlink(sock_path);
            return -1;
          }
          int rc = calc_server_run_connection(conn_sd);
          close(conn_sd);
          if (rc != 0) {
            close(server_sd);
            unlink(sock_path);
            return -1;
          }
        }
      }

      #ifdef CALC_STANDALONE
      int main(int argc, char **argv) {
        const char *path = argc > 1 ? argv[1] : "/tmp/calc_lab4.sock";
        return calc_server_run_forever(path) == 0 ? 0 : 1;
      }

      #endif
