  - path: calc_proto.c
    content: |
      #include <stdio.h>
      #include <stdlib.h>
      #include <string.h>
      #include "calc_proto.h"

      static const char *names[] = {"NONE","GETMEM","RESMEM","ADD","ADDM","SUB","SUBM","MUL","MULM","DIV"};

      int calc_method_to_str(method_t m, char *out, size_t cap) {
        if (!out || m < NONE || m > DIV) return -1;
        size_t n = strlen(names[m]);
        if (n + 1 > cap) return -1;
        memcpy(out, names[m], n + 1);
        return 0;
      }

      int calc_method_from_str(const char *s, method_t *out) {
        if (!s || !out) return -1;
        for (int i = NONE; i <= DIV; i++) {
          if (strcmp(s, names[i]) == 0) { *out = (method_t)i; return 0; }
        }
        return -1;
      }

      static int split_fields(const char *msg, size_t len, char *copy, size_t cap, char *fields[], int want) {
        if (!msg || len < 1 || msg[len - 1] != '$') return -1;
        if (len > cap) return -1;
        memcpy(copy, msg, len - 1);
        copy[len - 1] = '\0';
        int count = 0;
        char *start = copy;
        while (1) {
          if (count >= want) return -1;
          fields[count++] = start;
          char *hash = strchr(start, '#');
          if (!hash) break;
          *hash = '\0';
          start = hash + 1;
        }
        if (count != want) return -1;
        for (int i = 0; i < want; i++) if (fields[i][0] == '\0') return -1;
        return 0;
      }

      static int parse_int_field(const char *s, int *out) {
        char *end = NULL;
        long v = strtol(s, &end, 10);
        if (!end || *end != '\0') return -1;
        *out = (int)v;
        return 0;
      }

      static int parse_double_field(const char *s, double *out) {
        char *end = NULL;
        double v = strtod(s, &end);
        if (!end || *end != '\0') return -1;
        *out = v;
        return 0;
      }

      int calc_serialize_request(const struct calc_req *req, char *out, size_t cap) {
        if (!req || !out) return -1;
        char m[16];
        if (calc_method_to_str(req->method, m, sizeof(m)) != 0) return -1;
        int n = snprintf(out, cap, "%d#%s#%.1f#%.1f$", req->id, m, req->operand1, req->operand2);
        if (n < 0 || (size_t)n >= cap) return -1;
        return n;
      }

      int calc_parse_request(const char *msg, size_t len, struct calc_req *out) {
        char copy[256];
        char *f[4];
        if (!out || split_fields(msg, len, copy, sizeof(copy), f, 4) != 0) return -1;
        struct calc_req tmp;
        method_t m;
        if (parse_int_field(f[0], &tmp.id) != 0) return -1;
        if (calc_method_from_str(f[1], &m) != 0) return -1;
        tmp.method = m;
        if (parse_double_field(f[2], &tmp.operand1) != 0) return -1;
        if (parse_double_field(f[3], &tmp.operand2) != 0) return -1;
        *out = tmp;
        return 0;
      }

      int calc_serialize_response(const struct calc_resp *resp, char *out, size_t cap) {
        if (!resp || !out) return -1;
        int n = snprintf(out, cap, "%d#%d#%.1f$", resp->req_id, resp->status, resp->result);
        if (n < 0 || (size_t)n >= cap) return -1;
        return n;
      }

      int calc_parse_response(const char *msg, size_t len, struct calc_resp *out) {
        char copy[256];
        char *f[3];
        if (!out || split_fields(msg, len, copy, sizeof(copy), f, 3) != 0) return -1;
        struct calc_resp tmp;
        if (parse_int_field(f[0], &tmp.req_id) != 0) return -1;
        if (parse_int_field(f[1], &tmp.status) != 0) return -1;
        if (parse_double_field(f[2], &tmp.result) != 0) return -1;
        *out = tmp;
        return 0;
      }
  - path: framing.h
    content: |
      #ifndef FRAMING_H
      #define FRAMING_H

      #include <stddef.h>

      #define FRAME_BUFFER_CAP 256

      struct frame_parser {
        char buffer[FRAME_BUFFER_CAP];
        size_t used;
      };

      void fp_init(struct frame_parser *p);
      int fp_feed(struct frame_parser *p, const char *data, size_t n);
      int fp_next(struct frame_parser *p, char *out, size_t out_cap);

      #endif
  - path: framing.c
    content: |
      #include <string.h>
      #include "framing.h"

      void fp_init(struct frame_parser *p) {
        if (p) p->used = 0;
      }

      int fp_feed(struct frame_parser *p, const char *data, size_t n) {
        if (!p) return -1;
        if (n > 0 && !data) return -1;
        if (p->used + n > FRAME_BUFFER_CAP) return -1;
        if (n > 0) memcpy(p->buffer + p->used, data, n);
        p->used += n;
        return 0;
      }

      int fp_next(struct frame_parser *p, char *out, size_t out_cap) {
        if (!p || !out) return -1;
        char *sep = memchr(p->buffer, '$', p->used);
        if (!sep) return 0;
        size_t frame_len = (size_t)(sep - p->buffer);
        if (frame_len + 1 > out_cap) return -1;
        memcpy(out, p->buffer, frame_len);
        out[frame_len] = '\0';
        size_t consumed = frame_len + 1;
        size_t remain = p->used - consumed;
        memmove(p->buffer, p->buffer + consumed, remain);
        p->used = remain;
        return 1;
      }
