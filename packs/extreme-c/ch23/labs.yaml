      #include "client_main.h"

      int calc_client_run(const char *sock_path) {
        if (!sock_path || !*sock_path) return -1;
        if (strlen(sock_path) >= sizeof(((struct sockaddr_un *)0)->sun_path)) return -1;

        int conn_sd = socket(AF_UNIX, SOCK_STREAM, 0);
        if (conn_sd < 0) return -1;

        struct sockaddr_un addr;
        memset(&addr, 0, sizeof(addr));
        addr.sun_family = AF_UNIX;
        strncpy(addr.sun_path, sock_path, sizeof(addr.sun_path) - 1);

        if (connect(conn_sd, (struct sockaddr *)&addr, sizeof(addr)) < 0) {
          close(conn_sd);
          return -1;
        }

        const struct calc_req reqs[] = {
          {1, ADD, 1.5, 5.6},
          {2, ADDM, 1.0, 2.0},
          {3, GETMEM, 0.0, 0.0},
          {4, SUBM, 10.0, 2.0},
          {5, MULM, 2.0, 3.0},
          {6, RESMEM, 0.0, 0.0},
          {7, GETMEM, 0.0, 0.0},
          {8, DIV, 1.0, 0.0},
          {9, DIV, 9.0, 3.0},
          {10, NONE, 0.0, 0.0}
        };

        for (size_t i = 0; i < sizeof(reqs) / sizeof(reqs[0]); i++) {
          struct calc_resp resp;
          if (calc_client_exchange(conn_sd, &reqs[i], &resp) != 0) {
            close(conn_sd);
            return -1;
          }
          printf("%d status=%d result=%.1f\n", reqs[i].id, resp.status, resp.result);
        }

        close(conn_sd);
        return 0;
      }

      #ifdef CALC_STANDALONE
      int main(int argc, char **argv) {
        const char *path = argc > 1 ? argv[1] : "/tmp/calc_lab4.sock";
        return calc_client_run(path) == 0 ? 0 : 1;
      }

      #endif
