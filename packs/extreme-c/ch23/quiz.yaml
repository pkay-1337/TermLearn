    concept: "htons-conversion-token"

  - kind: order
    level: advanced
    q: "Order the algorithmic steps executed by a stream server worker thread to process an incoming client request:"
    lines:
      - "Read byte chunks from the client socket descriptor into an input buffer."
      - "Serialize the response struct into a delimited wire frame string."
      - "Execute the calculator service arithmetic operation on request operands."
      - "Deserialize bytes via ring buffer, extracting a validated request struct."
      - "Write the serialized response frame back to the client socket descriptor."
    answer_order: [0, 3, 2, 1, 4]
    why: |
      The request-response lifecycle order: 1. read() bytes, 2. deserialize into struct, 3. execute service logic,
