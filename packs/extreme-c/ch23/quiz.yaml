quiz:
  - kind: mcq
    level: intro
    q: "What fundamental architectural characteristic distinguishes push-based IPC (such as sockets) from pull-based IPC (such as shared memory)?"
    choices:
      - "Push-based IPC requires all participating processes to execute on distinct physical CPU cores"
      - "Push-based IPC delivers data to an active kernel channel buffer that notifies readers; pull-based IPC requires readers to poll a passive shared medium"
      - "Push-based IPC stores messages permanently on the hard disk before transmission"
      - "Pull-based IPC cannot be used between processes created by the same user"
    answer: 1
    why: |
      In push-based IPC (sockets, pipes), data written by the sender is pushed into kernel buffers that automatically
      signal or unblock reader processes. In pull-based IPC (shared memory, files), processes must actively coordinate
      and poll a shared storage medium, risking race conditions without explicit locking.
      Options A, C, and D describe fictitious limitations.
    concept: "push-vs-pull-ipc-contrast"

  - kind: predict
    level: core
    q: "Trace byte swapping. On a Little Endian CPU, what hexadecimal bytes are printed for htons(0x4321)?"
    code: |
      #include <stdio.h>
      #include <stdint.h>
      #include <arpa/inet.h>

      int main(void) {
        uint16_t val = 0x4321;
        uint16_t net = htons(val);
        uint8_t* p = (uint8_t*)&net;
        printf("%02x %02x\n", p[0], p[1]);
        return 0;
      }
    choices:
      - "21 43"
      - "00 43"
      - "00 21"
      - "43 21"
    answer: 3
    why: |
      htons() converts host byte order to Network Byte Order (Big Endian), placing the most significant byte
      (0x43) at index 0 and least significant byte (0x21) at index 1.
      Option A represents Little Endian host byte order. Options B and C are corrupted values.
    concept: "htons-byte-order-trace"

  - kind: why-fails
    level: core
    q: "Why does calling lseek() on an active Unix Domain or TCP socket descriptor fail with return value -1 and errno = ESPIPE?"
    choices:
      - "Sockets represent continuous stream or datagram channels without an addressable file offset or persistent block storage"
      - "The socket must first be converted into a regular file using fcntl()"
      - "lseek() requires superuser permissions when invoked on network descriptors"
      - "The file descriptor table only supports seek operations on odd-numbered descriptors"
    answer: 0
    why: |
      Under POSIX, socket descriptors represent communication conduits, not storage files. Data passing
      through a socket is consumed as it is read, so there is no persistent file offset to reposition.
      The kernel returns ESPIPE ("Illegal seek"). Options B, C, and D are false claims.
    concept: "socket-no-seek-principle"

  - kind: order
    level: core
    q: "Order the system calls executed by a stream client to establish a connection, send a request, and disconnect:"
    lines:
      - "int conn_sd = socket(AF_INET, SOCK_STREAM, 0);"
      - "write(conn_sd, req_buf, req_len);"
      - "connect(conn_sd, (struct sockaddr*)&srv_addr, sizeof(srv_addr));"
      - "close(conn_sd);"
      - "read(conn_sd, resp_buf, sizeof(resp_buf));"
      - "bind(conn_sd, ...); // Distractor: stream clients don't bind"
    answer_order: [0, 2, 1, 4, 3]
    distractor_why:
      "bind(conn_sd, ...); // Distractor: stream clients don't bind": "Stream clients do not call bind(); connect() initiates the connection directly."
    why: |
      Standard stream client sequence: 1. socket() allocation, 2. connect() to server, 3. write() request,
      4. read() response, 5. close() descriptor.
    concept: "stream-client-sequence"

  - kind: mcq
    level: advanced
    q: "Why is a Unix Domain datagram client required to explicitly bind() to a unique client socket file, unlike an IPv4 UDP client?"
    choices:
      - "UDS datagrams enforce AES encryption which requires a filesystem key file"
      - "The Linux kernel terminates datagram sockets that do not have an associated file descriptor"
      - "UDS lacks an automatic path allocator; without binding a client path, recvfrom() on the server receives an empty sender address and cannot reply"
      - "UDP network sockets require root permissions to allocate client ports"
    answer: 2
    why: |
      In network UDP (AF_INET), the kernel automatically assigns a dynamic ephemeral port when an unbound client
      sends a datagram. In Unix Domain Datagrams (AF_UNIX), the kernel has no automatic filesystem path generator.
      Unless the client explicitly binds to a path (e.g. /tmp/calc_cli.sock), the server's recvfrom() captures an
      empty address and cannot route replies back. Options A, B, and D are fabricated.
    concept: "uds-datagram-client-bind"

  - kind: spot-bug
    level: core
    q: "Analyze the server initialization code. Which line causes bind() to fail with EADDRINUSE when restarting the daemon?"
    code: |
      #include <sys/socket.h>
      #include <sys/un.h>
      #include <string.h>

      int start_server(const char* sock_path) {
        int sd = socket(AF_UNIX, SOCK_STREAM, 0);
        struct sockaddr_un addr;
        memset(&addr, 0, sizeof(addr));
        addr.sun_family = AF_UNIX;
        strncpy(addr.sun_path, sock_path, sizeof(addr.sun_path) - 1);
        // Line 11: Missing cleanup of pre-existing socket file!
        if (bind(sd, (struct sockaddr*)&addr, sizeof(addr)) == -1) {
          return -1;
        }
        return sd;
      }
    diagnostic_log: |
      bind failed: Address already in use
    target_line: 11
    choices:
      - "Line 6: socket() must specify SOCK_DGRAM for Unix domain files"
      - "Line 11: Omitting unlink(sock_path) before bind() causes failure if a previous run left the socket file on disk"
      - "Line 9: sun_path must end with a colon"
    answer: 1
    why: |
      Unix Domain Sockets create a special socket file in the filesystem. When a server exits, this file remains
      on disk. A subsequent bind() will refuse to overwrite an existing filesystem node and fails with EADDRINUSE
      unless unlink(sock_path) is called first. Options A and C describe invalid syntax rules.
    concept: "uds-unlink-before-bind-bug"

  - kind: fillblank
    level: intro
    q: "Fill in the address family constant used to create a Unix Domain Socket for local single-host IPC:"
    code: |
      int sd = socket(_______, SOCK_STREAM, 0);
    answer_text: "AF_UNIX"
    why: |
      AF_UNIX (or AF_LOCAL) designates the Unix Domain Socket address family for local single-host IPC.
      AF_INET designates IPv4 network sockets.
    concept: "af-unix-family-constant"

  - kind: mcq
    level: intro
    q: "What is the primary operational difference between SOCK_STREAM and SOCK_DGRAM socket types?"
    choices:
      - "SOCK_STREAM provides an ordered, continuous byte-stream; SOCK_DGRAM transmits discrete, boundary-preserving datagram packets"
      - "SOCK_STREAM only operates over loopback; SOCK_DGRAM only operates over the Internet"
      - "SOCK_STREAM requires root access; SOCK_DGRAM can be run by unprivileged users"
      - "SOCK_STREAM disallows bidirectional communication"
    answer: 0
    why: |
      SOCK_STREAM provides reliable, ordered, two-way byte streams where individual writes may be coalesced or
      fragmented. SOCK_DGRAM provides connectionless, record-oriented communication where message boundaries
      are strictly preserved. Options B, C, and D are false.
    concept: "stream-vs-datagram-fundamentals"

  - kind: trace
    level: core
    q: "Trace stream message extraction. If the buffer contains '101#ADD#1#2$202#SUB#4#1$', how many complete messages are terminated by '$'?"
    code: |
      const char* stream = "101#ADD#1#2$202#SUB#4#1$";
      int count = 0;
      for (const char* p = stream; *p; p++) {
        if (*p == '$') count++;
      }
    trace:
      headers: ["Buffer Stream", "Terminator Count", "Extracted Message Count"]
      rows:
        - step: 1
          line: 4
          cells: ["'101#ADD#1#2$202#SUB#4#1$'", "2", "???"]
    target: {row: 0, col: 2}
    choices: ["1", "4", "2", "0"]
    answer: 2
    why: |
      Each complete message frame terminates with '$'. The buffer contains two '$' characters, meaning exactly
      2 complete messages ("101#ADD#1#2" and "202#SUB#4#1") are available for extraction.
      Option A only counts the first message. Option B counts the '#' delimiters.
    concept: "stream-framing-trace"

  - kind: why-fails
    level: advanced
    q: "Why does restarting a TCP server immediately after termination often cause bind() to fail with EADDRINUSE unless SO_REUSEADDR is enabled?"
    choices:
      - "The kernel refuses to reallocate ports above 1024 to the same user"
      - "TCP sockets require a system reboot to clear their internal ARP cache"
      - "The operating system drops all executable memory segments after socket close"
      - "The terminated connection lingers in the kernel's TIME_WAIT state for 30–120 seconds to catch delayed network packets"
    answer: 3
    why: |
      TCP's TIME_WAIT state ensures that late or duplicated packets from a previous connection do not corrupt
      subsequent connections on the same port. During this period, the port remains reserved in the kernel.
      Enabling SO_REUSEADDR allows the kernel to bind the listening socket even while prior sockets linger in TIME_WAIT.
      Options A, B, and C state fictitious mechanisms.
    concept: "time-wait-eaddrinuse-rationale"

  - kind: mcq
    level: core
    q: "In the calculator application protocol, what role do the '#' and '$' characters play in message transmission?"
    choices:
      - "'#' delimits adjacent fields within a message; '$' terminates and demarcates the complete message frame"
      - "'#' indicates floating-point numbers; '$' indicates integer status codes"
      - "'#' triggers server-side memory reset; '$' initiates client disconnection"
      - "'#' is an escape character for non-printable binary characters"
    answer: 0
    why: |
      In the calculator protocol, '#' is the field delimiter separating attributes (id, method, op1, op2),
      and '$' is the message separator/terminator signaling the end of an entire request or response frame.
      Options B, C, and D are incorrect.
    concept: "protocol-delimiter-roles"

  - kind: predict
    level: intro
    q: "Trace the execution of this response formatting code. What exact string is written to stdout?"
    code: |
      #include <stdio.h>

      int main(void) {
        int req_id = 42;
        int status = 0; // STATUS_OK
        double result = 15.5;
        char buf[32];
        snprintf(buf, sizeof(buf), "%d#%d#%.1f$", req_id, status, result);
        printf("%s\n", buf);
        return 0;
      }
    choices:
      - "42#0#15.5"
      - "42#0#15.5$"
      - "REQ42#STATUS0#15.5$"
      - "42,0,15.5$"
    answer: 1
    why: |
      snprintf formats req_id (42), delimiter '#', status (0), delimiter '#', result with one decimal (15.5),
      and terminator '$', yielding "42#0#15.5$".
      Option A omits the terminator '$'. Option C adds field prefixes. Option D uses commas.
    concept: "response-formatting-trace"

  - kind: mcq
    level: advanced
    q: "Why is the calculator service class (calc_service_t) designed with zero dependencies on socket descriptors, network headers, and serialization structs?"
    choices:
      - "Network headers cannot be included in files compiled with optimization level -O0"
      - "POSIX sockets require all arithmetic to be performed in 32-bit fixed point"
      - "The C standard prohibits structs containing both function pointers and file descriptors"
      - "To decouple computational business logic from transport and wire protocols, allowing standalone unit testing and multi-transport reuse"
    answer: 3
    why: |
      Decoupling core business logic from transport ensures that arithmetic operations can be tested
      independently without network mocks, and allows the service to be deployed behind UDS, TCP, UDP,
      or embedded CLI harnesses without code changes. Options A, B, and C state fictitious language rules.
    concept: "service-transport-decoupling"

  - kind: why-fails
    level: core
    q: "Why does sharing a single calc_service_t instance across multiple concurrent client threads cause silent data corruption?"
    choices:
      - "The C runtime aborts the process if a struct is read by more than one thread"
      - "calc_service_t can only allocate memory on thread 0's stack frame"
      - "The service is stateful, maintaining an internal accumulator memory that would be overwritten by conflicting client operations"
      - "Dynamic memory allocated via malloc cannot be accessed across thread boundaries"
    answer: 2
    why: |
      The calculator service maintains client-specific state (an internal memory accumulator modified by
      ADDM, SUBM, and RESMEM). Sharing one instance among concurrent clients causes race conditions where
      Client A's calculations overwrite Client B's accumulator value. Options A, B, and D are false claims.
    concept: "stateful-service-race-hazard"

  - kind: spot-bug
    level: advanced
    q: "Analyze the client socket write loop. Which defect causes the client process to crash abruptly if the server crashes during transmission?"
    code: |
      void send_request(int sd, const char* data, int len) {
        // Line 2: Writing to socket without ignoring SIGPIPE or using MSG_NOSIGNAL!
        int ret = write(sd, data, len);
        if (ret == -1) {
          perror("write failed");
        }
      }
    diagnostic_log: |
      Process terminated by signal SIGPIPE (Broken pipe)
    target_line: 2
    choices:
      - "Line 2: Writing to a socket after the peer closed its connection generates SIGPIPE, killing the process unless SIG_IGN or MSG_NOSIGNAL is used"
      - "Line 3: write() return value cannot be stored in a signed integer"
      - "Line 4: perror() is not thread-safe in C99"
    answer: 0
    why: |
      Under POSIX, writing to a socket descriptor whose connection has been terminated by the remote peer
      delivers a SIGPIPE signal. The default disposition of SIGPIPE is to terminate the process immediately.
      Robust network programs ignore SIGPIPE (signal(SIGPIPE, SIG_IGN)) or use send() with MSG_NOSIGNAL.
      Options B and C state non-existent issues.
    concept: "sigpipe-broken-pipe-bug"

  - kind: mcq
    level: intro
    q: "What is the purpose of the backlog parameter passed to listen(server_sd, backlog)?"
    choices:
      - "It specifies the timeout in seconds before closing idle connections"
      - "It limits the maximum buffer size in kilobytes for individual socket reads"
      - "It defines the maximum number of completed incoming connection requests queued in the kernel awaiting accept()"
      - "It allocates worker threads in the thread pool"
    answer: 2
    why: |
      The backlog parameter defines the maximum length to which the queue of pending incoming connections
      for server_sd may grow in the kernel while waiting for the application to call accept().
      Options A, B, and D describe other networking or threading concepts.
    concept: "listen-backlog-definition"

  - kind: fillblank
    level: core
    q: "Fill in the POSIX byte-order conversion function that converts a 16-bit port number from host byte order to network byte order:"
    code: |
      addr.sin_port = ___________(port_number);
    answer_text: "htons"
    why: |
      htons() (Host to Network Short) converts a 16-bit integer from host byte order to Network Byte Order (Big Endian).
