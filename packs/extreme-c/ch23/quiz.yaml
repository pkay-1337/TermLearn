      Option B confuses buffer size with byte count. Option C assumes single character. Option D assumes EOF.
    concept: "recvfrom-byte-count-trace"

  - kind: mcq
    level: core
    q: "Why do stream protocols (SOCK_STREAM) require an explicit message framing mechanism such as a delimiter character or length header?"
    choices:
      - "Stream sockets do not calculate IP checksums on transmitted packets"
      - "Stream sockets only operate in synchronous half-duplex mode"
      - "Stream sockets require all payloads to be encrypted using SSL"
      - "Stream sockets deliver an unstructured continuous stream of bytes where message boundaries are not preserved by the kernel"
    answer: 3
    why: |
      In SOCK_STREAM (TCP and UDS stream), data is sent as an undifferentiated stream of bytes. Individual reads
      may return partial messages or multiple coalesced messages. Application-level framing (delimiters or length headers)
      is essential for the receiver to isolate discrete message units. Options A, B, and C are false.
    concept: "stream-framing-necessity"
  - kind: why-fails
    level: intro
    q: "Why does calling socket(AF_UNIX, SOCK_STREAM, 0) fail if the operating system process has exhausted its file descriptor limit?"
    choices:
      - "The kernel requires sockets to use file descriptors starting at 1024"
      - "Sockets consume an entry in the process file descriptor table, failing with EMFILE when the descriptor table is full"
      - "AF_UNIX sockets require hardware network adapter buffers"
      - "The C standard library only permits one socket descriptor per process"
    answer: 1
    why: |
      Under Unix, a socket descriptor is an entry in the process's file descriptor table (just like open files
      and pipes). If the process has reached its open file limit (RLIMIT_NOFILE), socket() fails with EMFILE.
      Options A, C, and D state fictitious system constraints.
    concept: "socket-descriptor-table-limits"

  - kind: trace
    level: advanced
    q: "Trace byte placement. When uint32_t val = 0x11223344 is converted via htonl() on Little Endian, what byte is stored at index 0 in memory?"
    code: |
      uint32_t val = 0x11223344;
      uint32_t net = htonl(val);
      uint8_t* p = (uint8_t*)&net;
      printf("Byte 0: 0x%02x\n", p[0]);
    trace:
      headers: ["Host Value (Hex)", "Conversion", "Byte 0 (Address 0)"]
      rows:
        - step: 1
          line: 4
          cells: ["0x11223344", "htonl() Big Endian", "???"]
    target: {row: 0, col: 2}
    choices: ["0x44", "0x22", "0x11", "0x33"]
    answer: 2
    why: |
      htonl() places the 32-bit integer into Network Byte Order (Big Endian), which stores the most significant
      byte (0x11) at the lowest memory address (p[0]).
      Option A is the least significant byte (Host order on Little Endian). Options B and D are intermediate bytes.
    concept: "htonl-big-endian-trace"

  - kind: mcq
    level: advanced
    q: "What is the critical behavioral distinction between shutdown(sd, SHUT_RDWR) and close(sd)?"
    choices:
      - "close() only works on Unix domain sockets; shutdown() only works on TCP sockets"
      - "shutdown() immediately terminates protocol communications and sends TCP FIN regardless of other descriptor references; close() merely decrements the file descriptor reference count"
      - "shutdown() deletes the socket file from the filesystem; close() leaves it intact"
      - "close() encrypts socket buffers before release"
    answer: 1
    why: |
      close() decrements the kernel reference count for the file table entry (e.g. if the descriptor was
      duplicated across fork()). Sockets remain active until all references close. shutdown() immediately
      disables bidirectional communication and transmits TCP FIN regardless of how many descriptors refer to it.
      Options A, C, and D are incorrect.
    concept: "shutdown-vs-close-distinction"

  - kind: spot-bug
    level: core
    q: "Analyze the pathname assignment code. Which line triggers an out-of-bounds memory write when copying the socket path?"
    code: |
      int init_uds(const char* path) {
        int sd = socket(AF_UNIX, SOCK_STREAM, 0);
        struct sockaddr_un addr;
        memset(&addr, 0, sizeof(addr));
        addr.sun_family = AF_UNIX;
        // Line 7: Unbounded strcpy into fixed 108-byte array!
        strcpy(addr.sun_path, path);
        return bind(sd, (struct sockaddr*)&addr, sizeof(addr));
      }
    diagnostic_log: |
      *** stack smashing detected ***: terminated
    target_line: 7
    choices:
      - "Line 2: socket() must specify SOCK_RAW"
      - "Line 4: memset corrupts sun_family"
      - "Line 8: bind() requires addr to be cast to void*"
      - "Line 7: Using strcpy allows paths exceeding 108 bytes to smash the stack frame; strncpy with bound sizeof(addr.sun_path) - 1 must be used"
    answer: 3
    why: |
      struct sockaddr_un defines sun_path as a fixed 108-byte array. Using strcpy() with untrusted or long
      path inputs causes a buffer overflow, corrupting the stack frame and triggering stack protector aborts.
      Options A, B, and C state incorrect rules.
    concept: "sun-path-buffer-overflow-bug"

  - kind: mcq
    level: intro
    q: "When configuring a server's struct sockaddr_in address structure, what does assigning INADDR_ANY to addr.sin_addr.s_addr achieve?"
    choices:
      - "It binds the listening socket to all local IPv4 network interfaces (0.0.0.0), accepting connections addressed to any host IP"
      - "It causes the kernel to reject connections from non-local subnets"
      - "It configures the socket to listen exclusively on loopback (127.0.0.1)"
      - "It assigns a random IPv6 address to the interface"
    answer: 0
    why: |
      INADDR_ANY (equivalent to 0.0.0.0) instructs the socket layer to bind to all available IP addresses
      on the local machine, allowing incoming connections arriving on Ethernet, Wi-Fi, or loopback interfaces.
      Options B, C, and D describe other network configurations.
    concept: "inaddr-any-purpose"

