  - kind: why-fails
    level: advanced
    q: "Why does passing a 20-byte buffer to recvfrom() on a datagram socket fail when the incoming packet is 50 bytes long?"
    choices:
      - "The kernel discards the excess 30 bytes (or sets MSG_TRUNC), corrupting the application payload"
      - "The kernel splits the 50-byte datagram into three separate packets"
      - "Datagram sockets automatically convert to stream sockets"
      - "The recvfrom() system call hangs until another 20-byte packet arrives"
    answer: 0
    why: |
      Datagram sockets preserve message boundaries and deliver packets in atomic operations. If the receiving
      buffer is smaller than the datagram payload, the kernel truncates the message to the buffer size and
      silently discards the remaining bytes (unless MSG_PEEK or MSG_TRUNC flags are inspected).
      Options B, C, and D describe impossible behaviors.
    concept: "datagram-truncation-hazard"

  - kind: mcq
    level: core
    q: "On a stream socket, what does a return value of 0 from read(sd, buf, len) signify?"
    choices:
      - "The kernel buffer was full and dropped the packet"
      - "The remote peer closed its connection (EOF: End-of-File)"
      - "The system call was interrupted by a signal"
      - "A zero-length UDP ping was received"
    answer: 1
    why: |
      In POSIX stream I/O, read() returning 0 indicates that the sender has closed the channel (EOF), having
      sent a TCP FIN or shut down its descriptor.
      Option A describes an error. Option C is EINTR (return value -1). Option D confuses stream with datagrams.
    concept: "socket-read-eof-semantics"

