  - kind: mcq
    level: advanced
    q: "Why are Unix Domain Sockets substantially faster than TCP loopback connections (127.0.0.1) on a single Linux host?"
    choices:
      - "UDS sockets are processed by graphics acceleration units"
      - "TCP loopback sockets cannot buffer more than 256 bytes in kernel space"
      - "UDS transfers data directly across kernel buffers without traversing TCP/IP protocol layers, packet segmentation, or checksumming"
      - "UDS bypasses the operating system kernel entirely using hardware DMA"
    answer: 2
    why: |
      Unix Domain Sockets bypass the entire TCP/IP networking stack. There is no IP header encapsulation,
      TCP sliding window tracking, TCP checksumming, or routing table lookup. Data copies directly between
      kernel socket buffers. Options A, B, and D state fictitious claims.
    concept: "uds-performance-advantage"

  - kind: predict
    level: core
    q: "Trace request serialization. What is the wire frame generated for id=12, method=MUL, op1=3.0, op2=4.0?"
    code: |
      // Delimiters: '#' for fields, '$' for frame termination
      struct calc_proto_req_t req = {
        .id = 12, .method = MUL, .operand1 = 3.0, .operand2 = 4.0
      };
      // Format: <id>#<method>#<op1>#<op2>$
    choices:
      - "12#MUL#3.0#4.0"
      - "12#MUL#3.0#4.0$"
      - "REQ#12#MUL#3.0#4.0$"
      - "12,MUL,3.0,4.0$"
    answer: 1
    why: |
      The calculator protocol formats requests as: id ('12') + '#' + method ('MUL') + '#' + op1 ('3.0') +
      '#' + op2 ('4.0') + '$', yielding "12#MUL#3.0#4.0$".
      Option A omits the terminator '$'. Option C adds an unprompted prefix. Option D uses commas.
    concept: "request-wire-format-trace"

  - kind: why-fails
    level: core
    q: "Why does connect() on a Unix Domain stream socket fail with errno = ENOENT if the server has not yet started?"
    choices:
      - "The client executable was compiled with an outdated version of glibc"
      - "The kernel requires client sockets to be created before server sockets"
      - "AF_UNIX sockets require the server process to be the parent of the client"
      - "The specified socket file path does not exist in the filesystem because the server has not yet created and bound it"
    answer: 3
    why: |
      In Unix Domain Sockets, the server creates the socket file in the filesystem upon invoking bind().
      If a client calls connect() before the server has run bind(), the filesystem path does not exist,
      causing connect() to fail with ENOENT ("No such file or directory"). Options A, B, and C are false.
    concept: "uds-enoent-server-not-started"

  - kind: mcq
    level: intro
    q: "What is the maximum allowed byte length for a socket file pathname in struct sockaddr_un on Linux?"
    choices:
      - "108 bytes (including null terminator)"
      - "256 bytes"
      - "4096 bytes (standard Linux PATH_MAX)"
      - "64 bytes"
    answer: 0
    why: |
      The Linux kernel defines sun_path in struct sockaddr_un as an array of exactly 108 chars (104 chars
      in traditional 4.4BSD/POSIX systems). Paths exceeding this limit cause buffer overflow or truncation.
      Options B, C, and D are incorrect sizes.
    concept: "sockaddr-un-path-limit-size"

  - kind: mcq
    level: core
    q: "How does an unbound UDP client socket obtain a local port number when sending its first datagram via sendto()?"
    choices:
      - "It transmits on port 0, requiring the destination server to assign a port"
      - "The compiler assigns a port number based on the line number of sendto()"
      - "The operating system kernel automatically binds the socket to an available ephemeral port"
      - "The client must read an ephemeral port from /dev/urandom"
    answer: 2
    why: |
      When an application invokes sendto() on an unbound UDP socket, the kernel automatically assigns a free
      ephemeral port from its dynamic port range (e.g. /proc/sys/net/ipv4/ip_local_port_range) and binds it.
      Options A, B, and D describe fictitious behaviors.
    concept: "udp-ephemeral-port-mechanics"

  - kind: spot-bug
    level: advanced
    q: "Analyze the socket write routine. Which defect leads to truncated messages under heavy network load?"
    code: |
      void transmit_message(int sd, const char* data, int total_bytes) {
        // Line 2: Assuming write() always transmits all bytes in a single call!
        int sent = write(sd, data, total_bytes);
        if (sent == -1) {
          perror("write failed");
        }
      }
    diagnostic_log: |
      WARN: Less bytes were written! Remote parser reported truncated frame.
    target_line: 2
    choices:
      - "Line 3: write() return value cannot be compared with -1"
      - "Line 2: write() on stream sockets may transmit fewer bytes than requested under buffer pressure; a loop must be used until all bytes are sent"
      - "Line 4: perror() must not be called after socket I/O"
    answer: 1
    why: |
      Under network congestion or when the kernel socket buffer is nearly full, write() may transmit only a partial
      buffer (e.g. 50 of 100 bytes) and return the partial byte count. Applications must loop over write() updating
      the pointer and remaining count until total_bytes have been sent. Options A and C state non-existent rules.
    concept: "partial-write-loop-necessity"

  - kind: mcq
    level: advanced
    q: "Why can a UDP datagram server easily handle hundreds of concurrent clients using a single thread, whereas a blocking stream server requires multithreading or an event loop?"
    choices:
      - "UDP packets are routed in hardware without operating system kernel interaction"
      - "UDP sockets run exclusively on real-time microkernel threads"
      - "The UDP standard forbids servers from maintaining more than 1 active socket descriptor"
      - "UDP transactions are self-contained, connectionless datagrams containing sender address metadata, allowing the server to process and reply without maintaining open connection descriptors"
    answer: 3
    why: |
      In UDP, there are no persistent connections to maintain. The server reads a datagram via recvfrom(),
      processes the message, dispatches the response via sendto() using the captured client address, and immediately
      services the next datagram from any client. In blocking stream sockets, each client holds an open descriptor
      that blocks on read(), necessitating a dedicated thread or event multiplexer. Options A, B, and C are false.
    concept: "udp-stateless-single-thread-scaling"

  - kind: predict
    level: intro
    q: "Trace calculator subtraction without memory. What is the return value of calc_service_sub(svc, 15.0, 7.0, 0)?"
    code: |
      calc_service_t* svc = calc_service_new();
      // use_mem = 0 (false)
      double res = calc_service_sub(svc, 15.0, 7.0, 0);
      printf("%.1f\n", res);
    choices:
      - "8.0"
      - "22.0"
      - "-8.0"
      - "0.0"
    answer: 0
    why: |
      Subtraction calculates op1 - op2. 15.0 - 7.0 = 8.0. Because use_mem is 0, the accumulator memory is
      neither added nor updated. The result is 8.0.
      Option B is addition. Option C is reversed subtraction. Option D assumes zeroing.
    concept: "service-subtraction-trace"

  - kind: why-fails
    level: intro
    q: "Why does accept(server_sd, NULL, NULL) block program execution when called on a newly initialized stream server?"
    choices:
      - "The socket was compiled without POSIX thread support"
      - "accept() requires client IP addresses to be pre-registered in /etc/hosts"
      - "By default, stream listener sockets are blocking; accept() suspends execution until an incoming connection arrives in the backlog queue"
      - "The firewall automatically blocks all calls to accept()"
    answer: 2
    why: |
      Sockets in Unix are blocking by default. When accept() is called on a listening socket whose backlog queue
      is empty, the kernel puts the calling thread to sleep until a client connects.
      Options A, B, and D state fictitious causes.
    concept: "accept-blocking-behavior"

  - kind: mcq
    level: core
    q: "What is the primary role of the owner_obj pointer in calc_proto_ser_ctor and its associated callback functions?"
    choices:
      - "It stores the process ID of the server daemon"
      - "It specifies the heap allocation limit for the deserializer"
      - "It contains the decryption key for the application protocol"
      - "It provides an opaque context pointer allowing the callback to access the client session state without relying on global variables"
    answer: 3
    why: |
      In C callback design, an opaque void* context pointer (owner_obj) enables the callback to safely access
      instance data (such as the client context, socket descriptor, or service instance) without polluting the
      global namespace or risking multi-threaded race conditions. Options A, B, and C are false.
    concept: "callback-context-pointer-role"

  - kind: mcq
    level: advanced
    q: "In a production server running an accept_forever loop, how should the application handle an accept() failure returning -1 with errno = EINTR?"
    choices:
      - "Immediately terminate the daemon process with exit(1)"
      - "Resume the accept loop (continue) because EINTR merely indicates that a system signal interrupted the blocking call before a connection completed"
      - "Close the server socket and re-bind to a different port"
      - "Switch the socket to UDP datagram mode"
    answer: 1
    why: |
      EINTR indicates that the blocking accept() call was interrupted by a caught signal (such as SIGCHLD, SIGHUP,
      or SIGALRM). The server socket remains completely healthy, and the application should simply retry
      the call by continuing the loop. Crashing on EINTR makes daemons brittle and fragile. Options A, C, and D are defects.
    concept: "eintr-signal-resilience"
