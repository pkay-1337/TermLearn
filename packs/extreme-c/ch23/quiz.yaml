    concept: "server-processing-cycle-order"

  - kind: predict
    level: core
    q: "Trace UDP datagram reception. If a sender transmits 8 bytes on a datagram socket, what integer does recvfrom() return when provided a 32-byte buffer?"
    code: |
      // Sender:
      sendto(sd, "12345678", 8, 0, (struct sockaddr*)&srv, len);

      // Receiver:
      char buf[32];
      int n = recvfrom(sd, buf, sizeof(buf), 0, NULL, NULL);
