  - kind: predict
    level: core
    q: A calculator client closes its socket after one request. The handler thread is blocked in
      read(context.addr->sd, buffer, 128). What happens next?
    code: |
      while (1) {
        int ret = read(context.addr->sd, buffer, 128);
        if (ret == 0 || ret == -1) {
          break;
        }
        /* feed buffer to the serializer */
      }
