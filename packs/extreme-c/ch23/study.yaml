  - id: b8
    type: model
    title: "Architect Unix Domain Datagram Services and Client Return Addressing"
    explain_md: |
      Unix Domain Datagram sockets (`AF_UNIX`, `SOCK_DGRAM`) combine the high performance of kernel-space IPC with
      connectionless, packet-oriented delivery. Unlike stream servers, a datagram server does NOT call `listen()`
      or `accept()`. It creates a socket, binds it to a socket file (`/tmp/calc_svc.sock`), and immediately enters
      a `recvfrom()` loop.

      Because datagram channels are connectionless, every incoming packet is an atomic entity carrying the sender's
      address metadata. In `recvfrom(sd, buf, sz, 0, (struct sockaddr*)&client_addr, &addr_len)`, the kernel populates
      `client_addr` with the sender's identity. The server processes the request and dispatches the response via
      `sendto(sd, resp_buf, resp_len, 0, (struct sockaddr*)&client_addr, addr_len)`.

      **The Critical UDS Datagram Invariant**:
      In UDP over IP (`AF_INET`), when an unbound client sends a packet, the kernel automatically assigns an
      ephemeral port, providing the server with a valid return address. In Unix Domain Datagrams (`AF_UNIX`),
      **THERE IS NO AUTOMATIC PATH ASSIGNMENT**. If a UDS datagram client does not explicitly `bind()` its socket
      to a unique client socket file (e.g., `/tmp/calc_cli.sock`), its address structure in `recvfrom()` is empty!
      The server will have NO destination pathname to send the reply to. Therefore, UDS datagram clients MUST
      bind to their own client socket file before transmitting.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <string.h>
        #include <unistd.h>
        #include <sys/socket.h>
        #include <sys/un.h>

        int main(void) {
          const char* srv_path = "/tmp/test_uds_dgram_srv.sock";
          const char* cli_path = "/tmp/test_uds_dgram_cli.sock";
          unlink(srv_path); unlink(cli_path);

          int srv_sd = socket(AF_UNIX, SOCK_DGRAM, 0);
          struct sockaddr_un srv_addr = { .sun_family = AF_UNIX };
          strncpy(srv_addr.sun_path, srv_path, sizeof(srv_addr.sun_path) - 1);
          bind(srv_sd, (struct sockaddr*)&srv_addr, sizeof(srv_addr));

          int cli_sd = socket(AF_UNIX, SOCK_DGRAM, 0);
          struct sockaddr_un cli_addr = { .sun_family = AF_UNIX };
          strncpy(cli_addr.sun_path, cli_path, sizeof(cli_addr.sun_path) - 1);
          bind(cli_sd, (struct sockaddr*)&cli_addr, sizeof(cli_addr));

          sendto(cli_sd, "REQ", 3, 0, (struct sockaddr*)&srv_addr, sizeof(srv_addr));
          char buf[16] = {0};
          struct sockaddr_un from; socklen_t from_len = sizeof(from);
          recvfrom(srv_sd, buf, sizeof(buf), 0, (struct sockaddr*)&from, &from_len);
          printf("Server received: %s from %s\n", buf, from.sun_path);

          close(srv_sd); close(cli_sd);
          unlink(srv_path); unlink(cli_path);
          return 0;
        }
      run_expected: "Server received: REQ from /tmp/test_uds_dgram_cli.sock\n"
      subgoals:
        - label: "Bind server socket file"
          lines: [14, 15, 16, 17]
        - label: "Bind client socket file (vital for return path!)"
          lines: [19, 20, 21, 22]
        - label: "Transmit datagram and inspect populated sender address"
          lines: [24, 25, 26, 27]
    viz:
      kind: ascii-memory
      steps:
        - "CLIENT BIND: Client binds socket to /tmp/calc_cli.sock (Filesystem return inode created)"
        - "DATAGRAM TRANSMIT: Client sendto(/tmp/calc_svc.sock) -> Kernel packages data + client path metadata"
        - "SERVER RECV: recvfrom() extracts '1000#ADD#1#2$' and populates from_addr = '/tmp/calc_cli.sock'"
        - "SERVER REPLY: sendto(server_sd, resp, from_addr) -> Kernel routes reply directly to client socket file"
        - "CRITICAL FAILURE IF UNBOUND: Client omits bind() -> from_addr is empty -> Server cannot reply!"
    checks:
      - kind: why-fails
        q: "Why must a Unix Domain datagram client call bind() to a unique socket file before sending requests?"
        choices:
          - "AF_UNIX sockets reject packets unless the client process runs with superuser privileges"
          - "Without binding a client socket file, recvfrom() on the server receives an empty sender address and cannot route replies back"
          - "The kernel requires client files to allocate memory for the client's file descriptor table"
          - "bind() is required to encrypt datagrams transmitted through the filesystem"
        answer: 1
        why: |
          Unlike IP network sockets where the kernel automatically selects an ephemeral IP/port, UDS datagram
          sockets have no automatic filesystem path generator. If the client does not bind to a path,
          the server receives an address structure with sun_path[0] = '\0' and sendto() fails.
          Options A, C, and D are fabricated requirements.
        concept: "uds-datagram-client-bind-requirement"

      - kind: predict
        q: "Trace the execution of this UDS datagram server. What is printed by printf when the client transmits 'CALC'?"
        code: |
          char buf[16] = {0};
          struct sockaddr_un sender;
          socklen_t len = sizeof(sender);
          recvfrom(server_sd, buf, sizeof(buf), 0, (struct sockaddr*)&sender, &len);
          printf("Length: %lu, Msg: %s\n", strlen(buf), buf);
        choices:
          - "Length: 0, Msg: "
          - "Length: 16, Msg: CALC"
          - "Length: 4, Msg: CALC"
          - "Length: 5, Msg: CALC$"
        answer: 2
        why: |
          The incoming datagram contains the 4 characters 'C', 'A', 'L', 'C'. recvfrom populates buf,
          which was zero-initialized, leaving a null terminator at index 4. strlen(buf) is 4, printing
          "Length: 4, Msg: CALC". Option A assumes empty read. Option B assumes full buffer. Option D adds '$'.
        concept: "uds-recvfrom-trace"

      - kind: mcq
        q: "Why does a Unix Domain datagram server NOT invoke listen() or accept() during initialization?"
        choices:
          - "Datagram sockets are connectionless; communication occurs via discrete packets rather than persistent 1-to-1 connection streams"
          - "listen() is deprecated in POSIX 2008 for all Unix domain sockets"
          - "The kernel automatically spawns listener threads whenever socket(AF_UNIX) is called"
          - "accept() only works over network interfaces that support ARP resolution"
        answer: 0
        why: |
          listen() and accept() are connection-oriented mechanisms for establishing persistent stream channels
          (SOCK_STREAM). In datagram communication (SOCK_DGRAM), there are no connections to listen for or accept;
          sockets exchange independent packets directly via sendto() and recvfrom().
          Options B, C, and D state fictitious claims.
        concept: "datagram-no-listen-accept"

      - kind: spot-bug
        q: "Analyze the code for a UDS datagram server. Which line contains a fatal concurrency defect when replying to clients?"
        code: |
          void serve(int srv_sd) {
            char buf[64];
            struct sockaddr_un cli;
            socklen_t len = sizeof(cli);
            recvfrom(srv_sd, buf, sizeof(buf), 0, (struct sockaddr*)&cli, &len);
            // Line 7: Hardcoded destination path instead of using cli.sun_path!
            const char* fixed_path = "/tmp/client.sock";
            struct sockaddr_un target = { .sun_family = AF_UNIX };
            strncpy(target.sun_path, fixed_path, sizeof(target.sun_path) - 1);
            sendto(srv_sd, "RESP", 4, 0, (struct sockaddr*)&target, sizeof(target));
          }
        diagnostic_log: |
          Bug: Server replies always routed to single client, ignoring actual sender
        target_line: 7
        choices:
          - "Line 4: socklen_t must be passed by value to recvfrom"
          - "Line 5: recvfrom requires flag MSG_WAITALL on datagram sockets"
          - "Line 7: Hardcoding target path sends all responses to /tmp/client.sock instead of the dynamic sender address in cli"
        answer: 2
        why: |
          In a multi-client datagram environment, each client binds to its own unique socket file (e.g. client_1.sock,
          client_2.sock). Hardcoding the reply destination to a static path on line 7 routes all replies to that one file,
          corrupting communication for all other concurrent clients.
          Options A and B describe invalid socket usage.
        concept: "datagram-return-address-bug"

      - kind: eipe
        q: "In one sentence, what is the role of the sockaddr and socklen pointers in recvfrom()?"
        choices:
          - "They allow the kernel to populate the source address metadata of the incoming packet so the receiver knows where to send a reply"
          - "They configure the kernel to drop all packets originating from external IP networks"
          - "They dynamically reallocate the application receive buffer if the packet exceeds 64 bytes"
          - "They authenticate the sender's Unix permissions against the sudoers file"
        answer: 0
        why: |
          recvfrom() acts as an output parameter for the sender's addressing information. When a datagram arrives,
          the kernel writes the sender's address and its length into the provided pointers, enabling subsequent
          replies via sendto(). Options B, C, and D are completely fictitious.
        concept: "recvfrom-address-extraction-purpose"

      - kind: trace
        q: "Trace socket file unlinking. How many total socket files exist on the filesystem after both clients complete and unlink?"
        code: |
          // Server creates: /tmp/srv.sock
          // Client 1 creates: /tmp/cli1.sock
          // Client 2 creates: /tmp/cli2.sock
          // Client 1 calls unlink("/tmp/cli1.sock")
          // Client 2 calls unlink("/tmp/cli2.sock")
          // Server remains active
        trace:
          headers: ["Event", "File Remaining on Disk", "Total Count"]
          rows:
            - step: 1
              line: 6
              cells: ["Clients disconnected and unlinked", "/tmp/srv.sock", "???"]
        target: {row: 0, col: 2}
        choices: ["0", "3", "1", "2"]
        answer: 2
        why: |
          Both client socket files (/tmp/cli1.sock and /tmp/cli2.sock) were explicitly deleted via unlink().
          Only the server's socket file (/tmp/srv.sock) remains bound and active on the filesystem, yielding 1 file.
          Option A assumes server unlinked. Option B assumes clients didn't unlink. Option D is an off-by-one.
        concept: "socket-filesystem-cleanup-trace"

  - id: b9
    type: model
    title: "Convert Endianness and Formulate IPv4 Internet Socket Addresses"
    explain_md: |
      Moving from Unix Domain Sockets to Network Sockets introduces network architecture constraints, primarily
      address representation and CPU byte ordering (endianness).

      Internet IPv4 sockets use the `AF_INET` address family and are configured via `struct sockaddr_in`
      (from `<netinet/in.h>`):
      - `sin_family`: Set to `AF_INET`.
      - `sin_port`: 16-bit TCP or UDP port number.
      - `sin_addr.s_addr`: 32-bit IPv4 address (e.g. `INADDR_ANY` to bind to all local interfaces, or converted via
        `inet_pton(AF_INET, "127.0.0.1", &addr.sin_addr)`).

      **The Endianness / Byte Order Rule**:
      Modern host CPUs (such as x86_64 and ARM in standard modes) are Little Endian: multi-byte integers are stored
      with the least significant byte (LSB) at the lowest memory address. In contrast, standard Internet protocols
      mandate Network Byte Order, which is **Big Endian**: the most significant byte (MSB) comes first.

      If a program assigns a port directly (`addr.sin_port = 8080`), on a Little Endian machine the byte pattern
      `0x1F90` is placed into memory backwards (`0x90`, `0x1F`), causing the kernel to bind to port 36895 (`0x901F`)!
      To prevent this, programs MUST convert integers using POSIX byte-order macros:
      - `htons(val)` / `ntohs(val)`: Host-to-Network / Network-to-Host Short (16-bit, for ports).
      - `htonl(val)` / `ntohl(val)`: Host-to-Network / Network-to-Host Long (32-bit, for IPv4 addresses).
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdint.h>
        #include <arpa/inet.h>

        int main(void) {
          uint16_t host_port = 8080; // 0x1F90
          uint16_t net_port = htons(host_port);
          uint8_t* p = (uint8_t*)&net_port;
          printf("Port: %u, Bytes in memory: 0x%02x 0x%02x\n",
                 host_port, p[0], p[1]);
          return 0;
        }
      run_expected: "Port: 8080, Bytes in memory: 0x1f 0x90\n"
      subgoals:
        - label: "Declare port in host byte order"
          lines: [6]
        - label: "Convert to network byte order (Big Endian)"
          lines: [7]
        - label: "Inspect physical memory bytes"
          lines: [8, 9, 10]
    viz:
      kind: ascii-memory
      steps:
        - "HOST (Little Endian, x86): Port 8080 (0x1F90) in RAM -> [Addr 0: 0x90 (LSB)] [Addr 1: 0x1F (MSB)]"
        - "htons(8080) CONVERSION: Swaps bytes to Big Endian Network Order"
        - "NETWORK BYTE ORDER: [Addr 0: 0x1F (MSB)] [Addr 1: 0x90 (LSB)] -> Wire transmits 0x1F then 0x90"
        - "FAILURE TRAP: Assigning sin_port = 8080 without htons -> Kernel binds to port 0x901F = 36895!"
    checks:
      - kind: predict
        q: "Trace byte swapping. On a Little Endian CPU, what hexadecimal bytes are printed for htons(0x1234)?"
        code: |
          #include <stdio.h>
          #include <stdint.h>
          #include <arpa/inet.h>

          int main(void) {
            uint16_t val = 0x1234;
            uint16_t net = htons(val);
            uint8_t* p = (uint8_t*)&net;
            printf("%02x %02x\n", p[0], p[1]);
            return 0;
          }
        choices:
          - "34 12"
          - "00 34"
          - "00 12"
          - "12 34"
        answer: 3
        why: |
          htons() converts host order to Network Byte Order (Big Endian), placing the most significant byte
          (0x12) at index 0 and least significant byte (0x34) at index 1, printing "12 34".
          Option A is host order before conversion. Options B and C are corrupt representations.
        concept: "htons-byte-order-trace"

      - kind: trace
        q: "Trace integer conversion across ntohs(). If net_val holds Big Endian [0x01, 0x00], what host integer value does ntohs(net_val) return?"
        code: |
          uint16_t net_val;
          uint8_t* p = (uint8_t*)&net_val;
          p[0] = 0x01; // MSB
          p[1] = 0x00; // LSB
          uint16_t host_val = ntohs(net_val);
        trace:
          headers: ["Raw Memory Bytes", "Big Endian Value", "ntohs() Return Value"]
          rows:
            - step: 1
              line: 5
              cells: ["[0x01, 0x00]", "0x0100", "???"]
        target: {row: 0, col: 2}
        choices: ["1", "256", "65536", "0"]
        answer: 1
        why: |
          In Big Endian, 0x01 at MSB and 0x00 at LSB represents (1 * 256) + 0 = 256. ntohs() interprets
          the network bytes and returns the host integer 256.
          Option A assumes LSB at index 0. Option C is 2^16. Option D ignores index 0.
        concept: "ntohs-integer-trace"

      - kind: why-fails
        q: "Why does assigning 'addr.sin_port = 6666;' without htons() cause a client on another machine to fail to connect?"
        choices:
          - "The kernel interprets 6666 in host byte order, binding the server to an unintended port (e.g. 27162 on Little Endian)"
          - "Ports above 1024 cannot be opened without invoking htons()"
          - "The compiler inserts a breakpoint trap on un-converted socket assignments"
          - "sin_port is an 8-bit field that overflows when assigned 6666"
        answer: 0
        why: |
          6666 in hex is 0x1A0A. On a Little Endian host, assigning 6666 directly places 0x0A then 0x1A into memory.
          The network stack reads this in Big Endian as 0x0A1A = 2586 (or vice versa), listening on the wrong port.
          Options B, C, and D are false claims.
        concept: "missing-htons-port-corruption"

      - kind: mcq
        q: "What does setting 'addr.sin_addr.s_addr = INADDR_ANY;' accomplish when binding a server socket?"
        choices:
          - "It configures the socket to accept only loopback connections from 127.0.0.1"
          - "It generates a random available IP address using DHCP"
          - "It binds the server to all available network interfaces on the local host (0.0.0.0)"
          - "It allows the server to bypass operating system firewall rules"
        answer: 2
        why: |
          INADDR_ANY (0.0.0.0) binds the server to all local network interfaces (e.g. Ethernet, Wi-Fi, loopback),
          allowing it to accept incoming connections destined for any of the host's IP addresses.
          Options A, B, and D describe incorrect behaviors.
        concept: "inaddr-any-semantics"

      - kind: fillblank
        q: "Fill in the standard POSIX conversion function that converts a 32-bit integer from host byte order to network byte order:"
        code: |
          uint32_t net_ip = ___________(host_ip);
        answer_text: "htonl"
        why: |
          htonl() (Host to Network Long) converts 32-bit unsigned integers from host byte order to network byte order.
          htons() converts 16-bit values.
        concept: "htonl-conversion-function"

      - kind: spot-bug
        q: "Analyze the sockaddr_in initialization. Which line contains a fatal addressing defect?"
        code: |
          int setup_address(struct sockaddr_in* addr, int port) {
            memset(addr, 0, sizeof(*addr));
            // Line 3: Setting sun_family instead of sin_family!
            addr->sin_family = AF_UNIX;
            addr->sin_port = htons(port);
            addr->sin_addr.s_addr = INADDR_ANY;
            return 0;
          }
        diagnostic_log: |
          bind: Address family not supported by protocol
        target_line: 3
        choices:
          - "Line 2: memset corrupts kernel socket pointers"
          - "Line 4: htons must be replaced by ntohs"
          - "Line 5: INADDR_ANY requires explicit casting to void*"
          - "Line 3: addr->sin_family must be set to AF_INET for network IPv4 sockets, not AF_UNIX"
        answer: 3
        why: |
          AF_UNIX specifies Unix domain sockets. Passing AF_UNIX inside a struct sockaddr_in to an AF_INET
          socket triggers EAFNOSUPPORT (Address family not supported by protocol). It must be AF_INET.
          Options A, B, and C state incorrect requirements.
        concept: "sin-family-mismatch-bug"

  - id: b10
    type: syntax
    title: "Deploy TCP Network Servers with Address Reusability"
    explain_md: |
      A TCP server provides reliable, connection-oriented network communication using `AF_INET` and `SOCK_STREAM`.
      Architecturally, once a connection is accepted, TCP sockets behave almost identically to Unix Domain stream
      sockets: data is read and written as an unstructured byte stream using `read()` and `write()`, and multithreading
      is employed to handle concurrent clients.

      However, network servers must manage the TCP connection state machine, particularly the `TIME_WAIT` state.
      When a server terminates or restarts, recent TCP connections remain in `TIME_WAIT` in the kernel for up to
      several minutes to ensure stray packets in the network are cleanly dissipated. During this interval, restarting
      the server and invoking `bind()` on the same port fails with `EADDRINUSE` ("Address already in use").

      To prevent this downtime during development and deployment, servers configure socket options via `setsockopt()`
      before binding:
      ```c
      int enable = 1;
      setsockopt(server_sd, SOL_SOCKET, SO_REUSEADDR, &enable, sizeof(enable));
      ```
      This instructs the kernel to permit immediate reuse of local addresses in `TIME_WAIT`, allowing the server
      daemon to restart instantaneously without port collision errors.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <string.h>
        #include <unistd.h>
        #include <sys/socket.h>
        #include <netinet/in.h>

        int main(void) {
          int sd = socket(AF_INET, SOCK_STREAM, 0);
          int enable = 1;
          setsockopt(sd, SOL_SOCKET, SO_REUSEADDR, &enable, sizeof(enable));

          struct sockaddr_in addr;
          memset(&addr, 0, sizeof(addr));
          addr.sin_family = AF_INET;
          addr.sin_addr.s_addr = INADDR_ANY;
          addr.sin_port = htons(9999);

          if (bind(sd, (struct sockaddr*)&addr, sizeof(addr)) == 0) {
            printf("TCP Server bound to port %u\n", ntohs(addr.sin_port));
            listen(sd, 10);
          }
          close(sd);
          return 0;
        }
      run_expected: "TCP Server bound to port 9999\n"
      subgoals:
        - label: "Create TCP stream socket descriptor"
          lines: [8]
        - label: "Enable SO_REUSEADDR socket option"
          lines: [9, 10]
        - label: "Configure sockaddr_in and bind port"
          lines: [12, 13, 14, 15, 16, 18]
    checks:
      - kind: order
        q: "Order the initialization steps required to bring up a production-ready TCP server:"
        lines:
          - "setsockopt(sd, SOL_SOCKET, SO_REUSEADDR, &enable, sizeof(enable));"
          - "int sd = socket(AF_INET, SOCK_STREAM, 0);"
          - "accept(sd, (struct sockaddr*)&client, &client_len);"
          - "bind(sd, (struct sockaddr*)&addr, sizeof(addr));"
          - "listen(sd, backlog);"
        answer_order: [1, 0, 3, 4, 2]
        why: |
          Correct order: 1. socket() creation, 2. setsockopt(SO_REUSEADDR) before bind, 3. bind() to port,
          4. listen() for backlog queue, 5. accept() client connections.
        concept: "tcp-server-setup-order"

      - kind: mcq
        q: "What critical problem does enabling the SO_REUSEADDR socket option solve for network server daemons?"
        choices:
          - "It encrypts inbound TCP packets against man-in-the-middle attacks"
          - "It allows the server to bind to its port immediately after restart without failing due to lingering TIME_WAIT sockets"
          - "It permits multiple distinct processes to read from the exact same TCP socket descriptor simultaneously"
          - "It disables TCP flow control to maximize raw wire throughput"
        answer: 1
        why: |
          When a TCP server shuts down, existing sockets linger in the TIME_WAIT state for 30–120 seconds.
          Without SO_REUSEADDR, calling bind() on that port during this period immediately fails with EADDRINUSE.
          Options A, C, and D describe fictitious capabilities.
        concept: "so-reuseaddr-purpose"

      - kind: why-fails
        q: "Why does invoking setsockopt(sd, SOL_SOCKET, SO_REUSEADDR, ...) AFTER calling bind() fail to prevent EADDRINUSE?"
        choices:
          - "bind() checks address availability during its execution; options set after bind cannot alter prior binding validation"
          - "setsockopt() is only valid after listen() has been invoked"
          - "SO_REUSEADDR can only be applied to datagram sockets"
          - "The kernel resets socket descriptors to default settings upon every bind() call"
        answer: 0
        why: |
          bind() performs the conflict check against existing sockets and the TIME_WAIT table when it runs.
          If SO_REUSEADDR has not already been enabled on the descriptor prior to bind(), bind() will reject the
          conflicting address immediately. Options B, C, and D are false claims.
        concept: "setsockopt-ordering-constraint"

      - kind: spot-bug
        q: "Analyze the TCP client connection code. Which line causes the connection to fail due to incorrect byte ordering?"
        code: |
          int connect_server(const char* ip, int port) {
            int sd = socket(AF_INET, SOCK_STREAM, 0);
            struct sockaddr_in addr;
            memset(&addr, 0, sizeof(addr));
            addr.sin_family = AF_INET;
            inet_pton(AF_INET, ip, &addr.sin_addr);
            // Line 8: Port assigned in host byte order!
            addr.sin_port = port;
            if (connect(sd, (struct sockaddr*)&addr, sizeof(addr)) == -1) {
              close(sd);
              return -1;
            }
            return sd;
          }
        diagnostic_log: |
          connect: Connection refused
        target_line: 8
        choices:
          - "Line 6: inet_pton requires an IP string formatted in hexadecimal"
          - "Line 4: AF_INET requires sockaddr_un rather than sockaddr_in"
          - "Line 8: addr.sin_port must be wrapped in htons(port) to convert from host byte order to network byte order"
        answer: 2
        why: |
          Assigning addr.sin_port = port assigns host byte order. On a Little Endian machine, port 6666 is read
          by connect() as port 2586 (or similar byte-swapped value), targeting a non-existent port on the server
          and failing with ECONNREFUSED. It must be htons(port). Options A and B state false syntax rules.
        concept: "client-port-byte-order-bug"

      - kind: choose-better
        q: "Which error-handling strategy is appropriate when accepting clients in an infinite accept_forever loop?"
        choices:
          - |
            // Immediately terminate entire server process if a single client accept fails
            int client_sd = accept(server_sd, NULL, NULL);
            if (client_sd == -1) {
              exit(1);
            }
          - |
            // Log transient network errors (like ECONNABORTED or EINTR) and continue listening
            int client_sd = accept(server_sd, NULL, NULL);
            if (client_sd == -1) {
              if (errno == EINTR || errno == ECONNABORTED) continue;
              perror("accept error");
              break;
            }
        answer: 1
        why: |
          A production server must be resilient. Transient network errors (such as a client disconnecting
          before accept completes: ECONNABORTED, or a signal interruption: EINTR) should not crash the entire
          daemon. The server should log and continue serving other incoming connections. Option A is brittle.
        concept: "accept-error-resilience-choice"

      - kind: predict
        from_chapter: ch11
        from_block: b3
        q: "In an object-oriented C architecture, if a generic server delegates socket read operations through a function pointer vtable, what technique is being applied?"
        code: |
          typedef struct {
            int (*read_msg)(void* self, char* buf, int sz);
            int (*write_msg)(void* self, const char* buf, int sz);
          } transport_vtable_t;

          typedef struct {
            transport_vtable_t* vtable;
            int sd;
          } transport_t;
        choices:
          - "Polymorphism: decoupling abstract socket I/O from specific underlying transport implementations"
          - "Multiple inheritance with virtual base classes"
          - "Kernel-mode packet filtering via BPF"
          - "Compiler optimization for loop unrolling"
        answer: 0
        why: |
          Defining an interface struct with function pointers (vtable) and invoking methods through that table
          is the classic C implementation of runtime polymorphism. This enables stream server cores to operate
          transparently across UDS and TCP transports. Options B, C, and D are incorrect.
        concept: "interleaved-polymorphic-vtable"

  - id: b11
    type: algorithm
    title: "Dispatch UDP Datagram Transactions and Ephemeral Port Routing"
    explain_md: |
      UDP (`AF_INET`, `SOCK_DGRAM`) provides lightweight, connectionless datagram networking. It shares the same
      message-boundary preservation and packet semantics as Unix Domain datagrams, but operates across IP networks.

      A UDP server binds to an IP address and port, and executes `recvfrom()` in a loop. Because transactions are
      discrete packets, a UDP server can effortlessly serve thousands of clients using a simple single-threaded loop:
      ```c
      recvfrom(server_sd, buf, sz, 0, (struct sockaddr*)&cli_addr, &cli_len);
      // Process calculation...
      sendto(server_sd, resp, len, 0, (struct sockaddr*)&cli_addr, cli_len);
      ```

      **The Network Ephemeral Port Mechanism**:
      In stark contrast to Unix Domain Datagrams (where clients MUST call `bind()` to a local pathname to establish
      a return address), a UDP client does NOT need to call `bind()`. When an unbound UDP socket calls
      `sendto(conn_sd, ..., (struct sockaddr*)&srv_addr, ...)`, the operating system kernel automatically allocates
      a free ephemeral port (typically in the range 32768–60999) and binds it to the socket.

      The server's `recvfrom()` automatically captures this client IP and ephemeral port in `cli_addr`, allowing
      the server to transmit replies directly back to the client with zero manual client configuration.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <string.h>
        #include <unistd.h>
        #include <sys/socket.h>
        #include <netinet/in.h>

        int main(void) {
          int srv_sd = socket(AF_INET, SOCK_DGRAM, 0);
          struct sockaddr_in srv = {
            .sin_family = AF_INET,
            .sin_addr.s_addr = htonl(INADDR_LOOPBACK),
            .sin_port = htons(9876)
          };
          bind(srv_sd, (struct sockaddr*)&srv, sizeof(srv));

          int cli_sd = socket(AF_INET, SOCK_DGRAM, 0);
          sendto(cli_sd, "CALC", 4, 0, (struct sockaddr*)&srv, sizeof(srv));

          char buf[16] = {0};
          struct sockaddr_in from;
          socklen_t len = sizeof(from);
          recvfrom(srv_sd, buf, sizeof(buf), 0, (struct sockaddr*)&from, &len);
          printf("UDP Server received: %s from port %u\n", buf, ntohs(from.sin_port));

          close(srv_sd);
          close(cli_sd);
          return 0;
        }
      subgoals:
        - label: "Bind UDP server to loopback IP and port"
          lines: [8, 9, 10, 11, 12, 13, 14]
        - label: "Send datagram from unbound client socket"
          lines: [16, 17]
        - label: "Receive datagram and inspect kernel-assigned ephemeral port"
          lines: [19, 20, 21, 22, 23]
    checks:
      - kind: predict
        q: "Trace UDP client port assignment. When the unbound client calls sendto(), what port does the server observe in recvfrom()?"
        code: |
          int cli_sd = socket(AF_INET, SOCK_DGRAM, 0);
          // Notice: No bind() call on client socket!
          sendto(cli_sd, "PING", 4, 0, (struct sockaddr*)&srv, sizeof(srv));
        choices:
          - "Port 0"
          - "Port 80"
          - "A dynamic ephemeral port assigned automatically by the operating system kernel (e.g. 45123)"
          - "Port 9876 (mirrors the destination server port)"
        answer: 2
        why: |
          For UDP network sockets, the kernel automatically assigns a random free ephemeral port from its
          dynamic port range upon the first sendto() call. The server captures this ephemeral port in recvfrom()
          and uses it to route the reply. Option A assumes no port. Option B is HTTP. Option D confuses source with dest.
        concept: "udp-ephemeral-port-assignment"

      - kind: mcq
        q: "Why can a UDP calculator server remain single-threaded while serving multiple concurrent clients, unlike a blocking stream server?"
        choices:
          - "UDP packets are processed directly inside CPU L1 cache without kernel context switches"
          - "The UDP protocol requires all clients to share a single global mutex"
          - "Single-threaded execution is mandated by IEEE 802.3 Ethernet standards"
          - "Each UDP request is an independent datagram accompanied by sender address metadata, allowing the server to process and reply without maintaining connection state"
        answer: 3
        why: |
          In UDP, there are no persistent connections or stateful stream channels to maintain open in blocking
          threads. The server simply reads one datagram, computes the response, dispatches it to the sender's
          address via sendto(), and immediately moves to the next datagram.
          Options A, B, and C state fictitious rules.
        concept: "udp-single-threaded-scalability"

      - kind: why-fails
        q: "Why does sending a 70,000-byte UDP datagram fail with EMSGSIZE or trigger packet loss?"
        choices:
          - "UDP requires all packets to be exactly 1024 bytes"
          - "The standard IPv4 maximum transmission unit (MTU) and 16-bit UDP length field limit packets to under 65,535 bytes"
          - "The C standard library caps sendto() buffers at 4096 bytes"
          - "socket(AF_INET, SOCK_DGRAM) rejects packets unless compressed with gzip"
        answer: 1
        why: |
          The UDP header defines a 16-bit total length field (header + data), imposing an absolute theoretical limit
          of 65,535 bytes (and practical network MTUs are typically 1500 bytes). Attempting to send a 70,000-byte
          datagram exceeds the protocol maximum and fails with EMSGSIZE. Options A, C, and D are false claims.
        concept: "udp-packet-size-limit"

      - kind: eipe
        q: "In one sentence, what distinguishes the client binding requirement in Unix Domain datagrams from UDP datagrams?"
        choices:
          - "UDS datagram clients must explicitly bind a filesystem path because the kernel lacks an automatic path allocator, whereas UDP kernels assign ephemeral ports automatically"
          - "UDS datagrams require socket descriptors to be converted to pipes"
          - "UDP datagrams do not support floating-point operands"
          - "UDS datagrams enforce encryption on all transmitted payloads"
        answer: 0
        why: |
          In AF_INET UDP, the kernel provides automatic ephemeral port assignment so servers receive a valid
          return address without client binding. In AF_UNIX datagrams, there is no automatic path generator,
          requiring the client to explicitly bind its own socket file. Options B, C, and D are false.
        concept: "uds-vs-udp-client-bind-contrast"

      - kind: fillblank
        q: "Fill in the socket type constant used to create a connectionless UDP network socket:"
        code: |
          int udp_sd = socket(AF_INET, ___________, 0);
        answer_text: "SOCK_DGRAM"
        why: |
          SOCK_DGRAM specifies a datagram socket (UDP over AF_INET). SOCK_STREAM specifies a stream socket (TCP).
        concept: "udp-sock-dgram-constant"

      - kind: trace
        q: "Trace datagram routing. If 3 separate UDP clients send datagrams to the server, how many socket descriptors does the server use to receive and reply to all 3?"
        code: |
          int server_sd = socket(AF_INET, SOCK_DGRAM, 0);
          bind(server_sd, ...);
          // Loop receiving from clients 1, 2, and 3:
          while (1) {
            recvfrom(server_sd, buf, ...);
            sendto(server_sd, resp, ...);
          }
        trace:
          headers: ["Clients Serviced", "Server Socket Descriptors Allocated"]
          rows:
            - step: 1
              line: 6
              cells: ["Client 1, Client 2, Client 3", "???"]
        target: {row: 0, col: 1}
        choices: ["3", "1", "6", "0"]
        answer: 1
        why: |
          In UDP, the server uses a single bound socket descriptor (server_sd) to receive packets from all
          clients and send replies back to their respective addresses. No new descriptors are created.
          Option A confuses UDP with TCP accept(). Option C assumes dual descriptors per client.
        concept: "udp-single-descriptor-trace"
