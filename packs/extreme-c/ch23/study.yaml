blocks:
- id: b1
  type: model
  title: Contrast Pull-Based Media with Push-Based Socket Channels
  explain_md: |
    Every IPC technique belongs to one of two families. **Pull-based** techniques
    (shared memory, regular files) expose a medium that is external to both
    processes. A process must *pull* bytes out of that medium, and because
    several processes may write to it, they must synchronize access themselves;
    the medium can outlive the processes that use it.

    **Push-based** techniques (signals, pipes, message queues, and every socket)
    expose a *channel* instead. Data is pushed into a kernel buffer owned by the
    receiver and is reached through a descriptor. The receiver either blocks
    until bytes arrive or polls the descriptor. Socket programming is always in
    the push family.

    A **socket descriptor** is not a file descriptor. A socket descriptor always
    names a two-way channel: the same object can be read from and written to.
    A file descriptor can name a medium (a regular file) or a channel (a pipe).
    Operations that assume a storage medium, such as seeking, are invalid for a
    socket descriptor and fail. This is why the same read/write/close API works
    on sockets while seek does not.
  viz:
    kind: ascii-memory
    steps:
    - 'PULL: producer --> [ file / shared memory medium ] --> consumer pulls later; medium persists; user-level locks needed'
    - 'PUSH: producer --> [ kernel buffer of receiver ] --> receiver is notified by descriptor; kernel synchronizes the buffer'
    - 'DESCRIPTOR SPLIT: socket descriptor => always a channel; file descriptor => medium or channel'
    - 'SEEK RULE: lseek() needs a byte offset in a medium; a socket channel has no offset, so the call fails'
    - 'SOCKET I/O: read() and write() accept either descriptor kind because both are kernel I/O handles'
  checks:
  - kind: why-fails
    level: intro
    q: A producer writes a message into a shared file while the consumer is down, and the consumer reads it an hour later. Why does the same delivery fail when the producer pushes the message through a socket instead?
    choices:
    - A socket has no intermediate persistent medium, so a message pushed while the receiver is down can be lost
    - A socket silently buffers every message on disk until the receiver process starts again
    - A socket stores the message in a persistent medium, but only after the receiver acknowledges it
    answer: 0
    why: |
      Push-based channels deliver into the kernel buffer of the receiver
      process, and that buffer exists only while the receiver runs. Nothing
      persists after the receiver is gone, so a push made while the receiver
      is down can be lost. A shared file is pull-based: its bytes remain in
      the medium and can be fetched much later.
      Option C invents persistence plus acknowledgement. Option B invents a
      disk-backed socket buffer; kernel buffers are not durable storage.
    concept: push-no-persistence
    from_chapter: ch22
    from_block: b1
  - kind: mcq
    level: intro
    q: Which group contains only push-based IPC techniques?
    choices:
    - Shared memory, regular files, and memory-mapped files
    - Signals, pipes, message queues, and sockets
    - Regular files, pipes, and shared memory segments
    answer: 1
    why: |
      Push-based techniques deliver data through a channel into a receiver's
      kernel buffer: signals, pipes, message queues, and sockets all work that
      way. The other options list pull-based media (shared memory and files).
      Option A mixes a push primitive with pull media. Option C mixes two pull
      media with a push primitive.
    concept: push-family-membership
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of the kernel buffer that every socket channel provides?
    choices:
    - It stores outgoing bytes permanently so they survive a later restart of the sender
    - It gives user code a place to put locks around data that several processes share
    - It holds incoming bytes for a running receiver and the kernel synchronizes access to it
    answer: 2
    why: |
      The kernel buffer belongs to the receiver and exists while it runs; the
      kernel, not user code, guarantees synchronized access. Option A steals
      the pull-model property of persistence. Option B moves synchronization
      into user space, which is the pull-model duty.
    concept: kernel-buffer-purpose
  - kind: predict
    level: core
    q: 'Trace line by line, tracking fd and errno: a valid socket descriptor is passed to lseek(fd, 0, SEEK_SET). What is the result?'
    code: |
      int fd = socket(AF_UNIX, SOCK_STREAM, 0);
      off_t pos = lseek(fd, 0, SEEK_SET);   /* socket, not a file */
    choices:
    - pos is -1 because a socket channel has no seekable byte offset
    - pos is the current number of unread bytes in the kernel buffer
    - pos is 0 because every descriptor starts at offset zero
    answer: 0
    why: |
      A socket descriptor names a channel, not a storage medium, so there is no
      byte offset to move. lseek fails and returns -1.
      Option C imports file semantics into a channel. Option B confuses the
      amount of buffered data with a file position.
    concept: socket-seek-invalid
  - kind: fillblank
    level: intro
    q: 'A socket descriptor always represents a two-way ___ rather than a storage medium. (Answer format: one word)'
    answer_text: channel
    why: |
      Sockets model two-way channels; files model media. This distinction is
      why the same read/write calls work on both while seek works only on a
      medium. Naming it a channel keeps the direction of data flow explicit.
    concept: socket-is-channel
  - kind: spot-bug
    level: core
    q: Diagnose the incorrect assumption in this cleanup helper and identify the line that misuses a socket descriptor.
    code: |
      void rewind_and_log(int fd) {
        if (lseek(fd, 0, SEEK_SET) == -1) {   /* line 2 */
          perror("lseek");
          return;
        }
        char byte;
        read(fd, &byte, 1);
      }
    diagnostic_log: |
      lseek: Illegal seek
    choices:
    - 'Line 7: read() cannot be used on a socket and must use recv() instead of read()'
    - 'Line 2: lseek() assumes a seekable medium, but fd is a socket channel with no offset'
    - 'Line 2: lseek() must be replaced by fseek() when the descriptor names a socket'
    answer: 1
    why: |
      The report "Illegal seek" is the kernel saying the descriptor has no
      offset. read() and write() work on sockets, but seek operations do not
      because a channel is not a medium.
      Option C only changes the spelling, not the storage model. Option A is
      false: read() works on socket descriptors inside a server read loop.
    concept: socket-seek-diagnosis
  source_ref: Text/socket_programming.xhtml - IPC push/pull distinction and socket channels
- id: b2
  type: model
  title: Choose Stream Versus Datagram Channels and UDS Versus Network Families
  explain_md: |
    Socket channels come in two shapes. A **stream channel** carries an ordered
    sequence of bytes between two specific processes; it is connection-oriented
    and modeled by a stream socket (`SOCK_STREAM`). A **datagram channel** carries
    discrete, independent messages; it is connection-less, several processes can
    share it, and it is modeled by a datagram socket (`SOCK_DGRAM`).

    Sockets also come in two address families. **UDS** (`AF_UNIX`) work only when
    every process is on the same host, and they are preferred there because they
    skip the network stack and have less overhead. **Network sockets** (`AF_INET`)
    work across hosts and on one host. Because each family can carry either
    channel shape, there are four varieties: UDS stream, UDS datagram, network
    stream, and network datagram.

    Names follow the underlying transport protocol: a network stream socket is
    usually a **TCP** socket and a network datagram socket is usually a **UDP**
    socket. UDS sockets have no such names because no transport protocol sits
    underneath them.
  viz:
    kind: ascii-memory
    steps:
    - 'CHANNEL SHAPE: SOCK_STREAM => ordered byte stream, two endpoints; SOCK_DGRAM => independent messages, shared channel'
    - 'ADDRESS FAMILY: AF_UNIX => one host, no network stack; AF_INET => network (also works on one host)'
    - 'FOUR VARIETIES: UDS stream | UDS datagram | network stream (TCP) | network datagram (UDP)'
    - 'NAMING: network stream is called TCP; network datagram is called UDP; UDS variants have no transport name'
    - 'CHOICE RULE: same-host => prefer UDS; cross-host => network sockets'
  checks:
  - kind: why-fails
    level: core
    q: A client sends three separate 10-byte application messages over a stream socket, yet one read() on the server returns 30 bytes. Why is this not a protocol bug?
    choices:
    - A stream socket merges messages only when they share the same request identifier
    - A stream socket preserves message boundaries only when the sender flushes explicitly
    - A stream socket carries a continuous byte stream and does not preserve message boundaries
    answer: 2
    why: |
      Stream channels deliver bytes in order but promise no message
      boundaries: the receiver may see a fragment, a full message, or several
      messages in one read. The application protocol must frame messages with a
      delimiter or length prefix.
      Option B invents a flush-based boundary rule. Option A ties framing to
      request identifiers, which are application data, not transport behavior.
    concept: stream-no-boundaries
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of preferring Unix Domain Sockets for a client and server that share one host?
    choices:
    - They avoid the network stack overhead and keep the channel inside the kernel of one host
    - They guarantee that every message is persisted to disk before the receiver reads it
    - They allow several unrelated hosts to share one filesystem socket path safely
    answer: 0
    why: |
      UDS stay on one host and bypass IP routing, checksums, and network device
      handling, so they are faster with less overhead. Option B confuses a
      socket path with durable storage. Option C contradicts the single-host
      restriction of AF_UNIX.
    concept: uds-single-host-benefit
  - kind: mcq
    level: intro
    q: Which list names the four socket varieties used in the calculator project?
    choices:
    - UDS packet, UDS stream, TCP datagram, and network stream
    - UDS stream, UDS datagram, TCP stream, and UDP datagram
    - UDS stream, UDS datagram, TCP datagram, and UDP stream
    answer: 1
    why: |
      Each address family can carry either channel shape, giving UDS stream,
      UDS datagram, network stream (TCP), and network datagram (UDP).
      Option C swaps the protocol-to-shape mapping. Option A invents a "UDS
      packet" family and again swaps TCP's channel shape.
    concept: four-socket-varieties
  - kind: predict
    level: core
    q: 'Trace the receiver calls: a stream sender writes "12#" then "34$" as two writes. A receiver reads once with a 64-byte buffer. What can it observe?'
    code: |
      write(sd, "12#", 3);
      write(sd, "34$", 3);
      char buf[64];
      int n = read(sd, buf, sizeof(buf));
    choices:
    - n can be 6 but the byte order depends on the receiver host
    - n is exactly 3 because read() returns one write at a time
    - n can be 6 and the bytes are "12#34$" in the same order
    answer: 2
    why: |
      A stream is an ordered byte sequence with no write-call boundaries, so a
      single read can return both writes concatenated in order.
      Option B assumes a message boundary that streams do not provide. Option A
      confuses stream byte order (preserved) with host integer byte order.
    concept: stream-read-coalescing
  - kind: choose-better
    level: advanced
    q: Which channel choice is better for transferring a large file between two processes on the same machine, and why?
    choices:
    - UDS stream, because ordered bytes and kernel-local transport fit bulk transfer with low overhead
    - UDS datagram, because each datagram can carry the entire file as one independent message
    - Network datagram, because UDP reassembles large payloads more efficiently than a stream
    answer: 0
    why: |
      Bulk data needs ordered, reliable byte delivery; a UDS stream avoids the
      network stack and supplies exactly that. Option B ignores the datagram
      size limit and loses ordering guarantees. Option C misstates UDP, which
      does not guarantee delivery or reassembly of application records.
    concept: stream-choice-for-bulk
  - kind: fillblank
    level: intro
    q: 'A network socket that offers a datagram channel is usually called a ___ socket. (Answer format: one word)'
    answer_text: UDP
    why: |
      Network datagram sockets normally run over the UDP transport protocol,
      so they are called UDP sockets. The protocol name comes from the
      transport layer, unlike UDS sockets which have no transport underneath.
    concept: udp-naming
  source_ref: Text/socket_programming.xhtml - socket descriptors, channels, and partial reads
- id: b3
  type: design
  title: Map the Calculator Project into Transport-Blind Libraries
  explain_md: |
    The calculator project deliberately separates concerns so the same logic can
    run behind any socket type. Four reusable pieces emerge:

    - **calcser** — the serializer/deserializer library. It defines the
      application protocol and builds `libcalcser.a`.
    - **calcsvc** — the calculation service. It holds pure calculator logic and
      builds `libcalcsvc.a`; it has no IPC or serialization dependency.
    - **srvcore** — server code shared by stream and datagram servers on any
      socket family; it builds `libsrvcore.a`.
    - **clicore** — client code shared by stream and datagram clients; it builds
      `libclicore.a`.

    Above these cores sit eight thin executables: four servers and four clients.
    Their `main` functions differ only in socket family, socket type, address
    structure, and port constants. Everything else is reused.

    The protocol is the contract that makes this possible: a textual,
    variable-length format with a `#` field delimiter and a `$` message
    separator, plus one request type and one response type.
  checks:
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of the calcser library in the calculator project?
    choices:
    - It schedules server threads and assigns each accepted client to a worker
    - It defines the request and response wire format and converts objects to and from bytes
    - It stores each client calculator memory in a file that survives process restarts
    answer: 1
    why: |
      calcser owns the application protocol: it serializes request/response
      objects into messages and deserializes incoming messages back into
      objects. Option C describes persistence, which no library here provides.
      Option A describes server concurrency, which lives in srvcore.
    concept: calcser-purpose
  - kind: why-fails
    level: core
    q: Why is the calculation service kept free of socket and serializer types instead of accepting a socket descriptor directly?
    choices:
    - Because a service that sees a socket descriptor would be forced to run on a network socket
    - Because socket descriptors cannot be passed to ordinary C functions safely
    - Because a transport-blind service can be tested and reused without any socket being open
    answer: 2
    why: |
      Keeping the service dependent only on pure C types makes it a standalone
      library that can be called from a server, a test, or a simple main with
      no IPC at all. Option A invents a family restriction that does not exist.
      Option B is false: descriptors are ordinary integers.
    concept: service-transport-blind
  - kind: mcq
    level: core
    q: Which library contains the accept loop and client handler shared by a UDS stream server and a TCP stream server?
    choices:
    - srvcore, the server common library
    - clicore, the client common library
    - calcsvc, the calculation service library
    answer: 0
    why: |
      The accept loop, per-client thread handler, and stream response writer are
      shared by every stream server regardless of socket family, so they live in
      srvcore. clicore is the client-side mirror, and calcsvc holds only the
      calculator logic.
    concept: srvcore-membership
  - kind: choose-better
    level: advanced
    q: A team writes one self-contained server per socket family, duplicating the read/deserialize/respond loop. Which design is better and why?
    choices:
    - Move the shared loop into the calculator service so the service owns the socket calls
    - Extract the shared loop into a common library and let each main supply only transport details
    - Duplicate the loop per server so each executable stays completely independent of the others
    answer: 1
    why: |
      The project architecture puts transport-independent machinery in shared
      libraries and keeps each main thin, which reduces code and exposes the
      common boundaries. Option C accepts four copies of the same bug surface.
      Option A breaks the service's transport-blind design.
    concept: reuse-vs-duplication
  - kind: fillblank
    level: core
    q: 'The server common static library that stream and datagram servers link against is named lib___.a. (Answer format: one word)'
    answer_text: srvcore
    why: |
      The server core library is built from the srvcore directory and is named
      libsrvcore.a. It holds the accept and serve machinery that is common to
      all server socket types.
    concept: srvcore-library-name
  - kind: mcq
    level: core
    q: Why does every calculator client require its own service object on the server side?
    choices:
    - The serializer can only deserialize requests when a service object is shared
    - The operating system limits one service object to one socket descriptor
    - The calculator memory is stateful per client, so requests need a private history
    answer: 2
    why: |
      The calculator has an internal memory that belongs to each client, so the
      service must remember that client's state between requests. Option A
      confuses serialization with service state. Option B invents an OS limit.
    concept: stateful-service-per-client
  source_ref: Text/socket_programming.xhtml - calculator wire protocol; Code Boxes 20-1..20-6
- id: b4
  type: model
  title: Frame Textual Request and Response Messages with Delimiters
  explain_md: |
    The calculator protocol is textual, variable-length, and has exactly one
    request type and one response type. A request object holds four fields:
    `id`, `method`, `operand1`, `operand2`. A response object holds three:
    `req_id`, `status`, `result`.

    On the wire, fields are separated by `#` and the whole message is terminated
    by `$`. A request such as id 1000, method ADD, operands 1.5 and 5.6 becomes
    `1000#ADD#1.5#5.6$`. A response to it with status OK and result 7.1 becomes
    `1000#0#7.1$`. The response carries the request id so the client can match
    answer to question.

    Methods include GETMEM and RESMEM for memory, ADD/SUB/MUL with memory
    variants ADDM/SUBM/MULM, and DIV. Division has no memory variant because the
    stored memory cannot participate in division. Status is numeric: `0` means
    OK, and non-zero values distinguish invalid request, invalid method, invalid
    operand, division by zero, and internal error.
  example:
    lang: c
    adapted: true
    code: |
      #include <stdio.h>

      typedef enum { NONE, GETMEM, RESMEM, ADD, ADDM, SUB, SUBM, MUL, MULM, DIV } method_t;

      static const char* method_to_str(method_t m) {
        static const char* names[] = {
          "NONE", "GETMEM", "RESMEM", "ADD", "ADDM",
          "SUB", "SUBM", "MUL", "MULM", "DIV"
        };
        return names[m];
      }

      struct calc_proto_req_t {
        int id;
        method_t method;
        double operand1;
        double operand2;
      };

      struct calc_proto_resp_t {
        int req_id;
        int status;
        double result;
      };

      int main(void) {
        struct calc_proto_req_t req = {1000, ADD, 1.5, 5.6};
        char reqbuf[64];
        snprintf(reqbuf, sizeof(reqbuf), "%d#%s#%.1f#%.1f$",
                 req.id, method_to_str(req.method), req.operand1, req.operand2);

        struct calc_proto_resp_t resp = {1000, 0, 7.1};
        char respbuf[64];
        snprintf(respbuf, sizeof(respbuf), "%d#%d#%.1f$",
                 resp.req_id, resp.status, resp.result);

        printf("%s\n", reqbuf);
        printf("%s\n", respbuf);
        return 0;
      }
    run_expected: |
      1000#ADD#1.5#5.6$
      1000#0#7.1$
    explain_md: |
      The request serializer writes the id, the method name, both operands, and
      the `$` separator with one formatted write. The response serializer does
      the same with the request id, numeric status, and result. The final `$`
      lets a receiver know a complete message has arrived even when messages are
      split across reads.
    note: Condensed the header definitions, object construction, and serializer calls into one runnable main that prints the wire strings.
  viz:
    kind: ascii-memory
    steps:
    - 'REQUEST OBJECT: id=1000, method=ADD, operand1=1.5, operand2=5.6'
    - 'AFTER SERIALIZE: "1000#ADD#1.5#5.6$" (four fields, one message separator)'
    - 'RESPONSE OBJECT: req_id=1000, status=0 (OK), result=7.1'
    - 'AFTER SERIALIZE: "1000#0#7.1$" (three fields, one message separator)'
    - 'RECEIVER RULE: split on # for fields, stop at $ for the message boundary'
  checks:
  - kind: predict
    level: core
    q: 'Trace the serializer: which wire message is produced for a request with id 42, method MUL, operands 2.0 and 3.0?'
    code: |
      struct calc_proto_req_t r = {42, MUL, 2.0, 3.0};
      /* serializer writes: id # method # operand1 # operand2 $ */
    choices:
    - wire = 42#MUL#2.0#3.0$
    - wire = 42#MUL#2.0#3.0#6.0$
    - wire = MUL#42#2.0#3.0$
    answer: 0
    why: |
      The request format is exactly four fields in the order id, method,
      operand1, operand2, terminated by `$`. Option B adds a fifth field,
      inventing a result on the request. Option C puts the method before the
      id, which would break every deserializer expecting the id first.
    concept: request-wire-order
  - kind: why-fails
    level: core
    q: Why must the calculator protocol terminate every message with a separator instead of ending when a read returns?
    choices:
    - A delimiter is needed because fields cannot contain the numeric request identifier
    - A read may return a partial message or several messages, so a delimiter marks the real boundary
    - A read returns exactly one message only when the message ends with an unknown byte
    answer: 1
    why: |
      Stream reads expose arbitrary chunks, not application-message boundaries.
      The `$` delimiter is the only reliable signal that a complete message is
      present. Option C reverses the rule: reads have no message semantics at
      all. Option A confuses field content with framing.
    concept: delimiter-required
  - kind: fillblank
    level: intro
    q: 'In the calculator wire format, fields are separated by # and the whole message is terminated by the character ___. (Answer format: one character)'
    answer_text: $
    why: |
      `#` is the field delimiter inside a message and `$` is the message
      separator that ends it. The deserializer scans for `$` before attempting
      to parse fields.
    concept: message-separator
  - kind: order
    level: core
    q: Order the 6 correct steps a deserializer performs for one request; one displayed line is a distractor.
    lines:
    - append incoming chunk bytes to the ring buffer
    - parse the four fields and build calc_proto_req_t
    - discard bytes that arrive before a $ separator
    - scan the ring buffer for the $ message separator
    - invoke the registered request callback with the object
    - serialize a response and push it back to the sender
    - remove the consumed message bytes from the ring buffer
    answer_order:
    - 0
    - 3
    - 2
    - 1
    - 6
    - 4
    why: |
      Bytes accumulate first; only after a `$` is found can a complete message
      be parsed. The parser builds the object, the consumed bytes are removed,
      and the observer callback is notified. Serializing a response belongs to
      the server's later work, not to request deserialization, so it is the
      distractor. The stem's six-line count matches answer_order.
    concept: deserialize-step-order
    hint: Nothing can be parsed until the message terminator is present.
  - kind: trace
    level: core
    q: Trace the request object fields after construction. What value is stored in the method slot?
    code: |
      struct calc_proto_req_t r;
      r.id = 1000;
      r.method = ADDM;
      r.operand1 = 1.5;
      r.operand2 = 5.6;
    trace:
      headers:
      - Step
      - Line
      - Field
      - Value
      rows:
      - step: 1
        line: 2
        cells:
        - '1'
        - '2'
        - id
        - '1000'
      - step: 2
        line: 3
        cells:
        - '2'
        - '3'
        - method
        - ADDM
      - step: 3
        line: 4
        cells:
        - '3'
        - '4'
        - operand1
        - '1.5'
      - step: 4
        line: 5
        cells:
        - '4'
        - '5'
        - operand2
        - '5.6'
    target:
      row: 1
      col: 3
    answer_text: ADDM
    why: |
      Line 3 assigns the ADDM enumerator to the method field. ADDM adds both
      operands together with the stored memory and updates that memory. It is
      not plain ADD, which ignores memory.
    concept: request-method-field
  - kind: spot-bug
    level: advanced
    q: A response serializer is supposed to emit req_id#status#result$. Which line corrupts the wire format?
    code: |
      char buf[64];
      int req_id = 7;
      int status = 0;
      double result = 2.5;
      snprintf(buf, sizeof(buf), "%d#%d$", req_id, status);  /* line 5 */
      /* result 2.5 must also appear in the message */
    diagnostic_log: |
      client: response rejected: expected 3 fields, found 2
    choices:
    - 'Line 5: the status must be printed before the request id in every response'
    - 'Line 5: the separator must be # instead of the final $ in a response'
    - 'Line 5: the format string omits the result field, so only two fields are emitted'
    answer: 2
    why: |
      A response has exactly three fields: request id, status, and result. The
      format `"%d#%d$"` writes only two, so a client that splits on `#` sees a
      malformed message. Option A reverses the required field order. Option B
      removes the message terminator that every message needs.
    concept: response-field-count
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of putting a unique request id in both the request and its response?
    choices:
    - It lets the client match an arriving response to the request that caused it
    - It lets the server encrypt the response before sending it back to the client
    - It guarantees that the transport delivers messages in the order they were sent
    answer: 0
    why: |
      The request id is correlation data: a client can have several outstanding
      requests and must attach each response to the right one. Option B invents
      encryption from an identifier. Option C assigns ordering to the id, but
      ordering is a transport property.
    concept: request-id-correlation
  - kind: mcq
    level: core
    q: Which response status value does the calculator protocol reserve for a division by zero?
    choices:
    - STATUS_INTERNAL_ERROR, value 20
    - STATUS_DIV_BY_ZERO, value 4
    - STATUS_INVALID_METHOD, value 2
    answer: 1
    why: |
      The protocol numbers division by zero as status 4. Status 2 is an invalid
      method and status 20 is an internal error. Keeping these names distinct
      from the service's own error return avoids mixing two namespaces.
    concept: div-zero-status
  source_ref: Text/socket_programming.xhtml - request/response serialization; Code Boxes 20-1..20-6
- id: b5
  type: algorithm
  title: Deserialize Streams with a Ring Buffer and Observer Callbacks
  explain_md: |
    Deserialization is harder than serialization because a stream may deliver a
    message in pieces or several messages at once. The serializer class keeps a
    fixed-length **ring buffer** of incoming bytes. Each call appends the new
    chunk, then scans for the `$` message separator.

    When `$` is found, the parser extracts the fields, rebuilds the request or
    response object, and calls the registered callback. The consumed bytes are
    removed so the next message can be parsed. If no `$` exists yet, the bytes
    stay buffered until more arrive.

    The orientation is fixed: a client serializes requests and deserializes
    responses; a server deserializes requests and serializes responses. Three
    callbacks report events: request received, response received, and
    serialization/deserialization error. A failed parse reports a protocol error
    code such as an invalid field instead of delivering a half-built object.
  checks:
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of the fixed-length ring buffer inside the deserializer?
    choices:
    - It stores outgoing messages until the receiver process acknowledges each one
    - It caches the calculator memory so division can reuse the previous result
    - It accumulates partial messages until a complete delimited message can be parsed
    answer: 2
    why: |
      The ring buffer is the staging area between arbitrary stream chunks and
      complete application messages. It holds leftovers until a `$` arrives.
      Option A confuses an incoming parser with an outgoing retransmission
      queue. Option B confuses protocol buffering with service memory.
    concept: ring-buffer-purpose
  - kind: predict
    level: core
    q: 'Trace the ring buffer: the first read delivers "1000#ADD#1.5" and the second delivers "#5.6$". After which read can a complete request be parsed?'
    code: |
      /* first chunk  */ "1000#ADD#1.5"
      /* second chunk */ "#5.6$"
    choices:
    - Only after the second chunk, because the $ separator arrives there
    - After the first chunk, because it already contains all four fields
    - After the first chunk, because the method name is already visible
    answer: 0
    why: |
      The first chunk has no `$`, so the deserializer cannot know the message is
      complete; it buffers the bytes. The second chunk supplies both the last
      field and the terminator, so parsing can begin.
      Option B mistakes field count for completeness. Option C mistakes a
      recognizable method for a terminated message.
    concept: parse-after-terminator
  - kind: why-fails
    level: core
    q: Why do client and server use opposite (de)serialization functions instead of both calling the same pair?
    choices:
    - The server side must never serialize a response because responses are raw bytes
    - Each side serializes what it sends and deserializes what it receives, and those directions differ
    - The client side cannot deserialize bytes because it has no request identifier to match
    answer: 1
    why: |
      A client sends requests and receives responses; a server receives requests
      and sends responses. The four functions encode that direction split so
      each side only parses the message type it expects.
      Option C is false: clients deserialize responses. Option A is false:
      servers serialize responses before sending them.
    concept: serializer-orientation
  - kind: order
    level: core
    q: Order the 5 correct operations for handling a chunk that contains two complete messages; all displayed lines are used.
    lines:
    - append the new chunk to the ring buffer
    - notify the callback with the parsed object
    - scan for the first $ separator
    - parse the fields into an object
    - remove the consumed message and scan again
    answer_order:
    - 0
    - 2
    - 3
    - 1
    - 4
    why: |
      Chunks are appended before scanning. For each complete message the parser
      scans to `$`, parses, notifies, removes the consumed bytes, and repeats.
      Two complete messages therefore produce two notify calls.
    concept: multi-message-chunk-order
    hint: The scan that finds the boundary comes before parsing that message.
  - kind: spot-bug
    level: advanced
    q: The deserializer below is fed a chunk with no $ separator. Which line violates the buffering contract?
    code: |
      void feed(struct ser_t* s, const char* data, int n) {
        ring_append(s, data, n);              /* line 2 */
        if (!ring_has(s, '$')) {              /* line 3 */
          char* msg = ring_take_all(s);       /* line 4 */
          parse_and_notify(s, msg);           /* line 5 */
        }
      }
    diagnostic_log: |
      parser: message rejected: missing terminator
    choices:
    - 'Line 2: appending bytes before scanning loses the first byte of every chunk'
    - 'Line 3: checking for the separator must happen before appending the chunk'
    - 'Lines 4-5: they parse and notify even though no complete delimited message exists'
    answer: 2
    why: |
      When `$` is absent the bytes must stay buffered for the next chunk. Taking
      them now and parsing a message with no terminator produces the reported
      rejection. Option A misstates ring append. Option B would scan an empty
      buffer and miss the new bytes.
    concept: premature-parse-bug
  - kind: fillblank
    level: intro
    q: 'On the server side, the deserializer turns incoming bytes into a ___ object. (Answer format: one word)'
    answer_text: request
    why: |
      A server receives request messages from clients, so its deserializer
      builds request objects and passes them to the request callback. Responses
      are what the server serializes on the way out.
    concept: server-deserializes-request
  - kind: trace
    level: core
    q: Trace the buffer state. After three chunks arrive with no $ in the first two, what does the buffer contain at step 3?
    code: |
      ring_append(s, "12#", 3);
      ring_append(s, "ADD#", 4);
      ring_append(s, "1$", 2);
    trace:
      headers:
      - Step
      - Chunk
      - Separator
      - Buffered bytes
      rows:
      - step: 1
        line: 1
        cells:
        - '1'
        - 12#
        - 'no'
        - 12#
      - step: 2
        line: 2
        cells:
        - '2'
        - ADD#
        - 'no'
        - 12#ADD#
      - step: 3
        line: 3
        cells:
        - '3'
        - 1$
        - 'yes'
        - 12#ADD#1$
    target:
      row: 2
      col: 3
    answer_text: 12#ADD#1$
    why: |
      Every append adds bytes to the ring buffer, and a `$` only appears in the
      third chunk. Until step 3 no complete message exists, so the buffer just
      grows. At step 3 the message is complete and can be parsed.
    concept: buffer-growth-trace
  source_ref: Text/socket_programming.xhtml - serializer and deserializer ring buffer; Code Boxes 20-7..20-11
- id: b6
  type: design
  title: Isolate Stateful Calculation Logic from Transport
  explain_md: |
    The calculation service is the core of the project. Its interface accepts
    pure C types (`double`, pointers, `bool_t`) and returns pure values, so it
    has no dependency on sockets or serialization. That is what makes it a
    standalone library, `libcalcsvc.a`, linked by every server executable.

    A service can be **stateless** or **stateful**. If answering the current
    request never needs earlier requests, one shared singleton service object is
    enough. The calculator is the opposite: it stores an internal memory per
    client, so each client needs its own service object. Creating one service
    per accepted client preserves that private memory.

    Error reporting is deliberately separate from the protocol status
    namespace. `calc_service_div` returns an `int` status,
    `CALC_SVC_OK` (0) or `CALC_SVC_ERROR_DIV_BY_ZERO` (-1), and hands the
    quotient back through a `double*` parameter. The server's request callback
    translates a failed division into the protocol's `STATUS_DIV_BY_ZERO`.
  checks:
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of giving the calculation service pure C arguments and no socket types?
    choices:
    - It lets the same logic run inside a server, a unit test, or a plain main without IPC
    - It forces every caller to open a network socket before any calculation can run
    - It makes the service responsible for serializing its own request messages
    answer: 0
    why: |
      A transport-blind interface makes the service reusable anywhere pure C
      functions can be called, including tests. Option B invents a socket
      requirement the design explicitly avoids. Option C moves serialization
      out of calcser, where it belongs.
    concept: service-pure-interface
  - kind: why-fails
    level: core
    q: Why would sharing one calculator service object across all clients break the memory methods?
    choices:
    - The serializer would deserialize requests into the wrong structure type
    - ADDM, SUBM, and MULM would read and overwrite another client's stored memory
    - The service would reject every second request because it tracks a request counter
    answer: 1
    why: |
      Memory operations update a stored value that must belong to one client.
      A shared object mixes those values, so one client's ADDM changes what the
      next client reads. Option C invents a counter rule. Option A confuses
      service state with deserialization.
    concept: shared-service-memory-corruption
  - kind: choose-better
    level: advanced
    q: A server handles clients that never use memory methods. Which service design is better and why?
    choices:
    - One service object per client is mandatory because every service must be stateful
    - One service object per request is required so division cannot leak a result
    - A single stateless service object is enough because no request depends on earlier ones
    answer: 2
    why: |
      If responses do not depend on history, a shared stateless object is
      correct and cheaper. Option A overstates the requirement: statefulness is
      a property of the calculator's memory, not of all services. Option B
      adds pointless allocation per request.
    concept: stateless-vs-stateful-service
  - kind: mcq
    level: core
    q: How does calc_service_div report a successful quotient while still allowing failure?
    choices:
    - It returns CALC_SVC_OK and writes the quotient through a double pointer
    - It returns the quotient as a double and signals failure with NaN
    - It returns CALC_SVC_OK and stores the quotient in a global variable
    answer: 0
    why: |
      Division can fail, so the function returns an int status and uses an
      output parameter for the quotient. Option B conflates the value with the
      status and invents NaN as the error channel. Option C hides state in a
      global, which breaks per-client isolation.
    concept: division-out-parameter
  - kind: fillblank
    level: core
    q: 'The service constant returned when division by zero fails is CALC_SVC___ (complete the identifier; answer format: one token).'
    answer_text: CALC_SVC_ERROR_DIV_BY_ZERO
    why: |
      The service defines CALC_SVC_ERROR_DIV_BY_ZERO as -1 for a failed
      division. It is a service-level error, distinct from the protocol's
      STATUS_DIV_BY_ZERO response status.
    concept: service-div-error-constant
  - kind: spot-bug
    level: advanced
    q: A server reuses one service object for every client. Which line explains the corrupted memory reading?
    code: |
      static struct calc_service_t* shared_svc = NULL;

      void handle_client(int sd) {
        if (!shared_svc) { shared_svc = calc_service_new(); }  /* line 4 */
        /* client A sends ADDM 5, then client B sends GETMEM */
        service_loop(shared_svc, sd);
      }
    diagnostic_log: |
      client B: GETMEM returned 5.0 although B never stored a value
    choices:
    - 'Line 6: service_loop must create a fresh socket for each client'
    - 'Line 4: one shared service object lets client A''s memory leak into client B'
    - 'Line 4: the service must be allocated before the socket is accepted'
    answer: 1
    why: |
      The shared instance keeps one memory value across all clients, so B reads
      what A wrote. Each client needs its own stateful service object.
      Option C only changes allocation timing, not sharing. Option A confuses
      socket ownership with service state.
    concept: shared-service-leak
  source_ref: Text/socket_programming.xhtml - calculator service object; Code Box 20-12
- id: b7
  type: syntax
  title: Initialize a UDS Stream Listener in the Correct Sequence
  explain_md: |
    A UDS stream server follows the stream listener sequence. First it creates a
    socket with `socket(AF_UNIX, SOCK_STREAM, 0)`. At this point the descriptor
    is just a socket; the later calls decide that it is a listener.

    Next it prepares a `struct sockaddr_un`, zeroes it, sets `sun_family` to
    `AF_UNIX`, and copies the socket-file path into `sun_path`. Before binding,
    it calls `unlink` on the path so a stale node from an earlier run cannot
    cause `EADDRINUSE`. Then `bind` attaches the socket to that path; only one
    socket may be bound to a given socket file at a time.

    After binding, `listen(server_sd, backlog)` configures how many completed
    connections may wait for `accept`. Finally `accept` returns a new descriptor
    for each client, and that descriptor names the dedicated stream channel for
    that client.
  checks:
  - kind: order
    level: core
    q: Order the 5 correct startup calls for a UDS stream listener; all displayed lines are used.
    lines:
    - listen(server_sd, 10)
    - bind(server_sd, (struct sockaddr*)&addr, sizeof(addr))
    - accept(server_sd, NULL, NULL)
    - socket(AF_UNIX, SOCK_STREAM, 0)
    - unlink(sock_file)
    answer_order:
    - 3
    - 4
    - 1
    - 0
    - 2
    why: |
      The socket object must exist before anything can be bound. The stale path
      is removed before binding, binding makes the endpoint valid, listen
      prepares the backlog, and accept can then receive clients.
    concept: uds-stream-listener-order
    hint: You need a socket object before you can talk about its path.
    from_chapter: ch22
    from_block: b20
  - kind: predict
    level: core
    q: 'Trace the calls: two processes each bind a UDS stream socket to /tmp/svc.sock without unlinking. What happens to the second bind?'
    code: |
      int a = socket(AF_UNIX, SOCK_STREAM, 0);
      bind(a, (struct sockaddr*)&addr, sizeof(addr));  /* process 1 */
      int b = socket(AF_UNIX, SOCK_STREAM, 0);
      bind(b, (struct sockaddr*)&addr, sizeof(addr));  /* process 2 */
    choices:
    - The second bind succeeds only after the first socket calls listen
    - The second bind succeeds and both sockets share the same file node
    - The second bind fails because a socket file can have only one bound socket
    answer: 2
    why: |
      A UDS path names one bound socket; a second bind to the same path fails
      because the node already exists and is in use. Option B assumes files can
      carry multiple socket bindings. Option A confuses listen with bind
      exclusivity.
    concept: uds-bind-exclusivity
  - kind: why-fails
    level: core
    q: Why does the server call unlink(sock_file) before bind when the file may not exist at all?
    choices:
    - A leftover socket node from a previous run would make bind fail with EADDRINUSE
    - unlink is required to create the kernel buffer that receives client bytes
    - unlink converts the socket family from AF_INET to AF_UNIX before binding
    answer: 0
    why: |
      UDS paths are filesystem nodes. If an earlier process left the node
      behind, bind sees an existing binding and fails. Unlinking first makes
      the path free for this run; if it does not exist, the call is harmless.
      Option B invents a kernel-buffer step. Option C invents an address-family
      conversion.
    concept: unlink-stale-socket
  - kind: fillblank
    level: intro
    q: 'When preparing a UDS address, the address family field sun_family is set to ___. (Answer format: one token)'
    answer_text: AF_UNIX
    why: |
      `sun_family` must match the family used in the socket call, which is
      `AF_UNIX` for Unix Domain Sockets. A mismatch makes bind interpret the
      address structure incorrectly.
    concept: sun-family
  - kind: mcq
    level: core
    q: What does the backlog argument in listen(server_sd, 10) control?
    choices:
    - How many client threads the process is allowed to create after accept()
    - How many completed connections may wait in the kernel before accept() takes them
    - How many bytes each read() call may return from an accepted connection
    answer: 1
    why: |
      The backlog bounds the queue of pending connections that have completed
      the transport handshake but have not yet been accepted. Option C
      confuses the backlog with read buffer size. Option A confuses kernel
      queuing with the application's thread strategy.
    concept: listen-backlog
  - kind: spot-bug
    level: advanced
    q: Diagnose why the server fails on its second run when the previous run was killed. Which line is the cause?
    code: |
      int sd = socket(AF_UNIX, SOCK_STREAM, 0);
      struct sockaddr_un addr;
      memset(&addr, 0, sizeof(addr));
      addr.sun_family = AF_UNIX;
      strncpy(addr.sun_path, "/tmp/calc.sock", sizeof(addr.sun_path) - 1);
      int rc = bind(sd, (struct sockaddr*)&addr, sizeof(addr));  /* line 7 */
    diagnostic_log: |
      bind: Address already in use
    choices:
    - 'Line 1: the socket must be created with SOCK_DGRAM to reuse a path'
    - 'Line 5: sun_path must be copied with strcpy instead of strncpy'
    - 'Line 7: bind is called without first unlinking the leftover socket file'
    answer: 2
    why: |
      The address-in-use error comes from an existing socket node at the path.
      Calling unlink before bind removes the stale node and lets the new server
      bind. Option A changes the channel shape and does not solve path reuse.
      Option B does not address the existing node at all.
    concept: stale-uds-node-bug
  source_ref: Text/socket_programming.xhtml - UDS stream listener setup and accept; Code Boxes 20-13..20-16
- id: b8
  type: algorithm
  title: Accept Clients and Service Each in Its Own Thread
  explain_md: |
    `accept_forever` is the shared stream-server loop. It waits in `accept`, and
    for each client it allocates an integer holding the new descriptor, creates
    a thread, and hands the descriptor to `client_handler`.

    Each handler owns a per-client context: the client socket descriptor, a
    serializer constructed with a 256-byte ring buffer, request and error
    callbacks, and a fresh calculator service. It then loops with
    `read(sd, buffer, 128)`. A return of 0 or -1 ends the loop; otherwise the
    bytes are fed to the deserializer. Cleanup destroys the service and
    serializer and frees the context.

    Responses go through `stream_write_resp`, which serializes the response and
    calls `write`. A return of -1 is fatal, and so is a short write
    (`ret < buf.len`): the code refuses to pretend a partial send succeeded.
    Because `read`, `write`, and `close` accept socket descriptors too, the same
    I/O API serves channels and media.
  checks:
  - kind: predict
    level: core
    q: 'Trace the listener thread: no client is waiting and the listening socket is blocking. Where does execution stop?'
    code: |
      while (1) {
        int client_sd = accept(server_sd, NULL, NULL);
        pthread_create(&t, NULL, client_handler, &client_sd);
      }
    choices:
    - Inside accept(), until a client completes a connection
    - Inside pthread_create(), until the handler thread exits
    - Inside the while loop, which spins without ever calling accept
    answer: 0
    why: |
      A blocking listener makes accept wait when the backlog is empty; the
      thread resumes only when a connection arrives. Option B confuses thread
      creation with joining. Option C describes a busy loop, not this code.
    concept: blocking-accept
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of spawning a handler thread for every accepted stream client?
    choices:
    - It shares one serializer object safely among all connected clients
    - It keeps the listener free to accept while each client is served independently
    - It guarantees that every client is served in the exact order it connected
    answer: 1
    why: |
      Reads on a blocking stream can wait, so a dedicated thread per client
      prevents one slow client from stalling the accept loop. Option C is not
      guaranteed by threads. Option A is the opposite of the design, which
      gives each client its own serializer.
    concept: thread-per-client-purpose
  - kind: spot-bug
    level: advanced
    q: The response writer below ignores a short write. Which line hides a real failure?
    code: |
      int ret = write(sd, buf.data, buf.len);
      free(buf.data);
      if (ret == -1) {                    /* line 3 */
        close(sd);
        return;
      }
      /* ret may be positive but smaller than buf.len */
    diagnostic_log: |
      WARN: Less bytes were written!
    choices:
    - 'Line 1: write must use the ring buffer instead of buf.data for stream sockets'
    - 'Line 2: freeing the buffer before checking ret destroys the error message'
    - 'After line 3: a positive ret smaller than buf.len must also be treated as failure'
    answer: 2
    why: |
      A stream write may send only part of the buffer. The code must compare
      `ret` with `buf.len`; a short positive count means the peer received a
      truncated response and the connection cannot be trusted.
      Option A invents a write restriction. Option B misstates the buffer
      lifetimes.
    concept: short-write-fatal
  - kind: order
    level: core
    q: Order the 5 correct lifecycle steps inside a stream client handler; all displayed lines are used.
    lines:
    - destroy the service and serializer, then free the context
    - create a per-client serializer and service
    - read chunks and feed the deserializer
    - register request and error callbacks
    - loop until read returns 0 or -1
    answer_order:
    - 1
    - 3
    - 4
    - 2
    - 0
    why: |
      Per-client objects are created and callbacks registered before any bytes
      are handled. The read/deserialize loop runs until the peer closes, then
      the objects are destroyed and the context is freed.
    concept: client-handler-lifecycle
    hint: Create the objects before registering callbacks that use them.
  - kind: why-fails
    level: core
    q: Why does client_handler treat read() returning 0 as the end of the connection?
    choices:
    - A zero-byte read reports that the peer closed its write side, so no more requests arrive
    - A zero-byte read reports that the kernel ring buffer overflowed and must be reset
    - A zero-byte read reports that the request was valid but had no operands
    answer: 0
    why: |
      On a stream socket, read returns 0 at end-of-file, which happens when the
      peer shuts down or closes. The handler breaks its loop. Option B confuses
      EOF with buffer overflow. Option C confuses a transport event with
      application message content.
    concept: read-zero-eof
  - kind: fillblank
    level: core
    q: 'The per-client serializer in the stream handler is constructed with a ring buffer size of ___ bytes. (Answer format: one number)'
    answer_text: '256'
    why: |
      The server-side client handler constructs its serializer with a ring
      buffer of 256 bytes. The client process uses a different size, 128, which
      shows that the size is a per-instance configuration.
    concept: server-ring-size
  - kind: trace
    level: core
    q: 'Trace the handler state: what happens to the client socket after read returns 0?'
    code: |
      while (1) {
        int ret = read(context.addr->sd, buffer, 128);
        if (ret == 0 || ret == -1) break;
        calc_proto_ser_server_deserialize(context.ser, buf, NULL);
      }
      calc_service_dtor(context.svc);
    trace:
      headers:
      - Step
      - Event
      - Loop state
      - Next action
      rows:
      - step: 1
        line: 2
        cells:
        - '1'
        - read returns 128
        - continue
        - deserialize chunk
      - step: 2
        line: 2
        cells:
        - '2'
        - read returns 0
        - break
        - leave loop
      - step: 3
        line: 6
        cells:
        - '3'
        - cleanup begins
        - done
        - destroy service
    target:
      row: 1
      col: 3
    answer_text: break
    why: |
      A zero return ends the loop immediately, so the next action is to leave
      the while body and run cleanup. The deserializer is not called with an
      empty chunk; there is nothing to parse.
    concept: zero-read-loop-exit
  source_ref: Text/socket_programming.xhtml - client handler read/write loop; Code Boxes 20-18..20-20
- id: b9
  type: algorithm
  title: Connect a UDS Stream Client and Run Its Reader Loop
  explain_md: |
    A UDS stream client follows the connector sequence. It first creates the
    same kind of socket the server did, `socket(AF_UNIX, SOCK_STREAM, 0)`. It
    prepares the same `sockaddr_un`, but it calls `connect` instead of `bind`.
    A successful connect associates the descriptor with the channel to the
    server; from then on the client can read and write through it.

    The connected descriptor goes to `stream_client_loop`. That function creates
    one serializer per client process (ring size 128), registers response and
    error callbacks, and starts a reader thread because reading responses is a
    blocking task. The main thread runs the command line: it parses a command
    into a request, serializes it, writes it, and prints the request id.

    On exit, the client calls `shutdown(conn_sd, SHUT_RD)` to stop inbound
    traffic, destroys the serializer, and then joins the reader thread before
    printing a final message.
  checks:
  - kind: predict
    level: core
    q: 'Trace the connection attempt: the client calls connect to /tmp/calc.sock before any server binds that path. What does connect report?'
    code: |
      int conn_sd = socket(AF_UNIX, SOCK_STREAM, 0);
      struct sockaddr_un addr;
      /* addr.sun_path = "/tmp/calc.sock" */
      int rc = connect(conn_sd, (struct sockaddr*)&addr, sizeof(addr));
    choices:
    - rc is 0 because a stream socket is connected before any endpoint exists
    - rc is -1 because the filesystem path has no bound listening socket yet
    - rc is 0 because connect creates the missing socket file automatically
    answer: 1
    why: |
      A UDS connect needs an existing socket node bound by a listener. Without
      it, the call fails; nothing is created on the client's behalf.
      Option C invents automatic node creation. Option A denies the connection
      setup the call performs.
    concept: connect-missing-endpoint
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of the dedicated reader thread in the stream client?
    choices:
    - It serializes requests so the main thread can focus on printing results
    - It accepts new server connections while the client command line runs
    - It reads responses without blocking the main thread that reads user commands
    answer: 2
    why: |
      Reading responses can block, while the main thread must keep the command
      line responsive; the reader thread separates those waits. Option A
      reverses the roles: the main thread serializes requests. Option B applies
      server behavior to a client.
    concept: client-reader-thread
  - kind: order
    level: core
    q: Order the 5 correct stream-client lifecycle steps; all displayed lines are used.
    lines:
    - join the response reader thread
    - connect the socket to the server address
    - create a UDS stream socket
    - run the command line and write serialized requests
    - shut down the read side and destroy the serializer
    answer_order:
    - 2
    - 1
    - 3
    - 4
    - 0
    why: |
      The socket exists before connect, connect establishes the channel, the
      command loop exchanges messages, shutdown stops inbound traffic, and only
      then does the main thread join the reader. Joining earlier would wait
      forever because the reader is still blocked on the channel.
    concept: stream-client-lifecycle
    hint: The reader thread must be told to stop before you wait for it.
  - kind: why-fails
    level: core
    q: Why is the request serialized on the main thread while responses are deserialized on the reader thread?
    choices:
    - Commands arrive on the main thread and responses arrive asynchronously on the channel
    - The serializer object is not thread-safe and must only be used by the kernel
    - The main thread has no access to the socket descriptor used by the reader
    answer: 0
    why: |
      User commands are produced by the main loop, so requests are serialized
      there; responses arrive whenever the server replies, so a reader thread
      waits for them. Option B invents a kernel restriction. Option C is false:
      both threads share the process and descriptor.
    concept: client-thread-direction-split
  - kind: fillblank
    level: intro
    q: 'On the connector side, the call that associates a socket with the server endpoint is ___. (Answer format: one token)'
    answer_text: connect
    why: |
      A listener uses bind to attach to its local endpoint; a connector uses
      connect to reach the server endpoint. The client code prepares the same
      address structure but substitutes connect for bind.
    concept: connector-uses-connect
  - kind: mcq
    level: core
    q: What does shutdown(conn_sd, SHUT_RD) do for the stream client during exit?
    choices:
    - It converts the stream socket into a datagram socket for cleanup
    - It stops inbound reads so the blocked reader thread can finish and be joined
    - It deletes the server socket file from the filesystem immediately
    answer: 1
    why: |
      SHUT_RD closes the read side, which unblocks the reader thread so the main
      thread can join it. Option C confuses shutdown with unlinking a server
      path. Option A invents a channel-shape change.
    concept: shutdown-read-side
  - kind: spot-bug
    level: advanced
    q: A client joins its reader thread before shutting the socket down. Which line explains the hang?
    code: |
      pthread_t reader;
      pthread_create(&reader, NULL, stream_response_reader, &context);
      /* ... command loop ... */
      pthread_join(reader, NULL);          /* line 4 */
      shutdown(conn_sd, SHUT_RD);          /* line 5 */
    diagnostic_log: |
      client: no progress; reader thread stuck in read()
    choices:
    - 'Line 5: shutdown must be called before every pthread_create call in a client'
    - 'Line 2: the reader thread must never receive a pointer to the shared context'
    - 'Line 4: the join waits for a reader blocked in read, and shutdown runs only after it'
    answer: 2
    why: |
      The reader blocks in read until the read side is shut down. Joining before
      shutdown creates a circular wait. Option A inverts the correct order.
      Option B is false: the reader needs the shared context.
    concept: join-before-shutdown-deadlock
  source_ref: Text/socket_programming.xhtml - UDS stream client loop; Code Boxes 20-17, 20-21, 20-22
- id: b10
  type: model
  title: Serve and Bind UDS Datagrams Without a Connection
  explain_md: |
    A UDS datagram server uses `socket(AF_UNIX, SOCK_DGRAM, 0)` and binds a
    socket file, but it has no backlog and no accept phase. There are no
    dedicated one-to-one connections; the channel is shared, and each datagram
    is independent.

    The server loop uses `recvfrom` because it must learn who sent each
    datagram; the captured address is stored so `sendto` can route the reply
    back. Each datagram gets its own context, serializer, and service object.
    If a datagram does not contain a complete request, the server immediately
    replies with a failure response (`req_id = -1`,
    `status = ERROR_INVALID_RESPONSE`).

    A UDS datagram client differs from a stream client in one crucial way: it
    must `bind` its own socket file before it connects, because a UDS endpoint
    has no automatic ephemeral address. Without that path, the server's
    `recvfrom` has no return address for the reply.
  viz:
    kind: ascii-memory
    steps:
    - 'SERVER: socket(AF_UNIX, SOCK_DGRAM, 0) -> bind(sock_file) -> serve loop'
    - 'NO STREAM STEPS: no listen backlog, no accept, no per-client connection'
    - 'RECEIVE: recvfrom returns bytes plus the sender address; store that address'
    - 'SEND: sendto(server_sd, reply, len, 0, sender_addr, addrlen) routes straight back'
    - 'CLIENT: socket -> bind(client_sock_file) -> connect(server path) -> datagram loop'
    - 'INCOMPLETE MESSAGE: req_found is false => reply req_id=-1, status=ERROR_INVALID_RESPONSE, result=0.0'
  checks:
  - kind: predict
    level: core
    q: 'Trace datagram delivery: a client sends two separate datagrams "A$" and "B$". What does the receiver observe?'
    code: |
      sendto(sd, "A$", 2, 0, &srv, len);
      sendto(sd, "B$", 2, 0, &srv, len);
      /* receiver calls recvfrom twice into a 64-byte buffer */
    choices:
    - Two datagrams are received, preserving the A/B message boundaries
    - One datagram of four bytes "A$B$" is received because datagrams coalesce
    - The second datagram overwrites the first inside the kernel buffer
    answer: 0
    why: |
      A datagram channel preserves message boundaries: each sendto produces one
      datagram and each recvfrom consumes one. Option B imports stream
      coalescing into a datagram channel. Option C invents overwrite behavior.
    concept: datagram-boundaries
  - kind: why-fails
    level: core
    q: Why must a UDS datagram client bind its own socket file, while a UDP datagram client over IP need not?
    choices:
    - The kernel assigns UDS clients descriptor 0 unless a filesystem path is bound
    - A UDS endpoint has no automatic ephemeral address, so the client path is the return address
    - UDS datagram sockets refuse to send unless the client binds a different port number
    answer: 1
    why: |
      The server needs an address to reply to. For AF_UNIX there is no automatic
      ephemeral namespace, so the client must bind a path. For AF_INET the
      kernel supplies a source IP and ephemeral port on first send.
      Option C invents ports and a refusal rule. Option A invents descriptor
      assignment.
    concept: uds-datagram-client-bind
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of saving the address returned by recvfrom on a datagram server?
    choices:
    - It proves the datagram was authenticated before the server processes it
    - It stores the server socket file so the next client can reuse the path
    - It identifies the sender so sendto can route the reply back to that peer
    answer: 2
    why: |
      Datagram channels are shared, so the sender identity comes from
      recvfrom's address argument; sendto uses it for the reply. Option A
      confuses addressing with authentication. Option B confuses a peer
      address with the server's own bound path.
    concept: recvfrom-sender-address
  - kind: mcq
    level: core
    q: Which steps belong to a UDS datagram server but not to a UDS stream server?
    choices:
    - recvfrom and sendto for whole datagrams with a captured sender address
    - listen and accept for dedicated one-to-one client stream channels
    - unlink and bind for a filesystem socket path and stale-node cleanup
    answer: 0
    why: |
      Datagram servers use recvfrom/sendto and rely on the captured sender
      address. listen and accept are stream-only. unlink and bind are common to
      both server kinds, not unique to datagrams.
    concept: datagram-server-calls
  - kind: fillblank
    level: core
    q: 'A datagram server sends its reply with the call ___. (Answer format: one token)'
    answer_text: sendto
    why: |
      sendto carries an explicit destination address, which is exactly what a
      shared datagram channel needs. read/write could work on a connected
      datagram socket, but the server's reply path uses the captured address
      with sendto.
    concept: datagram-reply-call
  - kind: spot-bug
    level: advanced
    q: The datagram server ignores the req_found flag. Which line lets a malformed datagram pass silently?
    code: |
      bool_t req_found = FALSE;
      struct buffer_t buf = {buffer, read_nr_bytes};
      calc_proto_ser_server_deserialize(context.ser, buf, &req_found);
      /* no check of req_found here */          /* line 4 */
    diagnostic_log: |
      client: timed out waiting for a response to an incomplete datagram
    choices:
    - 'Line 3: passing &req_found makes the deserializer consume the datagram twice'
    - 'Line 4: when req_found is false the server must send an error response instead of staying silent'
    - 'Line 2: buffer_t must be initialized with a ring-buffer size before deserializing'
    answer: 1
    why: |
      A datagram must contain a complete message; if no request was found, the
      server should answer with a failure response so the client does not hang.
      Option C confuses a buffer wrapper with the serializer ring buffer.
      Option A invents double consumption.
    concept: req-found-ignored-bug
  - kind: choose-better
    level: advanced
    q: A request is too large to fit into one datagram. Which design is better and why?
    choices:
    - Split the request across two datagrams and rely on the receiver to join them
    - Send the first datagram only and let the server reject the incomplete request
    - Use a stream channel and frame messages with a delimiter or length prefix
    answer: 2
    why: |
      A datagram carries one whole message; the receiver cannot join fragments
      because the datagram boundary is already consumed. A stream channel is
      built for arbitrarily long byte sequences and only needs framing.
      Option A violates datagram semantics. Option B just discards the request.
    concept: oversized-datagram-choice
  source_ref: Text/socket_programming.xhtml - UDS datagram peers and message boundaries; Code Boxes 20-23..20-26
- id: b11
  type: syntax
  title: Move the Same Stream Code to TCP with AF_INET
  explain_md: |
    A TCP server is a stream server with a network address family. Compared with
    a UDS stream server, only two things change: the socket call uses `AF_INET`
    instead of `AF_UNIX`, and the address structure is `struct sockaddr_in`
    instead of `sockaddr_un`.

    The TCP server zeroes `sockaddr_in`, sets `sin_family` to `AF_INET`, sets
    `sin_addr.s_addr` to `INADDR_ANY` so it listens on all local interfaces, and
    sets `sin_port = htons(6666)`. It then binds and calls the same
    `accept_forever` used by the UDS server.

    The TCP client likewise creates `socket(AF_INET, SOCK_STREAM, 0)`, resolves
    a hostname to an IPv4 address, copies those address bytes into `sin_addr`,
    sets the same port, and calls `stream_client_loop`. Because TCP is a stream
    socket, all the stream read/write and framing logic is reused unchanged.
  example:
    lang: c
    adapted: true
    code: |
      #include <stdio.h>
      #include <string.h>
      #include <arpa/inet.h>
      #include <netinet/in.h>

      int main(void) {
        struct sockaddr_in addr;
        memset(&addr, 0, sizeof(addr));
        addr.sin_family = AF_INET;
        addr.sin_addr.s_addr = INADDR_ANY;
        addr.sin_port = htons(6666);

        printf("family_ok=%d\n", addr.sin_family == AF_INET);
        printf("port=%u\n", (unsigned)ntohs(addr.sin_port));
        printf("any=%u\n", (unsigned)addr.sin_addr.s_addr);
        return 0;
      }
    run_expected: |
      family_ok=1
      port=6666
      any=0
    explain_md: |
      The address structure is zeroed, the family is set to AF_INET, the wildcard
      address INADDR_ANY is stored, and the port passes through htons before it
      is stored. Converting back with ntohs shows the original host value 6666.
      INADDR_ANY is zero, so byte-order conversion leaves it unchanged.
    note: Combined the sockaddr_in setup and conversion checks into one runnable program.
  checks:
  - kind: predict
    level: core
    q: 'Trace the port conversion: a TCP server stores htons(6666) into sin_port and the client stores htons(6666) too. Which port does each reach?'
    choices:
    - Both reach 6666 because both values pass through the same conversion
    - Both reach 2586 because htons is applied twice on the same host
    - The server reaches 6666 and the client reaches 2586 due to bind versus connect
    answer: 0
    why: |
      Both sides convert the same host value with the same function, so both
      store network-order 6666 and the IP stack reads 6666 on both ends.
      Option B applies the conversion twice in the reasoning. Option C invents a
      bind/connect difference in port interpretation.
    concept: tcp-port-symmetry
  - kind: fillblank
    level: intro
    q: 'A TCP server sets the sin_family field of sockaddr_in to ___. (Answer format: one token)'
    answer_text: AF_INET
    why: |
      sockaddr_in describes an IPv4 network endpoint, so `sin_family` must be
      `AF_INET`, matching the family passed to socket(). Using AF_UNIX here
      would make bind interpret the wrong structure.
    concept: sin-family-af-inet
  - kind: mcq
    level: core
    q: What does assigning INADDR_ANY to sin_addr.s_addr request from bind?
    choices:
    - Let the kernel choose one interface after the first client connects
    - Bind the listener to every local network interface on this host
    - Bind the listener to the loopback interface only, not every NIC
    answer: 1
    why: |
      INADDR_ANY is the wildcard address, so the socket accepts traffic on any
      local interface. It is not loopback-only, and the choice is made at bind,
      not at the first client.
    concept: inaddr-any
  - kind: why-fails
    level: core
    q: Why can the TCP server reuse accept_forever while its main function still has to change?
    choices:
    - accept_forever is network-only, so the UDS server cannot call it at all
    - main must change because TCP cannot reuse a serializer created for UDS
    - accept_forever is stream-generic, but main names the family and address structure
    answer: 2
    why: |
      The accept and handler machinery depends on stream semantics, not on the
      address family, so it is shared. Only the endpoint setup in main is
      family-specific. Option A is false: the UDS stream server calls it.
      Option B is false: the serializer sees bytes, not transport details.
    concept: tcp-reuses-stream-core
  - kind: order
    level: core
    q: Order the 5 correct address-preparation steps for a TCP client; all displayed lines are used.
    lines:
    - copy the resolved IPv4 bytes into sin_addr
    - zero the sockaddr_in structure
    - set sin_port to htons(6666)
    - create a socket with AF_INET and SOCK_STREAM
    - set sin_family to AF_INET
    answer_order:
    - 3
    - 1
    - 4
    - 0
    - 2
    why: |
      The socket is created first, then the address structure is zeroed and
      filled: family, address bytes from the resolver, and the network-order
      port. connect then uses the completed structure.
    concept: tcp-client-address-order
    hint: Clear the whole structure before writing individual fields.
  - kind: spot-bug
    level: advanced
    q: Diagnose why bind fails for this TCP server. Which line is wrong?
    code: |
      int sd = socket(AF_INET, SOCK_STREAM, 0);
      struct sockaddr_un addr;                  /* line 2 */
      memset(&addr, 0, sizeof(addr));
      addr.sun_family = AF_UNIX;                /* line 4 */
      bind(sd, (struct sockaddr*)&addr, sizeof(addr));  /* line 5 */
    diagnostic_log: |
      bind: Invalid argument
    choices:
    - 'Lines 2-4: an AF_INET socket is given a sockaddr_un address instead of a sockaddr_in'
    - 'Line 1: TCP servers must create their socket with AF_UNIX before converting it'
    - 'Line 5: bind requires the listen backlog as its third argument on every socket'
    answer: 0
    why: |
      The socket family is AF_INET, so its address must be a sockaddr_in with
      sin_family = AF_INET. A sockaddr_un has a different layout, and the kernel
      rejects the mismatch. Option B reverses the conversion. Option C confuses
      bind with listen.
    concept: tcp-wrong-address-struct
  source_ref: Text/socket_programming.xhtml - sockaddr_in setup, bind, and byte order; Code Boxes 20-13..20-15
- id: b12
  type: model
  title: Convert Ports with Network Byte Order
  explain_md: |
    Multi-byte integers are stored in host byte order, which differs between
    machines. IP networking standardizes on **network byte order**, which is
    big endian. The port field of `sockaddr_in` is read by the IP stack as a
    network-order number, so a program must convert before storing it.

    The converter family lives in `<arpa/inet.h>`: `htons` and `htonl` convert a
    host short or long to network order, and `ntohs`/`ntohl` convert back.
    `INADDR_ANY` is zero, and zero is identical in both byte orders, so it needs
    no conversion. Address bytes from a resolver are already in network form.

    The classic bug is storing `6666` directly. On a little-endian host,
    `6666` is `0x1A0A` and its bytes are `[0x0A, 0x1A]`. The IP stack reads
    that as `0x0A1A`, which is 2586. The server binds 2586 while every client
    dials 6666, and connections fail with no obvious code error. `htons(6666)`
    produces bytes `[0x1A, 0x0A]`, which read back as 6666.
  example:
    lang: c
    adapted: true
    code: |
      #include <stdio.h>
      #include <arpa/inet.h>

      int main(void) {
        unsigned short host = 6666;
        unsigned short net = htons(host);
        printf("roundtrip=%u\n", (unsigned)ntohs(net));
        printf("equal=%d\n", ntohs(net) == host);
        return 0;
      }
    run_expected: |
      roundtrip=6666
      equal=1
    explain_md: |
      htons converts the host value 6666 into network byte order, and ntohs
      converts it back. The round trip returns the original value on any host
      architecture, so both sides of a connection agree on the port.
    note: Isolated the htons/ntohs round trip in a minimal runnable main.
  viz:
    kind: ascii-memory
    steps:
    - 'HOST VALUE: 6666 decimal = 0x1A0A (a 16-bit integer)'
    - 'LITTLE-ENDIAN MEMORY WITHOUT htons: bytes [0x0A, 0x1A] (least significant first)'
    - 'IP STACK READS MEMORY AS BIG-ENDIAN: 0x0A1A = 2586 (the wrong port)'
    - 'WITH htons(6666): memory bytes become [0x1A, 0x0A]'
    - IP STACK READS 0x1A0A = 6666 (the intended port)
  checks:
  - kind: predict
    level: core
    q: 'Trace the little-endian store: port 6666 is written directly to sin_port with no htons. Which port does the IP stack read?'
    code: |
      struct sockaddr_in addr;
      addr.sin_port = 6666;   /* no conversion */
    choices:
    - 27210, because 6666 is shifted by one byte during binding
    - 2586, because the bytes [0x0A, 0x1A] read as 0x0A1A
    - 6666, because the struct field stores the integer exactly
    answer: 1
    why: |
      On a little-endian host the raw value is stored low byte first, so the
      stack sees 0x0A1A = 2586. Option C ignores byte-order interpretation.
      Option A invents a different shift value.
    concept: missing-htons-trap
  - kind: why-fails
    level: core
    q: Why does a server that skips htons often fail with no useful error in its own code?
    choices:
    - The kernel refuses to bind any raw integer and returns an immediate permission error
    - Skipping htons changes the socket family from AF_INET to AF_UNIX entirely
    - The server binds a different port than clients dial, so connections never arrive
    answer: 2
    why: |
      The stack interprets the stored bytes as a network-order number. Without
      conversion it binds a different port, so clients dial an empty port and
      fail elsewhere. Option A invents an immediate kernel rejection. Option B
      invents a family change.
    concept: wrong-port-silent-failure
  - kind: trace
    level: core
    q: Trace the bytes of htons(6666) on a little-endian host. What is the value of p[0] after conversion?
    code: |
      unsigned short net = htons(6666);
      unsigned char* p = (unsigned char*)&net;
    trace:
      headers:
      - Step
      - Operation
      - Memory bytes
      - Read as
      rows:
      - step: 1
        line: 1
        cells:
        - '1'
        - value 0x1A0A
        - '[0x0A, 0x1A]'
        - 0x0A1A = 2586
      - step: 2
        line: 1
        cells:
        - '2'
        - htons applied
        - '[0x1A, 0x0A]'
        - 0x1A0A = 6666
      - step: 3
        line: 2
        cells:
        - '3'
        - p points at net
        - p[0] = 0x1A
        - '0x1A'
    target:
      row: 2
      col: 3
    answer_text: '0x1A'
    why: |
      htons swaps the byte order for a 16-bit value, so on a little-endian host
      the most significant byte moves to the lowest address. p[0] therefore
      holds 0x1A, forming the network-order representation of 6666.
    concept: htons-byte-trace
  - kind: fillblank
    level: intro
    q: 'The function that converts a 16-bit port from host byte order to network byte order is ___. (Answer format: one token)'
    answer_text: htons
    why: |
      htons means host-to-network short and operates on 16-bit values such as
      ports. htonl handles 32-bit values such as addresses.
    concept: htons-name
  - kind: mcq
    level: core
    q: Why is INADDR_ANY typically assigned without a byte-order conversion?
    choices:
    - Its value is zero, and zero is stored identically in either byte order
    - Its value is already converted by the resolver before the assignment
    - Its value is a string that the kernel converts during bind
    answer: 0
    why: |
      INADDR_ANY is the wildcard value 0. Reversing the bytes of zero still
      yields zero, so no conversion changes the result. Resolver bytes are
      already network-ordered, but that is a separate case.
    concept: inaddr-any-byte-order
  - kind: choose-better
    level: advanced
    q: Which assignment is better for a server port, and why?
    choices:
    - addr.sin_port = ntohs(6666), because reading a port requires conversion too
    - addr.sin_port = htons(6666), because the field must hold network byte order
    - addr.sin_port = 6666, because the compiler converts constants automatically
    answer: 1
    why: |
      Values entering a network structure are converted from host order, so
      htons is the right call. Option C relies on nonexistent compiler
      conversion. Option A applies the reverse direction and would corrupt the
      stored value.
    concept: htons-choice
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of standardizing on network byte order?
    choices:
    - It makes every port number larger than it would be in host order
    - It guarantees that stream messages arrive in the order they were sent
    - It lets machines with different host orders agree on multi-byte field layout
    answer: 2
    why: |
      Without a shared order, one host would read another's multi-byte fields
      with swapped bytes. Network byte order fixes that representation.
      Option A confuses a representation with magnitude. Option B confuses byte
      order with stream ordering.
    concept: network-order-purpose
  source_ref: Text/socket_programming.xhtml - htons/ntohs network byte order conversion
- id: b13
  type: syntax
  title: Serve UDP with the Same Datagram Loop
  explain_md: |
    UDP has the same address family as TCP (`AF_INET`) but the datagram socket
    type (`SOCK_DGRAM`). The UDP server binds `sockaddr_in` with
    `INADDR_ANY` and `htons(9999)`, then calls the same `serve_forever`
    used by the UDS datagram server. It uses `recvfrom` and `sendto`.

    The UDP client creates `socket(AF_INET, SOCK_DGRAM, 0)`, prepares the server
    address, and calls `datagram_client_loop`. Unlike a UDS datagram client, it
    does not bind: the kernel assigns a source IP and an ephemeral port on the
    first send, and that endpoint is what the server's `recvfrom` captures for
    the reply.

    The UDP server is single-threaded because each datagram is an independent,
    self-contained request-response exchange. A datagram must fit in one
    message; the network limits the practical size, unlike the kernel-flexible
    UDS case.
  checks:
  - kind: mcq
    level: intro
    q: Which socket type does the UDP server pass to socket() with AF_INET?
    choices:
    - SOCK_DGRAM, because UDP carries datagrams
    - SOCK_STREAM, because AF_INET requires a stream
    - SOCK_RAW, because UDP needs raw IP packets
    answer: 0
    why: |
      UDP is a datagram protocol, so its socket type is SOCK_DGRAM. TCP with
      AF_INET uses SOCK_STREAM. SOCK_RAW would expose packet headers rather
      than the datagram socket API used here.
    concept: udp-socket-type
  - kind: why-fails
    level: core
    q: Why does the UDP client not need to bind a local address before sending, unlike the UDS datagram client?
    choices:
    - AF_INET datagram sockets cannot bind to a port at all in user space
    - The kernel assigns a source address and ephemeral port on the first send
    - UDP servers ignore the source address and broadcast the reply to every client
    answer: 1
    why: |
      On first sendto, the kernel performs an implicit bind: it chooses a local
      source address from the route and a free ephemeral port, and the server
      replies to that captured endpoint. Option C is false: replies go to the
      sender. Option A is false: AF_INET sockets can bind explicitly.
    concept: udp-implicit-bind
  - kind: predict
    level: core
    q: 'Trace the reply path: a UDP server stores the address returned by recvfrom and later calls sendto with it. Where does the datagram go?'
    code: |
      recvfrom(server_sd, buffer, sizeof(buffer), 0, &peer, &peerlen);
      /* compute and serialize response into buf */
      sendto(server_sd, buf.data, buf.len, 0, &peer, peerlen);
    choices:
    - To every client that has ever sent a datagram to the server
    - To the server's own bound port, where it is read again
    - Back to the specific client endpoint captured by recvfrom
    answer: 2
    why: |
      The address captured by recvfrom is the sender's endpoint; sendto uses it
      as the destination for the reply. Option A describes broadcast, which is
      not what sendto does here. Option B loops the datagram back to the server.
    concept: udp-reply-routing
  - kind: fillblank
    level: core
    q: 'The calculator UDP server binds the network port ___. (Answer format: one number)'
    answer_text: '9999'
    why: |
      The UDP server uses port 9999 with htons, while the TCP server uses 6666.
      The port is part of the server endpoint that clients must dial.
    concept: udp-project-port
  - kind: order
    level: core
    q: Order the 5 correct startup steps for the UDP server; all displayed lines are used.
    lines:
    - bind the sockaddr_in to the socket
    - create a socket with AF_INET and SOCK_DGRAM
    - call serve_forever to receive datagrams
    - zero the sockaddr_in structure
    - set sin_family, sin_addr, and sin_port
    answer_order:
    - 1
    - 3
    - 4
    - 0
    - 2
    why: |
      The datagram socket is created first, then the address structure is
      zeroed and filled, bind attaches the endpoint, and the serve loop starts
      receiving. There is no listen or accept step for a datagram server.
    concept: udp-server-startup
    hint: A datagram server never calls listen or accept.
  - kind: spot-bug
    level: advanced
    q: A UDP server is accidentally built as a stream server. Which line prevents datagrams from being received as independent messages?
    code: |
      int sd = socket(AF_INET, SOCK_STREAM, 0);        /* line 1 */
      struct sockaddr_in addr;
      addr.sin_family = AF_INET;
      addr.sin_addr.s_addr = INADDR_ANY;
      addr.sin_port = htons(9999);
      bind(sd, (struct sockaddr*)&addr, sizeof(addr));
    diagnostic_log: |
      client: sendto reports success but the server never processes a datagram
    choices:
    - 'Line 1: SOCK_STREAM makes a byte-stream channel, not the datagram channel UDP needs'
    - 'Line 5: UDP servers must use htonl for the port instead of htons on every send'
    - 'Line 6: bind is illegal for AF_INET datagram sockets on a shared channel'
    answer: 0
    why: |
      UDP requires SOCK_DGRAM. With SOCK_STREAM the endpoint behaves as a stream
      listener, so the datagram exchange does not match it. Option B uses the
      wrong converter width. Option C is false: servers bind their endpoint.
    concept: udp-wrong-socket-type
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of keeping the UDP server single-threaded?
    choices:
    - The receive loop must finish every datagram before the kernel creates the socket
    - Each datagram is a self-contained request-response unit with no session state
    - UDP sockets cannot be used by more than one thread in the same process
    answer: 1
    why: |
      The server reads one datagram, handles it, and replies; there is no
      long-lived per-client stream to block. Option C invents a threading
      restriction. Option A reverses socket creation and the loop.
    concept: udp-single-thread-purpose
  source_ref: Text/socket_programming.xhtml - TCP and UDP mains over shared cores; Code Boxes 20-27..20-28
- id: b14
  type: design
  title: Consolidate the Transport Skins over Shared Cores
  explain_md: |
    Eight executables look like eight programs, but each is a thin
    transport-specific main on top of shared cores. Stream clients (UDS and TCP)
    call `stream_client_loop`; stream servers call `accept_forever`,
    `client_handler`, and `stream_write_resp`. Datagram servers (UDS and UDP)
    call `serve_forever` and the datagram response writer; datagram clients call
    `datagram_client_loop`.

    The skins differ only in constants: the address family (`AF_UNIX` or
    `AF_INET`), the socket type (`SOCK_STREAM` or `SOCK_DGRAM`), the address
    structure (`sockaddr_un` with a path, or `sockaddr_in` with `INADDR_ANY`
    and a port), and, for UDS datagrams, the extra client bind.

    This is why moving from UDS to network sockets
    changes only the main functions. It also explains where to add a new
    transport: write a new main that supplies these constants and reuse the
    core loop. The serializer and the calculation service sit above all
    transport code and never learn which socket family is in use.
  checks:
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of extracting stream and datagram cores from the eight executable mains?
    choices:
    - It makes every executable depend on all four socket families at link time
    - It forces the serializer to choose a transport before it can encode a message
    - It keeps transport-independent behavior in one place and reduces duplicated code
    answer: 2
    why: |
      Shared cores hold the accept, serve, and client-loop logic once; each main
      supplies only transport constants. Option A invents coupling. Option B
      contradicts the transport-blind serializer.
    concept: shared-core-purpose
  - kind: choose-better
    level: advanced
    q: A new transport must be added to the calculator. Which approach is better and why?
    choices:
    - Write a new main that supplies family, type, address, and reuse the existing core loop
    - Copy the full server core into the new directory and edit it for the new transport
    - Put the new transport logic inside calcsvc so every transport shares its state
    answer: 0
    why: |
      The architecture is designed for this extension: a thin skin over the
      appropriate core. Option B duplicates logic and its bugs. Option C breaks
      the service's transport independence and per-client state.
    concept: adding-transport-design
  - kind: mcq
    level: core
    q: Which loop does a UDP calculator client call at the end of its main?
    choices:
    - serve_forever, shared with the UDP datagram server loop
    - datagram_client_loop, shared with the UDS datagram client
    - stream_client_loop, shared with the TCP stream client
    answer: 1
    why: |
      UDP is a datagram channel, so its client reuses the datagram client loop
      that the UDS datagram client also calls. stream_client_loop belongs to
      stream clients, and serve_forever is a server loop.
    concept: udp-client-loop
  - kind: why-fails
    level: core
    q: Why can the serializer and service remain unchanged when a calculator process moves from UDS to TCP?
    choices:
    - TCP sockets automatically translate UDS application messages into TCP messages
    - The serializer stores a copy of every socket family in its ring buffer
    - They operate on bytes and objects, not on the transport addresses used by the socket
    answer: 2
    why: |
      The serializer converts objects to bytes and back; the service computes on
      numbers. Neither inspects the address family. Option A invents automatic
      translation. Option B invents transport data in the protocol buffer.
    concept: transport-blind-layers
  - kind: fillblank
    level: core
    q: 'A datagram client starts its command loop by calling ___. (Answer format: one token)'
    answer_text: datagram_client_loop
    why: |
      All datagram clients share datagram_client_loop, just as all stream
      clients share stream_client_loop. The UDS datagram client adds only its
      self-bind step before calling it.
    concept: datagram-client-loop-name
  - kind: predict
    level: advanced
    q: 'Trace the change: a UDS stream server is converted to TCP. Which functions in the server core still run unchanged?'
    code: |
      main: socket(AF_INET, SOCK_STREAM, 0); /* ... bind ... */
      accept_forever(server_sd);             /* unchanged */
      /* client_handler and stream_write_resp also unchanged */
    choices:
    - accept_forever, client_handler, and stream_write_resp all run unchanged
    - Only main runs unchanged because every other function names the family
    - None of them, because the serializer must be rebuilt for TCP
    answer: 0
    why: |
      The core functions depend on stream semantics, not on AF_UNIX versus
      AF_INET. Only endpoint setup in main changes. Option B reverses the
      boundary. Option C is false: the serializer is transport-blind.
    concept: transport-skin-delta
  source_ref: Text/socket_programming.xhtml - shared transport cores and the eight executables
