    - To balance CPU load across four cores, since the library refuses to share instance state
    - Because libcalcser.a forbids more than one callback registration per process
    - Because thread stacks cannot exceed one serializer object per thread
    answer: 0
    why: |
      The design notes that "every client has its own serializer object.
      This is also true for the calculator service object. These objects are
      created and destroyed as part of the same thread." Isolation is the
      point: the deserializer's accumulated bytes and the service's internal
      memory are per-client state, so they live and die with the client's
