    - 'STREAM PAIR (srvcore): accept_forever + client_handler + stream_write_resp => reused by unix_stream_calc_server AND tcp_calc_server'
    - 'DATAGRAM PAIR (srvcore): serve_forever + datagram_write_resp => reused by unix_datagram_calc_server AND udp_calc_server'
    - 'CLIENT PAIR (clicore): stream_client_loop => both stream clients | datagram_client_loop => both datagram clients (UDS adds self-bind)'
    - 'ABOVE ALL: libcalcser.a (protocol: serializer/deserializer) + libcalcsvc.a (stateful service) - transport-agnostic, linked everywhere'
