    - id: SRES
      label: response object
      shape: io
    - id: SSER
      label: server_serialize
    - id: W2
      label: bytes on the channel
      shape: io
    - id: CDES
      label: client_deserialize
    - id: CCB
      label: resp_cb
      shape: io
    edges:
    - from: REQ
