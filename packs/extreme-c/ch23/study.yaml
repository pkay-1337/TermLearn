    - read stays blocked forever, because a closed peer never wakes a reader
    - read returns 0, the loop breaks, and the thread tears down that client's service object, serializer, and address before returning
    - read returns -1 with EAGAIN, so the loop retries until the client reconnects
    - the process exits via exit(1), killing every other client's thread too
    answer: 1
    why: |
      The stream client handler loop treats 0 and -1 alike as "break": a peer that
      quits closes its end, so the blocking read stops with 0 and the handler
      performs the fixed teardown sequence - service dtor + delete, serializer
      dtor + delete, free the context address - all inside the client's own
      thread. Option C invents EAGAIN behavior for a blocking socket; option
      D confuses the handler's exit(1) error path (a failed pthread_create in
