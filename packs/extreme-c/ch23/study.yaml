- id: b12
  type: model
  title: 'Ship Ports in Network Byte Order: htons, htonl, and Back'
  explain_md: |
    The network mains assign ports through a converter without
    commentary - `addr.sin_port = htons(6666)` for TCP and `htons(9999)` for
    UDP. This block unpacks that convention, because a server that skips it
    binds a *different port* than the one the client dials.

    **Two byte orders exist.** A 16-bit value like 6666 (hex `0x1A0A`) can be
    stored low-byte-first (**little endian**) or high-byte-first (**big
    endian**). IP networking standardized on **network byte order, which is
    big endian**; host CPUs often differ (many, including common x86-64 and
    ARM builds, are little endian). The port field of `sockaddr_in` is
    read by the IP stack as a network-order number, so whatever you store
    there must already BE network ordered.

    **The converter family** (POSIX `<arpa/inet.h>`, in hostings like the
    Linux toolchain):

    - `htons` / `htonl` — **h**ost **to** **n**etwork, for `s`hort (16-bit,
      ports) and `l`ong (32-bit, addresses) values.
    - `ntohs` / `ntohl` — **n**etwork **to** **h**ost, for reading values
      back out of received structures.

    **Trace of the trap.** On a little-endian host, storing the raw integer
    6666 = `0x1A0A` puts the bytes in memory as `[0x0A, 0x1A]` (least
    significant byte first). The IP stack then reads those bytes as a
    network-order number: `0x0A1A` = **2586**. The server ends up bound to
    port 2586 while every client dials 6666 — connections fail with nothing
    obviously wrong in the code. With `htons(6666)`, the memory bytes are
    `[0x1A, 0x0A]`, which the stack reads back as 6666 exactly.

    **When conversion is NOT needed** in the code:

    - `INADDR_ANY` is the value **0**; zero reads identically in both byte
      orders, so the assignment is order-neutral.
    - The TCP client's `addr.sin_addr = *((struct in_addr*)
      host_entry->h_addr)` copies the resolver's result — the address bytes
      there are already the network representation, ready for the wire.

    **Reading back**: when code must *inspect* a port it received (say,
    logging the peer address captured by `recvfrom`), it converts with
    `ntohs`; the same symmetry applies to addresses with `ntohl`.
  viz:
    kind: ascii-memory
    steps:
    - 'GOAL: sin_port must hold the port in NETWORK byte order (big endian) because the IP stack reads ports that way'
    - 'HOST REALITY: little-endian CPU stores 0x1A0A as bytes [0x0A, 0x1A] (low byte first) - the IP stack would read 0x0A1A = 2586'
    - 'FIX: htons(6666) rearranges to [0x1A, 0x0A] in memory => stack reads 0x1A0A = 6666 - the port the client dialed'
    - 'FAMILY: htons/htonl = host to network | ntohs/ntohl = network to host | short = 16-bit ports, long = 32-bit addresses'
    - 'NO-CONVERT CASES: INADDR_ANY (value 0 is order-symmetric) | host_entry->h_addr copies (already network form)'
    - 'READ BACK: inspecting a captured peer port needs ntohs before printf-style formatting'
  checks:
  - kind: predict
    level: core
    q: On a little-endian host, a debugging probe dumps the two bytes that htons(0xABCD) left in sin_port, printing the lower memory address first. What does the probe show?
    code: |
      addr.sin_port = htons(0xABCD);
      unsigned char* p = (unsigned char*)&addr.sin_port;
      printf("%02x %02x\n", p[0], p[1]);   /* ??? */
    choices:
    - ab cd
    - cd ab
    - abcd 00
    - the layout is CPU-dependent, so a stored port's bytes cannot be reasoned about in advance
    answer: 0
    why: |
      htons moved the value into NETWORK byte order (big endian): the most
      significant byte 0xAB sits at the LOWER address and 0xCD at the higher
      one, so the probe prints ab cd. That is exactly the property the IP
      stack relies on. Without the htons, the same probe on this host would
      print cd ab - the little-endian image of 0xABCD - which the stack would
      then misread as 0xCDAB.
      Option D claims unpredictability, but once htons is applied the
      layout is fully determined: big-endian bytes on every host.
    concept: port-htons-memory-predict
  - kind: trace
    level: advanced
    q: A log helper reads a captured peer port straight out of a filled sockaddr_in and converts it for display. Fill the target cell.
    trace:
      headers:
      - Bytes at sin_port (memory order)
      - Value in network byte order
      - Displayed after the right converter
      rows:
      - - '[0x0A, 0x1A]'
        - 2586
        - 2586
      - - '[0x1A, 0x0A]'
        - ???
        - 6666
    target:
      row: 1
      col: 1
    choices:
    - 6666
    - 2586
    - 26214
    - 6656
    answer: 0
    why: |
      Middle column = the byte sequence read as a big-endian number.
      Bytes [0x1A, 0x0A] are exactly what htons(6666) leaves in memory on a
      little-endian host; read in network (big-endian) order they form
      0x1A0A, which is 6666 - and converting with ntohs yields the human
      port 6666 for the log line. Row 1 shows the miswritten case: raw
      little-endian bytes read back as 0x0A1A = 2586, the wrong port.
      Option C confuses decimal 6666 with a hex literal; option D edits a
      byte outright.
    concept: port-network-order-readback
  - kind: why-fails
    level: advanced
    q: On a little-endian host, the TCP server assigns `addr.sin_port = 6666;` (no conversion), while every client correctly uses `htons(6666)`. Why can no client ever connect?
    choices:
    - The bind fails outright; the kernel refuses plain integer ports
    - The server actually binds port 2586 - the bytes of 6666 stored little-endian ([0x0A, 0x1A]) are read by the IP stack as the network-order number 0x0A1A - so dialers to 6666 find nobody listening
    - The client's htons corrupts the port; without everyone skipping htons the connection would work
    - The kernel silently doubles the port on bind, so the server sits on 13332
    answer: 1
    why: |
      The trap, byte by byte: 6666 is 0x1A0A. A little-endian host stores it
      as [0x0A, 0x1A] (least significant byte at the lower address). The IP
      stack, expecting network byte order, reads [0x0A, 0x1A] as 0x0A1A =
      2586. Bind succeeds happily, on the wrong port. Meanwhile the clients
      convert 6666 properly, so their packets target port 6666 - where
      nothing listens. Both sides "did nothing wrong" except the missing
      conversion. htons(6666) would have laid the bytes down as [0x1A, 0x0A],
      which reads back as 6666 in network order.
      Options A, C, and D invent kernel rejections, client-side corruption,
      and port doubling.
    concept: port-byte-order-trap
  - kind: eipe
    level: core
    q: In one sentence, what problem does the htons/htonl/ntohs/ntohl family exist to solve?
    choices:
    - They compress numeric fields so datagrams stay under the MTU on slow links
    - They move values between the CPU's own (host) byte order and the fixed network byte order, at every boundary where an integer travels onto or off the wire
    - They encrypt short integers so sniffers cannot read port numbers on the wire
    - They align ports to 4-byte boundaries inside sockaddr_in for faster DMA
    answer: 1
    why: |
      The family is a translation service at the wire boundary: network
      protocols fix one byte order (big endian) while host CPUs vary, so any
      host-side integer placed into a protocol field needs htons/htonl, and
      any integer read out of a protocol field needs ntohs/ntohl before
      human-facing arithmetic. That is why the project's mains convert the port
      and why an inspection helper would convert the captured peer values
      back. Options A, C, and D invent compression, encryption, and
      alignment roles.
    concept: conversion-function-purpose
  - kind: spot-bug
    level: advanced
    q: A developer transcribed the TCP server's address preparation from memory. Compiles clean, binds nothing useable. Which line carries the defect?
    code: |
      int server_sd = socket(AF_INET, SOCK_STREAM, 0);
      if (server_sd == -1) { fprintf(stderr, "Could not create socket: %s\n", strerror(errno)); exit(1); }
      struct sockaddr_in addr;
      memset(&addr, 0, sizeof(addr));
      addr.sin_family = AF_UNIX;              /* Line 5 */
      addr.sin_addr.s_addr = INADDR_ANY;
      addr.sin_port = htons(6666);
      int result = bind(server_sd, (struct sockaddr*)&addr, sizeof(addr));
    diagnostic_log: |
      bind failed: Address family not supported by protocol
    target_line: 5
    choices:
    - 'Line 5: the family inside the sockaddr_in must match the descriptor''s family (AF_INET here); AF_UNIX promises a filesystem path, which sin_addr/sin_port cannot encode, so the kernel rejects the address at bind time'
    - 'Line 1: the socket call should have used AF_UNIX since sockaddr_in was replaced by sockaddr_un'
    - 'Line 7: the port must be 9999 because TCP shares the UDP server''s port on Linux'
    answer: 0
    why: |
      The family fields must agree on both sides of the call: the descriptor
      was created with AF_INET, so the address prepared for bind must declare
      itself AF_INET too. Carrying AF_UNIX inside a sockaddr_in is a
      self-contradiction (the UDS family is bound by path in sun_path, which
      sockaddr_in does not even have), and the kernel reports the mismatch
      with EAFNOSUPPORT. Option B reverses the fix at the wrong call site;
      option C confuses the project's TCP port (6666) with its UDP port
      (9999).
    concept: family-mismatch-in-sockaddr-in
  - kind: mcq
    level: core
    q: Why does `addr.sin_addr.s_addr = INADDR_ANY;` need no converter while the neighboring port line wraps its value in htons?
    choices:
    - INADDR_ANY is the value 0, and zero reads identically in either byte order, so no conversion can change it
    - sin_addr is protected from conversion by the kernel's copy-on-write machinery
    - Addresses are fixed by gethostbyname to be little endian on all platforms
    - htons refuses non-numeric values, and INADDR_ANY is a macro instead of a number
    answer: 0
    why: |
      INADDR_ANY is defined as the all-zeros address - the IPv4 wildcard -
      and 0x00000000 is the same sequence of bytes read in either direction,
      so no endian conversion has anything to shift. Ports are ordinary
      counting numbers (6666, 9999) whose bytes DO depend on the host's
      ordering, hence the converter. The TCP client's resolved address,
      note, arrives as network-ordered bytes from the host entry - that is a
      different reason entirely from the zero-value symmetry.
      Options B, C, and D invent kernel protections, platform-wide little
      endianness, and macro-vs-number rules.
    concept: inaddr-any-zero-symmetric
  - kind: fillblank
    level: intro
    q: Complete the UDP server's port assignment with the host-to-network converter used by the project.
    code: |
      addr.sin_family = AF_INET;
      addr.sin_addr.s_addr = INADDR_ANY;
      addr.sin_port = ____________(9999);
    answer_text: htons
    why: |
      The UDP server reads addr.sin_port = htons(9999) - the
      converter is htons because a port is a 16-bit value and it must land in
      network byte order for the IP stack. htonl is the 32-bit sibling
      (addresses), and ntohs/ntohl convert in the other direction when
      reading captured fields back.
    concept: htons-wire-fillblank
- id: b13
  type: model
  title: 'Dial Out with UDP: the Same Datagram Cores Behind AF_INET'
  explain_md: |
    The **UDP server and client** close the material, and they are framed
    them as a merge of everything before: "UDP sockets are network sockets.
    Other than that, they are datagram sockets. Therefore, we expect to
    observe a high degree of similarity between the code we wrote for the
    TCP server together with the code we wrote for the datagram server
    operating on a UDS."

    **UDP server main**:
    ```c
    int server_sd = socket(AF_INET, SOCK_DGRAM, 0);
    struct sockaddr_in addr;
    memset(&addr, 0, sizeof(addr));
    addr.sin_family = AF_INET;
    addr.sin_addr.s_addr = INADDR_ANY;
    addr.sin_port = htons(9999);
    /* bind ... */
    serve_forever(server_sd);
    ```
    The main difference versus TCP is purely the type - "the fact that the
    socket type is `SOCK_DGRAM` for the UDP socket. The address family
    remains the same, because both of them are network sockets" - and the
    project's UDP port is **9999**. The serve side is unchanged from UDS:
    "we have to use the `recvfrom` and `sendto` functions to work with UDP
    sockets. So, as you can see, we have used the **same `serve_forever`**
    function to serve incoming datagrams. This function is part of the
    server common library meant to contain the datagram-related code."

    **UDP client main**: `socket(AF_INET, SOCK_DGRAM, 0)` and the address
    prep, then `datagram_client_loop(conn_sd)` — the same loop the UDS
    datagram client ran.

    **The bind difference resolves here.** The UDS datagram client "is
    required to bind a socket file ... This is not true for datagram clients
    using network sockets": a network client "always has a corresponding
    socket descriptor that is bound to an IP address and a port, so this
    problem cannot occur". So*mathemté the UDP client never calls bind —
    the kernel supplies its endpoint automatically (an IP of the outgoing
    interface and an assigned local port the moment it sends), which is
    exactly the return address the server's `recvfrom` captures to reply
    through `sendto`.

    **Sizing**, as with any datagram channel: request and response must fit
    one datagram — and for network datagrams "you are bound to the
    configuration of the network", unlike the kernel-flexible UDS case.
  viz:
    kind: ascii-memory
    steps:
    - 'IDENTITY: UDP = network socket (AF_INET) AND datagram socket (SOCK_DGRAM) - merges the TCP family with the datagram machinery'
    - 'SERVER MAIN: socket(AF_INET, SOCK_DGRAM) -> INADDR_ANY + htons(9999) -> bind -> serve_forever (libsrvcore datagram core, unchanged)'
    - 'CLIENT MAIN: socket(AF_INET, SOCK_DGRAM) -> address prep -> datagram_client_loop (NO bind call anywhere in the main)'
    - 'AUTO ENDPOINT: unbound network datagram clients get IP + port assigned kernel-side on first send => recvfrom on the server captures a full return address'
    - 'I/O: recvfrom/sendto as with UDS datagrams; one whole message per datagram; size bounded by the network configuration'
  checks:
  - kind: mcq
    level: core
    q: Which single kernel-level attribute change turns the calculator's TCP server main into a UDP server main?
    choices:
    - The socket type SOCK_STREAM becomes SOCK_DGRAM; the address family stays AF_INET
    - The address family AF_INET becomes AF_UNIX; the type stays SOCK_STREAM
    - listen() replaces bind(), since UDP servers receive connections from clients
    - The serializer constructor size doubles to handle split datagrams
    answer: 0
    why: |
      The UDP delta is: "the main difference between a UDP
      socket and a TCP socket, regardless of being used in a client or server
      program, is the fact that the socket type is SOCK_DGRAM for the UDP
      socket. The address family remains the same, because both of them are
      network sockets." Option B is the UDS direction, option C invents a
      connection-receiving listen for UDP, and option D invents a serializer
      adaptation - the serializer never sees datagram boundaries, only
      '$'-terminated messages.
    concept: udp-same-main-serving
  - kind: trace
    level: core
    q: Three UDP clients transmit one request each, none of them ever calling bind(). Trace what the server's loop observes. Fill the target cell.
    trace:
      headers:
      - Client action
      - Kernel-side effect
      - What serve_forever's recvfrom captures
      rows:
      - - client A fires sendto(server ip:9999)
        - kernel assigns A a fresh local IP + port for its unbound socket
        - datagram + A's endpoint (IP, assigned port)
      - - client B fires sendto(server ip:9999)
        - B gets its own endpoint, distinct from A's
        - datagram + B's endpoint
      - - client A fires a second request
        - A's socket keeps the endpoint assigned earlier
        - ???
    target:
      row: 2
      col: 2
    choices:
    - the same endpoint assigned to A's socket on its first send - the reply can be sent straight back to it
    - a second fresh endpoint, because kernels rotate ports on every datagram
    - nothing - unbound sockets cannot send twice
    - the server's own endpoint, echoed back to the client for bookkeeping
    answer: 0
    why: |
      Network clients skip the bind because
      "a client always has a corresponding socket descriptor that is bound to
      an IP address and a port" - the kernel's binding persists for the
      socket's life, so A's second departure carries the same return address
      as its first. That stability is what lets the server's captured
      sockaddr keep working reply after reply. Options B, C, and D invent
      port rotation, send restrictions, and endpoint echo.
    concept: udp-auto-port-trace
  - kind: why-fails
    level: advanced
    q: A UDP server's author deletes the bind step ("clients work unbound, why not me?") and loops on recvfrom. Clients sendto the intended port 9999; the server sees nothing. Why?
    choices:
    - recvfrom cannot run at all on an unbound socket; the call returns -1 within microseconds
    - With no address bound, the datagram socket is not an endpoint of any IP + port, so datagrams addressed to it (port 9999) have nowhere to land; binding INADDR_ANY + 9999 is what makes the kernel route those packets to this socket
    - It works, but only after the first client connects, since UDP derives the server port from its clients
    - The kernel auto-assigns the server a port too, but never 9999, so the exchange needs an out-of-band port lookup
    answer: 1
    why: |
      Binding is what attaches the socket to a local endpoint - here
      INADDR_ANY and port 9999 as the UDP server main shows - so the kernel knows
      which socket should receive datagrams addressed to that IP + port. A
      server socket with no bind is addressless: the clients' packets to
      9999 are delivered to whoever owns that port (nobody), and the loop
      starves. The zero-bind rule belongs to network CLIENTS, because
      "regarding network sockets, a client always has a corresponding socket
      descriptor that is bound to an IP address and a port" - that "always"
      comes from the kernel, and for a server the bound endpoint must be the
      well-known one clients aim at.
      Option A misstates recvfrom (it blocks); options C and D invent
      client-derived and auto lookup behaviors.
    concept: unbound-udp-server-invisible
  - kind: choose-better
    level: advanced
    q: The calculator deployment will ship in containers whose clients run on other machines over the network. Which socket family pairing is correct, and why does the UDS preference not apply?
    choices:
    - |
      /* UDS everywhere - fastest channel, reused from the project */
      socket(AF_UNIX, SOCK_DGRAM, 0);   /* client and server containers share /tmp */
    - |
      /* network sockets - UDS live only within one machine */
      socket(AF_INET, SOCK_DGRAM, 0);   /* or SOCK_STREAM for the TCP variant */
    answer: 1
    why: |
      The review fixes the domain of UDS: they are "usable only when all
      participating processes live on one machine", and single-host
      deployments should prefer UDS for speed and low overhead - but the flip
      side is exactly that once client and server cross a machine boundary,
      UDS endpoints (filesystem paths) have no meaning, and this section
      reaches for AF_INET channel: TCP for stream channels, UDP for
      datagram channels. Note the second option's comment: containers on one
      HOST do not share a filesystem namespace, so "same machine" fails even
      when the same hardware hosts both processes - another reason cross-
      container means cross-machine for endpoint purposes.
      Option A pretends /tmp spans containers, which is precisely the trap
      the UDS scope rules out.
    concept: network-datagram-needed-when-remote
  - kind: fillblank
    level: core
    q: Complete the UDP server's socket creation call.
    code: |
      int server_sd = socket(AF_INET, ____________, 0);
      if (server_sd == -1) {
        fprintf(stderr, "Could not create socket: %s\n", strerror(errno));
        exit(1);
      }
    answer_text: SOCK_DGRAM
    why: |
      UDP main's UDP server asks for the datagram type: even though it
      is a network socket like TCP, the datagram channel kind demands
      SOCK_DGRAM (and the serve side then runs the datagram core with
      recvfrom/sendto). Compare the TCP server, whose same line reads
      SOCK_STREAM.
    concept: udp-type-constant-fillblank
  - kind: eipe
    level: advanced
    q: In one sentence, what does a connection-less UDP channel buy a server compared with managing per-client stream connections?
    choices:
    - It lets the server statefully track each client's memory between requests for free
    - It serves datagrams one at a time from a single-threaded loop, with no per-client connection state or thread machinery to maintain
    - It guarantees that every request is answered exactly once, removing the need for request IDs
    - It removes the bounded backlog worry by converting datagrams into connections internally
    answer: 1
    why: |
      The datagram server description is the embodiment: it "is a
      single-threaded program and there is no multithreading around it", and
      it "operates on every datagram individually and independently" - each
      recvfrom delivers a self-contained message with its return address, so
      the server never holds connection state per client (the fine print
      being the per-datagram service-object churn the earlier block
      discussed). UDP inherits that shape on the network side wholesale:
      serve_forever and datagram_client_loop run unchanged. Options A, C,
      and D misattribute statefulness, delivery guarantees, and connection
      synthesis to a channel whose essence is not having them.
    concept: connectionless-buys-independence
- id: b14
  type: design
  title: 'One Protocol, Four Skins: How the Eight Executables Share Their Cores'
  explain_md: |
    Step back and the architecture snaps into focus. The
    calculator ships **eight executables** (four servers, four clients), but
    each contains only a thin, transport-specific `main`. The machinery they
    invoke lives in the common libraries, reused across socket types as the
    design promised at every stop:

    - **stream clients** (both the UDS *unix_stream_calc_client* and
      *tcp_calc_client*) call `stream_client_loop` — part of the client
      common library, "used by all stream clients, regardless of the socket
      type and is shared between UDS and TCP sockets".
    - **stream servers** (*unix_stream_calc_server*, *tcp_calc_server*) call
      the srvcore stream core: `accept_forever` "should be there because its
      definition remains the same for other stream sockets such as TCP
      sockets", plus `client_handler` and `stream_write_resp`.
    - **datagram servers** (*unix_datagram_calc_server*, *udp_calc_server*)
      call the srvcore datagram core: `serve_forever` ("part of the server
      common library meant to contain the datagram-related code") and
      `datagram_write_resp` from the same library.
    - **datagram clients** (*unix_datagram_calc_client*, *udp_calc_client*)
      call `datagram_client_loop`, with the UDS one adding only the
      self-bind step.
    - The *skins* differ only in their main-level constants: the family
      (`AF_UNIX` / `AF_INET`), the type (`SOCK_STREAM` / `SOCK_DGRAM`), and
      the address structure (`sockaddr_un` path, or `sockaddr_in` with
      `INADDR_ANY` and the ports 6666 (TCP) / 9999 (UDP)).

    Sitting **above** all transport code are the two transport-agnostic
    layers the project is really about: `libcalcser.a` — the serializer that
    *dictates the application protocol* — and `libcalcsvc.a` — the stateful
    calculation service "isolated as a standalone logic", linked by every
    server.

    The closing observation admits that "there are many things in the
    calculator project that we didn't even talk about" and recommending the
    code base as standing practice. And the payoff of this section's
    *unusual order* — teaching sockets inside this one running project — is
    that every concept (protocol, serializer, listener/connector sequences,
    thread patterns, byte order) landed with a concrete place to live, and
    each varietal switch showed which boundaries were common and which were
    truly transport-bound.
