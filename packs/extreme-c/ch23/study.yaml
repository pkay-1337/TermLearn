  - id: b5
    type: algorithm
    title: "Parse Delimited Streams via Ring Buffers and Event Observers"
    explain_md: |
      Handling variable-length stream messages requires a continuous ingestion algorithm. When data arrives from
      a stream socket via `read()`, the bytes arrive in arbitrary chunk sizes. The serializer/deserializer class
      (`calc_proto_ser_t`) solves this using a ring buffer (or dynamic accumulator buffer) coupled with the
      Observer/Callback pattern.

      The ingestion algorithm operates as follows:
      1. Incoming bytes from `read()` are appended into the internal ring buffer.
      2. The parser scans the buffer for the message delimiter `$`.
      3. If no `$` is found, the parser preserves the accumulated bytes and yields control, awaiting the next `read()`.
      4. When `$` is located, the parser extracts the delimited frame, slices it by field delimiters `#`, and
         converts the tokens into target struct fields (`req_id`, `method`, `operand1`, `operand2`).
      5. Upon successfully reviving the object, the deserializer dispatches it immediately to registered callbacks
         (`req_cb_t` or `resp_cb_t`) along with an opaque context pointer (`owner_obj`).
      6. The processed message bytes are pruned from the ring buffer, and the scan repeats in case multiple messages
         were received in the same chunk.

      This design completely decouples stream chunk fragmentation from message processing logic.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <string.h>
        #include <stdlib.h>

        typedef void (*frame_cb_t)(void* ctx, const char* frame);

        void parse_chunks(const char* chunk, frame_cb_t cb, void* ctx) {
          static char acc[128];
          static size_t acc_len = 0;
          strcat(acc + acc_len, chunk);
          acc_len += strlen(chunk);

          char* delim;
          while ((delim = strchr(acc, '$')) != NULL) {
            *delim = '\0';
            cb(ctx, acc);
            size_t frame_len = (delim - acc) + 1;
            memmove(acc, delim + 1, acc_len - frame_len + 1);
            acc_len -= frame_len;
          }
        }

        void print_frame(void* ctx, const char* frame) {
          printf("Extracted [%s]: %s\n", (const char*)ctx, frame);
        }

        int main(void) {
          parse_chunks("100#ADD", print_frame, "Client1");
          parse_chunks("#1#2$200#SUB#", print_frame, "Client1");
          parse_chunks("9#3$", print_frame, "Client1");
          return 0;
        }
      run_expected: "Extracted [Client1]: 100#ADD#1#2\nExtracted [Client1]: 200#SUB#9#3\n"
      subgoals:
        - label: "Accumulate arbitrary stream chunk fragments"
          lines: [9, 10, 11]
        - label: "Detect delimiter and slice completed frame"
          lines: [14, 15, 16]
        - label: "Dispatch completed message to callback"
          lines: [17]
        - label: "Shift residual buffer bytes forward"
          lines: [18, 19, 20]
    checks:
      - kind: order
        q: "Order the algorithmic steps executed by a stream message deserializer when new bytes arrive on a socket:"
        lines:
          - "Append received bytes into the internal accumulator or ring buffer."
          - "Invoke registered observer callback (req_cb_t) passing the populated struct."
          - "Scan the buffer for the terminating delimiter '$'."
          - "Tokenize the extracted frame on '#' and parse numerical fields."
          - "Discard all bytes preceding '$' and repeat scan for coalesced messages."
        answer_order: [0, 2, 3, 1, 4]
        why: |
          The deserializer must: 1. Ingest new bytes into buffer, 2. Search for '$', 3. Tokenize fields on '#',
          4. Notify observers via callback, 5. Prune extracted bytes and check for subsequent messages.
        concept: "stream-deserialization-lifecycle"

      - kind: predict
        q: "Trace the execution of parse_chunks with partial inputs. How many frames are dispatched after the second call?"
        code: |
          parse_chunks("100#ADD#", print_frame, "Ctx"); // Call 1: No delimiter '$'
          parse_chunks("2#3$", print_frame, "Ctx");      // Call 2: Delimiter '$' present
        choices:
          - "0 frames"
          - "1 frame"
          - "2 frames"
          - "Call 2 crashes with buffer underflow"
        answer: 1
        why: |
          Call 1 accumulates "100#ADD#" but finds no '$', so 0 frames are dispatched.
          Call 2 appends "2#3$", finds '$', and dispatches exactly 1 frame: "100#ADD#2#3".
          Option A ignores Call 2 completion. Option C assumes Call 1 emitted a frame.
        concept: "partial-chunk-accumulation-trace"

      - kind: why-fails
        q: "Why does omitting memmove() after slicing a message in a stream accumulator cause subsequent frames to be lost or corrupted?"
        choices:
          - "The socket descriptor closes automatically if memmove is not called"
          - "The compiler optimizes away while loops that lack memmove"
          - "Residual bytes from the next message remain stranded behind the null terminator instead of shifting to the buffer start"
          - "POSIX sockets require memory movement to synchronize CPU cache lines"
        answer: 2
        why: |
          When multiple messages are received in a single chunk (e.g. "MSG1$MSG2$"), slicing MSG1 leaves "MSG2$"
          in the buffer. Without memmove shifting the remaining bytes to index 0, subsequent appends will overwrite
          or orphan the unparsed bytes. Options A, B, and D are false claims.
        concept: "buffer-pruning-necessity"

      - kind: mcq
        q: "In the calc_proto_ser_t library, what is the role of the owner_obj argument passed to calc_proto_ser_ctor and forwarded to callbacks?"
        choices:
          - "It provides an opaque context pointer (such as client_context_t*) allowing callbacks to access session state without global variables"
          - "It identifies the process owner UID for kernel authentication"
          - "It specifies the thread priority of the worker thread"
          - "It forces the deserializer to allocate memory on the stack instead of the heap"
        answer: 0
        why: |
          In C callback architectures, passing an opaque `void* owner_obj` context allows the callback function
          to retrieve its caller's instance data (such as the client context, socket descriptor, or service instance)
          without relying on dangerous global variables.
          Options B, C, and D state fictitious attributes.
        concept: "callback-context-pointer"

      - kind: trace
        q: "Trace the ring buffer search. If the buffer contains 'REQ1#ADD$REQ2#SUB', at what index is the message delimiter located?"
        code: |
          const char* buf = "REQ1#ADD$REQ2#SUB";
          char* p = strchr(buf, '$');
        trace:
          headers: ["Target Character", "Matched String", "Index of '$'"]
          rows:
            - step: 1
              line: 2
              cells: ["'$'", "REQ1#ADD$", "???"]
        target: {row: 0, col: 2}
        choices: ["4", "7", "8", "16"]
        answer: 2
        why: |
          Indexing: 'R'(0), 'E'(1), 'Q'(2), '1'(3), '#'(4), 'A'(5), 'D'(6), 'D'(7), '$'(8).
          The delimiter '$' is located at index 8.
          Option A is the index of '#'. Option B is 'D'. Option D is the end of the string.
        concept: "delimiter-index-trace"

      - kind: choose-better
        q: "Which callback architecture is superior for a multi-client server deserialization library?"
        choices:
          - |
            // Hardcoding a global handler function
            extern void global_request_handler(struct calc_proto_req_t req);
            void on_message(struct calc_proto_req_t req) {
              global_request_handler(req);
            }
          - |
            // Configurable callback function pointer with instance context pointer
            typedef void (*req_cb_t)(void* owner, struct calc_proto_req_t req);
            void calc_proto_ser_set_req_callback(calc_proto_ser_t* ser, req_cb_t cb);
        answer: 1
        why: |
          Option B enables loose coupling and multi-tenancy. Different server modules or unit tests can register
          custom callback handlers with their own distinct context pointers. Option A locks the library into a
          single hardcoded global function, making concurrent multi-session handling and unit testing impossible.
        concept: "callback-vs-global-choice"

  - id: b6
    type: model
    title: "Manage Unix Domain Stream Server Lifecycles and Multithreading"
    explain_md: |
      A Unix Domain Socket (UDS) stream server provides high-performance, single-host IPC using the filesystem
      as its namespace. Developing a robust UDS stream server in C demands a rigorous lifecycle sequence:

      1. **Socket Allocation**: `int server_sd = socket(AF_UNIX, SOCK_STREAM, 0)`.
      2. **Filesystem Cleanup**: `unlink(sock_file)`. When a UDS server binds to a path (e.g. `/tmp/calc.sock`),
         the OS creates a socket file inode. If the server restarts after a previous run, the file persists on disk.
         Calling `bind()` on an existing path fails with `EADDRINUSE`. The server must proactively `unlink()` the path.
      3. **Address Binding**: Initialize `struct sockaddr_un`, set `sun_family = AF_UNIX`, copy path into `sun_path`
         (max 108 bytes on Linux, null-terminated), and invoke `bind(server_sd, (struct sockaddr*)&addr, sizeof(addr))`.
      4. **Backlog Setup**: `listen(server_sd, backlog)`. Defines the kernel queue capacity for pending connection
         requests awaiting acceptance.
      5. **Acceptance Loop & Concurrency**: The server enters `accept_forever()`, invoking `int client_sd = accept(...)`.
         Because `accept()` and subsequent `read()` operations are blocking, a multi-client server spawns a dedicated
         worker thread (`pthread_create`) for each accepted client descriptor. The worker thread owns the `client_sd`,
         initializes a private `calc_proto_ser_t` and `calc_service_t`, and handles client requests until disconnection.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <string.h>
        #include <unistd.h>
        #include <sys/socket.h>
        #include <sys/un.h>

        int main(void) {
          const char* path = "/tmp/test_uds_lifecycle.sock";
          unlink(path);
          int sd = socket(AF_UNIX, SOCK_STREAM, 0);
          struct sockaddr_un addr;
          memset(&addr, 0, sizeof(addr));
          addr.sun_family = AF_UNIX;
          strncpy(addr.sun_path, path, sizeof(addr.sun_path) - 1);
          if (bind(sd, (struct sockaddr*)&addr, sizeof(addr)) == 0) {
            printf("UDS Bound: %s\n", path);
            listen(sd, 5);
          }
          close(sd);
          unlink(path);
          return 0;
        }
      run_expected: "UDS Bound: /tmp/test_uds_lifecycle.sock\n"
      subgoals:
        - label: "Unlink stale filesystem socket node"
          lines: [9]
        - label: "Create stream UDS descriptor"
          lines: [10]
        - label: "Configure sockaddr_un and bind"
          lines: [11, 12, 13, 14, 15]
        - label: "Clean up descriptor and socket file"
          lines: [19, 20]
    viz:
      kind: ascii-memory
      steps:
        - "STEP 1: socket(AF_UNIX, SOCK_STREAM) -> server_sd allocated in file descriptor table"
        - "STEP 2: unlink(/tmp/calc.sock) -> Deletes lingering socket inode from filesystem directory"
        - "STEP 3: bind() -> Inode created in /tmp/calc.sock linked to server_sd kernel struct"
        - "STEP 4: listen(server_sd, 10) -> Inbound connection queue initialized (capacity 10)"
        - "STEP 5: accept() -> Blocks until client connects; returns client_sd (handed off to pthread)"
    checks:
      - kind: spot-bug
        q: "Analyze the server initialization sequence. Which line causes bind() to fail with EADDRINUSE on process restart?"
        code: |
          #include <sys/socket.h>
          #include <sys/un.h>
          #include <string.h>

          int init_server(const char* path) {
            int sd = socket(AF_UNIX, SOCK_STREAM, 0);
            struct sockaddr_un addr;
            memset(&addr, 0, sizeof(addr));
            addr.sun_family = AF_UNIX;
            strncpy(addr.sun_path, path, sizeof(addr.sun_path) - 1);
            // Missing: unlink(path);
            if (bind(sd, (struct sockaddr*)&addr, sizeof(addr)) == -1) {
              return -1;
            }
            return sd;
          }
        diagnostic_log: |
          bind: Address already in use
        target_line: 11
        choices:
          - "Line 6: socket() must specify protocol 6 for Unix domain"
          - "Line 8: sun_family must be set to AF_INET"
          - "Line 11: Omitting unlink(path) leaves a pre-existing socket file in the filesystem, causing bind to fail with EADDRINUSE"
        answer: 2
        why: |
          When a UDS server terminates, the socket file node remains on the filesystem. A subsequent bind()
          call to that exact path will fail with EADDRINUSE unless unlink() is called first to delete the old node.
          Options A and B specify incorrect address families and protocols.
        concept: "uds-unlink-eaddrinuse-trap"

      - kind: why-fails
        q: "Why does passing a 120-character pathname to addr.sun_path trigger memory corruption or truncation?"
        choices:
          - "struct sockaddr_un has a fixed sun_path array of only 108 bytes on Linux (104 on BSD)"
          - "Unix domain sockets disallow paths containing more than 3 directory separators"
          - "The C standard forbids string constants longer than 64 characters in network code"
          - "socket() returns ENAMETOOLONG if the path is declared before bind()"
        answer: 0
        why: |
          The POSIX / Linux definition of struct sockaddr_un defines char sun_path[108]. Copying a 120-byte
          string into this array overflows the struct or truncates the path, causing bind() to attach to
          a corrupted filename. Options B, C, and D are false claims.
        concept: "sun-path-length-limit"

      - kind: predict
        q: "Trace thread allocation in accept_forever. If 3 clients connect simultaneously to a running server, how many total client handler threads are spawned?"
        code: |
          void accept_forever(int server_sd) {
            while (1) {
              int client_sd = accept(server_sd, NULL, NULL);
              pthread_t th;
              pthread_create(&th, NULL, client_handler, arg);
            }
          }
        choices:
          - "0 (all work runs in the main thread)"
          - "1 thread shared among all clients"
          - "6 threads (2 per client)"
          - "3 threads (exactly 1 dedicated thread per accepted client descriptor)"
        answer: 3
        why: |
          The server loops on accept(), spawning one dedicated pthread for each newly accepted client_sd.
          For 3 accepted clients, exactly 3 handler threads are created.
          Option A ignores pthread_create. Option B describes an event loop. Option C assumes dual threads.
        concept: "thread-per-client-trace"

      - kind: mcq
        q: "What is the purpose of passing an integer like 10 as the second argument to listen(server_sd, 10)?"
        choices:
          - "It limits the maximum lifetime of the server process to 10 minutes"
          - "It specifies the backlog queue size: the maximum number of completed incoming connections queued awaiting accept()"
          - "It restricts the server to accepting a total of 10 clients before terminating"
          - "It configures the socket to use 10 worker threads"
        answer: 1
        why: |
          The backlog argument configures the maximum length to which the queue of pending connections for
          server_sd may grow. If a connection request arrives when the queue is full, the client may receive
          an ECONNREFUSED error. Options A, C, and D are incorrect.
        concept: "listen-backlog-purpose"

      - kind: order
        q: "Order the system calls required to properly establish a listening Unix Domain stream server:"
        lines:
          - "unlink(sock_path);"
          - "listen(server_sd, backlog);"
          - "int server_sd = socket(AF_UNIX, SOCK_STREAM, 0);"
          - "accept(server_sd, NULL, NULL);"
          - "bind(server_sd, (struct sockaddr*)&addr, sizeof(addr));"
        answer_order: [2, 0, 4, 1, 3]
        why: |
          The standard stream server sequence is: 1. socket() creation, 2. unlink() existing path,
          3. bind() to sockaddr_un, 4. listen() with backlog, 5. accept() incoming clients.
        concept: "uds-server-sequence"

      - kind: trace
        q: "Trace descriptor lifecycle. When accept() returns client_sd = 5, what is the status of server_sd?"
        code: |
          int server_sd = socket(AF_UNIX, SOCK_STREAM, 0); // sd = 3
          bind(server_sd, ...);
          listen(server_sd, 5);
          int client_sd = accept(server_sd, NULL, NULL);   // client_sd = 5
        trace:
          headers: ["Descriptor", "Role", "Status after accept()"]
          rows:
            - step: 1
              line: 4
              cells: ["server_sd (3)", "Listener", "???"]
            - step: 2
              line: 4
              cells: ["client_sd (5)", "Connection", "Active two-way stream"]
        target: {row: 0, col: 2}
        choices:
          - "Remains open and actively listening for further connections"
          - "Automatically closed by the kernel upon first accept"
          - "Transformed into a client socket descriptor"
          - "Reset to 0"
        answer: 0
        why: |
          server_sd remains unchanged in listening mode to accept further connections. accept() returns
          a brand new socket descriptor (client_sd = 5) dedicated to the specific accepted client.
          Options B, C, and D represent common novice misconceptions about accept().
        concept: "listener-vs-client-descriptor"
  - id: b7
    type: syntax
    title: "Execute Stream Client Connections and Bidirectional I/O"
    explain_md: |
      The stream client initiates communication by following the connector sequence:
      1. Allocate client socket: `int conn_sd = socket(AF_UNIX, SOCK_STREAM, 0)`.
      2. Prepare destination address: populate `struct sockaddr_un` with target server path.
      3. Establish channel: `connect(conn_sd, (struct sockaddr*)&addr, sizeof(addr))`. When `connect()` returns 0,
         the kernel has established a dedicated full-duplex byte stream to the server.

      Once connected, the client interacts using standard POSIX I/O functions:
      - `write(conn_sd, buf, len)` pushes request bytes into the socket. Because `write()` may send fewer bytes than
        requested under network congestion or buffer pressure, robust implementations check the return value and loop
        if `ret < len`.
      - `read(conn_sd, buf, sz)` retrieves response bytes. In blocking mode, `read()` blocks until bytes arrive.
        Crucially, a return value of `0` indicates End-of-File (EOF), signaling that the server has closed its end.
        A return value of `-1` indicates an error (e.g. `ECONNRESET`).

      Graceful teardown uses `shutdown(conn_sd, SHUT_RD)` to stop inbound traffic and wake reader threads, followed by
      `calc_proto_ser_dtor()`, `pthread_join()`, and `close(conn_sd)`.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <string.h>
        #include <unistd.h>
        #include <sys/socket.h>

        int main(void) {
          int sv[2];
          socketpair(AF_UNIX, SOCK_STREAM, 0, sv);
          const char* msg = "PING$";
          write(sv[0], msg, strlen(msg));

          char reply[16] = {0};
          int n = read(sv[1], reply, sizeof(reply) - 1);
          if (n > 0) {
            printf("Received: %s\n", reply);
          }
          close(sv[0]);
          close(sv[1]);
          return 0;
        }
      run_expected: "Received: PING$\n"
      subgoals:
        - label: "Establish stream communication conduit"
          lines: [8, 9]
        - label: "Write request bytes to channel"
          lines: [10, 11]
        - label: "Read response bytes and verify non-zero count"
          lines: [13, 14, 15]
    checks:
      - kind: order
        q: "Order the operations executed by a Unix Domain stream client to connect, send a request, and disconnect:"
        lines:
          - "int conn_sd = socket(AF_UNIX, SOCK_STREAM, 0);"
          - "write(conn_sd, req_buf, req_len);"
          - "connect(conn_sd, (struct sockaddr*)&addr, sizeof(addr));"
          - "close(conn_sd);"
          - "listen(conn_sd, 5); // Distractor: clients never listen"
          - "read(conn_sd, resp_buf, sizeof(resp_buf));"
        answer_order: [0, 2, 1, 5, 3]
        distractor_why:
          "listen(conn_sd, 5); // Distractor: clients never listen": "Clients are connectors that call connect(); listen() is only valid for server listeners."
        why: |
          Stream client sequence: 1. socket() creation, 2. connect() to server endpoint, 3. write() request,
          4. read() response, 5. close() descriptor.
        concept: "stream-client-sequence"

      - kind: fillblank
        q: "Fill in the function call used by a stream client to establish a connection to a remote listener socket:"
        code: |
          int res = ___________(conn_sd, (struct sockaddr*)&addr, sizeof(addr));
        answer_text: "connect"
        why: |
          connect() initiates a connection on a socket to the address specified by addr. On success, it binds
          the descriptor to an active channel.
        concept: "connect-syscall"

      - kind: mcq
        q: "When reading from an active stream socket, what does a return value of 0 from read(sd, buf, len) signify?"
