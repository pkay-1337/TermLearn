  viz:
    kind: ascii-memory
    steps:
    - 'PROJECT LAYOUT: calcser (protocol, libcalcser.a) | calcsvc (service logic, libcalcsvc.a) | srvcore + clicore (common transport code, libsrvcore.a + libclicore.a)'
    - 'SERVER SKINS: unix/stream + unix/datagram + tcp + udp => unix_stream_calc_server, unix_datagram_calc_server, tcp_calc_server, udp_calc_server'
