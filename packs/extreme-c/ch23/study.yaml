  - kind: eipe
    level: core
    q: In one sentence, what does client_handler's use of read() with a socket descriptor demonstrate about the
      POSIX I/O API?
    choices:
    - That socket descriptors rank below file descriptors, so extra wrappers are needed before read() accepts them
    - That read, write, and close work uniformly over file descriptors and socket descriptors, because both name
      byte channels in the kernel's descriptor table
    - That reads on sockets clone the descriptor so both server and client can read concurrently
    - That the kernel translates read() on sockets into send(), attaching datagram headers
    answer: 1
    why: |
      The chapter highlights it twice around Code Boxes 20-19/20-20/20-22:
      read is "used to read chunks from the client" with a socket descriptor
      passed where a file descriptor would go, and both write and close on
      the same descriptors are ordinary - the differences between FDs and
      SDs stop where the I/O API begins, since both descriptor kinds refer to
      byte channels the same I/O functions handle identically. That is why
      the same srvcore code serves UDS and TCP alike.
      Options A, C, and D invent wrapping, cloning, and translation rules.
    concept: unified-io-api-sockets
  - kind: spot-bug
    level: advanced
    q: A refactored handler compiles and runs but every client ramps its service memory from stale values. Which
      line carries the defect?
    code: |
      void* client_handler(void *arg) {
        struct client_context_t context;
        context.addr = (struct client_addr_t*)malloc(sizeof(struct client_addr_t));
        context.addr->sd = *((int*)arg); free((int*)arg);
        context.ser = calc_proto_ser_new();
        calc_proto_ser_ctor(context.ser, &context, 256);
        calc_proto_ser_set_req_callback(context.ser, request_callback);
        context.svc = calc_service_new();
        calc_service_ctor(context.svc);
        /* Line 11: teardown hoisted above the serving loop */
        calc_service_dtor(context.svc);
        calc_service_delete(context.svc);
        while (1) {
          int ret = read(context.addr->sd, buffer, 128);
          if (ret == 0 || ret == -1) break;
          struct buffer_t buf;
          buf.data = buffer; buf.len = ret;
          calc_proto_ser_server_deserialize(context.ser, buf, NULL);
        }
        calc_proto_ser_dtor(context.ser); calc_proto_ser_delete(context.ser);
        free(context.addr);
        return NULL;
      }
    diagnostic_log: |
      Client reports: mem and ADDM behave as if the calculator memory resets
      on every request; service fields are garbage after the first call.
    target_line: 11
    choices:
    - "Line 11-12: the service is destroyed before the serving loop runs, so every callback afterward operates on a
      dead object - teardown must wait until after the read() loop breaks, as Code Box 20-19 orders it"
    - "Line 6: the serializer ring size must be 128 here, matching the client's constructor"
    - "Line 3: context.addr must be freed before any read, or the kernel leaks the descriptor"
    answer: 0
    why: |
      The chapter's client_handler creates the service (and serializer) in
      the thread's setup and destroys them only after the read loop breaks:
      calc_service_dtor/delete then calc_proto_ser_dtor/delete. Moving the
      service teardown above the loop leaves callbacks serving a destroyed
      object - undefined behavior that shows up as corrupt per-client state.
      The 128 ring size belongs to the client process, not the server (the
      server constructor uses 256 per Code Box 20-19), and freeing
      context.addr early abandons the descriptor the loop still needs.
