    choices:
    - Length-prefix framing; the 4-byte prefix must count the '$' and '#' bytes so receivers read whole messages
    - Finite-state machine framing; '#' and '$' must both encode state transitions that the kernel verifies per packet
    - Delimiter framing; the delimiter characters must be chosen wisely so they stay distinguishable from the actual message content
    - Fixed-length struct overlay; as long as every message is 21 bytes, the receiver can map bytes onto a C struct
