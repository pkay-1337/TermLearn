blocks:
  - id: b1
    type: model
    title: "Differentiate Push-Based Sockets from Pull-Based IPC Media"
    explain_md: |
      Inter-process communication (IPC) in Unix-like systems divides into two fundamental paradigms:
      pull-based media and push-based channels. In pull-based IPC (such as shared memory segments or memory-mapped
      files), processes share access to a passive storage medium. Writers mutate the medium, and readers must actively
      poll or synchronize access to retrieve new data, making the design susceptible to race conditions and cache
      coherency bottlenecks unless synchronized with explicit mutexes or semaphores.

      In push-based IPC, communication flows through an active kernel channel. Sockets are full-duplex, push-based
      channels. When a sending process executes `write()` on a socket descriptor, the kernel copies the payload into
      a kernel-space socket buffer. The kernel then immediately alerts the receiving process by waking any threads
      blocked on `read()` or waiting on polling monitors (`select`, `poll`, `epoll`).

      A socket descriptor is a specialized file descriptor representing a transient communication endpoint rather
      than a persistent storage file. Because a socket represents a stream or queue of data flowing through the kernel
      without a fixed physical storage footprint, it has no file offset. Consequently, file positioning operations
      such as `lseek(sd, offset, whence)` are meaningless and fail with `-1` and `errno = ESPIPE` ("Illegal seek").
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <unistd.h>
        #include <sys/socket.h>
        #include <errno.h>
        #include <string.h>

        int main(void) {
          int sv[2];
          if (socketpair(AF_UNIX, SOCK_STREAM, 0, sv) == -1) {
            perror("socketpair");
            return 1;
          }
          write(sv[0], "DATA", 4);
          off_t offset = lseek(sv[0], 0, SEEK_SET);
          if (offset == -1) {
            printf("lseek failed: %s\n", strerror(errno));
          }
          close(sv[0]);
          close(sv[1]);
          return 0;
        }
      run_expected: "lseek failed: Illegal seek\n"
      subgoals:
        - label: "Allocate bidirectional socket channel pair"
          lines: [8, 9, 10, 11, 12]
        - label: "Push data into kernel buffer"
          lines: [13]
        - label: "Demonstrate seek failure on channel descriptor"
          lines: [14, 15, 16, 17]
    viz:
      kind: ascii-memory
      steps:
        - "PULL-BASED IPC: Process A writes to Shared Memory -> Process B must poll/lock shared RAM medium"
        - "PUSH-BASED SOCKET: Process A write() -> Kernel Socket Buffer (inbound queue) -> Process B wakes on read()"
        - "NOTIONAL MACHINE: Socket Descriptor 3 -> Kernel struct socket -> [RX Queue | TX Queue] (No file offset)"
        - "SEEK ATTEMPT: lseek(sd, 0, SEEK_SET) -> Kernel detects socket type -> Returns -1, sets errno = ESPIPE"
    checks:
      - kind: predict
        q: "Trace the execution of this socketpair code. What text is printed to standard output?"
        code: |
          #include <stdio.h>
          #include <unistd.h>
          #include <sys/socket.h>

          int main(void) {
            int sv[2];
            socketpair(AF_UNIX, SOCK_STREAM, 0, sv);
            write(sv[1], "HELLO", 5);
            char buf[8] = {0};
            read(sv[0], buf, sizeof(buf) - 1);
            printf("%s\n", buf);
            close(sv[0]); close(sv[1]);
            return 0;
          }
        choices:
          - "HELLOHELLO"
          - "0"
          - "HELLO"
          - "Empty output (read blocks indefinitely)"
        answer: 2
        why: |
          Writing to socket descriptor sv[1] pushes the bytes into the kernel's intermediate buffer.
          Reading from the paired descriptor sv[0] pulls those 5 bytes out into buf, printing HELLO.
          Option A assumes loopback reflection. Option B outputs a status code. Option D assumes deadlocking.
        concept: "socketpair-data-flow"

      - kind: mcq
        q: "Why does the operating system return an ESPIPE error when a program calls lseek() on a socket descriptor?"
        choices:
          - "The socket buffer size exceeds the maximum allowable block offset"
          - "Socket operations require elevated CAP_SYS_ADMIN privileges"
          - "Sockets use UDP framing which prohibits random access"
          - "Sockets represent continuous stream channels without an addressable storage file offset"
        answer: 3
        why: |
          A socket descriptor represents a communication channel rather than an indexed file on a block device.
          Because data in a channel is consumed as it is read, there is no underlying persistent file offset to seek.
          Options A, B, and C state incorrect or irrelevant limitations.
        concept: "socket-no-seek-principle"

      - kind: why-fails
        q: "Why does the following code trigger an assertion failure or print an error when executed?"
        code: |
          #include <stdio.h>
          #include <unistd.h>
          #include <sys/socket.h>
          #include <errno.h>

          int main(void) {
            int sv[2];
            socketpair(AF_UNIX, SOCK_STREAM, 0, sv);
            write(sv[0], "PING", 4);
            if (lseek(sv[0], 0, SEEK_CUR) >= 0) {
              printf("Seek succeeded!\n");
            } else {
              printf("Seek failed with error code %d\n", errno);
            }
            return 0;
          }
        choices:
          - "socketpair() can only be created between processes with different PIDs"
          - "lseek() fails with ESPIPE because socket descriptors do not maintain a seekable file position"
          - "sv[0] was opened in read-only mode by socketpair"
          - "The kernel buffer was full after writing 4 bytes"
        answer: 1
        why: |
          POSIX mandates that lseek() on any socket descriptor fails with ESPIPE (Illegal seek). Sockets are
          unidirectional or bidirectional data conduits, not disk files with addressable byte indices.
          Options A, C, and D are false claims about socketpair and descriptor properties.
        concept: "lseek-on-socket-failure"

      - kind: spot-bug
        q: "Analyze the code and error output. Which line causes the program to fail to read data from the peer?"
        code: |
          #include <stdio.h>
          #include <unistd.h>
          #include <sys/socket.h>

          int main(void) {
            int sv[2];
            socketpair(AF_UNIX, SOCK_STREAM, 0, sv);
            write(sv[0], "DATA", 4);
            char buf[8] = {0};
            // Line 10: Attempting to read from the writing endpoint!
            read(sv[0], buf, sizeof(buf));
            printf("%s\n", buf);
            return 0;
          }
        diagnostic_log: |
          Process hung: blocked on read() at line 10
        target_line: 10
        choices:
          - "Line 10: Reading from sv[0] blocks because data written to sv[0] is queued for the counterpart sv[1]"
          - "Line 7: socketpair requires SOCK_DGRAM rather than SOCK_STREAM"
          - "Line 8: write() requires 5 bytes to include the null terminator"
        answer: 0
        why: |
          In a socket pair, data written to descriptor sv[0] is directed to sv[1]'s receive queue, and data written
          to sv[1] is directed to sv[0]'s receive queue. Reading from the same descriptor that performed the write
          will block indefinitely awaiting incoming data from the peer.
          Options B and C do not cause the thread to hang on read().
        concept: "socketpair-endpoint-direction"

      - kind: choose-better
        q: "Which communication pattern is better suited for low-latency, event-driven messaging between two cooperative processes on the same machine?"
        choices:
          - |
            // Polling a shared memory region inside a busy-wait loop
            while (!shm->data_ready) {
              usleep(100);
            }
            process_data(shm->buffer);
          - |
            // Reading from a push-based Unix domain socket channel
            char buf[128];
            int n = read(socket_fd, buf, sizeof(buf));
            if (n > 0) process_data(buf, n);
        answer: 1
        why: |
          Push-based sockets allow the operating system kernel to put the receiving process to sleep until
          data is placed into the socket buffer, waking it instantaneously with zero wasted CPU cycles.
          Option A wastes CPU cycles in sleep-polling loops and suffers from latency granularity delays.
        concept: "push-vs-pull-choice"

      - kind: trace
        q: "Trace the status of the kernel socket buffer across execution steps. What is the byte count in sv[1]'s RX buffer after Step 3?"
        code: |
          int sv[2];
          socketpair(AF_UNIX, SOCK_STREAM, 0, sv); // Step 1
          write(sv[0], "ALPHA", 5);                 // Step 2
          write(sv[0], "BETA", 4);                  // Step 3
        trace:
          headers: ["Step", "Line", "Operation", "Target RX Buffer", "Bytes Queued"]
          rows:
            - step: 1
              line: 2
              cells: ["1", "2", "socketpair()", "sv[1] RX", "0"]
            - step: 2
              line: 3
              cells: ["2", "3", "write(sv[0], 'ALPHA', 5)", "sv[1] RX", "5"]
            - step: 3
              line: 4
              cells: ["3", "4", "write(sv[0], 'BETA', 4)", "sv[1] RX", "???"]
        target: {row: 2, col: 4}
        choices: ["4", "5", "9", "0"]
        answer: 2
        why: |
          Sequential writes to sv[0] append bytes directly to sv[1]'s inbound kernel queue.
          After writing 5 bytes ("ALPHA") and 4 bytes ("BETA"), the total bytes queued in the stream buffer is 5 + 4 = 9.
          Option A only counts the second write. Option B only counts the first write. Option D assumes overwriting.
        concept: "kernel-buffer-accumulation"

  - id: b2
    type: model
    title: "Distinguish Stream Byte Sequences from Datagram Message Boundaries"
    explain_md: |
      POSIX sockets provide two primary channel semantics: stream channels (`SOCK_STREAM`) and datagram
      channels (`SOCK_DGRAM`). Understanding the difference in data delivery semantics is vital for network
      programming.

      A stream socket provides a continuous, ordered, two-way byte stream without message boundaries. The kernel
      treats data written to a stream socket as an unstructured sequence of bytes. A sender may make two consecutive
      calls: `write(sd, "REQ1", 4)` and `write(sd, "REQ2", 4)`. The receiver calling `read(sd, buf, sizeof(buf))`
      may receive all 8 bytes in a single read (`"REQ1REQ2"`), or receive 2 bytes (`"RE"`), or any arbitrary chunk
      depending on kernel buffer availability, TCP segment slicing, and timing. Therefore, stream protocols
      MUST implement application-level framing (such as fixed-length headers, length prefixes, or delimiters like `$`)
      to reassemble discrete messages.

      In contrast, a datagram socket transmits self-contained, discrete messages where message boundaries are
      strictly preserved by the kernel. Each `sendto()` generates an atomic datagram. When the receiver calls
      `recvfrom()`, it receives exactly one datagram in its entirety. If the receiver's buffer is smaller than the
      incoming datagram, the excess bytes are discarded (or an error flag is set). Datagrams are connectionless,
      meaning each packet must carry destination addressing information.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <string.h>

        int main(void) {
          const char* stream = "101#ADD#2#3$102#SUB#5#1$";
          char buf[32];
          const char* start = stream;
          const char* delim;
          while ((delim = strchr(start, '$')) != NULL) {
            size_t len = delim - start;
            strncpy(buf, start, len);
            buf[len] = '\0';
            printf("Frame: %s\n", buf);
            start = delim + 1;
          }
          return 0;
        }
      run_expected: "Frame: 101#ADD#2#3\nFrame: 102#SUB#5#1\n"
      subgoals:
        - label: "Simulate coalesced stream buffer input"
          lines: [5]
        - label: "Scan for message delimiter"
          lines: [9]
        - label: "Extract delimited message frame"
          lines: [10, 11, 12, 13]
    viz:
      kind: ascii-memory
      steps:
        - "STREAM (SOCK_STREAM): Write('AAA') + Write('BBB') -> Kernel Stream: [A|A|A|B|B|B] (No boundaries!)"
        - "STREAM READ: Read(2)->'AA', Read(3)->'AB', Read(1)->'B' (Boundary detection requires delimiter '$')"
        - "DATAGRAM (SOCK_DGRAM): Send('AAA') -> Packet 1 [AAA] | Send('BBB') -> Packet 2 [BBB]"
        - "DATAGRAM READ: Recv()->'AAA' (Packet 1 exactly), Next Recv()->'BBB' (Packet 2 exactly)"
    checks:
      - kind: predict
        q: "Trace how the loop extracts frames from the continuous byte string. What is the first printed line?"
        code: |
          #include <stdio.h>
          #include <string.h>

          int main(void) {
            const char* data = "CMD1$CMD2$";
            const char* p = strchr(data, '$');
            if (p) {
              char out[16] = {0};
              strncpy(out, data, p - data);
              printf("Parsed: %s\n", out);
            }
            return 0;
          }
        choices:
          - "Parsed: CMD1"
          - "Parsed: CMD1$CMD2$"
          - "Parsed: CMD2"
          - "Parsed: $"
        answer: 0
        why: |
          strchr finds the first occurrence of '$' at index 4. strncpy copies 4 bytes ('C', 'M', 'D', '1'),
          producing "Parsed: CMD1".
          Option B assumes the delimiter is ignored. Option C grabs the second frame. Option D is the delimiter itself.
        concept: "stream-delimiter-parsing"

      - kind: mcq
        q: "Why must applications running over SOCK_STREAM implement an explicit message delimiting or framing mechanism?"
        choices:
          - "Stream sockets do not encrypt packet payloads by default"
          - "Stream sockets transmit continuous byte streams without preserving application-level message boundaries"
          - "Stream sockets restrict individual read operations to exactly 1 byte"
          - "The kernel drops all stream packets that do not include a cyclic redundancy check"
        answer: 1
        why: |
          In SOCK_STREAM (TCP or UDS stream), data is sent and received as an undifferentiated stream of bytes.
          A single write may be split across multiple reads, or multiple writes may be combined into one read.
          Applications must delineate messages using length prefixes or delimiters.
          Options A, C, and D describe false technical constraints.
        concept: "stream-framing-necessity"

      - kind: why-fails
        q: "Why does relying on fixed-size read(sd, buf, 64) fail unpredictably in a network stream server?"
        choices:
          - "The C standard library forbids buffers larger than 32 bytes"
          - "The kernel automatically closes socket descriptors when reading fewer than 64 bytes"
          - "TCP connections disallow reading fixed buffers unless the port is below 1024"
          - "Network fragmentation and packet timing mean read() may return fewer than 64 bytes even when more are in transit"
        answer: 3
        why: |
          read() on a stream socket returns whatever bytes are currently available in the kernel buffer up to the
          requested size. It does not wait for 64 bytes to arrive unless specially configured with MSG_WAITALL.
          Parsing incomplete chunks as complete 64-byte messages causes data corruption.
          Options A, B, and C are completely fictitious rules.
        concept: "partial-read-hazard"

      - kind: eipe
        q: "In one sentence, what is the fundamental purpose of appending a delimiter character (like '$') to wire messages on a stream socket?"
        choices:
          - "It tells the network card hardware to flush its hardware FIFO buffers immediately"
          - "It escapes null characters so ASCII strings can be transmitted over 7-bit serial lines"
          - "It establishes unambiguous message boundaries so the receiver can isolate discrete records from an unstructured byte stream"
          - "It verifies that the sender has superuser privileges to write to the socket"
        answer: 2
        why: |
          Because stream channels provide continuous byte sequences with no record boundaries, a delimiter
          character serves as an application-level frame marker, enabling the receiving parser to slice
          individual messages. Options A, B, and D cite irrelevant or fictitious mechanisms.
        concept: "delimiter-purpose"

      - kind: fillblank
        q: "Fill in the socket type constant that creates an ordered, reliable, connection-oriented byte stream:"
        code: |
          int sd = socket(AF_UNIX, ___________, 0);
        answer_text: "SOCK_STREAM"
        why: |
          SOCK_STREAM designates a connection-oriented, sequenced byte stream socket. SOCK_DGRAM designates
          a connectionless, record-oriented datagram socket.
        concept: "sock-stream-type-constant"

      - kind: trace
        q: "Trace message boundary behavior on a datagram socket. If a sender transmits two 10-byte packets, what is the return value of the first recvfrom() call with a 64-byte buffer?"
        code: |
          // Sender:
          sendto(sd, "0123456789", 10, 0, (struct sockaddr*)&srv, len);
          sendto(sd, "ABCDEFGHIJ", 10, 0, (struct sockaddr*)&srv, len);

          // Receiver:
          char buf[64];
          int n = recvfrom(sd, buf, sizeof(buf), 0, NULL, NULL);
        trace:
          headers: ["Call", "Buffer Size", "Bytes Transmitted in Packet", "recvfrom() Return Value"]
          rows:
            - step: 1
              line: 6
              cells: ["recvfrom() #1", "64", "10", "???"]
        target: {row: 0, col: 3}
        choices: ["20", "10", "64", "-1"]
        answer: 1
        why: |
          Datagram sockets preserve discrete message boundaries. Even though the receiver provides a 64-byte buffer
          and a second packet is already pending in the kernel, each recvfrom() returns exactly one datagram (10 bytes).
          Option A assumes stream coalescence. Option C confuses buffer capacity with returned count.
        concept: "datagram-boundary-preservation"

  - id: b3
    type: design
    title: "Decouple Core Business Logic from Network Transport"
    explain_md: |
      A paramount principle of enterprise C architecture is the separation of business logic from communication
      and transport mechanisms. In the calculator project, the core arithmetic service (`calc_service_t`) is
      completely isolated from sockets, network headers, and serialization formats.

      The calculator service interface defines pure computational operations (`add`, `sub`, `mul`, `div`) accepting
      standard C primitive types (`double`, `int`). It has zero dependencies on POSIX socket headers (`sys/socket.h`),
      file descriptors, or wire protocols. This decoupling allows the service to be unit-tested in isolation, reused in
      monolithic embedded environments without networking, or deployed behind any transport mechanism (UDS stream, UDS
      datagram, TCP, UDP, or HTTP).

      Furthermore, service architectures must account for statefulness. In the calculator project, the service
      features an internal memory accumulator (`get_mem`, `reset_mem`, `ADDM`, `SUBM`, `MULM`). Because each connected
      client expects its own independent calculator memory, the server cannot share a single global service object
      across all connections. Instead, the server instantiates a dedicated, stateful `calc_service_t` instance for each
      client session, encapsulating client state and preventing cross-client data contamination.
    example:
      lang: c
      code: |
        #include <stdio.h>
        #include <stdlib.h>

        typedef struct {
          double mem;
        } calc_service_t;

        calc_service_t* calc_service_new(void) {
          calc_service_t* svc = (calc_service_t*)malloc(sizeof(calc_service_t));
          if (svc) svc->mem = 0.0;
          return svc;
        }

        double calc_service_add(calc_service_t* svc, double a, double b, int use_mem) {
          double res = a + b + (use_mem ? svc->mem : 0.0);
          if (use_mem) svc->mem = res;
          return res;
        }

        int main(void) {
          calc_service_t* svc = calc_service_new();
          printf("Res1: %.1f\n", calc_service_add(svc, 10.0, 5.0, 1));
          printf("Res2: %.1f\n", calc_service_add(svc, 2.0, 3.0, 1));
          free(svc);
          return 0;
        }
      run_expected: "Res1: 15.0\nRes2: 20.0\n"
      subgoals:
        - label: "Define encapsulated stateful service struct"
          lines: [4, 5, 6]
        - label: "Construct and zero accumulator state"
          lines: [8, 9, 10, 11, 12]
        - label: "Execute state-dependent business calculation"
          lines: [14, 15, 16, 17, 18]
    checks:
      - kind: mcq
        q: "Why must the server allocate an independent calc_service_t instance for each connected client rather than using a single shared global instance?"
        choices:
          - "The C compiler refuses to link functions that reference global structs across threads"
          - "Operating systems restrict global memory access to file descriptor 0"
          - "The calculator service is stateful, maintaining an accumulator memory that must remain private to each client"
          - "Shared structs trigger SIGSEGV whenever accessed by non-root threads"
        answer: 2
        why: |
          The service supports accumulator memory operations (+M, -M, mem). If a single global service instance
          were shared across all clients, one client's calculations would overwrite another client's accumulator,
          causing race conditions and data corruption.
          Options A, B, and D cite fictitious compiler and OS constraints.
        concept: "stateful-service-isolation"

      - kind: eipe
        q: "In one sentence, what is the architectural benefit of keeping calc_service_t completely independent of socket descriptors and network headers?"
        choices:
          - "It isolates the computational domain logic so it can be tested in isolation and reused across any transport protocol"
          - "It converts all floating-point math into hardware GPU assembly instructions"
          - "It eliminates the need for dynamic memory allocation via malloc"
          - "It enables the compiler to automatically convert blocking sockets into asynchronous event loops"
        answer: 0
        why: |
          Separating business logic from transport protocols adheres to the Single Responsibility Principle,
          allowing the arithmetic engine to be compiled as a standalone static library (`libcalcsvc.a`),
          thoroughly unit-tested without network harnesses, and plugged into UDS, TCP, or UDP servers.
          Options B, C, and D describe impossible compiler optimizations.
        concept: "transport-decoupling-purpose"

      - kind: choose-better
        q: "Which architecture better supports testability and multi-transport flexibility for a network calculation daemon?"
        choices:
          - |
            // Mixing socket I/O directly into arithmetic functions
            void handle_client(int sd) {
              char buf[64];
              read(sd, buf, 64);
              double a, b;
              sscanf(buf, "%lf %lf", &a, &b);
              double sum = a + b;
              dprintf(sd, "%lf\n", sum);
            }
          - |
            // Separating transport, serialization, and domain service into layers
            void handle_client(int sd, calc_service_t* svc) {
              calc_proto_req_t req;
              if (read_and_deserialize(sd, &req) == 0) {
                calc_proto_resp_t resp = execute_service(svc, &req);
                serialize_and_write(sd, &resp);
              }
            }
        answer: 1
        why: |
          Option B separates transport I/O, protocol serialization, and core business computation into discrete,
          composable layers. This allows swapping socket types, changing wire formats, or testing arithmetic
          logic without spinning up network sockets. Option A tightly couples I/O, parsing, and arithmetic.
        concept: "layered-architecture-choice"

      - kind: why-fails
        q: "Why does the following divide operation fail to provide safe service semantics in a network server?"
        code: |
          int calc_service_div(calc_service_t* svc, double a, double b, double* out) {
            // Missing divisor guard!
            *out = a / b;
            return 0;
          }
        choices:
          - "Pointers to double are not allowed as function return parameters in C99"
          - "Dividing floating point numbers in user space requires kernel elevation"
          - "calc_service_t cannot execute division while holding an active accumulator"
          - "When b is 0.0, the function produces +/-INFINITY or NaN without notifying the caller via an error code"
        answer: 3
        why: |
          A robust domain service must check for boundary failures (such as division by zero: `if (b == 0.0)`).
          Without this check, the service returns 0 (success) while writing infinity or NaN, preventing the server
          from sending a proper `STATUS_DIV_BY_ZERO` response code to the client.
          Options A, B, and C state fictitious language limitations.
        concept: "division-by-zero-error-handling"

      - kind: predict
        q: "Trace the state of accumulator memory across operations. What is the value printed by the final printf?"
        code: |
          calc_service_t* svc = calc_service_new();
          calc_service_add(svc, 4.0, 6.0, 1); // mem becomes 10.0
          calc_service_add(svc, 5.0, 5.0, 0); // use_mem = 0, returns 10.0, mem untouched
          calc_service_add(svc, 1.0, 2.0, 1); // uses mem (10.0), res = 1.0 + 2.0 + 10.0 = 13.0
          printf("%.1f\n", calc_service_get_mem(svc));
          free(svc);
        choices:
          - "10.0"
          - "13.0"
          - "3.0"
          - "0.0"
        answer: 1
        why: |
          The first call sets mem to 4.0 + 6.0 = 10.0. The second call does not use or update mem.
          The third call adds 1.0 + 2.0 + 10.0 = 13.0 and updates mem to 13.0. Thus get_mem returns 13.0.
          Option A misses the third update. Option C ignores the memory term. Option D assumes reset.
        concept: "service-memory-state-trace"

      - kind: mcq
        from_chapter: ch10
        from_block: b2
        q: "In C object-oriented architecture, why is the relationship between the server's client context and calc_service_t classified as composition rather than aggregation?"
        choices:
          - "The client context creates calc_service_t in its constructor and exclusively destroys it when the client disconnects"
          - "The calculator service is declared as a static global singleton shared across all contexts"
          - "The client context receives a non-owning pointer from an external dependency injector"
          - "Composition requires all struct fields to be declared as void* pointers"
        answer: 0
        why: |
          In composition, the container object exclusively owns the lifecycle of the contained object:
          it allocates the child in constructor/setup and frees it in destructor/teardown. In aggregation,
          the container references an object whose lifecycle is managed externally.
          Options B, C, and D describe aggregation, global singletons, or false syntax rules.
        concept: "interleaved-composition-ownership"

  - id: b4
    type: syntax
    title: "Structure Application Wire Protocols and Message Framing"
    explain_md: |
      Network and IPC transports require an explicit wire protocol contract so distributed processes can interpret
      each other's messages. In the calculator project, the wire protocol is textual and variable-length:
      - Field delimiter: `#` (separates individual attributes within a record).
      - Message terminator: `$` (signals the definitive end of an entire message frame).

      A client request is represented in C by `struct calc_proto_req_t`, containing `id` (`int32_t`), `method`
      (`method_t` enum: `ADD`, `SUB`, `MUL`, `DIV`, etc.), `operand1` (`double`), and `operand2` (`double`).
      When serialized over the wire, it formats as: `<id>#<method>#<op1>#<op2>$`
      (e.g., `1000#ADD#1.5#5.6$`).

      A server response is represented in C by `struct calc_proto_resp_t`, containing `req_id` (`int32_t`),
      `status` (`status_t`: `0=STATUS_OK`, `1=STATUS_INVALID_REQUEST`, `4=STATUS_DIV_BY_ZERO`, etc.), and
      `result` (`double`). On the wire, it formats as: `<req_id>#<status>#<result>$`
      (e.g., `1000#0#7.1$`).

      Using printable ASCII characters and explicit delimiters makes the protocol easily human-debuggable via
