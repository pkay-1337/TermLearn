  - kind: mcq
    level: intro
    q: The service interface declares `calc_service_add`, `calc_service_sub`, and `calc_service_mul` as functions returning `double` with a final `bool_t mem` parameter, and `calc_service_div` as returning an `int` error code with a `double*` result parameter. Which declaration set matches that interface?
