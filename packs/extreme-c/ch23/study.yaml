# single-concept study blocks for Chapter 20 — Socket Programming (ch23)
# rewritten: book-faithful, verbatim examples only, ch22 interleaved refs
blocks:
- id: b1
  type: model
  title: Classify Socket Programming Inside the Push-Based IPC Family
  explain_md: |
    The chapter opens with a **review** of socket programming, and the review is
    itself a load-bearing mental model — read it as the contract the rest of the
    chapter builds on.

    **Where sockets sit in the IPC taxonomy.** There are two categories of IPC
    techniques: **pull-based** techniques demand an accessible medium (a shared
    memory or a regular file) that processes write to and read from, while
    **push-based** techniques demand a *channel* that is "accessible by all
    processes". Data is what differs: in pull-based techniques data must be
    pulled from the medium, but in push-based techniques data is pushed or
    delivered to the reader automatically. Socket programming belongs to the
    **push-based** category — *all* socket-based IPC is push-based.

    **The blocking note.** Pushed data always arrives in a buffer *inside the
    kernel*, reachable through a descriptor. The receiver can either **block**
    until new data appears on that descriptor or **poll** it without blocking;
    the chapter fixes one setting: *in this chapter all push-based techniques
    use the blocking approach*.

    **What makes socket programming special among push techniques.** Sockets
    are special objects — they exist in Unix-like systems and even in
    Microsoft Windows — that represent **two-way channels**: a *single* socket
    object can be used to both read from and write to the same channel, so two
    processes on the two sides of one channel can talk in both directions.

    **Socket descriptor versus file descriptor.** Sockets are represented by
    socket descriptors just as files are represented by file descriptors, and
    the two are similar in some ways (I/O operations, being poll-able) — but
    they are different in kind: a single **socket descriptor always represents
    a channel**, whereas a file descriptor can represent a *medium* (a regular
    file) **or** a channel (a POSIX pipe). Therefore operations related to
    files, **such as seek, are not supported for socket descriptors — and even
    for a file descriptor when that descriptor represents a channel**.

    **Channels come in two flavors.** Socket-based communication is either
    **connection-oriented** (the channel represents a *stream of bytes*
    transmitted between two specific processes) or **connection-less**
    (*datagrams* travel along the channel with **no specific connection**
    between two processes — many processes can share the same channel). Hence
    the two channel types: **stream channels** and **datagram channels**; in a
    program each stream channel is represented by a **stream socket** and each
    datagram channel by a **datagram socket**, and *deciding stream or
    datagram is part of setting the channel up*.

    **The four varieties.** Sockets come in two general kinds: **UDS** (usable
    only when all participating processes live on **one machine**) and
    **network sockets** (usable in almost any deployment — same machine or
    across a network). Both kinds can carry either channel kind, giving four
    varieties: UDS stream, UDS datagram, network stream, network datagram. For
    a single-host deployment **UDS are preferred because they are faster and
    have less overhead** than network sockets. A network stream socket is
    *usually* called a **TCP socket** and a network datagram socket a **UDP
    socket** — names borrowed from the transport protocol underneath; UDS
    sockets get **no such names** because there is no underlying transport
    protocol.
  viz:
    kind: ascii-memory
    steps:
    - 'TAXONOMY: IPC techniques split into pull-based (needs a medium) and push-based (needs a channel) - sockets are push-based'
    - 'BLOCKING RULE: pushed bytes land in a kernel buffer behind a descriptor; this chapter uses blocking I/O only (no polling)'
    - 'SD vs FD: file descriptor = medium (file) OR channel (pipe); socket descriptor = ALWAYS a channel -> seek-style file ops do not apply'
    - 'CHANNELS: connection-oriented => stream channel <=> stream socket; connection-less => datagram channel <=> datagram socket'
    - 'VARIETIES MATRIX: (UDS | network) x (stream | datagram) = 4 kinds the calculator project must all support'
    - 'NAMING: network+stream ~ TCP socket, network+datagram ~ UDP socket; UDS gets no protocol name (no transport underneath)'
  checks:
  - kind: why-fails
    level: intro
    q: The calculator client pushes a request over its channel, but the calculator server process is not up yet,
      so the request never arrives. Why does the same request written into a shared regular file survive this scenario?
    choices:
    - Push-based delivery only works when the receiver is a child of the sender, and the server was spawned independently
    - Push-based messages are handed to the receiver through a kernel buffer that belongs to the receiving process while
      it runs; a receiver that is down at delivery time forfeits the message
    - Files push messages too, but regular files queue them with a higher priority, so kernels never drop them
    - The channel destroyed itself after the push timeout, and files have no push timeout to expire
    answer: 1
    why: |
      Push-based techniques deliver messages to the receiver end automatically,
      which requires the receiver to exist: its kernel-side buffer is where the
      pushed message lands. The chapter states the consequence directly — in
      push-based IPC the receiver must be up and running at delivery time, and
      if it is down the incoming message may be lost. Pull-based media (file,
      shared memory) keep the stored bytes regardless, so a late-starting
      reader still finds the request waiting in the medium.
      Options A, C, and D invent existence, priority, and timeout rules the
      chapter never states.
    concept: push-delivery-needs-live-receiver
  - kind: eipe
    level: intro
    q: In one sentence, what property of sockets separates them from the other push-based IPC techniques of the
      previous chapter (signals, pipes, message queues)?
    choices:
    - A single socket object represents a two-way channel, so one object serves both reading and writing on the same
      channel
    - Sockets move data without a kernel buffer, using memory that both processes share directly
    - Sockets never block, which lets processes exchange messages while continuing to run
    - Sockets guarantee delivery even when the receiving process has already exited
    answer: 0
    why: |
      The chapter's defining sentence is that sockets are special objects that
      represent two-way channels: a single socket object can be used to both
      read from and write to the same channel, giving the two processes at its
      two ends two-way communication. Signals, pipes, and message queues from
      the previous chapter need two objects (or two channel instances,
      bidirectional communication = two instances) to talk both ways.
      Options B, C, and D contradict the kernel-buffer, blocking, and
      delivery-fate rules of push-based IPC.
    concept: socket-object-two-way-channel
  - kind: mcq
    level: core
    q: Which statement about socket descriptors (SDs) versus file descriptors (FDs) matches the chapter's review?
    choices:
    - An FD can stand for a medium (a regular file) or for a channel (a POSIX pipe), while a socket descriptor always
      stands for a channel
    - A socket descriptor can be re-pointed at a regular file with dup2, because the two kinds are interchangeable
    - Seek-type file operations work on socket descriptors but not on file descriptors tied to pipes
    - FDs and SDs are different objects, so read() and write() must be called with different signatures on each
    answer: 0
    why: |
      Socket descriptors and file descriptors are similar in some ways — I/O
      operations and being poll-able — but they are genuinely different: a file
      descriptor can represent a medium such as a regular file, or a channel
      such as a POSIX pipe, while a socket descriptor always represents a
      channel. That is why certain file operations, such as seek, are not
      supported for socket descriptors — and this is also true for a file
      descriptor when it represents a channel. Option B invents re-pointing;
      option C reverses the real rule; option D is contradicted by the shared
      I/O API the same chapter relies on.
    concept: sd-versus-fd-reach
  - kind: trace
    level: core
    q: Complete the four-variety identification table by filling the target cell for the UDS datagram variety.
    code: |
      variety              channel kind        transport name
      ----------------------------------------------------
      UDS stream           stream              ???
      UDS datagram         datagram            ???
      network stream       stream              TCP (usually)
      network datagram     datagram            UDP (usually)
    trace:
      headers:
      - Variety
      - Socket type
      - Transport name
      rows:
      - - UDS stream
        - SOCK_STREAM
        - ???
      - - UDS datagram
        - SOCK_DGRAM
        - ???
      - - network stream
        - SOCK_STREAM
        - TCP (usually)
      - - network datagram
        - SOCK_DGRAM
        - UDP (usually)
    target:
      row: 1
      col: 2
    choices:
    - UDP over the kernel transport, named because UDS datagrams hop through the network layer
    - No specific name, because there is no underlying transport protocol for UDS
    - Unix Datagram Protocol (UDTP), the kernel's internal name for AF_UNIX datagrams
    - The same as the network variety, TCP, since transport naming follows the channel kind rather than the family
    answer: 1
    why: |
      The chapter states that a network stream socket is usually a TCP socket
      and a network datagram socket is usually a UDP socket, because most of
      the time those transports sit underneath. UDS sockets offering stream or
      datagram channels have no specific names at all — there is no underlying
      transport protocol. That applies to both UDS varieties, including the
      datagram one.
      Options A, C, and D invent kernel-internal transport names and rule.
    concept: four-variety-naming-matrix
  - kind: choose-better
    level: core
    q: The calculator client and server will both run on one Linux host over which you also have SSH access for
      remote testing. Which socket variety should the deployment prefer, and why does the chapter rank it this way?
    choices:
    - |
      /* network (TCP) sockets - uniformly usable, so pick them even for one host */
      int sd = socket(AF_INET, SOCK_STREAM, 0);
    - |
      /* UDS - all processes on one machine, so the chapter prefers it: faster, less overhead */
      int sd = socket(AF_UNIX, SOCK_STREAM, 0);
    answer: 1
    why: |
      The review says network sockets can be used in almost any deployment —
      all processes on the same machine or distributed across a network — but
      in the single-host case, UDS are preferred because they are faster and
      have less overhead in comparison to network sockets. The project supports
      both precisely so the same code can serve either deployment.
      Option A wastes the single-host advantage; the port/address machinery of
      network sockets buys nothing for two processes on one host.
    concept: single-host-prefers-uds

- id: b2
  type: design
  title: Architect the Calculator Project Hierarchy and Reusable Libraries
  explain_md: |
    The chapter deliberately runs sockets through a **real client-server
    project** — the calculator — and the section exists because "it is a
    lengthy example" needing grounding: a firm grasp of the project's shape
    before any socket call is shown.

    **Four project goals** the book states for the example:

    - **Observe a fully functional example** with simple, well-defined
      functionalities.
    - **Extract the common parts** among the various socket and channel types
      into *reusable libraries* — this significantly reduces the code written
      and, pedagogically, shows the *boundaries common* between socket and
      channel types.
    - **Maintain communication through a well-defined application protocol** —
      "ordinary socket programming examples lack this very important feature";
      they usually show one-time communication only.
    - **Hold every ingredient of a fully functional client-server program** —
      an application protocol, support for various channel types, a
      serializer/deserializer, and more.

    **Source hierarchy** — each part gets its own directory, and the common
    parts become static libraries:

    - `/calcser` — the **serializer/deserializer library** containing
      serialization-related sources; it *dictates the application protocol*
      between client and server and builds into **libcalcser.a**.
    - `/calcsvc` — the **calculation service**: the core functionality of the
      calculator, *different from the server process*. It is agnostic about
      being behind a server and usable as a standalone C library; builds into
      **libcalcsvc.a**.
    - `/server/srvcore` — sources **common between the stream and datagram
      server processes regardless of socket type**; every server process
      (UDS or network, stream or datagram) relies on it; builds into
      **libsrvcore.a**.
    - `/client/clicore` — the mirrored **common part for all client
      processes** regardless of socket type; builds into **libclicore.a**.
    - Four server executables: `/server/unix/stream` → *unix_stream_calc_server*,
      `/server/unix/datagram` → *unix_datagram_calc_server*, `/server/tcp` →
      *tcp_calc_server*, `/server/udp` → *udp_calc_server*; four client
      counterparts: *unix_stream_calc_client*, *unix_datagram_calc_client*,
      *tcp_calc_client*, *udp_calc_client* under `/client/...`.

    **Build and run** (Shell Boxes 20-2..20-4): `mkdir -p build; cd build;
    cmake ..; make`. Bring the server up in one terminal and the client in
    another. The stream client shows its command line:

    - `? (type quit to exit) 3++4` → `The req(0) is sent.` →
      `req(0) > status: OK, result: 7.000000`
    - `mem` → prints the calculator's current memory value (`req(1) > ...`)
    - `quit` → `Bye.`

    Every client *no matter the channel or socket type* shows the same command
    line, because it is part of the **common code written for all clients**:
    the client receives commands, turns them into requests per the application
    protocol, sends them, waits for the response, and prints the result.
  diagram:
    kind: flow
    caption: "Calculator project: thin skins over shared cores"
    nodes:
    - {id: SRVM, label: "4 server mains (skins)"}
    - {id: CLIM, label: "4 client mains (skins)"}
    - {id: SRVC, label: "libsrvcore.a (server core)"}
    - {id: CLIC, label: "libclicore.a (client core)"}
    - {id: CSER, label: "libcalcser.a (protocol)"}
    - {id: SVC, label: "libcalcsvc.a (service)"}
    edges:
    - {from: SRVM, to: SRVC}
    - {from: CLIM, to: CLIC}
    - {from: SRVC, to: CSER}
    - {from: SRVC, to: SVC}
    - {from: CLIC, to: CSER}
    steps:
    - {focus: [SRVM, CLIM], note: "eight executables, but every main is a thin transport-specific skin (family, type, address)"}
    - {focus: [SRVM, CLIM, SRVC, CLIC], note: "the machinery lives in common static libraries: server cores share libsrvcore.a, client cores libclicore.a"}
    - {focus: [SRVM, CLIM, SRVC, CLIC, CSER], note: "both cores sit on the serializer - libcalcser.a dictates the application protocol between client and server"}
    - {focus: [SRVM, CLIM, SRVC, CLIC, CSER, SVC], note: "libcalcsvc.a holds the standalone stateful calculation logic, different from the server process, linked by every server"}
  viz:
    kind: ascii-memory
    steps:
    - 'PROJECT LAYOUT: calcser (protocol, libcalcser.a) | calcsvc (service logic, libcalcsvc.a) | srvcore + clicore (common transport code, libsrvcore.a + libclicore.a)'
    - 'SERVER SKINS: unix/stream + unix/datagram + tcp + udp => unix_stream_calc_server, unix_datagram_calc_server, tcp_calc_server, udp_calc_server'
    - 'CLIENT SKINS: same four under client/ => *_calc_client executables; only the skin differs, the core is shared'
    - 'RUN FLOW: terminal 1 = server up | terminal 2 = client REPL: 3++4 -> req(0) > status: OK, result: 7.000000 | mem -> memory read | quit -> Bye.'
    - 'WHY THIS SHAPE: common parts extracted once => less code written + the boundaries common to all socket/channel types become visible'
  checks:
  - kind: mcq
    level: intro
    q: Which pairing of directory and library, as the chapter describes the hierarchy, is correct?
    choices:
    - "/calcser holds the serializer/deserializer sources; it builds into libcalcser.a and dictates the application
      protocol used between client and server"
    - "/calcsvc holds transport code for all four server skins; it builds into libsrvcore.a and links every server"
    - "/server/srvcore contains the calculator's arithmetic engine; it builds into libcalcsvc.a and is socket-agnostic"
    - "/client/clicore contains the client command-line parser only for UDS clients; TCP clients get their own copy"
    answer: 0
    why: |
      The chapter's hierarchy maps /calcser to the serializer/deserializer
      library, calls it the library that *dictates the application protocol*
      between the calculator client and server, and says it eventually builds
      into the static library file libcalcser.a. Option B misassigns the
      transport-common server library (that is /server/srvcore →
      libsrvcore.a); option C misassigns the arithmetic engine (that is
      /calcsvc → libcalcsvc.a); option D contradicts the point of clicore —
      it is common to all clients regardless of socket type.
    concept: hierarchy-library-mapping
  - kind: why-fails
    level: intro
    q: Two processes can be connected by a socket and can transmit data back and forth, yet the chapter says an
      application protocol is still a "very important feature" that ordinary socket programming examples lack.
      Why is the connection alone not enough for the calculator client and server to work?
    choices:
    - Sockets transmit at most one message per process pair, so a protocol is needed to multiplex requests
    - Being connected and transmitting data only means bytes can flow; without a well-defined application protocol
      the two parties cannot understand each other
    - The kernel drops unprotocolled sockets after their first successful exchange by design
    - Application protocols exist to encrypt the byte stream; without one the transmission stays in plaintext
    answer: 1
    why: |
      The book states it plainly: "without a well-defined application
      protocol, the two parties cannot communicate. They can be connected and
      transmit data because that's the functionality that the socket
      programming offers, but they cannot understand each other." Connecting
      and transmitting is transport; agreeing on message grammar is protocol,
      which ordinary examples skip because they show only simple, one-time
      communication scenarios.
      Options A, C, and D invent multiplexing, kernel eviction, and encryption
      rules that the chapter never claims.
    concept: connection-without-protocol-failure
  - kind: predict
    level: intro
    q: "You bring up the UDS stream server in terminal 1 and the UDS stream client in terminal 2. Reproduce the
      client's console: what does the client print for the very first request 3++4?"
    code: |
      ? (type quit to exit) 3++4
      <line A: the client announces the send>
      <line B: the client shows the server's reply>
    choices:
    - |
      The req(1) is sent.
      req(1) > status: INVALID_REQUEST, result: 0.000000
    - |
      The req(0) is sent.
      req(0) > status: OK, result: 7.000000
    - |
      The req(0) is sent.
      req(0) > status: OK, result: 7
    - |
      The req(1) is sent.
      req(1) > status: OK, result: 7.000000
    answer: 1
    why: |
      Shell Box 20-4 shows the exact console: the first request is req(0)
      (IDs start at zero), the client prints "The req(0) is sent.", and the
      reply line reads "req(0) > status: OK, result: 7.000000" — status OK
      plus the result formatted with six decimals (3 + 4 = 7).
      Option A bumps the ID and invents a failure status; option C drops the
      six-decimal formatting; option D starts IDs at one.
    concept: client-console-first-request
  - kind: order
    level: core
    q: 'Arrange the steps of building and exercising the calculator project from a clean checkout:'
    lines:
    - git clone <repo>, then cd into the ch20 example root
    - mkdir -p build, cd build, cmake .., make
    - './server/unix/stream/unix_stream_calc_server (terminal 1)'
    - './client/unix/stream/unix_stream_calc_client (terminal 2)'
    - '? (type quit to exit) 3++4 ... mem ... 5++4'
    - rm -rf build, cmake --fresh ..
    answer_order:
    - 0
    - 1
    - 2
    - 3
    - 4
    distractor_why:
      rm -rf build, cmake --fresh ..: The denylisted clean-rebuild line is a distractor - the chapter's flow builds once
        with cmake .. and make; nothing in the sequence re-cleans freshly cloned sources.
    why: |
      The build/run section walks exactly this order: clone and enter the
      project (Shell Box 20-1 shows clone + tree), build with CMake — mkdir
      -p build; cd build; cmake ..; make (Shell Box 20-2) — then run the
      server first in one terminal (Shell Box 20-3), start the client in
      another, and only then type requests, ending with quit (Shell Box
      20-4). The server must be up before the client connects.
    concept: build-run-sequence
  - kind: choose-better
    level: core
    q: The chapter could have taught each socket variety with a throwaway demo program. Instead the calculator
      project pulls common code into srvcore and clicore libraries. Which design does the book argue for, and what
      does it say that buys?
    choices:
    - |
      /* one throwaway main per socket type - each demo self-contained */
      int main(void) { /* AF_UNIX stream demo, from scratch */ }
    - |
      /* common code extracted once into static libraries, skins reuse it */
      /* server/{tcp,udp,unix/*},main.c call accept_forever()/serve_forever() from libsrvcore */
      /* client/*,main.c call stream_client_loop()/datagram_client_loop() from libclicore */
    answer: 1
    why: |
      The source-hierarchy section is explicit about the goal: "if you are
      going to support various types of sockets, together with various types
      of channels, it is better to extract the common part and write it once"
      — that is the approach the calculator project takes. Writing the common
      parts once reduces the amount of code significantly and shows the
      boundaries that are common between the various types of sockets and
      channels, which is exactly what libraries like libsrvcore.a and
      libclicore.a carry.
      Option A duplicates listener and connector logic four times and hides
      exactly the common boundaries the chapter wants you to see.
    concept: extract-common-parts-goal

- id: b3
  type: syntax
  title: 'Speak the Calculator Protocol: Requests, Responses, and the # / $ Grammar'
  explain_md: |
    Any two processes that communicate must obey an **application protocol** —
    custom, like the calculator's, or well-known like HTTP. The chapter calls
    its protocol **the calculator protocol** and fixes three structural facts
    about it:

    - It is **variable-length**: every message has its own length, and every
      message "should be separated from the next one using a delimiter".
    - There is **one type of request message and one type of response message**.
    - It is **textual**: only alphanumerical characters plus a few other
      characters are valid — the messages are human-readable.

    **Request message** (Code Box 20-1, `calcser/calc_proto_req.h`) — four
    fields: **request ID** (`id`, int32), **method** (`method_t`), and two
    operands (`operand1`, `operand2`, both double). Every request has a unique
    ID and **the server uses this ID to relate a response to its corresponding
    request**. The `method_t` enumeration lists the operations — a `NONE`
    sentinel plus the nine methods the chapter counts: `GETMEM`, `RESMEM`,
    `ADD`, `ADDM`, `SUB`, `SUBM`, `MUL`, `MULM`, `DIV`.

    **Memory methods.** The calculator keeps an internal memory, so addition,
    subtraction, and multiplication get memory-taking variants: `ADD` simply
    adds two float numbers, while `ADDM` "adds those two numbers together with
    the value stored in the internal memory, and finally it updates the value
    in the memory for further use" — like the **+M** button on a desktop
    calculator. `GETMEM`/`RESMEM` serve "reading and resetting the
    calculator's internal memory". Division cannot be performed on the
    internal memory — that is why it has no `DIVM` variant.

    To create a request with ID `1000`, method `ADD`, operands `1.5` and
    `5.6`, the client fills a `calc_proto_req_t` object (Code Box 20-2). The
    serializer then produces the wire message (Code Box 20-3):

        1000#ADD#1.5#5.6$

    The **`#` character is the field delimiter** and the **`$` character is
    the message separator**; "each request message has exactly four fields".

    **Response message** (Code Boxes 20-4..20-6) — three fields: `req_id`,
    `status`, `result`. The response `req_id` names the request being
    answered. `status_t` is an int with the protocol's constants:
    `STATUS_OK 0`, `STATUS_INVALID_REQUEST 1`, `STATUS_INVALID_METHOD 2`,
    `STATUS_INVALID_OPERAND 3`, `STATUS_DIV_BY_ZERO 4`,
    `STATUS_INTERNAL_ERROR 20` — "in the case of failure, it is a non-zero
    number, and its meaning is described ... in the calculator protocol". A
    response with ID 1000, status OK, result 7.1 serializes to `1000#0#7.1$`.
  example:
    lang: c
    adapted: false
    subgoals:
    - label: "Include-guard and only standard dependency (<stdint.h>)"
      lines: [1, 2, 3]
    - label: "method_t enum: NONE sentinel plus the nine protocol methods"
      lines: [5, 6, 7, 8, 9, 10, 11, 12]
    - label: "Request object: four fields for id, method, operand1, operand2"
      lines: [14, 15, 16, 17, 18, 19]
    - label: "Name-string converters the serializer relies on"
      lines: [21, 22]
    code: |
      #ifndef CALC_PROTO_REQ_H
      #define CALC_PROTO_REQ_H
      #include <stdint.h>

      typedef enum {
        NONE,
        GETMEM, RESMEM,
        ADD, ADDM,
        SUB, SUBM,
        MUL, MULM,
        DIV
      } method_t;

      struct calc_proto_req_t {
        int32_t id;
        method_t method;
        double operand1;
        double operand2;
      };

      method_t str_to_method(const char*);
      const char* method_to_str(method_t);

      #endif
  viz:
    kind: ascii-memory
    steps:
    - 'REQUEST WIRE: [id]<#>[method]<#>[operand1]<#>[operand2]<$> e.g. 1000#ADD#1.5#5.6$ - four fields, terminated by $'
    - 'RESPONSE WIRE: [req_id]<#>[status]<#>[result]<$> e.g. 1000#0#7.1$ - # splits fields, $ ends the message'
    - 'DELIMITER ROLES: # = field delimiter inside one message | $ = message separator between messages'
    - 'STATUS CODES: 0 OK | 1 INVALID_REQUEST | 2 INVALID_METHOD | 3 INVALID_OPERAND | 4 DIV_BY_ZERO | 20 INTERNAL_ERROR'
  checks:
  - kind: predict
    level: intro
    q: The client fills a request object with id 42, method SUB, operand1 9.5, operand2 4.0. Per Code Box 20-3's
      grammar, what exactly does the client-side serializer put on the wire?
    code: |
      struct calc_proto_req_t req;
      req.id = 42;
      req.method = SUB;
      req.operand1 = 9.5;
      req.operand2 = 4.0;
      /* client-side serialization -> ??? */
    choices:
    - "42#SUB#9.5#4.0"
    - "42#SUB#9.5#4.0$"
    - "42#SUB#9.5#4.0#"
    - "SUB#42#9.5#4.0$"
    answer: 1
    why: |
      The request wire format from Code Box 20-3 is id, method, operand1,
      operand2 joined by the field delimiter # and terminated by the message
      separator $. So 42 -> method string SUB -> 9.5 -> 4.0 with a trailing $
      gives exactly 42#SUB#9.5#4.0$. Option A forgets the separator, option C
      puts the wrong character last, and option D swaps the field order.
    concept: request-wire-predict
  - kind: eipe
    level: core
    q: In one sentence, what job does the request ID field perform in the calculator protocol?
    choices:
    - It encrypts the operands before the message is pushed onto the channel
    - It lets the server relate a response back to the exact request that produced it
    - It stores the calculator's running internal memory value between requests
    - It names the transport (UDS, TCP, or UDP) the request must travel on
    answer: 1
    why: |
      The chapter states: "Every request has a unique ID and the server uses
      this ID to relate a response to its corresponding request." The
      response carries the same number back as its req_id field, so a client
      that fires several requests can attribute each reply. Option C confuses
      the ID with the internal memory; options A and D are not roles of any
      protocol field here.
    concept: request-id-correlation-role
  - kind: why-fails
    level: core
    from_chapter: ch22
    from_block: b4
    q: "The calculator protocol chooses '#' as the field delimiter and '$' as the message separator on a
      textual, variable-length channel. Connecting this to the partitioning methods of the previous chapter: which
      technique does the protocol use, and what constraint does its delimiter choice have to satisfy?"
    choices:
    - Length-prefix framing; the 4-byte prefix must count the '$' and '#' bytes so receivers read whole messages
    - Finite-state machine framing; '#' and '$' must both encode state transitions that the kernel verifies per packet
    - Delimiter framing; the delimiter characters must be chosen wisely so they stay distinguishable from the actual
      message content
    - Fixed-length struct overlay; as long as every message is 21 bytes, the receiver can map bytes onto a C struct
    answer: 2
    why: |
      Chapter 19's partitioning methods list delimiter/separator, length
      prefix, and FSM framing, and warn that the delimiter "must be chosen
      depending on the content, so that it is easily distinguishable from the
      actual content". The calculator protocol is exactly the delimiter
      method - '#' splits fields within a message and '$' separates whole
      messages - so the serialized text (IDs, method names, numbers) must
      never contain '#' or '$', or the deserializer would cut in the wrong
      place. Options A, B, and D attach the protocol to the other framing
      methods it does not use.
      (From Chapter 19, block b4: Frame Variable-Length Messages with
      Partitioning Methods - review that block before answering.)
    concept: delimiter-choice-content-constraint
  - kind: fillblank
    level: core
    q: Complete the status constant that the protocol assigns when the second operand of a DIV request is 0.0?
    code: |
      /* calcser/calc_proto_resp.h */
      #define STATUS_OK 0
      #define STATUS_INVALID_REQUEST 1
      #define STATUS_INVALID_METHOD 2
      #define STATUS_INVALID_OPERAND 3
      #define STATUS_DIV_BY_ZERO ____
      #define STATUS_INTERNAL_ERROR 20
    answer_text: "4"
    why: |
      The response header defines STATUS_DIV_BY_ZERO as 4. When the calculator
      service sees a division by zero, the server replies with this status so
      the serialized response carries the numeric 4 in its status field.
      The mapping to remember: 1 invalid request, 2 invalid method, 3 invalid
      operand, 4 division by zero, 20 internal error, 0 = OK.
    concept: status-div-by-zero-constant
  - kind: trace
    level: core
    q: "Fill the wire-grammar trace: for each request the server receives, which response status travels back,
      and how does that appear on the wire?"
    trace:
      headers:
      - Incoming request
      - Status constant
      - Serialized status field
      rows:
      - - "1000#ADD#1.5#5.6$"
        - STATUS_OK
        - ???
      - - "1001#DIV#10.0#0.0$"
        - STATUS_DIV_BY_ZERO
        - ???
      - - "1002#FOO#1.0#2.0$"
        - STATUS_INVALID_METHOD
        - ???
    target:
      row: 2
      col: 2
    choices:
    - "2"
    - "20"
    - "0"
    - "3"
    answer: 0
    why: |
      Statuses leave the serializer as their numeric values: OK serializes to
      0, DIV_BY_ZERO to 4, and an unrecognized method name deserializes to
      STATUS_INVALID_METHOD, which is the constant 2 in the protocol's list.
      So the wire for the FOO request begins 1002#2#... The status field's
      non-zero values mean failure, and the meaning of each number "is
      described in the response header file, or to be exact, in the
      calculator protocol."
      Option B is the internal-error code, option C is OK, option D is
      invalid operand.
    concept: status-wire-trace
  - kind: order
    level: core
    q: 'Arrange the lines into the request data flow of one calculator transaction, per the protocol chapter:'
    lines:
    - client fills struct calc_proto_req_t (id, method, operand1, operand2)
    - serializer emits id#method#op1#op2$
    - deserializer on the server revives the request object from the fields split on '#'
    - server maps method + operands onto the calculator service and serializes a response
    - client turns the response's req_id, status, result field values back into the response fields
    - the client prints the raw ASCII bytes of its request struct to the terminal
    answer_order:
    - 0
    - 1
    - 2
    - 3
    - 4
    distractor_why:
      the client prints the raw ASCII bytes of its request struct to the terminal: Distractor - the client prints the
        serialized MESSAGE it composed per the protocol, never the raw fields of the C struct; that would leak no '$'
        separator and no field delimiters.
    why: |
      The protocol defines both message shapes so a serializer on one side and
      a deserializer on the other can talk: the request object's four fields
      become id#method#op1#op2$ on the wire; the server-side deserializer
      splits fields and revives the object; the service computes; and the
      response object (req_id, status, result) travels back the same way.
      The distractor line muddles the struct's C representation with the wire
      representation the protocol actually transmits.
    concept: transaction-field-flow-order
  - kind: mcq
    level: advanced
    q: Why does the method_t enumeration include GETMEM and RESMEM as protocol methods, while DIV deliberately has
      no DIVM sibling?
    choices:
    - GETMEM and RESMEM exist so the server can calibrate network latency, and DIV cannot run over datagram channels
    - Memory operations let a client read and reset the calculator's internal memory, while division cannot be
      performed on the internal memory, so it never gets a memory variant
    - GETMEM and RESMEM are status-report debug methods, and DIV lacks a memory variant only because its result is
      always fractional
    - They are placeholders reserved for future calculator protocols with more arithmetic methods
    answer: 1
    why: |
      The chapter explains: the calculator has an internal memory, "we also
      have a special method for reading and resetting the calculator's
      internal memory" (GETMEM/RESMEM serve that), and "the division method
      cannot be performed on the internal memory, so we don't have any other
      variation" of DIV. ADDM, SUBM, and MULM instead fold the memory into
      their result and update it, like the +M button on a desktop calculator.
      Options A, C, and D invent calibration, debug-reporting, and
      placeholder rationales the protocol never defines.
    concept: memory-method-variant-rationale

- id: b4
  type: algorithm
  title: 'Drive the Serializer Library: One Class, Two Sides, Four Functions'
  explain_md: |
    Serialization and deserialization live in their own library,
    `libcalcser.a`, wrapped in a single class with `calc_proto_ser_t` as its
    attribute structure (Code Box 20-7, `calcser/calc_proto_ser.h`). The
    public API has four groups:

    1. **Lifecycle**: `calc_proto_ser_new()` / `calc_proto_ser_delete()`
       allocate and free the object; `calc_proto_ser_ctor(ser, owner_obj,
       ring_buffer_size)` / `calc_proto_ser_dtor()` construct and destruct it.
       The constructor takes the **ring buffer size** (the deserializer
       "uses a ring buffer with a fixed length").
    2. **A pair of functions for the server process**:
       `calc_proto_ser_server_deserialize(ser, buffer, req_found*)` parses
       incoming bytes into a request object, and
       `calc_proto_ser_server_serialize(ser, resp)` turns a response object
       into a `buffer_t` to send.
    3. **A pair for the client process**: `calc_proto_ser_client_serialize()`
       packs a request object; `calc_proto_ser_client_deserialize()` parses a
       response message. The chapter's orientation rule: *on the client side
       we serialize requests and deserialize responses; on the server side we
       deserialize requests and serialize responses*.
    4. **Three callbacks**, registered with setters and called through
       function-pointer typedefs:
       `req_cb_t(void* owner_obj, struct calc_proto_req_t)` fires when a
       request has been deserialized from the channel; `resp_cb_t` the same
       for responses; `error_cb_t(void* owner_obj, const int req_id, const
       int error_code)` reports failed (de)serializations.

    The exchanged bytes travel inside `struct buffer_t { char* data; int
    len; }`. Error codes also live in the header: the 101-family
    (`ERROR_INVALID_REQUEST 101`, `_REQUEST_ID 102`, `_REQUEST_METHOD 103`,
    `_REQUEST_OPERAND1 104`, `_REQUEST_OPERAND2 105`) for bad requests, the
    201-family (`ERROR_INVALID_RESPONSE 201`, `_RESPONSE_REQ_ID 202`,
    `_RESPONSE_STATUS 203`, `_RESPONSE_RESULT 204`) for bad responses, and
    `ERROR_UNKNOWN 220`.

    **How deserialization really works** (the private functions stay in the
    code base, as the book says they are beyond the book's scope): the
    deserializer keeps incoming bytes in its fixed-length **ring buffer** and
    hunts for **`$`, the message separator**. Whenever it finds a `$`, it
    calls the function pointer passed in — for the server that is
    `_parse_req_and_notify` — which "tries to extract the fields and
    resurrect the request object", then **notifies the registered observer**
    (the server waiting through the callback). Without a `$`, bytes simply
    accumulate for the next chunk.
  diagram:
    kind: flow
    caption: "One class, two sides: the request/response journey"
    nodes:
    - {id: REQ, label: "request object", shape: io}
    - {id: CSER, label: "client_serialize"}
    - {id: W1, label: "bytes on the channel", shape: io}
    - {id: SDES, label: "server_deserialize"}
    - {id: RCB, label: "req_cb -> service"}
    - {id: SRES, label: "response object", shape: io}
    - {id: SSER, label: "server_serialize"}
    - {id: W2, label: "bytes on the channel", shape: io}
    - {id: CDES, label: "client_deserialize"}
    - {id: CCB, label: "resp_cb", shape: io}
    edges:
    - {from: REQ, to: CSER}
    - {from: CSER, to: W1, label: "buffer_t"}
    - {from: W1, to: SDES}
    - {from: SDES, to: RCB, label: "fires req_cb"}
    - {from: RCB, to: SRES, label: "computed"}
    - {from: SRES, to: SSER}
    - {from: SSER, to: W2, label: "buffer_t"}
    - {from: W2, to: CDES}
    - {from: CDES, to: CCB, label: "fires resp_cb"}
    steps:
    - {focus: [REQ], note: "the client builds a request object per the # / $ grammar"}
    - {focus: [REQ, CSER], note: "orientation rule: on the CLIENT side we serialize REQUESTS"}
    - {focus: [REQ, CSER, W1], note: "the packed bytes travel in buffer_t{data, len} across the channel"}
    - {focus: [REQ, CSER, W1, SDES, RCB], note: "on the SERVER side we deserialize requests; req_cb fires with the parsed request"}
    - {focus: [REQ, CSER, W1, SDES, RCB, SRES, SSER], note: "the service computes; on the server side we serialize RESPONSES"}
    - {focus: [REQ, CSER, W1, SDES, RCB, SRES, SSER, W2, CDES, CCB], note: "bytes cross back; on the client side we deserialize responses and resp_cb reports the result"}
  viz:
    kind: ascii-memory
    steps:
    - 'LIFECYCLE: calc_proto_ser_new() -> calc_proto_ser_ctor(ser, owner_obj, ring_buffer_size) -> ... -> calc_proto_ser_dtor() -> calc_proto_ser_delete()'
    - 'SERVER SIDE: server_deserialize(bytes -> req object via req callback) + server_serialize(resp object -> buffer_t)'
    - 'CLIENT SIDE: client_serialize(req object -> buffer_t) + client_deserialize(bytes -> resp object via resp callback)'
    - 'CALLBACKS: req_cb_t(owner, req) | resp_cb_t(owner, resp) | error_cb_t(owner, req_id, error_code) - registered by setters'
    - 'RING BUFFER: fixed size declared at ctor; scan for $ -> on hit, parse fields + resurrect object + notify observer; no $ => keep bytes'
    - 'ERROR CODES: 101..105 invalid request family | 201..204 invalid response family | 220 unknown'
  checks:
  - kind: mcq
    level: intro
    q: Which pair of serializer functions does the server process need, per the chapter's client/server split?
    choices:
    - calc_proto_ser_client_serialize() and calc_proto_ser_client_deserialize()
    - calc_proto_ser_server_deserialize() for incoming requests and calc_proto_ser_server_serialize() for outgoing
      responses
    - calc_proto_ser_server_serialize() for incoming requests and calc_proto_ser_server_deserialize() for outgoing
      responses
    - Both sides call the same four functions in the same roles, because the library is symmetric
    answer: 1
    why: |
      The API chapter is explicit: "on the client side, we serialize the
      request object and we deserialize the response message. Meanwhile on
      the server side, we deserialize the request message and we serialize
      the response object." The server therefore needs the server_deserialize
      function for the request bytes it reads and the server_serialize
      function for the responses it writes back.
      Option C reverses the two roles; option A hands the server the client's
      functions; option D denies the named split the API encodes.
    concept: server-serializer-function-pair
  - kind: predict
    level: core
    q: The server has already received "1000#ADD#1.5" plus "#5.6" with no '$' in sight. The next chunk arrives
      carrying "5#200#SUB#9#3$". What do the deserializer and the caller see after this call?
    code: |
      /* chunk history fed to calc_proto_ser_server_deserialize():
         1) "1000#ADD#1.5"   2) "#5.6"       (ring buffer retains all)
         3) "5#200#SUB#9#3$"  <- now */
      bool_t req_found;
      calc_proto_ser_server_deserialize(ser, buf, &req_found);
    choices:
    - req_found stays FALSE; the ring buffer still holds a partial message and no callback fires
    - One request (1000#ADD#1.5#5.6) is parsed and fires the req callback; req_found == TRUE
    - Two requests fire, because the ring buffer flushes everything and spots both 1000# and 200#
    - The call returns an error through the callback, because '#' appeared without a '$' terminator in chunk 3
    answer: 1
    why: |
      The deserializer scans the accumulated bytes for the '$' separator and
      only on a hit parses and notifies. Chunks 1 and 2 contained no '$', so
      the bytes were merely retained. Chunk 3 completes the first message
      (…5.6$), so exactly one request object is resurrected, the req callback
      fires for it, and req_found is set TRUE for the caller. The chunk also
      carries the start of the next message (200#SUB#9#3 without '$'), which
      stays buffered like any partial message.
      Options A, C, and D contradict the scan-for-'$'-then-notify behavior.
    concept: ring-buffer-completion-predict
  - kind: eipe
    level: core
    q: In one sentence, why does the error callback receive the request ID together with the error code?
    choices:
    - The ID lets the receiver connect the failed deserialization to the specific request being handled and respond
      appropriately, while error_code says what was wrong
    - The ID is the request's checksum, and error_code verifies it against the ring buffer's length
    - The ID selects which thread should receive the error; error_code throttles retransmissions
    - The ID numbers the error types; error_code numbers the request that may retry
    answer: 0
    why: |
      error_cb_t is declared as void(*)(void* owner_obj, const int req_id,
      const int error_code). The protocol's messages are request/response
      pairs tied by IDs, so an error on the wire - say the 101 family's
      invalid request or invalid operand codes - has to be attributed to the
      message that failed it. Carrying req_id alongside error_code keeps the
      error traceable to a concrete exchange without inventing new callback
      shapes. Options B, C, and D invent roles no declaration or chapter
      passage supports.
    concept: error-callback-carries-req-id
  - kind: trace
    level: core
    q: Trace the ring buffer across three feedings. In the target cell, state the buffer's conclusion after the
      third chunk.
    trace:
      headers:
      - Chunk fed
      - "'$' seen yet?"
      - Deserializer conclusion
      rows:
      - - "\"1000#ADD\""
        - no
        - bytes retained, no request yet
      - - "\"#1.5#5.6\""
        - no
        - buffer holds 1000#ADD#1.5#5.6, still waiting
      - - "\"$\""
        - yes
        - ???
    target:
      row: 2
      col: 2
    choices:
    - the buffer empties and the parser reports req not found for the third time
    - the parser scans for '#' next and stops, since a message separator alone carries no fields
    - the parser extracts the frame 1000#ADD#1.5#5.6, splits fields on '#', revives the request object, and notifies
      the registered observer
    - the parser wraps the message and injects a synthetic request ID 0 because the frame arrived without an ID
    answer: 2
    why: |
      Code Box 20-9's server_deserialize delegates to the private
      _deserialize machinery with _parse_req_and_notify as the parse function.
      The chapter describes that machine: the ring buffer "tries to find $ as
      the message separator", and whenever it finds one, "it calls the
      function pointer ... The _parse_req_and_notify function tries to
      extract the fields and resurrect the request object. Then, it notifies
      the registered observer". So the lone '$' completes the buffered frame
      and the waiting server gets its request object.
      Options A, B, and D invent empty-buffer and synthetic-ID behaviors.
    concept: ring-buffer-dollar-hit-consequence
  - kind: why-fails
    level: advanced
    q: A teammate wants to parse each incoming chunk immediately, splitting every '#' he sees into fields the moment
      a chunk arrives. Why does the chapter's ring-buffer-then-'$'-only machinery reject that instinct?
    choices:
    - Fields are only meaningful once a whole terminated message exists; a chunk can end in the middle of any field,
      so early parsing would revive garbage and notify the observer with a half-built request
    - The ring buffer hashes every chunk; splitting before the hash is computed desynchronizes the checksum
    - Immediate parsing would bypass the deserializer's thread pool, and POSIX callbacks require it
    - Splitting on '#' is reserved for the response path only; request paths must wait for the server's next write
    answer: 0
    why: |
      The deserializer's whole design exists because message length varies and
      delivery arrives in chunks of arbitrary size. The book says the
      deserializer "uses a ring buffer with a fixed length and tries to find $
      as the message separator" and only then resurrects an object and
      notifies. Parsing before a '$' means the bytes in hand may be a torn
      fragment (no terminator, cut field, partial operand), so any "request"
      revived from them would be a half-built duplicate that could fire the
      request callback with wrong fields.
      Options B, C, and D invent checksums, thread pools, and asymmetries the
      chapter never mentions.
    concept: deferred-parse-until-terminator
  - kind: order
    level: advanced
    q: 'Arrange the lines into one full transaction through the serializer quadrants, from the client pressing Enter to the reply:'
    lines:
    - 'client: calc_proto_ser_client_serialize(ser, &req) -> buffer_t'
    - 'client: write the serialized request onto the channel'
    - 'server: calc_proto_ser_server_deserialize(ser, buf, &req_found) -> req callback fires'
    - 'server: calculator service computes on the revived request'
    - 'server: calc_proto_ser_server_serialize(ser, &resp) -> buffer_t written back'
    - 'client: calc_proto_ser_client_deserialize(ser, buf, &resp_found) -> resp callback fires'
    - 'client: the response callback prints status and result for req id'
    answer_order:
    - 0
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
    why: |
      The four public functions partition by side exactly as the API section
      states: client serializes the request and sends; server deserializes it
      (reviving the object and firing the req callback), computes, and
      serializes a response; the client then deserializes that response and
      its resp callback delivers the outcome to the user. Every arrow crosses
      the buffer_t boundary the header defines.
    concept: transaction-quadrant-order
  - kind: mcq
    level: intro
    q: What is the ring_buffer_size argument to calc_proto_ser_ctor for?
    choices:
    - It sets how many requests may sit unaccepted in the server's listen backlog
    - It sizes the fixed-length accumulator the deserializer uses to hold incoming bytes until a '$' terminator
      shows up
    - It caps how many responses the error callback may queue before failing hard
    - It chooses the serializer's precision when printing double operands on the wire
    answer: 1
    why: |
      The API section says the deserializer "uses a ring buffer with a fixed
      length" and the constructor signature is calc_proto_ser_ctor(ser,
      owner_obj, ring_buffer_size). The chapter adds two concrete uses:
      256 on the server side per Code Box 20-19 and 128 on the client side per
      Code Box 20-22. The backlog is a listen() parameter and unrelated;
      callbacks are registered after construction; double formatting is
      sprintf's job inside the serializer, throttled by no constructor size.
    concept: ring-size-ctor-role
- id: b5
  type: design
  title: 'Model the Calculator Service: Standalone, Stateful, Transport-Blind Logic'
  explain_md: |
    The third common part of the project is the **calculation service** — the
    core functionality of the calculator — declared in
    `calcsvc/calc_service.h` (Code Box 20-12):

    ```c
    static const int CALC_SVC_OK = 0;
    static const int CALC_SVC_ERROR_DIV_BY_ZERO = -1;
    /* lifecycle + operations */
    void calc_service_ctor(...);            /* plus _new/_dtor/_delete */
    void calc_service_reset_mem(struct calc_service_t*);
    double calc_service_get_mem(struct calc_service_t*);
    double calc_service_add(struct calc_service_t*, double, double, bool_t mem);
    double calc_service_sub(struct calc_service_t*, double, double, bool_t mem);
    double calc_service_mul(struct calc_service_t*, double, double, bool_t mem);
    int calc_service_div(struct calc_service_t*, double, double, double*);
    ```

    Two deliberate design facts follow (both book statements):

    - **Transport-blind and dependency-free.** "The input arguments are pure
      C types, and it is in no way dependent on IPC-related or
      serialization-related classes or types. Since it is isolated as a
      standalone logic, we compile it into an independent static library
      named `libcalcsvc.a`." Every server executable must link against it to
      do the actual calculations.
    - **Stateful by necessity.** The interface carries a *stateless-vs-
      stateful* doctrine: "if a service for a client doesn't require us to
      remember any state from the previous requests of that client, then we
      can use a singleton service object" (a **stateless** service). The
      calculator is the opposite case — it has "an internal memory that is
      unique for each client", so "for every client, we need to have a
      specific service object. These objects are known as **stateful**
      service objects." That is exactly why the stream server's handler
      (Code Box 20-19) and the datagram loop (Code Box 20-25) each build a
      fresh service object alongside the fresh serializer.

    Note how the interface also shapes error reporting: `add`, `sub`, and
    `mul` can only produce numbers, but **division can fail** — so
    `calc_service_div` returns an `int` (`CALC_SVC_OK` or
    `CALC_SVC_ERROR_DIV_BY_ZERO`) and hands the quotient out through a
    `double*` parameter. The server's request callback maps a failed
    division to the protocol's `STATUS_DIV_BY_ZERO` (4) response status,
    keeping service errors and wire statuses in separate namespaces.
  diagram:
    kind: flow
    caption: "Stateless singleton or per-client service objects"
    nodes:
    - {id: ST, label: "per-client state needed?", shape: decision}
    - {id: SGL, label: "one singleton object", shape: io}
    - {id: OBJ, label: "one object per client", shape: io}
    - {id: MEM, label: "calculator memory", shape: io}
    edges:
    - {from: ST, to: SGL, label: "stateless"}
    - {from: ST, to: OBJ, label: "stateful"}
    - {from: OBJ, to: MEM}
    steps:
    - {focus: [ST], note: "the interface carries the stateless-vs-stateful doctrine"}
    - {focus: [ST, SGL], note: "no state to remember between a client's requests -> a singleton service object is enough"}
    - {focus: [ST, SGL, OBJ], note: "the calculator remembers memory values per client -> a dedicated object for every client"}
    - {focus: [ST, SGL, OBJ, MEM], note: "that is why the stream thread and the datagram loop each build a fresh calc_service_t; note div returns int + double* (its error channel), unlike add/sub/mul"}
  viz:
    kind: ascii-memory
    steps:
    - 'INTERFACE SHAPE: calc_service_t with reset_mem/get_mem + add/sub/mul(svc, a, b, bool_t mem) + div(svc, a, b, double* out)'
    - 'ERROR NAMESPACE: CALC_SVC_OK 0 | CALC_SVC_ERROR_DIV_BY_ZERO -1 - service-side codes, distinct from the wire statuses (0/1/2/3/4/20)'
    - 'DEPS: zero IPC or serializer types - pure C arguments only => standalone libcalcsvc.a, every server links it'
    - 'STATE RULE: stateless clients => ONE singleton service object is enough | calculator memory is per-client => stateful, one service object per client'
    - 'IN THE SERVERS: stream handler creates ser + svc per accepted client | datagram core creates ser + svc per datagram - same doctrine'
  checks:
  - kind: mcq
    level: intro
    q: Which listing matches Code Box 20-12's service interface as the chapter presents it?
    choices:
    - add/sub/mul return double and take a bool_t mem flag, while div returns an int error code and writes its result
      through a double* parameter
    - All four operations return int error codes, and the quotient travels inside a request callback
    - add/sub/mul take serializer objects so the service can serialize its own results
    - The service struct embeds a socket descriptor so servers avoid per-client contexts
    answer: 0
    why: |
      Code Box 20-12 declares calc_service_add/sub/mul as double-returning
      functions whose last argument is bool_t mem, while calc_service_div
      returns int and receives a double* for the result - the division
      needs its own error channel. The chapter stresses the service "is in
      no way dependent on IPC-related or serialization-related classes or
      types", killing option C, and nothing about socket descriptors
      appears in the interface, killing option D. Option B hides the
      double-typed arithmetic returns the header really has.
    concept: service-interface-shape
  - kind: why-fails
    level: core
    q: Why does calc_service_div return an int and hand the quotient out through a double* parameter, when its
      sibling operations simply return double?
    choices:
    - Division is the only operation whose operator symbol differs in ASCII, so the interface marks it for the
      deserializer
    - Division can fail - the server needs a way to detect the failure (CALC_SVC_ERROR_DIV_BY_ZERO) while the double*
      carries the quotient only when the call succeeded, so the server can answer with STATUS_DIV_BY_ZERO
    - Returning double from div would leak kernel memory, so POSIX requires pointer-style outputs
    - The int return counts how many instructions the division took, letting the profiler measure hot paths
    answer: 1
    why: |
      The header defines CALC_SVC_OK = 0 and CALC_SVC_ERROR_DIV_BY_ZERO =
      -1: div's return value is the error channel. A double return cannot
      separate "computed 0.0" from "failed", so the quotient travels via the
      pointer and is only meaningful on success; the server maps the error
      onto the protocol's STATUS_DIV_BY_ZERO (4) response status. add/sub/
      mul cannot fail in this model, so their double returns carry results
      directly.
      Options A, C, and D invent operator-ASCII, POSIX, and profiler rules.
    concept: div-error-channel-design
  - kind: trace
    level: core
    q: Trace the stateful service across four calls on freshly constructed service memory. Fill the target cell.
    trace:
      headers:
      - Call
      - Returned value
      - Internal memory after
      rows:
      - - reset_mem()
        - (nothing)
        - 0.0
      - - add(2.0, 3.0, mem = FALSE)
        - 5.0
        - 0.0 (plain ADD leaves memory alone)
      - - add(2.0, 3.0, mem = TRUE)
        - 5.0
        - 5.0 (ADDM folds the memory in and updates it)
      - - get_mem()
        - "???"
        - unchanged by reads
    target:
      row: 3
      col: 1
    choices:
    - "5.0, because the ADDM call stored the folded result into the calculator's internal memory"
    - "0.0, because plain add calls zero the memory before every computation"
    - "10.0, because get_mem re-executes the last ADDM with the operands cached"
    - "2.0, because memory only tracks the first operand of memory-taking calls"
    answer: 0
    why: |
      Code Box 20-12's doctrine: ADD "simply adds two float numbers" and
      leaves the internal memory untouched, while the ADDM variant "adds
      those two numbers together with the value stored in the internal
      memory, and finally it updates the value in the memory for further
      use". So the mem = TRUE call yields 2 + 3 + 0 = 5.0 and sets memory to
      5.0; get_mem afterwards reads back exactly 5.0 without mutating
      anything.
      Options B, C, and D invent zeroing, replay, and first-operand rules.
    concept: service-memory-call-trace
  - kind: choose-better
    level: core
    q: Two clients A and B issue interleaved requests over one server. Which service-object design matches the
      chapter's stateful doctrine for THIS calculator?
    choices:
    - |
      /* one singleton service object shared by the handlers */
      svc = calc_service_new(); ctor(svc);
      /* handlers A and B call svc->add(...) directly */
    - |
      /* one stateful service object per client, per Code Box 20-19 */
      client A: svc_A = calc_service_new(); ctor(svc_A);
      client B: svc_B = calc_service_new(); ctor(svc_B);
    answer: 1
    why: |
      The chapter draws the line explicitly: services that need no context
      across requests "can use a singleton service object" (stateless), but
      when "handling the current request demands knowing something from the
      previous requests ... for every client, we need to have a specific
      service object", because the calculator's "internal memory ... is
      unique for each client" - these are the "stateful service objects".
      A singleton would let A's ADDM fold B's operands onto A's remembered
      memory. That is why client_handler constructs calc_service_new() +
      ctor per accepted client (Code Box 20-19) and serve_forever does so
      per datagram (Code Box 20-25).
      Option A is exactly the contamination the doctrine rules out.
    concept: stateful-per-client-service-choice
  - kind: eipe
    level: core
    q: In one sentence, why does the service expose add/sub/mul with a bool_t mem argument instead of separate plain
      and memory-taking functions for each operation?
    choices:
    - To save network bytes, since boolean arguments compress better than function names on the wire
    - One implementation serves both protocol variants - the method obtained from the request (ADD versus ADDM)
      maps onto the same arithmetic with the flag deciding whether the internal memory folds into the operation
    - Because C forbids declaring two functions with the same name and different arity
    - Because the serializer requires every method to have a boolean spare field for future protocols
    answer: 1
    why: |
      The protocol defines ADD and ADDM (likewise SUB/SUBM, MUL/MULM) as
      separate methods, while the service interface declares exactly one
      arithmetic function per operation with a bool_t mem parameter. The
      mapping falls out of the book's semantics: a memory-less method
      "simply adds two float numbers", the memory variant performs the same
      arithmetic "together with the value stored in the internal memory" and
      updates it. Keeping one function with a flag keeps the standalone
      service minimal while the protocol layer decides the variant. Options
      A, C, and D invent compression, overload, and serializer rules.
    concept: mem-flag-single-implementation
  - kind: predict
    level: core
    q: The server's request callback receives a request with id 1000, method DIV, operands 14.0 and 2.0. Trace the
      service call and the response's status field.
    code: |
      struct calc_proto_req_t req = {1000, DIV, 14.0, 2.0};
      double result;
      int error = calc_service_div(svc, req.operand1, req.operand2, &result);
      /* resp.result = result; resp.status = ??? */
    choices:
    - error is CALC_SVC_OK (0), so resp.status is STATUS_OK (0) and result carries 7.0
    - error is CALC_SVC_ERROR_DIV_BY_ZERO (-1), because the callback must negate every call's return value
    - error is CALC_SVC_OK, but resp.status is STATUS_INVALID_OPERAND, since division always validates its operands
    - error is 4, the protocol's failure code, because div maps service errors onto wire statuses itself
    answer: 0
    why: |
      14.0 / 2.0 succeeds: div returns CALC_SVC_OK (0) and writes 7.0
      through the double*, so the response's status field is the protocol's
      OK constant, 0. Contrast the failure path the header hard-codes: with
      operand2 = 0.0 the call returns CALC_SVC_ERROR_DIV_BY_ZERO (-1) and
      the server answers with STATUS_DIV_BY_ZERO, the numeric 4 on the
      wire. Service codes and wire statuses are separate namespaces - the
      callback does the mapping.
      Option B negates for no reason; option C invents operand validation;
      option D blurs the two namespaces the design keeps apart.
    concept: div-success-path-predict
  - kind: order
    level: core
    q: 'Arrange the handling of one ADDM request through the service, from deserialized object to serialized reply:'
    lines:
    - the request callback receives the revived calc_proto_req_t (method ADDM, two operands)
    - the callback picks THIS client's stateful service object
    - calc_service_add(svc, op1, op2, TRUE) folds the operands with the stored internal memory
    - the service updates its internal memory with the folded result
    - the callback fills a response object (req_id, STATUS_OK, result) and serializes it for the client
    - the serializer converts the result digits BEFORE the service touches the memory
    answer_order:
    - 0
    - 1
    - 2
    - 3
    - 4
    distractor_why:
      the serializer converts the result digits BEFORE the service touches the memory: Distractor - serialization
        happens after the service call produces the result object; nothing converts digits until the response
        exists, and the memory update is part of the service call itself.
    why: |
      The data flow is: deserialized request -> per-client stateful service
      (the object whose memory belongs to THIS client) -> the memory-taking
      arithmetic folds operands with the stored memory and updates it ->
      the response object carries req_id, STATUS_OK and the result back
      through the serializer. Serialization is downstream of the service;
      it never feeds the memory.
    concept: addm-request-handling-order
- id: b6
  type: model
  title: 'Bring Up a UDS Stream Server: socket, unlink, bind, listen, accept'
  explain_md: |
    A server **stands in the position of a listener**, so a calculator server
    that wants stream connections over a UDS follows the **stream listener
    sequence** from the previous chapter. Four milestones appear in the
    project's `main` (Code Boxes 20-13..20-17), and each maps to one system
    call:

    1. **Create the socket object.**
       `int server_sd = socket(AF_UNIX, SOCK_STREAM, 0);` — from
       `<sys/socket.h>`. Note the review's warning: *this is just a socket
       object*, not yet a server or client socket — "only the subsequent
       function calls determine this". The three arguments set the socket's
       attributes: the address family (`AF_UNIX`), the type
       (`SOCK_STREAM`), and the protocol.
    2. **Bind to a socket file.** A `struct sockaddr_un` is zeroed, its
       `sun_family` set to `AF_UNIX`, and the path copied into `sun_path`
       with `strncpy(addr.sun_path, sock_file, sizeof(addr.sun_path) - 1)`;
       then `bind(server_sd, (struct sockaddr*)&addr, sizeof(addr))`. The
       bind "succeeds only if there is no other socket object bound to the
       same socket file" — two sockets, likely in different processes, cannot
       share one file. Before binding, the project **unlinks any stale file**:
       `unlink(sock_file)`, "delete the previously created socket file if it
       exists".
       *Path-length note from the book:* the path cannot exceed **104 bytes**
       on most Unix systems and **108 bytes on Linux**; because the path is a
       C string, `sun_path` always holds an extra null at the end, so
       **effectively 103 and 107 bytes** of path are usable.
       *Abstract sockets (Linux note):* a UDS can bind an **abstract socket
       address** — useful when no filesystem is available; a string starting
       with a null character (`\0`) names the socket *inside the kernel*, and
       that name must be unique in the system.
    3. **Configure the backlog.** `listen(server_sd, 10)` sets the queue
       capacity for pending, unaccepted connections — the calculator server
       carries a backlog of **10**. During `listen`-preparation the server is
       not yet serving; this step is essential for a stream socket before
       accepting.
    4. **Accept clients.** The accept loop calls
       `int client_sd = accept(server_sd, NULL, NULL)` per incoming client.
       On every success the kernel returns a **new socket object** referring
       to the stream channel of that one client: "every client has its own
       stream channel, and hence its own socket descriptor". A blocking
       listener socket is the default, so with no client in the backlog the
       thread *stays inside accept()*, blocked.

    Error discipline in the book's code: every call is checked, and a
    failure closes `server_sd`, reports `strerror(errno)`, and exits the
    process.
  diagram:
    kind: flow
    caption: "Stream-listener bring-up: bare socket object to per-client channels"
    nodes:
    - {id: SOCK, label: "socket(AF_UNIX, SOCK_STREAM, 0)", shape: io}
    - {id: UNLK, label: "unlink(stale socket file)", shape: io}
    - {id: BIND, label: "bind(server_sd, sockaddr_un)"}
    - {id: LSTN, label: "listen(server_sd, 10)"}
    - {id: ACC, label: "accept(server_sd) loop", shape: decision}
    - {id: CLI, label: "client_sd per client"}
    edges:
    - {from: SOCK, to: UNLK}
    - {from: UNLK, to: BIND, label: "path free"}
    - {from: BIND, to: LSTN, label: "exclusive bind"}
    - {from: LSTN, to: ACC, label: "backlog 10"}
    - {from: ACC, to: CLI, label: "queue non-empty"}
    - {from: CLI, to: ACC, label: "again"}
    steps:
    - {focus: [SOCK], note: "socket() creates a bare socket object - role still undetermined (client or server)"}
    - {focus: [SOCK, UNLK], note: "unlink() deletes a stale socket file so bind() does not meet an occupied path"}
    - {focus: [SOCK, UNLK, BIND], note: "bind() ties server_sd to the socket file; two sockets cannot share one file"}
    - {focus: [SOCK, UNLK, BIND, LSTN], note: "listen() configures the backlog (10) - listener mode reached, not yet serving"}
    - {focus: [SOCK, UNLK, BIND, LSTN, ACC], note: "accept() blocks while the backlog queue is empty"}
    - {focus: [SOCK, UNLK, BIND, LSTN, ACC, CLI], note: "each success returns a NEW client_sd (own stream channel per client); the loop accepts again"}
  viz:
    kind: ascii-memory
    steps:
    - 'STEP 1 socket(): socket(AF_UNIX, SOCK_STREAM, 0) -> server_sd exists; still NOTHING server-like about it (no role yet)'
    - 'STEP 2 unlink(): delete any stale /tmp/calc_svc.sock from a previous run -> otherwise bind() meets an occupied path'
    - 'STEP 3 bind(): sockaddr_un{sun_family = AF_UNIX, sun_path = path} -> kernel ties server_sd to that socket file (exclusive)'
    - 'STEP 4 listen(server_sd, 10): backlog queue of size 10 is configured around the bound socket; listener mode reached'
    - 'STEP 5 accept(): blocks when the queue is empty; returns a NEW client_sd per accepted client (each client = own channel + own sd)'
    - 'BOUNDARIES: sun_path holds 108 bytes on Linux / 104 on most Unix, minus the trailing null => 107 / 103 usable path bytes'
  checks:
  - kind: mcq
    level: intro
    q: Right after socket(AF_UNIX, SOCK_STREAM, 0) succeeds, what does the server actually have?
    choices:
    - A socket object whose role is still undetermined; only later calls decide whether it serves as client or
      server socket
    - A ready-to-accept server socket with a backlog already configured by the call
    - A connected channel with exactly one client, since AF_UNIX binds the peer implicitly
    - A file descriptor open on the filesystem, because AF_UNIX requests a file immediately
    answer: 0
    why: |
      Code Box 20-13's lesson is stated outright: "Note that this is just a
      socket object, and yet it is not determined whether this is going to be
      a client socket or a server socket. Only the subsequent function calls
      determine this." bind/listen/accept are what turn it into a listener;
      the socket call itself configures the three attributes (address family,
      type, protocol) and nothing more.
      Options B, C, and D grant the socket boons that belong to later calls.
    concept: socket-call-role-undetermined
  - kind: order
    level: core
    q: 'Arrange the stream-listener milestones of the UDS calculator server in running order:'
    lines:
    - int server_sd = socket(AF_UNIX, SOCK_STREAM, 0);
    - unlink(sock_file);            /* clear a stale socket file */
    - memset the addr, set sun_family, copy the path, then bind(server_sd, &addr, sizeof(addr));
    - result = listen(server_sd, 10);
    - while (1) { int client_sd = accept(server_sd, NULL, NULL); /* next client */ }
    - int client_sd = accept(sock_file, NULL, NULL);
    answer_order:
    - 0
    - 1
    - 2
    - 3
    - 4
    distractor_why:
      int client_sd = accept(sock_file, NULL, NULL);: Distractor - accept() takes the
        server socket descriptor as its first argument, never a file path; the descriptor is what the kernel knows
        the backlog through.
    why: |
      The sequence matches Code Boxes 20-13 through 20-16 and the consolidated
      main of Code Box 20-17: create the socket object, clear any stale socket
      file, prepare the sockaddr_un and bind, configure the backlog with
      listen, and only then loop on accept() to receive clients. The
      distractor passes a filesystem path where the kernel wants the bound
      socket descriptor.
    concept: stream-listener-milestone-order
  - kind: why-fails
    level: core
    from_chapter: ch22
    from_block: b20
    q: "The calculator server binds /tmp/calc_svc.sock while a previous server instance is still running and then
      calls listen() on it. Reading this against the stream listener sequence from the previous chapter: which part
      of the sequence breaks, and what must hold at bind time?"
    choices:
    - listen() fails, because a listener socket may exist only once per process per address family
    - The socket object creation succeeds, but the bind milestone breaks - bind can only succeed when no other socket
      object is already bound to the same socket file
    - accept() fails, because the backlog of a shared path is summed over both processes and overflows 10
    - Nothing breaks; two servers bound to one socket file share the backlog like twin listeners
    answer: 1
    why: |
      Chapter 19's stream listener sequence runs socket -> bind -> listen ->
      accept loop, and the chapters section for UDS adds the exclusivity rule:
      "The bind function call succeeds only if there is no other socket
      object bound to the same socket file. Therefore, with UDS, two socket
      objects, probably being in different processes, cannot be bound to the
      same socket file." A second bind on the live path fails, and the
      project's own error discipline closes the descriptor, prints
      strerror(errno), and exits.
      Options A, C, and D invent per-process limits and shared-backlog
      behavior the chapters never state.
      (From Chapter 19, block b20: Execute Listener-Connector Initialization
      Sequences - review that block before answering.)
    concept: bind-exclusivity-across-processes
  - kind: trace
    level: core
    q: Trace the file-descriptor and filesystem state of the stream server from process start to the first accepted
      client. What belongs in the target cell?
    code: |
      /* main() of the UDS stream calculator server (Code Box 20-17) */
      char sock_file[] = "/tmp/calc_svc.sock";
      int server_sd = socket(AF_UNIX, SOCK_STREAM, 0);  /* sd = 3 */
      unlink(sock_file);
      /* ... sockaddr_un preparation ... */
      bind(server_sd, (struct sockaddr*)&addr, sizeof(addr));
      listen(server_sd, 10);
      /* accept_forever(server_sd): first client arrives */
    trace:
      headers:
      - Milestone done
      - Filesystem at /tmp/calc_svc.sock
      - descriptors open
      rows:
      - - after socket()
        - (may hold a stale file until unlink)
        - "server_sd = 3"
      - - after unlink() + bind()
        - socket file created, tied to server_sd
        - "server_sd = 3"
      - - after listen(_, 10)
        - socket file in place, queue behind it
        - "server_sd = 3, backlog 10"
      - - first accept() returns
        - "???"
        - "server_sd = 3 + client_sd = 4/5"
    target:
      row: 3
      col: 1
    choices:
    - the socket file is deleted; accept consumes the file so clients can no longer connect
    - the socket file is unchanged; accept() pops a pending connection from the backlog and returns a fresh socket
      descriptor for that client, while server_sd keeps listening
    - socket file becomes a regular file, because accept() demotes the node after its first use
    - socket file gets overwritten by a symbolic link to the client's own path
    answer: 1
    why: |
      accept() reorganizes descriptors, not the filesystem: the bound node
      stays where bind() put it (clients still need it to connect), the
      backlog hands the listener one pending connection, and the kernel
      returns a NEW socket object whose descriptor is dedicated to the
      accepted client, exactly as Code Boxes 20-16/20-18 state. The listener
      descriptor remains open and listening.
      Options A, C, and D invent consumption, demotion, and symlink behavior.
    concept: accept-milestone-descriptor-trace
  - kind: fillblank
    level: intro
    q: "Complete the stream server's socket-creation call by filling the type attribute that requests a stream
      channel."
    code: |
      int server_sd = socket(AF_UNIX, ____________, 0);
      if (server_sd == -1) {
        fprintf(stderr, "Could not create socket: %s\n", strerror(errno));
        exit(1);
      }
    answer_text: SOCK_STREAM
    why: |
      The stream server asks for the connection-oriented channel kind, so the
      type argument is SOCK_STREAM (the family stays AF_UNIX and the protocol
      argument stays 0, letting the OS pick). The datagram calculator server
      uses the same line with SOCK_DGRAM instead - that one attribute is what
      moves the server between the two channel kinds.
    concept: stream-type-constant-server
  - kind: eipe
    level: advanced
    q: In one sentence, what is a Linux abstract socket address good for in a UDS server?
    choices:
    - It caches the last accepted client so a restarted server resumes its backlog without listen()
    - It names the socket inside the kernel with a null-prefixed string, useful mainly when no filesystem is
      available to host a socket file
    - It hashes the socket file path so two servers may share one inode safely
    - It pins the socket file into memory, replacing unlink() maintenance entirely
    answer: 1
    why: |
      The chapter's Linux note says UDS can be bound to abstract socket
      addresses, useful "mainly when there is no filesystem mounted to be used
      for having a socket file": a string starting with a null character
      initializes the address structure, and the name is bound to the socket
      object inside the kernel - with the requirement that the provided name
      stays unique in the system. The filesystem path machinery (and its
      unlink() chore) is simply bypassed.
      Options A, C, and D invent backlog caching, shared inodes, and memory
      pinning.
    concept: abstract-socket-address-purpose
  - kind: predict
    level: advanced
    q: A developer copies a 110-byte socket path into a sockaddr_un on Linux with
      strncpy(addr.sun_path, path, sizeof(addr.sun_path) - 1). The book documents two sizes for sun_path. What
      actually gets bound?
    choices:
    - The full 110-byte path binds fine, because Linux truncates neither path nor terminator
    - Only the first 107 usable path bytes reach sun_path (the 108-byte field holds a trailing null), so the address
      bound is the truncated path - and the book's ceiling of 108 bytes on Linux (104 on most Unix) warns the
      assignment is already out of contract
    - strncpy refuses to copy and returns NULL, so bind never sees an address
    - The kernel grows sun_path dynamically to fit 110 bytes, since AF_UNIX paths are heap-backed
    answer: 1
    why: |
      The book's note fixes the numbers: the socket file path cannot exceed
      104 bytes on most Unix systems and 108 on Linux, and because the string
      keeps an extra null character at the end, effectively 103 and 107 bytes
      of path are usable. With sizeof(addr.sun_path) - 1 the strncpy caps the
      copy within the field, so a 110-byte request lands truncated at 107
      usable bytes plus terminator and binds that (different) path. Option C
      reverses strncpy semantics (it copies up to n bytes without
      terminating), and option D invents dynamic growth.
    concept: sun-path-effective-bytes

- id: b7
  type: algorithm
  title: 'Run the Stream Server Core: thread-per-Client Machinery in srvcore'
  explain_md: |
    The last milestones of `main` (Code Box 20-17) hand control to
    `accept_forever(server_sd)` — a function that lives in the **server
    common library** (`srvcore`, `stream_server_core.c`) because "its
    definition remains the same for other stream sockets such as TCP
    sockets". Resting on Code Boxes 20-18..20-20, the machinery is:

    ```c
    void accept_forever(int server_sd) {
      while (1) {
        int client_sd = accept(server_sd, NULL, NULL);
        if (client_sd == -1) { close(server_sd); fprintf(...); exit(1); }
        pthread_t client_handler_thread;
        int* arg = (int *)malloc(sizeof(int));
        *arg = client_sd;
        int result = pthread_create(&client_handler_thread, NULL,
                                    &client_handler, arg);
        ...
      }
    }
    ```

    - **Accept once, delegate immediately.** On every accepted client the
      loop **spawns a dedicated thread** (`client_handler`) that takes over
      that client: reading bytes from its channel, feeding the deserializer,
      and producing responses. The chapter calls creating a new thread per
      client "usually the pattern for every server process that operates on a
      blocking stream channel, no matter what the type of socket is". (For
      non-blocking stream channels a different approach, the **event loop**,
      is typically used.)
    - **Per-client context and teardown** (Code Box 20-19). `client_handler`
      builds a `client_context_t`: the client's socket descriptor goes into
      `context.addr`, the serializer is created with
      `calc_proto_ser_new()` + `calc_proto_ser_ctor(context.ser, &context,
      256)` (ring buffer size **256**), the **request** and **error**
      callbacks are registered, and a **dedicated calculator service object**
      is created and constructed. `context.write_resp = &stream_write_resp`.
      Then the read loop: `int ret = read(context.addr->sd, buffer, 128);`
      `if (ret == 0 || ret == -1) break;` bytes read are wrapped into
      `buffer_t{buffer, ret}` and fed to
      `calc_proto_ser_server_deserialize(..., NULL)`. When the loop breaks,
      the service and serializer get **dtor + delete** in the same thread,
      and `context.addr` is freed.
    - **Notice the shared I/O API.** `read` is used with a socket descriptor
      exactly as it is used with file descriptors — file descriptors and
      socket descriptors differ, "regarding I/O functions, we can use the
      same API" (the same holds for `write` and `close` further below).
    - **Stream response writer** (Code Box 20-20). `stream_write_resp`
      serializes the response via the serializer, exits hard if
      `buf.len == 0`, then `write(context->addr->sd, buf.data, buf.len)` and
      frees the buffer. `ret == -1` aborts, and — load-bearing detail —
      `ret < buf.len` ("WARN: Less bytes were written!") also aborts with exit(1):
      stream writes are not assumed complete until the full buffer is
      reported written.
  diagram:
    kind: flow
    caption: "srvcore stream core: accept once, delegate per client"
    nodes:
    - {id: ACC, label: "accept_forever(server_sd)", shape: decision}
    - {id: THR, label: "pthread_create(handler)"}
    - {id: CTX, label: "client_context_t"}
    - {id: RDL, label: "read(sd, buffer, 128)", shape: decision}
    - {id: DES, label: "deserialize bytes"}
    - {id: CLN, label: "teardown context"}
    - {id: REQ, label: "req_cb -> service"}
    - {id: WRT, label: "stream_write_resp(sd)"}
    edges:
    - {from: ACC, to: THR, label: "per client"}
    - {from: THR, to: CTX}
    - {from: CTX, to: RDL}
    - {from: RDL, to: DES, label: "ret > 0"}
    - {from: RDL, to: CLN, label: "ret 0 / -1"}
    - {from: DES, to: REQ}
    - {from: REQ, to: WRT}
    - {from: WRT, to: RDL, label: "next chunk"}
    steps:
    - {focus: [ACC], note: "accept_forever lives in srvcore - its definition stays the same for TCP stream sockets"}
    - {focus: [ACC, THR], note: "per accepted client the loop mallocs the sd and spawns a dedicated handler thread - the usual pattern for blocking stream channels"}
    - {focus: [ACC, THR, CTX], note: "the handler builds its context: serializer (ring buffer 256) with request + error callbacks, and a dedicated stateful service object"}
    - {focus: [ACC, THR, CTX, RDL], note: "then the read loop: read(context.addr->sd, buffer, 128)"}
    - {focus: [ACC, THR, CTX, RDL, DES, CLN, REQ, WRT], note: "ret > 0: bytes feed the deserializer, req_cb runs the service, stream_write_resp writes the response back; ret 0 / -1: break and tear down"}
    - {focus: [ACC, THR, CTX, RDL, DES, CLN, REQ, WRT], note: "after writing the response, the thread loops back to read the client's next chunk"}
  viz:
    kind: ascii-memory
    steps:
    - 'LISTENER LOOP: accept(server_sd) blocks -> SUCCESS: malloc int arg = client_sd -> pthread_create(client_handler)'
    - 'CLIENT HANDLER SETUP: context.addr->sd | ser = ser_new + ctor(ser, &context, 256) | set req & error callbacks | svc = service_new + ctor'
    - 'HANDLER READ LOOP: ret = read(sd, buffer, 128) -> 0 or -1 => break -> else buffer_t{buffer, ret} -> server_deserialize(ser, buf, NULL)'
    - 'RESPONSE PATH (req callback -> service): resp -> stream_write_resp -> write(sd, buf.data, buf.len) -> ret < buf.len => exit(1)'
    - 'TEARDOWN IN THREAD: svc dtor+delete | ser dtor+delete | free(context.addr) -> NULL'
    - 'WHY THREADS: accept() and read() block; one thread per client keeps other clients serviced (blocking stream server pattern)'
  checks:
  - kind: trace
    level: core
    q: Trace ownership after two clients have been accepted by the calculator's UDS stream server. What belongs in
      the target cell?
    trace:
      headers:
      - Descriptor
      - Owner thread
      - Role inside handler
      rows:
      - - server_sd
        - the accept_forever loop (main thread)
        - stays blocked in accept() for the next client
      - - client_sd A
