    - reads the channel for all clients, since one read loop serves every descriptor
    - dedicated read() calls on its own sd, feeding that client's serializer, with responses written back on the
      same sd
    - waits in accept() beside the main thread to accept the client's next connection
    - writes the shared response queue that a single reader thread drains
    answer: 1
    why: |
      Per the srvcore code, an accepted client gets its own thread whose
      handler reads THAT client's socket descriptor in a blocking loop and
      feeds the per-client serializer; responses are written on the same
      descriptor through stream_write_resp. Server_sd never leaves the
      accept loop, and no descriptor is shared between handlers.
