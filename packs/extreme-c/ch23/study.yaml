    concept: server-ring-size-256

- id: b8
  type: model
  title: 'Wire the UDS Stream Client: connect() and the Split REPL/Reader Threads'
  explain_md: |
    The UDS stream client follows the **stream connector sequence**:

    1. **Create the socket object** with the *same arguments the server used*:
       `int conn_sd = socket(AF_UNIX, SOCK_STREAM, 0);` (Code Box 20-21).
    2. **Connect to the server endpoint.** The address preparation block is
       "exactly the same as that of the server" — zeroing a
       `struct sockaddr_un`, setting `sun_family = AF_UNIX`, copying the
       server's socket file path `/tmp/calc_svc.sock` into `sun_path` — and
       then `connect(conn_sd, (struct sockaddr*)&addr, sizeof(addr))` in
       place of bind. When `connect` returns successfully it has "already
       associated the `conn_sd` socket descriptor to the opened channel";
       from then on `conn_sd` reads and writes on the channel to the server.

    The connected descriptor goes to `stream_client_loop(conn_sd)` (Code Box
    20-22, in the client common library `clicore`, shared by all stream
    clients regardless of socket type). The chapter's structure:

    - **One serializer per client process**: `context.ser =
      calc_proto_ser_new()`, `calc_proto_ser_ctor(context.ser, &context,
      128)` — ring size **128** on this side — with `resp` and `error`
      callbacks registered. "Every client process has only one serializer
      object and it makes sense. This is opposite to the server process,
      where every client had a separate serializer object."
    - **A dedicated reader thread**: `pthread_create(...,
      stream_response_reader, &context)` — because "reading from the server
      process is a blocking task and it should be done in a separate flow of
      execution".
    - **The main thread runs the REPL**: prompts `? (type quit to exit) `,
      `scanf("%s", buf)`, then `parse_client_input(buf, &req, &brk, &cnt)` —
      `brk` breaks the loop (quit), `cnt` continues (nothing to send). A real
      command is serialized with `calc_proto_ser_client_serialize` and pushed
      with `write(context.sd, ser_req.data, ser_req.len)`; `ret == -1`
      breaks the loop, and `ret < ser_req.len` prints
      `"Wrote less than anticipated!"` and breaks too — partial sends are
      treated as fatal in the client exactly as in the server. Success prints
      `The req(%d) is sent.`
    - **Graceful exit ordering**: `shutdown(conn_sd, SHUT_RD)` stops inbound
      traffic, the serializer is destroyed (`dtor` then `delete`), and only
      then does the main thread `pthread_join(reader_thread, NULL)` — "waits
      for its completion" — before printing `Bye.`
  viz:
    kind: ascii-memory
    steps:
    - 'CONNECTOR SEQ: socket(AF_UNIX, SOCK_STREAM, 0) -> sockaddr_un{AF_UNIX, /tmp/calc_svc.sock} -> connect() -> conn_sd joined to the channel'
    - 'ONE SERIALIZER: ser_new + ctor(ser, &context, 128) + set resp callback + error callback - per PROCESS, not per peer'
    - 'TWO THREADS: main = REPL (scanf -> parse_client_input -> serialize -> write) | reader thread = blocking reads of responses -> resp callback'
    - 'SEND GUARDS: write ret == -1 => break | ret < len => "Wrote less than anticipated!" + break | success => The req(%d) is sent.'
    - 'EXIT ORDER: shutdown(conn_sd, SHUT_RD) -> ser dtor+delete -> pthread_join(reader_thread) -> print Bye.'
  checks:
  - kind: mcq
    level: intro
    q: Why does the client process get away with a single serializer object while the server needed one per client?
    choices:
    - The client speaks to exactly one server through one channel, so one deserializer accumulates one response
      stream; a server faces many independent client streams at once
    - The client's serializer is shared read-only with the server, so only the server needs private instances
    - Serializer objects cost memory only on servers, because callbacks strip the state on clients
    - The client creates a new serializer per process exit, which the book counts as one
    answer: 0
    why: |
      The chapter contrasts the sides explicitly: "every client process has
      only one serializer object and it makes sense. This is opposite to the
      server process, where every client had a separate serializer object."
      The client has one channel and one peer; the deserializer's ring buffer
      tracks a single stream of responses. The server instead multiplexes
      many client channels, each needing its own accumulated bytes - which is
      why that side constructs one per accepted client (Code Box 20-19).
      Options B, C, and D invent sharing, callbacks state-stripping, and
      exit-time accounting.
    concept: client-one-serializer-asymmetry
  - kind: why-fails
    level: core
    q: The client's REPL and the response handling run in two threads. What breaks if stream_response_reader's job
      is folded back onto the main thread?
    choices:
    - "The command line freezes: the main thread would block inside read() waiting for responses whenever the server
      is slow, leaving the user unable to type or quit"
    - The response would deserialize twice per message, because both threads parse the same ring buffer
    - scanf() drains the socket buffer of response bytes, since both functions read the same stdin descriptor
    - pthread_create must always be called at least once per process or the main function returns -1
    answer: 0
    why: |
      The chapter's rationale for spawning the reader thread: "reading from
      the server process is a blocking task and it should be done in a
      separate flow of execution." The main thread owns the interactive REPL
      (prompt, scanf, serialize, write). Merging a blocking response read
      into it stalls the prompt whenever no response has arrived yet, so a
      server that is slow - or unusually talkative - makes the terminal
      unusable. Options B, C, and D invent double-parsing, descriptor sharing
      with stdin, and are contradicted by how the connect path really works.
    concept: reader-thread-repl-rationale
  - kind: order
    level: core
    q: 'Arrange the client exit sequence exactly as Code Box 20-22 executes it:'
    lines:
    - the REPL loop breaks (user typed quit or a write failed)
    - shutdown(conn_sd, SHUT_RD)
    - calc_proto_ser_dtor(context.ser), then calc_proto_ser_delete(context.ser)
    - pthread_join(reader_thread, NULL)
    - printf("Bye.\n") and return
    - the client deletes the server's socket file with unlink before dismounting
    answer_order:
    - 0
    - 1
    - 2
    - 3
    - 4
    distractor_why:
      the client deletes the server's socket file with unlink before dismounting: Distractor - the client never unlinks
        the server's socket file; the file belongs to the listener side, whose server unlinks stale copies at ITS
        startup (Code Box 20-17) and whose UDS datagram client unlinks its OWN client file (Code Box 20-26 area).
    why: |
      The exit path is strictly ordered: the REPL loop breaks, inbound
      traffic stops with shutdown(conn_sd, SHUT_RD), the serializer object is
      decommissioned (dtor then delete), the main thread joins the reader
      thread, and only then the farewell prints. There is no unlink on the
      client's way out - stream clients leave no socket file behind,
      connect() never created one for them.
    concept: client-exit-sequence-order
  - kind: trace
    level: core
    q: Trace which thread handles each step while the REPL user types 3++4 against an already-connected server.
      Fill the target cell.
    trace:
      headers:
      - Step
      - Executing thread
      - Observable console effect
      rows:
      - - user types 3++4 after the prompt
        - main (REPL) thread
        - reads command, parse_client_input builds req
      - - request serialized and written
        - main (REPL) thread
        - prints The req(0) is sent.
      - - response bytes arrive from the server
        - reader thread
        - resp callback deserializes and formats the reply
      - - reply shown to the user
        - "???"
        - "req(0) > status: OK, result: 7.000000"
    target:
      row: 3
      col: 1
    choices:
    - the reader thread, whose resp callback received the deserialized response
    - the main thread at its next scanf, which polls shared state for display
    - the kernel's socket worker, which writes the reply straight to stdout
    - whichever thread acquired the serializer's internal mutex first
    answer: 0
    why: |
      stream_client_loop spawns stream_response_reader to block on
      responses; the deserialized response object reaches the registered
      resp callback in that thread, which is where the reply's status and
      result get printed. The REPL thread only ever sends and announces the
      send. No mutex or kernel direct-write is described in the chapter.
    concept: repl-reader-thread-division
  - kind: predict
    level: core
    q: A stream client just fired req(2). The serializer produced 30 bytes but write() returned 18 with no error.
      What does stream_client_loop do, per Code Box 20-22?
    code: |
      int ret = write(context.sd, ser_req.data, ser_req.len);
      if (ret == -1) { fprintf(stderr, "Error while writing! %s\n", strerror(errno)); break; }
      if (ret < ser_req.len) { fprintf(stderr, "..."); break; }
      printf("The req(%d) is sent.\n", req.id);
    choices:
    - It retries the remaining 12 bytes automatically, since stream writes resume transparently
    - It prints The req(2) is sent. anyway, because a partial write still confirmed delivery of the message content
    - It prints Wrote less than anticipated! and breaks the loop - a partial send ends the exchange, and no announcement
      prints
    - It calls shutdown() immediately to resync the offset on the channel
    answer: 2
    why: |
      The client checks the same two failure axes the stream_write_resp
      checks on the server: ret == -1 logs and breaks, and ret < ser_req.len
      hits the fprintf for a partial write and breaks as well. The request
      announcement ("The req(%d) is sent.") only prints when the full buffer
      was reported written. There is no automatic write-completion retry and
      no resync semantic in the book.
      Options A and B contradict the guard, option D invents shutdown-based
      resync on a channel that has no offset.
    concept: short-send-fatal-branch
  - kind: fillblank
    level: core
    q: "Complete the call that stops inbound traffic on the client channel before teardown."
    code: |
      shutdown(conn_sd, ____________);
      calc_proto_ser_dtor(context.ser);
      calc_proto_ser_delete(context.ser);
      pthread_join(reader_thread, NULL);
    answer_text: SHUT_RD
    why: |
      Code Box 20-22 ends the serving loop with shutdown(conn_sd, SHUT_RD) -
      the read side of the client channel is shut down on the way out, then
      the serializer is decommissioned and the reader thread joined.
      SHUT_RDWR or SHUT_WR would change what gets disabled; the book's exit
      specifically shuts down reads only.
    concept: shutdown-shut-rd-exit
  - kind: choose-better
    level: advanced
    q: The server vanished mid-session and the client's write() starts returning -1 with the connection dead. Which
      reaction fits the chapter's programming pattern?
    choices:
    - |
      /* spin until the server reappears */
      do { ret = write(context.sd, ser_req.data, ser_req.len); } while (ret == -1);
    - |
      /* stop the exchange and leave through the normal exit path */
      if (ret == -1) { fprintf(stderr, "Error while writing! %s\n", strerror(errno)); break; }
      /* ... shutdown, dtor, delete, pthread_join, Bye. */
    answer: 1
    why: |
      The book's write guard treats -1 as an immediate stop: log the error
      and break out of the REPL loop, falling through to the ordered exit
      (shutdown SHUT_RD, serializer teardown, pthread_join, Bye). A dead
      server produces a dead channel, and spinning on write would only
      engrave the failure - every retry after the shutdown of connectivity
      fails the same way, and the book's pattern never retries a broken
      channel. Option A burns CPU in a loop the code base has no recovery
      path for.
    concept: broken-write-choose-exit-path

- id: b9
  type: model
  title: 'Serve UDS Datagrams: the Connection-less Server Without listen or accept'
  explain_md: |
    The **datagram server** works from the same two listener milestones the
    stream server used, and stops there:

    - `int server_sd = socket(AF_UNIX, SOCK_DGRAM, 0);` — everything else is
      as with the stream server; "we have used SOCK_DGRAM instead of
      SOCK_STREAM ... the other two arguments remain the same" (Code Box
      20-23).
    - Bind to the same kind of UDS endpoint (the socket file
      `/tmp/calc_svc.sock`, prepared and bound exactly like the stream
      server's — Code Box 20-24 reuses the same address block and skips the
      stale-file issue by calling `unlink` first).

    **What the datagram listener sequence does NOT have**: "there is no
    backlog associated to a datagram socket to be configured. More than
    that, there is no client-accepting phase because we can't have stream
    connections on some dedicated 1-to-1 channels."

    **Everything is per-datagram** (Code Box 20-25, `serve_forever` in
    srvcore): the server is a **single-threaded** loop that "operates on
    every datagram individually and independently". One cycle:

    1. Fresh `struct sockaddr*` plus its length are prepared, then
       `recvfrom(server_sd, buffer, sizeof(buffer), 0, sockaddr, &socklen)`
       pulls **one whole datagram**; on `-1` the server closes and exits.
       Passing those address pointers matters because datagram channels are
       shared: "we have only one channel that is being used by many parties.
       Therefore, we can lose track of the process owning a specific
       datagram" — recvfrom **captures who sent it**.
    2. A `client_context_t` is built around the captured address (`addr`
       holds `server_sd`, the sockaddr, and its length), and — per datagram —
       a **new serializer object** (`calc_proto_ser_ctor(..., 256)`, with the
       req/error callbacks) and a **new calculator service object** are
       created. The book flags this as a design conversation: one shared pair
       *could* be imagined instead, and "you might receive different opinions"
       — the shipped design gives each datagram its own objects.
    3. The datagram's bytes are deserialized with the found-flag address
       (`calc_proto_ser_server_deserialize(..., &req_found)`). The datagram
       case cannot ignore the flag: **if no complete request was found in the
       datagram, the server answers immediately with a failure response** —
       `resp.req_id = -1`, `resp.status = ERROR_INVALID_RESPONSE`, and
       `resp.result = 0.0` — through `context.write_resp`.
    4. Replies leave through `datagram_write_resp` (Code Box 20-26):
       the response is serialized, then
       `sendto(context->addr->server_sd, buf.data, buf.len, 0,
       context->addr->sockaddr, context->addr->socklen)` — **the stored
       client address steers the reply directly back to its sender**; the OS
       handles routing. The same `ret == -1` / `ret < buf.len` guards as the
       stream writer frame the send, and short sends abort.

    **Message size reality**: request and response "should be fit into a
    single datagram" — messages cannot be split across two, so servers and
    clients cannot absorb partial fragments. Datagram UDS is flexible about
    size because things happen through the kernel; network datagrams (UDP)
    are instead "bound to the configuration of the network".
  viz:
    kind: ascii-memory
    steps:
    - 'SETUP PAIR: socket(AF_UNIX, SOCK_DGRAM, 0) + bind(/tmp/calc_svc.sock) - and STOP: no listen() (no backlog to size), no accept() (no 1-to-1 connections)'
    - 'RECVFROM CAPTURES SENDER: fresh sockaddr + socklen per datagram -> kernel fills WHO sent this datagram'
    - 'PER-DATAGRAM OBJECTS: ser_new + ctor(..., 256) + callbacks | svc_new + ctor - created and destroyed per datagram'
    - 'DESERIALIZE WITH FLAG: server_deserialize(..., &req_found); req_found FALSE => resp{req_id = -1, status = ERROR_INVALID_RESPONSE, result = 0.0} sent anyway'
    - 'REPLY BY CAPTURED ADDRESS: datagram_write_resp -> sendto(server_sd, buf.data, buf.len, 0, sockaddr, socklen) -> OS routes back to sender'
    - 'SINGLE THRESHOLD: one thread; per-datagram message must arrive complete inside one datagram'
  checks:
  - kind: mcq
    level: intro
    q: Which listener milestones does the UDS datagram calculator server perform — and which two does it skip?
    choices:
    - socket() + bind() only; there is no backlog to configure with listen() and no client-accepting phase
    - socket() + bind() + listen(); accept() is skipped because datagram channels are connection-less
    - socket() + connect() only, since a datagram server also acts as connector toward its clients
    - socket() + bind() + accept(); only listen() is skipped because the backlog lives inside recvfrom()
    answer: 0
    why: |
      The chapter is explicit: for a datagram listener "these steps [socket
      creation, binding] were the only ones to be performed, there is no
      backlog associated to a datagram socket to be configured. More than
      that, there is no client-accepting phase because we can't have stream
      connections on some dedicated 1-to-1 channels." Code Box 20-24's main
      ends with serve_forever right after bind — no listen, no accept.
      Options B and D half-skip, option C mislabels the server as connector.
    concept: datagram-listener-skip-listen-accept
  - kind: why-fails
    level: core
    q: The datagram server drops the sockaddr and socklen pointers it was given and replies by reconstructing a
      client address from a hardcoded path. Why does the chapter's serve_forever design refuse that shortcut?
    choices:
    - Kernel datagrams self-deliver, so no sender handling is needed in a correct implementation
    - "Datagram channels have no dedicated peers: many parties share the one channel, so recvfrom's captured address
      is the only reliable record of which client this datagram came from — and that stored address is what sendto
      must use to reply"
    - The hardcoded path is valid; the project only avoids it to save strlen() calls on the hot path
    - Reconstructing addresses is required because recvfrom() zeroes its sockaddr argument before filling it
    answer: 1
    why: |
      The chapter motivates recvfrom()/sendto() precisely here: on a datagram
      socket "we have only one channel that is being used by many parties.
      Therefore, we can lose track of the process owning a specific
      datagram. These functions can keep track of and send the datagram back
      to the desired process." serve_forever stores the freshly filled
      sockaddr plus socklen in the per-datagram context, and
      datagram_write_resp sends the reply through that exact address pair.
      Option C trivializes a real correctness point (option A contradicts the
      design; option D invents zeroing-by-contract).
    concept: captured-sender-address-necessity
  - kind: predict
    level: advanced
    q: A datagram from a buggy client carries "1000#ADD" — no '$' anywhere. What does the server send back through
      the serializer-and-datagram write path?
    code: |
      calc_proto_ser_server_deserialize(context.ser, buf, &req_found);
      if (!req_found) {
        struct calc_proto_resp_t resp;
        resp.req_id = -1;
        resp.status = ERROR_INVALID_RESPONSE;
        resp.result = 0.0;
        context.write_resp(&context, &resp);
      }
    choices:
    - the server stays silent; incomplete datagrams are dropped without any reply
    - "-1#0#0$ — the serializer maps a failed parse back to the OK status with req id -1"
    - "-1#201#0$ — status field carries the serializer's invalid-response error code with req id -1"
    - "1000#201#0$ — the server reuses the request's id field so the client can match the error"
    answer: 2
    why: |
      Code Box 20-25 fills the failure response exactly: req_id = -1, status
      = ERROR_INVALID_RESPONSE (the serializer-library constant 201 from the
      201-family in the API header), result = 0.0. The response serializer
      then writes <req_id>#<status>#<result>$ - so the wire carries
      -1#201#0$. The server answers rather than dropping silently, and the
      req_id is -1 precisely because no request object ever came to being
      that an ID could be taken from.
      Option B blurs error status 0; option D has no request id to reuse.
    concept: req-not-found-error-response
  - kind: trace
    level: core
    q: Trace object churn in serve_forever across three arriving datagrams from three different clients. Fill the
      target cell.
    trace:
      headers:
      - Datagram
      - Fresh objects created
      - Affairs of the cycle
      rows:
      - - datagram 1 (client A)
        - 1 serializer + 1 service
        - recvfrom captures A's address; reply sent back to it
      - - datagram 2 (client B)
        - 1 serializer + 1 service
        - same cycle against B's captured address
      - - datagram 3 (client B again)
        - "???"
        - same cycle against B's captured address again
    target:
      row: 2
      col: 1
    choices:
    - zero; client B's serializer and service from datagram 2 are reused for its second datagram
    - one serializer and one service, fresh for this datagram even though the client is the same as before
    - three objects per thread that accumulate as datagrams arrive
    - a shared pair created once at serve_forever startup and never again
    answer: 1
    why: |
      The chapter's design is per-datagram: inside the loop "every datagram
      has its own serializer object and its own service object" - created,
      used, and destroyed each cycle, identical machinery every time no
      matter which client sent the datagram. The book treats the alternative
      (one shared pair) as a debatable design conversation you could think
      about, not the shipped behavior.
      Options A, C, and D contradict the per-datagram lifecycle the code and
      the prose both describe.
    concept: per-datagram-object-churn-trace
  - kind: mcq
    level: core
    q: Why can the calculator's request and response messages not be split across two datagrams?
    choices:
    - Splitting would exceed the serializer's ring buffer size of 256 bytes
    - "A datagram is the unit of reception: what lands is one whole message, and a message that doesn't fit a single
      datagram cannot be reassembled across datagrams by this protocol's handling"
    - The kernel checksums each datagram, and a split message would compute two conflicting checksums
    - UDS datagrams cap at 64 bytes, and the protocol's messages are engineered below 64 bytes
    answer: 1
    why: |
      The chapter states the constraint from the channel side: "the request
      and response messages should be fit into a single datagram. Otherwise,
      they cannot be split between two datagrams and the server or client
      cannot handle the message." serve_forever receives exactly one datagram
      per recvfrom and processes it whole. (The 64-byte buffer in the code
      is the project's receive buffer, not a UDS datagram cap; and the ring
      size governs deserialization, not datagram splitting.)
      Options A, C, and D borrow wrong limits for why messages must arrive
      whole.
    concept: single-datagram-message-fit
  - kind: spot-bug
    level: advanced
    q: A rewritten serve_forever runs but every reply lands nowhere. Which line carries the defect?
    code: |
      void serve_forever(int server_sd) {
        char buffer[64];
        while (1) {
          struct sockaddr* sockaddr = sockaddr_new();
          socklen_t socklen = sockaddr_sizeof();
          int read_nr_bytes = recvfrom(server_sd, buffer, sizeof(buffer),
                                       0, sockaddr, &socklen);
          if (read_nr_bytes == -1) { close(server_sd); fprintf(stderr, "..."); exit(1); }
          struct client_context_t context;
          context.addr = (struct client_addr_t*)malloc(sizeof(struct client_addr_t));
          context.addr->server_sd = server_sd;
          context.addr->sockaddr = sockaddr;
          context.addr->socklen = socklen;
          context.ser = calc_proto_ser_new();
          calc_proto_ser_ctor(context.ser, &context, 256);
          calc_proto_ser_set_req_callback(context.ser, request_callback);
          /* Line 18: payload length taken from the wrong variable */
          context.buf.len = socklen;   /* BUG: must be read_nr_bytes */
          context.buf.data = buffer;
          bool_t req_found = FALSE;
          calc_proto_ser_server_deserialize(context.ser, context.buf, &req_found);
          /* ... svc setup, write_resp, per-datagram teardown per Code Box 20-25 ... */
        }
      }
    diagnostic_log: |
      Every reply deserializes as invalid: the deserializer sees buffers of
      constant length regardless of which datagram arrived.
    target_line: 18
    choices:
    - "Line 18: buffer length must come from recvfrom's return value (read_nr_bytes), not from the sockaddr size -
      socklen describes the captured address, not the datagram payload"
    - "Line 14: the serializer object must be created once before the loop, not per datagram"
    - "Line 6: the symbolic 0 flag must be 1, or recvfrom will not block"
    answer: 0
    why: |
      Code Box 20-25 stores the payload as buf.data = buffer with buf.len =
      read_nr_bytes - recvfrom's RETURN value names how many payload bytes
      landed. Using socklen (the address structure's length that recvfrom
      filled in) as the buffer length mislabels every datagram: the
      deserializer sees an address-sized buffer instead of the real message,
      so parses go haywire and replies break. The per-datagram serializer is
      the book's own design (fresh objects per cycle, per Code Box 20-25 -
      not a defect), and the flags argument stays 0 (blocking behavior does
      not need a 1).
    concept: buffer-length-from-recvfrom-return
  - kind: choose-better
    level: advanced
    q: Serve_forever builds fresh serializer and service objects for every datagram. A reviewer proposes one shared
      pair constructed once before the loop. Judgment per the chapter and the calculator's needs?
    choices:
    - |
      /* shared once - fewer new/delete per datagram */
      calc_proto_ser_ctor(shared_ser, owner, 256);
      svc = calc_service_new(); calc_service_ctor(svc);
      while (1) { recvfrom(...); /* reuse both */ }
    - |
      /* per-datagram, as the book ships it */
      while (1) { recvfrom(...);
        ser = calc_proto_ser_new(); calc_proto_ser_ctor(ser, owner, 256);
        svc = calc_service_new(); calc_service_ctor(svc);
        /* serve; then dtor+delete both */
      }
    answer: 1
    why: |
      The book notes the pair IS rebuilt per datagram: "Note that every
      datagram has its own serializer object and its own service object",
      and it frames the one-pair alternative as something to think about with
      "different opinions" - not as the shipped design. For THIS protocol
      the per-datagram choice also keeps a datagram's parse state from
      leaking into the next datagram on the shared channel: with one shared
      service, a second client's ADDM would fold its operands onto whatever
      memory the previous client's datagram left behind. The cost is object
      churn per datagram; the benefit is datagram independence.
      Option A buys speed at the price of exactly the cross-datagram
      contamination the per-datagram design avoids.
    concept: shared-versus-per-datagram-objects

- id: b10
  type: model
  title: 'Bind the UDS Datagram Client: the Self-Address Book the Channel Demands'
  explain_md: |
    The UDS **datagram client** starts like the stream client but with a
    twist the chapter calls out as **unique and specific to datagram clients
    connecting to UDS endpoints** (Code Box 20-26 area, `main` of
    `client/unix/datagram/main.c`):

    *The client must bind a socket file, "just like the server program", so
    incoming datagrams have somewhere to be directed — and it must bind a
    DIFFERENT file, not the server's.* Two socket files, two roles:

    1. `char server_sock_file[] = "/tmp/calc_svc.sock";`
       `char client_sock_file[] = "/tmp/calc_cli.sock";` — both paths live in
       the client's main.
    2. **Create the socket**: `int conn_sd = socket(AF_UNIX, SOCK_DGRAM, 0);`
    3. **Bind the CLIENT socket file first**: `unlink(client_sock_file)`,
       prepare a `sockaddr_un` with `sun_family = AF_UNIX` and
       `client_sock_file`, then
       `bind(conn_sd, (struct sockaddr*)&addr, sizeof(addr))`. This is the
       step a stream client never performs.
    4. **Connect to the server endpoint**: prepare the address block again —
       this time with `server_sock_file` — and
       `connect(conn_sd, (struct sockaddr*)&addr, sizeof(addr))`, then hand
       `conn_sd` to `datagram_client_loop(conn_sd)`.

    **Why the client-side bind is mandatory.** The server needs an address to
    send the response back to: if "the datagram client doesn't bind a socket
    file, there is no endpoint bound to the client socket file" — the
    reply's destination simply does not exist, so responses cannot reach the
    client. **Why network sockets don't share the problem**: there, "a client
    always has a corresponding socket descriptor that is bound to an IP
    address and a port" — the kernel's endpoint machinery gives every client
    a return address without the application binding one by path. (The UDP
    client later in the chapter, for instance, calls no bind at all.)

    **Functionally the loop mirrors the stream client**: the same overall
    structure, command line, and serializer/deserializer usage — with the
    datagram differences: `recvfrom`/`sendto` are used to transmit instead of
    `read`/`write`, for the same sender-identity reason the server side has,
    and every message must fit into a single datagram.
  viz:
    kind: ascii-memory
    steps:
    - 'TWO FILES, TWO ROLES: /tmp/calc_cli.sock = the client''s own return address (client MUST bind it) | /tmp/calc_svc.sock = the server''s door (client connects to it)'
    - 'CLIENT SEQ: socket(AF_UNIX, SOCK_DGRAM) -> unlink(client file) -> bind(client_sd to its OWN file) -> connect(server_sd''s file) -> datagram_client_loop'
    - 'NO-BIND FAILURE: client never binds => no endpoint exists at any path => the server''s reply has no destination => responses never arrive'
    - 'NETWORK DIFFERENCE: UDP clients skip the bind - their descriptors are auto-bound to an IP + port, so a return address always exists'
    - 'I/O SHIFT: datagram client talks with sendto()/recvfrom() (not read/write) and every request/response fits one datagram'
  checks:
  - kind: order
    level: core
    q: 'Arrange the datagram UDS client''s initialization exactly as its main function (Code Box 20-26 area) does it:'
    lines:
    - int conn_sd = socket(AF_UNIX, SOCK_DGRAM, 0);
    - unlink(client_sock_file) then bind conn_sd to /tmp/calc_cli.sock
    - prepare the server address and connect(conn_sd, server addr)
    - datagram_client_loop(conn_sd)
    - the client binds /tmp/calc_svc.sock to catch the server's traffic in advance
    answer_order:
    - 0
    - 1
    - 2
    - 3
    distractor_why:
      the client binds /tmp/calc_svc.sock to catch the server's traffic in advance: Distractor - the server's socket
        file belongs to the server's bind; a client binding it would collide with a live listener (bind succeeds only
        if no other socket object is bound to the same file).
    why: |
      The main function runs exactly this order: create the datagram socket,
      unlink the stale client file and bind the client's OWN socket file
      (the unique twist of this section), prepare the SERVER's address and
      connect to the server's endpoint, and finally start
      datagram_client_loop. The client never binds the server's file - the
      server already owns it.
    concept: datagram-client-self-bind-order
  - kind: predict
    level: core
    q: The datagram client skipped its bind and simply sent "1000#ADD#1.5#5.6$" toward the server. Per the chapter's
      reasoning, what happens inside the server's serve_forever for this datagram?
    choices:
    - recvfrom returns the payload with a usable empty address, so the reply still finds the client by request id
    - The datagram cannot be delivered at all, because an unbound Unix datagram socket has no filesystem return
      address for the kernel to route responses to
    - recvfrom blocks forever on the server side, since its buffer refuses datagrams from unbound clients
    - The kernel assigns the client a fresh socket file automatically, and the server answers through it
    answer: 1
    why: |
      The chapter pins the failure precisely: the server "needs an address to
      send the response back to, and if the datagram client doesn't bind a
      socket file, there is no endpoint bound to the client socket file".
      Unlike network sockets - where "a client always has a corresponding
      socket descriptor that is bound to an IP address and a port, so this
      problem cannot occur" - AF_UNIX offers no automatic endpoint. The bound
      client file is what makes replies deliverable.
      Option A invents addressless delivery; option C invents a receive-side
      refusal; option D grants the exact auto-assignment the chapter denies.
    concept: unbound-client-reply-vanishes
  - kind: mcq
    level: core
    q: Which pair does the UDS datagram client actually use, per Code Box 20-26 area?
    choices:
    - It binds its own /tmp/calc_cli.sock and connects to the server's /tmp/calc_svc.sock
    - It binds the server's /tmp/calc_svc.sock and never calls connect, since datagram sockets need no connection
    - It binds no file at all but registers its pathname inside the serializer's context
    - It binds /tmp/calc_cli.sock only when the server responds, and never to send
    answer: 0
    why: |
      The main holds both names and performs both operations: after
      socket(AF_UNIX, SOCK_DGRAM, 0), "the client is required to bind a
      socket file" - to client_sock_file (/tmp/calc_cli.sock), its OWN file -
      and then it prepares the server address (server_sock_file,
      /tmp/calc_svc.sock) and calls connect toward the server endpoint
      before datagram_client_loop takes over. bind-before-connect on its own
      file is what makes replies deliverable.
      The other options swap files, skip the bind outright, or invent
      deferred binding.
    concept: client-binds-own-connects-server
  - kind: eipe
    level: advanced
    q: In one sentence, why does a UDP client escape the self-bind obligation that its UDS datagram twin cannot?
    choices:
    - UDP's responses ride the same channel back, so addresses are irrelevant to delivery
    - Network client descriptors are already bound to an IP address and a port on the kernel side, so a return
      address always exists without the application binding one by path
    - UDP servers broadcast, so their replies reach unbound clients through the broadcast table
    - The UDP protocol header carries the client's process ID, which replaces socket files
    answer: 1
    why: |
      The chapter ties both halves together: the UDS datagram client MUST
      bind because without the filesystem endpoint "there is no endpoint
      bound to the client socket file" to reply to - while "regarding network
      sockets, a client always has a corresponding socket descriptor that is
      bound to an IP address and a port, so this problem cannot occur" - the
      kernel's address machinery supplies the return route the filesystem
      path would have supplied. That is exactly what the UDP client relies on
      when it calls sendto without ever binding.
      Options A, C, and D channel-hijack, broadcast, and process-identity the
      chapter never claims.
    concept: udp-client-auto-address-contrast
  - kind: trace
    level: core
    q: Trace the two socket files across one full client-server session, including the client's own cleanup. Fill
      the target cell.
    code: |
      /* client main (no code shown): server_sock_file = /tmp/calc_svc.sock;
         client_sock_file = /tmp/calc_cli.sock; client unlinks + binds its own
         file, connects to the server's file, then loops. */
    trace:
      headers:
      - Phase
      - /tmp/calc_svc.sock
      - /tmp/calc_cli.sock
      rows:
      - - server starts (unlink + bind)
        - created, bound to server_sd
        - (not involved yet)
      - - client starts (unlink + bind + connect)
        - still the server's door
        - created, bound to client's own sd
      - - client quits and unlinks its file
        - stays alive; the server's door remains for its next clients
        - "???"
    target:
      row: 2
      col: 2
    choices:
    - removed, since the client owns and unlinks only its OWN socket file, leaving the server's untouched
    - removed together with the server's file, since connect ties both records to one lifecycle
    - kept, because unbound descriptors leak socket files into /tmp until reboot
    - renamed to /tmp/calc_svc.sock, since the client adopts the server's address on exit
    answer: 0
    why: |
      The client deliberately unlinks the file IT created (the client self
      bind exists precisely so the CLIENT has a filesystem record of its own
      address); the server's file is never the client's to remove - the
      server manages it (unlink at its own startup, Code Box 20-17/20-24).
      Ownership follows creation: each socket file dies by the hand that
      bound it, and the server's door stays open for the next client.
      Options B, C, and D invent shared lifecycles, leaks, and renaming.
    concept: socket-file-ownership-trace
  - kind: spot-bug
    level: advanced
    q: A copy-paste refactor left the datagram client binding the server's file. Which line carries the defect, and
      what does the chapter predict?
    code: |
      int main(int argc, char** argv) {
        char server_sock_file[] = "/tmp/calc_svc.sock";
        char client_sock_file[] = "/tmp/calc_cli.sock";
        int conn_sd = socket(AF_UNIX, SOCK_DGRAM, 0);
        /* Line 6: the stale-file chore, aimed at the wrong file */
        unlink(server_sock_file);        /* BUG: wrong file */
        struct sockaddr_un addr;
        memset(&addr, 0, sizeof(addr));
        addr.sun_family = AF_UNIX;
        strncpy(addr.sun_path, server_sock_file, sizeof(addr.sun_path) - 1);
        int result = bind(conn_sd, (struct sockaddr*)&addr, sizeof(addr));
        /* ... connect(server_sock_file) and datagram_client_loop(conn_sd) ... */
      }
    diagnostic_log: |
      bind failed: Address already in use   (with the server running)
    target_line: 6
    choices:
    - "Line 6 + the bind below: the client must unlink+bind its OWN client_sock_file (/tmp/calc_cli.sock); binding
      the server's file fails while the server holds it, and even when free it would misdirect replies"
    - "Line 4: the second socket file variable is wasted; one file suffices for both roles"
    - "Line 10: strncpy must leave room for two null terminators, so - 2 is the safe cap"
    answer: 0
    why: |
      The chapter's datagram client binds a DIFFERENT socket file, "not the
      server's socket file": the client self-binds client_sock_file and then
      connects to server_sock_file. Targeting the server's path breaks twice
      over - first at bind time with EADDRINUSE whenever the live server
      already holds that node (bind "succeeds only if there is no other
      socket object bound to the same socket file"), and conceptually
      whenever the file were free, because replies would then be steered to
      the wrong endpoint. Options B and C invent single-file designs and
      double terminators.
    concept: client-binding-wrong-file-bug
  - kind: fillblank
    level: advanced
    q: "Complete the send call the datagram client uses to push a serialized request toward the server's endpoint."
    code: |
      /* inside datagram_client_loop, per request */
      int ret = ____________(conn_sd, ser_req.data, ser_req.len,
                             0, (struct sockaddr*)&srv_addr, sizeof(srv_addr));
    answer_text: sendto
    why: |
      The datagram client switches from the stream client's write() to
      sendto(): the function carries the destination address, which is how a
      message on a shared connection-less channel states where it is headed
      (read/write style calls keep no destination context). recvfrom is its
      read-side twin for responses. Note the single call also preserves the
      guard pattern ret == -1 / ret < len before announcing the send.
    concept: datagram-client-sendto-call
- id: b11
  type: syntax
  title: "Swap in AF_INET: the TCP Server and Client Change Only Their Mains"
  explain_md: |
    Moving the calculator from UDS stream channels to **network (TCP) stream
    channels** is intentionally small. The chapter lists exactly two
    differences for a TCP server, and the code confirms them:

    1. **A different address family**: `AF_INET` instead of `AF_UNIX` in the
       `socket` call — "it simply refers to any channel established on top of
       a network connection".
    2. **A different structure for the socket address** used for binding:
       `struct sockaddr_in` instead of `sockaddr_un`. Its preparation (Code
       Box 20-27):
       ```c
       struct sockaddr_in addr;
       memset(&addr, 0, sizeof(addr));
       addr.sin_family = AF_INET;
       addr.sin_addr.s_addr = INADDR_ANY;
       addr.sin_port = htons(6666);
       ```
       The project fixes the TCP port at **6666**, and `INADDR_ANY` lets the
       server answer on any local network interface.

    **Everything else is inherited unchanged**: `listen` is used the same,
    "even the same `accept_forever` function has been called to handle the
    incoming connections", and because "a TCP socket is a stream socket, it
    inherits all the properties from a stream socket; therefore, it can be
    used just like any other stream socket" — the same `read`, `write`, and
    `close` functions, the same `client_handler` machinery, the same
    `stream_write_resp`.

    The **TCP client** mirrors this minimalism (Code Box 20-27's client
    main): `socket(AF_INET, SOCK_STREAM, 0)`, then the address needs a real
    IP — the main first resolves the **hostname** ("find the IP address
    behind the hostname"), and the entry's address bytes drop straight into
    the structure: `addr.sin_addr = *((struct in_addr*)host_entry->h_addr);`
    followed by the same `addr.sin_port = htons(6666);` and
    `stream_client_loop(conn_sd)` — "which is part of the client common
    library ... shared between UDS and TCP sockets".

    The chapter draws the conclusion explicitly: "the `main` function in the
    client and server programs is the only code that changes when moving
    from UDS to network sockets." That is the payoff of the two common
    libraries — "when we can use the same code for two different scenarios,
    it is always best to extract it as a library and reuse it in the
    scenarios."
  viz:
    kind: ascii-memory
    steps:
    - 'CHANGE 1: socket(AF_UNIX -> AF_INET, SOCK_STREAM, 0) - the family names the endpoint universe (files -> IP networks)'
    - 'CHANGE 2: sockaddr_un{sun_path} -> sockaddr_in{sin_family, sin_addr.s_addr, sin_port} - the address fields the kernel parses'
    - 'SERVER VALUES: sin_family = AF_INET | sin_addr.s_addr = INADDR_ANY (every local interface) | sin_port = htons(6666)'
    - 'CLIENT VALUES: sin_addr = *(struct in_addr*)host_entry->h_addr (resolved hostname IP) | same sin_port = htons(6666)'
    - 'UNCHANGED: bind/connect wiring, listen backlog, accept_forever, client_handler, stream_write_resp, stream_client_loop, read/write/close'
  checks:
  - kind: mcq
    level: core
    q: Which two changes turn the calculator's UDS stream server main into a TCP server main, per the chapter?
    choices:
    - The address family (AF_INET) inside the socket call and the socket address structure (sockaddr_in) prepared for
      binding
    - The serializer constructor must switch quadrants, because TCP deserializes responses on the server
    - The listener sequence gains a connect step before listen, since TCP needs a connection first
    - Reads are replaced by recvfrom/sendto, since TCP frames every write as a datagram
    answer: 0
    why: |
      The chapter's TCP server section states the difference plainly: the
      server "is different from a stream server listening on a UDS endpoint
      in two ways: firstly, it specifies a different address family, AF_INET
      instead of AF_UNIX, when calling the socket function. And secondly, it
      uses a different structure for the socket address required for
      binding." Everything else stays: listen is used the same and even the
      same accept_forever handles incoming connections.
      Option B scrambles the serializer API; option C invents a connect step
