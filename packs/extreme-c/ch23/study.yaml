  checks:
  - kind: mcq
    level: intro
    q: The calculator source tree separates `calcser`, `calcsvc`, `srvcore`, and `clicore`. Which pairing of directory and library is correct?
    choices:
    - /calcser holds the serializer/deserializer sources; it builds into libcalcser.a and dictates the application protocol used between client and server
    - /calcsvc holds transport code for all four server skins; it builds into libsrvcore.a and links every server
    - /server/srvcore contains the calculator's arithmetic engine; it builds into libcalcsvc.a and is socket-agnostic
    - /client/clicore contains the client command-line parser only for UDS clients; TCP clients get their own copy
    answer: 0
    why: |
      This section's hierarchy maps /calcser to the serializer/deserializer
      library, calls it the library that *dictates the application protocol*
      between the calculator client and server, and says it eventually builds
      into the static library file libcalcser.a. Option B misassigns the
      transport-common server library (that is /server/srvcore →
      libsrvcore.a); option C misassigns the arithmetic engine (that is
      /calcsvc → libcalcsvc.a); option D contradicts the point of clicore —
      it is common to all clients regardless of socket type.
    concept: hierarchy-library-mapping
  - kind: why-fails
    level: intro
    q: Two processes can be connected by a socket and can transmit bytes back and forth, yet a well-defined application protocol is still required. Why is the connection alone not enough for the calculator client and server to work?
    choices:
    - Sockets transmit at most one message per process pair, so a protocol is needed to multiplex requests
    - Being connected and transmitting data only means bytes can flow; without a well-defined application protocol the two parties cannot understand each other
    - The kernel drops unprotocolled sockets after their first successful exchange by design
    - Application protocols exist to encrypt the byte stream; without one the transmission stays in plaintext
    answer: 1
    why: |
      The rule is plain: "without a well-defined application
      protocol, the two parties cannot communicate. They can be connected and
      transmit data because that's the functionality that the socket
      programming offers, but they cannot understand each other." Connecting
      and transmitting is transport; agreeing on message grammar is protocol,
      which ordinary examples skip because they show only simple, one-time
      communication scenarios.
      Options A, C, and D invent multiplexing, kernel eviction, and encryption
      rules that no rule claims.
    concept: connection-without-protocol-failure
  - kind: predict
    level: intro
    q: 'You bring up the UDS stream server in terminal 1 and the UDS stream client in terminal 2. Reproduce the client''s console: what does the client print for the very first request 3++4?'
    code: |
      ? (type quit to exit) 3++4
      <line A: the client announces the send>
      <line B: the client shows the server's reply>
    choices:
    - |
      The req(1) is sent.
      req(1) > status: INVALID_REQUEST, result: 0.000000
    - |
      The req(0) is sent.
      req(0) > status: OK, result: 7.000000
    - |
      The req(0) is sent.
      req(0) > status: OK, result: 7
    - |
      The req(1) is sent.
      req(1) > status: OK, result: 7.000000
    answer: 1
    why: |
      The exact console is: the first request is req(0)
      (IDs start at zero), the client prints "The req(0) is sent.", and the
      reply line reads "req(0) > status: OK, result: 7.000000" — status OK
      plus the result formatted with six decimals (3 + 4 = 7).
      Option A bumps the ID and invents a failure status; option C drops the
      six-decimal formatting; option D starts IDs at one.
    concept: client-console-first-request
  - kind: order
    level: core
    q: 'Arrange the steps of building and exercising the calculator project from a clean checkout:'
    lines:
    - git clone <repo>, then cd into the calculator project root
    - mkdir -p build, cd build, cmake .., make
    - ./server/unix/stream/unix_stream_calc_server (terminal 1)
    - ./client/unix/stream/unix_stream_calc_client (terminal 2)
    - '? (type quit to exit) 3++4 ... mem ... 5++4'
    - rm -rf build, cmake --fresh ..
    answer_order:
    - 0
    - 1
    - 2
    - 3
    - 4
    distractor_why:
      rm -rf build, cmake --fresh ..: The denylisted clean-rebuild line is a distractor - this section's flow builds once with cmake .. and make; nothing in the sequence re-cleans freshly cloned sources.
    why: |
      The build/run section walks exactly this order: clone and enter the
      project, build with CMake — mkdir
      -p build; cd build; cmake ..; make — then run the
      server first in one terminal, start the client in
      another, and only then type requests, ending with quit. The server must be up before the client connects.
    concept: build-run-sequence
  - kind: choose-better
    level: core
    q: Instead of writing a separate throwaway demo for each socket variety, the calculator project extracts common code into `srvcore` and `clicore`. Which design is intended, and what benefit does that extraction provide?
    choices:
    - |
      /* one throwaway main per socket type - each demo self-contained */
      int main(void) { /* AF_UNIX stream demo, from scratch */ }
    - |
      /* common code extracted once into static libraries, skins reuse it */
      /* server/{tcp,udp,unix/*},main.c call accept_forever()/serve_forever() from libsrvcore */
      /* client/*,main.c call stream_client_loop()/datagram_client_loop() from libclicore */
    answer: 1
    why: |
      The project's goal is explicit: "if you are
      going to support various types of sockets, together with various types
      of channels, it is better to extract the common part and write it once"
      — that is the approach the calculator project takes. Writing the common
      parts once reduces the amount of code significantly and shows the
      boundaries that are common between the various types of sockets and
      channels, which is exactly what libraries like libsrvcore.a and
      libclicore.a carry.
      Option A duplicates listener and connector logic four times and hides
      exactly the common boundaries the design makes visible.
    concept: extract-common-parts-goal
- id: b3
  type: syntax
  title: 'Speak the Calculator Protocol: Requests, Responses, and the # / $ Grammar'
  explain_md: |
    Any two processes that communicate must obey an **application protocol** —
    custom, like the calculator's, or well-known like HTTP. The protocol calls
    its protocol **the calculator protocol** and fixes three structural facts
    about it:

    - It is **variable-length**: every message has its own length, and every
      message "should be separated from the next one using a delimiter".
    - There is **one type of request message and one type of response message**.
    - It is **textual**: only alphanumerical characters plus a few other
      characters are valid — the messages are human-readable.

    **Request message** (request header, `calcser/calc_proto_req.h`) — four
    fields: **request ID** (`id`, int32), **method** (`method_t`), and two
    operands (`operand1`, `operand2`, both double). Every request has a unique
    ID and **the server uses this ID to relate a response to its corresponding
    request**. The `method_t` enumeration lists the operations — a `NONE`
    sentinel plus the nine methods the protocol defines: `GETMEM`, `RESMEM`,
    `ADD`, `ADDM`, `SUB`, `SUBM`, `MUL`, `MULM`, `DIV`.

    **Memory methods.** The calculator keeps an internal memory, so addition,
    subtraction, and multiplication get memory-taking variants: `ADD` simply
    adds two float numbers, while `ADDM` "adds those two numbers together with
    the value stored in the internal memory, and finally it updates the value
    in the memory for further use" — like the **+M** button on a desktop
    calculator. `GETMEM`/`RESMEM` serve "reading and resetting the
    calculator's internal memory". Division cannot be performed on the
    internal memory — that is why it has no `DIVM` variant.

    To create a request with ID `1000`, method `ADD`, operands `1.5` and
    `5.6`, the client fills a `calc_proto_req_t` object (request object). The
    serializer then produces the wire message (request wire format):

        1000#ADD#1.5#5.6$

    The **`#` character is the field delimiter** and the **`$` character is
    the message separator**; "each request message has exactly four fields".

    **Response message** — three fields: `req_id`,
    `status`, `result`. The response `req_id` names the request being
    answered. `status_t` is an int with the protocol's constants:
    `STATUS_OK 0`, `STATUS_INVALID_REQUEST 1`, `STATUS_INVALID_METHOD 2`,
    `STATUS_INVALID_OPERAND 3`, `STATUS_DIV_BY_ZERO 4`,
    `STATUS_INTERNAL_ERROR 20` — "in the case of failure, it is a non-zero
    number, and its meaning is described ... in the calculator protocol". A
    response with ID 1000, status OK, result 7.1 serializes to `1000#0#7.1$`.
  example:
    lang: c
    adapted: false
    subgoals:
    - label: Include-guard and only standard dependency (<stdint.h>)
      lines:
      - 1
      - 2
      - 3
    - label: 'method_t enum: NONE sentinel plus the nine protocol methods'
      lines:
      - 5
      - 6
      - 7
      - 8
      - 9
      - 10
      - 11
      - 12
    - label: 'Request object: four fields for id, method, operand1, operand2'
      lines:
      - 14
      - 15
      - 16
      - 17
      - 18
      - 19
    - label: Name-string converters the serializer relies on
      lines:
      - 21
      - 22
    code: |
      #ifndef CALC_PROTO_REQ_H
      #define CALC_PROTO_REQ_H
      #include <stdint.h>

      typedef enum {
        NONE,
        GETMEM, RESMEM,
        ADD, ADDM,
        SUB, SUBM,
        MUL, MULM,
        DIV
      } method_t;

      struct calc_proto_req_t {
        int32_t id;
        method_t method;
        double operand1;
        double operand2;
      };

      method_t str_to_method(const char*);
      const char* method_to_str(method_t);

      #endif
    explain_md: '`calc_proto_req_t` is the request object: a 32-bit request id, a `method_t` enum, and two `double` operands. `str_to_method` and `method_to_str` translate between the enum and the wire names the serializer uses. Keeping the object separate from its serialized form lets the same request travel over any channel.'
  viz:
    kind: ascii-memory
    steps:
    - 'REQUEST WIRE: [id]<#>[method]<#>[operand1]<#>[operand2]<$> e.g. 1000#ADD#1.5#5.6$ - four fields, terminated by $'
    - 'RESPONSE WIRE: [req_id]<#>[status]<#>[result]<$> e.g. 1000#0#7.1$ - # splits fields, $ ends the message'
    - 'DELIMITER ROLES: # = field delimiter inside one message | $ = message separator between messages'
    - 'STATUS CODES: 0 OK | 1 INVALID_REQUEST | 2 INVALID_METHOD | 3 INVALID_OPERAND | 4 DIV_BY_ZERO | 20 INTERNAL_ERROR'
  checks:
  - kind: predict
    level: intro
    q: The request wire grammar is `<id>#<method>#<operand1>#<operand2>$`, where `#` separates fields and `$` ends the message. The client fills a request object with id 42, method SUB, operand1 9.5, operand2 4.0. What exact text does the client-side serializer put on the wire?
    code: |
      struct calc_proto_req_t req;
      req.id = 42;
      req.method = SUB;
      req.operand1 = 9.5;
      req.operand2 = 4.0;
      /* client-side serialization -> ??? */
    choices:
    - 42#SUB#9.5#4.0
    - 42#SUB#9.5#4.0$
    - 42#SUB#9.5#4.0#
    - SUB#42#9.5#4.0$
    answer: 1
    why: |
      The request wire format is id, method, operand1,
      operand2 joined by the field delimiter # and terminated by the message
      separator $. So 42 -> method string SUB -> 9.5 -> 4.0 with a trailing $
      gives exactly 42#SUB#9.5#4.0$. Option A forgets the separator, option C
      puts the wrong character last, and option D swaps the field order.
