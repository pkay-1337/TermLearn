      calc_proto_ser_dtor(context.ser); calc_proto_ser_delete(context.ser);
      free(context.addr);
    choices:
    - read stays blocked forever, because a closed peer never wakes a reader
    - read returns 0, the loop breaks, and the thread tears down that client's service object, serializer, and
      address before returning
    - read returns -1 with EAGAIN, so the loop retries until the client reconnects
    - the process exits via exit(1), killing every other client's thread too
    answer: 1
    why: |
      Code Box 20-19's loop treats 0 and -1 alike as "break": a peer that
      quits closes its end, so the blocking read stops with 0 and the handler
      performs the fixed teardown sequence - service dtor + delete, serializer
      dtor + delete, free the context address - all inside the client's own
      thread. Option C invents EAGAIN behavior for a blocking socket; option
      D confuses the handler's exit(1) error path (a failed pthread_create in
      accept_forever exits the whole server) with a normal client
      disconnect.
    concept: client-disconnect-teardown-predict
  - kind: mcq
    level: core
    q: Why does every accepted client get its own serializer object (and its own service object) in the calculator
      stream server?
    choices:
    - "To keep each client's messages apart: the per-client deserializer ring buffer and service memory belong to one
      channel and one client, created and destroyed inside that client's handler thread"
    - To balance CPU load across four cores, since the library refuses to share instance state
    - Because libcalcser.a forbids more than one callback registration per process
    - Because thread stacks cannot exceed one serializer object per thread
    answer: 0
    why: |
      The chapter notes that "every client has its own serializer object.
      This is also true for the calculator service object. These objects are
      created and destroyed as part of the same thread." Isolation is the
      point: the deserializer's accumulated bytes and the service's internal
      memory are per-client state, so they live and die with the client's
      handler thread rather than being shared. Options B, C, and D invent
      load-balancing and library restrictions.
    concept: per-client-serializer-isolation
  - kind: why-fails
    level: advanced
    q: In stream_write_resp the server checks not only ret == -1 but also ret < buf.len, exiting the process on the
      second condition. Why is a short write treated as fatal here instead of being retried?
    choices:
    - POSIX forbids looping on a stream socket because write() is idempotent once invoked
    - The response carries no framing the server could resume from; the project treats a truncated message as a
      protocol breach and stops, while a full write guaranteed buf.len bytes reached the channel
    - Short writes only occur on datagram sockets, so the branch dead-codes in stream sockets
    - write() sets errno to 0 on a short write, and zero errno crashes stdio
    answer: 1
    why: |
      The response path writes the message produced by
      calc_proto_ser_server_serialize in one write() call and then checks the
      two failure modes separately: ret == -1 (error, abort) and ret <
      buf.len ("WARN: Less bytes were written!" then exit(1)). The deserializer
      expects terminated, complete messages; a half-written response would
      leave the client waiting for bytes that never come, so the code does
      not attempt to resume the remainder and instead stops the exchange
      where the protocol no longer holds. Options A, C, and D invent POSIX
      rules and socket-type claims.
