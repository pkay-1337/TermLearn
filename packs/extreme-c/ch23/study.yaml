blocks:
- id: b1
  type: model
  title: Separate Pulled Media from Pushed Socket Channels
  explain_md: |
    Two IPC families look similar from user code but behave very differently.

    **Pull-based** techniques (regular files, shared memory) expose a *medium*.
    A process opens the medium, reads bytes from it, and is responsible for
    synchronizing with every other writer. The medium can outlive all the
    processes that used it, so data written before a reader starts is still
    there later.

    **Push-based** techniques (signals, pipes, message queues, sockets) expose a
    *channel*. The kernel receives the data into a buffer owned by the receiver,
    and the receiver reaches that buffer through a descriptor. A blocking
    receiver sleeps inside read until bytes arrive; a non-blocking receiver
    polls the descriptor and does other work when it is empty.

    Every socket is push-based. A socket descriptor always names a two-way
    channel, so the same object can be read from and written to. A file
    descriptor may name a medium (a regular file) or a channel (a pipe). That is
    why read, write, and close work on both descriptor kinds, while lseek fails
    on a socket: a channel has no byte offset in a storage medium.
  example:
    lang: c
    adapted: true
    code: |
      #include <stdio.h>
      #include <sys/types.h>
      #include <sys/socket.h>
      #include <unistd.h>

      int main(void) {
        int sv[2];
        if (socketpair(AF_UNIX, SOCK_STREAM, 0, sv) == -1) {
          return 1;
        }
        off_t pos = lseek(sv[0], 0, SEEK_SET);
        printf("seek_ok=%d\n", pos != -1);
        close(sv[0]);
        close(sv[1]);
        return 0;
      }
    run_expected: |
      seek_ok=0
    explain_md: |
      socketpair creates two connected socket descriptors. Each descriptor is a
      channel, not a file with a seek position, so lseek cannot move a byte
      offset and returns -1. The program prints 0 for seek_ok, proving that the
      usual file-seek assumption does not apply to a socket.
    note: Condensed the descriptor comparison into one runnable socketpair program.
  viz:
    kind: ascii-memory
    steps:
    - 'PULL: producer -> [ file / shared memory medium ] -> consumer pulls later; medium persists; user locks'
    - 'PUSH: producer -> [ kernel buffer owned by receiver ] -> receiver reads through a descriptor'
    - 'BLOCKING: receiver sleeps inside read until the kernel buffer has new bytes'
    - 'POLLING: receiver tests the descriptor, does other work when no bytes are ready'
    - 'DESCRIPTOR RULE: socket descriptor = two-way channel; file descriptor = medium or channel'
    - 'SEEK RULE: a channel has no byte offset, so lseek fails even though read/write work'
  checks:
  - kind: why-fails
    level: intro
    q: >-
      A producer writes a message into a shared file while the consumer is down, and the consumer reads it an hour
      later. Why does the same delivery fail when the producer pushes through a socket instead?
    choices:
    - A socket stores each pushed message on disk until the receiver process starts again
    - A socket loses a pushed message because the receiver's kernel buffer exists only while it runs
    - A socket stores the message in a persistent medium but only after an acknowledgement
    answer: 1
    why: |
      Push-based channels deliver into the receiver's kernel buffer, which is
      tied to the running receiver. If no receiver exists, there is no buffer to
      hold the bytes, so a push can be lost. A shared file is a pull-based
      medium: its bytes remain available after the writer exits.
      Option A invents a disk-backed socket buffer. Option C invents durable
      storage plus an acknowledgement protocol that sockets do not provide here.
    concept: push-no-persistence
    from_chapter: ch22
    from_block: b1
  - kind: mcq
    level: intro
    q: Which group contains only push-based IPC techniques?
    choices:
    - Signals, pipes, message queues, and sockets
    - Shared memory, regular files, and memory-mapped files
    - Regular files, pipes, and shared memory segments
    answer: 0
    why: |
      Push-based techniques deliver data through a channel into a receiver's
      kernel buffer. Signals, pipes, message queues, and sockets all fit that
      description. The other groups contain pull-based media such as regular
      files and shared memory.
      Option B mixes one push primitive with two pull media. Option C mixes two
      pull media with one push primitive.
    concept: push-family-membership
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of the kernel buffer that a push-based channel provides?
    choices:
    - It stores outgoing bytes permanently so a later restart can resend every byte
    - It gives user code a shared place to put locks around data used by many processes
    - It holds incoming bytes for a running receiver and the kernel synchronizes access
    answer: 2
    why: |
      The kernel buffer is the meeting point between sender and receiver: the
      sender pushes bytes in, and the receiver reads them through a descriptor.
      The kernel owns the synchronization, so user code does not put locks around
      the buffer.
      Option A steals the persistence property of a pull-based medium. Option B
      moves synchronization back into user space, which is the pull model.
    concept: kernel-buffer-purpose
  - kind: predict
    level: core
    q: >-
      Trace line by line, tracking fd and the return value: a connected socket descriptor is passed to lseek(fd, 0,
      SEEK_SET). What is the result?
    code: |
      int fd = socket(AF_UNIX, SOCK_STREAM, 0);
      off_t pos = lseek(fd, 0, SEEK_SET);   /* socket, not a regular file */
    choices:
    - pos is the number of unread bytes waiting in the kernel buffer
    - pos is -1 because a socket channel has no seekable byte offset
    - pos is 0 because every descriptor starts at file offset zero
    answer: 1
    why: |
      lseek needs a byte position inside a storage medium. A socket descriptor
      names a channel with no stored position, so the call fails and returns -1.
      Option C imports regular-file semantics into a channel. Option A confuses
      the amount of buffered data with a file offset.
    concept: socket-seek-invalid
  - kind: fillblank
    level: intro
    q: 'A socket descriptor always represents a two-way ___ instead of a storage medium. (Answer format: one word)'
    code: |
      int sd = socket(AF_UNIX, SOCK_STREAM, 0);
      /* sd names a two-way data path, not a file with an offset */
    answer_text: channel
    why: |
      Sockets model two-way channels; files model media. This distinction is why
      read and write work on both descriptor kinds while lseek works only on a
      medium with an offset.
    concept: socket-is-channel
  - kind: why-fails
    level: core
    q: >-
      Why must a process using a pull-based shared-memory medium add its own synchronization, while a process
      reading a pipe needs no user-level lock?
    choices:
    - A shared medium is visible to several writers, so user code must serialize access
    - A pipe stores bytes in a file, so the kernel has no buffer to protect
    - A shared medium automatically blocks every writer until the reader is ready
    answer: 0
    why: |
      A pull-based medium is external storage shared by its users; the kernel
      does not impose a reader/writer protocol on that memory. The processes must
      coordinate reads and writes themselves. A push-based pipe instead feeds a
      kernel buffer whose access the kernel already synchronizes.
      Option B is false: pipes do not store bytes in a regular file. Option C
      invents automatic writer blocking that the pull model does not provide.
    concept: pull-needs-locks
  source_ref: Text/socket_programming.xhtml - IPC push/pull review and socket descriptors

- id: b2
  type: model
  title: Choose a Channel Shape and Address Family Before Coding
  explain_md: |
    Two independent choices define a socket.

    **Channel shape.** A *stream* channel (`SOCK_STREAM`) is connection-oriented:
    it carries an ordered sequence of bytes between two specific endpoints. It
    does not preserve write boundaries, so three writes may arrive as one read,
    one write may arrive as three reads, or anything in between. A *datagram*
    channel (`SOCK_DGRAM`) is connection-less: each send is one independent
    message, several processes may share the channel, and the receiver consumes
    one whole datagram at a time.

    **Address family.** A Unix Domain Socket (`AF_UNIX`) works only between
    processes on one host. It skips the IP stack, so it is faster and has less
    overhead. A network socket (`AF_INET`) works across hosts and also on one
    host.

    Because each family can carry either shape, there are four varieties: UDS
    stream, UDS datagram, network stream, and network datagram. A network stream
    socket is usually called a TCP socket and a network datagram socket is
    usually called a UDP socket, after their transport protocols. UDS variants
    have no transport name because no transport protocol sits underneath them.
  example:
    lang: c
    adapted: true
    code: |
      #include <stdio.h>
      #include <sys/socket.h>
      #include <unistd.h>

      int main(void) {
        int a = socket(AF_UNIX, SOCK_STREAM, 0);
        int b = socket(AF_UNIX, SOCK_DGRAM, 0);
        int c = socket(AF_INET, SOCK_STREAM, 0);
        int d = socket(AF_INET, SOCK_DGRAM, 0);
        if (a < 0 || b < 0 || c < 0 || d < 0) {
          return 1;
        }
        printf("uds_stream=%d\n", a >= 0);
        printf("uds_datagram=%d\n", b >= 0);
        printf("tcp_stream=%d\n", c >= 0);
        printf("udp_datagram=%d\n", d >= 0);
        close(a); close(b); close(c); close(d);
        return 0;
      }
    run_expected: |
      uds_stream=1
      uds_datagram=1
      tcp_stream=1
      udp_datagram=1
    explain_md: |
      The four socket calls combine the two address families with the two channel
      shapes. Each call returns a descriptor when the family/type pair is valid.
      The prints confirm that all four varieties exist as real kernel objects;
      the following code chooses which of them to use by which pair it creates.
    note: Added descriptor creation and close calls so every variety is exercised.
  viz:
    kind: ascii-memory
    steps:
    - 'STREAM: bytes 1 2 3 4 5 -> ordered byte sequence; write boundaries are not preserved'
    - 'DATAGRAM: [1 2] [3] [4 5] -> every send stays one independent message'
    - 'UDS: AF_UNIX -> one host only; no routing, no network stack, lower overhead'
    - 'NETWORK: AF_INET -> across hosts or on one host; the IP stack handles delivery'
    - 'FOUR VARIETIES: UDS stream | UDS datagram | network stream (TCP) | network datagram (UDP)'
  checks:
  - kind: why-fails
    level: core
    q: >-
      A client sends three separate 10-byte application messages over a stream socket, yet one read on the server
      returns 30 bytes. Why is this not a protocol bug?
    choices:
    - A stream socket merges writes only when they share the same request identifier
    - A stream socket preserves boundaries only when the sender flushes after each write
    - A stream socket carries a continuous byte stream and does not preserve message boundaries
    answer: 2
    why: |
      A stream promises ordered bytes, not record boundaries. The receiver may
      see one message split across reads or several messages joined in one read,
      so the application protocol must add framing such as a delimiter or length
      prefix.
      Option A ties framing to application data. Option B invents a flush rule
      that streams do not use for message boundaries.
    concept: stream-no-boundaries
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of preferring a UDS for a client and server that share one host?
    choices:
    - It guarantees that every message is written to disk before delivery
    - It avoids the network stack and keeps the channel inside one kernel
    - It lets unrelated hosts share one filesystem socket path safely
    answer: 1
    why: |
      UDS stay on one host and bypass routing, checksums, and network-device
      handling, so they have less overhead than network sockets. They still
      deliver bytes through a kernel channel rather than a durable medium.
      Option A confuses a socket path with persistent storage. Option C
      contradicts the single-host restriction of AF_UNIX.
    concept: uds-single-host-benefit
  - kind: mcq
    level: intro
    q: Which list contains the four socket varieties used by the calculator project?
    choices:
    - UDS stream, UDS datagram, TCP stream, and UDP datagram
    - UDS packet, UDS stream, TCP datagram, and network stream
    - UDS stream, UDS datagram, TCP datagram, and UDP stream
    answer: 0
    why: |
      Each address family can carry either channel shape: UDS stream, UDS
      datagram, network stream (TCP), and network datagram (UDP).
      Option C swaps the protocol-to-shape mapping. Option B invents a UDS
      packet variety and also swaps TCP's shape.
    concept: four-socket-varieties
  - kind: predict
    level: core
    q: >-
      Trace the receiver: a stream sender writes "12#" then "34$" with two write calls. A receiver reads once into a
      64-byte buffer. What can it observe?
    code: |
      write(sd, "12#", 3);
      write(sd, "34$", 3);
      char buf[64];
      int n = read(sd, buf, sizeof(buf));
    choices:
    - n is exactly 3 because read returns one write call at a time
    - n can be 6 but the byte order depends on the receiver host
    - n can be 6 and the bytes are "12#34$" in the same order
    answer: 2
    why: |
      A stream is an ordered byte sequence with no write-call boundaries, so one
      read can return both writes concatenated in order.
      Option A assumes a message boundary that streams do not provide. Option B
      confuses stream byte order, which is preserved, with host integer byte
      order.
    concept: stream-read-coalescing
  - kind: fillblank
    level: intro
    q: 'A network socket that offers a datagram channel is usually called a ___ socket. (Answer format: one word)'
    answer_text: UDP
    why: |
      Network datagram sockets normally run over the UDP transport protocol, so
      they are called UDP sockets. UDS datagram sockets have no transport name
      because no transport protocol sits underneath them.
    concept: udp-naming
  - kind: choose-better
    level: advanced
    q: Which channel choice is better for transferring a large file between two processes on the same machine, and why?
    choices:
    - A UDS datagram, because one datagram can carry the entire file as one message
    - A UDS stream, because ordered bytes and kernel-local transport fit bulk transfer
    - A network datagram, because UDP reassembles large application records efficiently
    answer: 1
    why: |
      Bulk data needs ordered, reliable byte delivery; a UDS stream provides that
      while avoiding the network stack.
      Option A ignores the practical datagram size limit and record semantics.
      Option C misstates UDP, which does not guarantee delivery or application
      record reassembly.
    concept: stream-choice-for-bulk
  - kind: mcq
    level: core
    q: Which three attributes does the socket() call choose for a new socket object?
    choices:
    - Address family, channel shape, and protocol number
    - File path, backlog size, and message delimiter
    - Remote host name, port number, and timeout value
    answer: 0
    why: |
      socket(family, type, protocol) fixes the address family, the channel shape,
      and the protocol selection. The endpoint path or host/port is supplied
      later by bind or connect, not by socket() itself.
      Option B lists listener and protocol details used by later calls. Option C
      lists connection details that are not socket() arguments.
    concept: socket-attributes
    from_chapter: ch22
    from_block: b19
  source_ref: Text/socket_programming.xhtml - stream/datagram channels and UDS/network families

- id: b3
  type: design
  title: Divide the Calculator into Four Reusable Libraries
  explain_md: |
    The calculator project is deliberately split so that protocol, logic, and
    transport can evolve independently.

    Four reusable pieces carry the shared work:

    - **calcser** defines the application protocol and turns request/response
      objects into messages and back. It builds `libcalcser.a`.
    - **calcsvc** holds the calculator logic and builds `libcalcsvc.a`. It knows
      nothing about sockets or serialization.
    - **srvcore** holds server machinery shared by every stream and datagram
      server on every address family. It builds `libsrvcore.a`.
    - **clicore** holds the matching client machinery and builds `libclicore.a`.

    Above those cores sit eight thin executables: four servers and four clients.
    Each main chooses a family, a channel shape, an address structure, and port
    constants, then calls the shared loop. The serializer and service sit above
    all transport code, so moving a program from UDS to TCP or UDP changes its
    main, not the logic behind it.
  diagram:
    kind: flow
    caption: Server and client skins reuse two cores, which reuse protocol and logic libraries
    nodes:
    - {id: A, label: "4 server mains"}
    - {id: B, label: "4 client mains"}
    - {id: C, label: "srvcore"}
    - {id: D, label: "clicore"}
    - {id: E, label: "calcser"}
    - {id: F, label: "calcsvc"}
    edges:
    - {from: A, to: C}
    - {from: B, to: D}
    - {from: C, to: E}
    - {from: D, to: E}
    - {from: C, to: F}
    - {from: D, to: F}
    steps:
    - {focus: [A, B], note: "eight executables select only family, shape, address, and ports"}
    - {focus: [A, B, C, D], note: "the transport-specific mains call shared server or client cores"}
    - {focus: [A, B, C, D, E, F], note: "both cores use the protocol serializer and calculator logic"}
  checks:
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of the calcser library in the calculator project?
    choices:
    - It schedules server threads and assigns each accepted client to a worker
    - It stores each client calculator memory in a file that survives restarts
    - It defines the request and response wire format and converts objects to bytes
    answer: 2
    why: |
      calcser owns the application protocol: it serializes request and response
      objects into messages and deserializes incoming messages back into objects.
      Option A describes server concurrency, which lives in srvcore. Option B
      describes persistence, which no library in this project provides.
    concept: calcser-purpose
  - kind: why-fails
    level: core
    q: >-
      Why is the calculation service kept free of socket and serializer types instead of receiving a socket
      descriptor directly?
    choices:
    - A service that sees a socket descriptor would be forced to use a network socket
    - A transport-blind service can be tested and reused without any socket being open
    - Socket descriptors cannot be passed to ordinary C functions without corruption
    answer: 1
    why: |
      Keeping the service dependent only on pure C types makes it a standalone
      library that can be called from a server, a test, or a simple main with no
      IPC at all.
      Option A invents a family restriction. Option C is false: a descriptor is
      an ordinary integer value.
    concept: service-transport-blind
  - kind: mcq
    level: core
    q: Which library contains the accept loop and client handler shared by a UDS stream server and a TCP stream server?
    choices:
    - srvcore, the server common library
    - clicore, the client common library
    - calcsvc, the calculation service library
    answer: 0
    why: |
      The accept loop, per-client handler, and stream response writer are shared
      by every stream server regardless of address family, so they live in
      srvcore. clicore is the client-side mirror, and calcsvc contains only the
      calculator logic.
    concept: srvcore-membership
  - kind: choose-better
    level: advanced
    q: >-
      A team writes one self-contained server per socket family, duplicating the read, deserialize, and respond
      loop. Which design is better and why?
    choices:
    - Move the shared loop into the calculator service so the service owns the socket calls
    - Duplicate the loop per server so each executable stays independent of the others
    - Extract the shared loop into a common library and let each main supply only transport details
    answer: 2
    why: |
      The project architecture keeps transport-independent machinery in shared
      libraries and each main thin. That removes duplicate bug surfaces and
      exposes the real boundary between transport and logic.
      Option A breaks the service's transport-blind design. Option B accepts
      four copies of the same loop and four places to fix the same bug.
    concept: reuse-vs-duplication
  - kind: fillblank
    level: core
    q: 'The serializer/deserializer library is built into the static library named lib___.a. (Answer format: one token)'
    answer_text: calcser
    why: |
      The calcser directory builds libcalcser.a. It owns the application protocol
      and is linked by both clients and servers, independent of the socket family
      or channel shape.
    concept: calcser-library-name
  - kind: mcq
    level: core
    q: Why does every calculator client need its own service object on the server side?
    choices:
    - The serializer can deserialize requests only when one service object is shared
    - The calculator memory is stateful per client, so requests need a private history
    - The operating system allows one service object to serve only one socket type
    answer: 1
    why: |
      The calculator has an internal memory that belongs to each client, so the
      service must remember that client's value between requests. A shared
      object would mix the histories.
      Option A confuses serialization with service state. Option C invents an OS
      limit that does not exist.
    concept: stateful-service-per-client
  source_ref: Text/socket_programming.xhtml - calculator source hierarchy and build

- id: b4
  type: model
  title: Encode Requests and Responses as Delimited Text
  explain_md: |
    The calculator protocol is textual and variable-length. It has exactly one
    request message type and one response message type.

    A request object has four fields: `id`, `method`, `operand1`, `operand2`. A
    response object has three: `req_id`, `status`, `result`. On the wire, fields
    are separated by `#` and the whole message ends with `$`:
    `1000#ADD#1.5#5.6$` is a request, and `1000#0#7.1$` is its response. The
    response repeats the request id so the client can match answer to question.

    The methods include memory operations and arithmetic. `ADD`, `SUB`, and `MUL`
    use only their operands. `ADDM`, `SUBM`, and `MULM` also read the stored
    memory and then update it, like the +M button on a desktop calculator.
    `GETMEM` and `RESMEM` read and reset memory. `DIV` has no memory variant
    because the stored memory does not participate in division.

    Status is numeric. `0` is OK; `1` is an invalid request, `2` an invalid
    method, `3` an invalid operand, `4` division by zero, and `20` an internal
    error. These protocol statuses are separate from the service library's own
    return codes.
  example:
    lang: c
    adapted: true
    code: |
      #include <stdio.h>

      typedef enum {
        NONE, GETMEM, RESMEM, ADD, ADDM, SUB, SUBM, MUL, MULM, DIV
      } method_t;

      static const char* method_to_str(method_t m) {
        static const char* names[] = {
          "NONE", "GETMEM", "RESMEM", "ADD", "ADDM",
          "SUB", "SUBM", "MUL", "MULM", "DIV"
        };
        return names[m];
      }

      struct calc_proto_req_t {
        int id;
        method_t method;
        double operand1;
        double operand2;
      };

      struct calc_proto_resp_t {
        int req_id;
        int status;
        double result;
      };

      int main(void) {
        struct calc_proto_req_t req = {1000, ADD, 1.5, 5.6};
        char reqbuf[64];
        snprintf(reqbuf, sizeof(reqbuf), "%d#%s#%.1f#%.1f$",
                 req.id, method_to_str(req.method), req.operand1, req.operand2);

        struct calc_proto_resp_t resp = {1000, 0, 7.1};
        char respbuf[64];
        snprintf(respbuf, sizeof(respbuf), "%d#%d#%.1f$",
                 resp.req_id, resp.status, resp.result);

        printf("%s\n", reqbuf);
        printf("%s\n", respbuf);
        return 0;
      }
    run_expected: |
      1000#ADD#1.5#5.6$
      1000#0#7.1$
    explain_md: |
      The request serializer writes id, method name, both operands, and the $
      terminator in one formatted call. The response serializer writes the
      request id, numeric status, result, and the same terminator. The final $
      is what lets a receiver know a complete message has arrived even when the
      stream splits the text across several reads.
    note: Condensed the protocol structs and serializers into one runnable main that prints the wire strings.
  viz:
    kind: ascii-memory
    steps:
    - 'REQUEST OBJECT: id=1000, method=ADD, operand1=1.5, operand2=5.6'
    - 'REQUEST WIRE: "1000#ADD#1.5#5.6$" -> four fields, one message separator'
    - 'RESPONSE OBJECT: req_id=1000, status=0 (OK), result=7.1'
    - 'RESPONSE WIRE: "1000#0#7.1$" -> three fields, one message separator'
    - 'RECEIVER RULE: split on # for fields, stop at $ for the message boundary'
  checks:
  - kind: predict
    level: core
    q: >-
      Trace the serializer: which wire message is produced for a request with id 42, method MUL, operands 2.0 and
      3.0?
    code: |
      struct calc_proto_req_t r = {42, MUL, 2.0, 3.0};
      /* serializer writes: id # method # operand1 # operand2 $ */
    choices:
    - wire = 42#MUL#2.0#3.0$
    - wire = 42#MUL#2.0#3.0#6.0$
    - wire = MUL#42#2.0#3.0$
    answer: 0
    why: |
      The request format is exactly four fields in the order id, method,
      operand1, operand2, terminated by $. Option B adds a result field that
      belongs only to a response. Option C puts the method before the id, which
      breaks every deserializer expecting the id first.
    concept: request-wire-order
  - kind: why-fails
    level: core
    q: Why must the calculator protocol terminate every message with a separator instead of ending when a read returns?
    choices:
    - A delimiter is needed because the numeric request id cannot contain the # character
    - A read returns exactly one message only when the message ends with an unknown byte
    - A read may return a partial message or several messages, so a delimiter marks the boundary
    answer: 2
    why: |
      Stream reads expose arbitrary chunks, not application-message boundaries.
      The $ delimiter is the only reliable signal that a complete message is
      present. Option B reverses the rule: reads have no message semantics at
      all. Option A confuses field content with framing.
    concept: delimiter-required
  - kind: fillblank
    level: intro
    q: >-
      In the calculator wire format, fields are separated by # and the whole message is terminated by the character
      ___. (Answer format: one character)
    code: |
      /* A request with id 7, method ADD, operands 1.0 and 2.0 */
      const char* wire = "7#ADD#1.0#2.0$";
    answer_text: $
    why: |
      # separates fields inside a message, while $ ends the entire message. A
      deserializer scans for $ before it tries to parse fields, because only then
      does it know the message is complete.
    concept: message-separator
  - kind: order
    level: core
    q: Order the 5 correct steps a deserializer performs for one request; one displayed line is a distractor.
    lines:
    - parse the fields into a request object
    - serialize a response for the client
    - append the incoming chunk to the ring buffer
    - remove the consumed message bytes
    - scan the ring buffer for the $ separator
    - notify the request callback with the object
    answer_order:
    - 2
    - 4
    - 0
    - 5
    - 3
    why: |
      Bytes accumulate first; only after $ is found can a complete message be
      parsed. The parser builds the object, notifies the observer, and removes
      the consumed bytes so the next message can be parsed. Serializing a
      response is later server work, not part of request deserialization, so it
      is the distractor.
    concept: deserialize-step-order
    hint: Nothing can be parsed until the message terminator is present.
  - kind: trace
    level: core
    q: Trace the request object fields after construction. What value is stored in the method slot?
    code: |
      struct calc_proto_req_t r;
      r.id = 1000;
      r.method = ADDM;
      r.operand1 = 1.5;
      r.operand2 = 5.6;
    trace:
      headers: [Step, Line, Field, Value]
      rows:
      - ['1', '2', 'id', '1000']
      - ['2', '3', 'method', 'ADDM']
      - ['3', '4', 'operand1', '1.5']
      - ['4', '5', 'operand2', '5.6']
    target: {row: 1, col: 3}
    answer_text: ADDM
    why: |
      Line 3 assigns the ADDM enumerator to the method field. ADDM adds both
      operands together with the stored memory and updates that memory. It is
      not plain ADD, which ignores memory.
    concept: request-method-field
  - kind: spot-bug
    level: advanced
    q: A response serializer should emit req_id#status#result$. Which line corrupts the wire format?
    code: |
      char buf[64];
      int req_id = 7;
      int status = 0;
      double result = 2.5;
      snprintf(buf, sizeof(buf), "%d#%d$", req_id, status);  /* line 5 */
      /* result 2.5 must also appear in the message */
    diagnostic_log: |
      client: response rejected: expected 3 fields, found 2
    choices:
    - 'Line 5: the status must be printed before the request id in every response'
    - 'Line 5: the format string omits the result field, so only two fields are emitted'
    - 'Line 5: the separator must be # instead of the final $ in a response'
    answer: 1
    why: |
      A response has exactly three fields: request id, status, and result. The
      format "%d#%d$" writes only two, so a client that splits on # sees a
      malformed message.
      Option A reverses the required field order. Option C removes the message
      terminator that every message needs.
    concept: response-field-count
  - kind: mcq
    level: core
    q: Which response status value does the calculator protocol reserve for division by zero?
    choices:
    - STATUS_DIV_BY_ZERO, value 4
    - STATUS_INTERNAL_ERROR, value 20
    - STATUS_INVALID_METHOD, value 2
    answer: 0
    why: |
      The protocol numbers division by zero as status 4. Status 2 is an invalid
      method and status 20 is an internal error. Keeping these names distinct
      from the service's own error return avoids mixing two namespaces.
    concept: div-zero-status
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of putting a unique request id in both a request and its response?
    choices:
    - It lets the server encrypt each response before sending it back to the client
    - It guarantees that the transport delivers messages in the order they were sent
    - It lets the client match an arriving response to the request that caused it
    answer: 2
    why: |
      The request id is correlation data. A client may have several outstanding
      requests and must attach each response to the right one.
      Option A invents encryption from an identifier. Option B assigns ordering
      to the id, but ordering is a transport property.
    concept: request-id-correlation
  source_ref: Text/socket_programming.xhtml - calculator request/response protocol; Code Boxes 20-1..20-6

- id: b5
  type: algorithm
  title: Rebuild Messages from Arbitrary Stream Chunks
  explain_md: |
    Serialization is straightforward because the sender controls the object.
    Deserialization is harder because a stream may deliver half a message, a
    whole message, or several messages in one read.

    The serializer class keeps a fixed-length **ring buffer** for incoming
    bytes. Each call appends the new chunk, scans for `$`, and parses every
    complete message it finds. If a message is incomplete, its bytes stay
    buffered until more arrive. After a message is parsed and its callback runs,
    the consumed bytes are removed so the next message can start at the right
    place.

    The API has a deliberate orientation. A client serializes requests and
    deserializes responses; a server deserializes requests and serializes
    responses. Three callbacks report a request, a response, or an error. A
    failed parse reports a protocol error code instead of delivering a
    half-built object. The server constructs its per-client serializer with a
    256-byte ring; the client uses 128 bytes.
  example:
    lang: c
    adapted: true
    code: |
      #include <stdio.h>
      #include <string.h>

      static void feed(const char* chunk) {
        static char buf[256];
        static size_t used = 0;
        size_t room = sizeof(buf) - used - 1;
        size_t n = strlen(chunk);
        strncat(buf + used, chunk, room);
        used += (n < room) ? n : room;

        char* start = buf;
        char* sep;
        while ((sep = strchr(start, '$')) != NULL) {
          *sep = '\0';
          printf("message=%s\n", start);
          start = sep + 1;
        }
        if (start != buf) {
          size_t left = strlen(start);
          memmove(buf, start, left + 1);
          used = left;
        }
      }

      int main(void) {
        feed("1000#ADD#1.5");
        feed("#5.6$1001#DIV#8#2$");
        return 0;
      }
    run_expected: |
      message=1000#ADD#1.5#5.6
      message=1001#DIV#8#2
    explain_md: |
      The first chunk has no $, so it stays buffered. The second chunk supplies
      the rest of the first message and a complete second message. The loop
      prints each message as soon as it finds $, then moves the leftover bytes
      to the front of the buffer. This is the essential ring-buffer behavior:
      parse complete messages, preserve the fragment.
    note: >-
      Replaced the private ring-buffer machinery with a small runnable feed function that exposes the same parse
      loop.
  viz:
    kind: ascii-memory
    steps:
    - 'CHUNK 1: append "1000#ADD#1.5" -> no $ -> buffer keeps all bytes'
    - 'CHUNK 2: append "#5.6$1001#DIV#8#2$" -> buffer now holds two complete messages'
    - 'SCAN: find first $ -> parse "1000#ADD#1.5#5.6" -> notify callback'
    - 'CONSUME: remove first message -> scan again -> parse "1001#DIV#8#2"'
    - 'LEFTOVER: no complete message remains -> any trailing bytes stay buffered'
  checks:
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of the fixed-length ring buffer inside the deserializer?
    choices:
    - It stores outgoing messages until the receiver acknowledges each one
    - It accumulates partial messages until a complete delimited message can be parsed
    - It caches the calculator memory so division can reuse the previous result
    answer: 1
    why: |
      The ring buffer is the staging area between arbitrary stream chunks and
      complete application messages. It holds leftovers until a $ arrives.
      Option A confuses an incoming parser with an outgoing retransmission
      queue. Option C confuses protocol buffering with service memory.
    concept: ring-buffer-purpose
  - kind: predict
    level: core
    q: >-
      Trace the ring buffer: the first read delivers "1000#ADD#1.5" and the second delivers "#5.6$". After which
      read can a complete request be parsed?
    code: |
      /* first chunk  */ "1000#ADD#1.5"
      /* second chunk */ "#5.6$"
    choices:
    - Only after the second chunk, because the $ separator arrives there
    - After the first chunk, because it already contains all four fields
    - After the first chunk, because the method name is already visible
    answer: 0
    why: |
      The first chunk has no $, so the deserializer cannot know the message is
      complete and must buffer the bytes. The second chunk supplies the last
      field and the terminator, so parsing can begin.
      Option B mistakes field count for completeness. Option C mistakes a
      recognizable method for a terminated message.
    concept: parse-after-terminator
  - kind: why-fails
    level: core
    q: Why do client and server use opposite (de)serialization functions instead of both calling the same pair?
    choices:
    - The server side must never serialize a response because responses are sent as raw bytes
    - The client side cannot deserialize bytes because it has no request identifier to match
    - Each side serializes what it sends and deserializes what it receives, and those directions differ
    answer: 2
    why: |
      A client sends requests and receives responses; a server receives requests
      and sends responses. The four functions encode that direction split so each
      side parses only the message type it expects.
      Option A is false: servers serialize responses before sending them. Option
      C is false: clients deserialize responses.
    concept: serializer-orientation
  - kind: order
    level: core
    q: >-
      Order the 5 correct operations for handling a chunk that contains two complete messages; all displayed lines
      are used.
    lines:
    - append the new chunk to the ring buffer
    - notify the callback with the parsed object
    - scan for the first $ separator
    - parse the fields into an object
    - remove the consumed message and scan again
    answer_order:
    - 0
    - 2
    - 3
    - 1
    - 4
    why: |
      Chunks are appended before scanning. For each complete message the parser
      scans to $, parses, notifies, removes the consumed bytes, and repeats. Two
      complete messages therefore produce two notify calls.
    concept: multi-message-chunk-order
    hint: The scan that finds the boundary comes before parsing that message.
  - kind: spot-bug
    level: advanced
    q: The deserializer below is fed a chunk with no $ separator. Which line violates the buffering contract?
    code: |
      void feed(struct ser_t* s, const char* data, int n) {
        ring_append(s, data, n);              /* line 2 */
        if (!ring_has(s, '$')) {              /* line 3 */
          char* msg = ring_take_all(s);       /* line 4 */
          parse_and_notify(s, msg);           /* line 5 */
        }
      }
    diagnostic_log: |
      parser: message rejected: missing terminator
    choices:
    - 'Line 2: appending bytes before scanning loses the first byte of every chunk'
    - 'Lines 4-5: they parse and notify even though no complete delimited message exists'
    - 'Line 3: checking for the separator must happen before appending the chunk'
    answer: 1
    why: |
      When $ is absent, the bytes must stay buffered for the next chunk. Taking
      them now and parsing a message with no terminator produces the reported
      rejection.
      Option A is false: appending is exactly what must happen before scanning.
      Option C would scan an empty buffer and miss the newly appended bytes.
    concept: premature-parse-bug
  - kind: fillblank
    level: intro
    q: 'On the server side, the deserializer turns incoming bytes into a ___ object. (Answer format: one word)'
    answer_text: request
    why: |
      A server receives request messages from clients, so its deserializer builds
      request objects and passes them to the request callback. Responses are what
      the server serializes on the way out.
    concept: server-deserializes-request
  - kind: trace
    level: core
    q: >-
      Trace the buffer state. After three chunks arrive with no $ in the first two, what does the buffer contain at
      step 3?
    code: |
      ring_append(s, "12#", 3);
      ring_append(s, "ADD#", 4);
      ring_append(s, "1$", 2);
    trace:
      headers: [Step, Chunk, Separator, Buffered bytes]
      rows:
      - ['1', '12#', 'no', '12#']
      - ['2', 'ADD#', 'no', '12#ADD#']
      - ['3', '1$', 'yes', '12#ADD#1$']
    target: {row: 2, col: 3}
    answer_text: 12#ADD#1$
    why: |
      Every append adds bytes to the ring buffer, and a $ appears only in the
      third chunk. Until step 3 no complete message exists, so the buffer just
      grows. At step 3 the message is complete and can be parsed.
    concept: buffer-growth-trace
  source_ref: Text/socket_programming.xhtml - serializer API, callbacks, and ring buffer; Code Boxes 20-7..20-11

- id: b6
  type: design
  title: Keep Calculator Logic Stateful and Transport-Blind
  explain_md: |
    The calculation service is the project's core logic. Its interface accepts
    pure C types such as `double`, pointers, and `bool_t`, and returns pure
    values. It does not include a socket header or know what serialization is.
    That is what makes it a standalone library, `libcalcsvc.a`, linked by every
    server executable.

    A service can be **stateless** or **stateful**. If answering the current
    request never needs earlier requests, one shared singleton is enough. The
    calculator is the opposite: it stores an internal memory per client, so each
    client needs its own service object. Creating one service per accepted
    client preserves that private memory.

    Error reporting is deliberately separate from the protocol status namespace.
    `calc_service_div` returns an `int` status, `CALC_SVC_OK` (0) or
    `CALC_SVC_ERROR_DIV_BY_ZERO` (-1), and writes the quotient through a
    `double*` parameter. The server's request callback translates a failed
    division into the protocol's `STATUS_DIV_BY_ZERO`.
  example:
    lang: c
    adapted: true
    code: |
      #include <stdio.h>

      typedef struct {
        double mem;
      } calc_t;

      static double calc_add(calc_t* c, double a, double b, int use_mem) {
        double result = a + b + (use_mem ? c->mem : 0.0);
        if (use_mem) {
          c->mem = result;
        }
        return result;
      }

      static int calc_div(calc_t* c, double a, double b, double* out) {
        (void)c;
        if (b == 0.0) {
          return -1;
        }
        *out = a / b;
        return 0;
      }

      int main(void) {
        calc_t a = {0.0};
        calc_t b = {0.0};
        printf("add=%.1f\n", calc_add(&a, 1.5, 5.6, 0));
        printf("addm=%.1f\n", calc_add(&a, 2.0, 3.0, 1));
        printf("mem_a=%.1f\n", a.mem);
        printf("mem_b=%.1f\n", b.mem);
        double q = 0.0;
        printf("div_status=%d\n", calc_div(&a, 10.0, 2.0, &q));
        printf("div=%.1f\n", q);
        printf("zero_status=%d\n", calc_div(&a, 1.0, 0.0, &q));
        return 0;
      }
    run_expected: |
      add=7.1
      addm=5.0
      mem_a=5.0
      mem_b=0.0
      div_status=0
      div=5.0
      zero_status=-1
    explain_md: |
      calc_add ignores memory for plain ADD, then adds and updates it for ADDM.
      The two service objects keep separate memories, which is why mem_a becomes
      5.0 while mem_b stays 0.0. calc_div returns a status and writes the answer
      through out, so a zero divisor can fail without inventing a numeric answer.
    note: Condensed the service into a small runnable library that shows memory state and division status.
  checks:
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of giving the calculation service pure C arguments and no socket types?
    choices:
    - It lets the same logic run inside a server, a unit test, or a plain main
    - It forces every caller to open a network socket before any calculation
    - It makes the service responsible for serializing its own request messages
    answer: 0
    why: |
      A transport-blind interface makes the service reusable anywhere pure C
      functions can be called, including tests with no IPC.
      Option B invents a socket requirement the design explicitly avoids. Option
      C moves serialization out of calcser, where it belongs.
    concept: service-pure-interface
  - kind: why-fails
    level: core
    q: Why would sharing one calculator service object across all clients break the memory methods?
    choices:
    - The serializer would deserialize requests into the wrong structure type
    - The service would reject every second request because it tracks a request counter
    - ADDM, SUBM, and MULM would read and overwrite another client's stored memory
    answer: 2
    why: |
      Memory operations update a stored value that must belong to one client. A
      shared object mixes those values, so one client's ADDM changes what the
      next client reads.
      Option A confuses service state with deserialization. Option B invents a
      counter rule.
    concept: shared-service-memory-corruption
  - kind: choose-better
    level: advanced
    q: A server handles clients that never use memory methods. Which service design is better and why?
    choices:
    - One service object per client is mandatory because every service must be stateful
    - A single stateless service object is enough because no request depends on earlier ones
    - One service object per request is required so division cannot leak a result
    answer: 1
    why: |
      If responses do not depend on history, a shared stateless object is correct
      and cheaper. Statefulness is a property of the calculator's memory, not a
      requirement for every service.
      Option A overstates the requirement. Option C adds pointless allocation per
      request.
    concept: stateless-vs-stateful-service
  - kind: mcq
    level: core
    q: How does calc_service_div report a successful quotient while still allowing failure?
    choices:
    - It returns a status and writes the quotient through a double pointer
    - It returns the quotient as a double and signals failure with NaN
    - It returns a status and stores the quotient in a global variable
    answer: 0
    why: |
      Division can fail, so the function returns an int status and uses an output
      parameter for the quotient.
      Option B conflates the value with the status and invents NaN as the error
      channel. Option C hides state in a global, which breaks per-client
      isolation.
    concept: division-out-parameter
  - kind: fillblank
    level: core
    q: >-
      The service constant returned when division by zero fails is CALC_SVC___ . (Complete the identifier; answer
      format: one token.)
    answer_text: CALC_SVC_ERROR_DIV_BY_ZERO
    why: |
      The service defines CALC_SVC_ERROR_DIV_BY_ZERO as -1 for a failed division.
      It is a service-level error, distinct from the protocol's
      STATUS_DIV_BY_ZERO response status.
    concept: service-div-error-constant
  - kind: spot-bug
    level: advanced
    q: A server reuses one service object for every client. Which line explains the corrupted memory reading?
    code: |
      static struct calc_service_t* shared_svc = NULL;

      void handle_client(int sd) {
        if (!shared_svc) { shared_svc = calc_service_new(); }  /* line 4 */
        /* client A sends ADDM 5, then client B sends GETMEM */
        service_loop(shared_svc, sd);
      }
    diagnostic_log: |
      client B: GETMEM returned 5.0 although B never stored a value
    choices:
    - 'Line 6: service_loop must create a fresh socket for each client'
    - 'Line 4: the service must be allocated before the socket is accepted'
    - 'Line 4: one shared service object lets client A''s memory leak into client B'
    answer: 2
    why: |
      The shared instance keeps one memory value across all clients, so B reads
      what A wrote. Each client needs its own stateful service object.
      Option A confuses socket ownership with service state. Option B only
      changes allocation timing, not sharing.
    concept: shared-service-leak
  - kind: trace
    level: core
    q: Trace the memory after each operation. What is the memory value after ADDM adds 2 and 3 to the stored value 4?
    code: |
      calc_t c = {4.0};
      double r1 = calc_add(&c, 2.0, 3.0, 1);
      double r2 = calc_add(&c, 1.0, 1.0, 0);
    trace:
      headers: [Step, Operation, Return, Memory]
      rows:
      - ['1', 'initialize', '-', '4.0']
      - ['2', 'ADDM 2 + 3 + mem', '9.0', '9.0']
      - ['3', 'ADD 1 + 1', '2.0', '9.0']
    target: {row: 1, col: 3}
    answer_text: '9.0'
    why: |
      ADDM adds both operands and the stored memory, then updates memory to the
      result: 2 + 3 + 4 = 9. Plain ADD ignores memory and does not change it, so
      the memory remains 9.
    concept: addm-memory-trace
  source_ref: Text/socket_programming.xhtml - calculator service interface and state; Code Box 20-12

- id: b7
  type: syntax
  title: Start a UDS Stream Listener in Order
  explain_md: |
    A UDS stream server follows the stream-listener sequence.

    First it creates a socket with `socket(AF_UNIX, SOCK_STREAM, 0)`. At this
    point the descriptor is only a socket; the later calls make it a listener.
    Next it zeroes a `struct sockaddr_un`, sets `sun_family` to `AF_UNIX`, and
    copies the socket-file path into `sun_path`. A path including its terminating
    NUL is limited to the size of `sun_path` (108 bytes on Linux, 104 on many
    other Unix systems, so 107 and 103 usable bytes respectively).

    Before binding, the server calls `unlink` on the path. A stale socket node
    from a killed earlier run would otherwise make `bind` fail with `EADDRINUSE`.
    `bind` attaches this socket to the path, and only one socket may be bound to
    a given socket file at a time. After `bind`, `listen(server_sd, backlog)`
    sets how many completed connections may wait for `accept`. `accept` then
    returns a new descriptor for each client; that descriptor names the
    dedicated stream channel for that client.
  example:
    lang: c
    adapted: true
    code: |
      #include <stdio.h>
      #include <string.h>
      #include <sys/socket.h>
      #include <sys/un.h>

      int main(void) {
        struct sockaddr_un addr;
        memset(&addr, 0, sizeof(addr));
        addr.sun_family = AF_UNIX;
        strncpy(addr.sun_path, "/tmp/calc_svc.sock",
                sizeof(addr.sun_path) - 1);
        printf("family_ok=%d\n", addr.sun_family == AF_UNIX);
        printf("path=%s\n", addr.sun_path);
        printf("fits=%d\n",
               strlen(addr.sun_path) < sizeof(addr.sun_path));
        return 0;
      }
    run_expected: |
      family_ok=1
      path=/tmp/calc_svc.sock
      fits=1
    explain_md: |
      The address structure is zeroed before any field is written, which clears
      every padding byte the kernel may inspect. sun_family identifies the
      address as a Unix-domain endpoint, and the path is copied with a bound that
      leaves room for the terminating NUL. The fits check compares the path
      length with the field capacity.
    note: Removed socket creation and bind so the example focuses only on the address structure.
  checks:
  - kind: order
    level: core
    q: Order the 5 correct startup calls for a UDS stream listener; all displayed lines are used.
    lines:
    - listen(server_sd, 10)
    - bind(server_sd, (struct sockaddr*)&addr, sizeof(addr))
    - accept(server_sd, NULL, NULL)
    - socket(AF_UNIX, SOCK_STREAM, 0)
    - unlink(sock_file)
    answer_order:
    - 3
    - 4
    - 1
    - 0
    - 2
    why: |
      The socket object must exist before anything can be bound. The stale path
      is removed before binding, binding makes the endpoint valid, listen
      prepares the backlog, and accept can then receive clients.
    concept: uds-stream-listener-order
    hint: You need a socket object before you can talk about its path.
  - kind: predict
    level: core
    q: >-
      Trace the calls: two processes each bind a UDS stream socket to /tmp/svc.sock without unlinking. What happens
      to the second bind?
    code: |
      int a = socket(AF_UNIX, SOCK_STREAM, 0);
      bind(a, (struct sockaddr*)&addr, sizeof(addr));  /* process 1 */
      int b = socket(AF_UNIX, SOCK_STREAM, 0);
      bind(b, (struct sockaddr*)&addr, sizeof(addr));  /* process 2 */
    choices:
    - The second bind succeeds and both sockets share the same file node
    - The second bind fails because a socket file can have only one bound socket
    - The second bind succeeds only after the first socket calls listen
    answer: 1
    why: |
      A UDS path names one bound socket; a second bind to the same path fails
      because the node already exists and is in use.
      Option A assumes files can carry multiple socket bindings. Option C
      confuses listen with bind exclusivity.
    concept: uds-bind-exclusivity
  - kind: why-fails
    level: core
    q: Why does the server call unlink(sock_file) before bind when the file may not exist at all?
    choices:
    - A leftover socket node from a previous run would make bind fail with EADDRINUSE
    - unlink is required to create the kernel buffer that receives client bytes
    - unlink converts the socket family from AF_INET to AF_UNIX before binding
    answer: 0
    why: |
      UDS paths are filesystem nodes. If an earlier process left the node behind,
      bind sees an existing binding and fails. Unlinking first makes the path free
      for this run; if it does not exist, the call is harmless.
      Option B invents a kernel-buffer step. Option C invents an address-family
      conversion.
    concept: unlink-stale-socket
  - kind: fillblank
    level: intro
    q: 'When preparing a UDS address, the address family field sun_family is set to ___. (Answer format: one token)'
    answer_text: AF_UNIX
    why: |
      sun_family must match the family used in the socket call, which is AF_UNIX
      for Unix Domain Sockets. A mismatch makes bind interpret the address
      structure incorrectly.
    concept: sun-family
  - kind: mcq
    level: core
    q: What does the backlog argument in listen(server_sd, 10) control?
    choices:
    - How many client threads the process is allowed to create after accept
    - How many bytes each read call may return from an accepted connection
    - How many completed connections may wait in the kernel before accept takes them
    answer: 2
    why: |
      The backlog bounds the queue of pending connections that have completed the
      transport handshake but have not yet been accepted.
      Option A confuses kernel queuing with the application's thread strategy.
      Option B confuses the backlog with a read buffer size.
    concept: listen-backlog
  - kind: spot-bug
    level: advanced
    q: Diagnose why the server fails on its second run when the previous run was killed. Which line is the cause?
    code: |
      int sd = socket(AF_UNIX, SOCK_STREAM, 0);
      struct sockaddr_un addr;
      memset(&addr, 0, sizeof(addr));
      addr.sun_family = AF_UNIX;
      strncpy(addr.sun_path, "/tmp/calc.sock", sizeof(addr.sun_path) - 1);
      int rc = bind(sd, (struct sockaddr*)&addr, sizeof(addr));  /* line 7 */
    diagnostic_log: |
      bind: Address already in use
    choices:
    - 'Line 1: the socket must be created with SOCK_DGRAM to reuse a path'
    - 'Line 7: bind is called without first unlinking the leftover socket file'
    - 'Line 5: sun_path must be copied with strcpy instead of strncpy'
    answer: 1
    why: |
      The address-in-use error comes from an existing socket node at the path.
      Calling unlink before bind removes the stale node and lets the new server
      bind.
      Option A changes the channel shape and does not solve path reuse. Option C
      does not address the existing node at all.
    concept: stale-uds-node-bug
  - kind: predict
    level: core
    q: >-
      Trace the listener state: a blocking UDS stream listener has no pending clients. Where does the main thread
      wait after it calls accept?
    code: |
      int server_sd = socket(AF_UNIX, SOCK_STREAM, 0);
      listen(server_sd, 10);
      int client_sd = accept(server_sd, NULL, NULL);
    choices:
    - It blocks inside accept until a client completes a connection
    - It blocks inside listen until the backlog is completely empty
    - It returns immediately with client_sd equal to server_sd
    answer: 0
    why: |
      A blocking listener makes accept wait when no completed connection is
      queued. It returns only after a client arrives, with a new descriptor for
      that client's channel.
      Option B confuses backlog configuration with blocking accept. Option C
      misunderstands accept's return value.
    concept: blocking-accept-listener
  source_ref: Text/socket_programming.xhtml - UDS stream listener sequence; Code Boxes 20-13..20-17

- id: b8
  type: design
  title: Give Every Accepted Client Its Own Handler State
  explain_md: |
    A stream server alternates between two kinds of work: accepting new
    connections and serving existing ones. The accept loop must keep running, so
    the expensive per-client work is moved to a handler that runs concurrently.

    For each successful `accept`, the server allocates a small client record. The
    record holds the accepted descriptor and a freshly created calculator service
    object. That record is passed to a thread start routine; the routine reads
    requests, deserializes them, calls the service, serializes responses, and
    finally closes the descriptor and destroys the service. The accept loop then
    immediately waits for the next connection.

    Two rules protect the record. It must not be shared between clients, because
    both the socket descriptor and the service memory belong to one client. It
    must also stay alive until the handler is finished, so the accept loop must
    not free it right after creating the thread. Detaching the thread lets it
    release its own resources when it exits.
  example:
    lang: c
    adapted: true
    code: |
      #include <pthread.h>
      #include <stdlib.h>
      #include <unistd.h>

      struct client_t {
        int sd;
        void* svc;
      };

      static void* handle_client(void* arg) {
        struct client_t* c = (struct client_t*)arg;
        char buf[256];
        int n = read(c->sd, buf, sizeof(buf));
        if (n > 0) {
          (void)write(c->sd, buf, (size_t)n);
        }
        close(c->sd);
        free(c);
        return NULL;
      }

      void spawn_handler(int client_sd) {
        struct client_t* c = malloc(sizeof(*c));
        if (!c) { close(client_sd); return; }
        c->sd = client_sd;
        c->svc = NULL;
        pthread_t th;
        if (pthread_create(&th, NULL, handle_client, c) == 0) {
          pthread_detach(th);
        } else {
          close(c->sd);
          free(c);
        }
      }
    explain_md: |
      spawn_handler packages the descriptor into a heap record, creates a
      detached thread, and lets the handler own that record. The handler echoes
      one chunk to show that it uses only its own descriptor, then closes the
      descriptor and frees the record. The accept loop that calls spawn_handler
      can continue while this handler runs. The code is compile-only because a
      complete server would also need a listening socket and a main loop.
    note: Extracted the per-client ownership and thread setup into a compile-only skeleton.
  checks:
  - kind: order
    level: core
    q: Order the 5 correct steps the accept loop performs for one new client; all displayed lines are used.
    lines:
    - c->sd = client_sd; c->svc = calc_service_new()
    - int client_sd = accept(server_sd, NULL, NULL)
    - pthread_detach(th)
    - struct client_t* c = malloc(sizeof(*c))
    - pthread_create(&th, NULL, handle_client, c)
    answer_order:
    - 1
    - 3
    - 0
    - 4
    - 2
    why: |
      The connection is accepted first, then a record is allocated and filled
      with the new descriptor and a private service. Only after the record is
      ready does the thread start, and detaching lets that thread clean itself up
      when it exits.
    concept: per-client-thread-order
    hint: The record must be complete before a thread receives its pointer.
  - kind: why-fails
    level: core
    q: >-
      A server stores every accepted descriptor in one global client_t and starts a thread with that pointer. Why do
      clients sometimes read each other's data?
    choices:
    - The kernel copies the global record into each thread, causing stale descriptors
    - pthread_create refuses to start when the argument points to global memory
    - The next accept overwrites the global record while an earlier thread still uses it
    answer: 2
    why: |
      One global record has one descriptor and one service at a time. A second
      accept overwrites those fields, so the first thread may read from the new
      client's socket or use the new client's memory.
      Option A invents copying semantics for globals. Option B is false:
      pthread_create accepts a pointer to any storage.
    concept: shared-client-record-race
  - kind: predict
    level: core
    q: >-
      Trace the accept loop: it calls pthread_create for client A and does not join the thread. Where does the main
      thread go next after the create returns?
    code: |
      while (1) {
        int client_sd = accept(server_sd, NULL, NULL);
        spawn_handler(client_sd);
      }
    choices:
    - It blocks inside pthread_create until client A's handler has exited
    - Back to accept to wait for client B while client A's handler runs separately
    - It exits the while loop because a created thread cannot be left detached
    answer: 1
    why: |
      pthread_create returns after the new thread is started; it does not wait
      for the thread to finish. The accept loop therefore reaches accept again
      and can receive another client while the first handler runs.
      Option A describes join-like behavior. Option C invents an exit rule for
      detached threads.
    concept: accept-loop-concurrency
  - kind: fillblank
    level: intro
    q: 'The POSIX call that starts a new handler thread and stores its identifier is ___. (Answer format: one token)'
    answer_text: pthread_create
    why: |
      pthread_create starts the thread and fills a pthread_t identifier. The
      server then calls pthread_detach so the thread releases its resources on
      exit without a join.
    concept: pthread-create-name
  - kind: mcq
    level: core
    q: What does accept return for a new stream client?
    choices:
    - A new descriptor dedicated to that client's connection
    - The listener descriptor, now switched to client mode
    - A file descriptor for the listener's socket file on disk
    answer: 0
    why: |
      accept dequeues one pending connection and returns a fresh descriptor for
      that dedicated stream channel. The listener remains open for further
      accepts.
      Option B would end listening. Option C confuses a UDS path node with the
      accepted channel.
    concept: accept-returns-new-descriptor
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of the heap-allocated client_t passed to each handler?
    choices:
    - It lets the accept loop share one calculator memory across every client
    - It stores the server's listening descriptor so handlers can accept more clients
    - It ties one socket descriptor and one service object to one concurrent client
    answer: 2
    why: |
      The record is the handler's private bundle: the accepted channel and the
      calculator state for that channel. Sharing it would mix clients, and
      handlers do not need the listener descriptor.
      Option A defeats the per-client memory design. Option B gives handlers the
      wrong job and the wrong descriptor.
    concept: client-record-purpose
  - kind: spot-bug
    level: advanced
    q: Which line causes the use-after-free reported in the handler?
    code: |
      void spawn_handler(int client_sd) {
        struct client_t* c = malloc(sizeof(*c));
        c->sd = client_sd;
        pthread_t th;
        pthread_create(&th, NULL, handle_client, c);  /* line 5 */
        free(c);                                      /* line 6 */
        pthread_detach(th);
      }
    diagnostic_log: |
      AddressSanitizer: heap-use-after-free in handle_client
      READ of size 4 at freed client_t.sd
    choices:
    - 'Line 5: pthread_create must receive a copy of the record, not its address'
    - 'Line 6: the accept side frees the record while the new thread may still read it'
    - 'Line 4: the thread identifier must be heap allocated before the create call'
    answer: 1
    why: |
      The handler receives the record pointer and may not have run yet when the
      parent frees it. Ownership must pass to the handler, which frees the record
      after it finishes using the descriptor and service.
      Option A confuses how pthread_create passes arguments. Option C leaves the
      actual lifetime bug in place.
    concept: free-client-record-too-early
  source_ref: Text/socket_programming.xhtml - server stream loop, client handler, and per-client service

- id: b9
  type: syntax
  title: Connect a UDS Stream Client to a Listening Path
  explain_md: |
    A UDS stream client does not create the socket file, bind a public path, or
    listen. It connects to the path that the server has already bound.

    The sequence is: create a socket with the same family and shape as the
    listener, zero a `struct sockaddr_un`, set `sun_family`, copy the server's
    `sun_path`, and call `connect`. The kernel finds the bound server socket by
    that path and builds the private stream channel. The return value from
    `connect` is not a new descriptor; the client keeps using the descriptor it
    created with `socket`.

    If no server is listening at that path, `connect` fails. The usual cause is
    that the server has not started yet, or that the server used a different
    path. A stream client normally does not bind its own path because the
    connection itself gives the server a way to reply. A datagram UDS client is
    different: it must bind a path when the server needs to send a response.
  example:
    lang: c
    adapted: true
    code: |
      #include <sys/types.h>
      #include <sys/socket.h>
      #include <sys/un.h>
      #include <string.h>
      #include <unistd.h>

      int connect_uds(const char* path) {
        int sd = socket(AF_UNIX, SOCK_STREAM, 0);
        if (sd == -1) {
          return -1;
        }
        struct sockaddr_un addr;
        memset(&addr, 0, sizeof(addr));
        addr.sun_family = AF_UNIX;
        strncpy(addr.sun_path, path, sizeof(addr.sun_path) - 1);
        if (connect(sd, (struct sockaddr*)&addr, sizeof(addr)) == -1) {
          close(sd);
          return -1;
        }
        return sd;
      }
    explain_md: |
      connect_uds creates the connector socket and fills the server's address.
      The zeroing step clears any bytes the kernel may inspect, and the path copy
      leaves room for a terminating NUL. A failed connect closes the descriptor
      and reports failure; a successful call returns the same descriptor, now
      connected to the server. The snippet is compile-only because it needs a
      running listener to return success.
    note: Reduced the client to a connector helper that fills the UDS address and connects.
  checks:
  - kind: order
    level: core
    q: Order the 6 correct connector steps for a UDS stream client; all displayed lines are used.
    lines:
    - addr.sun_family = AF_UNIX
    - write(sd, request_bytes, request_len)
    - int sd = socket(AF_UNIX, SOCK_STREAM, 0)
    - connect(sd, (struct sockaddr*)&addr, sizeof(addr))
    - memset(&addr, 0, sizeof(addr))
    - strncpy(addr.sun_path, path, sizeof(addr.sun_path) - 1)
    answer_order:
    - 2
    - 4
    - 0
    - 5
    - 3
    - 1
    why: |
      The connector creates its socket, prepares a valid UDS address, reaches the
      listener with connect, and then uses the same descriptor to send the
      request. No bind or listen belongs in this sequence.
    concept: uds-stream-connector-order
    hint: A connector reaches an endpoint; it does not advertise one.
    from_chapter: ch22
    from_block: b20
  - kind: why-fails
    level: core
    q: >-
      A client calls connect to /tmp/calc.sock before the server has run. Why does the call fail instead of waiting
      for the server to start later?
    choices:
    - A stream connect needs a listener already attached to that path and receives an immediate error otherwise
    - The client descriptor must first be bound to the same path before connect can queue
    - The kernel queues the connect request indefinitely until any process binds the path
    answer: 0
    why: |
      connect on a stream channel tries to establish a session with an existing
      listener. If the path has no bound listening socket, there is nothing to
      accept the request and the call fails.
      Option B would create a conflict with the server's path. Option C invents
      an indefinite queue for an endpoint that does not exist.
    concept: connect-requires-listener
  - kind: predict
    level: core
    q: >-
      Trace the stream connector: the client never calls bind. After connect succeeds, how can the server send a
      response back?
    code: |
      int sd = socket(AF_UNIX, SOCK_STREAM, 0);
      connect(sd, (struct sockaddr*)&srv_addr, sizeof(srv_addr));
      write(sd, "7#ADD#1#2$", 11);
    choices:
    - The server cannot reply because the client has no filesystem path stored in sun_path
    - The server must call connect again by using the client process id as the destination
    - The connected stream channel identifies both endpoints, so the server replies on its accepted socket
    answer: 2
    why: |
      A stream connection is a private two-way session between the client socket
      and the server's accepted socket. No client path is needed for replies.
      Option A imports datagram addressing requirements into a stream. Option B
      invents a PID-based connection.
    concept: stream-reply-without-client-bind
  - kind: fillblank
    level: intro
    q: 'The client call that establishes a stream session with a listening endpoint is ___. (Answer format: one token)'
    answer_text: connect
    why: |
      connect targets the listener's address and establishes the stream channel.
      The client then reads and writes through the same descriptor it created
      with socket.
    concept: connector-call
  - kind: mcq
    level: intro
    q: Which address structure does a UDS stream client fill before calling connect?
    choices:
    - struct sockaddr_in with sin_family, sin_port, and sin_addr
    - struct sockaddr_un with sun_family and sun_path
    - struct sockaddr_storage with only a port number
    answer: 1
    why: |
      UDS endpoints use sockaddr_un, whose path field names the bound socket
      file. sockaddr_in is for IPv4 network endpoints and needs a port and IP
      address.
      Option C lacks the path that identifies a UDS listener.
    concept: uds-address-structure
  - kind: spot-bug
    level: advanced
    q: The client fails with "No such file or directory". Which line caused the server's endpoint to disappear?
    code: |
      int sd = socket(AF_UNIX, SOCK_STREAM, 0);
      struct sockaddr_un addr;
      memset(&addr, 0, sizeof(addr));
      addr.sun_family = AF_UNIX;
      strncpy(addr.sun_path, "/tmp/calc.sock", sizeof(addr.sun_path) - 1);
      unlink("/tmp/calc.sock");                       /* line 6 */
      int rc = connect(sd, (struct sockaddr*)&addr, sizeof(addr));
    diagnostic_log: |
      connect: No such file or directory
    choices:
    - 'Line 6: the client removes the server''s bound socket node before connecting'
    - 'Line 1: the client must create the socket with SOCK_DGRAM to reach a stream listener'
    - 'Line 5: the path must be copied without reserving space for a NUL terminator'
    answer: 0
    why: |
      unlink removes the filesystem node that names the listening socket. Once
      the node is gone, the client's connect has no endpoint to reach.
      Option B changes the channel shape. Option C creates a buffer-overflow risk
      instead of fixing the missing endpoint.
    concept: client-unlinks-server-node
  source_ref: Text/socket_programming.xhtml - UDS stream client sequence; Code Boxes 20-18..20-20

- id: b10
  type: model
  title: Preserve Message Boundaries with UDS Datagrams
  explain_md: |
    A UDS datagram channel changes the server's job. There is no connection, no
    session handshake, no listening mode, and no accept loop. The server creates
    a `SOCK_DGRAM` socket, binds it to a socket path, and then receives complete
    messages with `recvfrom`.

    `recvfrom` fills a buffer with exactly one datagram's bytes and also reports
    the sender's address. That sender address matters because a datagram
    response must name its destination. The server passes the saved address to
    `sendto`, which sends one whole datagram back. A plain `write` cannot choose
    a peer, so the datagram core must use `sendto` for responses.

    Datagrams preserve message boundaries but not a byte stream. Two sends are
    two messages; one receive consumes one message. The channel does not promise
    that messages arrive in order or survive at all. For the calculator, the
    one-request/one-response protocol fits this model because each request is
    already one delimited message.
  example:
    lang: c
    adapted: true
    code: |
      #include <stdio.h>
      #include <sys/types.h>
      #include <sys/socket.h>
      #include <unistd.h>

      int main(void) {
        int sv[2];
        if (socketpair(AF_UNIX, SOCK_DGRAM, 0, sv) == -1) {
          return 1;
        }
        send(sv[0], "one", 3, 0);
        send(sv[0], "two", 3, 0);

        char a[16];
        char b[16];
        ssize_t na = recv(sv[1], a, sizeof(a) - 1, 0);
        ssize_t nb = recv(sv[1], b, sizeof(b) - 1, 0);
        a[na] = '\0';
        b[nb] = '\0';
        printf("first=%s\n", a);
        printf("second=%s\n", b);
        close(sv[0]);
        close(sv[1]);
        return 0;
      }
    run_expected: |
      first=one
      second=two
    explain_md: |
      The socket pair is a datagram channel. Each send is one independent
      message, so the first recv returns only "one" and the second returns only
      "two". A stream socketpair could instead have joined both sends into one
      read, which is why datagrams are useful when the application message must
      stay intact.
    note: Used a datagram socketpair to isolate boundary preservation from pathname setup.
  viz:
    kind: ascii-memory
    steps:
    - 'SERVER: socket(AF_UNIX, SOCK_DGRAM, 0) -> bind("/tmp/calc_dgram.sock")'
    - 'SEND 1: client -> [ "7#ADD#1#2$" ] -> receiver kernel queue'
    - 'SEND 2: client -> [ "8#DIV#9#3$" ] -> receiver kernel queue'
    - 'RECVFROM: one receive returns one whole datagram plus the sender address'
    - 'REPLY: sendto(sd, response, len, sender_addr) -> exactly one response datagram'
  checks:
  - kind: why-fails
    level: core
    q: >-
      Why can a datagram receiver count on one receive returning exactly one application message, while a stream
      receiver cannot?
    choices:
    - A datagram receive waits until the sender closes, which marks the message boundary
    - A stream receiver adds delimiters automatically at each write boundary
    - A datagram send is one message that stays whole; a stream is only an ordered byte sequence
    answer: 2
    why: |
      Datagrams preserve send boundaries as message boundaries. Streams expose
      bytes and may split or coalesce writes, so the application must frame its
      own messages.
      Option A invents a close-based boundary. Option B invents automatic stream
      framing.
    concept: datagram-boundary-guarantee
  - kind: predict
    level: core
    q: >-
      Trace the datagram queue: a sender sends "12#ADD#1#2$" and then "13#MUL#3#4$". One recvfrom call asks for 200
      bytes. What does it return?
    code: |
      sendto(sd, "12#ADD#1#2$", 12, 0, &peer, plen);
      sendto(sd, "13#MUL#3#4$", 12, 0, &peer, plen);
      char buf[200];
      int n = recvfrom(sd, buf, sizeof(buf), 0, &from, &flen);
    choices:
    - Both messages concatenated, with n equal to their combined length
    - Only the first message, with n equal to that datagram's length
    - Either message, but with its bytes split across two receives
    answer: 1
    why: |
      Datagrams keep send boundaries, so one receive consumes one datagram. The
      second message remains queued for the next receive.
      Option A describes stream coalescing. Option C describes stream splitting.
    concept: one-datagram-per-receive
  - kind: fillblank
    level: intro
    q: 'The datagram receive call that also reports the sender''s address is ___. (Answer format: one token)'
    answer_text: recvfrom
    why: |
      recvfrom takes an address buffer and length so the server learns where to
      send its response. A response then uses sendto with that saved address.
    concept: recvfrom-name
  - kind: mcq
    level: core
    q: Which setup sequence does a UDS datagram server need?
    choices:
    - socket with SOCK_DGRAM, then bind to a path; no listen or accept
    - socket with SOCK_STREAM, then bind and listen; accept each sender
    - socket with SOCK_DGRAM, then listen; accept one datagram session
    answer: 0
    why: |
      Datagram servers bind an address and then receive messages. There are no
      sessions, so listening and accepting are meaningless.
      Option B uses the wrong channel shape. Option C applies stream-only calls
      to a datagram socket.
    concept: datagram-server-no-accept
  - kind: order
    level: core
    q: >-
      Order the 5 correct steps for a datagram server that receives a request and replies; all displayed lines are
      used.
    lines:
    - recvfrom(sd, buf, sizeof(buf), 0, &peer, &peer_len)
    - socket(AF_UNIX, SOCK_DGRAM, 0)
    - sendto(sd, resp, resp_len, 0, &peer, peer_len)
    - bind(sd, (struct sockaddr*)&addr, sizeof(addr))
    - deserialize and compute the response
    answer_order:
    - 1
    - 3
    - 0
    - 4
    - 2
    why: |
      The server creates the datagram socket, binds its reachable path, receives
      one whole message together with the sender address, computes the response,
      and sends that response back to the saved address.
    concept: datagram-server-order
    from_chapter: ch22
    from_block: b20
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of the sender address returned by recvfrom?
    choices:
    - It identifies which calculator operation the client requested
    - It lets the server bind a second listening socket for the client
    - It tells sendto where to deliver the response datagram
    answer: 2
    why: |
      A datagram carries no connection identity, so the address returned with
      the request is the only way to reply to that sender.
      Option A confuses transport addressing with application fields. Option B
      invents a second listener.
    concept: sender-address-for-reply
  - kind: spot-bug
    level: advanced
    q: The datagram server starts but fails immediately. Which line is wrong for this channel shape?
    code: |
      int sd = socket(AF_UNIX, SOCK_DGRAM, 0);
      bind(sd, (struct sockaddr*)&addr, sizeof(addr));
      int rc = listen(sd, 10);       /* line 3 */
      /* recvfrom and sendto would follow */
    diagnostic_log: |
      listen: Operation not supported
    choices:
    - 'Line 1: SOCK_DGRAM must be replaced by SOCK_STREAM before the socket can bind'
    - 'Line 3: listen belongs to stream listeners; a datagram socket only binds and receives'
    - 'Line 2: a datagram socket must be bound only after a successful listen call'
    answer: 1
    why: |
      Datagram sockets have no listening mode or backlog, so listen fails.
      Removing it leaves the correct datagram sequence of socket, bind, and
      recvfrom/sendto.
      Option A throws away the datagram shape that the application wants. Option
      C keeps the invalid listen call.
    concept: listen-on-datagram-bug
  source_ref: Text/socket_programming.xhtml - UDS datagram server/client and message boundaries; Code Boxes 20-21..20-26

- id: b11
  type: syntax
  title: Move the Same Stream Server onto TCP
  explain_md: |
    A TCP server is a network stream server. Its control flow is the same as a
    UDS stream server: socket, bind, listen, accept, then per-client read and
    write. Only the address representation and the family/type pair change.

    For IPv4, use `socket(AF_INET, SOCK_STREAM, 0)` and a
    `struct sockaddr_in`. Set `sin_family` to `AF_INET`, `sin_port` with
    `htons(port)` because the port is a 16-bit network-order value, and
    `sin_addr.s_addr` to `htonl(INADDR_ANY)` to accept connections on any local
    interface. Zero the structure first so padding and unused fields are clean.

    `INADDR_ANY` is not a remote address. It is the wildcard local address: bind
    it when the server should listen on every local interface, or bind a specific
    local address to restrict which interface receives traffic. The client fills
    the server's IP address and port, then connects. Ports are network-order
    values; the host's byte order must not leak into `sin_port`.
  example:
    lang: c
    adapted: true
    code: |
      #include <stdio.h>
      #include <string.h>
      #include <netinet/in.h>
      #include <arpa/inet.h>

      int main(void) {
        struct sockaddr_in addr;
        memset(&addr, 0, sizeof(addr));
        addr.sin_family = AF_INET;
        addr.sin_port = htons(8080);
        addr.sin_addr.s_addr = htonl(INADDR_ANY);

        printf("family_ok=%d\n", addr.sin_family == AF_INET);
        printf("port_ok=%d\n", addr.sin_port == htons(8080));
        printf("any_ok=%d\n", addr.sin_addr.s_addr == htonl(INADDR_ANY));
        return 0;
      }
    run_expected: |
      family_ok=1
      port_ok=1
      any_ok=1
    explain_md: |
      The structure is zeroed before its three meaningful fields are filled. The
      port and address comparisons use the same conversion functions as the
      assignments, so the printed checks are true regardless of host byte order.
      The program does not open a socket; it isolates the address preparation
      that a TCP server or client must get right.
    note: Reduced TCP setup to the sockaddr_in fields so it can run without opening a port.
  checks:
  - kind: order
    level: core
    q: Order the 5 correct startup steps for a TCP stream listener; all displayed lines are used.
    lines:
    - listen(sd, 10)
    - int sd = socket(AF_INET, SOCK_STREAM, 0)
    - accept(sd, NULL, NULL)
    - fill sockaddr_in with AF_INET, htons(port), and htonl(INADDR_ANY)
    - bind(sd, (struct sockaddr*)&addr, sizeof(addr))
    answer_order:
    - 1
    - 3
    - 4
    - 0
    - 2
    why: |
      TCP reuses the stream listener sequence. The only changes from UDS are the
      address family and the sockaddr_in fields; bind, listen, and accept keep
      their roles.
    concept: tcp-listener-order
    hint: A TCP listener still binds, listens, and accepts.
  - kind: why-fails
    level: core
    q: A server assigns sin_port = 8080 directly instead of htons(8080). Why may clients fail to connect to port 8080?
    choices:
    - sin_port must hold the 16-bit value in network byte order, not host byte order
    - sin_port must be a 32-bit value, so a 16-bit assignment truncates the address
    - sin_port must contain the client's source port rather than the server port
    answer: 0
    why: |
      Ports travel in network byte order. On a little-endian host, assigning the
      host value 8080 stores the bytes in the wrong order, so the kernel
      interprets a different network port.
      Option B confuses port width with word size. Option C confuses the
      listening port with an ephemeral source port.
    concept: port-network-order
  - kind: predict
    level: core
    q: 'Trace the bind: a server binds INADDR_ANY and port 8080. Which incoming TCP connections can reach it?'
    code: |
      addr.sin_addr.s_addr = htonl(INADDR_ANY);
      addr.sin_port = htons(8080);
      bind(sd, (struct sockaddr*)&addr, sizeof(addr));
    choices:
    - Only connections from the loopback address 127.0.0.1
    - Only connections whose peer port is also 8080
    - Connections addressed to port 8080 on any local interface
    answer: 2
    why: |
      INADDR_ANY is the wildcard local address, so the listener is reachable
      through every local interface on the chosen port.
      Option A restricts the address without any such bind. Option B confuses
      the server's port with the client's source port.
    concept: inaddr-any-wildcard
  - kind: fillblank
    level: intro
    q: >-
      The IPv4 socket address structure used with bind and connect on a TCP socket is struct ___. (Answer format:
      one token)
    answer_text: sockaddr_in
    why: |
      sockaddr_in holds the IPv4 family, 16-bit port, and 32-bit address.
      sockaddr_un is for UDS paths, not network endpoints.
    concept: sockaddr-in-name
  - kind: mcq
    level: intro
    q: Which common name describes a network stream socket?
    choices:
    - UDP datagram socket
    - TCP stream socket
    - UDS datagram socket
    answer: 1
    why: |
      A network stream socket uses the TCP transport protocol, so it is commonly
      called a TCP socket. A network datagram socket is called a UDP socket, and
      a UDS datagram socket has no transport protocol name.
    concept: tcp-naming
  - kind: spot-bug
    level: advanced
    q: >-
      Clients report that the server is not listening on port 8080. Which line causes the port mismatch on a
      little-endian host?
    code: |
      struct sockaddr_in addr;
      memset(&addr, 0, sizeof(addr));
      addr.sin_family = AF_INET;
      addr.sin_port = 8080;                 /* line 4 */
      addr.sin_addr.s_addr = htonl(INADDR_ANY);
      bind(sd, (struct sockaddr*)&addr, sizeof(addr));
      listen(sd, 10);
    diagnostic_log: |
      client: connect to 127.0.0.1:8080
      result: Connection refused
    choices:
    - 'Line 4: the port is stored in host byte order instead of network byte order'
    - 'Line 6: bind must come after listen so the port is translated by the kernel'
    - 'Line 5: INADDR_ANY prevents the port from being advertised to clients'
    answer: 0
    why: |
      The kernel reads sin_port as a network-order 16-bit value. Assigning the
      host constant directly changes the byte sequence on little-endian hosts,
      so the listener is bound to a different numeric port.
      Option B reverses bind and listen. Option C wrongly blames the wildcard
      address.
    concept: missing-htons-bug
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of the address passed to bind on a TCP server?
    choices:
    - It names the remote client process that the server will serve after it connects
    - It stores the server process id so the kernel can route every reply back home
    - It selects the local port and local interface addresses where clients may reach the server
    answer: 2
    why: |
      bind assigns the listener's local endpoint: a port and an address mask.
      The remote client is not known until a connection arrives.
      Option A confuses listener setup with a peer address. Option B invents
      PID-based routing.
    concept: bind-local-endpoint
  source_ref: Text/socket_programming.xhtml - TCP server/client and sockaddr_in; Code Boxes 20-27..20-30

- id: b12
  type: algorithm
  title: Convert Integers at Every Network Boundary
  explain_md: |
    Machines disagree about the byte order of multi-byte integers. The network
    protocols use **big-endian** order, called network byte order. A host that
    stores integers little-endian must convert before putting a 16-bit port or a
    32-bit IPv4 address into a protocol field, and convert back after reading
    one.

    The four functions are `htons` (host to network, 16-bit), `htonl` (host to
    network, 32-bit), `ntohs` (network to host, 16-bit), and `ntohl` (network to
    host, 32-bit). Use the 16-bit pair for ports and the 32-bit pair for IPv4
    addresses or other 32-bit fields. The functions are idempotent on a
    big-endian host, so correct code remains correct there.

    Apply a conversion exactly once per boundary. Converting twice on a
    little-endian host cancels the swap and puts host order back on the wire.
    Do not convert plain byte strings or single bytes: their order is already
    defined by the protocol.
  example:
    lang: c
    adapted: true
    code: |
      #include <stdio.h>
      #include <arpa/inet.h>

      int main(void) {
        unsigned short net_port = htons(0x1234);
        unsigned char* p = (unsigned char*)&net_port;
        printf("wire_bytes=%02x%02x\n", p[0], p[1]);
        printf("round_trip=%04x\n", ntohs(net_port));
        return 0;
      }
    run_expected: |
      wire_bytes=1234
      round_trip=1234
    explain_md: |
      htons converts the host value 0x1234 into network order. Reading the
      resulting object byte by byte shows 0x12 followed by 0x34 on every host,
      because network order is fixed. Converting back with ntohs recovers the
      original host value 0x1234.
    note: Prints the memory bytes of a converted port to make the wire order visible.
  checks:
  - kind: predict
    level: core
    q: >-
      Trace the stored bytes: after unsigned short p = htons(0x1234), what byte sequence appears in memory in
      increasing address order?
    code: |
      unsigned short p = htons(0x1234);
      unsigned char* b = (unsigned char*)&p;
      /* b[0], b[1] */
    choices:
    - 34 then 12, because the host stores the port little-endian
    - 12 then 34, because network byte order is big-endian
    - 00 then 12, because the high byte is reserved for the family
    answer: 1
    why: |
      Network byte order is big-endian, so the most significant byte 0x12 comes
      first regardless of the host's native order. The conversion function does
      the needed swap on a little-endian host.
      Option A ignores the conversion. Option C invents an extra reserved byte.
    concept: htons-byte-sequence
  - kind: fillblank
    level: core
    q: 'The 16-bit function that converts a network-order value back to host order is ___. (Answer format: one token)'
    answer_text: ntohs
    why: |
      ntohs is the network-to-host conversion for 16-bit values, typically used
      after receiving a port. htons goes the other direction.
    concept: ntohs-name
  - kind: order
    level: core
    q: Order the 5 correct conversion steps for sending and receiving a multi-byte field; all displayed lines are used.
    lines:
    - the receiver applies ntohs or ntohl to the field
    - compute the field value in host byte order
    - copy the network-order bytes into the outgoing message
    - apply htons or htonl to the field before transmission
    - the receiver reads the field from the incoming message
    answer_order:
    - 1
    - 3
    - 2
    - 4
    - 0
    why: |
      The sender starts with a host-order value, converts each multi-byte field
      exactly once, and copies the network-order bytes into the message. The
      receiver reads those bytes and converts back before using the value, so it
      gets the sender's original host value.
    concept: conversion-boundary-order
    hint: Convert after computing the value, and reverse the conversion after reading.
  - kind: why-fails
    level: advanced
    q: >-
      A client assigns sin_port = htons(htons(8080)). Why can the connection go to the wrong port on a little-endian
      host?
    choices:
    - The second conversion cancels the first, so host byte order is stored where network order is required
    - The second conversion overflows the 16-bit port field and truncates the value to zero
    - The second conversion is undefined for htons and may return a negative port value
    answer: 0
    why: |
      Each htons swaps the bytes on a little-endian host. Applying it twice
      restores the original host-order value, so the kernel interprets the bytes
      as a different network-order port.
      Option B invents overflow. Option C invents undefined double-call behavior.
    concept: double-conversion-bug
  - kind: mcq
    level: core
    q: Which pair should convert an IPv4 address stored in a 32-bit field?
    choices:
    - htons and ntohs
    - htonl and ntohs
    - htonl and ntohl
    answer: 2
    why: |
      IPv4 addresses are 32-bit values, so they use the long conversion pair:
      htonl before sending and ntohl after receiving. The short pair is for
      16-bit ports.
      Option B mixes widths and directions incorrectly.
    concept: 32-bit-address-conversion
  - kind: spot-bug
    level: advanced
    q: A binary header stores a 16-bit length. Which line makes a receiver on a little-endian host see the wrong length?
    code: |
      unsigned short len = 300;              /* line 1 */
      unsigned char header[2];
      memcpy(header, &len, sizeof(len));     /* line 3 */
      /* receiver reads network-order 16-bit length from header */
    diagnostic_log: |
      sender length: 300
      receiver parsed length: 1100
    choices:
    - 'Line 3: memcpy reverses the byte order of every multi-byte source object it copies'
    - 'Line 1 or 3: the length is copied in host order instead of being converted with htons'
    - 'Line 1: a 16-bit length field cannot represent the decimal value 300 at all'
    answer: 1
    why: |
      The header field is network order, so the sender must convert the length
      with htons before copying it. Copying host-order bytes lets the receiver
      interpret the swapped byte sequence as a different length.
      Option A is false: memcpy preserves byte order. Option C is false: 300 fits
      in 16 bits.
    concept: missing-htons-length-bug
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of network byte order in a protocol header?
    choices:
    - It gives every host one agreed byte layout for multi-byte integer fields
    - It makes every host store integers in its own fastest native order
    - It encrypts integer fields so only the receiver can read their values
    answer: 0
    why: |
      Network byte order is a shared convention, big-endian for the standard
      Internet functions, so both sides interpret a field the same way.
      Option B describes the problem the convention solves. Option C invents
      encryption.
    concept: network-order-purpose
  source_ref: Text/socket_programming.xhtml - network byte order and htons/htonl/ntohs/ntohl; Code Boxes 20-31..20-32

- id: b13
  type: syntax
  title: Send and Receive One UDP Message at a Time
  explain_md: |
    A UDP socket is a network datagram socket: `AF_INET` with `SOCK_DGRAM`. Like
    a UDS datagram server, it binds a local address and then uses `recvfrom` and
    `sendto`; it does not call listen or accept.

    The server's `sockaddr_in` supplies the local port and interface mask. Each
    incoming datagram gives the server a peer address, and the server sends its
    response to that address. A UDP client can bind its own local port when it
    needs a known reply address, but a connected UDP socket can also let the
    kernel assign a local address and remember the peer. Either way, one send is
    one datagram and one receive is one datagram.

    UDP does not guarantee delivery, ordering, or duplicate suppression. The
    calculator protocol is request/response and can tolerate a lost reply only
    if the client implements a retry or timeout outside the basic library. The
    transport also cannot carry a message larger than the datagram limits, so
    the protocol's small text messages are a good fit.
  example:
    lang: c
    adapted: true
    code: |
      #include <stdint.h>
      #include <string.h>
      #include <sys/socket.h>
      #include <netinet/in.h>
      #include <unistd.h>

      int udp_server(uint16_t port) {
        int sd = socket(AF_INET, SOCK_DGRAM, 0);
        if (sd == -1) {
          return -1;
        }
        struct sockaddr_in addr;
        memset(&addr, 0, sizeof(addr));
        addr.sin_family = AF_INET;
        addr.sin_addr.s_addr = htonl(INADDR_ANY);
        addr.sin_port = htons(port);
        if (bind(sd, (struct sockaddr*)&addr, sizeof(addr)) == -1) {
          close(sd);
          return -1;
        }
        return sd;
      }

      int udp_reply(int sd, const char* msg, size_t n,
                    const struct sockaddr* peer, socklen_t peer_len) {
        return (int)sendto(sd, msg, n, 0, peer, peer_len);
      }
    explain_md: |
      udp_server creates a datagram socket, binds it to a local port on every
      interface, and returns it for the receive loop. udp_reply sends exactly n
      bytes to the peer address saved from recvfrom. The snippet is compile-only
      because it leaves the receive loop and calculator callbacks to the shared
      datagram core.
    note: Reduced UDP setup to a compile-only server helper and reply function.
  checks:
  - kind: order
    level: core
    q: Order the 5 correct steps for a UDP server that handles one request and reply; all displayed lines are used.
    lines:
    - deserialize the request and compute the response
    - socket(AF_INET, SOCK_DGRAM, 0)
    - sendto(sd, resp, resp_len, 0, &peer, peer_len)
    - fill sockaddr_in and bind to the local port
    - recvfrom(sd, buf, sizeof(buf), 0, &peer, &peer_len)
    answer_order:
    - 1
    - 3
    - 4
    - 0
    - 2
    why: |
      UDP binds a local endpoint, receives one datagram with its sender address,
      computes, and sends the response to that saved address. There is no listen
      or accept step.
    concept: udp-server-order
  - kind: why-fails
    level: core
    q: Why does a UDP server not call listen or accept even though it is called a server?
    choices:
    - It must call listen only after the first datagram arrives from a client
    - It uses accept internally inside recvfrom, so the calls are merely optional
    - It is connection-less: each datagram arrives independently at the bound socket
    answer: 2
    why: |
      A UDP server is a bound endpoint that receives independent messages. There
      is no session to establish or accept.
      Option A invents late listening. Option B hides stream-only calls inside a
      datagram primitive.
    concept: udp-no-listen
  - kind: predict
    level: core
    q: >-
      Trace the UDP queue: the server has not called recvfrom, and two client datagrams arrive. What does the next
      recvfrom return?
    code: |
      /* datagram A arrives */
      /* datagram B arrives */
      int n = recvfrom(sd, buf, sizeof(buf), 0, &peer, &plen);
    choices:
    - Both datagrams concatenated into one buffer with one sender address
    - One whole datagram, A or B depending on the queue, with its own sender address
    - A stream of bytes that may split either datagram at any position
    answer: 1
    why: |
      Each datagram is a separate queued message carrying its own source
      address. A receive consumes one message; it does not join messages or
      expose a byte stream.
      Option A describes stream coalescing. Option C describes stream splitting.
    concept: udp-message-boundary
  - kind: fillblank
    level: intro
    q: 'The UDP receive call that reports the sender''s address is ___. (Answer format: one token)'
    answer_text: recvfrom
    why: |
      recvfrom returns one datagram and fills the peer address structure. The
      server needs that address because a UDP response must name its destination.
    concept: udp-recvfrom-name
  - kind: mcq
    level: core
    q: Which delivery guarantees does the basic UDP channel provide?
    choices:
    - Message boundaries, but no guaranteed delivery, ordering, or duplicate suppression
    - Guaranteed delivery and ordering, but no preservation of message boundaries
    - Guaranteed ordering and duplicate suppression, but no message boundaries
    answer: 0
    why: |
      UDP preserves each send as a datagram but does not promise that it arrives,
      that datagrams arrive in order, or that duplicates are removed. TCP is the
      stream transport with ordered, reliable delivery.
      Options B and C assign TCP guarantees to UDP.
    concept: udp-guarantees
  - kind: spot-bug
    level: advanced
    q: >-
      The UDP server computes a response but the client never receives it. Which line sends the reply to the wrong
      destination?
    code: |
      struct sockaddr_in local;
      struct sockaddr_in peer;
      socklen_t peer_len = sizeof(peer);
      recvfrom(sd, buf, sizeof(buf), 0, (struct sockaddr*)&peer, &peer_len);
      /* ... compute response ... */
      sendto(sd, resp, resp_len, 0, (struct sockaddr*)&local, sizeof(local));  /* line 6 */
    diagnostic_log: |
      client: timed out waiting for UDP response
      server: sendto returned success
    choices:
    - 'Line 4: recvfrom must copy the peer address only after the response is computed'
    - 'Line 6: sendto cannot be used on a socket that has already called bind'
    - 'Line 6: the reply is sent to the server''s local address instead of the saved peer address'
    answer: 2
    why: |
      sendto targets the address given to it. Passing the server's local address
      sends the response back to the server, not to the client that sent the
      request. The saved peer address is the correct destination.
      Option A changes when the address is captured without fixing the
      destination. Option B is false: bound datagram sockets use sendto
      normally.
    concept: wrong-peer-address-bug
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of the peer address saved from recvfrom on a UDP server?
    choices:
    - It tells the serializer which method name to parse next
    - It supplies the destination address for the response datagram
    - It becomes the server's new listening address after the first request
    answer: 1
    why: |
      UDP has no connection object that remembers the peer for the server, so the
      address returned by recvfrom is the only way to address the reply.
      Option A confuses transport metadata with protocol fields. Option C would
      move the listener away from its bound endpoint.
    concept: udp-peer-reply
  source_ref: Text/socket_programming.xhtml - UDP server/client and datagram reply addressing; Code Boxes 20-33..20-36

- id: b14
  type: design
  title: Map Four Transports onto Two Shared Cores
  explain_md: |
    The final design collapses the eight executables into two reusable shapes.
    Every **stream** server, whether UDS or TCP, needs bind, listen, accept, a
    per-client handler, and a serializer loop. Every **stream** client needs
    connect, a request serializer, a response deserializer, and a read loop. The
    address family changes only the address structures and the socket call
    arguments.

    Every **datagram** server, whether UDS or UDP, needs bind, recvfrom, a
    saved peer address, a serializer loop, and sendto. Every **datagram** client
    needs the matching receive/send loop and, for UDS, a bound local path when
    replies are required. Again, the family changes only addressing details.

    So two cores are enough: `srvcore` holds the server-side machinery,
    `clicore` holds the client-side machinery, and each core has stream and
    datagram entry points. Above them, `calcser` turns message bytes into
    request/response objects and back, while `calcsvc` performs the arithmetic.
    A thin main chooses family, shape, address, and port, then calls the right
    core entry point. Adding a transport is a new main, not a rewrite of the
    calculator.
  diagram:
    kind: flow
    caption: Four transport skins map onto stream/datagram cores and shared protocol/service libraries
    nodes:
    - {id: UDSS, label: "UDS stream main"}
    - {id: TCPS, label: "TCP stream main"}
    - {id: UDSD, label: "UDS datagram main"}
    - {id: UDPD, label: "UDP datagram main"}
    - {id: SRV, label: "srvcore"}
    - {id: CLI, label: "clicore"}
    - {id: SER, label: "calcser"}
    - {id: SVC, label: "calcsvc"}
    edges:
    - {from: UDSS, to: SRV}
    - {from: TCPS, to: SRV}
    - {from: UDSD, to: SRV}
    - {from: UDPD, to: SRV}
    - {from: UDSS, to: CLI}
    - {from: TCPS, to: CLI}
    - {from: UDSD, to: CLI}
    - {from: UDPD, to: CLI}
    - {from: SRV, to: SER}
    - {from: CLI, to: SER}
    - {from: SRV, to: SVC}
    - {from: CLI, to: SVC}
    steps:
    - {focus: [UDSS, TCPS, UDSD, UDPD], note: "each main selects only family, shape, address, and port"}
    - focus: [UDSS, TCPS, UDSD, UDPD, SRV, CLI]
      note: >-
        stream mains use stream core paths; datagram mains use datagram core
        paths
    - focus: [UDSS, TCPS, UDSD, UDPD, SRV, CLI, SER, SVC]
      note: >-
        all paths share the same serializer and calculator service
  checks:
  - kind: mcq
    level: core
    q: Which shared core handles a UDP datagram server?
    choices:
    - srvcore's datagram path, because it uses recvfrom and sendto without accept
    - srvcore's stream path, because every server uses accept before reading
    - clicore's stream path, because UDP is a client-only transport
    answer: 0
    why: |
      UDP is a server-capable datagram channel. Its server needs bind,
      recvfrom, and sendto, which the datagram path of srvcore provides.
      Option B imports stream-only accept behavior. Option C wrongly removes the
      server role and chooses the wrong shape.
    concept: udp-core-mapping
  - kind: why-fails
    level: advanced
    q: >-
      A programmer tries to serve UDP by calling the stream core, which waits in accept for each client. Why does
      this design fail?
    choices:
    - UDP clients do connect, but they connect only after the server calls listen twice
    - The stream core can accept UDP, but it loses the peer address needed for replies
    - UDP is connection-less, so no accept session ever appears; the server must recvfrom each datagram
    answer: 2
    why: |
      The stream core is built around connection establishment and a dedicated
      accepted socket. UDP has neither, so a server waiting in accept never
      receives the datagrams.
      Option A invents double listening. Option B describes an impossible accept
      for a datagram socket rather than the actual design mismatch.
    concept: wrong-core-for-datagram
  - kind: choose-better
    level: advanced
    q: A team must add IPv6 support later. Which design best preserves the calculator project's architecture?
    choices:
    - Copy calcsvc and calcser into IPv6-only versions so no shared library changes
    - Add thin mains that fill IPv6 addresses and call the existing stream/datagram cores
    - Merge srvcore and clicore into the calculator service and branch on family inside it
    answer: 1
    why: |
      Family-specific details belong in the thin main or a small address helper.
      The stream/datagram behavior and the protocol/service layers should stay
      shared.
      Option A duplicates logic that does not depend on the address family. Option
      C destroys the layering that keeps the service transport-blind.
    concept: adding-transport-family
  - kind: fillblank
    level: core
    q: 'The shared library that contains the client-side transport loop is named lib___.a. (Answer format: one token)'
    answer_text: clicore
    why: |
      clicore is the client common core. It contains the stream and datagram
      client loops, while srvcore contains the matching server loops.
    concept: clicore-library-name
  - kind: order
    level: core
    q: Order the 5 layers of work for one calculator request; all displayed lines are used.
    lines:
    - calcsvc computes the result from the request
    - a thin main selects family, shape, address, and port
    - calcser serializes the response and the core sends it
    - the core establishes or reuses the transport channel
    - calcser deserializes incoming bytes into a request object
    answer_order:
    - 1
    - 3
    - 4
    - 0
    - 2
    why: |
      Transport selection happens in the main, channel handling in the core,
      message conversion in calcser, arithmetic in calcsvc, and response framing
      back in calcser before the core sends it. This order is the same for all
      four socket varieties.
    concept: layered-request-flow
    hint: The service runs only after a complete request object exists.
  - kind: eipe
    level: core
    q: In one sentence, what is the purpose of keeping each transport main thin?
    choices:
    - It confines family and address choices to one place while shared cores handle behavior
    - It makes every executable contain its own copy of the calculator service
    - It forces the serializer to know which address family is currently active
    answer: 0
    why: |
      A thin main is a configuration layer: family, shape, address, and port.
      The reusable behavior stays in the cores, and the protocol/service layers
      remain unaware of the chosen transport.
      Option B duplicates logic. Option C leaks transport knowledge into the
      serializer.
    concept: thin-main-purpose
  - kind: spot-bug
    level: advanced
    q: >-
      A new TCP server main links the datagram core and passes SOCK_STREAM. Which line explains why it never handles
      a client?
    code: |
      int sd = socket(AF_INET, SOCK_STREAM, 0);
      bind(sd, (struct sockaddr*)&addr, sizeof(addr));
      listen(sd, 10);
      int rc = datagram_server_loop(sd);   /* line 4 */
    diagnostic_log: |
      server: started, listening backlog configured
      client: connected, then timed out waiting for response
    choices:
    - 'Line 3: listen must be omitted for every TCP server that calls a shared transport core'
    - 'Line 1: SOCK_STREAM must be replaced with SOCK_DGRAM when linking the srvcore library'
    - 'Line 4: a stream listener must use the stream core so it accepts and handles connection sockets'
    answer: 2
    why: |
      The listening socket has completed connections waiting in its backlog, but
      the datagram loop expects independent messages and never accepts a
      connection. The stream core is the correct match for SOCK_STREAM.
      Option A removes a valid TCP step. Option B changes the requested transport
      instead of fixing the core choice.
    concept: mismatched-core-bug
  source_ref: Text/socket_programming.xhtml - final calculator architecture and transport cores
