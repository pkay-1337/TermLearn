- id: b15
  type: design
  title: Retry Blocking Socket Calls Interrupted by Signals
  explain_md: Blocking socket calls such as `accept()`, `read()`, `write()`, and `recvfrom()` can return `-1` with `errno == EINTR` when a signal is delivered before the call completes. `EINTR` means the wait was interrupted, not that the socket or listener is broken. For `accept()`, retry the call on the still-valid listening socket. For reads and writes, retry only when no bytes moved; if a partial transfer occurred, continue from the new offset rather than repeating the whole buffer. A common pattern is `do { rc = accept(sd, ...); } while (rc == -1 && errno == EINTR);`. Treating every `-1` as fatal makes a server exit merely because a signal arrived.
  checks:
  - kind: mcq
    level: core
    q: A blocking `accept()` returns `-1` and `errno == EINTR` after a signal handler runs. What happened?
    choices:
    - The listening socket was closed by the signal
    - The call was interrupted before a connection was accepted; the listening socket remains valid and `accept()` can be retried
    - The peer connected but sent no data
    - The kernel converted the listener to a datagram socket
    answer: 1
    why: EINTR reports interruption of the blocking wait. The listener is still open, so retrying accept() is correct. The other options invent a closed listener, an accepted peer, or a socket-type change.
    concept: eintr-accept-retry
  - kind: choose-better
    level: advanced
    q: Which accept loop handles an interrupted system call correctly?
    choices:
    - while (1) { int c = accept(server_sd, NULL, NULL); if (c == -1) { if (errno == EINTR) continue; perror("accept"); break; } handle(c); }
    - while (1) { int c = accept(server_sd, NULL, NULL); if (c == -1) { perror("accept"); exit(1); } handle(c); }
    answer: 0
    why: The first loop retries only when errno is EINTR and otherwise reports a real failure. The second treats an interruption as fatal and terminates the server. A retry is safe because no connection was accepted when EINTR was returned.
    concept: eintr-retry-pattern
  - kind: why-fails
    level: core
    q: Why should a server not treat `EINTR` from `accept()` as proof that its listening socket is unusable?
    choices:
    - EINTR is returned only after a connection was accepted
    - EINTR means the blocking wait was interrupted by a signal; the descriptor remains open and the accept can be retried
    - EINTR means the kernel has permanently disabled the backlog
    - EINTR is returned only for datagram sockets
    answer: 1
    why: The signal interrupted the wait, not the socket. The listener remains valid and the pending connection queue is unaffected. The other choices confuse interruption with acceptance, permanent listener failure, or a socket-type rule.
    concept: eintr-not-listener-failure
  - kind: eipe
    level: advanced
    q: After `accept()` returns `-1` with `errno == EINTR`, what is the state of the listening socket?
    choices:
    - It is still open and still listening; the call can be repeated
    - It is closed and must be recreated with `socket()`
    - It has automatically accepted the next client
    - It has been converted to a connected socket
    answer: 0
    why: EINTR does not close or rebind the listener. It reports that the wait ended early, so the same listener can be used for another accept().
    concept: eintr-listener-state
  - kind: mcq
    level: intro
    q: Which condition makes retrying a blocking socket call appropriate after `-1`?
    choices:
    - '`errno == EINTR`'
    - '`errno == ENOENT`'
    - '`errno == EMFILE`'
    - Any error, because all socket errors are transient
    answer: 0
    why: EINTR is the explicit interrupted-call condition. ENOENT and EMFILE describe missing endpoints and exhausted descriptors, which need different handling; not every error is transient.
    concept: eintr-retry-condition
- id: b16
  type: design
  title: Handle SIGPIPE and EPIPE on Broken Writes
  explain_md: 'A write to a stream socket whose peer has closed can raise `SIGPIPE`. The default action for `SIGPIPE` terminates the process, so a server can die just because one client disconnected. Robust programs ignore `SIGPIPE` with `signal(SIGPIPE, SIG_IGN)` or use `send()` with `MSG_NOSIGNAL`; the write then returns `-1` with `errno == EPIPE` instead of killing the process. A positive short count is a partial write, not EPIPE, and is handled by continuing from the unsent bytes. Once EPIPE is reported, the channel is dead: log it, tear down the connection, and do not retry the same write forever.'
  checks:
  - kind: mcq
    level: core
    q: What signal can be delivered when a process writes to a stream socket whose remote peer has closed?
    choices:
    - SIGPIPE
    - SIGCHLD
    - SIGALRM
    - SIGCONT
    answer: 0
    why: Writing to a broken stream channel raises SIGPIPE. SIGCHLD reports child state changes, SIGALRM reports timers, and SIGCONT resumes a stopped process; none is the broken-pipe signal.
    concept: sigpipe-signal
  - kind: spot-bug
    level: advanced
    q: The server writes to a client socket without ignoring SIGPIPE. The client crashes, and the next write kills the server process. Which defect explains the abrupt server death?
    code: |
      ssize_t send_reply(int sd, const char *buf, size_t n) {
        return write(sd, buf, n);
      }
    choices:
    - The write uses a size_t length
    - The default SIGPIPE disposition terminates the process when the peer is gone; the server should ignore SIGPIPE or use MSG_NOSIGNAL and handle EPIPE
    - The server must call listen() again after every write
    - The buffer must be null-terminated before every write
    answer: 1
    why: The peer close makes the channel broken. Without SIGPIPE ignored or MSG_NOSIGNAL, the signal uses its default fatal action. The other options misunderstand write types, listener lifecycle, and stream payload rules.
    concept: sigpipe-default-fatal
    diagnostic_log: |-
      write failed: Broken pipe
      [process terminated by signal 13: SIGPIPE]
  - kind: choose-better
    level: advanced
    q: Which server-side setup handles a dead peer without killing the process?
    choices:
    - signal(SIGPIPE, SIG_IGN); then treat write() == -1 with errno == EPIPE as a dead connection and tear it down
    - Leave SIGPIPE at its default and call write() repeatedly until it succeeds
    - Catch SIGPIPE and restart the whole server process
    - Convert the stream socket to a datagram socket before writing
    answer: 0
    why: Ignoring SIGPIPE turns the event into an EPIPE error the server can handle locally. Retrying a dead channel or restarting the server is wasteful; changing the socket type is unrelated.
    concept: sigpipe-ignore-epipe
  - kind: why-fails
    level: core
    q: Why is retrying a write after it returns `-1` with `errno == EPIPE` pointless?
    choices:
    - EPIPE means the peer is gone; the stream channel is dead, so the same write cannot succeed
    - EPIPE means the buffer was too small and a larger buffer will work
    - EPIPE means the socket is temporarily busy and a sleep will fix it
    - EPIPE means the kernel has no route to the local host
    answer: 0
    why: 'EPIPE reports a broken pipe: the peer end is gone. Retrying the same dead channel does not restore the peer. The other options confuse it with buffer sizing, temporary backpressure, or routing.'
    concept: epipe-dead-channel
  - kind: eipe
    level: advanced
    q: What is the relationship between `SIGPIPE` and `EPIPE` on a broken stream write?
    choices:
    - SIGPIPE is the signal raised by the broken write; if it is ignored, the call reports the failure as `-1` with `errno == EPIPE`
    - EPIPE is the signal and SIGPIPE is the errno value
    - Both are returned only for datagram sockets
    - SIGPIPE is raised only after EPIPE has been handled
    answer: 0
    why: The failed write raises SIGPIPE; suppressing that signal lets the system call return the EPIPE error. The names are not reversed, and the behavior belongs to broken stream channels, not datagram boundaries.
    concept: sigpipe-epipe-relationship
- id: b17
  type: design
  title: Recognize Descriptor Exhaustion at socket()
  explain_md: Every socket consumes one entry in the process's file descriptor table. The operating system caps that table, often through `RLIMIT_NOFILE`. When the table is full, `socket()` fails with `-1` and `errno == EMFILE` (too many open files). This is a local resource limit, not a bad address family, missing route, or protocol error. Servers must close descriptors they no longer need, especially per-client sockets, and must handle EMFILE gracefully instead of leaking a descriptor on every failed path.
  checks:
  - kind: mcq
    level: core
    q: A process has exhausted its file descriptor limit. What does `socket()` return?
    choices:
    - '`-1` with `errno == EMFILE`'
    - '`0`, which is stdin'
    - A valid descriptor obtained by reusing the oldest socket
    - '`-1` with `errno == ENOENT`'
    answer: 0
    why: The socket needs a free file descriptor table entry. With none available, the call fails with EMFILE. Descriptor 0 is a real descriptor, not a fallback; ENOENT describes a missing path, not exhaustion.
    concept: emfile-socket-failure
  - kind: why-fails
    level: advanced
    q: Why can `socket()` fail with `EMFILE` even when the machine has plenty of free memory?
    choices:
    - Sockets are limited by the process descriptor table rather than by RAM alone
    - Sockets need a filesystem path before they can allocate memory
    - The kernel refuses sockets whenever the network is down
    - EMFILE means the address family is unsupported
    answer: 0
    why: EMFILE is an exhaustion of the process descriptor table, a separate resource limit. Memory availability does not guarantee a free descriptor slot. The other choices confuse resource classes, paths, network state, and address-family errors.
    concept: emfile-resource-limit
  - kind: choose-better
    level: advanced
    q: Which handler avoids leaking descriptors across client sessions?
    choices:
    - After handling a client, close(client_sd); if close is skipped on an error path, still route it through a single cleanup block
    - Leave every accepted descriptor open so later writes can reuse it
    - Ignore EMFILE and keep calling accept() until it succeeds
    - Allocate one new socket for every failed write and never close it
    answer: 0
    why: A single cleanup path closes each accepted descriptor exactly once, preserving descriptor-table capacity. Leaving descriptors open, spinning on EMFILE, or allocating more sockets consumes the same exhausted resource.
    concept: emfile-cleanup-discipline
  - kind: eipe
    level: core
    q: What resource does each open socket consume?
    choices:
    - One entry in the process file descriptor table
    - One entry in the routing table
    - One dedicated CPU core
    - One filesystem inode even for network sockets
    answer: 0
    why: A socket is represented by a descriptor in the process table. Routing entries, CPU cores, and filesystem inodes are different resources and are not consumed one-per-socket.
    concept: socket-descriptor-resource
  - kind: mcq
    level: intro
    q: Which errno specifically reports that a process has too many open file descriptors?
    choices:
    - EMFILE
    - EINTR
    - ENOENT
    - EADDRINUSE
    answer: 0
    why: EMFILE is the descriptor-table exhaustion error. EINTR is interruption, ENOENT is a missing path or endpoint, and EADDRINUSE is an address already in use.
    concept: emfile-errno
- id: b18
  type: design
  title: Restart TCP Listeners with SO_REUSEADDR and TIME_WAIT
  explain_md: After a TCP connection closes, one endpoint can remain in `TIME_WAIT` for roughly 30-120 seconds so delayed duplicate segments cannot be mistaken for a new connection. A new listener that tries to bind the same local port during that interval can fail with `EADDRINUSE`. Setting `SO_REUSEADDR` before `bind()` lets the listener reuse the local address and port when no active listener owns them, so a restart does not have to wait for TIME_WAIT to expire. It does not permit two simultaneous listeners on the same address and port. This is a TCP/IP port issue; a stale UDS path is a filesystem node and is handled by `unlink()` instead.
  checks:
  - kind: why-fails
    level: advanced
    q: Why can restarting a TCP server immediately after it terminates fail with `EADDRINUSE` even though the process is gone?
    choices:
    - The old connection may linger in TIME_WAIT, keeping the local port reserved while delayed segments are absorbed
    - TCP requires a reboot to clear every closed port
    - The kernel permanently assigns the port to the first process that used it
    - The new process lacks permission to bind any port above 1024
    answer: 0
    why: TIME_WAIT keeps the endpoint reserved temporarily so late duplicates cannot corrupt a new connection. Rebooting, permanent ownership, and a blanket high-port permission rule are not the cause.
    concept: timewait-port-reservation
  - kind: mcq
    level: core
    q: Where should `SO_REUSEADDR` be set for a TCP listener?
    choices:
    - On the listening socket, before `bind()`
    - After `accept()` on each connected socket
    - Only after the first `EADDRINUSE` failure, on the peer socket
    - On the client socket after `connect()`
    answer: 0
    why: The option must be active when bind() reserves the local endpoint, so it is set on the listening socket before bind(). It is not a per-accepted-connection or client-side setting.
    concept: reuseaddr-before-bind
  - kind: choose-better
    level: advanced
    q: Which restart path handles TIME_WAIT correctly?
    choices:
    - int one = 1; setsockopt(server_sd, SOL_SOCKET, SO_REUSEADDR, &one, sizeof(one)); bind(server_sd, ...);
    - bind(server_sd, ...); setsockopt(server_sd, SOL_SOCKET, SO_REUSEADDR, &one, sizeof(one));
    - sleep(forever) until the old process is forgotten, then bind without an option
    - Call listen() before bind() so the port is reserved early
    answer: 0
    why: SO_REUSEADDR must be set before bind so bind can reuse a port that is only lingering in TIME_WAIT. Setting it after bind, sleeping forever, or reordering listen before bind does not solve the reservation.
    concept: reuseaddr-order
  - kind: eipe
    level: advanced
    q: What does `SO_REUSEADDR` not allow?
    choices:
    - Two active listeners bound to the same address and port at the same time
    - A listener to bind a local port whose previous connection is in TIME_WAIT
    - A server to restart without waiting for TIME_WAIT to expire
    - A TCP listener to reserve its local endpoint before accepting clients
    answer: 0
    why: SO_REUSEADDR relaxes reuse of a lingering endpoint; it does not create two simultaneous owners of one address and port. The other options describe valid effects of the option.
    concept: reuseaddr-no-double-listener
  - kind: mcq
    level: core
    q: A UDS server finds a stale socket file at its bind path after a crash. What handles that stale endpoint?
    choices:
    - Call `unlink()` on the socket path before `bind()`
    - Set `SO_REUSEADDR` on the UDS socket
    - Call `listen()` twice
    - Use `connect()` before `bind()`
    answer: 0
    why: A UDS endpoint is a filesystem node, so a stale path is removed with unlink(). SO_REUSEADDR is a TCP/IP port option and does not delete the filesystem node; listen and connect do not clear it.
    concept: uds-stale-file-vs-reuseaddr
- id: b19
  type: design
  title: Detect Truncated Datagram Reads with MSG_TRUNC
  explain_md: '`recvfrom()` on a datagram socket copies at most the buffer size and returns the number of bytes copied, not necessarily the original datagram length. If the datagram is larger than the buffer, the extra bytes are discarded and the call returns the buffer size; the remainder cannot be read by calling `recvfrom()` again because the datagram boundary has already been consumed. On Linux, passing `MSG_TRUNC` makes `recvfrom()` return the full datagram length even when the buffer is smaller, so the receiver can detect truncation; `MSG_PEEK | MSG_TRUNC` can inspect the length before deciding how much space to allocate. The receiver must size its buffer for the protocol''s maximum or detect and reject oversized datagrams.'
  checks:
  - kind: predict
    level: core
    q: A 50-byte datagram arrives. The receiver passes a 20-byte buffer to `recvfrom()` with no flags. What does `recvfrom()` return?
    choices:
    - '20'
    - '30'
    - '50'
    - -1 with EMSGSIZE
    answer: 0
    why: Without MSG_TRUNC, recvfrom copies at most 20 bytes and returns the copied count, 20. The other 30 bytes are discarded. It does not return 30 or 50, and a small buffer is not an error.
    concept: recvfrom-small-buffer-return
  - kind: mcq
    level: advanced
    q: Which Linux flag makes `recvfrom()` report the full datagram length even when the supplied buffer is smaller?
    choices:
    - '`MSG_TRUNC`'
    - '`MSG_PEEK` alone'
    - '`MSG_WAITALL`'
    - '`MSG_OOB`'
    answer: 0
    why: MSG_TRUNC makes the return value report the original datagram size so truncation is detectable. MSG_PEEK alone only leaves the datagram queued; MSG_WAITALL and MSG_OOB serve other purposes.
    concept: msg-trunc-flag
  - kind: why-fails
    level: advanced
    q: Why can a receiver not recover the missing bytes by calling `recvfrom()` again after a datagram was truncated?
    choices:
    - The whole datagram was consumed atomically; the discarded tail is gone and the next call waits for a different datagram
    - The kernel queues the tail for the next read only when MSG_PEEK is set
    - The second call returns the tail only if the buffer is larger
    - The datagram remains queued until the receiver acknowledges it
    answer: 0
    why: Datagrams preserve boundaries atomically. A short buffer truncates and consumes the datagram, so the tail is not a second message. The other options invent tail queuing, buffer-dependent recovery, or acknowledgments.
    concept: datagram-truncation-irrecoverable
  - kind: choose-better
    level: advanced
    q: Which receive path handles oversized datagrams safely?
    choices:
    - Use a buffer sized for the protocol maximum, and use MSG_TRUNC or a length check to reject anything larger
    - Always use a 20-byte buffer and assume every datagram is small
    - Call recvfrom twice and concatenate the two results
    - Use a stream socket so the kernel splits the datagram automatically
    answer: 0
    why: A maximum-size buffer prevents silent truncation, and a length check detects oversize input. A fixed tiny buffer loses data, a second recvfrom does not recover the tail, and changing to a stream socket destroys the datagram boundary semantics.
    concept: datagram-size-validation
  - kind: eipe
    level: core
    q: What does a `recvfrom()` return value equal to the buffer size tell the receiver when `MSG_TRUNC` is not used?
    choices:
    - The datagram may have been exactly that size or larger; truncation is possible and must be considered
    - The datagram was definitely exactly that size
    - The datagram was split into two messages
    - The sender used a stream socket
    answer: 0
    why: Without MSG_TRUNC, the return value is the number copied, so a full buffer cannot distinguish an exact fit from a truncated larger datagram. The other options assert certainty the call does not provide.
    concept: recvfrom-full-buffer-ambiguity
- id: b20
  type: design
  title: Let the Kernel Assign a UDP Client's Ephemeral Port
  explain_md: 'A UDP client may skip `bind()`. On its first `sendto()`, the kernel performs an implicit bind: it selects a local source address according to the route and assigns a free ephemeral port from the system''s dynamic port range. That source address and port stay associated with the socket for its lifetime, so the server can send replies back to them. `bind()` with port 0 explicitly requests the same ephemeral assignment. This differs from a UDS datagram client, which must bind its own filesystem socket path because a UDS endpoint has no automatic ephemeral namespace.'
  checks:
  - kind: mcq
    level: core
    q: How does an unbound UDP client socket obtain a local port when it first calls `sendto()`?
    choices:
    - The kernel implicitly binds it to an available ephemeral port
    - The client sends from port 0 and the server assigns a port
    - The compiler assigns a port from the source line number
    - The client must read a port from /dev/urandom
    answer: 0
    why: The first sendto triggers an implicit bind that chooses a free ephemeral port. Port 0 is not the source port on the wire, the compiler has no role, and the kernel does not require the application to choose a random device.
    concept: udp-implicit-ephemeral-bind
  - kind: why-fails
    level: advanced
    q: Why must a UDS datagram client bind its own socket path even though a UDP client can skip `bind()`?
    choices:
    - UDS has no automatic ephemeral address; the server needs a filesystem path in the client address to send a reply
    - UDS datagram sockets cannot receive data
    - The UDS kernel assigns a port only after `listen()`
    - UDP clients actually bind an invisible path instead of a port
    answer: 0
    why: A UDP client receives an implicit IP address and ephemeral port, but a UDS endpoint is a filesystem path with no automatic allocation. Without the client path, the server has no return address. UDS datagrams can receive, listen is not used for datagrams, and UDP does not use filesystem paths.
    concept: uds-client-bind-vs-udp
  - kind: choose-better
    level: advanced
    q: Which UDP client design lets the kernel choose the local port?
    choices:
    - Create the socket and call `sendto()` without binding; or call `bind()` with port 0 to request an ephemeral port explicitly
    - Bind a hardcoded port below 1024 before sending
    - Call `listen()` and then `sendto()`
    - Bind the server destination port locally before sending
    answer: 0
    why: Omitting bind or binding port 0 delegates ephemeral port selection to the kernel. Hardcoding a low port, calling listen on a datagram client, or binding the server port locally is incorrect.
    concept: udp-ephemeral-bind-choice
  - kind: eipe
    level: core
    q: What does passing port 0 to `bind()` mean for a UDP socket?
    choices:
    - Ask the kernel to choose an available ephemeral port
    - Bind to the server port
    - Disable replies from the server
    - Use port 0 as the literal source port
    answer: 0
    why: 'Port 0 is the ephemeral request: the kernel assigns a free local port. It is not the server port, it does not disable replies, and the assigned port is not 0 on the wire.'
    concept: bind-port-zero-ephemeral
  - kind: predict
    level: advanced
    q: A UDP client sends from an unbound socket to a server. What source information does the server receive with the datagram?
    choices:
    - The client's chosen source IP address and the ephemeral port the kernel assigned
    - No source address, because the client never called bind
    - The server port as both source and destination
    - The client filesystem path
    answer: 0
    why: The implicit bind gives the socket a source IP and ephemeral port, and recvfrom reports that address. The client is not addressless, the source is not the server port, and UDP has no filesystem path.
    concept: udp-implicit-source-address
