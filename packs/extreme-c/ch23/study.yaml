    why: |
      Code Box 20-19 constructs the per-client server-side serializer with a
      ring buffer size of 256. The client-side constructor in Code Box 20-22
      uses 128 - the two sides need not match, since each holds its own
      incoming message stream, but the server's is the number this block's
