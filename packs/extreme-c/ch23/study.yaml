    - 'Line 11-12: the service is destroyed before the serving loop runs, so every callback afterward operates on a dead object - teardown must wait until after the read() loop breaks, as client_handler orders it'
    - 'Line 6: the serializer ring size must be 128 here, matching the client''s constructor'
    - 'Line 3: context.addr must be freed before any read, or the kernel leaks the descriptor'
