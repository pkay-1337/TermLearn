- id: b5
  type: design
  title: 'Model the Calculator Service: Standalone, Stateful, Transport-Blind Logic'
  explain_md: |
    The third common part of the project is the **calculation service** — the
    core functionality of the calculator — declared in
    `calcsvc/calc_service.h` (service header):

    ```c
    static const int CALC_SVC_OK = 0;
    static const int CALC_SVC_ERROR_DIV_BY_ZERO = -1;
    /* lifecycle + operations */
    void calc_service_ctor(...);            /* plus _new/_dtor/_delete */
    void calc_service_reset_mem(struct calc_service_t*);
    double calc_service_get_mem(struct calc_service_t*);
    double calc_service_add(struct calc_service_t*, double, double, bool_t mem);
    double calc_service_sub(struct calc_service_t*, double, double, bool_t mem);
    double calc_service_mul(struct calc_service_t*, double, double, bool_t mem);
    int calc_service_div(struct calc_service_t*, double, double, double*);
    ```

    Two deliberate design facts follow (both design statements):

    - **Transport-blind and dependency-free.** "The input arguments are pure
      C types, and it is in no way dependent on IPC-related or
      serialization-related classes or types. Since it is isolated as a
      standalone logic, we compile it into an independent static library
      named `libcalcsvc.a`." Every server executable must link against it to
      do the actual calculations.
    - **Stateful by necessity.** The interface carries a *stateless-vs-
      stateful* doctrine: "if a service for a client doesn't require us to
      remember any state from the previous requests of that client, then we
      can use a singleton service object" (a **stateless** service). The
      calculator is the opposite case — it has "an internal memory that is
      unique for each client", so "for every client, we need to have a
      specific service object. These objects are known as **stateful**
      service objects." That is exactly why the stream server's handler
      (client_handler) and the datagram loop (serve_forever) each build a
      fresh service object alongside the fresh serializer.

    Note how the interface also shapes error reporting: `add`, `sub`, and
    `mul` can only produce numbers, but **division can fail** — so
    `calc_service_div` returns an `int` (`CALC_SVC_OK` or
    `CALC_SVC_ERROR_DIV_BY_ZERO`) and hands the quotient out through a
    `double*` parameter. The server's request callback maps a failed
    division to the protocol's `STATUS_DIV_BY_ZERO` (4) response status,
    keeping service errors and wire statuses in separate namespaces.
  diagram:
    kind: flow
    caption: Stateless singleton or per-client service objects
    nodes:
    - id: ST
      label: per-client state needed?
      shape: decision
    - id: SGL
      label: one singleton object
      shape: io
    - id: OBJ
      label: one object per client
      shape: io
    - id: MEM
      label: calculator memory
      shape: io
