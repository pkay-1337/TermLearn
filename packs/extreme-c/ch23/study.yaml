  - kind: eipe
    level: core
    q: In one sentence, what job does the request ID field perform in the calculator protocol?
    choices:
    - It encrypts the operands before the message is pushed onto the channel
    - It lets the server relate a response back to the exact request that produced it
    - It stores the calculator's running internal memory value between requests
    - It names the transport (UDS, TCP, or UDP) the request must travel on
    answer: 1
    why: |
      The rule is: "Every request has a unique ID and the server uses
      this ID to relate a response to its corresponding request." The
      response carries the same number back as its req_id field, so a client
      that fires several requests can attribute each reply. Option C confuses
      the ID with the internal memory; options A and D are not roles of any
      protocol field here.
