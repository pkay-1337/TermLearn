    min_quiz: 80
  final_checks:
  - kind: choose-better
    level: advanced
    q: >-
      A team must choose one transport for a same-host bulk data pipeline that also needs per-message boundaries.
      Which design is better and why?
    choices:
    - Use a UDS stream channel and frame records with a length prefix or delimiter
    - Use a UDS datagram channel and send records larger than one datagram
    - Use a TCP datagram channel because it preserves message boundaries
    answer: 0
    why: |
      A stream gives ordered reliable bytes and framing recovers record
      boundaries, all without leaving the host. Option B breaks the
      one-message-per-datagram rule for oversized records. Option C names a
      transport shape that does not exist: TCP is a stream.
    concept: final-bulk-transport-choice
  - kind: predict
    level: advanced
    q: >-
      Trace the byte sequence: a little-endian host stores 6666 directly in sin_port. Which value does a correct
      client using htons(6666) appear to dial relative to the server?
    code: |
      /* server */ addr.sin_port = 6666;          /* no conversion */
      /* client */ addr.sin_port = htons(6666);   /* correct */
    choices:
    - Both sides reach 6666 because the stack repairs the host value
    - The client dials 6666 while the server is bound to 2586
    - The client dials 2586 while the server is bound to 6666
    answer: 1
    why: |
      The server stores raw host bytes, so the stack reads 0x0A1A = 2586. The
      client stores network-order bytes, so it dials 6666. Option C swaps the
      two outcomes. Option A invents an automatic repair.
    concept: final-byte-order-mismatch
  - kind: spot-bug
    level: advanced
    q: A stream server ignores short writes. Which line explains the client receiving half a response?
    code: |
      int ret = write(sd, buf.data, buf.len);
      if (ret == -1) { close(sd); exit(1); }   /* line 2 */
      free(buf.data);
      /* execution continues even when ret < buf.len */
    diagnostic_log: |
      client: response ended after "1000#0#"
    choices:
    - 'Line 1: write must be replaced by sendto for every stream response'
    - 'Line 3: free must run before write so the buffer cannot be truncated'
    - 'After line 2: the code must also fail when ret is positive but less than buf.len'
    answer: 2
    why: |
      Stream writes can be partial, and a short positive return is a truncated
      response. Option A changes to a datagram call that needs a destination
      address. Option B reverses the buffer lifetime and corrupts the send.
    concept: final-short-write
  - kind: why-fails
    level: advanced
    q: >-
      Why does a UDS datagram client fail to receive replies when it skips bind, while a UDP client over IP still
      works?
    choices:
    - The UDS server captures no return path, while the IP kernel assigns a source endpoint
    - The UDS server rejects datagrams from clients that never set a numeric port
    - The UDP kernel broadcasts replies so every client receives them without an address
    answer: 0
    why: |
      AF_UNIX has no automatic ephemeral namespace, so an unbound client has no
      path for the server's reply. AF_INET assigns a source endpoint on first
      send. Option B invents ports in AF_UNIX. Option C invents broadcast.
    concept: final-uds-bind-requirement
  - kind: eipe
    level: advanced
    q: >-
      In one sentence, what is the architectural purpose of keeping calcser and calcsvc above the socket transport
      code?
    choices:
    - It makes the serializer responsible for choosing the address family at runtime
    - It lets one protocol and one service run unchanged behind every socket type
    - It forces every transport to share one global client socket descriptor
    answer: 1
    why: |
      The protocol and calculation logic depend only on bytes and numbers, so
      any transport can carry them. Option C invents shared descriptors. Option
      A assigns transport selection to a layer that never sees a socket.
    concept: final-transport-blind-layers
