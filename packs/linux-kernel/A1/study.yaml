  checks:
  - kind: mcq
    concept: identity-mapping-range
    q: How many total megabytes of physical RAM are identity-mapped by `boot/head.s`
      in Linux 0.11?
    choices:
    - 640 Kilobytes (only the real-mode base memory)
    - 4 Gigabytes (the entire 32-bit linear address space)
    - 16 Megabytes (using 1 Page Directory and 4 Page Tables)
    answer: 2
    why: 'Option C is correct: `head.s` initializes 4 page tables (`pg0`, `pg1`, `pg2`,
      `pg3`). Each table maps 1024 pages of 4KB ($1024 \times 4\text{KB} = 4\text{MB}$).
      4 tables * 4MB = 16MB total (Evidence E-A1-04).'
  - kind: why-fails
    concept: identity-paging-requirement
    q: Why is it mandatory that the early kernel code identity-map its own physical
      memory address when enabling paging?
    choices:
    - If linear addresses did not match physical addresses, the instruction fetch
      immediately following the `mov %eax, %cr0` instruction would fetch from a different
      physical location, causing an instant crash
    - The 80386 processor hardware physically burns out if CR3 contains any value
      other than 0x0000
    - The C compiler refuses to generate code unless memory is mapped backwards
    answer: 0
    why: 'Option A is correct: The CPU''s prefetch queue and `EIP` hold linear addresses.
      If linear address $X$ does not map to physical $X$ where the code lives, the
      CPU fetches code from an unmapped or incorrect location the exact clock cycle
      paging turns on.'
  - kind: fillblank
    concept: cr0-paging-bit
    q: Paging is activated in the x86 processor by setting bit number ___ (the PG
      bit) in control register CR0.
    answer_text: '31'
    why: Bit 31 of CR0 is the PG (Paging Enable) flag (`0x80000000`). When set to
      1, the hardware MMU actively translates linear addresses through the page tables
      pointed to by CR3.
  - kind: predict
    concept: ret-to-main-mechanism
    q: What is the function of the `pushl $_main` followed later by `ret` at the end
      of `setup_paging` in `head.s`?
    choices:
    - It causes `main()` to execute as an interrupt service routine
    - It uses the CPU's call/return stack protocol to pop the entry address of C `main()`
      into `EIP`
    - It pushes command-line arguments to the init process
    answer: 1
    why: 'Option B is correct: By pushing the address of `_main` onto the stack, the
      subsequent `ret` instruction pops that address into `EIP`, seamlessly transferring
      control to the C language entry point.'
  - kind: choose-better
    concept: data-segment-selector
    q: In `head.s`, which segment selector value is loaded into `DS`, `ES`, `FS`,
      and `GS` for 32-bit flat memory access?
    choices:
    - '`0x00` (The NULL segment selector)'
    - '`0x08` (Kernel Code Segment)'
    - '`0x10` (GDT index 2, Kernel Data Segment with 4GB limit and Ring 0 privilege)'
    answer: 2
    why: 'Option C is correct: Selector `0x10` (binary `00010 0 00`) specifies GDT
      index 2, GDT table indicator, RPL 0. In Linux 0.11, descriptor 2 is the kernel
      data segment. Loading `0x08` (code) into data registers causes a fault when
      writing.'
- id: b8
  type: syntax
  title: 'Early C Idioms & Inline Assembly: Port I/O and Control Registers'
  explain_md: "### 1. Frame the Problem\nThe C programming language has no syntax\
    \ for communicating with physical I/O ports (like reading a real-time clock or\
    \ keyboard controller), no keywords to read CPU control registers (`CR0`, `CR3`),\
    \ and no primitives to disable hardware interrupts (`cli`, `sti`).\n\nStandard\
    \ user-space C programs do not need these capabilities; they request services\
    \ from the operating system via syscalls. But the kernel *is* the operating system!\
    \ How can a kernel written in C touch raw CPU registers and motherboard buses\
    \ without writing every single function in standalone assembly files?\n\n### 2.\
    \ The Notional Machine\nIn Linux 0.11, Linus Torvalds pioneered the extensive\
    \ use of **GCC Inline Assembly (`__asm__`)**.\n\nGCC allows developers to embed\
    \ assembly templates directly inside C expressions using input, output, and clobber\
    \ constraints:\n\n```c\n__asm__(\n    \"assembly template\"\n    : output operands\
    \  /* \"=r\" (var), \"=a\" (var) */\n    : input operands   /* \"r\" (val), \"\
    a\" (val), \"d\" (port) */\n    : clobbered regs   /* registers modified by the\
    \ assembly */\n);\n```\n\nIn `include/asm/io.h` and `include/asm/system.h`, Linus\
    \ wrapped low-level hardware interactions into reusable inline macros:\n\n1. **Port\
    \ I/O Instructions (`inb`, `outb`)**:\n   x86 uses dedicated `IN` and `OUT` assembly\
    \ instructions communicating across an isolated 16-bit I/O bus ($0$ to $65,535$):\n\
    \   ```c\n   #define outb(value, port) \\\n   __asm__ (\"outb %%al, %%dx\" ::\
    \ \"a\" (value), \"d\" (port))\n\n   #define inb(port) ({ \\\n   unsigned char\
    \ _v; \\\n   __asm__ volatile (\"inb %%dx, %%al\" : \"=a\" (_v) : \"d\" (port));\
    \ \\\n   _v; \\\n   })\n   ```\n   * `\"a\"` forces the compiler to place `value`\
    \ into the `AL`/`EAX` register.\n   * `\"d\"` forces the compiler to place `port`\
    \ into the `DX` register.\n   * `volatile` prevents the compiler from optimizing\
    \ away the hardware read!\n\n2. **Control Register Access**:\n   Accessing `CR0`\
    \ and `CR3` requires specialized 386 instructions:\n   ```c\n   __asm__(\"movl\
    \ %%cr0, %0\" : \"=r\" (cr0_val));\n   __asm__(\"movl %0, %%cr3\" :: \"r\" (pg_dir));\n\
    \   ```\n\n3. **CPU Interrupt Flags**:\n   Enabling and disabling interrupts on\
    \ the silicon core:\n   ```c\n   #define cli() __asm__ (\"cli\"::)\n   #define\
    \ sti() __asm__ (\"sti\"::)\n   ```\n\n### 3. Source-Grounded Walkthrough\nLook\
    \ at `init/main.c` lines 69–78 (Evidence `E-A1-05`), where Linus reads the Real-Time\
    \ Clock from the motherboard CMOS chip:\n```c\n#define CMOS_READ(addr) ({ \\\n\
    outb_p(0x80|addr, 0x70); \\\ninb_p(0x71); \\\n})\n```\nNotice:\n1. `outb_p(0x80|addr,\
    \ 0x70)` writes the target CMOS register index to I/O port `0x70`. The `_p` suffix\
    \ introduces a tiny pause (jumping to the next instruction: `jmp $+2`) to allow\
    \ slow 1991 bus hardware to settle!\n2. `inb_p(0x71)` reads the resulting data\
    \ byte from I/O port `0x71`.\n3. The statement-expression syntax `({ ... })` is\
    \ a GCC extension allowing multiple statements to evaluate and return a value\
    \ like an expression.\n\n### 4. The Failure Mode & Boundary\nThe most catastrophic\
    \ inline assembly bug is forgetting the `volatile` keyword on input-reading macros\
    \ (`inb`). GCC assumes that if the inputs do not change, the output of an inline\
    \ assembly block remains constant. If you read a status port in a spinloop (`while\
    \ (!(inb(0x64) & 1));`) without `volatile`, GCC optimizes the loop into an infinite\
    \ loop reading the port once!\n\n### 5. The Compressed Mental Axiom\n*Inline assembly\
    \ is C's escape hatch to talk directly to CPU wires and device ports.*"
  example:
    lang: text
    code: '/* Pinned from include/asm/io.h in Linux 0.11 */

      #define outb(value,port) \

      __asm__ ("outb %%al,%%dx"::"a" (value),"d" (port))


      #define inb(port) ({ \

      unsigned char _v; \

      __asm__ volatile ("inb %%dx,%%al":"=a" (_v):"d" (port)); \

      _v; \

      })'
    explain_md: GCC inline assembly macros in include/asm/io.h wrap raw x86 port I/O
      instructions (inb, outb) using register constraints ('a' for AL/EAX, 'd' for
      DX port register) and the volatile qualifier to prevent compiler optimization.
  diagram:
    kind: flow
    caption: GCC Inline Assembly Constraint Mapping
    nodes:
    - id: c_call
      label: 'C Call: outb(0x11, 0x20)'
      shape: round
    - id: constraints
      label: 'Constraint: ''a''(val), ''d''(port)'
      shape: box
    - id: registers
      label: 'CPU: AL=0x11, DX=0x20'
      shape: box
    - id: opcode
      label: 'Emitted Opcode: outb %al, %dx'
