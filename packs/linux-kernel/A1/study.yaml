      total = 3072 physical 4KB frames)'
    - '[mem_init Called] mem_map[0..3071] tracking byte array initialized to 0 (FREE)'
  checks:
  - kind: predict
    concept: buffer-cache-boundary
    q: On a machine with 16MB of physical RAM, what is the value of `buffer_memory_end`
      in Linux 0.11?
    choices:
    - 16 Megabytes (0x01000000)
    - 4 Megabytes (0x00400000)
    - 640 Kilobytes (0x000A0000)
    answer: 1
    why: 'Option B is correct: In `init/main.c`, when `memory_end > 12*1024*1024`,
      `buffer_memory_end` is explicitly set to `4*1024*1024` (4MB). Option A leaves
      zero memory for user processes. Option C is the real-mode low memory boundary.'
  - kind: why-fails
    concept: hardware-hole-conflict
    q: Why does Linux 0.11 not allocate general-purpose user process page frames between
      physical addresses `0x000A0000` and `0x000FFFFF`?
    choices:
    - That region is reserved exclusively for the Linux network socket buffer
    - The 80386 processor architecture prohibits paging below 1MB
    - That physical memory address range is hardwired to motherboard video display
      adapters (VGA/EGA) and the BIOS ROM chip
    answer: 2
    why: 'Option C is correct: The 640KB to 1MB range (0xA0000 to 0xFFFFF) is the
      classic IBM PC memory hole where video RAM (like VGA text buffer at 0xB8000)
      and ROM BIOS chips reside; treating it as general RAM corrupts video output
      or crashes.'
  - kind: fillblank
    concept: memory-ceiling-cap
    q: In `init/main.c`, the variable `memory_end` is hard-capped at a maximum of
      ___ megabytes.
    answer_text: '16'
    why: Linux 0.11 checks `if (memory_end > 16*1024*1024) memory_end = 16*1024*1024;`,
      capping addressing to 16MB because `head.s` only created 4 page tables (4 *
      4MB = 16MB).
  - kind: mcq
    concept: bios-telemetry-address
    q: At which physical address does `init/main.c` read the extended memory size
      in kilobytes (`EXT_MEM_K`) saved earlier by `setup.s`?
    choices:
    - '0x90002'
    - '0x10000'
    - '0x00000'
    answer: 0
    why: 'Option A is correct: `setup.s` saved the BIOS INT 15h memory count at offset
      2 of segment `0x9000` (`0x90002`). `init/main.c` defines `#define EXT_MEM_K
      (*(unsigned short *)0x90002)` (Evidence E-A1-05).'
  - kind: choose-better
    concept: main-memory-start
    q: In `init/main.c`, where does the user application memory pool (`main_memory_start`)
      begin?
    choices:
    - At physical address 0x00000000 (overwriting the page tables)
    - Immediately at `buffer_memory_end` (directly after the buffer cache block pool)
    - At physical address 0x01000000 (at the 16MB boundary)
    answer: 1
    why: 'Option B is correct: In `init/main.c`, `main_memory_start = buffer_memory_end;`.
      Memory below this address is reserved for kernel code and the buffer cache;
      memory above is dynamically allocated to user processes.'
- id: b10
  type: algorithm
  title: Compiling the Kernel Image and Booting Under QEMU
  explain_md: "### 1. Frame the Problem\nYou have edited 16-bit assembly files (`bootsect.s`,\
    \ `setup.s`), 32-bit assembly files (`head.s`), and C files (`main.c`, `sched.c`).\
    \ \n\nHow do you transform disparate source files into a single bootable floppy\
    \ disk image that a hardware processor or virtual machine emulator can execute?\n\
    \nIn modern Linux, standard linkers and initramfs generators handle this. But\
    \ in 1991, GNU linkers could not combine 16-bit real-mode assembly with 32-bit\
    \ protected-mode object files. Linus solved this by writing his own custom C utility:\
    \ `tools/build.c`.\n\n### 2. The Notional Machine\nThe Linux 0.11 build pipeline\
    \ consists of three sequential compilation and stitching stages:\n\n```text\n\
    +-----------------------+     as86 / gas -m32\n| boot/bootsect.s       | ──────────────────────>\
    \ bootsect (Raw binary, exactly 512B)\n+-----------------------+\n\n+-----------------------+\
    \     as86 / gas -m32\n| boot/setup.s          | ──────────────────────> setup\
    \ (Raw binary, exactly 2048B)\n+-----------------------+\n\n+-----------------------+\
    \     gcc -m32 & ld -m elf_i386\n| boot/head.s           | ──┐\n| init/main.c\
    \           | ──┼───────────────────> tools/system (ELF binary with symbols)\n\
    | kernel/*.c, fs/*.c... | ──┘\n+-----------------------+\n\n                 \
    \               tools/build.c\n[bootsect] + [setup] + [system (stripped)] ───────>\
    \ Image (Raw Bootable Floppy Disk)\n```\n\nThe Role of `tools/build.c`:\n1. Opens\
    \ `bootsect`, verifies it is exactly 512 bytes, and writes it to Sector 1 of `Image`.\n\
    2. Patches the root device number (`ROOT_DEV = 0x306`) into bytes 508–509 of Sector\
    \ 1.\n3. Writes the boot signature `0x55, 0xAA` into bytes 510–511.\n4. Opens\
    \ `setup`, verifies it does not exceed 4 sectors (2048 bytes), pads it with zeros\
    \ to exactly 2048 bytes, and appends it to Sectors 2–5 of `Image`.\n5. Opens `tools/system`,\
    \ strips its object headers, and streams the raw executable machine instructions\
    \ starting at Sector 6.\n\n### 3. Source-Grounded Walkthrough\nLook at Evidence\
    \ `E-A1-07` and `E-A1-08`:\n```text\n$ cd sources/Linux-0.11-fork\n$ make -j1\
    \ CFLAGS=\"-g -m32 -fno-builtin -fno-stack-protector -fomit-frame-pointer -std=gnu89\
    \ -Iinclude -I../include -I../../include\"\n...\nRoot device is (3, 6)\nBoot sector\
    \ 512 bytes.\nSetup is 312 bytes.\nNon-loaded kernel is 130752 bytes.\nLoaded\
    \ kernel is 130752 bytes.\n```\nNotice the output emitted by `tools/build.c`:\n\
    * `Boot sector 512 bytes`: Exactly 1 sector.\n* `Setup is 312 bytes`: Assembled\
    \ code padded to 4 sectors (2048 bytes).\n* `Loaded kernel is 130752 bytes`: The\
    \ exact byte size of `system` placed from sector 6 onward.\n\nLaunching QEMU (Evidence\
    \ `E-A1-09`):\n```text\n$ qemu-system-i386 -m 16M -boot a -fda Image -hda hdc-0.11.img\
    \ -s -S -display none &\n```\nDeconstruct the command-line flags:\n* `-m 16M`:\
    \ Configures the virtual machine with 16 megabytes of RAM.\n* `-boot a`: Boots\
    \ from floppy drive A:.\n* `-fda Image`: Mounts the freshly built raw kernel image\
    \ as floppy disk A:.\n* `-hda hdc-0.11.img`: Mounts the Minix root filesystem\
    \ hard disk image.\n* `-s`: Starts the GDB RSP remote debugging server on TCP\
    \ port `1234`.\n* `-S`: **Freezes the vCPU at power-on reset**, waiting for GDB\
    \ to connect and resume!\n\n### 4. The Failure Mode & Boundary\nIf you boot QEMU\
    \ with `-fda Image` but forget `-hda hdc-0.11.img`, the kernel boots through `bootsect`,\
    \ `setup`, `head`, and `main()`, mounts drivers, and then panics with:\n`Kernel\
    \ panic: Unable to mount root`\nA kernel cannot reach a shell without a root filesystem!\n\
    \n### 5. The Compressed Mental Axiom\n*A kernel binary is not runnable alone;\
    \ it must be packed into bootloader geometry.*"
