      - opcode
      note: 'Step 3: Machine instruction sends byte over motherboard I/O bus'
  checks:
  - kind: mcq
    concept: gcc-constraint-meaning
    q: In GCC inline assembly, what does the constraint `"a" (value)` mandate?
    choices:
    - GCC must place `value` into register AL, AX, or EAX prior to executing the assembly
      template
    - GCC must allocate a dynamic array on the heap for `value`
    - GCC must assert that `value` is an ASCII string
    answer: 0
    why: 'Option A is correct: In x86 GCC assembly constraints, `"a"` refers to the
      accumulator register (AL/AX/EAX), `"d"` refers to the DX register, and `"c"`
      refers to the CX register.'
  - kind: why-fails
    concept: volatile-in-asm
    q: Why must hardware I/O macros like `inb(port)` include the `volatile` keyword
      in their `__asm__` declaration?
    choices:
    - '`volatile` instructs the CPU to run the instruction in 16-bit real mode'
    - Without `volatile`, GCC's dead-code optimizer may assume the hardware read produces
      no side effects and delete or hoist it out of loops
    - '`volatile` locks the memory bus with an atomic CMPXCHG'
    answer: 1
    why: 'Option B is correct: Hardware register states change asynchronously outside
      compiler visibility. `volatile` prevents the compiler from caching port reads
      or optimizing away repeated reads.'
  - kind: fillblank
    concept: interrupt-enable-macro
    q: In `init/main.c`, hardware interrupts are globally enabled on the CPU by invoking
      the macro named ___().
    answer_text: sti
    why: '`sti()` emits the x86 `sti` (Set Interrupt Flag) instruction, enabling hardware
      interrupts on the processor core.'
  - kind: spot-bug
    concept: asm-constraint-bug
    q: 'Spot the fatal bug in this attempted inline assembly port output implementation:'
    code: '#define outb_broken(value, port) \

      __asm__ ("outb %0, %1" :: "r" (value), "r" (port))'
    diagnostic_log: 'Error: invalid operand for instruction ''outb'''
    choices:
    - The function name outb_broken exceeds the maximum 8-character symbol length
      in C99
    - The macro is missing a semicolon after the closing parenthesis
    - The x86 `outb` instruction strictly requires the data value to be in register
      `AL` and the port in register `DX`; generic register constraint `"r"` causes
      the assembler to emit illegal operands like `outb %ebx, %ecx`
    answer: 2
    why: 'Option C is correct: The x86 instruction set strictly hardcodes `outb` to
      use `AL` for data and `DX` for 16-bit port numbers. Using generic `"r"` allows
      GCC to select any general register (EBX, ESI, etc.), which the assembler rejects.'
  - kind: choose-better
    concept: io-delay-purpose
    q: In `init/main.c`, why did Linus Torvalds define `outb_p` and `inb_p` with a
      `_p` pause macro rather than standard `outb`?
    choices:
    - Older motherboard hardware and slow I/O peripheral controllers required a brief
      instruction delay (`jmp $+2`) to allow voltage signals to stabilize
    - The pause macro enables hyper-threading on the CPU core
    - The pause macro pauses execution to wait for a user keypress
    answer: 0
    why: 'Option A is correct: In 1991, 386 and 486 CPUs executed instructions much
      faster than ISA bus peripheral chips (like the 8259 PIC or CMOS RTC). Adding
      a tiny jump pause (`jmp $+2`) prevented bus timing violations.'
- id: b9
  type: model
  title: Linux 0.11 Physical Memory Layout & Architecture
  explain_md: "### 1. Frame the Problem\nIn 1991, a personal computer might have 2MB,\
    \ 4MB, 8MB, or a luxurious 16MB of physical RAM. \n\nUnlike modern operating systems\
    \ with 64-bit address spaces where physical memory is abundant, Linux 0.11 had\
    \ to fit the operating system, disk buffer caches, interrupt tables, and user\
    \ processes into tight physical memory without corrupting hardware memory holes.\n\
    \nHow did Linux 0.11 partition physical memory to balance performance between\
    \ file caching and application execution?\n\n### 2. The Notional Machine\nLinux\
    \ 0.11 organizes physical memory into strict sequential zones across the first\
    \ 16 megabytes:\n\n```text\n0x0000000 ┌──────────────────────────────────────┐\n\
    \          │ Page Directory & 4 Page Tables (20KB)│ (pg_dir @ 0x0, pg0-pg3 @ 0x1000-0x4000)\n\
    0x0005000 ├──────────────────────────────────────┤\n          │ Kernel Code &\
    \ Data (~120KB)          │ (system binary: head.o + main.o + kernel)\n0x0027F70\
    \ ├──────────────────────────────────────┤\n          │ Kernel Stack (user_stack\
    \ in sched.c) │ (Grows downward from top of task_union)\n          ├──────────────────────────────────────┤\n\
    \          │ Buffer Cache Memory (Hash & LRU)     │ (Stores 1KB disk blocks)\n\
    0x0090000 ├──────────────────────────────────────┤\n          │ Saved BIOS Parameters\
    \ (0x90000-901FF)│ (Cursor, EXT_MEM_K, root_dev)\n0x00A0000 ├──────────────────────────────────────┤\n\
    \          │ 640KB - 1MB HARDWARE HOLE:           │ (VGA framebuffers 0xA0000-0xBFFFF,\n\
    \          │ Video Display RAM & BIOS ROM         │  ROM BIOS 0xF0000-0xFFFFF)\n\
    0x0100000 ├──────────────────────────────────────┤ (1 Megabyte Boundary)\n   \
    \       │ Buffer Cache Continuation            │ (Ends at 1MB, 2MB, or 4MB depending\
    \ on RAM)\nbuffer_end├──────────────────────────────────────┤ (main_memory_start)\n\
    \          │ Main Memory Pool (User Pages)        │ (Managed by mem_map[] array;\n\
    \          │ Allocated dynamically for processes  │  Demand paging and Copy-On-Write)\n\
    memory_end└──────────────────────────────────────┘ (Capped at 16MB maximum in\
    \ 0.11)\n```\n\n### 3. Source-Grounded Walkthrough\nLook at lines 112–126 of `init/main.c`\
    \ (Evidence `E-A1-05`):\n```c\n    memory_end = (1<<20) + (EXT_MEM_K<<10);\n \
    \   memory_end &= 0xfffff000;\n    if (memory_end > 16*1024*1024)\n        memory_end\
    \ = 16*1024*1024;\n    if (memory_end > 12*1024*1024) \n        buffer_memory_end\
    \ = 4*1024*1024;\n    else if (memory_end > 6*1024*1024)\n        buffer_memory_end\
    \ = 2*1024*1024;\n    else\n        buffer_memory_end = 1*1024*1024;\n    main_memory_start\
    \ = buffer_memory_end;\n    mem_init(main_memory_start, memory_end);\n```\nTrace\
    \ the dynamic boundary calculations:\n1. `EXT_MEM_K` is read directly from physical\
    \ address `0x90002` (where `setup.s` saved the BIOS `INT 15h, AH=88h` result).\n\
    2. Total RAM = 1MB base memory ($1 \\ll 20$) + Extended Memory in KB ($EXT\\_MEM\\\
    _K \\ll 10$).\n3. In Linux 0.11, `memory_end` is hard-capped at **16 Megabytes**\
    \ (`16*1024*1024`).\n4. **Buffer Cache Scaling**:\n   * If RAM > 12MB: Buffer\
    \ cache gets **4MB** (`buffer_memory_end = 4MB`).\n   * If RAM > 6MB: Buffer cache\
    \ gets **2MB**.\n   * Otherwise: Buffer cache gets **1MB**.\n5. `main_memory_start`\
    \ is set to `buffer_memory_end`. All remaining physical pages from `main_memory_start`\
    \ to `memory_end` are handed to `mem_init()`, which manages them with the `mem_map[]`\
    \ array for user applications!\n\n### 4. The Failure Mode & Boundary\nThe fatal\
    \ hardware trap is ignoring the **640KB–1MB Hardware Hole** (`0xA0000`–`0xFFFFF`).\
    \ That range does not contain general RAM! It is mapped to video framebuffers\
    \ (VGA text mode at `0xB8000`) and the motherboard BIOS ROM. If an operating system\
    \ attempts to allocate user heap pages or buffer cache blocks in that hole, memory\
    \ reads return garbage and writes destroy display output.\n\n### 5. The Compressed\
    \ Mental Axiom\n*Physical RAM is not a blank sheet; it is peppered with legacy\
    \ hardware holes that the kernel must navigate around.*"
  diagram:
    kind: art
    caption: Linux 0.11 Physical Memory Partitioning Map
    art: '+-----------------------+---------------------------------------+

      | Address Range         | Subsystem Ownership & Purpose         |

      +-----------------------+---------------------------------------+

      | 0x000000 - 0x004FFF   | Page Directory (0x0) & 4 Page Tables  |

      | 0x005000 - 0x080000   | Kernel Executable (.text, .data, .bss)|

      | 0x080000 - 0x09FFFF   | Buffer Cache (Low RAM portion)        |

      | 0x090000 - 0x0901FF   | Saved BIOS Telemetry Parameters       |

      | 0x0A0000 - 0x0FFFFF   | HARDWARE HOLE: Video RAM & BIOS ROM   |

      | 0x100000 - buffer_end | Buffer Cache Continuation (Up to 4MB) |

      | buffer_end - 16MB     | Main Memory Pool (User Pages)         |

      +-----------------------+---------------------------------------+'
  viz:
    kind: ascii-memory
    caption: Physical RAM Boundary Calculation (16MB Target)
    steps:
    - '[RAM Sizing] EXT_MEM_K read from 0x90002: 15360 KB · Total RAM: 1MB + 15MB
