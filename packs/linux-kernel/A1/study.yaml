    - '`printf("Linux version 0.11\n");`'
    - '`sti();`'
    answer: 0
    why: 'Option A is correct: GDB output in Evidence E-A1-09 confirms the breakpoint
      at `init/main.c:107`, executing `ROOT_DEV = ORIG_ROOT_DEV;`. Option B is a fictional
      banner. Option C is executed much later on line 136.'
  - kind: why-fails
    concept: run-vs-continue-remote
    q: Why does typing `run` inside GDB fail when attached to QEMU via `target remote
      :1234`?
    choices:
    - The `run` command requires root superuser privileges
    - Remote hypervisor targets are already running and cannot be spawned locally;
      you must issue `continue`
    - QEMU terminates the TCP connection if any command longer than 3 letters is sent
    answer: 1
    why: 'Option B is correct (from T1A): Remote targets do not support process creation
      (`run`). The remote machine is already instantiated; you must issue `continue`
      to resume execution.'
  - kind: fillblank
    concept: main-entry-address
    q: In Linux 0.11, the 32-bit linear address of `main()` captured in Evidence E-A1-09
      is 0x0000___.
    answer_text: '6771'
    why: Evidence E-A1-09 shows `eip = 0x6771`, which is the entry address of `main()`
      in `tools/system`.
  - kind: mcq
    concept: dwarf-symbols-role
    q: Why must you execute `file tools/system` in GDB when debugging the raw floppy
      image `Image` in QEMU?
    choices:
    - QEMU refuses to boot unless `tools/system` is opened by a text editor
    - '`tools/system` contains the complete source code of Bash'
    - '`Image` is a stripped raw disk binary containing no DWARF symbols; `tools/system`
      provides the ELF symbol table mapping function names and line numbers to addresses'
    answer: 2
    why: 'Option C is correct (from T0A/T1A): `Image` contains only raw bytes for
      floppy sectors. GDB needs the unstripped ELF binary `tools/system` to map memory
      address `0x6771` to source file `init/main.c` line 107.'
  - kind: choose-better
    concept: early-boot-breakpoint-choice
    from_chapter: T1A
    from_block: b11
    q: If you needed to halt at `startup_32` in `head.s` before page tables are built,
      why is a hardware breakpoint (`hbreak`) preferred over a standard software breakpoint
      (`break`)?
    choices:
    - '`hbreak` uses CPU hardware debug registers (DR0-DR3), avoiding modifying memory
      bytes in RAM before tables and caches are stabilized'
    - '`hbreak` executes 10 times faster than CPU silicon'
    - '`hbreak` automatically edits the source code on disk'
    answer: 0
    why: 'Option A is correct (from T1A): Software breakpoints overwrite instruction
      bytes with `0xCC`. During early boot, RAM is in transition and instructions
      are copied across segments; hardware breakpoints monitor address buses directly
      without altering memory.'
- id: b12
  type: algorithm
  title: 'Machine State Verification: Registers and Selectors at main() Entry'
  explain_md: "### 1. Frame the Problem\nWhen execution crosses the threshold into\
    \ `main()`, what does the processor actually look like under the hood?\n\nMany\
    \ developers assume that entering C means hardware details can be forgotten. But\
    \ `main()` is the very beginning of the operating system. If control register\
    \ bits, privilege levels, or stack pointers are misconfigured, the first memory\
    \ allocation or interrupt will instantly destroy the kernel.\n\nWe must verify\
    \ every single machine register and segment selector at the exact instant `main()`\
    \ begins.\n\n### 2. The Notional Machine\nLet us decode the complete register\
    \ dump captured from the live QEMU hypervisor at the entry of `main()` (Evidence\
    \ `E-A1-09`):\n\n1. **Instruction Pointer (`EIP`)**:\n   `EIP = 0x00006771`: Points\
    \ directly to the first instruction of `main()` in the kernel `.text` segment.\n\
    \n2. **Stack Pointer (`ESP`)**:\n   `ESP = 0x00027f70`: Where is this stack?\n\
    \   In `kernel/sched.c`, Linus defined:\n   ```c\n   long user_stack[PAGE_SIZE>>2];\n\
    \   struct {\n       long * a;\n       short b;\n   } stack_start = { &user_stack[PAGE_SIZE>>2],\
    \ 0x10 };\n   ```\n   `PAGE_SIZE` is 4096 bytes ($4096 \\gg 2 = 1024$ longs).\
    \ The top of `user_stack` is at offset 4080 (aligned to 16 bytes). In Evidence\
    \ E-A1-09, GDB reports:\n   `esp = 0x27f70 <user_stack+4080>`!\n   The stack grows\
    \ downward toward `user_stack[0]`.\n\n3. **Segment Selectors (`CS`, `DS`, `ES`,\
    \ `FS`, `GS`, `SS`)**:\n   * `CS = 0x0008`: Code Segment (GDT index 1, RPL 0).\
    \ Grants Ring 0 supervisor code execution across a 4GB flat range.\n   * `DS =\
    \ ES = FS = GS = SS = 0x0010`: Data Segment (GDT index 2, RPL 0). Grants Ring\
    \ 0 read/write access across all physical RAM.\n\n4. **Control Register 0 (`CR0`)**:\n\
    \   In Evidence E-A1-09:\n   `EAX = 0x80000013`: This was the value loaded into\
    \ `CR0` by `head.s` right before jumping to `main()`!\n   Let us decompose the\
    \ hexadecimal bitmask `0x80000013`:\n   * **Bit 31 (`PG = 1`)**: Paging is **ENABLED**!\
    \ The MMU translates all linear addresses through page tables.\n   * **Bit 4 (`ET\
    \ = 1`)**: Extension Type. Verifies an 80387 math coprocessor is installed.\n\
    \   * **Bit 1 (`MP = 1`)**: Monitor Coprocessor.\n   * **Bit 0 (`PE = 1`)**: Protection\
    \ Enable. The CPU is in **32-bit Protected Mode**.\n\n5. **Control Register 3\
    \ (`CR3`)**:\n   `CR3 = 0x00000000`: Points to the physical base address of the\
    \ **Page Directory** at address `0x00000`.\n\n6. **Interrupt Flag (`EFLAGS.IF`)**:\n\
    \   In EFLAGS, bit 9 (`IF`) is **0** (Interrupts Disabled). Notice Linus's comment\
    \ on line 107 of `main.c`:\n   `/* Interrupts are still disabled. Do necessary\
    \ setups, then enable them */`\n   Interrupts remain safely disabled until line\
    \ 136 (`sti()`).\n\n### 3. Source-Grounded Walkthrough\nExamine the disassembly\
    \ of the first four instructions at `main()` (Evidence `E-A1-09`):\n```text\n\
    => 0x6771 <main>:    mov    0x901fc, %ax\n   0x6777 <main+6>:  mov    %ax, 0x27f78\n\
    \   0x677d <main+12>: mov    $0x90080, %esi\n   0x6782 <main+17>: mov    $0x27f80,\
    \ %edi\n```\nTrace the data flow:\n1. `mov 0x901fc, %ax`: Reads the root device\
    \ number saved by `tools/build.c` into `0x901FC` and stores it into `ROOT_DEV`\
    \ (`0x27f78`).\n2. `mov $0x90080, %esi`: Loads source address `0x90080` (where\
    \ `setup.s` saved the hard disk parameters).\n3. `mov $0x27f80, %edi`: Loads destination\
    \ address `drive_info` inside the kernel `.bss` segment.\n\nThe kernel is harvesting\
    \ boot-time parameters before the buffer cache overwrites low RAM!\n\n### 4. The\
    \ Failure Mode & Boundary\nIf a programmer calls `sti()` on line 108 of `main.c`\
    \ before `sched_init()` and `trap_init()` complete, the first timer interrupt\
    \ (IRQ0) fires, jumps through an uninitialized IDT interrupt gate, and triggers\
    \ an immediate CPU crash.\n\n### 5. The Compressed Mental Axiom\n*At the threshold\
    \ of main(), the CPU is in 32-bit Ring 0, paging is live, and interrupts are safely\
    \ masked.*"
  diagram:
    kind: art
    caption: CR0 Control Register Bit Breakdown (0x80000013)
    art: "+----+---------------------------------------+----+----+----+----+\n| PG\
      \ | Reserved (Bits 30 down to 5)          | ET | TS | EM | MP | PE |\n| 31 |\
      \                                       | 4  | 3  | 2  | 1  | 0  |\n+----+---------------------------------------+----+----+----+----+\n\
      | 1  | 00000000000000000000000000            | 1  | 0  | 0  | 1  | 1  |\n+----+---------------------------------------+----+----+----+----+\n\
      \  |                                            |              |    |\n  v \
      \                                           v              v    v\nPaging Active\
      \ (Virtual Memory)           80387 Present      Wait Protected"
  viz:
    kind: ascii-memory
    caption: Hardware State Checklist at Entry of main()
    steps:
    - '[Privilege Check] CS = 0x0008 (Kernel Code) · CPL = 0 (Supervisor Ring 0) ·
      Mode: 32-bit Protected'
    - '[Memory Translation] CR0 = 0x80000013 (PG=1, PE=1) · CR3 = 0x00000000 (Page
      Directory @ physical 0x0)'
    - '[Stack Frame] ESP = 0x00027f70 (user_stack+4080) · SS = 0x0010 · Valid 4KB
      kernel stack ready'
    - '[Interrupt State] EFLAGS = 0x00000002 (IF=0) · Hardware interrupts strictly
      MASKED until line 136 sti()'
  checks:
  - kind: predict
    concept: cr0-bitmask-meaning
    q: In Evidence E-A1-09, register EAX holds `0x80000013`. What two critical operating
      system features are enabled by bit 31 and bit 0 of this value?
    choices:
    - Bit 31 enables network encryption; Bit 0 enables floppy disk DMA
    - Bit 31 enables Virtual Memory Paging (`PG`); Bit 0 enables 32-bit Protected
      Mode (`PE`)
    - Bit 31 enables 64-bit Long Mode; Bit 0 enables PCI Express bus scanning
    answer: 1
    why: 'Option B is correct: In x86 control register CR0, bit 31 is PG (Paging)
      and bit 0 is PE (Protection Enable). 0x80000013 has both bits set, confirming
      the kernel is executing in protected mode with paging active.'
  - kind: mcq
    concept: initial-stack-pointer
    q: What data structure does `ESP = 0x00027f70` point to when `main()` begins?
    choices:
    - A dynamically allocated heap buffer from `malloc()`
    - Physical address 0x00000000 inside the page directory
    - The top of the `user_stack` array defined in `kernel/sched.c`
    answer: 2
    why: 'Option C is correct: `head.s` initialized `ESP` with `lss _stack_start,
      %esp`. `stack_start` points to the top of `user_stack` in `sched.c` (at offset
      4080, Evidence E-A1-09).'
  - kind: why-fails
    concept: premature-interrupt-enable
    q: Why does `init/main.c` NOT execute `sti()` to enable interrupts until line
      136, near the very end of the function?
    choices:
    - Device drivers, interrupt handlers, and the process scheduler must be initialized
      first; an early interrupt would dispatch to a missing or half-configured handler
    - Interrupts cannot be enabled in protected mode under any circumstances
    - The 80386 processor only allows interrupts to be enabled in userspace Ring 3
    answer: 0
    why: 'Option A is correct: If an interrupt occurred before `sched_init()` or `trap_init()`,
      the kernel would have no task structure or valid interrupt service routine to
      handle it, causing an immediate crash.'
  - kind: fillblank
    concept: cr3-value-check
    q: In Linux 0.11, the control register CR3 holds the physical base address of
      the Page Directory, which is physical address 0x00000___.
    answer_text: '000'
    why: CR3 holds `0x00000000` because the Page Directory is placed at the very base
      of physical RAM (`_pg_dir = 0x00000000`).
  - kind: choose-better
    concept: cs-rpl-privilege
    q: Given `CS = 0x0008` (binary `0000000000001 0 00`), what is the Current Privilege
      Level (CPL) of the CPU at `main()`?
    choices:
    - Ring 3 (Userspace privilege, determined by RPL bits 11)
    - Ring 0 (Supervisor privilege, determined by RPL bits 00)
    - Ring 1 (Hypervisor privilege)
    answer: 1
    why: 'Option B is correct: The low 2 bits of the Code Segment selector indicate
      the Current Privilege Level. Bits 00 specify Ring 0 (highest privilege).'
- id: b13
  type: design
  title: Pristine 1991 Source vs. Modern Runnable Fork (Toolchain Evolution)
  explain_md: "### 1. Frame the Problem\nWhy can you not simply clone Linus Torvalds's\
    \ original Linux 0.11 repository and type `make` on a modern 2026 Linux system?\n\
    \nIn 1991, the C language and toolchains were in their infancy. Linus wrote Linux\
    \ 0.11 using **GCC 1.40**, **as86** (Bruce Evans's 16-bit assembler), and pre-standard\
    \ C dialects. Over the subsequent 35 years, compilers grew vastly more rigorous,\
    \ linkers transitioned from a.out to ELF, and C standards introduced strict type\
    \ checking.\n\nUnderstanding what broke and how the runnable fork repairs it teaches\
    \ an invaluable systems engineering lesson: **the deep coupling between operating\
    \ system code and compiler behavior**.\n\n### 2. The Notional Machine\nWhen you\
    \ invoke modern GCC 16 against pristine 1991 code, four major toolchain incompatibilities\
    \ trigger hard build failures:\n\n1. **Implicit `int` Return Types (Banned in\
    \ C99/C23)**:\n   In 1991 K&R C, if a function declaration lacked a return type,\
    \ the compiler assumed `int`.\n   In `init/main.c`:\n   ```c\n   /* Original 0.11\
    \ */\n   main(void) { ... }\n   ```\n   GCC 16 aborts with:\n   `error: return\
    \ type defaults to 'int' [-Wimplicit-int]`\n\n2. **Missing Function Prototypes\
    \ & Variadic Functions**:\n   In `init/main.c`, Linus declared:\n   ```c\n   extern\
    \ int vsprintf();\n   ```\n   In 1991, empty parentheses meant *\"takes unspecified\
    \ arguments\"*. In modern C23, empty parentheses mean *\"takes void (zero arguments)\"\
    *. When `printf` subsequently calls `vsprintf(buf, fmt, args)`, GCC 16 halts with:\n\
    \   `error: too many arguments to function 'vsprintf'`\n\n3. **16-bit Assembler\
    \ vs Modern GNU Assembler (`as`)**:\n   `bootsect.s` and `setup.s` were written\
    \ for `as86`, which used an exclamation point `!` for comments and `#` for immediate\
    \ constants (`mov ax, #0x07c0`). Modern GNU `as` uses `#` for line comments and\
    \ `$` for immediate values!\n\n4. **Modern Default Compiler Hardening**:\n   Modern\
    \ Linux distributions enable stack smashing protection (`-fstack-protector-strong`)\
    \ and Position-Independent Executables (`-fpie`) by default. In a bare-metal kernel\
    \ with no C library canary setup, stack protector canaries dereference unmapped\
    \ segments and crash the machine!\n\n### 3. Source-Grounded Walkthrough\nLook\
    \ at Evidence `E-A1-06` (The Unmodified Build Failure):\n```text\n$ cd sources/Linux-0.11-fork\
    \ && make -j1\n...\ninit/main.c:104:1: error: return type defaults to 'int' [-Wimplicit-int]\n\
    \  104 | main(void)\n      | ^~~~\ninit/main.c:157:25: error: too many arguments\
    \ to function 'vsprintf'\n  157 |  write(1,printbuf,i=vsprintf(printbuf, fmt,\
    \ args));\n      |                     ^~~~~~~~\nmake: *** [Makefile:142: init/main.o]\
    \ Error 1\n```\n\nNow look at Evidence `E-A1-07` (The Solution):\nTo preserve\
    \ the original kernel logic while satisfying modern GCC 16, the runnable fork\
    \ supplies explicit compiler dialect flags:\n```text\n$ make -j1 CFLAGS=\"-g -m32\
    \ -fno-builtin -fno-stack-protector -fomit-frame-pointer -std=gnu89 -Iinclude\
    \ -I../include -I../../include\"\n...\nRoot device is (3, 6)\nBoot sector 512\
    \ bytes.\nSetup is 312 bytes.\nNon-loaded kernel is 130752 bytes.\nLoaded kernel\
    \ is 130752 bytes.\n```\nDeconstruct the essential engineering flags:\n* `-std=gnu89`:\
    \ Reverts GCC to the 1989 ANSI C standard with GNU extensions, permitting implicit\
    \ ints and unprototyped functions.\n* `-m32`: Generates 32-bit x86 code on a 64-bit\
    \ host processor.\n* `-fno-stack-protector`: Disables stack canaries that require\
    \ uninitialized runtime tables.\n* `-fno-builtin`: Prevents GCC from replacing\
    \ kernel functions (like `memcpy` or `strcpy`) with host libc builtins.\n\n###\
    \ 4. The Failure Mode & Boundary\nThe rookie temptation is rewriting historical\
    \ kernel algorithms to look like modern C23. This is an anti-pattern. If you modify\
    \ the kernel algorithms, you are no longer studying Linux 0.11. The disciplined\
    \ approach is using compiler dialect pinning (`-std=gnu89`) to preserve the historical\
    \ artifacts intact.\n\n### 5. The Compressed Mental Axiom\n*C is not static; historical\
    \ code requires explicit dialect pinning (-std=gnu89) to survive modern toolchains.*"
  diagram:
    kind: flow
    caption: Pristine Source vs Modern Build Harness Pipeline
    nodes:
    - id: source
      label: Pristine 0.11 Source (1991)
      shape: box
    - id: gcc_default
      label: GCC 16 (Default C23)
      shape: decision
    - id: fail
      label: 'Build Fails: -Wimplicit-int'
      shape: round
    - id: cflags
      label: 'Harness CFLAGS: -std=gnu89 -m32'
      shape: box
    - id: pass
      label: 'Success: Bootable Image Built'
      shape: round
    edges:
    - from: source
      to: gcc_default
      label: make
    - from: gcc_default
      to: fail
      label: Modern strict rules
    - from: source
      to: cflags
      label: Dialect Pinning
    - from: cflags
      to: pass
      label: Compiles cleanly
    steps:
    - focus:
      - source
      - gcc_default
      - fail
      note: 'Step 1: Unmodified 1991 C code fails under strict modern C23 compiler
        defaults'
    - focus:
      - source
      - cflags
      - pass
      note: 'Step 2: Pinned -std=gnu89 and -m32 flags allow pristine logic to build
        cleanly'
  checks:
  - kind: mcq
    concept: cflags-std-gnu89
    q: Which GCC flag is essential to allow modern compilers to accept 1991 C code
      containing implicit int return types and empty function parameter lists?
    choices:
    - '`-O3`'
    - '`-std=c23`'
    - '`-std=gnu89`'
    answer: 2
    why: 'Option C is correct: `-std=gnu89` pins the compiler dialect to the 1989
      ANSI C standard with GNU extensions, which legally permits implicit ints and
      legacy function declarations (Evidence E-A1-07).'
  - kind: why-fails
    concept: fno-stack-protector-necessity
    q: Why must `-fno-stack-protector` be passed when compiling bare-metal kernel
      code with modern GCC?
    choices:
    - Modern GCC injects canary check functions (`__stack_chk_fail`) that rely on
      libc thread-local storage, which does not exist in early boot
    - Stack protector flags disable the CPU's memory paging unit
    - Stack protector flags force the kernel to compile as 16-bit code
    answer: 0
    why: 'Option A is correct: Stack canaries require runtime support (canary initializers
      and failure handlers in libc). In a standalone kernel, calling functions with
      stack protection causes crashes on unmapped canary references.'
  - kind: choose-better
    concept: preservation-philosophy
    q: When bringing up a historical operating system kernel on modern machines, which
      engineering strategy is superior?
    choices:
    - Rewrite the entire kernel to use modern C++ templates and object-oriented classes
    - Pin the compiler dialect using appropriate CFLAGS (`-std=gnu89 -m32`) while
      keeping the historical kernel algorithms and source lines untouched
    - Delete all assembly bootstrap code and replace it with UEFI firmware
    answer: 1
    why: 'Option B is correct: Dialect pinning preserves the exact historical implementation
      and architectural artifacts, allowing authentic analysis of 1991 engineering
      decisions without introducing modern regressions.'
  - kind: fillblank
    concept: m32-flag-role
    q: To compile 32-bit x86 kernel code on a 64-bit host workstation, GCC requires
      the flag `-m___`.
    answer_text: '32'
    why: The `-m32` flag instructs GCC to generate machine code for the 32-bit i386
      ABI rather than the default 64-bit x86_64 target.
  - kind: predict
    concept: fno-builtin-effect
    q: What happens if bare-metal kernel code is compiled without `-fno-builtin`?
    choices:
    - The processor disables protected mode during boot
    - The kernel executable size increases by 400 megabytes
    - GCC may replace custom kernel loops with calls to standard library functions
      (like `memcpy` or `memset`) that have not yet been defined in early boot, causing
      undefined symbol errors
    answer: 2
    why: 'Option C is correct: GCC recognizes common memory and string loop patterns
      and replaces them with calls to library builtins. In a freestanding kernel,
      these builtins may not exist or may conflict with kernel routines.'
- id: b14
  type: design
  title: 'The Complete Boot-Trace Map: From Silicon Reset to Userspace Init'
  explain_md: "### 1. Frame the Problem\nThroughout Chapter A1, you have deconstructed\
    \ individual bootstrap steps: sector loading, 20-bit segmentation math, A20 gate\
    \ mechanics, GDT descriptors, identity page tables, and C entry states.\n\nHowever,\
    \ operating systems do not function as isolated pieces. A kernel is an unbroken\
    \ chain of causality: each instruction creates the preconditions for the next.\
    \ \n\nHow do all these components connect into a single, comprehensive mental\
    \ model of bootloader execution?\n\n### 2. The Notional Machine\nWe synthesize\
    \ the complete **8-Milestone Bootstrap Roadmap** from silicon reset to the birth\
    \ of userspace:\n\n```text\n[Milestone 1: CPU Power-On] \n  Silicon reset vector\
    \ -> CS:IP = 0xF000:0xFFF0 (Physical 0xFFFF0). 16-bit Real Mode.\n      │\n  \
    \    ▼\n[Milestone 2: BIOS Floppy Load]\n  BIOS reads Sector 1 (bootsect.s, 512B)\
    \ to Physical 0x07C00. Verifies 0xAA55.\n      │\n      ▼\n[Milestone 3: Bootsect\
    \ Self-Relocation]\n  bootsect moves itself to 0x90000; far jumps to 0x9000:go.\n\
    \  Loads setup.s (2048B) to 0x90200. Streams system to 0x10000 via INT 13h.\n\
    \      │\n      ▼\n[Milestone 4: Setup Hardware Probing]\n  setup.s saves BIOS\
    \ telemetry to 0x90000 (RAM size to 0x90002).\n  Moves system from 0x10000 down\
    \ to physical 0x00000 (cli).\n      │\n      ▼\n[Milestone 5: Protected Mode Switch]\n\
    \  setup.s pulses keyboard port 0x64/0x60 to enable A20 Gate.\n  Remaps 8259 PIC\
    \ to 0x20. Loads temporary GDT/IDT. Sets CR0.PE = 1.\n  Far jump: jmpi 0, 8 branches\
    \ into 32-bit segment 8 (0x00000).\n      │\n      ▼\n[Milestone 6: 32-bit Paging\
    \ Construction]\n  head.s sets DS/ES/FS/GS to 0x10. Sets ESP to user_stack (0x27f70).\n\
    \  Fills 256 dummy IDT entries. Builds Page Directory at 0x0 and 4 Page Tables\
    \ (16MB).\n  Loads CR3 = 0x0. Sets CR0.PG = 1.\n      │\n      ▼\n[Milestone 7:\
    \ Kernel C Entry Point]\n  setup_paging executes ret -> pops $_main into EIP!\n\
    \  Lands at init/main.c:107 (eip = 0x6771) in Ring 0 with paging live.\n  Initializes\
    \ memory, traps, buffer cache, sched, and drivers. Enables interrupts (sti).\n\
    \      │\n      ▼\n[Milestone 8: Userspace Fork]\n  main() calls move_to_user_mode()\
    \ -> switches CPU privilege to Ring 3!\n  Forks Process 1 (init()). Task 0 remains\
    \ in kernel space as the idle loop (for(;;) pause()).\n```\n\n### 3. Source-Grounded\
    \ Walkthrough\nNotice the privilege and mode transitions across this journey:\n\
    1. **CPU Execution Mode**:\n   * Milestones 1–4: **16-bit Real Mode** (Segment\
    \ * 16 + Offset).\n   * Milestone 5: **32-bit Flat Protected Mode** (Descriptor\
    \ Segment Selectors).\n   * Milestones 6–7: **32-bit Protected Mode with Paging**\
    \ (MMU Page Tables).\n   * Milestone 8: **Ring 3 Userspace Mode** (Application\
    \ privilege).\n2. **Memory Map Shift**:\n   * Address `0x00000` starts as the\
    \ BIOS Real-Mode Interrupt Vector Table.\n   * By Milestone 4, `system` overwrites\
    \ `0x00000`.\n   * By Milestone 6, the Page Directory overwrites the startup code\
    \ of `head.s` at `0x00000`!\n   Linus reused the exact same 4KB of physical memory\
    \ three separate times during boot!\n\n### 4. The Failure Mode & Boundary\nThe\
    \ fatal error is losing track of what privilege level and memory mode the CPU\
    \ is in at any given moment:\n* Issuing a 32-bit pointer dereference in Milestone\
    \ 2 crashes real mode.\n* Issuing a BIOS interrupt (`int 0x10`) in Milestone 6\
    \ crashes protected mode.\n* Issuing privileged I/O instructions (`inb`/`outb`)\
    \ in Milestone 8 triggers a General Protection Fault in Ring 3.\n\n### 5. The\
    \ Compressed Mental Axiom\n*From raw power to userspace, an operating system bootstraps\
    \ by successively constructing its own execution foundations.*"
  diagram:
    kind: flow
    caption: The End-to-End Linux 0.11 Boot Architecture Roadmap
    nodes:
    - id: reset
      label: '1. Reset (0xFFFF0: 16-bit Real)'
      shape: round
    - id: bsect
      label: 2. bootsect (0x7C00 -> 0x90000)
      shape: box
    - id: setup
      label: 3. setup (A20, CR0.PE -> PM32)
      shape: box
    - id: head
      label: 4. head (CR0.PG, 16MB Paging)
      shape: box
    - id: main
      label: 5. main() (Ring 0 C Init, sti)
      shape: box
    - id: user
      label: 6. init() (Ring 3 Userspace)
      shape: round
    edges:
    - from: reset
      to: bsect
      label: BIOS Floppy Read
    - from: bsect
      to: setup
      label: rep movw & INT 13h
    - from: setup
      to: head
      label: jmpi 0,8
    - from: head
      to: main
      label: ret into C
    - from: main
      to: user
      label: move_to_user_mode
    steps:
    - focus:
      - reset
      - bsect
      note: 'Phase 1: Real-mode BIOS handoff and bootsector self-relocation'
    - focus:
      - setup
      - head
      note: 'Phase 2: Transition from real mode to flat 32-bit protected mode and
        paging'
    - focus:
      - main
      - user
      note: 'Phase 3: Kernel C subsystem initialization and transition to Ring 3 userspace'
  checks:
  - kind: order
    concept: privilege-progression-order
    q: 'Arrange the CPU execution and privilege states in their exact historical order
      during boot:'
    answer_order:
    - 0
    - 1
    - 2
    - 3
    why: 'The hardware strictly progresses: 16-bit Real Mode -> 32-bit Flat Protected
      Mode -> Paging Enabled (Ring 0) -> Ring 3 Userspace.'
    lines:
    - 16-bit Real Mode (Address = Segment * 16 + Offset)
    - 32-bit Protected Mode without Paging (Linear Addressing, Ring 0)
    - 32-bit Protected Mode with Paging (Virtual Addressing, Ring 0)
    - Userspace Mode (Ring 3 Privilege Level)
  - kind: mcq
    concept: memory-reuse-artifact
    q: What physical memory structure eventually occupies address `0x00000000` once
      the operating system reaches `main()`?
    choices:
    - The kernel Page Directory (`_pg_dir`), which overwrote the temporary startup
      code of `head.s`
    - The original real-mode BIOS interrupt table
    - The userspace bash shell executable binary
    answer: 0
    why: 'Option A is correct: In `head.s`, Linus explicitly placed `_pg_dir` at `0x00000000`.
      The temporary startup code of `head.s` executed at `0x00000000` and was subsequently
      overwritten by the Page Directory (Evidence E-A1-04).'
  - kind: why-fails
    concept: bios-call-in-protected-mode
    q: Why can code inside `init/main.c` NOT invoke BIOS video interrupt `int 0x10`
      to print characters to the display?
    choices:
    - The BIOS chip is physically powered down after setup.s
    - The BIOS routines are 16-bit real-mode code; executing them in 32-bit protected
      mode with paging active causes invalid instruction decoding and memory faults
    - Modern displays do not support text mode
    answer: 1
    why: 'Option B is correct: BIOS code consists of 16-bit real-mode instructions
      that assume 1MB segmented addressing and lack protected-mode descriptor awareness.
      Calling BIOS interrupts from 32-bit protected mode crashes the CPU.'
  - kind: choose-better
    concept: task0-idle-role
    q: At the very end of `init/main.c`, what becomes of the original thread of execution
      that booted the system?
    choices:
    - It returns back to the BIOS setup utility
    - It terminates and unloads itself from memory
    - It forks Process 1 (`init`) and becomes Task 0, executing an infinite `for(;;)
      pause();` idle loop that runs whenever no other task is runnable
    answer: 2
    why: 'Option C is correct: Line 148 of `init/main.c` executes `for(;;) pause();`.
      Task 0 never terminates; it serves as the kernel idle task scheduled whenever
      all user processes are blocked (Evidence E-A1-05).'
  - kind: fillblank
    concept: user-mode-macro
    q: In `init/main.c`, the kernel drops privilege from Ring 0 to Ring 3 by invoking
      the macro named ___().
    answer_text: move_to_user_mode
    why: '`move_to_user_mode()` uses a simulated interrupt return (`iret`) stack frame
      to reload CS and SS with Ring 3 privilege selectors.'
