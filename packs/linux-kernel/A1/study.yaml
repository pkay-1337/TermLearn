  checks:
  - kind: mcq
    concept: tools-build-role
    q: What is the primary architectural function of the custom host utility `tools/build.c`
      in Linux 0.11?
    choices:
    - It formats the hard drive with an ext4 journaling filesystem
    - It translates 32-bit x86 assembly into 64-bit machine code
    - It stitches raw bootsect, setup, and stripped system binaries into a contiguous,
      sector-aligned floppy image (`Image`) and sets MBR bytes
    answer: 2
    why: 'Option C is correct: In 1991, standard linkers could not assemble mixed
      16-bit and 32-bit disk images. `tools/build.c` was written by Linus to stitch
      the sectors together and patch MBR bytes (Evidence E-A1-08).'
  - kind: why-fails
    concept: qemu-s-flag-necessity
    q: Why is the `-S` flag essential when launching QEMU for early boot debugging?
    choices:
    - Without `-S`, the virtual CPU immediately begins running at power-on, blowing
      past early boot breakpoints before GDB can connect
    - The `-S` flag allocates 16 megabytes of virtual RAM
    - Without `-S`, QEMU disables the graphical display
    answer: 0
    why: 'Option A is correct: `-S` freezes the vCPU at power-on reset. This guarantees
      that when GDB attaches via `:1234`, the machine is frozen before a single instruction
      executes, allowing hardware breakpoints to be armed safely.'
  - kind: fillblank
    concept: qemu-gdb-port
    q: When QEMU is launched with the `-s` flag, it listens for remote GDB RSP connections
      on TCP port ___.
    answer_text: '1234'
    why: The `-s` flag is shorthand in QEMU for `-gdb tcp::1234`.
  - kind: choose-better
    concept: target-remote-qemu
    q: Which GDB command connects your debugger to the running QEMU virtual machine
      listening on port 1234?
    choices:
    - '`run 1234`'
    - '`target remote :1234`'
    - '`attach localhost:1234`'
    answer: 1
    why: 'Option B is correct: `target remote :1234` instructs GDB to communicate
      over TCP using the Remote Serial Protocol (RSP) to port 1234.'
  - kind: predict
    concept: root-dev-panic
    q: What happens if `Image` is booted in QEMU with a missing or unmounted hard
      drive image (`hdc-0.11.img`)?
    choices:
    - The CPU loops forever inside head.s
    - The BIOS emits a loud beep and shuts down QEMU during bootsect.s
    - 'The kernel successfully boots through assembly, enters main(), and then panics
      with: ''Kernel panic: Unable to mount root'''
    answer: 2
    why: 'Option C is correct: The boot sequence succeeds entirely until `init/main.c`
      attempts to mount the root filesystem device (`ROOT_DEV = 0x306`). Without a
      valid root partition, `mount_root()` fails and panics.'
- id: b11
  type: algorithm
  title: 'Remote GDB Kernel Trapping: Breaking at init/main.c:main()'
  explain_md: "### 1. Frame the Problem\nMany developers attempt to debug early operating\
    \ system code by sprinkling `printf` or `printk` statements across the codebase.\n\
    \nIn early boot, this is impossible. When execution is in `bootsect.s`, `setup.s`,\
    \ or the entry of `main()`, there is no terminal driver, no console output buffer,\
    \ no video scrolling logic, and no memory allocator. Calling `printk()` before\
    \ device initialization causes an immediate kernel crash.\n\nHow can a kernel\
    \ engineer prove beyond a shadow of a doubt that the CPU successfully navigated\
    \ 16-bit real mode, enabled the A20 gate, initialized protected mode, configured\
    \ identity paging, and arrived safely at the first statement of C code?\n\n###\
    \ 2. The Notional Machine\nIn Chapter `T1A`, you mastered GDB's **Remote Serial\
    \ Protocol (RSP)**. We apply that exact mechanism to trap the live operating system.\n\
    \nWhen QEMU launches with `-s -S`, the hypervisor initializes the virtual processor\
    \ and pauses execution at the reset vector (`0xFFFF0`). \n\nBy connecting GDB\
    \ over TCP port `1234` and loading the DWARF debug symbols from `tools/system`:\n\
    1. GDB resolves the symbolic label `main` to its exact 32-bit linear address:\
    \ **`0x00006771`** (in `init/main.c`).\n2. GDB instructs the QEMU hypervisor stub\
    \ to arm a breakpoint at `0x00006771`.\n3. GDB issues the `continue` command.\n\
    4. The virtual CPU executes thousands of instructions at hardware speed:\n   *\
    \ `bootsect.s` moves itself and streams sectors from disk.\n   * `setup.s` enables\
    \ A20 and flips `CR0.PE`.\n   * `head.s` populates page tables and flips `CR0.PG`.\n\
    \   * `setup_paging` executes `ret`!\n5. The instant the CPU instruction pointer\
    \ hits `0x00006771`, the hypervisor freezes the virtual CPU and sends an RSP notification\
    \ packet (`T05...`) back to GDB!\n\n### 3. Source-Grounded Walkthrough\nLook at\
    \ Evidence `E-A1-09`:\n```text\n$ gdb -q -batch     -ex \"file tools/system\"\
    \     -ex \"target remote :1234\"     -ex \"break main\"     -ex \"continue\"\
    \     -ex \"bt\"     -ex \"info registers eip esp eax\"     -ex \"x/8i $eip\"\n\
    ```\nCaptured Output from the Live Hypervisor:\n```text\nBreakpoint 1 at 0x6771:\
    \ file init/main.c, line 107.\nContinuing.\n\nBreakpoint 1, main () at init/main.c:107\n\
    107\t \tROOT_DEV = ORIG_ROOT_DEV;\n#0  main () at init/main.c:107\neip       \
    \     0x6771              0x6771 <main>\nesp            0x27f70             0x27f70\
    \ <user_stack+4080>\neax            0x80000013          -2147483629\n=> 0x6771\
    \ <main>:\tmov    0x901fc,%ax\n   0x6777 <main+6>:\tmov    %ax,0x27f78\n   0x677d\
    \ <main+12>:\tmov    $0x90080,%esi\n   0x6782 <main+17>:\tmov    $0x27f80,%edi\n\
    ```\nAnalyze this output:\n* `Breakpoint 1, main () at init/main.c:107`: GDB successfully\
    \ trapped execution at the C source level!\n* `eip = 0x6771`: The instruction\
    \ pointer is positioned at the start of `main()`.\n* `ROOT_DEV = ORIG_ROOT_DEV;`:\
    \ Line 107 is about to execute.\n* `x/8i $eip`: Disassembling `$eip` reveals `mov\
    \ 0x901fc, %ax`—the exact compiled machine instructions reading the saved root\
    \ device from address `0x901FC`!\n\n### 4. The Failure Mode & Boundary\nThe fatal\
    \ error is issuing `run` instead of `continue` in GDB. When attached to a remote\
    \ target (`target remote :1234`), issuing `run` tells GDB to spawn a brand new\
    \ process on the host OS. GDB responds with:\n`The \"remote\" target does not\
    \ support \"run\". Try \"help target\" or \"continue\".`\nAlways use `continue`\
    \ when attached to a running hypervisor stub.\n\n### 5. The Compressed Mental\
    \ Axiom\n*Don't guess what the kernel does at boot; freeze it at main() with GDB\
    \ and inspect reality.*"
