blocks:
- id: b1
  type: model
  title: Source Tree Anatomy & The 100-File Operating System
  explain_md: "### 1. Frame the Problem\nWhen developers first approach the modern\
    \ Linux kernel (v6.18+), they are confronted by over 70,000 source files and 35\
    \ million lines of code. Trying to grasp core operating system principles—how\
    \ memory is virtualized, how processes are scheduled, and how hardware boots—against\
    \ this immense codebase causes immediate epistemic paralysis.\n\nIn September\
    \ 1991, Linus Torvalds released Linux 0.11. It was not a toy simulator; it was\
    \ a fully functional, POSIX-compliant, multitasking, virtual-memory operating\
    \ system capable of running GCC, Bash, and GNU Make. Crucially, Linux 0.11 consists\
    \ of **exactly 100 files and 13,839 lines of code**. A disciplined systems programmer\
    \ can hold the entire architecture in their head.\n\n### 2. The Notional Machine\n\
    In your curriculum workspace, you have access to two distinct repositories:\n\
    1. **The Pristine Historical Tree (`sources/early-history.git`):**\n   Pinned\
    \ to git tag `0.11` (Commit `b65b60f4acd7...`, Tree `d4303c76a8...`). This is\
    \ our immutable **Source of Truth** representing the exact bytes released in 1991.\n\
    2. **The Modern Runnable Harness (`sources/Linux-0.11-fork`):**\n   Modern compilers\
    \ (GCC 16) reject 1991 C dialect quirks (implicit `int`, missing function prototypes).\
    \ This harness contains the build flags (`-std=gnu89`, `-m32`) and QEMU disk fixtures\
    \ required to compile and execute the kernel today.\n\nThe entire Linux 0.11 operating\
    \ system is partitioned into exactly 8 functional directories:\n* `boot/` (3 files):\
    \ Raw x86 assembly bootstrap (`bootsect.s`, `setup.s`, `head.s`).\n* `init/` (1\
    \ file): The C entry point and system initialization bridge (`main.c`).\n* `kernel/`\
    \ (19 files): Process scheduling, `fork`, `exit`, signals, interrupts, and system\
    \ call dispatching.\n* `mm/` (2 files): Two-level paging, demand paging, and copy-on-write\
    \ page fault handlers (`memory.c`, `page.s`).\n* `fs/` (18 files): Minix filesystem\
    \ driver, inode/file management, and the unified buffer cache (`buffer.c`).\n\
    * `include/` (32 files): Architecture definitions (`asm/`), standard C interfaces,\
    \ and kernel data structures.\n* `lib/` (12 files): Freestanding userspace library\
    \ routines compiled into kernel space (`string.s`, `malloc.c`).\n* `tools/` (1\
    \ file): The host build tool (`build.c`) that stitches boot sectors and kernel\
    \ images into a floppy disk.\n\n### 3. Source-Grounded Walkthrough\nLook at Evidence\
    \ `E-A1-01`:\n```text\n$ git rev-parse 0.11\nb65b60f4acd7efbbccd3d2411e9e5bca520a7574\n\
    $ git ls-tree -r --name-only 0.11 | wc -l\n100\n$ git ls-tree -d --name-only 0.11\n\
    boot\nfs\ninclude\ninit\nkernel\nlib\nmm\ntools\n```\nEvery directory directly\
    \ maps to an essential operating system responsibility. Notice that `boot/` contains\
    \ only 3 files and `init/` contains only 1 file (`main.c`). Our entire journey\
    \ in Chapter A1 takes place across these two directories.\n\n### 4. The Failure\
    \ Mode & Boundary\nThe fatal beginner trap is confusing the modernized build harness\
    \ with the original historical source. If you modify files in `sources/Linux-0.11-fork`\
    \ thinking you are reading Linus's original 1991 thoughts, you will see modernized\
    \ Makefile tweaks. Always verify source claims against `sources/early-history.git`\
    \ at tag `0.11`.\n\n### 5. The Compressed Mental Axiom\n*An operating system is\
    \ not magic; it is 100 C and assembly files organized into 8 explicit subsystem\
    \ directories.*"
  diagram:
    kind: flow
    caption: Linux 0.11 Repository Architecture and Subsystem Topology
    nodes:
    - id: root
      label: Linux 0.11 (100 Files)
      shape: round
    - id: boot
      label: 'boot/ (3 Files: Bootstrap)'
      shape: box
    - id: init
      label: 'init/ (1 File: main.c)'
      shape: box
    - id: core
      label: kernel/ & mm/ & fs/ (Core OS)
      shape: box
    - id: supp
      label: include/ & lib/ & tools/
      shape: box
    edges:
    - from: root
      to: boot
      label: Hardware Wakeup
    - from: boot
      to: init
      label: Jump to C
    - from: init
      to: core
      label: Subsystem Init
    - from: root
      to: supp
      label: Types & Build Tools
    steps:
    - focus:
      - root
      - boot
      note: 'Step 1: Raw assembly bootstrap initializes hardware'
    - focus:
      - boot
      - init
      note: 'Step 2: Control transitions into C at init/main.c'
    - focus:
      - init
      - core
      note: 'Step 3: main() initializes scheduling, memory, and filesystem'
  viz:
    kind: ascii-memory
    caption: Repository Mapping on Host Filesystem
    steps:
    - '[Pristine Git Tree] sources/early-history.git @ tag 0.11 · Commit b65b60f4
      · Status: IMMUTABLE SOURCE OF TRUTH'
    - '[Runnable Harness] sources/Linux-0.11-fork · GCC 16 CFLAGS: -std=gnu89 -m32
      · Status: BUILD & QEMU HARNESS'
    - '[Artifact Generation] tools/build stitches bootsect + setup + system -> Image
      (bootable floppy disk image)'
  checks:
  - kind: mcq
    concept: source-tree-scope
    q: How many total files and lines of code comprise the entire pristine Linux 0.11
      kernel source tree?
    choices:
    - Exactly 100 files containing approximately 13,839 lines of code across 8 directories
    - Over 70,000 files containing 35 million lines of code across 32 directories
    - 1,400 files containing 250,000 lines of code across 16 directories
    answer: 0
    why: 'Option A is correct: Linux 0.11 is remarkably compact, containing exactly
      100 files and 13,839 lines of code (Evidence E-A1-01). Option B describes modern
      Linux (v6.18+). Option C reflects middle-era Linux (v2.0/v2.2).'
  - kind: choose-better
    concept: source-of-truth-selection
    q: You need to cite the exact line numbers and assembly instructions Linus Torvalds
      wrote in 1991 for bootsect.s. Which repository directory must you inspect?
    choices:
    - sources/Linux-0.11-fork because it compiles cleanly under modern GCC 16
    - sources/early-history.git checked out at tag 0.11 (commit b65b60f4)
    - /usr/src/linux-headers on your host operating system
    answer: 1
    why: 'Option B is correct: `early-history.git` at tag 0.11 is the immutable historical
      source of truth. Option A contains modern build harness adjustments. Option
      C contains host kernel headers (6.18+), completely irrelevant to 1991 code.'
  - kind: fillblank
    concept: directory-mapping
    q: In Linux 0.11, the C entry point `main()` resides inside the directory named
      ___.
    answer_text: init
    why: '`main.c` is the sole source file residing in `init/`, bridging the low-level
      assembly bootstrap in `boot/` to the rest of the kernel.'
  - kind: why-fails
    concept: toolchain-dialect-requirement
    q: Why does attempting to compile pristine Linux 0.11 directly with modern GCC
      16 without `-std=gnu89` fail?
    choices:
    - The original kernel required a proprietary closed-source Borland C compiler
      unavailable on Linux
    - Linux 0.11 was written in ARM assembly and cannot execute on x86 processors
    - Modern GCC defaults to modern C standards (C17/C23) which strictly ban implicit
      int return types and missing prototypes
    answer: 2
    why: 'Option C is correct: 1991 C code relied on GCC 1.40 quirks like implicit
      `int main()` and prototype-less declarations, which modern compilers reject
      under default standard flags (Evidence E-A1-06). Option B is false; 0.11 targeted
      386 x86 exclusively. Option A is false; Linus used GNU GCC from the beginning.'
  - kind: mcq
    concept: prior-knowledge-tooling
    from_chapter: T0B
    from_block: b1
    q: When exploring a 100-file repository, what is the fundamental difference between
      a function prototype in `include/linux/*.h` and its implementation in `kernel/*.c`?
    choices:
    - Prototypes allocate zero executable memory in .text; implementations generate
      concrete machine instructions
    - Prototypes emit executable bytes into .data; implementations emit bytes into
      .rodata
    - Prototypes run at compile time; implementations run only inside the BIOS
    answer: 0
    why: 'Option A is correct (from T0B): A declaration in a header is a forward type
      contract allocating zero bytes; the definition in a .c translation unit emits
      concrete machine instructions into .text.'
- id: b2
  type: model
  title: 'The Chapter A1 Mission: The 4-Stage Bootstrap Pipeline'
  explain_md: "### 1. Frame the Problem\nWhen you press the power button on an x86\
    \ computer, the CPU does not immediately execute high-level C code. In fact, it\
    \ cannot execute C code at all.\n\nThere is no stack pointer (`ESP`), no memory\
    \ management unit (MMU), no virtual memory, no file system, and no concept of\
    \ a process. The processor awakens in 16-bit **Real Mode**—a backward-compatible\
    \ hardware state identical to the 1978 Intel 8086 CPU. It can address at most\
    \ 1 megabyte of memory.\n\nHow does a computer transform itself from raw silicon\
    \ with 1MB of segmented memory into a 32-bit protected-mode operating system running\
    \ C?\n\n### 2. The Notional Machine\nIn Chapter A1, we trace the exact **4-stage\
    \ chain of custody** that bootstraps Linux 0.11:\n\n1. **Stage 1: `boot/bootsect.s`\
    \ (Floppy Sector 1, exactly 512 bytes)**:\n   * The BIOS reads the first 512-byte\
    \ disk sector into RAM at physical address `0x7C00`.\n   * `bootsect` immediately\
    \ copies itself out of the way to `0x90000`.\n   * It uses BIOS interrupt `INT\
    \ 13h` to load `setup.s` into `0x90200` and stream the kernel image (`system`)\
    \ into `0x10000`.\n2. **Stage 2: `boot/setup.s` (Floppy Sectors 2–5, 2048 bytes)**:\n\
    \   * Queries the BIOS for system parameters (RAM size, display geometry, disk\
    \ parameters) and stores them in safe memory at `0x90000`–`0x901FF`.\n   * Moves\
    \ the entire `system` kernel image down from `0x10000` to physical address `0x00000`.\n\
    \   * Enables the **A20 Gate** (unlocking 32-bit addressing pins on the motherboard).\n\
    \   * Loads temporary Global and Interrupt Descriptor Tables (`GDT` / `IDT`).\n\
    \   * Flips the Protection Enable (`PE`) bit in control register `CR0`.\n   *\
    \ Executes a far jump (`jmpi 0, 8`) to enter 32-bit Protected Mode!\n3. **Stage\
    \ 3: `boot/head.s` (32-bit Assembly, start of `system` at `0x00000`)**:\n   *\
    \ Reloads segment registers (`DS`, `ES`, `FS`, `GS` = `0x10`) for 32-bit flat\
    \ memory.\n   * Sets up a temporary kernel stack (`ESP = user_stack`).\n   * Configures\
    \ all 256 IDT gates to point to a dummy default interrupt handler.\n   * Builds\
    \ the initial **Page Directory** at `0x00000` and 4 **Page Tables** at `0x01000`–`0x04000`,\
    \ identity-mapping the first 16 megabytes of physical RAM.\n   * Turns on the\
    \ Paging (`PG`) bit in `CR0` and loads `CR3`.\n   * Pushes the address of `main`\
    \ onto the stack and executes `ret` to jump into C!\n4. **Stage 4: `init/main.c`\
    \ (First C Statement)**:\n   * Lands in `main()` at address `0x00006771`.\n  \
    \ * Partitions physical memory, initializes drivers, enables hardware interrupts\
    \ with `sti()`, transitions to user mode (Ring 3), and forks the first userspace\
    \ process (`init`).\n\n### 3. Source-Grounded Walkthrough\nLook at the custody\
    \ handoffs across the files in `sources/early-history.git`:\n* In `bootsect.s`:\
    \ `jmpi go, INITSEG` passes execution from `0x7C00` to `0x90000`.\n* At the end\
    \ of `setup.s`: `jmpi 0, 8` passes execution to 32-bit segment 8, offset 0 (`head.s`).\n\
    * At the end of `head.s`:\n  ```asm\n  pushl $_main\n  jmp setup_paging\n  ...\n\
    \  setup_paging:\n      ...\n      movl %eax, %cr0   # enable paging\n      ret\
    \               # pops $_main into EIP!\n  ```\nThe `ret` instruction is Linus's\
    \ elegant mechanism to transition from 32-bit assembly into C!\n\n### 4. The Failure\
    \ Mode & Boundary\nThe most common mental trap is assuming the kernel initializes\
    \ in C. If you attempt to run C code before `head.s` completes:\n1. Pointers will\
    \ crash the machine because segment selectors are uninitialized.\n2. Function\
    \ calls will fail because there is no stack frame (`ESP`).\n3. Memory references\
    \ above 1MB will wrap around to 0 because the A20 gate is disabled.\n\n### 5.\
    \ The Compressed Mental Axiom\n*Before C can run, assembly must build the world\
    \ C assumes.*"
  diagram:
    kind: flow
    caption: The 4-Stage Bootstrap Custody Chain
    nodes:
    - id: bios
      label: BIOS Reset (0xFFFF0)
      shape: round
    - id: bsect
      label: 1. bootsect.s (0x7C00 -> 0x90000)
      shape: box
    - id: setup
      label: 2. setup.s (A20, CR0.PE -> PM32)
      shape: box
    - id: head
      label: 3. head.s (Paging CR0.PG -> 16MB)
      shape: box
    - id: main
      label: 4. init/main.c (Ring 0 C Entry)
      shape: round
    edges:
    - from: bios
      to: bsect
      label: Loads Sector 1
    - from: bsect
      to: setup
      label: Loads Sectors 2-5
    - from: setup
      to: head
      label: jmpi 0,8 (32-bit)
    - from: head
      to: main
      label: ret into main()
    steps:
    - focus:
      - bios
      - bsect
      note: 'Stage 1: BIOS loads 512-byte bootsect; bootsect relocates itself to 0x90000'
    - focus:
      - bsect
      - setup
      note: 'Stage 2: setup.s probes BIOS, enables A20, switches to 32-bit protected
        mode'
    - focus:
      - setup
      - head
      note: 'Stage 3: head.s initializes 16MB identity paging and segment selectors'
    - focus:
      - head
      - main
      note: 'Stage 4: Execution lands in main() at 0x6771 in Ring 0 with paging live'
  viz:
    kind: ascii-memory
    caption: Bootstrap Execution Pointer and Mode Progression
    steps:
    - '[Stage 1: Real Mode] CS:IP = 0x9000:0x0000 · CPU Mode: 16-bit Real Mode · Paging:
      OFF · A20: DISABLED'
    - '[Stage 2: Protected Mode] CS:IP = 0x0008:0x00000000 · CPU Mode: 32-bit Protected
      Mode (CR0.PE=1) · Paging: OFF · A20: ENABLED'
    - '[Stage 3: Paging Enabled] CR3 = 0x00000000 · CR0.PG = 1 · 16MB Identity Mapped
      · Stack: ESP = user_stack'
    - '[Stage 4: C Entry Point] EIP = 0x00006771 (main) · Ring: 0 (Supervisor) · State:
      C Runtime Active'
  checks:
  - kind: order
    concept: bootstrap-stage-order
    q: 'Place the 4 core bootstrap components of Linux 0.11 in their exact chronological
      order of execution:'
    answer_order:
    - 1
    - 0
    - 3
    - 2
    why: 'The custody chain proceeds strictly: 1. bootsect.s (Sector 1) -> 2. setup.s
      (Sectors 2-5) -> 3. head.s (Sector 6+) -> 4. init/main.c (C entry).'
    lines:
    - setup.s switches CPU to 32-bit protected mode and enables A20
    - bootsect.s relocates from 0x7C00 to 0x90000 and loads remaining sectors
    - init/main.c enters main() and initializes kernel subsystems
    - head.s builds 16MB identity page tables and enables CR0.PG
  - kind: mcq
    concept: head-to-main-handoff
    q: How does `boot/head.s` transfer execution to `init/main.c:main()` once paging
      is initialized?
    choices:
    - It uses a direct software interrupt `int 0x80` to jump into the C library
    - It pushes the address of `_main` onto the stack and executes `ret` at the end
      of `setup_paging`
    - It invokes the Linux dynamic ELF linker `/lib/ld-linux.so` to resolve `main`
    answer: 1
    why: 'Option B is correct: In `head.s`, Linus pushed `$_main` onto the stack (`pushl
      $_main`) and jumped to `setup_paging`. When `setup_paging` finishes, its final
      `ret` instruction pops `_main` into `EIP` (Evidence E-A1-04). Option A traps
      syscall confusion; int 0x80 is for userspace syscalls. Option C traps modern
      dynamic linking; 0.11 was statically linked flat binary.'
  - kind: predict
    concept: stack-precondition
    q: What happens if a developer attempts to call a standard C function inside `setup.s`
      before `head.s` configures the stack pointer `ESP`?
    choices:
    - The compiler automatically converts all function calls to inline goto statements
    - The BIOS automatically redirects stack pushes to floppy disk sectors
    - The call instruction attempts to push the return address to a garbage stack
      address, causing an immediate hardware crash or memory corruption
    answer: 2
    why: 'Option C is correct: C function calls rely on the `call` instruction, which
      pushes `EIP` onto the stack pointed to by `ESP`. Without an established valid
      stack pointer in RAM, any function call corrupts memory or triggers a CPU fault.'
  - kind: choose-better
    concept: tooling-integration-t1a
    from_chapter: T1A
    from_block: b11
    q: You need to pause the Linux 0.11 kernel at the very first instruction of `main()`
      to inspect machine state. Which GDB breakpoint command should you use when attached
      to QEMU via `:1234`?
    choices:
    - Set a hardware breakpoint using `hbreak main` to avoid memory patching before
      paging is established
    - Inject a `printf()` statement into `bootsect.s` to display registers on the
      screen
    - Run GDB with `ptrace` targeting the local QEMU process ID on your host
    answer: 0
    why: 'Option A is correct (from T1A): `hbreak main` uses CPU hardware debug registers
      (DR0-DR3), avoiding software breakpoint RAM patches (0xCC) during delicate early
      boot. Option B fails because bootsect runs in 16-bit real mode and cannot run
      C printf. Option C fails because host ptrace cannot debug guest operating system
      virtual addresses.'
  - kind: why-fails
    concept: real-mode-boundary
    q: Why can the BIOS not load the Linux kernel directly into high memory (e.g.
      4MB or 8MB) at power-on?
    choices:
    - Floppy disks physically cannot store data destined for addresses above 1MB
    - The CPU is in 16-bit Real Mode with only 20 address lines active, capping physical
      addressing strictly to 1MB
    - The BIOS ROM chip occupies all memory between 1MB and 16MB
    answer: 1
    why: 'Option B is correct: At reset, the x86 processor operates in 16-bit real
      mode with the A20 address line disabled, creating a hard physical addressing
      limit of $2^{20} = 1,048,576$ bytes (1MB).'
- id: b3
  type: model
  title: 80386 Hardware Reset State & Real Mode Memory Segmentation
  explain_md: "### 1. Frame the Problem\nWhy does a 32-bit Intel 80386 processor—capable\
    \ of addressing 4 gigabytes of memory and executing protected instructions—wake\
    \ up as a crippled 16-bit processor limited to 1 megabyte of RAM?\n\nThe answer\
    \ is historical backward compatibility. When Intel introduced the 80386 in 1985,\
    \ millions of personal computers ran MS-DOS on original 16-bit 8086 processors.\
    \ If the 386 had booted directly into 32-bit protected mode, existing operating\
    \ systems and BIOS chips would have crashed instantly. Intel engineered the 386\
    \ to boot in **Real Mode**—behaving identically to a 1978 8086.\n\n### 2. The\
    \ Notional Machine\nWhen voltage stabilizes on the motherboard, the CPU's internal\
    \ logic forces specific register states:\n* Code Segment (`CS`): `0xF000`\n* Instruction\
    \ Pointer (`IP`): `0xFFF0`\n* Address Bus: 20 active address lines ($A_0$ through\
    \ $A_{19}$), capping addressing at $2^{20} = 1,048,576$ bytes (1MB).\n\nIn 16-bit\
    \ Real Mode, registers are only 16 bits wide, meaning a single register can only\
    \ count up to $2^{16} = 65,535$ (64KB). To reach addresses across the 1MB ceiling,\
    \ the processor uses **Segmented Memory Translation**:\n\n$$\\text{Physical Address}\
    \ = (\\text{Segment Selector} \\times 16) + \\text{Offset}$$\n\nMultiplying the\
    \ 16-bit segment by 16 is equivalent to shifting the hexadecimal value one nibble\
    \ to the left (a 4-bit logical shift).\n\nAt power-on reset:\n$$\\text{Reset Vector}\
    \ = (0\\text{xF000} \\times 16) + 0\\text{xFFF0} = 0\\text{xF0000} + 0\\text{xFFF0}\
    \ = 0\\text{xFFFF0}$$\n\nAddress `0xFFFF0` sits exactly 16 bytes below the 1MB\
    \ boundary. Hardwired motherboard circuitry maps this address to read-only memory\
    \ (**ROM BIOS**). The BIOS executes a power-on self-test (POST), initializes disk\
    \ controllers, and prepares to boot.\n\n### 3. Source-Grounded Walkthrough\nConsider\
    \ the canonical segmented addresses used in `boot/bootsect.s`:\n* `BOOTSEG = 0x07c0`:\
    \ Loaded by BIOS at physical address:\n  $$(0\\text{x07C0} \\times 16) + 0\\text{x0000}\
    \ = 0\\text{x07C00}$$\n* `INITSEG = 0x9000`: Target of bootsect relocation:\n\
    \  $$(0\\text{x9000} \\times 16) + 0\\text{x0000} = 0\\text{x90000}$$\n* `SETUPSEG\
    \ = 0x9020`: Loaded directly after bootsect:\n  $$(0\\text{x9020} \\times 16)\
    \ + 0\\text{x0000} = 0\\text{x90200}$$\n  Notice that $0\\text{x90200} - 0\\text{x90000}\
    \ = 0\\text{x200} = 512$ bytes! The segment value `0x9020` is offset by exactly\
    \ 512 bytes from `0x9000`.\n\n### 4. The Failure Mode & Boundary\nThe most dangerous\
    \ real-mode error is forgetting the 4-bit shift. If you treat a segment register\
    \ like a physical pointer and write to offset `0x9000`, you access physical byte\
    \ `0x09000`, not `0x90000`! You end up corrupting low BIOS data structures instead\
    \ of the intended kernel staging buffer.\n\n### 5. The Compressed Mental Axiom\n\
    *In real mode, segments are multipliers: every segment increment shifts your physical\
    \ base by 16 bytes.*"
  diagram:
    kind: art
    caption: Real-Mode Segmented Address Translation Math
    art: "+-------------------+-------------------+\n| Segment (16 bits) |  0x07C0\
      \           |\n+-------------------+-------------------+\n         | (Shift\
      \ left 4 bits / multiply by 16)\n         v\n+-----------------------+---------------+\n\
      | Base Address (20 bits)|  0x07C00      |\n+-----------------------+---------------+\n\
      \         +\n+-----------------------+---------------+\n| Offset (16 bits) \
      \     |  0x0000       |\n+-----------------------+---------------+\n       \
      \  =\n+-----------------------+---------------+\n| Physical Target RAM   | \
      \ 0x07C00      |\n+-----------------------+---------------+"
  viz:
    kind: ascii-memory
    caption: Real-Mode Physical Memory Map (0 to 1MB)
    steps:
    - '[Reset Vector] CS:IP = 0xF000:0xFFF0 -> Physical 0xFFFF0 · Mapped to BIOS ROM'
    - '[BIOS Handoff] BIOS loads Sector 1 to Physical 0x07C00 (Segment 0x07C0:0x0000)'
    - '[Relocation Destination] Target Segment 0x9000:0x0000 -> Physical 0x90000 (Top
      of Low RAM)'
  checks:
  - kind: predict
    concept: segmented-address-calculation
    q: What is the physical memory address referenced by real-mode segment `0x9020`
      with offset `0x0150`?
    choices:
    - '0x09170'
    - '0x90200'
    - '0x90350'
    answer: 2
    why: 'Option C is correct: Physical Address = (0x9020 << 4) + 0x0150 = 0x90200
      + 0x0150 = 0x90350. Option B ignores the offset. Option A adds without the 4-bit
      left shift.'
  - kind: why-fails
    concept: reset-vector-location
    q: Why does the x86 CPU execute its first power-on instruction at physical address
      `0xFFFF0` instead of `0x00000`?
    choices:
    - Address 0x00000 contains the Real-Mode Interrupt Vector Table (IVT); placing
      code there would destroy interrupt vectors
    - Address 0xFFFF0 is the only address supported by 16-bit copper motherboard traces
    - The 80386 processor starts in 64-bit Long Mode by default
    answer: 0
    why: 'Option A is correct: The base of physical memory (0x00000 to 0x003FF) is
      reserved for the 256 real-mode interrupt vectors. The reset vector is placed
      at the very top of the 1MB range (0xFFFF0) where BIOS ROM resides.'
  - kind: fillblank
    concept: segment-shift-width
    q: In x86 real-mode segmented addressing, the 16-bit segment selector is shifted
      left by ___ bits to form the 20-bit base address.
    answer_text: '4'
    why: A 4-bit left shift multiplies the segment value by 16 ($2^4 = 16$), creating
      a 20-bit base address from a 16-bit segment register.
  - kind: mcq
    concept: addressing-ceiling
    q: What is the theoretical maximum physical address addressable in pure 8086 Real
      Mode using segment `0xFFFF` and offset `0xFFFF` with the A20 gate disabled?
    choices:
    - 0x10FFEF (accessible without restriction)
    - 0x0FFEF (due to 1MB address wraparound)
    - 4 Gigabytes (0xFFFFFFFF)
    answer: 1
    why: 'Option B is correct: (0xFFFF << 4) + 0xFFFF = 0x10FFEF. Because there are
      only 20 address lines (A0-A19) active in 8086 hardware, the 21st bit (A20) is
      dropped, wrapping the address around to 0x0FFEF. Option A is what happens when
      A20 is enabled.'
  - kind: choose-better
    concept: segment-representation
    q: You want to reference physical address `0x10000` (where `system` is initially
      loaded). Which segment:offset representation is standard in `bootsect.s`?
    choices:
    - '`SYSSEG = 0x10000` with offset `0x0000`'
    - '`SYSSEG = 0x0100` with offset `0x0000`'
    - '`SYSSEG = 0x1000` with offset `0x0000`'
    answer: 2
    why: 'Option C is correct: (0x1000 << 4) + 0x0000 = 0x10000. Option B yields 0x01000
      (4KB). Option A is invalid because 16-bit real-mode registers cannot hold 0x10000
      (17 bits).'
- id: b4
  type: model
  title: 'Boot Media Layout: Floppy Disk Sectors & MBR Geometry'
  explain_md: "### 1. Frame the Problem\nOperating systems do not exist as files when\
    \ the computer powers on. There is no ext4, no Minix filesystem, and no VFS layer.\
    \ The disk controller is raw physical hardware addressed by **Cylinders, Heads,\
    \ and Sectors (CHS)** or **Logical Block Addressing (LBA)**.\n\nThe BIOS contains\
    \ just enough intelligence to read exactly **one 512-byte sector** from disk into\
    \ memory. How did Linus Torvalds fit a multitasking Unix operating system onto\
    \ a medium where the hardware only loads 512 bytes?\n\n### 2. The Notional Machine\n\
    In Linux 0.11, the boot floppy disk image (`Image`) is not formatted with a filesystem.\
    \ It is a raw, sector-aligned binary stitched together by the host tool `tools/build.c`.\n\
    \nThe 1.44MB floppy disk image is structured into three continuous sector zones:\n\
    \n1. **Sector 1 (Offset 0, exactly 512 bytes) — `boot/bootsect.s`**:\n   * Assembled\
    \ from 16-bit assembly into pure machine code.\n   * Bytes 0–507: Executable bootstrap\
    \ machine code.\n   * Bytes 508–509: Root device number (`ROOT_DEV = 0x306`, corresponding\
    \ to `/dev/hd6`, the second partition on the first IDE hard drive).\n   * Bytes\
    \ 510–511: The sacred Master Boot Record signature **`0x55, 0xAA`** (in little-endian\
    \ word format: `0xAA55`).\n2. **Sectors 2 through 5 (Offsets 512–2559, exactly\
    \ 4 sectors = 2048 bytes) — `boot/setup.s`**:\n   * Contains hardware probing\
    \ code, protected-mode initialization, and descriptor tables.\n3. **Sector 6 through\
    \ End (Offset 2560 onwards) — `tools/system`**:\n   * The actual compiled kernel\
    \ binary. The first component inside `system` is `boot/head.s`, followed immediately\
    \ by all compiled C objects (`main.o`, `sched.o`, `buffer.o`, etc.).\n\n### 3.\
    \ Source-Grounded Walkthrough\nLook at Evidence `E-A1-02` and `E-A1-08`:\n```text\n\
    $ ls -l Image tools/system\n-rw-r--r-- 1 pk pk  134144 Nov 19 13:52 Image\n-rwxr-xr-x\
    \ 1 pk pk 1184320 Nov 19 13:52 tools/system\n$ file Image\nImage: DOS/MBR boot\
    \ sector\n```\nNotice that `file Image` identifies the raw image as a `DOS/MBR\
    \ boot sector`. Why? Because byte offset 510 contains `0x55` and byte 511 contains\
    \ `0xAA`.\n\nWhen the BIOS finishes POST, it scans bootable drives. It reads sector\
    \ 1 into RAM at `0x07C00` and inspects the final two bytes:\n* If bytes 510-511\
    \ are `0x55, 0xAA`, the BIOS validates the sector as bootable and executes a far\
    \ jump to `0x0000:0x7C00`.\n* If the signature is missing, the BIOS halts with\
    \ the famous error: *\"No bootable device found.\"*\n\n### 4. The Failure Mode\
    \ & Boundary\nIf `tools/build.c` compiles `bootsect.s` and the output exceeds\
    \ 512 bytes by even a single byte, the sector boundaries shift! `setup.s` will\
    \ be corrupted, the MBR signature will appear at offset 511-512 instead of 510-511,\
    \ and the BIOS will refuse to execute the disk.\n\n### 5. The Compressed Mental\
    \ Axiom\n*The BIOS is a 512-byte loader; everything beyond sector 1 is the kernel's\
    \ responsibility.*"
  diagram:
    kind: art
    caption: Linux 0.11 Raw Floppy Disk Sector Map
    art: '+---------------------------------------------------------------------+

      | RAW FLOPPY DISK LAYOUT (Image - 1.44MB Floppy Media)                |

      +-------------------+----------------+--------------------------------+

      | Sector Range      | Byte Size      | Contents & Subsystem Role      |

      +-------------------+----------------+--------------------------------+

      | Sector 1          | 512 Bytes      | boot/bootsect.s (MBR + 0xAA55) |

      | Sectors 2 - 5     | 2048 Bytes     | boot/setup.s (Hardware probe)  |

      | Sector 6 onwards  | ~128 KB        | tools/system (head.s + C code) |

      +-------------------+----------------+--------------------------------+'
  viz:
    kind: ascii-memory
    caption: Floppy Sector Offset Progression
    steps:
    - '[Sector 1: 0x0000-0x01FF] 512 bytes: bootsect.s · Byte 508: ROOT_DEV=0x306
      · Bytes 510-511: 0x55 0xAA'
    - '[Sectors 2-5: 0x0200-0x09FF] 2048 bytes: setup.s · SETUPLEN=4 sectors · Loaded
      to 0x90200'
    - '[Sector 6+: 0x0A00-End] ~128KB: tools/system · First code: startup_32 in head.s
      · Loaded to 0x10000'
  checks:
  - kind: mcq
    concept: mbr-signature-bytes
    q: What two-byte magic signature must be present at byte offsets 510 and 511 of
      Sector 1 for the BIOS to recognize it as a valid bootloader?
    choices:
    - 0x55, 0xAA (little-endian word 0xAA55)
    - 0x7F, 0x45 (the ELF magic header bytes)
    - 0xDE, 0xAD (hexadecimal crash sentinel)
    answer: 0
    why: 'Option A is correct: The IBM PC BIOS standard strictly checks for bytes
      0x55 (offset 510) and 0xAA (offset 511). Option B is the ELF magic header (`\x7FELF`).
      Option C is a debugging pattern.'
  - kind: why-fails
    concept: sector-boundary-shift
    q: What happens if a developer edits `bootsect.s` and increases its assembled
      size to 514 bytes before running `tools/build.c`?
    choices:
    - The BIOS automatically expands Sector 1 to 1024 bytes and boots normally
    - The MBR signature shifts out of bytes 510-511, and the BIOS rejects the disk
      as non-bootable
    - The CPU switches to 64-bit mode to handle the extra bytes
    answer: 1
    why: 'Option B is correct: Disk sectors are hard 512-byte hardware blocks. If
      bootsect exceeds 512 bytes, the 0xAA55 signature is displaced, causing BIOS
      validation to fail.'
  - kind: fillblank
    concept: setup-sector-count
    q: In `bootsect.s`, the constant `SETUPLEN` is set to ___ sectors (2048 bytes).
    answer_text: '4'
    why: '`SETUPLEN = 4` instructs bootsect to load exactly 4 sectors of `setup.s`
      (4 * 512 = 2048 bytes) immediately following bootsect.'
  - kind: choose-better
    concept: root-dev-offset
    q: At which byte offset in the bootsector did Linus Torvalds place the root device
      configuration word (`ROOT_DEV = 0x306`)?
    choices:
    - Offset 256 (in the middle of the partition table)
    - Offset 0 (at the very first instruction of the bootloader)
    - Offset 508 (immediately preceding the 2-byte 0xAA55 signature at 510-511)
    answer: 2
    why: 'Option C is correct: In Linux 0.11, byte offset 508 stores `ROOT_DEV` so
      external build scripts can patch the root device without recompiling the assembly.'
  - kind: predict
    concept: system-image-origin
    q: Which component is located at the very beginning of the `system` binary (Sector
      6 of the floppy image)?
    choices:
    - The 32-bit assembly entry point `startup_32` in `boot/head.s`
    - The C `main()` function in `init/main.c`
    - The Minix filesystem root superblock
    answer: 0
    why: 'Option A is correct: When the kernel binary `system` is linked, `head.o`
      is placed first. Its entry label `startup_32` sits at offset 0 of `system`.'
- id: b5
  type: algorithm
  title: 'bootsect.s Handoff: Relocation from 0x7C00 to 0x90000'
  explain_md: "### 1. Frame the Problem\nWhen the BIOS finishes loading Sector 1,\
    \ execution lands at physical address `0x07C00`. \n\nWhy can `bootsect.s` not\
    \ simply stay at `0x07C00` and load the rest of the kernel?\n\nBecause the incoming\
    \ kernel image (`system`) is up to 512KB long! In Linux 0.11, `bootsect` loads\
    \ `system` into memory starting at physical address `0x10000` (64KB). Later, `setup.s`\
    \ moves `system` down to physical address `0x00000`—overwriting memory from `0x00000`\
    \ up to `0x80000`. If `bootsect.s` remained at `0x07C00`, the kernel would literally\
    \ overwrite its own bootloader mid-execution!\n\n### 2. The Notional Machine\n\
    To survive, `bootsect.s` must perform a **self-relocation algorithm**:\n1. Copy\
    \ itself (all 512 bytes / 256 words) from its BIOS load address (`0x07C00`) to\
    \ the top of low RAM (`0x90000`).\n2. Far-jump into the newly relocated copy at\
    \ `0x9000:go`.\n3. Load `setup.s` (4 sectors) from disk directly after itself\
    \ into memory at `0x90200`.\n4. Stream `system` (up to 128KB in 0.11) into memory\
    \ at `0x10000` using BIOS disk interrupt `INT 13h`.\n5. Far-jump into `setup.s`\
    \ at `0x9020:0x0000`.\n\n### 3. Source-Grounded Walkthrough\nLook at lines 47–56\
    \ of `boot/bootsect.s` (Evidence `E-A1-02`):\n```asm\nentry start\nstart:\n  \
    \  mov ax, #BOOTSEG     ! 0x07c0 (Source Segment)\n    mov ds, ax\n    mov ax,\
    \ #INITSEG     ! 0x9000 (Destination Segment)\n    mov es, ax\n    mov cx, #256\
    \         ! 256 words = 512 bytes\n    sub si, si           ! Source index = 0\n\
    \    sub di, di           ! Destination index = 0\n    rep\n    movw         \
    \        ! Repeatedly move 16-bit word from DS:SI to ES:DI\n    jmpi go, INITSEG\
    \     ! Far jump to segment 0x9000, label 'go'\ngo:\n    mov ax, cs\n    mov ds,\
    \ ax\n    mov es, ax\n    mov ss, ax\n    mov sp, #0x400       ! Establish a 1KB\
    \ stack at 0x9000:0x0400\n```\nTrace this step-by-step:\n1. `DS:SI` points to\
    \ `0x07c0:0x0000` (`0x07C00`).\n2. `ES:DI` points to `0x9000:0x0000` (`0x90000`).\n\
    3. `rep movw` executes 256 times, copying 2 bytes per clock iteration.\n4. `jmpi\
    \ go, INITSEG` flushes the CPU prefetch queue and redirects the Instruction Pointer\
    \ (`CS:IP`) to `0x9000:go`.\n5. Once running at `0x90000`, it initializes its\
    \ own stack at `0x9000:0x0400` and issues `int 0x13` to load `setup.s` to `0x90200`.\n\
    \n### 4. The Failure Mode & Boundary\nIf a programmer forgets the far jump `jmpi\
    \ go, INITSEG` after the `rep movw` copy, the CPU continues executing sequential\
    \ instructions at `0x07C00`. The bootloader believes it relocated, but it is still\
    \ running in low memory destined to be overwritten.\n\n### 5. The Compressed Mental\
    \ Axiom\n*Move yourself before you load your successor.*"
  diagram:
    kind: flow
    caption: bootsect.s Self-Relocation and Staging Lifecycle
    nodes:
    - id: bios_load
      label: BIOS loads Sector 1 to 0x7C00
      shape: round
    - id: copy
      label: 'rep movw: 256 words to 0x90000'
      shape: box
    - id: far_jump
      label: jmpi go, 0x9000 (Switch to Relocated Copy)
      shape: box
    - id: load_setup
      label: 'INT 13h: Read setup.s to 0x90200'
      shape: box
    - id: load_sys
      label: 'INT 13h: Stream system to 0x10000'
      shape: box
    - id: jump_setup
      label: jmpi 0, 0x9020 (Hand off to setup.s)
      shape: round
    edges:
    - from: bios_load
      to: copy
      label: CPU at 0x7C00
    - from: copy
      to: far_jump
      label: Copy complete
    - from: far_jump
      to: load_setup
      label: Running at 0x90000
    - from: load_setup
      to: load_sys
      label: Sectors 2-5 loaded
    - from: load_sys
      to: jump_setup
      label: Kernel in RAM
    steps:
    - focus:
      - bios_load
      - copy
      note: 'Step 1: BIOS places bootsect at 0x7C00; rep movw duplicates it at 0x90000'
    - focus:
      - copy
      - far_jump
      note: 'Step 2: Far jump switches CS to 0x9000, abandoning 0x7C00'
    - focus:
      - far_jump
      - load_setup
      - load_sys
      note: 'Step 3: Relocated bootsect streams setup and system using BIOS INT 13h'
  viz:
    kind: ascii-memory
    caption: Memory Relocation State Changes
    steps:
    - '[Before Relocation] DS:SI = 0x07C0:0x0000 (0x07C00) · ES:DI = 0x9000:0x0000
      (0x90000) · CX = 256 words'
    - '[After rep movw] 512 bytes copied to 0x90000 · jmpi go, 0x9000 updates CS to
      0x9000 · SP set to 0x0400'
    - '[After Disk Reads] setup.s loaded at 0x90200 (Sectors 2-5) · system streamed
      to 0x10000 · jmpi 0, 0x9020 executed'
  checks:
  - kind: predict
    concept: relocation-instruction-trace
    q: In `bootsect.s`, what is the register `CX` initialized to immediately before
      the `rep movw` instruction?
    choices:
    - 512 (because each sector contains 512 bytes)
    - 256 (because moving 256 16-bit words copies exactly 512 bytes)
    - 1024 (to clear the remaining buffer cache)
    answer: 1
    why: 'Option B is correct: `movw` transfers words (2 bytes). 256 words * 2 bytes/word
      = 512 bytes (Evidence E-A1-02). Option A traps byte/word confusion (`movb` vs
      `movw`).'
  - kind: why-fails
    concept: why-relocate-bootsect
    q: Why does `bootsect.s` relocate itself to `0x90000` instead of remaining at
      `0x07C00`?
    choices:
    - The 80386 processor can only enter protected mode from addresses above 0x80000
    - The BIOS automatically clears memory at 0x07C00 every 10 milliseconds
    - The kernel image will later be moved down to physical 0x00000, which would overwrite
      0x07C00
    answer: 2
    why: 'Option C is correct: In `setup.s`, the entire kernel image `system` is moved
      down to physical address 0x00000. Because `system` is larger than 32KB, it extends
      well past 0x07C00, destroying an un-relocated bootloader.'
  - kind: fillblank
    concept: bios-disk-interrupt
    q: In `bootsect.s`, reading floppy disk sectors is performed using BIOS software
      interrupt `INT 0x___`.
    answer_text: '13'
    why: BIOS interrupt `INT 13h` is the standard real-mode disk service interface
      used by PC bootloaders to read and write sectors.
  - kind: order
    concept: bootsect-instruction-order
    q: 'Order the assembly sequence executed by `bootsect.s` to relocate itself:'
    answer_order:
    - 0
    - 1
    - 2
    - 3
    why: The sequence must configure segment registers, perform the block move, execute
      the far jump to the destination segment, and finally set up the local stack.
    lines:
    - Set Source DS:SI = 0x07C0:0x0000 and Destination ES:DI = 0x9000:0x0000
    - Execute rep movw with CX=256 to copy 512 bytes
    - Execute jmpi go, 0x9000 to jump to the relocated copy
    - Set stack pointer SP = 0x0400
  - kind: choose-better
    concept: jmpi-vs-jmp
    q: Why must `bootsect.s` use a far jump `jmpi go, INITSEG` rather than a short
      relative jump `jmp go` after copying itself to `0x90000`?
    choices:
    - A relative jump would not change the Code Segment register CS, leaving the CPU
      executing at 0x07C00
    - The short jump opcode is unsupported by 80386 processors
    - Relative jumps cannot cross 16-byte boundaries
    answer: 0
    why: 'Option A is correct: A short `jmp` only updates `IP`, leaving `CS` unchanged
      at `0x07C0`. A far jump (`jmpi offset, segment`) explicitly reloads `CS` with
      `INITSEG` (`0x9000`).'
- id: b6
  type: algorithm
  title: 'setup.s Transition: A20 Gate, GDT/IDT, and Setting CR0.PE'
  explain_md: "### 1. Frame the Problem\n`setup.s` is the gateway between 16-bit Real\
    \ Mode and 32-bit Protected Mode. \n\nAt the start of `setup.s`, the CPU is in\
    \ real mode, interrupts are handled by the 16-bit BIOS, and memory above 1MB is\
    \ inaccessible. By the end of `setup.s`, the BIOS is permanently discarded, the\
    \ processor addresses 4GB of flat memory, and execution branches to 32-bit protected\
    \ mode.\n\nHow does a single assembly file pull off this transformation without\
    \ crashing the machine?\n\n### 2. The Notional Machine\n`setup.s` executes six\
    \ sequential hardware transitions:\n1. **Harvest BIOS Telemetry**:\n   Queries\
    \ BIOS interrupts while they are still available:\n   * `INT 10h, AH=03h`: Cursor\
    \ position -> stored at `0x90000`.\n   * `INT 15h, AH=88h`: Extended memory size\
    \ (RAM above 1MB in KB) -> stored at `0x90002` (`EXT_MEM_K`).\n   * `INT 10h,\
    \ AH=0Fh`: Video display parameters -> stored at `0x90004`–`0x90006`.\n2. **Move\
    \ Kernel to Physical Zero**:\n   Disables CPU interrupts with `cli`. Moves the\
    \ entire `system` kernel from `0x10000` down to `0x00000`.\n3. **Enable the A20\
    \ Gate**:\n   On the original IBM PC AT, address pin 20 was routed through the\
    \ 8042 keyboard controller to emulate 8086 1MB wraparound. `setup.s` sends command\
    \ byte `0xD1` to port `0x64` and data byte `0xDF` to port `0x60`, forcing the\
    \ A20 address line permanently HIGH.\n4. **Reprogram the 8259 Interrupt Controller\
    \ (PIC)**:\n   The IBM PC BIOS mapped hardware IRQs to interrupts `0x08`–`0x0F`—colliding\
    \ with Intel's 386 protected-mode processor exception vectors! `setup.s` reprograms\
    \ the master and slave 8259 PICs, remapping hardware IRQs to `0x20`–`0x2F`.\n\
    5. **Load Temporary GDT and IDT**:\n   Executes `lidt idt_48` (loading a zeroed\
    \ null IDT) and `lgdt gdt_48` (loading a temporary Global Descriptor Table with\
    \ 8-byte descriptors for code and data).\n6. **Flip `CR0.PE` and Far Jump**:\n\
    \   Sets bit 0 (Protection Enable, `PE`) in control register `CR0` using `lmsw\
    \ ax` or `mov cr0, eax`.\n   Immediately executes `jmpi 0, 8` (Far jump to segment\
    \ selector 8, offset 0).\n\n### 3. Source-Grounded Walkthrough\nLook at lines\
    \ 179–193 of `boot/setup.s` (Evidence `E-A1-03`):\n```asm\n    mov ax, #0x0001\
    \    ! protected mode (PE) bit\n    lmsw ax            ! Load Machine Status Word:\
    \ CR0.PE = 1!\n    jmpi 0, 8          ! Jump to offset 0 of segment 8 (CS)\n```\n\
    Notice:\n* `lmsw ax` flips the CPU into 32-bit Protected Mode instantly.\n* What\
    \ is segment `8`? In x86 protected mode, segment registers no longer hold base\
    \ addresses multiplied by 16! They hold **Segment Selectors**:\n  * Bits 3–15:\
    \ Index into the GDT. Index $1 = 1 \\times 8 = 8$.\n  * Bit 2: Table Indicator\
    \ (0 = GDT).\n  * Bits 0–1: Requested Privilege Level (0 = Ring 0 Supervisor).\n\
    * Selector `8` selects the second descriptor in the GDT: the **Kernel Code Segment**\
    \ (`Base = 0x00000000, Limit = 8MB, Executable/Read`).\n* Offset `0` jumps to\
    \ physical address `0x00000`—the exact location where `head.s` was moved!\n\n\
    ### 4. The Failure Mode & Boundary\nIf interrupts are left enabled (`sti`) when\
    \ `CR0.PE` is set without a fully populated 32-bit IDT, the next timer tick (IRQ0)\
    \ triggers an interrupt. The CPU looks for a 32-bit interrupt gate, finds an invalid\
    \ descriptor, raises a General Protection Fault (`#GP`), fails to handle `#GP`,\
    \ and triggers a hardware **Triple Fault**—rebooting the computer instantly.\n\
    \n### 5. The Compressed Mental Axiom\n*Protected mode is not a soft switch; it\
    \ is a hardware latch enabled by CR0.PE and sealed by a far jump.*"
  diagram:
    kind: flow
    caption: setup.s Protected-Mode Transition Pipeline
    nodes:
    - id: telemetry
      label: 1. Save BIOS Telemetry (0x90000)
      shape: box
    - id: move_sys
      label: 2. Move system to 0x00000 (cli)
      shape: box
    - id: a20
      label: 3. Enable A20 Gate (Port 0x64/0x60)
      shape: box
    - id: pic
      label: 4. Reprogram PIC (Remap to 0x20)
      shape: box
    - id: gdt
      label: 5. Load GDT/IDT (lgdt/lidt)
      shape: box
    - id: pe_jump
      label: 6. Set CR0.PE=1 & jmpi 0,8
      shape: round
    edges:
    - from: telemetry
      to: move_sys
      label: Params saved
    - from: move_sys
      to: a20
      label: System at 0x0
    - from: a20
      to: pic
      label: 32-bit bus active
    - from: pic
      to: gdt
      label: IRQs safe
    - from: gdt
      to: pe_jump
      label: Descriptors ready
    steps:
    - focus:
      - telemetry
      - move_sys
      note: 'Step 1: Harvest memory size into 0x90002; relocate system down to 0x00000'
    - focus:
      - a20
      - pic
      - gdt
      note: 'Step 2: Enable A20 address line, remap PIC interrupts, and load GDT'
    - focus:
      - pe_jump
      note: 'Step 3: Set CR0.PE=1 and execute jmpi 0,8 to branch into head.s'
  viz:
    kind: ascii-memory
    caption: CR0 and Segment Register State Progression
    steps:
    - '[Real Mode Setup] CR0 = 0x00000000 · A20: OFF · CS:IP = 0x9020:0x0000 · Interrupts:
      DISABLED (cli)'
    - '[A20 Enabled] Port 0x64/0x60 pulse · Address line 20 active · Memory above
      1MB accessible'
    - '[Protected Mode Active] lmsw ax sets CR0.PE=1 · CR0 = 0x00000001 · jmpi 0,8
      loads CS with selector 0x0008'
    - '[Landing in head.s] CS = 0x0008 (Kernel Code) · EIP = 0x00000000 (startup_32)
      · Mode: 32-bit Flat Protected'
  checks:
  - kind: mcq
    concept: a20-gate-function
    q: Why must `setup.s` enable the motherboard A20 Gate before transitioning to
      32-bit Protected Mode?
    choices:
    - The A20 gate supplies +5V power to the x87 math coprocessor
    - Without A20 enabled, the 21st address wire is grounded, causing all odd megabytes
      (1MB, 3MB, 5MB...) to wrap around to even megabytes
    - The A20 gate is an encryption lock required by proprietary Intel firmware
    answer: 1
    why: 'Option B is correct: The A20 gate physically forces the 21st address line
      to 0 when disabled to emulate 8086 memory wraparound. If left disabled, accessing
      0x100000 accesses 0x000000 instead.'
  - kind: why-fails
    concept: pic-reprogramming-necessity
    q: Why does `setup.s` reprogram the 8259 Programmable Interrupt Controller (PIC)
      to remap hardware IRQs to 0x20–0x2F?
    choices:
    - Protected mode completely disables the interrupt controller hardware
    - The 8259 chips overheat if left at their default interrupt frequencies
    - The default PC BIOS mapped IRQ0-IRQ7 to interrupts 0x08-0x0F, which conflict
      with Intel 386 CPU hardware exception vectors
    answer: 2
    why: 'Option C is correct: In x86 protected mode, Intel reserved vectors 0x00–0x1F
      for CPU exceptions (e.g. 0x08 is Double Fault, 0x0D is General Protection Fault).
      The BIOS placed hardware timer/keyboard IRQs at 0x08–0x0F, creating an ambiguous
      collision that setup.s resolves.'
  - kind: fillblank
    concept: cr0-pe-bit
    q: In the x86 control register CR0, the Protection Enable bit that activates protected
      mode is bit number ___.
    answer_text: '0'
    why: Bit 0 of CR0 is the PE (Protection Enable) flag. Setting it to 1 switches
      the processor execution engine from Real Mode to Protected Mode.
  - kind: choose-better
    concept: cs-selector-value
    q: In the instruction `jmpi 0, 8`, what does the value `8` signify?
    choices:
    - Segment selector 8, which references descriptor index 1 (Kernel Code Segment)
      in the GDT with RPL 0
    - Physical RAM byte address 0x00000008
    - The 8th interrupt vector in the real-mode interrupt table
    answer: 0
    why: 'Option A is correct: In protected mode, segment selectors use bit 3..15
      as the GDT index ($1 \times 8 = 8$), bit 2 = 0 (GDT), and bits 0..1 = 00 (Ring
      0 privilege level).'
  - kind: predict
    concept: cli-precondition
    q: What happens if interrupts are NOT disabled (`cli`) during the `setup.s` memory
      relocation and protected mode transition?
    choices:
    - The BIOS smoothly handles the interrupt in 32-bit mode and returns to setup.s
    - A hardware timer interrupt arrives, the CPU searches for a real-mode handler
      in overwritten memory, and the machine crashes or triple-faults
    - The compiler emits an assembler syntax error on line 112
    answer: 1
    why: 'Option B is correct: Interrupts must be disabled because `setup.s` overwrites
      the real-mode IVT at 0x00000 and destroys BIOS data. Any hardware interrupt
      before 32-bit IDT initialization causes an unrecoverable crash.'
- id: b7
  type: algorithm
  title: head.s Startup, Identity Paging & Jump to main()
  explain_md: "### 1. Frame the Problem\nWhen execution jumps into `head.s` at physical\
    \ address `0x00000`, the CPU is in 32-bit Protected Mode, but it is standing on\
    \ a precarious precipice:\n1. Only the Code Segment (`CS`) has been reloaded;\
    \ data segment registers (`DS`, `ES`, `FS`, `GS`) still hold stale 16-bit real-mode\
    \ values.\n2. There is no stack pointer (`ESP`); pushing anything to memory will\
    \ crash.\n3. The interrupt descriptor table (`IDT`) is empty.\n4. Paging is turned\
    \ off; memory translation is purely linear.\n\nMost critically: how does the kernel\
    \ enable virtual memory paging without crashing on the very next instruction fetch?\n\
    \n### 2. The Notional Machine\nIn the x86 architecture, two-level paging translates\
    \ a 32-bit **Linear Address** to a **Physical Address** through two levels of\
    \ tables:\n1. **Page Directory**: 1 page (4096 bytes) containing 1024 **Page Directory\
    \ Entries (PDEs)**.\n2. **Page Table**: 1 page (4096 bytes) containing 1024 **Page\
    \ Table Entries (PTEs)**.\nEach entry covers 4KB ($2^{12}$) of physical memory.\
    \ A single Page Table of 1024 entries therefore maps:\n$$1024 \\times 4\\text{KB}\
    \ = 4,194,304\\text{ bytes} = 4\\text{MB}$$\n\nIn `boot/head.s`, Linus constructs\
    \ **Identity Paging** for the first 16 megabytes of physical RAM:\n* The Page\
    \ Directory (`_pg_dir`) is placed at absolute address **`0x00000`**.\n* Four Page\
    \ Tables (`pg0`, `pg1`, `pg2`, `pg3`) are placed at **`0x01000`**, **`0x02000`**,\
    \ **`0x03000`**, and **`0x04000`**.\n* Four page tables $\\times$ 4MB/table =\
    \ **16MB** of physical memory mapped $1:1$ (linear address $X$ maps directly to\
    \ physical address $X$).\n* Each entry is marked with attribute bits `0x07` (`Present\
    \ | Read/Write | User`).\n\nWhy Identity Map? Because `head.s` is executing at\
    \ physical address `0x00000`! If linear `0x00000` did not map to physical `0x00000`,\
    \ the instant paging was enabled, the CPU's next instruction fetch would hit unmapped\
    \ space and trigger a page fault before a page fault handler even exists!\n\n\
    ### 3. Source-Grounded Walkthrough\nLook at lines 198–218 of `boot/head.s` (Evidence\
    \ `E-A1-04`):\n```asm\nsetup_paging:\n    movl $1024*5, %ecx          /* 5 pages:\
    \ 1 directory + 4 page tables */\n    xorl %eax, %eax\n    xorl %edi, %edi   \
    \          /* pg_dir is at physical 0x0000 */\n    cld; rep; stosl           \
    \  /* Zero out all 5 pages */\n    \n    movl $pg0+7, _pg_dir        /* Set PDE\
    \ 0 -> pg0 (attributes: 7 = r/w user, present) */\n    movl $pg1+7, _pg_dir+4\
    \      /* Set PDE 1 -> pg1 */\n    movl $pg2+7, _pg_dir+8      /* Set PDE 2 ->\
    \ pg2 */\n    movl $pg3+7, _pg_dir+12     /* Set PDE 3 -> pg3 */\n    \n    movl\
    \ $pg3+4092, %edi        /* Point to last entry of 4th table */\n    movl $0xfff007,\
    \ %eax        /* 16MB - 4096 + 7 */\n    std\n1:  stosl                      \
    \ /* Fill all 4096 PTEs backwards */\n    subl $0x1000, %eax          /* Subtract\
    \ 4KB each page */\n    jge 1b\n    \n    xorl %eax, %eax\n    movl %eax, %cr3\
    \             /* Load Page Directory Base Register (CR3 = 0x0000) */\n    movl\
    \ %cr0, %eax\n    orl $0x80000000, %eax       /* Set bit 31: Paging Enable (PG)\
    \ */\n    movl %eax, %cr0             /* PAGING IS NOW LIVE! */\n    ret     \
    \                    /* Pops $_main into EIP! */\n```\nNotice the elegant transfer:\n\
    Prior to calling `setup_paging`, `head.s` executed:\n```asm\n    pushl $0    \
    \    # Parameters to main\n    pushl $0\n    pushl $0\n    pushl $L6       # Fallback\
    \ return address\n    pushl $_main    # PUSH C ENTRY POINT ONTO STACK!\n    jmp\
    \ setup_paging\n```\nWhen `setup_paging` finishes enabling the PG bit in `CR0`,\
    \ its final instruction is `ret`. The CPU pops the top of the stack—which is `$_main`—directly\
    \ into `EIP`! Control transfers cleanly into `init/main.c`.\n\n### 4. The Failure\
    \ Mode & Boundary\nThe fatal architectural error is failing to identity-map the\
    \ currently executing page. If you map linear `0x0000` to physical `0x50000`,\
    \ the instruction immediately following `movl %eax, %cr0` is fetched from `0x50000`\
    \ instead of the next byte of `head.s`. The CPU fetches garbage machine code and\
    \ halts.\n\n### 5. The Compressed Mental Axiom\n*When paging turns on, you must\
    \ identity-map the ground you stand on.*"
