- id: b5
  type: model
  title: Make Dependency Graphs and Timestamp Comparisons
  explain_md: "### 1. Frame the Problem\nIn the Linux kernel, there are over 70,000\
    \ source files. If recompiling required rebuilding every single file after changing\
    \ one line in a driver, a single build would take three hours. How does the `make`\
    \ build tool determine exactly which files need to be recompiled and which can\
    \ be safely skipped?\n\n### 2. The Notional Machine\nMake models software compilation\
    \ as a Directed Acyclic Graph (DAG) of targets and prerequisites:\n```text\ntarget:\
    \ prerequisites ...\n\trecipe (command executed to build target)\n```\n\nThe decision\
    \ algorithm is governed strictly by filesystem inode modification timestamps (`mtime`):\n\
    1. For every target, Make inspects `mtime(target)` and compares it against `mtime(prerequisite)`.\n\
    2. **If `mtime(target) < mtime(prerequisite)`**: The prerequisite was modified\
    \ *after* the target was built. The target is stale; Make executes the recipe.\n\
    3. **If `mtime(target) >= mtime(prerequisite)`**: The target is newer than all\
    \ prerequisites. The target is up to date; Make skips the recipe!\n\n### 3. Source-Grounded\
    \ Walkthrough\nLook at Evidence `E-T0A-06` and `E-T0A-07`:\nIn `Makefile`:\n```makefile\n\
    app: main.c\n\tgcc -std=c99 -Wall -Wextra -g main.c -o app\n```\nNow observe the\
    \ shell transcript:\n```text\n$ make\ngcc -std=c99 -Wall -Wextra -g main.c -o\
    \ app\n$ make\nmake: 'app' is up to date.\n```\nTrace the logic:\n1. In the first\
    \ run, `app` did not exist. Make executed the recipe.\n2. In the second run, `mtime(app)`\
    \ was newer than `mtime(main.c)`.\n3. Make safely printed `make: 'app' is up to\
    \ date.` and exited in 2 milliseconds without touching the compiler.\n\n### 4.\
    \ The Failure Mode & Boundary\nClock skew on network filesystems (NFS) or virtual\
    \ machine folder shares: if the host clock is ahead of the VM clock, an edited\
    \ file might have a timestamp in the future, causing Make to recompile indefinitely\
    \ or skip modified files.\n\n### 5. The Compressed Mental Axiom\n*Make rebuilds\
    \ when the prerequisite is younger than the target.*"
  diagram:
    kind: flow
    caption: Make Timestamp Comparison and Dependency DAG
    nodes:
    - id: req
      label: 'Prerequisite: main.c (mtime T1)'
      shape: round
    - id: tgt
      label: 'Target: app (mtime T2)'
      shape: box
    - id: cmp
      label: Is T1 > T2? (Prereq newer than target)
      shape: decision
    - id: exec_recipe
      label: 'Execute Recipe: gcc ... -o app'
      shape: box
    - id: skip
      label: 'Skip Recipe: ''app is up to date'''
      shape: box
    edges:
    - from: req
      to: cmp
      label: stat() mtime
    - from: tgt
      to: cmp
      label: stat() mtime
    - from: cmp
      to: exec_recipe
      label: YES (Stale Target)
    - from: cmp
      to: skip
      label: NO (Up to Date)
    steps:
    - focus:
      - req
      - tgt
      - cmp
      note: Make queries filesystem stat() timestamps for target and prerequisites
    - focus:
      - cmp
      - exec_recipe
      note: If prerequisite was modified after target, Make executes compile recipe
    - focus:
      - cmp
      - skip
      note: If target is newer than all prerequisites, compilation is skipped
  viz:
    kind: ascii-memory
    caption: Filesystem Timestamp State Evaluation
    steps:
    - '[Step 1: First Build (app missing)] · Regs: mtime(main.c)=1700000010, mtime(app)=DOES
      NOT EXIST · State: Target state: Missing artifact | Action: Execute gcc recipe
      to build app · (Make runs compiler and creates binary app)'
    - '[Step 2: Second Build (target up to date)] · Regs: mtime(main.c)=1700000010,
      mtime(app)=1700000015 · State: Target state: app is 5 seconds newer than main.c
      | Action: Skip compilation: ''app'' is up to date · (Zero compiler CPU cycles
      consumed)'
  example:
    lang: text
    code: '$ ls -l --time-style=+%s main.c app

      -rw-r--r-- 1 user user   176 1700000010 main.c

      -rwxr-xr-x 1 user user 16128 1700000015 app

      $ make

      make: ''app'' is up to date.'
    explain_md: Because app has a higher mtime timestamp than main.c, Make proves
      the binary is current and skips the recipe.
  checks:
  - id: b5-c1
    kind: predict
    concept: make-up-to-date-behavior
    q: A developer builds `app` with `make`. Both `app` and `main.c` exist on disk.
      Without modifying any files, they immediately run `make` again. What does Make
      do?
    choices:
    - It recompiles main.c from scratch to verify binary integrity.
    - It deletes the existing app binary and prompts the user for confirmation.
    - It reports that app is up to date and executes no compiler recipes.
    - It invokes the clean target automatically before regenerating the binary.
    answer: 2
    why: 'Option C is correct: because mtime(app) >= mtime(main.c), Make recognizes
      that no prerequisites changed and skips execution. Options A, B, and D describe
      behaviors not found in Make''s timestamp algorithm.'
  - id: b5-c2
    kind: why-fails
    concept: makefile-tab-requirement
    q: A developer writes a Makefile rule where the recipe is indented with 4 spaces
      instead of a TAB character. What error does running `make` trigger?
    choices:
    - 'Makefile:4: *** missing separator.  Stop.'
    - 'Makefile:4: *** illegal whitespace.  Stop.'
    - 'Makefile:4: *** unknown directive.  Stop.'
    - 'Makefile:4: *** syntax violation.  Stop.'
    answer: 0
    why: 'Option A is correct: GNU Make requires recipe lines to begin with a TAB
      character (ASCII 9). Indenting with spaces causes the parser to fail with ''***
      missing separator''. Options B, C, and D are fictitious error messages.'
  - id: b5-c3
    kind: mcq
    concept: mtime-dependency-check
    q: What fundamental filesystem check does GNU Make perform to decide whether a
      target must be rebuilt from its prerequisites?
    choices:
    - It compares the total byte count of the target against the prerequisite.
    - It computes and compares SHA-256 cryptographic checksums of all declared files.
    - It compares the filesystem modification timestamps (mtime) of targets and prerequisites.
    - It parses the git commit history to determine which source files changed recently.
    answer: 2
    why: 'Option C is correct: Make compares filesystem mtime timestamps. If any prerequisite
      has a newer mtime than the target, the target is considered stale. Option A
      is false because file sizes are not compared. Option B is how Bazel works, not
      Make. Option D is false because Make operates independently of Git.'
  - id: b5-c4
    kind: order
    concept: make-algorithm-sequence
    q: 'Order the 4 steps that GNU Make follows when evaluating whether to rebuild
      a target:'
    lines:
    - Identify the target rule to build (e.g. 'app') and its declared prerequisites
      (e.g. 'main.c').
    - Query filesystem metadata for the existence and modification timestamp (mtime)
      of each file.
    - 'Evaluate condition: if target is missing or any prerequisite has a newer mtime
      than target.'
    - Execute the rule's recipe commands in a child shell to generate the updated
      target file.
    answer_order:
    - 0
    - 1
    - 2
    - 3
    why: Make first identifies the rule and dependencies, queries filesystem timestamps,
      evaluates whether any dependency is newer than the target, and finally launches
      a subshell to run the recipe if stale.
  - id: b5-c5
    kind: predict
    concept: stale-target-rebuild
    q: 'In a Makefile containing `app: main.c`, the developer edits `main.c` and saves
      it. What happens when they subsequently invoke `make`?'
    choices:
    - Make prints the contents of main.c to standard output without compiling.
    - Make executes the recipe because main.c has a newer modification timestamp than
      app.
    - Make renames main.c to a backup file and halts with an error message.
    - Make executes the clean target twice before attempting to recompile.
    answer: 1
    why: 'Option B is correct: editing main.c updates its filesystem mtime. Because
      mtime(main.c) > mtime(app), Make detects that the prerequisite is newer and
      executes the compilation recipe. Options A, C, and D are false.'
- id: b6
  type: algorithm
  title: Phony Targets and the Clean-Rebuild Lifecycle
  explain_md: "### 1. Frame the Problem\nWhat happens when you run `make clean`, but\
    \ somebody created a file named `clean` in your repository?\nMake looks at the\
    \ filesystem, sees a file named `clean`, checks its dependencies (there are none),\
    \ and decides: `'clean' is up to date!` The cleanup recipe never runs, stale object\
    \ files remain on disk, and you spend days debugging build artifacts from last\
    \ week.\n\n### 2. The Notional Machine\nBy default, Make treats every target name\
    \ as a filename on disk. To fix this, Make provides the special `.PHONY` directive:\n\
    ```makefile\n.PHONY: clean all\n\nclean:\n\trm -f app *.o\n```\n\nWhen a target\
    \ is declared in `.PHONY`:\n1. Make bypasses the filesystem check entirely.\n\
    2. Make never checks whether a file named `clean` exists.\n3. Make executes the\
    \ recipe unconditionally every single time the target is invoked.\n\nThe Clean-Rebuild\
    \ Invariant: Running `make clean && make` guarantees a clean-room compilation,\
    \ eliminating stale object files and verifying that the build graph is self-contained.\n\
    \n### 3. Source-Grounded Walkthrough\nLook at Evidence `E-T0A-06` and `E-T0A-07`:\n\
    In `Makefile`:\n```makefile\n.PHONY: clean\n\nclean:\n\trm -f app\n```\nNow look\
    \ at the execution transcript:\n```text\n$ make clean\nrm -f app\n$ ls -l app\n\
    ls: cannot access 'app': No such file or directory\n$ make\ngcc -std=c99 -Wall\
    \ -Wextra -g main.c -o app\n```\nEven if a file named `clean` is created with\
    \ `touch clean`, `make clean` executes `rm -f app` without hesitation.\n\n###\
    \ 4. The Failure Mode & Boundary\nOmitting `.PHONY`: if an automated script or\
    \ git checkout creates a folder named `test` or a file named `clean`, targets\
    \ named `test:` or `clean:` will permanently stop executing.\n\n### 5. The Compressed\
    \ Mental Axiom\n*.PHONY decouples action recipes from file existence.*"
  diagram:
    kind: flow
    caption: Phony Target Decision Logic vs File Target
    nodes:
    - id: inv
      label: 'Invoked: make clean'
      shape: round
    - id: check_phony
      label: Is 'clean' listed in .PHONY?
      shape: decision
    - id: check_disk
      label: 'Check disk: Does file ''clean'' exist?'
      shape: decision
    - id: run_recipe
      label: 'Execute Recipe: rm -f app'
      shape: box
    - id: skip_recipe
      label: 'Skip: ''clean'' is up to date (BUG)'
      shape: box
    edges:
    - from: inv
      to: check_phony
      label: query target
    - from: check_phony
      to: run_recipe
      label: 'YES: unconditional run'
    - from: check_phony
      to: check_disk
      label: 'NO: check filesystem'
    - from: check_disk
      to: skip_recipe
      label: File exists on disk
    - from: check_disk
      to: run_recipe
      label: File missing on disk
    steps:
    - focus:
      - inv
      - check_phony
      - run_recipe
      note: .PHONY forces recipe to execute unconditionally without checking disk
    - focus:
      - check_phony
      - check_disk
      - skip_recipe
      note: Without .PHONY, an accidental file named 'clean' blocks cleanup
  example:
    lang: text
    code: '$ touch clean

      $ make clean

      rm -f app

      $ ls app

      ls: cannot access ''app'': No such file or directory'
    explain_md: Because clean is declared .PHONY in the Makefile, the cleanup recipe
      executes even though a file named clean exists on disk.
  checks:
  - id: b6-c1
    kind: why-fails
    concept: phony-target-file-collision
    q: "A directory contains a file literally named `clean`. The Makefile has a rule\
      \ `clean:\n\trm -f app` without `.PHONY: clean`. What happens when running `make\
      \ clean`?"
    choices:
    - Make sees that file clean exists with no prerequisites, considers it up to date,
      and does nothing.
    - Make deletes the clean file from the directory and then terminates execution
      with code 0.
    - Make ignores the file named clean and always runs the recipe commands specified
      in the Makefile.
    - Make reports a fatal file collision error and halts without touching any filesystem
      files.
    answer: 0
    why: 'Option A is correct: without .PHONY, Make treats ''clean'' as a file target.
      Since a file named clean exists and has no prerequisites, Make considers it
      up to date and skips the recipe. Options B, C, and D are false.'
  - id: b6-c2
    kind: predict
    concept: phony-override-behavior
    q: 'When `.PHONY: clean` is added to the Makefile, how does `make clean` behave
      when a file named `clean` exists on disk?'
    choices:
    - Make refuses to run the rule until the file named clean is manually deleted.
    - Make ignores the filesystem file and unconditionally executes the rule recipe
      commands.
    - Make renames the file named clean to clean.bak before running the recipe.
    - Make displays a warning message on stderr and skips the deletion recipe.
    answer: 1
    why: 'Option B is correct: .PHONY explicitly instructs Make to bypass filesystem
      existence and timestamp checks, unconditionally executing the recipe. Options
      A, C, and D describe incorrect behavior.'
  - id: b6-c3
    kind: fillblank
    concept: phony-declaration-syntax
    q: 'Fill in the special Make target declaration that designates ''clean'' as a
      symbolic action target rather than a physical file:'
    code: "____: clean\nclean:\n\trm -f app"
    answer_text: .PHONY
    why: The special built-in target '.PHONY:' informs GNU Make that the listed targets
      are actions rather than real files.
  - id: b6-c4
    kind: choose-better
    concept: pristine-rebuild-sequence
    q: Which compound command sequence properly forces a clean rebuild of an application
      by first removing existing build products and then recompiling?
    choices:
    - make && make clean, which compiles the application and then deletes the generated
      binary.
    - touch main.c && make clean, which updates file timestamps before removing generated
      files.
    - make clean; gcc --version, which removes the binary and prints the compiler
      driver release.
    - make clean && make, which removes the binary and then compiles a fresh target
      from source.
    answer: 3
    why: 'Option D is correct: ''make clean && make'' executes the clean target to
      wipe existing outputs, then runs ''make'' to recompile everything from scratch.
      Option A deletes the binary after building. Option B deletes after touching.
      Option C only prints compiler version.'
  - id: b6-c5
    kind: mcq
    concept: default-make-target
    q: 'When a developer runs `make` with no target arguments on a Makefile defining
      `app: main.c` followed by `clean:`, which rule does Make execute?'
    choices:
    - The app rule, because the first non-pattern rule in a Makefile serves as the
      default goal.
    - The clean rule, because Make prioritizes maintenance targets before running
      builds.
    - Both rules in order, executing every recipe defined sequentially in the Makefile.
    - Neither rule, because Make requires an explicit target name on the command line.
    answer: 0
    why: 'Option A is correct: by default, GNU Make selects the first rule encountered
      in the file as the default goal. Options B, C, and D are false.'
- id: b7
  type: syntax
  title: ELF Binary Anatomy and the size Utility
  explain_md: "### 1. Frame the Problem\nAn executable binary on disk is not a flat\
    \ sequence of instructions. When the kernel loads an application, how does it\
    \ know which bytes are read-only machine code, which bytes are writable global\
    \ variables, and how much zeroed RAM to allocate for uninitialized buffers?\n\n\
    If you misplace a large buffer into initialized data, your compiled binary can\
    \ swell from 15 kilobytes to 50 megabytes on your disk!\n\n### 2. The Notional\
    \ Machine\nStandard Executable and Linkable Format (ELF) binaries partition memory\
    \ into distinct segments:\n\n1. **`.text` (Code Segment)**: Contains executable\
    \ machine instructions compiled from C statements. Mapped into memory as **Read-Only\
    \ / Executable (`RX`)**.\n2. **`.data` (Initialized Data Segment)**: Contains\
    \ global and static variables explicitly initialized to non-zero values (e.g.\
    \ `int count = 42;`). Mapped as **Read/Write (`RW`)**. **Occupies bytes on physical\
    \ storage disk!**\n3. **`.bss` (Block Started by Symbol)**: Contains global and\
    \ static variables that are uninitialized or initialized to zero (e.g. `char buffer[1024*1024];`).\
    \ **Occupies almost zero bytes on disk!** The ELF header simply records an IOU\
    \ specifying the size; the kernel allocates zero-filled pages of RAM at load time.\n\
    4. **`dec` / `hex`**: Total virtual memory footprint (`text + data + bss`).\n\n\
    ### 3. Source-Grounded Walkthrough\nLook at Evidence `E-T0A-08`:\n```text\n$ size\
    \ app\n   text\t   data\t    bss\t    dec\t    hex\tfilename\n   1502\t    584\t\
    \      8\t   2094\t    82e\tapp\n```\nPerform the mathematical verification:\n\
    - `text`: 1,502 bytes\n- `data`: 584 bytes\n- `bss`: 8 bytes\n- Sum: `1502 + 584\
    \ + 8 = 2094` decimal (`0x82e` hex).\nNotice how compact `.bss` is: it requires\
    \ zero storage disk payload.\n\n### 4. The Failure Mode & Boundary\nIf a programmer\
    \ writes `int big_buffer[1000000] = {1};`, that array lands in `.data`, causing\
    \ the binary file on disk to inflate by 4 megabytes. If written as `int big_buffer[1000000];`,\
    \ it lands in `.bss`, and the binary file on disk remains 16 kilobytes!\n\n###\
    \ 5. The Compressed Mental Axiom\n*Text holds the code, data pays on disk, and\
    \ bss promises zeroed RAM at runtime.*"
  diagram:
    kind: art
    caption: ELF Binary Disk Format vs Runtime Memory Layout
    art: '+-----------------------------------------------------------------------+

      |                    ELF BINARY LAYOUT ON DISK (file: app)              |

      +-------------------+---------------------------------------------------+

      | Section           | Storage & Memory Permissions                      |

      +-------------------+---------------------------------------------------+

      | .text             | Executable Machine Code (Read-Only, RX)           |

      | .rodata           | String literals and const data (Read-Only, R)     |

      | .data             | Initialized non-zero globals (Read/Write, RW)     |

      | .bss              | Header IOU only: ZERO BYTES ON DISK! (RW in RAM)  |

      | .debug_info       | DWARF Debug symbols (Non-allocatable, strip-able) |

      +-------------------+---------------------------------------------------+'
  example:
    lang: c
    code: "#include <stdio.h>\n\nint initialized_var = 100;     /* Lands in .data\
      \ */\nint uninitialized_arr[1024];    /* Lands in .bss */\n\nint main(void)\n\
      {\n    printf(\"init=%d\\n\", initialized_var);\n    return 0;\n}"
    run_expected: 'init=100

      '
    explain_md: initialized_var occupies 4 bytes in .data; uninitialized_arr occupies
      4096 bytes in .bss without increasing file size on disk.
  checks:
  - id: b7-c1
    kind: predict
    concept: bss-allocation-growth
    q: A C source file adds a large global buffer defined as `static char cache[1048576]
      = {0};`. Which column in the `size` report expands directly as a result?
    choices:
    - The text column, which stores CPU executable instructions in the binary.
    - The bss column, which tracks zero-initialized and uninitialized static storage.
    - The data column, which stores non-zero initialized global variables.
    - The filename column, which records the path to the compiled binary on disk.
    answer: 1
    why: 'Option B is correct: zero-initialized global and static buffers reside in
      .bss. Option A is for code. Option C is for non-zero initialized variables.
      Option D is the file path string.'
  - id: b7-c2
    kind: fillblank
    concept: size-table-column-identification
    q: Examine this `size` utility report for an executable. Which column name designates
      the 8 bytes of zero-initialized static memory?
    code: "$ size app\n   text    data     bss     dec     hex filename\n   1502 \
      \    584       8    2094     82e app"
    answer_text: bss
    why: The 'bss' column reports the byte footprint of uninitialized and zero-initialized
      global/static variables.
  - id: b7-c3
    kind: mcq
    concept: text-segment-definition
    q: In an ELF binary executable, which memory section contains the compiled CPU
      machine instructions that are executed during program runtime?
    choices:
    - The data section, which holds initialized global and static variables.
    - The bss section, which allocates zero-initialized global variable memory.
    - The text section, which contains read-only executable CPU instructions.
    - The dec section, which calculates total decimal memory allocation bytes.
    answer: 2
    why: 'Option C is correct: the .text section stores compiled machine instructions.
      Option A stores initialized variables. Option B stores zero-initialized allocations.
      Option D is a total summary column.'
  - id: b7-c4
    kind: predict
    concept: size-decimal-total-calculation
    q: "Examine this `size` report for `app`:\n```text\n   text    data     bss  \
      \   dec     hex filename\n   1502     584       8    2094     82e app\n```\n\
      How is the value `2094` in the `dec` column calculated?"
    choices:
    - It is the sum of text (1502) and data (584), subtracting the bss (8) segment.
    - It is the size of the ELF binary file on disk as reported by the filesystem.
    - It is the hexadecimal value 82e converted into decimal after doubling text.
    - It is the decimal sum of the text (1502), data (584), and bss (8) sections.
    answer: 3
    why: 'Option D is correct: dec is the decimal sum of the three virtual memory
      segments: 1502 + 584 + 8 = 2094. Options A, B, and C describe false calculations.'
  - id: b7-c5
    kind: why-fails
    concept: bss-zero-disk-footprint
    q: Why does adding a 10 megabyte zero-initialized global array (`int buf[2500000]
      = {0};`) not increase the compiled ELF binary file size on disk by 10 megabytes?
    choices:
    - The compiler optimizes out the buffer completely because its elements are zero.
    - The linker compresses the array data using gzip compression inside the ELF file.
    - The operating system refuses to allocate global arrays larger than one megabyte.
    - The bss section records only the required memory size; zeroed RAM is allocated
      at load time.
    answer: 3
    why: 'Option D is correct: .bss records only the byte size in ELF section headers.
      When loaded into RAM, the kernel allocates zero-filled memory pages. Options
      A, B, and C are false.'
- id: b8
  type: model
  title: 'The Three Trees of Git: Working Tree, Index, and HEAD'
  explain_md: "### 1. Frame the Problem\nWhy does Git require a two-step commit workflow\
    \ (`git add` followed by `git commit`) when older version control systems like\
    \ Subversion only had a single `commit` command? \n\nUnderstanding the staging\
    \ area (the Index) is the foundation of version control in large systems like\
    \ Linux.\n\n### 2. The Notional Machine\nGit tracks files across three distinct\
    \ states (the \"Three Trees\"):\n\n```text\n+---------------------+         +---------------------+\
    \         +---------------------+\n| 1. WORKING TREE     |         | 2. INDEX\
    \ / STAGING  |         | 3. HEAD REPOSITORY  |\n| Physical files on   | git add\
    \ | Snapshot of next    |git commit| Last committed      |\n| disk you edit  \
    \     | ------> | proposed commit     |-------> | permanent snapshot  |\n| (status:\
    \ ??)        |         | (status: A / M)     |         | (status: clean)     |\n\
    +---------------------+         +---------------------+         +---------------------+\n\
    ```\n\n1. **Working Tree**: The concrete files and directories you read and edit\
    \ in your editor. Untracked files appear as `??` in short status.\n2. **Index\
    \ (Staging Area)**: A binary cache (`.git/index`) containing a prepared tree of\
    \ blobs ready to become the next commit. Files staged with `git add` appear as\
    \ `A ` (added) or `M ` (modified) in column 1.\n3. **HEAD**: A symbolic reference\
    \ pointing to the currently checked-out commit object. Once committed, the index\
    \ and HEAD match, and `git status` reports clean.\n\n### 3. Source-Grounded Walkthrough\n\
    Look at Evidence `E-T0A-09`:\n```text\n$ git status --short\n?? hello.c\n$ git\
    \ add hello.c\n$ git status --short\nA  hello.c\n$ git commit -m \"add hello\"\
    \n[master (root-commit) f71d88d] add hello\n$ git status --short\n(empty: clean\
    \ working tree)\n```\nTrace the three transitions:\n1. Initially, `hello.c` was\
    \ untracked in the working tree (`??`).\n2. `git add` copied the file contents\
    \ into Git's object database and registered it in the index (`A `).\n3. `git commit`\
    \ sealed the index into commit `f71d88d`, advancing `HEAD` to match the working\
    \ tree.\n\n### 4. The Failure Mode & Boundary\nModifying a file *after* staging\
    \ it: if you run `git add main.c` and then edit `main.c` in your editor, `git\
    \ status -s` will show `MM main.c`. The first `M` means the index has changes;\
    \ the second `M` means the working tree has unstaged edits! If you type `git commit`,\
    \ only the staged version is committed; your recent edits remain in the working\
    \ tree.\n\n### 5. The Compressed Mental Axiom\n*Working tree is what you touch,\
    \ index is what you stage, HEAD is what you sealed in history.*"
  diagram:
    kind: flow
    caption: Git Three Trees Transition Pipeline
    nodes:
    - id: disk
      label: Working Tree (Files on Disk)
      shape: round
    - id: add
      label: 'git add: Stage into .git/index'
      shape: decision
    - id: index
      label: Index / Staging Area (Proposed Commit)
      shape: box
    - id: commit
      label: 'git commit: Seal Commit Object'
      shape: decision
    - id: head
      label: 'HEAD: Immutable Repository DAG'
      shape: box
    edges:
    - from: disk
      to: add
      label: edit files (?? / M)
    - from: add
      to: index
      label: creates blob (A / M)
    - from: index
      to: commit
      label: user invokes commit
    - from: commit
      to: head
      label: advances HEAD pointer
    steps:
    - focus:
      - disk
      - add
      - index
      note: git add copies file contents into object database and stages into index
    - focus:
      - index
      - commit
      - head
      note: git commit creates a tree and commit object, moving HEAD to the new state
  viz:
    kind: ascii-memory
    caption: The Three Trees State Progression
    steps:
    - '[Step 1: File Created on Disk (Untracked)] · Regs: Working Tree=hello.c exists,
      Index=EMPTY, HEAD=NO COMMITS · State: git status --short: ?? hello.c · (File
      exists on physical disk but Git database has no record)'
    - '[Step 2: File Staged with git add] · Regs: Working Tree=hello.c, Index=blob
      e69de29 (hello.c), HEAD=NO COMMITS · State: git status --short: A  hello.c ·
      (Index holds staged snapshot ready for commit)'
    - '[Step 3: Sealed with git commit] · Regs: Working Tree=hello.c, Index=synced
      with HEAD, HEAD=commit f71d88d · State: git status --short: [Clean: empty output]
      · (All three trees synchronized)'
  example:
    lang: text
    code: '$ git status --short

      ?? hello.c

      $ git add hello.c

      $ git status --short

      A  hello.c

      $ git commit -m "add hello"

      [master f71d88d] add hello

      $ git status --short'
    explain_md: Progressing from untracked (??) to staged in index (A ) and finally
      clean state after commit.
  checks:
  - id: b8-c1
    kind: predict
    concept: git-short-status-am-state
    q: A developer stages a new file with `git add hello.c`, and then modifies `hello.c`
      in their editor without running `git add` again. What does `git status --short`
      display?
    choices:
    - AM hello.c, indicating a staged file with additional unstaged modifications.
    - ?? hello.c, indicating that the file is completely untracked by the repository.
    - ' M hello.c, indicating an unstaged modification with nothing staged in the
      index.'
    - A  hello.c, indicating that all working tree changes are fully staged in the
      index.
    answer: 0
    why: 'Option A is correct: the left column ''A'' denotes the file is added in
      the index; the right column ''M'' denotes unstaged modifications in the working
      tree. Option B is untracked. Option C has nothing staged. Option D has no unstaged
      edits.'
  - id: b8-c2
    kind: why-fails
    concept: commit-requires-staged-index
    q: A developer creates a new file `helper.c` and immediately executes `git commit
      -m "add helper"` without running `git add`. Why does Git commit nothing?
    choices:
    - Git commits can only be created by users with administrative privileges on the
      repository.
    - Git commits capture the contents of the staging index, not unstaged working
      tree files.
    - Git requires a project to have at least three committed files before allowing
      commits.
    - Git automatically deletes untracked files when a commit command is invoked without
      flags.
    answer: 1
    why: 'Option B is correct: ''git commit'' serializes the current tree recorded
      in the staging index into a commit object. Because helper.c was never added
      to the index, the index is clean and nothing is committed. Options A, C, and
      D are false.'
  - id: b8-c3
    kind: mcq
    concept: untracked-status-code
    q: What does the two-character prefix `??` indicate when displayed in `git status
      --short` output?
    choices:
    - The file contains merge conflicts that must be resolved manually.
    - The file has been staged in the index and is ready to be committed.
    - The file exists in the working directory but is untracked by Git.
    - The file was modified in the working tree after being committed.
    answer: 2
    why: 'Option C is correct: ''??'' indicates that the file exists in the working
      tree but is neither tracked in the index nor in HEAD. Option A is UU. Option
      B is A. Option D is M.'
  - id: b8-c4
    kind: order
    concept: git-three-tree-lifecycle
    q: 'Order the 4 stages of tracking a new file through Git''s three-place architecture:'
    lines:
    - Create the file in the Working Tree (e.g. 'hello.c', marked '??').
    - Stage the file into the Index using 'git add hello.c' (marked 'A ').
    - Record the staged snapshot into HEAD using 'git commit -m "add hello"'.
    - Verify that Working Tree, Index, and HEAD are synchronized ('git status -s'
      is empty).
    answer_order:
    - 0
    - 1
    - 2
    - 3
    why: Files originate in the working tree as untracked, transition into the index
      via git add, are recorded into permanent repository history via git commit,
      and achieve synchronized clean status.
  - id: b8-c5
    kind: predict
    concept: clean-repository-status
    q: Immediately after creating a commit from staged changes with no further edits
      made to any files, what does running `git status --short` output?
    choices:
    - Empty output (nothing printed), confirming that the working tree, index, and
      HEAD agree.
    - clean, indicating that no untracked or modified files exist in the current branch.
    - A  hello.c, indicating that the recently committed file is preserved in the
      staging index.
    - ?? hello.c, indicating that committed files must be re-added before editing
      them again.
    answer: 0
    why: 'Option A is correct: when working tree, index, and HEAD all share the exact
      same content, git status --short produces completely empty output. Options B,
      C, and D are false.'
- id: b9
  type: syntax
  title: 'Inspecting Modifications: Short Status and Unified Diffs'
  explain_md: "### 1. Frame the Problem\nReading verbose multi-paragraph status outputs\
    \ slows down terminal navigation. How do you inspect modified, staged, and unstaged\
    \ changes at a glance, and how do you read a unified diff to verify the exact\
    \ bytes modified?\n\n### 2. The Notional Machine\n1. **Short Status Format (`git\
    \ status --short` / `-s`)**:\n   Uses a 2-column matrix:\n   ```text\n   XY PATH\n\
    \   ^|\n   ||-- Column 2: Working tree status relative to index\n   +--- Column\
    \ 1: Index status relative to HEAD\n   ```\n   - ` M main.c`: Unstaged modification\
    \ in working tree.\n   - `M  main.c`: Staged modification in index ready for commit.\n\
    \   - `MM main.c`: Modified, staged, then modified again in working tree!\n  \
    \ - `?? main.c`: Untracked file.\n\n2. **Unified Diff Anatomy (`git diff`)**:\n\
    \   - `git diff`: Shows differences between **Working Tree** and **Index**.\n\
    \   - `git diff --cached`: Shows differences between **Index** and **HEAD**.\n\
    \   - Hunk header: `@@ -old_line,old_count +new_line,new_count @@`.\n   - `-`:\
    \ Line removed.\n   - `+`: Line added.\n\n### 3. Source-Grounded Walkthrough\n\
    Look at Evidence `E-T0A-10`:\n```text\n$ git diff\ndiff --git a/hello.c b/hello.c\n\
    index e69de29..b80de3a 100644\n--- a/hello.c\n+++ b/hello.c\n@@ -1,5 +1,5 @@\n\
    \ int main(void)\n {\n-    return 0;\n+    return 1;\n }\n$ git diff --stat\n\
    \ hello.c | 2 +-\n 1 file changed, 1 insertion(+), 1 deletion(-)\n```\nTrace the\
    \ output:\n- `--- a/hello.c` and `+++ b/hello.c` identify old and new versions.\n\
    - `@@ -1,5 +1,5 @@` indicates hunk begins at line 1 and spans 5 lines.\n- `- \
    \   return 0;` was removed; `+    return 1;` was inserted.\n- `--stat` summarizes\
    \ 1 insertion and 1 deletion.\n\n### 4. The Failure Mode & Boundary\nRunning bare\
    \ `git diff` after typing `git add`: the terminal outputs nothing! Because `git\
    \ diff` compares the working tree to the index, once changes are staged, the working\
    \ tree and index are identical. You must run `git diff --cached` (or `--staged`)\
    \ to view staged changes.\n\n### 5. The Compressed Mental Axiom\n*Short status\
    \ shows the columns of truth; diff reveals the exact line mutations.*"
  diagram:
    kind: flow
    caption: Diff Inspection Routing Matrix
    nodes:
    - id: query
      label: What do you want to inspect?
      shape: round
    - id: work
      label: Working Tree vs Index (Unstaged edits)
      shape: decision
    - id: staged
      label: Index vs HEAD (Staged changes)
      shape: decision
    - id: diff_cmd
      label: git diff
      shape: box
    - id: cached_cmd
      label: git diff --cached
      shape: box
    edges:
    - from: query
      to: work
      label: unstaged
    - from: query
      to: staged
      label: staged
    - from: work
      to: diff_cmd
      label: inspect lines
    - from: staged
      to: cached_cmd
      label: inspect lines
    steps:
    - focus:
      - query
      - work
      - diff_cmd
      note: Use git diff to see unstaged working tree edits
    - focus:
      - query
      - staged
      - cached_cmd
      note: Use git diff --cached to see what will go into the next commit
  example:
    lang: text
    code: "$ git diff\n--- a/main.c\n+++ b/main.c\n@@ -3,1 +3,1 @@\n-    return 0;\n\
      +    return 1;\n$ git diff --stat\n main.c | 2 +-\n 1 file changed, 1 insertion(+),\
      \ 1 deletion(-)"
    explain_md: Unified diff showing exact single line mutation with hunk header and
      stat summary.
  checks:
  - id: b9-c1
    kind: predict
    concept: hunk-header-interpretation
    q: In a unified diff generated by `git diff`, a hunk header reads `@@ -10,6 +10,7
      @@`. What does this coordinate header report?
    choices:
    - A 6-line segment starting at line 10 in the original became a 7-line segment
      at line 10 in the new version.
    - Line number 10 was deleted and replaced by line 6 in the old file and line 7
      in the modified file.
    - The patch contains 10 deletions, 6 insertions, and modifies 7 files across the
      entire repository.
    - The diff utility encountered a syntax error at line 10 and skipped checking
      lines 6 and 7.
    answer: 0
    why: 'Option A is correct: ''-10,6'' indicates starting at line 10 spanning 6
      lines in the original; ''+10,7'' indicates starting at line 10 spanning 7 lines
      in the modified file. Options B, C, and D are false.'
  - id: b9-c2
    kind: predict
    from_chapter: T0A
    from_block: b8
    concept: inspect-unstaged-changes
    q: In `git status --short`, a file is listed with ` M hello.c` (space in left
      column, M in right column). Which command inspects these unstaged working tree
      changes?
    choices:
    - git show --staged hello.c, to display staged commits.
    - git status --verbose hello.c, to inspect file hashes.
    - git diff --cached hello.c, to inspect the index state.
    - git diff hello.c, to compare working tree with index.
    answer: 3
    why: 'Option D is correct: plain ''git diff'' compares the working tree against
      the index. Option C (--cached / --staged) compares index against HEAD. Option
      A and B are wrong syntax.'
  - id: b9-c3
    kind: fillblank
    concept: diff-staged-flag
    q: 'Fill in the flag used with `git diff` to compare the staged index against
      the last commit (HEAD):'
    code: '$ git add hello.c

      $ git diff --____'
    answer_text: staged
    why: The '--staged' (or synonym '--cached') flag directs git diff to compare the
      staging index against HEAD.
  - id: b9-c4
    kind: mcq
    concept: diff-minus-line-meaning
    q: In a unified diff hunk, what does a line prefixed with a leading minus sign
      (`-`) signify?
    choices:
    - A line of code that sets a variable to a negative arithmetic value.
    - A line that was present in the original version and removed in the new version.
    - A line that was newly inserted into the modified version of the source file.
    - A comment line that has been marked as deprecated by the revision control system.
    answer: 1
    why: 'Option B is correct: ''-'' prefixes lines removed from the original file.
      Option A is literal minus arithmetic. Option C is ''+''. Option D is fictitious.'
  - id: b9-c5
    kind: mcq
    concept: diff-stat-interpretation
    q: What does the summary line `1 file changed, 1 insertion(+), 1 deletion(-)`
      in `git diff --stat` tell the developer?
    choices:
    - The file currently contains only one line of code in the working tree.
    - The commit hash was incremented by one insertion and one deletion operation.
    - One line was modified, recorded as one deleted old line and one added new line.
    - Git deleted the existing file and generated a new file with the same name.
    answer: 2
    why: 'Option C is correct: Git models modifications as deletions followed by insertions.
      A single modified line is summarized as 1 deletion and 1 insertion. Options
      A, B, and D are false.'
- id: b10
  type: design
  title: 'Failure Triage: Mapping Lifecycle Symptoms to Diagnostic Tools'
  explain_md: '### 1. Frame the Problem

    In complex systems programming, diagnosing a broken build by random guessing or
    blind tool invocation wastes immense time. When a failure occurs, how do you instantly
    identify which toolchain stage failed and reach for the exact tool that solves
    it?


    ### 2. The Notional Machine

    The Systems Triage Matrix:


    ```text

    +-------------------------------------------------------------------------------------------------+

    |                                 SYSTEMS DIAGNOSTIC MATRIX                                       |

    +-------------------+-----------------------------+-----------------------+-----------------------+

    | Lifecycle Stage   | Observable Failure Symptom  | Root Cause Boundary   | Primary
    Diagnostic    |

    +-------------------+-----------------------------+-----------------------+-----------------------+

    | Compilation (cc1) | error: expected '';'' ...     | C99 syntax error or   |
    GCC first diagnostic  |

    |                   | undefined type struct ...   | missing header contract| line
    (bad.c:line:col) |

    +-------------------+-----------------------------+-----------------------+-----------------------+

    | Linkage (ld)      | undefined reference to ''foo''| Missing object file or|
    Check Makefile recipe |

    |                   | multiple definition of ''bar''| duplicate global sym  |
    and library -l flags  |

    +-------------------+-----------------------------+-----------------------+-----------------------+

    | Build Automation  | make: ''app'' is up to date   | Timestamp skew or     |
    make clean && make,   |

    | (make)            | (when edits exist)          | missing .PHONY target | inspect
    mtime with ls |

    +-------------------+-----------------------------+-----------------------+-----------------------+

    | Memory & Layout   | Binary size ballooned or    | Buffer placed in      | size
    <binary>,        |

    | (ELF)             | segment memory overflow     | .data instead of .bss | readelf
    -S, objdump   |

    +-------------------+-----------------------------+-----------------------+-----------------------+

    | Version Control   | Accidental mutation or      | Uncommitted working   | git
    status --short,   |

    | (git)             | conflicting local edits     | tree changes          | git
    diff, git checkout|

    +-------------------+-----------------------------+-----------------------+-----------------------+

    ```


    ### 3. Source-Grounded Walkthrough

    Reconcile Evidence `E-T0A-03` through `E-T0A-10`:

    - When `bad.c` failed to compile (`E-T0A-05`), inspecting the first line of GCC
    stderr diagnosed the missing semicolon immediately.

    - When cleaning build state (`E-T0A-06`), `make clean` removed `app` via `.PHONY`.

    - When verifying binary footprint (`E-T0A-08`), `size` broke down `.text`, `.data`,
    and `.bss`.

    - When inspecting working tree edits (`E-T0A-10`), `git diff` proved line 3 was
    modified from `return 0;` to `return 1;`.


    ### 4. The Failure Mode & Boundary

    Using a high-level tool to fix a low-level error (e.g. running `git bisect` or
    modifying Makefile flags when the compiler is complaining about a missing semicolon).


    ### 5. The Compressed Mental Axiom

    *Diagnose at the boundary where the invariant broke: grammar at the compiler,
    dependencies at Make, state at Git.*'
  diagram:
    kind: flow
    caption: Systems Diagnostic Triage Decision Tree
    nodes:
    - id: sym
      label: Observed Build or Runtime Failure
      shape: round
    - id: stage
      label: What stage produced the error?
      shape: decision
    - id: cc_tool
      label: Compiler Diagnostic (gcc first line)
      shape: box
    - id: ld_tool
      label: Linker Resolution (check -l flags / .o)
      shape: box
    - id: make_tool
      label: Build System (make clean && make)
      shape: box
    - id: git_tool
      label: Version Control (git status -s / git diff)
      shape: box
    edges:
    - from: sym
      to: stage
      label: triage
    - from: stage
      to: cc_tool
      label: syntax / missing type
    - from: stage
      to: ld_tool
      label: undefined reference
    - from: stage
      to: make_tool
      label: stale build artifact
    - from: stage
      to: git_tool
      label: source drift / conflict
    steps:
    - focus:
      - sym
      - stage
      - cc_tool
      note: 'Syntax errors: triage first diagnostic line from GCC'
    - focus:
      - stage
      - ld_tool
      note: 'Symbol errors: verify linker library flags and object targets'
    - focus:
      - stage
      - make_tool
      - git_tool
      note: 'Artifact and drift errors: clean build and inspect diffs'
  example:
    lang: text
    code: '# Diagnostic summary matching failure to tool

      1. Syntax error:       gcc first diagnostic line

      2. Undefined symbol:   linker ld flags and object list

      3. Stale binary:       make clean && make

      4. Memory footprint:   size <binary>

      5. Working tree drift: git status -s && git diff'
    explain_md: Mapping failure symptoms directly to the responsible toolchain component.
  checks:
  - id: b10-c1
    kind: choose-better
    concept: filesystem-symptom-triage
    q: 'When running `make`, the compiler terminates with `fatal error: main.c: No
      such file or directory`. What is the most effective first diagnostic step?'
    choices:
    - Check current working directory (`pwd`) and verify whether main.c exists in
      that directory.
    - Add `-Wall -Wextra` warning flags to the Makefile recipe and compile the application
      again.
    - Run `git diff` on other files in the directory to check if source files were
      modified.
    - Run the `size` utility on the project directory to check for binary allocation
      errors.
    answer: 0
    why: 'Option A is correct: ''No such file or directory'' is a filesystem error.
      The first step is verifying the working directory and ensuring the input file
      is present. Options B, C, and D target wrong lifecycle stages.'
  - id: b10-c2
    kind: eipe
    from_chapter: T0A
    from_block: b4
    concept: first-diagnostic-primacy
    q: Why should a developer always resolve the first reported compiler diagnostic
      before attempting to fix subsequent error messages?
    choices:
    - The compiler driver stops scanning source code immediately after encountering
      any syntax error.
    - Compilers list syntax errors in reverse alphabetical order rather than chronological
      source order.
    - Fixing subsequent errors automatically triggers a rebuild that overwrites previous
      source modifications.
    - The first error marks where parsing broke; subsequent diagnostics are often
      cascading false alarms.
    answer: 3
    why: 'Option D is correct: compilers process tokens sequentially; the first error
      pinpoints where parser grammar rules first failed. Downstream diagnostics are
      frequently phantom artifacts caused by de-synchronized parser state. Options
      A, B, and C are false.'
  - id: b10-c3
    kind: why-fails
    concept: make-timestamp-staleness
    q: A developer runs `make` on a cleanly compiled project without modifying any
      files. Why does Make report `'app' is up to date` and run no compiler recipes?
    choices:
    - The GNU Make utility deletes compiled executables after running a successful
      verification pass.
    - The target file exists and its modification timestamp is newer than all declared
      prerequisites.
    - The GCC compiler driver was removed from the system path after the initial build
      completed.
    - The clean target was executed automatically by the operating system kernel in
      the background.
    answer: 1
    why: 'Option B is correct: Make checks mtime timestamps. Because app is newer
      than main.c, no compilation is required. Options A, C, and D are false.'
  - id: b10-c4
    kind: predict
    concept: git-untracked-diagnosis
    q: A developer clones a repository, creates a new file `test.c`, and runs `git
      status --short`, observing `?? test.c`. What does Git lack for this file?
    choices:
    - A compiler recipe in the Makefile instructing Git how to build the executable.
    - An executable permission bit on the filesystem allowing Git to read file contents.
    - A record in the staging index or commit history associating the file with the
      repository.
    - A binary size report confirming that the file contains valid non-zero data.
    answer: 2
    why: 'Option C is correct: ''??'' indicates that the file exists in the working
      directory but has no record in the index or commit tree. Options A, B, and D
      are irrelevant to Git tracking.'
  - id: b10-c5
    kind: choose-better
    concept: bss-vs-file-footprint
    q: A developer declares a global buffer `static int data[1000000];`. The `size`
      report shows ~4MB in `.bss`, but `ls -l` shows the binary file is only 16KB.
      Why?
    choices:
    - The filesystem automatically compresses large binary files when writing them
      to the disk.
    - The bss section stores runtime memory allocation size rather than physical zero
      bytes on disk.
    - The compiler driver omitted the buffer because it was not referenced in the
      main function.
    - The operating system kernel allocates disk space for global buffers only after
      program execution.
    answer: 1
    why: 'Option B is correct: .bss records only the required memory size in the ELF
      headers. When loaded into RAM, the kernel allocates zeroed virtual memory pages.
      Options A, C, and D are false.'
