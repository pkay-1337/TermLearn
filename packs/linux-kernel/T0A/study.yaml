    - Line 1, because the stdio.h header must be enclosed in quotes rather than angle
      brackets.
    - Line 3, because the main function signature must declare argc and argv parameters.
    - Line 6, because the printf function call must specify an explicit format string
      variable.
    - Line 5, because the variable declaration lacks a terminating semicolon before
      line 6 starts.
    answer: 3
    why: 'Option D is correct: line 5 ends with ''int x = 1'' without a semicolon.
      The C parser only detects the syntax violation when it encounters ''printf''
      on line 6, column 5. Line 1 is standard C. Line 3 is valid C99. Line 6 is valid
      syntax.'
  - id: b4-c2
    kind: predict
