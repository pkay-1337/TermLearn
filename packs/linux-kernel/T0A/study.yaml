blocks:
- id: b1
  type: model
  title: Command Execution, Working Directory, and Exit Status
  explain_md: "### 1. Frame the Problem\nWhen you type `./app` in the shell and hit\
    \ enter, what actually happens? Many developers assume the terminal directly executes\
    \ the binary and that printed output indicates success. This misconception causes\
    \ severe automation bugs. In systems programming, you must understand how the\
    \ operating system executes programs, resolves paths, and reports status.\n\n\
    ### 2. The Notional Machine\nEvery Unix process executes within an isolated operating\
    \ system context managed by the kernel:\n\n1. **Current Working Directory (CWD)**:\
    \ The base filesystem path used by the kernel to resolve relative paths.\n2. **Execution\
    \ Path Resolution**:\n   - Commands prefixed with `./` or `/` tell the shell to\
    \ execute a specific file at that filesystem path.\n   - Bare commands (like `gcc`\
    \ or `make`) tell the shell to search through the colon-separated directory list\
    \ in the `$PATH` environment variable.\n3. **Process Creation (`fork` + `execve`)**:\
    \ The shell duplicates itself with `fork()`, and the child replaces its address\
    \ space with the executable binary via `execve()`.\n4. **Exit Status (`$?`)**:\
    \ An 8-bit unsigned integer (0–255) returned by `main()` or `exit()`. By universal\
    \ Unix convention, **zero strictly indicates success**; non-zero values signal\
    \ specific error conditions. The shell harvests this byte via `waitpid()` and\
    \ stores it in `$?`.\n\n### 3. Source-Grounded Walkthrough\nLook at Evidence `E-T0A-03`\
    \ and `E-T0A-04`:\n```text\n$ pwd\n/home/user/workload\n$ gcc -std=c99 -Wall -Wextra\
    \ -g main.c -o app\n$ echo $?\n0\n$ ./app\n5\n$ echo $?\n0\n```\nNotice the separation:\n\
    1. `pwd` verified the process working directory.\n2. `gcc` compiled `main.c` into\
    \ `app` silently, emitting zero stdout text and returning exit status `0`.\n3.\
    \ `./app` executed from the local directory, wrote string `5\\n` to file descriptor\
    \ 1 (stdout), and exited with code `0`.\n\n### 4. The Failure Mode & Boundary\n\
    The most common beginner failure is omitting the `./` prefix when running a local\
    \ binary:\n```text\n$ app\nbash: app: command not found\n```\nBecause the current\
    \ working directory is intentionally not in `$PATH` for security reasons, the\
    \ shell searches `/usr/bin` and fails. Furthermore, confusing printed text (`5`)\
    \ with the exit code (`0`) breaks shell automation scripts that rely on `if ./app;\
    \ then ...`.\n\n### 5. The Compressed Mental Axiom\n*Printed text is application\
    \ payload; exit status is the kernel's verdict byte in $?.*"
  diagram:
    kind: flow
    caption: Shell Command Execution and Telemetry Lifecycle
    nodes:
    - id: input
      label: 'Prompt: ./app'
      shape: round
    - id: parse
      label: 'Path Resolution (Leading ./) '
      shape: decision
    - id: fork
      label: Kernel fork() + execve()
      shape: box
    - id: run
      label: Child Process Executes (PID 4120)
      shape: box
    - id: stdout
      label: Write '5\n' to stdout (FD 1)
      shape: io
    - id: exit
      label: main() returns 0 (Exit Status)
      shape: box
    - id: reap
      label: Shell waitpid() -> $? = 0
      shape: decision
    edges:
    - from: input
      to: parse
      label: parses command
    - from: parse
      to: fork
      label: resolves path
    - from: fork
      to: run
      label: creates child
    - from: run
      to: stdout
      label: emits payload
    - from: run
      to: exit
      label: terminates
    - from: exit
      to: reap
      label: kernel status
    steps:
    - focus:
      - input
      - parse
      - fork
      note: Shell parses ./app and forks child process via execve
    - focus:
      - fork
      - run
      - stdout
      note: Child runs in isolated memory map and writes '5' to stdout
    - focus:
      - run
      - exit
      - reap
      note: Process terminates; kernel delivers exit code 0 to shell $?
  viz:
    kind: ascii-memory
    caption: Process Context and Telemetry Harvesting
    steps:
    - '[Step 1: Child Process Spawned via execve] · Regs: CWD=/home/user/workload,
      PID=4120 · State: File Descriptor 1: Connected to Terminal stdout | Exit Code
      Slot: UNSET (Process Active) · (Process executes within private address space)'
    - '[Step 2: Process Termination and waitpid Harvest] · Regs: $?=0, Terminated
      PID=4120 · State: Terminal stdout: Received ''5\n'' | Kernel waitpid(): Harvested
      exit status byte 0 · (Payload is printed; exit status 0 captured into shell
      variable $?)'
  example:
    lang: text
    code: '$ pwd

      /home/user/workload

      $ gcc -std=c99 -Wall -Wextra -g main.c -o app

      $ echo $?

      0

      $ ./app

      5

      $ echo $?

      0'
    run_expected: '5

      '
    explain_md: The compiler builds app and exits 0 silently. The binary ./app executes
      from CWD, emits 5 on stdout, and yields exit code 0.
  checks:
  - id: b1-c1
    kind: predict
    concept: process-observation-boundary
    q: A terminal session shows `$ pwd` returning `/home/user`, followed by `$ ./app`
      printing `5` and terminating with exit code 0. Which conclusion is strictly
      supported by this observation?
    choices:
    - The application source code computed 2 + 3 inside main and printed the result.
    - The shell resolved the binary location by scanning directories in the PATH list.
    - The binary ran from /home/user, emitted 5 on stdout, and returned exit status
      0.
    - The printed value 5 guaranteed that the process exit status was set to zero.
    answer: 2
    why: Option C is correct because the transcript proves the working directory,
      the emitted stream data, and the kernel exit code. Option A is an unverified
      assumption about internal source logic. Option B is false because leading './'
      bypasses PATH search. Option D is false because stdout text and exit codes are
      separate.
  - id: b1-c2
    kind: why-fails
    concept: working-directory-resolution
    q: A developer runs `cd /tmp/project && gcc -std=c99 main.c -o app` in a directory
      containing only `helper.c`. Why does compilation fail?
    choices:
    - The compiler cannot find the named input file in the working directory.
    - The GCC compiler requires all source files to use absolute file paths.
    - The -std=c99 dialect switch forbids compiling single-file applications.
    - The shell refuses to launch executables outside of standard system paths.
    answer: 0
    why: 'Option A is correct: relative filenames are resolved against the current
      working directory, so missing main.c triggers a fatal open() error. Option B
      is false because relative paths are standard. Option C is false because -std=c99
      has no file-count restriction. Option D is false because GCC is found in PATH.'
  - id: b1-c3
    kind: predict
    concept: exit-status-inspection
    q: After running `gcc -std=c99 -Wall -Wextra -g main.c -o app` on valid C code,
      the command produces no terminal output. What will running `echo $?` immediately
      display?
    choices:
    - 1, indicating that no output text was written to standard output.
    - app, showing the name of the newly generated binary executable file.
    - main.c, echoing the input translation unit that compiled successfully.
    - 0, confirming the compiler process completed without fatal errors.
    answer: 3
    why: 'Option D is correct: Unix processes return exit status 0 upon successful
      completion, which $? captures. Option A is false because quiet compiles are
      successful. Options B and C confuse exit status with command arguments.'
  - id: b1-c4
    kind: fillblank
    concept: shell-status-variable
    q: 'Fill in the shell special parameter that expands to the exit status of the
      most recently executed foreground pipeline:'
    code: '$ gcc -std=c99 main.c -o app

      $ echo ____

      0'
    answer_text: $?
    why: In Bourne-compatible shells, '$?' holds the numeric exit code of the last
      completed foreground command. Using other variables like '$!' yields background
      process PIDs, while '$$' yields the shell's own PID.
  - id: b1-c5
    kind: choose-better
    concept: telemetry-channel-design
    q: Why do build automation scripts branch on the numeric exit status `$?` rather
      than parsing stdout for success messages?
    choices:
    - Parsing stdout is slower because stdout is buffered by the C library.
    - The exit code is an unambiguous numeric contract unaffected by output text.
    - The shell cannot redirect stdout when running inside an automated script.
    - Standard output text is automatically discarded whenever a program exits.
    answer: 1
    why: 'Option B is correct: exit codes provide a fixed 0 vs non-zero binary machine
      contract that does not break when human-readable prose changes or languages
      are localized. Option A is secondary. Option C is false because stdout can always
      be redirected. Option D is false because stdout persists in pipes or files.'
- id: b2
  type: model
  title: Standard Streams (stdout, stderr) and Exit Status Separation
  explain_md: "### 1. Frame the Problem\nWhy does every Unix operating system provide\
    \ two independent output channels—stdout and stderr—when both print to the exact\
    \ same terminal window by default? If an automated script pipes output to a file\
    \ or processing tool, how do you prevent error messages from contaminating clean\
    \ data pipelines?\n\n### 2. The Notional Machine\nWhen the kernel spawns a process,\
    \ it opens three standard file descriptors:\n\n```text\n+-------------------------------------------------------------------------+\n\
    | PROCESS FILE DESCRIPTOR TABLE (task_struct->files)                      |\n\
    |                                                                         |\n\
    |  [0] stdin  (Read-Only):  Standard input (keyboard / pipe)              |\n\
    |  [1] stdout (Write-Only): Standard output payload (block-buffered)      |\n\
    |  [2] stderr (Write-Only): Diagnostics & errors (UNBUFFERED by default!) |\n\
    +-------------------------------------------------------------------------+\n\
    ```\n\nCrucial architectural differences:\n1. **Buffering Semantics**: `stdout`\
    \ is typically block-buffered when redirected to files or pipes to maximize throughput.\
    \ `stderr` is **unbuffered**, ensuring diagnostic messages appear immediately\
    \ even if the program crashes a microsecond later.\n2. **Redirection Operators**:\n\
    \   - `command > out.txt`: Redirects file descriptor 1 (stdout) only.\n   - `command\
    \ 2> err.txt`: Redirects file descriptor 2 (stderr) only.\n   - `command &> all.txt`\
    \ (or `> out.txt 2>&1`): Combines both streams.\n3. **Exit Status Independence**:\
    \ A program can print error text to stderr yet exit with `0`, or print nothing\
    \ and exit with `1`. Streams and exit codes are completely independent channels.\n\
    \n### 3. Source-Grounded Walkthrough\nLook at Evidence `E-T0A-05`:\n```text\n\
    $ gcc -std=c99 -Wall -Wextra -g bad.c -o bad\nbad.c: In function 'main':\nbad.c:6:5:\
    \ error: expected ';' before 'return'\n$ echo $?\n1\n```\nNotice what happened:\n\
    1. GCC detected a syntax error and wrote diagnostic lines to **stderr (descriptor\
    \ 2)**.\n2. Descriptor 1 (stdout) received zero bytes.\n3. GCC terminated by returning\
    \ exit code **`1`** to signal compilation failure.\n\n### 4. The Failure Mode\
    \ & Boundary\nIf you run `./app > output.log` and the application fails, your\
    \ terminal screen will still show the error text! Why? Because only descriptor\
    \ 1 was redirected to `output.log`; descriptor 2 remained attached to the terminal.\
    \ Discarding error output with `2> /dev/null` hides failures and blinds diagnostic\
    \ scripts.\n\n### 5. The Compressed Mental Axiom\n*Stdout carries your data, stderr\
    \ sounds the alarm, and $? delivers the verdict.*"
  diagram:
    kind: flow
    caption: Standard Stream Routing and Redirection Architecture
    nodes:
    - id: proc
      label: Running Process (app)
      shape: box
    - id: fd1
      label: 'FD 1: stdout (Data)'
      shape: io
    - id: fd2
      label: 'FD 2: stderr (Diagnostics)'
      shape: io
    - id: red1
      label: '> data.txt (Block Buffered)'
      shape: box
    - id: red2
      label: 2> errors.log (Unbuffered)
      shape: box
    - id: status
      label: Kernel Exit Status ($?)
      shape: decision
    edges:
    - from: proc
      to: fd1
      label: printf()
    - from: proc
      to: fd2
      label: fprintf(stderr)
    - from: fd1
      to: red1
      label: '> redirection'
    - from: fd2
      to: red2
      label: 2> redirection
    - from: proc
      to: status
      label: exit(code)
    steps:
    - focus:
      - proc
      - fd1
      - red1
      note: Standard data output flows through FD 1 into data.txt
    - focus:
      - proc
      - fd2
      - red2
      note: Error alerts flow unbuffered through FD 2 into errors.log
    - focus:
      - proc
      - status
      note: Exit code is harvested independently of stream channels
  viz:
    kind: ascii-memory
    caption: Process File Descriptor Table Layout
    steps:
    - '[Step 1: Normal Standard Stream Attachment] · Regs: FD 0=/dev/pts/1 (stdin),
      FD 1=/dev/pts/1 (stdout), FD 2=/dev/pts/1 (stderr) · State: stdout buffer: Active
      block buffer | stderr buffer: Unbuffered (flushed immediately) · (Both streams
      render to terminal screen by default)'
    - '[Step 2: Stream Redirection (app > out.txt 2> err.txt)] · Regs: FD 0=/dev/pts/1,
      FD 1=inode 84210 (out.txt), FD 2=inode 84211 (err.txt) · State: out.txt: Receives
      data payload | err.txt: Receives diagnostic errors · (Kernel file table decouples
      data from error logging)'
  example:
    lang: c
    code: "#include <stdio.h>\n\nint main(void)\n{\n    fprintf(stdout, \"normal data\
      \ payload\\n\");\n    fprintf(stderr, \"diagnostic alert message\\n\");\n  \
      \  return 0;\n}"
    run_expected: 'normal data payload

      diagnostic alert message

      '
    explain_md: Writing to stdout and stderr simultaneously. Running with > out.txt
      routes normal payload to out.txt while alert message remains on terminal.
  checks:
  - id: b2-c1
    kind: predict
    concept: compiler-failure-exit-code
    q: A compilation command `gcc -std=c99 bad.c -o bad` encounters syntax errors
      and terminates with exit code 1. What value does the shell variable `$?` contain
      immediately following execution?
    choices:
    - 1, the non-zero integer returned by the compiler to signal compilation failure.
    - 0, because the GCC executable started up and executed its initialization steps.
    - The line and column coordinates of the first syntax error reported on stderr.
    - The total count of diagnostic warning messages emitted during the failed build.
    answer: 0
    why: 'Option A is correct: GCC exits with code 1 when syntax errors prevent compilation.
      Option B is false because exit code reflects process outcome, not startup. Options
      C and D confuse numeric exit status codes with stderr diagnostic text.'
  - id: b2-c2
    kind: why-fails
    concept: stream-redirection-separation
    q: A developer executes `gcc bad.c -o bad > build.log`, but compiler error messages
      still appear directly on the terminal screen. What explains this behavior?
    choices:
    - The compiler driver directs diagnostic messages back into the source file.
    - The -o option forces all compiler diagnostic output to bypass redirection.
    - The > operator redirects stdout (fd 1), while compiler errors go to stderr (fd
      2).
    - Compiler error messages are automatically duplicated to both stdout and stderr.
    answer: 2
    why: 'Option C is correct: bare ''>'' redirects only file descriptor 1 (stdout).
      GCC writes diagnostics to file descriptor 2 (stderr), which remains connected
      to the terminal. Options A, B, and D describe fictitious compiler and shell
      behaviors.'
  - id: b2-c3
    kind: trace
    from_chapter: T0A
    from_block: b1
    concept: stream-telemetry-routing
    q: Trace how the shell routes streams and exit telemetry for this command pipeline.
      Which row represents the channel inspected by `$?`?
    trace:
      headers:
      - Channel
      - File Descriptor
      - Observed Value
      - Role
      rows:
      - - exit status
        - N/A
        - '1'
        - Process termination status code
      - - stdout
        - '1'
        - <empty>
        - Normal program data stream
      - - stderr
        - '2'
        - 'error: expected '';'''
        - Compiler diagnostic output
    target:
      row: 0
      col: 0
    choices:
    - The exit status row, which records the kernel process termination code.
    - The stdout row, which captures standard stream data from file descriptor 1.
    - The stderr row, which holds diagnostic error text from file descriptor 2.
    - None of the rows, because the shell discards telemetry from failed commands.
    answer: 0
    why: 'Option A is correct: ''$?'' inspects the exit status byte harvested by waitpid(),
      not stream descriptors. Option B is stdout data. Option C is stderr diagnostic
      text. Option D is false because shell records status.'
  - id: b2-c4
    kind: predict
    concept: stdout-data-channel
    q: An executable executes `printf("5\n");` and then terminates with `return 0;`.
      Which output channel carries the character data `'5'` to the terminal?
    choices:
    - The stderr channel (file descriptor 2), which handles terminal text.
    - The exit status byte, which transfers numerical return values to the kernel.
    - The Makefile recipe buffer, which captures output from executed commands.
    - The stdout stream (file descriptor 1), which carries normal program output.
    answer: 3
    why: 'Option D is correct: printf() formats and transmits output to standard output
      (stdout / fd 1). Option A is false because stderr is reserved for diagnostics.
      Option B confuses stream text with status codes. Option C is irrelevant when
      executing directly from the shell prompt.'
  - id: b2-c5
    kind: choose-better
    concept: stderr-isolation-redirection
    q: Which command redirection syntax discards standard output while leaving compiler
      diagnostics and warnings visible on the terminal screen?
    choices:
    - gcc -std=c99 main.c -o app 2> /dev/null
    - gcc -std=c99 main.c -o app > /dev/null
    - gcc -std=c99 main.c -o app &> /dev/null
    - gcc -std=c99 main.c -o app > errors.log
    answer: 1
    why: 'Option B is correct: ''> /dev/null'' silences stdout (fd 1) while leaving
      stderr (fd 2) untouched. Option A silences diagnostics and keeps stdout. Option
      C silences both streams. Option D redirects stdout to a file.'
- id: b3
  type: syntax
  title: Deconstructing the C99 Toolchain Invocation
  explain_md: '### 1. Frame the Problem

    Compiling a systems program with a bare `gcc main.c` invocation is reckless: it
    defaults to an unspecified C dialect, suppresses vital compiler warnings, and
    omits debug symbols. In kernel and systems engineering, every compiler flag serves
    an exact architectural purpose.


    ### 2. The Notional Machine

    Deconstructing the standard systems compilation recipe:

    ```text

    $ gcc -std=c99 -Wall -Wextra -g main.c -o app

    ```


    1. **`-std=c99` (Language Standard)**: Instructs GCC to adhere strictly to the
    ISO C99 standard, enabling modern features (such as `//` comments, mixed declarations,
    and designated initializers) while rejecting obsolete K&R C idioms.

    2. **`-Wall -Wextra` (Diagnostic Rigor)**: Enables comprehensive warning diagnostics.
    `-Wall` catches common logic flaws (unused variables, uninitialized reads, missing
    return statements). `-Wextra` enables additional checks (signed/unsigned comparisons,
    empty bodies).

    3. **`-g` (Debug Information)**: Emits DWARF debugging sections (`.debug_info`,
    `.debug_line`) inside the ELF binary. Without `-g`, GDB cannot map machine instructions
    back to C source lines!

    4. **`-o app` (Output Artifact)**: Specifies the name of the final executable
    binary. If omitted, GCC writes to the historical default `a.out`.


    ### 3. Source-Grounded Walkthrough

    Look at Evidence `E-T0A-01` and `E-T0A-03`:

    ```text

    $ gcc --version

    gcc (GCC) 16.2.1 20260810

    $ gcc -std=c99 -Wall -Wextra -g main.c -o app

    $ echo $?

    0

    $ ls -l app

    -rwxr-xr-x 1 user user 16128 Nov 19 13:46 app

    ```

    The command completed cleanly with exit code `0`, producing an executable binary
    named `app` with full DWARF debugging symbols embedded.


    ### 4. The Failure Mode & Boundary

    If you compile with `-O3` without `-g`, the compiler optimizes aggressively (inlining
    functions and recycling registers) and strips source coordinates. When a crash
    occurs, GDB displays raw hexadecimal memory addresses and `<optimized out>`, leaving
    you blind.


    ### 5. The Compressed Mental Axiom

    *Explicit flags make compilation deterministic: c99 sets the grammar, Wall guards
    the gates, and -g preserves the map.*'
  diagram:
    kind: flow
    caption: GCC Compilation Pipeline Translation Stages
    nodes:
    - id: src
      label: main.c (C99 Source)
      shape: round
    - id: cpp
      label: 'Preprocessor (cpp): Expand #include & macros'
      shape: box
    - id: cc1
      label: 'Compiler (cc1): -Wall -Wextra AST & DWARF'
      shape: decision
    - id: as
      label: 'Assembler (as): Emit main.o machine code'
      shape: box
    - id: ld
      label: 'Linker (ld): Link libc into ELF binary ''app'''
      shape: box
    edges:
    - from: src
      to: cpp
      label: raw text
    - from: cpp
      to: cc1
      label: preprocessed source
    - from: cc1
      to: as
      label: assembly code (.s)
    - from: as
      to: ld
      label: relocatable object (.o)
    - from: ld
      to: src
      label: executable 'app'
    steps:
    - focus:
      - src
      - cpp
      note: Preprocessor handles header file inclusion and macro token expansion
    - focus:
      - cpp
      - cc1
      note: Compiler verifies C99 syntax and emits DWARF debug symbols (-g)
    - focus:
      - cc1
      - as
      - ld
      note: Assembler and Linker resolve symbols and emit the ELF executable
  example:
    lang: c
    code: "#include <stdio.h>\n\nint add(int a, int b)\n{\n    return a + b;\n}\n\n\
      int main(void)\n{\n    printf(\"%d\\n\", add(2, 3));\n    return 0;\n}"
    run_expected: '5

      '
    explain_md: This clean C99 program compiles without warnings under gcc -std=c99
      -Wall -Wextra -g and prints 5.
  checks:
  - id: b3-c1
    kind: order
    concept: compilation-command-order
    q: 'Order the 4 components of this standard compilation command from left to right
      as typed at the shell prompt:'
    lines:
    - main.c (input source file)
    - -o app (output binary target)
    - gcc (compiler driver command)
    - -std=c99 -Wall -Wextra -g (compiler flags)
    answer_order:
    - 2
    - 3
    - 0
    - 1
    why: Standard command line syntax places the driver executable first ('gcc'),
      followed by compiler options ('-std=c99 -Wall -Wextra -g'), then the input translation
      unit ('main.c'), and finally the output target ('-o app').
  - id: b3-c2
    kind: why-fails
    concept: debug-symbol-omission
    q: A developer builds an executable using `gcc -std=c99 -Wall -Wextra main.c -o
      app`, omitting the `-g` flag. Why does GDB fail to show source code lines during
      debugging?
    choices:
    - The -Wall warning flag suppresses debugger symbol emission.
    - Omitting -g leaves out the DWARF tables that map addresses to source lines.
    - Executables named 'app' cannot be analyzed by modern debuggers.
    - The C99 language standard prohibits generating debugging information.
    answer: 1
    why: 'Option B is correct: the -g flag instructs GCC to generate DWARF debugging
      sections in the ELF binary. Without -g, the debugger only sees raw machine instructions
      and symbol addresses. Options A, C, and D are false claims.'
  - id: b3-c3
    kind: fillblank
    concept: output-flag-specification
    q: 'Fill in the compiler option that specifies the output binary filename in a
      GCC invocation:'
    code: $ gcc -std=c99 -Wall -Wextra -g main.c ____ app
    answer_text: -o
    why: The '-o <file>' flag directs the linker to write the final output to the
      specified filename. If omitted, GCC defaults to writing an executable named
      'a.out'.
  - id: b3-c4
    kind: predict
    concept: default-executable-name
    q: When a developer compiles a C program using `gcc main.c` without providing
      the `-o` option, what default binary name does the compiler produce?
    choices:
    - a.out, the historical default executable name generated by the compiler.
    - main, using the base name of the input source file without an extension.
    - main.o, generating an intermediate object file instead of an executable.
    - app.out, appending a standard executable suffix to generic application files.
    answer: 0
    why: 'Option A is correct: Unix GCC defaults to creating ''a.out'' (assembler
      output) when -o is omitted. Option B is how Go works, but not C. Option C requires
      the ''-c'' flag. Option D is fictitious.'
  - id: b3-c5
    kind: mcq
    concept: compiler-warning-flags
    q: What is the primary operational effect of adding the flags `-Wall -Wextra`
      to a GCC compilation command line?
    choices:
    - They force the compiler to produce fully optimized release machine code.
    - They link additional standard math and threading libraries automatically.
    - They enable strict static diagnostic checks that warn on suspicious code patterns.
    - They cause the compiler to treat all warnings as fatal build-breaking errors.
    answer: 2
    why: 'Option C is correct: -Wall and -Wextra activate a broad suite of diagnostic
      warnings for common code defects. Option A requires optimization flags like
      -O2. Option B requires linker flags like -lm. Option D requires -Werror.'
- id: b4
  type: algorithm
  title: Compiler Diagnostics and Diagnostic Triage
  explain_md: "### 1. Frame the Problem\nWhen you make a syntax mistake in a systems\
    \ codebase, GCC can spew 80 lines of terrifying red error text across your terminal.\
    \ Beginners panic and try to read every single line, or jump to the bottom of\
    \ the log. In reality, 90% of those messages are cascading parser delusions.\n\
    \n### 2. The Notional Machine\nUnderstanding GCC's diagnostic grammar:\n```text\n\
    bad.c:6:5: error: expected ';' before 'return'\n  ^    ^ ^   ^      ^\n  |   \
    \ | |   |      +-- Explanatory diagnosis & expected token\n  |    | |   +---------\
    \ Severity (error = halts build; warning = advisory)\n  |    | +-------------\
    \ Column index (1-based cursor position)\n  |    +--------------- Line index (1-based\
    \ line number)\n  +-------------------- File path where parser lost synchronization\n\
    ```\n\n**The First-Error Rule (Invariant)**:\nA compiler's parser is a state machine.\
    \ When it encounters an unexpected token (such as a missing semicolon on line\
    \ 5), its internal grammar state breaks. It attempts to recover by guessing, but\
    \ subsequent statements are parsed in an invalid state, generating cascading phantom\
    \ errors. **You must always triage and fix the very first error in the compiler\
    \ log.**\n\n### 3. Source-Grounded Walkthrough\nLook at Evidence `E-T0A-05`:\n\
    ```text\n$ gcc -std=c99 -Wall -Wextra -g bad.c -o bad\nbad.c: In function 'main':\n\
    bad.c:6:5: error: expected ';' before 'return'\n    6 |     return 0;\n      |\
    \     ^~~~~~\n```\nTrace the failure:\n1. GCC flagged `bad.c:6:5`.\n2. Notice\
    \ the token on line 6 is `return 0;`. Why is GCC complaining about `return`?\n\
    3. Because line 5 (`int x = 42`) was missing its terminating semicolon! The parser\
    \ only realized the statement was broken when it collided with the `return` keyword\
    \ on line 6.\n4. Fixing line 5 resolves the entire error cascade instantly.\n\n\
    ### 4. The Failure Mode & Boundary\nAttempting to fix errors from the bottom of\
    \ the log up. Developers often spend hours modifying lines 40–80 when the real\
    \ bug was a missing bracket or semicolon on line 12.\n\n### 5. The Compressed\
    \ Mental Axiom\n*Always hunt the first error: the compiler loses its mind after\
    \ the first broken invariant.*"
  diagram:
    kind: flow
    caption: Compiler Diagnostic Parsing and First-Error Triage Rule
    nodes:
    - id: parse
      label: Parser scans tokens line-by-line
      shape: round
    - id: syntax_err
      label: 'Line 5: Missing '';'' Invariant Broken'
      shape: decision
    - id: first_err
      label: 'Emit bad.c:6:5: error: expected '';'''
      shape: box
    - id: cascade
      label: Parser Desynchronization Cascade (Phantoms)
      shape: box
    - id: triage
      label: 'Golden Rule: Jump to First Diagnostic Only'
      shape: box
    edges:
    - from: parse
      to: syntax_err
      label: encounters token
    - from: syntax_err
      to: first_err
      label: ROOT CAUSE
    - from: first_err
      to: cascade
      label: parser guesses
    - from: first_err
      to: triage
      label: developer action
    steps:
    - focus:
      - parse
      - syntax_err
      - first_err
      note: Root cause occurs on line 5; compiler reports error at line 6 column 5
    - focus:
      - first_err
      - cascade
      note: Subsequent errors are cascading delusions caused by desynchronization
    - focus:
      - first_err
      - triage
      note: Fixing the first diagnostic restores parser synchronization
  example:
    lang: text
    code: "$ gcc -std=c99 -Wall -Wextra -g bad.c -o bad\nbad.c: In function 'main':\n\
      bad.c:6:5: error: expected ';' before 'return'\n    6 |     return 0;\n    \
      \  |     ^~~~~~"
    explain_md: Missing semicolon on line 5 causes GCC to report expected ';' before
      return on line 6.
  checks:
  - id: b4-c1
    kind: spot-bug
    concept: syntax-error-source-location
    target_line: 5
    q: Examine this C source file and the compiler diagnostic below. Which source
      line contains the syntactic defect that caused the error?
    code: "/* bad.c */\n1: #include <stdio.h>\n2: \n3: int main(void)\n4: {\n5:  \
      \   int x = 1\n6:     printf(\"%d\\n\", x)\n7:     return 0\n8: }\n"
    diagnostic_log: 'bad.c: In function ''main'':

      bad.c:6:5: error: expected '';'' before ''printf'''
