    - The preceding statement was never terminated, so the parser reached EOF while
      still expecting tokens.
    - The compiler expects a second function definition to follow main before reaching
      end of input.
    answer: 2
    why: 'Option C is correct: because preceding statements lacked semicolons, the
      grammar state never closed. Encountering ''}'' or EOF while inside an unclosed
      expression produces cascading end-of-input errors. Options A, B, and D are false
      grammar rules.'
  - id: b4-c4
