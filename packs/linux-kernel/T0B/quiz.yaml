  level: intro
  concept: interleaved-process-exit-code
  q: 'Recall from chapter T0A: if a command completes successfully without errors,
    what numeric exit status ($?) is returned?'
  choices:
  - '0'
  - '1'
  - '255'
  answer: 0
  why: 'Option A is correct: in Unix, an exit status of 0 strictly denotes success.'
  from_chapter: T0A
  from_block: b1
- kind: choose-better
  level: core
  concept: git-show-tag-syntax
  q: Which command displays the contents of `init/main.c` at tag `0.11` without switching
    branches?
  choices:
  - git checkout 0.11 && cat init/main.c
  - git show 0.11:init/main.c
  - git diff 0.11:init/main.c
  answer: 1
  why: 'Option B is correct: `git show <tag>:<file>` reads the object directly from
    the database without touching the working tree.'
- kind: mcq
  level: advanced
  concept: epistemic-limits-macro-cscope
  q: Why do semantic indexers like cscope frequently fail to index symbols generated
    via preprocessor token concatenation (`##`)?
  choices:
  - The C standard explicitly forbids indexing macro-generated identifiers
  - They require all macros to be written in assembly language
  - They parse the raw C tokens before preprocessor expansion, so the concatenated
    name does not exist yet
  answer: 2
  why: 'Option C is correct: standard indexers parse C source without running the
    full preprocessor, so macro-pasted tokens are not registered in the index.'
