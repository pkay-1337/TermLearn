  q: 'Recall from chapter T0A: what GCC flag includes DWARF debugging information
    in the output binary?'
  choices:
  - -Wall
  - -O2
  - -g
  answer: 2
  why: 'Option C is correct: -g emits DWARF debug tables. -O2 controls optimization.
