quiz:
- kind: mcq
  level: intro
  concept: c-symbol-roles
  q: In a C project, which file type contains the canonical function definition where
    machine code instructions are emitted?
  choices:
  - A source translation unit (.c) enclosing statements in braces
  - A header file (.h) ending with a semicolon prototype
  - A Makefile (.mk) specifying compiler dependency flags
  answer: 0
  why: 'Option A is correct: the .c file contains the function body where machine
    instructions are emitted. Option B is merely an interface prototype. Option C
    orchestrates the build.'
- kind: predict
  level: intro
  concept: rg-word-boundary
  q: A developer runs `rg -w 'task' .`. Which of the following source tokens will
    be matched by ripgrep?
  choices:
  - task_struct
  - task
  - current_task
  answer: 1
  why: 'Option B is correct: the -w flag demands word boundaries, and underscores
    are treated as word characters in regex. Therefore, task_struct and current_task
    are single long words.'
- kind: mcq
  level: intro
  concept: rg-glob-filtering
  q: Which ripgrep flag restricts a search query exclusively to C header files?
  choices:
  - --only-include
  - -t header
  - -g '*.h'
  answer: 2
  why: 'Option C is correct: the -g flag takes a glob pattern matching file paths.
    Options B and C are invalid flags.'
- kind: mcq
  level: intro
  concept: rg-context-flag
  q: Which flag instructs ripgrep to print 3 lines of surrounding code before and
    after each matching line?
  choices:
  - -C 3
  - -L 3
  - -S 3
  answer: 0
  why: 'Option A is correct: -C (or --context) specifies surrounding context lines.
    Option B does not exist. Option C controls case sensitivity.'
- kind: predict
  level: core
  concept: macro-token-concatenation
  q: A preprocessor macro is defined as `#define DECLARE_DEV(name) struct dev dev_##name;`.
    What symbol name is generated by `DECLARE_DEV(eth0)`?
  choices:
  - dev_name
  - dev_eth0
  - eth0_dev
  answer: 1
  why: 'Option B is correct: the ## operator pastes ''dev_'' and ''eth0'' into ''dev_eth0''.
    Option A literally keeps ''name''. Option C reverses the ordering.'
- kind: choose-better
  level: core
  concept: definition-hunting-anchor
  q: You need to find where `sys_fork` is defined in C source, ignoring indented call
    sites. Which pattern is most effective?
  choices:
  - rg 'sys_fork' .
  - rg 'sys_fork;' -g '*.h'
  - rg '^int sys_fork\(' -g '*.c'
  answer: 2
  why: 'Option C is correct: anchoring the return type and function name to column
    0 (^), escaping the parenthesis, and filtering by .c files isolates the canonical
    definition. Option A is noisy. Option B matches prototypes.'
- kind: why-fails
  level: core
  concept: leading-dash-cli-error
  q: A developer executes `rg -n "->status" src/` to search for pointer member dereferences,
    but ripgrep fails with an 'unexpected argument' error. Why?
  choices:
  - Ripgrep parses the leading dash in '->' as a command-line option flag
  - Ripgrep does not support searching for arrow operators in C source files
  - The shell strips all arrow characters before passing arguments to argv
  answer: 0
  why: 'Option A is correct: leading hyphens are parsed as CLI options. Pass `-e "->status"`
    or `-- "->status"` to treat the argument as an operand. Options B and C are false.'
- kind: predict
  level: core
  concept: caller-enumeration-parenthesis
  q: Why does searching for `sensor_poll\(` isolate function calls more effectively
    than searching for `sensor_poll`?
  choices:
  - It forces the compiler to inline the target function before ripgrep scans the
    working tree
  - It excludes function pointer definitions and variable names that lack an invocation
    parameter list
  - It automatically searches git commit messages in addition to active source files
  answer: 1
  why: 'Option B is correct: the trailing parenthesis signifies a call site parameter
    list, excluding isolated mentions and definitions without parentheses. Options
    B and C are nonsensical.'
- kind: predict
  level: core
  concept: git-cat-file-commit-anatomy
  q: When running `git cat-file -p HEAD` on a commit object, what does the `parent`
    line record?
  choices:
  - The git branch tracking reference configured in the local repository
  - The filesystem inode number where the repository is stored on disk
  - The SHA hash of the immediate predecessor commit in the history DAG
  answer: 2
  why: 'Option C is correct: the parent line records the commit SHA of the previous
    snapshot in the DAG. Option B describes filesystem metadata. Option A describes
    branch tracking.'
- kind: mcq
  level: core
  concept: git-pickaxe-definition
  q: What does the Git pickaxe command `git log -S <symbol>` search?
  choices:
  - It searches commit diffs for revisions that altered the occurrence count of the
    symbol
  - It searches the commit log messages for mentions of the symbol string
  - It searches the current working directory for files matching the symbol name
  answer: 0
  why: 'Option A is correct: the -S flag inspects the diffs introduced by commits,
    finding revisions where the symbol was added or deleted. Option B describes `git
    log --grep`. Option C describes git ls-files.'
- kind: mcq
  level: core
  concept: git-function-evolution
  q: Which Git command traces the chronological evolution and diffs of a specific
    C function across history?
  choices:
  - git blame -f <funcname> <filepath>
  - git log -L :<funcname>:<filepath>
  - git diff --function <funcname>
  answer: 1
  why: 'Option B is correct: `git log -L :<funcname>:<filepath>` isolates the history
    of a specific function block. Options B and C are invalid Git syntax.'
- kind: mcq
  level: intro
  concept: git-blame-attribution
  q: Which command displays the commit hash, author, and timestamp for every line
    in a source file?
  choices:
  - git status -v <file>
  - git log --raw <file>
  - git blame <file>
  answer: 2
  why: 'Option C is correct: git blame provides line-by-line author and commit attribution.
    Option B shows commit metadata. Option A shows working directory status.'
- kind: choose-better
  level: core
  concept: git-blame-ignore-whitespace
  q: A file was recently reformatted with new indentation rules. What flag should
    you pass to `git blame` to see the original authors instead of the reformatter?
  choices:
  - -w, to ignore whitespace-only changes when comparing lines
  - -f, to force blame across detached HEAD references
  - -s, to suppress author names and display only commit dates
  answer: 0
  why: 'Option A is correct: `-w` ignores whitespace changes, tracing past formatting
    commits to the original code author. Options B and C do not address whitespace.'
- kind: predict
  level: advanced
  concept: historical-archaeology-0.11
  q: In `sources/early-history.git`, running `git log -S 'PAGE_SIZE' --oneline 0.11`
    outputs commit `bb441db Linux-0.01`. What does this indicate?
  choices:
  - The PAGE_SIZE macro was deprecated in 0.01 and replaced by 4KB page frames in
    0.11
  - The PAGE_SIZE macro was established in the initial 0.01 release and persisted
    through 0.11
  - The Git repository was corrupted when migrating from Minix floppy disk images
  answer: 1
  why: 'Option B is correct: the pickaxe proves that PAGE_SIZE was introduced on day
    1 in Linux 0.01 and carried forward. Options B and C contradict historical fact.'
- kind: choose-better
  level: core
  concept: rg-vs-cscope-selection
  q: You need to search for a macro definition in a codebase you just cloned. Why
    is `rg` preferable to `cscope` for this immediate task?
  choices:
  - Cscope is legally restricted to commercial proprietary Unix kernels
  - Ripgrep can execute C code in a sandbox while cscope is purely static
  - Ripgrep runs immediately without requiring an upfront database build step
  answer: 2
  why: 'Option C is correct: ripgrep scans raw files instantly without building an
    index. Cscope requires generating cscope.out upfront. Options B and C are false.'
- kind: why-fails
  level: core
  concept: cscope-index-staleness
  q: A developer edits a function in `driver.c` and runs a cscope query, but cscope
    points to old line numbers. Why?
  choices:
  - The cscope.out inverted index file has not been rebuilt since the edit
  - The Linux kernel filesystem disables real-time file modification notifications
  - Cscope requires a system reboot after every source code modification
  answer: 0
  why: 'Option A is correct: cscope relies on a static index file (cscope.out). When
    files change, the database becomes stale until regenerated via `cscope -b`. Options
    B and C are false.'
- kind: predict
  level: advanced
  concept: epistemic-limits-function-pointers
  q: A virtual filesystem driver implements `.read_iter = ext4_file_read_iter`. Why
    will `rg 'ext4_file_read_iter\('` fail to find where userspace read calls invoke
    it?
  choices:
  - The compiler renames all ext4 functions to generic POSIX system call names
  - The kernel dispatches the call through a function pointer (filp->f_op->read_iter)
  - The read_iter symbol is only linked dynamically when mounting an NFS partition
  answer: 1
  why: 'Option B is correct: the VFS invokes methods via function pointers in `file_operations`,
    decoupling the call site from the concrete implementation name. Options B and
    C are false.'
- kind: choose-better
  level: advanced
  concept: dynamic-tracing-handover
  q: You need to know which concrete driver function handles an `ioctl` command on
    `/dev/null` at runtime. Which tool should you use?
  choices:
  - A semantic cscope query searching for all global definitions of ioctl
  - A static search using ripgrep with the word boundary flag across drivers/
  - A dynamic tracer like ftrace, strace, or GDB attached to the running kernel
  answer: 2
  why: 'Option C is correct: dynamic dispatch through operation tables can only be
    observed at runtime using dynamic tracing tools. Static tools cannot resolve the
    runtime pointer.'
- kind: fillblank
  level: intro
  concept: rg-word-boundary-flag
  q: 'Fill in the ripgrep flag that matches exact whole words only:'
  code: $ rg ____ "my_func" .
  answer_text: -w
  why: The -w flag restricts matching to whole word boundaries.
- kind: fillblank
  level: core
  concept: git-pickaxe-flag
  q: 'Fill in the git log flag that searches commit diffs for symbol occurrence changes:'
  code: $ git log ____ "alloc_page" --oneline
  answer_text: -S
  why: The -S flag activates Git's pickaxe search.
- kind: order
  level: core
  concept: definition-hunting-order
  q: 'Order the 4 steps to locate the canonical definition of `sched_init` in Linux
    0.11:'
  lines:
  - 'Run an unanchored ripgrep query: rg -w ''sched_init'' .'
  - Notice that headers declare prototypes while kernel/sched.c contains braces
  - 'Anchor the search to column 0: rg ''^void sched_init\('' .'
  - Open kernel/sched.c at the matched line to inspect the implementation
  answer_order:
  - 0
  - 1
  - 2
  - 3
  why: The workflow begins with discovery, distinguishes prototypes from bodies, anchors
    to column 0, and opens the canonical source.
- kind: mcq
  level: intro
  concept: git-blob-definition
  q: In Git's internal object model, what is a 'blob'?
  choices:
  - Raw unformatted file byte data without filename or mode metadata
  - A directory listing mapping names to hashes
  - A commit object holding author and committer timestamps
  answer: 0
  why: 'Option A is correct: blobs store raw content bytes. Trees store filenames
    and directory mappings. Commits store metadata.'
- kind: predict
  level: core
  concept: macro-search-strategy
  q: You search for `sensor_temp_primary` and find only call sites. The header contains
    `REGISTER_SENSOR(name, id)`. How should you search for where the sensor was declared?
  choices:
  - Search for 'struct sensor_device' and manually read all 500 lines of code
  - Search for the argument token 'temp_primary' to locate the macro expansion
  - Reboot the machine to force the compiler to emit intermediate source files
  answer: 1
  why: 'Option B is correct: because the macro token-pastes `sensor_##name`, searching
    for the parameter ''temp_primary'' finds the instantiation site `REGISTER_SENSOR(temp_primary,
    ...)`.'
- kind: mcq
  level: core
  concept: rg-path-inversion-glob
  q: Which ripgrep glob pattern excludes all files inside the `test/` directory?
  choices:
  - -x test/
  - --no-test
  - -g '!test/*'
  answer: 2
  why: 'Option C is correct: in glob syntax, prefixing with an exclamation mark (!)
    inverts the filter, excluding matching paths.'
- kind: why-fails
  level: core
  concept: git-grep-vs-pickaxe
  q: A developer runs `git log --grep="kmalloc"` to find when kmalloc was introduced,
    but receives hundreds of unrelated commits. Why?
  choices:
  - --grep searches commit log messages, not the code diffs
  - Git does not support searching for functions beginning with 'k'
  - The commit database must be compacted with git gc before searching
  answer: 0
  why: 'Option A is correct: `--grep` filters commit messages. To search the actual
    code diffs for symbol changes, you must use `-S` (pickaxe).'
- kind: choose-better
  level: advanced
  concept: disambiguating-struct-members
  q: You want to find where `struct task_struct`'s `pid` field is assigned, without
    matching variable names like `pid_t pid;`. Which pattern is most targeted?
  choices:
  - rg 'pid'
  - rg -e '->pid = ' -g '*.c'
  - rg -w 'pid'
  answer: 1
  why: 'Option B is correct: matching the pointer arrow `->pid = ` isolates assignment
    statements to the struct member, filtering out declarations and parameters.'
