- id: b9
  type: design
  title: 'Navigation Trade-Offs: Raw Search (rg) vs Semantic Indexing (cscope/clangd)'
  explain_md: "### 1. Frame the Problem\nNo single navigation tool solves every systems\
    \ problem. Expert developers choose tools based on code scale, indexing cost,\
    \ and semantic requirements. Should you use ripgrep, cscope, clangd, or git history?\n\
    \n### 2. The Notional Machine\nThe Three-Tier Navigation Matrix:\n\n1. **Raw Text\
    \ Streaming (`ripgrep`)**:\n   - *Advantages*: Instant execution; zero index generation\
    \ required; searches everything including comments, Makefiles, assembly, and linker\
    \ scripts.\n   - *Trade-offs*: Lexical only; no understanding of C types or variable\
    \ scopes.\n2. **Semantic Indexing (`cscope` / `clangd` / `ctags`)**:\n   - *Advantages*:\
    \ Understands C grammar; answers queries like *\"Find all functions called by\
    \ this function\"* or *\"Find all places where struct member X is assigned\"*.\n\
    \   - *Trade-offs*: Requires pre-generating an index (`cscope -b -R`); indexes\
    \ get stale as you edit; fails on macro token concatenations (`##`).\n3. **Historical\
    \ Revision Tracing (`git log -S`)**:\n   - *Advantages*: Time-dimensional; reveals\
    \ why code was written and what bug it solved.\n   - *Trade-offs*: Only queries\
    \ committed history, not uncommitted edits.\n\n### 3. Source-Grounded Walkthrough\n\
    Look at Evidence `E-T0B-15`:\n```text\n$ cscope -b -R\n$ ls -l cscope.out\n-rw-r--r--\
    \ 1 user user 16384 Nov 19 13:48 cscope.out\n```\nGenerating `cscope.out` built\
    \ an inverted index of all C symbols, enabling instant queries for function callers\
    \ and struct member assignments without re-scanning files.\n\n### 4. The Failure\
    \ Mode & Boundary\nUsing a semantic index after editing files without updating\
    \ the index: `cscope` will point to stale line numbers and missing symbols.\n\n\
    ### 5. The Compressed Mental Axiom\n*Use rg for raw exploration and macros; use\
    \ cscope/clangd for call graphs; use git pickaxe for historical rationale.*"
  diagram:
    kind: flow
    caption: Navigation Tool Selection Matrix
    nodes:
    - id: task
      label: Navigation Task
      shape: round
    - id: rg
      label: ripgrep (rg)
      shape: box
    - id: cscope
      label: cscope / clangd
      shape: box
    - id: git
      label: git log -S
      shape: box
    edges:
    - from: task
      to: rg
      label: unindexed / text
    - from: task
      to: cscope
      label: C call graphs
    - from: task
      to: git
      label: historical rationale
    steps:
    - focus:
      - task
      - rg
      note: Use ripgrep for instant scanning of all file types
    - focus:
      - task
      - cscope
      note: Use cscope for C grammar and symbol callers
    - focus:
      - task
      - git
      note: Use git pickaxe to understand why code was introduced
  example:
    lang: text
    code: '$ cscope -b -R

      $ ls -la cscope.out

      -rw-rw-rw- 1 pk pk 103666 Nov 19 19:09 cscope.out'
    run_expected: ''
    explain_md: 'Evidence E-T0B-15: Generating a cscope database builds an inverted
      index file (cscope.out) enabling rapid cross-referencing of C symbol callers
      and callees.'
  checks:
  - id: b9-c1
    kind: choose-better
    concept: tool-selection-navigation
    q: You are auditing a newly cloned 1.5GB kernel repository and need to find which
      file defines a specific Kconfig string `CONFIG_EXT4_FS`. Which tool is fastest?
    choices:
    - cscope, because you must build cscope.out before searching any kernel file
    - ripgrep (rg), because it streams instantly across files without pre-indexing
    - git log -L, because it inspects every file in the working directory
    answer: 1
    why: 'Option B is correct: ripgrep requires zero pre-indexing and searches Kconfig
      files instantly. Option A wastes time generating an index that doesn''t parse
      Kconfig files. Option C is for function ranges.'
  - id: b9-c2
    kind: eipe
    concept: cscope-tradeoff-summary
    q: Which statement best summarizes the primary engineering trade-off of semantic
      indexing tools like cscope?
    choices:
    - They guarantee 100% detection of all preprocessor macro token concatenations
      without false negatives
    - They consume zero disk space but require root administrator privileges to inspect
      C translation units
    - They provide fast grammatical query resolution at the cost of upfront indexing
      time and index staleness
    answer: 2
    why: 'Option C is correct: semantic indexers speed up complex symbol queries but
      require upfront compilation/indexing and become stale when source files change.'
  - id: b9-c3
    kind: why-fails
    concept: cscope-non-c-blindspot
    q: A developer tries to use `cscope` to find where the linker script symbol `_stext`
      is defined. Why does cscope fail to find it?
    choices:
    - Cscope only parses C language source files and ignores linker scripts (.lds)
    - Linker symbols are encrypted by GCC and hidden from userspace tools
    - Cscope databases automatically delete any symbol starting with an underscore
    answer: 0
    why: 'Option A is correct: cscope is a C-specific parser. Linker scripts, assembly
      files (unless specifically added), and Makefiles are invisible to it.'
  - id: b9-c4
    kind: predict
    concept: tool-capability-matching
    q: You need to find which commit introduced a security bug into `kernel/sys.c`
      three months ago. Which tool is purpose-built for this task?
    choices:
    - cscope -b
    - git log -S
    - rg -w
    answer: 1
    why: 'Option B is correct: `git log -S` (pickaxe) searches commit history diffs
      to locate the exact commit altering the symbol. Cscope and rg only inspect current
      working state.'
  - id: b9-c5
    kind: predict
    concept: interleaved-size-elf-sections
    q: 'Recall from chapter T0A: which ELF binary section contains compiled machine
      code instructions?'
    choices:
    - .bss section
    - .data section
    - .text section
    answer: 2
    why: 'Option C is correct: the .text section holds executable machine instructions.
      .data holds initialized globals, and .bss reserves zeroed memory at runtime.'
    from_chapter: T0A
    from_block: b7
- id: b10
  type: design
  title: 'Epistemic Limits: Where Static Navigation Ends and Dynamic Tracing Begins'
  explain_md: "### 1. Frame the Problem\nEvery static navigation tool—whether ripgrep,\
    \ cscope, or clangd—shares an insurmountable theoretical boundary: they can only\
    \ read text on disk. They cannot execute the code.\n\nWhat happens when an operating\
    \ system dispatches calls through function pointer tables at runtime?\n\n### 2.\
    \ The Notional Machine\nIn the Linux kernel, abstraction is achieved via operation\
    \ tables:\n```c\nstruct file_operations {\n    ssize_t (*read)(struct file *,\
    \ char *, size_t, loff_t *);\n    int (*open)(struct inode *, struct file *);\n\
    };\n```\nWhen userspace executes `read(fd, buf, len)`, the kernel dispatches through\
    \ `file->f_op->read(...)`.\n\nWhy Static Navigation Fails:\nSearching for callers\
    \ of `ext4_file_read_iter()` with ripgrep will find zero direct call sites! The\
    \ function pointer was assigned inside a table: `.read_iter = ext4_file_read_iter`.\
    \ The call site invokes `->read_iter()`, completely decoupling the caller from\
    \ the concrete implementation.\n\n### 3. Source-Grounded Walkthrough\nLook at\
    \ Evidence `E-T0B-16`:\nIn `main.c`:\n```c\nstruct sensor_ops {\n    int (*read_sample)(int\
    \ id);\n};\n```\nSearching for callers of `temp_read_sample()` with `rg` returns\
    \ zero invocations! The assignment occurred dynamically: `ops.read_sample = temp_read_sample;`.\
    \ Static search cannot determine which concrete function will execute at runtime.\n\
    \n### 4. The Failure Mode & Boundary\nTrying to find runtime driver callbacks\
    \ using ripgrep. You will find where the struct is declared, but never which concrete\
    \ driver handled the request.\n\n### 5. The Compressed Mental Axiom\n*When code\
    \ dispatches through function pointers, static tools go blind; hand off to GDB\
    \ and ftrace.*"
  diagram:
    kind: flow
    caption: Dynamic Function Pointer Dispatch
    nodes:
    - id: user
      label: userspace read()
      shape: round
    - id: vfs
      label: sys_read trap
      shape: box
    - id: fop
      label: f_op->read table
      shape: decision
    - id: ext4
      label: ext4_read_iter
      shape: box
    - id: sock
      label: sock_read_iter
      shape: box
    edges:
    - from: user
      to: vfs
      label: int 0x80
    - from: vfs
      to: fop
      label: dereference
    - from: fop
      to: ext4
      label: if disk file
    - from: fop
      to: sock
      label: if socket fd
    steps:
    - focus:
      - user
      - vfs
      note: User syscall transitions from Ring 3 to Ring 0
    - focus:
      - vfs
      - fop
      note: Kernel resolves open file struct and operations table
    - focus:
      - fop
      - ext4
      - sock
      note: Dynamic dispatch branches to concrete driver at runtime
  example:
    lang: text
    code: '$ rg -n "read_sample" .

      ./include/sensor_dev.h:8:    int (*read_sample)(void *buf);

      ./include/sensor_dev.h:21:        .read_sample = 0 \'
    run_expected: ''
    explain_md: 'Evidence E-T0B-16: Searching for read_sample reveals only the struct
      declaration and default macro initialization; static text search cannot identify
      which dynamic callback will be assigned at runtime.'
  checks:
  - id: b10-c1
    kind: predict
    concept: indirect-call-site-blindspot
    q: 'You search a driver codebase for `my_driver_ioctl` and find only one match:
      `.unlocked_ioctl = my_driver_ioctl`. Why are there no direct call sites?'
    choices:
    - The function is called dynamically through the file_operations function pointer
      table
    - The function is dead code that was abandoned by the original author
    - The compiler inlines the function directly into the kernel boot sector
    answer: 0
    why: 'Option A is correct: virtual filesystem drivers are invoked via function
      pointers in operation tables (`filp->f_op->unlocked_ioctl`), so direct call
      sites do not exist in source text.'
  - id: b10-c2
    kind: choose-better
    concept: dynamic-dispatch-triage
    q: You need to determine which concrete filesystem function is executed when a
      specific application calls `write()` on an unknown file descriptor. What is
      the most reliable approach?
    choices:
    - Run ripgrep for 'sys_write' across all files in fs/
    - Trace the running kernel with ftrace or strace to observe the active handler
    - Read the C standard library specification for write(2)
    answer: 1
    why: 'Option B is correct: dynamic dispatch depends on runtime file descriptor
      types. Tracing tools (ftrace/strace) observe the actual function executed. Static
      search cannot predict runtime FD state.'
  - id: b10-c3
    kind: eipe
    concept: epistemic-boundary-summary
    q: Which operating system principle best describes the boundary between static
      search tools (rg/cscope) and dynamic observability tools (ftrace/gdb)?
    choices:
    - Static tools read binary machine code; dynamic tools read ASCII preprocessor
      source files
    - Static tools are exclusively for user applications; dynamic tools are exclusively
      for hardware device drivers
    - Static tools examine code structure at rest; dynamic tools observe state, pointers,
      and execution paths in motion
    answer: 2
    why: 'Option C is correct: static tools analyze source text structure at rest,
      but cannot resolve runtime pointer values, polymorphism, or timing. Dynamic
      tools observe running state.'
  - id: b10-c4
    kind: fillblank
    concept: c-function-pointer-syntax
    q: 'Fill in the syntax token that declares a function pointer member named ''read''
      returning int:'
    code: struct file_ops { int (____read)(void *buf); };
    answer_text: '*'
    why: The asterisk (*) inside parentheses with the identifier declares a function
      pointer in C.
  - id: b10-c5
    kind: predict
    concept: interleaved-process-isolation
    q: 'Recall from chapter T0A: when an application executes in userspace, what privilege
      level (Ring) does the x86 CPU enforce?'
    choices:
    - Ring 3 (Userspace unprivileged)
    - Ring 0 (Kernel supervisor mode)
    - Ring 1 (Hypervisor mode)
    answer: 0
    why: 'Option A is correct: userspace applications execute in Ring 3 with hardware
      restrictions. Kernel mode executes in Ring 0.'
    from_chapter: T0A
    from_block: b1
