- id: b8
  type: algorithm
  title: 'Historical Archaeology: Tracing Symbols Back to Kernel Roots'
  explain_md: '### 1. Frame the Problem

    When studying operating systems, you will constantly wonder: *When was this design
    choice made? Did this constant exist in the very first release?* You need a reproducible
    procedure to trace symbols across decades of history.


    ### 2. The Notional Machine

    The 4-Step Historical Archaeology Procedure:

    1. **Identify the Pinned Repository & Tag**: Target the historical tree (e.g.
    `sources/early-history.git` at tag `0.11`).

    2. **Pickaxe for Inception**: Run `git log -S "<SYMBOL>" --oneline <tag>`. This
    lists commits modifying the symbol backward from that release.

    3. **Inspect Commit Metadata**: Run `git show <commit-hash>` to read the original
    developer''s commit message, author notes, and full diff context.

    4. **Verify Cross-Version Continuity**: Check if the symbol existed in earlier
    releases (e.g. `v0.10` or the root inception commit `bb441db` in Linux 0.01).


    ### 3. Source-Grounded Walkthrough

    Look at Evidence `E-T0B-14`:

    ```text

    $ git log -S "PAGE_SIZE" --oneline 0.11

    fa1ec10 Linux-0.10 release

    bb441db Linux-0.01 release

    $ git show bb441db:include/linux/mm.h | grep PAGE_SIZE

    #define PAGE_SIZE 4096

    ```

    This archaeological trace proves that `PAGE_SIZE` has been defined as 4096 bytes
    since the very first commit of the Linux kernel in September 1991!


    ### 4. The Failure Mode & Boundary

    Querying the uncommitted working tree or mixing modern kernel code with historical
    releases without verifying tag references.


    ### 5. The Compressed Mental Axiom

    *The git history DAG is an unbroken time machine to the mind of the original architect.*'
  diagram:
    kind: flow
    caption: Historical Archaeology Backward Traversal
    nodes:
    - id: query
      label: git log -S constant
      shape: round
    - id: tag11
      label: Release Tag 0.11
      shape: box
    - id: tag10
      label: Release Tag 0.10
      shape: box
    - id: tag01
      label: Linux-0.01 Inception
      shape: box
    edges:
    - from: query
      to: tag11
      label: December 1991
    - from: tag11
      to: tag10
      label: November 1991
    - from: tag10
      to: tag01
      label: September 1991
    steps:
    - focus:
      - query
      - tag11
      note: Pickaxe query starts at target release tag
    - focus:
      - tag11
      - tag10
      note: Traverses history DAG across early releases
    - focus:
      - tag10
      - tag01
      note: Identifies inception commit bb441db in Linux 0.01
  example:
    lang: text
    code: '$ git -C sources/early-history.git log -S "PAGE_SIZE" --oneline 0.11

      b65b60f4acd (tag: 0.11) Linux-0.11 (December 8, 1991)

      fa1ec1000cf (tag: 0.10) Linux 0.10 (November 11, 1991 ???)

      bb441db1a90 Linux-0.01 (September 17, 1991)'
    run_expected: ''
