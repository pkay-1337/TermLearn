- id: b5
  type: algorithm
  title: 'Caller Enumeration: Locating True Invocations Across Subsystems'
  explain_md: "### 1. Frame the Problem\nBefore refactoring or fixing a bug in a function\
    \ like `poll()`, you must identify every single place in the operating system\
    \ that calls it. But `poll` is also a common struct member (`dev->poll`), a typedef,\
    \ and a local variable name. How do you enumerate true function invocations while\
    \ filtering out struct members?\n\n### 2. The Notional Machine\nSyntactic discrimination\
    \ in systems C:\n1. **Function Invocations**: True function calls are followed\
    \ by an opening parenthesis:\n   `rg -w 'sensor_poll\\('`\n2. **Struct Member\
    \ Dereferences**: Member accesses use arrow (`->`) or dot (`.`) operators:\n \
    \  `dev->id` or `dev.id`\n3. **The Leading Dash Flag Trap**:\n   In UNIX CLI design,\
    \ arguments starting with a hyphen (like `->id`) are parsed as option flags. Running\
    \ `rg \"->id\"` triggers `error: unexpected argument '->id' found`.\n   You **must**\
    \ pass `-e` (`rg -e '->id'`) or use the double-dash argument separator (`rg --\
    \ '->id'`).\n\n### 3. Source-Grounded Walkthrough\nLook at Evidence `E-T0B-08`\
    \ and `E-T0B-09`:\n```text\n$ rg -n 'sensor_poll\\(' .\nsrc/bus.c:14:    int val\
    \ = sensor_poll(dev);\n$ rg -n -e '->id' src/\nsrc/sensor.c:16:    if (dev->id\
    \ < 0) return -1;\nsrc/sensor.c:17:    dev->id = sanitize_sensor_id(dev->id);\n\
    ```\n- Appending `\\(` isolated the true function caller in `bus.c`.\n- Using\
    \ `-e '->id'` cleanly extracted structure member mutations in `sensor.c` without\
    \ CLI syntax errors.\n\n### 4. The Failure Mode & Boundary\nOmitting `-e` when\
    \ searching for pointer arrow dereferences causes ripgrep to fail with CLI option\
    \ parsing errors.\n\n### 5. The Compressed Mental Axiom\n*Use opening parentheses\
    \ to isolate function calls, and -e to escape pointer arrows.*"
  diagram:
    kind: flow
    caption: Caller Enumeration vs Member Access
    nodes:
    - id: sym
      label: Symbol 'poll'
      shape: round
    - id: paren
      label: Invocation '('
      shape: decision
    - id: call
      label: True Function Call
      shape: box
    - id: member
      label: Struct Member ->id
      shape: box
    edges:
    - from: sym
      to: paren
      label: syntax check
    - from: paren
      to: call
      label: sensor_poll()
    - from: sym
      to: member
      label: arrow operator
    steps:
    - focus:
      - sym
      - paren
      note: Filter queries check for trailing parenthesis
    - focus:
      - paren
      - call
      note: Function invocations isolated across callers
    - focus:
      - sym
      - member
      note: Pointer arrow access (-e '->id') separated from function calls
  example:
    lang: text
    code: '$ rg -n "sensor_poll\(" src/

      src/bus.c:11:    return sensor_poll(dev);

      src/sensor.c:25:int sensor_poll(struct sensor_device *dev)


      $ rg -n -e "->id" src/

      src/sensor.c:20:    dev->id = valid;'
    run_expected: ''
    explain_md: 'Evidence E-T0B-08 & E-T0B-09: Searching for ''sensor_poll('' isolates
      the true caller in bus.c. Searching for members with ''->id'' requires -e so
      ripgrep does not treat leading dashes as flags.'
  checks:
  - id: b5-c1
    kind: why-fails
    concept: leading-dash-cli-flag-parsing
    q: 'A developer runs `rg -n "->status" src/` to find member accesses. Ripgrep
      exits with error `error: unexpected argument ''->status'' found`. Why did this
      happen?'
    choices:
    - Ripgrep does not support searching for arrow operators in C source files
    - Ripgrep interprets the leading dash in '->' as a command-line option flag
    - The shell automatically strips all arrows from strings before passing to argv
    answer: 1
    why: 'Option B is correct: Unix CLI tools parse tokens starting with ''-'' as
      options. To treat ''->status'' as a pattern, pass `-e "->status"` or `-- "->status"`.'
  - id: b5-c2
    kind: predict
    concept: caller-enumeration-filtering
    q: You run `rg -n "sensor_poll\(" src/ -g '!src/sensor.c'`. Given the evidence
      files, what will ripgrep output?
    choices:
    - No output, because the pattern was excluded by the glob filter
    - src/sensor.c:25:int sensor_poll(struct sensor_device *dev)
    - 'src/bus.c:11:    return sensor_poll(dev);'
    answer: 2
    why: 'Option C is correct: appending ''\('' filters for invocations, and `-g ''!src/sensor.c''`
      excludes the definition in sensor.c, leaving only the external caller in bus.c.'
  - id: b5-c3
    kind: choose-better
    concept: finding-all-callers-accurately
    q: You are auditing all callers of `alloc_pages`. Which search pattern best separates
      true function calls from variable names like `alloc_pages_flags`?
    choices:
    - rg -w 'alloc_pages\('
    - rg 'alloc_pages'
    - rg 'alloc_pages.*'
    answer: 0
    why: 'Option A is correct: combining word boundaries (-w) with an opening parenthesis
      (''\('') ensures only direct function calls are matched. Option B and C match
      longer identifiers.'
