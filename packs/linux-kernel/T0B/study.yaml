blocks:
- id: b1
  type: model
  title: 'Source Code as a Graph: Declarations, Definitions, and Call Sites'
  explain_md: '### 1. Frame the Problem

    When you open a 30-million-line kernel tree, viewing files as a flat text scroll
    causes immediate disorientation. A single function name like `sensor_init` appears
    80 times across headers, call sites, and driver tables. How do you distinguish
    what allocates executable bytes from what merely defines a type contract?


    ### 2. The Notional Machine

    In systems C, every symbol exists in one of three fundamental graph roles:


    1. **Header Declaration (`include/*.h`)**: A forward contract declaring the symbol''s
    name, argument types, and return signature terminated with a semicolon. **Allocates
    zero executable bytes in memory.**

    2. **Canonical Definition (`src/*.c`)**: The singular translation unit containing
    the executable function body enclosed in braces. This is where machine instructions
    are emitted into the `.text` segment.

    3. **Call Site (`src/main.c` / caller modules)**: Statements where execution branches
    to the function''s virtual address and passes concrete arguments.


    **The Preprocessor Macro Twist**: In Linux, declarative macros like `SYSCALL_DEFINE`
    or device registration tables (`REGISTER_SENSOR`) synthesize symbols at compile
    time via token pasting (`##`). Searching for the emitted symbol string literally
    in source code will fail if you only search for the raw function name.


    ### 3. Source-Grounded Walkthrough

    Look at Evidence `E-T0B-02`:

    ```text

    $ rg -n "sensor_init" .

    ./src/main.c:11:    int rc = sensor_init(&dev, 42);

    ./src/sensor.c:11:int sensor_init(struct sensor_device *dev, int id)

    ./include/sensor_dev.h:12:int sensor_init(struct sensor_device *dev, int id);

    ```

    A single search reveals all three graph roles at once:

    - `include/sensor_dev.h:12`: Header prototype declaration ending in `;`.

    - `src/sensor.c:11`: Canonical definition where C statements live.

    - `src/main.c:11`: Call site where `sensor_init` is invoked with `&dev`.


    ### 4. The Failure Mode & Boundary

    The most common beginner trap is editing a header file prototype under the mistaken
    belief that you are changing behavior. Changing a header only changes the compile-time
    type contract; it alters zero machine instructions until the canonical `.c` definition
    is recompiled.


    ### 5. The Compressed Mental Axiom

    *Headers declare the contract, C files emit the silicon bytes, and callers jump
    to the offset.*'
  diagram:
    kind: flow
    caption: Symbol Relationship & Resolution Graph
    nodes:
    - id: decl
      label: include/sensor.h
      shape: round
    - id: defn
      label: src/sensor.c
      shape: box
    - id: call
      label: src/main.c
      shape: box
    - id: ld
      label: Linker ld
      shape: decision
    edges:
    - from: decl
      to: defn
      label: prototype
    - from: decl
      to: call
      label: type check
    - from: call
      to: ld
      label: needs sym
    - from: defn
      to: ld
      label: provides sym
    steps:
    - focus:
      - decl
      - defn
      note: Header prototype defines function contract
    - focus:
      - decl
      - call
      note: Call site is validated against header contract
    - focus:
      - call
      - defn
      - ld
      note: Linker resolves unresolved caller to .text offset
  viz:
    kind: ascii-memory
    caption: Symbol Roles and Memory Allocation Resolution
    steps:
    - '[Step 1: Header Declaration (include/sensor_dev.h)] · Regs: Allocated Bytes=0
      bytes, Terminator=Semicolon (;) · State: include/sensor_dev.h:12: int sensor_init(struct
      sensor_device *dev, int id); · (Compile-time type contract only; no machine
      code emitted)'
    - '[Step 2: Canonical Definition (src/sensor.c)] · Regs: Emitted Segment=.text
      offset 0x0040, Object=sensor.o · State: src/sensor.c:11: int sensor_init(...)
      { dev->id = id; return 0; } · (GCC compiles function body into executable machine
      instructions)'
    - '[Step 3: Call Site Resolution via Linker (ld)] · Regs: main.o Call Offset=call
      0x0040, Target=sensor.o:sensor_init · State: src/main.c:11: int rc = sensor_init(&dev,
      42); · (Linker resolves caller reference to canonical function address)'
  example:
    lang: text
    code: '$ rg -n "sensor_init" .

      ./src/main.c:11:    int rc = sensor_init(&dev, 42);

      ./src/sensor.c:11:int sensor_init(struct sensor_device *dev, int id)

      ./include/sensor_dev.h:12:int sensor_init(struct sensor_device *dev, int id);'
    run_expected: ''
    explain_md: 'Evidence E-T0B-02: A single ripgrep search reveals all three graph
      roles at once: line 11 of main.c is the call site, line 11 of sensor.c is the
      canonical definition, and line 12 of sensor_dev.h is the prototype declaration.'
  checks:
  - id: b1-c1
    kind: predict
    concept: declaration-vs-definition-identification
    q: Examine the three search hits from the captured evidence transcript. Which
      line contains the canonical function definition that emits machine instructions?
    code: './src/main.c:11:    int rc = sensor_init(&dev, 42);

      ./src/sensor.c:11:int sensor_init(struct sensor_device *dev, int id)

      ./include/sensor_dev.h:12:int sensor_init(struct sensor_device *dev, int id);'
    choices:
    - ./src/sensor.c line 11, because it begins the executable function body
    - ./src/main.c line 11, because it passes concrete runtime parameters
    - ./include/sensor_dev.h line 12, because public header declarations rule
    answer: 0
    why: 'Option A is correct: sensor.c line 11 defines the actual function body where
      machine code is emitted. Option B is merely an invocation call site. Option
      C is a header prototype declaration terminated by a semicolon.'
  - id: b1-c2
    kind: why-fails
    concept: header-prototype-confusion
    q: A developer attempts to debug an algorithm bug by setting a breakpoint at a
      line found in `include/sensor_dev.h`. Why does the debugger fail to stop at
      the intended instruction?
    choices:
    - The compiler automatically strips all DWARF debugging symbols from header files
    - The header only declares the function prototype and emits no executable bytes
    - The debugger only permits setting breakpoints on functions declared inside main.c
    answer: 1
    why: 'Option B is correct: header prototypes are type declarations that tell the
      compiler how to validate calls; they do not generate machine instructions. Option
      A is false because debug symbols map all included files. Option C is false because
      GDB supports breaking in any compiled translation unit.'
  - id: b1-c3
    kind: choose-better
    concept: navigating-definition-vs-callsite
    q: You need to modify the internal validation logic of `sensor_init`. Which file
      must you open and edit?
    choices:
    - include/sensor_dev.h, so all translation units see the updated parameter list
    - src/main.c, where the initial values and execution return codes are tested
    - src/sensor.c, where the statements and logic of the function body reside
    answer: 2
    why: 'Option C is correct: modifying internal algorithm logic requires altering
      the canonical definition in src/sensor.c. Option A only modifies the prototype
      interface. Option B only modifies one caller.'
  - id: b1-c4
    kind: order
    concept: c-symbol-translation-lifecycle
    q: 'Order the 4 steps representing the lifecycle of a C function symbol from interface
      declaration to execution:'
    lines:
    - The function prototype is declared in a header file with a trailing semicolon
    - The canonical implementation with function body braces is written in a .c file
    - A caller module includes the header and invokes the function with arguments
    - The linker matches the caller's symbol reference to the .text offset of the
      .c file
    answer_order:
    - 0
    - 1
    - 2
    - 3
    why: The lifecycle proceeds from header declaration -> implementation definition
      in .c -> call site invocation -> final link-time symbol resolution.
  - id: b1-c5
    kind: predict
    concept: interleaved-compiler-exit-status
    q: 'Recall from chapter T0A: when GCC encounters an undeclared symbol name in
      main.c, what happens to the build process?'
    choices:
    - GCC halts with an error diagnostic and returns non-zero exit status $?
    - GCC emits an implicit declaration diagnostic and sets exit status 0
    - GCC automatically inserts an empty dummy stub and generates the binary
    answer: 0
    why: 'Option A is correct: undeclared symbols violate C syntax, causing GCC to
      emit a diagnostic to stderr and exit with non-zero status. Option B is obsolete
      under C99/modern standards. Option C is false.'
    from_chapter: T0A
    from_block: b2
- id: b2
  type: syntax
  title: 'Precision ripgrep: Word Boundaries, Path Filters, and Case Control'
  explain_md: "### 1. Frame the Problem\nRaw text searches over large codebases flood\
    \ your terminal with useless noise. Running a bare query like `rg poll` matches\
    \ `poll`, `sensor_poll`, `bus_dispatch_poll`, and even unrelated variable names\
    \ like `poll_timeout`. How do you eliminate false positives and extract exact\
    \ symbol hits?\n\n### 2. The Notional Machine\nMastering three essential ripgrep\
    \ flags turns noisy dumps into exact matches:\n\n1. **Word Boundary (`-w` / `--word-regexp`)**:\
    \ Anchors matches to whole word boundaries (`\\bpattern\\b`). Searching `rg -w\
    \ \"sensor_poll\"` ignores `bus_dispatch_poll` and isolated `poll` substrings.\n\
    2. **Path Filtering (`-g` / `--glob`)**: Restricts searches using shell wildcard\
    \ patterns:\n   - `rg -g '*.h'`: Searches only header files.\n   - `rg -g 'src/*.c'`:\
    \ Searches implementation files in `src/`.\n   - Prefixing with an exclamation\
    \ mark (`-g '!tests*'`) excludes noisy test directories.\n3. **Case Sensitivity**:\
    \ By default, ripgrep uses smart-case (case-insensitive if pattern is all lowercase,\
    \ sensitive if uppercase is used). Pass `-s` to force case-sensitive matching.\n\
    \n### 3. Source-Grounded Walkthrough\nLook at Evidence `E-T0B-03`:\n```text\n\
    $ rg \"sensor_poll\" .\n(Returns 7 lines including substring prefix matches like\
    \ bus_dispatch_poll)\n$ rg -w \"sensor_poll\" -g 'src/*.c' .\nsrc/sensor.c:18:int\
    \ sensor_poll(struct sensor_device *dev)\nsrc/bus.c:14:    int val = sensor_poll(dev);\n\
    ```\nNotice the power of composition:\n- Adding `-w` filtered out prefix substring\
    \ hits.\n- Adding `-g 'src/*.c'` filtered out header prototypes.\n- Only the canonical\
    \ definition and active caller remained!\n\n### 4. The Failure Mode & Boundary\n\
    Omitting quotes around glob arguments: if you run `rg -g *.c pattern`, your shell\
    \ expands `*.c` into filenames *before* ripgrep runs. If you have multiple C files\
    \ in your directory, ripgrep errors with `unexpected argument`. Always quote globs:\
    \ `rg -g '*.c'`.\n\n### 5. The Compressed Mental Axiom\n*Bare queries drown in\
    \ noise; word boundaries and path globs isolate the signal.*"
  diagram:
    kind: flow
    caption: Ripgrep Precision Filter Pipeline
    nodes:
    - id: raw
      label: Bare Query 'poll'
      shape: round
    - id: word
      label: -w Word Boundary
      shape: decision
    - id: glob
      label: -g Path Filter
      shape: decision
    - id: hit
      label: Target Symbol Hit
      shape: box
    edges:
    - from: raw
      to: word
      label: filter substrings
    - from: word
      to: glob
      label: filter directories
    - from: glob
      to: hit
      label: clean match
    steps:
    - focus:
      - raw
      - word
      note: Word boundary -w rejects prefix substrings like bus_dispatch_poll
    - focus:
      - word
      - glob
      note: Path filter -g '*.c' restricts search to implementation files
    - focus:
      - glob
      - hit
      note: Yields exact symbol occurrences without noise
  example:
    lang: text
    code: '$ rg -n "poll" .

      ./src/main.c:4:int bus_dispatch_poll(struct sensor_device *dev);

      ./src/main.c:16:    int val = bus_dispatch_poll(&dev);

      ./src/bus.c:8:int bus_dispatch_poll(struct sensor_device *dev)

      ./src/bus.c:11:    return sensor_poll(dev);

      ./src/sensor.c:25:int sensor_poll(struct sensor_device *dev)


      $ rg -n -w "sensor_poll" .

      ./src/bus.c:11:    return sensor_poll(dev);

      ./src/sensor.c:25:int sensor_poll(struct sensor_device *dev)'
    run_expected: ''
    explain_md: 'Evidence E-T0B-03: The unbounded search returned 7 lines including
      bus_dispatch_poll. Adding -w filtered out prefix matches and returned only exact
      references to sensor_poll.'
  checks:
  - id: b2-c1
    kind: predict
    concept: word-boundary-matching
    q: You run `rg -w 'task' .` in a directory containing the following lines. Which
      line will be matched?
    code: 'Line 1: struct task_struct current_task;

      Line 2: int update_task_state(void);

      Line 3: if (task == NULL) return -1;'
    choices:
    - Line 1, because task is at the beginning of the identifier
    - Line 3, because task is surrounded by whitespace and non-word tokens
    - Line 2, because task is separated by underscores
    answer: 1
    why: 'Option B is correct: -w treats underscores as word characters, so ''task_struct''
      and ''update_task_state'' are single long tokens. Only ''task'' in Line 3 is
      bounded by non-word delimiters.'
  - id: b2-c2
    kind: mcq
    concept: path-filter-glob-syntax
    q: Which ripgrep command searches for occurrences of `struct sensor_device` restricted
      strictly to header files?
    choices:
    - rg -n -f '*.h' 'struct sensor_device' .
    - rg -n --headers-only 'struct sensor_device' .
    - rg -n -g '*.h' 'struct sensor_device' .
    answer: 2
    why: 'Option C is correct: the -g flag takes a shell glob pattern enclosed in
      quotes. Option B is an invented flag. Option A uses -f, which in ripgrep reads
      patterns from a file.'
  - id: b2-c3
    kind: why-fails
    concept: shell-glob-quoting
    q: A developer runs `rg -g *.c sensor_init .` without quotes around `*.c`. Why
      might the command fail or produce unexpected results?
    choices:
    - The shell expands *.c in the current directory before ripgrep runs
    - Ripgrep requires glob patterns to use uppercase letters exclusively
    - The -g flag requires double hyphens (--g) when used without quotes
    answer: 0
    why: 'Option A is correct: unquoted globs are expanded by the shell. If multiple
      .c files exist in the current directory, ripgrep receives multiple unexpected
      positional arguments. Quoting ensures ripgrep parses the glob internally.'
  - id: b2-c4
    kind: fillblank
    concept: rg-word-boundary-flag
    q: 'Fill in the flag that restricts pattern matching to full word boundaries in
      ripgrep:'
    code: $ rg ____ "sensor_poll" src/
    answer_text: -w
    why: The -w (--word-regexp) flag forces ripgrep to match pattern only when surrounded
      by word boundaries.
  - id: b2-c5
    kind: choose-better
    concept: narrowing-search-scope
    q: You want to find all occurrences of the symbol `PAGE_SIZE` only within C source
      files in `kernel/`, ignoring headers and docs. Which command is most precise?
    choices:
    - rg 'PAGE_SIZE' kernel/
    - rg -w -g '*.c' 'PAGE_SIZE' kernel/
    - find kernel/ -name '*.c' | xargs grep -i 'page_size'
    answer: 1
    why: 'Option B is correct: combining -w with -g ''*.c'' confines the search to
      whole words in implementation files. Option A includes headers. Option C is
      case-insensitive and slower.'
- id: b3
  type: syntax
  title: Context Inspection and Preprocessor Macro Search Traps
  explain_md: "### 1. Frame the Problem\nIn the Linux kernel, declarative macros synthesize\
    \ functions and data structures at compile time using token concatenation (`##`).\
    \ When a function like `sensor_temp_primary` is generated via a macro `REGISTER_SENSOR(temp_primary)`,\
    \ a literal search for `sensor_temp_primary` will return zero definition hits!\
    \ How do you locate the definition of a symbol that was never typed into source\
    \ code?\n\n### 2. The Notional Machine\n1. **Preprocessor Token Pasting (`##`)**:\n\
    \   ```c\n   #define REGISTER_SENSOR(name, id) \\\n       struct sensor_device\
    \ sensor_##name = { .id = id }\n   ```\n   The preprocessor stitches `sensor_`\
    \ and `name` into `sensor_temp_primary`. The emitted identifier only exists after\
    \ preprocessing!\n2. **The Macro Search Strategy**:\n   - When a literal search\
    \ fails, search for the root parameter token (`temp_primary`).\n   - Search for\
    \ the macro name itself (`REGISTER_SENSOR`).\n3. **Surrounding Context Flags**:\n\
    \   - `rg -C <N>`: Displays $N$ lines before and after every match.\n   - `rg\
    \ -B <N>`: Displays $N$ lines before.\n   - `rg -A <N>`: Displays $N$ lines after.\n\
    \n### 3. Source-Grounded Walkthrough\nLook at Evidence `E-T0B-05` and `E-T0B-06`:\n\
    In `main.c`:\n```text\n$ rg -C 2 \"REGISTER_SENSOR\" src/\nsrc/main.c-4-\nsrc/main.c-5-/*\
    \ Register primary temperature sensor */\nsrc/main.c:6:REGISTER_SENSOR(temp_primary,\
    \ 101);\nsrc/main.c-7-\nsrc/main.c-8-int main(void)\n```\nContext lines (`-C 2`)\
    \ exposed the macro instantiation on line 6 that created the variable `sensor_temp_primary`\
    \ used later on line 17.\n\n### 4. The Failure Mode & Boundary\nAssuming that\
    \ because `rg` returns zero hits for a symbol name, the symbol does not exist\
    \ in the codebase. In kernel code, always ask: *Could this identifier have been\
    \ synthesized by a macro?*\n\n### 5. The Compressed Mental Axiom\n*When a symbol\
    \ vanishes from text search, suspect preprocessor token concatenation.*"
  diagram:
    kind: flow
    caption: Macro Token Concatenation Transformation
    nodes:
    - id: src
      label: Source Code Token
      shape: round
    - id: macro
      label: 'Macro Definition ##'
      shape: box
    - id: cpp
      label: C Preprocessor
      shape: decision
    - id: out
      label: Emitted Identifier
      shape: box
    edges:
    - from: src
      to: cpp
      label: temp_primary
    - from: macro
      to: cpp
      label: sensor_##name
    - from: cpp
      to: out
      label: sensor_temp_primary
    steps:
    - focus:
      - src
      - cpp
      note: Invocation passes parameter token 'temp_primary'
    - focus:
      - macro
      - cpp
      note: Macro specifies concatenation prefix 'sensor_'
    - focus:
      - cpp
      - out
      note: Preprocessor emits concatenated identifier into compiler stream
  example:
    lang: text
    code: '$ rg -n "temp_primary" .

      ./src/main.c:6:REGISTER_SENSOR(temp_primary, 101);

      ./src/main.c:17:    printf("sensor_poll returned %d (registered: %s)

      ", val, sensor_temp_primary.name);


      $ rg -n -C 2 "sanitize_sensor_id" src/sensor.c

      1-#include "../include/sensor_dev.h"

      2-

      3:static int sanitize_sensor_id(int id)

      4-{

      5-    if (id < 0 || id > 1024) {'
    run_expected: ''
    explain_md: 'Evidence E-T0B-05 & E-T0B-06: Line 6 of main.c defines the sensor
      via the macro REGISTER_SENSOR(temp_primary, ...), while line 17 accesses the
      concatenated identifier sensor_temp_primary.'
  checks:
  - id: b3-c1
    kind: predict
    concept: macro-token-concatenation-trap
    q: A driver macro defines `#define DEFINE_DEV(name) struct dev dev_##name;`. The
      source contains `DEFINE_DEV(eth0);`. What variable name does the compiler generate?
    choices:
    - name_eth0
    - eth0
    - dev_eth0
    answer: 2
    why: 'Option C is correct: the ## operator concatenates ''dev_'' and the argument
      ''eth0'' into ''dev_eth0''. Option A uses the parameter name. Option B omits
      the prefix.'
  - id: b3-c2
    kind: mcq
    concept: ripgrep-context-flag
    q: Which ripgrep flag displays 3 lines before and 3 lines after every match?
    choices:
    - -C 3
    - -L 3
    - -w 3
    answer: 0
    why: 'Option A is correct: -C (or --context) specifies surrounding context lines.
      Option B does not exist in rg. Option C specifies word matching.'
  - id: b3-c3
    kind: why-fails
    concept: macro-search-trap-diagnosis
    q: You search a kernel tree with `rg -w 'sys_read'` and find declarations and
      call sites, but no `int sys_read(...)` definition in `fs/read_write.c`. What
      is the most likely reason?
    choices:
    - The function is implemented directly in assembly language in the bootloader
    - The function definition is wrapped by a macro like SYSCALL_DEFINE3(read, ...)
    - The compiler generates system calls at runtime without requiring C source
    answer: 1
    why: 'Option B is correct: Linux wraps system calls in macros like SYSCALL_DEFINE3(read,
      ...) to automate parameter validation and architecture calling conventions.
      Option A is false for read(). Option C is impossible.'
  - id: b3-c4
    kind: fillblank
    concept: macro-token-pasting-operator
    q: 'Fill in the C preprocessor token concatenation operator used to join two tokens
      into one identifier:'
    code: '#define MAKE_FN(prefix, name) void prefix____name(void)'
    answer_text: '##'
    why: The double hash (##) is the standard C preprocessor token pasting operator
      that merges adjacent tokens into a single valid identifier.
  - id: b3-c5
    kind: choose-better
    concept: search-strategy-macro-symbols
    q: You need to locate the definition of `sensor_temp_primary`, but searching for
      the full symbol yields only call sites. What is the best next step?
    choices:
    - Run git clean -fdx to remove stale preprocessor object caches from disk
    - Recompile the kernel with -O0 to prevent the compiler from inlining the variable
    - Search for the distinctive sub-string 'temp_primary' to reveal macro instantiation
      sites
    answer: 2
    why: 'Option C is correct: when token pasting is suspected, searching for the
      unique argument token (''temp_primary'') finds the macro call site that produced
      the symbol. Options B and C have no effect on source text.'
- id: b4
  type: algorithm
  title: 'Definition Hunting: Leaping from Call Site to Canonical Source'
  explain_md: "### 1. Frame the Problem\nYou are reading a driver and encounter a\
    \ call site like `sensor_init(&dev, 10)`. You need to read its actual implementation.\
    \ Running an unanchored search floods your screen with 40 prototypes and callers.\
    \ How do you leap directly from the call site to the exact line where code statements\
    \ live?\n\n### 2. The Notional Machine\nThe 3-Step Definition Hunting Pipeline:\n\
    1. **Anchor to Column Zero (`^`)**: In standard C coding conventions, canonical\
    \ function definitions begin at column 0 with the return type and function name.\
    \ Call sites inside functions are indented by tabs or spaces. The regex anchor\
    \ `^` eliminates all indented callers:\n   `rg '^int sensor_init\\('`\n2. **Filter\
    \ Out Header Prototypes (`-g '*.c'`)**: Prototypes live in `.h`; canonical executable\
    \ code lives in `.c`. Restricting with `-g '*.c'` discards header contracts.\n\
    3. **Line Numbering (`-n`)**: Displays 1-based line coordinates so you can jump\
    \ directly in your editor (`vim +line file`).\n\n### 3. Source-Grounded Walkthrough\n\
    Look at Evidence `E-T0B-07`:\n```text\n$ rg -n -g 'src/*.c' '^int sensor_init\\\
    (' .\nsrc/sensor.c:11:int sensor_init(struct sensor_device *dev, int id)\n```\n\
    Notice what happened:\n- Anchoring with `^int` discarded indented call sites in\
    \ `main.c`.\n- Globbing `-g 'src/*.c'` discarded prototypes in `include/sensor_dev.h`.\n\
    - Exactly one line was returned: the canonical definition in `src/sensor.c` at\
    \ line 11.\n\n### 4. The Failure Mode & Boundary\nGNU-style C declarations place\
    \ the return type on its own line above the function name:\n```c\nint\nsensor_init(struct\
    \ sensor_device *dev, int id)\n```\nIn this case, anchoring to `^int sensor_init`\
    \ will miss. You must anchor on the function name itself (`^sensor_init\\(`) or\
    \ use ripgrep multiline matching (`-U`).\n\n### 5. The Compressed Mental Axiom\n\
    *Anchor to column zero and filter by .c to leap from caller to canonical source.*"
  diagram:
    kind: flow
    caption: Definition Hunting Filter Pipeline
    nodes:
    - id: query
      label: Raw Search Query
      shape: round
    - id: anchor
      label: Line Anchor ^int
      shape: decision
    - id: glob
      label: Path Glob -g *.c
      shape: decision
    - id: canon
      label: Canonical Source
      shape: box
    edges:
    - from: query
      to: anchor
      label: filter calls
    - from: anchor
      to: glob
      label: filter headers
    - from: glob
      to: canon
      label: isolated
    steps:
    - focus:
      - query
      - anchor
      note: Anchor ^ removes indented call sites
    - focus:
      - anchor
      - glob
      note: Glob -g '*.c' discards header prototypes
    - focus:
      - glob
      - canon
      note: Exact canonical definition isolated in src/
  example:
    lang: text
    code: '$ rg -n "^int sensor_init\(" .

      ./src/sensor.c:11:int sensor_init(struct sensor_device *dev, int id)

      ./include/sensor_dev.h:12:int sensor_init(struct sensor_device *dev, int id);


      $ rg -n -g ''src/*.c'' "^int sensor_init\(" .

      ./src/sensor.c:11:int sensor_init(struct sensor_device *dev, int id)'
    run_expected: ''
    explain_md: 'Evidence E-T0B-07: Anchoring with ''^int sensor_init('' immediately
      discarded all indented call sites. Adding -g ''src/*.c'' discarded header prototypes,
      isolating the canonical definition.'
  checks:
  - id: b4-c1
    kind: predict
    concept: anchor-regex-filtering
