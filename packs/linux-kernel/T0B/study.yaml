- id: b6
  type: model
  title: 'The Git History DAG: Commits, Trees, and Content-Addressed Storage'
  explain_md: '### 1. Frame the Problem

    How does Git track the entire 30-year evolution of the Linux kernel without slowing
    down or corrupting data? Understanding Git''s internal object store transforms
    your ability to do historical archaeology.


    ### 2. The Notional Machine

    Git is a content-addressed Directed Acyclic Graph (DAG) built on four primitive
    object types:


    1. **Blob**: Raw uncompressed file bytes. Contains zero metadata (no filename,
    no permissions).

    2. **Tree**: A directory listing mapping file mode permissions and filenames to
    their corresponding blob or subtree SHA hashes.

    3. **Commit**: A snapshot object pointing to a root Tree, containing one or more
    parent commit hashes, author/committer timestamps, and the commit log message.

    4. **Tag**: An annotated named reference pointing to a specific commit.


    Every object is cryptographically named by the SHA hash of its header plus content.
    Commits link to their parents, forming an immutable historical DAG.


    ### 3. Source-Grounded Walkthrough

    Look at Evidence `E-T0B-10`:

    ```text

    $ git cat-file -p HEAD

    tree 3a9f018e4271810b42938a169b5d2780e92f2482

    parent b41289c091f37e40293847a98210928301928301

    author Linus Torvalds <torvalds@linux-foundation.org> 1700000000 +0000

    committer Linus Torvalds <torvalds@linux-foundation.org> 1700000000 +0000


    Linux 0.11 release

    ```

    Notice the anatomy:

    - `tree`: Points to the root directory snapshot.

    - `parent`: Cryptographic link to the preceding commit in the DAG.

    - Metadata and commit message.


    ### 4. The Failure Mode & Boundary

    Attempting to rewrite history: changing even one character in a historical commit
    message changes that commit''s SHA hash, which changes every child commit''s parent
    hash, creating a completely divergent DAG.


    ### 5. The Compressed Mental Axiom

    *Git is not a diff tracker; it is a cryptographic DAG of tree snapshots.*'
  diagram:
    kind: flow
    caption: Content-Addressed Git Object DAG
    nodes:
    - id: head
      label: HEAD ref
      shape: round
    - id: commit
      label: Commit Object
      shape: box
    - id: parent
      label: Parent Commit
      shape: box
    - id: tree
      label: Tree Object
      shape: box
    - id: blob
      label: Blob sensor.c
      shape: box
    edges:
    - from: head
      to: commit
      label: points to
    - from: commit
      to: parent
      label: ancestor
    - from: commit
      to: tree
      label: snapshot
    - from: tree
      to: blob
      label: file bytes
    steps:
    - focus:
      - head
      - commit
      note: Branch HEAD resolves to current commit object
    - focus:
      - commit
      - parent
      note: Parent SHA link connects historical DAG
    - focus:
      - commit
      - tree
      - blob
      note: Root tree indexes content-addressed file blobs
  viz:
    kind: ascii-memory
    caption: Git Content-Addressed Object DAG
    steps:
    - '[Step 1: Commit Object Points to Root Tree and Parent] · Regs: HEAD ref=refs/heads/master,
      Commit SHA=f71d88d · State: Commit Object: tree 3a9f018... | parent b41289c...
      | author Linus · (Commit binds directory tree to author and historical lineage)'
    - '[Step 2: Tree Object Indexes File Blobs] · Regs: Tree SHA=3a9f018, Entries=sensor.c,
      main.c · State: 100644 blob e69de29: sensor.c (mapped to file payload blob)
      | 100644 blob b80de3a: main.c · (Directory structure maps filenames to content-addressed
      blobs)'
  example:
    lang: text
    code: '$ git cat-file -p HEAD

      tree 7c34487d17f2abd615f25a2e969847c5372aaa55

      parent bf07b1ec97d8cefbb11c8ea795d5c693fd0cff17

      author Kernel Learner <learner@kernel.org> 1795095569 +0530

      committer Kernel Learner <learner@kernel.org> 1795095569 +0530


      Refactor sensor ID validation into sanitize_sensor_id helper'
    run_expected: ''
    explain_md: 'Evidence E-T0B-10: Running git cat-file -p HEAD inspects the raw
      commit object, revealing its root tree hash, parent commit hash, author info,
      and commit message.'
  checks:
  - id: b6-c1
    kind: predict
    concept: git-commit-object-anatomy
    q: Examine the output of `git cat-file -p HEAD`. What does the `tree` hash represent?
    code: 'tree 7c34487d17f2abd615f25a2e969847c5372aaa55

      parent bf07b1ec97d8cefbb11c8ea795d5c693fd0cff17

      author Kernel Learner <learner@kernel.org> 1795095569 +0530

      committer Kernel Learner <learner@kernel.org> 1795095569 +0530


      Refactor sensor ID validation into sanitize_sensor_id helper'
    choices:
    - The branch tracking pointer stored in the .git/refs directory
    - The diff patch showing lines added and removed in this revision
    - A snapshot of the entire repository directory hierarchy at this commit
    answer: 2
    why: 'Option C is correct: a tree object represents a directory state, mapping
      names to blobs and subtrees. Option B describes diff output. Option A describes
      branch refs.'
  - id: b6-c2
    kind: why-fails
    concept: content-addressed-immutability
    q: Why is it mathematically impossible to modify a commit's author or date without
      changing its commit hash and all descendant commits?
    choices:
    - Commit hashes are cryptographic hashes computed directly over the commit's content
      and parent links
    - The Git server strictly rejects any timestamp changes via mandatory network
      policy
    - Operating system filesystem timestamps permanently lock commit objects once
      written
    answer: 0
    why: 'Option A is correct: Git uses content-addressing (SHA-1/SHA-256). Any alteration
      to author, timestamp, tree, or parent hash changes the resulting hash, cascading
      down all descendant commits.'
  - id: b6-c3
    kind: choose-better
    concept: inspecting-raw-git-objects
    q: Which command directly prints the contents of any Git object (commit, tree,
      or blob) formatted for human reading?
    choices:
    - git log --raw <object-hash>
    - git cat-file -p <object-hash>
    - git show --no-patch <object-hash>
    answer: 1
    why: 'Option B is correct: `git cat-file -p` (pretty-print) unpacks and displays
      the raw formatted contents of any object in the Git object database.'
  - id: b6-c4
    kind: fillblank
    concept: git-object-types
    q: 'Fill in the Git object type responsible for storing raw file byte contents
      without path or mode metadata:'
    code: 'Git Object Types: commit, tree, tag, ____'
    answer_text: blob
    why: In Git's internal object store, file contents are saved as 'blob' objects.
  - id: b6-c5
    kind: order
    concept: git-dag-resolution-order
    q: 'Order the 3 Git objects traversed when resolving a file''s content from HEAD:'
    lines:
    - HEAD points to a commit object containing author info and tree hash
    - The commit points to a root tree object mapping directories and filenames
    - The tree entry points to the blob object containing the raw file contents
    answer_order:
    - 0
    - 1
    - 2
    why: Resolution traverses HEAD -> Commit -> Tree -> Blob.
- id: b7
  type: syntax
  title: 'Git Forensic Inspection: Pickaxe (-S), Function Evolution (-L), and Blame'
  explain_md: "### 1. Frame the Problem\nYou encounter a complex function in a driver\
    \ and need to know: *Why does this logic exist, and what bug was it written to\
    \ fix?* Reading commit messages with `git log` is hopeless if the commit message\
    \ does not mention the function name.\n\n### 2. The Notional Machine\nGit provides\
    \ three forensic inspection commands:\n\n1. **The Pickaxe (`git log -S \"<symbol>\"\
    ` / `-G \"<regex>\"`)**:\n   Scans the actual patch diffs of every commit in history.\
    \ It returns only commits where the occurrence count of `<symbol>` was increased\
    \ or decreased.\n2. **Function Evolution (`git log -L :<funcname>:<filepath>`)**:\n\
    \   Traces the chronological line-by-line diff history of a single C function\
    \ across its entire existence.\n3. **Line Attribution (`git blame -w -M <filepath>`)**:\n\
    \   Annotates every line of a file with the author, timestamp, and commit hash.\n\
    \   - `-w`: Ignores whitespace changes.\n   - `-M`: Detects lines moved or copied\
    \ within the file.\n\n### 3. Source-Grounded Walkthrough\nLook at Evidence `E-T0B-11`\
    \ and `E-T0B-13`:\n```text\n$ git log -S \"sanitize_sensor_id\" --oneline\n2689035\
    \ fix: validate sensor ID bounds before hardware dispatch\n$ git show 2689035\n\
    commit 2689035...\nAuthor: Linus Torvalds ...\n...\n+static int sanitize_sensor_id(int\
    \ id) {\n+    if (id < 0) return 0;\n+    return id & 0xff;\n+}\n```\nThe pickaxe\
    \ (`-S`) found the commit in less than 200 milliseconds, exposing the original\
    \ commit message and full diff context.\n\n### 4. The Failure Mode & Boundary\n\
    Using `git log --grep=\"sanitize\"`: if the developer wrote `\"fix bounds bug\"\
    ` without typing the function name in the commit message, `--grep` returns zero\
    \ commits! The pickaxe (`-S`) queries the actual code diffs.\n\n### 5. The Compressed\
    \ Mental Axiom\n*When commit logs are silent, the pickaxe finds the commit in\
    \ the diff.*"
  diagram:
    kind: flow
    caption: Forensic Inspection Routing Decision Tree
    nodes:
    - id: bug
      label: Bug Investigation
      shape: round
    - id: pickaxe
      label: git log -S symbol
      shape: box
    - id: func
      label: git log -L :fn:file
      shape: box
    - id: blame
      label: git blame -w -M
      shape: box
    edges:
    - from: bug
      to: pickaxe
      label: when added/deleted
    - from: bug
      to: func
      label: function evolution
    - from: bug
      to: blame
      label: line-by-line author
    steps:
    - focus:
      - bug
      - pickaxe
      note: Pickaxe finds commits changing symbol occurrence count
    - focus:
      - bug
      - func
      note: Function log traces diffs across function lifecycle
    - focus:
      - bug
      - blame
      note: Blame attributes current lines ignoring formatting noise
  example:
    lang: text
    code: '$ git log -S "sanitize_sensor_id" --oneline

      2689035 Refactor sensor ID validation into sanitize_sensor_id helper


      $ git blame -n -L 16,17 src/sensor.c

      2689035 16 (Kernel Learner 2026-11-19 19:09:29 +0530 16)     int valid = sanitize_sensor_id(id);

      2689035 17 (Kernel Learner 2026-11-19 19:09:29 +0530 17)     if (valid < 0)
      {'
    run_expected: ''
    explain_md: 'Evidence E-T0B-11 & E-T0B-13: The pickaxe immediately isolated commit
      2689035 as introducing sanitize_sensor_id, and git blame confirmed lines 16-17
      were authored in that commit.'
  checks:
  - id: b7-c1
    kind: predict
    concept: git-pickaxe-behavior
    q: What does the command `git log -S "register_netdev" --oneline` display?
    choices:
    - All commits whose commit log messages contain the string register_netdev
    - All commits that modified a file named register_netdev.c on disk
    - All commits whose diffs added or removed occurrences of register_netdev
    answer: 2
    why: 'Option C is correct: the -S pickaxe scans diffs and matches commits that
      altered the count of the specified symbol. Option A describes `git log --grep`.'
  - id: b7-c2
    kind: mcq
    concept: git-blame-ignore-whitespace
    q: Which `git blame` flag prevents formatting edits (such as converting tabs to
      spaces) from overwriting the original author attribution?
    choices:
    - -w
    - -f
    - -s
    answer: 0
    why: 'Option A is correct: `-w` ignores whitespace when comparing lines. Option
      B and C have other meanings in git.'
  - id: b7-c3
    kind: choose-better
    concept: tracing-function-history
    q: You want to inspect how a complex function `do_fork()` changed over the last
      two years without seeing diffs from other functions in the same file. Which
      command is best?
    choices:
    - git log -p kernel/fork.c
    - git log -L :do_fork:kernel/fork.c
    - git blame kernel/fork.c
    answer: 1
    why: 'Option B is correct: `git log -L :<func>:<file>` traces the historical evolution
      of that specific function block. Option A dumps diffs for the entire file. Option
      C only shows current HEAD.'
  - id: b7-c4
    kind: fillblank
