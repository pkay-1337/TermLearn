  checks:
  - kind: predict
    concept: cr0-bit-decoding
    q: In Evidence E-T1A-07, register `eax` holds `0x80000013` at entry to `main()`.
      What does bit 31 (`0x80000000`) indicate about the CPU memory system?
    choices:
    - The kernel has mounted a network filesystem over the ethernet controller
    - The CPU is operating in 16-bit real mode with segmented memory translation
    - Paging is enabled (PG bit is set), so memory accesses pass through page tables
    answer: 2
    why: 'Option C is correct: bit 31 of `CR0` is the Paging Enable (`PG`) flag. When
      set to 1, the MMU translates virtual addresses to physical addresses via page
      tables. Option B is incorrect because real mode is 0x0. Option A is incorrect
      because CR0 is a CPU hardware register.'
  - kind: mcq
    concept: disassemble-pc-instructions
    q: Which GDB command examines and disassembles the next 4 machine instructions
      starting at the current instruction pointer?
    choices:
    - x/4i $eip (or $rip on 64-bit systems)
    - print /4 instructions
    - dump 4 asm
    answer: 0
    why: 'Option A is correct: `x/4i $eip` uses the examine command with count 4 and
      instruction format `i` starting at the program counter. Options B and C are
      invalid GDB syntax.'
  - kind: why-fails
    concept: page-fault-on-unmapped-kernel-entry
    q: If `head.s` enabled paging (`CR0.PG = 1`) but forgot to populate the Page Directory
      in `CR3`, what happens the moment the CPU fetches the instruction at `0x6771`?
    choices:
    - The CPU automatically falls back to 16-bit real mode and executes the BIOS power-on
      self test
    - The CPU raises a Page Fault exception (#PF, vector 14) because no valid page
      table translates 0x6771
    - GDB displays a warning and pauses execution on line 1 of bootsect.s
    answer: 1
    why: 'Option B is correct: once paging is enabled, every instruction fetch must
      be translated by the MMU; an unmapped address triggers a Page Fault exception
      (`#PF`). Option A is incorrect because CPUs do not auto-revert to real mode.
      Option C is incorrect because hardware faults crash before GDB unless caught.'
  - kind: mcq
    concept: cr0-flags-composition-trace
    q: 'What is the resulting sum when combining CR0 bitflags: PG (0x80000000), ET
      (0x10), MP (0x02), and PE (0x01)?'
    choices:
    - '0x00000013'
    - '0x80000000'
    - '0x80000013'
    answer: 2
    why: 'Option C is correct: `0x80000000 + 0x10 + 0x02 + 0x01 = 0x80000013`. This
      exactly matches the value observed in `eax` in Evidence E-T1A-07.'
  - kind: fillblank
    concept: control-register-paging-name
    q: The x86 CPU control register that contains the Paging Enable (PG) and Protection
      Enable (PE) bitflags is ________.
    code: 'Register: %________'
    answer_text: cr0
    why: Control Register 0 (`cr0`) contains the core processor operating mode flags
      including PE, MP, EM, TS, ET, NE, WP, AM, NW, CD, and PG.
  - kind: mcq
    from_chapter: T0B
    from_block: b6
    concept: git-object-vs-cpu-state-interleave
    q: In Chapter T0b, we inspected immutable historical Git commits using `git cat-file
      -p`. How does inspecting CPU registers via `info registers` contrast with inspecting
      a Git commit object?
    choices:
    - info registers inspects ephemeral, mutable hardware state of a live processor,
      while Git objects are immutable historical files on disk
    - info registers only reads committed files from the master branch of early-history.git
    - info registers requires compiling a new kernel module every time a register
      changes
    answer: 0
    why: 'Option A is correct: CPU registers represent volatile, live silicon execution
      state that changes with every clock cycle, whereas Git objects are static, immutable
      historical records. Options B and C are incorrect.'
- id: b13
  title: 'Observation Strategy: Choosing Between Breakpoints, Watchpoints, and Tracing'
  type: design
  explain_md: "### 1. Frame the Problem\nEvery measurement disturbs the system it\
    \ measures—in software, this is known as the **Probe Effect** or Heisenberg Bug.\
    \ \n\nIf you set a software breakpoint inside a high-speed network interrupt handler\
    \ running at 1,000,000 packets per second, the breakpoint will freeze the CPU.\
    \ The hardware network card's ring buffers will instantly overflow, dropping packets.\
    \ TCP connections across the network will time out, and watchdog timers will trigger\
    \ kernel panics. The very act of observing the bug destroys the conditions needed\
    \ to reproduce it!\n\nChoosing the right observational instrument is the hallmark\
    \ of an expert kernel engineer.\n\n### 2. The Notional Machine\nLet us evaluate\
    \ the four primary systems observation archetypes:\n\n```text\n+-------------------------------------------------------------------------------------------------+\n\
    |                                 SYSTEMS OBSERVATION MATRIX                 \
    \                     |\n+-------------------+----------------------+-----------------------------+------------------------+\n\
    | Technique         | Execution Impact     | Hardware Scalability        | Optimal\
    \ Use Case       |\n+-------------------+----------------------+-----------------------------+------------------------+\n\
    | GDB Software Break| Freezes entire CPU / | Unlimited count             | Complex\
    \ logic errors   |\n| (break)           | process; modifies RAM| (patches RAM\
    \ with 0xCC)     | in deterministic test  |\n|                   | with 0xCC \
    \           |                             | userspace workloads    |\n+-------------------+----------------------+-----------------------------+------------------------+\n\
    | GDB Hardware Break| Freezes entire CPU / | Strictly limited to 4       | Early\
    \ bootloader, ROM, |\n| (hbreak)          | process; 0 RAM patch | address registers\
    \ (DR0-DR3) | reset vectors, and     |\n|                   |                \
    \      |                             | pre-IDT bootstrap      |\n+-------------------+----------------------+-----------------------------+------------------------+\n\
    | Hardware Watchpt  | Freezes CPU on data  | Strictly limited to 4       | Catching\
    \ mystery memory|\n| (watch)           | write or read        | address registers\
    \ (DR0-DR3) | corruption, wild stores|\n|                   |                \
    \      |                             | and buffer overruns    |\n+-------------------+----------------------+-----------------------------+------------------------+\n\
    | Non-Halting Trace | Zero halting; sub-   | Thousands of tracepoints;   | High-frequency\
    \ paths,  |\n| (ftrace / eBPF /  | microsecond logging  | buffered ring buffer\
    \ in     | timer interrupts, lock |\n| printk)           | overhead          \
    \   | kernel memory               | contention, networking |\n+-------------------+----------------------+-----------------------------+------------------------+\n\
    ```\n\n### 3. Source-Grounded Walkthrough\nConsider three real engineering diagnostic\
    \ scenarios:\n\n- **Scenario A (Early Boot Verification - Evidence `E-T1A-07`)**:\n\
    \  You need to verify that `setup.s` enters 32-bit protected mode. Execution is\
    \ in the first few thousand cycles of machine life.\n  *Optimal Choice*: `hbreak\
    \ main`. Halting the single-threaded vCPU is completely safe, and `hbreak` avoids\
    \ corrupting memory before the IDT is ready.\n\n- **Scenario B (Memory Corruption\
    \ - Evidence `E-T1A-04`)**:\n  A global variable `dev->status` flips from `1`\
    \ to `0` intermittently once every hour. You have no idea which of 40 functions\
    \ caused it.\n  *Optimal Choice*: `watch dev->status`. The hardware watchpoint\
    \ monitors the bus at full silicon speed and halts the exact instruction committing\
    \ the store.\n\n- **Scenario C (High-Throughput Packet Processing)**:\n  A 10GbE\
    \ network driver drops 2% of packets under heavy traffic. Setting a breakpoint\
    \ halts the CPU, overflowing hardware queues and dropping 100% of packets!\n \
    \ *Optimal Choice*: Non-halting tracing (`ftrace` or `bpftrace`, covered in T3/T5).\
    \ The kernel logs timestamps and buffer lengths into a ring buffer in microseconds\
    \ without pausing execution.\n\n### 4. The Failure Mode & Boundary\nThe fatal\
    \ error is using halting debuggers (GDB breakpoints) in timing-sensitive environments:\n\
    1. Setting a breakpoint while holding a spinlock in SMP kernels causes other CPU\
    \ cores to spin forever, tripping the kernel watchdog timer (`NMI watchdog: BUG:\
    \ soft lockup - CPU#1 stuck`).\n2. Setting a breakpoint in a real-time motor controller\
    \ causes physical hardware to overshoot because feedback loops freeze.\n\n###\
    \ 5. The Compressed Mental Axiom\n*Freeze the world with GDB when logic is elusive;\
    \ stream the world with tracing when timing is vital.*"
  diagram:
    kind: flow
    caption: Observation Instrument Selection Decision Tree
    nodes:
    - id: problem
      label: Diagnostic Problem
      shape: round
    - id: timing
      label: Can CPU execution be paused?
      shape: decision
    - id: trace_choice
      label: Non-Halting Tracing (ftrace / eBPF)
      shape: box
    - id: what
      label: Are you trapping data or execution?
      shape: decision
    - id: watch_choice
      label: Hardware Watchpoint (watch)
      shape: box
    - id: early
      label: Is it early boot or ROM?
      shape: decision
    - id: hbreak_choice
      label: Hardware Breakpoint (hbreak)
      shape: box
    - id: break_choice
      label: Software Breakpoint (break)
      shape: box
    edges:
    - from: problem
      to: timing
      label: evaluate constraint
    - from: timing
      to: trace_choice
      label: 'NO: timing-sensitive / network / ISR'
    - from: timing
      to: what
      label: 'YES: halting is safe'
    - from: what
      to: watch_choice
      label: Data Mutation / Corruption
    - from: what
      to: early
      label: Execution Path
    - from: early
      to: hbreak_choice
      label: 'YES: early boot / pre-IDT / ROM'
    - from: early
      to: break_choice
      label: 'NO: normal userspace / kernel C'
    steps:
    - focus:
      - problem
      - timing
      - trace_choice
      note: If halting causes timeouts or drops packets, use non-halting tracing
    - focus:
      - timing
      - what
      - watch_choice
      note: If a variable corrupts unpredictably, use hardware watchpoints
    - focus:
      - what
      - early
      - hbreak_choice
      - break_choice
      note: Choose between hbreak (pre-IDT/ROM) and break (standard RAM code)
  example:
    lang: text
    code: '# Diagnostic instrument selection summary

      - Early boot / ROM / pre-IDT:      hbreak *0x7c00

      - Unknown memory corruption:       watch *0x555555558010

      - Deterministic userspace bug:     break socket_probe

      - High-frequency timer interrupt:  ftrace / tracepoint (non-halting)'
    explain_md: Choosing the appropriate instrument matches diagnostic capability
      to hardware timing constraints.
  checks:
  - kind: eipe
    concept: evaluating-halting-vs-tracing
    q: You are diagnosing an intermittent packet drop in a high-speed network device
      driver running under heavy traffic. Which diagnostic technique provides accurate
      telemetry without exacerbating packet loss?
    choices:
    - Setting a GDB software breakpoint at the entry of the packet receive interrupt
      handler
    - Non-halting dynamic tracing (ftrace or eBPF) logging queue metrics into a memory
      ring buffer
    - Inserting sleep(1) calls inside the critical receive loop to slow down incoming
      packets
    answer: 1
    why: 'Option B is correct: non-halting tracing logs events with sub-microsecond
      latency without pausing the CPU, preserving packet processing. Option A is incorrect
      because pausing the CPU overflows hardware FIFO rings and drops 100% of packets.
      Option C worsens queue congestion.'
  - kind: choose-better
    concept: selecting-watchpoint-for-corruption
    q: An operating system variable `current->flags` gets corrupted with random bytes
      once every two hours. You do not know which thread or driver does it. Which
      tool isolates the guilty code line most effectively?
    choices:
    - Compiler optimization set to -O3
    - GDB software breakpoint on sys_read
    - Hardware data watchpoint on current->flags
    answer: 2
    why: 'Option C is correct: a hardware watchpoint arms CPU debug registers to trap
      the exact machine instruction performing the store, regardless of caller or
      thread. Option B is incorrect because sys_read may not be involved. Option A
      does not diagnose memory bugs.'
  - kind: why-fails
    concept: breakpoint-inside-spinlock-failure
    q: A kernel developer sets a GDB breakpoint inside a spinlock critical section
      on an SMP system. Why does this cause other CPU cores to panic or report soft
      lockups?
    choices:
    - The halted core holds the spinlock while paused, causing all other cores to
      spin indefinitely waiting for release
    - GDB automatically sends power-off signals to all other CPU cores upon hitting
      a breakpoint
    - Spinlocks cannot be executed on processors that have hardware debug registers
      enabled
    answer: 0
    why: 'Option A is correct: spinlocks disable preemption and expect locks to be
      released in nanoseconds. Halting the lock holder under GDB leaves the lock acquired,
      deadlocking other cores that spin until the watchdog timer panics. Options B
      and C are incorrect.'
  - kind: spot-bug
    concept: halting-debugger-in-realtime-control
    q: Examine the diagnostic plan and observed failure log. What is the catastrophic
      flaw in using a breakpoint here?
    code: "/* PID velocity control loop */\nwhile (motor_active) {\n    speed = read_tachometer();\n\
      \    update_pwm(target - speed);\n}"
    diagnostic_log: 'Breakpoint 1 hit at update_pwm()

      [EMERGENCY STOP]: Physical arm exceeded hard stop limit by 42 degrees during
      debugger pause.'
    choices:
    - GDB breakpoints are ignored by C programs that control physical motors
    - Freezing the CPU halts the feedback control loop while physical motors continue
      moving, causing physical crashes
    - Real-time controllers are required by law to run only on bare-metal 8086 processors
    answer: 1
    why: 'Option B is correct: halting the processor stops software control while
      hardware inertia continues, leading to physical collisions or damage. Tracing
      or hardware logging must be used instead. Options B and C are incorrect.'
  - kind: mcq
    concept: tracepoint-ring-buffer-advantage
    q: What is the primary architectural advantage of Linux ftrace ring buffers over
      interactive GDB breakpoints?
    choices:
    - They recompile the kernel source code into Python scripts at runtime
    - They permit modifying CPU registers interactively while interrupts are disabled
    - They record high-frequency timestamped events in microseconds without freezing
      execution or dropping network packets
    answer: 2
    why: 'Option C is correct: ftrace logs events into a lockless per-CPU ring buffer
      in memory with minimal overhead, avoiding execution pauses. Options B and C
      are incorrect.'
  - kind: order
    concept: rank-instrument-intrusiveness
    q: Order the 4 observation techniques from least intrusive (lowest execution latency)
      to most intrusive (completely freezes CPU); all displayed lines are used.
    lines:
    - Static tracepoints / ftrace (sub-microsecond memory log)
    - printk logging to kernel ring buffer (I/O formatting overhead)
    - Hardware watchpoint / breakpoint (halts CPU on trigger)
    - Software watchpoint (single-steps every machine instruction)
    answer_order:
    - 0
    - 1
    - 2
    - 3
    why: Ftrace is fastest (sub-microsecond). Printk introduces string formatting.
      Hardware watchpoints pause execution upon trigger. Software watchpoints are
      slowest because they single-step every instruction (1000x slowdown).
