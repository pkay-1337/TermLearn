blocks:
- id: b1
  title: 'Debugger Execution Model: ptrace vs Remote Serial Protocol Stub'
  type: model
  explain_md: "### 1. Frame the Problem\nWhen you run a userspace program under GDB\
    \ and type `break main; run`, how does the debugger freeze a running thread at\
    \ a specific instruction without hardware support? In a normal Linux environment,\
    \ GDB relies on operating system mediation: the kernel exposes the `ptrace(2)`\
    \ system call (`PTRACE_ATTACH`, `PTRACE_CONT`, `PTRACE_PEEKTEXT`). The OS kernel\
    \ handles the trap, suspends the thread, and delivers a `SIGTRAP` signal to GDB.\n\
    \nNow picture the challenge of debugging an operating system kernel itself. When\
    \ you boot Linux, who acts as the host kernel? Nobody. The kernel *is* the operating\
    \ system; there is no supervisor OS to invoke `ptrace`. If the kernel crashes\
    \ or loops, there is no signal handler to catch it.\n\n### 2. The Notional Machine\n\
    To debug bare-metal or virtualized operating systems, the boundary shifts from\
    \ OS system calls to hypervisor emulation:\n\n1. **Userspace Model (`ptrace`)**:\n\
    \   - GDB runs alongside your application as a peer process.\n   - GDB asks the\
    \ host Linux kernel to attach via `ptrace`.\n   - The kernel intercepts process\
    \ execution and reflects control back to GDB via signals.\n\n2. **Hypervisor /\
    \ Kernel Model (QEMU Remote Serial Protocol Stub)**:\n   - QEMU acts as the virtual\
    \ silicon (CPU, RAM, motherboards, bus controllers).\n   - QEMU embeds a dedicated\
    \ GDB stub listening on a TCP socket (by default, port `1234`).\n   - The debugger\
    \ connects over TCP using the GDB Remote Serial Protocol (RSP), exchanging ASCII\
    \ packet streams (such as `$m<addr>,<len>#checksum` to read memory or `$vCont;c#checksum`\
    \ to continue).\n   - QEMU pauses its internal virtual CPU (vCPU) execution loop\
    \ directly without any guest OS cooperation.\n\n### 3. Source-Grounded Walkthrough\n\
    Look at the empirical contrast between the userspace workload in Evidence `E-T1A-03`\
    \ and the QEMU kernel run in Evidence `E-T1A-07`:\n\nIn userspace (`E-T1A-03`):\n\
    ```text\n$ gdb -q -batch -ex \"break socket_probe\" -ex \"run\" ./debugme\nBreakpoint\
    \ 1, socket_probe (fd=7) at debugme.c:5\n...\n[Inferior 1 (process 151076) exited\
    \ normally]\n```\nNotice `[Inferior 1 (process 151076)]`: GDB directly tracked\
    \ a host process ID created via `fork` and monitored via `ptrace`.\n\nNow look\
    \ at the remote kernel session (`E-T1A-07`):\n```text\n$ qemu-system-i386 -m 16M\
    \ -boot a -fda Image -hda hdc-0.11.img -s -S -display none &\n$ gdb -q -batch\
    \ -ex \"file tools/system\" -ex \"target remote :1234\" -ex \"break main\" -ex\
    \ \"continue\"\nBreakpoint 1 at 0x6771: file init/main.c, line 107.\n[Inferior\
    \ 1 (process 1) detached]\n```\nHere, GDB did not spawn a process with `run`.\
    \ It connected across a TCP socket to `:1234`. The inferior was the remote vCPU\
    \ inside QEMU.\n\n### 4. The Failure Mode & Boundary\nBecause GDB in remote mode\
    \ is talking to an external emulator rather than managing a local process, issuing\
    \ `run` inside GDB will fail:\n```text\n(gdb) run\nThe \"remote\" target does\
    \ not support \"run\". Try \"help target\" or \"continue\".\n```\nFurthermore,\
    \ if QEMU has not been started with `-s` or is blocked, GDB fails instantly with:\n\
    ```text\n:1234: Connection refused.\n```\n\n### 5. The Compressed Mental Axiom\n\
    *Userspace GDB borrows the kernel's ptrace eye; remote kernel GDB talks to the\
    \ hypervisor's wire protocol over TCP.*"
  diagram:
    kind: flow
    caption: 'Debugger Architecture: Userspace ptrace vs Hypervisor RSP Stub'
    nodes:
    - id: gdb_user
      label: GDB (Userspace)
      shape: box
    - id: kernel
      label: Host Linux Kernel (ptrace)
      shape: decision
    - id: proc
      label: Inferior Process (PID 151076)
      shape: box
    - id: gdb_rem
      label: GDB (Remote Host)
      shape: box
    - id: tcp
      label: TCP Socket (:1234)
      shape: io
    - id: qemu
      label: QEMU Virtual Machine (vCPU)
      shape: box
    edges:
    - from: gdb_user
      to: kernel
      label: ptrace syscall
    - from: kernel
      to: proc
      label: SIGTRAP / freeze
    - from: gdb_rem
      to: tcp
      label: RSP packet stream
    - from: tcp
      to: qemu
      label: pause vCPU execution
    steps:
    - focus:
      - gdb_user
      - kernel
      - proc
      note: 'Userspace: kernel traps inferior and sends signal to GDB'
    - focus:
      - gdb_rem
      - tcp
      - qemu
      note: 'Kernel: QEMU hypervisor pauses vCPU over TCP Remote Serial Protocol'
  viz:
    kind: ascii-memory
    caption: Remote Serial Protocol Packet Handoff
    steps:
    - '[Step 1: GDB Transmits RSP Query Over TCP] · Regs: gdb_socket=fd 3, port=1234
      · State: TCP Buffer Out: $qSupported:multiprocess+;swbreak+;hwbreak+#df | QEMU
      Stub State: Listening on 0.0.0.0:1234 · (GDB opens connection and probes hypervisor
      stub capabilities)'
    - '[Step 2: QEMU Replies and Freezes Virtual CPU] · Regs: vcpu_state=HALTED, eip=0xfff0
      · State: TCP Buffer In: $PacketSize=1000;hwbreak+;qXfer:features:read+#d0 |
      Guest vCPU: Paused at power-on reset vector 0x0000fff0 · (QEMU acknowledges
      packet and maintains vCPU execution freeze)'
  example:
    lang: text
    code: '# Connecting GDB to QEMU''s Remote Serial Protocol stub over TCP

      $ gdb -q -ex "file tools/system" -ex "target remote :1234"

      Remote debugging using :1234

      0x0000fff0 in do_execve () at exec.c:199

      (gdb) info registers eip

      eip            0xfff0              0xfff0 <startup_32+65520>'
    explain_md: GDB connects over TCP port 1234 to QEMU without starting a local process.
      It queries initial register state directly from the virtual CPU reset vector.
  checks:
  - kind: choose-better
    concept: debugger-execution-boundary
    q: What fundamental architectural mechanism allows GDB to freeze and inspect an
      operating system kernel running inside QEMU?
    choices:
    - QEMU implements an embedded GDB Remote Serial Protocol (RSP) stub over a TCP
      socket
    - The guest operating system executes host Linux ptrace system calls during early
      boot
    - GDB compiles kernel C source files into native host shared libraries on the
      fly
    answer: 0
    why: 'Option A is correct: QEMU acts as the virtual hardware emulator and implements
      an RSP stub on TCP port 1234 that freezes the virtual CPU loop. Option B is
      incorrect because the guest kernel runs on bare virtual hardware and has no
      host ptrace mechanism. Option C is incorrect because GDB does not recompile
      source files into host libraries.'
  - kind: why-fails
    concept: remote-target-run-error
    q: 'After connecting GDB to QEMU via `target remote :1234`, you type `run` and
      GDB outputs:

      `The "remote" target does not support "run". Try "help target" or "continue".`

      Why does this command fail?'
    choices:
    - The unstripped kernel image was compiled with optimization flags that block
      the run command
    - Remote targets are already running or paused; execution must be resumed using
      continue
    - The host Linux kernel requires elevated root privileges before permitting the
      run command
    answer: 1
    why: 'Option B is correct: in remote debugging, QEMU is already managing the execution
      state, so GDB cannot spawn or create a new process; it must resume execution
      with `continue`. Option A is incorrect because compiler optimization has no
      bearing on remote target commands. Option C is incorrect because root permissions
      do not change GDB''s remote target semantics.'
  - kind: predict
    concept: remote-connection-refusal
    q: You run `gdb -q -ex "target remote :1234"` on a machine where QEMU has not
      been launched. What error message does GDB display?
    choices:
    - 'Kernel panic: unable to mount root filesystem on unknown block.'
    - Program received signal SIGSEGV, Segmentation fault.
    - ':1234: Connection refused.'
    answer: 2
    why: 'Option C is correct: GDB attempts a standard TCP connection to localhost:1234,
      which fails immediately with Connection refused when no process is listening.
      Option B is incorrect because connection failure does not trigger a segmentation
      fault in GDB. Option A is incorrect because the guest kernel has not even been
      booted.'
  - kind: choose-better
    concept: evaluating-debugger-channels
    q: You need to debug an operating system bootloader before it has configured memory
      paging or interrupt handlers. Which debugging approach succeeds without requiring
      guest operating system services?
    choices:
    - Attach GDB to the hypervisor's remote RSP stub over TCP
    - Invoke ptrace(PTRACE_ATTACH) from a background userspace monitor
    - Insert printf statements directed to standard output inside bootsect.s
    answer: 0
    why: 'Option A is correct: hypervisor RSP debugging operates outside the virtual
      machine, inspecting hardware registers and RAM independently of guest OS state.
      Option B is incorrect because ptrace requires a running host kernel and task
      structures which do not exist inside bare guest silicon. Option C is incorrect
      because printf requires standard C runtime library infrastructure not present
      in raw bootloader sectors.'
  - kind: fillblank
    concept: remote-protocol-acronym
    q: GDB communicates with QEMU's embedded stub over TCP using ASCII packets defined
      by the GDB ________ Serial Protocol.
    code: GDB <token> Serial Protocol (RSP)
    answer_text: Remote
    why: The protocol is officially named the GDB Remote Serial Protocol (RSP). It
      is an ASCII-based request-response wire protocol originally designed for serial
      lines and now used over TCP.
  - kind: order
    concept: remote-kernel-attach-sequence
    q: Order the 4 steps required to connect GDB to a halted QEMU kernel session;
      all displayed lines are used.
    lines:
    - Launch QEMU with -s -S flags to start the GDB stub and freeze the vCPU
    - Start GDB loading the unstripped kernel ELF binary symbols with file
    - Connect GDB to the hypervisor stub using target remote :1234
    - Resume guest execution towards the target breakpoint using continue
    answer_order:
    - 0
    - 1
    - 2
    - 3
    why: First, QEMU must be running and listening with `-s -S`. Second, GDB loads
      local symbols with `file`. Third, GDB connects over the network socket with
      `target remote :1234`. Fourth, GDB commands the remote CPU to resume execution
      with `continue`.
- id: b2
  title: 'GDB Fundamental Controls: Breakpoints, Inspection, and Registers'
  type: syntax
  explain_md: "### 1. Frame the Problem\nNavigating a systems program without breakpoints\
    \ is like driving in the dark: you launch the binary, it runs to completion or\
    \ crashes, and you are left guessing what happened. To diagnose problems, you\
    \ need fine-grained controls to pause execution, inspect variable values in multiple\
    \ formats, and examine the CPU's physical registers.\n\n### 2. The Notional Machine\n\
    GDB interacts with machine state through three primary operational axes:\n\n1.\
    \ **Breakpoints (`break` / `b`)**:\n   - Sets an execution trap at a symbol name\
    \ (`break socket_probe`) or source coordinate (`break debugme.c:12`).\n   - Resolves\
    \ the symbolic function name to a 64-bit or 32-bit instruction address using the\
    \ ELF `.debug_info` DWARF table.\n   - When the CPU's instruction pointer matches\
    \ this address, execution suspends before the instruction executes.\n\n2. **Variable\
    \ & Expression Inspection (`print` / `p`)**:\n   - `print expr`: Evaluates the\
    \ expression in the current scope and prints it in natural format.\n   - Format\
    \ specifiers:\n     - `print /x expr`: Hexadecimal format (essential for memory\
    \ addresses, masks, and bitflags).\n     - `print /d expr`: Signed decimal.\n\
    \     - `print /t expr`: Binary format (inspecting individual bitfields).\n\n\
    3. **Silicon Register Inspection (`info registers`)**:\n   - Dumps the exact machine\
    \ register file of the active CPU:\n     - x86_64: `rax`, `rbx`, `rcx`, `rdx`,\
    \ `rsi`, `rdi`, `rbp`, `rsp`, `r8`-`r15`, `rip`.\n     - i386: `eax`, `ebx`, `ecx`,\
    \ `edx`, `esi`, `edi`, `ebp`, `esp`, `eip`.\n   - Disassembling machine instructions:\
    \ `x/Ni $rip` examines $N$ machine instructions starting at the instruction pointer.\n\
    \n### 3. Source-Grounded Walkthrough\nLook at the session in Evidence `E-T1A-03`:\n\
    ```text\n$ gdb -q -batch -ex \"break socket_probe\" -ex \"run\" -ex \"print fd\"\
    \ -ex \"info registers\" ./debugme\nBreakpoint 1 at 0x1144: file debugme.c, line\
    \ 5.\nBreakpoint 1, socket_probe (fd=7) at debugme.c:5\n5\t    int doubled = fd\
    \ * 2;\n$1 = 7\n```\nNotice what happened:\n1. `break socket_probe` resolved the\
    \ symbol to address `0x1144`.\n2. `run` initiated execution; GDB trapped at entry\
    \ to `socket_probe`.\n3. `print fd` reported `$1 = 7`.\n4. The instruction pointer\
    \ (`rip` or `eip`) was parked right on line 5 *before* `doubled` was computed.\n\
    \n### 4. The Failure Mode & Boundary\nIf a binary was built without debug symbols\
    \ (missing `-g`) or stripped with `strip`, GDB will fail to map addresses to C\
    \ source lines:\n```text\n(gdb) break socket_probe\nFunction \"socket_probe\"\
    \ not defined.\nMake breakpoint pending on future shared library load? (y or [n])\n\
    ```\nWithout `.debug_info`, GDB cannot read local variable names (`No symbol \"\
    fd\" in current context.`), forcing you to inspect raw registers instead.\n\n\
    ### 5. The Compressed Mental Axiom\n*Break sets the trap, run starts the race,\
    \ and info registers freeze-frames the silicon.*"
  diagram:
    kind: flow
    caption: GDB Breakpoint Resolution and State Inspection Cycle
    nodes:
    - id: src
      label: break socket_probe
      shape: round
    - id: dwarf
      label: DWARF Symbol Table (.debug_info)
      shape: box
    - id: addr
      label: Address 0x1144 (Text Offset)
      shape: box
    - id: run
      label: run / continue
      shape: box
    - id: trap
      label: 'Trap Hit: CPU Suspended'
      shape: decision
    - id: inspect
      label: print /x & info registers
      shape: io
    edges:
    - from: src
      to: dwarf
      label: lookup symbol
    - from: dwarf
      to: addr
      label: resolves offset
    - from: addr
      to: run
      label: sets trap
    - from: run
      to: trap
      label: execution reaches PC
    - from: trap
      to: inspect
      label: query CPU registers
    steps:
    - focus:
      - src
      - dwarf
      - addr
      note: Breakpoint maps C symbol to concrete virtual address
    - focus:
      - addr
      - run
      - trap
      note: Execution halts as soon as program counter reaches trap address
    - focus:
      - trap
      - inspect
      note: Developer inspects live registers and memory state
  example:
    lang: c
    code: "#include <stdio.h>\n\nint main(void)\n{\n    int counter = 0x42;\n    printf(\"\
      counter=%d\\n\", counter);\n    return 0;\n}"
    run_expected: 'counter=66

      '
    explain_md: A standalone C application containing an initialized variable that
      can be observed in hexadecimal format with print /x counter under GDB.
  checks:
  - kind: choose-better
    concept: gdb-format-specifiers
    q: You are debugging a driver and need to inspect an integer variable `flags`
      as a raw hexadecimal value in GDB. Which command achieves this?
    choices:
    - format hex flags
    - print /x flags
    - dump memory flags
    answer: 1
    why: 'Option B is correct: `print /x` formats the expression in hexadecimal. Option
      A is incorrect because `format` is not a valid GDB inspection command. Option
      C is incorrect because `dump memory` is used to dump memory ranges to a file,
      not format variables to the terminal.'
  - kind: why-fails
    concept: stripped-binary-symbol-failure
    q: 'You launch GDB against a production binary and execute `break socket_probe`.
      GDB responds with:

      `Function "socket_probe" not defined.`

      Why did GDB fail to set the breakpoint by function name?'
    choices:
    - The socket_probe function was renamed to main by the linker during object code
      packaging
    - GDB only supports setting breakpoints on functions declared inside the standard
      C library
    - The binary was stripped or built without the -g compiler flag, omitting debug
      symbols
    answer: 2
    why: 'Option C is correct: without the `-g` compiler flag, GCC omits DWARF symbol
      tables (`.debug_info`), preventing GDB from resolving function names to virtual
      addresses. Option B is incorrect because GDB supports user-defined functions.
      Option A is incorrect because linkers do not rename functions to `main`.'
  - kind: predict
    concept: register-inspection-output
    q: 'Given the output from Evidence E-T1A-07 where GDB halts at `main`: `eip 0x6771
      <main>`, what does GDB print if you execute `print /x $eip`?'
    choices:
    - $1 = 0x6771
    - $1 = 26481
    - $1 = main
    answer: 0
    why: 'Option A is correct: `print /x $eip` evaluates the instruction pointer register
      and prints its exact value formatted in hexadecimal. Option B is incorrect because
      that is the decimal representation. Option C is incorrect because `/x` prints
      numeric hexadecimal values rather than symbolic strings.'
  - kind: fillblank
    concept: disassembly-inspection-command
    q: To disassemble and display the next 8 machine instructions starting at the
      instruction pointer, you execute `________ $rip` (or `$eip` on 32-bit systems).
    code: <command> $rip
    answer_text: x/8i
    why: The command `x/8i $rip` uses the examine (`x`) command with count 8 and format
      `i` (instruction) to disassemble machine code from the current instruction pointer.
  - kind: order
    concept: breakpoint-lifecycle
    q: Order the 4 steps to set a breakpoint, start a program, and inspect a local
      variable in GDB; all displayed lines are used.
    lines:
    - Launch GDB targeting the compiled executable binary
    - Set a breakpoint on the target function using break <func>
    - Start process execution using the run command
    - Inspect the paused variable value using print <var>
    answer_order:
    - 0
    - 1
    - 2
    - 3
    why: First, start GDB with the binary. Second, set the breakpoint before execution
      begins. Third, execute `run` to start the program until the trap triggers. Fourth,
      inspect local variables while paused.
  - kind: mcq
    from_chapter: T0A
    from_block: b2
    concept: compiler-debug-flags-prereq
    q: Which compiler flag must be passed to GCC during compilation so that GDB can
      map machine addresses back to source code lines and variable names?
    choices:
    - -O3
    - -g
    - -shared
    answer: 1
    why: 'Option B is correct: `-g` generates DWARF debugging information in the ELF
      binary. Option A is incorrect because `-O3` enables aggressive optimization
      which can inline or eliminate variables. Option C is incorrect because `-shared`
      produces a shared library rather than debug info.'
- id: b3
  title: 'Execution Flow Navigation: Stepping, Nexting, and Stack Frames'
  type: syntax
  explain_md: "### 1. Frame the Problem\nWhen execution pauses at a breakpoint, how\
    \ do you advance through your code without setting twenty more breakpoints? If\
    \ you have a statement containing a complex function call like `int result = socket_probe(fd);`,\
    \ you face a fundamental choice: do you want to step *into* that function and\
    \ trace its internal implementation, or do you want to step *over* it and observe\
    \ its final return value?\n\n### 2. The Notional Machine\nGDB provides three primary\
    \ stepping verbs and a stack navigation hierarchy:\n\n1. **Step (`step` / `s`)**:\n\
    \   - Advances execution by exactly one source line.\n   - If the line contains\
    \ a function call, execution **descends into** the callee, stopping at the first\
    \ line of the called function.\n\n2. **Next (`next` / `n`)**:\n   - Advances execution\
    \ by one source line **stepping over** function calls.\n   - The callee executes\
    \ to completion at full hardware speed without pausing, and GDB halts on the very\
    \ next source line in the current function.\n\n3. **Finish (`finish` / `fin`)**:\n\
    \   - Resumes execution until the current stack frame returns to its caller.\n\
    \   - Prints the value returned by the function upon exit.\n\n4. **Stack Frame\
    \ Navigation (`backtrace`, `frame`)**:\n   - Every function invocation creates\
    \ an activation record (stack frame) containing saved registers, local variables,\
    \ and the return address.\n   - `backtrace` (`bt`): Prints the active call stack\
    \ from leaf frame `#0` up to `#N`.\n   - `frame <N>`: Switches GDB's inspection\
    \ context to frame $N$, allowing you to inspect caller variables without altering\
    \ the instruction pointer.\n\n### 3. Source-Grounded Walkthrough\nExamine Evidence\
    \ `E-T1A-05`:\n```text\n(gdb) break main\n(gdb) run\nBreakpoint 1, main () at\
    \ debugme.c:12\n12\t    int fd = 7;\n(gdb) next\n13\t    int result = socket_probe(fd);\n\
    (gdb) step\nsocket_probe (fd=7) at debugme.c:5\n5\t    int doubled = fd * 2;\n\
    (gdb) bt\n#0  socket_probe (fd=7) at debugme.c:5\n#1  0x0000555555555186 in main\
    \ () at debugme.c:13\n(gdb) finish\n0x0000555555555186 in main () at debugme.c:13\n\
    13\t    int result = socket_probe(fd);\nValue returned is $1 = 14\n```\nTrace\
    \ the exact transitions:\n1. At line 13, `step` descended into `socket_probe`.\n\
    2. `bt` showed frame `#0` (`socket_probe`) stacked on top of frame `#1` (`main`).\n\
    3. `finish` executed the rest of `socket_probe` and returned to line 13 of `main`,\
    \ capturing `Value returned is $1 = 14`.\n\n### 4. The Failure Mode & Boundary\n\
    What happens if you run `finish` when you are already in the top-level `main()`\
    \ function?\n```text\n(gdb) finish\n\"finish\" not meaningful in the outermost\
    \ frame.\n```\nBecause `main()` is the root frame of the program's call tree,\
    \ there is no parent C frame to return to. To finish the program, you must type\
    \ `continue`.\n\n### 5. The Compressed Mental Axiom\n*Next steps over the chasm,\
    \ step dives into the callee, and finish climbs back to the caller.*"
  diagram:
    kind: flow
    caption: 'Stack Navigation: Step into, Next over, and Finish to Caller'
    nodes:
    - id: callsite
      label: 'main(): line 13: result = socket_probe(fd)'
      shape: box
    - id: choice
      label: Stepping Choice
      shape: decision
    - id: next_node
      label: 'next: Execute atomic call'
      shape: box
    - id: step_node
      label: 'step: Enter callee frame #0'
      shape: box
    - id: body
      label: 'socket_probe(): line 5: doubled = fd * 2'
      shape: box
    - id: finish_node
      label: 'finish: Run to return statement'
      shape: box
    - id: ret
      label: 'main(): line 14: printf("result=%d")'
      shape: box
    edges:
    - from: callsite
      to: choice
      label: at line 13
    - from: choice
      to: next_node
      label: next
    - from: next_node
      to: ret
      label: halts on line 14
    - from: choice
      to: step_node
      label: step
    - from: step_node
      to: body
      label: 'enters leaf frame #0'
    - from: body
      to: finish_node
      label: finish
    - from: finish_node
      to: ret
      label: returns value $1=14
    steps:
    - focus:
      - callsite
      - choice
      - next_node
      - ret
      note: Next executes the entire function call atomically without pausing inside
    - focus:
      - callsite
      - choice
      - step_node
      - body
      note: 'Step descends into the function body creating new frame #0'
    - focus:
      - body
      - finish_node
      - ret
      note: 'Finish executes remaining instructions in frame #0 and returns to caller'
  example:
    lang: c
    code: "#include <stdio.h>\n\nstatic int compute(int x)\n{\n    return x * 3;\n\
      }\n\nint main(void)\n{\n    int val = 4;\n    int res = compute(val);\n    printf(\"\
      res=%d\\n\", res);\n    return 0;\n}"
    run_expected: 'res=12

      '
    explain_md: 'Stepping into compute(val) with step enters frame #0; typing finish
      immediately completes compute and reports the return value.'
  checks:
  - kind: choose-better
    concept: step-vs-next-semantics
    q: 'You are paused on line 13: `int result = socket_probe(fd);`. Which command
      executes the entire helper function atomically and halts on the following line
      without descending into its source code?'
    choices:
    - finish
    - step
    - next
    answer: 2
    why: 'Option C is correct: `next` executes the function call atomically without
      descending into it. Option B is incorrect because `step` enters the callee function
      body. Option A is incorrect because `finish` executes until the current frame
      returns, which is not applicable before entering.'
  - kind: why-fails
    concept: finish-in-outermost-frame
    q: 'While paused at line 12 of `main()` in `debugme.c`, you issue the command
      `finish`. GDB prints:

      `"finish" not meaningful in the outermost frame.`

      Why does this command fail?'
    choices:
    - main is the root frame of the program and has no caller C frame to return to
    - The function was compiled with static linkage, preventing stack frame unwinding
    - The finish command requires passing an explicit return value as an argument
    answer: 0
    why: 'Option A is correct: `finish` runs until the current frame returns to its
      caller; because `main()` is the outermost frame in the user application, GDB
      cannot return to a caller frame. Option B is incorrect because linkage does
      not alter frame semantics. Option C is incorrect because `finish` takes no arguments.'
  - kind: predict
    concept: backtrace-frame-identification
    q: You step into `socket_probe()` from `main()`. When you execute `bt`, what frame
      number corresponds to the currently active executing function?
    choices:
    - '#1'
    - '#0'
    - '#2'
    answer: 1
    why: 'Option B is correct: frame `#0` is always the innermost, actively executing
      leaf frame on the stack. Frame `#1` is its immediate caller.'
  - kind: mcq
    concept: stack-frame-traversal-trace
    q: What frame's local variables are visible when you execute `frame 1` after stepping
      from `main()` into `socket_probe()`?
    choices:
    - No local variables are visible because switching frames invalidates memory inspection
    - The local variables of socket_probe() are visible because frame 1 forces execution
      forward
    - The local variables of main() are visible while execution remains paused in
      socket_probe()
    answer: 2
    why: 'Option C is correct: `frame 1` changes GDB''s inspection context to frame
      `#1` (`main`), allowing inspection of `main`''s locals while the program remains
      paused inside `socket_probe`. Option B is incorrect because frame 0 is `socket_probe`.
      Option A is incorrect because inspecting frames does not invalidate memory.'
  - kind: fillblank
    concept: stack-backtrace-abbreviation
    q: The short standard abbreviation for the GDB command that displays the full
      call stack backtrace is ________.
    code: (gdb) <abbrev>
