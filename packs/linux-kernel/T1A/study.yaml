- id: b10
  title: 'Remote Kernel Attachment: Port Attachment and ELF Symbol Mapping'
  type: algorithm
  explain_md: "### 1. Frame the Problem\nIn remote debugging, a deep separation of\
    \ concerns exists:\n- **QEMU** has the CPU and raw machine instructions, but has\
    \ **zero** knowledge of C source code, function names, or variable types. It only\
    \ sees bytes and registers.\n- **GDB** has the full DWARF symbol table, line numbers,\
    \ and struct layouts, but does **not** execute the code.\n\nHow do you unite the\
    \ two so you can set breakpoints on C function names like `main()` and inspect\
    \ variables while QEMU runs the virtual silicon?\n\n### 2. The Notional Machine\n\
    The Remote Kernel Attachment Architecture operates through a five-step handshake:\n\
    \n```text\n+------------------------+                           +------------------------+\n\
    | GDB CLIENT (Host)      |                           | QEMU HYPERVISOR (Host)\
    \ |\n+------------------------+                           +------------------------+\n\
    \            |                                                     |\n       \
    \     | 1. file tools/system                                |\n            | \
    \   (GDB loads DWARF symbols locally)                |\n            |        \
    \                                             |\n            | 2. target remote\
    \ :1234                             |\n            |----------------- TCP Connect\
    \ ---------------------->|\n            |<---------------- Packet $T05thread:1...\
    \ ------------|\n            |    (QEMU reports vCPU halted at 0xfff0)       \
    \      |\n            |                                                     |\n\
    \            | 3. break main                                       |\n       \
    \     |    (GDB maps 'main' -> address 0x6771 via symbols)  |\n            | \
    \                                                    |\n            | 4. continue\
    \                                         |\n            |----------------- Packet\
    \ $vCont;c ------------------>|\n            |                               \
    \                      |\n            |    (QEMU runs bootloader: bootsect ->\
    \ setup -> head)|\n            |    (QEMU vCPU hits instruction pointer 0x6771)\
    \      |\n            |                                                     |\n\
    \            |<---------------- Packet $T05watch/break... ---------|\n       \
    \     |                                                     |\n            | 5.\
    \ Trap Handoff: GDB displays:                      |\n            |    Breakpoint\
    \ 1, main () at init/main.c:107         |\n            v                     \
    \                                v\n```\n\n### 3. Source-Grounded Walkthrough\n\
    Look at the exact transcript from Evidence `E-T1A-07`:\n```text\n$ gdb -q -batch\
    \ \\\n    -ex \"file tools/system\" \\\n    -ex \"target remote :1234\" \\\n \
    \   -ex \"break main\" \\\n    -ex \"continue\" \\\n    -ex \"bt\" \\\n    -ex\
    \ \"info registers eip esp eax\" \\\n    -ex \"x/8i \\$eip\"\n```\nNow follow\
    \ the output as GDB executes this batch pipeline:\n1. `file tools/system`: GDB\
    \ reads the unstripped 32-bit ELF kernel image from disk, populating symbol offsets.\n\
    2. `target remote :1234`: GDB connects over TCP. Notice what QEMU reported initially:\n\
    \   `0x0000fff0 in do_execve (...)`\n   At power-on, the x86 processor begins\
    \ at reset vector `0x0000fff0`.\n3. `break main`: GDB uses its loaded symbols\
    \ to resolve `main`:\n   `Breakpoint 1 at 0x6771: file init/main.c, line 107.`\n\
    4. `continue`: QEMU unfreezes, boots through `bootsect.s`, transitions to 32-bit\
    \ protected mode in `setup.s`, configures page tables in `head.s`, and leaps into\
    \ `main`:\n   `Breakpoint 1, main () at init/main.c:107`\n   `eip 0x6771 <main>`\n\
    \   `esp 0x27f70 <user_stack+4080>`\n   `eax 0x80000013 -2147483629`\n\n### 4.\
    \ The Failure Mode & Boundary\nIf you forget to load symbols with `file tools/system`\
    \ before setting the breakpoint, GDB has no symbol map:\n```text\n(gdb) target\
    \ remote :1234\n(gdb) break main\nFunction \"main\" not defined.\n```\nWithout\
    \ the unstripped ELF file on the host, you are blind to C symbols and forced to\
    \ set breakpoints on raw hexadecimal addresses like `break *0x6771`.\n\n### 5.\
    \ The Compressed Mental Axiom\n*In remote debugging, GDB brings the map (symbols)\
    \ and QEMU drives the car; use continue, never run.*"
  diagram:
    kind: flow
    caption: Remote Kernel Symbol Loading and Execution Handshake
    nodes:
    - id: gdb
      label: Start GDB Client
      shape: round
    - id: file
      label: file tools/system (Load Symbols)
      shape: box
    - id: attach
      label: target remote :1234
      shape: box
    - id: bp
      label: break main (Resolved to 0x6771)
      shape: box
    - id: cont
      label: continue (Resume vCPU)
      shape: box
    - id: trap
      label: Halted at init/main.c:107
      shape: decision
    edges:
    - from: gdb
      to: file
      label: 1. load ELF map
    - from: file
      to: attach
      label: 2. TCP connection
    - from: attach
      to: bp
      label: 3. arm breakpoint
    - from: bp
      to: cont
      label: 4. unfreeze vCPU
    - from: cont
      to: trap
      label: 5. hit entry point
    steps:
    - focus:
      - gdb
      - file
      note: GDB loads unstripped ELF kernel symbols on the host
    - focus:
      - file
      - attach
      - bp
      note: GDB connects to QEMU on :1234 and resolves symbol 'main' to address 0x6771
    - focus:
      - bp
      - cont
      - trap
      note: Continue resumes execution until QEMU reaches main at line 107
  example:
    lang: text
    code: "# Connecting GDB to QEMU and verifying halted kernel entry state\n(gdb)\
      \ file tools/system\nReading symbols from tools/system...\n(gdb) target remote\
      \ :1234\nRemote debugging using :1234\n(gdb) break main\nBreakpoint 1 at 0x6771:\
      \ file init/main.c, line 107.\n(gdb) continue\nContinuing.\nBreakpoint 1, main\
      \ () at init/main.c:107\n107\t{\t\t\t/* The startup routine assumes (well, ...)\
      \ this */"
    explain_md: Loading symbols with file tools/system allows GDB to resolve the main
      entry symbol to address 0x6771 and stop at line 107.
  checks:
  - kind: mcq
    concept: symbol-table-loading-command
    q: Which GDB command loads the DWARF symbol table from an unstripped kernel executable
      file on the host filesystem?
    choices:
    - file <path/to/vmlinux>
    - import symbols <path>
    - target load <path>
    answer: 0
    why: 'Option A is correct: the `file` command loads symbols and execution targets
      from the specified ELF file. Option B is incorrect because `import symbols`
      is not a valid GDB command. Option C is incorrect because `target load` downloads
      code to embedded targets.'
  - kind: why-fails
    concept: run-vs-continue-remote-target
    q: You connect GDB to QEMU via `target remote :1234` and type `run`. GDB returns
      an error and refuses to execute. Why must you use `continue` instead?
    choices:
    - The run command is disabled by the Linux kernel when memory paging is enabled
    - The remote target is already an active running machine instance; you can only
      resume execution, not spawn a new process
    - QEMU's TCP socket port 1234 only accepts commands written in uppercase letters
    answer: 1
    why: 'Option B is correct: `run` tells GDB to fork and spawn a local process;
      remote targets already exist in the hypervisor, so you must use `continue` to
      resume the vCPU. Options B and C are incorrect.'
  - kind: predict
    concept: reset-vector-initial-address
    q: In Evidence E-T1A-07, when GDB first attaches to QEMU at power-on before issuing
      `continue`, what address does the instruction pointer register hold?
    choices:
    - 0x00100000 (1 megabyte boundary)
    - 0x00000000 (NULL pointer address)
    - 0x0000fff0 (the standard x86 CPU hardware reset vector)
    answer: 2
    why: 'Option C is correct: on 80386 and compatible CPUs, power-on reset vector
      begins at physical address `0xffff0` (`CS:IP = 0xf000:0xfff0`). Options B and
      C are incorrect.'
  - kind: order
    concept: remote-kernel-debug-pipeline
    q: Order the 5 commands to load symbols, connect to QEMU, halt at main, and inspect
      the instruction pointer; all displayed lines are used.
    lines:
    - file tools/system
    - target remote :1234
    - break main
    - continue
    - info registers eip
    answer_order:
    - 0
    - 1
    - 2
    - 3
    - 4
    why: First, load symbols with `file`. Second, connect with `target remote :1234`.
      Third, set breakpoint with `break main`. Fourth, resume execution with `continue`.
      Fifth, inspect registers with `info registers eip`.
  - kind: fillblank
    concept: remote-target-connect-syntax
    q: To connect GDB to a remote GDB server running on the local machine at TCP port
      1234, the command is `target remote :________`.
    code: (gdb) target remote :________
    answer_text: '1234'
    why: The command syntax is `target remote :1234` (shorthand for `localhost:1234`).
  - kind: mcq
    from_chapter: T0B
    from_block: b4
    concept: symbol-definition-vs-elf-offset-interleave
    q: In Chapter T0b, we found the canonical definition of functions in .c source
      files. What artifact translates that textual C function name into the hexadecimal
      address `0x6771` loaded into GDB?
    choices:
    - The DWARF debug information embedded in the compiled ELF binary (tools/system)
    - The shell environment variable PATH configured in ~/.bashrc
    - The ripgrep configuration file located in the user home directory
    answer: 0
    why: 'Option A is correct: the compiler and linker emit DWARF debug sections (`.debug_info`,
      `.debug_line`) inside the ELF binary that map source symbols directly to concrete
      memory offsets. Options B and C are incorrect.'
- id: b11
  title: 'Compiler Realities: Inlining, Dead Variables, and Hardware Breakpoints'
  type: model
  explain_md: "### 1. Frame the Problem\nWhen debugging optimized kernels (compiled\
    \ with `-O2`), you will frequently encounter two deeply disorienting phenomena:\n\
    1. You try to print a local variable, and GDB responds with `<optimized out>`.\n\
    2. You set a normal breakpoint on an early bootloader instruction, and the entire\
    \ virtual machine crashes with a Triple Fault reset!\n\nWhy do these happen? The\
    \ answer lies in how compiler optimization reorganizes code and how hardware versus\
    \ software breakpoints operate on silicon.\n\n### 2. The Notional Machine\nLet\
    \ us break down both mechanisms:\n\n1. **Compiler Optimization Side-Effects (`-O2`)**:\n\
    \   - **Register Allocation & Variable Lifetimes**: The compiler keeps variables\
    \ in CPU registers rather than writing them to RAM. Once a variable's value has\
    \ been used, the compiler immediately reuses that register for another calculation.\
    \ When GDB inspects that slot, the variable no longer exists: GDB reports `<optimized\
    \ out>`.\n   - **Function Inlining**: Small functions are not called with a `call`\
    \ instruction; their machine code is pasted directly into the caller. The function\
    \ entry disappears from the call stack!\n\n2. **Software Breakpoints (`break`)**:\n\
    \   - GDB modifies the memory of the target program: it replaces the first byte\
    \ of the target instruction with opcode `0xCC` (`INT 3`).\n   - When the CPU executes\
    \ `0xCC`, it looks up vector 3 in the Interrupt Descriptor Table (IDT).\n   -\
    \ **The Early Boot Trap**: Before the kernel initializes the IDT (in `boot/head.s`),\
    \ the IDT is empty! If the CPU executes `0xCC` without an IDT handler, the CPU\
    \ raises a Double Fault (`#DF`), followed immediately by a Triple Fault, resetting\
    \ the virtual machine!\n   - Furthermore, in Read-Only Memory (ROM) or BIOS flash,\
    \ writing `0xCC` fails because the memory is hardware write-protected.\n\n3. **Hardware\
    \ Breakpoints (`hbreak`)**:\n   - `hbreak` does **not** write to RAM or modify\
    \ any machine code.\n   - It programs the target address into the CPU's hardware\
    \ debug registers (`DR0`-`DR3`).\n   - The CPU's internal hardware comparator\
    \ raises a Debug Exception (`#DB`, vector 1) when the instruction pointer matches,\
    \ without needing any code patch.\n   - Works flawlessly in ROM, read-only memory,\
    \ and early boot!\n\n### 3. Source-Grounded Walkthrough\nConsider debugging Linux\
    \ 0.11 before `head.s` sets up the IDT:\n```text\n(gdb) break *0x7c00\n```\nIf\
    \ you set a software breakpoint at `0x7c00` (`bootsect.s`), GDB writes `0xCC`\
    \ into guest RAM. But the BIOS has not registered an IDT handler for vector 3\
    \ that GDB can intercept cleanly across real mode.\nInstead, using hardware breakpoints:\n\
    ```text\n(gdb) hbreak *0x7c00\nHardware assisted breakpoint 1 at 0x7c00\n(gdb)\
    \ continue\n```\nQEMU's vCPU comparator fires cleanly at `0x7c00` without modifying\
    \ a single byte of memory.\n\n### 4. The Failure Mode & Boundary\nIf you attempt\
    \ to use more than four hardware breakpoints (`hbreak`), GDB will fail:\n```text\n\
    (gdb) hbreak *0x8000\nCannot insert hardware breakpoint: no hardware debug registers\
    \ available.\n```\nx86 silicon provides strictly four debug address registers\
    \ (`DR0`-`DR3`).\n\n### 5. The Compressed Mental Axiom\n*Software breakpoints\
    \ write 0xCC to RAM; hardware breakpoints whisper the address directly to the\
    \ silicon.*"
  diagram:
    kind: art
    caption: Software Breakpoint (0xCC Patch) vs Hardware Breakpoint (DR0 Comparator)
    art: "+-----------------------------------------------------------------------+\n\
      | 1. SOFTWARE BREAKPOINT (break): Modifies Guest RAM                     |\n\
      |                                                                       |\n\
      |  Memory Before: [ 0x89 ] [ 0xe5 ] (mov %esp, %ebp)                    |\n\
      |  Memory After:  [ 0xCC ] [ 0xe5 ] (INT 3 patched by GDB)              |\n\
      |                                                                       |\n\
      |  Execution: CPU executes 0xCC -> Look up IDT[3] -> TRIPLE FAULT if    |\n\
      |             IDT is uninitialized in early boot!                       |\n\
      +-----------------------------------------------------------------------+\n\
      \                                   vs\n+-----------------------------------------------------------------------+\n\
      | 2. HARDWARE BREAKPOINT (hbreak): Zero Memory Modification             |\n\
      |                                                                       |\n\
      |  Memory:        [ 0x89 ] [ 0xe5 ] (Unmodified pristine opcodes)       |\n\
      |  CPU Register:  DR0 = 0x00007c00, DR7 = Local Enable                  |\n\
      |                                                                       |\n\
      |  Execution: CPU bus comparator detects EIP == DR0 -> Halts at native  |\n\
      |             hardware level safely in ROM, bootloaders, and RAM!       |\n\
      +-----------------------------------------------------------------------+"
  viz:
    kind: ascii-memory
    caption: Hardware Debug Register Address Comparator State
    steps:
    - '[Step 1: DR0 Register Armed with Linear Address] · Regs: DR0=0x00007c00, DR7=0x00000001
      (Local Breakpoint DR0) · State: Guest RAM 0x7c00: 0xfa (cli - untouched machine
      code byte) | Guest RAM 0x7c01: 0x31 (xor %ax,%ax - pristine opcodes) · (RAM
      contains original bootloader instructions without 0xCC modifications)'
    - '[Step 2: CPU Bus Hits EIP == DR0] · Regs: eip=0x00007c00, DR6=0xffff0ff1 (B0
      flag set) · State: Interrupt State: Debug Exception #DB raised directly by silicon
      | GDB Client: Notified: Hardware assisted breakpoint hit at 0x7c00 · (Execution
      halts safely before uninitialized IDT is accessed)'
  example:
    lang: text
    code: '# Setting a hardware breakpoint on kernel entry point

      (gdb) hbreak *0x6771

      Hardware assisted breakpoint 1 at 0x6771

      (gdb) continue

      Continuing.

      Breakpoint 1, 0x00006771 in main () at init/main.c:107'
    explain_md: Hardware assisted breakpoints (hbreak) use CPU debug registers DR0-DR3,
      allowing execution to halt without modifying memory bytes.
  checks:
  - kind: mcq
    concept: software-breakpoint-mechanism
    q: How does a standard software breakpoint (`break`) temporarily halt execution
      at a target instruction in memory?
    choices:
    - GDB changes the CPU clock frequency to zero cycles per second
    - GDB overwrites the first byte of the instruction in memory with opcode 0xCC
      (INT 3)
    - GDB injects a permanent kernel system call into the C source code file
    answer: 1
    why: 'Option B is correct: software breakpoints replace the instruction opcode
      byte with `0xCC` (`INT 3`), which triggers a breakpoint trap when executed.
      Options B and C are incorrect.'
  - kind: why-fails
    concept: software-breakpoint-early-boot-triple-fault
    q: Why does setting a software breakpoint in early bootloader code before the
      Interrupt Descriptor Table (IDT) is set up cause a CPU Triple Fault?
    choices:
    - QEMU restricts software breakpoints to processes that have opened an X11 display
      window
    - Early bootloader code runs at 64-bit privilege levels where software breakpoints
      are illegal
    - Executing INT 3 (0xCC) requires a valid IDT entry; without it, the unhandled
      fault cascades into a machine reset
    answer: 2
    why: 'Option C is correct: opcode `0xCC` invokes interrupt vector 3. If the IDT
      has not been populated by the bootloader, the CPU cannot dispatch the interrupt,
      causing a Double Fault and immediate Triple Fault reboot. Options B and C are
      incorrect.'
  - kind: predict
    concept: optimized-out-variable-meaning
    q: 'When debugging an optimized kernel built with `-O2`, you execute `print buffer_head`
      and GDB displays:

      `$1 = <optimized out>`

      What does this output mean?'
    choices:
    - The compiler eliminated or recycled the register holding the variable because
      its value was no longer needed
    - The variable was identified as a security vulnerability and erased from memory
      by the kernel
    - GDB encountered a syntax error while reading the English dictionary file
    answer: 0
    why: 'Option A is correct: compiler optimization (`-O2`) aggressively reuses registers
      and eliminates dead variables once their value has been consumed, leaving no
      storage location for GDB to inspect. Options B and C are incorrect.'
  - kind: choose-better
    concept: hbreak-vs-break-selection
    q: You need to set a breakpoint inside a flash memory ROM bootloader or in the
      real-mode reset vector before IDT initialization. Which breakpoint command must
      you use?
    choices:
    - break (standard software breakpoint patching RAM with 0xCC)
    - hbreak (hardware-assisted breakpoint using CPU debug registers)
    - tbreak (temporary breakpoint patching RAM with 0x90 NOP)
    answer: 1
    why: 'Option B is correct: `hbreak` configures hardware debug registers (`DR0`-`DR3`)
      which do not write to RAM or rely on IDT interrupt handling. Option A and C
      modify memory with software opcodes, which fails in ROM and causes faults without
      an IDT.'
  - kind: fillblank
    concept: hardware-breakpoint-command-syntax
    q: The GDB command used to set a hardware-assisted breakpoint is ________.
    code: (gdb) ________ *0x6771
    answer_text: hbreak
    why: The command `hbreak` sets a hardware-assisted breakpoint using the processor's
      debug registers.
  - kind: order
    concept: software-breakpoint-trigger-sequence
    q: Order the 4 steps of a software breakpoint execution cycle; all displayed lines
      are used.
    lines:
    - GDB saves original instruction byte and writes opcode 0xCC to RAM
    - CPU executes 0xCC and raises interrupt vector 3 (INT 3)
    - Host kernel or hypervisor catches trap and delivers SIGTRAP to GDB
    - GDB restores original instruction byte so developer can inspect or step
    answer_order:
    - 0
    - 1
    - 2
    - 3
    why: First, GDB patches the byte to `0xCC`. Second, the CPU executes `0xCC`. Third,
      the trap is caught and signaled to GDB. Fourth, GDB restores the original byte
      so the instruction can be executed.
- id: b12
  title: 'Kernel Entry Inspection: Halting at main() and Decoding CR0'
  type: algorithm
  explain_md: "### 1. Frame the Problem\nIn operating system development, the most\
    \ critical architectural milestone is the leap from assembly bootstrap into the\
    \ first C function (`main()` in early Linux, or `start_kernel()` in modern Linux).\
    \ \n\nHow do you verify that the CPU successfully transitioned from 16-bit real\
    \ mode into 32-bit protected mode and enabled virtual memory paging? You must\
    \ inspect the silicon control registers (`CR0`, `CR3`) at the very moment execution\
    \ enters C code.\n\n### 2. The Notional Machine\nx86 processors manage architectural\
    \ execution modes through Control Registers:\n\n1. **Control Register 0 (`CR0`)**:\n\
    \   - **Bit 0 (`PE` - Protection Enable)**: `0` = 16-bit Real Mode; `1` = Protected\
    \ Mode (32-bit or 64-bit).\n   - **Bit 1 (`MP` - Monitor Coprocessor)**: Controls\
    \ interaction of `WAIT`/`FWAIT` instructions with math coprocessors.\n   - **Bit\
    \ 4 (`ET` - Extension Type)**: `1` = 80387 math coprocessor present.\n   - **Bit\
    \ 31 (`PG` - Paging Enable)**: `0` = Paging disabled (linear addresses are physical\
    \ addresses); `1` = Paging enabled (memory accesses pass through Page Directory\
    \ & Page Tables).\n\n2. **Control Register 3 (`CR3` - Page Directory Base Register)**:\n\
    \   - Holds the physical base address of the Page Directory (in Linux 0.11, initialized\
    \ to `0x00000000` in `boot/head.s`).\n\n3. **Disassembling at the Entry Point\
    \ (`x/Ni $eip`)**:\n   - Disassembles $N$ instructions starting at `$eip`, exposing\
    \ the compiler-generated function prologue.\n\n### 3. Source-Grounded Walkthrough\n\
    Look at the register state captured at the entry to `main()` in Evidence `E-T1A-07`\
    \ and `A1`:\n```text\nBreakpoint 1, main () at init/main.c:107\n107\t{\t\t\t/*\
    \ The startup routine assumes (well, ...) this */\n#0  main () at init/main.c:107\n\
    eip            0x6771              0x6771 <main>\nesp            0x27f70     \
    \        0x27f70 <user_stack+4080>\neax            0x80000013          -2147483629\n\
    => 0x6771 <main>:\tlea    0x4(%esp),%ecx\n   0x6775 <main+4>:\tand    $0xfffffff0,%esp\n\
    \   0x6778 <main+7>:\tpush   -0x4(%ecx)\n   0x677b <main+10>:\tpush   %ebp\n \
    \  0x677c <main+11>:\tmov    %esp,%ebp\n```\nNow perform the forensic decode of\
    \ register `EAX`:\nNotice `eax = 0x80000013`. Why does `eax` hold this exact value?\n\
    In `boot/head.s`, the assembly startup routine configured `CR0` right before jumping\
    \ to `main`:\n- Bit 31: `0x80000000` (`PG` = Paging Enabled!)\n- Bit 4:  `0x00000010`\
    \ (`ET` = 80387 Coprocessor present)\n- Bit 1:  `0x00000002` (`MP` = Monitor Coprocessor)\n\
    - Bit 0:  `0x00000001` (`PE` = Protected Mode Enabled!)\nAdd them together: `0x80000000\
    \ + 0x10 + 0x2 + 0x1 = 0x80000013`!\nThis value in `EAX` is the smoking gun proving\
    \ that `head.s` initialized paging and protected mode before handing control to\
    \ `main()`.\n\n### 4. The Failure Mode & Boundary\nIf `PG` (bit 31) was not set\
    \ in `CR0`, any memory access above physical memory limits would fail to translate\
    \ through page tables. Conversely, if you attempt to inspect memory at virtual\
    \ address `0x6771` when page tables are improperly configured, the CPU will trigger\
    \ a Page Fault (`#PF`, vector 14).\n\n### 5. The Compressed Mental Axiom\n*When\
    \ eax equals 0x80000013, the CPU has graduated: real mode is dead, paging is alive,\
    \ and main() is in command.*"
  viz:
    kind: ascii-memory
    caption: CR0 Register Bit Breakdown and Stack State at main() Entry
    steps:
