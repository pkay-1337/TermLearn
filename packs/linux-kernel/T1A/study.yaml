- id: b4
  title: 'Userspace Debug Cycle: State Inspection and Stepwise Verification'
  type: algorithm
  explain_md: "### 1. Frame the Problem\nDebugging is not random poking; it is a systematic\
    \ scientific method. When code produces wrong results, developers often print\
    \ everything or guess lines. The professional debugging cycle establishes an invariant\
    \ before an instruction, steps across the mutation, and verifies that the silicon\
    \ altered state according to specification.\n\n### 2. The Notional Machine\nThe\
    \ Stepwise Verification Cycle consists of five deliberate stages:\n\n```text\n\
    +---------------------------------------------------------------+\n| 1. Formulate\
    \ Hypothesis: Line X should mutate var from A to B |\n+---------------------------------------------------------------+\n\
    \                               │\n                               ▼\n+---------------------------------------------------------------+\n\
    | 2. Breakpoint on Doorstep: Halt on Line X BEFORE execution    |\n+---------------------------------------------------------------+\n\
    \                               │\n                               ▼\n+---------------------------------------------------------------+\n\
    | 3. Pre-condition Check: info locals / print var (state is A)  |\n+---------------------------------------------------------------+\n\
    \                               │\n                               ▼\n+---------------------------------------------------------------+\n\
    | 4. Controlled Mutation: Execute next to advance one statement |\n+---------------------------------------------------------------+\n\
    \                               │\n                               ▼\n+---------------------------------------------------------------+\n\
    | 5. Post-condition Check: print var (verify state changed to B)|\n+---------------------------------------------------------------+\n\
    ```\n\n### 3. Source-Grounded Walkthrough\nLet us trace Evidence `E-T1A-03` line-by-line\
    \ in `debugme.c`:\n```c\nstatic int socket_probe(int fd)\n{\n    int doubled =\
    \ fd * 2;\n    printf(\"probe fd=%d doubled=%d\\n\", fd, doubled);\n    return\
    \ doubled;\n}\n```\nNow look at the exact transcript from GDB:\n```text\n(gdb)\
    \ break socket_probe\n(gdb) run\nBreakpoint 1, socket_probe (fd=7) at debugme.c:5\n\
    5\t    int doubled = fd * 2;\n(gdb) print fd\n$1 = 7\n(gdb) print doubled\n$2\
    \ = 0\n(gdb) next\n6\t    printf(\"probe fd=%d doubled=%d\\n\", fd, doubled);\n\
    (gdb) print doubled\n$3 = 14\n```\nObserve the crucial truth:\n1. When GDB halted\
    \ at line 5, the CPU was paused on the *doorstep* of the statement. The assignment\
    \ `int doubled = fd * 2;` had **not** happened yet!\n2. `print doubled` returned\
    \ `0` (or whatever uninitialized stack slot held).\n3. Only after typing `next`\
    \ did the arithmetic and store execute.\n4. On line 6, `print doubled` confirmed\
    \ the new value: `$3 = 14`.\n\n### 4. The Failure Mode & Boundary\nThe most common\
    \ beginner trap is reading variable values before their assignment statement has\
    \ executed. In C, local variables allocated on the stack are not guaranteed to\
    \ be zero; reading them before initialization yields uninitialized stack stack\
    \ garbage. If you halt on line 5 and assume `doubled` holds its computed value,\
    \ your diagnosis will be completely false.\n\n### 5. The Compressed Mental Axiom\n\
    *A breakpoint pauses on the doorstep of a line before its statement alters CPU\
    \ state.*"
  viz:
    kind: ascii-memory
    caption: Stack Frame State Before and After Assignment
    steps:
    - '[Step 1: Paused on Doorstep of Line 5] · Regs: rip=0x1144, rdi=7 · State: 0x7fffffffe010
      (fd): 0x00000007 | 0x7fffffffe014 (doubled): 0x00000000 [uninitialized garbage]
      · (Breakpoint stops before the multiplication and store instructions execute)'
    - '[Step 2: Executed next - Arrived at Line 6] · Regs: rip=0x1150, rax=14 · State:
      0x7fffffffe010 (fd): 0x00000007 | 0x7fffffffe014 (doubled): 0x0000000e [14 computed
      & stored] · (Line 5 store completed: doubled now contains verified value 14)'
  example:
    lang: c
    code: "#include <stdio.h>\n\nint main(void)\n{\n    int x = 10;\n    int y = x\
      \ + 5;\n    printf(\"x=%d y=%d\\n\", x, y);\n    return 0;\n}"
    run_expected: 'x=10 y=15

      '
    explain_md: Pausing on int y = x + 5 halts before y is assigned; executing next
      completes the addition and updates stack memory.
  checks:
  - kind: predict
    concept: pre-execution-variable-state
    q: 'In Evidence E-T1A-03, GDB halts on line 5: `int doubled = fd * 2;`. What value
      does `print doubled` return at that exact moment before issuing `next`?'
    choices:
    - 0 (or uninitialized stack slot value before assignment)
    - 14 (the fully computed multiplication result)
    - 7 (the value of the input parameter fd)
    answer: 0
    why: 'Option A is correct: the breakpoint pauses before line 5 executes, so `doubled`
      has not yet received the result of `fd * 2`. Option B is incorrect because the
      assignment has not run yet. Option C is incorrect because `fd` is stored in
      a separate stack location.'
  - kind: spot-bug
    concept: premature-variable-inspection-bug
    q: Examine the code and diagnostic session. Why did the developer conclude the
      return value was wrong?
    code: int status = check_hardware();
    diagnostic_log: '(gdb) break main

      Breakpoint 1, main () at app.c:8

      8   int status = check_hardware();

      (gdb) print status

      $1 = -1'
    choices:
    - The status variable was allocated in CPU registers that GDB is forbidden from
      reading
    - The breakpoint halted before check_hardware() was called, so status contained
      uninitialized stack garbage
    - GDB cannot inspect return values unless the program is compiled with -O3 optimization
    answer: 1
    why: 'Option B is correct: breakpoints halt on the doorstep of the statement before
      the function call or assignment takes place. Option A is incorrect because GDB
      can read registers. Option C is incorrect because `-O3` makes inspection harder,
      not easier.'
  - kind: why-fails
    concept: info-locals-scope-limitation
    q: While halted inside `socket_probe()`, you run `info locals` expecting to see
      the variable `result` defined in `main()`. Why does GDB not display `result`?
    choices:
    - The variable result was converted into an unreadable pointer by the linker
    - Local variables in main() are deleted from memory as soon as any helper function
      is called
    - info locals only displays variables belonging to the currently active stack
      frame (#0)
    answer: 2
    why: 'Option C is correct: `info locals` displays variables in the current stack
      frame. To see `result` in `main()`, you must switch context using `frame 1`.
      Option B is incorrect because `main`''s frame remains intact on the stack. Option
      A is incorrect because linkers do not alter local variable types.'
  - kind: mcq
    concept: single-step-mutation-trace
    q: 'In Evidence E-T1A-03, what are the observed values of local variable `doubled`:
      1) halted at line 5 before assignment; 2) stepped to line 6 after assignment?'
    choices:
    - 'Before step: 0; After step: 14'
    - 'Before step: 14; After step: 14'
    - 'Before step: 7; After step: 0'
    answer: 0
    why: 'Option A is correct: as verified in Evidence E-T1A-03, `doubled` was 0 before
      line 5 ran, and 14 after `next` advanced past the computation. Options B and
      C do not reflect the pre- and post-execution state.'
  - kind: fillblank
    concept: locals-inspection-command
    q: What GDB command prints all local variables defined within the current stack
      frame?
    code: (gdb) info ________
    answer_text: locals
    why: The command `info locals` prints the names and current values of all local
      variables in the active frame.
  - kind: choose-better
    concept: batch-mode-vs-interactive
    q: You need to verify an automated test hypothesis across 100 automated builds
      without manual terminal typing. Which approach is better?
    choices:
    - Launch an interactive GDB session and manually type commands into stdin
    - Run GDB in batch mode using flags -q -batch and scriptable -ex commands
    - Add sleep(10) calls into the C source code and attach via top
    answer: 1
    why: 'Option B is correct: `gdb -q -batch -ex "..."` runs commands deterministically
      and exits with a reliable status code, perfect for automated test pipelines.
      Option A is manual and unscalable. Option C pollutes the source code and does
      not automate debugging.'
- id: b5
  title: 'Register and ABI Conventions: x86_64 vs 32-Bit Calling Standard'
  type: model
  explain_md: "### 1. Frame the Problem\nIn high-level C, you write `socket_probe(fd)`.\
    \ But silicon chips have no concept of C variables or function signatures; they\
    \ only have hardware registers and memory buses. How does the caller pass `fd`\
    \ to the callee? Where does the callee place its return value? And which registers\
    \ is a function allowed to overwrite without corrupting the caller?\n\nThe answers\
    \ are governed by the Application Binary Interface (ABI). If you misunderstand\
    \ the ABI, disassembly will look like arbitrary register soup.\n\n### 2. The Notional\
    \ Machine\nLet us contrast the standard 64-bit Linux ABI with the historical 32-bit\
    \ Linux 0.11 convention:\n\n1. **System V AMD64 ABI (Modern 64-bit Linux)**:\n\
    \   - **First 6 Integer/Pointer Arguments**: Passed directly in CPU registers!\n\
    \     - 1st: `RDI`\n     - 2nd: `RSI`\n     - 3rd: `RDX`\n     - 4th: `RCX`\n\
    \     - 5th: `R8`\n     - 6th: `R9`\n     - (Arguments beyond 6 are pushed onto\
    \ the stack).\n   - **Return Value**: Returned in `RAX` (and `RDX` for 128-bit\
    \ values).\n   - **Caller-Saved (Scratch / Volatile)**: `RAX`, `RCX`, `RDX`, `RSI`,\
    \ `RDI`, `R8`, `R9`, `R10`, `R11`. A function may overwrite these freely without\
    \ saving them.\n   - **Callee-Saved (Non-Volatile / Preserved)**: `RBX`, `RBP`,\
    \ `R12`, `R13`, `R14`, `R15`. If a function uses these, it **must** push them\
    \ to the stack and restore them before returning.\n   - **Stack Alignment Invariant**:\
    \ The stack pointer `RSP` **must** be 16-byte aligned (`RSP % 16 == 0`) immediately\
    \ before a `call` instruction executes.\n\n2. **i386 cdecl ABI (32-Bit Linux 0.11)**:\n\
    \   - All arguments are pushed onto the stack in reverse (right-to-left) order.\n\
    \   - Return value in `EAX`.\n   - General-purpose registers: `EAX`, `EBX`, `ECX`,\
    \ `EDX`, `ESI`, `EDI`, `EBP`, `ESP`, `EIP`.\n\n### 3. Source-Grounded Walkthrough\n\
    Look at the evidence across both architectures:\n\nIn 64-bit userspace (`E-T1A-03`):\n\
    When `main()` called `socket_probe(fd)` where `fd = 7`, GCC loaded `7` into `rdi`\
    \ (or its 32-bit slice `edi`). Inside `socket_probe`, the multiplication `fd *\
    \ 2` used `edi`, and returned the result `14` in `eax`.\n\nNow look at the 32-bit\
    \ kernel startup in Evidence `E-T1A-07` and `A1`:\n```text\neip            0x6771\
    \              0x6771 <main>\nesp            0x27f70             0x27f70 <user_stack+4080>\n\
    eax            0x80000013          -2147483629\n=> 0x6771 <main>:\tlea    0x4(%esp),%ecx\n\
    \   0x6775 <main+4>:\tand    $0xfffffff0,%esp\n   0x6778 <main+7>:\tpush   -0x4(%ecx)\n\
    \   0x677b <main+10>:\tpush   %ebp\n   0x677c <main+11>:\tmov    %esp,%ebp\n```\n\
    Look closely at `main`'s prologue in 32-bit Linux:\n- `and $0xfffffff0,%esp` aligns\
    \ the stack pointer to a 16-byte boundary.\n- `push %ebp; mov %esp,%ebp` establishes\
    \ the standard base pointer frame!\n\n### 4. The Failure Mode & Boundary\nIn 64-bit\
    \ Linux, if you invoke a library function like `printf` with an unaligned stack\
    \ (e.g. `RSP % 16 != 0`), the program will crash with `SIGSEGV` inside libc! This\
    \ happens because modern vector instructions (like `movaps`) require 16-byte aligned\
    \ memory addresses; an unaligned stack violates hardware requirements.\n\n###\
    \ 5. The Compressed Mental Axiom\n*Registers are the CPU's scratchpad: DI, SI,\
    \ DX, CX, 8, 9 carry your arguments, AX brings back the answer.*"
  diagram:
    kind: art
    caption: x86_64 Calling Convention Register Assignment Map
    art: '+-----------------------------------------------------------------------+

      |                       x86_64 SYSTEM V ABI REGISTER ROLES              |

      +-------------------+---------------------------------------------------+

      | Register          | Primary Architectural Role                        |

      +-------------------+---------------------------------------------------+

      | RDI               | 1st function argument (pointer or integer)        |

      | RSI               | 2nd function argument                             |

      | RDX               | 3rd function argument                             |

      | RCX               | 4th function argument                             |

      | R8                | 5th function argument                             |

      | R9                | 6th function argument                             |

      | RAX               | Function return value / scratch                   |

      | RSP               | Stack pointer (must be 16-byte aligned at call)   |

      | RBP               | Base frame pointer (callee-saved)                 |

      | RBX, R12-R15      | Callee-saved registers (must restore before ret)  |

      | RIP               | Instruction Pointer (Program Counter)             |

      +-------------------+---------------------------------------------------+'
  viz:
    kind: ascii-memory
    caption: x86_64 Calling Convention Register Assignment
    steps:
    - '[Step 1: Caller Loads Arguments into Registers] · Regs: rdi=0x00000007 (arg1
      fd), rsi=0x00000002 (arg2), rsp=0x7fffffffe000 · State: Stack RSP[0..7]: [16-byte
      aligned boundary before call] | RAX: 0x00000000 [scratch] · (Caller populates
      RDI and RSI directly without touching stack memory)'
    - '[Step 2: Callee Finishes and Places Return in RAX] · Regs: rax=0x0000000e (ret
      14), rsp=0x7fffffffe000 · State: Stack RSP[0..7]: [Stack frame unwound] | RDI:
      0x00000007 [caller-saved clobbered] · (Function return value 14 passed back
      to caller in RAX)'
  example:
    lang: c
    code: "#include <stdio.h>\n\nint add_four(int a, int b, int c, int d)\n{\n   \
      \ return a + b + c + d;\n}\n\nint main(void)\n{\n    int total = add_four(1,\
      \ 2, 3, 4);\n    printf(\"total=%d\\n\", total);\n    return 0;\n}"
    run_expected: 'total=10

      '
    explain_md: In x86_64 assembly, arguments 1, 2, 3, 4 are passed in RDI, RSI, RDX,
      and RCX respectively, and the sum 10 is returned in RAX.
  checks:
  - kind: choose-better
    concept: first-argument-register-x86_64
    q: Under the System V AMD64 ABI used in 64-bit Linux, which CPU register receives
      the first integer or pointer argument passed to a function?
    choices:
    - RDX
    - RAX
    - RDI
    answer: 2
    why: 'Option C is correct: RDI holds the first integer or pointer argument. Option
      B is incorrect because RAX holds the function return value. Option A is incorrect
      because RDX holds the third argument.'
  - kind: predict
    concept: return-value-register
    q: A 64-bit C function `int compute(int x)` finishes execution and returns the
      integer `42`. In which register does GDB observe `42` upon returning to the
      caller?
    choices:
    - RAX (or EAX)
    - RDI (or EDI)
    - RSP (or ESP)
    answer: 0
    why: 'Option A is correct: integer return values are returned in RAX (or its 32-bit
      low register EAX). Option B is incorrect because RDI is used for the first input
      argument. Option C is incorrect because RSP is the stack pointer.'
  - kind: why-fails
    concept: unaligned-stack-sse-crash
    q: An assembly routine jumps to `printf` on x86_64 without aligning `RSP` to a
      16-byte boundary. Why does the program immediately crash with SIGSEGV inside
      libc?
    choices:
    - The kernel terminates processes whose stack pointer holds any address ending
      in an odd number
    - printf executes SSE vector instructions that fault if stack memory is not 16-byte
      aligned
    - GDB inserts hardware breakpoints that reject unaligned stack pointer modifications
    answer: 1
    why: 'Option B is correct: the AMD64 ABI mandates that `RSP` must be 16-byte aligned
      before `call`. Libc implementations use vector instructions like `movaps` which
      fault on unaligned addresses. Option A is incorrect because the CPU MMU does
      not enforce this at the syscall level. Option C is incorrect because GDB does
      not crash programs for alignment.'
  - kind: order
    concept: argument-register-order
    q: Order the first 4 registers used for passing integer arguments in the 64-bit
      Linux ABI; all displayed lines are used.
    lines:
    - RDI (1st argument)
    - RSI (2nd argument)
    - RDX (3rd argument)
    - RCX (4th argument)
    answer_order:
    - 0
    - 1
    - 2
    - 3
    why: The System V AMD64 ABI order for the first 4 integer/pointer arguments is
      strictly `RDI`, `RSI`, `RDX`, and `RCX`.
  - kind: fillblank
    concept: stack-pointer-register-name
    q: In x86_64 machine architecture, the register that holds the current top-of-stack
      address is ________.
    code: 'Register: %________'
    answer_text: rsp
    why: The 64-bit stack pointer register is named `rsp` (extended from 32-bit `esp`
      and 16-bit `sp`).
  - kind: choose-better
    concept: callee-saved-register-preservation
    q: You are writing an assembly function that needs to use register `RBX`. What
      must your function do to satisfy the ABI contract?
    choices:
    - Zero out RBX using xor before returning so that the caller does not read stale
      data
    - Freely overwrite RBX without saving it, because RBX is designated as a volatile
      scratch register
    - Push RBX to the stack at entry and pop it back before returning, because RBX
      is callee-saved
    answer: 2
    why: 'Option C is correct: RBX is a callee-saved register under the System V ABI;
      any function modifying it must preserve its value across the call. Option B
      is incorrect because RBX is not a scratch register. Option A is incorrect because
      zeroing it clobbers the caller''s value.'
- id: b6
  title: 'Data Watchpoints: Hardware Registers and Mutation Triggers'
  type: syntax
  explain_md: "### 1. Frame the Problem\nBreakpoints stop execution when the instruction\
    \ pointer reaches a known line of code. But what do you do when a variable's value\
    \ changes unexpectedly, and you have no idea which thread, function, or rogue\
    \ pointer wrote to it?\n\nSearching for all assignments statically will fail if\
    \ the write occurs through an aliased pointer, buffer overflow, or dynamic callback.\
    \ You need a mechanism that halts the CPU the exact instant a specific memory\
    \ address is modified.\n\n### 2. The Notional Machine\nGDB provides data watchpoints\
    \ backed by dedicated silicon hardware:\n\n1. **Watchpoint Types**:\n   - `watch\
    \ <expr>`: Breaks when the value of the expression is **written / modified**.\n\
    \   - `rwatch <expr>`: Breaks when the memory address is **read**.\n   - `awatch\
    \ <expr>`: Breaks when the address is **accessed** (read or written).\n\n2. **Silicon\
    \ Hardware Mechanism (x86 Debug Registers)**:\n   - x86 CPUs feature dedicated\
    \ hardware debug registers: `DR0`, `DR1`, `DR2`, and `DR3` hold linear memory\
    \ addresses.\n   - Control register `DR7` enables monitoring for 1, 2, 4, or 8-byte\
    \ write or read/write cycles.\n   - When the CPU bus executes a memory cycle matching\
    \ a `DR` register, the silicon raises a Debug Exception (`#DB`, interrupt vector\
    \ 1).\n   - Execution halts *before or immediately after* the guilty store instruction,\
    \ without running any software single-stepping!\n\n### 3. Source-Grounded Walkthrough\n\
    Examine Evidence `E-T1A-04`:\n```text\n(gdb) break main\n(gdb) run\nBreakpoint\
    \ 1, main () at debugme.c:12\n12\t    int fd = 7;\n(gdb) watch fd\nHardware watchpoint\
    \ 2: fd\n(gdb) continue\nContinuing.\n\nHardware watchpoint 2: fd\n\nOld value\
    \ = 0\nNew value = 7\nmain () at debugme.c:13\n13\t    int result = socket_probe(fd);\n\
    ```\nLook at what GDB reported:\n- `Hardware watchpoint 2: fd`: GDB successfully\
    \ programmed one of the CPU's hardware debug registers (`DR0`-`DR3`).\n- When\
    \ line 12 wrote `7` into `fd`, the CPU hardware triggered.\n- GDB reported the\
    \ exact mutation: `Old value = 0, New value = 7`.\n- When `main()` exited, GDB\
    \ cleaned up:\n```text\nWatchpoint 2 deleted because the program has left the\
    \ block in which its expression is valid.\n```\n\n### 4. The Failure Mode & Boundary\n\
    Hardware debug registers are extremely scarce: x86 processors provide only **four**\
    \ hardware breakpoints/watchpoints (`DR0`-`DR3`). If you set five hardware watchpoints\
    \ simultaneously, GDB cannot use hardware registers for the fifth watchpoint.\
    \ It falls back to **software watchpoints**: GDB single-steps the program one\
    \ machine instruction at a time, reading memory after every single instruction\
    \ to check if the value changed. This causes a devastating 1000x execution slowdown!\n\
    \n### 5. The Compressed Mental Axiom\n*Breakpoints trap execution paths; watchpoints\
    \ trap data mutations.*"
  diagram:
    kind: flow
    caption: Hardware Watchpoint Silicon Detection Cycle
    nodes:
    - id: watch_cmd
      label: 'GDB command: watch fd'
      shape: round
    - id: dr_reg
      label: CPU Debug Register DR0
      shape: box
    - id: exec
      label: Normal CPU Execution (Full Speed)
      shape: box
    - id: write
      label: Store Instruction writes to fd
      shape: box
    - id: cmp
      label: Hardware Address Comparator
      shape: decision
    - id: trap
      label: Debug Exception (#DB Vector 1)
      shape: decision
    - id: gdb
      label: 'GDB reports: Old = 0, New = 7'
      shape: io
    edges:
    - from: watch_cmd
      to: dr_reg
      label: programs linear address
    - from: dr_reg
      to: exec
      label: armed in silicon
    - from: exec
      to: write
      label: reaches assignment
    - from: write
      to: cmp
      label: memory bus cycle
    - from: cmp
      to: trap
      label: address match detected
    - from: trap
      to: gdb
      label: halts execution instantly
    steps:
    - focus:
      - watch_cmd
      - dr_reg
      note: GDB programs the variable address into CPU register DR0
    - focus:
      - exec
      - write
      - cmp
      note: CPU runs at native silicon speed until store matches comparator
    - focus:
      - cmp
      - trap
      - gdb
      note: 'Silicon raises #DB exception exposing previous and new values'
  example:
    lang: c
    code: "#include <stdio.h>\n\nint main(void)\n{\n    volatile int status = 1;\n\
      \    status = 99;\n    printf(\"status=%d\\n\", status);\n    return 0;\n}"
    run_expected: 'status=99

      '
    explain_md: Setting watch status in GDB triggers a hardware watchpoint when status
      changes from 1 to 99, reporting old and new values.
  checks:
  - kind: choose-better
    concept: hardware-watchpoint-registers
    q: What dedicated CPU hardware facility allows x86 processors to trigger watchpoints
      on memory writes without slowing down normal execution?
    choices:
    - Hardware debug registers DR0 through DR3
    - The Model Specific Register MSR_WATCH_ADDR
    - Floating point control register FPU_STATUS
    answer: 0
    why: 'Option A is correct: x86 CPUs provide four hardware debug registers (DR0-DR3)
      that compare memory addresses on the bus during instruction execution. Option
      B is incorrect because watchpoints are handled by DR registers, not an MSR.
      Option C is incorrect because FPU registers handle floating-point arithmetic.'
  - kind: predict
    concept: watchpoint-scope-lifetime
    q: In Evidence E-T1A-04, what does GDB do when a watched local variable `fd` leaves
      its defining block in `main()`?
    choices:
    - Triggers an infinite loop because stack memory was unmapped by the kernel
    - Automatically deletes the watchpoint because its expression is no longer valid
    - Converts the watchpoint into a permanent global watchpoint at address 0x0
    answer: 1
    why: 'Option B is correct: when the function exits and the stack frame is popped,
      GDB automatically deletes the watchpoint because the local variable expression
      has left scope. Option A is incorrect because GDB does not enter a loop. Option
      C is incorrect because local watchpoints are deleted, not converted.'
  - kind: why-fails
    concept: software-watchpoint-slowdown
    q: A developer sets 6 concurrent watchpoints on different variables in GDB. Suddenly,
      the application runs hundreds of times slower. Why did this performance cliff
      occur?
    choices:
    - The GDB TCP socket buffer overflowed, requiring network packet retransmission
    - The Linux kernel limits each process to exactly two hardware interrupts per
      second
    - x86 hardware only has 4 debug registers; the 5th and 6th watchpoints forced
      GDB into slow software single-stepping
    answer: 2
    why: 'Option C is correct: x86 CPUs only have 4 hardware debug registers (DR0-DR3).
      Exceeding this limit forces GDB to use software watchpoints, single-stepping
      every instruction and checking memory, which degrades performance by 1000x.
      Options B and C are incorrect.'
  - kind: choose-better
    concept: watchpoint-vs-breakpoint-choice
    q: A global configuration struct `g_config.mode` is intermittently getting overwritten
      with zero, but there are 45 different functions that touch `g_config`. Which
      diagnostic tool locates the culprit most efficiently?
    choices:
    - Set a hardware watchpoint using `watch g_config.mode`
    - Set 45 individual software breakpoints on every function touching g_config
    - Add an infinite loop at the start of main() and attach via top
    answer: 0
    why: 'Option A is correct: `watch g_config.mode` arms a hardware register that
      halts execution on the exact instruction performing the write, regardless of
      which of the 45 functions executed it. Option B requires immense manual overhead.
      Option C does not locate the mutation.'
  - kind: fillblank
    concept: read-watchpoint-command
    q: What GDB command sets a watchpoint that triggers only when an expression is
      read, but not when it is written?
    code: (gdb) ________ <expr>
    answer_text: rwatch
    why: The command `rwatch` (read watchpoint) stops execution when the target memory
      location is read by any CPU instruction.
  - kind: order
    concept: watchpoint-firing-lifecycle
    q: Order the 4 stages from setting a hardware watchpoint to inspecting the guilty
      instruction; all displayed lines are used.
    lines:
    - Execute watch <variable> in GDB to arm a CPU debug register
    - Resume execution at native hardware speed using continue
    - 'Memory store instruction triggers hardware Debug Exception #DB'
    - GDB halts and displays the old value, new value, and source line
    answer_order:
    - 0
    - 1
    - 2
    - 3
    why: First, arm the register with `watch`. Second, resume execution with `continue`.
      Third, the store instruction triggers `#DB`. Fourth, GDB prints the mutation
      details.
- id: b7
  title: 'Memory Corruption Detection: Trapping Stray Writes and Buffer Spills'
  type: algorithm
  explain_md: "### 1. Frame the Problem\nOne of the most insidious bugs in systems\
    \ C is memory corruption. An off-by-one loop in a string buffer or an unvalidated\
    \ array index silently overruns its allocated boundary. The program does not crash\
    \ immediately. Instead, an adjacent variable—perhaps a status code, function pointer,\
    \ or device ID—mysteriously flips value thousands of cycles later.\n\nTracing\
    \ this bug backwards with static search is nearly impossible because the offending\
    \ code never references the corrupted variable by name.\n\n### 2. The Notional\
    \ Machine\nForensic memory trapping operates by anchoring the hardware to the\
    \ *victim* rather than guessing the *attacker*:\n\n```text\n+-----------------------------------------------------------------+\n\
    | 1. Identify the Victim: Field dev->status is getting corrupted  |\n+-----------------------------------------------------------------+\n\
    \                                │\n                                ▼\n+-----------------------------------------------------------------+\n\
    | 2. Anchor Silicon: watch dev->status (or watch *0xaddr)         |\n+-----------------------------------------------------------------+\n\
    \                                │\n                                ▼\n+-----------------------------------------------------------------+\n\
    | 3. Unfettered Execution: continue runs at native hardware speed |\n+-----------------------------------------------------------------+\n\
    \                                │\n                                ▼\n+-----------------------------------------------------------------+\n\
    | 4. Hardware Trap: Offending store trips DR comparator           |\n+-----------------------------------------------------------------+\n\
    \                                │\n                                ▼\n+-----------------------------------------------------------------+\n\
    | 5. Forensic Attribution: bt reveals guilty function and line    |\n+-----------------------------------------------------------------+\n\
    ```\n\n### 3. Source-Grounded Walkthrough\nImagine a struct where an array sits\
    \ directly before a status integer:\n```c\nstruct device_state {\n    char name[8];\n\
    \    int status;\n};\n```\nSuppose a buggy routine writes a 10-byte string into\
    \ `dev.name`. Bytes 0–7 fill `name`, but bytes 8–9 spill directly into the memory\
    \ bytes of `status`!\n\nHere is how you catch it in GDB:\n1. Halt before the corruption\
    \ occurs:\n   ```text\n   (gdb) break init_device\n   (gdb) run\n   ```\n2. Arm\
    \ the hardware watchpoint on the victim:\n   ```text\n   (gdb) watch dev.status\n\
    \   Hardware watchpoint 2: dev.status\n   ```\n3. Resume execution:\n   ```text\n\
    \   (gdb) continue\n   ```\n4. The instant the loop writes byte 8, the CPU hardware\
    \ raises `#DB`. GDB intercepts it and halts:\n   ```text\n   Hardware watchpoint\
    \ 2: dev.status\n   Old value = 1\n   New value = 0x61616161\n   string_copy (src=0x...,\
    \ dst=0x555555558018) at utils.c:42\n   42\t    *dst++ = *src++;\n   ```\n5. You\
    \ type `bt`. The stack trace reveals that `parse_device_name` called `string_copy`\
    \ with an oversized payload. You found the exact guilty line without guessing!\n\
    \n### 4. The Failure Mode & Boundary\nIf you watch a variable by pointer expression\
    \ like `watch dev->status`, and the pointer `dev` itself is reassigned to point\
    \ to another memory buffer, GDB evaluates the *expression* `dev->status`. If you\
    \ want to watch the specific physical address forever regardless of pointer reassignment,\
    \ watch the memory address directly:\n```text\n(gdb) watch *0x555555558018\n```\n\
    \n### 5. The Compressed Mental Axiom\n*When memory corrupts in the dark, aim a\
    \ hardware watchpoint at the victim address.*"
  viz:
    kind: ascii-memory
    caption: Buffer Overflow Memory Spill Trapped by Hardware Watchpoint
    steps:
    - '[Step 1: Normal In-Bounds Allocation] · Regs: rip=0x1120, rdi=0x6020 · State:
      0x6020-0x6027 (name[0..7]): ''s'',''e'',''n'',''s'',''o'',''r'',''\0'',''\0''
      | 0x6028-0x602b (status): 0x00000001 [valid state] · (Hardware watchpoint armed
      at address 0x6028 on status field)'
    - '[Step 2: Buffer Overrun Spills Across Boundary] · Regs: rip=0x1188, rax=0x61616161
      · State: 0x6020-0x6027 (name[0..7]): ''s'',''e'',''n'',''s'',''o'',''r'',''_'',''1''
      | 0x6028-0x602b (status): 0x61616161 [CORRUPTED BY SPILL] · (Hardware debug
      register trips immediately on the store instruction at 0x1188)'
  example:
    lang: c
    code: "#include <stdio.h>\n#include <string.h>\n\nstruct record {\n    char tag[4];\n\
      \    int code;\n};\n\nint main(void)\n{\n    struct record r = {\"ok\", 100};\n\
      \    /* Bug: writing 5 bytes into a 4-byte buffer spills into code */\n    memcpy(r.tag,\
      \ \"overflow\", 5);\n    printf(\"code=%d\\n\", r.code);\n    return 0;\n}"
    run_expected: 'code=1869771877

      '
    explain_md: Writing past the bounds of tag spills into code; setting watch r.code
      halts execution directly on the memcpy invocation.
  checks:
  - kind: spot-bug
    concept: buffer-spillover-diagnosis
    q: Examine the following code and diagnostic session. What caused GDB to trigger
      a hardware watchpoint on `n.id`?
    code: 'struct node { char key[4]; int id; };

      struct node n = {"abc", 1};

      strcpy(n.key, "long_key_string");'
    diagnostic_log: 'Hardware watchpoint 2: n.id

      Old value = 1

      New value = 1735289202

      0x00007ffff7d8911e in strcpy () from /usr/lib/libc.so.6'
    choices:
    - The id field was freed from the heap by the standard C memory allocator
    - strcpy wrote past the 4-byte boundary of key, overwriting the memory address
      of id
    - GDB detected that the key string was not formatted in UTF-8 encoding
    answer: 1
    why: 'Option B is correct: `key` is only 4 bytes, so copying `long_key_string`
      overruns the buffer into adjacent memory occupied by `id`, triggering the watchpoint
      on `n.id`. Option A is incorrect because `n` is allocated on the stack. Option
      C is incorrect because character encoding does not cause watchpoints to fire.'
  - kind: predict
    concept: watchpoint-backtrace-utility
    q: When a hardware watchpoint triggers on memory corruption, what does executing
      `backtrace` immediately reveal?
    choices:
    - The machine code instructions of the BIOS interrupt vector table
    - A listing of all disk files opened by the process since startup
    - The exact function call chain and source line responsible for performing the
      illicit memory write
    answer: 2
    why: 'Option C is correct: because the CPU halted at the exact store instruction,
      `backtrace` captures the live call stack leading directly to the offending write
      statement. Options B and C are incorrect.'
  - kind: why-fails
    concept: watching-pointer-expression-trap
    q: You execute `watch dev->status` in GDB. Later, the function reassigns `dev
      = NULL`. GDB errors with `Cannot access memory at address 0x4`. Why did this
      happen?
    choices:
    - GDB re-evaluates the expression dev->status; when dev became NULL, dereferencing
      offset 4 faulted
    - The hardware debug registers DR0-DR3 were erased by the operating system kernel
    - GDB is forbidden from watching variables when pointer variables are involved
    answer: 0
    why: 'Option A is correct: `watch dev->status` watches the logical expression.
      When `dev` changes to `NULL`, GDB attempts to evaluate `(NULL)->status` at offset
      4, which fails. To avoid this, watch the address directly with `watch *0x<addr>`.
      Options B and C are incorrect.'
  - kind: mcq
    concept: memory-corruption-address-trace
    q: Struct `record { char tag[4]; int code; }` is at `0x1000`. `tag` is at `0x1000-0x1003`
      and `code` at `0x1004-0x1007`. A loop writes 6 bytes starting at `0x1000`. Which
      bytes of `code` are corrupted?
    choices:
    - None, because the compiler automatically prevents struct overruns
    - Bytes 0x1004 and 0x1005 (the lowest two bytes of code)
    - All 4 bytes of code plus the caller's return address at 0x1008
    answer: 1
    why: 'Option B is correct: the 6-byte write fills bytes 0x1000, 0x1001, 0x1002,
      0x1003 (tag), and spills into bytes 0x1004 and 0x1005 of `code`. Option A is
      incorrect because C does not bounds-check struct arrays. Option C is incorrect
      because only 6 bytes were written.'
  - kind: fillblank
    concept: watch-memory-address-syntax
    q: To set a hardware watchpoint directly on 4 bytes of memory at explicit hexadecimal
      address `0x601080`, you execute `watch ________`.
    code: (gdb) watch *________
    answer_text: '0x601080'
    why: The syntax `watch *0x601080` tells GDB to treat `0x601080` as a pointer and
      watch the memory value at that target address.
  - kind: choose-better
    concept: watchpoint-vs-printf-for-corruption
    q: A memory corruption bug occurs sporadically once every 50,000 loop iterations.
      Which strategy finds the corrupting instruction with the least developer effort?
    choices:
    - Recompile the binary without optimization and visually scan the assembly listing
    - Insert 50,000 printf statements logging memory addresses into a 10GB text file
    - Set a hardware watchpoint on the corrupted address and run with continue
    answer: 2
    why: 'Option C is correct: the hardware watchpoint runs at native silicon speed
      until the single faulty iteration writes to the address, halting instantly at
      the source line. Option B generates massive I/O overhead and log pollution.
      Option A cannot identify runtime corruption.'
- id: b8
  title: 'QEMU Virtualization Boundary: Host Process vs Guest Silicon'
  type: model
  explain_md: "### 1. Frame the Problem\nDeveloping operating system kernels on physical\
    \ bare metal is brutally slow: compile, flash to a USB drive, reboot the physical\
    \ machine, watch it hang on a black screen with no output, and start over. \n\n\
    Virtualization transforms this workflow. But to debug effectively, you must understand\
    \ the virtualization boundary: what is the host operating system, what is QEMU,\
    \ and what is the guest kernel?\n\n### 2. The Notional Machine\nThe virtualization\
    \ boundary divides the world into three distinct execution contexts:\n\n```text\n\
    +-------------------------------------------------------------------------+\n\
    | HOST OPERATING SYSTEM (Linux x86_64 Host)                               |\n\
    |                                                                         |\n\
    |  $ qemu-system-i386 ...                                                 |\n\
    |  PID 151534: Ordinary userspace process running under host Linux kernel |\n\
    |                                                                         |\n\
    |  +-------------------------------------------------------------------+  |\n\
    |  | QEMU PROCESS INTERIOR (Virtual Silicon Emulator)                  |  |\n\
    |  |                                                                   |  |\n\
    |  |  • Guest Physical RAM: 16MB allocated via mmap/malloc in host RAM |  |\n\
    |  |  • Virtual CPU (vCPU): Software loop emulating 80386/x86 registers|  |\n\
    |  |  • Peripheral Devices: Emulated floppy disk, IDE drive, 8259 PIC  |  |\n\
    |  |  • GDB RSP Server: Listening on host TCP port 1234                |  |\n\
    |  |                                                                   |  |\n\
    |  |  +-------------------------------------------------------------+  |  |\n\
    |  |  | GUEST OPERATING SYSTEM (Linux 0.11)                         |  |  |\n\
    |  |  |  • Believes it owns physical hardware at address 0x00000000 |  |  |\n\
    |  |  |  • Configures GDT, IDT, and paging tables in virtual RAM    |  |  |\n\
    |  |  |  • Completely unaware it is executing inside a host buffer  |  |  |\n\
    |  |  +-------------------------------------------------------------+  |  |\n\
    |  +-------------------------------------------------------------------+  |\n\
    +-------------------------------------------------------------------------+\n\
    ```\n\n### 3. Source-Grounded Walkthrough\nLook at Evidence `E-T1A-07` and `A1`:\n\
    ```text\n$ qemu-system-i386 -m 16M -boot a -fda Image -hda hdc-0.11.img -s -S\
    \ -display none &\n```\nTrace what happens on your host machine:\n1. Host Linux\
    \ launches `qemu-system-i386` as an unprivileged userspace process (PID 151534\
    \ in Evidence `A1`).\n2. QEMU allocates a 16MB memory buffer (`-m 16M`) representing\
    \ Guest Physical Memory.\n3. QEMU opens `Image` and maps it to virtual floppy\
    \ drive `A:`.\n4. QEMU opens TCP port `1234` (`-s`) and halts the vCPU at the\
    \ hardware reset vector `0x0000fff0` (`-S`).\n5. When GDB on the host connects\
    \ to `:1234`, it sends RSP packets over the loopback network interface. QEMU reads\
    \ its internal vCPU state and returns the registers to GDB.\n\n### 4. The Failure\
    \ Mode & Boundary\nThe most common conceptual blunder is confusing **Host Virtual\
    \ Addresses** with **Guest Physical Addresses**. \n\nIf the guest kernel running\
    \ inside QEMU writes to physical address `0x00000000`, that is address zero of\
    \ the *guest's* 16MB simulated RAM! On your host Linux machine, that memory actually\
    \ resides somewhere like `0x7f8a10000000` inside QEMU's heap. You cannot dereference\
    \ guest kernel addresses directly from host tools; you must access them through\
    \ QEMU's GDB stub.\n\n### 5. The Compressed Mental Axiom\n*QEMU is a software\
    \ illusion of silicon; its GDB stub is a stethoscope into the virtual machine.*"
  diagram:
    kind: art
    caption: Three-Tier Virtualization Isolation Model
    art: "+-----------------------------------------------------------------------+\n\
      | HOST LINUX ENVIRONMENT (Ring 3 Userspace & Ring 0 Host Kernel)        |\n\
      |                                                                       |\n\
      |  [GDB Client] <--- TCP :1234 (RSP) ---> [QEMU Process (PID 151534)]   |\n\
      +--------------------------------------------------+--------------------+\n\
      \                                                   |\n                    \
      \                               v\n+-----------------------------------------------------------------------+\n\
      | QEMU EMULATION INTERIOR                                               |\n\
      |                                                                       |\n\
      |  +-----------------------------+     +-----------------------------+  |\n\
      |  | Guest vCPU Register State   |     | Guest Physical RAM (16MB)   |  |\n\
      |  | EIP: 0x6771  ESP: 0x27f70   |     | 0x00000000 - 0x01000000     |  |\n\
      |  | EAX: 0x80000013 (CR0 PG|PE) |     | (Host mmap memory buffer)   |  |\n\
      |  +-----------------------------+     +-----------------------------+  |\n\
      |                                                                       |\n\
      |  +-----------------------------------------------------------------+  |\n\
      |  | GUEST KERNEL EXECUTION CONTEXT (Linux 0.11 bootsect -> main)     |  |\n\
      |  +-----------------------------------------------------------------+  |\n\
      +-----------------------------------------------------------------------+"
  viz:
    kind: ascii-memory
    caption: Host Memory vs Guest Memory Mapping in QEMU
    steps:
    - '[Step 1: QEMU Allocates 16MB Host Buffer for Guest RAM] · Regs: host_pid=151534,
      guest_ram_size=16MB · State: Host Virtual 0x7f8a10000000: Mapped to Guest Physical
      0x00000000 | Host Virtual 0x7f8a11000000: Mapped to Guest Physical 0x01000000
      (16MB limit) · (Host kernel protects host RAM; guest executes inside isolated
      buffer)'
    - '[Step 2: Guest Kernel Configures IDT at Guest Physical 0x0] · Regs: guest_cr3=0x00000000,
      guest_eip=0x00006771 · State: Guest Physical 0x00000000: Page Directory Base
      & IDT vectors | Host Virtual 0x7f8a10000000: [Contains IDT bytes written by
      guest head.s] · (Guest OS believes it owns address zero; host isolates it in
      process memory)'
  example:
    lang: text
    code: '# Launching QEMU with 16MB guest RAM and GDB stub halted at reset vector

      $ qemu-system-i386 -m 16M -boot a -fda Image -hda hdc-0.11.img -s -S -display
      none &

      [1] 151534

      $ ss -tulpn | grep 1234

      tcp  LISTEN 0  1  0.0.0.0:1234  0.0.0.0:*  users:(("qemu-system-i38",pid=151534,fd=12))'
    explain_md: QEMU launches as a normal host userspace process and binds a listening
      TCP socket on port 1234 for GDB Remote Serial Protocol connections.
  checks:
  - kind: choose-better
    concept: qemu-process-nature
    q: From the perspective of your host Linux operating system, what is the running
      `qemu-system-i386` virtual machine?
    choices:
    - An ordinary userspace process executing simulated CPU instructions in software
    - A kernel-space device driver executing with unrestricted Ring 0 host privileges
    - A hardware microcontroller plugged directly into the motherboard PCI bus
    answer: 0
    why: 'Option A is correct: QEMU runs as a standard userspace process in host Linux,
      simulating guest CPU execution and hardware devices. Option B is incorrect because
      QEMU does not run as a host kernel driver. Option C is incorrect because QEMU
      is a software program.'
  - kind: predict
    concept: guest-vs-host-address-space
    q: A guest operating system inside QEMU writes data to physical address `0x10000`.
      Where does this write physically land on the host machine?
    choices:
    - Directly into physical host motherboard RAM address 0x10000, overwriting host
      memory
    - Inside an allocated memory buffer (mmap/malloc) managed by the QEMU host process
    - Onto the swap partition of the host Linux filesystem
    answer: 1
    why: 'Option B is correct: QEMU maps guest physical memory into an allocated buffer
      in its own host virtual address space. Option A is incorrect because guest physical
      addresses are isolated and do not correspond to host physical RAM. Option C
      is incorrect because guest writes go to virtual RAM buffers.'
  - kind: why-fails
    concept: host-tool-guest-dereference-failure
    q: A developer writes a host C program that attempts to inspect the Linux 0.11
      kernel by dereferencing pointer `*(int *)0x6771`. Why does this program crash
      with SIGSEGV?
    choices:
    - QEMU encrypts guest memory so that other processes cannot read it
    - The host Linux kernel forbids reading any memory address smaller than 1 megabyte
    - Address 0x6771 is a guest address inside QEMU, not a valid mapped address in
      the host program's address space
    answer: 2
    why: 'Option C is correct: each host process has its own isolated virtual address
      space; address `0x6771` in the guest lives inside QEMU''s private buffer and
      is unmapped in the independent host program. Options B and C are incorrect.'
  - kind: choose-better
    concept: qemu-vs-bare-metal-tradeoff
    q: You are iterating on early kernel boot code and crash during interrupt vector
      initialization. Why is testing in QEMU superior to testing on physical hardware?
    choices:
    - QEMU can freeze execution at the reset vector and allow register inspection
      without physical reboots
    - QEMU automatically corrects kernel bugs and fixes invalid machine opcodes at
      runtime
    - QEMU runs 10 times faster than bare-metal hardware because it bypasses memory
      caches
    answer: 0
    why: 'Option A is correct: QEMU allows instant reloading, vCPU freezing with `-S`,
      and register inspection over GDB RSP without physical reboots. Option B is incorrect
      because QEMU does not fix bugs. Option C is incorrect because software emulation
      is generally slower than native hardware.'
  - kind: fillblank
    concept: gdb-stub-shorthand-flag
    q: In QEMU CLI grammar, the shorthand flag that enables the GDB Remote Serial
      Protocol server on TCP port 1234 is -________.
    code: qemu-system-i386 -________ -S
    answer_text: s
    why: The lowercase `-s` flag is QEMU shorthand for `-gdb tcp::1234`.
  - kind: mcq
    from_chapter: T0B
    from_block: b1
    concept: static-source-vs-virtual-memory-interleave
    q: In Chapter T0b, we learned that C header declarations allocate zero bytes of
      memory. Where does memory for kernel global variables actually get allocated
      during a QEMU boot session?
    choices:
    - Inside the C source code text file stored on the host filesystem
    - Inside the guest physical memory buffer allocated by QEMU when the kernel image
      is loaded
    - Inside the Git repository object database under .git/objects
    answer: 1
    why: 'Option B is correct: memory for variables exists at runtime in guest physical
      memory allocated by QEMU. Option A is incorrect because source files only hold
      text. Option C is incorrect because Git objects store version-controlled history,
      not live runtime memory.'
- id: b9
  title: 'QEMU Boot CLI Flags: Media, Display, and CPU Freezing'
  type: syntax
  explain_md: "### 1. Frame the Problem\nLaunching a virtual machine by clicking a\
    \ GUI menu is useless for kernel automation and continuous testing. You need precise,\
    \ programmatic control over every simulated component: how much RAM to allocate,\
    \ which floppy or hard disk image to insert, whether to display a graphical window\
    \ or keep output in your terminal, and crucially, whether the virtual CPU should\
    \ freeze at power-on so you can attach a debugger before the first instruction\
    \ executes.\n\n### 2. The Notional Machine\nMastering QEMU's command-line interface\
    \ requires understanding six core flag families:\n\n1. **Debugging & vCPU Control**:\n\
    \   - `-s`: Shorthand for `-gdb tcp::1234`. Opens an RSP server on TCP port 1234.\n\
    \   - `-S`: Freezes the virtual CPU at startup. The machine powers on in reset\
    \ state and does **not** execute any instructions until GDB sends `continue`.\n\
    \n2. **Memory & Architecture**:\n   - `-m <size>`: Sets the guest physical RAM\
    \ size (e.g. `-m 16M` for 16 megabytes or `-m 4G` for 4 gigabytes).\n\n3. **Storage\
    \ & Boot Media**:\n   - `-boot <order>`: Boot sequence (e.g. `-boot a` boots from\
    \ floppy first; `-boot c` boots from hard drive).\n   - `-fda <file>`: Attaches\
    \ a raw disk image file to virtual Floppy Drive A.\n   - `-hda <file>`: Attaches\
    \ a raw disk image file to Master IDE Hard Drive A.\n\n4. **Display & Console\
    \ Redirection**:\n   - `-display none`: Disables graphical window creation completely;\
    \ essential for headless scripts and automated tests.\n   - `-nographic`: Disables\
    \ graphical video and redirects the emulated serial port directly to your terminal's\
    \ standard input and output.\n\n5. **Direct Kernel Boot (Modern Linux)**:\n  \
    \ - `-kernel <bzImage>`: Loads an uncompressed kernel image directly into guest\
    \ memory, bypassing the floppy/BIOS bootloader.\n   - `-append \"<cmdline>\"`:\
    \ Passes kernel boot command-line arguments (e.g. `-append \"console=ttyS0 root=/dev/sda1\"\
    `).\n   - `-initrd <file>`: Loads an initial RAM disk image.\n\n### 3. Source-Grounded\
    \ Walkthrough\nLook at the exact QEMU invocation from Evidence `E-T1A-07` and\
    \ `A1`:\n```text\n$ qemu-system-i386 -m 16M -boot a -fda Image -hda hdc-0.11.img\
    \ -s -S -display none &\n```\nDeconstruct every single flag:\n- `qemu-system-i386`:\
    \ Launches the 32-bit x86 virtual machine emulator.\n- `-m 16M`: Allocates exactly\
    \ 16 megabytes of guest RAM (matching original 1991 PC hardware).\n- `-boot a`:\
    \ Instructs the simulated BIOS to boot from floppy drive A.\n- `-fda Image`: Loads\
    \ the 0.11 bootable floppy disk image containing `bootsect.s`, `setup.s`, and\
    \ `system`.\n- `-hda hdc-0.11.img`: Attaches the root filesystem hard disk image.\n\
    - `-s`: Binds the GDB RSP server to `0.0.0.0:1234`.\n- `-S`: Holds the virtual\
    \ CPU frozen at the 80386 reset vector (`0x0000fff0`).\n- `-display none`: Runs\
    \ completely headlessly in the background.\n\n### 4. The Failure Mode & Boundary\n\
    The most catastrophic omission is forgetting the uppercase `-S` flag:\nIf you\
    \ run `qemu-system-i386 ... -s` without `-S`, QEMU unfreezes the vCPU the exact\
    \ millisecond the process launches. Within 50 milliseconds, the kernel has finished\
    \ booting or crashed into a halt loop. When you finally start GDB and type `target\
    \ remote :1234`, you have missed the entire boot sequence!\n\n### 5. The Compressed\
    \ Mental Axiom\n*-s opens the door on port 1234; -S holds the elevator so you\
    \ can get in before it leaves.*"
  diagram:
    kind: flow
    caption: 'QEMU Startup Lifecycle: With -S vs Without -S'
    nodes:
    - id: qemu_cmd
