  example:
    lang: text
    code: "# Disassembling the first 4 instructions of Linux 0.11 main()\n(gdb) x/4i\
      \ $eip\n=> 0x6771 <main>:\tlea    0x4(%esp),%ecx\n   0x6775 <main+4>:\tand \
