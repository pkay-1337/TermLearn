<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Extreme C — Chapter 09: Memory Ownership & Pointers</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="study-container">
    <!-- Header with Breadcrumb and Progress Pills -->
    <header class="study-header">
      <div class="top-bar">
        <div class="brand-badge">
          <span class="pill">termlearn web</span>
          <span>Extreme C</span>
        </div>
        <span class="chapter-title">Ch 09: Memory Ownership</span>
      </div>

      <!-- 5-Stage Micro-Step Progress Bar -->
      <nav class="progress-track" aria-label="Lesson Progress">
        <div class="progress-step active" data-step="0" title="Step 1: Intuitive Puzzle"></div>
        <div class="progress-step" data-step="1" title="Step 2: Pattern Induction"></div>
        <div class="progress-step" data-step="2" title="Step 3: Productive Failure"></div>
        <div class="progress-step" data-step="3" title="Step 4: Subgoal Naming"></div>
        <div class="progress-step" data-step="4" title="Step 5: Formal Abbreviation"></div>
      </nav>
    </header>

    <!-- Main Dynamic Step Card Container -->
    <main id="card-viewport">
      <!-- Step cards are rendered and activated dynamically via app.js -->
    </main>

    <!-- Navigation Action Bar -->
    <footer class="action-bar">
      <button id="btn-prev" class="btn btn-secondary" disabled>← Previous</button>
      <button id="btn-next" class="btn btn-primary">Check & Next →</button>
    </footer>
  </div>

  <script src="app.js"></script>
</body>
</html>
